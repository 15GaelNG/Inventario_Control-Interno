# Sube a Apps Script sin correr comandos (tools/subir/subir.js: comprime, sube y verifica).
#
# - push a una rama de tools/subir/destinos.json ("ramas") → pruebas y, si pasan, a su DEV.
# - Producción: solo a mano, con el botón "Run workflow" (pestaña Actions) sobre master:
#     · desplegar                → sube y mueve los dos links a la versión nueva (CLAUDE.md: "dos links")
#     · revisar sin desplegar    → sube al /dev de prod y revisa el entorno; el equipo no ve nada
#     · regresar a una versión   → los dos links vuelven a una versión que ya existe, sin subir código
#
# La app de producción corre con la cuenta de quien mueve los despliegues (executeAs:
# USER_DEPLOYING): aquí siempre es la del secreto CLASPRC_JSON, que tiene que ser `cuentaProd` de
# destinos.json (subir.js lo revisa). Ver docs/subir-automatico.md.
#
# Seguridad (guía de GitHub, "Security hardening for GitHub Actions"):
# - el GITHUB_TOKEN solo lee el repo (permissions);
# - las acciones van fijas a un commit (SHA), no a una etiqueta que se puede mover; Dependabot
#   (.github/dependabot.yml) propone las actualizaciones;
# - lo que escribe la persona (descripción, versión) llega por env, nunca pegado en el script;
# - las credenciales de clasp se borran al terminar, pase lo que pase.

name: Subir a Apps Script

on:
  push:
    branches: [ayrton]
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer en producción'
        type: choice
        options:
          - desplegar
          - revisar sin desplegar
          - regresar a una versión
        default: desplegar
      descripcion:
        description: 'Para desplegar: qué cambia (va en la versión)'
        required: false
      version:
        description: 'Para regresar: número de versión (p. ej. 65)'
        required: false

permissions:
  contents: read

# Dos subidas al mismo destino nunca se pisan: la segunda espera a que termine la primera.
# Todo lo de producción comparte un solo turno, venga de la rama que venga.
concurrency:
  group: subir-${{ github.event_name == 'workflow_dispatch' && 'produccion' || github.ref_name }}
  cancel-in-progress: false

jobs:
  probar:
    name: Pruebas
    if: github.event_name == 'push' || inputs.accion != 'regresar a una versión'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  dev:
    name: Subir a su DEV
    needs: probar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Credenciales de clasp
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      - run: node tools/subir/subir.js rama
      - name: Borrar credenciales
        if: always()
        run: rm -f ~/.clasprc.json

  produccion:
    name: Producción (${{ inputs.accion }})
    needs: probar
    # Con "regresar" no hay pruebas (no se sube código): corre si se saltaron, nunca si fallaron
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (needs.probar.result == 'success' || (needs.probar.result == 'skipped' && inputs.accion == 'regresar a una versión'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Con required reviewers en Settings → Environments → produccion, espera a que alguien apruebe
    environment:
      name: produccion
      url: https://script.google.com/a/macros/ciudadmaderas.com/s/AKfycbx_53Gz2VfBXhFvLmjnoM2qVzJYmk9kuQD74mUCpOQzeYPaQ1COR8LB_l69sSQb5RJB/exec
    env:
      ACCION: ${{ inputs.accion }}
      DESCRIPCION: ${{ inputs.descripcion }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Revisar lo que se pidió
        run: |
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "::error::A producción solo se sube desde master (se eligió $GITHUB_REF_NAME)."; exit 1
          fi
          case "$ACCION" in
            desplegar)
              [ -n "$DESCRIPCION" ] || { echo "::error::Para desplegar escribe qué cambia."; exit 1; } ;;
            "regresar a una versión")
              [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "::error::Para regresar escribe el número de versión (p. ej. 65)."; exit 1; } ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Credenciales de clasp
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      - name: Cuenta con la que va a correr la app
        run: npx clasp show-authorized-user
      - name: Desplegar
        if: inputs.accion == 'desplegar'
        run: node tools/subir/subir.js prod --desplegar "$DESCRIPCION ($(git rev-parse --short HEAD))"
      - name: Revisar sin desplegar
        if: inputs.accion == 'revisar sin desplegar'
        run: node tools/subir/subir.js prod
      - name: Regresar a la versión ${{ inputs.version }}
        if: inputs.accion == 'regresar a una versión'
        run: node tools/subir/subir.js prod --regresar "$VERSION"
      - name: Borrar credenciales
        if: always()
        run: rm -f ~/.clasprc.json
