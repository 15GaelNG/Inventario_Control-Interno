<script>
  /**
   * app-vehiculos.html — Vehículos: los campos del formulario (CAMPOS_VEHICULO y sus ayudantes, que usan también Arqueos, Caja
   * Chica, Panorama y Reasignaciones), las ayudas de firma de responsiva y adherente, la pantalla (initVehiculos: lista,
   * ficha, captura, responsiva y adherente) y su tour y ayuda.
   * Era parte de app.html (fase 6.1, tools/app/partir.js). Comparte el espacio global: usa los ayudantes de app.html,
   * que carga antes (Index.html lo incluye justo después de app; los que vienen después ya lo ven).
   */

   * Las 40 columnas reales de la hoja VEHICULOS (todo menos ID_VEHICULO),

   * (VehiculosService.crear/actualizar ya esperan las claves reales).
   */
  // La sección "Accesorios y sensor" es de Instalación de Sensores: se ve en la ficha, pero solo la
  // edita quien tiene EDICIÓN ahí (CamposHoja editaModulo; el servidor revisa lo mismo,
  // VehiculosService.COLUMNAS_DE_SENSORES)

    { grupo: 'Vehículo', clave: 'MARCA', etiqueta: 'Marca', tipo: 'select', catalogo: true },
    {
      grupo: 'Vehículo', clave: 'CLASE', etiqueta: 'Clase', tipo: 'select',
      opciones: ['AUTOMOVIL', 'CAMION', 'CAMIONETA', 'MOTOCICLETA', 'REMOLQUE', 'MAQUINARIA MENOR', 'CUATRIMOTO', 'NUCO SIN INFORMACION', 'MOTOCARRO'],

    { grupo: 'Vehículo', clave: 'LINEA VEHICULO', etiqueta: 'Línea', tipo: 'text' },
    { grupo: 'Vehículo', clave: 'MODELO', etiqueta: 'Año', tipo: 'number' },
    { grupo: 'Vehículo', clave: 'COLOR', etiqueta: 'Color', tipo: 'text' },
    {
      // catalogo: true — antes era un <select> cerrado a solo estas 2

    {
      grupo: 'Vehículo', clave: 'TIPO DE COMBUSTIBLE', etiqueta: 'Tipo de combustible', tipo: 'select',

    { grupo: 'Vehículo', clave: 'CAPACIDAD COMBUSTIBLE (LTS)', etiqueta: 'Capacidad de combustible (L)', tipo: 'number' },
    {
      grupo: 'Vehículo', clave: 'ESTATUS', etiqueta: 'Estatus', tipo: 'select',
      opciones: ['BAJA VEHICULAR', 'PRESTAMO', 'UTILITARIO', 'NO UTILITARIO', 'NUCO SIN INFORMACION', 'FUERA DE SERVICIO'],

    {
      grupo: 'Identificación', clave: 'FOLIO', etiqueta: 'Folio', tipo: 'text',
      soloLectura: true, placeholder: 'Se genera solo, según la Clase',
    },
    {
      // catalogo: true — sugerencias de Capital Humano (apiListarColaboradores). Va antes que

      grupo: 'Identificación', clave: 'RESPONSABLE VEHICULO', etiqueta: 'Responsable del vehículo', tipo: 'select', catalogo: true,
    },
    { grupo: 'Identificación', clave: 'DEPARTAMENTO', etiqueta: 'Departamento', tipo: 'select', catalogo: true, autoCondicional: true },
    { grupo: 'Identificación', clave: 'NO EMPLEADO', etiqueta: 'No. de empleado', tipo: 'text', autoCondicional: true },
    { grupo: 'Identificación', clave: 'SERIE VEHICULO', etiqueta: 'Serie del vehículo', tipo: 'text' },
    {
      grupo: 'Identificación', clave: 'NUCCO', etiqueta: 'Nucco', tipo: 'text',
      soloLectura: true, placeholder: 'Se genera solo (consecutivo)',

    { grupo: 'Documentación y seguro', clave: 'TARJETA CIRCULACION', etiqueta: 'Tarjeta de circulación', tipo: 'file' },
    { grupo: 'Documentación y seguro', clave: 'ALTA PLACAS', etiqueta: 'Alta de placas', tipo: 'file' },
    { grupo: 'Documentación y seguro', clave: 'RESPONSIVA', etiqueta: 'Responsiva', tipo: 'file' },
    { grupo: 'Documentación y seguro', clave: 'DOCUMENTO BAJA', etiqueta: 'Documento de baja', tipo: 'file', soloEdicion: true },

      opciones: ['VERIFICADO', 'VENCIDO', 'NO APLICA'],
    },

        'Agosto - Septiembre (Terminación 7 y 8)', 'Septiembre - Octubre (Terminación 3 y 4)',
        'Octubre - Noviembre (Terminación 1 y 2)', 'Noviembre - Diciembre (Terminación 9 y 0)',
      ],
    },
    {

      opciones: ['VIGENTE', 'VENCIDO', 'NO APLICA'],
    },
    { grupo: 'Documentación y seguro', clave: 'FECHA VENCIMIENTO SEGURO', etiqueta: 'Fecha de vencimiento del seguro', tipo: 'date' },
    { grupo: 'Documentación y seguro', clave: 'POLIZA SEGURO', etiqueta: 'Póliza de seguro', tipo: 'file' },
    {

    { grupo: 'Documentación y seguro', clave: 'ARCHIVO TENENCIA', etiqueta: 'Archivo de tenencia', tipo: 'file' },

    { grupo: 'Accesorios y sensor', clave: 'ACCESORIOS', etiqueta: 'Accesorios', tipo: 'text', vacioEnFicha: 'Sin accesorios registrados', ...DE_SENSORES },

    // SENSOR y SERIE SENSOR los manda Instalación de Sensores (Relaciones.gs): se ven aquí

    {
      grupo: 'Accesorios y sensor', clave: 'SENSOR', etiqueta: 'Sensor', tipo: 'text',
      soloLectura: true, placeholder: 'Lo pone Instalación de Sensores',
    },
    { grupo: 'Accesorios y sensor', clave: 'SERIE SENSOR', etiqueta: 'Serie del sensor', tipo: 'text',

    { grupo: 'Accesorios y sensor', clave: 'ACTIVADOR', etiqueta: 'Activador', tipo: 'text', ...DE_SENSORES },
    { grupo: 'Accesorios y sensor', clave: '$ Costo del Sensor', etiqueta: 'Costo del sensor', tipo: 'number', moneda: true, ...DE_SENSORES },
    {
      grupo: 'Accesorios y sensor', clave: 'LLAVE DUPLICADA', etiqueta: 'Llave duplicada', tipo: 'select',
      opciones: ['SI', 'NO'], ...DE_SENSORES,

    { grupo: 'Ubicación y registro', clave: 'SEDE', etiqueta: 'Sede', tipo: 'select', catalogo: true },
    // La columna se llamaba UBICACION; se homologó al nombre que usa el resto de la base
    // (limpieza #23). La etiqueta para la gente sigue siendo "Ubicación".
    { grupo: 'Ubicación y registro', clave: 'OFICINA / DESARROLLO', etiqueta: 'Ubicación', tipo: 'select', catalogo: true },
    { grupo: 'Ubicación y registro', clave: 'RAZON SOCIAL', etiqueta: 'Razón social', tipo: 'select', catalogo: true },
    { grupo: 'Ubicación y registro', clave: 'FECHA COMPRA', etiqueta: 'Fecha de compra', tipo: 'date' },
    {
      grupo: 'Ubicación y registro', clave: 'FECHA REGISTRO SISTEMA CI', etiqueta: 'Fecha de registro en el sistema', tipo: 'date',
      soloLectura: true, placeholder: 'Se pone sola, la fecha de hoy',
    },
    { grupo: 'Ubicación y registro', clave: 'RESPONSABLE CI', etiqueta: 'Responsable (Control Interno)', tipo: 'text' },
  ];

  // "Un tema a la vez" (usuario, 6-oct): mismo lenguaje visual que los pasos de
  // Responsiva/Adherente Vehicular (form-pasos/form-paso-chip/form-paso/
  // form-acciones-pasos, de componentes/formulario.html) -- un paso por cada grupo que
  // ya tenía CAMPOS_VEHICULO, en su mismo orden, así que la ficha de solo lectura
  // (seccionesFichaVehiculo, que usa esos mismos grupos) no cambia. Sin candado entre
  // pasos (igual que Responsiva/Adherente): se puede ir y venir libremente.
  const VEH_GRUPOS_PASO = ['Vehículo', 'Identificación', 'Documentación y seguro', 'Accesorios y sensor', 'Ubicación y registro'];

  /** Los campos del formulario de vehículo (componente CamposHoja), repartidos en los
   * pasos de VEH_GRUPOS_PASO con el `soloGrupos` que CamposHoja.html ya trae para esto --
   * así el único título que se ve por paso es el que CamposHoja imprime
   * (info-section-title), sin duplicarlo con uno propio. esEdicion=true en Editar muestra
   * los "soloEdicion" (ej. Documento de baja: no tiene sentido pedirlo al DAR DE ALTA).
   * Departamento/No. de empleado (autoCondicional) se sugieren al elegir Responsable, con
   * "auto" (ver wireResponsableVehiculo). `columnas` es el ancho de la rejilla de cada
   * paso (3 en Registrar, 2 en el modal de Editar, que es más angosto). */
  function renderCamposVehiculo(prefijo, esEdicion, columnas) {
    return Pasos.htmlChips(VEH_GRUPOS_PASO.map(escaparHtml)) +
      VEH_GRUPOS_PASO.map((g, i) =>
        '<section class="form-paso" data-paso="' + i + '"' + (i === 0 ? '' : ' hidden') + '>' +
          '<div class="form-rejilla" data-columnas="' + (columnas || 3) + '">' +
            CamposHoja.html(CAMPOS_VEHICULO, { prefijo, esEdicion, soloGrupos: [g] }) +
          '</div>' +
        '</section>').join('');
  }

  /** Cablea Atrás/Siguiente/Guardar y las pastillas de arriba para un formulario de
   * Vehículo ya pintado con renderCamposVehiculo -- lo usan tanto Registrar como Editar,
   * cada uno con su propio contenedor y botones. Regresa { ir } para volver al paso 1
   * después de guardar o cerrar. */
  function wirePasosVehiculo(contenedor, ids) {
    // La navegación es el componente Pasos: libre, sin validar, Guardar en el último
    const nav = Pasos.navegar({
      secciones: Array.from(contenedor.querySelectorAll('.form-paso')),
      chips: Array.from(contenedor.querySelectorAll('.form-paso-chip')),
      atras: document.getElementById(ids.atras), siguiente: document.getElementById(ids.siguiente),
      guardar: document.getElementById(ids.guardar), cuenta: document.getElementById(ids.cuenta),
      libre: true, guardarAlFinal: true,
    });
    nav.ir(0);
    return { ir: nav.ir };
  }

  /** {columna real: valor}. Los "file" se suben aparte (subirArchivosVehiculo). */
  function recolectarDatosVehiculo(prefijo) {
    return CamposHoja.recolectar(CAMPOS_VEHICULO, prefijo);
  }

  // Sede + Ubicación son un par dependiente: Sede se llena desde la
  // columna "SEDE 2" de "LISTAS VEHICULOS" y Ubicación desde "OFICINA /
  // DESARROLLO 2" de la MISMA fila (ej. Sede "AGUASCALIENTES" → Ubicación
  // CDMAGS / AGS COWORKING / AGUASCALIENTES; Sede "CANCUN" → CMCROO /
  // PLAZA AMERICAS). mapaUbicacionesPorSede llega una sola vez desde el
  // servidor como {SEDE 2: [ubicaciones]} (cargarCatalogosVehiculo, dentro
  // de initVehiculos, la llena) y se filtra aquí en el cliente. A nivel de
  // módulo (no dentro de initVehiculos) porque poblarFormularioVehiculo
  // también la necesita y se define antes de que initVehiculos exista.
  let mapaUbicacionesPorSede = {};
  function llenarUbicacionesSegunSede(prefijo) {
    const sedeEl = document.getElementById(prefijo + '-sede');
    const ubicacionDatalist = document.getElementById(prefijo + '-' + slugCampo('OFICINA / DESARROLLO') + '-lista');
    if (!sedeEl || !ubicacionDatalist) return;
    const opciones = mapaUbicacionesPorSede[sedeEl.value] || [];
    ubicacionDatalist.innerHTML = opciones.map((v) => `<option value="${v}"></option>`).join('');
  }

  /** Llena el formulario con un objeto {columna real: valor} (ej. de buscarPorFolio).
   * Ubicación depende de la Sede: SEDE va antes en CAMPOS_VEHICULO, así que al llegar a
   * Ubicación la Sede ya tiene su valor y se repueblan las sugerencias para ESA sede. */
  function poblarFormularioVehiculo(prefijo, datos) {
    CamposHoja.poblar(CAMPOS_VEHICULO, prefijo, datos, {
      antes: { 'OFICINA / DESARROLLO': llenarUbicacionesSegunSede },
    });
  }

  /**
   * Sube (si el usuario eligió) los archivos de los campos tipo "file" del
   * formulario y regresa {columna real: url}. Los campos sin archivo nuevo
   * seleccionado simplemente no aparecen en el resultado — así crear()/
   * actualizar() no les tocan el valor que ya tenían.
   */
  async function subirArchivosVehiculo(prefijo) {
    const resultado = {};
    const camposArchivo = CAMPOS_VEHICULO.filter((c) => c.tipo === 'file');
    for (const campo of camposArchivo) {
      const input = document.getElementById(prefijo + '-' + slugCampo(campo.clave));
      const file = input && input.files && input.files[0];
      if (!file) continue;
      const base64 = await leerArchivoBase64(file);
      const subido = await callServer('apiSubirArchivoVehiculo', state.token, file.name, file.type, base64);
      resultado[campo.clave] = subido.url;
      // No es una columna real: solo viaja para que el servidor pueda renombrar el
      // archivo a "<ID>_<ETIQUETA>_<fecha>" una vez que sabe el ID real del vehículo.
      resultado[campo.clave + '_FILE_ID'] = subido.id;
    }
    return resultado;
  }

  /** Badge "Pendiente de firma"/"Firmado" de Responsiva/Adherente Vehicular, pero diciendo CUÁL
   *  de las dos ligas ya se firmó (TOKEN_FIRMA/TOKEN_FIRMA_JEFE vacío = esa ya se firmó o nunca
   *  se diferió) en vez de solo "Pendiente" -- así no hay que adivinarlo por qué botón de copiar
   *  liga sigue apareciendo en la fila. `principal` es como se le dice al firmante que no es el
   *  jefe (p. ej. "responsable" o "adherente"). */
  function badgeEstadoFirma(r, principal) {
    const pendiente = (r.ESTADO_FIRMA || 'FIRMADO') === 'PENDIENTE';
    if (!pendiente) return '<span class="badge-estado activo">Firmado</span>';
    const faltaPrincipal = !!r.TOKEN_FIRMA;
    const faltaJefe = !!r.TOKEN_FIRMA_JEFE;
    let texto = 'Pendiente';
    if (faltaPrincipal && faltaJefe) texto = 'Pendiente: falta ' + principal + ' y jefe';
    else if (faltaPrincipal) texto = 'Ya firmó el jefe, falta ' + principal;
    else if (faltaJefe) texto = 'Ya firmó ' + (principal === 'adherente' ? 'el adherente' : 'el responsable') + ', falta el jefe';
    return '<span class="badge-estado pendiente">' + escaparHtml(texto) + '</span>';
  }

  /** Badge de Préstamo Vehicular en la pestaña Responsiva: en blanco para una definitiva
   *  (no hay nada que avisar), y para un préstamo dice si sigue en curso (con su fecha), ya
   *  venció (rojo) o ya se devolvió. */
  function badgePrestamo(r) {
    if ((r.TIPO_RESPONSIVA || 'DEFINITIVA') !== 'PRESTAMO') return '—';
    if (r.ESTATUS_PRESTAMO === 'DEVUELTO') return '<span class="badge-estado activo">Préstamo devuelto</span>';
    const vencido = r.FECHA_FIN_PRESTAMO && new Date(r.FECHA_FIN_PRESTAMO) < new Date();
    if (vencido) return '<span class="badge-estado pendiente">Préstamo vencido</span>';
    const fecha = r.FECHA_FIN_PRESTAMO ? ' (vence ' + formatearFecha(r.FECHA_FIN_PRESTAMO) + ')' : '';
    return '<span class="badge-estado activo">En préstamo' + escaparHtml(fecha) + '</span>';
  }

  /** Mismo patrón que copiarEnlace_ en app-sistemas.html: la API moderna primero, y si el
   *  marco de Apps Script la bloquea, el truco clásico del textarea oculto + execCommand. */
  async function copiarTexto_(texto) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(texto); return true; }
    } catch (e) { /* cae al método clásico */ }
    const area = document.createElement('textarea');
    area.value = texto;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(area);
    area.select();
    let copiado = false;
    try { copiado = document.execCommand('copy'); } catch (e) { /* no-op */ }
    area.remove();
    return copiado;
  }

  /** Modal chico con la(s) liga(s) de firma a distancia y un botón para copiar cada una -- se
   *  usa tanto al generarlas (abrirAgregarResponsivaVehicular/AdherenteVehicular, que puede
   *  generar una o dos de un jalón si ni el responsable/adherente ni el jefe estaban
   *  presentes) como al "Copiar liga de nuevo" desde la pestaña (data-ficha-copiar-liga/
   *  -jefe), que siempre manda una sola. Mismo patrón que Confirmar.pedir (.modal-backdrop,
   *  Esc, clic fuera) pero sin promesa -- no hay nada que confirmar.
   *
   *  @param {string|Array<{titulo?:string, liga:string}>} ligas  una liga, o varias con su
   *    etiqueta (p. ej. [{titulo:'Responsable', liga:a}, {titulo:'Jefe directo', liga:b}]).
   */
  function mostrarLigaFirma_(ligas) {
    const lista = Array.isArray(ligas) ? ligas : [{ titulo: null, liga: ligas }];
    const fondo = document.createElement('div');
    fondo.className = 'modal-backdrop';
    const campos = lista.map((item, i) =>
      (item.titulo ? '<label style="margin-top:' + (i ? '12px' : '0') + '">' + escaparHtml(item.titulo) + '</label>' : '') +
      '<div style="display:flex;gap:8px;margin-top:' + (item.titulo ? '6px' : (i ? '12px' : '0')) + '">' +
        '<input type="text" readonly value="' + escaparHtml(item.liga) + '" id="liga-firma-' + i + '" ' +
          'style="flex:1;min-width:0;padding:9px 10px;border:1px solid var(--color-border);border-radius:var(--radio-m);background:var(--color-bg);color:var(--color-text);font-size:var(--texto-s)">' +
        '<button type="button" class="secondary" data-copiar="liga-firma-' + i + '" title="Copiar liga"><i data-lucide="copy" class="ico"></i></button>' +
      '</div>'
    ).join('');
    fondo.innerHTML =
      '<div class="modal-card">' +
        '<h3><i data-lucide="link" class="ico"></i> Liga' + (lista.length > 1 ? 's' : '') + ' para firmar a distancia</h3>' +
        '<p style="margin:4px 0 14px;color:var(--color-text-muted);font-size:var(--texto-s)">' +
          'Mánda' + (lista.length > 1 ? 'selas' : 'sela') + ' a la persona (WhatsApp, correo…) para que la abra y firme desde su celular.</p>' +
        campos +
        '<div class="form-acciones" style="margin-top:14px">' +
          '<button type="button" class="secondary" data-accion="cerrar">Cerrar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(fondo);
    refreshIcons();

    const focoPrevio = document.activeElement;
    const terminar = () => {
      document.removeEventListener('keydown', alTecla, true);
      fondo.remove();
      if (focoPrevio && focoPrevio.focus) focoPrevio.focus();
    };
    const alTecla = (ev) => { if (ev.key === 'Escape') { ev.stopPropagation(); terminar(); } };
    fondo.querySelector('[data-accion="cerrar"]').addEventListener('click', terminar);
    fondo.addEventListener('mousedown', (ev) => { if (ev.target === fondo) terminar(); });
    document.addEventListener('keydown', alTecla, true);
    fondo.querySelectorAll('[data-copiar]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const ok = await copiarTexto_(document.getElementById(btn.dataset.copiar).value);
        if (ok) Notificar.exito('Liga copiada'); else Notificar.error('El navegador no permitió copiar la liga');
      });
    });
  }

  // ---------- Vehículos ----------
  async function initVehiculos() {
    Tabs.iniciar(document.getElementById('view-container'));
    // Permisos del módulo (el servidor los vuelve a revisar en cada llamada)
    const puedeEditar = puedeEditarModulo('vehiculos');
    if (!puedeEditar) document.querySelector('#veh-tabs .tab-btn[data-tab="registrar"]').remove();
    const modalEditar = document.getElementById('modal-editar-vehiculo');
    let vehiculosPorId = {};
    let todosLosVehiculos = [];
    /** La ficha abierta: si su copia guardada llega distinta del servidor, se vuelve a pintar */
    let fichaVehiculoAbierta = null;
    /** Series (normalizadas) con expediente de Adquisición Vehicular ya encontrado en el índice
     *  (apiAdquisicionVehicularLista) -- para la columna "Adquisición" del catálogo, se llena en
     *  cargar(). No es lo mismo que FOLIO ADQUISICION en la ficha (eso solo queda cuando alguien
     *  le dio clic a "Buscar expediente" en ESE vehículo); esto refleja el índice completo. */
    let adquisicionEncontrada = new Set();

    document.getElementById('campos-form-vehiculo').innerHTML = renderCamposVehiculo('veh');
    document.getElementById('campos-form-editar-vehiculo').innerHTML = renderCamposVehiculo('editar-vehiculo', true, 2);
    const pasosAltaVeh = wirePasosVehiculo(document.getElementById('campos-form-vehiculo'), {
      atras: 'veh-paso-atras', siguiente: 'veh-paso-siguiente', guardar: 'btn-guardar-vehiculo', cuenta: 'veh-paso-cuenta',
    });
    const pasosEditarVeh = wirePasosVehiculo(document.getElementById('campos-form-editar-vehiculo'), {
      atras: 'editar-vehiculo-paso-atras', siguiente: 'editar-vehiculo-paso-siguiente', guardar: 'btn-guardar-editar-vehiculo', cuenta: 'editar-vehiculo-paso-cuenta',
    });

    // Fecha de registro en el sistema: siempre "hoy", no se edita (el
    // servidor fija el valor real al crear, esto es solo para que se vea
    // algo ahí — igual que FECHA DE REGISTRO en Tickets). Solo en
    // Registrar: en Editar la pisa poblarFormularioVehiculo con la fecha

    document.getElementById('veh-fecha-registro-sistema-ci').value = hoyISO();

    // Marca / Departamento / Sede / Razón social: catálogos planos (hoja
    // "LISTAS VEHICULOS"), mismas opciones en Registrar y Editar. Estos ya
    // son <input list="..."> (campo.catalogo: true) — se puede escribir una
    // opción nueva que todavía no esté en la lista.
    function llenarSelect(id, valores) { CamposHoja.llenarOpciones(id, valores); }

    // El filtrado de Ubicación según Sede (mapaUbicacionesPorSede,
    // llenarUbicacionesSegunSede) vive a nivel de módulo, junto a
    // poblarFormularioVehiculo — ver comentario ahí.
    ['veh-sede', 'editar-vehiculo-sede'].forEach((id) => {
      // 'input' (no solo 'change'): Sede ahora es un <input list="..."> —
      // 'input' dispara al escribir Y al elegir una sugerencia del
      // datalist, así Ubicación se actualiza al momento en ambos casos.
      document.getElementById(id).addEventListener('input', () => {
        llenarUbicacionesSegunSede(id.replace('-sede', ''));
      });
    });

    // En su propia función (en vez de un await suelto aquí) para poder
    // correrla EN PARALELO con cargar() más abajo — antes se esperaba a que
    // terminaran los 5 catálogos antes de ni siquiera empezar a pedir la
    // lista de vehículos, cuando ninguno depende del otro.
    async function cargarCatalogosVehiculo() {
      try {
        const [marcas, departamentos, sedes, razones, mapaUbicaciones, colaboradores] = await Promise.all([
          callServerCacheado('apiListarMarcas', state.token),
          callServerCacheado('apiListarDepartamentos', state.token),
          callServerCacheado('apiListarSedesVehiculo', state.token),
          callServerCacheado('apiListarRazonesSociales', state.token),
          callServerCacheado('apiListarUbicacionesPorSede', state.token),
          callServerCacheado('apiListarColaboradores', state.token),
        ]);
        ['veh-marca', 'editar-vehiculo-marca'].forEach((id) => llenarSelect(id, marcas));
        ['veh-departamento', 'editar-vehiculo-departamento'].forEach((id) => llenarSelect(id, departamentos));
        ['veh-sede', 'editar-vehiculo-sede'].forEach((id) => llenarSelect(id, sedes));
        ['veh-razon-social', 'editar-vehiculo-razon-social'].forEach((id) => llenarSelect(id, razones));
        mapaUbicacionesPorSede = mapaUbicaciones || {};
        // Al cargar los catálogos ya puede haber una Sede elegida (ej. al
        // reabrir Editar antes de que termine esta llamada) — refresca la
        // Ubicación por si acaso.
        llenarUbicacionesSegunSede('veh');
        llenarUbicacionesSegunSede('editar-vehiculo');
        const nombresColaboradores = Array.from(new Set((colaboradores || []).map((c) => c.NOMBRE)));
        ['veh-responsable-vehiculo', 'editar-vehiculo-responsable-vehiculo'].forEach((id) => llenarSelect(id, nombresColaboradores));
        wireResponsableVehiculo('veh', colaboradores || []);
        wireResponsableVehiculo('editar-vehiculo', colaboradores || []);
      } catch (err) {
        console.error('No se pudieron cargar los catálogos de Marca/Departamento/Sede/Razón social/Ubicación/Colaboradores:', err);
      }
    }

    /** Al elegir (o escribir exacto) un nombre de Capital Humano en "Responsable del
     *  vehículo", sugiere su Departamento y No. de empleado -- no bloquea los campos
     *  (el usuario los puede corregir): si hay más de un colaborador con ese nombre
     *  exacto (recontratación, nombre repetido), se usa el primero que haya en la
     *  lista. Si el nombre no coincide con nadie, no hace nada -- se deja capturar
     *  a mano, como ya era antes de tener este catálogo. */
    function wireResponsableVehiculo(prefijo, colaboradores) {
      const porNombre = {};
      colaboradores.forEach((c) => { if (!porNombre[c.NOMBRE.toUpperCase()]) porNombre[c.NOMBRE.toUpperCase()] = c; });
      const idResponsable = prefijo + '-responsable-vehiculo';
      const input = document.getElementById(idResponsable);
      if (!input || input.dataset.wireado) return; // una sola vez por campo, aunque se recarguen catálogos
      input.dataset.wireado = '1';
      input.addEventListener('input', () => {
        const colaborador = porNombre[input.value.trim().toUpperCase()];
        const depto = document.getElementById(prefijo + '-departamento');
        const noEmpleado = document.getElementById(prefijo + '-no-empleado');
        if (!colaborador) { if (depto) CampoAuto.quitar(depto); if (noEmpleado) CampoAuto.quitar(noEmpleado); return; }
        if (depto && colaborador.DEPARTAMENTO) CampoAuto.llenar(depto, colaborador.DEPARTAMENTO);
        if (noEmpleado && colaborador.NO_EMPLEADO) CampoAuto.llenar(noEmpleado, colaborador.NO_EMPLEADO);
      });
    }

    // Folio: se ve en su campo (deshabilitado, no se puede escribir) desde que

    // queda asignado se recalcula al guardar (por si alguien más registró un

    const campoFolioVeh = document.getElementById('veh-folio');
    document.getElementById('veh-clase').addEventListener('change', async (ev) => {

      }
    });

    // NUCCO: consecutivo simple, no depende de ningún otro campo — se

    async function previsualizarNuccoVeh() {
      try {
        document.getElementById('veh-nucco').value = await callServer('apiPrevisualizarNuccoVehiculo', state.token);
      } catch (err) {
        console.error('No se pudo previsualizar el NUCCO:', err);

    }
    previsualizarNuccoVeh();

    function badgeEstatus(estatus) {

    // Color + ícono por clase, tal cual se veían en AppSheet.
    const CLASE_ESTILO = {
      'AUTOMOVIL': { icono: 'car', color: 'var(--tono-azul)' },
      // var(--color-neutro-fuerte) en vez de un negro fijo: se pierde contra
      // el fondo del modo oscuro si no se adapta con el tema.
      'CAMION': { icono: 'truck', color: 'var(--color-neutro-fuerte)' },
      'CAMIONETA': { icono: 'car-front', color: 'var(--tono-naranja)' },
      'CUATRIMOTO': { icono: 'tractor', color: 'var(--tono-amarillo)' },
      'MOTOCARRO': { icono: 'bike', color: 'var(--tono-morado)' },
      'MOTOCICLETA': { icono: 'bike', color: 'var(--color-neutro-fuerte)' },
      'NUCO SIN INFORMACION': { icono: 'triangle-alert', color: 'var(--tono-rojo)' },
      'REMOLQUE': { icono: 'container', color: 'var(--tono-verde)' },

    };
    function etiquetaClase(clase) {
      if (!clase) return '—';
      const e = CLASE_ESTILO[String(clase).toUpperCase()] || { icono: 'circle', color: 'var(--color-text-muted)' };
      return `<span style="display:inline-flex; align-items:center; gap:5px; color:${e.color}; font-weight:700; font-style:italic">` +
        `${Iconos.svg(e.icono)} ${escaparHtml(clase)}</span>`;

    // Mismo orden que las opciones de CLASE en CAMPOS_VEHICULO; etiquetas legibles para el
    // filtro por Clase (pintarClasesVeh) -- "Nuco sin información" igual que en Panorama.
    const ORDEN_CLASES_VEH = ['AUTOMOVIL', 'CAMION', 'CAMIONETA', 'MOTOCICLETA', 'REMOLQUE', 'MAQUINARIA MENOR', 'CUATRIMOTO', 'NUCO SIN INFORMACION', 'MOTOCARRO'];
    const NOMBRE_CLASE_VEH = {
      'AUTOMOVIL': 'Automóvil', 'CAMION': 'Camión', 'CAMIONETA': 'Camioneta', 'MOTOCICLETA': 'Motocicleta',
      'REMOLQUE': 'Remolque', 'MAQUINARIA MENOR': 'Maquinaria menor', 'CUATRIMOTO': 'Cuatrimoto',
      'NUCO SIN INFORMACION': 'Nuco sin información', 'MOTOCARRO': 'Motocarro',
    };

    /**
     * Ficha de un vehículo: pantalla propia dentro del módulo (oculta la lista,

    function migasVehiculo() {

    /** Las fotos de una inspección (de la app o solo del expediente): Vehículos › NUCO › Inspección */

    const ICONO_GRUPO_VEHICULO = {
      'Vehículo': 'car', 'Identificación': 'id-card', 'Documentación y seguro': 'file-text',
      'Accesorios y sensor': 'radio', 'Ubicación y registro': 'map-pin', 'Otros datos': 'more-horizontal',
    };

    /** Igual que renderCamposVehiculo pero para MOSTRAR (no capturar): mismos grupos y
     *  etiquetas legibles que Registrar/Editar, en vez del volcado plano de antes. Lo que
     *  no está en CAMPOS_VEHICULO (columnas legadas del AppSheet) cae en "Otros datos".
     *  soloGrupos filtra a solo esos grupos (null: todos, más "Otros datos"). */
    /**
     * opciones.reemplazados: campos que ya tienen su fuente nueva (ACCESORIOS → la pestaña Accesorios): vacíos no se
     * muestran (ni con vacioEnFicha) y con texto salen como «(nota anterior)», para no contradecir al dato nuevo.
     */
    function seccionesFichaVehiculo(completo, soloGrupos, extras, opciones) {
      const reemplazados = (opciones && opciones.reemplazados) || [];
      const porGrupo = {};
      const grupos = [];
      const usadas = new Set();
      CAMPOS_VEHICULO.forEach((campo) => {
        usadas.add(campo.clave);
        if (soloGrupos && soloGrupos.indexOf(campo.grupo) === -1) return;
        // Los archivos (factura, póliza, responsiva…) se ven en las pestañas Documentos y Responsiva, no aquí
        if (campo.tipo === 'file') return;
        const valor = completo[campo.clave];
        const vacio = valor === '' || valor === null || valor === undefined;
        // Un campo vacío no se muestra, salvo el que pide decirlo (vacioEnFicha: "Sin accesorios registrados")
        const reemplazado = reemplazados.indexOf(campo.clave) >= 0;
        if (vacio && (!campo.vacioEnFicha || reemplazado)) return;
        if (!porGrupo[campo.grupo]) { porGrupo[campo.grupo] = []; grupos.push(campo.grupo); }
        porGrupo[campo.grupo].push(itemInfo(campo.etiqueta + (reemplazado ? ' (nota anterior)' : ''), vacio
          ? '<span class="info-vacio">' + escaparHtml(campo.vacioEnFicha) + '</span>'
          : (campo.moneda ? formatearMoneda(valor) : valor)));
      });
      if (!soloGrupos || soloGrupos.indexOf('Otros datos') !== -1) {
        const otros = Object.keys(completo)
          .filter((k) => !usadas.has(k) && completo[k] !== '' && completo[k] !== null && completo[k] !== undefined)
          .map((k) => itemInfo(tituloDesdeClave(k), completo[k]));
        if (otros.length) { porGrupo['Otros datos'] = otros; grupos.push('Otros datos'); }
      }

      // Lo que una sección trae además de sus campos (las piezas de la unidad en "Accesorios y sensor")
      Object.keys(extras || {}).forEach((g) => { if (extras[g] && !porGrupo[g]) { porGrupo[g] = []; grupos.push(g); } });
      // En el orden del formulario (una sección que solo trae su extra no se va al final)
      const ordenGrupo = [];
      CAMPOS_VEHICULO.forEach((c) => { if (ordenGrupo.indexOf(c.grupo) < 0) ordenGrupo.push(c.grupo); });
      const posicion = (g) => (ordenGrupo.indexOf(g) < 0 ? ordenGrupo.length : ordenGrupo.indexOf(g));
      grupos.sort((a, b) => posicion(a) - posicion(b));

      // Pestaña Datos: las secciones del formulario de Editar, en su orden. Plegables; en celular solo las dos primeras
      // abiertas para que no sea un scroll eterno. "Documentación y seguro" aquí solo trae los estados.
      const abiertas = Pantalla.esCelular() ? 2 : grupos.length;
      return grupos.map((g, i) => '<details class="card ln-card ficha-seccion"' + (i < abiertas ? ' open' : '') + '><summary><h3>' +
        '<i data-lucide="' + (ICONO_GRUPO_VEHICULO[g] || 'info') + '" class="ico ln-icon"></i> ' + (TITULO_SECCION_FICHA[g] || g) +
        (g === 'Documentación y seguro' ? ' <a href="#" class="ln-enlace ficha-ver-documentos" data-ir-pestana="documentos">Ver documentos</a>' : '') +
        '</h3></summary>' + (porGrupo[g].length ? '<div class="info-grid">' + porGrupo[g].join('') + '</div>' : '') +
        ((extras && extras[g]) || '') + '</details>').join('');
    }

    const TITULO_SECCION_FICHA = { 'Documentación y seguro': 'Seguro, tenencia y verificación' };

    function botonArchivoFicha(tipo, ruta) {
      if (!ruta) return '—';
      // Lo nuevo guarda la liga de Drive (expediente del NUCO): se abre directo; lo viejo es una ruta que resuelve el servidor
      if (/^https?:/i.test(String(ruta))) return TablaFicha.boton({ href: ruta });
      return TablaFicha.boton({ datos: { archivo: tipo, ruta: ruta } });
    }

    // ---------- Captura de verificación/sensor/holograma/incidencia/inspección desde la
    // ficha ----------
    // Mismo "formato de captura" que Líneas Telefónicas (ln-captura-*): un modal con ícono,
    // tipo, título y cuerpo scrollable. El folio ya se sabe (es el de la ficha abierta y
    // queda en el subtítulo del modal), así que aquí no hay paso de "buscar vehículo" como
    // en el formulario propio de cada módulo.
    function abrirCapturaVehiculo(icono, tipo, titulo, subtitulo) {
      document.getElementById('veh-captura-icono').innerHTML = Iconos.svg(icono);
      document.getElementById('veh-captura-tipo').textContent = tipo;
      document.getElementById('veh-captura-titulo').textContent = titulo;
      document.getElementById('veh-captura-subtitulo').textContent = subtitulo || '';
      const cuerpo = document.getElementById('veh-captura-cuerpo');
      cuerpo.innerHTML = '';
      // La insignia "Calificación" solo la usa Inspección -- de las 5 capturas que
      // comparten este modal, es la única con checklist calificable. Se oculta aquí
      // por si la captura anterior fue una inspección; abrirAgregarInspeccion (vía
      // prepararCaptura) la vuelve a destapar.
      document.getElementById('ins-calif-badge').hidden = true;
      document.getElementById('veh-modal-captura').hidden = false;
      refreshIcons();
      return cuerpo;
    }
    function cerrarCapturaVehiculo() {
      document.getElementById('veh-modal-captura').hidden = true;
      document.getElementById('veh-captura-cuerpo').innerHTML = '';
    }

    // ---------- Accesorios de la unidad (AccesoriosVehiculoService, 16-oct-2026) ----------
    // El estado de cada pieza sale de su último movimiento (CARGA INICIAL de la última responsiva de antes del sistema,
    // RESPONSIVA al firmarse una en el sistema, ALTA o BAJA); sin movimientos es "sin dato", no "no tiene". Desde
    // aquí solo se registran altas y bajas.
    // Como todo lo que se registra sobre la unidad, vive en SU pestaña (con los botones en la cabecera); Datos solo
    // dice cuántas tiene y lleva a ella (usuario, 16-oct: un solo lugar predecible para cada cosa).
    const ACC_ESTADO = { SI: { clase: 'acc-si', icono: 'check', texto: 'Tiene' }, NO: { clase: 'acc-no', icono: 'x', texto: 'No tiene' },
      '': { clase: 'acc-sin', icono: 'minus', texto: 'Sin dato' } };
    const ACC_MOVIMIENTO = { 'CARGA INICIAL': 'Carga inicial', RESPONSIVA: 'Según responsiva', ALTA: 'Alta', BAJA: 'Baja' };

    /** En Datos (solo lectura): cuántas piezas tiene y la liga a la pestaña Accesorios */
    function resumenAccesorios(acc) {
      const tiene = (acc.estado || []).filter((p) => p.TIENE === 'SI').length;
      const conDato = (acc.estado || []).some((p) => p.TIENE);
      return '<p class="acc-resumen">' + Iconos.svg('wrench') + ' ' +
        (conDato ? 'Tiene <strong>' + tiene + ' de ' + (acc.estado || []).length + '</strong> piezas' : 'Sin accesorios cargados todavía') +
        ' · <a href="#" class="ln-enlace" data-ir-pestana="accesorios">Ver accesorios</a></p>';
    }

    /** La pestaña Accesorios: las piezas con su estado y la historia; Registrar alta / baja en la cabecera */
    function pestanaAccesorios(acc) {
      const nombreDe = {};
      (acc.catalogo || []).forEach((p) => { nombreDe[p.CLAVE] = p.NOMBRE; });
      const editar = puedeEditarModulo('vehiculos.accesorios');
      const piezas = (acc.estado || []).map((p) => {
        const e = ACC_ESTADO[p.TIENE] || ACC_ESTADO[''];
        return '<div class="acc-pieza ' + e.clase + '" title="' + escaparHtml(e.texto + (p.DESDE ? ' desde ' + formatearFecha(p.DESDE) : '')) + '">' +
          Iconos.svg(e.icono) + '<span class="acc-nombre">' + escaparHtml(p.NOMBRE) + '</span>' +
          (p.DESDE ? '<span class="acc-desde">' + escaparHtml(formatearFecha(p.DESDE)) + '</span>' : '') + '</div>';
      }).join('');
      const botones = editar ? '<span class="acc-botones">' +
        '<button type="button" class="secondary" data-acc-movimiento="ALTA">' + Iconos.svg('plus') + ' Registrar alta</button>' +
        '<button type="button" class="secondary" data-acc-movimiento="BAJA">' + Iconos.svg('minus') + ' Registrar baja</button></span>' : '';
      // La historia, con la misma tabla de solo lectura que las demás pestañas de la ficha
      const historia = tablaFicha([
        { t: 'Fecha', r: (m) => formatearFecha(m.FECHA) },
        { t: 'Movimiento', r: (m) => '<span class="acc-mov acc-mov-' + escaparHtml(String(m.MOVIMIENTO).toLowerCase().replace(/\s+/g, '-')) + '">' +
          escaparHtml(ACC_MOVIMIENTO[m.MOVIMIENTO] || m.MOVIMIENTO) + '</span>' },
        { t: 'Pieza', r: (m) => escaparHtml(nombreDe[m.ACCESORIO] || m.ACCESORIO) },
        { t: 'Motivo', r: (m) => escaparHtml(m.MOTIVO || '—') },
        { t: 'Registró', r: (m) => escaparHtml(m.REGISTRO || '—') },
        { t: 'Documento', r: (m) => (/^https?:/i.test(m.ORIGEN) ? TablaFicha.boton({ href: m.ORIGEN }) : '—') },
      ], acc.historial || []);
      return '<div class="card ln-card"><h3 class="acc-titulo">' + Iconos.svg('wrench') + ' Accesorios' + botones + '</h3>' +
        '<div class="acc-piezas">' + piezas + '</div></div>' +
        '<div class="card ln-card"><h3>' + Iconos.svg('history') + ' Historia</h3>' +
        ((acc.historial || []).length ? historia
          : '<p class="empty-state">Sin movimientos registrados todavía: lo de cada unidad se carga desde su responsiva.</p>') + '</div>';
    }

    /** ALTA (de lo que no tiene o no hay dato) o BAJA (de lo que tiene), con el modal de captura de la ficha */
    function abrirMovimientoAccesorio(vResumen, acc, movimiento) {
      const alta = movimiento === 'ALTA';
      const activas = {};
      (acc.catalogo || []).forEach((p) => { activas[p.CLAVE] = p.ACTIVO; });
      const opciones = (acc.estado || []).filter((p) => (alta ? p.TIENE !== 'SI' && activas[p.CLAVE] : p.TIENE === 'SI'))
        .map((p) => ({ valor: p.CLAVE, etiqueta: p.NOMBRE }));
      if (!opciones.length) {
        Notificar.info(alta ? 'La unidad ya tiene todas las piezas del catálogo.' : 'La unidad no tiene piezas registradas que dar de baja.');
        return;
      }
      const cuerpo = abrirCapturaVehiculo(alta ? 'plus' : 'minus', 'ACCESORIOS', alta ? 'Registrar alta de una pieza' : 'Registrar baja de una pieza',
        'Nucco ' + (vResumen.NUCCO || '') + ' · ' + (vResumen.FOLIO || ''));
      Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'ACCESORIO', etiqueta: 'Pieza', tipo: 'lista', opciones: opciones, requerido: true },
          { id: 'FECHA', etiqueta: alta ? 'Desde cuándo la tiene' : 'Desde cuándo no la tiene', tipo: 'fecha', requerido: true, valor: hoyLocal() },
          { id: 'MOTIVO', etiqueta: 'Motivo', tipo: 'parrafo', requerido: !alta,
            ayuda: alta ? 'Opcional: compra, reposición, se encontró…' : 'Extravío, robo, daño, se retiró…' },
        ],
        alValidar: (v) => (v.FECHA && v.FECHA > hoyLocal() ? { FECHA: 'No puede ser una fecha futura' } : null),
        textoGuardar: alta ? 'Registrar alta' : 'Registrar baja', iconoGuardar: 'save',
        alGuardar: async (valores) => {
          const r = await callServer('apiRegistrarAccesorioVehiculo', state.token, Object.assign({ ID_VEHICULO: vResumen.ID_VEHICULO, MOVIMIENTO: movimiento }, valores));
          if (r && r.aviso) Notificar.info(r.aviso);
        },
        textoExito: () => (alta ? 'Alta registrada' : 'Baja registrada'),
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'accesorios'); },
      });
    }

      cuerpo.innerHTML = '';
      // RAZON SOCIAL del vehículo es la empresa DUEÑA de la unidad; la del holograma es

      CAMPOS_RESPONSIVA_VEHICULAR.filter((c) => c.mostrarSiCampo).forEach((campo) => {

      });
      CamposHoja.actualizarVisibles(CAMPOS_RESPONSIVA_VEHICULAR, 'resv');

      // Navegación de pasos: libre en los dos sentidos, sin validar (el usuario pidió
      // "un tema a la vez" nada más, no bloquear el avance si falta algo).
      // (el componente Pasos; "Enviar liga(s)" sale junto con Guardar, en el último)
      Pasos.navegar({
        secciones: Array.from(cuerpo.querySelectorAll('.form-paso')), chips: Array.from(cuerpo.querySelectorAll('.form-paso-chip')),
        atras: document.getElementById('resv-atras'), siguiente: document.getElementById('resv-siguiente'),
        guardar: document.getElementById('resv-captura-guardar'), cuenta: document.getElementById('resv-cuenta'),

      // "No. de inventario" es el Nucco del vehículo (así lo usa este formato) -- se autollena

      if (vResumen.NUCCO) CampoAuto.llenar(document.getElementById('resv-no-de-inventario'), vResumen.NUCCO);
      // Responsable (y lo que de él depende) se deja en blanco a propósito: esta responsiva
      // puede ser para una persona distinta a la que el vehículo tiene hoy, y precargar al
      // actual invitaba a dejarlo sin cambiar por descuido. "Quien entrega" sí es un dato
      // que el sistema ya sabe -- quien tiene la sesión abierta -- así que ese sí se autollena
      // (se puede corregir si lo firma otra persona).
      if (state.sesion && state.sesion.nombre) CampoAuto.llenar(document.getElementById('resv-nombre-ci'), state.sesion.nombre);

      const campoNombreCi = document.getElementById('resv-nombre-ci');
      function aplicarFirmaAutomatica() {
        const firmaCi = firmas['FIRMA CI'];
        if (!firmaCi || !firmaCi.vacia()) return;
        const lista = typeof FIRMAS_AUTOMATICAS !== 'undefined' ? FIRMAS_AUTOMATICAS : {};
        const guardada = lista[campoNombreCi.value.trim().toUpperCase()];
        if (guardada) firmaCi.cargarFoto(guardada.base64, guardada.mimeType);

        // Responsable/Departamento/etc.), cruzando por correo -- USUARIOS.NOMBRE (puesto

        const correoSesion = String((state.sesion && state.sesion.correo) || '').trim().toLowerCase();

      /** modo='presencial': de siempre (exige la firma del responsable, genera el PDF de una
       *  vez). modo='remotoJefe': "Enviar liga(s) para firmar a distancia" -- no exige la
       *  firma del responsable: si ya se dibujó, se captura ahora (como siempre); si no, se
       *  difiere igual (le genera SU liga también, aparte de la del jefe, que siempre se
       *  difiere con este botón) -- nadie tiene que estar presente para generar cualquiera de
       *  las dos. Si al final hay dos ligas, se muestran juntas. Un solo botón para los dos
       *  casos (antes había uno aparte solo para el responsable): usuario, 8-oct. */
      async function guardarResponsiva_(modo, boton) {
        const errorBox = document.getElementById('resv-captura-error');
        errorBox.hidden = true;

        // Quien entrega SIEMPRE firma al capturar (presencial o a distancia): es quien está
        // armando este renglón ahora mismo, nunca hay "después" para su firma. Es la única
        // firma obligatoria en los dos modos -- la del responsable solo en 'presencial'.
        if (modo === 'presencial' && firmas['FIRMA RESPONSABLE'].vacia()) {
          errorBox.textContent = 'Falta la firma del responsable';
          errorBox.hidden = false;
          cuerpo.querySelector('[data-firma="FIRMA RESPONSABLE"]').scrollIntoView({ block: 'center', behavior: 'smooth' });
          return;
        }
        if (firmas['FIRMA CI'].vacia()) {
          errorBox.textContent = 'Falta la firma de quien entrega';
          errorBox.hidden = false;
          cuerpo.querySelector('[data-firma="FIRMA CI"]').scrollIntoView({ block: 'center', behavior: 'smooth' });
          return;
        }

        const textoOriginal = boton.innerHTML;
        boton.disabled = true;
        boton.innerHTML = '<span class="spinner"></span> ' + (modo === 'presencial' ? 'Guardando…' : 'Generando liga…');
        toastCargando(modo === 'presencial' ? 'Registrando…' : 'Generando liga…');
        try {
          const imagenes = {};
          Object.keys(firmas).forEach((campo) => {
            const firma = firmas[campo].exportar();
            if (firma) imagenes[campo] = firma;
          });
          const datos = Object.assign({ 'ID VEHICULO': vResumen.ID_VEHICULO, 'FOLIO VEHICULO': vResumen.FOLIO }, CamposHoja.recolectar(CAMPOS_RESPONSIVA_VEHICULAR, 'resv'));
          // Si el responsable tampoco firmó, se difiere junto con el jefe (dos ligas de un
          // jalón) -- nadie tiene que estar presente para pedir la del jefe.
          const opciones = modo === 'remotoJefe'
            ? (firmas['FIRMA RESPONSABLE'].vacia() ? { remoto: true, remotoJefe: true } : { remotoJefe: true })
            : undefined;
          const res = await callServer('apiCrearResponsivaVehicular', state.token, datos, imagenes, opciones);
          if (res.aviso) Notificar.error(res.aviso);
          toastExito(modo === 'presencial' ? 'Responsiva registrada exitosamente' : 'Liga generada');
          cerrarCapturaVehiculo();
          abrirFichaVehiculo(vResumen, 'responsiva');
          if (res.liga && res.ligaJefe) {
            mostrarLigaFirma_([{ titulo: 'Responsable', liga: res.liga }, { titulo: 'Jefe directo', liga: res.ligaJefe }]);
          } else if (res.liga) mostrarLigaFirma_(res.liga);
          else if (res.ligaJefe) mostrarLigaFirma_(res.ligaJefe);
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.hidden = false;
          toastError('No se pudo ' + (modo === 'presencial' ? 'registrar' : 'generar la liga') + ': ' + err.message);
        } finally {
          boton.disabled = false;
          boton.innerHTML = textoOriginal;
        }
      }
      document.getElementById('resv-captura-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        guardarResponsiva_('presencial', document.getElementById('resv-captura-guardar'));
      });
      document.getElementById('resv-enviar-liga-jefe').addEventListener('click', () => {
        guardarResponsiva_('remotoJefe', document.getElementById('resv-enviar-liga-jefe'));
      });
    }

    // ---------- Ver completo / Editar / Eliminar de un registro de las 5 pestañas,
    // sin salir de la ficha del vehículo. Inspección solo lleva "Ver completo": es un
    // acta firmada, misma regla de negocio que ya rige su propio módulo. ----------

    const API_VER_FICHA_REGISTRO = {
      verificacion: { api: 'apiBuscarVerificacionPorId', titulo: 'Verificación' },
      inspeccion: { api: 'apiBuscarInspeccionPorId', titulo: 'Inspección' },
      sensor: { api: 'apiBuscarSensorPorId', titulo: 'Sensor' },
      holograma: { api: 'apiBuscarHologramaPorId', titulo: 'Holograma' },
      incidencia: { api: 'apiBuscarIncidenciaPorId', titulo: 'Incidencia' },
      // json: true -- esta respuesta viaja como texto (JSON.stringify en ClientApi.gs), no
      // como objeto directo: tiene 47+ columnas y google.script.run pierde objetos grandes
      // de forma intermitente si no viajan como texto (mismo motivo que las listas grandes).
      responsiva: { api: 'apiBuscarResponsivaVehicularPorId', titulo: 'Responsiva', json: true },
      adherente: { api: 'apiBuscarAdherenteVehicularPorId', titulo: 'Adherente', json: true },
    };
    async function verRegistroFicha(tipo, id) {
      const cfg = API_VER_FICHA_REGISTRO[tipo];
      if (!cfg) return;
      document.getElementById('veh-ver-registro-titulo').textContent = cfg.titulo;
      document.getElementById('veh-ver-registro-subtitulo').textContent = 'ID: ' + id;
      const cuerpo = document.getElementById('veh-ver-registro-cuerpo');
      cuerpo.innerHTML = '<p class="empty-state"><span class="spinner"></span> Cargando…</p>';
      document.getElementById('veh-modal-ver-registro').hidden = false;
      try {
        const resultado = await callServer(cfg.api, state.token, id);
        if (document.getElementById('veh-modal-ver-registro').hidden) return; // se cerró mientras cargaba
        const registro = cfg.json ? JSON.parse(resultado || 'null') : resultado;
        if (!registro) { cuerpo.innerHTML = '<p class="empty-state">No se encontró el registro (ID ' + escaparHtml(id) + ').</p>'; return; }
        const items = Object.keys(registro)
          .filter((k) => registro[k] !== '' && registro[k] !== null && registro[k] !== undefined)
          .map((k) => itemInfo(tituloDesdeClave(k), registro[k]));
        cuerpo.innerHTML = '<div class="card ln-card"><div class="info-grid">' + items.join('') + '</div></div>';
      } catch (err) {
        cuerpo.innerHTML = '<p class="error-msg">' + escaparHtml(err.message) + '</p>';
      }
    }
    function cerrarVerRegistroFicha() {
      document.getElementById('veh-modal-ver-registro').hidden = true;
      document.getElementById('veh-ver-registro-cuerpo').innerHTML = '';
    }

    const TAB_FICHA_POR_TIPO = {
      verificacion: 'verificaciones', inspeccion: 'inspecciones', sensor: 'sensor',
      holograma: 'hologramas', incidencia: 'incidencias', responsiva: 'responsiva', adherente: 'adherente',
    };
    // multiple: true → la API pide un arreglo de IDs (aunque aquí siempre se manda uno solo)
    const API_ELIMINAR_FICHA_REGISTRO = {
      verificacion: { api: 'apiEliminarVerificaciones', lista: 'apiListarVerificaciones', multiple: true },
      sensor: { api: 'apiEliminarSensores', lista: 'apiListarSensores', multiple: true },
      holograma: { api: 'apiEliminarHologramas', lista: 'apiListarHologramas', multiple: true },
      incidencia: { api: 'apiEliminarIncidencia', lista: 'apiListarIncidencias', multiple: false },

    async function eliminarRegistroFicha(tipo, id, vResumen) {
      const cfg = API_ELIMINAR_FICHA_REGISTRO[tipo];

        mensaje: 'Esta acción no se puede deshacer.',
        textoConfirmar: 'Eliminar',

      });
      if (!ok) return;
      try {
        if (cfg.multiple) await callServer(cfg.api, state.token, [id]);
        else await callServer(cfg.api, state.token, id);
        invalidarCacheLista(cfg.lista, state.token);
        toastExito('Eliminado exitosamente');
        abrirFichaVehiculo(vResumen, TAB_FICHA_POR_TIPO[tipo]);

    /** Busca, por SERIE VEHICULO, el folio y la carpeta de la compra en Adquisición Vehicular
     *  (proceso externo -- ver AdquisicionVehicularService.gs) y, si la persona confirma, lo
     *  guarda en la ficha. Nunca escribe nada afuera, solo lee. */
    async function buscarExpedienteAdquisicionFicha(vResumen, completo) {
      const serie = completo['SERIE VEHICULO'];
      if (!serie) { toastError('Este vehículo no tiene número de serie registrado.'); return; }
      try {
        const encontrado = await callServer('apiBuscarExpedienteAdquisicion', state.token, serie);
        if (!encontrado) { toastError('No se encontró un expediente de adquisición con esa serie.'); return; }
        const ok = await Confirmar.pedir({
          titulo: 'Expediente encontrado',
          mensaje: 'Folio ' + encontrado.folio + ' · ' + (encontrado.area || 'sin área') + ' (' + encontrado.año + ')' +
            (encontrado.liga ? '' : ' — no se encontró la carpeta en Drive, solo se guardará el folio.'),
          textoConfirmar: 'Guardar en la ficha',
        });
        if (!ok) return;
        await callServer('apiGuardarExpedienteAdquisicion', state.token, vResumen.ID_VEHICULO, {
          'FOLIO ADQUISICION': encontrado.folio, 'LIGA EXPEDIENTE ADQUISICION': encontrado.liga || '',
        });
        toastExito('Expediente guardado');
        abrirFichaVehiculo(vResumen, 'general');
      } catch (err) {
        toastError('No se pudo buscar el expediente: ' + err.message);
      }
    }

    /** Contenido de la pestaña "Adquisición" de la ficha: folio y carpeta ya ligados (si los
     *  hay), o el botón para buscarlos (buscarExpedienteAdquisicionFicha, vía el dispatcher
     *  genérico data-agregar) si todavía no se ha ligado ninguno. Solo con el permiso de
     *  Adquisición (14-oct); "Buscar" además necesita edición de Vehículos (escribe en su renglón). */
    function contenidoAdquisicionFicha(completo, puedeEditar) {
      const folio = completo['FOLIO ADQUISICION'];
      const liga = completo['LIGA EXPEDIENTE ADQUISICION'];
      const boton = puedeEditar
        ? '<button type="button" class="secondary" data-agregar="adquisicion" style="margin-left:auto">' +
          Iconos.svg('ver') + (folio ? ' Buscar de nuevo' : ' Buscar expediente') + '</button>' : '';
      if (!folio) {
        return '<div class="card ln-card"><h3 style="display:flex; align-items:center; gap:8px">' +
          '<i data-lucide="receipt" class="ico ln-icon"></i> Adquisición' + boton + '</h3>' +
          '<p class="empty-state">Todavía no se ha ligado el expediente de compra de este vehículo.</p></div>';
      }
      return '<div class="card ln-card"><h3 style="display:flex; align-items:center; gap:8px">' +
        '<i data-lucide="receipt" class="ico ln-icon"></i> Adquisición' +
        (liga ? '<span style="margin-left:auto">' + TablaFicha.boton({ texto: 'Abrir carpeta', icono: 'externo', href: liga }) + '</span>' : boton) + '</h3>' +
        '<dl class="ficha-resumen"><div><dt>Folio</dt><dd>' + escaparHtml(folio) + '</dd></div></dl>' +
        (liga ? '<div data-adq-ficha-archivos data-liga="' + escaparHtml(liga) + '" style="margin-top:12px">' +
          '<p class="ln-tenue"><span class="spinner"></span> Cargando archivos…</p></div>'
          : '<p class="empty-state" style="margin-top:12px">No se encontró la carpeta en Drive.</p>') +
        '</div>';
    }

    /** Los archivos de la carpeta (Galeria), pedidos solo al abrir la pestaña -- mismo
     *  apiAdquisicionVehicularArchivos que usa el apartado "Adquisición". */
    async function cargarArchivosAdquisicionFichaTab(contenedor) {
      if (!contenedor || contenedor.dataset.cargado) return;
      contenedor.dataset.cargado = '1';
      try {
        const r = JSON.parse(await callServer('apiAdquisicionVehicularArchivos', state.token, contenedor.dataset.liga));
        if (!document.body.contains(contenedor)) return;
        if (!r.soportado) {
          contenedor.innerHTML = '<p class="empty-state">Esta carpeta no es de Drive (por ejemplo, Dropbox) — no se pueden listar sus archivos aquí. Usa "Abrir carpeta" arriba.</p>';
          return;
        }
        if (!r.archivos.length) { contenedor.innerHTML = '<p class="empty-state">La carpeta no tiene archivos todavía.</p>'; return; }
        const grupos = [{ titulo: 'Archivos', fotos: r.archivos }];
        contenedor.innerHTML = Galeria.html(grupos);
        Galeria.ligar(contenedor, grupos, { titulo: 'Adquisición' });
      } catch (err) {
        contenedor.innerHTML = '<p class="empty-state">No se pudieron leer los archivos: ' + escaparHtml(err.message) + '</p>';
      }
    }

    /** "Copiar liga de nuevo" (Responsiva/Adherente pendientes): SIEMPRE se pide al servidor
     *  (apiFirmaRemotaLiga) -- armarla en el navegador con location.origin apunta al sandbox
     *  de Apps Script, no a la URL real (8-oct, confirmado con el usuario). */
    async function copiarLigaFicha_(tipo, quien, tokenFirma) {
      try {
        mostrarLigaFirma_(await callServer('apiFirmaRemotaLiga', state.token, tipo, quien, tokenFirma));
      } catch (err) {
        toastError('No se pudo generar la liga: ' + err.message);
      }
    }

    /** "Generar nueva liga" (botón manual): la anterior queda muerta en cuanto se genera la
     *  nueva (apiFirmaRemotaRegenerarLiga sobrescribe el token/la fecha de expira del mismo
     *  registro) -- se pide confirmar antes porque no hay vuelta atrás, y se repinta la pestaña
     *  después (el token cambió, aunque no se vea distinto en pantalla). */
    async function regenerarLigaFicha_(tipo, quien, id, vResumen) {
      const ok = await Confirmar.pedir({
        titulo: 'Generar nueva liga',
        mensaje: 'La liga anterior deja de funcionar en cuanto generes la nueva -- y si esa parte ' +
          'ya había firmado (por ejemplo, si firmó mal), esa firma se descarta: va a tener que volver ' +
          'a firmar con la liga nueva. ¿Continuar?',
        textoConfirmar: 'Generar nueva liga',
      });
      if (!ok) return;
      toastCargando('Generando liga…');
      try {
        mostrarLigaFirma_(await callServer('apiFirmaRemotaRegenerarLiga', state.token, tipo, id, quien));
        toastExito('Liga generada');
        abrirFichaVehiculo(vResumen, tipo === 'responsiva' ? 'responsiva' : 'adherente', true);
      } catch (err) {
        toastError('No se pudo generar la liga: ' + err.message);
      }
    }

    /** Editar verificación: 3 campos, actualiza campo por campo (mismo que su
     *  módulo -- guardarCambiosCampoPorCampo + apiActualizarCampoVerificacion). */
    function abrirEditarVerificacionFicha(v, vResumen) {
      const cuerpo = abrirCapturaVehiculo('clipboard-check', 'VERIFICACIÓN', 'Editar verificación', 'Folio ' + (v.FOLIO || vResumen.FOLIO));
      Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'FOLIO', etiqueta: 'Folio', valor: v.FOLIO || '' },
          { id: 'FECHA_VERIFICACION', etiqueta: 'Fecha de verificación', tipo: 'fecha', requerido: true, valor: fechaParaInput(v.FECHA_VERIFICACION) },
          { id: 'FECHA_PROXIMA', etiqueta: 'Próxima verificación', tipo: 'fecha', requerido: true, valor: fechaParaInput(v.FECHA_PROXIMA) },
        ],
        alValidar: (val) => (val.FECHA_PROXIMA && val.FECHA_VERIFICACION && val.FECHA_PROXIMA <= val.FECHA_VERIFICACION
          ? { FECHA_PROXIMA: 'Debe ser posterior a la fecha de verificación' } : null),
        textoGuardar: 'Guardar cambios', iconoGuardar: 'save',
        alGuardar: async (valores) => {
          const cambios = {};
          if (valores.FOLIO !== (v.FOLIO || '')) cambios.FOLIO = valores.FOLIO;
          if (valores.FECHA_VERIFICACION !== fechaParaInput(v.FECHA_VERIFICACION)) cambios.FECHA_VERIFICACION = valores.FECHA_VERIFICACION;
          if (valores.FECHA_PROXIMA !== fechaParaInput(v.FECHA_PROXIMA)) cambios.FECHA_PROXIMA = valores.FECHA_PROXIMA;
          if (Object.keys(cambios).length) {
            await guardarCambiosCampoPorCampo(v.ID, cambios, (id, campo, valor) => callServer('apiActualizarCampoVerificacion', state.token, id, campo, valor));
            invalidarCacheLista('apiListarVerificaciones', state.token);
          }
        },
        textoExito: () => 'Verificación actualizada',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'verificaciones'); },
      });

    /** repintar: la misma ficha con datos nuevos, sin "Cargando…" ni volver arriba */
    async function abrirFichaVehiculo(vResumen, pestanaInicial, repintar) {
      const listado = document.getElementById('veh-listado');
      const detalle = document.getElementById('veh-detalle');
      fichaVehiculoAbierta = vResumen;
      listado.hidden = true;
      detalle.hidden = false;
      if (!repintar) {
        detalle.innerHTML = migasVehiculo() + '<div class="card ln-card"><p class="ln-tenue"><span class="spinner"></span> Cargando…</p></div>';
        wireMigasVehiculo();
        document.getElementById('view-container').scrollTop = 0;
        window.scrollTo(0, 0);
      }

      try {
        // Todo en UNA llamada (apiFichaVehiculo en ClientApi.gs): el servidor pide cada pestaña
        // con el permiso de su módulo y manda null en las que la persona no puede ver (su pestaña
        // no aparece, igual que en el menú); si una que sí puede ver falla, sale vacía. Una ficha
        // ya vista sale al instante de su copia guardada y se repinta sola si llegó algo distinto;
        // cualquier guardado borra las copias (ESCRIBE en api.html).
        // Por el ID del vehículo (el folio se reasigna; el ID no)
        const ficha = JSON.parse((await callServerListaCacheada('apiFichaVehiculo', state.token, vResumen.ID_VEHICULO || vResumen.FOLIO)) || '{}');
        const { completo, cambios, reasignaciones, verificaciones, inspecciones, sensores, hologramas, incidencias, responsivas, adherentes, accesorios } = ficha;
        // Se pudo haber vuelto a la lista (o abierto otro folio) mientras cargaba.
        if (detalle.hidden || !document.body.contains(detalle) || fichaVehiculoAbierta !== vResumen) return;
        if (!completo) {
          detalle.innerHTML = migasVehiculo() + '<p class="empty-state">No se encontró el registro completo.</p>';
          wireMigasVehiculo();
          return;
        }

        const estilo = CLASE_ESTILO[String(completo['CLASE'] || '').toUpperCase()] || { icono: 'circle', color: 'var(--color-text-muted)' };
        const adherentesActivos = (adherentes || []).filter((r) => (r.ESTATUS || 'ACTIVO') === 'ACTIVO').length;
        const chipAdherentes = adherentesActivos
          ? '<span class="badge-estado pendiente"><i data-lucide="users" class="ico"></i> ' +
            adherentesActivos + (adherentesActivos === 1 ? ' adherente' : ' adherentes') + '</span>'
          : '';
        const resumenRapido = [
          ['Marca / Línea', [completo['MARCA'], completo['LINEA VEHICULO']].filter(Boolean).join(' · ')],
          ['Departamento', completo['DEPARTAMENTO']],
          ['Responsable', completo['RESPONSABLE VEHICULO']],
          ['Placa', completo['PLACA']],
        ].filter((d) => d[1]);

        let html = migasVehiculo();
        html += Ficha.encabezado({
          icono: estilo.icono, color: estilo.color, titulo: 'Nucco: ' + (vResumen.NUCCO || ''),
          chips: badgeEstatus(completo['ESTATUS']) + chipAdherentes,
          botones: puedeEditar ? '<button type="button" id="veh-btn-editar-ficha">' + Iconos.svg('editar') + ' Editar</button>' : '',
          resumen: resumenRapido,
        });

        // Una sola pestaña Datos (12-oct-2026; antes General + Detalles): todo el vehículo, por secciones
        // Las piezas de la unidad (sección vehiculos.accesorios): sin permiso llega null y no sale
        const conAccesorios = !!(accesorios && accesorios.estado);
        const datos = seccionesFichaVehiculo(completo, null,
          conAccesorios ? { 'Accesorios y sensor': resumenAccesorios(accesorios) } : null,
          conAccesorios ? { reemplazados: ['ACCESORIOS'] } : null);

        // Cada parte del historial es de su módulo (Cambios / Reasignaciones): sin permiso, no sale
        const historial = (cambios === null ? '' : '<div class="card ln-card"><h3><i data-lucide="pencil" class="ico ln-icon"></i> Historial de cambios</h3>' +
          ((cambios || []).length ? '<div class="historial-timeline">' + cambios.map((c) => `
              <div class="historial-item">
                <div class="historial-icon"><i data-lucide="pencil" class="ico"></i></div>
                <div class="historial-main">
                  <div class="historial-campo">${escaparHtml(c.CAMPO || '—')}</div>
                  <div class="historial-valores">
                    <span class="chip-valor chip-antes">${escaparHtml(c.ANTES || '(vacío)')}</span>
                    <i data-lucide="arrow-right" class="ico historial-flecha"></i>
                    <span class="chip-valor chip-despues">${escaparHtml(c.DESPUES || '(vacío)')}</span>
                  </div>
                </div>
                <div class="historial-meta">
                  <div>${escaparHtml(c.ACTUALIZADO_POR || '—')}</div>

          // Lo que hay en la carpeta del NUCO, por tipo de documento (app-documentos-vehiculo.html): se lee al abrirla.

          // Expediente externo de Adquisición Vehicular (AdquisicionVehicularService.gs): folio/carpeta ya
