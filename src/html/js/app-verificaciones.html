<script>
  /**
   * app-verificaciones.html — Verificaciones vehiculares periódicas, en su
   * propio archivo/<script> por el mismo motivo que Arqueos/Caja Chica (ver
   * comentario en app-arqueos.html). Extraído de la rama `ayrton`
   * (adaptado a nuestra base — ver "Hay que adaptar lo de ayrton..."):
   * usa los componentes nuevos (DataTable, Formulario, Tabs, Iconos,
   * Notificar) y los helpers compartidos agregados a app.html
   * (puedeEditarModulo, escaparHtml, hoyLocal), además de los ya
   * existentes (state, callServer, formatearFecha, leerArchivoBase64).
   */

  async function abrirComprobanteVerificacion(ruta) {
    const pestana = window.open('', '_blank');
    try {
      pestana.location.href = await callServer('apiUrlComprobanteVerificacion', state.token, ruta);
    } catch (err) {
      if (pestana) pestana.close();
      Notificar.error(err.message);
    }
  }

  async function initVerificaciones() {
    const DIA_MS = 24 * 60 * 60 * 1000;
    // Permisos del módulo (el servidor los vuelve a revisar en cada llamada)
    const puedeEditar = puedeEditarModulo('verificaciones');
    let verificaciones = [];

    // ----- Cálculos derivados (estado de vigencia por vehículo) -----
    function diasParaVencer(fechaProximaISO) {
      if (!fechaProximaISO) return null;
      return Math.floor((new Date(fechaProximaISO) - new Date(hoyLocal() + 'T00:00:00')) / DIA_MS);
    }

    /** Agrega ESTADO y DIAS_RESTANTES. Solo la verificación más reciente de cada folio cuenta como vigente. */
    function conDerivados(filas) {
      const ultimaPorFolio = {};
      filas.forEach((v) => {
        const actual = ultimaPorFolio[v.FOLIO];
        if (!actual || (v.FECHA_VERIFICACION || '') > (actual.FECHA_VERIFICACION || '')) ultimaPorFolio[v.FOLIO] = v;
      });
      return filas.map((v) => {
        const dias = diasParaVencer(v.FECHA_PROXIMA);
        let estado = 'Reemplazada';
        if (ultimaPorFolio[v.FOLIO] === v) {
          estado = dias === null ? 'Sin fecha' : dias < 0 ? 'Vencida' : dias <= 30 ? 'Por vencer' : 'Vigente';
        }
        return Object.assign({}, v, { ESTADO: estado, DIAS_RESTANTES: dias });
      });
    }

    // estado → [clase del badge, ícono]. Iconos.svg (y no data-lucide) porque la tabla se redibuja sola
    const BADGE_ESTADO = {
      'Vigente': ['cerrada', 'circle-check'],
      'Por vencer': ['abierta', 'hourglass'],
      'Vencida': ['abierta', 'triangle-alert'],
    };
    function badgeEstado(estado) {
      const b = BADGE_ESTADO[estado];
      return b
        ? `<span class="badge-estado ${b[0]}">${Iconos.svg(b[1])} ${escaparHtml(estado)}</span>`
        : `<span style="color:var(--color-text-muted)">${escaparHtml(estado)}</span>`;
    }

    function pintarStats() {
      document.getElementById('ver-stat-total').textContent = verificaciones.length;
      document.getElementById('ver-stat-vencidas').textContent = verificaciones.filter((v) => v.ESTADO === 'Vencida').length;
      document.getElementById('ver-stat-por-vencer').textContent = verificaciones.filter((v) => v.ESTADO === 'Por vencer').length;
    }

    /** Chip de KPI → valor de la columna ESTADO que filtra */
    const KPI_ESTADO = { 'ver-kpi-por-vencer': 'Por vencer', 'ver-kpi-vencidas': 'Vencida' };

    // ----- Pestaña 1: tabla -----
    const tabla = DataTable.crear(document.getElementById('ver-tabla'), {
      idCampo: 'ID',
      idTabla: 'verificaciones',   // recuerda columnas, anchos, orden y densidad de cada usuario
      ordenInicial: { campo: 'FECHA_REGISTRO', dir: 'desc' },
      textoVacio: 'Todavía no hay verificaciones registradas',
      ayuda: 'Fechas: pasa el mouse y usa el lápiz (o doble clic). Enter guarda, Esc cancela; Ctrl+Z deshace. ' +
        'El folio se cambia desde "Ver detalle" (el ojo en Acciones). La flecha de cada columna: filtrar, ordenar, fijar u ocultar. ' +
        'Para eliminar: el bote de basura de la fila, o marca varias casillas. Shift+clic en casillas selecciona un rango.',
      alCambiarFiltros: (filtros) => marcarKpiActivo(filtros),
      exportar: { nombreArchivo: 'Verificaciones' },
      etiquetaFila: (v) => [v.FOLIO, v.PLACA, v.FECHA_VERIFICACION ? 'verificó ' + formatearFecha(v.FECHA_VERIFICACION) : '']
        .filter(Boolean).join(' · '),
      detalle: {
        titulo: (v) => 'Verificación ' + v.FOLIO,
        contenidoExtra: (v, contenedor) => mostrarComprobanteEnPanel(v, contenedor),
      },
      columnas: [
        // Cambiar el folio también cambia la placa: solo desde el panel de detalle, no en la celda
        { campo: 'FOLIO', titulo: 'Folio', tipo: 'texto', editable: 'panel', fijada: true },
        { campo: 'PLACA', titulo: 'Placa', tipo: 'texto' },
        { campo: 'FECHA_VERIFICACION', titulo: 'Fecha verificación', tipo: 'fecha', editable: true },
        { campo: 'FECHA_PROXIMA', titulo: 'Próxima verificación', tipo: 'fecha', editable: true },
        { campo: 'DIAS_RESTANTES', titulo: 'Días para vencer', tipo: 'numero' },
        { campo: 'ESTADO', titulo: 'Estado', tipo: 'lista', render: (v) => badgeEstado(v) },
        { campo: 'REGISTRADO_POR', titulo: 'Registrado por', tipo: 'lista' },
        { campo: 'FECHA_REGISTRO', titulo: 'Fecha registro', tipo: 'fecha' },
        {
          // En el panel de detalle se muestra la imagen completa (contenidoExtra), no el botón
          campo: 'COMPROBANTE', titulo: 'Comprobante', filtrable: false, ordenable: false, enDetalle: false,
          render: (ruta) => (ruta
            ? `<button type="button" class="secondary btn-ver-comprobante" data-ruta="${escaparHtml(ruta)}" style="padding:4px 8px; display:inline-flex; align-items:center; gap:5px">${Iconos.svg('imagen')} Ver</button>`
            : '—'),
        },
      ],
      // Casillas para todos: copiar sirve a cualquiera; sin permiso, la barra explica por qué no hay "Eliminar"
      seleccionable: true,
      alEditar: puedeEditar ? async (fila, campo, valor) => {
        const actualizada = await callServer('apiActualizarCampoVerificacion', state.token, fila.ID, campo, valor);
        // Recalcular estados de todos (cambiar una fecha o folio puede mover cuál es la "última")
        verificaciones = conDerivados(verificaciones.map((v) => (v.ID === fila.ID ? actualizada : v)));
        tabla.setDatos(verificaciones);
        pintarStats();
        pintarHistorial();
      } : null,
      alEliminar: puedeEditar ? async (filas) => {
        await callServer('apiEliminarVerificaciones', state.token, filas.map((f) => f.ID));
        const ids = new Set(filas.map((f) => f.ID));
        verificaciones = conDerivados(verificaciones.filter((v) => !ids.has(v.ID)));
        tabla.setDatos(verificaciones);
        pintarStats();
        pintarHistorial();
      } : null,
      motivoSinEliminar: 'Tu permiso en este módulo es de solo lectura',
    });

    document.getElementById('ver-tabla').addEventListener('click', (ev) => {
      const btn = ev.target.closest('.btn-ver-comprobante');
      if (btn) abrirComprobanteVerificacion(btn.dataset.ruta);
    });

    /** Panel de detalle: imagen del comprobante (llega en base64; un link de Drive no se puede incrustar) */
    async function mostrarComprobanteEnPanel(v, contenedor) {
      if (!v.COMPROBANTE) {
        contenedor.innerHTML = '<p class="empty-state">Este registro no tiene comprobante.</p>';
        return;
      }
      contenedor.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Comprobante</div>' +
        '<span class="dt-skel" style="height:180px; width:100%; border-radius:10px"></span>';
      try {
        const vista = await callServer('apiPrevisualizarComprobanteVerificacion', state.token, v.COMPROBANTE);
        if (!document.body.contains(contenedor)) return;   // el panel se cerró mientras cargaba
        contenedor.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Comprobante</div>' +
          (vista.base64
            ? `<img src="data:${escaparHtml(vista.mimeType)};base64,${vista.base64}" alt="Comprobante de verificación del folio ${escaparHtml(v.FOLIO)}" style="width:100%; border-radius:10px; border:1px solid var(--color-border)" />`
            : '<p class="page-subtitle">La imagen es muy grande para mostrarla aquí.</p>') +
          `<p style="margin:8px 0 0"><a href="${escaparHtml(vista.url)}" target="_blank" rel="noopener">Abrir en Drive ↗</a></p>`;
      } catch (err) {
        if (document.body.contains(contenedor)) {
          contenedor.innerHTML = `<p class="error-msg">${Iconos.svg('alerta')} ${escaparHtml(err.message)}</p>`;
        }
      }
    }

    // ----- Pestaña 3: historial por tarjetas -----

    function pintarHistorial() {
      const lista = document.getElementById('ver-lista');
      const texto = document.getElementById('ver-buscar').value.trim().toUpperCase();
      const filtradas = verificaciones
        .filter((v) => !texto || String(v.FOLIO).toUpperCase().includes(texto) || String(v.PLACA).toUpperCase().includes(texto))
        .slice()
        .sort((a, b) => (b.FECHA_REGISTRO || '').localeCompare(a.FECHA_REGISTRO || ''))
        .slice(0, 100);

      document.getElementById('ver-vacio').hidden = filtradas.length > 0;
      lista.innerHTML = filtradas.map((v) => `
        <div class="incidencia-item">
          <div class="incidencia-icon">${Iconos.svg('clipboard-check')}</div>
          <div class="incidencia-main">
            <div class="incidencia-folio">${escaparHtml(v.FOLIO)}${v.PLACA ? ' · ' + escaparHtml(v.PLACA) : ''}</div>
            <div class="incidencia-meta">
              Verificó: ${formatearFecha(v.FECHA_VERIFICACION)} · Próxima: ${formatearFecha(v.FECHA_PROXIMA)}
              · Registró: ${escaparHtml(v.REGISTRADO_POR || '—')}
            </div>
          </div>
          <div class="incidencia-fecha">${formatearFecha(v.FECHA_REGISTRO)}</div>
          ${BADGE_ESTADO[v.ESTADO] ? badgeEstado(v.ESTADO) : ''}
          <div class="incidencia-actions">
            ${v.COMPROBANTE ? `<button type="button" class="secondary btn-ver-comprobante" data-ruta="${escaparHtml(v.COMPROBANTE)}" title="Ver comprobante" aria-label="Ver comprobante">${Iconos.svg('imagen')}</button>` : ''}
          </div>
        </div>`).join('');
    }

    document.getElementById('ver-buscar').addEventListener('input', pintarHistorial);
    document.getElementById('ver-lista').addEventListener('click', (ev) => {
      const btn = ev.target.closest('.btn-ver-comprobante');
      if (btn) abrirComprobanteVerificacion(btn.dataset.ruta);
    });

    // ----- Carga -----
    async function cargar() {
      tabla.setCargando(true);   // primera vez: filas grises; al refrescar: barra arriba sin borrar lo que se ve
      try {
        verificaciones = conDerivados((await callServer('apiListarVerificaciones', state.token)) || []);
      } catch (err) {
        tabla.setError('No se pudieron cargar las verificaciones: ' + err.message);
        document.getElementById('ver-vacio').textContent = 'No se pudieron cargar las verificaciones.';
        document.getElementById('ver-vacio').hidden = false;
        return;
      }
      document.getElementById('ver-vacio').textContent = 'No hay verificaciones que coincidan.';
      tabla.setDatos(verificaciones);
      pintarStats();
      pintarHistorial();
    }

    // Solo lectura: sin pestaña de captura (se quita el botón; Tabs deja oculto su panel,
    // y el servidor rechaza el registro de todos modos)
    if (!puedeEditar) document.querySelector('#ver-tabs .tab-btn[data-tab="nuevo"]').remove();

    const tabs = Tabs.iniciar(document.getElementById('ver-tabs'), {
      inicial: 'registros',
      alCambiar: (nombre) => { if (nombre === 'registros') requestAnimationFrame(tabla.ajustarAlto); },
    });

    // ----- KPIs: clic = filtrar la tabla por estado -----
    function marcarKpiActivo(filtros) {
      const valores = filtros.ESTADO && filtros.ESTADO.valores;
      const soloUno = valores && valores.length === 1 ? valores[0] : null;
      Object.keys(KPI_ESTADO).forEach((id) => {
        document.getElementById(id).classList.toggle('activo', KPI_ESTADO[id] === soloUno);
      });
    }
    Object.keys(KPI_ESTADO).forEach((id) => {
      document.getElementById(id).addEventListener('click', (ev) => {
        const yaActivo = ev.currentTarget.classList.contains('activo');
        tabs.mostrar('registros');
        tabla.setFiltro('ESTADO', yaActivo ? null : { valores: [KPI_ESTADO[id]] });
      });
    });
    document.getElementById('ver-kpi-total').addEventListener('click', () => {
      tabs.mostrar('registros');
      tabla.limpiarFiltros();
    });

    // ----- Pestaña 2: nuevo registro -----
    // Sin pasos: son cuatro campos, partirlos serían clics de más. La ficha del vehículo
    // va en el panel derecho (antes era un campo gris deshabilitado con la placa).
    if (puedeEditar) {
      Formulario.crear(document.getElementById('ver-form'), {
        ancho: 'medio',
        columnas: 2,
        panel: true,
        buscar: {
          campo: 'FOLIO',
          etiqueta: 'Folio del vehículo',
          ayuda: 'Al escribirlo se muestran los datos de la unidad para confirmar',
          opciones: async () => ((await callServer('apiListarVehiculosBasico', state.token)) || []).map((v) => ({
            valor: v.FOLIO,
            etiqueta: [v.PLACA, v.MARCA, v.LINEA_VEHICULO].filter(Boolean).join(' · '),
          })),
          cargar: (folio) => callServer('apiBuscarVehiculoPorFolio', state.token, folio),
          ficha: (v) => ({
            titulo: v['PLACA'] || 'Sin placa',
            subtitulo: [v['MARCA'], v['LINEA VEHICULO'], v['MODELO']].filter(Boolean).join(' · '),
            avisos: String(v['ESTATUS'] || '').toUpperCase().indexOf('BAJA') !== -1
              ? [{ tipo: 'alerta', texto: 'El vehículo está dado de baja (' + v['ESTATUS'] + ')' }]
              : [],
            datos: [
              ['Departamento', v['DEPARTAMENTO']],
              ['Sede', v['SEDE']],
              ['Responsable', v['RESPONSABLE VEHICULO']],
              ['Serie', v['SERIE VEHICULO']],
              ['Estatus', v['ESTATUS']],
              ['Verificación', v['VERIFICACION (SI / NO)']],
            ],
            pie: 'Datos del catálogo de Vehículos, solo para confirmar la unidad',
          }),
        },
        campos: [
          { id: 'FECHA_VERIFICACION', etiqueta: 'Fecha de verificación', tipo: 'fecha', requerido: true,
            valor: hoyLocal(), seccion: 'Verificación' },
          { id: 'FECHA_PROXIMA', etiqueta: 'Próxima verificación', tipo: 'fecha', requerido: true,
            ayuda: 'Debe ser posterior a la fecha de verificación' },
          { id: 'COMPROBANTE', etiqueta: 'Comprobante', tipo: 'archivo', acepta: 'image/png,image/jpeg',
            maxMB: 10, requerido: true, vistaPrevia: true, ayuda: 'Foto o captura del comprobante (PNG o JPG)' },
        ],
        // Se revisa aquí para no esperar hasta el servidor (que también lo valida)
        alValidar: (valores) => (valores.FECHA_PROXIMA && valores.FECHA_VERIFICACION
          && valores.FECHA_PROXIMA <= valores.FECHA_VERIFICACION
          ? { FECHA_PROXIMA: 'Debe ser posterior a la fecha de verificación' }
          : null),
        textoGuardar: 'Registrar verificación',
        iconoGuardar: 'save',
        alGuardar: async (valores, archivos) => {
          await callServer('apiRegistrarVerificacion', state.token, valores, {
            base64: await leerArchivoBase64(archivos.COMPROBANTE),
            mimeType: archivos.COMPROBANTE.type,
          });
        },
        textoExito: (valores) => 'Verificación del folio ' + valores.FOLIO + ' registrada',
        alGuardado: async () => {
          tabs.mostrar('registros');
          await cargar();
        },
      });
    }

    await cargar();
  }
</script>
