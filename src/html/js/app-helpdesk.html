<script>
  /**
   * app-helpdesk.html — la familia Help Desk (07/10/2026): Bandeja, Formularios, Registrados y
   * Conexión. Los tickets del helpdesk de TI que la cuenta de cada persona ve allá (todos tienen
   * acceso). El servidor habla con el helpdesk (HelpdeskApi.gs, con límites para no saturarlo) y
   * guarda solo una copia de lo que llega (APP_HELPDESK, HelpdeskService.gs). Desde aquí NO se
   * cambia nada allá: ni siquiera se marca un ticket como leído.
   *
   * La Bandeja sigue a las plataformas de soporte (Zendesk split view, Help Scout): bandejas a la
   * izquierda (cada una es un filtro guardado), la lista al centro y el ticket abierto a la
   * derecha, con teclado (J/K, /, R, F, 1–7). Cuida las llamadas al helpdesk:
   *   - abrir un ticket de la lista cuesta UNA llamada (el servidor ya tiene su ficha) y abrirlo
   *     otra vez, ninguna (HD_DETALLES, en esta pantalla);
   *   - la búsqueda por texto filtra lo que ya llegó, sin llamar; solo "#folio + Enter" llama;
   *   - J/K esperan a que se deje de teclear antes de pedir el ticket;
   *   - el contador de cada bandeja es el último que se vio (no se pide uno por bandeja);
   *   - las respuestas del formulario y las imágenes, solo cuando se piden.
   *
   * Lo que se pinta del helpdesk va SIEMPRE con escaparHtml: los mensajes ya llegan como texto
   * plano (el servidor les quita el HTML), pero títulos y nombres los escribe cualquiera.
   */

  // El marcador que copia el token del helpdesk (lo guarda su página en localStorage, llave
  // "token"). Sin doble diagonal literal: ver el bug de Apps Script en CLAUDE.md.
  const HELPDESK_MARCADOR = "javascript:(()=>{const t=localStorage.getItem('token');if(!t){alert('Primero inicia sesión en el helpdesk');return;}" +
    "navigator.clipboard.writeText(t).then(()=>alert('Token copiado: pégalo en Control Interno'),()=>prompt('Copia tu token:',t));})()";
  // La lista de tickets de su página (medida en el HAR del 07/10/2026; /tickets solo no existe)
  const HELPDESK_PAGINA = 'https:\/\/helpdesk-maderas.gphsis.com/app/tickets';
  // Una placa en el título ("RIFTER UNU794H | Fundaciones"), para sugerirla al registrar
  const PLACA_EN_TEXTO = /\b[A-Z]{3}[0-9]{3,4}[A-Z]?\b/;

  // Las bandejas: filtros guardados sobre lo que da el helpdesk. Los ids de estatus son los suyos
  // (getFilters, medidos el 05/10/2026): 1 Abierto, 2 Pendiente, 3 Resuelto, 4 Cerrado,
  // 7 Abierto sin asignación, 8 Reabierto.
  const HD_BANDEJAS = [
    { id: 'todos', etiqueta: 'Todos mis grupos', icono: 'inbox', filtros: { vista: 'grupos' } },
    { id: 'abiertos', etiqueta: 'Abiertos', icono: 'circle-dot', filtros: { vista: 'grupos', estatus: [1, 8] } },
    { id: 'sin-asignar', etiqueta: 'Sin asignar', icono: 'user-x', filtros: { vista: 'grupos', estatus: [7] } },
    { id: 'pendientes', etiqueta: 'Pendientes', icono: 'clock', filtros: { vista: 'grupos', estatus: [2] } },
    { id: 'resueltos', etiqueta: 'Resueltos y cerrados', icono: 'circle-check', filtros: { vista: 'grupos', estatus: [3, 4] } },
    { id: 'departamento', etiqueta: 'Mi departamento', icono: 'building-2', filtros: { vista: 'departamento' }, otra: true },
    { id: 'mios', etiqueta: 'Los que levanté', icono: 'send', filtros: { vista: 'mios' }, otra: true },
    // Los de los formularios que se registran en Tickets y todavía no están ahí (quien ve Tickets).
    // El helpdesk no sabe qué registramos: se piden sus tickets de esos formularios y aquí se
    // quitan los que ya están (apiHelpdeskRegistrados, sin llamar al helpdesk).
    { id: 'por-registrar', etiqueta: 'Por registrar', icono: 'clipboard-list', filtros: { vista: 'grupos' }, porRegistrar: true, requiere: 'tickets' },
  ];
  // "Por registrar": si en lo que llegó quedan pocos, se piden hasta 2 páginas más solas
  const HD_POR_REGISTRAR_MINIMO = 10;
  const HD_POR_REGISTRAR_PAGINAS_SOLAS = 2;

  // Lo que se queda entre visitas a la Bandeja (mientras no se recargue la página)
  const HD_DETALLES = new Map();     // idTicket → detalle (abrirlo otra vez no llama)
  const HD_FORMULARIOS = new Map();  // idTicket → respuestas del formulario
  const HD_ARCHIVOS = new Map();     // ruta → { tipo, base64 }
  const HD_CONTEXTO = new Map();     // idTicket (+ ':f' con el formulario) → lo nuestro de quien lo pide
  const HD_CONTEOS = {};             // bandeja → total visto la última vez
  const HD_REGISTRO = new Map();     // idTicket → su ID en Tickets, o '' si falta registrarlo
  let hdFormulariosDeTickets = null; // Set de idForm que se registran en Tickets (del catálogo)
  let hdBandejaActual = 'todos';

  /** ¿Está conectado? (no llama al helpdesk: lo lee del token guardado) */
  const helpdeskEstado = () => callServer('apiHelpdeskEstado', state.token);

  // =========================================================================== Bandeja
  async function initHelpdesk() {
    const $ = (id) => document.getElementById(id);
    const e = escaparHtml;
    const app = $('hd-app');
    const filtrosExtra = { grupos: [], formularios: [], prioridades: [], agentes: [], departamentos: [], desde: '', hasta: '' };
    let catalogo = { estatus: [], prioridades: [], formularios: [], grupos: [], agentes: [], departamentos: [] };
    let lista = [];        // lo que llegó de la bandeja (con lo de "Cargar más")
    let total = 0;
    let siguiente = null;  // cursor de la página que sigue
    let abierto = null;    // ID del ticket abierto
    let consulta = 0;      // si cambian de bandeja mientras llega una respuesta, solo cuenta la última
    let texto = '';        // lo que se busca dentro de la bandeja

    $('hd-ir-conexion').addEventListener('click', () => navegarA('helpdesk-conexion', 'Conexión'));

    // ---------- la marca y la búsqueda, en la barra de arriba (en celular se quedan aquí: no caben)
    const barra = $('hd-barra');
    const marca = $('hd-marca');
    function colocarBarra() {
      if (!app.isConnected) return quitarAvisoPantalla();   // ya se fue de la Bandeja
      if (Pantalla.esCelular()) {
        [barra, marca].forEach((el) => el.removeAttribute('data-de-vista'));
        barra.prepend(marca);
        app.prepend(barra);
      } else {
        ponerEnBarraSuperior(marca, 'izquierda');
        ponerEnBarraSuperior(barra, 'centro');
      }
    }
    const quitarAvisoPantalla = Pantalla.alCambiar(colocarBarra);
    colocarBarra();

    // ---------- piezas
    const colorEstatus = (t) => t.COLOR_ESTATUS || ((catalogo.estatus || []).find((s) => s.nombre === t.ESTATUS) || {}).color || '';
    const colorPrioridad = (t) => t.COLOR_PRIORIDAD || ((catalogo.prioridades || []).find((p) => p.nombre === t.PRIORIDAD) || {}).color || '';
    const estado = (t) => {
      const c = colorEstatus(t);
      return t.ESTATUS ? `<span class="hd-estado" style="${c ? 'color:' + c + ';background:' + c + '1f' : ''}"><span class="hd-punto" style="${c ? 'background:' + c : ''}"></span>${e(t.ESTATUS)}</span>` : '';
    };
    const prioridad = (t) => {
      const c = colorPrioridad(t);
      return t.PRIORIDAD ? `<span class="hd-estado"><span class="hd-punto" style="${c ? 'background:' + c : ''}"></span>${e(t.PRIORIDAD)}</span>` : '';
    };
    function cuando(fecha) {
      if (!fecha) return '';
      const d = new Date(String(fecha).length === 10 ? fecha + 'T12:00:00' : fecha);
      if (isNaN(d)) return '';
      const dias = Math.round((new Date(hoyLocal() + 'T12:00:00') - new Date(d.toDateString() + ' 12:00')) / 864e5);
      if (dias <= 0) return 'hoy';
      if (dias === 1) return 'ayer';
      if (dias < 30) return 'hace ' + dias + ' días';
      return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: dias > 300 ? 'numeric' : undefined });
    }
    const fechaHora = (iso) => {
      const f = iso ? new Date(iso) : null;
      return f && !isNaN(f) ? f.toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    };

    // ---------- tiempo sin respuesta. Lo mide el helpdesk (minutos desde la última respuesta y su
    // meta, 2 h); aquí solo se le suma lo que pasó desde que se midió (MEDIDO_EN). Solo cuenta en lo
    // que espera respuesta NUESTRA: Pendiente espera al solicitante, y lo resuelto ya no espera.
    const ESPERAN_RESPUESTA = [1, 7, 8];   // Abierto, Abierto sin asignación, Reabierto
    const UN_DIA = 24 * 60;
    function sinRespuesta(t) {
      if (typeof t.MIN_SIN_RESPUESTA !== 'number' || ESPERAN_RESPUESTA.indexOf(Number(t.ID_ESTATUS)) < 0) return null;
      const medido = t.MEDIDO_EN ? new Date(t.MEDIDO_EN).getTime() : Date.now();
      const min = t.MIN_SIN_RESPUESTA + Math.max(0, (Date.now() - medido) / 60000);
      const meta = t.META_RESPUESTA_MIN || 120;
      // Ámbar al pasar la meta del helpdesk; rojo con más de un día (con la meta de 2 h casi todo
      // estaría en rojo y el rojo dejaría de decir algo)
      return { min: min, meta: meta, nivel: min >= UN_DIA ? 'grave' : min >= meta ? 'tarde' : 'a-tiempo' };
    }
    function duracion(min) {
      if (min < 60) return Math.max(1, Math.round(min)) + ' min';
      if (min < UN_DIA) return Math.floor(min / 60) + ' h';
      const dias = Math.floor(min / UN_DIA);
      return dias + (dias === 1 ? ' día' : ' días');
    }
    function esperaHtml(t) {
      const s = sinRespuesta(t);
      if (!s || s.nivel === 'a-tiempo') return '';
      return `<span class="hd-espera ${s.nivel}" title="Sin respuesta desde hace ${duracion(s.min)} (la meta del helpdesk es ${duracion(s.meta)})">` +
        `<i data-lucide="hourglass" class="ico"></i><span class="hd-espera-txt">${duracion(s.min)}</span></span>`;
    }

    // ---------- ¿ya está en Tickets? Solo para quien ve Tickets y en los formularios que van ahí
    const veTickets = !!permisoDe('tickets');
    const vaEnTickets = (t) => veTickets && !!hdFormulariosDeTickets && hdFormulariosDeTickets.has(Number(t.ID_FORMULARIO));
    function registroHtml(t) {
      if (!vaEnTickets(t) || !HD_REGISTRO.has(t.ID)) return '';
      const ci = HD_REGISTRO.get(t.ID);
      return ci
        ? `<span class="hd-reg ok" title="Registrado en Tickets (${e(ci)})"><i data-lucide="check" class="ico"></i><span class="hd-reg-txt">En Tickets</span></span>`
        : '<span class="hd-reg falta" title="Este formulario se registra en Tickets y todavía no está ahí"><i data-lucide="circle-alert" class="ico"></i><span class="hd-reg-txt">Falta registrar</span></span>';
    }
    /** Cuáles de estos ya están en Tickets: una llamada a NUESTRAS hojas (ninguna al helpdesk). false si falló. */
    async function revisarRegistro(tickets) {
      const ids = tickets.filter((t) => vaEnTickets(t) && !HD_REGISTRO.has(t.ID)).map((t) => t.ID);
      if (!ids.length) return true;
      try {
        const r = await callServer('apiHelpdeskRegistrados', state.token, ids);
        ids.forEach((id) => HD_REGISTRO.set(id, r[id] || ''));
        return true;
      } catch (err) {
        return false;
      }
    }
    const faltanRegistrar = () => lista.filter((t) => HD_REGISTRO.get(t.ID) === '');

    // ---------- bandejas
    function pintarBandejas() {
      const fila = (b, i) => `<button type="button" class="hd-bandeja${b.id === hdBandejaActual ? ' activa' : ''}" data-bandeja="${b.id}" title="${e(b.etiqueta)} (${i + 1})">
          <i data-lucide="${b.icono}" class="ico"></i><span>${e(b.etiqueta)}</span>
          <span class="hd-bandeja-n">${HD_CONTEOS[b.id] === undefined ? '' : HD_CONTEOS[b.id]}</span></button>`;
      const filtros = contarFiltros();
      const seccion = (titulo, cuales) => {
        const bs = bandejasVisibles().filter(cuales);
        return bs.length ? '<div class="hd-bandejas-titulo">' + titulo + '</div>' + bs.map((b) => fila(b, HD_BANDEJAS.indexOf(b))).join('') : '';
      };
      $('hd-bandejas').innerHTML =
        seccion('Mis grupos', (b) => !b.otra && !b.porRegistrar) +
        seccion('Más', (b) => b.otra) +
        seccion('Control Interno', (b) => b.porRegistrar) +
        `<details class="hd-filtros-caja"${filtros ? ' open' : ''}>
          <summary><i data-lucide="sliders-horizontal" class="ico"></i> Filtros ${filtros ? '<span class="hd-filtros-n">' + filtros + '</span>' : ''}</summary>
          <p class="form-ayuda" style="margin:4px 0 0">No aplican a "Mi departamento" ni a "Los que levanté".</p>
          ${selectFiltro('grupos', 'Grupo', catalogo.grupos)}
          ${selectFiltro('formularios', 'Formulario', catalogo.formularios)}
          ${selectFiltro('prioridades', 'Prioridad', catalogo.prioridades)}
          ${selectFiltro('agentes', 'Agente', catalogo.agentes)}
          ${selectFiltro('departamentos', 'Departamento solicitante', catalogo.departamentos)}
          <div class="field"><label for="hd-f-desde">Creado desde</label><input type="date" id="hd-f-desde" value="${e(filtrosExtra.desde)}" /></div>
          <div class="field"><label for="hd-f-hasta">Hasta</label><input type="date" id="hd-f-hasta" value="${e(filtrosExtra.hasta)}" /></div>
          ${filtros ? '<button type="button" class="secondary hd-filtros-limpiar" id="hd-filtros-limpiar">Quitar filtros</button>' : ''}
        </details>`;
      refreshIcons();
    }
    function selectFiltro(campo, etiqueta, opciones) {
      const actual = filtrosExtra[campo][0];
      return `<div class="field"><label for="hd-f-${campo}">${etiqueta}</label><select id="hd-f-${campo}" data-filtro="${campo}">
        <option value="">Todos</option>${(opciones || []).map((o) => `<option value="${o.id}"${o.id === actual ? ' selected' : ''}>${e(o.nombre)}</option>`).join('')}</select></div>`;
    }
    const contarFiltros = () => ['grupos', 'formularios', 'prioridades', 'agentes', 'departamentos'].filter((c) => filtrosExtra[c].length).length +
      (filtrosExtra.desde ? 1 : 0) + (filtrosExtra.hasta ? 1 : 0);

    $('hd-bandejas').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-bandeja]');
      if (b) return elegirBandeja(b.dataset.bandeja);
      if (ev.target.closest('#hd-filtros-limpiar')) {
        Object.assign(filtrosExtra, { grupos: [], formularios: [], prioridades: [], agentes: [], departamentos: [], desde: '', hasta: '' });
        pintarBandejas();
        cargar(false);
      }
    });
    $('hd-bandejas').addEventListener('change', (ev) => {
      const el = ev.target;
      if (el.dataset.filtro) filtrosExtra[el.dataset.filtro] = el.value ? [Number(el.value)] : [];
      else if (el.id === 'hd-f-desde') filtrosExtra.desde = el.value || '';
      else if (el.id === 'hd-f-hasta') filtrosExtra.hasta = el.value || '';
      else return;
      const abierta = el.closest('details');
      pintarBandejas();
      if (abierta) $('hd-bandejas').querySelector('details').open = true;
      if (bandejaActual().otra) elegirBandeja('todos'); else cargar(false);
    });

    // "Por registrar" necesita ver Tickets y saber qué formularios van ahí (el catálogo)
    const bandejasVisibles = () => HD_BANDEJAS.filter((b) => (!b.requiere || permisoDe(b.requiere)) && (!b.porRegistrar || hdFormulariosDeTickets));
    const bandejaActual = () => bandejasVisibles().find((b) => b.id === hdBandejaActual) || HD_BANDEJAS[0];
    function filtrosDe(b) {
      if (b.otra) return Object.assign({}, b.filtros);
      if (b.porRegistrar) {
        // Si eligieron un formulario de los de Tickets en los filtros, solo ese; si no, todos
        const elegidos = filtrosExtra.formularios.filter((id) => hdFormulariosDeTickets.has(id));
        return Object.assign({}, filtrosExtra, b.filtros, { formularios: elegidos.length ? elegidos : Array.from(hdFormulariosDeTickets) });
      }
      return Object.assign({}, filtrosExtra, b.filtros);
    }
    function elegirBandeja(id) {
      if (!bandejasVisibles().some((b) => b.id === id)) return;
      hdBandejaActual = id;
      pintarBandejas();
      cargar(false);
    }

    // ---------- lista
    // Lo que se puede ver de lo que llegó: en "Por registrar", solo lo que falta registrar
    const base = () => (bandejaActual().porRegistrar ? faltanRegistrar() : lista);
    function visibles() {
      const q = texto.trim().toLowerCase().replace(/^#/, '');
      if (!q) return base();
      return base().filter((t) => [t.ID, t.TITULO, t.SOLICITANTE, t.FORMULARIO, t.AGENTE, t.GRUPO, t.AREA_DESTINO]
        .some((v) => String(v || '').toLowerCase().indexOf(q) !== -1));
    }
    function pintarLista() {
      const b = bandejaActual();
      $('hd-lista-titulo').textContent = b.etiqueta;
      const filas = visibles();
      const n = base().length;
      if (b.porRegistrar) HD_CONTEOS[b.id] = n + (siguiente ? '+' : '');
      // Cuántos de los que llegaron llevan más de un día sin respuesta (no se pide nada más)
      const graves = base().filter((t) => (sinRespuesta(t) || {}).nivel === 'grave').length;
      $('hd-lista-total').innerHTML = e(texto ? filas.length + ' de ' + n
        : b.porRegistrar ? (n === 1 ? '1 por registrar' : n + ' por registrar')
          : (total ? total + (total === 1 ? ' ticket' : ' tickets') : '')) +
        (graves && !texto ? ` <span class="hd-espera grave" title="${graves} de los que se ven llevan más de un día sin respuesta"><i data-lucide="hourglass" class="ico"></i>${graves}</span>` : '');
      $('hd-filas').innerHTML = filas.length ? filas.map((t) => `
        <button type="button" class="hd-fila${t.ID === abierto ? ' activa' : ''}${t.SIN_LEER ? ' sin-leer' : ''}" data-id="${t.ID}" role="option" aria-selected="${t.ID === abierto}">
          ${Avatar.html(t.CORREO_SOLICITANTE, t.SOLICITANTE, { tam: 34 })}
          <span class="hd-fila-texto">
            <span class="hd-fila-1"><span class="hd-fila-quien">${e(t.SOLICITANTE || 'Sin solicitante')}</span><span class="hd-fila-cuando">${esperaHtml(t)}${cuando(t.FECHA_CREACION)}</span></span>
            <span class="hd-fila-titulo">${e(t.TITULO || '(sin título)')}</span>
            <span class="hd-fila-3">${estado(t)}<span>#${t.ID}</span>${registroHtml(t)}<span class="hd-fila-form">${e(t.FORMULARIO || t.AREA_DESTINO || '')}</span>
              ${t.SIN_LEER ? '<span class="hd-no-leidos" title="Mensajes sin leer">' + t.SIN_LEER + '</span>' : ''}</span>
          </span>
        </button>`).join('')
        : b.porRegistrar && !texto
          ? `<div class="hd-vacio"><div><i data-lucide="clipboard-check" class="ico"></i><h3>Nada por registrar</h3>
              <p>Los ${lista.length} tickets revisados de combustible, NIP, hologramas y Uber ya están en Tickets.</p></div></div>`
          : `<div class="hd-vacio"><div><i data-lucide="inbox" class="ico"></i><h3>${texto ? 'Nada coincide' : 'Sin tickets'}</h3>
            <p>${texto ? 'Prueba con otra palabra, o escribe #folio y Enter para abrir uno que no está aquí.' : 'El helpdesk no tiene tickets en esta bandeja.'}</p></div></div>`;
      const pie = $('hd-lista-pie');
      if (b.porRegistrar && !texto && lista.length) {
        pie.innerHTML = '<span>Revisados los ' + lista.length + ' más recientes' + (total > lista.length ? ' de ' + total : '') + '.</span>' +
          (siguiente ? ' <button type="button" class="secondary" id="hd-btn-mas"><i data-lucide="chevrons-down" class="ico"></i> Revisar 25 más</button>' : '');
      } else if (siguiente && !texto) pie.innerHTML = '<button type="button" class="secondary" id="hd-btn-mas"><i data-lucide="chevrons-down" class="ico"></i> Cargar 25 más</button>';
      else if (lista.length < total && !b.otra) pie.textContent = 'Se muestran ' + lista.length + ' de ' + total + '. Usa los filtros para ver otros.';
      else if (lista.length < total) pie.textContent = 'Los ' + lista.length + ' más recientes de ' + total + ' (así los da el helpdesk en esta bandeja).';
      else pie.textContent = '';
      refreshIcons();
    }

    async function cargar(forzar) {
      const mia = ++consulta;
      const b = bandejaActual();
      $('hd-filas').innerHTML = '<div class="hd-esqueleto"></div><div class="hd-esqueleto"></div><div class="hd-esqueleto"></div><div class="hd-esqueleto"></div>';
      $('hd-lista-pie').textContent = '';
      $('hd-lista-titulo').textContent = b.etiqueta;
      $('hd-lista-total').textContent = '';
      try {
        const r = JSON.parse(await callServer('apiHelpdeskTickets', state.token, filtrosDe(b), !!forzar));
        if (mia !== consulta) return;
        lista = r.tickets;
        total = r.total;
        siguiente = r.siguiente || null;
        HD_CONTEOS[b.id] = r.total;
        const hora = new Date(r.consultado).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
        $('hd-consultado').textContent = hora;
        $('hd-consultado').title = 'Actualizado a las ' + hora;
        if (b.porRegistrar) {
          // Aquí la lista ES lo que falta: se espera a saberlo antes de pintar
          if (!(await revisarRegistro(lista))) throw new Error('No se pudo revisar qué tickets ya están en Tickets. Intenta de nuevo con R.');
          if (mia !== consulta) return;
          await completarPorRegistrar(mia);
          if (mia !== consulta) return;
          pintarLista();
          pintarBandejas();
          return;
        }
        pintarBandejas();
        pintarLista();
        // Las etiquetas "En Tickets / Falta registrar" llegan después: no detienen la lista
        revisarRegistro(lista).then(() => { if (mia === consulta) pintarLista(); });
      } catch (err) {
        if (mia !== consulta) return;
        $('hd-filas').innerHTML = '<div class="hd-vacio"><div><i data-lucide="cloud-off" class="ico"></i><h3>No se pudo cargar</h3><p>' + e(err.message) + '</p></div></div>';
        refreshIcons();
        if (/venció|Conecta tu cuenta/.test(err.message)) sinConexion();
      }
    }

    /** La página que sigue, pegada a la lista (y revisada contra Tickets). false si cambiaron de bandeja. */
    async function pedirMas(mia) {
      const r = JSON.parse(await callServer('apiHelpdeskTickets', state.token, Object.assign(filtrosDe(bandejaActual()), { despuesDe: siguiente }), false));
      if (mia !== consulta) return false;
      const ya = new Set(lista.map((t) => t.ID));
      const nuevos = r.tickets.filter((t) => !ya.has(t.ID));
      lista = lista.concat(nuevos);
      siguiente = r.siguiente || null;
      await revisarRegistro(nuevos);
      return mia === consulta;
    }
    /** "Por registrar": si en lo que llegó quedan pocos, revisa unas páginas más (pocas: cada una es una llamada al helpdesk) */
    async function completarPorRegistrar(mia) {
      for (let i = 0; i < HD_POR_REGISTRAR_PAGINAS_SOLAS && siguiente && faltanRegistrar().length < HD_POR_REGISTRAR_MINIMO; i++) {
        try {
          if (!(await pedirMas(mia))) return;
        } catch (err) {
          return;   // se queda con lo que ya revisó; "Revisar 25 más" lo vuelve a intentar
        }
      }
    }

    $('hd-lista-pie').addEventListener('click', async (ev) => {
      const btn = ev.target.closest('#hd-btn-mas');
      if (!btn) return;
      const mia = consulta;
      btn.disabled = true;
      try {
        if (!(await pedirMas(mia))) return;
        pintarLista();
        if (bandejaActual().porRegistrar) pintarBandejas();
      } catch (err) {
        Notificar.error(err.message);
        btn.disabled = false;
      }
    });

    $('hd-filas').addEventListener('click', (ev) => {
      const fila = ev.target.closest('[data-id]');
      if (fila) abrir(Number(fila.dataset.id), 0);
    });

    // ---------- buscar
    const buscar = $('hd-buscar');
    buscar.addEventListener('input', () => { texto = buscar.value; pintarLista(); });
    buscar.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        const folio = buscar.value.trim().replace(/^#/, '');
        if (/^\d{3,}$/.test(folio)) { ev.preventDefault(); abrir(Number(folio), 0); }
      } else if (ev.key === 'Escape') {
        buscar.value = ''; texto = ''; pintarLista(); buscar.blur();
      }
    });

    // ---------- ticket abierto
    let esperaTeclas = null;
    function abrir(id, retraso) {
      if (!id) return;
      abierto = id;
      app.dataset.panel = 'ticket';
      $('hd-filas').querySelectorAll('.hd-fila').forEach((f) => {
        const es = Number(f.dataset.id) === id;
        f.classList.toggle('activa', es);
        f.setAttribute('aria-selected', es);
        if (es) f.scrollIntoView({ block: 'nearest' });
      });
      const base = lista.find((t) => t.ID === id);
      if (HD_DETALLES.has(id)) return pintarTicket(HD_DETALLES.get(id));
      pintarTicket(base || { ID: id, TITULO: 'Ticket #' + id }, true);
      clearTimeout(esperaTeclas);
      // Con J/K se espera a que se deje de teclear: pasar por 5 tickets no son 5 llamadas
      esperaTeclas = setTimeout(() => pedirDetalle(id), retraso || 0);
    }
    async function pedirDetalle(id) {
      try {
        const d = JSON.parse(await callServer('apiHelpdeskDetalle', state.token, id));
        HD_DETALLES.set(id, d);
        if (abierto === id) pintarTicket(d);
      } catch (err) {
        if (abierto !== id) return;
        $('hd-t-conversacion').innerHTML = '<div class="hd-vacio"><div><i data-lucide="cloud-off" class="ico"></i><h3>No se pudo abrir</h3><p>' + e(err.message) + '</p></div></div>';
        refreshIcons();
        if (/venció|Conecta tu cuenta/.test(err.message)) sinConexion();
      }
    }

    function pintarTicket(t, cargando) {
      const deQuienPide = (m) => (m.CORREO && t.CORREO_SOLICITANTE ? m.CORREO === t.CORREO_SOLICITANTE : m.AUTOR === t.SOLICITANTE);
      const mensajes = (t.MENSAJES || []).slice().sort((a, b) => String(a.FECHA).localeCompare(String(b.FECHA)));
      const conversacion = cargando
        ? '<div class="hd-esqueleto"></div><div class="hd-esqueleto"></div>'
        : (mensajes.length ? mensajes : [{ AUTOR: t.SOLICITANTE, CORREO: t.CORREO_SOLICITANTE, FECHA: t.FECHA_CREACION, TEXTO: t.DESCRIPCION, ARCHIVOS: [], ADJUNTOS: [] }])
          .map((m) => {
            const archivos = m.ARCHIVOS || [];
            const nombres = archivos.length ? [] : (m.ADJUNTOS || []);
            return `<div class="hd-msj${deQuienPide(m) ? '' : ' de-agente'}${m.PRIVADO ? ' privado' : ''}">
              ${Avatar.html(m.CORREO, m.AUTOR, { tam: 32 })}
              <div class="hd-msj-caja">
                <div class="hd-msj-cabeza"><strong>${e(m.AUTOR || '—')}</strong><span>${fechaHora(m.FECHA) || e(m.FECHA || '')}</span>
                  ${m.PRIVADO ? '<span>· Nota interna</span>' : ''}${nombres.length ? '<span>· adjuntos: ' + e(nombres.join(', ')) + '</span>' : ''}</div>
                <div class="hd-msj-texto">${e(m.TEXTO) || '<em>(sin texto)</em>'}</div>
                ${archivos.length ? '<div class="hd-archivos">' + archivos.map((a) =>
                  `<button type="button" class="secondary" data-hd-ruta="${e(a.RUTA)}" data-hd-nombre="${e(a.NOMBRE)}">${Iconos.svg(a.IMAGEN ? 'imagen' : 'documento')} Ver ${e(a.NOMBRE)}</button>`).join('') + '</div>' : ''}
              </div></div>`;
          }).join('');
      const prop = (k, v) => (v ? `<dt>${k}</dt><dd>${v}</dd>` : '');
      const gente = (t.INVOLUCRADOS || []).map((p) => `<div title="${e(p.CORREO)}">${Avatar.html(p.CORREO, p.NOMBRE, { tam: 24 })}<span>${e(p.NOMBRE)}</span></div>`).join('');
      const formulario = HD_FORMULARIOS.get(t.ID);
      $('hd-ticket').innerHTML = `
        <div class="hd-t-cabeza">
          <button type="button" class="secondary hd-t-volver" id="hd-t-volver"><i data-lucide="arrow-left" class="ico"></i> Bandeja</button>
          <div class="hd-t-folio">#${t.ID}${t.FORMULARIO ? ' · ' + e(t.FORMULARIO) : ''}</div>
          <h2 class="hd-t-titulo">${e(t.TITULO || '')}</h2>
          <div class="hd-t-chips">${estado(t)}${prioridad(t)}${t.GRUPO ? '<span>' + e(t.GRUPO) + '</span>' : ''}${t.ULTIMA_RESPUESTA ? '<span>· ' + e(t.ULTIMA_RESPUESTA) + '</span>' : ''}</div>
          <div class="hd-t-acciones">
            <button type="button" class="secondary" id="hd-btn-abrir-hd">${Iconos.svg('externo')} Abrir en el helpdesk</button>
            ${puedeEditarModulo('tickets') ? '<button type="button" class="secondary" id="hd-btn-registrar" hidden><i data-lucide="ticket" class="ico"></i> Registrar en Tickets</button><span class="form-ayuda" id="hd-registrado" hidden></span>' : ''}
          </div>
        </div>
        <div class="hd-t-cuerpo">
          <div class="hd-conversacion" id="hd-t-conversacion">${conversacion}</div>
          <aside class="hd-lado">
            <div>
              <div class="hd-lado-titulo">Quien lo pide</div>
              <div class="hd-persona-tarjeta">
                <div class="hd-persona-cabeza">${Avatar.html(t.CORREO_SOLICITANTE, t.SOLICITANTE, { tam: 36 })}<strong>${e(t.SOLICITANTE || '—')}</strong></div>
                <span>${e(t.CORREO_SOLICITANTE || '')}</span>
                <span>${e([t.AREA_SOLICITANTE, t.DEPARTAMENTO_SOLICITANTE].filter(Boolean).join(' · '))}</span>
                <span id="hd-t-persona"></span>
              </div>
            </div>
            <div id="hd-t-contexto">${cargando ? '' : '<div class="hd-lado-titulo">En Control Interno</div><div class="hd-esqueleto hd-esqueleto-chico"></div>'}</div>
            <div>
              <div class="hd-lado-titulo">Propiedades</div>
              <dl class="hd-props">
                ${prop('Estatus', estado(t))}${prop('Prioridad', prioridad(t))}${prop('Agente', e(t.AGENTE))}${prop('Grupo', e(t.GRUPO))}
                ${prop('Área destino', e(t.AREA_DESTINO))}${prop('Creado', t.FECHA_CREACION ? formatearFecha(t.FECHA_CREACION) : '')}
                ${prop('Sin respuesta', (() => {
                  const s = sinRespuesta(t);
                  return s ? `<span class="hd-espera ${s.nivel}"><i data-lucide="hourglass" class="ico"></i>${duracion(s.min)}</span> <small>meta ${duracion(s.meta)}</small>` : '';
                })())}
                ${prop('Cerrado', fechaHora(t.FECHA_CIERRE))}${prop('Duración', t.DURACION_DIAS !== '' && t.DURACION_DIAS !== undefined ? e(t.DURACION_DIAS) + ' días' : '')}
              </dl>
            </div>
            <div>
              <div class="hd-lado-titulo">Formulario</div>
              <div id="hd-t-formulario">${formulario ? respuestasHtml(formulario)
                : '<button type="button" class="secondary" id="hd-btn-formulario"' + (cargando ? ' disabled' : '') + '><i data-lucide="list-checks" class="ico"></i> Ver respuestas (F)</button>'}</div>
            </div>
            ${gente ? '<div><div class="hd-lado-titulo">En el ticket</div><div class="hd-gente">' + gente + '</div></div>' : ''}
          </aside>
        </div>`;
      refreshIcons();
      Avatar.completar($('hd-ticket'));
      if (!cargando && puedeEditarModulo('tickets')) prepararRegistro(t);
      if (!cargando) pedirContexto(t);

    // ---------- lo que sabemos en Control Interno de quien lo pide (una llamada a NUESTRO servidor)
    async function pedirContexto(t) {
      const formulario = HD_FORMULARIOS.get(t.ID);
      const llave = t.ID + (formulario ? ':f' : '');
      if (HD_CONTEXTO.has(llave)) return pintarContexto(t, HD_CONTEXTO.get(llave));
      // El texto del ticket, para encontrar la placa, el VIN o el folio que cita (con un tope)
      const textos = [t.TITULO, t.DESCRIPCION].concat((t.MENSAJES || []).map((m) => m.TEXTO)).filter(Boolean).join('\n').slice(0, 20000);
      const consulta = {
        id: t.ID, correo: t.CORREO_SOLICITANTE || '', nombre: t.SOLICITANTE || '', formulario: t.ID_FORMULARIO || null, textos: [textos],
        campos: formulario ? (formulario.CAMPOS || []).map((c) => ({ ETIQUETA: c.ETIQUETA, VALOR: c.VALOR })) : [],
      };
      try {
        const c = JSON.parse(await callServer('apiHelpdeskContexto', state.token, consulta));
        HD_CONTEXTO.set(llave, c);
        if (abierto === t.ID) pintarContexto(t, c);
      } catch (err) {
        if (abierto === t.ID && $('hd-t-contexto')) $('hd-t-contexto').innerHTML = '<div class="hd-lado-titulo">En Control Interno</div><p class="form-ayuda" style="margin:0">No se pudo consultar: ' + e(err.message) + '</p>';
      }
    }

    function pintarContexto(t, c) {
      const caja = $('hd-t-contexto');
      if (!caja) return;
      const p = c.persona;
      if (p && $('hd-t-persona')) {
        $('hd-t-persona').innerHTML = e([p.PUESTO, (p.NUMEROS || []).join(' / ')].filter(Boolean).join(' · ')) +
          (p.JEFE_DIRECTO ? '<br>Jefe directo: ' + e(p.JEFE_DIRECTO) : '');
      }
      const verVeh = !!permisoDe('vehiculos');
      const verCaja = !!permisoDe('caja-chica');
      const partes = [];
      if (c.vehiculos) {
        // Un vehículo citado y además a su cargo sale una vez, con las dos marcas
        const vistos = new Map();
        c.vehiculos.mencionados.forEach((v) => vistos.set(v.FOLIO, Object.assign({ citado: v.POR }, v)));
        c.vehiculos.aCargo.forEach((v) => vistos.set(v.FOLIO, Object.assign(vistos.get(v.FOLIO) || v, { suyo: true })));
        const filas = Array.from(vistos.values()).map((v) => `
          <div class="hd-ci-fila">
            <i data-lucide="car" class="ico"></i>
            <div><strong>${e(v.FOLIO)}${v.PLACA ? ' · ' + e(v.PLACA) : ''}</strong>
              <span>${e([v.MARCA, v.LINEA, v.MODELO].filter(Boolean).join(' '))}</span>
              <span class="hd-ci-marcas">${v.citado ? '<span class="hd-ci-marca">Citado en el ticket (' + e(v.citado) + ')</span>' : ''}${v.suyo ? '<span class="hd-ci-marca suyo">A su cargo</span>' : ''}</span></div>
            ${verVeh ? `<button type="button" class="secondary hd-ci-ver" data-hd-vehiculo="${e(v.FOLIO)}" title="Abrir su ficha en Vehículos">Ver</button>` : ''}
          </div>`);
        if (filas.length) partes.push('<div class="hd-ci-grupo">Vehículos</div>' + filas.join(''));
      }
      if (c.lineas) {
        // Lo mismo que con vehículos: citado y además suyo sale una vez. Solo lo que no es secreto
        // (el servidor no manda PIN, contraseñas, IMEI ni SIM)
        const vistas = new Map();
        c.lineas.mencionados.forEach((l) => vistas.set(l.ID, Object.assign({ citado: l.POR }, l)));
        c.lineas.aCargo.forEach((l) => vistas.set(l.ID, Object.assign(vistas.get(l.ID) || l, { suyo: true })));
        const verLinea = !!permisoDe('lineas-telefonicas');
        const filas = Array.from(vistas.values()).map((l) => `
          <div class="hd-ci-fila">
            <i data-lucide="${l.TIPO === 'equipo' ? 'smartphone' : 'phone'}" class="ico"></i>
            <div><strong>${l.TIPO === 'equipo' ? 'NUCO ' + e(l.NUCO || '—') : 'Línea suelta'}${l.NUMERO ? ' · ' + e(l.NUMERO) : ''}</strong>
              <span>${e([l.TIPO_EQUIPO, l.MODELO, l.COMPANIA, l.ESTATUS].filter(Boolean).join(' · '))}</span>
              <span class="hd-ci-marcas">${l.citado ? '<span class="hd-ci-marca">Citado en el ticket (' + e(l.citado) + ')</span>' : ''}${l.suyo ? '<span class="hd-ci-marca suyo">A su cargo</span>' : ''}</span></div>
            ${verLinea ? `<button type="button" class="secondary hd-ci-ver" data-hd-linea="${e(l.ID)}" title="Abrir su ficha en Líneas Telefónicas">Ver</button>` : ''}
          </div>`);
        if (filas.length) partes.push('<div class="hd-ci-grupo">Líneas y equipos</div>' + filas.join(''));
      }
      if (c.cajas && c.cajas.length) {
        partes.push('<div class="hd-ci-grupo">Caja chica</div>' + c.cajas.map((k) => `
          <div class="hd-ci-fila">
            <i data-lucide="wallet" class="ico"></i>
            <div><strong>Caja ${e(k.ID_CCH)}</strong><span>${e([k.ESTATUS, k.MONTO_ACTUAL !== '' && k.MONTO_ACTUAL !== undefined && k.MONTO_ACTUAL !== null ? formatearMoneda(k.MONTO_ACTUAL) : ''].filter(Boolean).join(' · '))}</span></div>
            ${verCaja ? `<button type="button" class="secondary hd-ci-ver" data-hd-caja="${e(k.ID_CCH)}" title="Abrir su ficha en Caja Chica">Ver</button>` : ''}
          </div>`).join(''));
      }
      if (c.otrosTickets && c.otrosTickets.total) {
        const o = c.otrosTickets;
        partes.push(`<div class="hd-ci-grupo">Sus otros tickets · ${o.total}${o.abiertos ? ' (' + o.abiertos + (o.abiertos === 1 ? ' abierto' : ' abiertos') + ')' : ''}</div>` +
          o.ultimos.map((x) => `<button type="button" class="hd-ci-ticket" data-hd-otro="${x.ID}">
            <span>#${x.ID} · ${e(x.TITULO || '(sin título)')}</span><small>${e([x.ESTATUS, cuando(x.FECHA)].filter(Boolean).join(' · '))}</small></button>`).join('') +
          (o.total > o.ultimos.length ? '<p class="form-ayuda" style="margin:4px 0 0">Se muestran los ' + o.ultimos.length + ' más recientes.</p>' : ''));
      }
      // Sin ningún módulo que lo pueda mostrar, la sección no aparece
      const algo = c.vehiculos || c.cajas || c.lineas || c.otrosTickets;
      caja.innerHTML = !algo ? '' : '<div class="hd-lado-titulo">En Control Interno</div>' +
        (partes.length ? partes.join('') : '<p class="form-ayuda" style="margin:0">Nada ligado: no tiene vehículos, líneas ni cajas a su cargo y el ticket no cita ninguno.</p>');
      refreshIcons();
    }

    function respuestasHtml(f) {
      const campos = (f.CAMPOS || []).filter((c) => c.TIPO !== 'check' || c.VALOR);
      if (!campos.length) return '<p class="form-ayuda" style="margin:0">El formulario no tiene campos llenos.</p>';
      // Las fechas llegan como "2026-08-27T13:37" o "2026-08-27"
      const valor = (c) => {
        if (c.TIPO === 'date' && /^d{4}-d{2}-d{2}/.test(c.VALOR)) {
          const f = new Date(c.VALOR.length === 10 ? c.VALOR + 'T12:00:00' : c.VALOR);
          if (!isNaN(f)) return f.toLocaleString('es-MX', c.VALOR.length === 10 ? { dateStyle: 'medium' } : { dateStyle: 'medium', timeStyle: 'short' });
        }
        return c.VALOR;
      };
      return '<div class="hd-respuestas">' + campos.map((c) => `<div><span>${e(c.ETIQUETA)}</span><strong>${e(valor(c)) || '—'}</strong></div>`).join('') + '</div>';
    }
    async function verFormulario() {
      const id = abierto;
      const btn = $('hd-btn-formulario');
      if (!id || !btn || btn.disabled) return;
      btn.disabled = true;
      const t = HD_DETALLES.get(id) || {};
      try {
        const f = await callServer('apiHelpdeskFormulario', state.token, id, t.ID_FORMULARIO || null);
        HD_FORMULARIOS.set(id, f);
        if (abierto === id) $('hd-t-formulario').innerHTML = respuestasHtml(f);
        // Las respuestas pueden traer la placa o el Nucco: se vuelve a preguntar con ellas
        if (abierto === id && HD_DETALLES.has(id)) pedirContexto(HD_DETALLES.get(id));
      } catch (err) {
        Notificar.error(err.message);
        btn.disabled = false;
      }
    }

    $('hd-ticket').addEventListener('click', async (ev) => {
      if (ev.target.closest('#hd-t-volver')) { app.dataset.panel = 'lista'; return; }
      if (ev.target.closest('#hd-btn-abrir-hd')) { window.open(HELPDESK_PAGINA, '_blank', 'noopener'); return; }
      if (ev.target.closest('#hd-btn-formulario')) return verFormulario();
      if (ev.target.closest('#hd-btn-registrar')) return abrirRegistro(HD_DETALLES.get(abierto));
      const veh = ev.target.closest('[data-hd-vehiculo]');
      if (veh) return verFichaVehiculoDesdeOtroModulo(veh.dataset.hdVehiculo);
      const lin = ev.target.closest('[data-hd-linea]');
      if (lin) return Lineas.irARegistro(lin.dataset.hdLinea);
      const cch = ev.target.closest('[data-hd-caja]');
      if (cch) return verFichaCajaChicaDesdeOtroModulo(cch.dataset.hdCaja);
      const otro = ev.target.closest('[data-hd-otro]');
      if (otro) return abrir(Number(otro.dataset.hdOtro), 0);
      const btn = ev.target.closest('[data-hd-ruta]');
      if (btn) verArchivo(btn);
    });

    // ---------- archivos de la conversación: uno por uno, solo al darles clic
    function mostrarArchivo(btn, a) {
      const caja = document.createElement('div');
      if (a.tipo.indexOf('image/') === 0) {
        const img = document.createElement('img');
        img.className = 'hd-imagen';
        img.alt = btn.dataset.hdNombre || 'Imagen';
        img.src = 'data:' + a.tipo + ';base64,' + a.base64;
        caja.appendChild(img);
      } else {
        // PDF: como Blob (un data: largo no abre en todos los navegadores)
        const bytes = Uint8Array.from(atob(a.base64), (c) => c.charCodeAt(0));
        const liga = document.createElement('a');
        liga.href = URL.createObjectURL(new Blob([bytes], { type: a.tipo }));
        liga.target = '_blank';
        liga.rel = 'noopener';
        liga.download = (btn.dataset.hdNombre || 'archivo') + '.pdf';
        liga.textContent = 'Abrir ' + (btn.dataset.hdNombre || 'el PDF');
        caja.appendChild(liga);
      }
      btn.replaceWith(caja);
    }
    async function verArchivo(btn) {
      const ruta = btn.dataset.hdRuta;
      const id = abierto;
      if (HD_ARCHIVOS.has(ruta)) return mostrarArchivo(btn, HD_ARCHIVOS.get(ruta));
      btn.disabled = true;
      try {
        const a = await callServer('apiHelpdeskArchivo', state.token, id, ruta);
        HD_ARCHIVOS.set(ruta, a);
        if (abierto === id && btn.isConnected) mostrarArchivo(btn, a);
      } catch (err) {
        Notificar.error(err.message);
        btn.disabled = false;
      }
    }

    // ---------- registrar en Tickets (quien edita Tickets)
    async function prepararRegistro(d) {
      let registrados = {};
      try { registrados = await callServer('apiHelpdeskRegistrados', state.token, [d.ID]); } catch (err) { /* se ofrece igual: el servidor no deja duplicar */ }
      if (vaEnTickets(d) && HD_REGISTRO.get(d.ID) !== (registrados[d.ID] || '')) {
        HD_REGISTRO.set(d.ID, registrados[d.ID] || '');
        pintarLista();
      }
      if (abierto !== d.ID || !$('hd-btn-registrar')) return;
      if (registrados[d.ID]) {
        $('hd-registrado').textContent = 'Ya está en Tickets (' + registrados[d.ID] + ')';
        $('hd-registrado').hidden = false;
      } else {
        $('hd-btn-registrar').hidden = false;
      }
    }
    const modalRegistro = $('hd-modal-registrar');
    const cerrarRegistro = () => { modalRegistro.hidden = true; };
    $('hd-registrar-cerrar').addEventListener('click', cerrarRegistro);
    modalRegistro.addEventListener('click', (ev) => { if (ev.target === modalRegistro) cerrarRegistro(); });
    async function abrirRegistro(d) {
      if (!d) return;
      $('hd-registrar-sub').textContent = '#' + d.ID + ' · ' + d.TITULO;
      $('hd-campos-ticket').innerHTML = CamposHoja.html(CAMPOS_TICKET, { prefijo: 'hd-ticket' });
      const placa = (String(d.TITULO).toUpperCase().match(PLACA_EN_TEXTO) || [''])[0];
      CamposHoja.poblar(CAMPOS_TICKET, 'hd-ticket', {
        TICKET: String(d.ID), FECHA: d.FECHA_CREACION, DEPARTAMENTO: d.DEPARTAMENTO_SOLICITANTE,
        SOLICITANTE: d.SOLICITANTE, PLACA: placa, COMENTARIO: d.TITULO,
      });
      document.getElementById('hd-ticket-ticket').disabled = true;   // siempre el número del helpdesk (el servidor lo pone igual)
      document.getElementById('hd-ticket-fecha-de-registro').value = new Date().toLocaleDateString('es-MX');
      $('hd-ticket-error').hidden = true;
      modalRegistro.hidden = false;
      refreshIcons();
      try {
        const [departamentos, solicitantes] = await Promise.all([
          callServerCacheado('apiListarDepartamentos', state.token),
          callServerCacheado('apiListarSolicitantesTickets', state.token),
        ]);
        CamposHoja.llenarOpciones('hd-ticket-departamento', departamentos);
        CamposHoja.llenarOpciones('hd-ticket-solicitante', solicitantes);
      } catch (err) { /* son sugerencias: se puede escribir igual */ }
      $('hd-form-ticket').onsubmit = async (ev) => {
        ev.preventDefault();
        const btn = $('hd-btn-guardar-ticket');
        btn.disabled = true;
        $('hd-ticket-error').hidden = true;
        try {
          const r = await callServer('apiHelpdeskRegistrarEnTickets', state.token, d.ID, CamposHoja.recolectar(CAMPOS_TICKET, 'hd-ticket'));
          invalidarCacheLista('apiListarTicketsResumen', state.token);
          Notificar.exito('Registrado en Tickets (' + r.ID + ')');
          cerrarRegistro();
          HD_REGISTRO.set(d.ID, r.ID);
          pintarLista();   // en "Por registrar" sale de la lista
          if (bandejaActual().porRegistrar) pintarBandejas();
          if (abierto === d.ID && $('hd-btn-registrar')) {
            $('hd-btn-registrar').hidden = true;
            $('hd-registrado').textContent = 'Ya está en Tickets (' + r.ID + ')';
            $('hd-registrado').hidden = false;
          }
        } catch (err) {
          $('hd-ticket-error').textContent = err.message;
          $('hd-ticket-error').hidden = false;
        } finally {
          btn.disabled = false;
        }
      };
    }

    // ---------- atajos y barra
    const modalAtajos = $('hd-modal-atajos');
    $('hd-btn-atajos').addEventListener('click', () => { modalAtajos.hidden = false; });
    $('hd-atajos-cerrar').addEventListener('click', () => { modalAtajos.hidden = true; });
    modalAtajos.addEventListener('click', (ev) => { if (ev.target === modalAtajos) modalAtajos.hidden = true; });
    // Actualizar también vuelve a preguntar qué ya está en Tickets (alguien más pudo registrar)
    const actualizar = () => { HD_DETALLES.clear(); HD_REGISTRO.clear(); HD_CONTEXTO.clear(); cargar(true); };
    $('hd-btn-actualizar').addEventListener('click', actualizar);

    function mover(paso) {
      const filas = visibles();
      if (!filas.length) return;
      const i = filas.findIndex((t) => t.ID === abierto);
      const j = i === -1 ? 0 : Math.min(filas.length - 1, Math.max(0, i + paso));
      abrir(filas[j].ID, 450);
    }
    // Un solo escuchador para toda la sesión: solo actúa mientras la Bandeja está montada
    helpdeskTeclas = (ev) => {
      if (!document.getElementById('hd-app')) return;
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (ev.key === 'Escape') {
        if (!modalAtajos.hidden) { modalAtajos.hidden = true; return; }
        if (!modalRegistro.hidden) return;
        app.dataset.panel = 'lista';
        return;
      }
      const escribiendo = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target && ev.target.tagName) || '') || (ev.target && ev.target.isContentEditable);
      if (escribiendo || !modalRegistro.hidden) return;
      const k = ev.key.toLowerCase();
      if (k === 'j') { ev.preventDefault(); mover(1); }
      else if (k === 'k') { ev.preventDefault(); mover(-1); }
      else if (k === '/') { ev.preventDefault(); buscar.focus(); buscar.select(); }
      else if (k === 'r') { ev.preventDefault(); actualizar(); }
      else if (k === 'f') { ev.preventDefault(); verFormulario(); }
      else if (/^[1-9]$/.test(k) && HD_BANDEJAS[Number(k) - 1]) { ev.preventDefault(); elegirBandeja(HD_BANDEJAS[Number(k) - 1].id); }
      else if (k === '?') { ev.preventDefault(); modalAtajos.hidden = false; }
    };
    if (!helpdeskTeclasPuesto) {
      document.addEventListener('keydown', (ev) => helpdeskTeclas && helpdeskTeclas(ev));
      helpdeskTeclasPuesto = true;
    }

    // ---------- arrancar
    function sinConexion() {
      $('hd-cuerpo').hidden = true;
      $('hd-sin-conexion').hidden = false;
    }
    $('hd-ticket').innerHTML = '<div class="hd-vacio"><div><i data-lucide="inbox" class="ico"></i><h3>Elige un ticket</h3>' +
      '<p>Usa <strong>J</strong> / <strong>K</strong> para moverte entre tickets y <strong>/</strong> para buscar.</p></div></div>';
    pintarBandejas();
    let est;
    try { est = await helpdeskEstado(); } catch (err) { est = null; }
    if (!est || !est.conectado) return sinConexion();
    // Qué formularios se registran en Tickets (catálogo nuestro, guardado en el navegador): antes
    // de la lista, para que sus etiquetas y "Por registrar" salgan desde la primera pintada
    if (veTickets && !hdFormulariosDeTickets) {
      try {
        const formularios = await callServerCacheado('apiHelpdeskCatalogo', state.token);
        hdFormulariosDeTickets = new Set(formularios.filter((f) => f.modulo === 'tickets').map((f) => f.id));
        pintarBandejas();
      } catch (err) { /* sin etiquetas ni "Por registrar": la Bandeja sigue */ }
    }
    // El catálogo (colores, filtros) llega una vez por hora; no detiene la lista
    callServer('apiHelpdeskFiltros', state.token).then((c) => { catalogo = c || catalogo; pintarBandejas(); if (lista.length) pintarLista(); })
      .catch((err) => Notificar.error('No se pudieron cargar los filtros del helpdesk: ' + err.message));
    cargar(false);
  }
  let helpdeskTeclas = null;
  let helpdeskTeclasPuesto = false;

  // =========================================================================== Conexión
  async function initHelpdeskConexion() {
    const $ = (id) => document.getElementById(id);
    $('hd-marcador').textContent = HELPDESK_MARCADOR;
    $('hd-copiar-marcador').addEventListener('click', async () => {
      if (await copiarEnlace_(HELPDESK_MARCADOR)) Notificar.exito('Marcador copiado: pégalo en la URL del marcador nuevo');
      else Notificar.error('El navegador no dejó copiar: selecciona el texto y cópialo');
    });
    $('hd-ir-bandeja').addEventListener('click', () => navegarA('helpdesk', 'Bandeja'));

    function mostrar(est) {
      $('hd-cargando').hidden = true;
      const conectado = !!(est && est.conectado);
      $('hd-conectar').hidden = conectado;
      $('hd-conectado').hidden = !conectado;
      if (!conectado) return;
      $('hd-yo').innerHTML = Avatar.html(state.sesion.correo, est.nombre || state.sesion.nombre, { tam: 44 });
      $('hd-quien').textContent = est.nombre || '';
      const vence = est.vence ? new Date(est.vence) : null;
      $('hd-vence').textContent = vence && !isNaN(vence) ? 'Tu sesión del helpdesk vence ' + vence.toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    }
    $('hd-form-conectar').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const error = $('hd-conectar-error');
      error.hidden = true;
      const btn = $('hd-btn-conectar');
      btn.disabled = true;
      try {
        const r = await callServer('apiHelpdeskConectar', state.token, $('hd-token').value);
        $('hd-token').value = '';
        HD_DETALLES.clear();
        Notificar.exito('Conectado al helpdesk');
        mostrar(r);
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
    $('hd-btn-desconectar').addEventListener('click', async () => {
      try {
        await callServer('apiHelpdeskDesconectar', state.token);
        HD_DETALLES.clear(); HD_FORMULARIOS.clear(); HD_ARCHIVOS.clear();
        mostrar({ conectado: false });
      } catch (err) {
        Notificar.error('No se pudo desconectar: ' + err.message);
      }
    });
    try {
      mostrar(await helpdeskEstado());
    } catch (err) {
      $('hd-cargando').innerHTML = '<p class="empty-state">No se pudo revisar la conexión: ' + escaparHtml(err.message) + '</p>';
    }
  }

  // =========================================================================== Registrados
  async function initHelpdeskRegistrados() {
    const tabla = DataTable.crear(document.getElementById('hd-guardados'), {
      idCampo: 'ID',
      idTabla: 'helpdesk-guardados',
      ordenInicial: { campo: 'FECHA CREACION', dir: 'desc' },
      textoVacio: 'Todavía no se ha guardado ningún ticket del helpdesk',
      exportar: { nombreArchivo: 'Help Desk registrados' },
      etiquetaFila: (t) => '#' + t['ID TICKET HD'],
      columnas: [
        { campo: 'ID TICKET HD', titulo: '#', tipo: 'numero', fijada: true },
        { campo: 'TITULO', titulo: 'Título', tipo: 'texto' },
        { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista' },
        { campo: 'PRIORIDAD', titulo: 'Prioridad', tipo: 'lista' },
        { campo: 'SOLICITANTE', titulo: 'Solicitante', tipo: 'texto' },
        { campo: 'AREA DESTINO', titulo: 'Área', tipo: 'lista' },
        { campo: 'FORMULARIO', titulo: 'Formulario', tipo: 'lista' },
        { campo: 'FECHA CREACION', titulo: 'Creado', tipo: 'fecha' },
        { campo: 'FECHA CIERRE', titulo: 'Cerrado', tipo: 'fecha' },
        { campo: 'ID TICKET CI', titulo: 'En Tickets', tipo: 'texto' },
        { campo: 'ACTUALIZADO', titulo: 'Actualizado', tipo: 'fecha', visible: false },
        { campo: 'ACTUALIZADO POR', titulo: 'Visto por', tipo: 'lista', visible: false },
      ],
    });
    tabla.setCargando(true);
    try {
      tabla.setDatos(JSON.parse(await callServer('apiHelpdeskGuardados', state.token)));
    } catch (err) {
      tabla.setError(err.message);
    }
  }

  // =========================================================================== Formularios
  async function initHelpdeskFormularios() {
    const $ = (id) => document.getElementById(id);
    const e = escaparHtml;
    let formularios = [];
    let elegido = null;
    const TIPOS = { select: 'Lista', text: 'Texto', multiline: 'Texto largo', date: 'Fecha', number: 'Número', decimal: 'Número', check: 'Casilla' };

    function pintarLista() {
      const q = $('hd-form-buscar').value.trim().toLowerCase();
      const coincide = (f) => !q || f.nombre.toLowerCase().indexOf(q) !== -1 || String(f.id) === q ||
        f.campos.some((c) => c.etiqueta.toLowerCase().indexOf(q) !== -1);
      const filtrados = formularios.filter(coincide);
      $('hd-form-items').innerHTML = filtrados.length ? filtrados.map((f) =>
        `<button type="button" class="hd-form-item${f.id === elegido ? ' activa' : ''}" data-form="${f.id}"><span>${e(f.nombre)}</span><small>#${f.id}</small></button>`).join('')
        : '<p class="empty-state">Nada coincide</p>';
    }
    function pintarDetalle() {
      const f = formularios.find((x) => x.id === elegido);
      if (!f) return;
      $('hd-form-detalle').innerHTML = `
        <div class="hd-t-folio">Formulario #${f.id}</div>
        <h3 style="margin:2px 0 8px">${e(f.nombre)}</h3>
        <p style="margin:0 0 12px">${f.modulo
          ? '<span class="hd-modulo"><i data-lucide="link" class="ico"></i> En la app: ' + e(f.moduloEtiqueta) + '</span>'
          : '<span class="form-ayuda">No corresponde a ningún módulo de la app.</span>'}</p>
        <div class="hd-lado-titulo">${f.campos.length} ${f.campos.length === 1 ? 'campo' : 'campos'}</div>
        ${f.campos.length ? f.campos.map((c) => `
          <div class="hd-form-campo">
            <div class="hd-form-campo-cabeza"><strong>${e(c.etiqueta)}</strong><small>${e(TIPOS[c.tipo] || c.tipo)}</small></div>
            ${c.opciones.length ? '<div class="hd-opciones">' + c.opciones.map((o) => '<span class="hd-opcion">' + e(o) + '</span>').join('') + '</div>'
              : (c.tipo === 'select' ? '<div class="form-ayuda">Sus opciones las da el helpdesk en cada ticket.</div>' : '')}
          </div>`).join('') : '<p class="empty-state">Solo título y descripción: no pide campos propios.</p>'}`;
      refreshIcons();
    }
    $('hd-form-items').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-form]');
      if (!b) return;
      elegido = Number(b.dataset.form);
      pintarLista();
      pintarDetalle();
    });
    $('hd-form-buscar').addEventListener('input', pintarLista);
    try {
      formularios = await callServerCacheado('apiHelpdeskCatalogo', state.token);
      elegido = formularios.length ? formularios[0].id : null;
      pintarLista();
      pintarDetalle();
    } catch (err) {
      $('hd-form-items').innerHTML = '<p class="empty-state">' + e(err.message) + '</p>';
    }
  }
</script>
