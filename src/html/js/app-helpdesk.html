<script>
  /**
   * app-helpdesk.html — Help Desk: los tickets del helpdesk de TI que la cuenta de cada persona ve
   * allá (todos tienen acceso). El servidor habla con el helpdesk (HelpdeskApi.gs, con límites
   * para no saturarlo) y guarda solo una copia de lo que llega (APP_HELPDESK, HelpdeskService.gs).
   * Desde aquí NO se cambia nada allá: ni siquiera se marca un ticket como leído.
   *
   * Lo que se pinta del helpdesk va SIEMPRE con escaparHtml: los mensajes ya llegan como texto
   * plano (el servidor les quita el HTML), pero títulos y nombres los escribe cualquiera.
   */

  // El marcador que copia el token del helpdesk (lo guarda su página en localStorage, llave
  // "token"). Sin "//" literal: ver el bug de Apps Script en CLAUDE.md.
  const HELPDESK_MARCADOR = "javascript:(()=>{const t=localStorage.getItem('token');if(!t){alert('Primero inicia sesión en el helpdesk');return;}" +
    "navigator.clipboard.writeText(t).then(()=>alert('Token copiado: pégalo en Control Interno'),()=>prompt('Copia tu token:',t));})()";
  const HELPDESK_PAGINA = 'https:\/\/helpdesk-maderas.gphsis.com/tickets';
  // Una placa en el título ("RIFTER UNU794H | Fundaciones"), para sugerirla al registrar
  const PLACA_EN_TEXTO = /\b[A-Z]{3}[0-9]{3,4}[A-Z]?\b/;

  async function initHelpdesk() {
    const $ = (id) => document.getElementById(id);
    wireTabsSimple($('view-container'));
    const puedeVerGuardados = !!permisoDe('tickets');
    const puedeRegistrar = puedeEditarModulo('tickets');
    $('hd-tab-guardados').hidden = !puedeVerGuardados;

    const filtros = { estatus: [], grupos: [], formularios: [], prioridades: [] };
    let catalogo = { estatus: [], prioridades: [], formularios: [], grupos: [] };
    let abierto = null;   // el ticket del detalle

    const colorDe = (lista, nombre) => ((lista || []).find((x) => x.nombre === nombre) || {}).color || '';
    const badgeEstatus = (v) => {
      const c = colorDe(catalogo.estatus, v);
      return v ? `<span class="badge-estado" style="${c ? 'background:' + c + '22;color:' + c : ''}">${escaparHtml(v)}</span>` : '—';
    };
    const puntoPrioridad = (v) => {
      const c = colorDe(catalogo.prioridades, v);
      return v ? `<span class="hd-punto" style="${c ? 'background:' + c : ''}"></span>${escaparHtml(v)}` : '—';
    };
    const fechaHora = (iso) => {
      const f = iso ? new Date(iso) : null;
      return f && !isNaN(f) ? f.toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
    };

    // ----- Conectar -----
    $('hd-marcador').textContent = HELPDESK_MARCADOR;
    $('hd-copiar-marcador').addEventListener('click', async () => {
      if (await copiarEnlace_(HELPDESK_MARCADOR)) Notificar.exito('Marcador copiado: pégalo en la URL del marcador nuevo');
      else Notificar.error('El navegador no dejó copiar: selecciona el texto y cópialo');
    });

    function mostrar(estado) {
      $('hd-cargando').hidden = true;
      const conectado = !!(estado && estado.conectado);
      $('hd-conectar').hidden = conectado;
      $('hd-conectado').hidden = !conectado;
      if (!conectado) return;
      $('hd-quien').textContent = estado.nombre || '';
      $('hd-vence').textContent = estado.vence ? 'Tu sesión del helpdesk vence ' + fechaHora(estado.vence) : '';
      arrancar();
    }

    async function revisar() {
      try {
        mostrar(await callServer('apiHelpdeskEstado', state.token));
      } catch (err) {
        $('hd-cargando').innerHTML = '<p class="empty-state">No se pudo revisar la conexión: ' + escaparHtml(err.message) + '</p>';
      }
    }

    $('hd-form-conectar').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const error = $('hd-conectar-error');
      error.hidden = true;
      const btn = $('hd-btn-conectar');
      btn.disabled = true;
      try {
        const r = await callServer('apiHelpdeskConectar', state.token, $('hd-token').value);
        $('hd-token').value = '';
        Notificar.exito('Conectado al helpdesk');
        mostrar(r);
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });

    $('hd-btn-desconectar').addEventListener('click', async () => {
      try {
        await callServer('apiHelpdeskDesconectar', state.token);
        tabla.setDatos([]);
        mostrar({ conectado: false });
      } catch (err) {
        Notificar.error('No se pudo desconectar: ' + err.message);
      }
    });
    $('hd-btn-actualizar').addEventListener('click', () => cargar(true));

    // ----- Filtros -----
    function pintarEstatus() {
      const activo = filtros.estatus[0];
      const chip = (id, nombre, color) => `<button type="button" class="kpi-chip hd-chip-color${activo === id ? ' activo' : ''}" data-estatus="${id || ''}"
          style="${color ? 'border-left-color:' + color : ''}"><span class="kpi-chip-label">${escaparHtml(nombre)}</span></button>`;
      $('hd-estatus').innerHTML = chip(undefined, 'Todos') + catalogo.estatus.map((s) => chip(s.id, s.nombre, s.color)).join('');
      $('hd-estatus').querySelectorAll('[data-estatus]').forEach((b) => b.addEventListener('click', () => {
        filtros.estatus = b.dataset.estatus ? [Number(b.dataset.estatus)] : [];
        pintarEstatus();
        cargar(false);
      }));
    }
    function llenarSelect(id, lista, campo) {
      const sel = $(id);
      sel.innerHTML = sel.options[0].outerHTML + lista.map((x) => `<option value="${x.id}">${escaparHtml(x.nombre)}</option>`).join('');
      sel.onchange = () => { filtros[campo] = sel.value ? [Number(sel.value)] : []; cargar(false); };
    }

    // ----- Lista -----
    const tabla = DataTable.crear($('hd-tabla'), {
      idCampo: 'ID',
      idTabla: 'helpdesk',
      ordenInicial: { campo: 'FECHA_CREACION', dir: 'desc' },
      textoVacio: 'El helpdesk no tiene tickets con estos filtros',
      ayuda: 'Lo mismo que tu cuenta ve en el helpdesk de TI. El helpdesk manda los 25 más recientes de cada ' +
        'filtro: usa los estatus, el grupo o el formulario para ver otros. Doble clic (o tocar) abre el ticket.',
      exportar: { nombreArchivo: 'Help Desk' },
      etiquetaFila: (t) => '#' + t.ID + ' ' + t.TITULO,
      detalle: false,
      // Como las demás tablas: clic selecciona, doble clic (o tocar) abre; una a la vez (no hay acciones masivas)
      modoSeleccion: true,
      seleccionDrive: true,
      seleccionUnica: true,
      alAbrirFila: (t) => abrirDetalle(t),
      alTocarFila: (t) => abrirDetalle(t),
      accionesFila: [{ icono: 'ver', titulo: 'Ver ticket', alHacer: (t) => abrirDetalle(t) }],
      columnas: [
        { campo: 'ID', titulo: '#', tipo: 'numero', fijada: true },
        { campo: 'TITULO', titulo: 'Título', tipo: 'texto' },
        { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista', render: (v) => badgeEstatus(v) },
        { campo: 'PRIORIDAD', titulo: 'Prioridad', tipo: 'lista', render: (v) => puntoPrioridad(v) },
        { campo: 'SOLICITANTE', titulo: 'Solicitante', tipo: 'texto' },
        { campo: 'AREA_DESTINO', titulo: 'Área', tipo: 'lista' },
        { campo: 'FORMULARIO', titulo: 'Formulario', tipo: 'lista' },
        { campo: 'FECHA_CREACION', titulo: 'Creado', tipo: 'fecha' },
        { campo: 'SIN_LEER', titulo: 'Sin leer', tipo: 'numero' },
        { campo: 'ULTIMA_RESPUESTA', titulo: 'Última respuesta', tipo: 'texto', visible: false },
        { campo: 'AGENTE', titulo: 'Agente', tipo: 'lista', visible: false },
        { campo: 'GRUPO', titulo: 'Grupo', tipo: 'lista', visible: false },
        { campo: 'FECHA_CIERRE', titulo: 'Cerrado', tipo: 'fecha', visible: false },
        { campo: 'DEPARTAMENTO_SOLICITANTE', titulo: 'Departamento', tipo: 'lista', visible: false },
      ],
    });

    async function cargar(forzar) {
      tabla.setCargando(true);
      try {
        const r = JSON.parse(await callServer('apiHelpdeskTickets', state.token, filtros, !!forzar));
        tabla.setDatos(r.tickets);
        $('hd-resumen').textContent = r.tickets.length < r.total
          ? `Se muestran ${r.tickets.length} de ${r.total}: los más recientes. Filtra para ver otros.`
          : `${r.total} ${r.total === 1 ? 'ticket' : 'tickets'}`;
      } catch (err) {
        tabla.setError(err.message);
        if (/venció|Conecta tu cuenta/.test(err.message)) revisar();
      }
    }

    let arrancado = false;
    async function arrancar() {
      if (arrancado) return cargar(false);
      arrancado = true;
      try {
        catalogo = await callServer('apiHelpdeskFiltros', state.token);
        pintarEstatus();
        llenarSelect('hd-f-grupo', catalogo.grupos, 'grupos');
        llenarSelect('hd-f-formulario', catalogo.formularios, 'formularios');
        llenarSelect('hd-f-prioridad', catalogo.prioridades, 'prioridades');
      } catch (err) {
        Notificar.error('No se pudieron cargar los filtros del helpdesk: ' + err.message);
      }
      await cargar(false);
    }

    // ----- Detalle -----
    const modal = $('hd-modal');
    const cerrarModal = () => { modal.hidden = true; abierto = null; };
    $('hd-modal-cerrar').addEventListener('click', cerrarModal);
    modal.addEventListener('click', (ev) => { if (ev.target === modal) cerrarModal(); });

    const dato = (etiqueta, valorHtml) => `<div class="info-item"><div class="info-label">${etiqueta}</div><div class="info-value">${valorHtml || '—'}</div></div>`;

    async function abrirDetalle(t) {
      abierto = t;
      $('hd-modal-titulo').textContent = '#' + t.ID + ' · ' + t.TITULO;
      $('hd-modal-sub').innerHTML = badgeEstatus(t.ESTATUS);
      $('hd-modal-cuerpo').innerHTML = '<p class="empty-state">Cargando el ticket…</p>';
      $('hd-registrar').hidden = true;
      modal.hidden = false;
      refreshIcons();
      let d;
      try {
        d = JSON.parse(await callServer('apiHelpdeskDetalle', state.token, t.ID));
      } catch (err) {
        if (abierto === t) $('hd-modal-cuerpo').innerHTML = '<p class="empty-state">' + escaparHtml(err.message) + '</p>';
        return;
      }
      if (abierto !== t) return;   // ya abrieron otro
      const e = escaparHtml;
      $('hd-modal-cuerpo').innerHTML =
        '<div class="info-grid">' +
          dato('Estatus', badgeEstatus(d.ESTATUS)) + dato('Prioridad', puntoPrioridad(d.PRIORIDAD)) +
          dato('Solicitante', e(d.SOLICITANTE)) + dato('Correo', e(d.CORREO_SOLICITANTE)) +
          dato('Área del solicitante', e(d.AREA_SOLICITANTE)) + dato('Departamento', e(d.DEPARTAMENTO_SOLICITANTE)) +
          dato('Agente', e(d.AGENTE)) + dato('Grupo', e(d.GRUPO)) +
          dato('Formulario', e(d.FORMULARIO)) + dato('Área destino', e(d.AREA_DESTINO)) +
          dato('Creado', formatearFecha(d.FECHA_CREACION)) + dato('Cerrado', d.FECHA_CIERRE ? fechaHora(d.FECHA_CIERRE) : '') +
          (d.DURACION_DIAS !== '' ? dato('Duración', e(d.DURACION_DIAS) + ' días') : '') +
          '<div class="info-section-title">Descripción</div>' +
          `<div class="info-item" style="grid-column: 1 / -1"><div class="hd-mensaje-texto">${e(d.DESCRIPCION) || '—'}</div></div>` +
        '</div>' +
        `<div class="info-section-title" style="margin-top:16px">Conversación (${d.MENSAJES.length})</div>` +
        '<div class="hd-mensajes">' + (d.MENSAJES.length ? d.MENSAJES.map((m) => `
          <div class="hd-mensaje${m.PRIVADO ? ' privado' : ''}">
            <div class="hd-mensaje-cabeza"><strong>${e(m.AUTOR)}</strong><span>${fechaHora(m.FECHA)}</span>
              ${m.PRIVADO ? '<span>· nota privada</span>' : ''}${m.ADJUNTOS.length ? '<span>· adjuntos: ' + e(m.ADJUNTOS.join(', ')) + '</span>' : ''}</div>
            <div class="hd-mensaje-texto">${e(m.TEXTO) || '<em>(sin texto)</em>'}</div>
          </div>`).join('') : '<p class="empty-state">Sin mensajes todavía</p>') + '</div>' +
        `<p style="margin-top:14px"><a href="${HELPDESK_PAGINA}" target="_blank" rel="noopener">${Iconos.svg('externo')} Abrir en el helpdesk</a></p>`;
      refreshIcons();
      if (puedeRegistrar) prepararRegistro(d);
    }

    // ----- Registrar en Tickets (quien edita Tickets) -----
    async function prepararRegistro(d) {
      $('hd-registrar').hidden = false;
      $('hd-form-ticket').hidden = true;
      $('hd-btn-registrar').hidden = true;
      $('hd-registrado').hidden = true;
      let registrados = {};
      try { registrados = await callServer('apiHelpdeskRegistrados', state.token, [d.ID]); } catch (e) { /* se ofrece igual: el servidor no deja duplicar */ }
      if (abierto && abierto.ID !== d.ID) return;
      if (registrados[d.ID]) {
        $('hd-registrado').textContent = 'Ya está registrado en Tickets (' + registrados[d.ID] + ').';
        $('hd-registrado').hidden = false;
        return;
      }
      $('hd-btn-registrar').hidden = false;
      $('hd-btn-registrar').onclick = () => abrirFormulario(d);
    }

    async function abrirFormulario(d) {
      $('hd-btn-registrar').hidden = true;
      $('hd-campos-ticket').innerHTML = CamposHoja.html(CAMPOS_TICKET, { prefijo: 'hd-ticket' });
      const placa = (String(d.TITULO).toUpperCase().match(PLACA_EN_TEXTO) || [''])[0];
      CamposHoja.poblar(CAMPOS_TICKET, 'hd-ticket', {
        TICKET: String(d.ID), FECHA: d.FECHA_CREACION, DEPARTAMENTO: d.DEPARTAMENTO_SOLICITANTE,
        SOLICITANTE: d.SOLICITANTE, PLACA: placa, COMENTARIO: d.TITULO,
      });
      const numero = document.getElementById('hd-ticket-ticket');
      numero.disabled = true;   // siempre el número del helpdesk (el servidor lo pone igual)
      document.getElementById('hd-ticket-fecha-de-registro').value = new Date().toLocaleDateString('es-MX');
      $('hd-ticket-error').hidden = true;
      $('hd-form-ticket').hidden = false;
      refreshIcons();
      try {
        const [departamentos, solicitantes] = await Promise.all([
          callServerCacheado('apiListarDepartamentos', state.token),
          callServerCacheado('apiListarSolicitantesTickets', state.token),
        ]);
        CamposHoja.llenarOpciones('hd-ticket-departamento', departamentos);
        CamposHoja.llenarOpciones('hd-ticket-solicitante', solicitantes);
      } catch (err) { /* son sugerencias: se puede escribir igual */ }
      $('hd-form-ticket').onsubmit = async (ev) => {
        ev.preventDefault();
        const btn = $('hd-btn-guardar-ticket');
        btn.disabled = true;
        $('hd-ticket-error').hidden = true;
        try {
          const r = await callServer('apiHelpdeskRegistrarEnTickets', state.token, d.ID, CamposHoja.recolectar(CAMPOS_TICKET, 'hd-ticket'));
          invalidarCacheLista('apiListarTicketsResumen', state.token);
          Notificar.exito('Registrado en Tickets (' + r.ID + ')');
          $('hd-form-ticket').hidden = true;
          $('hd-registrado').textContent = 'Registrado en Tickets (' + r.ID + ').';
          $('hd-registrado').hidden = false;
        } catch (err) {
          $('hd-ticket-error').textContent = err.message;
          $('hd-ticket-error').hidden = false;
        } finally {
          btn.disabled = false;
        }
      };
    }

    // ----- Guardados (la copia; quien puede leer Tickets) -----
    let guardadosTabla = null;
    document.querySelector('#hd-tabs [data-tab="guardados"]').addEventListener('click', async () => {
      if (!puedeVerGuardados) return;
      if (!guardadosTabla) {
        guardadosTabla = DataTable.crear($('hd-guardados'), {
          idCampo: 'ID',
          idTabla: 'helpdesk-guardados',
          ordenInicial: { campo: 'FECHA CREACION', dir: 'desc' },
          textoVacio: 'Todavía no se ha guardado ningún ticket del helpdesk',
          exportar: { nombreArchivo: 'Help Desk guardados' },
          etiquetaFila: (t) => '#' + t['ID TICKET HD'],
          columnas: [
            { campo: 'ID TICKET HD', titulo: '#', tipo: 'numero', fijada: true },
            { campo: 'TITULO', titulo: 'Título', tipo: 'texto' },
            { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista' },
            { campo: 'PRIORIDAD', titulo: 'Prioridad', tipo: 'lista' },
            { campo: 'SOLICITANTE', titulo: 'Solicitante', tipo: 'texto' },
            { campo: 'AREA DESTINO', titulo: 'Área', tipo: 'lista' },
            { campo: 'FORMULARIO', titulo: 'Formulario', tipo: 'lista' },
            { campo: 'FECHA CREACION', titulo: 'Creado', tipo: 'fecha' },
            { campo: 'FECHA CIERRE', titulo: 'Cerrado', tipo: 'fecha' },
            { campo: 'ID TICKET CI', titulo: 'En Tickets', tipo: 'texto' },
            { campo: 'ACTUALIZADO', titulo: 'Actualizado', tipo: 'fecha', visible: false },
            { campo: 'ACTUALIZADO POR', titulo: 'Visto por', tipo: 'lista', visible: false },
          ],
        });
      }
      guardadosTabla.setCargando(true);
      try {
        guardadosTabla.setDatos(JSON.parse(await callServer('apiHelpdeskGuardados', state.token)));
      } catch (err) {
        guardadosTabla.setError(err.message);
      }
    });

    revisar();
  }

  const AYUDA_HELPDESK = [
    { pregunta: '¿Qué es esta pantalla?', respuesta: 'Los tickets del helpdesk de TI que tu cuenta ve allá, para consultarlos sin salir del sistema -- nada se marca como leído ni cambia en el helpdesk real.' },
    { pregunta: '¿Cómo conecto mi cuenta?', respuesta: 'Copia el marcador con el botón, agrégalo como favorito del navegador, entra al helpdesk con tu cuenta y dale clic al marcador -- copia tu token. Pégalo aquí y conecta.' },
    { pregunta: '¿Cada cuándo hay que reconectar?', respuesta: 'Tu sesión dura 24 horas -- pasado ese tiempo, repite el paso 2 (clic al marcador) para sacar un token nuevo.' },
    { pregunta: '¿Puedo marcar un ticket como leído desde aquí?', respuesta: 'No -- esta pantalla solo consulta. Lo que sí puedes hacer es "Registrar en Tickets" para darle seguimiento dentro del sistema.' },
    { pregunta: '¿Qué es la pestaña "Guardados"?', respuesta: 'Una copia que el sistema guarda solo de los tickets que ya se han visto aquí (sin las conversaciones) -- útil si el helpdesk tarda en responder.' },
  ];
</script>
