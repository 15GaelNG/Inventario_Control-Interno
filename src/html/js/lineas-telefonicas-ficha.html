<script>
  /**
   * lineas-telefonicas-ficha.html — Líneas Telefónicas: la ficha de un equipo o una línea: abrir, migas, pestañas, General, encabezado y el menú ⋮.
   * Parte de initTelefonicas (fase 6.2b, tools/lineas/partir-telefonicas.js), que la monta: lo del arranque sale de T y
   * lo de otras partes, de T.de('parte') (se busca al llamar). Lo que publica es lo que usan las demás.
   */
  (function () {
    'use strict';
    const { $, TIPO_EQUIPO, abrirUltimoDesdeMenu, bloqueadoDG, cargarPatronesAppSheet, chip, enlaceDrive, esc, fecha,
      formatoAppSheet, guion, ico, icono, llamar, memoria, mensajeError, menuFlotante, miles, porcentaje,
      precargarUltimosNucos, puedeOperar, quitarDelPanel, vacio, veDocumentos, veHistorial, veSeccion, vistaPatron } = Lineas.comun;
    const { tieneNuco } = Lineas.telefonicas.comun;
    Lineas.telefonicas.registrar('ficha', (T) => {
      const { COLOR_ORIGEN_DOCUMENTO, ETIQUETA_DOCUMENTO, ORIGEN_DOCUMENTO, conDocumentos, mandaResguardo, pasoHistorial, pila,
        pintarIndicadores, pintarListado, raiz, resumenDocumentos, vigente } = T;
      const { pilaParaHistorial } = T.de('principal');
      const { cargarEvidencias, ponerCopiarTarjetas, soltarDocumentos } = T.de('documentos');
      const { abrirCancelacion, abrirResguardo, abrirVinculo, filaDelIndice, trasQuitar } = T.de('acciones');
      const { abrirEditor } = T.de('captura');
      const { cargarHistorial, soltarHistorial } = T.de('historial');
      const { pintarInspeccion, pintarResponsiva } = T.de('paginas');

      let fichaActual = null; // la ficha abierta (su carpeta de Drive, para el ⋮)

      // ---- Detalle ----
      function abrir(tipo, id, sinApilar, sinHistorial) {
        if (!sinApilar) {
          const existente = pila.findIndex((p) => p.tipo === tipo && p.id === id);
          if (existente >= 0) pila.splice(existente + 1);
          else pila.push({ tipo: tipo, id: id, etiqueta: ETIQUETA_DOCUMENTO[tipo] || null });
        }
        if (!sinHistorial) pasoHistorial();
        $('#ln-listado', raiz).hidden = true;
        soltarHistorial();
        soltarDocumentos();
        const detalle = $('#ln-detalle', raiz);
        detalle.hidden = false;
        detalle.innerHTML = migas() + '<div class="card ln-cargando"><span class="ln-spinner"></span> Cargando…</div>';
        if (tipo === 'inspeccion' || tipo === 'responsiva') pintarDocumentoPrevio(detalle, tipo, id);
        document.getElementById('view-container').scrollTop = 0;
        window.scrollTo(0, 0);
        const pintar = { equipo: pintarEquipo, linea: pintarLinea, inspeccion: pintarInspeccion, responsiva: pintarResponsiva }[tipo];
        pintar(detalle, id).catch((e) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== tipo || pila[pila.length - 1].id !== id) return;
          detalle.innerHTML = migas() + '<div class="card"><p class="error-msg">No se pudo cargar: ' + mensajeError(e) + '</p></div>';
        });
      }

      // ---- Página de una inspección o responsiva: al instante con lo que ya trajo la ficha (usuario, 9-oct: «Detalles» o
      // el PDF salían antes que la página). La fila de Documentos ya tiene fecha, responsable, inspector, calificación y
      // PDF: se pintan de inmediato y lo demás llega del servidor. Al seleccionar la fila, el documento se pide antes.
      const precargasDocumento = {};
      const API_DOCUMENTO = { inspeccion: 'apiLineasInspeccion', responsiva: 'apiLineasResponsiva' };
      const PRECARGA_DOCUMENTO_MS = 60000;
      function precargarDocumento(tipo, id) {
        const k = tipo + '|' + id;
        const p = precargasDocumento[k];
        if (p && Date.now() - p.ts < PRECARGA_DOCUMENTO_MS) return;
        const promesa = llamar(API_DOCUMENTO[tipo], id);
        promesa.catch(() => { delete precargasDocumento[k]; });
        precargasDocumento[k] = { promesa: promesa, ts: Date.now() };
      }
      /** La precarga se usa una sola vez: después de un cambio (fotos, PDF) la página se vuelve a pedir completa. */
      function pedirDocumento(tipo, id) {
        const k = tipo + '|' + id;
        const p = precargasDocumento[k];
        delete precargasDocumento[k];
        return p && Date.now() - p.ts < PRECARGA_DOCUMENTO_MS ? p.promesa : llamar(API_DOCUMENTO[tipo], id);
      }
      function pintarDocumentoPrevio(detalle, tipo, id) {
        const d = resumenDocumentos[tipo + '|' + id];
        if (!d) return;
        const esInspeccion = tipo === 'inspeccion';
        pila[pila.length - 1].etiqueta = ETIQUETA_DOCUMENTO[tipo] + (fecha(d.fecha) ? ' ' + fecha(d.fecha) : '');
        detalle.innerHTML = migas() +
          encabezado(esInspeccion ? 'clipboard-check' : 'signature', ETIQUETA_DOCUMENTO[tipo] + ' ' + esc(fecha(d.fecha) || ''),
            chip(ORIGEN_DOCUMENTO[d.origen] || d.origen, COLOR_ORIGEN_DOCUMENTO[ORIGEN_DOCUMENTO[d.origen]] || 'neutro'),
            d.pdfId ? enlaceDrive(d.pdfId, 'Ver PDF', true) : '',
            esInspeccion
              ? [['Responsable', d.responsable], ['Inspector', d.inspector], ['Calificación', porcentaje(d.calificacion)], ['Fotos', miles(d.fotos || 0)]]
              : [['Responsable', d.responsable], ['Control Interno', d.inspector]]) +
          '<div class="card ln-cargando"><span class="ln-spinner"></span> Cargando…</div>';
      }

      /** Abre un registro sabiendo solo su ID (equipo si existe como equipo; si no, línea). */
      function abrirRegistro(id) {
        const esEquipo = memoria.indice.equipos.some((e) => e.id === id);
        abrir(esEquipo ? 'equipo' : 'linea', id);
      }

      function volver() {
        pila.pop();
        const anterior = pila[pila.length - 1];
        if (anterior) abrir(anterior.tipo, anterior.id, true);
        else cerrarDetalle();
      }

      function cerrarDetalle(sinHistorial) {
        if (sinHistorial !== true && typeof HistorialApp !== 'undefined') HistorialApp.paso(null);
        soltarHistorial();
        soltarDocumentos();
        pila.length = 0;
        $('#ln-detalle', raiz).hidden = true;
        $('#ln-detalle', raiz).innerHTML = '';
        $('#ln-listado', raiz).hidden = false;
        // Refleja altas y ediciones hechas desde la ficha (el índice ya se recargó al guardar)
        if (memoria.indice) { pintarIndicadores(); pintarListado(); }
      }

      /**
       * Migas: Líneas Telefónicas › NUCO 0008 › Línea 4421155221 › Inspección 18 ago 2026. Cada nivel se nombra por lo que
       * ES (un equipo por su NUCO, una línea por su número, una inspección por su fecha), la página actual va en negritas
       * y los anteriores son enlaces discretos. "Volver" dice a dónde regresa. En celular solo se ven Volver y la actual.
       */
      const ETIQUETA_MIGA = { equipo: 'Equipo', linea: 'Línea', inspeccion: 'Inspección', responsiva: 'Responsiva' };
      const etiquetaMiga = (p) => (p ? p.etiqueta || ETIQUETA_MIGA[p.tipo] : 'Líneas telefónicas');
      function migas() {
        const anterior = pila.length > 1 ? pila[pila.length - 2] : null;
        return Ficha.migas({
          volver: { texto: 'Volver a ' + etiquetaMiga(anterior), titulo: 'Volver a ' + etiquetaMiga(anterior), atributos: 'data-ln-volver' },
          ruta: [{ texto: 'Líneas telefónicas', atributos: 'data-ln-lista' }]
            .concat(pila.slice(0, -1).map((p, i) => ({ texto: etiquetaMiga(p), atributos: 'data-ln-miga="' + i + '"' }))),
          actual: pila.length ? etiquetaMiga(pila[pila.length - 1]) : '',
        });
      }

      function campos(pares) {
        return '<dl class="ln-campos">' + pares.filter(Boolean).map((p) =>
          '<dt>' + esc(p[0]) + '</dt><dd>' + (p[2] ? (p[1] || vacio) : guion(p[1])) + '</dd>').join('') + '</dl>';
      }

      function tarjeta(titulo, cuerpo, clase) {
        return '<div class="card ln-card ' + (clase || '') + '"><h3>' + titulo + '</h3>' + cuerpo + '</div>';
      }

      // ---- Pestaña General (usuario, 13-oct): Línea, Cuenta, Plan y Facturación, con lo que dice el proveedor ----
      const MESES_LARGOS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      /** «Septiembre 2026»: el mes del corte (los periodos se nombran por mes, no por día). */
      function mesDe(iso) {
        const d = iso ? new Date(iso) : null;
        if (!d || isNaN(d)) return '';
        const m = MESES_LARGOS[d.getMonth()];
        return m.charAt(0).toUpperCase() + m.slice(1) + ' ' + d.getFullYear();
      }
      // El signo va antes del $: «-$7.74», no «$-7.74» (nota de crédito; prueba en /dev del 14-oct)
      const dinero = (n, centavos) => Formato.moneda(n, { centavos: centavos ? true : 'siTiene' });
      /** «$29.22 de menos» / «$51.00 de más» / «Igual», con su color. */
      function diferenciaTexto(d) {
        if (d === null || d === undefined) return vacio;
        if (Math.abs(d) <= 0.01) return '<span class="ln-dif-igual">Igual</span>';
        return '<span class="' + (d > 0 ? 'ln-dif-mas' : 'ln-dif-menos') + '">' + esc(dinero(Math.abs(d), true)) + (d > 0 ? ' de más' : ' de menos') + '</span>';
      }
      const sinUso = (f) => !f.minutos && !f.mensajes && !f.datosMb;
      function usoTexto(f) {
        if (sinUso(f)) return '<span class="ln-chip ambar">Sin uso</span>';
        const gb = (Number(f.datosMb) || 0) / 1024;
        return esc(miles(f.minutos) + ' min · ' + miles(f.mensajes) + ' mensajes · ' + Formato.miles(gb, { decimales: 1 }) + ' GB');
      }
      /** De dónde salió el plan, en palabras. Lo que vino del AppSheet o se capturó a mano también se dice. */
      function origenPlan(l) {
        const fuente = String(l.fuentePlan || '').toUpperCase();
        if (l.origenPlan) return l.origenPlan;
        if (fuente === 'CAPTURA A MANO') return 'Captura a mano';
        if (fuente.indexOf('INVENTARIO') === 0) return 'Inventario, sin confirmar con el proveedor';
        return '';
      }
      function pieOrigen(texto, confirmado) {
        return texto ? '<div class="ln-card-pie">' + icono(confirmado ? 'circle-check' : 'circle-help') + ' ' + esc(texto) + '</div>' : '';
      }
      /** Barra de la vida del plan: cuánto lleva de su plazo y cuánto le falta, o hace cuánto venció. */
      function vidaPlan(l) {
        const ini = l.inicioPlan ? new Date(l.inicioPlan) : null;
        const fin = l.finPlan ? new Date(l.finPlan) : null;
        if (!fin || isNaN(fin)) return '';
        const hoy = new Date();
        const meses = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
        const total = ini && !isNaN(ini) ? Math.max(1, meses(ini, fin)) : null;
        const llevados = total ? Math.min(total, Math.max(0, meses(ini, hoy))) : null;
        const faltan = meses(hoy, fin);
        let clase;
        let texto;
        if (fin < hoy) {
          const n = meses(fin, hoy);
          clase = 'vencido';
          texto = n <= 0 ? 'Venció este mes' : 'Vencido hace ' + n + (n === 1 ? ' mes' : ' meses');
        } else {
          clase = faltan <= 3 ? 'por-vencer' : 'vigente';
          texto = faltan <= 0 ? 'Vence este mes' : 'Faltan ' + faltan + (faltan === 1 ? ' mes' : ' meses');
        }
        const pct = fin < hoy ? 100 : (total ? Math.round(llevados * 100 / total) : 0);
        return '<div class="ln-vida ln-vida-' + clase + '"><div class="ln-vida-barra"><span style="width:' + pct + '%"></span></div>' +
          '<div class="ln-vida-texto"><span>' + texto + '</span>' + (total ? '<span class="ln-tenue">' + llevados + ' de ' + total + ' meses</span>' : '') + '</div></div>';
      }
      function tarjetaCuenta(l, corte) {
        return tarjeta(icono('building-2') + ' Cuenta', campos([
          ['Razón social', l.razonSocial],
          ['Cuenta padre', l.cuentaPadre ? '<span class="ln-mono">' + esc(l.cuentaPadre) + '</span>' : '', true],
          l.cuenta ? ['Cuenta', '<span class="ln-mono">' + esc(l.cuenta) + '</span>', true] : null,
          ['Corte', corte ? 'Día ' + corte + ' de cada mes' : ''],
        ]));
      }
      /** `resumen`: en la ficha del equipo, sin el nombre del plan ni su origen. */
      const esSimBasico = (l) => String(l.tipoLinea || '').toUpperCase() === 'SIM BASICO';
      /** Renta del SIM básico (usuario, 14-oct): no tiene adendum; es lo cobrado en su último mes completo. */
      const rentaSimBasico = (facturas) => (facturas || []).filter((f) => f.cobrado > 0 && !f.parcial)[0] || null;
      function tarjetaPlan(l, resumen, facturas) {
        const titulo = icono('file-text') + (resumen ? ' Plan de la línea' : ' Plan');
        if (esSimBasico(l)) {
          const f = rentaSimBasico(facturas);
          if (!f) return tarjeta(titulo, '<p class="empty-state">SIM básico: sin contrato ni plazo.</p>');
          return tarjeta(titulo, campos([['Renta', dinero(f.cobrado, true) + ' al mes'], ['Plazo', 'Sin plazo forzoso']]) +
            (resumen ? '' : pieOrigen(f.origen, true)));
        }
        return tarjeta(titulo, campos([
          resumen ? null : ['Plan', l.plan],
          ['Renta', dinero(l.costoPlan)], ['Inicio de plan', fecha(l.inicioPlan)], ['Fin de plan', fecha(l.finPlan)],
        ]) + vidaPlan(l) + (resumen ? '' : pieOrigen(origenPlan(l), !!l.origenPlan)));
      }
      function tarjetaFacturacion(l, facturas) {
        const lista = facturas || [];
        const f = lista[0];
        const titulo = icono('receipt') + ' Facturación' +
          (f ? '<span class="ln-card-titulo-dato">' + esc(mesDe(f.corte)) + '</span>' : '');
        if (!f) return tarjeta(titulo, '<p class="empty-state">Sin facturas cargadas.</p>');
        // La diferencia es contra el cobro habitual de la línea (usuario, 14-oct; pendiente 1.17); la renta del adendum
        // va en la tarjeta Plan. Sin meses anteriores no hay contra qué comparar
        const conHabitual = (x) => x.habitual !== null && x.habitual !== undefined;
        const meses = lista.map((x) => '<div class="ln-meses-fila"><span>' + esc(mesDe(x.corte).replace(/ \d{4}$/, '')) + '</span><span>' +
          esc(dinero(x.cobrado, true) || '—') + '</span><span>' + (conHabitual(x) ? diferenciaTexto(x.diferencia) : '') +
          (sinUso(x) ? ' <span class="ln-chip ambar">Sin uso</span>' : '') + '</span></div>').join('');
        return tarjeta(titulo, campos([
          ['Cobrado', dinero(f.cobrado, true)],
          conHabitual(f) ? ['Habitual', dinero(f.habitual, true)] : null,
          conHabitual(f) ? ['Diferencia', diferenciaTexto(f.diferencia), true] : null,
          ['Uso', usoTexto(f), true],
          // Parcialidad del equipo que viene en la factura (usuario, 14-oct): ya está dentro de lo cobrado
          f.equipo ? ['Equipo', esc('Parcialidad ' + f.equipo.parcialidad + ' · ' + f.equipo.nombre + ' · ' + dinero(f.equipo.cargo, true)), true] : null,
          f.numero && l.numero && f.numero !== l.numero ? ['Cobrado como', '<span class="ln-mono">' + esc(f.numero) + '</span>', true] : null,
        ]) + '<div class="ln-meses" tabindex="0"><div class="ln-meses-titulo">' + (lista.length === 1 ? 'Último mes' : 'Últimos ' + lista.length + ' meses') +
          icono('chevron-down') + '</div><div class="ln-meses-cuerpo"><div class="ln-meses-fila ln-meses-encabezado"><span>Mes</span><span>Cobrado</span><span>' +
          'Diferencia</span></div>' + meses + '</div></div>' + pieOrigen(f.origen, true));
      }

      function tarjetaResponsable(r, titulo, clase) {
        r = r || {};
        const adicionales = (r.usuariosAdicionales || []).length
          ? '<div class="ln-subtitulo">Responsables adicionales</div>' + campos(r.usuariosAdicionales.map((u) => [u.rol, esc(u.nombre) + (u.noEmpleado ? ' <span class="ln-tenue">· ' + esc(u.noEmpleado) + '</span>' : ''), true]))
          : '';
        return tarjeta(icono('user') + ' ' + esc(titulo || 'Responsable'), campos([
          ['Nombre', (r.nombres && r.nombres.length > 1) ? r.nombres.map(esc).join('<br>') : esc(r.nombre || ''), true],
          r.codigoResguardo ? ['Código de resguardo', r.codigoResguardo] : null,
          ['No. empleado', r.noEmpleado],
          ['Puesto', r.puesto],
          ['Departamento', r.departamento],
          ['Área', r.area],
          ['Sede', r.sede],
          ['Oficina / desarrollo', r.oficina],
          ['Jefe directo', r.jefeDirecto],
          ['Director', r.director],
          // La razón social es de la línea (el contrato), no del responsable: se ve en la tarjeta de la línea
        ]) + adicionales, clase);
      }

      /** TIPO del registro (columna TIPO del AppSheet) con su color e ícono. */
      function tipoRegistro(legado) {
        const t = legado && legado.tipo;
        return t ? formatoAppSheet('LINEAS', 'TIPO', t) || esc(t) : vacio;
      }

      /**
       * Encabezado de la ficha: qué es, su estado, las acciones y un resumen rápido con lo que más se
       * consulta (para revisar un equipo o línea sin bajar por la página).
       */
      function encabezado(ico, titulo, chips, botones, resumen, subtitulo) {
        return Ficha.encabezado({ icono: ico, tituloHtml: titulo, chips: chips, botones: botones, resumen: resumen, subtitulo: subtitulo });
      }

      /**
       * Ficha en pestañas: General (datos), Documentos (inspecciones y responsivas) e Historial. Lo esencial queda
       * arriba y el resto a un toque, en vez de una página larguísima. La pestaña Detalles (el texto del AppSheet para
       * copiar) se quitó el 22-oct (usuario): cada tarjeta de General tiene su botón de copiar
       */
      function pestanasFicha(general, conDocumentos) {
        // Cada pestaña con su sección (Documentos e Historial nunca para un CLIENT: ver veSeccion). conDocumentos = false:
        // Dirección General a quien no es ADMIN, solo General (pendiente 8.20; el servidor tampoco da documentos ni historial)
        const pasado = conDocumentos && veHistorial();
        conDocumentos = conDocumentos && veDocumentos();
        const cargando = '<div class="card ln-card"><p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p></div>';
        // Al regresar a esta ficha (Volver o migas) se abre en la pestaña donde se estaba, no siempre en General
        return Tabs.html([
          { id: 'general', titulo: 'General', icono: 'layout-grid', contenido: general },
          conDocumentos && { id: 'documentos', titulo: 'Documentos', icono: 'folder-check', contenido: '<div id="ln-evidencias">' + cargando + '</div>' },
          pasado && { id: 'historial', titulo: 'Historial', icono: 'history', contenido: '<div id="ln-historial">' + cargando + '</div>' },
        ], { activa: (pila[pila.length - 1] || {}).pestana });
      }

      function mostrarPestanaFicha(nombre) {
        Tabs.mostrar($('#ln-detalle', raiz), nombre);
      }
      function alAbrirPestanaFicha(nombre) {
        if (pila.length) pila[pila.length - 1].pestana = nombre;
        if (typeof HistorialApp !== 'undefined') HistorialApp.actualizar(pilaParaHistorial());
        if (nombre === 'historial' && T.tablaHistorial) T.tablaHistorial.ajustarAlto();
        if (nombre === 'historial' && T.tablaAsignaciones && !$('#ln-asignaciones', raiz).hidden) T.tablaAsignaciones.ajustarAlto();
        if (nombre === 'documentos' && T.tablaDocumentos) T.tablaDocumentos.ajustarAlto();
      }

      const contarEnPestana = (nombre, n) => Tabs.contar($('#ln-detalle', raiz), nombre, n);

      function pintarEquipo(detalle, id) {
        return llamar('apiLineasEquipo', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'equipo' || pila[pila.length - 1].id !== id) return;
          const e = r.equipo;
          const l = r.linea;
          const operarEquipo = puedeOperar() && !bloqueadoDG(e);
          pila[pila.length - 1].etiqueta = 'NUCO ' + (e.nuco || '—');
          const resp = e.responsable || {};
          fichaActual = { id: id, titulo: 'NUCO ' + (e.nuco || '—'), estatusEquipo: e.estatus || '', estatusLinea: null, carpetaDriveId: e.carpetaDriveId || null };
          if (e.nuco && !e._dgOculto) precargarUltimosNucos(id);
          detalle.innerHTML = migas() +
            encabezado('smartphone', 'NUCO ' + esc(e.nuco || '—'),
              chip(e.estatus) + (e.dg ? chip('DG', 'neutro') : '') + chip(TIPO_EQUIPO[e.tipo] || e.tipo, 'neutro') + (l ? chip('Con línea', 'verde') + usoTemporalVencido(l) : chip('Sin línea', 'ambar')),
              botonesFicha('data-equipo-id', id, 'equipo', operarEquipo && conDocumentos('equipo', e.estatus, filaDelIndice('equipo', id).panel), '', true),
              [['Responsable', resp.nombre], ['Modelo', e.modelo], ['IMEI', e.imei],
                ['Línea', l ? '<a href="#" class="ln-enlace ln-mono" data-ln-ir="linea" data-id="' + esc(l._id) + '">' + esc(l.numero || '(sin número)') + '</a>' + (l.compania ? ' · ' + esc(l.compania) : '') : '<span class="ln-tenue">Sin línea</span>', true],
                ['Departamento', resp.departamento]]) +
            pestanasFicha(
              (e._secretosVisibles ? '' : '<div class="ln-nota">' + icono('lock') + ' Los PIN, patrones y contraseñas solo los ven administradores y el área de Líneas.</div>') +
            '<div class="ln-grid-2">' +
              tarjeta(icono('smartphone') + ' Equipo', campos([
                ['Tipo', tipoRegistro(e.legado), true],
                ['Modelo', e.modelo], ['IMEI', e.imei], ['Color', e.color], ['Accesorios', (e.accesorios || []).join(', ')],
                e.tipo !== 'MODEM' && e.tipo !== 'BANDA_ANCHA' && e.tipo !== 'CAMARA' ? ['Cuenta Google', e.cuentaGoogle] : null,
                // PIN EQUIPO = PATRON con patrón guardado: solo la fila «Patrón» (no se repite la palabra, usuario 5-oct)
                (e.tipo === 'CELULAR' || e.tipo === 'CELULAR_BASICO') && !(e.patronRuta && /^PATR[OÓ]N$/i.test(String(e.pinEquipo || '').trim()))
                  ? ['PIN equipo', e.pinEquipo] : null,
                e.patronRuta ? ['Patrón', vistaPatron(e.patronRuta), true] : null,   // sin patrón (ni del AppSheet ni trazado) no se muestra
                e.tipo === 'MODEM' || e.tipo === 'BANDA_ANCHA' ? ['Contraseña módem', e.contrasenaModem] : null,
                // PIN de WhatsApp: del equipo; sin línea no hay (usuario, 8 y 13-oct; pendiente 2.25)
                l ? ['PIN WhatsApp', e.pinWhatsapp] : null,
                e.simResidual ? ['SIM residual', chip(e.simResidual, 'ambar'), true] : null,
              ])) +
              // La línea, resumida en las mismas tarjetas que su ficha (usuario, 13-oct): Línea y Plan. Sin Facturación y con
              // la SIM y la cuenta (usuario, 22-oct): lo cobrado se ve en la ficha de la línea
              tarjeta(icono('card-sim') + ' Línea', l ? campos([
                ['Número', '<a href="#" class="ln-enlace ln-mono ln-accion-enlace" data-ln-ir="linea" data-id="' + esc(l._id) + '">' + esc(l.numero || '(sin número)') + ' ' + icono('chevron-right') + '</a>', true],
                ['Compañía', l.compania], ['SIM', l.sim ? '<span class="ln-mono">' + esc(l.sim) + '</span>' : '', true], ['Estatus', chip(l.estatus), true],
                ['Razón social', l.razonSocial],
                ['Cuenta padre', l.cuentaPadre ? '<span class="ln-mono">' + esc(l.cuentaPadre) + '</span>' : '', true],
                l.cuenta ? ['Cuenta', '<span class="ln-mono">' + esc(l.cuenta) + '</span>', true] : null,
              ]) : '<p class="empty-state">Este equipo no tiene línea asignada.</p>') +
              (l && veSeccion('facturacion') ? tarjetaPlan(l, true, r.facturas) : '') +
              tarjetaResponsable(e.responsable, null, 'ln-card-ancha') +
            '</div>', !e._dgOculto);
          // Dirección General a quien no es ADMIN: sin documentos ni historial (el servidor tampoco los da)
          ponerCopiarTarjetas(detalle);
          if (e._dgOculto) return;
          cargarPatronesAppSheet(detalle);
          cargarEvidencias(id);
          cargarHistorial(id, 'NUCO ' + (e.nuco || id), 'equipo');
        });
      }

      function pintarLinea(detalle, id) {
        return llamar('apiLineasLinea', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'linea' || pila[pila.length - 1].id !== id) return;
          const l = r.linea;
          const e = r.equipo;
          const puedeOperarLinea = puedeOperar() && !bloqueadoDG(l);
          // La miga nombra lo que se está viendo: la línea (antes decía el NUCO de su equipo y confundía)
          pila[pila.length - 1].etiqueta = 'Línea ' + (l.numero || '—');
          const respL = (e ? e.responsable : l.responsable) || {};
          fichaActual = { id: id, titulo: 'Línea ' + (l.numero || '—'), estatusEquipo: null, estatusLinea: l.estatus || '', carpetaDriveId: l.carpetaDriveId || null };
          // Los números que tuvo por un cambio de número, abajo del actual (usuario, 12-oct; antes iban en la tabla)
          const anteriores = (((memoria.indice || {}).lineas || []).filter((x) => x.id === id)[0] || {}).numerosAnteriores;
          detalle.innerHTML = migas() +
            encabezado('card-sim', esc(l.numero || 'Línea sin número'), chip(l.estatus) + (l.dg ? chip('DG', 'neutro') : '') + usoTemporalVencido(l) + (e ? chip('En NUCO ' + (e.nuco || '—'), 'neutro') : chip('Suelta', 'ambar')),
              // Con equipo, las capturas son del equipo: a la vista "Ver equipo"; suelta: sus capturas. El resto en ⋮
              botonesFicha('data-linea-id', id, 'linea', puedeOperarLinea && !e && conDocumentos('linea', l.estatus),
                e ? '<button type="button" class="ln-btn-icono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' Ver equipo</button>' : '', puedeOperarLinea),
              [['Responsable', respL.nombre], ['Compañía', l.compania], ['SIM', l.sim], ['Fin de plan', fecha(l.finPlan)],
                ['Equipo', e ? '<a href="#" class="ln-enlace ln-mono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">NUCO ' + esc(e.nuco || '—') + '</a>' + (e.modelo ? ' · ' + esc(e.modelo) : '') : '<span class="ln-tenue">Suelta</span>', true]],
              anteriores ? 'Antes <span class="ln-mono">' + esc(anteriores) + '</span>' : '') +
            pestanasFicha(
            '<div class="ln-grid-2">' +
              // Usuario, 13-oct: Línea, Cuenta, Plan y Facturación (del proveedor), luego Equipo y Responsable. «Números de esta
              // línea» se quitó: los anteriores salen abajo del número y en el historial
              tarjeta(icono('card-sim') + ' Línea', campos([
                ['Tipo', l.tipoLinea || tipoRegistro(l.legado), !l.tipoLinea],
                ['Compañía', l.compania], ['SIM', l.sim ? '<span class="ln-mono">' + esc(l.sim) + '</span>' : '', true], ['Estatus', chip(l.estatus), true],
                l.usoTemporal ? ['Uso temporal', 'Desde ' + esc(fecha(l.usoTemporal.desde) || '—') + ' · ' + esc(l.usoTemporal.correo || ''), true] : null,
                !e && l.nucoLegado ? ['NUCO (anterior)', l.nucoLegado] : null,
              ])) +
              tarjetaCuenta(l, r.corte) +
              (veSeccion('facturacion') ? tarjetaPlan(l, false, r.facturas) + tarjetaFacturacion(l, r.facturas) : '') +
              tarjeta(icono('smartphone') + ' Equipo', e ? campos([
                ['NUCO', '<a href="#" class="ln-enlace ln-mono ln-accion-enlace" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + esc(e.nuco || '—') + ' ' + icono('chevron-right') + '</a>', true],
                ['Modelo', e.modelo], ['IMEI', e.imei], ['Estatus', chip(e.estatus), true],
                ['PIN WhatsApp', e.pinWhatsapp],
              ]) : '<p class="empty-state">Línea suelta: no está instalada en un equipo de la empresa.</p>') +
              tarjetaResponsable(e ? e.responsable : l.responsable, e ? 'Responsable (del equipo)' : 'Responsable') +
            '</div>', !l._dgOculto);
          ponerCopiarTarjetas(detalle);
          // Toda línea tiene Documentos: las de cuando estuvo suelta y las que firmó dentro de un equipo (pendiente 2.45)
          if (l._dgOculto) return;
          cargarEvidencias(id);
          cargarHistorial(id, e ? 'NUCO ' + (e.nuco || id) : 'Linea ' + (l.numero || id), 'linea');
        });
      }

      /** Regla ESTATUS TEMPORAL del AppSheet: USO TEMPORAL con 13 días o más desde FECHA CAMBIO TEMPORAL (rojo, triángulo). */
      function usoTemporalVencido(l) {
        const desde = l && l.usoTemporal && l.usoTemporal.desde ? new Date(l.usoTemporal.desde) : null;
        if (!desde || isNaN(desde) || (Date.now() - desde.getTime()) / 3600000 < 13 * 24) return '';
        return '<span class="ln-regla ln-regla-chip" style="color:var(--tono-rojo);font-weight:700;background:color-mix(in srgb, var(--tono-rojo) 12%, transparent);border:1px solid color-mix(in srgb, var(--tono-rojo) 45%, transparent)">' +
          ico('triangle-alert') + ' Uso temporal de ' + Math.floor((Date.now() - desde.getTime()) / 86400000) + ' días</span>';
      }

      /**
       * Acciones de la ficha (estilo Drive, usuario 30-sep): a la vista solo Responsiva e Inspección (en ese orden, usuario 16-oct)
       * (`conCaptura`; una línea en un equipo no captura, lo hace su equipo, y la línea sin equipo solo tiene responsiva:
       * pendiente 2.45), luego `extra` (Drive o Ver equipo) y al final ⋮ con todo lo demás (abrirMenuFicha). Sin permiso
       * de operar solo queda `extra`.
       */
      function botonesFicha(atributoRef, id, tipo, conCaptura, extra, conMas) {
        const mas = conMas === undefined ? conCaptura : conMas;
        return (!conCaptura ? '' :
          '<button type="button" class="ln-btn-icono" data-ln-captura="RESPONSIVA" ' + atributoRef + '="' + esc(id) + '">' + icono('signature') + ' Responsiva</button>' +
          (tipo === 'linea' ? '' :
          '<button type="button" class="ln-btn-icono" data-ln-captura="INSPECCION" ' + atributoRef + '="' + esc(id) + '">' + icono('clipboard-check') + ' Inspección</button>')) +
          (extra || '') + (!mas ? '' : '<button type="button" class="ln-btn-icono ln-btn-mas" data-ln-ficha-mas="' + esc(tipo) + '" data-id="' + esc(id) + '" title="Más opciones" aria-label="Más opciones">' + icono('ellipsis-vertical') + '</button>');
      }

      /** ⋮ de la ficha: lo que no está a la vista, según sea equipo o línea (con los datos del índice). */
      function abrirMenuFicha(boton) {
        const tipo = boton.dataset.lnFichaMas;
        const id = boton.dataset.id;
        const ix = memoria.indice || { equipos: [], lineas: [] };
        const r = (tipo === 'equipo' ? ix.equipos : ix.lineas).filter((x) => x.id === id)[0] || { id: id };
        const dgOculto = bloqueadoDG(r);
        const operar = puedeOperar() && !dgOculto;
        // Corregir el equipo y corregir la línea por separado (usuario, 8-oct; «Editar» hasta el 16-oct, pendiente 2.50). En el
        // equipo no va la línea ni Ir a la línea, ni en la línea Ir al equipo: la ficha los tiene en su información (usuario, 12-oct)
        const editar = [tipo === 'equipo'
          ? { icono: 'pencil', texto: 'Corregir', separador: true, alHacer: () => abrirEditor(id) }
          : { icono: 'pencil', texto: 'Corregir', separador: true, alHacer: () => abrirEditor(id, 'LINEA') }];
        // La carpeta de Drive va sola, separada de inspección y responsiva (usuario, 30-sep)
        // Con su sección (lineas-telefonicas.carpetas): operación interna, un CLIENT no la tiene (el servidor ni la manda)
        const carpeta = fichaActual && fichaActual.id === id && puede('lineas-telefonicas.carpetas') ? fichaActual.carpetaDriveId : null;
        const drive = carpeta ? [{ icono: 'folder-open', texto: 'Ver carpeta en Drive', separador: true,
          alHacer: () => window.open('https:\/\/drive.google.com/drive/folders/' + encodeURIComponent(carpeta), '_blank', 'noopener') }] : [];
        const documentos = [
          tieneNuco(r) && veDocumentos() && !dgOculto ? { icono: 'file-search', texto: 'Ver última inspección', alHacer: () => abrirUltimoDesdeMenu('INSPECCION', id) } : null,
          tieneNuco(r) && veDocumentos() && !dgOculto ? { icono: 'file-text', texto: 'Ver última responsiva', alHacer: () => abrirUltimoDesdeMenu('RESPONSIVA', id) } : null,
        ].filter(Boolean);
        if (documentos.length) documentos[0].titulo = 'Documentos';
        // Vincular, cambiar y desvincular (etapa 3, usuario 8-oct)
        const vinculo = !operar ? [] : (tipo === 'equipo'
          ? (r.lineaId ? [{ icono: 'arrow-left-right', texto: 'Cambiar línea', separador: true, alHacer: () => abrirVinculo('CAMBIAR_LINEA', r) },
            { icono: 'unlink', texto: 'Desvincular línea', alHacer: () => abrirVinculo('DESVINCULAR', r) }]
            : [{ icono: 'link', texto: 'Vincular línea', separador: true, alHacer: () => abrirVinculo('VINCULAR_LINEA', r) }])
          : (r.equipoId ? [{ icono: 'arrow-left-right', texto: 'Cambiar de equipo', separador: true, alHacer: () => abrirVinculo('CAMBIAR_EQUIPO', r) },
            { icono: 'unlink', texto: 'Desvincular del equipo', alHacer: () => abrirVinculo('DESVINCULAR', r) }]
            : (String(r.estatus || '').toUpperCase() === 'DISPONIBLE'
              ? [{ icono: 'link', texto: 'Vincular a equipo', separador: true, alHacer: () => abrirVinculo('VINCULAR_EQUIPO', r) }] : [])));
        // Mismo orden que el clic derecho de la lista (usuario, 12-oct; pendiente 2.34): mover · documentos · editar ·
        // vincular · historial. Responsiva e Inspección están en los botones de la ficha
        const historial = veHistorial() && !dgOculto ? [{ icono: 'history', texto: 'Historial', separador: true, alHacer: () => mostrarPestanaFicha('historial') }] : [];
        const items = tipo === 'equipo'
          ? (operar ? [
            r.panel ? { icono: 'archive-restore', texto: 'Corregir resguardo', alHacer: () => abrirResguardo([r], { corregir: true }) }
              : (mandaResguardo(r) ? { icono: 'archive', texto: 'Mandar a resguardo', alHacer: () => abrirResguardo([r]) } : null),
            r.panel === 'PENDIENTE DE RECEPCION' ? { icono: 'archive-x', texto: 'Quitar del panel', alHacer: () => quitarDelPanel([r.id], trasQuitar) } : null,
          ] : []).concat(documentos, drive, operar ? editar.concat(vinculo) : [], historial)
          // La línea sin equipo: su carpeta en LINEAS, si ya tiene responsiva (pendiente 2.45)
          : [r.numero ? { icono: 'phone-off', texto: 'Mandar a cancelación', alHacer: () => abrirCancelacion([r]) } : null]
            .concat(drive, editar, vinculo, historial);
        menuFlotante(boton, items.filter(Boolean));
      }

      return {
        abrir: abrir, abrirMenuFicha: abrirMenuFicha, abrirRegistro: abrirRegistro,
        alAbrirPestanaFicha: alAbrirPestanaFicha, campos: campos, cerrarDetalle: cerrarDetalle,
        contarEnPestana: contarEnPestana, encabezado: encabezado, migas: migas, pedirDocumento: pedirDocumento,
        precargarDocumento: precargarDocumento, tarjeta: tarjeta, volver: volver,
      };
    });
  })();
</script>
