<script>
  /**
   * app-reasignaciones.js — Reasignaciones Vehiculares, en su propio
   * archivo/<script> por el mismo motivo que Arqueos/Caja Chica (ver
   * comentario en app-arqueos.html): mantener cada <script> con margen
   * frente al límite de tamaño de Apps Script. Comparte el mismo scope
   * global del navegador que app.html (state, callServer, wireTabsSimple,
   * toastCargando, toastExito, toastError, hoyISO, puedeEditarModulo, etc.)
   * y el componente DataTable (rama `ayrton`) para la tabla.
   */

  // Tal cual se veía en AppSheet: flecha de color antes del nombre — roja hacia
  // abajo para quien sale, verde hacia arriba para quien entra.
  function flechaResponsable_(icono, color, valor) {
    if (!valor) return '';
    return `<span style="display:inline-flex; align-items:center; gap:5px; color:${color}">` +
      `${Iconos.svg(icono)} ${escaparHtml(valor)}</span>`;
  }

  // ---------- Reasignaciones Vehiculares ----------
  async function initReasignacionesVehiculares() {
    wireTabsSimple(document.getElementById('view-container'));
    // Permisos del módulo (el servidor los vuelve a revisar en cada llamada)
    const puedeEditar = puedeEditarModulo('reasignaciones-vehiculares');
    if (!puedeEditar) document.querySelector('#rv-tabs .tab-btn[data-tab="registrar"]').remove();

    let vehiculosPorFolio = {};
    let todasLasReasignaciones = [];

    // VIN y los datos del saliente los decide el vehículo (soloLectura, no se mandan: el
    // servidor los toma del vehículo). Nucco solo sirve para buscarlo (FolioNucco, abajo).
    const SALIENTE = 'Responsable saliente (actual)';
    const ENTRANTE = 'Responsable entrante (nuevo)';
    const CAMPOS_REASIGNACION = [
      { clave: 'Nucco', etiqueta: 'Nucco', tipo: 'select', catalogo: true, noSeGuarda: true, placeholder: 'Otra forma de buscar el vehículo…' },
      { clave: 'Folio Vehiculo', etiqueta: 'Folio del vehículo', tipo: 'select', catalogo: true, requerido: true },
      { clave: 'Fecha de Reasignacion', etiqueta: 'Fecha de reasignación', tipo: 'date' },
      { clave: 'VIN', etiqueta: 'VIN', tipo: 'text', soloLectura: true, placeholder: 'Elige un vehículo' },
      { grupo: SALIENTE, clave: 'No Empleado Saliente', etiqueta: 'No. de empleado', tipo: 'text', soloLectura: true },
      { grupo: SALIENTE, clave: 'Responsable Saliente', etiqueta: 'Responsable', tipo: 'text', soloLectura: true },
      { grupo: SALIENTE, clave: 'Departamento Saliente', etiqueta: 'Departamento', tipo: 'text', soloLectura: true },
      { grupo: ENTRANTE, clave: 'Responsable Entrante', etiqueta: 'Responsable', tipo: 'select', catalogo: true, requerido: true },
      { grupo: ENTRANTE, clave: 'No Empleado Entrante', etiqueta: 'No. de empleado', tipo: 'text' },
      { grupo: ENTRANTE, clave: 'Departamento Entrante', etiqueta: 'Departamento', tipo: 'select', catalogo: true },
    ];
    document.getElementById('campos-form-reasignacion-vehicular').innerHTML = CamposHoja.html(CAMPOS_REASIGNACION, { prefijo: 'rv' });

    document.getElementById('rv-fecha-de-reasignacion').value = hoyISO();

    // Catálogo de vehículos (para los datalist de Folio/Nucco y para autollenar VIN
    // + responsable/departamento salientes sin ida y vuelta al servidor).
    // vehiculosPorFolio trae una entrada por FOLIO y otra por NUCO (apiListarVehiculosBasico
    // lo manda como "NUCO", sin doble C), las dos al mismo vehículo. Folio y Nucco son
    // campos INDEPENDIENTES (componente FolioNucco, más abajo): escribir en cualquiera de los
    // dos resuelve el vehículo y pone el valor correspondiente en el otro.
    callServerCacheado('apiListarVehiculosBasico', state.token).then((vehiculos) => {
      FolioNucco.indexar(vehiculos, vehiculosPorFolio);
      CamposHoja.llenarOpciones('rv-folio-vehiculo', (vehiculos || []).map((v) => escaparHtml(v.FOLIO)));
      document.getElementById('rv-nucco-lista').innerHTML = FolioNucco.opcionesNucco(vehiculos);
    }).catch((err) => {
      console.error('No se pudo cargar el catálogo de vehículos:', err);
      const errorBox = document.getElementById('rv-error');
      errorBox.textContent = 'No se pudo cargar el catálogo de vehículos: ' + err.message;
      errorBox.hidden = false;
    });

    // Departamento (catálogo real, mismo que usan Vehículos/Uber/Tickets).
    callServerCacheado('apiListarDepartamentos', state.token).then((departamentos) => {
      CamposHoja.llenarOpciones('rv-departamento-entrante', departamentos);
    }).catch((err) => {
      console.error('No se pudo cargar el catálogo de departamentos:', err);
    });

    // Colaboradores (Capital Humano, mismo catálogo y mismo criterio que Vehículos — ver
    // CAMPOS_VEHICULO/wireResponsableVehiculo en app.html): sugerencias para "Responsable"
    // del entrante y, al elegir uno (o escribir un nombre que coincide exacto), se autollenan
    // "No. de empleado" y "Departamento" -- si no está en la lista (alguien que CH todavía no
    // cargó), se deja escribir libre y esos dos se capturan a mano, como ya era antes.
    callServerCacheado('apiListarColaboradores', state.token).then((colaboradores) => {
      const lista = colaboradores || [];
      CamposHoja.llenarOpciones('rv-responsable-entrante', Array.from(new Set(lista.map((c) => c.NOMBRE))));
      const porNombre = {};
      lista.forEach((c) => { if (!porNombre[c.NOMBRE.toUpperCase()]) porNombre[c.NOMBRE.toUpperCase()] = c; });
      document.getElementById('rv-responsable-entrante').addEventListener('input', (ev) => {
        const colaborador = porNombre[ev.target.value.trim().toUpperCase()];
        const depto = document.getElementById('rv-departamento-entrante');
        const noEmpleado = document.getElementById('rv-no-empleado-entrante');
        if (!colaborador) { CampoAuto.quitar(depto); CampoAuto.quitar(noEmpleado); return; }
        if (colaborador.DEPARTAMENTO) CampoAuto.llenar(depto, colaborador.DEPARTAMENTO);
        if (colaborador.NO_EMPLEADO) CampoAuto.llenar(noEmpleado, colaborador.NO_EMPLEADO);
      });
    }).catch((err) => {
      console.error('No se pudo cargar el catálogo de colaboradores:', err);
    });

    // VIN y los datos del saliente: data-auto en la vista (los decide el vehículo)
    FolioNucco.ligar('rv-folio-vehiculo', 'rv-nucco', {
      buscar: (texto) => vehiculosPorFolio[texto],
      alResolver: (vehiculo) => {
        document.getElementById('rv-vin').value = vehiculo ? vehiculo.VIN : '';
        document.getElementById('rv-no-empleado-saliente').value = vehiculo ? vehiculo.NO_EMPLEADO : '';
        document.getElementById('rv-responsable-saliente').value = vehiculo ? vehiculo.RESPONSABLE_VEHICULO : '';
        document.getElementById('rv-departamento-saliente').value = vehiculo ? vehiculo.DEPARTAMENTO : '';
      },
    });

    const tabla = DataTable.crear(document.getElementById('rv-tabla'), {
      idCampo: 'ID',
      idTabla: 'reasignaciones-vehiculares',
      ordenInicial: { campo: 'FECHA', dir: 'desc' },
      textoVacio: 'Todavía no hay reasignaciones registradas',
      ayuda: 'Eliminar aquí NO revierte el responsable actual del vehículo — solo borra el registro del historial.',
      exportar: {
        nombreArchivo: 'Reasignaciones Vehiculares',
        titulo: 'Descarga la base completa: todas las filas y columnas de la hoja, sin importar filtros ni búsqueda',
        descargar: async () => ExportarExcel.descargarCrudo({ nombreArchivo: 'Reasignaciones Vehiculares', filas: JSON.parse(await callServer('apiReasignacionesVehicularesCompleto', state.token)) }),
      },
      columnasCompletas: { idHoja: 'ID', cargar: async () => JSON.parse(await callServer('apiReasignacionesVehicularesCompleto', state.token)) },
      etiquetaFila: (r) => r.FOLIO_VEHICULO,
      detalle: { titulo: (r) => 'Folio: ' + (r.FOLIO_VEHICULO || '') },
      alCambiarFiltros: (filtros) => marcarKpiActivo(filtros),
      // Selección estilo Google Drive/Apple (rama emmanuel, ver componentes/datatable.html):
      // clic = selecciona, doble clic/tocar = abre el panel de detalle (tabla.abrirDetalle
      // se resuelve en el momento del clic, para entonces `tabla` ya está asignada).
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (r) => tabla.abrirDetalle(String(r.ID)),
      alTocarFila: (r) => tabla.abrirDetalle(String(r.ID)),
      columnas: [
        { campo: 'FOLIO_VEHICULO', titulo: 'Folio', tipo: 'texto', fijada: true },
        { campo: 'FECHA', titulo: 'Fecha', tipo: 'fecha' },
        { campo: 'RESPONSABLE_SALIENTE', titulo: 'Responsable saliente', tipo: 'texto',
          render: (v) => flechaResponsable_('arrow-down', '#e02020', v) },
        { campo: 'DEPARTAMENTO_SALIENTE', titulo: 'Departamento saliente', tipo: 'lista' },
        { campo: 'RESPONSABLE_ENTRANTE', titulo: 'Responsable entrante', tipo: 'texto',
          render: (v) => flechaResponsable_('arrow-up', '#2ba02b', v) },
        { campo: 'DEPARTAMENTO_ENTRANTE', titulo: 'Departamento entrante', tipo: 'lista' },
        { campo: 'QUIEN_REGISTRO', titulo: 'Quién registró', tipo: 'lista' },
        { campo: 'VIN', titulo: 'VIN', tipo: 'texto', visible: false },
        { campo: 'NUCO', titulo: 'Nuco', tipo: 'texto', visible: false },
        { campo: 'NO_EMPLEADO_SALIENTE', titulo: 'No. de empleado saliente', tipo: 'texto', visible: false },
        { campo: 'NO_EMPLEADO_ENTRANTE', titulo: 'No. de empleado entrante', tipo: 'texto', visible: false },
      ],
      accionesFila: [{ icono: 'car', titulo: 'Ver vehículo', alHacer: (r) => verFichaVehiculoDesdeOtroModulo(r.FOLIO_VEHICULO) }],
      seleccionable: true,
      alEliminar: puedeEditar ? async (filas) => {
        await Promise.all(filas.map((f) => callServer('apiEliminarReasignacionVehicular', state.token, f.ID)));
        const ids = new Set(filas.map((f) => f.ID));
        todasLasReasignaciones = todasLasReasignaciones.filter((r) => !ids.has(r.ID));
        tabla.setDatos(todasLasReasignaciones);
        pintarStats(todasLasReasignaciones);
      } : null,
      motivoSinEliminar: 'Tu permiso en este módulo es de solo lectura',
    });

    // KPI clickeables: Total limpia el filtro, Hoy filtra por la fecha de hoy.
    const tileTotal = document.getElementById('rv-stat-total').closest('.stat-tile');
    const tileHoy = document.getElementById('rv-stat-hoy').closest('.stat-tile');
    [tileTotal, tileHoy].forEach((t) => t.classList.add('stat-tile-clickable'));
    tileTotal.addEventListener('click', () => tabla.setFiltro('FECHA', null));
    tileHoy.addEventListener('click', () => {
      const yaActivo = tileHoy.classList.contains('stat-tile-activo');
      tabla.setFiltro('FECHA', yaActivo ? null : { op: 'igual', v1: hoyISO() });
    });
    function marcarKpiActivo(filtros) {
      const f = filtros.FECHA;
      tileHoy.classList.toggle('stat-tile-activo', !!(f && f.op === 'igual' && f.v1 === hoyISO()));
      tileTotal.classList.toggle('stat-tile-activo', !f);
      pintarStats(tabla.getFiltradas());
    }

    function pintarStats(filas) {
      document.getElementById('rv-stat-total').textContent = filas.length;
      const hoyStr = hoyISO();
      document.getElementById('rv-stat-hoy').textContent =
        filas.filter((r) => r.FECHA && r.FECHA.slice(0, 10) === hoyStr).length;
    }

    async function cargar() {
      tabla.setCargando(true);
      try {
        todasLasReasignaciones = (await callServerListaCacheada('apiListarReasignacionesVehiculares', state.token)) || [];
      } catch (err) {
        tabla.setError('No se pudo cargar el historial: ' + err.message);
        return;
      }
      pintarStats(todasLasReasignaciones);
      tabla.setDatos(todasLasReasignaciones);
    }
    // Pinta al instante con lo guardado; si del servidor llega algo distinto, se vuelve a pintar (api.html)
    escucharLista('apiListarReasignacionesVehiculares', cargar, document.getElementById('view-container').firstElementChild);

    document.getElementById('form-reasignacion-vehicular').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('rv-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-reasignacion-vehicular');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando…';
      toastCargando('Registrando…');
      try {
        await callServer('apiCrearReasignacionVehicular', state.token, CamposHoja.recolectar(CAMPOS_REASIGNACION, 'rv'));
        ev.target.reset();   // también vacía VIN y los datos del saliente
        document.getElementById('rv-fecha-de-reasignacion').value = hoyISO();
        // El vehículo reasignado ya trae otro responsable — refresca el
        // catálogo en memoria (y el caché compartido, que también usan
        // Sensores/Hologramas/Inspecciones/Verificaciones) para que una
        // segunda reasignación seguida, o esos otros módulos, no muestren
        // datos salientes obsoletos.
        invalidarCacheCatalogo('apiListarVehiculosBasico', state.token);
        invalidarCacheLista('apiListarReasignacionesVehiculares', state.token);
        // indexar (y no solo por FOLIO): si no, después de la primera reasignación ya no se
        // podía buscar el vehículo por Nucco
        callServerCacheado('apiListarVehiculosBasico', state.token).then((vehiculos) => {
          vehiculosPorFolio = FolioNucco.indexar(vehiculos);
        }).catch(() => {});
        await cargar();
        toastExito('Registrado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo registrar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    await cargar();
  }
</script>
