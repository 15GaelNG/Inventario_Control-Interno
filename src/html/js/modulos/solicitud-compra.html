<script>
  /**
   * solicitud-compra.js — Puente hacia Adquisición Vehicular: repositorio de documentos de una
   * compra desde el folio del ticket, antes de que exista el vehículo (SolicitudCompraService.gs).
   * Solo ADMIN/SUPER por ahora. "Ya crear vehículo" abre el alta de Vehículos ya con el folio y
   * la carpeta puestos (crearVehiculoDesdeSolicitudCompra, app.html). "Editar" cambia AREA/NOMBRE
   * y, si el nombre cambió, también renombra la carpeta real en Drive; si alguien la renombra AL
   * REVÉS, directo en Drive, la próxima vez que se liste el catálogo se entera sola.
   */

  function badgeEstatusSolicitudCompra(estatus) {
    const convertida = estatus === 'CONVERTIDA';
    return '<span class="badge-estado ' + (convertida ? 'activo' : 'pendiente') + '">' +
      Iconos.svg(convertida ? 'circle-check' : 'clock') + ' ' + escaparHtml(estatus || '') + '</span>';
  }

  /** Panel de detalle: archivos de la carpeta (Galeria) + subir nuevos. */
  async function pintarArchivosSolicitudCompra(fila, contenedor) {
    contenedor.innerHTML =
      '<div class="dt-campo-titulo" style="margin-bottom:8px">Archivos</div>' +
      '<div data-soc-galeria><span class="dt-skel" style="height:90px; width:100%; border-radius:var(--radio-m)"></span></div>' +
      '<div style="margin-top:12px; display:flex; gap:8px; align-items:center">' +
      '<input type="file" multiple id="soc-input-archivo-' + fila.ID + '">' +
      '<button type="button" class="secondary" data-soc-subir>' + Iconos.svg('upload') + ' Subir</button></div>';

    async function recargar() {
      const caja = contenedor.querySelector('[data-soc-galeria]');
      try {
        const archivos = JSON.parse(await callServer('apiSolicitudCompraArchivos', state.token, fila.ID));
        if (!archivos.length) { caja.innerHTML = '<p class="empty-state">Todavía no hay archivos.</p>'; return; }
        const grupos = [{ titulo: 'Archivos', fotos: archivos }];
        caja.innerHTML = Galeria.html(grupos);
        Galeria.ligar(caja, grupos, { titulo: fila.FOLIO + ' — ' + fila.NOMBRE });
      } catch (err) {
        caja.innerHTML = '<p class="empty-state">No se pudieron leer los archivos: ' + escaparHtml(err.message) + '</p>';
      }
    }
    await recargar();
    if (!document.body.contains(contenedor)) return;

    contenedor.querySelector('[data-soc-subir]').addEventListener('click', async () => {
      const input = contenedor.querySelector('#soc-input-archivo-' + fila.ID);
      const archivos = Array.from((input && input.files) || []);
      if (!archivos.length) return;
      const btn = contenedor.querySelector('[data-soc-subir]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      input.disabled = true;
      toastCargando(archivos.length === 1 ? 'Subiendo archivo…' : 'Subiendo archivos…');
      try {
        for (let i = 0; i < archivos.length; i++) {
          btn.innerHTML = '<span class="spinner"></span> Subiendo' + (archivos.length > 1 ? ' ' + (i + 1) + ' de ' + archivos.length : '') + '…';
          const base64 = await leerArchivoBase64(archivos[i]);
          await callServer('apiSolicitudCompraSubirArchivo', state.token, fila.ID, archivos[i].name, archivos[i].type, base64);
        }
        input.value = '';
        await recargar();
        toastExito(archivos.length === 1 ? 'Archivo subido' : 'Archivos subidos');
      } catch (err) {
        toastError('No se pudo subir: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
        input.disabled = false;
      }
    });
  }

  function abrirModalNuevaSolicitudCompra() {
    document.getElementById('form-nueva-solicitud-compra').reset();
    document.getElementById('soc-nueva-error').hidden = true;
    document.getElementById('modal-nueva-solicitud-compra').hidden = false;
  }
  function cerrarModalNuevaSolicitudCompra() {
    document.getElementById('modal-nueva-solicitud-compra').hidden = true;
  }

  /** Editar AREA/NOMBRE de una solicitud -- el ID va en el dataset del form (apiActualizarSolicitudCompra renombra la carpeta real si el nombre cambió). */
  function abrirModalEditarSolicitudCompra(fila) {
    const form = document.getElementById('form-editar-solicitud-compra');
    form.dataset.id = fila.ID;
    document.getElementById('soc-editar-folio').value = fila.FOLIO;
    document.getElementById('soc-editar-area').value = fila.AREA || '';
    document.getElementById('soc-editar-nombre').value = fila.NOMBRE || '';
    document.getElementById('soc-editar-error').hidden = true;
    document.getElementById('modal-editar-solicitud-compra').hidden = false;
  }
  function cerrarModalEditarSolicitudCompra() {
    document.getElementById('modal-editar-solicitud-compra').hidden = true;
  }

  /** Atajo para subir/ver archivos sin tener que abrir el detalle de la fila (el "ojito") --
   *  misma pintarArchivosSolicitudCompra de arriba, nomás que en una ventana aparte. */
  function abrirModalArchivosSolicitudCompra(fila) {
    document.getElementById('soc-archivos-titulo').textContent = fila.FOLIO + ' — ' + fila.NOMBRE;
    document.getElementById('modal-archivos-solicitud-compra').hidden = false;
    pintarArchivosSolicitudCompra(fila, document.getElementById('soc-archivos-cuerpo'));
  }
  function cerrarModalArchivosSolicitudCompra() {
    document.getElementById('modal-archivos-solicitud-compra').hidden = true;
  }

  async function initSolicitudCompra() {
    // Lo que escribe, solo con edición (antes se veía y el servidor lo negaba). "Ya crear vehículo" además da
    // de alta un vehículo: también pide editar Vehículos
    const puedeEditar = puedeEditarModulo('solicitud-compra');
    const creaVehiculo = puedeEditar && puedeEditarModulo('vehiculos');
    async function recargarLista() {
      tabla.setCargando(true);
      try {
        tabla.setDatos(JSON.parse(await callServer('apiListarSolicitudesCompra', state.token)));
      } catch (err) {
        tabla.setError('No se pudo cargar: ' + err.message);
      }
    }

    const tabla = DataTable.crear(document.getElementById('soc-tabla'), {
      idCampo: 'ID',
      idTabla: 'solicitud-compra',
      ordenInicial: { campo: 'FECHA', dir: 'desc' },
      textoVacio: 'Todavía no hay solicitudes de compra.',
      ayuda: 'El expediente de una compra desde el folio del ticket, antes de que exista el vehículo. "Ya crear vehículo" da de alta el vehículo con el folio y la carpeta ya puestos.',
      etiquetaFila: (f) => f.FOLIO + ' — ' + f.NOMBRE,
      detalle: {
        titulo: (f) => f.FOLIO + ' — ' + f.NOMBRE,
        contenidoExtra: (f, el) => pintarArchivosSolicitudCompra(f, el),
      },
      columnas: [
        { campo: 'FOLIO', titulo: 'Folio', tipo: 'texto', fijada: true },
        { campo: 'NOMBRE', titulo: 'Nombre', tipo: 'texto' },
        { campo: 'AREA', titulo: 'Área', tipo: 'lista' },
        { campo: 'FECHA', titulo: 'Fecha', tipo: 'fecha' },
        { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista', render: (v) => badgeEstatusSolicitudCompra(v) },
        {
          campo: 'NUCCO_RESULTANTE', titulo: 'Vehículo', filtrable: false, ordenable: false,
          render: (v) => (v ? escaparHtml(v) : '<span style="color:var(--color-text-muted)">—</span>'),
        },
      ],
      accionesFila: [
        puedeEditar && { icono: 'pencil', titulo: 'Editar', alHacer: (f) => abrirModalEditarSolicitudCompra(f) },
        puedeEditar && { icono: 'upload', titulo: 'Subir archivos', alHacer: (f) => abrirModalArchivosSolicitudCompra(f) },
        { icono: 'external-link', titulo: 'Abrir carpeta', alHacer: (f) => window.open(f.LIGA_CARPETA, '_blank'), visible: (f) => !!f.LIGA_CARPETA },
        creaVehiculo && { icono: 'car', titulo: 'Ya crear vehículo', visible: (f) => f.ESTATUS === 'ABIERTA', alHacer: (f) => crearVehiculoDesdeSolicitudCompra(f) },
      ].filter(Boolean),
      seleccionable: true,
      alEliminar: puedeEditar ? async (filas) => {
        await Promise.all(filas.map((f) => callServer('apiEliminarSolicitudCompra', state.token, f.ID)));
      } : null,
      motivoSinEliminar: 'Tu permiso en este módulo es de solo lectura',
    });

    await recargarLista();

    if (puedeEditar) document.getElementById('soc-btn-nueva').addEventListener('click', abrirModalNuevaSolicitudCompra);
    else document.getElementById('soc-btn-nueva').remove();
    document.getElementById('btn-cerrar-nueva-solicitud-compra').addEventListener('click', cerrarModalNuevaSolicitudCompra);
    document.getElementById('btn-cerrar-editar-solicitud-compra').addEventListener('click', cerrarModalEditarSolicitudCompra);
    document.getElementById('form-editar-solicitud-compra').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const form = ev.target;
      const errorBox = document.getElementById('soc-editar-error');
      errorBox.hidden = true;
      const btn = form.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando…';
      toastCargando('Guardando cambios…');
      try {
        await callServer('apiActualizarSolicitudCompra', state.token, form.dataset.id, {
          AREA: document.getElementById('soc-editar-area').value.trim(),
          NOMBRE: document.getElementById('soc-editar-nombre').value.trim(),
        });
        cerrarModalEditarSolicitudCompra();
        await recargarLista();
        toastExito('Cambios guardados');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });
    const modalArchivos = document.getElementById('modal-archivos-solicitud-compra');
    document.getElementById('btn-cerrar-archivos-solicitud-compra').addEventListener('click', cerrarModalArchivosSolicitudCompra);
    modalArchivos.addEventListener('click', (ev) => { if (ev.target === modalArchivos) cerrarModalArchivosSolicitudCompra(); });
    document.getElementById('form-nueva-solicitud-compra').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('soc-nueva-error');
      errorBox.hidden = true;
      const btn = ev.target.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creando…';
      toastCargando('Creando solicitud…');
      try {
        await callServer('apiCrearSolicitudCompra', state.token, {
          FOLIO: document.getElementById('soc-folio').value.trim(),
          AREA: document.getElementById('soc-area').value.trim(),
          NOMBRE: document.getElementById('soc-nombre').value.trim(),
        });
        cerrarModalNuevaSolicitudCompra();
        await recargarLista();
        toastExito('Solicitud creada');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });
  }
</script>
