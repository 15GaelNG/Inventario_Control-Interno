<script>
  /**
   * app.js — estado global, router SPA (client-side) e inicialización de cada vista.
   * Las vistas viven como <template> ya embebidas en el HTML (ver Index.html),
   * se clonan a #view-container al navegar. Cero round-trips extra al servidor
   * solo por cambiar de pantalla.
   */

  // Íconos (Lucide): dibuja cualquier <i data-lucide="..."> que haya en el DOM.
  // Hay que llamarla cada vez que se inyecta HTML nuevo con íconos (innerHTML no
  // los "activa" solo) — por eso aparece después de casi cada render dinámico.
  function refreshIcons() {
    if (window.lucide) lucide.createIcons();
  }

  /**
   * Barra de pestañas simple (ej. "Catálogo" / "Registrar" arriba de cada
   * módulo) — conecta los <button class="tab-btn" data-tab="clave"> con sus
   * <div class="tab-panel" data-tab-panel="clave"> dentro de `contenedor`.
   * Un panel visible a la vez. Se llama una vez por módulo, después de
   * pintar su HTML (montarVista ya lo hace fresco cada vez que se navega).
   */
  /**
   * Convierte un stat-tile (KPI, ej. "Activos" en Vehículos) en un filtro
   * de la tabla con un solo clic: aplica `prueba` (la MISMA función que ya
   * se usa para contar ese KPI, así nunca se desincroniza el número del
   * filtro) sobre la columna `clave` del motor de tabla. `prueba: null`
   * es para el tile de "Total" — solo quita el filtro (ver todo). Los
   * demás tiles del mismo grupo (`gruposTiles`) pierden el resaltado
   * "activo" al elegir uno nuevo — como un selector de opciones, no un
   * toggle independiente por tile.
   */
  function wireKpiFiltro(tile, motorTabla, clave, prueba, grupoTiles) {
    if (!tile) return;
    tile.classList.add('stat-tile-clickable');
    tile.addEventListener('click', () => {
      (grupoTiles || []).forEach((t) => t && t.classList.remove('stat-tile-activo'));
      tile.classList.add('stat-tile-activo');
      if (prueba) motorTabla.aplicarFiltro(clave, { tipo: 'personalizado', prueba });
      else motorTabla.quitarFiltro(clave);
    });
  }

  /**
   * Guarda varios cambios de un tirón para los módulos (Verificaciones,
   * Sensores, Hologramas) cuyo servidor solo expone "actualizar UN campo"
   * (apiActualizarCampoX(token, id, campo, valor)), no un actualizar()
   * general — para que su ventana de "Editar" pueda mandar todo el
   * formulario de golpe, se llama una vez por cada campo que de verdad
   * cambió. SIEMPRE una tras otra (nunca Promise.all): cada llamada relee
   * y regraba la fila COMPLETA, así que dos a la vez sobre la misma fila
   * podrían pisarse (la segunda escribiría encima con datos de antes de
   * que la primera terminara). Regresa el registro tal como lo dejó la
   * ÚLTIMA llamada (ya con todos los cambios aplicados).
   */
  async function guardarCambiosCampoPorCampo(id, cambios, funcionApi) {
    let actualizado = null;
    for (const campo of Object.keys(cambios)) {
      actualizado = await funcionApi(id, campo, cambios[campo]);
    }
    return actualizado;
  }

  function wireTabsSimple(contenedor) {
    const botones = contenedor.querySelectorAll('.tab-btn');
    botones.forEach((btn) => {
      btn.addEventListener('click', () => {
        botones.forEach((b) => b.classList.toggle('active', b === btn));
        contenedor.querySelectorAll('.tab-panel').forEach((panel) => {
          panel.hidden = panel.dataset.tabPanel !== btn.dataset.tab;
        });
      });
    });
  }

  /**
   * Hace clickeable la fila COMPLETA de una tabla (antes solo la primera
   * celda, la que trae la clase "tabla-clickable", abría el detalle). Cada
   * <tr> debe traer adentro una celda <td class="tabla-clickable" data-...>
   * (la sigue marcando visualmente y trae los data-* con el id/folio/etc.) —
   * este helper solo agrega el click a toda la fila, delegando en un solo
   * listener por tabla en vez de uno por fila. Los clics dentro de
   * .tabla-actions (o cualquier <a>/<button>, ej. editar/eliminar/ver
   * documento) NO abren el detalle — se ignoran para que esos botones
   * sigan funcionando normal.
   *
   * Se llama de nuevo en cada render (cada vez que se filtra/ordena/cambia
   * de página) porque las filas son nuevas, pero el <tbody> en sí es el
   * mismo elemento durante toda la vida del módulo — el listener delegado
   * solo se engancha la PRIMERA vez (dataset.filasClickablesWired) para no
   * ir acumulando uno nuevo por cada render.
   */
  function wireFilasClickables(tbody, callback) {
    tbody.querySelectorAll('.tabla-clickable').forEach((celda) => {
      celda.closest('tr').classList.add('fila-clickable');
    });
    if (tbody.dataset.filasClickablesWired) return;
    tbody.dataset.filasClickablesWired = '1';
    tbody.addEventListener('click', (ev) => {
      if (ev.target.closest('a, button')) return;
      const fila = ev.target.closest('tr');
      const celda = fila && fila.querySelector('.tabla-clickable');
      if (celda) callback(celda.dataset, celda);
    });
  }

  /**
   * Notificación flotante de cargando/éxito/error — para Registrar/Editar/
   * Eliminar en todos los módulos. Un solo slot (el siguiente toast
   * reemplaza al anterior, no se apilan). toastCargando() se usa al
   * empezar la operación; toastExito()/toastError() cierran ese mismo
   * toast con el resultado — no hace falta llamar a toastCargando() de
   * nuevo, solo pasar el mensaje final.
   */
  let toastActual = null;
  let toastTimeoutId = null;
  function toastCargando(mensaje) {
    const contenedor = document.getElementById('toast-container');
    if (toastTimeoutId) { clearTimeout(toastTimeoutId); toastTimeoutId = null; }
    contenedor.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'toast toast-cargando';
    el.innerHTML = `<span class="toast-icon"><span class="spinner"></span></span><span class="toast-mensaje">${mensaje}</span>`;
    contenedor.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    toastActual = el;
  }
  function toastExito(mensaje) {
    if (!toastActual) toastCargando('');
    toastActual.className = 'toast toast-exito show';
    toastActual.innerHTML = `<span class="toast-icon"><i data-lucide="circle-check" class="ico"></i></span><span class="toast-mensaje">${mensaje}</span>`;
    refreshIcons();
    toastTimeoutId = setTimeout(() => { if (toastActual) toastActual.classList.remove('show'); }, 2800);
  }
  function toastError(mensaje) {
    if (!toastActual) toastCargando('');
    toastActual.className = 'toast toast-error show';
    toastActual.innerHTML = `<span class="toast-icon"><i data-lucide="x" class="ico"></i></span><span class="toast-mensaje">${mensaje}</span>`;
    refreshIcons();
    toastTimeoutId = setTimeout(() => { if (toastActual) toastActual.classList.remove('show'); }, 4500);
  }

  // Tema (claro/oscuro) — se aplica antes de montar cualquier vista para evitar parpadeo.
  // Los botones de tema viven en dos lugares (login y sidebar del app-shell), así que
  // se identifican por clase (.theme-btn + data-tema), no por id, y se manejan con
  // delegación de eventos para que funcionen sin importar cuándo se monten.
  (function initTema() {
    try {
      const guardado = localStorage.getItem('tema');
      if (guardado === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* localStorage puede fallar en vista previa/incógnito, se ignora */ }
  })();

  function aplicarTema(tema) {
    if (tema === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    try { localStorage.setItem('tema', tema); } catch (e) { /* no-op */ }
    marcarTemaActual();
    // Si el slideshow del fondo del login está activo, refresca las
    // imágenes ya pintadas a la variante del tema nuevo — si no, se
    // quedarían con la del tema anterior hasta el siguiente cambio de slide.
    if (typeof actualizarHeroLoginTema === 'function') actualizarHeroLoginTema();
  }

  /**
   * Marca el botón del tema actual (rama emmanuel). Antes solo se marcaba al mostrar el login: si se entraba con la
   * sesión guardada (recargar la página), ningún botón aparecía como activo.
   */
  function marcarTemaActual() {
    const tema = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    document.querySelectorAll('.theme-btn').forEach((btn) => {
      const activo = btn.dataset.tema === tema;
      btn.classList.toggle('active', activo);
      btn.setAttribute('aria-pressed', String(activo));
    });
  }
  marcarTemaActual();

  /**
   * Slideshow del fondo del login: varias fotos de marca (no una sola fija)
   * — cada una con su propia variante clara/oscura (ver IMAGENES_HERO_LOGIN)
   * — se van turnando cada 7s con un fundido cruzado entre dos capas
   * apiladas (#login-hero-bg-a / #login-hero-bg-b). Cuando le toca a una
   * capa aparecer, la OTRA ya viene precargada con la imagen que sigue
   * después de esa, para que no se note un salto al cargar justo cuando le
   * toca mostrarse. Si cambia el tema mientras el login está abierto,
   * aplicarTema() llama a actualizarHeroLoginTema (definida aquí abajo)
   * para no esperar hasta el siguiente cambio de slide.
   */
  const IMAGENES_HERO_LOGIN = [
    { light: 'login-bg.jpg', dark: 'login-bg-dark.jpg' },
    { light: 'EntradaCM-Light.jpg', dark: 'EntradaCM-Dark.png' },
    { light: 'FamilyClub-Light.jpg', dark: 'FamilyClub-Dark.png' },
    { light: 'Terrrenos-Light.jpg', dark: 'Terrrenos-Dark.png' },
  ];
  // "\/\/" (no "//") — Apps Script le borra a los .html todo lo que
  // encuentre después de "//" pensando que es un comentario, incluso
  // dentro de un string (ver CLAUDE.md). "\/" en un string de JS es
  // idéntico a "/", así que el resultado es la misma URL de siempre.
  const BASE_ASSETS = 'https:\/\/raw.githubusercontent.com/15GaelNG/Inventario_Control-Interno/master/assets/';
  const GRADIENTE_HERO_LIGHT = 'linear-gradient(100deg, rgba(6,20,30,.88) 0%, rgba(6,20,30,.55) 45%, rgba(6,20,30,.25) 75%)';
  const GRADIENTE_HERO_DARK = 'linear-gradient(100deg, rgba(3,10,16,.80) 0%, rgba(3,10,16,.50) 45%, rgba(3,10,16,.20) 75%)';

  let detenerHeroLogin = null;
  let actualizarHeroLoginTema = null;

  // Cache de precarga por URL — así, si una imagen ya se pidió antes (ej.
  // al regresar al login, o al volver a tocarle su turno en otra vuelta
  // del ciclo), no se vuelve a descargar de cero.
  const cachePrecargaHero = {};
  function precargarImagen_(url) {
    if (!cachePrecargaHero[url]) {
      cachePrecargaHero[url] = new Promise((resolve) => {
        const img = new Image();
        img.onload = resolve;
        img.onerror = resolve; // si falla, igual se resuelve — no se traba el slideshow por una imagen caída
        img.src = url;
      });
    }
    return cachePrecargaHero[url];
  }

  function initLoginHeroSlideshow() {
    // Por si initLogin() se vuelve a llamar en la misma carga de página
    // (ej. sesión expirada, regresa al login) — sin esto quedarían varios
    // ciclos corriendo a la vez.
    if (detenerHeroLogin) { detenerHeroLogin(); detenerHeroLogin = null; }

    const capaA = document.getElementById('login-hero-bg-a');
    const capaB = document.getElementById('login-hero-bg-b');
    if (!capaA || !capaB) return;

    let indice = 0;
    let visible = capaA;
    let oculta = capaB;
    let detenido = false;
    let idEspera = null;

    function urlPara(i) {
      const set = IMAGENES_HERO_LOGIN[i];
      const esOscuro = document.documentElement.getAttribute('data-theme') === 'dark';
      const gradiente = esOscuro ? GRADIENTE_HERO_DARK : GRADIENTE_HERO_LIGHT;
      const archivo = esOscuro ? set.dark : set.light;
      return gradiente + ', url("' + BASE_ASSETS + archivo + '")';
    }

    const DURACION_VISIBLE_MS = 7000;

    /**
     * Antes este slideshow avanzaba en un reloj fijo (setInterval) sin
     * importar si la imagen que seguía ya había terminado de bajar —
     * algunas de estas fotos pesan varios MB (los PNG de tema oscuro), así
     * que a veces le tocaba su turno a una que apenas iba a la mitad de la
     * descarga: se veía aparecer de golpe/tarde, y por lo mismo la de
     * antes se sentía "durar menos" de lo que debía. Ahora cada vuelta:
     *   1. Lanza la precarga de la SIGUIENTE imagen de una vez (para que
     *      tenga toda la ventana de "duración visible" para bajar).
     *   2. Espera esa duración.
     *   3. Si la imagen YA está lista, hace el fundido al toque (caso
     *      normal). Si no, ESPERA a que sí esté lista antes de fundir —
     *      la imagen actual se queda un poco más en vez de cambiar a una
     *      a medio cargar.
     */
    async function ciclo() {
      const siguiente = (indice + 1) % IMAGENES_HERO_LOGIN.length;
      const listaSiguiente = precargarImagen_(urlPara(siguiente));

      await new Promise((resolve) => { idEspera = setTimeout(resolve, DURACION_VISIBLE_MS); });
      if (detenido) return;

      await listaSiguiente;
      if (detenido) return;

      indice = siguiente;
      oculta.style.backgroundImage = urlPara(indice);
      oculta.classList.add('login-hero-bg-visible');
      visible.classList.remove('login-hero-bg-visible');
      const anteriorVisible = visible;
      visible = oculta;
      oculta = anteriorVisible;

      ciclo();
    }

    visible.style.backgroundImage = urlPara(indice);
    visible.classList.add('login-hero-bg-visible');
    ciclo();

    actualizarHeroLoginTema = () => {
      visible.style.backgroundImage = urlPara(indice);
    };

    detenerHeroLogin = () => {
      detenido = true;
      if (idEspera) clearTimeout(idEspera);
    };
  }

  // Fecha de hoy en la barra superior, formato "Martes 10 de agosto del 2026".
  (function initFechaTopbar() {
    const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const meses = [
      'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
      'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
    ];
    const hoy = new Date();
    const texto = `${dias[hoy.getDay()]} ${hoy.getDate()} de ${meses[hoy.getMonth()]} del ${hoy.getFullYear()}`;
    const el = document.getElementById('topbar-date');
    if (el) el.textContent = texto;
  })();

  // Sidebar colapsable — igual que el tema, se aplica antes de pintar para evitar parpadeo.
  (function initColapsoSidebar() {
    try {
      if (localStorage.getItem('sidebarColapsado') === '1') {
        document.getElementById('sidebar').classList.add('collapsed');
      }
    } catch (e) { /* no-op */ }
  })();

  document.addEventListener('click', (ev) => {
    const btnTema = ev.target.closest('.theme-btn');
    if (btnTema) { aplicarTema(btnTema.dataset.tema); return; }

    if (ev.target.closest('#sidebar-collapse-btn')) {
      const sidebar = document.getElementById('sidebar');
      const colapsado = sidebar.classList.toggle('collapsed');
      try { localStorage.setItem('sidebarColapsado', colapsado ? '1' : '0'); } catch (e) { /* no-op */ }
    }
  });

  // Tooltip del sidebar colapsado (ver .sidebar-tooltip en styles.html —
  // vive en <body>, no dentro de #sidebar, para no toparse con su
  // overflow-x:hidden). Delegado en document: los grupos se regeneran con
  // innerHTML, así que no sirve engancharlo elemento por elemento.
  const tooltipSidebar = document.createElement('div');
  tooltipSidebar.className = 'sidebar-tooltip';
  document.body.appendChild(tooltipSidebar);

  document.addEventListener('mouseover', (ev) => {
    const el = ev.target.closest('[data-tooltip]');
    const sidebar = document.getElementById('sidebar');
    if (!el || !sidebar.contains(el) || !sidebar.classList.contains('collapsed')) return;
    const rect = el.getBoundingClientRect();
    tooltipSidebar.textContent = el.dataset.tooltip;
    tooltipSidebar.style.top = (rect.top + rect.height / 2) + 'px';
    tooltipSidebar.style.left = (rect.right + 12) + 'px';
    tooltipSidebar.classList.add('show');
  });
  document.addEventListener('mouseout', (ev) => {
    if (ev.target.closest('[data-tooltip]')) tooltipSidebar.classList.remove('show');
  });

  const state = {
    token: sessionStorage.getItem('token') || null,
    sesion: JSON.parse(sessionStorage.getItem('sesion') || 'null'),
    // Permisos por módulo (PermisosService/Modulos.gs), se leen del servidor en cada carga
    // (ver render). Deciden qué items del menú aparecen (NAV_GRUPOS, `requiere`), si se puede
    // entrar a una vista (navegarA) y qué botones de edición enseña cada módulo.
    permisos: {},
  };

  /** ¿Qué puede hacer esta persona en un módulo? 'LECTURA' | 'EDICION' | undefined */
  const permisoDe = (modulo) => (state.permisos || {})[modulo];
  // Las vistas que este proyecto tiene apagadas (MODULOS_APAGADOS en Entornos.gs; las pone
  // Index.html): ni el menú las pinta ni navegarA las abre. El servidor también las rechaza.
  const VISTAS_APAGADAS = (() => {
    try { return JSON.parse(document.body.dataset.apagados || '[]'); } catch (e) { return []; }
  })();
  // Apagar 'helpdesk' apaga su familia (el grupo y sus vistas 'helpdesk-…')
  const estaApagada = (entrada) => [entrada.vista, entrada.id].some((v) => v && VISTAS_APAGADAS.some((a) => v === a || v.indexOf(a + '-') === 0));
  const puedeEditarModulo = (modulo) => permisoDe(modulo) === 'EDICION';
  /**
   * Lo de OTRO módulo dentro de una pantalla (una pestaña de la ficha): solo se pide si la
   * persona puede ver ese módulo; si no, da null y esa pestaña no se pinta. Si sí puede y
   * falla por otra cosa, da `vacio` y las demás siguen. Ver CLAUDE.md, "Permisos entre módulos".
   */
  const deModulo = (modulo, fn, vacio) => (permisoDe(modulo) ? fn().catch(() => vacio) : Promise.resolve(null));

  /** Escapa HTML al insertar texto dinámico con innerHTML (evita XSS con datos de hojas) */
  function escaparHtml(valor) {
    return String(valor == null ? '' : valor).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  /** Fecha de hoy en horario LOCAL como "YYYY-MM-DD" (a diferencia de hoyISO(), que usa UTC) */
  function hoyLocal() {
    const f = new Date();
    return [f.getFullYear(), String(f.getMonth() + 1).padStart(2, '0'), String(f.getDate()).padStart(2, '0')].join('-');
  }

  function guardarSesion(resultadoLogin) {
    state.token = resultadoLogin.token;
    state.sesion = resultadoLogin;
    sessionStorage.setItem('token', state.token);
    sessionStorage.setItem('sesion', JSON.stringify(resultadoLogin));
    sesionExpiradaManejada = false; // por si la siguiente sesión también llega a expirar
  }

  function cerrarSesion() {
    if (state.token) apiLogoutSafe();
    limpiarListasGuardadas();   // en una computadora compartida no se queda nada (api.html)
    state.token = null;
    state.sesion = null;
    sessionStorage.clear();
    render();
  }
  /**
   * Al entrar, por detrás y de dos en dos: las listas de los módulos que la persona puede
   * ver. Así el primer módulo que abra ya pinta al instante (y la caché del servidor queda
   * caliente para todos). Si algo falla, no pasa nada: el módulo la pide al abrir.
   */
  const LISTAS_POR_MODULO = {
    vehiculos: ['apiListarVehiculosResumen'], incidencias: ['apiListarIncidencias'],
    'cambios-vehiculos': ['apiListarCambiosVehiculos'], 'reasignaciones-vehiculares': ['apiListarReasignacionesVehiculares'],
    verificaciones: ['apiListarVerificaciones'], 'inspeccion-vehicular': ['apiListarInspecciones'],
    'instalacion-sensores': ['apiListarSensores'], hologramas: ['apiListarHologramas'],
    uber: ['apiListarUberResumen'], tickets: ['apiListarTicketsResumen'],
    'caja-chica': ['apiListarCajasChicasResumen', 'apiListarCambiosMontoCCH'], arqueos: ['apiListarArqueosResumen'],
  };
  function precargarListas() {
    const pendientes = Object.keys(LISTAS_POR_MODULO)
      .filter((m) => permisoDe(m))
      .reduce((t, m) => t.concat(LISTAS_POR_MODULO[m]), [])
      .filter((fn, i, todas) => todas.indexOf(fn) === i);
    const siguiente = () => {
      const fn = pendientes.shift();
      if (fn && state.token) precargarLista(fn, state.token).then(siguiente);
    };
    // Primero lo que la persona abre (el inicio); luego, de dos en dos
    setTimeout(() => { siguiente(); siguiente(); }, 1500);
  }

  async function apiLogoutSafe() {
    try { await callServer('apiLogout', state.token); } catch (e) { /* no-op */ }
  }

  /**
   * Cualquier llamada al servidor (desde cualquier pantalla/módulo) que
   * truene con "Sesión expirada" llega aquí, vía callServer (api.html).
   * Antes cada módulo lo manejaba (o no) por su cuenta — se veía como
   * catálogos/selects vacíos sin explicación (ej. Arqueos). Ahora: se
   * regresa al login de una vez, con un aviso claro ahí mismo.
   * sesionExpiradaManejada evita procesarlo varias veces si revientan
   * varias llamadas en paralelo (ej. un Promise.all) por la misma causa.
   */
  let sesionExpiradaManejada = false;
  function manejarSesionExpirada() {
    if (sesionExpiradaManejada || !state.token) return;
    sesionExpiradaManejada = true;
    state.token = null;
    state.sesion = null;
    sessionStorage.clear();
    render();
    const errorBox = document.getElementById('login-error');
    if (errorBox) {
      errorBox.textContent = 'Tu sesión expiró — vuelve a iniciar sesión.';
      errorBox.hidden = false;
    }
  }

  const llavePermisos_ = () => 'permisos_' + String((state.sesion && state.sesion.correo) || '').toLowerCase();
  function permisosGuardados_() {
    try { return JSON.parse(localStorage.getItem(llavePermisos_()) || 'null'); } catch (e) { return null; }
  }
  function guardarPermisos_(permisos) {
    try { localStorage.setItem(llavePermisos_(), JSON.stringify(permisos)); } catch (e) { /* sin almacenamiento: no pasa nada */ }
  }

  function render() {
    document.getElementById('app-shell').hidden = !state.token;
    document.getElementById('login-screen-container').hidden = !!state.token;

    if (!state.token) {
      initLogin();
      return;
    }
    document.getElementById('user-name').textContent = state.sesion.nombre + ' · ' + state.sesion.rol;
    document.getElementById('user-avatar').innerHTML = Avatar.html(state.sesion.correo, state.sesion.nombre, { tam: 30 });
    // Las fotos de todos (una vez; con copia de la visita anterior salen al instante). Una copia
    // vacía (de cuando el directorio todavía no respondía) no se usa: se piden frescas
    Avatar.cargar(() => callServerCacheado('apiFotosPerfil', state.token).then((copia) =>
      (copia && Object.keys(copia).length ? copia : callServer('apiFotosPerfil', state.token))));
    marcarTemaActual(); // entrar con la sesión guardada no pasa por el login, que era quien marcaba el botón
    // El menú se pinta de una vez con los permisos de la visita anterior (guardados en este
    // navegador) y se corrige cuando llegan los de verdad. Solo deciden qué se ENSEÑA: el
    // servidor revisa el permiso en cada llamada. La primera vez no hay copia y solo se ve el
    // inicio hasta que lleguen; si fallan, se queda así.
    state.permisos = permisosGuardados_() || {};
    renderNavGrupos();
    callServer('apiMisPermisos', state.token).then((info) => {
      state.permisos = (info && info.permisos) || {};
      guardarPermisos_(state.permisos);
      renderNavGrupos();
      precargarListas();
    }).catch((err) => toastError('No se pudieron cargar tus permisos: ' + ((err && err.message) || err)));
    Notificaciones.iniciar();
    navegarA('dashboard');
  }

  /**
   * Pantalla de carga que se muestra justo después de un login exitoso
   * (manual o con Google), antes de entrar al dashboard. Los 4 íconos de
   * módulos se van "encendiendo" en secuencia con un mensaje temático, para
   * darle personalidad a la espera en vez de un spinner genérico.
   */
  function mostrarPantallaCarga(callback) {
    // El login (#login-screen-container) se quedaba visible DEBAJO de la
    // pantalla de carga durante toda la animación — no se ocultaba hasta el
    // callback final (render()). No se notaba mientras la pantalla de carga
    // estaba a opacidad completa, pero en su fade-out final (ver abajo) sí
    // se iba transparentando y dejaba ver el formulario de login por
    // debajo un instante, justo antes de pasar al sistema. Ocultarlo desde
    // aquí (apenas arranca la animación, no hasta que termina) lo evita.
    document.getElementById('login-screen-container').hidden = true;
    // El login ya no se va a volver a ver — apaga el slideshow de su fondo
    // en vez de dejarlo corriendo de fondo apuntando a elementos ocultos.
    if (detenerHeroLogin) { detenerHeroLogin(); detenerHeroLogin = null; }
    actualizarHeroLoginTema = null;

    // Mientras corre la animación ya se piden los permisos y el Inicio: render() y la vista
    // de inicio reciben estas mismas respuestas (adelantar, api.html) en vez de pedirlas después
    adelantar('apiMisPermisos', state.token);
    adelantar('apiResumenInicio', state.token);

    const container = document.getElementById('loading-screen-container');
    montarVista('tpl-loading', null, container);

    const pasos = [
      { icono: 'loading-icon-0', mensaje: 'Sincronizando vehículos…' },
      { icono: 'loading-icon-1', mensaje: 'Actualizando líneas telefónicas…' },
      { icono: 'loading-icon-2', mensaje: 'Revisando accesorios…' },
      { icono: 'loading-icon-3', mensaje: 'Cerrando caja chica del día…' },
    ];
    // Era 1.9 s de espera fija antes de pedir nada; ahora es más corta y los datos ya vienen en camino
    const duracionTotal = 1000;
    const porPaso = duracionTotal / pasos.length;

    const barra = document.getElementById('loading-bar-fill');
    const mensaje = document.getElementById('loading-message');

    requestAnimationFrame(() => {
      barra.style.transitionDuration = duracionTotal + 'ms';
      barra.style.width = '100%';
    });

    pasos.forEach((paso, i) => {
      setTimeout(() => {
        document.getElementById(paso.icono).classList.add('active');
        mensaje.classList.add('fade');
        setTimeout(() => {
          mensaje.textContent = paso.mensaje;
          mensaje.classList.remove('fade');
        }, 150);
      }, i * porPaso);
    });

    setTimeout(() => {
      const pantalla = document.getElementById('loading-screen');
      pantalla.classList.add('fade-out');
      setTimeout(() => {
        container.innerHTML = '';
        callback();
      }, 450);
    }, duracionTotal + 250);
  }

  /**
   * Una vista puede poner algo en la barra de arriba (Help Desk: su marca junto al logo y su
   * búsqueda al centro, para usar toda la pantalla). Lo que pone lleva data-de-vista y navegarA
   * lo quita al cambiar de vista. donde: 'izquierda' (junto al logo) o 'centro'.
   */
  function ponerEnBarraSuperior(el, donde) {
    const barra = document.querySelector('.topbar');
    el.setAttribute('data-de-vista', '');
    if (donde === 'izquierda') barra.querySelector('.topbar-left').appendChild(el);
    else barra.insertBefore(el, barra.querySelector('.topbar-right'));
    return el;
  }

  function montarVista(templateId, initFn, container) {
    container = container || document.getElementById('view-container');
    const tpl = document.getElementById(templateId);
    container.innerHTML = '';
    container.appendChild(tpl.content.cloneNode(true));
    refreshIcons();
    if (initFn) initFn();
  }

  /** Ícono (nombre de Lucide) temático según a qué área pertenece la vista. */
  function iconoDeVista(vista) {
    const destino = vistaDe(vista);
    return destino ? destino.iconoArea : 'file-text';
  }

  /**
   * Transición corta y temática al cambiar de módulo — no acelera la carga
   * real, solo evita que el cambio se sienta "trabado" o instantáneo/brusco.
   * Mantiene la vista anterior visible detrás mientras aparece, monta la
   * vista nueva a la mitad, y se desvanece revelándola.
   */
  function transicionVista(vista, etiqueta, montarVistaReal) {
    // Se cuelga de #main (no de #view-container) para cubrir TODO el módulo
    // sin importar si la vista anterior estaba scrolleada — #view-container
    // hace scroll interno, así que un overlay dentro de él se movía con el
    // scroll y dejaba ver contenido viejo.
    const cont = document.getElementById('main');
    const overlay = document.createElement('div');
    overlay.className = 'view-transition';
    overlay.innerHTML =
      '<div class="view-transition-icon"><i data-lucide="' + iconoDeVista(vista) + '" class="ico"></i></div>' +
      '<div class="view-transition-text">Cargando ' + (etiqueta || '') + '…</div>';
    cont.appendChild(overlay);
    refreshIcons();
    requestAnimationFrame(() => overlay.classList.add('show'));

    // La vista se monta casi de inmediato (antes se esperaban 2.5 s fijos): el aviso solo suaviza el cambio
    setTimeout(() => {
      montarVistaReal();
      overlay.classList.remove('show');
      setTimeout(() => overlay.remove(), 300);
    }, 180);
  }

  // vehículo" de otras tablas (Verificaciones, Inspecciones, Sensor, Hologramas,

  // módulo termina de montarse y cargar su lista, initVehiculos lo revisa y abre
  // la ficha directo, sin que el usuario tenga que buscar el folio a mano.
  let folioFichaVehiculoPendiente = null;
  function verFichaVehiculoDesdeOtroModulo(folio) {
    if (!folio) return;
    folioFichaVehiculoPendiente = folio;
    navegarA('vehiculos', 'Vehículos');

  let idCchFichaPendiente = null;

  // Qué vista está montada ahora mismo -- lo usa el asistente flotante (más abajo) para saber
  // si esta pantalla tiene un tour (NAV_GRUPOS / VISTAS_FUERA_DEL_MENU → `tour`). Se guarda
  // aquí, no se adivina del menú (⟵ llega igual por el historial o un enlace entre módulos).
  let vistaActual = null;

  /** Lo hace caminar a su esquina una vez (no en bucle -- "o ya es mucho", usuario 7-oct);
   *  navegarA la llama solo si de verdad se cambió de pantalla, no al reclicar la misma. */
  function caminarAsistente() {
    const btn = document.getElementById('asistente-flotante');
    if (!btn || btn.hidden) return;
    btn.classList.remove('asistente-caminando');
    void btn.offsetWidth; // reinicia la animación por si ya estaba a medias
    btn.classList.add('asistente-caminando');
  }

  function navegarA(vista, etiqueta) {
    if (vista !== vistaActual) caminarAsistente();
    vistaActual = vista;
    // Rama emmanuel: cada cambio de módulo es un paso de Atrás/Adelante (html/historial-navegador.html)
    if (typeof HistorialApp !== 'undefined') HistorialApp.alNavegar(vista, etiqueta);
    document.querySelectorAll('.nav-item, .nav-subitem').forEach((el) => {
      el.classList.toggle('active', el.dataset.view === vista);
    });

    transicionVista(vista, etiqueta, () => {
      // El menú ya esconde lo que no se puede ver, pero a una vista también se llega por el
      // historial del navegador o por los enlaces entre módulos ("Ver vehículo")
      // Adónde lleva cada vista está en NAV_GRUPOS / VISTAS_FUERA_DEL_MENU, no aquí
      document.querySelectorAll('.topbar [data-de-vista]').forEach((el) => el.remove());   // lo que puso la vista anterior
      const destino = vistaDe(vista);
      if (!destino || estaApagada(destino)) { mostrarProximamente(etiqueta || vista); return; }
      if (destino.requiere && !permisoDe(destino.requiere)) { mostrarSinAcceso(etiqueta || destino.etiqueta); return; }
      montarVista(destino.plantilla, destino.init);
    });
  }

  /**
   * La entrada de una vista (de NAV_GRUPOS o de VISTAS_FUERA_DEL_MENU), con `iconoArea`: el ícono
   * de su grupo del menú. null si no existe.
   */
  function vistaDe(vista) {
    for (const g of NAV_GRUPOS) {
      if (g.vista === vista) return Object.assign({ iconoArea: g.icono }, g);
      const item = (g.items || []).find((it) => it.vista === vista);
      if (item) return Object.assign({ iconoArea: g.icono }, item);
    }
    const suelta = VISTAS_FUERA_DEL_MENU.find((v) => v.vista === vista);
    return suelta ? Object.assign({ iconoArea: suelta.icono }, suelta) : null;
  }

  // Los grupos ya no son acordeón (se abren/cierran) — se quedan siempre
  // abiertos, el encabezado es nomás la etiqueta de la sección.
  function renderNavGrupos() {
    const contenedor = document.getElementById('nav-groups');
    // Una entrada con `vista` y sin `items` es un acceso directo suelto
    // (sin desplegable), como Gestión de Activos (rama emmanuel).
    // Un item solo se pinta si hay permiso de su módulo (`requiere`). Los `libre` (accesos a
    // sistemas externos, sin datos de la app) no piden permiso, pero no bastan para que se vea
    // su grupo: un grupo sin ningún módulo con permiso no se pinta. Por eso esto se vuelve a
    // llamar al llegar los permisos.
    const visibles = NAV_GRUPOS
      .filter((g) => !estaApagada(g))
      .map((g) => (g.items ? Object.assign({}, g, { items: g.items.filter((it) => !estaApagada(it) && (it.libre || permisoDe(it.requiere))) }) : g))
      // Un grupo `libre` (Help Desk) se ve aunque solo le queden items libres
      .filter((g) => (g.items ? g.items.length && (g.libre || g.items.some((it) => !it.libre)) : g.libre || permisoDe(g.requiere)));
    contenedor.innerHTML = visibles.map((grupo) => (grupo.vista ? `
      <div class="nav-item" data-view="${grupo.vista}" data-etiqueta="${grupo.etiqueta}" data-tooltip="${grupo.etiqueta}">
        <span class="nav-icon"><i data-lucide="${grupo.icono}" class="ico"></i></span><span class="nav-label">${grupo.etiqueta}</span>
      </div>` : `
      <div class="nav-group" id="nav-group-${grupo.id}">
        <div class="nav-group-header" data-tooltip="${grupo.etiqueta}">
          <span class="nav-icon"><i data-lucide="${grupo.icono}" class="ico"></i></span>
          <span class="nav-label">${grupo.etiqueta}</span>
          <span class="nav-group-chevron"><i data-lucide="chevron-right" class="ico"></i></span>
        </div>
        <div class="nav-group-items">
          ${grupo.items.map((item) => `
            <div class="nav-subitem" data-view="${item.vista}" data-etiqueta="${item.etiqueta}">
              <span class="nav-subitem-icon"><i data-lucide="${item.icono}" class="ico"></i></span>
              <span class="nav-subitem-label">${item.etiqueta}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `)).join('');

    contenedor.querySelectorAll('.nav-item[data-view]').forEach((el) => {
      el.addEventListener('click', () => navegarA(el.dataset.view, el.dataset.etiqueta));
    });
    contenedor.querySelectorAll('.nav-group-header').forEach((header) => {
      header.addEventListener('click', () => {
        const grupoEl = header.closest('.nav-group');
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('collapsed')) {
          // Con el sidebar colapsado, picarle a un grupo lo expande de una
          // vez Y abre ese submenú en específico (no solo un toggle normal).
          sidebar.classList.remove('collapsed');
          try { localStorage.setItem('sidebarColapsado', '0'); } catch (e) { /* no-op */ }
          grupoEl.classList.add('expanded');
        } else {
          grupoEl.classList.toggle('expanded');
        }
      });
    });
    contenedor.querySelectorAll('.nav-subitem').forEach((el) => {
      el.addEventListener('click', () => navegarA(el.dataset.view, el.dataset.etiqueta));
    });
    refreshIcons();
  }

  // ---------- Login ----------
  function initLogin() {
    const login = document.getElementById('login-screen-container');
    montarVista('tpl-login', null, login);

    aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
    initLoginHeroSlideshow();

    const inputPassword = document.getElementById('login-password');
    document.getElementById('toggle-password').addEventListener('click', (ev) => {
      const seVaAMostrar = inputPassword.type === 'password';
      inputPassword.type = seVaAMostrar ? 'text' : 'password';
      ev.currentTarget.innerHTML = `<i data-lucide="${seVaAMostrar ? 'eye' : 'eye-off'}" class="ico"></i>`;
      refreshIcons();
    });

    initGoogleQuickLogin();

    document.getElementById('form-login').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const correo = document.getElementById('login-correo').value.trim();
      const password = document.getElementById('login-password').value;
      const errorBox = document.getElementById('login-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-login');
      // Sin esto: el primer clic sí manda la petición, pero como
      // google.script.run tarda (sobre todo el primero de la sesión) el
      // botón se ve exactamente igual que antes de darle clic — parece
      // "congelado" y es fácil volver a darle, lo que manda una SEGUNDA
      // petición en paralelo; cuando ambas responden, la pantalla de carga
      // (mostrarPantallaCarga) se dispara dos veces seguidas y se ve como
      // que la animación "brinca"/se repite. Deshabilitar los dos botones
      // de inicio de sesión (no solo este) evita ambos casos: doble clic en
      // el mismo, y clic en el OTRO método mientras este ya está en curso.
      if (btn.disabled) return;
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Ingresando…';
      const chip = document.getElementById('google-account-chip');
      if (chip) chip.disabled = true;
      try {
        const resultado = await callServer('apiLogin', correo, password);
        guardarSesion(resultado);
        mostrarPantallaCarga(() => render());
        // A propósito NO se reactivan los botones en éxito: ya se está
        // navegando a la pantalla de carga, no debería poder volver a
        // usarse este formulario.
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
        if (chip) chip.disabled = false;
      }
    });
  }

  /**
   * Detecta la cuenta de Google con la que ya se accedió a la webapp (el
   * acceso restringido a dominio obliga a iniciar sesión con Google antes de
   * siquiera llegar aquí) y, si coincide con un usuario activo, muestra el
   * botón de acceso directo "Continuar como [nombre]".
   */
  async function initGoogleQuickLogin() {
    const detectando = document.getElementById('google-account-detectando');
    const chip = document.getElementById('google-account-chip');
    const divisor = document.getElementById('login-or-divider');
    try {
      const identidad = await callServer('apiIdentidadGoogle');
      if (!identidad || !identidad.coincide) return; // se queda solo el formulario manual

      document.getElementById('google-account-avatar').innerHTML =
        Avatar.html(identidad.correo, identidad.nombre, { tam: 34, foto: identidad.foto });
      document.getElementById('google-account-name').textContent = identidad.nombre || identidad.correo;
      document.getElementById('google-account-email').textContent = identidad.correo;
      chip.hidden = false;
      divisor.hidden = false;

      chip.addEventListener('click', async () => {
        if (chip.disabled) return; // mismo motivo que en btn-login — evita doble petición por clics repetidos
        const errorBox = document.getElementById('login-error');
        errorBox.hidden = true;
        const contenidoOriginal = chip.innerHTML;
        chip.disabled = true;
        chip.innerHTML = '<span class="spinner"></span>';
        const btnLogin = document.getElementById('btn-login');
        if (btnLogin) btnLogin.disabled = true;
        try {
          const resultado = await callServer('apiLoginConGoogle');
          guardarSesion(resultado);
          mostrarPantallaCarga(() => render());
          // Tampoco se reactiva en éxito — ver comentario en form-login.
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.hidden = false;
          chip.disabled = false;
          chip.innerHTML = contenidoOriginal;
          if (btnLogin) btnLogin.disabled = false;
        }
      });
    } catch (err) {
      // Si falla la detección (poco común), simplemente se queda el formulario manual.
    } finally {
      detectando.hidden = true;
    }
  }

  /** Números del panel de Inicio (KPIs, alertas y actividad reciente) — un solo viaje al servidor. */
  async function cargarResumenInicio() {
    const contActividad = document.getElementById('dash-actividad');
    if (!contActividad) return; // se navegó a otra vista antes de terminar de montar esta
    try {
      const r = JSON.parse(await callServerListaCacheada('apiResumenInicio', state.token));
      if (!document.body.contains(contActividad)) return; // se navegó a otra vista mientras cargaba

      const set = (id, valor) => {
        const el = document.getElementById(id);
        if (el) el.textContent = (valor === null || valor === undefined) ? '—' : valor;
      };
      // Llena el anillo de la tarjeta según valor/total (ej. vehículos activos de
      // todos los vehículos). Sin total (ticketsRecientes: ventana de 30 días, no
      // es una parte de un todo) el anillo queda lleno, solo como acento de color.
      const anillo = (id, valor, total) => {
        const el = document.getElementById(id);
        if (!el) return;
        const pct = (typeof valor === 'number' && typeof total === 'number' && total > 0)
          ? Math.max(0, Math.min(100, Math.round((valor / total) * 100)))
          : 100;
        el.style.setProperty('--stat-pct', pct);
      };

      set('dash-kpi-vehiculos-activos', r.vehiculos && r.vehiculos.activos);
      set('dash-kpi-vehiculos-baja', r.vehiculos && r.vehiculos.baja);
      set('dash-kpi-incidencias-abiertas', r.ticketsIncidencias && r.ticketsIncidencias.incidenciasAbiertas);
      set('dash-kpi-tickets-recientes', r.ticketsIncidencias && r.ticketsIncidencias.ticketsRecientes);
      set('dash-kpi-cch-vigentes', r.cajasChicas && r.cajasChicas.vigentes);
      set('dash-kpi-cch-proceso', r.cajasChicas && r.cajasChicas.enProcesoCierre);
      set('dash-alerta-verif-vencidas', r.alertas.verificaciones && r.alertas.verificaciones.vencidas);
      set('dash-alerta-verif-por-vencer', r.alertas.verificaciones && r.alertas.verificaciones.porVencer);
      set('dash-alerta-insp-atrasadas', r.alertas.inspecciones && r.alertas.inspecciones.atrasadas);

      anillo('dash-ring-vehiculos-activos', r.vehiculos && r.vehiculos.activos, r.vehiculos && r.vehiculos.total);
      anillo('dash-ring-vehiculos-baja', r.vehiculos && r.vehiculos.baja, r.vehiculos && r.vehiculos.total);
      anillo('dash-ring-incidencias-abiertas', r.ticketsIncidencias && r.ticketsIncidencias.incidenciasAbiertas, r.ticketsIncidencias && r.ticketsIncidencias.incidenciasTotal);
      anillo('dash-ring-tickets-recientes', null, null);
      anillo('dash-ring-cch-vigentes', r.cajasChicas && r.cajasChicas.vigentes, r.cajasChicas && r.cajasChicas.total);
      anillo('dash-ring-cch-proceso', r.cajasChicas && r.cajasChicas.enProcesoCierre, r.cajasChicas && r.cajasChicas.total);
      anillo('dash-ring-verif-vencidas', r.alertas.verificaciones && r.alertas.verificaciones.vencidas, r.alertas.verificaciones && r.alertas.verificaciones.total);
      anillo('dash-ring-verif-por-vencer', r.alertas.verificaciones && r.alertas.verificaciones.porVencer, r.alertas.verificaciones && r.alertas.verificaciones.total);
      anillo('dash-ring-insp-atrasadas', r.alertas.inspecciones && r.alertas.inspecciones.atrasadas, r.alertas.inspecciones && r.alertas.inspecciones.total);

      contActividad.innerHTML = (r.actividad || []).length
        ? '<div class="historial-timeline">' + r.actividad.map((e) => `
            <div class="historial-item">
              <div class="historial-icon"><i data-lucide="${e.icono}" class="ico"></i></div>
              <div class="historial-main">
                <div class="historial-campo">${escaparHtml(e.tipo)}</div>
                <div class="historial-valores">${escaparHtml(e.texto || '')}</div>
              </div>
              <div class="historial-meta"><div>${formatearFecha(e.fecha)}</div></div>
            </div>
          `).join('') + '</div>'
        : '<p class="empty-state">Sin actividad reciente.</p>';
      refreshIcons();
    } catch (err) {
      if (document.body.contains(contActividad)) {
        contActividad.innerHTML = '<p class="empty-state">No se pudo cargar la actividad reciente.</p>';
      }
    }
  }

  // ---------- Incidencias ----------
  function hoyISO() {
    return new Date().toISOString().slice(0, 10);
  }
  function fijarFechaRegistroHoy() {
    document.getElementById('inc-fecha-registro').value = new Date().toLocaleDateString('es-MX');
  }
  function fechaParaInput(valor) {
    if (!valor) return '';
    const f = new Date(valor);
    return isNaN(f) ? '' : f.toISOString().slice(0, 10);
  }
  function formatearFecha(valor) {
    if (!valor) return '—';
    const f = new Date(valor);
    return isNaN(f) ? '—' : f.toLocaleDateString('es-MX');
  }
  /** Formatea un monto como pesos mexicanos ($1,234.56) — solo para mostrar
   * en tablas/detalle; los campos de captura siguen siendo number normal. */
  function formatearMoneda(valor) {
    if (valor === '' || valor === null || valor === undefined) return '—';
    const n = Number(valor);
    return isNaN(n) ? '—' : n.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
  }

  // ============================================================
  // Motor genérico de "tabla interactiva": buscador global, orden
  // y filtro por columna (menú desplegable en cada encabezado, al
  // estilo Contiene/Es igual a/Vacío…) y paginación. Cada módulo
  // sigue pintando su propio <tbody> (con badges, tags y botones de
  // acción) — este motor solo decide QUÉ subconjunto/orden de datos
  // le toca pintar, y arma el encabezado interactivo + el pie de
  // paginación.
  // ============================================================
  const OPERADORES_FILTRO_TABLA = [
    { valor: 'contiene', texto: 'Contiene' },
    { valor: 'no-contiene', texto: 'No contiene' },
    { valor: 'igual', texto: 'Es igual a' },
    { valor: 'empieza', texto: 'Empieza con' },
    { valor: 'termina', texto: 'Termina con' },
    { valor: 'vacio', texto: 'Está vacío' },
    { valor: 'no-vacio', texto: 'No está vacío' },
  ];

  function crearTablaInteractiva(cfg) {
    const {
      thead,               // <thead> a llenar dinámicamente
      columnas,            // [{clave, etiqueta}] — una por cada columna filtrable (sin contar acciones)
      conAcciones = true,  // agrega un <th></th> extra al final (columna de botones, sin filtro)
      buscadorGlobal,      // <input type="search"> opcional
      piePaginacion,       // contenedor donde se pinta "Mostrando X-Y de Z" + selector + flechas
      onRenderPagina,      // (datosDePagina, totalFiltrado) => pinta el <tbody>
      porPagina = 25,
    } = cfg;

    let datosOriginales = [];
    let pagina = 1;
    let filasPorPagina = porPagina;
    const filtros = {};
    let orden = null;
    let popoverAbierto = null;
    let cerrarSiFueraFn = null;

    function coincideOperador(valorCelda, operador, valorFiltro) {
      const a = String(valorCelda == null ? '' : valorCelda).toLowerCase();
      const b = String(valorFiltro || '').toLowerCase();
      switch (operador) {
        case 'contiene': return a.includes(b);
        case 'no-contiene': return !a.includes(b);
        case 'igual': return a === b;
        case 'empieza': return a.startsWith(b);
        case 'termina': return a.endsWith(b);
        case 'vacio': return a === '';
        case 'no-vacio': return a !== '';
        default: return true;
      }
    }

    // Si la columna tiene pocos valores distintos en los datos actuales (ej.
    // Estado, Estatus, Rol — no Departamento/Nombre, que tienen decenas o
    // cientos), el filtro se pinta como checklist de esos valores reales en
    // vez del cuadro de texto genérico — no hay que escribir ni acertarle a
    // como está capturado. filtro.tipo === 'lista'. Con más valores que esto
    // sigue siendo el filtro de texto (contiene/igual/etc.), como antes.
    const UMBRAL_FILTRO_LISTA = 15;

    function coincideFiltro(valorCelda, filtro) {
      if (filtro.tipo === 'lista') {
        return filtro.valores.includes(String(valorCelda == null ? '' : valorCelda));
      }
      // 'personalizado': para los KPI clickeables (ver aplicarFiltro más
      // abajo) — misma función que ya se usa para contar ese KPI, en vez de
      // tener que traducirla a una lista de valores exactos.
      if (filtro.tipo === 'personalizado') {
        return filtro.prueba(valorCelda);
      }
      return coincideOperador(valorCelda, filtro.operador, filtro.valor);
    }

    function datosFiltrados() {
      let r = datosOriginales;
      const global = (buscadorGlobal && buscadorGlobal.value.trim().toLowerCase()) || '';
      if (global) {
        r = r.filter((fila) => columnas.some((c) => String(fila[c.clave] == null ? '' : fila[c.clave]).toLowerCase().includes(global)));
      }
      Object.keys(filtros).forEach((clave) => {
        const f = filtros[clave];
        if (!f) return;
        r = r.filter((fila) => coincideFiltro(fila[clave], f));
      });
      if (orden) {
        const dir = orden.dir === 'desc' ? -1 : 1;
        r = r.slice().sort((a, b) => String(a[orden.clave] == null ? '' : a[orden.clave])
          .localeCompare(String(b[orden.clave] == null ? '' : b[orden.clave]), 'es', { numeric: true, sensitivity: 'base' }) * dir);
      }
      return r;
    }

    function cerrarPopover() {
      if (popoverAbierto) { popoverAbierto.remove(); popoverAbierto = null; }
      if (cerrarSiFueraFn) { document.removeEventListener('click', cerrarSiFueraFn); cerrarSiFueraFn = null; }
    }

    function abrirPopover(boton, columna) {
      if (popoverAbierto) { cerrarPopover(); return; }
      const rect = boton.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'th-popover';
      const actual = filtros[columna.clave];
      const ordenAsc = !!(orden && orden.clave === columna.clave && orden.dir === 'asc');
      const ordenDesc = !!(orden && orden.clave === columna.clave && orden.dir === 'desc');

      // Valores realmente presentes en los datos actuales para esta
      // columna — si son pocos, el filtro se pinta como checklist en vez
      // de texto libre (ver UMBRAL_FILTRO_LISTA arriba).
      const valoresPresentes = new Set();
      datosOriginales.forEach((fila) => {
        const v = fila[columna.clave];
        if (v !== '' && v !== null && v !== undefined) valoresPresentes.add(String(v));
      });
      const listaValores = [...valoresPresentes].sort((a, b) => a.localeCompare(b, 'es', { numeric: true, sensitivity: 'base' }));
      const esLista = listaValores.length > 0 && listaValores.length <= UMBRAL_FILTRO_LISTA;

      const ordenHtml = `
        <div class="th-popover-orden">
          <button type="button" class="secondary ${ordenAsc ? 'activo' : ''}" data-dir="asc">A → Z</button>
          <button type="button" class="secondary ${ordenDesc ? 'activo' : ''}" data-dir="desc">Z → A</button>
        </div>
      `;

      let cuerpoHtml;
      if (esLista) {
        // Sin filtro activo (o filtro de otro tipo, ej. cambiaron de dirty
        // los datos): todo marcado = "no estoy filtrando nada todavía".
        const seleccionados = actual && actual.tipo === 'lista' ? new Set(actual.valores) : null;
        cuerpoHtml = `
          <div class="th-popover-lista-acciones">
            <button type="button" class="th-popover-marcar-todos">Marcar todos</button>
            <button type="button" class="th-popover-marcar-ninguno">Ninguno</button>
          </div>
          <div class="th-popover-lista">
            ${listaValores.map((v) => `
              <label class="th-popover-opcion">
                <input type="checkbox" value="${v.replace(/"/g, '&quot;')}" ${!seleccionados || seleccionados.has(v) ? 'checked' : ''} />
                <span>${v}</span>
              </label>
            `).join('')}
          </div>
        `;
      } else {
        const valorActual = (actual && actual.tipo !== 'lista') ? actual : { operador: 'contiene', valor: '' };
        cuerpoHtml = `
          <select class="th-popover-operador">
            ${OPERADORES_FILTRO_TABLA.map((o) => `<option value="${o.valor}" ${o.valor === valorActual.operador ? 'selected' : ''}>${o.texto}</option>`).join('')}
          </select>
          <input type="text" class="th-popover-valor" placeholder="Valor" value="${String(valorActual.valor || '').replace(/"/g, '&quot;')}" />
        `;
      }

      pop.innerHTML = `
        <div class="th-popover-titulo">${columna.etiqueta}</div>
        ${ordenHtml}
        ${cuerpoHtml}
        <div class="th-popover-acciones">
          <button type="button" class="secondary th-popover-quitar">Quitar filtro</button>
          <button type="button" class="th-popover-aplicar">Aplicar</button>
        </div>
      `;
      document.body.appendChild(pop);
      const ancho = 230;
      pop.style.left = Math.max(8, Math.min(rect.left + window.scrollX, window.innerWidth - ancho - 8)) + 'px';
      pop.style.top = (rect.bottom + window.scrollY + 6) + 'px';

      pop.querySelectorAll('.th-popover-orden button').forEach((btn) => {
        btn.addEventListener('click', () => {
          orden = { clave: columna.clave, dir: btn.dataset.dir };
          pagina = 1;
          cerrarPopover();
          renderTodo();
        });
      });

      if (esLista) {
        pop.querySelector('.th-popover-marcar-todos').addEventListener('click', () => {
          pop.querySelectorAll('.th-popover-lista input').forEach((el) => { el.checked = true; });
        });
        pop.querySelector('.th-popover-marcar-ninguno').addEventListener('click', () => {
          pop.querySelectorAll('.th-popover-lista input').forEach((el) => { el.checked = false; });
        });
        pop.querySelector('.th-popover-aplicar').addEventListener('click', () => {
          const marcados = [...pop.querySelectorAll('.th-popover-lista input:checked')].map((el) => el.value);
          // Nada marcado (no tendría match nunca) o todo marcado (equivale
          // a "sin filtro") — en ambos casos mejor quitar el filtro.
          if (marcados.length === 0 || marcados.length === listaValores.length) delete filtros[columna.clave];
          else filtros[columna.clave] = { tipo: 'lista', valores: marcados };
          pagina = 1;
          cerrarPopover();
          renderTodo();
        });
      } else {
        const valorInput = pop.querySelector('.th-popover-valor');
        const operadorSelect = pop.querySelector('.th-popover-operador');
        function actualizarValorVisible() {
          valorInput.hidden = ['vacio', 'no-vacio'].includes(operadorSelect.value);
        }
        actualizarValorVisible();
        operadorSelect.addEventListener('change', actualizarValorVisible);
        if (!valorInput.hidden) valorInput.focus();

        pop.querySelector('.th-popover-aplicar').addEventListener('click', () => {
          const operador = operadorSelect.value;
          const valor = valorInput.value.trim();
          if (['vacio', 'no-vacio'].includes(operador) || valor) filtros[columna.clave] = { tipo: 'texto', operador, valor };
          else delete filtros[columna.clave];
          pagina = 1;
          cerrarPopover();
          renderTodo();
        });
      }

      pop.querySelector('.th-popover-quitar').addEventListener('click', () => {
        delete filtros[columna.clave];
        pagina = 1;
        cerrarPopover();
        renderTodo();
      });

      popoverAbierto = pop;
      setTimeout(() => {
        cerrarSiFueraFn = (ev) => { if (!pop.contains(ev.target) && !boton.contains(ev.target)) cerrarPopover(); };
        document.addEventListener('click', cerrarSiFueraFn);
      }, 0);
    }

    function renderEncabezado() {
      thead.innerHTML = '<tr>' + columnas.map((c) => {
        const activo = !!filtros[c.clave] || (orden && orden.clave === c.clave);
        return `<th class="th-interactivo ${activo ? 'activo' : ''}" data-clave="${c.clave}">
          <span class="th-interactivo-label">${c.etiqueta}<i data-lucide="chevron-down" class="ico"></i></span>
        </th>`;
      }).join('') + (conAcciones ? '<th></th>' : '') + '</tr>';
      thead.querySelectorAll('.th-interactivo').forEach((th) => {
        const columna = columnas.find((c) => c.clave === th.dataset.clave);
        th.querySelector('.th-interactivo-label').addEventListener('click', (ev) => {
          ev.stopPropagation();
          abrirPopover(th, columna);
        });
      });
      refreshIcons();
    }

    function renderPie(totalFiltrado) {
      if (!piePaginacion) return;
      const totalPaginas = Math.max(1, Math.ceil(totalFiltrado / filasPorPagina));
      if (pagina > totalPaginas) pagina = totalPaginas;
      const inicio = totalFiltrado === 0 ? 0 : (pagina - 1) * filasPorPagina + 1;
      const fin = Math.min(pagina * filasPorPagina, totalFiltrado);
      piePaginacion.innerHTML = `
        <span>Mostrando ${inicio}-${fin} de ${totalFiltrado}</span>
        <div class="tabla-pie-paginas">
          <select class="tabla-pie-tamano">
            ${[10, 25, 50, 100].map((n) => `<option value="${n}" ${n === filasPorPagina ? 'selected' : ''}>${n} por página</option>`).join('')}
          </select>
          <button type="button" class="tp-prev" ${pagina <= 1 ? 'disabled' : ''}><i data-lucide="chevron-left" class="ico"></i></button>
          <span>Página ${pagina} de ${totalPaginas}</span>
          <button type="button" class="tp-next" ${pagina >= totalPaginas ? 'disabled' : ''}><i data-lucide="chevron-right" class="ico"></i></button>
        </div>
      `;
      piePaginacion.querySelector('.tabla-pie-tamano').addEventListener('change', (ev) => {
        filasPorPagina = Number(ev.target.value);
        pagina = 1;
        renderTodo();
      });
      piePaginacion.querySelector('.tp-prev').addEventListener('click', () => { pagina -= 1; renderTodo(); });
      piePaginacion.querySelector('.tp-next').addEventListener('click', () => { pagina += 1; renderTodo(); });
      refreshIcons();
    }

    function renderTodo() {
      const filtrado = datosFiltrados();
      const totalPaginas = Math.max(1, Math.ceil(filtrado.length / filasPorPagina));
      if (pagina > totalPaginas) pagina = totalPaginas;
      const inicio = (pagina - 1) * filasPorPagina;
      const pageData = filtrado.slice(inicio, inicio + filasPorPagina);
      renderEncabezado();
      onRenderPagina(pageData, filtrado.length);
      renderPie(filtrado.length);
    }

    if (buscadorGlobal) buscadorGlobal.addEventListener('input', () => { pagina = 1; renderTodo(); });

    return {
      setDatos(datos) { datosOriginales = datos || []; renderTodo(); },
      refrescar: renderTodo,
      // Filtrado + ordenado actual, SIN recortar por página — para exportar
      // exactamente lo que el usuario está viendo (con sus filtros aplicados).
      obtenerFiltrados: datosFiltrados,
      // Para que los KPI (stat-tiles) de cada módulo funcionen como filtro
      // de la tabla con solo darles clic — ver wireKpiFiltro más abajo.
      aplicarFiltro(clave, filtro) {
        filtros[clave] = filtro;
        pagina = 1;
        renderTodo();
      },
      quitarFiltro(clave) {
        delete filtros[clave];
        pagina = 1;
        renderTodo();
      },
    };
  }

  /** Descarga un arreglo de objetos como .csv (Excel lo abre nativo, con
   *  acentos/ñ correctos gracias al BOM). `columnas` = [{clave, etiqueta}],
   *  igual que las que ya usa crearTablaInteractiva. */
  function exportarCSV(nombreArchivo, columnas, filas) {
    const escapar = (valor) => {
      const texto = String(valor == null ? '' : valor);
      return /[",\n]/.test(texto) ? '"' + texto.replace(/"/g, '""') + '"' : texto;
    };
    const encabezado = columnas.map((c) => escapar(c.etiqueta)).join(',');
    const cuerpo = (filas || []).map((fila) => columnas.map((c) => escapar(fila[c.clave])).join(',')).join('\r\n');
    const contenido = '﻿' + encabezado + '\r\n' + cuerpo;
    const blob = new Blob([contenido], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const enlace = document.createElement('a');
    enlace.href = url;
    enlace.download = nombreArchivo;
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();
    URL.revokeObjectURL(url);
  }
  // Helpers compartidos para las tarjetas de "detalle completo" (Incidencias y Vehículos).
  function tituloDesdeClave(clave) {
    return clave.toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase());
  }
  function formatearValorInfo(valor) {
    if (typeof valor === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(valor)) return formatearFecha(valor);
    // \/{2} y no \/\/: así no queda ningún "//" en el código (ver CLAUDE.md)
    if (typeof valor === 'string' && /^https?:\/{2}/.test(valor)) {
      return `<a href="${valor}" target="_blank" rel="noopener">📎 Ver archivo</a>`;
    }
    return String(valor);
  }
  function itemInfo(etiqueta, valor) {
    return `
      <div class="info-item">
        <div class="info-label">${etiqueta}</div>
        <div class="info-value">${formatearValorInfo(valor)}</div>
      </div>
    `;
  }
  function seccionInfo(icono, titulo) {
    return `<div class="info-section-title"><i data-lucide="${icono}" class="ico"></i> ${titulo}</div>`;
  }

  // Responsiva/Adherente Vehicular (form-pasos/form-paso-chip/form-paso/

  // ya tenía CAMPOS_VEHICULO, en su mismo orden, así que la ficha de solo lectura

  // pasos (igual que Responsiva/Adherente): se puede ir y venir libremente.
  const VEH_GRUPOS_PASO = ['Vehículo', 'Identificación', 'Documentación y seguro', 'Accesorios y sensor', 'Ubicación y registro'];

  /** Los campos del formulario de vehículo (componente CamposHoja), repartidos en los
   * pasos de VEH_GRUPOS_PASO con el `soloGrupos` que CamposHoja.html ya trae para esto --

   * Departamento/No. de empleado (autoCondicional) se sugieren al elegir Responsable, con
   * "auto" (ver wireResponsableVehiculo). `columnas` es el ancho de la rejilla de cada
   * paso (3 en Registrar, 2 en el modal de Editar, que es más angosto). */
  function renderCamposVehiculo(prefijo, esEdicion, columnas) {

        '<li><button type="button" class="form-paso-chip" data-ir="' + i + '">' +
          '<span class="form-paso-num">' + (i + 1) + '</span>' + escaparHtml(g) + '</button></li>').join('') +

        '<section class="form-paso" data-paso="' + i + '"' + (i === 0 ? '' : ' hidden') + '>' +
          '<div class="form-rejilla" data-columnas="' + (columnas || 3) + '">' +

  /** Cablea Atrás/Siguiente/Guardar y las pastillas de arriba para un formulario de
   * Vehículo ya pintado con renderCamposVehiculo -- lo usan tanto Registrar como Editar,
   * cada uno con su propio contenedor y botones. Regresa { ir } para volver al paso 1
   * después de guardar o cerrar. */
  function wirePasosVehiculo(contenedor, ids) {
    let pasoActual = 0;
    function mostrar(i) {
      pasoActual = i;
      contenedor.querySelectorAll('.form-paso').forEach((s) => { s.hidden = Number(s.dataset.paso) !== i; });
      contenedor.querySelectorAll('.form-paso-chip').forEach((chip) => {
        const idx = Number(chip.dataset.ir);
        chip.classList.toggle('activo', idx === i);
        chip.classList.toggle('completado', idx < i);
      });
      document.getElementById(ids.atras).hidden = i === 0;
      document.getElementById(ids.siguiente).hidden = i === VEH_GRUPOS_PASO.length - 1;
      document.getElementById(ids.guardar).hidden = i !== VEH_GRUPOS_PASO.length - 1;
      document.getElementById(ids.cuenta).textContent = 'Paso ' + (i + 1) + ' de ' + VEH_GRUPOS_PASO.length;
    }
    document.getElementById(ids.siguiente).addEventListener('click', () => mostrar(Math.min(pasoActual + 1, VEH_GRUPOS_PASO.length - 1)));
    document.getElementById(ids.atras).addEventListener('click', () => mostrar(Math.max(pasoActual - 1, 0)));
    contenedor.querySelectorAll('.form-paso-chip').forEach((chip) => {
      chip.addEventListener('click', () => mostrar(Number(chip.dataset.ir)));
    });
    mostrar(0);
    return { ir: mostrar };
  }

  // servidor como {SEDE 2: [ubicaciones]} (cargarCatalogosVehiculo, dentro
  // de initVehiculos, la llena) y se filtra aquí en el cliente. A nivel de
  // módulo (no dentro de initVehiculos) porque poblarFormularioVehiculo
  // también la necesita y se define antes de que initVehiculos exista.
  let mapaUbicacionesPorSede = {};
  function llenarUbicacionesSegunSede(prefijo) {
    const sedeEl = document.getElementById(prefijo + '-sede');
    const ubicacionDatalist = document.getElementById(prefijo + '-' + slugCampo('OFICINA / DESARROLLO') + '-lista');

   * Ubicación depende de la Sede: SEDE va antes en CAMPOS_VEHICULO, así que al llegar a
   * Ubicación la Sede ya tiene su valor y se repueblan las sugerencias para ESA sede. */
  function poblarFormularioVehiculo(prefijo, datos) {
    CamposHoja.poblar(CAMPOS_VEHICULO, prefijo, datos, {
      antes: { 'OFICINA / DESARROLLO': llenarUbicacionesSegunSede },
    });
