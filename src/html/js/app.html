    // ---------- Menú contextual (clic derecho en la tabla) ----------
    // Mismos 5 formularios de captura que ya usan los botones "Agregar" de la ficha
    // (abrirAgregarVerificacion/Sensor/Holograma/Incidencia/Inspeccion), pero como
    // acceso directo desde la tabla sin entrar primero a la ficha -- trae lo que
    // haga falta (completo, y hologramas para Inspección) antes de abrir el formulario.
    async function abrirCapturaRapidaVehiculo(vResumen, tipo) {
      try {
        const necesitaCompleto = tipo === 'holograma' || tipo === 'incidencia' || tipo === 'inspeccion';
        const [completo, hologramasTexto] = await Promise.all([
          necesitaCompleto ? callServer('apiBuscarVehiculoPorFolio', state.token, vResumen.FOLIO) : Promise.resolve(null),
          tipo === 'inspeccion' ? callServer('apiHologramasPorFolio', state.token, vResumen.FOLIO).catch(() => '[]') : Promise.resolve('[]'),
        ]);
        if (tipo === 'verificacion') abrirAgregarVerificacion(vResumen);
        else if (tipo === 'sensor') abrirAgregarSensor(vResumen);
        else if (tipo === 'holograma') abrirAgregarHolograma(vResumen, completo);
        else if (tipo === 'incidencia') abrirAgregarIncidencia(vResumen, completo);
        else if (tipo === 'inspeccion') abrirAgregarInspeccion(vResumen, completo, JSON.parse(hologramasTexto || '[]'));
      } catch (err) {
        toastError('No se pudo preparar la captura: ' + err.message);
      }
    }

    /** Acceso rápido: cambia solo ESTATUS entre los 5 valores operativos (sin abrir el
     *  formulario completo de Editar). "BAJA VEHICULAR" NO es una opción aquí a propósito:
     *  tiene su propio botón (darDeBajaVehiculo) para que dar de baja sea siempre esa acción
     *  de un clic y nunca el formulario completo -- ver el comentario de ahí por qué. Sirve
     *  también para "Reactivar" un vehículo en baja: se le pide elegir a cuál de los 5 vuelve. */
    function cambiarEstatusRapidoVehiculo(v) {
      const cuerpo = abrirCapturaVehiculo('toggle-right', 'ESTATUS', 'Cambiar estatus', 'Folio ' + v.FOLIO);
      const form = Formulario.crear(cuerpo, {
        ancho: 'uno', columnas: 1,
        campos: [{ id: 'ESTATUS', etiqueta: 'Nuevo estatus', tipo: 'lista', requerido: true }],
        textoGuardar: 'Guardar estatus', iconoGuardar: 'save',
        alGuardar: async (valores) => {
          await callServer('apiActualizarVehiculo', state.token, v.ID_VEHICULO, { ESTATUS: valores.ESTATUS });
          invalidarCacheLista('apiListarVehiculosResumen', state.token);
          invalidarCacheCatalogo('apiListarVehiculosBasico', state.token);
        },
        textoExito: () => 'Estatus actualizado',
        alGuardado: () => { cerrarCapturaVehiculo(); cargar(); },
      });
      form.setOpciones('ESTATUS',
        ['PRESTAMO', 'UTILITARIO', 'NO UTILITARIO', 'NUCO SIN INFORMACION', 'FUERA DE SERVICIO'], v.ESTATUS);
    }

    /** Dar de baja: sin modal, y solo toca ESTATUS -- nunca Placa, Departamento ni Responsable
     *  del vehículo. Antes la única forma de marcar una baja era el formulario completo de
     *  Editar, y ahí la costumbre (heredada del AppSheet) era escribir también "BAJA VEHICULAR"
     *  en esas otras columnas para que "se viera" la baja -- de ahí salen los centinelas que
     *  Relaciones.gs tiene que filtrar al propagar. Con esta acción separada ya no hace falta
     *  pasar por ese formulario solo para dar de baja. Funciona con una o varias filas
     *  seleccionadas a la vez (las que ya estén de baja se saltan solas). Reversible con
     *  "Reactivar" (cambiarEstatusRapidoVehiculo) -- por eso sin confirmación. */
    async function darDeBajaVehiculo(filas) {
      const aDarDeBaja = filas.filter((v) => String(v.ESTATUS || '').toUpperCase() !== 'BAJA VEHICULAR');
      if (!aDarDeBaja.length) return;
      try {
        await Promise.all(aDarDeBaja.map((v) =>
          callServer('apiActualizarVehiculo', state.token, v.ID_VEHICULO, { ESTATUS: 'BAJA VEHICULAR' })));
        invalidarCacheLista('apiListarVehiculosResumen', state.token);
        invalidarCacheCatalogo('apiListarVehiculosBasico', state.token);
        toastExito(aDarDeBaja.length === 1 ? 'Vehículo dado de baja' : aDarDeBaja.length + ' vehículos dados de baja');
        cargar();
      } catch (err) {
        toastError('No se pudo dar de baja: ' + err.message);
      }
    }

    /** Eliminar directo desde el menú contextual -- mismo apiEliminarVehiculo y limpieza
     *  de caché que el botón "Eliminar" masivo de la tabla, pero para una sola fila. */
    const tabla = DataTable.crear(document.getElementById('veh-tabla'), {
      idCampo: 'ID_VEHICULO',
      idTabla: 'vehiculos',
      tarjetasAncho: true,   // el botón Tabla/Tarjetas también en escritorio (usuario, 7-oct)
      buscarColumna: [   // (usuario, 7-oct)
        { campo: 'NUCCO', placeholder: 'Buscar por Nucco…' },
        { campo: 'SERIE_VEHICULO', placeholder: 'Buscar por Serie…' },
      ],
      textoVacio: 'Todavía no hay vehículos registrados',
      exportar: {
        nombreArchivo: 'Vehículos',
        titulo: 'Descarga la base completa: todas las filas y columnas de la hoja, sin importar filtros ni búsqueda',
        descargar: async () => ExportarExcel.descargarCrudo({ nombreArchivo: 'Vehículos', filas: JSON.parse(await callServer('apiVehiculosCompleto', state.token)) }),
      },
      columnasCompletas: { idHoja: 'ID', cargar: async () => JSON.parse(await callServer('apiVehiculosCompleto', state.token)) },
      etiquetaFila: (v) => v.FOLIO,
      alCambiarFiltros: (filtros) => marcarKpiActivo(filtros),
      // false (no panel lateral): la ficha completa es su propia pantalla —
      // se abre con doble clic en la fila o el ícono de "ojo" (ver más abajo),
      // mismo patrón que equipos/líneas en el módulo de Líneas Telefónicas.
      detalle: false,
      // Selección estilo Google Drive/Apple (rama emmanuel, ver componentes/datatable.html):
      // clic = selecciona la fila, Ctrl/Cmd+clic y Shift+clic como en Drive, doble clic =
      // abre la ficha (alAbrirFila), cuadro con el mouse, Ctrl/Cmd+A. El ⋮ de cada fila y el
      // clic derecho muestran las mismas acciones (accionesFila + accionesSeleccion de abajo).
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (v) => abrirFichaVehiculo(v),
      alTocarFila: (v) => abrirFichaVehiculo(v),
      columnas: [
        { campo: 'FOLIO', titulo: 'Folio', tipo: 'texto', fijada: true, enDetalle: false },
        { campo: 'NUCCO', titulo: 'Nucco', tipo: 'texto', enDetalle: false },
        { campo: 'DEPARTAMENTO', titulo: 'Departamento', tipo: 'lista', enDetalle: false },
        { campo: 'CLASE', titulo: 'Clase', tipo: 'lista', render: (v) => etiquetaClase(v), renderFiltro: (v) => etiquetaClase(v), enDetalle: false },
        { campo: 'MARCA', titulo: 'Marca', tipo: 'lista', enDetalle: false },
        { campo: 'LINEA_VEHICULO', titulo: 'Línea', tipo: 'lista', enDetalle: false },
        { campo: 'MODELO', titulo: 'Año', tipo: 'texto', enDetalle: false },
        { campo: 'PLACA', titulo: 'Placa', tipo: 'texto', enDetalle: false },
        // Visible por defecto (no 'visible:false' como NO_ECONOMICO/COLOR/SEDE de abajo): si
        // se escondiera, el buscador de la tabla no la encontraría (filasFiltradas() solo busca
        // en columnas visibles) -- el usuario busca vehículos por serie seguido (usuario, 7-oct).
        // campo SERIE_VEHICULO (con guion bajo), no SERIE: "Vista" > columnas completas compara
        // normalizando "_"->" " contra el encabezado real de la hoja ("SERIE VEHICULO") -- con
        // otra clave no la reconoce como la misma y agrega una segunda columna duplicada.
        { campo: 'SERIE_VEHICULO', titulo: 'Serie Vehículo', tipo: 'texto', enDetalle: false },
        // 'texto' (no 'lista'): ESTATUS trae varias razones de baja distintas
        // ("BAJA VEHICULAR", etc.) — contiene/no contiene "BAJA" cubre todas
        // sin tener que enumerarlas, igual que hacía el filtro de KPI de antes.
        { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'texto', render: (v) => badgeEstatus(v), enDetalle: false },
        { campo: 'NO_ECONOMICO', titulo: 'No. económico', tipo: 'texto', visible: false, enDetalle: false },
        { campo: 'COLOR', titulo: 'Color', tipo: 'lista', visible: false, enDetalle: false },
        { campo: 'SEDE', titulo: 'Sede', tipo: 'lista', visible: false, enDetalle: false },
        { campo: 'FECHA_REGISTRO', titulo: 'Fecha de registro', tipo: 'fecha', visible: false, enDetalle: false },
      ],
      accionesFila: [
        { icono: 'eye', titulo: 'Ver ficha', alHacer: (v) => abrirFichaVehiculo(v) },
      ].concat(puedeEditar ? [{ icono: 'pencil', titulo: 'Editar', alHacer: (v) => abrirEditarVehiculo(v) }] : []),
      // Antes vivían en menuContextual (antes de seleccionDrive, ver arriba) --
      // ahora el ⋮/clic derecho sale solo de accionesFila + accionesSeleccion.
      // enBarra:false: quedan en el ⋮ (no en la barra, son demasiadas para caber ahí).
      // maximo:1 en casi todas (solo aplican con una fila seleccionada) -- "Dar de
      // baja" es la excepción, acepta varias a la vez. "Eliminar" NO se repite
      // aquí: ya la agrega cfg.alEliminar, con el chequeo de integridad
      // (apiQueImpideBorrar) que la vieja eliminarVehiculoRapido no tenía.
      accionesSeleccion: puedeEditar ? [
        {
          icono: 'ban', texto: 'Dar de baja', enBarra: false, grupo: 'estado',
          visible: (filas) => filas.some((f) => String(f.ESTATUS || '').toUpperCase() !== 'BAJA VEHICULAR'),
          alHacer: (filas) => darDeBajaVehiculo(filas),
        },
        {
          icono: 'toggle-right', texto: 'Cambiar estatus', maximo: 1, enBarra: false, grupo: 'estado',
          alHacer: (filas) => cambiarEstatusRapidoVehiculo(filas[0]),
        },
        { icono: 'clipboard-check', texto: 'Nueva verificación', maximo: 1, enBarra: false, grupo: 'captura', tituloGrupo: 'Capturar', alHacer: (filas) => abrirCapturaRapidaVehiculo(filas[0], 'verificacion') },
        { icono: 'clipboard-list', texto: 'Nueva inspección', maximo: 1, enBarra: false, grupo: 'captura', tituloGrupo: 'Capturar', alHacer: (filas) => abrirCapturaRapidaVehiculo(filas[0], 'inspeccion') },
        { icono: 'radio', texto: 'Nuevo sensor', maximo: 1, enBarra: false, grupo: 'captura', tituloGrupo: 'Capturar', alHacer: (filas) => abrirCapturaRapidaVehiculo(filas[0], 'sensor') },
        { icono: 'credit-card', texto: 'Nuevo holograma', maximo: 1, enBarra: false, grupo: 'captura', tituloGrupo: 'Capturar', alHacer: (filas) => abrirCapturaRapidaVehiculo(filas[0], 'holograma') },
        { icono: 'wrench', texto: 'Nueva incidencia', maximo: 1, enBarra: false, grupo: 'captura', tituloGrupo: 'Capturar', alHacer: (filas) => abrirCapturaRapidaVehiculo(filas[0], 'incidencia') },
      ] : [],
      alEliminar: puedeEditar ? async (filas) => {
        // Primero se pregunta por todos: si alguno tiene historial, no se borra ninguno
        const imp = await callServer('apiQueImpideBorrar', state.token, 'VEHICULOS', filas.map((f) => f.ID_VEHICULO));
        if (imp.mensaje) throw new Error(imp.mensaje);
        await Promise.all(filas.map((f) => callServer('apiEliminarVehiculo', state.token, f.ID_VEHICULO)));
        invalidarCacheLista('apiListarVehiculosResumen', state.token);
        invalidarCacheCatalogo('apiListarVehiculosBasico', state.token);
      } : null,
      motivoSinEliminar: 'Tu permiso en este módulo es de solo lectura',
    });

    // Clic en una pestaña de la ficha, o en "Ver" de un archivo de otro módulo
    // (comprobante, formato, responsiva, solicitud — cada uno abre igual que en su propio módulo).
    const ABRIR_ARCHIVO_FICHA = {
      verificacion: abrirComprobanteVerificacion, inspeccion: abrirFormatoInspeccion,
      sensor: abrirResponsivaSensor, holograma: abrirSolicitudHolograma,
    };
    document.getElementById('veh-detalle').addEventListener('click', (ev) => {
      const pestana = ev.target.closest('[data-ficha-tab]');
      if (pestana) { mostrarPestanaFichaVehiculo(pestana.dataset.fichaTab); return; }
      const archivo = ev.target.closest('[data-archivo]');
      if (archivo) ABRIR_ARCHIVO_FICHA[archivo.dataset.archivo](archivo.dataset.ruta);
    });
    // La ficha salió de su copia guardada y del servidor llegó algo distinto: se repinta en la
    // misma pestaña (sin "Cargando…" ni volver arriba)
    escucharLista('apiFichaVehiculo', () => {
      const detalle = document.getElementById('veh-detalle');
      if (!fichaVehiculoAbierta || detalle.hidden) return;
      const activa = detalle.querySelector('[data-ficha-tab].active');
      abrirFichaVehiculo(fichaVehiculoAbierta, activa ? activa.dataset.fichaTab : undefined, true);
    }, document.getElementById('veh-detalle'));

    // Modal de captura (verificación/sensor/holograma/incidencia): cerrar con la X o clic afuera.
    const modalCaptura = document.getElementById('veh-modal-captura');
    document.getElementById('veh-captura-cerrar').addEventListener('click', cerrarCapturaVehiculo);
    modalCaptura.addEventListener('click', (ev) => { if (ev.target === modalCaptura) cerrarCapturaVehiculo(); });

    // Modal "Ver completo" (Verificaciones/Inspecciones/Sensor/Hologramas/Incidencias
    // desde la ficha): cerrar con la X o clic afuera.
    const modalVerRegistro = document.getElementById('veh-modal-ver-registro');
    document.getElementById('veh-ver-registro-cerrar').addEventListener('click', cerrarVerRegistroFicha);
    modalVerRegistro.addEventListener('click', (ev) => { if (ev.target === modalVerRegistro) cerrarVerRegistroFicha(); });

    // ---- Filtro rápido por Clase: misma franja de íconos de Líneas Telefónicas (filtro por
    // TIPO), aquí por CLASE -- el CSS ya es genérico (.filtro-tipo*, movido a styles.html) y
    // CLASE_ESTILO/etiquetaClase ya traían el ícono y color de cada clase, así que solo hace
    // falta pintar el panel y cablearlo (usuario, 6-oct: "los filtros... pero por la clase"). ----
    let filtrosActualesVeh = {};
    function marcarClasesVeh() {
      const cont = document.getElementById('veh-clases');
      if (!cont) return;
      const f = filtrosActualesVeh.CLASE;
      const elegidos = f && f.valores && f.valores.length ? f.valores : null;
      cont.querySelectorAll('.filtro-tipo-item').forEach((b) => {
        const activo = b.dataset.clase === '*' ? !elegidos : !!(elegidos && elegidos.indexOf(b.dataset.clase) >= 0);
        b.classList.toggle('activo', activo);
        b.setAttribute('aria-pressed', String(activo));
      });
    }
    function pintarClasesVeh(filas) {
      const cont = document.getElementById('veh-clases');
      if (!cont) return;
      const conteo = {};
      filas.forEach((v) => { const c = String(v.CLASE || '').toUpperCase(); conteo[c] = (conteo[c] || 0) + 1; });
      const clases = ORDEN_CLASES_VEH.concat(Object.keys(conteo).filter((c) => ORDEN_CLASES_VEH.indexOf(c) < 0 && c));
      const fila = (valor, icono, color, nombre, n) =>
        '<button type="button" class="filtro-tipo-item' + (n ? '' : ' filtro-tipo-item-vacio') + '" data-clase="' + escaparHtml(valor) + '" aria-pressed="false" title="' + escaparHtml(nombre + ' · ' + n) + '">' +
          '<span class="filtro-tipo-ico" style="color:' + color + '">' + Iconos.svg(icono) + '</span>' +
          '<span class="filtro-tipo-nombre">' + escaparHtml(nombre) + '</span><span class="filtro-tipo-num">' + n + '</span></button>';
      cont.innerHTML = '<div class="filtro-tipo-panel"><div class="filtro-tipo-titulo">Clase</div>' +
        fila('*', 'layers', 'var(--color-text-muted)', 'Todas', filas.length) +
        clases.map((c) => {
          const e = CLASE_ESTILO[c] || { icono: 'circle', color: 'var(--color-text-muted)' };
          return fila(c, e.icono, e.color, NOMBRE_CLASE_VEH[c] || c, conteo[c] || 0);
        }).join('') + '</div>';
      marcarClasesVeh();
    }
    document.getElementById('veh-clases').addEventListener('click', (ev) => {
      const b = ev.target.closest('.filtro-tipo-item');
      if (!b) return;
      const c = b.dataset.clase;
      tabla.setFiltro('CLASE', (c === '*' || b.classList.contains('activo')) ? null : { valores: [c] });
    });

    // Binario de antes (Activos = no es baja / Inactivos = es baja), más un KPI clickeable
    // por cada uno de los 6 valores reales de ESTATUS (ver CAMPOS_VEHICULO). "Baja de placa"
    // es la excepción: no es un ESTATUS nuevo -- es el valor que YA vive en la columna PLACA
    // (ver CENTINELAS.PLACA en Relaciones.gs y la opción "BAJA DE PLACA" del campo Placa en
    // CAMPOS_VEHICULO), así que ese tile trae su propio `campo` en vez de asumir ESTATUS.
    const KPI_AGREGADO_VEHICULOS = { 'veh-stat-activos': 'no_contiene', 'veh-stat-inactivos': 'contiene' };
    const KPI_FILTRO_VEHICULOS = {
      'veh-stat-utilitario': { campo: 'ESTATUS', valor: 'UTILITARIO' },
      'veh-stat-no-utilitario': { campo: 'ESTATUS', valor: 'NO UTILITARIO' },
      'veh-stat-prestamo': { campo: 'ESTATUS', valor: 'PRESTAMO' },
      'veh-stat-fuera-servicio': { campo: 'ESTATUS', valor: 'FUERA DE SERVICIO' },
      'veh-stat-nuco-sin-info': { campo: 'ESTATUS', valor: 'NUCO SIN INFORMACION' },
      'veh-stat-baja': { campo: 'ESTATUS', valor: 'BAJA VEHICULAR' },
      'veh-stat-baja-placa': { campo: 'PLACA', valor: 'BAJA DE PLACA' },
    };
    const tileTotalVeh = document.getElementById('veh-stat-total').closest('.stat-tile');
    tileTotalVeh.classList.add('stat-tile-clickable');
    tileTotalVeh.addEventListener('click', () => tabla.setFiltro('ESTATUS', null));
    Object.keys(KPI_AGREGADO_VEHICULOS).forEach((id) => {
      const tile = document.getElementById(id).closest('.stat-tile');
      tile.classList.add('stat-tile-clickable');
      tile.addEventListener('click', () => {
        const yaActivo = tile.classList.contains('stat-tile-activo');
        tabla.setFiltro('ESTATUS', yaActivo ? null : { op: KPI_AGREGADO_VEHICULOS[id], v1: 'BAJA' });
      });
    });
    Object.keys(KPI_FILTRO_VEHICULOS).forEach((id) => {
      const tile = document.getElementById(id).closest('.stat-tile');
      const cfg = KPI_FILTRO_VEHICULOS[id];
      tile.classList.add('stat-tile-clickable');
      tile.addEventListener('click', () => {
        const yaActivo = tile.classList.contains('stat-tile-activo');
        tabla.setFiltro(cfg.campo, yaActivo ? null : { op: 'igual', v1: cfg.valor });
      });
    });
    function marcarKpiActivo(filtros) {
      filtrosActualesVeh = filtros || {};
      marcarClasesVeh();
      const f = filtros.ESTATUS;
      tileTotalVeh.classList.toggle('stat-tile-activo', !f);
      Object.keys(KPI_AGREGADO_VEHICULOS).forEach((id) => {
        document.getElementById(id).closest('.stat-tile').classList.toggle(
          'stat-tile-activo', !!(f && f.op === KPI_AGREGADO_VEHICULOS[id] && f.v1 === 'BAJA')
        );
      });
      Object.keys(KPI_FILTRO_VEHICULOS).forEach((id) => {
        const cfg = KPI_FILTRO_VEHICULOS[id];
        const fc = filtros[cfg.campo];
        document.getElementById(id).closest('.stat-tile').classList.toggle(
          'stat-tile-activo', !!(fc && fc.op === 'igual' && fc.v1 === cfg.valor)
        );
      });
      // Los KPIs reflejan lo que hay bajo los filtros activos (los de columna, búsqueda,
      // etc.), no siempre el catálogo completo — igual que el pie de "N de M" de la tabla.
      actualizarKpis(tabla.getFiltradas());
    }

    function actualizarKpis(filas) {
      document.getElementById('veh-stat-total').textContent = filas.length;
      document.getElementById('veh-stat-activos').textContent =
        filas.filter((v) => !String(v.ESTATUS || '').toUpperCase().includes('BAJA')).length;
      document.getElementById('veh-stat-inactivos').textContent =
        filas.filter((v) => String(v.ESTATUS || '').toUpperCase().includes('BAJA')).length;
      Object.keys(KPI_FILTRO_VEHICULOS).forEach((id) => {
        const cfg = KPI_FILTRO_VEHICULOS[id];
        document.getElementById(id).textContent =
          filas.filter((v) => String(v[cfg.campo] || '').toUpperCase() === cfg.valor).length;
      });
    }

    async function cargar() {
      tabla.setCargando(true);
      try {
        const texto = await callServerListaCacheada('apiListarVehiculosResumen', state.token);
        todosLosVehiculos = texto ? JSON.parse(texto) : [];
      } catch (err) {
        tabla.setError('No se pudo cargar el catálogo de vehículos: ' + err.message);
        return;
      }
      // Si mientras tanto se navegó a otra vista, el router ya destruyó este
      // DOM (montarVista hace container.innerHTML = '') — escribir aquí
      // tronaría con "Cannot set properties of null".
      if (!document.body.contains(modalEditar)) return;

      vehiculosPorId = {};
      todosLosVehiculos.forEach((v) => { vehiculosPorId[v.ID_VEHICULO] = v; });

      actualizarKpis(todosLosVehiculos);
      pintarClasesVeh(todosLosVehiculos);
      tabla.setDatos(todosLosVehiculos);
    }
    // Pinta al instante con lo guardado; si del servidor llega algo distinto, se vuelve a pintar (api.html)
    escucharLista('apiListarVehiculosResumen', cargar, document.getElementById('view-container').firstElementChild);

    async function abrirEditarVehiculo(vResumen) {
      if (!vResumen) return;
      document.getElementById('editar-vehiculo-id').value = vResumen.ID_VEHICULO;
      document.getElementById('editar-vehiculo-folio-label').textContent = 'Folio: ' + vResumen.FOLIO;
      document.getElementById('editar-vehiculo-error').hidden = true;
      // El resumen (tabla) solo trae 12 columnas — para editar TODO se necesita
      // el registro completo, se pide igual que en "Detalle completo".
      poblarFormularioVehiculo('editar-vehiculo', vResumen);
      modalEditar.hidden = false;
      try {
        const completo = await callServer('apiBuscarVehiculoPorFolio', state.token, vResumen.FOLIO);
        if (completo) poblarFormularioVehiculo('editar-vehiculo', completo);
      } catch (err) {
        console.error('No se pudo cargar el registro completo para editar:', err);
        const errorBox = document.getElementById('editar-vehiculo-error');
        errorBox.textContent = 'No se pudieron cargar todos los campos: ' + err.message;
        errorBox.hidden = false;
      }
    }
    function cerrarEditarVehiculo() {
      modalEditar.hidden = true;
      document.getElementById('form-editar-vehiculo').reset();
      document.getElementById('editar-vehiculo-error').hidden = true;
      pasosEditarVeh.ir(0);
    }
    document.getElementById('btn-cancelar-editar-vehiculo').addEventListener('click', cerrarEditarVehiculo);
    modalEditar.addEventListener('click', (ev) => { if (ev.target === modalEditar) cerrarEditarVehiculo(); });

    document.getElementById('form-editar-vehiculo').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('editar-vehiculo-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-editar-vehiculo');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Subiendo archivos y guardando…';
      toastCargando('Guardando cambios…');
      try {
        const archivos = await subirArchivosVehiculo('editar-vehiculo');
        const datos = Object.assign(recolectarDatosVehiculo('editar-vehiculo'), archivos);
        await callServer('apiActualizarVehiculo', state.token, document.getElementById('editar-vehiculo-id').value, datos);
        cerrarEditarVehiculo();
        invalidarCacheLista('apiListarVehiculosResumen', state.token);
        invalidarCacheCatalogo('apiListarVehiculosBasico', state.token);
        await cargar();
        toastExito('Actualizado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo actualizar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    document.getElementById('form-vehiculo').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('veh-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-vehiculo');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Subiendo archivos y guardando…';
      toastCargando('Registrando…');
      try {
        const archivos = await subirArchivosVehiculo('veh');
        const datos = Object.assign(recolectarDatosVehiculo('veh'), archivos);
        await callServer('apiCrearVehiculo', state.token, datos);
        ev.target.reset();
        pasosAltaVeh.ir(0);
        document.getElementById('veh-fecha-registro-sistema-ci').value = hoyISO();
        previsualizarNuccoVeh();
        invalidarCacheLista('apiListarVehiculosResumen', state.token);
        invalidarCacheCatalogo('apiListarVehiculosBasico', state.token);
        await cargar();
        toastExito('Registrado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo registrar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    document.getElementById('btn-ver-reporte-vehiculos').addEventListener('click', () => {
      // "\/\/" (no "//"): Apps Script le borra a los .html todo lo que
      // encuentre después de "//" pensando que es un comentario — incluso
      // dentro de un string — y eso rompía justo esta línea. "\/" en un
      // string de JS es simplemente "/", así que el resultado es idéntico.
      window.open('https:\/\/datastudio.google.com/u/0/reporting/40272bf8-ecac-4d37-8cca-01f4c4c32841/page/1jHvF', '_blank', 'noopener');
    });

    // En paralelo, no uno tras otro — los catálogos no dependen de la lista
    // de vehículos ni viceversa.
    await Promise.all([cargarCatalogosVehiculo(), cargar()]);

    // Se llegó aquí desde "Ver vehículo" en otra tabla (verFichaVehiculoDesdeOtroModulo):
    // abre esa ficha directo, sin que el usuario tenga que buscar el folio a mano.
    if (folioFichaVehiculoPendiente) {
      const folio = folioFichaVehiculoPendiente;
      folioFichaVehiculoPendiente = null;
      const v = todosLosVehiculos.find((x) => x.FOLIO === folio);
      if (v) abrirFichaVehiculo(v);
      else toastError('No se encontró el vehículo con folio ' + folio);
    }
  }

  // Tour guiado de Vehículos (usuario, 7-oct): a propósito FUERA de initVehiculos (de verdad
  // afuera, no solo con la misma sangría -- initVehiculos ya estaba cerrada arriba) para que
  // lo pueda lanzar el asistente flotante (NAV_GRUPOS → tour) sin esperar a que el módulo esté
  // montado. El propio Tour navega a la pestaña correcta si hace falta (paso 0, `antes`).
  // Ver componentes/tour.html.
  function iniciarTourVehiculos() {
    Tour.iniciar([
      {
        selector: '#veh-listado .stat-row',
        titulo: 'Totales y KPIs',
        texto: 'Cuántos vehículos hay en cada estatus. Haz clic en cualquiera de estos números para filtrar la lista por ese valor -- otro clic lo quita.',
        antes: () => { const t = document.querySelector('#veh-tabs [data-tab="lista"]'); if (t) t.click(); },
      },
      {
        selector: '#veh-clases',
        titulo: 'Filtro por Clase',
        texto: 'Un ícono por cada clase de vehículo (automóvil, camioneta, camión…) con cuántos hay de cada una. Clic en uno para filtrar la tabla.',
      },
      {
        selector: '#veh-tabla .dt-buscar',
        titulo: 'Buscar en la tabla',
        texto: 'Escribe cualquier dato -- folio, marca, departamento, nucco -- y filtra la lista al instante.',
      },
      {
        selector: '#veh-tabla .dt-buscar-col',
        titulo: 'Buscar por Nucco o por Serie',
        texto: 'Si ya sabes el Nucco o la serie exacta, estos dos cuadros buscan solo ahí, sin mezclarse con los demás datos.',
      },
      {
        selector: '#veh-tabla .dt-modo',
        titulo: 'Tabla o Tarjetas',
        texto: 'Cambia cómo se ve la lista: tabla clásica o tarjetas, lo que se te acomode mejor.',
      },
      {
        selector: '#veh-tabla .dt-btn-excel',
        titulo: 'Exportar a Excel',
        texto: 'Descarga la base completa -- todas las columnas y filas -- sin importar los filtros que tengas activos.',
      },
      {
        selector: '#veh-tabs [data-tab="registrar"]',
        titulo: 'Registrar',
        texto: 'Da de alta un vehículo nuevo. El formulario va paso a paso: Vehículo, Identificación, Documentación y seguro, Accesorios y sensor, Ubicación y registro.',
      },
      {
        selector: '#veh-tabla tbody tr[data-id]',
        titulo: 'Cada vehículo',
        texto: 'Doble clic (o toca) una fila para ver su ficha completa. El ⋮ o clic derecho trae más acciones: editar, dar de baja (una o varias a la vez) y más.',
      },
    ]);
  }

  // Preguntas frecuentes de Vehículos (usuario, 7-oct): igual que iniciarTourVehiculos, a
  // propósito a nivel superior (fuera de initVehiculos) para que el asistente flotante la pueda
  // leer sin que el módulo esté montado. Ver componentes/ayuda.html.
  const AYUDA_VEHICULOS = [
    {
      pregunta: '¿Cómo busco un vehículo por su número de serie?',
      respuesta: 'En la pestaña Catálogo, usa el cuadro "Buscar por Serie…" junto al buscador general -- busca solo en esa columna, sin mezclarse con folio, marca, etc.',
    },
    {
      pregunta: '¿Cómo busco por Nucco?',
      respuesta: 'Igual que la serie: hay un cuadro dedicado "Buscar por Nucco…" junto al buscador general de la tabla.',
    },
    {
      pregunta: '¿Cómo doy de baja uno o varios vehículos a la vez?',
      respuesta: 'Selecciona uno o varios (clic, Shift+clic o Ctrl/Cmd+clic) y usa "Dar de baja" en la barra de acciones o el ⋮ de una fila.',
    },
    {
      pregunta: '¿Cómo exporto la tabla completa a Excel?',

    {

  // ---------- Uber (usuarios autorizados) ----------
  async function initUber() {
    wireTabsSimple(document.getElementById('view-container'));
    // Permisos del módulo (el servidor los vuelve a revisar en cada llamada)
    const puedeEditar = puedeEditarModulo('uber');
    if (!puedeEditar) document.querySelector('#uber-tabs .tab-btn[data-tab="registrar"]').remove();
    const modalEditar = document.getElementById('modal-editar-uber');
    let usuariosPorId = {};
    let todosLosUsuarios = [];

    // Razón social / Sede / Oficina-Desarrollo / Departamento: catálogos reales (hoja "LISTAS
    // VEHICULOS"), se llenan en cargarCatalogosUber; se puede escribir una opción nueva.
    // SOLICITUD es archivo (se sube aparte, subirArchivoUber). FECHA DE ALTA no se edita:
    // la fija el servidor solo al crear (siempre "hoy").
    const CAMPOS_UBER = [
      { clave: 'NOMBRE COMPLETO', etiqueta: 'Nombre completo', tipo: 'select', catalogo: true, requerido: true },
      { clave: 'RAZON SOCIAL', etiqueta: 'Razón social', tipo: 'select', catalogo: true },
      { clave: 'ESTAUS USUARIO', etiqueta: 'Estatus', tipo: 'select', opciones: ['ACTIVO', 'BAJA', 'PENDIENTE'] },
      { clave: 'ROL', etiqueta: 'Rol', tipo: 'select', opciones: ['ADMINISTRADOR', 'BENEFICIARIO', 'EMPLEADO'] },
      { clave: 'FECHA DE ALTA', etiqueta: 'Fecha de alta', tipo: 'text', soloLectura: true },
      { clave: 'CORREO ELECTRONICO', etiqueta: 'Correo electrónico', tipo: 'email' },
      { clave: 'NUMERO TELEFONO', etiqueta: 'Teléfono', tipo: 'text' },
      { clave: 'SEDE', etiqueta: 'Sede', tipo: 'select', catalogo: true },
      { clave: 'OFICINA/DESARROLLO', etiqueta: 'Oficina / Desarrollo', tipo: 'select', catalogo: true },
      { clave: 'DEPARTAMENTO', etiqueta: 'Departamento', tipo: 'select', catalogo: true },
      { clave: 'PUESTO', etiqueta: 'Puesto', tipo: 'text' },
      { clave: 'DIAS AUTORIZADOS', etiqueta: 'Días autorizados', tipo: 'text', placeholder: 'Ej. Lunes a viernes' },
      { clave: 'HORARIO AUTORIZADO', etiqueta: 'Horario autorizado', tipo: 'text', placeholder: 'Ej. 07:00 - 19:00' },
      { clave: 'SOLICITUD', etiqueta: 'Solicitud', tipo: 'file' },
    ];
    document.getElementById('campos-form-uber').innerHTML = CamposHoja.html(CAMPOS_UBER, { prefijo: 'uber' });
    document.getElementById('campos-form-editar-uber').innerHTML = CamposHoja.html(CAMPOS_UBER, { prefijo: 'editar-uber', esEdicion: true });

    document.getElementById('uber-fecha-de-alta').value = new Date().toLocaleDateString('es-MX');

    function badgeEstatusUber(estatus) {
      const valor = String(estatus || '').toUpperCase();
      if (valor.includes('BAJA')) {
        return '<span class="badge-estado baja"><i data-lucide="ban" class="ico"></i> Baja</span>';
      }
      if (valor.includes('PENDIENTE')) {
        return '<span class="badge-estado pendiente"><i data-lucide="clock" class="ico"></i> Pendiente</span>';
      }
      return '<span class="badge-estado activo"><i data-lucide="circle-check" class="ico"></i> Activo</span>';
    }

    function etiquetaRol(rol) {
      const mapa = { ADMINISTRADOR: 'tag-navy', BENEFICIARIO: 'tag-gold', EMPLEADO: 'tag-green' };
      const clase = mapa[String(rol || '').toUpperCase()] || 'tag-slate';
      return rol ? `<span class="tag ${clase}">${rol}</span>` : '—';
    }

    const llenarSelect = CamposHoja.llenarOpciones;
    // En su propia función para correr en paralelo con cargar() más abajo.
    /** Al elegir (o escribir exacto) un nombre de Capital Humano en "Nombre completo", sugiere
     *  Departamento/Puesto/Sede/Oficina-Desarrollo/Correo -- no bloquea los campos, se pueden
     *  corregir a mano. Si el nombre no coincide con nadie (alguien nuevo que CH no ha
     *  cargado), no hace nada: se deja capturar todo a mano, como ya era antes. Mismo patrón
     *  que wireResponsableVehiculo (arriba, para Vehículos).
     *
     *  Razón social y Teléfono NO se autollenan a propósito: razón social es del contrato
     *  (puede variar entre línea/vehículo/caja chica de la misma persona), y el teléfono ni
     *  siquiera llega a este sistema (CapitalHumano.gs lo excluye por privacidad). */
    function wireColaboradorUber(prefijo, colaboradores) {
      const porNombre = {};
      colaboradores.forEach((c) => { if (!porNombre[c.NOMBRE.toUpperCase()]) porNombre[c.NOMBRE.toUpperCase()] = c; });
      const idNombre = prefijo + '-nombre-completo';
      const input = document.getElementById(idNombre);
      if (!input || input.dataset.wireado) return; // una sola vez por campo, aunque se recarguen catálogos
      input.dataset.wireado = '1';
      input.addEventListener('input', () => {
        const colaborador = porNombre[input.value.trim().toUpperCase()];
        const depto = document.getElementById(prefijo + '-departamento');
        const puesto = document.getElementById(prefijo + '-puesto');
        const sede = document.getElementById(prefijo + '-sede');
        const oficina = document.getElementById(prefijo + '-oficina-desarrollo');
        const correo = document.getElementById(prefijo + '-correo-electronico');
        if (!colaborador) { [depto, puesto, sede, oficina, correo].forEach((el) => el && CampoAuto.quitar(el)); return; }
        if (depto && colaborador.DEPARTAMENTO) CampoAuto.llenar(depto, colaborador.DEPARTAMENTO);
        if (puesto && colaborador.PUESTO) CampoAuto.llenar(puesto, colaborador.PUESTO);
        if (sede && colaborador.SEDE) CampoAuto.llenar(sede, colaborador.SEDE);
        if (oficina && colaborador.OFICINA) CampoAuto.llenar(oficina, colaborador.OFICINA);
        if (correo && colaborador.CORREO) CampoAuto.llenar(correo, colaborador.CORREO);
      });
    }

    async function cargarCatalogosUber() {
      try {
        const [razones, sedes, oficinas, deptos, colaboradores] = await Promise.all([
          callServerCacheado('apiListarRazonesSociales', state.token),
          callServerCacheado('apiListarSedes', state.token),
          callServerCacheado('apiListarOficinasDesarrollo', state.token),
          callServerCacheado('apiListarDepartamentos', state.token),
          callServerCacheado('apiListarColaboradores', state.token),
        ]);
        ['uber-razon-social', 'editar-uber-razon-social'].forEach((id) => llenarSelect(id, razones));
        ['uber-sede', 'editar-uber-sede'].forEach((id) => llenarSelect(id, sedes));
        ['uber-oficina-desarrollo', 'editar-uber-oficina-desarrollo'].forEach((id) => llenarSelect(id, oficinas));
        ['uber-departamento', 'editar-uber-departamento'].forEach((id) => llenarSelect(id, deptos));
        const nombresColaboradores = Array.from(new Set((colaboradores || []).map((c) => c.NOMBRE)));
        ['uber-nombre-completo', 'editar-uber-nombre-completo'].forEach((id) => llenarSelect(id, nombresColaboradores));
        wireColaboradorUber('uber', colaboradores || []);
        wireColaboradorUber('editar-uber', colaboradores || []);
      } catch (err) {
        console.error('No se pudieron cargar los catálogos de Razón social/Sede/Oficina/Departamento/Colaboradores:', err);
      }
    }

    async function subirArchivoUber(prefijo) {
      const input = document.getElementById(prefijo + '-solicitud');
      const file = input && input.files && input.files[0];
      if (!file) return {};
      const base64 = await leerArchivoBase64(file);
      const subido = await callServer('apiSubirArchivoUber', state.token, file.name, file.type, base64);
      // SOLICITUD_FILE_ID no es una columna real (UberService.crear/actualizar la quita antes
      // de guardar) -- solo viaja para que el servidor pueda renombrar el archivo a
      // "<ID>_SOLICITUD_<fecha>" una vez que sabe el ID real del usuario.
      return { SOLICITUD: subido.url, SOLICITUD_FILE_ID: subido.id };
    }

    const tabla = DataTable.crear(document.getElementById('uber-tabla'), {
      idCampo: 'ID',
      idTabla: 'uber',
      textoVacio: 'Todavía no hay usuarios registrados',
      exportar: {
        nombreArchivo: 'Uber',
        titulo: 'Descarga la base completa: todas las filas y columnas de la hoja, sin importar filtros ni búsqueda',
        descargar: async () => ExportarExcel.descargarCrudo({ nombreArchivo: 'Uber', filas: JSON.parse(await callServer('apiUberCompleto', state.token)) }),
      },
      columnasCompletas: { idHoja: 'ID', cargar: async () => JSON.parse(await callServer('apiUberCompleto', state.token)) },
      etiquetaFila: (u) => u.NOMBRE_COMPLETO,
      alCambiarFiltros: (filtros) => marcarKpiActivo(filtros),
      detalle: { titulo: (u) => u.NOMBRE_COMPLETO || '' },
      // Selección estilo Google Drive/Apple (rama emmanuel, ver componentes/datatable.html):
      // clic = selecciona, doble clic/tocar = abre el panel de detalle (tabla.abrirDetalle
      // se resuelve en el momento del clic, para entonces `tabla` ya está asignada).
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (u) => tabla.abrirDetalle(String(u.ID)),
      alTocarFila: (u) => tabla.abrirDetalle(String(u.ID)),
      columnas: [
        { campo: 'NOMBRE_COMPLETO', titulo: 'Nombre', tipo: 'texto', fijada: true },
        { campo: 'RAZON_SOCIAL', titulo: 'Razón social', tipo: 'lista' },
        { campo: 'ROL', titulo: 'Rol', tipo: 'lista', render: (v) => etiquetaRol(v) },
        { campo: 'DEPARTAMENTO', titulo: 'Departamento', tipo: 'lista' },
        { campo: 'PUESTO', titulo: 'Puesto', tipo: 'texto' },
        { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista', render: (v) => badgeEstatusUber(v) },
        { campo: 'CORREO ELECTRONICO', titulo: 'Correo electrónico', tipo: 'texto', visible: false },
        { campo: 'NUMERO TELEFONO', titulo: 'Teléfono', tipo: 'texto', visible: false },
        { campo: 'SEDE', titulo: 'Sede', tipo: 'lista', visible: false },
        { campo: 'OFICINA/DESARROLLO', titulo: 'Oficina / Desarrollo', tipo: 'lista', visible: false },
        { campo: 'DIAS AUTORIZADOS', titulo: 'Días autorizados', tipo: 'texto', visible: false },
        { campo: 'HORARIO AUTORIZADO', titulo: 'Horario autorizado', tipo: 'texto', visible: false },
        { campo: 'FECHA DE ALTA', titulo: 'Fecha de alta', tipo: 'fecha', visible: false },
        {
          campo: 'SOLICITUD', titulo: 'Solicitud', filtrable: false, ordenable: false,
          render: (ruta) => (ruta ? `<a href="${escaparHtml(ruta)}" target="_blank" rel="noopener">📎 Ver archivo</a>` : '—'),
        },
      ],
      accionesFila: puedeEditar ? [{
        icono: 'pencil', titulo: 'Editar', alHacer: (u) => abrirEditarUber(u.ID),
      }] : [],
      alEliminar: puedeEditar ? async (filas) => {
        await Promise.all(filas.map((f) => callServer('apiEliminarUber', state.token, f.ID)));
        invalidarCacheLista('apiListarUberResumen', state.token);
      } : null,
      motivoSinEliminar: 'Tu permiso en este módulo es de solo lectura',
    });

    // ---- Filtro rápido por Estatus: misma franja de íconos de Líneas/Vehículos/Caja
    // Chica/Incidencias -- el CSS es genérico (.filtro-tipo*, styles.html). Mismos colores
    // que badgeEstatusUber.
    const ORDEN_ESTATUS_UBER = ['ACTIVO', 'PENDIENTE', 'BAJA'];
    const ESTILO_ESTATUS_UBER = {
      'ACTIVO': { icono: 'circle-check', color: 'var(--color-success)' },
      'PENDIENTE': { icono: 'clock', color: 'var(--color-primary)' },
      'BAJA': { icono: 'ban', color: 'var(--color-danger)' },
    };
    let filtrosActualesUber = {};
    function marcarEstatusUberFiltro() {
      const cont = document.getElementById('uber-filtro-estatus');
      if (!cont) return;
      const f = filtrosActualesUber.ESTATUS;
      const elegidos = f && f.valores && f.valores.length ? f.valores : null;
      cont.querySelectorAll('.filtro-tipo-item').forEach((b) => {
        const activo = b.dataset.estatus === '*' ? !elegidos : !!(elegidos && elegidos.indexOf(b.dataset.estatus) >= 0);
        b.classList.toggle('activo', activo);
        b.setAttribute('aria-pressed', String(activo));
      });
    }
    function pintarEstatusUber(filas) {
      const cont = document.getElementById('uber-filtro-estatus');
      if (!cont) return;
      const conteo = {};
      filas.forEach((u) => { const e = String(u.ESTATUS || '').toUpperCase(); conteo[e] = (conteo[e] || 0) + 1; });
      const estatus = ORDEN_ESTATUS_UBER.concat(Object.keys(conteo).filter((e) => ORDEN_ESTATUS_UBER.indexOf(e) < 0 && e));
      const fila = (valor, icono, color, nombre, n) =>
        '<button type="button" class="filtro-tipo-item' + (n ? '' : ' filtro-tipo-item-vacio') + '" data-estatus="' + escaparHtml(valor) + '" aria-pressed="false" title="' + escaparHtml(nombre + ' · ' + n) + '">' +
          '<span class="filtro-tipo-ico" style="color:' + color + '">' + Iconos.svg(icono) + '</span>' +
          '<span class="filtro-tipo-nombre">' + escaparHtml(nombre) + '</span><span class="filtro-tipo-num">' + n + '</span></button>';
      cont.innerHTML = '<div class="filtro-tipo-panel"><div class="filtro-tipo-titulo">Estatus</div>' +
        fila('*', 'layers', 'var(--color-text-muted)', 'Todos', filas.length) +
        estatus.map((e) => {
          const estilo = ESTILO_ESTATUS_UBER[e] || { icono: 'circle', color: 'var(--color-text-muted)' };
          return fila(e, estilo.icono, estilo.color, e, conteo[e] || 0);
        }).join('') + '</div>';
      marcarEstatusUberFiltro();
    }
    document.getElementById('uber-filtro-estatus').addEventListener('click', (ev) => {
      const b = ev.target.closest('.filtro-tipo-item');
      if (!b) return;
      const e = b.dataset.estatus;
      tabla.setFiltro('ESTATUS', (e === '*' || b.classList.contains('activo')) ? null : { valores: [e] });
    });

    // KPI clickeables: los valores de ESTATUS son exactos (ACTIVO/PENDIENTE/BAJA,
    // las mismas 3 opciones del <select> de Registrar), así que un filtro de
    // lista exacta basta — no hace falta la prueba "contains" que traía la
    // versión anterior por si acaso.
    const KPI_FILTRO_UBER = { 'uber-stat-activos': 'ACTIVO', 'uber-stat-pendientes': 'PENDIENTE', 'uber-stat-baja': 'BAJA' };
    const tileTotalUber = document.getElementById('uber-stat-total').closest('.stat-tile');
    tileTotalUber.classList.add('stat-tile-clickable');
    tileTotalUber.addEventListener('click', () => tabla.setFiltro('ESTATUS', null));
    Object.keys(KPI_FILTRO_UBER).forEach((id) => {
      const tile = document.getElementById(id).closest('.stat-tile');
      tile.classList.add('stat-tile-clickable');
      tile.addEventListener('click', () => {
        const yaActivo = tile.classList.contains('stat-tile-activo');
        tabla.setFiltro('ESTATUS', yaActivo ? null : { valores: [KPI_FILTRO_UBER[id]] });
      });
    });
    function marcarKpiActivo(filtros) {
      filtrosActualesUber = filtros || {};
      marcarEstatusUberFiltro();
      const valores = filtros.ESTATUS && filtros.ESTATUS.valores;
      tileTotalUber.classList.toggle('stat-tile-activo', !valores);
      Object.keys(KPI_FILTRO_UBER).forEach((id) => {
        document.getElementById(id).closest('.stat-tile').classList.toggle(
          'stat-tile-activo', !!(valores && valores.length === 1 && valores[0] === KPI_FILTRO_UBER[id])
        );
      });
      actualizarKpis(tabla.getFiltradas());
    }

    function actualizarKpis(filas) {
      document.getElementById('uber-stat-total').textContent = filas.length;
      document.getElementById('uber-stat-activos').textContent =
        filas.filter((u) => String(u.ESTATUS || '').toUpperCase().includes('ACTIVO')).length;
      document.getElementById('uber-stat-pendientes').textContent =
        filas.filter((u) => String(u.ESTATUS || '').toUpperCase().includes('PENDIENTE')).length;
      document.getElementById('uber-stat-baja').textContent =
        filas.filter((u) => String(u.ESTATUS || '').toUpperCase().includes('BAJA')).length;
    }

    async function cargar() {
      tabla.setCargando(true);
      try {
        todosLosUsuarios = (await callServerListaCacheada('apiListarUberResumen', state.token)) || [];
      } catch (err) {
        tabla.setError('No se pudo cargar el catálogo: ' + err.message);
        return;
      }

      usuariosPorId = {};
      todosLosUsuarios.forEach((u) => { usuariosPorId[u.ID] = u; });

      actualizarKpis(todosLosUsuarios);
      pintarEstatusUber(todosLosUsuarios);
      tabla.setDatos(todosLosUsuarios);
    }
    // Pinta al instante con lo guardado; si del servidor llega algo distinto, se vuelve a pintar (api.html)
    escucharLista('apiListarUberResumen', cargar, document.getElementById('view-container').firstElementChild);

    async function abrirEditarUber(id) {
      const resumen = usuariosPorId[id];
      if (!resumen) return;
      document.getElementById('editar-uber-id').value = id;
      document.getElementById('editar-uber-nombre-label').textContent = resumen.NOMBRE_COMPLETO || '';
      document.getElementById('editar-uber-error').hidden = true;
      modalEditar.hidden = false;
      try {
        const completo = await callServer('apiBuscarUberPorId', state.token, id);
        if (completo) {
          CamposHoja.poblar(CAMPOS_UBER, 'editar-uber', completo, {
            mostrar: (campo, valor) => (campo.clave === 'FECHA DE ALTA' ? formatearFecha(valor) : undefined),
          });
        }
      } catch (err) {
        const errorBox = document.getElementById('editar-uber-error');
        errorBox.textContent = 'No se pudo cargar el registro: ' + err.message;
        errorBox.hidden = false;
      }
    }
    function cerrarEditarUber() {
      modalEditar.hidden = true;
      document.getElementById('form-editar-uber').reset();
      document.getElementById('editar-uber-error').hidden = true;
    }
    document.getElementById('btn-cancelar-editar-uber').addEventListener('click', cerrarEditarUber);
    modalEditar.addEventListener('click', (ev) => { if (ev.target === modalEditar) cerrarEditarUber(); });

    document.getElementById('form-editar-uber').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('editar-uber-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-editar-uber');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando…';
      toastCargando('Guardando cambios…');
      try {
        const archivo = await subirArchivoUber('editar-uber');
        const datos = Object.assign(CamposHoja.recolectar(CAMPOS_UBER, 'editar-uber'), archivo);
        await callServer('apiActualizarUber', state.token, document.getElementById('editar-uber-id').value, datos);
        cerrarEditarUber();
        invalidarCacheLista('apiListarUberResumen', state.token);
        await cargar();
        toastExito('Actualizado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo actualizar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    document.getElementById('form-uber').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('uber-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-uber');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando…';
      toastCargando('Registrando…');
      try {
        const archivo = await subirArchivoUber('uber');
        const datos = Object.assign(CamposHoja.recolectar(CAMPOS_UBER, 'uber'), archivo);
        await callServer('apiCrearUber', state.token, datos);
        ev.target.reset();
        document.getElementById('uber-fecha-de-alta').value = new Date().toLocaleDateString('es-MX');
        invalidarCacheLista('apiListarUberResumen', state.token);
        await cargar();
        toastExito('Registrado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo registrar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    await Promise.all([cargarCatalogosUber(), cargar()]);
  }

  const AYUDA_UBER = [
    { pregunta: '¿Qué es este catálogo?', respuesta: 'Quiénes están autorizados para usar Uber por viáticos de la empresa.' },
    { pregunta: '¿Cómo doy de alta a alguien?', respuesta: 'Pestaña "Registrar" -- nombre, departamento y los datos que pida el formulario.' },
    { pregunta: '¿Qué significa "Pendientes de activar"?', respuesta: 'Ya están dados de alta en el catálogo pero todavía no se confirma su activación real en Uber.' },
    { pregunta: '¿Cómo doy de baja a alguien?', respuesta: 'Edita su registro y cambia el estatus -- queda en el historial, no se borra.' },
  ];

  // ---------- Tickets (bitácora general de atención) ----------
  // Los campos de un ticket: el módulo Tickets y "Registrar en Tickets" de Help Desk
  // (app-helpdesk.html) usan esta misma lista. Departamento y Solicitante: se puede escribir uno
  // que todavía no está en la lista (se llenan en cargarCatalogosTickets). FECHA DE REGISTRO la
  // pone el servidor al crear.
  const CAMPOS_TICKET = [
    { clave: 'TICKET', etiqueta: 'Ticket', tipo: 'text', placeholder: 'Ej. 4021' },
    { clave: 'FECHA DE REGISTRO', etiqueta: 'Fecha de registro', tipo: 'text', soloLectura: true, soloAlta: true },
    { clave: 'FECHA', etiqueta: 'Fecha', tipo: 'date' },
    { clave: 'DEPARTAMENTO', etiqueta: 'Departamento', tipo: 'select', catalogo: true },
    { clave: 'SOLICITANTE', etiqueta: 'Solicitante', tipo: 'select', catalogo: true, placeholder: 'Escribe o elige un nombre' },
    // Los de tarjeta de combustible van para EOX y para EDENRED (EDENRED agregado el 05/10/2026)
    { clave: 'TIPO ATENCION', etiqueta: 'Tipo de atención', tipo: 'select', requerido: true, opciones: [
      'ACTUALIZACION DE INFORMACION UBER', 'ALTA DE HOLOGRAMA EDENRED', 'ALTA DE HOLOGRAMA EOX', 'ALTA DE USUARIO UBER',
      'BAJA DE USUARIO UBER', 'CONSULTA DE INFORMACION UBER',
      'INCREMENTO DE COMBUSTIBLE EDENRED INDETERMINADO', 'INCREMENTO DE COMBUSTIBLE EDENRED PERMANENTE',
      'INCREMENTO DE COMBUSTIBLE EDENRED TEMPORAL', 'INCREMENTO DE COMBUSTIBLE EOX INDETERMINADO',
      'INCREMENTO DE COMBUSTIBLE EOX PERMANENTE', 'INCREMENTO DE COMBUSTIBLE EOX TEMPORAL',
      'INFORMACION GENERAL - EDENRED', 'INFORMACION GENERAL - EOX', 'NIP EDENRED', 'NIP EOX',
      'REEMBOLSO DE COMBUSTIBLE EDENRED', 'REEMBOLSO DE COMBUSTIBLE EOX',
      'REEMPLAZO DE HOLOGRAMA EDENRED', 'REEMPLAZO DE HOLOGRAMA EOX',
      'REPORTE DE CONSUMO DE COMBUSTIBLE EDENRED', 'REPORTE DE CONSUMO DE COMBUSTIBLE EOX',
    ] },
    { clave: 'PLACA', etiqueta: 'Placa', tipo: 'text' },
    { clave: 'QUIEN ATENDIO', etiqueta: 'Quién atendió', tipo: 'select', opciones: [
      'ABIGAIL LEDESMA CORONA', 'DAVID MOISES MALDONADO HERNANDEZ', 'GIOVANNI JAVIER ORDUÑA DE LA PEÑA', 'JORGE LUIS AVECILLA RIVERA',
    ] },
    { clave: 'COMENTARIO', etiqueta: 'Comentario', tipo: 'text', renglonCompleto: true },
  ];

  async function initTickets() {
    wireTabsSimple(document.getElementById('view-container'));
    // Permisos del módulo (el servidor los vuelve a revisar en cada llamada)
    const puedeEditar = puedeEditarModulo('tickets');
    if (!puedeEditar) document.querySelector('#tickets-tabs .tab-btn[data-tab="registrar"]').remove();
    const modalEditar = document.getElementById('modal-editar-ticket');
    let todosLosTickets = [];

    document.getElementById('campos-form-ticket').innerHTML = CamposHoja.html(CAMPOS_TICKET, { prefijo: 'ticket' });
    document.getElementById('campos-form-editar-ticket').innerHTML = CamposHoja.html(CAMPOS_TICKET, { prefijo: 'editar-ticket', esEdicion: true });

    document.getElementById('ticket-fecha-de-registro').value = new Date().toLocaleDateString('es-MX');
    document.getElementById('ticket-fecha').value = hoyISO();

    // Departamentos (hoja "LISTAS VEHICULOS") y Solicitantes (sugerencias =
    // UNIQUE(SORT(TICKETS[SOLICITANTE])) de AppSheet, no lista cerrada) — los
    // dos catálogos van juntos y en paralelo (uno no depende del otro), y
    // esta función completa corre en paralelo con cargar() más abajo.
    async function cargarCatalogosTickets() {
      try {
        const [departamentos, solicitantes] = await Promise.all([
          callServerCacheado('apiListarDepartamentos', state.token),
          callServerCacheado('apiListarSolicitantesTickets', state.token),
        ]);
        ['ticket', 'editar-ticket'].forEach((prefijo) => {
          CamposHoja.llenarOpciones(prefijo + '-departamento', departamentos);
          CamposHoja.llenarOpciones(prefijo + '-solicitante', solicitantes);
        });
      } catch (err) {
        console.error('No se pudieron cargar los catálogos de Departamento/Solicitante:', err);
      }
    }

    const tabla = DataTable.crear(document.getElementById('tickets-tabla'), {
      idCampo: 'ID',
      idTabla: 'tickets',
      ordenInicial: { campo: 'FECHA', dir: 'desc' },
      buscarColumna: [{ campo: 'PLACA', placeholder: 'Buscar por Placa…' }],
      textoVacio: 'Todavía no hay tickets registrados',
      alCambiarFiltros: () => actualizarKpis(tabla.getFiltradas()),
      exportar: {
        nombreArchivo: 'Tickets',
        titulo: 'Descarga la base completa: todas las filas y columnas de la hoja, sin importar filtros ni búsqueda',
        descargar: async () => ExportarExcel.descargarCrudo({ nombreArchivo: 'Tickets', filas: JSON.parse(await callServer('apiTicketsCompleto', state.token)) }),
      },
      columnasCompletas: { idHoja: 'ID', cargar: async () => JSON.parse(await callServer('apiTicketsCompleto', state.token)) },
      etiquetaFila: (t) => t['TICKET'],
      detalle: { titulo: (t) => 'Ticket: ' + (t['TICKET'] || '') },
      // Selección estilo Google Drive/Apple (rama emmanuel, ver componentes/datatable.html):
      // clic = selecciona, doble clic/tocar = abre el panel de detalle (tabla.abrirDetalle
      // se resuelve en el momento del clic, para entonces `tabla` ya está asignada).
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (t) => tabla.abrirDetalle(String(t.ID)),
      alTocarFila: (t) => tabla.abrirDetalle(String(t.ID)),
      columnas: [
        { campo: 'TICKET', titulo: 'Ticket', tipo: 'texto', fijada: true },
        { campo: 'FECHA', titulo: 'Fecha', tipo: 'fecha' },
        { campo: 'DEPARTAMENTO', titulo: 'Departamento', tipo: 'lista' },
        { campo: 'SOLICITANTE', titulo: 'Solicitante', tipo: 'lista' },
        { campo: 'TIPO ATENCION', titulo: 'Tipo de atención', tipo: 'lista' },
        { campo: 'QUIEN ATENDIO', titulo: 'Atendió', tipo: 'lista' },
        { campo: 'PLACA', titulo: 'Placa', tipo: 'texto', fijada: true },
        { campo: 'COMENTARIO', titulo: 'Comentario', tipo: 'texto', visible: false },
        { campo: 'FECHA DE REGISTRO', titulo: 'Fecha de registro', tipo: 'fecha', visible: false },
      ],
      accionesFila: puedeEditar ? [{ icono: 'pencil', titulo: 'Editar', alHacer: (t) => abrirEditarTicket(t) }] : [],
      seleccionable: true,
      alEliminar: puedeEditar ? async (filas) => {
        await Promise.all(filas.map((f) => callServer('apiEliminarTicket', state.token, f.ID)));
        invalidarCacheLista('apiListarTicketsResumen', state.token);
      } : null,
      motivoSinEliminar: 'Tu permiso en este módulo es de solo lectura',
    });

    /** El resumen ya trae las 10 columnas completas — no hace falta pedir el
     *  registro completo aparte para poblar el modal de edición. */
    function abrirEditarTicket(t) {
      if (!t) return;
      document.getElementById('editar-ticket-id').value = t.ID;
      document.getElementById('editar-ticket-label').textContent = 'Ticket: ' + (t['TICKET'] || t.ID);
      document.getElementById('editar-ticket-error').hidden = true;
      CamposHoja.poblar(CAMPOS_TICKET, 'editar-ticket', t);
      modalEditar.hidden = false;
    }
    function cerrarEditarTicket() {
      modalEditar.hidden = true;
      document.getElementById('form-editar-ticket').reset();
      document.getElementById('editar-ticket-error').hidden = true;
    }
    document.getElementById('btn-cancelar-editar-ticket').addEventListener('click', cerrarEditarTicket);
    modalEditar.addEventListener('click', (ev) => { if (ev.target === modalEditar) cerrarEditarTicket(); });

    document.getElementById('form-editar-ticket').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('editar-ticket-error');
      errorBox.hidden = true;
      const btn = ev.target.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando…';
      toastCargando('Guardando cambios…');
      try {
        await callServer('apiActualizarTicket', state.token, document.getElementById('editar-ticket-id').value, CamposHoja.recolectar(CAMPOS_TICKET, 'editar-ticket'));
        cerrarEditarTicket();
        invalidarCacheLista('apiListarTicketsResumen', state.token);
        await cargar();
        toastExito('Actualizado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo actualizar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    function actualizarKpis(filas) {
      document.getElementById('tickets-stat-total').textContent = filas.length;
    }

    async function cargar() {
      tabla.setCargando(true);
      try {
        todosLosTickets = (await callServerListaCacheada('apiListarTicketsResumen', state.token)) || [];
      } catch (err) {
        tabla.setError('No se pudo cargar el historial: ' + err.message);
        return;
      }
      actualizarKpis(todosLosTickets);
      tabla.setDatos(todosLosTickets);
    }
    // Pinta al instante con lo guardado; si del servidor llega algo distinto, se vuelve a pintar (api.html)
    escucharLista('apiListarTicketsResumen', cargar, document.getElementById('view-container').firstElementChild);

    document.getElementById('form-ticket').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('ticket-error');
      errorBox.hidden = true;
      const btn = ev.target.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Registrando…';
      toastCargando('Registrando…');
      try {
        await callServer('apiCrearTicket', state.token, CamposHoja.recolectar(CAMPOS_TICKET, 'ticket'));
        ev.target.reset();
        document.getElementById('ticket-fecha-de-registro').value = new Date().toLocaleDateString('es-MX');
        document.getElementById('ticket-fecha').value = hoyISO();
        invalidarCacheLista('apiListarTicketsResumen', state.token);
        await cargar();
        toastExito('Registrado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo registrar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    await Promise.all([cargarCatalogosTickets(), cargar()]);
  }

  const AYUDA_TICKETS = [
    { pregunta: '¿Qué se registra aquí?', respuesta: 'Cualquier atención o solicitud general -- Uber, tarjeta de combustible (EOX/EDENRED), hologramas, consultas, etc.' },
    { pregunta: '¿Cómo registro un ticket?', respuesta: 'Pestaña "Registrar": elige el tipo de atención y llena los datos que pida (varían según el tipo).' },
    { pregunta: '¿Qué relación tiene con Help Desk?', respuesta: 'Desde el detalle de un ticket del helpdesk de TI se puede "Registrar en Tickets" directo, sin volver a capturar los datos.' },
    { pregunta: '¿Puedo editar un ticket ya registrado?', respuesta: 'Sí, con "Editar" se corrige cualquier campo.' },
  ];

  document.getElementById('btn-logout').addEventListener('click', cerrarSesion);
  document.querySelectorAll('#sidebar .nav-item[data-view]').forEach((el) => {
    el.addEventListener('click', () => navegarA(el.dataset.view));
  });

  // Asistente flotante (usuario, 7-oct): abre las preguntas frecuentes de la pantalla en la
  // que estés (NAV_GRUPOS / VISTAS_FUERA_DEL_MENU → `ayuda`) -- el panel, a su vez, ofrece el
  // recorrido guiado (`tour`) si esa vista también tiene uno. Sin ninguno de los dos, lo avisa
  // en vez de no hacer nada.
  document.getElementById('asistente-flotante').addEventListener('click', () => {
    const destino = vistaDe(vistaActual);
    if (destino && destino.ayuda) { Ayuda.abrir(destino.ayuda(), { onTour: destino.tour }); return; }
    if (destino && destino.tour) { destino.tour(); return; }
    Notificar.info('Todavía no hay ayuda para esta pantalla -- por ahora pícame en Vehículos.');
  });
  // Quita la clase de "caminando" (caminarAsistente) en cuanto termina -- si no se quitara,
  // la respiración (animación por default) ya no volvería a correr.
  document.getElementById('asistente-flotante').addEventListener('animationend', (ev) => {
    if (ev.animationName === 'asistenteCamina') ev.currentTarget.classList.remove('asistente-caminando');
  });

  /**
   * Mayúsculas automáticas en todos los campos de texto de los formularios
   * (Registrar/Editar/modales, de cualquier módulo) — a excepción de
   * números y fechas, que no tienen letras que convertir. Un solo listener
   * delegado en #view-container (los formularios/modales de cada vista
   * viven adentro, aunque montarVista los reemplace en cada navegación) —
   * no hay que tocarle nada a cada campo/módulo uno por uno. Se excluyen
   * a propósito los cuadros de búsqueda/filtro (buscador global de cada
   * tabla y el del popover de filtro por columna): son para BUSCAR, no
   * datos que se vayan a guardar, y ya comparan sin importar mayúsculas.
   */
  document.getElementById('view-container').addEventListener('input', (ev) => {
    const el = ev.target;
    const esTexto = el.tagName === 'TEXTAREA' ||
      (el.tagName === 'INPUT' && ['text', 'email', 'tel', 'url'].includes(el.type));
    if (!esTexto) return;
    if (el.classList.contains('tabla-buscar-global') || el.classList.contains('th-popover-valor')) return;
    // Campos que se guardan tal cual (PIN de WhatsApp, PIN o contraseña del equipo, correos): data-respetar-texto (Líneas)
    if (el.closest('[data-respetar-texto]')) return;
    const inicio = el.selectionStart;
    const fin = el.selectionEnd;
    el.value = el.value.toUpperCase();
    // toUpperCase() no mueve el cursor solo — sin esto, cada letra que se
    // escribe salta al final del campo en vez de seguir donde se iba escribiendo.
    if (inicio !== null && el.setSelectionRange) el.setSelectionRange(inicio, fin);
  });

  renderNavGrupos();
  render();
</script>
