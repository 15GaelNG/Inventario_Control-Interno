<script>
  /**
   * app.js — estado global, router SPA (client-side) e inicialización de cada vista.
   * Las vistas viven como <template> ya embebidas en el HTML (ver Index.html),
   * se clonan a #view-container al navegar. Cero round-trips extra al servidor
   * solo por cambiar de pantalla.
   */

  // Íconos (Lucide): dibuja cualquier <i data-lucide="..."> que haya en el DOM.
  // Hay que llamarla cada vez que se inyecta HTML nuevo con íconos (innerHTML no
  // los "activa" solo) — por eso aparece después de casi cada render dinámico.
  function refreshIcons() {
    if (window.lucide) lucide.createIcons();
  }

  // Tema (claro/oscuro) — se aplica antes de montar cualquier vista para evitar parpadeo.
  // Los botones de tema viven en dos lugares (login y sidebar del app-shell), así que
  // se identifican por clase (.theme-btn + data-tema), no por id, y se manejan con
  // delegación de eventos para que funcionen sin importar cuándo se monten.
  (function initTema() {
    try {
      const guardado = localStorage.getItem('tema');
      if (guardado === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* localStorage puede fallar en vista previa/incógnito, se ignora */ }
  })();

  function aplicarTema(tema) {
    if (tema === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    try { localStorage.setItem('tema', tema); } catch (e) { /* no-op */ }
    document.querySelectorAll('.theme-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tema === tema);
    });
  }

  // Fecha de hoy en la barra superior, formato "Martes 10 de agosto del 2026".
  (function initFechaTopbar() {
    const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const meses = [
      'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
      'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
    ];
    const hoy = new Date();
    const texto = `${dias[hoy.getDay()]} ${hoy.getDate()} de ${meses[hoy.getMonth()]} del ${hoy.getFullYear()}`;
    const el = document.getElementById('topbar-date');
    if (el) el.textContent = texto;
  })();

  // Sidebar colapsable — igual que el tema, se aplica antes de pintar para evitar parpadeo.
  (function initColapsoSidebar() {
    try {
      if (localStorage.getItem('sidebarColapsado') === '1') {
        document.getElementById('sidebar').classList.add('collapsed');
      }
    } catch (e) { /* no-op */ }
  })();

  document.addEventListener('click', (ev) => {
    const btnTema = ev.target.closest('.theme-btn');
    if (btnTema) { aplicarTema(btnTema.dataset.tema); return; }

    if (ev.target.closest('#sidebar-collapse-btn')) {
      const sidebar = document.getElementById('sidebar');
      const colapsado = sidebar.classList.toggle('collapsed');
      try { localStorage.setItem('sidebarColapsado', colapsado ? '1' : '0'); } catch (e) { /* no-op */ }
    }
  });

  const state = {
    token: sessionStorage.getItem('token') || null,
    sesion: JSON.parse(sessionStorage.getItem('sesion') || 'null'),
  };

  function guardarSesion(resultadoLogin) {
    state.token = resultadoLogin.token;
    state.sesion = resultadoLogin;
    sessionStorage.setItem('token', state.token);
    sessionStorage.setItem('sesion', JSON.stringify(resultadoLogin));
  }

  function cerrarSesion() {
    if (state.token) apiLogoutSafe();
    state.token = null;
    state.sesion = null;
    sessionStorage.clear();
    render();
  }
  async function apiLogoutSafe() {
    try { await callServer('apiLogout', state.token); } catch (e) { /* no-op */ }
  }

  function render() {
    document.getElementById('app-shell').hidden = !state.token;
    document.getElementById('login-screen-container').hidden = !!state.token;

    if (!state.token) {
      initLogin();
      return;
    }
    document.getElementById('user-name').textContent = state.sesion.nombre + ' · ' + state.sesion.rol;
    navegarA('dashboard');
  }

  /**
   * Pantalla de carga que se muestra justo después de un login exitoso
   * (manual o con Google), antes de entrar al dashboard. Los 4 íconos de
   * módulos se van "encendiendo" en secuencia con un mensaje temático, para
   * darle personalidad a la espera en vez de un spinner genérico.
   */
  function mostrarPantallaCarga(callback) {
    const container = document.getElementById('loading-screen-container');
    montarVista('tpl-loading', null, container);

    const pasos = [
      { icono: 'loading-icon-0', mensaje: 'Sincronizando vehículos…' },
      { icono: 'loading-icon-1', mensaje: 'Actualizando líneas telefónicas…' },
      { icono: 'loading-icon-2', mensaje: 'Revisando accesorios…' },
      { icono: 'loading-icon-3', mensaje: 'Cerrando caja chica del día…' },
    ];
    const duracionTotal = 1900;
    const porPaso = duracionTotal / pasos.length;

    const barra = document.getElementById('loading-bar-fill');
    const mensaje = document.getElementById('loading-message');

    requestAnimationFrame(() => {
      barra.style.transitionDuration = duracionTotal + 'ms';
      barra.style.width = '100%';
    });

    pasos.forEach((paso, i) => {
      setTimeout(() => {
        document.getElementById(paso.icono).classList.add('active');
        mensaje.classList.add('fade');
        setTimeout(() => {
          mensaje.textContent = paso.mensaje;
          mensaje.classList.remove('fade');
        }, 150);
      }, i * porPaso);
    });

    setTimeout(() => {
      const pantalla = document.getElementById('loading-screen');
      pantalla.classList.add('fade-out');
      setTimeout(() => {
        container.innerHTML = '';
        callback();
      }, 450);
    }, duracionTotal + 250);
  }

  function montarVista(templateId, initFn, container) {
    container = container || document.getElementById('view-container');
    const tpl = document.getElementById(templateId);
    container.innerHTML = '';
    container.appendChild(tpl.content.cloneNode(true));
    refreshIcons();
    if (initFn) initFn();
  }

  /** Ícono (nombre de Lucide) temático según a qué área pertenece la vista. */
  function iconoDeVista(vista) {
    if (vista === 'dashboard') return 'home';
    const grupo = NAV_GRUPOS.find((g) => g.items.some((it) => it.vista === vista));
    return grupo ? grupo.icono : 'file-text';
  }

  /**
   * Transición corta y temática al cambiar de módulo — no acelera la carga
   * real, solo evita que el cambio se sienta "trabado" o instantáneo/brusco.
   * Mantiene la vista anterior visible detrás mientras aparece, monta la
   * vista nueva a la mitad, y se desvanece revelándola.
   */
  function transicionVista(vista, etiqueta, montarVistaReal) {
    // Se cuelga de #main (no de #view-container) para cubrir TODO el módulo
    // sin importar si la vista anterior estaba scrolleada — #view-container
    // hace scroll interno, así que un overlay dentro de él se movía con el
    // scroll y dejaba ver contenido viejo.
    const cont = document.getElementById('main');
    const overlay = document.createElement('div');
    overlay.className = 'view-transition';
    overlay.innerHTML =
      '<div class="view-transition-icon"><i data-lucide="' + iconoDeVista(vista) + '" class="ico"></i></div>' +
      '<div class="view-transition-text">Cargando ' + (etiqueta || '') + '…</div>';
    cont.appendChild(overlay);
    refreshIcons();
    requestAnimationFrame(() => overlay.classList.add('show'));

    setTimeout(() => {
      montarVistaReal();
      overlay.classList.remove('show');
      setTimeout(() => overlay.remove(), 300);
    }, 2500);
  }

  function navegarA(vista, etiqueta) {
    document.querySelectorAll('.nav-item, .nav-subitem').forEach((el) => {
      el.classList.toggle('active', el.dataset.view === vista);
    });

    transicionVista(vista, etiqueta, () => {
      if (vista === 'dashboard') { montarVista('tpl-dashboard', initDashboard); return; }
      if (vista === 'accesorios') { montarVista('tpl-accesorios', initAccesorios); return; }
      if (vista === 'incidencias') { montarVista('tpl-incidencias', initIncidencias); return; }
      if (vista === 'vehiculos') { montarVista('tpl-vehiculos', initVehiculos); return; }
      if (vista === 'uber') { montarVista('tpl-uber', initUber); return; }
      if (vista === 'tickets') { montarVista('tpl-tickets', initTickets); return; }
      mostrarProximamente(etiqueta || vista);
    });
  }

  /** Placeholder para módulos que ya están en el menú pero aún no se han construido */
  function mostrarProximamente(nombreModulo) {
    document.getElementById('view-container').innerHTML =
      '<div class="card" style="max-width:420px; margin:60px auto; text-align:center;">' +
      '<div style="font-size:32px; margin-bottom:10px;"><i data-lucide="construction" class="ico"></i></div>' +
      '<h2 style="margin-bottom:6px;">' + nombreModulo + '</h2>' +
      '<p style="color:var(--color-text-muted); font-size:13px; margin:0;">' +
      'Este módulo todavía no está construido — muy pronto.</p>' +
      '</div>';
    refreshIcons();
  }

  /**
   * Estructura del sidebar por área. La mayoría de estos sub-módulos todavía
   * no están construidos (ver mostrarProximamente); "accesorios" es el único
   * que ya apunta a un módulo real y funcional.
   */
  const NAV_GRUPOS = [
    {
      id: 'servicios-vehiculares', icono: 'car', etiqueta: 'Servicios Vehiculares',
      items: [
        { vista: 'incidencias', etiqueta: 'Incidencias' },
        { vista: 'vehiculos', etiqueta: 'Vehículos' },
        { vista: 'cambios-vehiculos', etiqueta: 'Cambios Vehículos' },
        { vista: 'reasignaciones-vehiculares', etiqueta: 'Reasignaciones Vehiculares' },
        { vista: 'verificaciones', etiqueta: 'Verificaciones' },
        { vista: 'instalacion-sensores', etiqueta: 'Instalación de Sensores' },
        { vista: 'servicios', etiqueta: 'Servicios' },
        { vista: 'hologramas', etiqueta: 'Hologramas' },
      ],
    },
    {
      id: 'lineas', icono: 'smartphone', etiqueta: 'Líneas',
      items: [
        { vista: 'reasignaciones-lineas', etiqueta: 'Control de Reasignaciones - Líneas' },
        { vista: 'accesorios', etiqueta: 'Inventario de Accesorios' },
        { vista: 'reactivacion-lineas', etiqueta: 'Reactivación de Líneas' },
        { vista: 'lineas-telefonicas', etiqueta: 'Líneas Telefónicas' },
        { vista: 'cambios-lineas', etiqueta: 'Control de Cambios - Líneas' },
        { vista: 'bitacora-desechos', etiqueta: 'Bitácora de Desechos' },
        { vista: 'lineas-post-venta', etiqueta: 'Líneas Post Venta' },
      ],
    },
    {
      id: 'arqueos', icono: 'wallet', etiqueta: 'Arqueos',
      items: [
        { vista: 'arqueos', etiqueta: 'Arqueos' },
        { vista: 'caja-chica', etiqueta: 'Caja Chica' },
      ],
    },
    {
      id: 'uber', icono: 'car-taxi-front', etiqueta: 'Uber',
      items: [
        { vista: 'uber', etiqueta: 'Uber' },
        { vista: 'tickets', etiqueta: 'Tickets' },
      ],
    },
  ];

  function renderNavGrupos() {
    const contenedor = document.getElementById('nav-groups');
    contenedor.innerHTML = NAV_GRUPOS.map((grupo) => `
      <div class="nav-group" id="nav-group-${grupo.id}">
        <div class="nav-group-header" data-grupo="${grupo.id}">
          <span class="nav-icon"><i data-lucide="${grupo.icono}" class="ico"></i></span>
          <span class="nav-label">${grupo.etiqueta}</span>
          <span class="nav-group-chevron"><i data-lucide="chevron-right" class="ico"></i></span>
        </div>
        <div class="nav-group-items">
          ${grupo.items.map((item) => `
            <div class="nav-subitem" data-view="${item.vista}" data-etiqueta="${item.etiqueta}">${item.etiqueta}</div>
          `).join('')}
        </div>
      </div>
    `).join('');

    contenedor.querySelectorAll('.nav-group-header').forEach((header) => {
      header.addEventListener('click', () => {
        document.getElementById('nav-group-' + header.dataset.grupo).classList.toggle('expanded');
      });
    });
    contenedor.querySelectorAll('.nav-subitem').forEach((el) => {
      el.addEventListener('click', () => navegarA(el.dataset.view, el.dataset.etiqueta));
    });
    refreshIcons();
  }

  // ---------- Login ----------
  function initLogin() {
    const login = document.getElementById('login-screen-container');
    montarVista('tpl-login', null, login);

    aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

    const inputPassword = document.getElementById('login-password');
    document.getElementById('toggle-password').addEventListener('click', (ev) => {
      const seVaAMostrar = inputPassword.type === 'password';
      inputPassword.type = seVaAMostrar ? 'text' : 'password';
      ev.currentTarget.innerHTML = `<i data-lucide="${seVaAMostrar ? 'eye' : 'eye-off'}" class="ico"></i>`;
      refreshIcons();
    });

    initGoogleQuickLogin();

    document.getElementById('form-login').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const correo = document.getElementById('login-correo').value.trim();
      const password = document.getElementById('login-password').value;
      const errorBox = document.getElementById('login-error');
      errorBox.hidden = true;
      try {
        const resultado = await callServer('apiLogin', correo, password);
        guardarSesion(resultado);
        mostrarPantallaCarga(() => render());
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });
  }

  /**
   * Detecta la cuenta de Google con la que ya se accedió a la webapp (el
   * acceso restringido a dominio obliga a iniciar sesión con Google antes de
   * siquiera llegar aquí) y, si coincide con un usuario activo, muestra el
   * botón de acceso directo "Continuar como [nombre]".
   */
  async function initGoogleQuickLogin() {
    const chip = document.getElementById('google-account-chip');
    const divisor = document.getElementById('login-or-divider');
    try {
      const identidad = await callServer('apiIdentidadGoogle');
      if (!identidad || !identidad.coincide) return; // se queda solo el formulario manual

      document.getElementById('google-account-avatar').textContent =
        (identidad.nombre || identidad.correo).trim().charAt(0).toUpperCase();
      document.getElementById('google-account-name').textContent = identidad.nombre || identidad.correo;
      document.getElementById('google-account-email').textContent = identidad.correo;
      chip.hidden = false;
      divisor.hidden = false;

      chip.addEventListener('click', async () => {
        const errorBox = document.getElementById('login-error');
        errorBox.hidden = true;
        try {
          const resultado = await callServer('apiLoginConGoogle');
          guardarSesion(resultado);
          mostrarPantallaCarga(() => render());
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.hidden = false;
        }
      });
    } catch (err) {
      // Si falla la detección (poco común), simplemente se queda el formulario manual.
    }
  }

  // ---------- Dashboard ----------
  function initDashboard() {
    document.querySelectorAll('.nav-module[data-view]').forEach((el) => {
      el.addEventListener('click', () => navegarA(el.dataset.view));
    });
  }

  // ---------- Accesorios ----------
  async function initAccesorios() {
    const selectArticulo = document.getElementById('mov-articulo');
    const tabla = document.getElementById('tabla-articulos');

    async function cargar() {
      const articulos = await callServer('apiListarArticulosConStock', state.token);

      selectArticulo.innerHTML = articulos
        .map((a) => `<option value="${a.ID}">${a.NOMBRE}</option>`).join('');

      tabla.innerHTML = articulos.map((a) => {
        const bajo = Number(a.STOCK) <= Number(a.STOCK_MINIMO || 0);
        return `<tr>
          <td>${a.CATEGORIA || ''}</td>
          <td>${a.NOMBRE || ''}</td>
          <td>${a.MARCA || ''}</td>
          <td><span class="badge ${bajo ? 'low' : 'ok'}">${a.STOCK}</span></td>
        </tr>`;
      }).join('');
    }

    document.getElementById('form-movimiento').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('mov-error');
      errorBox.hidden = true;
      try {
        await callServer(
          'apiRegistrarMovimiento',
          state.token,
          selectArticulo.value,
          document.getElementById('mov-tipo').value,
          Number(document.getElementById('mov-cantidad').value),
          ''
        );
        document.getElementById('mov-cantidad').value = '';
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });

    await cargar();
  }

  // ---------- Incidencias ----------
  function hoyISO() {
    return new Date().toISOString().slice(0, 10);
  }
  function fijarFechaRegistroHoy() {
    document.getElementById('inc-fecha-registro').value = new Date().toLocaleDateString('es-MX');
  }
  function fechaParaInput(valor) {
    if (!valor) return '';
    const f = new Date(valor);
    return isNaN(f) ? '' : f.toISOString().slice(0, 10);
  }
  function formatearFecha(valor) {
    if (!valor) return '—';
    const f = new Date(valor);
    return isNaN(f) ? '—' : f.toLocaleDateString('es-MX');
  }

  // ============================================================
  // Motor genérico de "tabla interactiva": buscador global, orden
  // y filtro por columna (menú desplegable en cada encabezado, al
  // estilo Contiene/Es igual a/Vacío…) y paginación. Cada módulo
  // sigue pintando su propio <tbody> (con badges, tags y botones de
  // acción) — este motor solo decide QUÉ subconjunto/orden de datos
  // le toca pintar, y arma el encabezado interactivo + el pie de
  // paginación.
  // ============================================================
  const OPERADORES_FILTRO_TABLA = [
    { valor: 'contiene', texto: 'Contiene' },
    { valor: 'no-contiene', texto: 'No contiene' },
    { valor: 'igual', texto: 'Es igual a' },
    { valor: 'empieza', texto: 'Empieza con' },
    { valor: 'termina', texto: 'Termina con' },
    { valor: 'vacio', texto: 'Está vacío' },
    { valor: 'no-vacio', texto: 'No está vacío' },
  ];

  function crearTablaInteractiva(cfg) {
    const {
      thead,               // <thead> a llenar dinámicamente
      columnas,            // [{clave, etiqueta}] — una por cada columna filtrable (sin contar acciones)
      conAcciones = true,  // agrega un <th></th> extra al final (columna de botones, sin filtro)
      buscadorGlobal,      // <input type="search"> opcional
      piePaginacion,       // contenedor donde se pinta "Mostrando X-Y de Z" + selector + flechas
      onRenderPagina,      // (datosDePagina, totalFiltrado) => pinta el <tbody>
      porPagina = 25,
    } = cfg;

    let datosOriginales = [];
    let pagina = 1;
    let filasPorPagina = porPagina;
    const filtros = {};
    let orden = null;
    let popoverAbierto = null;
    let cerrarSiFueraFn = null;

    function coincideOperador(valorCelda, operador, valorFiltro) {
      const a = String(valorCelda == null ? '' : valorCelda).toLowerCase();
      const b = String(valorFiltro || '').toLowerCase();
      switch (operador) {
        case 'contiene': return a.includes(b);
        case 'no-contiene': return !a.includes(b);
        case 'igual': return a === b;
        case 'empieza': return a.startsWith(b);
        case 'termina': return a.endsWith(b);
        case 'vacio': return a === '';
        case 'no-vacio': return a !== '';
        default: return true;
      }
    }

    function datosFiltrados() {
      let r = datosOriginales;
      const global = (buscadorGlobal && buscadorGlobal.value.trim().toLowerCase()) || '';
      if (global) {
        r = r.filter((fila) => columnas.some((c) => String(fila[c.clave] == null ? '' : fila[c.clave]).toLowerCase().includes(global)));
      }
      Object.keys(filtros).forEach((clave) => {
        const f = filtros[clave];
        if (!f) return;
        r = r.filter((fila) => coincideOperador(fila[clave], f.operador, f.valor));
      });
      if (orden) {
        const dir = orden.dir === 'desc' ? -1 : 1;
        r = r.slice().sort((a, b) => String(a[orden.clave] == null ? '' : a[orden.clave])
          .localeCompare(String(b[orden.clave] == null ? '' : b[orden.clave]), 'es', { numeric: true, sensitivity: 'base' }) * dir);
      }
      return r;
    }

    function cerrarPopover() {
      if (popoverAbierto) { popoverAbierto.remove(); popoverAbierto = null; }
      if (cerrarSiFueraFn) { document.removeEventListener('click', cerrarSiFueraFn); cerrarSiFueraFn = null; }
    }

    function abrirPopover(boton, columna) {
      if (popoverAbierto) { cerrarPopover(); return; }
      const rect = boton.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'th-popover';
      const actual = filtros[columna.clave] || { operador: 'contiene', valor: '' };
      const ordenAsc = !!(orden && orden.clave === columna.clave && orden.dir === 'asc');
      const ordenDesc = !!(orden && orden.clave === columna.clave && orden.dir === 'desc');
      pop.innerHTML = `
        <div class="th-popover-titulo">${columna.etiqueta}</div>
        <div class="th-popover-orden">
          <button type="button" class="secondary ${ordenAsc ? 'activo' : ''}" data-dir="asc">A → Z</button>
          <button type="button" class="secondary ${ordenDesc ? 'activo' : ''}" data-dir="desc">Z → A</button>
        </div>
        <select class="th-popover-operador">
          ${OPERADORES_FILTRO_TABLA.map((o) => `<option value="${o.valor}" ${o.valor === actual.operador ? 'selected' : ''}>${o.texto}</option>`).join('')}
        </select>
        <input type="text" class="th-popover-valor" placeholder="Valor" value="${String(actual.valor || '').replace(/"/g, '&quot;')}" />
        <div class="th-popover-acciones">
          <button type="button" class="secondary th-popover-quitar">Quitar filtro</button>
          <button type="button" class="th-popover-aplicar">Aplicar</button>
        </div>
      `;
      document.body.appendChild(pop);
      const ancho = 230;
      pop.style.left = Math.max(8, Math.min(rect.left + window.scrollX, window.innerWidth - ancho - 8)) + 'px';
      pop.style.top = (rect.bottom + window.scrollY + 6) + 'px';

      const valorInput = pop.querySelector('.th-popover-valor');
      const operadorSelect = pop.querySelector('.th-popover-operador');
      function actualizarValorVisible() {
        valorInput.hidden = ['vacio', 'no-vacio'].includes(operadorSelect.value);
      }
      actualizarValorVisible();
      operadorSelect.addEventListener('change', actualizarValorVisible);
      if (!valorInput.hidden) valorInput.focus();

      pop.querySelectorAll('.th-popover-orden button').forEach((btn) => {
        btn.addEventListener('click', () => {
          orden = { clave: columna.clave, dir: btn.dataset.dir };
          pagina = 1;
          cerrarPopover();
          renderTodo();
        });
      });
      pop.querySelector('.th-popover-aplicar').addEventListener('click', () => {
        const operador = operadorSelect.value;
        const valor = valorInput.value.trim();
        if (['vacio', 'no-vacio'].includes(operador) || valor) filtros[columna.clave] = { operador, valor };
        else delete filtros[columna.clave];
        pagina = 1;
        cerrarPopover();
        renderTodo();
      });
      pop.querySelector('.th-popover-quitar').addEventListener('click', () => {
        delete filtros[columna.clave];
        pagina = 1;
        cerrarPopover();
        renderTodo();
      });

      popoverAbierto = pop;
      setTimeout(() => {
        cerrarSiFueraFn = (ev) => { if (!pop.contains(ev.target) && !boton.contains(ev.target)) cerrarPopover(); };
        document.addEventListener('click', cerrarSiFueraFn);
      }, 0);
    }

    function renderEncabezado() {
      thead.innerHTML = '<tr>' + columnas.map((c) => {
        const activo = !!filtros[c.clave] || (orden && orden.clave === c.clave);
        return `<th class="th-interactivo ${activo ? 'activo' : ''}" data-clave="${c.clave}">
          <span class="th-interactivo-label">${c.etiqueta}<i data-lucide="chevron-down" class="ico"></i></span>
        </th>`;
      }).join('') + (conAcciones ? '<th></th>' : '') + '</tr>';
      thead.querySelectorAll('.th-interactivo').forEach((th) => {
        const columna = columnas.find((c) => c.clave === th.dataset.clave);
        th.querySelector('.th-interactivo-label').addEventListener('click', (ev) => {
          ev.stopPropagation();
          abrirPopover(th, columna);
        });
      });
      refreshIcons();
    }

    function renderPie(totalFiltrado) {
      if (!piePaginacion) return;
      const totalPaginas = Math.max(1, Math.ceil(totalFiltrado / filasPorPagina));
      if (pagina > totalPaginas) pagina = totalPaginas;
      const inicio = totalFiltrado === 0 ? 0 : (pagina - 1) * filasPorPagina + 1;
      const fin = Math.min(pagina * filasPorPagina, totalFiltrado);
      piePaginacion.innerHTML = `
        <span>Mostrando ${inicio}-${fin} de ${totalFiltrado}</span>
        <div class="tabla-pie-paginas">
          <select class="tabla-pie-tamano">
            ${[10, 25, 50, 100].map((n) => `<option value="${n}" ${n === filasPorPagina ? 'selected' : ''}>${n} por página</option>`).join('')}
          </select>
          <button type="button" class="tp-prev" ${pagina <= 1 ? 'disabled' : ''}><i data-lucide="chevron-left" class="ico"></i></button>
          <span>Página ${pagina} de ${totalPaginas}</span>
          <button type="button" class="tp-next" ${pagina >= totalPaginas ? 'disabled' : ''}><i data-lucide="chevron-right" class="ico"></i></button>
        </div>
      `;
      piePaginacion.querySelector('.tabla-pie-tamano').addEventListener('change', (ev) => {
        filasPorPagina = Number(ev.target.value);
        pagina = 1;
        renderTodo();
      });
      piePaginacion.querySelector('.tp-prev').addEventListener('click', () => { pagina -= 1; renderTodo(); });
      piePaginacion.querySelector('.tp-next').addEventListener('click', () => { pagina += 1; renderTodo(); });
      refreshIcons();
    }

    function renderTodo() {
      const filtrado = datosFiltrados();
      const totalPaginas = Math.max(1, Math.ceil(filtrado.length / filasPorPagina));
      if (pagina > totalPaginas) pagina = totalPaginas;
      const inicio = (pagina - 1) * filasPorPagina;
      const pageData = filtrado.slice(inicio, inicio + filasPorPagina);
      renderEncabezado();
      onRenderPagina(pageData, filtrado.length);
      renderPie(filtrado.length);
    }

    if (buscadorGlobal) buscadorGlobal.addEventListener('input', () => { pagina = 1; renderTodo(); });

    return {
      setDatos(datos) { datosOriginales = datos || []; renderTodo(); },
      refrescar: renderTodo,
    };
  }

  function slugCampo(clave) {
    return clave.toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  /** Genera los <div class="field"> agrupados por sección para un formulario de vehículo. */
  function renderCamposVehiculo(prefijo) {
    const grupos = [];
    const porGrupo = {};
    CAMPOS_VEHICULO.forEach((campo) => {
      if (!porGrupo[campo.grupo]) { porGrupo[campo.grupo] = []; grupos.push(campo.grupo); }
      porGrupo[campo.grupo].push(campo);
    });
    return grupos.map((grupo) => {
      const campos = porGrupo[grupo].map((campo) => {
        const id = prefijo + '-' + slugCampo(campo.clave);
        const req = campo.requerido ? ' required' : '';
        if (campo.tipo === 'file') {
          return `<div class="field">
            <label>${campo.etiqueta}</label>
            <input type="file" id="${id}" accept=".pdf,.png,.jpg,.jpeg" />
            <div class="file-actual" id="${id}-actual"></div>
          </div>`;
        }
        if (campo.tipo === 'select') {
          // Con "opciones" definidas de antemano (lista fija, ej. Clase) se pintan
          // aquí mismo; sin ellas (catálogos reales, ej. Marca) quedan vacías y
          // las llena initVehiculos() por JS al cargar.
          const opciones = (campo.opciones || []).map((o) => `<option value="${o}">${o}</option>`).join('');
          return `<div class="field"><label>${campo.etiqueta}</label><select id="${id}"${req}><option value="">Selecciona…</option>${opciones}</select></div>`;
        }
        // soloLectura: el servidor decide el valor (ej. Folio, autogenerado
        // a partir de la Clase) — el campo se muestra pero no se puede editar.
        const disabled = campo.soloLectura ? ' disabled' : '';
        const placeholder = campo.placeholder ? ` placeholder="${campo.placeholder}"` : '';
        return `<div class="field"><label>${campo.etiqueta}</label><input type="${campo.tipo}" id="${id}"${req}${disabled}${placeholder} /></div>`;
      }).join('');
      return `<div class="info-section-title">${grupo}</div>${campos}`;
    }).join('');
  }

  /** Lee los valores actuales del formulario, devuelve un objeto {columna real: valor}.
   * Los campos "file" NO se leen aquí — se manejan aparte (subirArchivosVehiculo),
   * porque subir un archivo es asíncrono y no se puede leer de golpe como el resto. */
  function recolectarDatosVehiculo(prefijo) {
    const datos = {};
    CAMPOS_VEHICULO.forEach((campo) => {
      if (campo.tipo === 'file' || campo.soloLectura) return;
      const el = document.getElementById(prefijo + '-' + slugCampo(campo.clave));
      if (el) datos[campo.clave] = el.value.trim();
    });
    return datos;
  }

  /** Llena el formulario con un objeto {columna real: valor} (ej. de buscarPorFolio).
   * Para "file" no se puede rellenar el <input> (los navegadores no lo permiten por
   * seguridad) — en vez de eso, muestra un link al archivo ya subido, si existe. */
  function poblarFormularioVehiculo(prefijo, datos) {
    CAMPOS_VEHICULO.forEach((campo) => {
      const id = prefijo + '-' + slugCampo(campo.clave);
      const valor = (datos && datos[campo.clave]) || '';
      if (campo.tipo === 'file') {
        const info = document.getElementById(id + '-actual');
        if (info) {
          info.innerHTML = valor
            ? `<a href="${valor}" target="_blank" rel="noopener">📎 Ver archivo actual</a>`
            : '<span class="empty-state" style="margin:0">Sin archivo</span>';
        }
        return;
      }
      const el = document.getElementById(id);
      if (!el) return;
      el.value = campo.tipo === 'date' ? fechaParaInput(valor) : valor;
    });
  }

  /** Convierte un File del navegador a base64 puro (sin el prefijo data:...;base64,). */
  function leerArchivoBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = () => reject(new Error('No se pudo leer el archivo ' + file.name));
      reader.readAsDataURL(file);
    });
  }

  /**
   * Sube (si el usuario eligió) los archivos de los campos tipo "file" del
   * formulario y regresa {columna real: url}. Los campos sin archivo nuevo
   * seleccionado simplemente no aparecen en el resultado — así crear()/
   * actualizar() no les tocan el valor que ya tenían.
   */
  async function subirArchivosVehiculo(prefijo) {
    const resultado = {};
    const camposArchivo = CAMPOS_VEHICULO.filter((c) => c.tipo === 'file');
    for (const campo of camposArchivo) {
      const input = document.getElementById(prefijo + '-' + slugCampo(campo.clave));
      const file = input && input.files && input.files[0];
      if (!file) continue;
      const base64 = await leerArchivoBase64(file);
      const subido = await callServer('apiSubirArchivoVehiculo', state.token, file.name, file.type, base64);
      resultado[campo.clave] = subido.url;
    }
    return resultado;
  }

    async function abrirModalVehiculo(folio, id) {

          vacio.hidden = false;
          return;

        grid.insertAdjacentHTML('beforeend', Object.keys(vehiculo)
          .filter((clave) => vehiculo[clave] !== '' && vehiculo[clave] !== null && vehiculo[clave] !== undefined)
          .map((clave) => itemInfo(tituloDesdeClave(clave), vehiculo[clave]))
          .join(''));

    async function cargar() {

  // ---------- Vehículos ----------
  async function initVehiculos() {
    const lista = document.getElementById('lista-vehiculos');
    const vacio = document.getElementById('vehiculos-vacio');
    const modalEditar = document.getElementById('modal-editar-vehiculo');
    const modalDetalle = document.getElementById('modal-detalle-vehiculo');
    let vehiculosPorId = {};
    let todosLosVehiculos = [];

    document.getElementById('campos-form-vehiculo').innerHTML = renderCamposVehiculo('veh');
    document.getElementById('campos-form-editar-vehiculo').innerHTML = renderCamposVehiculo('editar-vehiculo');

    // Marca / Departamento / Sede / Razón social / Ubicación: catálogos
    // reales (hoja "LISTAS VEHICULOS"), mismas opciones en Registrar y Editar.
    // Ubicación reutiliza la misma columna OFICINA / DESARROLLO que ya usa Uber.
    function llenarSelect(id, valores) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = '<option value="">Selecciona…</option>' +
        (valores || []).map((v) => `<option value="${v}">${v}</option>`).join('');
    }
    try {
      const [marcas, departamentos, sedes, razones, ubicaciones] = await Promise.all([
        callServer('apiListarMarcas', state.token),
        callServer('apiListarDepartamentos', state.token),
        callServer('apiListarSedes', state.token),
        callServer('apiListarRazonesSociales', state.token),
        callServer('apiListarOficinasDesarrollo', state.token),
      ]);
      ['veh-marca', 'editar-vehiculo-marca'].forEach((id) => llenarSelect(id, marcas));
      ['veh-departamento', 'editar-vehiculo-departamento'].forEach((id) => llenarSelect(id, departamentos));
      ['veh-sede', 'editar-vehiculo-sede'].forEach((id) => llenarSelect(id, sedes));
      ['veh-razon-social', 'editar-vehiculo-razon-social'].forEach((id) => llenarSelect(id, razones));
      ['veh-ubicacion', 'editar-vehiculo-ubicacion'].forEach((id) => llenarSelect(id, ubicaciones));
    } catch (err) {
      console.error('No se pudieron cargar los catálogos de Marca/Departamento/Sede/Razón social/Ubicación:', err);
    }

    // Folio: se ve en su campo (deshabilitado, no se puede escribir) desde que
    // se elige la Clase en Registrar — es solo vista previa, el que de verdad
    // queda asignado se recalcula al guardar (por si alguien más registró un
    // vehículo de esa misma Clase mientras tanto).
    const campoFolioVeh = document.getElementById('veh-folio');
    document.getElementById('veh-clase').addEventListener('change', async (ev) => {
      const clase = ev.target.value;
      if (!clase) { campoFolioVeh.value = ''; return; }
      try {
        campoFolioVeh.value = await callServer('apiPrevisualizarFolioVehiculo', state.token, clase);
      } catch (err) {
        console.error('No se pudo previsualizar el folio:', err);
      }
    });

    function badgeEstatus(estatus) {
      const esBaja = String(estatus || '').toUpperCase().includes('BAJA');
      return `<span class="badge-estado ${esBaja ? 'baja' : 'activo'}"><i data-lucide="${esBaja ? 'ban' : 'circle-check'}" class="ico"></i> ${esBaja ? 'De baja' : 'Activo'}</span>`;
    }

    // Color determinístico por clase (misma clase = mismo color siempre),
    // sin necesidad de saber de antemano qué clases existen en la hoja.
    const PALETA_CLASES = ['tag-navy', 'tag-gold', 'tag-green', 'tag-brown', 'tag-slate'];
    function colorClase(clase) {
      if (!clase) return 'tag-slate';
      let hash = 0;
      for (let i = 0; i < clase.length; i++) hash = (hash * 31 + clase.charCodeAt(i)) >>> 0;
      return PALETA_CLASES[hash % PALETA_CLASES.length];
    }
    function etiquetaClase(clase) {
      return clase ? `<span class="tag ${colorClase(clase)}">${clase}</span>` : '—';
    }

    const motorTablaVehiculos = crearTablaInteractiva({
      thead: document.getElementById('veh-thead'),
      columnas: [
        { clave: 'FOLIO', etiqueta: 'Folio' },
        { clave: 'DEPARTAMENTO', etiqueta: 'Departamento' },
        { clave: 'CLASE', etiqueta: 'Clase' },
        { clave: 'MARCA', etiqueta: 'Marca' },
        { clave: 'LINEA_VEHICULO', etiqueta: 'Línea' },
        { clave: 'MODELO', etiqueta: 'Año' },
        { clave: 'PLACA', etiqueta: 'Placa' },
        { clave: 'ESTATUS', etiqueta: 'Estatus' },
      ],
      buscadorGlobal: document.getElementById('veh-buscar-global'),
      piePaginacion: document.getElementById('veh-pie'),
      onRenderPagina: (vehiculos, total) => {
        vacio.hidden = total > 0;
        lista.innerHTML = vehiculos.map((v) => `
          <tr>
            <td class="tabla-clickable" data-id="${v.ID_VEHICULO}" title="Ver detalle completo">${v.FOLIO}</td>
            <td>${v.DEPARTAMENTO || '—'}</td>
            <td>${etiquetaClase(v.CLASE)}</td>
            <td>${v.MARCA || '—'}</td>
            <td>${v.LINEA_VEHICULO || '—'}</td>
            <td>${v.MODELO || '—'}</td>
            <td>${v.PLACA || '—'}</td>
            <td>${badgeEstatus(v.ESTATUS)}</td>
            <td>
              <div class="tabla-actions">
                <button type="button" class="secondary btn-editar-vehiculo" data-id="${v.ID_VEHICULO}" title="Editar"><i data-lucide="pencil" class="ico"></i></button>
                <button type="button" class="danger btn-eliminar-vehiculo" data-id="${v.ID_VEHICULO}" data-folio="${v.FOLIO}" title="Eliminar"><i data-lucide="trash-2" class="ico"></i></button>
              </div>
            </td>
          </tr>
        `).join('');

        lista.querySelectorAll('.tabla-clickable').forEach((el) => {
          el.addEventListener('click', () => abrirDetalleVehiculo(vehiculosPorId[el.dataset.id]));
        });
        lista.querySelectorAll('.btn-editar-vehiculo').forEach((btn) => {
          btn.addEventListener('click', () => abrirEditarVehiculo(vehiculosPorId[btn.dataset.id]));
        });
        lista.querySelectorAll('.btn-eliminar-vehiculo').forEach((btn) => {
          btn.addEventListener('click', () => eliminarVehiculo(btn.dataset.id, btn.dataset.folio));
        });
        refreshIcons();
      },
    });

    async function cargar() {
      const errorBox = document.getElementById('veh-error');
      let vehiculos;
      try {
        vehiculos = await callServer('apiListarVehiculosResumen', state.token);
      } catch (err) {
        console.error('No se pudo cargar el catálogo de vehículos:', err);
        errorBox.textContent = 'No se pudo cargar el catálogo de vehículos: ' + err.message;
        errorBox.hidden = false;
        return;
      }
      errorBox.hidden = true;
      todosLosVehiculos = vehiculos || [];

      vehiculosPorId = {};
      todosLosVehiculos.forEach((v) => { vehiculosPorId[v.ID_VEHICULO] = v; });

      // Los totales son del catálogo completo, sin importar el filtro de clase.
      document.getElementById('veh-stat-total').textContent = todosLosVehiculos.length;
      document.getElementById('veh-stat-activos').textContent =
        todosLosVehiculos.filter((v) => !String(v.ESTATUS || '').toUpperCase().includes('BAJA')).length;
      document.getElementById('veh-stat-baja').textContent =
        todosLosVehiculos.filter((v) => String(v.ESTATUS || '').toUpperCase().includes('BAJA')).length;

      motorTablaVehiculos.setDatos(todosLosVehiculos);
    }

    async function abrirDetalleVehiculo(vResumen) {
      if (!vResumen) return;
      document.getElementById('detalle-vehiculo-folio-label').textContent = 'Folio: ' + vResumen.FOLIO;
      const grid = document.getElementById('detalle-vehiculo-grid');
      grid.innerHTML = '<div class="loading-inline"><span class="spinner"></span> Cargando…</div>';
      modalDetalle.hidden = false;
      try {
        const completo = await callServer('apiBuscarVehiculoPorFolio', state.token, vResumen.FOLIO);
        if (!completo) {
          grid.innerHTML = '<p class="empty-state">No se encontró el registro completo.</p>';
          return;
        }
        grid.innerHTML = Object.keys(completo)
          .filter((k) => completo[k] !== '' && completo[k] !== null && completo[k] !== undefined)
          .map((k) => itemInfo(tituloDesdeClave(k), completo[k]))
          .join('');
      } catch (err) {
        grid.innerHTML = '<p class="error-msg">No se pudo cargar: ' + err.message + '</p>';
      }
    }
    document.getElementById('btn-cerrar-detalle-vehiculo').addEventListener('click', () => { modalDetalle.hidden = true; });
    modalDetalle.addEventListener('click', (ev) => { if (ev.target === modalDetalle) modalDetalle.hidden = true; });

    async function abrirEditarVehiculo(vResumen) {
      if (!vResumen) return;
      document.getElementById('editar-vehiculo-id').value = vResumen.ID_VEHICULO;
      document.getElementById('editar-vehiculo-folio-label').textContent = 'Folio: ' + vResumen.FOLIO;
      document.getElementById('editar-vehiculo-error').hidden = true;
      // El resumen (tabla) solo trae 12 columnas — para editar TODO se necesita
      // el registro completo, se pide igual que en "Detalle completo".
      poblarFormularioVehiculo('editar-vehiculo', vResumen);
      modalEditar.hidden = false;
      try {
        const completo = await callServer('apiBuscarVehiculoPorFolio', state.token, vResumen.FOLIO);
        if (completo) poblarFormularioVehiculo('editar-vehiculo', completo);
      } catch (err) {
        console.error('No se pudo cargar el registro completo para editar:', err);
        const errorBox = document.getElementById('editar-vehiculo-error');
        errorBox.textContent = 'No se pudieron cargar todos los campos: ' + err.message;
        errorBox.hidden = false;
      }
    }
    function cerrarEditarVehiculo() {
      modalEditar.hidden = true;
      document.getElementById('form-editar-vehiculo').reset();
      document.getElementById('editar-vehiculo-error').hidden = true;
    }
    document.getElementById('btn-cancelar-editar-vehiculo').addEventListener('click', cerrarEditarVehiculo);
    modalEditar.addEventListener('click', (ev) => { if (ev.target === modalEditar) cerrarEditarVehiculo(); });

    document.getElementById('form-editar-vehiculo').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('editar-vehiculo-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-editar-vehiculo');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Subiendo archivos y guardando…';
      try {
        const archivos = await subirArchivosVehiculo('editar-vehiculo');
        const datos = Object.assign(recolectarDatosVehiculo('editar-vehiculo'), archivos);
        await callServer('apiActualizarVehiculo', state.token, document.getElementById('editar-vehiculo-id').value, datos);
        cerrarEditarVehiculo();
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    async function eliminarVehiculo(id, folio) {
      if (!confirm('¿Eliminar el vehículo con folio ' + folio + '? Esta acción no se puede deshacer.')) return;
      try {
        await callServer('apiEliminarVehiculo', state.token, id);
        await cargar();
      } catch (err) {
        alert('No se pudo eliminar: ' + err.message);
      }
    }

    document.getElementById('form-vehiculo').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('veh-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-vehiculo');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Subiendo archivos y guardando…';
      try {
        const archivos = await subirArchivosVehiculo('veh');
        const datos = Object.assign(recolectarDatosVehiculo('veh'), archivos);
        await callServer('apiCrearVehiculo', state.token, datos);
        ev.target.reset();
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    await cargar();
  }

      }
      return '<span class="badge-estado activo"><i data-lucide="circle-check" class="ico"></i> Activo</span>';
    }

    function etiquetaRol(rol) {
      const mapa = { ADMINISTRADOR: 'tag-navy', BENEFICIARIO: 'tag-gold', EMPLEADO: 'tag-green' };

      return rol ? `<span class="tag ${clase}">${rol}</span>` : '—';

    // Razón social / Sede / Oficina-Desarrollo / Departamento: catálogos

    function llenarSelect(id, valores) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = '<option value="">Selecciona…</option>' +
        (valores || []).map((v) => `<option value="${v}">${v}</option>`).join('');
    }
    try {
      const [razones, sedes, oficinas, deptos] = await Promise.all([
        callServer('apiListarRazonesSociales', state.token),
        callServer('apiListarSedes', state.token),
        callServer('apiListarOficinasDesarrollo', state.token),
        callServer('apiListarDepartamentos', state.token),
      ]);
      ['uber-razon-social', 'editar-uber-razon-social'].forEach((id) => llenarSelect(id, razones));
      ['uber-sede', 'editar-uber-sede'].forEach((id) => llenarSelect(id, sedes));
      ['uber-oficina-desarrollo', 'editar-uber-oficina-desarrollo'].forEach((id) => llenarSelect(id, oficinas));
      ['uber-departamento', 'editar-uber-departamento'].forEach((id) => llenarSelect(id, deptos));
    } catch (err) {
      console.error('No se pudieron cargar los catálogos de Razón social/Sede/Oficina/Departamento:', err);
    }

    // SOLICITUD es archivo — se maneja aparte (subirArchivoUber), no aquí:
    // subir un archivo es asíncrono, no se puede leer de golpe como el resto.
    // FECHA DE ALTA tampoco entra aquí: no se edita, la fija el servidor solo
    // al crear (siempre "hoy") — se muestra como texto deshabilitado.
    const CAMPOS_UBER = [
      'RAZON SOCIAL', 'NOMBRE COMPLETO', 'ESTAUS USUARIO', 'ROL',
      'CORREO ELECTRONICO', 'NUMERO TELEFONO', 'SEDE', 'OFICINA/DESARROLLO',
      'DEPARTAMENTO', 'PUESTO', 'DIAS AUTORIZADOS', 'HORARIO AUTORIZADO',
    ];
    function idUber(prefijo, clave) { return prefijo + '-' + slugCampo(clave); }
    function recolectarUber(prefijo) {
      const datos = {};
      CAMPOS_UBER.forEach((clave) => {
        const el = document.getElementById(idUber(prefijo, clave));
        if (el) datos[clave] = el.value.trim();
      });
      return datos;
    }
    function poblarUber(prefijo, datos) {
      CAMPOS_UBER.forEach((clave) => {
        const el = document.getElementById(idUber(prefijo, clave));
        if (!el) return;
        const valor = (datos && datos[clave]) || '';
        el.value = el.type === 'date' ? fechaParaInput(valor) : valor;
      });
      const info = document.getElementById(idUber(prefijo, 'SOLICITUD') + '-actual');
      if (info) {
        const valor = (datos && datos['SOLICITUD']) || '';
        info.innerHTML = valor
          ? `<a href="${valor}" target="_blank" rel="noopener">📎 Ver archivo actual</a>`
          : '<span class="empty-state" style="margin:0">Sin archivo</span>';
      }
      const campoFechaAlta = document.getElementById(idUber(prefijo, 'FECHA DE ALTA'));
      if (campoFechaAlta) campoFechaAlta.value = formatearFecha(datos && datos['FECHA DE ALTA']);
    }
    async function subirArchivoUber(prefijo) {
      const input = document.getElementById(idUber(prefijo, 'SOLICITUD'));
      const file = input && input.files && input.files[0];
      if (!file) return {};
      const base64 = await leerArchivoBase64(file);
      const subido = await callServer('apiSubirArchivoUber', state.token, file.name, file.type, base64);
      return { SOLICITUD: subido.url };
    }

    const motorTablaUber = crearTablaInteractiva({
      thead: document.getElementById('uber-thead'),
      columnas: [
        { clave: 'NOMBRE_COMPLETO', etiqueta: 'Nombre' },
        { clave: 'RAZON_SOCIAL', etiqueta: 'Razón social' },
        { clave: 'ROL', etiqueta: 'Rol' },
        { clave: 'DEPARTAMENTO', etiqueta: 'Departamento' },
        { clave: 'PUESTO', etiqueta: 'Puesto' },
        { clave: 'ESTATUS', etiqueta: 'Estatus' },
      ],
      buscadorGlobal: document.getElementById('uber-buscar-global'),
      piePaginacion: document.getElementById('uber-pie'),
      onRenderPagina: (usuarios, total) => {
        vacio.hidden = total > 0;
        lista.innerHTML = usuarios.map((u) => `
          <tr>
            <td class="tabla-clickable" data-id="${u.ID}" title="Ver detalle completo">${u.NOMBRE_COMPLETO || '—'}</td>
            <td>${u.RAZON_SOCIAL || '—'}</td>
            <td>${etiquetaRol(u.ROL)}</td>
            <td>${u.DEPARTAMENTO || '—'}</td>
            <td>${u.PUESTO || '—'}</td>
            <td>${badgeEstatusUber(u.ESTATUS)}</td>
            <td>
              <div class="tabla-actions">
                <button type="button" class="secondary btn-editar-uber" data-id="${u.ID}" title="Editar"><i data-lucide="pencil" class="ico"></i></button>
                <button type="button" class="danger btn-eliminar-uber" data-id="${u.ID}" data-nombre="${u.NOMBRE_COMPLETO}" title="Eliminar"><i data-lucide="trash-2" class="ico"></i></button>
              </div>
            </td>
          </tr>
        `).join('');

        lista.querySelectorAll('.tabla-clickable').forEach((el) => {
          el.addEventListener('click', () => abrirDetalleUber(el.dataset.id));
        });
        lista.querySelectorAll('.btn-editar-uber').forEach((btn) => {
          btn.addEventListener('click', () => abrirEditarUber(btn.dataset.id));
        });
        lista.querySelectorAll('.btn-eliminar-uber').forEach((btn) => {
          btn.addEventListener('click', () => eliminarUber(btn.dataset.id, btn.dataset.nombre));
        });
        refreshIcons();
      },
    });

    async function cargar() {
      const errorBox = document.getElementById('uber-error');
      let usuarios;
      try {
        usuarios = await callServer('apiListarUberResumen', state.token);
      } catch (err) {
        console.error('No se pudo cargar el catálogo de Uber:', err);
        errorBox.textContent = 'No se pudo cargar el catálogo: ' + err.message;
        errorBox.hidden = false;
        return;
      }
      errorBox.hidden = true;
      todosLosUsuarios = usuarios || [];

      usuariosPorId = {};
      todosLosUsuarios.forEach((u) => { usuariosPorId[u.ID] = u; });

      // Los totales son del catálogo completo, sin importar el filtro.
      document.getElementById('uber-stat-total').textContent = todosLosUsuarios.length;
      document.getElementById('uber-stat-activos').textContent =
        todosLosUsuarios.filter((u) => String(u.ESTATUS || '').toUpperCase().includes('ACTIVO')).length;
      document.getElementById('uber-stat-pendientes').textContent =
        todosLosUsuarios.filter((u) => String(u.ESTATUS || '').toUpperCase().includes('PENDIENTE')).length;
      document.getElementById('uber-stat-baja').textContent =
        todosLosUsuarios.filter((u) => String(u.ESTATUS || '').toUpperCase().includes('BAJA')).length;

      motorTablaUber.setDatos(todosLosUsuarios);
    }

    async function abrirDetalleUber(id) {
      const resumen = usuariosPorId[id];
      if (!resumen) return;
      document.getElementById('detalle-uber-nombre-label').textContent = resumen.NOMBRE_COMPLETO || '';
      const grid = document.getElementById('detalle-uber-grid');
      grid.innerHTML = '<div class="loading-inline"><span class="spinner"></span> Cargando…</div>';
      modalDetalle.hidden = false;
      try {
        const completo = await callServer('apiBuscarUberPorId', state.token, id);
        if (!completo) {
          grid.innerHTML = '<p class="empty-state">No se encontró el registro completo.</p>';
          return;
        }
        grid.innerHTML = Object.keys(completo)
          .filter((k) => completo[k] !== '' && completo[k] !== null && completo[k] !== undefined)
          .map((k) => itemInfo(tituloDesdeClave(k), completo[k]))
          .join('');
      } catch (err) {
        grid.innerHTML = '<p class="error-msg">No se pudo cargar: ' + err.message + '</p>';
      }
    }
    document.getElementById('btn-cerrar-detalle-uber').addEventListener('click', () => { modalDetalle.hidden = true; });
    modalDetalle.addEventListener('click', (ev) => { if (ev.target === modalDetalle) modalDetalle.hidden = true; });

    async function abrirEditarUber(id) {
      const resumen = usuariosPorId[id];
      if (!resumen) return;
      document.getElementById('editar-uber-id').value = id;
      document.getElementById('editar-uber-nombre-label').textContent = resumen.NOMBRE_COMPLETO || '';
      document.getElementById('editar-uber-error').hidden = true;
      modalEditar.hidden = false;
      try {
        const completo = await callServer('apiBuscarUberPorId', state.token, id);
        if (completo) poblarUber('editar-uber', completo);
      } catch (err) {
        const errorBox = document.getElementById('editar-uber-error');
        errorBox.textContent = 'No se pudo cargar el registro: ' + err.message;
        errorBox.hidden = false;
      }
    }
    function cerrarEditarUber() {
      modalEditar.hidden = true;
      document.getElementById('form-editar-uber').reset();
      document.getElementById('editar-uber-error').hidden = true;
    }
    document.getElementById('btn-cancelar-editar-uber').addEventListener('click', cerrarEditarUber);
    modalEditar.addEventListener('click', (ev) => { if (ev.target === modalEditar) cerrarEditarUber(); });

    document.getElementById('form-editar-uber').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('editar-uber-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-editar-uber');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando…';
      try {
        const archivo = await subirArchivoUber('editar-uber');
        const datos = Object.assign(recolectarUber('editar-uber'), archivo);
        await callServer('apiActualizarUber', state.token, document.getElementById('editar-uber-id').value, datos);
        cerrarEditarUber();
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    async function eliminarUber(id, nombre) {
      if (!confirm('¿Eliminar a ' + nombre + ' del catálogo de Uber? Esta acción no se puede deshacer.')) return;
      try {
        await callServer('apiEliminarUber', state.token, id);
        await cargar();
      } catch (err) {
        alert('No se pudo eliminar: ' + err.message);
      }
    }

    document.getElementById('form-uber').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('uber-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-uber');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando…';
      try {
        const archivo = await subirArchivoUber('uber');
        const datos = Object.assign(recolectarUber('uber'), archivo);
        await callServer('apiCrearUber', state.token, datos);
        ev.target.reset();
        document.getElementById('uber-fecha-de-alta').value = new Date().toLocaleDateString('es-MX');
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    await cargar();
  }

  // ---------- Tickets (bitácora general de atención) ----------
  async function initTickets() {
    const lista = document.getElementById('lista-tickets');
    const vacio = document.getElementById('tickets-vacio');
    const modalEditar = document.getElementById('modal-editar-ticket');
    const modalDetalle = document.getElementById('modal-detalle-ticket');
    let ticketsPorId = {};
    let todosLosTickets = [];

    document.getElementById('ticket-fecha-registro').value = new Date().toLocaleDateString('es-MX');
    document.getElementById('ticket-fecha').value = hoyISO();

    // Departamentos: catálogo real (hoja "LISTAS VEHICULOS", columna
    // DEPARTAMENTO), no una lista fija a mano — mismas opciones en los dos formularios.
    try {
      const departamentos = await callServer('apiListarDepartamentos', state.token);
      const opciones = '<option value="">Selecciona…</option>' +
        (departamentos || []).map((d) => `<option value="${d}">${d}</option>`).join('');
      document.getElementById('ticket-departamento').innerHTML = opciones;
      document.getElementById('editar-ticket-departamento').innerHTML = opciones;
    } catch (err) {
      console.error('No se pudo cargar la lista de departamentos:', err);
    }

    // Solicitante: sugerencias (no lista cerrada) = UNIQUE(SORT(TICKETS[SOLICITANTE]))
    // de AppSheet — se puede seguir escribiendo un nombre nuevo que no esté aquí.
    try {
      const solicitantes = await callServer('apiListarSolicitantesTickets', state.token);
      document.getElementById('lista-solicitantes').innerHTML =
        (solicitantes || []).map((s) => `<option value="${s}"></option>`).join('');
    } catch (err) {
      console.error('No se pudo cargar la lista de solicitantes:', err);
    }

    const CAMPOS_TICKET = ['TICKET', 'FECHA', 'DEPARTAMENTO', 'SOLICITANTE', 'TIPO ATENCION', 'PLACA', 'QUIEN ATENDIO', 'COMENTARIO'];
    function idTicket(prefijo, clave) { return prefijo + '-' + slugCampo(clave); }
    function recolectarTicket(prefijo) {
      const datos = {};
      CAMPOS_TICKET.forEach((clave) => {
        const el = document.getElementById(idTicket(prefijo, clave));
        if (el) datos[clave] = el.value.trim();
      });
      return datos;
    }
    function poblarTicket(prefijo, datos) {
      CAMPOS_TICKET.forEach((clave) => {
        const el = document.getElementById(idTicket(prefijo, clave));
        if (!el) return;
        const valor = (datos && datos[clave]) || '';
        el.value = el.type === 'date' ? fechaParaInput(valor) : valor;
      });
    }

    const motorTablaTickets = crearTablaInteractiva({
      thead: document.getElementById('tickets-thead'),
      columnas: [
        { clave: 'TICKET', etiqueta: 'Ticket' },
        { clave: 'FECHA', etiqueta: 'Fecha' },
        { clave: 'DEPARTAMENTO', etiqueta: 'Departamento' },
        { clave: 'SOLICITANTE', etiqueta: 'Solicitante' },
        { clave: 'TIPO_ATENCION', etiqueta: 'Tipo de atención' },
        { clave: 'QUIEN_ATENDIO', etiqueta: 'Atendió' },
      ],
      buscadorGlobal: document.getElementById('tickets-buscar-global'),
      piePaginacion: document.getElementById('tickets-pie'),
      onRenderPagina: (tickets, total) => {
        vacio.hidden = total > 0;
        lista.innerHTML = tickets.map((t) => `
          <tr>
            <td class="tabla-clickable" data-id="${t.ID}" title="Ver detalle completo">${t.TICKET || '—'}</td>
            <td>${formatearFecha(t.FECHA)}</td>
            <td>${t.DEPARTAMENTO || '—'}</td>
            <td>${t.SOLICITANTE || '—'}</td>
            <td>${t.TIPO_ATENCION || '—'}</td>
            <td>${t.QUIEN_ATENDIO || '—'}</td>
            <td>
              <div class="tabla-actions">
                <button type="button" class="secondary btn-editar-ticket" data-id="${t.ID}" title="Editar"><i data-lucide="pencil" class="ico"></i></button>
                <button type="button" class="danger btn-eliminar-ticket" data-id="${t.ID}" data-ticket="${t.TICKET}" title="Eliminar"><i data-lucide="trash-2" class="ico"></i></button>
              </div>
            </td>
          </tr>
        `).join('');

        lista.querySelectorAll('.tabla-clickable').forEach((el) => {
          el.addEventListener('click', () => abrirDetalleTicket(el.dataset.id));
        });
        lista.querySelectorAll('.btn-editar-ticket').forEach((btn) => {
          btn.addEventListener('click', () => abrirEditarTicket(btn.dataset.id));
        });
        lista.querySelectorAll('.btn-eliminar-ticket').forEach((btn) => {
          btn.addEventListener('click', () => eliminarTicket(btn.dataset.id, btn.dataset.ticket));
        });
        refreshIcons();
      },
    });

    async function cargar() {
      const errorBox = document.getElementById('ticket-error');
      let tickets;
      try {
        tickets = await callServer('apiListarTicketsResumen', state.token);
      } catch (err) {
        console.error('No se pudo cargar el historial de tickets:', err);
        errorBox.textContent = 'No se pudo cargar el historial: ' + err.message;
        errorBox.hidden = false;
        return;
      }
      errorBox.hidden = true;
      todosLosTickets = tickets || [];

      ticketsPorId = {};
      todosLosTickets.forEach((t) => { ticketsPorId[t.ID] = t; });

      document.getElementById('tickets-stat-total').textContent = todosLosTickets.length;

      motorTablaTickets.setDatos(todosLosTickets);
    }

    async function abrirDetalleTicket(id) {
      const resumen = ticketsPorId[id];
      if (!resumen) return;
      document.getElementById('detalle-ticket-label').textContent = 'Ticket: ' + (resumen.TICKET || id);
      const grid = document.getElementById('detalle-ticket-grid');
      grid.innerHTML = '<div class="loading-inline"><span class="spinner"></span> Cargando…</div>';
      modalDetalle.hidden = false;
      try {
        const completo = await callServer('apiBuscarTicketPorId', state.token, id);
        if (!completo) {
          grid.innerHTML = '<p class="empty-state">No se encontró el registro completo.</p>';
          return;
        }
        grid.innerHTML = Object.keys(completo)
          .filter((k) => completo[k] !== '' && completo[k] !== null && completo[k] !== undefined)
          .map((k) => itemInfo(tituloDesdeClave(k), completo[k]))
          .join('');
      } catch (err) {
        grid.innerHTML = '<p class="error-msg">No se pudo cargar: ' + err.message + '</p>';
      }
    }
    document.getElementById('btn-cerrar-detalle-ticket').addEventListener('click', () => { modalDetalle.hidden = true; });
    modalDetalle.addEventListener('click', (ev) => { if (ev.target === modalDetalle) modalDetalle.hidden = true; });

    async function abrirEditarTicket(id) {
      const resumen = ticketsPorId[id];
      if (!resumen) return;
      document.getElementById('editar-ticket-id').value = id;
      document.getElementById('editar-ticket-label').textContent = 'Ticket: ' + (resumen.TICKET || id);
      document.getElementById('editar-ticket-error').hidden = true;
      modalEditar.hidden = false;
      try {
        const completo = await callServer('apiBuscarTicketPorId', state.token, id);
        if (completo) poblarTicket('editar-ticket', completo);
      } catch (err) {
        const errorBox = document.getElementById('editar-ticket-error');
        errorBox.textContent = 'No se pudo cargar el registro: ' + err.message;
        errorBox.hidden = false;
      }
    }
    function cerrarEditarTicket() {
      modalEditar.hidden = true;
      document.getElementById('form-editar-ticket').reset();
      document.getElementById('editar-ticket-error').hidden = true;
    }
    document.getElementById('btn-cancelar-editar-ticket').addEventListener('click', cerrarEditarTicket);
    modalEditar.addEventListener('click', (ev) => { if (ev.target === modalEditar) cerrarEditarTicket(); });

    document.getElementById('form-editar-ticket').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('editar-ticket-error');
      errorBox.hidden = true;
      try {
        await callServer('apiActualizarTicket', state.token, document.getElementById('editar-ticket-id').value, recolectarTicket('editar-ticket'));
        cerrarEditarTicket();
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });

    async function eliminarTicket(id, ticket) {
      if (!confirm('¿Eliminar el ticket ' + ticket + '? Esta acción no se puede deshacer.')) return;
      try {
        await callServer('apiEliminarTicket', state.token, id);
        await cargar();
      } catch (err) {
        alert('No se pudo eliminar: ' + err.message);
      }
    }

    document.getElementById('form-ticket').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('ticket-error');
      errorBox.hidden = true;
      try {
        await callServer('apiCrearTicket', state.token, recolectarTicket('ticket'));
        ev.target.reset();
        document.getElementById('ticket-fecha-registro').value = new Date().toLocaleDateString('es-MX');
        document.getElementById('ticket-fecha').value = hoyISO();
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });

    await cargar();
  }

  document.getElementById('btn-logout').addEventListener('click', cerrarSesion);
  document.querySelectorAll('#sidebar .nav-item[data-view]').forEach((el) => {
    el.addEventListener('click', () => navegarA(el.dataset.view));
  });

  renderNavGrupos();
  render();
</script>
