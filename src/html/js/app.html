<script>
  /**
   * app.js — estado global, router SPA (client-side) e inicialización de cada vista.
   * Las vistas viven como <template> ya embebidas en el HTML (ver Index.html),
   * se clonan a #view-container al navegar. Cero round-trips extra al servidor
   * solo por cambiar de pantalla.
   */

  // Íconos (Lucide): dibuja cualquier <i data-lucide="..."> que haya en el DOM.
  // Hay que llamarla cada vez que se inyecta HTML nuevo con íconos (innerHTML no
  // los "activa" solo) — por eso aparece después de casi cada render dinámico.
  function refreshIcons() {
    if (window.lucide) lucide.createIcons();
  }

  // Tema (claro/oscuro) — se aplica antes de montar cualquier vista para evitar parpadeo.
  // Los botones de tema viven en dos lugares (login y sidebar del app-shell), así que
  // se identifican por clase (.theme-btn + data-tema), no por id, y se manejan con
  // delegación de eventos para que funcionen sin importar cuándo se monten.
  (function initTema() {
    try {
      const guardado = localStorage.getItem('tema');
      if (guardado === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* localStorage puede fallar en vista previa/incógnito, se ignora */ }
  })();

  function aplicarTema(tema) {
    if (tema === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    try { localStorage.setItem('tema', tema); } catch (e) { /* no-op */ }
    document.querySelectorAll('.theme-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tema === tema);
    });
  }

  // Fecha de hoy en la barra superior, formato "Martes 10 de agosto del 2026".
  (function initFechaTopbar() {
    const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const meses = [
      'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
      'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
    ];
    const hoy = new Date();
    const texto = `${dias[hoy.getDay()]} ${hoy.getDate()} de ${meses[hoy.getMonth()]} del ${hoy.getFullYear()}`;
    const el = document.getElementById('topbar-date');
    if (el) el.textContent = texto;
  })();

  // Sidebar colapsable — igual que el tema, se aplica antes de pintar para evitar parpadeo.
  (function initColapsoSidebar() {
    try {
      if (localStorage.getItem('sidebarColapsado') === '1') {
        document.getElementById('sidebar').classList.add('collapsed');
      }
    } catch (e) { /* no-op */ }
  })();

  document.addEventListener('click', (ev) => {
    const btnTema = ev.target.closest('.theme-btn');
    if (btnTema) { aplicarTema(btnTema.dataset.tema); return; }

    if (ev.target.closest('#sidebar-collapse-btn')) {
      const sidebar = document.getElementById('sidebar');
      const colapsado = sidebar.classList.toggle('collapsed');
      try { localStorage.setItem('sidebarColapsado', colapsado ? '1' : '0'); } catch (e) { /* no-op */ }
    }
  });

  const state = {
    token: sessionStorage.getItem('token') || null,
    sesion: JSON.parse(sessionStorage.getItem('sesion') || 'null'),
  };

  function guardarSesion(resultadoLogin) {
    state.token = resultadoLogin.token;
    state.sesion = resultadoLogin;
    sessionStorage.setItem('token', state.token);
    sessionStorage.setItem('sesion', JSON.stringify(resultadoLogin));
  }

  function cerrarSesion() {
    if (state.token) apiLogoutSafe();
    state.token = null;
    state.sesion = null;
    sessionStorage.clear();
    render();
  }
  async function apiLogoutSafe() {
    try { await callServer('apiLogout', state.token); } catch (e) { /* no-op */ }
  }

  function render() {
    document.getElementById('app-shell').hidden = !state.token;
    document.getElementById('login-screen-container').hidden = !!state.token;

    if (!state.token) {
      initLogin();
      return;
    }
    document.getElementById('user-name').textContent = state.sesion.nombre + ' · ' + state.sesion.rol;
    navegarA('dashboard');
  }

  /**
   * Pantalla de carga que se muestra justo después de un login exitoso
   * (manual o con Google), antes de entrar al dashboard. Los 4 íconos de
   * módulos se van "encendiendo" en secuencia con un mensaje temático, para
   * darle personalidad a la espera en vez de un spinner genérico.
   */
  function mostrarPantallaCarga(callback) {
    const container = document.getElementById('loading-screen-container');
    montarVista('tpl-loading', null, container);

    const pasos = [
      { icono: 'loading-icon-0', mensaje: 'Sincronizando vehículos…' },
      { icono: 'loading-icon-1', mensaje: 'Actualizando líneas telefónicas…' },
      { icono: 'loading-icon-2', mensaje: 'Revisando accesorios…' },
      { icono: 'loading-icon-3', mensaje: 'Cerrando caja chica del día…' },
    ];
    const duracionTotal = 1900;
    const porPaso = duracionTotal / pasos.length;

    const barra = document.getElementById('loading-bar-fill');
    const mensaje = document.getElementById('loading-message');

    requestAnimationFrame(() => {
      barra.style.transitionDuration = duracionTotal + 'ms';
      barra.style.width = '100%';
    });

    pasos.forEach((paso, i) => {
      setTimeout(() => {
        document.getElementById(paso.icono).classList.add('active');
        mensaje.classList.add('fade');
        setTimeout(() => {
          mensaje.textContent = paso.mensaje;
          mensaje.classList.remove('fade');
        }, 150);
      }, i * porPaso);
    });

    setTimeout(() => {
      const pantalla = document.getElementById('loading-screen');
      pantalla.classList.add('fade-out');
      setTimeout(() => {
        container.innerHTML = '';
        callback();
      }, 450);
    }, duracionTotal + 250);
  }

  function montarVista(templateId, initFn, container) {
    container = container || document.getElementById('view-container');
    const tpl = document.getElementById(templateId);
    container.innerHTML = '';
    container.appendChild(tpl.content.cloneNode(true));
    refreshIcons();
    if (initFn) initFn();
  }

  /** Ícono (nombre de Lucide) temático según a qué área pertenece la vista. */
  function iconoDeVista(vista) {
    if (vista === 'dashboard') return 'home';
    const grupo = NAV_GRUPOS.find((g) => g.items.some((it) => it.vista === vista));
    return grupo ? grupo.icono : 'file-text';
  }

  /**
   * Transición corta y temática al cambiar de módulo — no acelera la carga
   * real, solo evita que el cambio se sienta "trabado" o instantáneo/brusco.
   * Mantiene la vista anterior visible detrás mientras aparece, monta la
   * vista nueva a la mitad, y se desvanece revelándola.
   */
  function transicionVista(vista, etiqueta, montarVistaReal) {
    // Se cuelga de #main (no de #view-container) para cubrir TODO el módulo
    // sin importar si la vista anterior estaba scrolleada — #view-container
    // hace scroll interno, así que un overlay dentro de él se movía con el
    // scroll y dejaba ver contenido viejo.
    const cont = document.getElementById('main');
    const overlay = document.createElement('div');
    overlay.className = 'view-transition';
    overlay.innerHTML =
      '<div class="view-transition-icon"><i data-lucide="' + iconoDeVista(vista) + '" class="ico"></i></div>' +
      '<div class="view-transition-text">Cargando ' + (etiqueta || '') + '…</div>';
    cont.appendChild(overlay);
    refreshIcons();
    requestAnimationFrame(() => overlay.classList.add('show'));

    setTimeout(() => {
      montarVistaReal();
      overlay.classList.remove('show');
      setTimeout(() => overlay.remove(), 300);
    }, 2500);
  }

  function navegarA(vista, etiqueta) {
    document.querySelectorAll('.nav-item, .nav-subitem').forEach((el) => {
      el.classList.toggle('active', el.dataset.view === vista);
    });

    transicionVista(vista, etiqueta, () => {
      if (vista === 'dashboard') { montarVista('tpl-dashboard', initDashboard); return; }
      if (vista === 'accesorios') { montarVista('tpl-accesorios', initAccesorios); return; }
      if (vista === 'incidencias') { montarVista('tpl-incidencias', initIncidencias); return; }
      if (vista === 'verificaciones') { montarVista('tpl-verificaciones', initVerificaciones); return; }
      if (vista === 'vehiculos') { montarVista('tpl-vehiculos', initVehiculos); return; }
      mostrarProximamente(etiqueta || vista);
    });
  }

  /** Placeholder para módulos que ya están en el menú pero aún no se han construido */
  function mostrarProximamente(nombreModulo) {
    document.getElementById('view-container').innerHTML =
      '<div class="card" style="max-width:420px; margin:60px auto; text-align:center;">' +
      '<div style="font-size:32px; margin-bottom:10px;"><i data-lucide="construction" class="ico"></i></div>' +
      '<h2 style="margin-bottom:6px;">' + nombreModulo + '</h2>' +
      '<p style="color:var(--color-text-muted); font-size:13px; margin:0;">' +
      'Este módulo todavía no está construido — muy pronto.</p>' +
      '</div>';
    refreshIcons();
  }

  /**
   * Estructura del sidebar por área. La mayoría de estos sub-módulos todavía
   * no están construidos (ver mostrarProximamente); "accesorios" es el único
   * que ya apunta a un módulo real y funcional.
   */
  const NAV_GRUPOS = [
    {
      id: 'servicios-vehiculares', icono: 'car', etiqueta: 'Servicios Vehiculares',
      items: [
        { vista: 'incidencias', etiqueta: 'Incidencias' },
        { vista: 'vehiculos', etiqueta: 'Vehículos' },
        { vista: 'cambios-vehiculos', etiqueta: 'Cambios Vehículos' },
        { vista: 'reasignaciones-vehiculares', etiqueta: 'Reasignaciones Vehiculares' },
        { vista: 'verificaciones', etiqueta: 'Verificaciones' },
        { vista: 'instalacion-sensores', etiqueta: 'Instalación de Sensores' },
        { vista: 'servicios', etiqueta: 'Servicios' },
        { vista: 'hologramas', etiqueta: 'Hologramas' },
      ],
    },
    {
      id: 'lineas', icono: 'smartphone', etiqueta: 'Líneas',
      items: [
        { vista: 'reasignaciones-lineas', etiqueta: 'Control de Reasignaciones - Líneas' },
        { vista: 'accesorios', etiqueta: 'Inventario de Accesorios' },
        { vista: 'reactivacion-lineas', etiqueta: 'Reactivación de Líneas' },
        { vista: 'lineas-telefonicas', etiqueta: 'Líneas Telefónicas' },
        { vista: 'cambios-lineas', etiqueta: 'Control de Cambios - Líneas' },
        { vista: 'bitacora-desechos', etiqueta: 'Bitácora de Desechos' },
        { vista: 'lineas-post-venta', etiqueta: 'Líneas Post Venta' },
      ],
    },
    {
      id: 'arqueos', icono: 'wallet', etiqueta: 'Arqueos',
      items: [
        { vista: 'arqueos', etiqueta: 'Arqueos' },
        { vista: 'caja-chica', etiqueta: 'Caja Chica' },
      ],
    },
    {
      id: 'uber', icono: 'car-taxi-front', etiqueta: 'Uber',
      items: [
        { vista: 'uber', etiqueta: 'Uber' },
        { vista: 'tickets', etiqueta: 'Tickets' },
      ],
    },
  ];

  function renderNavGrupos() {
    const contenedor = document.getElementById('nav-groups');
    contenedor.innerHTML = NAV_GRUPOS.map((grupo) => `
      <div class="nav-group" id="nav-group-${grupo.id}">
        <div class="nav-group-header" data-grupo="${grupo.id}">
          <span class="nav-icon"><i data-lucide="${grupo.icono}" class="ico"></i></span>
          <span class="nav-label">${grupo.etiqueta}</span>
          <span class="nav-group-chevron"><i data-lucide="chevron-right" class="ico"></i></span>
        </div>
        <div class="nav-group-items">
          ${grupo.items.map((item) => `
            <div class="nav-subitem" data-view="${item.vista}" data-etiqueta="${item.etiqueta}">${item.etiqueta}</div>
          `).join('')}
        </div>
      </div>
    `).join('');

    contenedor.querySelectorAll('.nav-group-header').forEach((header) => {
      header.addEventListener('click', () => {
        document.getElementById('nav-group-' + header.dataset.grupo).classList.toggle('expanded');
      });
    });
    contenedor.querySelectorAll('.nav-subitem').forEach((el) => {
      el.addEventListener('click', () => navegarA(el.dataset.view, el.dataset.etiqueta));
    });
    refreshIcons();
  }

  // ---------- Login ----------
  function initLogin() {
    const login = document.getElementById('login-screen-container');
    montarVista('tpl-login', null, login);

    aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

    const inputPassword = document.getElementById('login-password');
    document.getElementById('toggle-password').addEventListener('click', (ev) => {
      const seVaAMostrar = inputPassword.type === 'password';
      inputPassword.type = seVaAMostrar ? 'text' : 'password';
      ev.currentTarget.innerHTML = `<i data-lucide="${seVaAMostrar ? 'eye' : 'eye-off'}" class="ico"></i>`;
      refreshIcons();
    });

    initGoogleQuickLogin();

    document.getElementById('form-login').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const correo = document.getElementById('login-correo').value.trim();
      const password = document.getElementById('login-password').value;
      const errorBox = document.getElementById('login-error');
      errorBox.hidden = true;
      try {
        const resultado = await callServer('apiLogin', correo, password);
        guardarSesion(resultado);
        mostrarPantallaCarga(() => render());
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });
  }

  /**
   * Detecta la cuenta de Google con la que ya se accedió a la webapp (el
   * acceso restringido a dominio obliga a iniciar sesión con Google antes de
   * siquiera llegar aquí) y, si coincide con un usuario activo, muestra el
   * botón de acceso directo "Continuar como [nombre]".
   */
  async function initGoogleQuickLogin() {
    const chip = document.getElementById('google-account-chip');
    const divisor = document.getElementById('login-or-divider');
    try {
      const identidad = await callServer('apiIdentidadGoogle');
      if (!identidad || !identidad.coincide) return; // se queda solo el formulario manual

      document.getElementById('google-account-avatar').textContent =
        (identidad.nombre || identidad.correo).trim().charAt(0).toUpperCase();
      document.getElementById('google-account-name').textContent = identidad.nombre || identidad.correo;
      document.getElementById('google-account-email').textContent = identidad.correo;
      chip.hidden = false;
      divisor.hidden = false;

      chip.addEventListener('click', async () => {
        const errorBox = document.getElementById('login-error');
        errorBox.hidden = true;
        try {
          const resultado = await callServer('apiLoginConGoogle');
          guardarSesion(resultado);
          mostrarPantallaCarga(() => render());
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.hidden = false;
        }
      });
    } catch (err) {
      // Si falla la detección (poco común), simplemente se queda el formulario manual.
    }
  }

  // ---------- Dashboard ----------
  function initDashboard() {
    document.querySelectorAll('.nav-module[data-view]').forEach((el) => {
      el.addEventListener('click', () => navegarA(el.dataset.view));
    });
  }

  // ---------- Accesorios ----------
  async function initAccesorios() {
    const selectArticulo = document.getElementById('mov-articulo');
    const tabla = document.getElementById('tabla-articulos');

    async function cargar() {
      const articulos = await callServer('apiListarArticulosConStock', state.token);

      selectArticulo.innerHTML = articulos
        .map((a) => `<option value="${a.ID}">${a.NOMBRE}</option>`).join('');

      tabla.innerHTML = articulos.map((a) => {
        const bajo = Number(a.STOCK) <= Number(a.STOCK_MINIMO || 0);
        return `<tr>
          <td>${a.CATEGORIA || ''}</td>
          <td>${a.NOMBRE || ''}</td>
          <td>${a.MARCA || ''}</td>
          <td><span class="badge ${bajo ? 'low' : 'ok'}">${a.STOCK}</span></td>
        </tr>`;
      }).join('');
    }

    document.getElementById('form-movimiento').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('mov-error');
      errorBox.hidden = true;
      try {
        await callServer(
          'apiRegistrarMovimiento',
          state.token,
          selectArticulo.value,
          document.getElementById('mov-tipo').value,
          Number(document.getElementById('mov-cantidad').value),
          ''
        );
        document.getElementById('mov-cantidad').value = '';
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });

    await cargar();
  }

  // ---------- Incidencias ----------
  function hoyISO() {
    return new Date().toISOString().slice(0, 10);
  }
  function fijarFechaRegistroHoy() {
    document.getElementById('inc-fecha-registro').value = new Date().toLocaleDateString('es-MX');
  }
  function fechaParaInput(valor) {
    if (!valor) return '';
    const f = new Date(valor);
    return isNaN(f) ? '' : f.toISOString().slice(0, 10);
  }
  function formatearFecha(valor) {
    if (!valor) return '—';
    const f = new Date(valor);
    return isNaN(f) ? '—' : f.toLocaleDateString('es-MX');
  }
  // Helpers compartidos para las tarjetas de "detalle completo" (Incidencias y Vehículos).
  function tituloDesdeClave(clave) {
    return clave.toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase());
  }
  function formatearValorInfo(valor) {
    if (typeof valor === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(valor)) return formatearFecha(valor);
    return String(valor);
  }
  function itemInfo(etiqueta, valor) {
    return `
      <div class="info-item">
        <div class="info-label">${etiqueta}</div>
        <div class="info-value">${formatearValorInfo(valor)}</div>
      </div>
    `;
  }
  function seccionInfo(icono, titulo) {
    return `<div class="info-section-title"><i data-lucide="${icono}" class="ico"></i> ${titulo}</div>`;
  }

  async function initIncidencias() {
    const lista = document.getElementById('lista-incidencias');
    const vacio = document.getElementById('incidencias-vacio');
    const modal = document.getElementById('modal-cerrar');
    const modalEditar = document.getElementById('modal-editar');
    const modalVehiculo = document.getElementById('modal-vehiculo');
    let incidenciasPorId = {};

    // Fecha de registro: siempre hoy, no editable (el servidor la fuerza igual).
    fijarFechaRegistroHoy();
    document.getElementById('inc-fecha-inspeccion').value = hoyISO();

    // Autollenado: el folio del vehículo trae Departamento/Modelo desde Vehículos.
    // OJO: esto NO se espera aquí (sin await) para que salga en paralelo con la
    // carga del historial (cargar(), al final de esta función) en vez de una
    // petición tras otra — cada una puede tardar un rato y sumadas se sentía
    // muy lento.
    const vehiculosPorFolio = {};
    const promesaVehiculos = callServer('apiListarVehiculosBasico', state.token)
      .then((vehiculos) => {
        const datalist = document.getElementById('lista-folios-vehiculo');
        datalist.innerHTML = vehiculos.map((v) => {
          vehiculosPorFolio[v.FOLIO] = v;
          const etiqueta = [v.MARCA, v.LINEA_VEHICULO].filter(Boolean).join(' ');
          return `<option value="${v.FOLIO}">${etiqueta}</option>`;
        }).join('');
      })
      .catch((err) => {
        // Antes esto se ignoraba en silencio — ahora se ve para poder diagnosticar.
        console.error('No se pudo cargar el catálogo de vehículos:', err);
        const errorBox = document.getElementById('inc-error');
        errorBox.textContent = 'No se pudo cargar el catálogo de vehículos para autocompletar: ' + err.message;
        errorBox.hidden = false;
      });

    document.getElementById('inc-folio').addEventListener('input', (ev) => {
      const vehiculo = vehiculosPorFolio[ev.target.value];
      const campoDepto = document.getElementById('inc-departamento');
      const campoModelo = document.getElementById('inc-modelo');
      if (vehiculo) {
        campoDepto.value = vehiculo.DEPARTAMENTO;
        campoModelo.value = [vehiculo.MARCA, vehiculo.LINEA_VEHICULO].filter(Boolean).join(' ');
        document.getElementById('inc-anio').value = vehiculo.MODELO || '';
        document.getElementById('tag-departamento').hidden = false;
        document.getElementById('tag-modelo').hidden = false;
      } else {
        document.getElementById('tag-departamento').hidden = true;
        document.getElementById('tag-modelo').hidden = true;
      }
    });

    // Mismo autollenado, pero para el folio dentro del modal de Editar.
    document.getElementById('editar-folio').addEventListener('input', (ev) => {
      const vehiculo = vehiculosPorFolio[ev.target.value];
      if (vehiculo) {
        document.getElementById('editar-departamento').value = vehiculo.DEPARTAMENTO;
        document.getElementById('editar-modelo').value = [vehiculo.MARCA, vehiculo.LINEA_VEHICULO].filter(Boolean).join(' ');
        document.getElementById('editar-anio').value = vehiculo.MODELO || '';
      }
    });

    function abrirModalCierre(id, folio) {
      document.getElementById('cerrar-id').value = id;
      document.getElementById('cerrar-folio').textContent = 'Folio: ' + folio;
      document.getElementById('cerrar-fecha-trabajo').value = hoyISO();
      modal.hidden = false;
    }
    function cerrarModal() {
      modal.hidden = true;
      document.getElementById('form-cerrar-incidencia').reset();
      document.getElementById('cerrar-error').hidden = true;
    }

    function abrirModalEditar(inc) {
      if (!inc) return;
      document.getElementById('editar-id').value = inc.ID;
      document.getElementById('editar-folio-label').textContent = 'Folio: ' + inc.FOLIO;
      document.getElementById('editar-folio').value = inc.FOLIO || '';
      document.getElementById('editar-departamento').value = inc.DEPARTAMENTO || '';
      document.getElementById('editar-modelo').value = inc.MODELO || '';
      document.getElementById('editar-anio').value = inc.ANIO || '';
      document.getElementById('editar-fecha-inspeccion').value = fechaParaInput(inc.FECHA_INSPECCION);
      document.getElementById('editar-kilometraje').value = inc.KILOMETRAJE || '';
      document.getElementById('editar-ticket').value = inc.TICKET || '';
      document.getElementById('editar-periodo-verificacion').value = inc.PERIODO_VERIFICACION || '';
      document.getElementById('editar-seguro-auto').value = inc.SEGURO_AUTO || '';
      document.getElementById('editar-motivo').value = inc.INSPECCION_INGRESO || '';
      document.getElementById('editar-trabajo').value = inc.DESCRIPCION_TRABAJO || '';
      document.getElementById('editar-fecha-trabajo').value = fechaParaInput(inc.FECHA_TRABAJO);
      document.getElementById('editar-mecanico').value = inc.MECANICO || '';
      document.getElementById('editar-salida').value = inc.INSPECCION_SALIDA || '';
      document.getElementById('editar-error').hidden = true;
      modalEditar.hidden = false;
    }
    function cerrarModalEditar() {
      modalEditar.hidden = true;
      document.getElementById('form-editar-incidencia').reset();
      document.getElementById('editar-error').hidden = true;
    }

    const ETIQUETAS_INCIDENCIA = {
      FOLIO: 'Folio', DEPARTAMENTO: 'Departamento', MODELO: 'Modelo', ANIO: 'Año',
      FECHA_REGISTRO: 'Fecha de registro', FECHA_INSPECCION: 'Fecha de inspección',
      KILOMETRAJE: 'Kilometraje', TICKET: 'Ticket',

    async function abrirModalVehiculo(folio, id) {
      document.getElementById('vehiculo-folio-label').textContent = 'Folio: ' + folio;

      const vacio = document.getElementById('vehiculo-info-vacio');
      vacio.hidden = true;

      // Sección "Incidencia": ya la tenemos en memoria, no hace falta pedirla.
      const inc = incidenciasPorId[id];
      let html = '';
      if (inc) {
        html += seccionInfo('clipboard-list', 'Incidencia');
        html += Object.keys(ETIQUETAS_INCIDENCIA)
          .filter((clave) => inc[clave] !== '' && inc[clave] !== null && inc[clave] !== undefined)
          .map((clave) => itemInfo(ETIQUETAS_INCIDENCIA[clave], inc[clave]))
          .join('');
      }
      html += seccionInfo('car', 'Vehículo');
      html += '<div class="loading-inline" id="vehiculo-info-cargando"><span class="spinner"></span> Buscando en el catálogo de vehículos…</div>';

      modalVehiculo.hidden = false;

      try {
        const vehiculo = await callServer('apiBuscarVehiculoPorFolio', state.token, folio);

          vacio.hidden = false;
          return;

        grid.insertAdjacentHTML('beforeend', Object.keys(vehiculo)
          .filter((clave) => vehiculo[clave] !== '' && vehiculo[clave] !== null && vehiculo[clave] !== undefined)
          .map((clave) => itemInfo(tituloDesdeClave(clave), vehiculo[clave]))
          .join(''));

        const cargando = document.getElementById('vehiculo-info-cargando');
        if (cargando) cargando.remove();
        vacio.hidden = false;
        document.getElementById('vehiculo-info-vacio').textContent = 'No se pudo cargar el vehículo: ' + err.message;

      if (!clase) return 'tag-slate';
      let hash = 0;
      for (let i = 0; i < clase.length; i++) hash = (hash * 31 + clase.charCodeAt(i)) >>> 0;
      return PALETA_CLASES[hash % PALETA_CLASES.length];

  // ---------- Verificaciones ----------
  function escaparHtml(valor) {
    return String(valor == null ? '' : valor).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  /** Lee un archivo del <input type=file> como base64 sin el prefijo "data:...;base64," */
  function leerArchivoBase64(archivo) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = () => resolve(String(lector.result).split(',')[1]);
      lector.onerror = () => reject(new Error('No se pudo leer el archivo'));
      lector.readAsDataURL(archivo);
    });
  }

  /** Fecha local "yyyy-MM-dd" (hoyISO() usa UTC y después de las 6 pm en México da mañana) */
  function hoyLocal() {
    const f = new Date();
    return [f.getFullYear(), String(f.getMonth() + 1).padStart(2, '0'), String(f.getDate()).padStart(2, '0')].join('-');
  }

  /** Abre un archivo de Drive a partir de su ruta AppSheet (la pestaña se abre antes para que no la bloqueen) */
  async function abrirComprobanteVerificacion(ruta) {
    const pestana = window.open('', '_blank');
    try {
      pestana.location.href = await callServer('apiUrlComprobanteVerificacion', state.token, ruta);
    } catch (err) {
      if (pestana) pestana.close();
      Notificar.error(err.message);
    }
  }

  async function initVerificaciones() {
    const MAX_BYTES = 10 * 1024 * 1024;
    const DIA_MS = 24 * 60 * 60 * 1000;
    // Permisos por rol (el servidor los vuelve a validar; aquí solo se muestra lo que aplica)
    const rol = state.sesion && state.sesion.rol;
    const esAdmin = rol === 'ADMIN';
    const puedeEditar = rol === 'ADMIN' || rol === 'OPERADOR';
    let verificaciones = [];

    // ----- Cálculos derivados (estado de vigencia por vehículo) -----
    function diasParaVencer(fechaProximaISO) {
      if (!fechaProximaISO) return null;
      return Math.floor((new Date(fechaProximaISO) - new Date(hoyLocal() + 'T00:00:00')) / DIA_MS);
    }

    /** Agrega ESTADO y DIAS_RESTANTES. Solo la verificación más reciente de cada folio cuenta como vigente. */
    function conDerivados(filas) {
      const ultimaPorFolio = {};
      filas.forEach((v) => {
        const actual = ultimaPorFolio[v.FOLIO];
        if (!actual || (v.FECHA_VERIFICACION || '') > (actual.FECHA_VERIFICACION || '')) ultimaPorFolio[v.FOLIO] = v;
      });
      return filas.map((v) => {
        const dias = diasParaVencer(v.FECHA_PROXIMA);
        let estado = 'Reemplazada';
        if (ultimaPorFolio[v.FOLIO] === v) {
          estado = dias === null ? 'Sin fecha' : dias < 0 ? 'Vencida' : dias <= 30 ? 'Por vencer' : 'Vigente';
        }
        return Object.assign({}, v, { ESTADO: estado, DIAS_RESTANTES: dias });
      });
    }

    const BADGE_ESTADO = {
      'Vigente': ['cerrada', '✅ Vigente'],
      'Por vencer': ['abierta', '⏳ Por vencer'],
      'Vencida': ['abierta', '⚠️ Vencida'],
    };
    function badgeEstado(estado) {
      const b = BADGE_ESTADO[estado];
      return b ? `<span class="badge-estado ${b[0]}">${b[1]}</span>` : `<span style="color:var(--color-text-muted)">${escaparHtml(estado)}</span>`;
    }

    function pintarStats() {
      document.getElementById('ver-stat-total').textContent = verificaciones.length;
      document.getElementById('ver-stat-vencidas').textContent = verificaciones.filter((v) => v.ESTADO === 'Vencida').length;
      document.getElementById('ver-stat-por-vencer').textContent = verificaciones.filter((v) => v.ESTADO === 'Por vencer').length;
    }

    /** Chip de KPI → valor de la columna ESTADO que filtra */
    const KPI_ESTADO = { 'ver-kpi-por-vencer': 'Por vencer', 'ver-kpi-vencidas': 'Vencida' };

    // ----- Pestaña 1: tabla -----
    const tabla = DataTable.crear(document.getElementById('ver-tabla'), {
      idCampo: 'ID',
      idTabla: 'verificaciones',   // recuerda columnas, anchos, orden y densidad de cada usuario
      ordenInicial: { campo: 'FECHA_REGISTRO', dir: 'desc' },
      textoVacio: 'Todavía no hay verificaciones registradas',
      ayuda: 'Fechas: pasa el mouse y usa ✏️ (o doble clic). ✓ o Enter guarda, ✕ o Esc cancela; Ctrl+Z deshace. ' +
        'El folio se cambia desde 🔍 Ver detalle. ▾ en cada columna: filtrar, ordenar, fijar u ocultar. ' +
        'Shift+clic en casillas selecciona un rango.',
      alCambiarFiltros: (filtros) => marcarKpiActivo(filtros),
      exportar: { nombreArchivo: 'Verificaciones' },
      etiquetaFila: (v) => [v.FOLIO, v.PLACA, v.FECHA_VERIFICACION ? 'verificó ' + formatearFecha(v.FECHA_VERIFICACION) : '']
        .filter(Boolean).join(' · '),
      detalle: {
        titulo: (v) => 'Verificación ' + v.FOLIO,
        contenidoExtra: (v, contenedor) => mostrarComprobanteEnPanel(v, contenedor),
      },
      columnas: [
        // Cambiar el folio también cambia la placa: solo desde el panel de detalle, no en la celda
        { campo: 'FOLIO', titulo: 'Folio', tipo: 'texto', editable: 'panel', fijada: true },
        { campo: 'PLACA', titulo: 'Placa', tipo: 'texto' },
        { campo: 'FECHA_VERIFICACION', titulo: 'Fecha verificación', tipo: 'fecha', editable: true },
        { campo: 'FECHA_PROXIMA', titulo: 'Próxima verificación', tipo: 'fecha', editable: true },
        { campo: 'DIAS_RESTANTES', titulo: 'Días para vencer', tipo: 'numero' },
        { campo: 'ESTADO', titulo: 'Estado', tipo: 'lista', render: (v) => badgeEstado(v) },
        { campo: 'REGISTRADO_POR', titulo: 'Registrado por', tipo: 'lista' },
        { campo: 'FECHA_REGISTRO', titulo: 'Fecha registro', tipo: 'fecha' },
        {
          // En el panel de detalle se muestra la imagen completa (contenidoExtra), no el botón
          campo: 'COMPROBANTE', titulo: 'Comprobante', filtrable: false, ordenable: false, enDetalle: false,
          render: (ruta) => (ruta
            ? `<button type="button" class="secondary btn-ver-comprobante" data-ruta="${escaparHtml(ruta)}" style="padding:4px 8px">🖼️ Ver</button>`
            : '—'),
        },
      ],
      // Casillas de selección solo si hay algo que hacer con ellas (hoy: eliminar)
      seleccionable: esAdmin,
      alEditar: puedeEditar ? async (fila, campo, valor) => {
        const actualizada = await callServer('apiActualizarCampoVerificacion', state.token, fila.ID, campo, valor);
        // Recalcular estados de todos (cambiar una fecha o folio puede mover cuál es la "última")
        verificaciones = conDerivados(verificaciones.map((v) => (v.ID === fila.ID ? actualizada : v)));
        tabla.setDatos(verificaciones);
        pintarStats();
        pintarHistorial();
      } : null,
      alEliminar: esAdmin ? async (filas) => {
        await callServer('apiEliminarVerificaciones', state.token, filas.map((f) => f.ID));
        const ids = new Set(filas.map((f) => f.ID));
        verificaciones = conDerivados(verificaciones.filter((v) => !ids.has(v.ID)));
        tabla.setDatos(verificaciones);
        pintarStats();
        pintarHistorial();
      } : null,
    });

    document.getElementById('ver-tabla').addEventListener('click', (ev) => {
      const btn = ev.target.closest('.btn-ver-comprobante');
      if (btn) abrirComprobanteVerificacion(btn.dataset.ruta);
    });

    function formatearFecha(valor) {
      if (!valor) return '—';
      const f = new Date(valor);
      return isNaN(f) ? '—' : f.toLocaleDateString('es-MX');
    }

    /** Panel de detalle: imagen del comprobante (llega en base64; un link de Drive no se puede incrustar) */
    async function mostrarComprobanteEnPanel(v, contenedor) {
      if (!v.COMPROBANTE) {
        contenedor.innerHTML = '<p class="empty-state">Este registro no tiene comprobante.</p>';
        return;
      }
      contenedor.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Comprobante</div>' +
        '<span class="dt-skel" style="height:180px; width:100%; border-radius:10px"></span>';
      try {
        const vista = await callServer('apiPrevisualizarComprobanteVerificacion', state.token, v.COMPROBANTE);
        if (!document.body.contains(contenedor)) return;   // el panel se cerró mientras cargaba
        contenedor.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Comprobante</div>' +
          (vista.base64
            ? `<img src="data:${escaparHtml(vista.mimeType)};base64,${vista.base64}" alt="Comprobante de verificación del folio ${escaparHtml(v.FOLIO)}" style="width:100%; border-radius:10px; border:1px solid var(--color-border)" />`
            : '<p class="page-subtitle">La imagen es muy grande para mostrarla aquí.</p>') +
          `<p style="margin:8px 0 0"><a href="${escaparHtml(vista.url)}" target="_blank" rel="noopener">Abrir en Drive ↗</a></p>`;
      } catch (err) {
        if (document.body.contains(contenedor)) {
          contenedor.innerHTML = `<p class="error-msg">⚠️ ${escaparHtml(err.message)}</p>`;
        }
      }
    }

    // ----- Pestaña 3: historial por tarjetas -----

    function pintarHistorial() {
      const lista = document.getElementById('ver-lista');
      const texto = document.getElementById('ver-buscar').value.trim().toUpperCase();
      const filtradas = verificaciones
        .filter((v) => !texto || String(v.FOLIO).toUpperCase().includes(texto) || String(v.PLACA).toUpperCase().includes(texto))
        .slice()
        .sort((a, b) => (b.FECHA_REGISTRO || '').localeCompare(a.FECHA_REGISTRO || ''))
        .slice(0, 100);

      document.getElementById('ver-vacio').hidden = filtradas.length > 0;
      lista.innerHTML = filtradas.map((v) => `
        <div class="incidencia-item">
          <div class="incidencia-icon">📋</div>
          <div class="incidencia-main">
            <div class="incidencia-folio">${escaparHtml(v.FOLIO)}${v.PLACA ? ' · ' + escaparHtml(v.PLACA) : ''}</div>
            <div class="incidencia-meta">
              Verificó: ${formatearFecha(v.FECHA_VERIFICACION)} · Próxima: ${formatearFecha(v.FECHA_PROXIMA)}
              · Registró: ${escaparHtml(v.REGISTRADO_POR || '—')}
            </div>
          </div>
          <div class="incidencia-fecha">${formatearFecha(v.FECHA_REGISTRO)}</div>
          ${BADGE_ESTADO[v.ESTADO] ? badgeEstado(v.ESTADO) : ''}
          <div class="incidencia-actions">
            ${v.COMPROBANTE ? `<button type="button" class="secondary btn-ver-comprobante" data-ruta="${escaparHtml(v.COMPROBANTE)}" title="Ver comprobante">🖼️</button>` : ''}
          </div>
        </div>`).join('');
    }

    document.getElementById('ver-buscar').addEventListener('input', pintarHistorial);
    document.getElementById('ver-lista').addEventListener('click', (ev) => {
      const btn = ev.target.closest('.btn-ver-comprobante');
      if (btn) abrirComprobanteVerificacion(btn.dataset.ruta);
    });

    // ----- Carga -----
    async function cargar() {
      tabla.setCargando(true);   // primera vez: filas grises; al refrescar: barra arriba sin borrar lo que se ve
      try {
        verificaciones = conDerivados((await callServer('apiListarVerificaciones', state.token)) || []);
      } catch (err) {
        tabla.setError('No se pudieron cargar las verificaciones: ' + err.message);
        document.getElementById('ver-vacio').textContent = 'No se pudieron cargar las verificaciones.';
        document.getElementById('ver-vacio').hidden = false;
        return;
      }
      document.getElementById('ver-vacio').textContent = 'No hay verificaciones que coincidan.';
      tabla.setDatos(verificaciones);
      pintarStats();
      pintarHistorial();
    }

    // Solo lectura: sin pestaña de captura (se quita el botón; Tabs deja oculto su panel,
    // y el servidor rechaza el registro de todos modos)
    if (!puedeEditar) document.querySelector('#ver-tabs .tab-btn[data-tab="nuevo"]').remove();

    const tabs = Tabs.iniciar(document.getElementById('ver-tabs'), {
      inicial: 'registros',
      alCambiar: (nombre) => { if (nombre === 'registros') requestAnimationFrame(tabla.ajustarAlto); },
    });

    // ----- KPIs: clic = filtrar la tabla por estado -----
    function marcarKpiActivo(filtros) {
      const valores = filtros.ESTADO && filtros.ESTADO.valores;
      const soloUno = valores && valores.length === 1 ? valores[0] : null;
      Object.keys(KPI_ESTADO).forEach((id) => {
        document.getElementById(id).classList.toggle('activo', KPI_ESTADO[id] === soloUno);
      });
    }
    Object.keys(KPI_ESTADO).forEach((id) => {
      document.getElementById(id).addEventListener('click', (ev) => {
        const yaActivo = ev.currentTarget.classList.contains('activo');
        tabs.mostrar('registros');
        tabla.setFiltro('ESTADO', yaActivo ? null : { valores: [KPI_ESTADO[id]] });
      });
    });
    document.getElementById('ver-kpi-total').addEventListener('click', () => {
      tabs.mostrar('registros');
      tabla.limpiarFiltros();
    });

    // ----- Pestaña 2: nuevo registro -----
    const errorBox = document.getElementById('ver-error');
    const inputArchivo = document.getElementById('ver-comprobante');
    const preview = document.getElementById('ver-preview');
    document.getElementById('ver-fecha').value = hoyLocal();

    const vehiculosPorFolio = {};
    callServer('apiListarVehiculosBasico', state.token).then((vehiculos) => {
      document.getElementById('ver-lista-folios').innerHTML = (vehiculos || []).map((v) => {
        vehiculosPorFolio[v.FOLIO] = v;
        const etiqueta = [v.PLACA, v.MARCA, v.LINEA_VEHICULO].filter(Boolean).join(' · ');
        return `<option value="${escaparHtml(v.FOLIO)}">${escaparHtml(etiqueta)}</option>`;
      }).join('');
    }).catch((err) => {
      errorBox.textContent = 'No se pudo cargar el catálogo de vehículos: ' + err.message;
      errorBox.hidden = false;
    });

    document.getElementById('ver-folio').addEventListener('input', (ev) => {
      const vehiculo = vehiculosPorFolio[ev.target.value.trim()];
      document.getElementById('ver-placa').value = vehiculo ? vehiculo.PLACA : '';
    });

    inputArchivo.addEventListener('change', () => {
      const archivo = inputArchivo.files[0];
      if (!archivo) { preview.hidden = true; return; }
      preview.src = URL.createObjectURL(archivo);
      preview.hidden = false;
    });

    document.getElementById('form-verificacion').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      errorBox.hidden = true;
      const boton = document.getElementById('ver-btn-guardar');
      const archivo = inputArchivo.files[0];
      try {
        if (!archivo) throw new Error('Adjunta el comprobante de verificación');
        if (archivo.size > MAX_BYTES) throw new Error('La imagen pesa más de 10 MB');
        boton.disabled = true;
        boton.textContent = 'Guardando…';

        const folio = document.getElementById('ver-folio').value.trim();
        await callServer('apiRegistrarVerificacion', state.token, {
          FOLIO: folio,
          FECHA_VERIFICACION: document.getElementById('ver-fecha').value,
          FECHA_PROXIMA: document.getElementById('ver-fecha-proxima').value,
        }, {
          base64: await leerArchivoBase64(archivo),
          mimeType: archivo.type,
        });

        ev.target.reset();
        preview.hidden = true;
        document.getElementById('ver-fecha').value = hoyLocal();
        Notificar.exito('Verificación del folio ' + folio + ' registrada');
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        boton.disabled = false;
        boton.textContent = '💾 Registrar verificación';
      }
    });

    await cargar();
  }

  document.getElementById('btn-logout').addEventListener('click', cerrarSesion);
  document.querySelectorAll('#sidebar .nav-item[data-view]').forEach((el) => {
    el.addEventListener('click', () => navegarA(el.dataset.view));
  });

  renderNavGrupos();
  render();
</script>
