  /** Convierte un File del navegador a base64 puro (sin el prefijo data:...;base64,). */
  function leerArchivoBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = () => reject(new Error('No se pudo leer el archivo ' + file.name));
      reader.readAsDataURL(file);
    });
  }

  /**
   * Sube (si el usuario eligió) los archivos de los campos tipo "file" del
   * formulario y regresa {columna real: url}. Los campos sin archivo nuevo
   * seleccionado simplemente no aparecen en el resultado — así crear()/
   * actualizar() no les tocan el valor que ya tenían.
   */
  async function subirArchivosVehiculo(prefijo) {
    const resultado = {};
    const camposArchivo = CAMPOS_VEHICULO.filter((c) => c.tipo === 'file');
    for (const campo of camposArchivo) {
      const input = document.getElementById(prefijo + '-' + slugCampo(campo.clave));
      const file = input && input.files && input.files[0];
      if (!file) continue;
      const base64 = await leerArchivoBase64(file);
      const subido = await callServer('apiSubirArchivoVehiculo', state.token, file.name, file.type, base64);
      resultado[campo.clave] = subido.url;
      // No es una columna real: solo viaja para que el servidor pueda renombrar el
      // archivo a "<ID>_<ETIQUETA>_<fecha>" una vez que sabe el ID real del vehículo.
      resultado[campo.clave + '_FILE_ID'] = subido.id;
    }
    return resultado;
  }

  async function initIncidencias() {
    wireTabsSimple(document.getElementById('view-container'));
    // Permisos del módulo (el servidor los vuelve a revisar en cada llamada)
    const puedeEditar = puedeEditarModulo('incidencias');
    if (!puedeEditar) document.querySelector('#inc-tabs .tab-btn[data-tab="registrar"]').remove();
    const modal = document.getElementById('modal-cerrar');
    const modalEditar = document.getElementById('modal-editar');

    // Registrar = los del ingreso; Editar = todos; Cerrar = los del cierre (soloEdicion).
    // Nucco solo sirve para buscar el vehículo (FolioNucco, más abajo): lo que se guarda es FOLIO.
    const CAMPOS_INCIDENCIA = [
      { clave: 'NUCCO', etiqueta: 'Nucco', tipo: 'select', catalogo: true, noSeGuarda: true, placeholder: 'Otra forma de buscar el vehículo…' },
      { clave: 'FOLIO', etiqueta: 'Folio del vehículo', tipo: 'select', catalogo: true, requeridoAlCrear: true },
      { clave: 'DEPARTAMENTO', etiqueta: 'Departamento', tipo: 'text' },
      { clave: 'MODELO', etiqueta: 'Modelo', tipo: 'text' },
      { clave: 'ANIO', etiqueta: 'Año', tipo: 'number' },
      { clave: 'FECHA_REGISTRO', etiqueta: 'Fecha de registro', tipo: 'text', soloLectura: true, soloAlta: true },
      { clave: 'FECHA_INSPECCION', etiqueta: 'Fecha de inspección', tipo: 'date' },
      { clave: 'KILOMETRAJE', etiqueta: 'Kilometraje', tipo: 'number' },
      { clave: 'TICKET', etiqueta: 'Ticket', tipo: 'text' },
      { clave: 'PERIODO_VERIFICACION', etiqueta: 'Periodo de verificación', tipo: 'text', placeholder: 'Ej. 2do semestre 2026' },
      { clave: 'SEGURO_AUTO', etiqueta: 'Seguro de auto', tipo: 'text', placeholder: 'Ej. Póliza vigente' },
      { clave: 'INSPECCION_INGRESO', etiqueta: 'Inspección de ingreso (motivo)', tipo: 'text', renglonCompleto: true, placeholder: 'Ej. Cambio de batería' },
      { clave: 'DESCRIPCION_TRABAJO', etiqueta: 'Trabajo realizado', tipo: 'text', soloEdicion: true, renglonCompleto: true, placeholder: 'Ej. Cambio de batería' },
      { clave: 'FECHA_TRABAJO', etiqueta: 'Fecha del trabajo realizado', tipo: 'date', soloEdicion: true },
      { clave: 'MECANICO', etiqueta: 'Mecánico', tipo: 'text', soloEdicion: true, placeholder: 'Nombre del mecánico' },
      { clave: 'INSPECCION_SALIDA', etiqueta: 'Inspección de salida', tipo: 'text', soloEdicion: true, renglonCompleto: true, placeholder: 'Ej. Reemplazo realizado' },
    ];
    // Al cerrar, el trabajo realizado es obligatorio (al editar no: puede seguir abierta)
    const CAMPOS_CIERRE_INCIDENCIA = CAMPOS_INCIDENCIA.filter((c) => c.soloEdicion)
      .map((c) => (c.clave === 'DESCRIPCION_TRABAJO' ? Object.assign({}, c, { requerido: true }) : c));
    document.getElementById('campos-form-incidencia').innerHTML = CamposHoja.html(CAMPOS_INCIDENCIA, { prefijo: 'inc' });
    document.getElementById('campos-form-editar-incidencia').innerHTML = CamposHoja.html(CAMPOS_INCIDENCIA, { prefijo: 'editar', esEdicion: true });
    document.getElementById('campos-form-cerrar-incidencia').innerHTML = CamposHoja.html(CAMPOS_CIERRE_INCIDENCIA, { prefijo: 'cerrar', esEdicion: true });

    // Fecha de registro: siempre hoy, no editable (el servidor la fuerza igual).
    fijarFechaRegistroHoy();
    document.getElementById('inc-fecha-inspeccion').value = hoyISO();

    // Autollenado: el folio del vehículo trae Departamento/Modelo desde Vehículos.
    // OJO: esto NO se espera aquí (sin await) para que salga en paralelo con la
    // carga del historial (cargar(), al final de esta función) en vez de una
    // petición tras otra — cada una puede tardar un rato y sumadas se sentía
    // muy lento.
    // vehiculosPorFolio: una entrada por FOLIO y otra por NUCO (apiListarVehiculosBasico
    // lo manda como "NUCO", sin doble C -- ver VehiculosService.listarBasico), las dos
    // apuntando al mismo vehículo -- así se puede resolver el vehículo con cualquiera de
    // los dos. Folio y Nucco son campos INDEPENDIENTES (uno no se mete dentro del otro):
    // escribir en uno resuelve el vehículo y pone el valor correspondiente en el otro (ver
    // componente FolioNucco). Lo que de verdad se guarda es FOLIO.
    const vehiculosPorFolio = {};
    const promesaVehiculos = callServerCacheado('apiListarVehiculosBasico', state.token)
      .then((vehiculos) => {
        // Si mientras tanto se navegó a otra vista, el router ya destruyó este
        // DOM (montarVista hace container.innerHTML = '') — escribir aquí
        // tronaría con "Cannot set properties of null".
        if (!document.body.contains(modal)) return;
        FolioNucco.indexar(vehiculos, vehiculosPorFolio);
        const opcionesFolio = vehiculos
          .map((v) => `<option value="${escaparHtml(v.FOLIO)}">${escaparHtml([v.MARCA, v.LINEA_VEHICULO].filter(Boolean).join(' '))}</option>`)
          .join('');
        const opcionesNucco = FolioNucco.opcionesNucco(vehiculos, true);
        ['inc', 'editar'].forEach((prefijo) => {
          document.getElementById(prefijo + '-folio-lista').innerHTML = opcionesFolio;
          document.getElementById(prefijo + '-nucco-lista').innerHTML = opcionesNucco;
        });
      })
      .catch((err) => {
        // Antes esto se ignoraba en silencio — ahora se ve para poder diagnosticar.
        console.error('No se pudo cargar el catálogo de vehículos:', err);
        if (!document.body.contains(modal)) return;
        const errorBox = document.getElementById('inc-error');
        errorBox.textContent = 'No se pudo cargar el catálogo de vehículos para autocompletar: ' + err.message;
        errorBox.hidden = false;
      });

    /** Al resolver el vehículo (por Folio o Nucco, componente FolioNucco) se sugieren
     *  Departamento/Modelo/Año con la etiqueta "auto"; se pueden corregir. Sin vehículo no
     *  se borra lo escrito, solo deja de decir "auto". */
    function autollenarIncidencia_(prefijo, vehiculo) {
      ['departamento', 'modelo', 'anio'].forEach((c) => {
        const el = document.getElementById(prefijo + '-' + c);
        if (!vehiculo) { CampoAuto.quitar(el); return; }
        CampoAuto.llenar(el, {
          departamento: vehiculo.DEPARTAMENTO,
          modelo: [vehiculo.MARCA, vehiculo.LINEA_VEHICULO].filter(Boolean).join(' '),
          anio: vehiculo.MODELO,
        }[c]);
      });
    }
    const buscarVehiculoInc_ = (texto) => vehiculosPorFolio[texto];
    FolioNucco.ligar('inc-folio', 'inc-nucco', { buscar: buscarVehiculoInc_, alResolver: (v) => autollenarIncidencia_('inc', v) });

    function abrirModalCierre(id, folio) {
      document.getElementById('cerrar-id').value = id;
      document.getElementById('cerrar-folio').textContent = 'Folio: ' + folio;
      document.getElementById('cerrar-fecha-trabajo').value = hoyISO();
      modal.hidden = false;
    }
    function cerrarModal() {
      modal.hidden = true;
      document.getElementById('form-cerrar-incidencia').reset();
      document.getElementById('cerrar-error').hidden = true;
    }

    // Mismo autollenado, pero para el folio/nucco dentro del modal de Editar.
    FolioNucco.ligar('editar-folio', 'editar-nucco', { buscar: buscarVehiculoInc_, alResolver: (v) => autollenarIncidencia_('editar', v) });

    /** Abre el modal general de edición con lo que ya trae la fila (el resumen
     *  ya incluye todos los campos, no hace falta pedir el registro completo). */
    function abrirModalEditar(inc) {
      if (!inc) return;
      document.getElementById('editar-id').value = inc.ID;
      document.getElementById('editar-folio-label').textContent = 'Folio: ' + inc.FOLIO;
      CamposHoja.poblar(CAMPOS_INCIDENCIA, 'editar', inc);
      document.getElementById('editar-nucco').value = (vehiculosPorFolio[inc.FOLIO] || {}).NUCO || '';
      // Lo que se abre es lo guardado, no una sugerencia: sin "auto" de la edición anterior
      ['folio', 'nucco', 'departamento', 'modelo', 'anio'].forEach((c) => CampoAuto.quitar('editar-' + c));
      document.getElementById('editar-error').hidden = true;
      modalEditar.hidden = false;
    }
    function cerrarModalEditar() {
      modalEditar.hidden = true;
      document.getElementById('form-editar-incidencia').reset();
      document.getElementById('editar-error').hidden = true;
    }
    document.getElementById('btn-cancelar-editar').addEventListener('click', cerrarModalEditar);
    modalEditar.addEventListener('click', (ev) => { if (ev.target === modalEditar) cerrarModalEditar(); });

    document.getElementById('form-editar-incidencia').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('editar-error');
      errorBox.hidden = true;
      const btn = ev.target.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando…';
      toastCargando('Guardando cambios…');
      try {
        await callServer('apiActualizarIncidencia', state.token, document.getElementById('editar-id').value,
          CamposHoja.recolectar(CAMPOS_INCIDENCIA, 'editar'));
        cerrarModalEditar();
        invalidarCacheLista('apiListarIncidencias', state.token);
        await cargar();
        toastExito('Actualizado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo actualizar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    /** Sección "Vehículo" dentro del panel de detalle nativo de DataTable — los
     *  datos de la incidencia ya los pinta el panel solo (vienen de `columnas`);
     *  esto solo agrega, abajo, lo que trae el catálogo de Vehículos. */
    async function mostrarVehiculoEnPanel(inc, contenedor) {
      const titulo = '<div class="dt-campo-titulo" style="margin:14px 0 6px">Vehículo</div>';
      contenedor.innerHTML = titulo + '<div class="loading-inline"><span class="spinner"></span> Buscando en el catálogo de vehículos…</div>';
      try {
        const vehiculo = await callServer('apiBuscarVehiculoPorFolio', state.token, inc.FOLIO);
        if (!vehiculo) {
          contenedor.innerHTML = titulo + '<p class="empty-state">No se encontró este folio en el catálogo de Vehículos.</p>';
          return;
        }
        contenedor.innerHTML = titulo + Object.keys(vehiculo)
          .filter((clave) => vehiculo[clave] !== '' && vehiculo[clave] !== null && vehiculo[clave] !== undefined)
          .map((clave) => itemInfo(tituloDesdeClave(clave), vehiculo[clave]))
          .join('');
      } catch (err) {
        contenedor.innerHTML = titulo + '<p class="error-msg">No se pudo cargar el vehículo: ' + escaparHtml(err.message) + '</p>';
      }
    }

    function badgeEstadoIncidencia(estado) {
      const abierta = estado === 'ABIERTA';
      return `<span class="badge-estado ${abierta ? 'abierta' : 'cerrada'}"><i data-lucide="${abierta ? 'lock-open' : 'circle-check'}" class="ico"></i> ${abierta ? 'Abierta' : 'Cerrada'}</span>`;
    }

    let todasLasIncidencias = [];

    const tabla = DataTable.crear(document.getElementById('inc-tabla'), {
      idCampo: 'ID',
      idTabla: 'incidencias',
      ordenInicial: { campo: 'FECHA_REGISTRO', dir: 'desc' },
      textoVacio: 'Todavía no hay incidencias registradas',
      exportar: {
        nombreArchivo: 'Incidencias',
        titulo: 'Descarga la base completa: todas las filas y columnas de la hoja, sin importar filtros ni búsqueda',
        descargar: async () => ExportarExcel.descargarCrudo({ nombreArchivo: 'Incidencias', filas: JSON.parse(await callServer('apiIncidenciasCompleto', state.token)) }),
      },
      etiquetaFila: (inc) => inc.FOLIO,
      alCambiarFiltros: (filtros) => marcarKpiActivo(filtros),
      detalle: {
        titulo: (inc) => 'Folio: ' + (inc.FOLIO || ''),
        contenidoExtra: (inc, contenedor) => mostrarVehiculoEnPanel(inc, contenedor),
      },
      // Selección estilo Google Drive/Apple (rama emmanuel, ver componentes/datatable.html):
      // clic = selecciona, doble clic/tocar = abre el panel de detalle (tabla.abrirDetalle
      // se resuelve en el momento del clic, para entonces `tabla` ya está asignada).
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (inc) => tabla.abrirDetalle(String(inc.ID)),
      alTocarFila: (inc) => tabla.abrirDetalle(String(inc.ID)),
      columnas: [
        { campo: 'FOLIO', titulo: 'Folio', tipo: 'texto', fijada: true },
        { campo: 'DEPARTAMENTO', titulo: 'Departamento', tipo: 'lista' },
        { campo: 'INSPECCION_INGRESO', titulo: 'Motivo', tipo: 'texto' },
        { campo: 'FECHA_REGISTRO', titulo: 'Fecha', tipo: 'fecha' },
        { campo: 'ESTADO', titulo: 'Estado', tipo: 'lista', render: (v) => badgeEstadoIncidencia(v) },
        { campo: 'MODELO', titulo: 'Modelo', tipo: 'texto', visible: false },
        { campo: 'ANIO', titulo: 'Año', tipo: 'numero', visible: false },
        { campo: 'FECHA_INSPECCION', titulo: 'Fecha de inspección', tipo: 'fecha', visible: false },
        { campo: 'KILOMETRAJE', titulo: 'Kilometraje', tipo: 'numero', visible: false },
        { campo: 'TICKET', titulo: 'Ticket', tipo: 'texto', visible: false },
        { campo: 'PERIODO_VERIFICACION', titulo: 'Periodo de verificación', tipo: 'texto', visible: false },
        { campo: 'SEGURO_AUTO', titulo: 'Seguro de auto', tipo: 'texto', visible: false },
        { campo: 'DESCRIPCION_TRABAJO', titulo: 'Trabajo realizado', tipo: 'texto', visible: false },
        { campo: 'FECHA_TRABAJO', titulo: 'Fecha del trabajo realizado', tipo: 'fecha', visible: false },
        { campo: 'INSPECCION_SALIDA', titulo: 'Inspección de salida', tipo: 'texto', visible: false },
        { campo: 'MECANICO', titulo: 'Mecánico', tipo: 'texto', visible: false },
      ],
      accionesFila: [{ icono: 'car', titulo: 'Ver vehículo', alHacer: (inc) => verFichaVehiculoDesdeOtroModulo(inc.FOLIO) }].concat(puedeEditar ? [
        {
          icono: 'lock-open', titulo: 'Cerrar incidencia',
          visible: (inc) => inc.ESTADO === 'ABIERTA',
          alHacer: (inc) => abrirModalCierre(inc.ID, inc.FOLIO),
        },
        { icono: 'pencil', titulo: 'Editar', alHacer: (inc) => abrirModalEditar(inc) },
      ] : []),
      seleccionable: true,
      alEliminar: puedeEditar ? async (filas) => {
        await Promise.all(filas.map((f) => callServer('apiEliminarIncidencia', state.token, f.ID)));
        invalidarCacheLista('apiListarIncidencias', state.token);
      } : null,
      motivoSinEliminar: 'Tu permiso en este módulo es de solo lectura',
    });

    // ---- Filtro rápido por Estado: misma franja de íconos de Líneas/Vehículos/Caja Chica --
    // el CSS es genérico (.filtro-tipo*, styles.html). Mismos colores que badgeEstadoIncidencia.
    const ORDEN_ESTADO_INC = ['ABIERTA', 'CERRADA'];
    const ESTILO_ESTADO_INC = {
      'ABIERTA': { icono: 'lock-open', color: 'var(--color-danger)' },
      'CERRADA': { icono: 'circle-check', color: 'var(--color-success)' },
    };
    let filtrosActualesInc = {};
    function marcarEstadoInc() {
      const cont = document.getElementById('inc-filtro-estado');
      if (!cont) return;
      const f = filtrosActualesInc.ESTADO;
      const elegidos = f && f.valores && f.valores.length ? f.valores : null;
      cont.querySelectorAll('.filtro-tipo-item').forEach((b) => {
        const activo = b.dataset.estado === '*' ? !elegidos : !!(elegidos && elegidos.indexOf(b.dataset.estado) >= 0);
        b.classList.toggle('activo', activo);
        b.setAttribute('aria-pressed', String(activo));
      });
    }
    function pintarEstadoInc(filas) {
      const cont = document.getElementById('inc-filtro-estado');
      if (!cont) return;
      const conteo = {};
      filas.forEach((i) => { const e = String(i.ESTADO || '').toUpperCase(); conteo[e] = (conteo[e] || 0) + 1; });
      const estados = ORDEN_ESTADO_INC.concat(Object.keys(conteo).filter((e) => ORDEN_ESTADO_INC.indexOf(e) < 0 && e));
      const fila = (valor, icono, color, nombre, n) =>
        '<button type="button" class="filtro-tipo-item' + (n ? '' : ' filtro-tipo-item-vacio') + '" data-estado="' + escaparHtml(valor) + '" aria-pressed="false" title="' + escaparHtml(nombre + ' · ' + n) + '">' +
          '<span class="filtro-tipo-ico" style="color:' + color + '">' + Iconos.svg(icono) + '</span>' +
          '<span class="filtro-tipo-nombre">' + escaparHtml(nombre) + '</span><span class="filtro-tipo-num">' + n + '</span></button>';
      cont.innerHTML = '<div class="filtro-tipo-panel"><div class="filtro-tipo-titulo">Estado</div>' +
        fila('*', 'layers', 'var(--color-text-muted)', 'Todas', filas.length) +
        estados.map((e) => {
          const estilo = ESTILO_ESTADO_INC[e] || { icono: 'circle', color: 'var(--color-text-muted)' };
          return fila(e, estilo.icono, estilo.color, e, conteo[e] || 0);
        }).join('') + '</div>';
      marcarEstadoInc();
    }
    document.getElementById('inc-filtro-estado').addEventListener('click', (ev) => {
      const b = ev.target.closest('.filtro-tipo-item');
      if (!b) return;
      const e = b.dataset.estado;
      tabla.setFiltro('ESTADO', (e === '*' || b.classList.contains('activo')) ? null : { valores: [e] });
    });

    const tilesKpiIncidencias = { 'stat-total': null, 'stat-abiertas': 'ABIERTA', 'stat-cerradas': 'CERRADA' };
    Object.keys(tilesKpiIncidencias).forEach((id) => {
      const tile = document.getElementById(id).closest('.stat-tile');
      tile.classList.add('stat-tile-clickable');
      tile.addEventListener('click', () => {
        const valor = tilesKpiIncidencias[id];
        tabla.setFiltro('ESTADO', valor ? { valores: [valor] } : null);
      });
    });
    function marcarKpiActivo(filtros) {
      filtrosActualesInc = filtros || {};
      marcarEstadoInc();
      const valores = filtros.ESTADO && filtros.ESTADO.valores;
      Object.keys(tilesKpiIncidencias).forEach((id) => {
        const valor = tilesKpiIncidencias[id];
        const activo = valor ? !!(valores && valores.length === 1 && valores[0] === valor) : !valores;
        document.getElementById(id).closest('.stat-tile').classList.toggle('stat-tile-activo', activo);
      });
      actualizarKpis(tabla.getFiltradas());
    }

    function actualizarKpis(filas) {
      // Si cargar() tardó y mientras tanto se navegó a otra vista, view-container
      // ya no tiene estos elementos -- sin esto, tronaba al volver de un módulo
      // rápido (ej. Panorama) antes de que esta carga terminara.
      const total = document.getElementById('stat-total');
      if (!total) return;
      total.textContent = filas.length;
      document.getElementById('stat-abiertas').textContent = filas.filter((i) => i.ESTADO === 'ABIERTA').length;
      document.getElementById('stat-cerradas').textContent = filas.filter((i) => i.ESTADO === 'CERRADA').length;
    }

    async function cargar() {
      tabla.setCargando(true);
      try {
        // google.script.run entrega null en vez de [] cuando el servidor regresa
        // un arreglo vacío — normalizamos aquí para no tronar en .forEach/.map.
        todasLasIncidencias = (await callServerListaCacheada('apiListarIncidencias', state.token)) || [];
      } catch (err) {
        tabla.setError('No se pudo cargar el historial de incidencias: ' + err.message);
        return;
      }

      actualizarKpis(todasLasIncidencias);
      pintarEstadoInc(todasLasIncidencias);
      tabla.setDatos(todasLasIncidencias);
    }
    // Pinta al instante con lo guardado; si del servidor llega algo distinto, se vuelve a pintar (api.html)
    escucharLista('apiListarIncidencias', cargar, document.getElementById('view-container').firstElementChild);

    document.getElementById('form-incidencia').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('inc-error');
      errorBox.hidden = true;
      const btn = ev.target.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Registrando…';
      toastCargando('Registrando…');
      try {
        await callServer('apiCrearIncidencia', state.token, CamposHoja.recolectar(CAMPOS_INCIDENCIA, 'inc'));
        ev.target.reset();
        fijarFechaRegistroHoy();
        document.getElementById('inc-fecha-inspeccion').value = hoyISO();
        invalidarCacheLista('apiListarIncidencias', state.token);
        await cargar();
        toastExito('Registrado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo registrar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    document.getElementById('btn-cancelar-cierre').addEventListener('click', cerrarModal);
    modal.addEventListener('click', (ev) => { if (ev.target === modal) cerrarModal(); });

    document.getElementById('form-cerrar-incidencia').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('cerrar-error');
      errorBox.hidden = true;
      const btn = ev.target.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando…';
      toastCargando('Guardando cambios…');
      try {
        await callServer('apiCerrarIncidencia', state.token, document.getElementById('cerrar-id').value,
          CamposHoja.recolectar(CAMPOS_CIERRE_INCIDENCIA, 'cerrar'));
        cerrarModal();
        invalidarCacheLista('apiListarIncidencias', state.token);
        await cargar();
        toastExito('Actualizado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo actualizar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    await Promise.all([promesaVehiculos, cargar()]);
  }

  const AYUDA_INCIDENCIAS = [
    { pregunta: '¿Qué es una incidencia?', respuesta: 'La bitácora de taller: cuándo entró un vehículo, qué se le hizo y cuándo salió.' },

  // ---------- Ficha por pestañas (genérica: la usa cualquier módulo con una "ficha
  // única" — Vehículos, Caja Chica, ...) ----------

  /** pestanas: [{id, titulo, icono, contenido, num?}], la primera queda activa.
   *  num (si viene) se muestra como contador junto al título. */
  function fichaEnPestanas(pestanas) {
    return '<div class="tabs-simple ln-ficha-tabs" role="tablist" aria-label="Secciones de la ficha">' + pestanas.map((t, n) =>
      '<button type="button" class="tab-btn' + (n ? '' : ' active') + '" role="tab" aria-selected="' + (n ? 'false' : 'true') + '" data-ficha-tab="' + t.id + '">' +
      '<i data-lucide="' + t.icono + '" class="ico"></i> ' + t.titulo +
      (t.num === undefined ? '' : ' <span class="ln-tab-num">' + t.num + '</span>') + '</button>').join('') + '</div>' +
      pestanas.map((t, n) => '<div data-ficha-panel="' + t.id + '"' + (n ? ' hidden' : '') + '>' + t.contenido + '</div>').join('');
  }
  function mostrarPestanaFicha(contenedor, nombre) {
    // Una pestaña sin permiso no existe (deModulo): se queda en la que ya está
    if (!contenedor.querySelector('[data-ficha-tab="' + nombre + '"]')) return;
    contenedor.querySelectorAll('[data-ficha-tab]').forEach((b) => {
      const activa = b.dataset.fichaTab === nombre;
      b.classList.toggle('active', activa);
      b.setAttribute('aria-selected', String(activa));
    });
    contenedor.querySelectorAll('[data-ficha-panel]').forEach((p) => { p.hidden = p.dataset.fichaPanel !== nombre; });
  }
  /** Tabla sencilla de solo lectura (sin filtros/orden/edición) para las pestañas de una
   *  ficha que muestran lo que hay de este registro en otro módulo. */
  function tablaFicha(columnas, filas) {
    return '<div class="ficha-tabla-wrap"><table><thead><tr>' + columnas.map((c) => '<th>' + c.t + '</th>').join('') +
      '</tr></thead><tbody>' + filas.map((f) => '<tr>' + columnas.map((c) => '<td>' + c.r(f) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div>';
  }
  /** agregar: {tipo, texto} agrega un botón "+ Agregar" en la cabecera (data-agregar="tipo"). */
  function pestanaFicha(icono, titulo, columnas, filas, vacio, agregar) {
    const boton = agregar
      ? '<button type="button" class="secondary" data-agregar="' + agregar.tipo + '" style="margin-left:auto"><i data-lucide="plus" class="ico"></i> ' + agregar.texto + '</button>'
      : '';
    return '<div class="card ln-card"><h3 style="display:flex; align-items:center; gap:8px">' +
      '<i data-lucide="' + icono + '" class="ico ln-icon"></i> ' + titulo + boton + '</h3>' +
      (filas.length ? tablaFicha(columnas, filas) : '<p class="empty-state">' + vacio + '</p>') + '</div>';
  }

  /** Ver completo/Editar/Eliminar por fila en las tablas de solo lectura de una ficha
   *  (Vehículos: Verificaciones/Inspecciones/Sensor/Hologramas/Incidencias; Caja Chica:
   *  Arqueos/Cambios de monto) -- de nivel de módulo, como fichaEnPestanas/pestanaFicha/
   *  tablaFicha, porque ambas fichas la usan. */
  function accionesFichaRegistro(tipo, id, opciones) {
    const o = Object.assign({ editar: false, eliminar: false, estatus: null, copiarLiga: null, copiarLigaJefe: null }, opciones);
    let html = '<div class="ficha-acciones-fila">' +
      '<button type="button" class="ficha-btn-fila" data-ficha-ver="' + tipo + '" data-id="' + escaparHtml(id) + '" title="Ver completo">' + Iconos.svg('ver') + '</button>';
    if (o.editar) {
      html += '<button type="button" class="ficha-btn-fila" data-ficha-editar="' + tipo + '" data-id="' + escaparHtml(id) + '" title="Editar">' + Iconos.svg('editar') + '</button>';
    }
    // estatus: ACTIVO/BAJA de un registro que no se edita pero sí se puede dar de baja/reactivar
    // con un clic (sin abrir ningún formulario) -- ver cambiarEstatusFicha.
    if (o.estatus) {
      const activo = String(o.estatus).toUpperCase() === 'ACTIVO';
      const destino = activo ? 'BAJA' : 'ACTIVO';
      html += '<button type="button" class="ficha-btn-fila' + (activo ? ' ficha-peligro' : '') + '" data-ficha-estatus="' + tipo + '" data-id="' + escaparHtml(id) + '" data-estatus-destino="' + destino + '" title="' + (activo ? 'Dar de baja' : 'Reactivar') + '">' + Iconos.svg(activo ? 'darDeBaja' : 'reactivar') + '</button>';
    }
    // copiarLiga/copiarLigaJefe: el token (no un booleano) de una liga PENDIENTE -- cada una
    // independiente (responsable/adherente y jefe tienen cada quien la suya, ver el comentario
    // de ResponsivaVehicularService.gs); null/vacío donde ya se firmó, donde el botón ni se
    // pinta. La liga se pide siempre al servidor (apiFirmaRemotaLiga) al hacer clic, nunca se
    // arma en el navegador -- ver el wireup más abajo y el comentario de ligaDeToken.
    if (o.copiarLiga) {
      html += '<button type="button" class="ficha-btn-fila" data-ficha-copiar-liga="' + tipo + '" data-id="' + escaparHtml(id) + '" data-token="' + escaparHtml(o.copiarLiga) + '" title="Copiar liga del responsable/adherente">' + Iconos.svg('copiar') + '</button>';
    }
    if (o.copiarLigaJefe) {
      html += '<button type="button" class="ficha-btn-fila" data-ficha-copiar-liga-jefe="' + tipo + '" data-id="' + escaparHtml(id) + '" data-token="' + escaparHtml(o.copiarLigaJefe) + '" title="Copiar liga del jefe directo">' + Iconos.svg('copiar') + '</button>';
    }
    if (o.eliminar) {
      html += '<button type="button" class="ficha-btn-fila ficha-peligro" data-ficha-eliminar="' + tipo + '" data-id="' + escaparHtml(id) + '" title="Eliminar">' + Iconos.svg('eliminar') + '</button>';
    }
    return html + '</div>';
  }

  /** Mismo patrón que copiarEnlace_ en app-sistemas.html: la API moderna primero, y si el
   *  marco de Apps Script la bloquea, el truco clásico del textarea oculto + execCommand. */
  async function copiarTexto_(texto) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(texto); return true; }
    } catch (e) { /* cae al método clásico */ }
    const area = document.createElement('textarea');
    area.value = texto;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(area);
    area.select();
    let copiado = false;
    try { copiado = document.execCommand('copy'); } catch (e) { /* no-op */ }
    area.remove();
    return copiado;
  }

  /** Modal chico con la(s) liga(s) de firma a distancia y un botón para copiar cada una -- se
   *  usa tanto al generarlas (abrirAgregarResponsivaVehicular/AdherenteVehicular, que puede
   *  generar una o dos de un jalón si ni el responsable/adherente ni el jefe estaban
   *  presentes) como al "Copiar liga de nuevo" desde la pestaña (data-ficha-copiar-liga/
   *  -jefe), que siempre manda una sola. Mismo patrón que Confirmar.pedir (.modal-backdrop,
   *  Esc, clic fuera) pero sin promesa -- no hay nada que confirmar.
   *
   *  @param {string|Array<{titulo?:string, liga:string}>} ligas  una liga, o varias con su
   *    etiqueta (p. ej. [{titulo:'Responsable', liga:a}, {titulo:'Jefe directo', liga:b}]).
   */
  function mostrarLigaFirma_(ligas) {
    const lista = Array.isArray(ligas) ? ligas : [{ titulo: null, liga: ligas }];
    const fondo = document.createElement('div');
    fondo.className = 'modal-backdrop';
    const campos = lista.map((item, i) =>
      (item.titulo ? '<label style="margin-top:' + (i ? '12px' : '0') + '">' + escaparHtml(item.titulo) + '</label>' : '') +
      '<div style="display:flex;gap:8px;margin-top:' + (item.titulo ? '6px' : (i ? '12px' : '0')) + '">' +
        '<input type="text" readonly value="' + escaparHtml(item.liga) + '" id="liga-firma-' + i + '" ' +
          'style="flex:1;min-width:0;padding:9px 10px;border:1px solid var(--color-border);border-radius:8px;background:var(--color-bg);color:var(--color-text);font-size:13px">' +
        '<button type="button" class="secondary" data-copiar="liga-firma-' + i + '" title="Copiar liga"><i data-lucide="copy" class="ico"></i></button>' +
      '</div>'
    ).join('');
    fondo.innerHTML =
      '<div class="modal-card">' +
        '<h3><i data-lucide="link" class="ico"></i> Liga' + (lista.length > 1 ? 's' : '') + ' para firmar a distancia</h3>' +
        '<p style="margin:4px 0 14px;color:var(--color-text-muted);font-size:13px">' +
          'Mánda' + (lista.length > 1 ? 'selas' : 'sela') + ' a la persona (WhatsApp, correo…) para que la abra y firme desde su celular.</p>' +
        campos +
        '<div class="form-acciones" style="margin-top:14px">' +
          '<button type="button" class="secondary" data-accion="cerrar">Cerrar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(fondo);
    refreshIcons();

    const focoPrevio = document.activeElement;
    const terminar = () => {
      document.removeEventListener('keydown', alTecla, true);
      fondo.remove();
      if (focoPrevio && focoPrevio.focus) focoPrevio.focus();
    };
    const alTecla = (ev) => { if (ev.key === 'Escape') { ev.stopPropagation(); terminar(); } };
    fondo.querySelector('[data-accion="cerrar"]').addEventListener('click', terminar);
    fondo.addEventListener('mousedown', (ev) => { if (ev.target === fondo) terminar(); });
    document.addEventListener('keydown', alTecla, true);
    fondo.querySelectorAll('[data-copiar]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const ok = await copiarTexto_(document.getElementById(btn.dataset.copiar).value);
        if (ok) Notificar.exito('Liga copiada'); else Notificar.error('El navegador no permitió copiar la liga');
      });
    });
  }

  // ---------- Vehículos ----------
  async function initVehiculos() {
    wireTabsSimple(document.getElementById('view-container'));
    // Permisos del módulo (el servidor los vuelve a revisar en cada llamada)
    const puedeEditar = puedeEditarModulo('vehiculos');
    if (!puedeEditar) document.querySelector('#veh-tabs .tab-btn[data-tab="registrar"]').remove();
    const modalEditar = document.getElementById('modal-editar-vehiculo');
    let vehiculosPorId = {};
    let todosLosVehiculos = [];
    /** La ficha abierta: si su copia guardada llega distinta del servidor, se vuelve a pintar */
    let fichaVehiculoAbierta = null;

    document.getElementById('campos-form-vehiculo').innerHTML = renderCamposVehiculo('veh');
    document.getElementById('campos-form-editar-vehiculo').innerHTML = renderCamposVehiculo('editar-vehiculo', true, 2);
    const pasosAltaVeh = wirePasosVehiculo(document.getElementById('campos-form-vehiculo'), {
      atras: 'veh-paso-atras', siguiente: 'veh-paso-siguiente', guardar: 'btn-guardar-vehiculo', cuenta: 'veh-paso-cuenta',
    });
    const pasosEditarVeh = wirePasosVehiculo(document.getElementById('campos-form-editar-vehiculo'), {
      atras: 'editar-vehiculo-paso-atras', siguiente: 'editar-vehiculo-paso-siguiente', guardar: 'btn-guardar-editar-vehiculo', cuenta: 'editar-vehiculo-paso-cuenta',
    });

    // Fecha de registro en el sistema: siempre "hoy", no se edita (el
    // servidor fija el valor real al crear, esto es solo para que se vea
    // algo ahí — igual que FECHA DE REGISTRO en Tickets). Solo en
    // Registrar: en Editar la pisa poblarFormularioVehiculo con la fecha
    // real ya guardada.
    document.getElementById('veh-fecha-registro-sistema-ci').value = hoyISO();

    // Marca / Departamento / Sede / Razón social: catálogos planos (hoja
    // "LISTAS VEHICULOS"), mismas opciones en Registrar y Editar. Estos ya
    // son <input list="..."> (campo.catalogo: true) — se puede escribir una
    // opción nueva que todavía no esté en la lista.
    function llenarSelect(id, valores) { CamposHoja.llenarOpciones(id, valores); }

    // El filtrado de Ubicación según Sede (mapaUbicacionesPorSede,
    // llenarUbicacionesSegunSede) vive a nivel de módulo, junto a
    // poblarFormularioVehiculo — ver comentario ahí.
    ['veh-sede', 'editar-vehiculo-sede'].forEach((id) => {
      // 'input' (no solo 'change'): Sede ahora es un <input list="..."> —
      // 'input' dispara al escribir Y al elegir una sugerencia del
      // datalist, así Ubicación se actualiza al momento en ambos casos.
      document.getElementById(id).addEventListener('input', () => {
        llenarUbicacionesSegunSede(id.replace('-sede', ''));
      });
    });

    // En su propia función (en vez de un await suelto aquí) para poder
    // correrla EN PARALELO con cargar() más abajo — antes se esperaba a que
    // terminaran los 5 catálogos antes de ni siquiera empezar a pedir la
    // lista de vehículos, cuando ninguno depende del otro.
    async function cargarCatalogosVehiculo() {
      try {
        const [marcas, departamentos, sedes, razones, mapaUbicaciones, colaboradores] = await Promise.all([
          callServerCacheado('apiListarMarcas', state.token),
          callServerCacheado('apiListarDepartamentos', state.token),
          callServerCacheado('apiListarSedesVehiculo', state.token),
          callServerCacheado('apiListarRazonesSociales', state.token),
          callServerCacheado('apiListarUbicacionesPorSede', state.token),
          callServerCacheado('apiListarColaboradores', state.token),
        ]);
        ['veh-marca', 'editar-vehiculo-marca'].forEach((id) => llenarSelect(id, marcas));
        ['veh-departamento', 'editar-vehiculo-departamento'].forEach((id) => llenarSelect(id, departamentos));
        ['veh-sede', 'editar-vehiculo-sede'].forEach((id) => llenarSelect(id, sedes));
        ['veh-razon-social', 'editar-vehiculo-razon-social'].forEach((id) => llenarSelect(id, razones));
        mapaUbicacionesPorSede = mapaUbicaciones || {};
        // Al cargar los catálogos ya puede haber una Sede elegida (ej. al
        // reabrir Editar antes de que termine esta llamada) — refresca la
        // Ubicación por si acaso.
        llenarUbicacionesSegunSede('veh');
        llenarUbicacionesSegunSede('editar-vehiculo');
        const nombresColaboradores = Array.from(new Set((colaboradores || []).map((c) => c.NOMBRE)));
        ['veh-responsable-vehiculo', 'editar-vehiculo-responsable-vehiculo'].forEach((id) => llenarSelect(id, nombresColaboradores));
        wireResponsableVehiculo('veh', colaboradores || []);
        wireResponsableVehiculo('editar-vehiculo', colaboradores || []);
      } catch (err) {
        console.error('No se pudieron cargar los catálogos de Marca/Departamento/Sede/Razón social/Ubicación/Colaboradores:', err);
      }
    }

    /** Al elegir (o escribir exacto) un nombre de Capital Humano en "Responsable del
     *  vehículo", sugiere su Departamento y No. de empleado -- no bloquea los campos
     *  (el usuario los puede corregir): si hay más de un colaborador con ese nombre
     *  exacto (recontratación, nombre repetido), se usa el primero que haya en la
     *  lista. Si el nombre no coincide con nadie, no hace nada -- se deja capturar
     *  a mano, como ya era antes de tener este catálogo. */
    function wireResponsableVehiculo(prefijo, colaboradores) {
      const porNombre = {};
      colaboradores.forEach((c) => { if (!porNombre[c.NOMBRE.toUpperCase()]) porNombre[c.NOMBRE.toUpperCase()] = c; });
      const idResponsable = prefijo + '-responsable-vehiculo';
      const input = document.getElementById(idResponsable);
      if (!input || input.dataset.wireado) return; // una sola vez por campo, aunque se recarguen catálogos
      input.dataset.wireado = '1';
      input.addEventListener('input', () => {
        const colaborador = porNombre[input.value.trim().toUpperCase()];
        const depto = document.getElementById(prefijo + '-departamento');
        const noEmpleado = document.getElementById(prefijo + '-no-empleado');
        if (!colaborador) { if (depto) CampoAuto.quitar(depto); if (noEmpleado) CampoAuto.quitar(noEmpleado); return; }
        if (depto && colaborador.DEPARTAMENTO) CampoAuto.llenar(depto, colaborador.DEPARTAMENTO);
        if (noEmpleado && colaborador.NO_EMPLEADO) CampoAuto.llenar(noEmpleado, colaborador.NO_EMPLEADO);
      });
    }

    // Folio: se ve en su campo (deshabilitado, no se puede escribir) desde que
    // se elige la Clase en Registrar — es solo vista previa, el que de verdad
    // queda asignado se recalcula al guardar (por si alguien más registró un
    // vehículo de esa misma Clase mientras tanto).
    const campoFolioVeh = document.getElementById('veh-folio');
    document.getElementById('veh-clase').addEventListener('change', async (ev) => {
      const clase = ev.target.value;
      if (!clase) { campoFolioVeh.value = ''; return; }
      try {
        campoFolioVeh.value = await callServer('apiPrevisualizarFolioVehiculo', state.token, clase);
      } catch (err) {
        console.error('No se pudo previsualizar el folio:', err);
      }
    });

    // NUCCO: consecutivo simple, no depende de ningún otro campo — se
    // previsualiza una sola vez al entrar a Registrar (igual que el Folio,
    // NO reserva nada: el valor real se recalcula al guardar).
    async function previsualizarNuccoVeh() {
      try {
        document.getElementById('veh-nucco').value = await callServer('apiPrevisualizarNuccoVehiculo', state.token);
      } catch (err) {
        console.error('No se pudo previsualizar el NUCCO:', err);

    /** Igual que renderCamposVehiculo pero para MOSTRAR (no capturar): mismos grupos y
     *  etiquetas legibles que Registrar/Editar, en vez del volcado plano de antes. Lo que
     *  no está en CAMPOS_VEHICULO (columnas legadas del AppSheet) cae en "Otros datos".
     *  soloGrupos filtra a solo esos grupos (para repartir "General" vs "Detalles"). */
    function seccionesFichaVehiculo(completo, soloGrupos) {
      const porGrupo = {};
      const grupos = [];
      const usadas = new Set();
      CAMPOS_VEHICULO.forEach((campo) => {
        usadas.add(campo.clave);
        if (soloGrupos && soloGrupos.indexOf(campo.grupo) === -1) return;
        const valor = completo[campo.clave];
        if (valor === '' || valor === null || valor === undefined) return;
        if (!porGrupo[campo.grupo]) { porGrupo[campo.grupo] = []; grupos.push(campo.grupo); }
        porGrupo[campo.grupo].push(itemInfo(campo.etiqueta, campo.moneda ? formatearMoneda(valor) : valor));
      });
      if (!soloGrupos || soloGrupos.indexOf('Otros datos') !== -1) {
        const otros = Object.keys(completo)
          .filter((k) => !usadas.has(k) && completo[k] !== '' && completo[k] !== null && completo[k] !== undefined)
          .map((k) => itemInfo(tituloDesdeClave(k), completo[k]));
        if (otros.length) { porGrupo['Otros datos'] = otros; grupos.push('Otros datos'); }
      }

      return grupos.map((g) => '<div class="card ln-card"><h3><i data-lucide="' + (ICONO_GRUPO_VEHICULO[g] || 'info') +
        '" class="ico ln-icon"></i> ' + g + '</h3><div class="info-grid">' + porGrupo[g].join('') + '</div></div>').join('');
    }

    // queda en el subtítulo del modal), así que aquí no hay paso de "buscar vehículo" como

    function abrirCapturaVehiculo(icono, tipo, titulo, subtitulo) {
      document.getElementById('veh-captura-icono').innerHTML = Iconos.svg(icono);

      // prepararCaptura) la vuelve a destapar.
      document.getElementById('ins-calif-badge').hidden = true;
      document.getElementById('veh-modal-captura').hidden = false;
      refreshIcons();

        return;

      cuerpo.innerHTML = '';
      // RAZON SOCIAL del vehículo es la empresa DUEÑA de la unidad; la del holograma es
      // la empresa del CONTRATO con la gasolinera -- son cosas distintas (ver comentario

      /** modo='presencial': de siempre (exige la firma del responsable, genera el PDF de una
       *  vez). modo='remotoJefe': "Enviar liga(s) para firmar a distancia" -- no exige la
       *  firma del responsable: si ya se dibujó, se captura ahora (como siempre); si no, se
       *  difiere igual (le genera SU liga también, aparte de la del jefe, que siempre se
       *  difiere con este botón) -- nadie tiene que estar presente para generar cualquiera de

       *  casos (antes había uno aparte solo para el responsable): usuario, 8-oct. */
      async function guardarResponsiva_(modo, boton) {
        const errorBox = document.getElementById('resv-captura-error');
        errorBox.hidden = true;

        // Quien entrega SIEMPRE firma al capturar (presencial o a distancia): es quien está
        // armando este renglón ahora mismo, nunca hay "después" para su firma. Es la única

          errorBox.hidden = false;

          return;
        }

        const textoOriginal = boton.innerHTML;
        boton.disabled = true;
        boton.innerHTML = '<span class="spinner"></span> ' + (modo === 'presencial' ? 'Guardando…' : 'Generando liga…');
        toastCargando(modo === 'presencial' ? 'Registrando…' : 'Generando liga…');
        try {
          const imagenes = {};
          Object.keys(firmas).forEach((campo) => {
            const firma = firmas[campo].exportar();
            if (firma) imagenes[campo] = firma;
          });
          const datos = Object.assign({ 'FOLIO VEHICULO': vResumen.FOLIO }, CamposHoja.recolectar(CAMPOS_RESPONSIVA_VEHICULAR, 'resv'));
          // Si el responsable tampoco firmó, se difiere junto con el jefe (dos ligas de un
          // jalón) -- nadie tiene que estar presente para pedir la del jefe.
          const opciones = modo === 'remotoJefe'
            ? (firmas['FIRMA RESPONSABLE'].vacia() ? { remoto: true, remotoJefe: true } : { remotoJefe: true })
            : undefined;
          const res = await callServer('apiCrearResponsivaVehicular', state.token, datos, imagenes, opciones);
          if (res.aviso) Notificar.error(res.aviso);
          toastExito(modo === 'presencial' ? 'Responsiva registrada exitosamente' : 'Liga generada');
          cerrarCapturaVehiculo();
          abrirFichaVehiculo(vResumen, 'responsiva');
          if (res.liga && res.ligaJefe) {
            mostrarLigaFirma_([{ titulo: 'Responsable', liga: res.liga }, { titulo: 'Jefe directo', liga: res.ligaJefe }]);
          } else if (res.liga) mostrarLigaFirma_(res.liga);
          else if (res.ligaJefe) mostrarLigaFirma_(res.ligaJefe);
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.hidden = false;
          toastError('No se pudo ' + (modo === 'presencial' ? 'registrar' : 'generar la liga') + ': ' + err.message);
        } finally {
          boton.disabled = false;
          boton.innerHTML = textoOriginal;
        }
      }
      document.getElementById('resv-captura-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        guardarResponsiva_('presencial', document.getElementById('resv-captura-guardar'));
      });
      document.getElementById('resv-enviar-liga-jefe').addEventListener('click', () => {
        guardarResponsiva_('remotoJefe', document.getElementById('resv-enviar-liga-jefe'));

    /** repintar: la misma ficha con datos nuevos, sin "Cargando…" ni volver arriba */
    async function abrirFichaVehiculo(vResumen, pestanaInicial, repintar) {
      const listado = document.getElementById('veh-listado');
      const detalle = document.getElementById('veh-detalle');
      fichaVehiculoAbierta = vResumen;
      listado.hidden = true;
      detalle.hidden = false;
      if (!repintar) {
        detalle.innerHTML = migasVehiculo() + '<div class="card ln-card"><p class="ln-tenue"><span class="spinner"></span> Cargando…</p></div>';
        wireMigasVehiculo();
        document.getElementById('view-container').scrollTop = 0;
        window.scrollTo(0, 0);
      }

      try {
        // Todo en UNA llamada (apiFichaVehiculo en ClientApi.gs): el servidor pide cada pestaña
        // con el permiso de su módulo y manda null en las que la persona no puede ver (su pestaña
        // no aparece, igual que en el menú); si una que sí puede ver falla, sale vacía. Una ficha
        // ya vista sale al instante de su copia guardada y se repinta sola si llegó algo distinto;
        // cualquier guardado borra las copias (ESCRIBE en api.html).
        const ficha = JSON.parse((await callServerListaCacheada('apiFichaVehiculo', state.token, vResumen.FOLIO)) || '{}');
        const { completo, cambios, reasignaciones, verificaciones, inspecciones, sensores, hologramas, incidencias, responsivas, adherentes } = ficha;
        // Se pudo haber vuelto a la lista (o abierto otro folio) mientras cargaba.
        if (detalle.hidden || !document.body.contains(detalle) || fichaVehiculoAbierta !== vResumen) return;
        if (!completo) {
          detalle.innerHTML = migasVehiculo() + '<p class="empty-state">No se encontró el registro completo.</p>';
          wireMigasVehiculo();
          return;
        }

        const estilo = CLASE_ESTILO[String(completo['CLASE'] || '').toUpperCase()] || { icono: 'circle', color: 'var(--color-text-muted)' };
        const adherentesActivos = (adherentes || []).filter((r) => (r.ESTATUS || 'ACTIVO') === 'ACTIVO').length;
        const chipAdherentes = adherentesActivos
          ? '<span class="badge-estado pendiente"><i data-lucide="users" class="ico"></i> ' +
            adherentesActivos + (adherentesActivos === 1 ? ' adherente' : ' adherentes') + '</span>'
          : '';
        const resumenRapido = [
          ['Marca / Línea', [completo['MARCA'], completo['LINEA VEHICULO']].filter(Boolean).join(' · ')],
          ['Departamento', completo['DEPARTAMENTO']],
          ['Responsable', completo['RESPONSABLE VEHICULO']],
          ['Placa', completo['PLACA']],
        ].filter((d) => d[1]);

        let html = migasVehiculo();
        html += '<div class="ln-detalle-header card">' +
          '<div class="ln-detalle-icono" style="background:none; color:' + estilo.color + '"><i data-lucide="' + estilo.icono + '" class="ico ln-icon"></i></div>' +
          '<div class="ln-detalle-titulo"><h2>Nucco: ' + escaparHtml(vResumen.NUCCO || '') + '</h2>' +
          '<div class="ln-chips">' + badgeEstatus(completo['ESTATUS']) + chipAdherentes + '</div></div>' +
          '<div class="ln-detalle-botones">' +
          (puedeEditar ? '<button type="button" id="veh-btn-editar-ficha"><i data-lucide="pencil" class="ico"></i> Editar</button>' : '') +
          '</div>' +
          (resumenRapido.length ? '<dl class="ln-resumen-rapido">' + resumenRapido.map((d) =>
            '<div><dt>' + d[0] + '</dt><dd>' + escaparHtml(String(d[1])) + '</dd></div>').join('') + '</dl>' : '') +
          '</div>';

        const general = seccionesFichaVehiculo(completo, GRUPOS_FICHA_GENERAL);
        const detalles = seccionesFichaVehiculo(completo, CAMPOS_VEHICULO.map((c) => c.grupo)
          .filter((g, i, arr) => arr.indexOf(g) === i && GRUPOS_FICHA_GENERAL.indexOf(g) === -1).concat('Otros datos'));

        // Cada parte del historial es de su módulo (Cambios / Reasignaciones): sin permiso, no sale
        const historial = (cambios === null ? '' : '<div class="card ln-card"><h3><i data-lucide="pencil" class="ico ln-icon"></i> Historial de cambios</h3>' +
          ((cambios || []).length ? '<div class="historial-timeline">' + cambios.map((c) => `

          (reasignaciones === null ? '' : '<div class="card ln-card"><h3><i data-lucide="arrow-left-right" class="ico ln-icon"></i> Historial de reasignaciones</h3>' +
          ((reasignaciones || []).length ? '<div class="historial-timeline">' + reasignaciones.map((r) => `
              <div class="historial-item">
                <div class="historial-icon historial-icon-accent"><i data-lucide="arrow-left-right" class="ico"></i></div>
                <div class="historial-main">
                  <div class="historial-valores">
                    <span class="chip-valor chip-antes">${escaparHtml(r.RESPONSABLE_SALIENTE || '—')}</span>
                    <i data-lucide="arrow-right" class="ico historial-flecha"></i>
                    <span class="chip-valor chip-despues">${escaparHtml(r.RESPONSABLE_ENTRANTE || '—')}</span>

                  <div class="historial-departamento">${escaparHtml(r.DEPARTAMENTO_ENTRANTE || '—')}</div>
                </div>
                <div class="historial-meta">

            `).join('') + '</div>' : '<p class="empty-state">Sin reasignaciones registradas para este vehículo.</p>') + '</div>');

        html += fichaEnPestanas([
          { id: 'general', titulo: 'General', icono: 'layout-grid', contenido: general },
          { id: 'detalles', titulo: 'Detalles', icono: 'clipboard-list', contenido: detalles },
          (cambios || reasignaciones) && { id: 'historial', titulo: 'Historial', icono: 'history', contenido: historial, num: (cambios || []).length + (reasignaciones || []).length },
          verificaciones && {
            id: 'verificaciones', titulo: 'Verificaciones', icono: 'clipboard-check', num: verificaciones.length,
            contenido: pestanaFicha('clipboard-check', 'Verificaciones', [
              { t: 'Verificación', r: (v) => formatearFecha(v.FECHA_VERIFICACION) },
              { t: 'Próxima', r: (v) => formatearFecha(v.FECHA_PROXIMA) },
              { t: 'Comprobante', r: (v) => botonArchivoFicha('verificacion', v.COMPROBANTE) },
              { t: '', r: (v) => accionesFichaRegistro('verificacion', v.ID, { editar: puedeEditarModulo('verificaciones'), eliminar: puedeEditarModulo('verificaciones') }) },
            ], verificaciones, 'Sin verificaciones registradas para este vehículo.',
            puedeEditarModulo('verificaciones') ? { tipo: 'verificacion', texto: 'Agregar' } : null),
          },
          inspecciones && {
            id: 'inspecciones', titulo: 'Inspecciones', icono: 'clipboard-list', num: inspecciones.length,
            contenido: pestanaFicha('clipboard-list', 'Inspecciones', [
              { t: 'Fecha', r: (i) => formatearFecha(i.FECHA) },
              { t: 'Tipo', r: (i) => escaparHtml(i.TIPO || '—') },
              { t: 'Inspector', r: (i) => escaparHtml(i.INSPECTOR || '—') },
              { t: 'Puntaje', r: (i) => (i.PUNTAJE === '' || i.PUNTAJE === null || i.PUNTAJE === undefined) ? '—' : i.PUNTAJE + '%' },
              { t: 'Formato', r: (i) => botonArchivoFicha('inspeccion', i.PDF) },
              { t: '', r: (i) => accionesFichaRegistro('inspeccion', i.ID, {}) },
            ], inspecciones, 'Sin inspecciones registradas para este vehículo.',
            puedeEditarModulo('inspeccion-vehicular') ? { tipo: 'inspeccion', texto: 'Agregar' } : null),
          },
          sensores && {
            id: 'sensor', titulo: 'Sensor', icono: 'radio', num: sensores.length,
            contenido: pestanaFicha('radio', 'Sensor', [
              { t: 'Instalación', r: (s) => formatearFecha(s.FECHA_INSTALACION) },
              { t: 'Serie', r: (s) => escaparHtml(s.SERIE_SENSOR || '—') },
              { t: 'Estatus', r: (s) => escaparHtml(s.ESTATUS || '—') },
              { t: 'Responsiva', r: (s) => botonArchivoFicha('sensor', s.RESPONSIVA) },
              { t: '', r: (s) => accionesFichaRegistro('sensor', s.ID, { editar: puedeEditarModulo('instalacion-sensores'), eliminar: puedeEditarModulo('instalacion-sensores') }) },
            ], sensores, 'Sin sensor instalado para este vehículo.',
            puedeEditarModulo('instalacion-sensores') ? { tipo: 'sensor', texto: 'Agregar' } : null),
          },
          hologramas && {
            id: 'hologramas', titulo: 'Hologramas', icono: 'credit-card', num: hologramas.length,
            contenido: pestanaFicha('credit-card', 'Hologramas', [
              { t: 'Proveedor', r: (h) => escaparHtml(h.PROVEEDOR || '—') },
              { t: 'Estatus', r: (h) => escaparHtml(h.ESTATUS_EOX || '—') },
              { t: 'Calcomanía', r: (h) => escaparHtml(h.CALCOMANIA || '—') },
              { t: 'Autorizado', r: (h) => (h.AUTORIZADO_PESOS === '' || h.AUTORIZADO_PESOS === null || h.AUTORIZADO_PESOS === undefined) ? '—' : formatearMoneda(h.AUTORIZADO_PESOS) },
              { t: 'Solicitud', r: (h) => botonArchivoFicha('holograma', h.SOLICITUD) },
              { t: '', r: (h) => accionesFichaRegistro('holograma', h.ID, { editar: puedeEditarModulo('hologramas'), eliminar: puedeEditarModulo('hologramas') }) },
            ], hologramas, 'Sin hologramas registrados para este vehículo.',
            puedeEditarModulo('hologramas') ? { tipo: 'holograma', texto: 'Agregar' } : null),
          },
          incidencias && {
            id: 'incidencias', titulo: 'Incidencias', icono: 'wrench', num: incidencias.length,
            contenido: pestanaFicha('wrench', 'Incidencias', [
              { t: 'Fecha', r: (i) => formatearFecha(i.FECHA_REGISTRO) },
              { t: 'Motivo', r: (i) => escaparHtml(i.INSPECCION_INGRESO || '—') },
              { t: 'Estado', r: (i) => '<span class="badge-estado ' + (i.ESTADO === 'ABIERTA' ? 'abierta' : 'cerrada') + '">' + (i.ESTADO === 'ABIERTA' ? 'Abierta' : 'Cerrada') + '</span>' },
              { t: 'Mecánico', r: (i) => escaparHtml(i.MECANICO || '—') },
              { t: '', r: (i) => accionesFichaRegistro('incidencia', i.ID, { editar: puedeEditarModulo('incidencias'), eliminar: puedeEditarModulo('incidencias') }) },
            ], incidencias, 'Sin incidencias registradas para este vehículo.',
            puedeEditarModulo('incidencias') ? { tipo: 'incidencia', texto: 'Agregar' } : null),
          },
          responsivas && {
            id: 'responsiva', titulo: 'Responsiva', icono: 'file-signature', num: responsivas.length,
            contenido: pestanaFicha('file-signature', 'Responsiva', [
              { t: 'Fecha', r: (r) => formatearFecha(r.FECHA) },
              { t: 'Responsable', r: (r) => escaparHtml(r.RESPONSABLE || '—') },
              { t: 'Departamento', r: (r) => escaparHtml(r.DEPARTAMENTO || '—') },
              { t: 'Estado', r: (r) => '<span class="badge-estado ' + ((r.ESTADO_FIRMA || 'FIRMADO') === 'PENDIENTE' ? 'pendiente' : 'activo') + '">' + ((r.ESTADO_FIRMA || 'FIRMADO') === 'PENDIENTE' ? 'Pendiente de firma' : 'Firmado') + '</span>' },
              { t: 'PDF', r: (r) => (r.PDF ? '<a href="' + escaparHtml(r.PDF) + '" target="_blank" rel="noopener" class="secondary" style="text-decoration:none">Ver</a>' : '—') },
              { t: '', r: (r) => accionesFichaRegistro('responsiva', r.ID, {
                eliminar: puedeEditarModulo('responsiva-vehicular'),
                copiarLiga: r.TOKEN_FIRMA || null,
                copiarLigaJefe: r.TOKEN_FIRMA_JEFE || null,
              }) },
            ], responsivas, 'Sin responsivas registradas para este vehículo.',
            puedeEditarModulo('responsiva-vehicular') ? { tipo: 'responsiva', texto: 'Generar nueva responsiva' } : null),
          },
          adherentes && {
            id: 'adherente', titulo: 'Adherentes', icono: 'users',
            num: adherentes.filter((r) => (r.ESTATUS || 'ACTIVO') === 'ACTIVO').length,
            contenido: pestanaFicha('users', 'Adherentes', [
              { t: 'Fecha', r: (r) => formatearFecha(r.FECHA) },
              { t: 'Adherente', r: (r) => escaparHtml(r.ADHERENTE || '—') },
              { t: 'Departamento', r: (r) => escaparHtml(r.DEPARTAMENTO || '—') },
              { t: 'Estatus', r: (r) => '<span class="badge-estado ' + ((r.ESTATUS || 'ACTIVO') === 'ACTIVO' ? 'activo' : 'baja') + '">' + (r.ESTATUS || 'ACTIVO') + '</span>' },
              { t: 'Firma', r: (r) => '<span class="badge-estado ' + ((r.ESTADO_FIRMA || 'FIRMADO') === 'PENDIENTE' ? 'pendiente' : 'activo') + '">' + ((r.ESTADO_FIRMA || 'FIRMADO') === 'PENDIENTE' ? 'Pendiente' : 'Firmado') + '</span>' },
              { t: 'PDF', r: (r) => (r.PDF ? '<a href="' + escaparHtml(r.PDF) + '" target="_blank" rel="noopener" class="secondary" style="text-decoration:none">Ver</a>' : '—') },
              { t: '', r: (r) => accionesFichaRegistro('adherente', r.ID, {
                estatus: r.ESTATUS || 'ACTIVO',
                eliminar: puedeEditarModulo('adherente-vehicular'),
                copiarLiga: r.TOKEN_FIRMA || null,
                copiarLigaJefe: r.TOKEN_FIRMA_JEFE || null,
              }) },
            ], adherentes, 'Sin adherentes registrados para este vehículo.',
            puedeEditarModulo('adherente-vehicular') ? { tipo: 'adherente', texto: 'Generar nuevo adherente' } : null),
          },
        ].filter(Boolean));

        detalle.innerHTML = html;
        wireMigasVehiculo();
        if (pestanaInicial) mostrarPestanaFichaVehiculo(pestanaInicial);
        const btnEditar = document.getElementById('veh-btn-editar-ficha');
        if (btnEditar) btnEditar.addEventListener('click', () => abrirEditarVehiculo(vResumen));
        detalle.querySelectorAll('[data-agregar]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const tipo = btn.dataset.agregar;
            if (tipo === 'verificacion') abrirAgregarVerificacion(vResumen);
            else if (tipo === 'sensor') abrirAgregarSensor(vResumen);
            else if (tipo === 'holograma') abrirAgregarHolograma(vResumen, completo);
            else if (tipo === 'incidencia') abrirAgregarIncidencia(vResumen, completo);
            else if (tipo === 'inspeccion') abrirAgregarInspeccion(vResumen, completo, hologramas || []);
            else if (tipo === 'responsiva') abrirAgregarResponsivaVehicular(vResumen, completo);
            else if (tipo === 'adherente') abrirAgregarAdherenteVehicular(vResumen, completo);
          });
        });
        // Ver completo/Editar/Eliminar por fila: el registro completo (para Editar) ya
        // está en memoria en los arreglos que se acaban de pedir -- se indexa por ID una
        // vez, sin volver a pedirlo al servidor (Ver completo sí pide el suyo aparte,
        // porque necesita TODAS las columnas, no solo las de este resumen curado).
        const porIdFicha = {
          verificacion: Object.fromEntries((verificaciones || []).map((v) => [v.ID, v])),
          sensor: Object.fromEntries((sensores || []).map((s) => [s.ID, s])),
          holograma: Object.fromEntries((hologramas || []).map((h) => [h.ID, h])),
          incidencia: Object.fromEntries((incidencias || []).map((i) => [i.ID, i])),
        };
        detalle.querySelectorAll('[data-ficha-ver]').forEach((btn) => {
          btn.addEventListener('click', () => verRegistroFicha(btn.dataset.fichaVer, btn.dataset.id));
        });
        detalle.querySelectorAll('[data-ficha-editar]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const tipo = btn.dataset.fichaEditar;
            const registro = porIdFicha[tipo] && porIdFicha[tipo][btn.dataset.id];
            if (!registro) return;
            if (tipo === 'verificacion') abrirEditarVerificacionFicha(registro, vResumen);
            else if (tipo === 'sensor') abrirEditarSensorFicha(registro, vResumen);
            else if (tipo === 'holograma') abrirEditarHologramaFicha(registro, vResumen);
            else if (tipo === 'incidencia') abrirEditarIncidenciaFicha(registro, vResumen);
          });
        });
        detalle.querySelectorAll('[data-ficha-eliminar]').forEach((btn) => {
          btn.addEventListener('click', () => eliminarRegistroFicha(btn.dataset.fichaEliminar, btn.dataset.id, vResumen));
        });
        detalle.querySelectorAll('[data-ficha-estatus]').forEach((btn) => {
          btn.addEventListener('click', () => cambiarEstatusFicha(btn.dataset.fichaEstatus, btn.dataset.id, btn.dataset.estatusDestino, vResumen));
        });
        detalle.querySelectorAll('[data-ficha-copiar-liga]').forEach((btn) => {
          btn.addEventListener('click', () => copiarLigaFicha_(btn.dataset.fichaCopiarLiga, 'principal', btn.dataset.token));
        });
        detalle.querySelectorAll('[data-ficha-copiar-liga-jefe]').forEach((btn) => {
          btn.addEventListener('click', () => copiarLigaFicha_(btn.dataset.fichaCopiarLigaJefe, 'jefe', btn.dataset.token));
        });
        refreshIcons();
      } catch (err) {
        if (detalle.hidden || !document.body.contains(detalle)) return;
        detalle.innerHTML = migasVehiculo() + '<p class="error-msg">No se pudo cargar: ' + escaparHtml(err.message) + '</p>';
        wireMigasVehiculo();
      }
