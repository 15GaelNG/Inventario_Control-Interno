<script>
  /**
   * app.js — estado global, router SPA (client-side) e inicialización de cada vista.
   * Las vistas viven como <template> ya embebidas en el HTML (ver Index.html),
   * se clonan a #view-container al navegar. Cero round-trips extra al servidor
   * solo por cambiar de pantalla.
   */

  // Tema (claro/oscuro) — se aplica antes de montar cualquier vista para evitar parpadeo.
  // Los botones de tema viven en dos lugares (login y sidebar del app-shell), así que
  // se identifican por clase (.theme-btn + data-tema), no por id, y se manejan con
  // delegación de eventos para que funcionen sin importar cuándo se monten.
  (function initTema() {
    try {
      const guardado = localStorage.getItem('tema');
      if (guardado === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* localStorage puede fallar en vista previa/incógnito, se ignora */ }
  })();

  function aplicarTema(tema) {
    if (tema === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    try { localStorage.setItem('tema', tema); } catch (e) { /* no-op */ }
    document.querySelectorAll('.theme-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tema === tema);
    });
  }

  // Fecha de hoy en la barra superior, formato "Martes 10 de agosto del 2026".
  (function initFechaTopbar() {
    const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const meses = [
      'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
      'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
    ];
    const hoy = new Date();
    const texto = `${dias[hoy.getDay()]} ${hoy.getDate()} de ${meses[hoy.getMonth()]} del ${hoy.getFullYear()}`;
    const el = document.getElementById('topbar-date');
    if (el) el.textContent = texto;
  })();

  // Sidebar colapsable — igual que el tema, se aplica antes de pintar para evitar parpadeo.
  (function initColapsoSidebar() {
    try {
      if (localStorage.getItem('sidebarColapsado') === '1') {
        document.getElementById('sidebar').classList.add('collapsed');
      }
    } catch (e) { /* no-op */ }
  })();

  document.addEventListener('click', (ev) => {
    const btnTema = ev.target.closest('.theme-btn');
    if (btnTema) { aplicarTema(btnTema.dataset.tema); return; }

    if (ev.target.closest('#sidebar-collapse-btn')) {
      const sidebar = document.getElementById('sidebar');
      const colapsado = sidebar.classList.toggle('collapsed');
      try { localStorage.setItem('sidebarColapsado', colapsado ? '1' : '0'); } catch (e) { /* no-op */ }
    }
  });

  const state = {
    token: sessionStorage.getItem('token') || null,
    sesion: JSON.parse(sessionStorage.getItem('sesion') || 'null'),
  };

  function guardarSesion(resultadoLogin) {
    state.token = resultadoLogin.token;
    state.sesion = resultadoLogin;
    sessionStorage.setItem('token', state.token);
    sessionStorage.setItem('sesion', JSON.stringify(resultadoLogin));
  }

  function cerrarSesion() {
    if (state.token) apiLogoutSafe();
    state.token = null;
    state.sesion = null;
    sessionStorage.clear();
    render();
  }
  async function apiLogoutSafe() {
    try { await callServer('apiLogout', state.token); } catch (e) { /* no-op */ }
  }

  function render() {
    document.getElementById('app-shell').hidden = !state.token;
    document.getElementById('login-screen-container').hidden = !!state.token;

    if (!state.token) {
      initLogin();
      return;
    }
    document.getElementById('user-name').textContent = state.sesion.nombre + ' · ' + state.sesion.rol;
    navegarA('dashboard');
  }

  /**
   * Pantalla de carga que se muestra justo después de un login exitoso
   * (manual o con Google), antes de entrar al dashboard. Los 4 íconos de
   * módulos se van "encendiendo" en secuencia con un mensaje temático, para
   * darle personalidad a la espera en vez de un spinner genérico.
   */
  function mostrarPantallaCarga(callback) {
    const container = document.getElementById('loading-screen-container');
    montarVista('tpl-loading', null, container);

    const pasos = [
      { icono: 'loading-icon-0', mensaje: 'Sincronizando vehículos…' },
      { icono: 'loading-icon-1', mensaje: 'Actualizando líneas telefónicas…' },
      { icono: 'loading-icon-2', mensaje: 'Revisando accesorios…' },
      { icono: 'loading-icon-3', mensaje: 'Cerrando caja chica del día…' },
    ];
    const duracionTotal = 1900;
    const porPaso = duracionTotal / pasos.length;

    const barra = document.getElementById('loading-bar-fill');
    const mensaje = document.getElementById('loading-message');

    requestAnimationFrame(() => {
      barra.style.transitionDuration = duracionTotal + 'ms';
      barra.style.width = '100%';
    });

    pasos.forEach((paso, i) => {
      setTimeout(() => {
        document.getElementById(paso.icono).classList.add('active');
        mensaje.classList.add('fade');
        setTimeout(() => {
          mensaje.textContent = paso.mensaje;
          mensaje.classList.remove('fade');
        }, 150);
      }, i * porPaso);
    });

    setTimeout(() => {
      const pantalla = document.getElementById('loading-screen');
      pantalla.classList.add('fade-out');
      setTimeout(() => {
        container.innerHTML = '';
        callback();
      }, 450);
    }, duracionTotal + 250);
  }

  function montarVista(templateId, initFn, container) {
    container = container || document.getElementById('view-container');
    const tpl = document.getElementById(templateId);
    container.innerHTML = '';
    container.appendChild(tpl.content.cloneNode(true));
    if (initFn) initFn();
  }

  function navegarA(vista, etiqueta) {
    document.querySelectorAll('.nav-item, .nav-subitem').forEach((el) => {
      el.classList.toggle('active', el.dataset.view === vista);
    });

    if (vista === 'dashboard') { montarVista('tpl-dashboard', initDashboard); return; }
    if (vista === 'accesorios') { montarVista('tpl-accesorios', initAccesorios); return; }

    mostrarProximamente(etiqueta || vista);
  }

  /** Placeholder para módulos que ya están en el menú pero aún no se han construido */
  function mostrarProximamente(nombreModulo) {
    document.getElementById('view-container').innerHTML =
      '<div class="card" style="max-width:420px; margin:60px auto; text-align:center;">' +
      '<div style="font-size:32px; margin-bottom:10px;">🚧</div>' +
      '<h2 style="margin-bottom:6px;">' + nombreModulo + '</h2>' +
      '<p style="color:var(--color-text-muted); font-size:13px; margin:0;">' +
      'Este módulo todavía no está construido — muy pronto.</p>' +
      '</div>';
  }

  /**
   * Estructura del sidebar por área. La mayoría de estos sub-módulos todavía
   * no están construidos (ver mostrarProximamente); "accesorios" es el único
   * que ya apunta a un módulo real y funcional.
   */
  const NAV_GRUPOS = [
    {
      id: 'servicios-vehiculares', icono: '🚗', etiqueta: 'Servicios Vehiculares',
      items: [
        { vista: 'incidencias', etiqueta: 'Incidencias' },
        { vista: 'vehiculos', etiqueta: 'Vehículos' },
        { vista: 'cambios-vehiculos', etiqueta: 'Cambios Vehículos' },
        { vista: 'reasignaciones-vehiculares', etiqueta: 'Reasignaciones Vehiculares' },
        { vista: 'verificaciones', etiqueta: 'Verificaciones' },
        { vista: 'instalacion-sensores', etiqueta: 'Instalación de Sensores' },
        { vista: 'servicios', etiqueta: 'Servicios' },
        { vista: 'hologramas', etiqueta: 'Hologramas' },
      ],
    },
    {
      id: 'lineas', icono: '📱', etiqueta: 'Líneas',
      items: [
        { vista: 'reasignaciones-lineas', etiqueta: 'Control de Reasignaciones - Líneas' },
        { vista: 'accesorios', etiqueta: 'Inventario de Accesorios' },
        { vista: 'reactivacion-lineas', etiqueta: 'Reactivación de Líneas' },
        { vista: 'lineas-telefonicas', etiqueta: 'Líneas Telefónicas' },
        { vista: 'cambios-lineas', etiqueta: 'Control de Cambios - Líneas' },
        { vista: 'bitacora-desechos', etiqueta: 'Bitácora de Desechos' },
        { vista: 'lineas-post-venta', etiqueta: 'Líneas Post Venta' },
      ],
    },
    {
      id: 'arqueos', icono: '💰', etiqueta: 'Arqueos',
      items: [
        { vista: 'arqueos', etiqueta: 'Arqueos' },
        { vista: 'caja-chica', etiqueta: 'Caja Chica' },
      ],
    },
    {
      id: 'uber', icono: '🚕', etiqueta: 'Uber',
      items: [
        { vista: 'uber', etiqueta: 'Uber' },
        { vista: 'tickets', etiqueta: 'Tickets' },
      ],
    },
  ];

  function renderNavGrupos() {
    const contenedor = document.getElementById('nav-groups');
    contenedor.innerHTML = NAV_GRUPOS.map((grupo) => `
      <div class="nav-group" id="nav-group-${grupo.id}">
        <div class="nav-group-header" data-grupo="${grupo.id}">
          <span class="nav-icon">${grupo.icono}</span>
          <span class="nav-label">${grupo.etiqueta}</span>
          <span class="nav-group-chevron">›</span>
        </div>
        <div class="nav-group-items">
          ${grupo.items.map((item) => `
            <div class="nav-subitem" data-view="${item.vista}" data-etiqueta="${item.etiqueta}">${item.etiqueta}</div>
          `).join('')}
        </div>
      </div>
    `).join('');

    contenedor.querySelectorAll('.nav-group-header').forEach((header) => {
      header.addEventListener('click', () => {
        document.getElementById('nav-group-' + header.dataset.grupo).classList.toggle('expanded');
      });
    });
    contenedor.querySelectorAll('.nav-subitem').forEach((el) => {
      el.addEventListener('click', () => navegarA(el.dataset.view, el.dataset.etiqueta));
    });
  }

  // ---------- Login ----------
  function initLogin() {
    const login = document.getElementById('login-screen-container');
    montarVista('tpl-login', null, login);

    aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

    const inputPassword = document.getElementById('login-password');
    document.getElementById('toggle-password').addEventListener('click', (ev) => {
      const seVaAMostrar = inputPassword.type === 'password';
      inputPassword.type = seVaAMostrar ? 'text' : 'password';
      ev.currentTarget.textContent = seVaAMostrar ? '🙈' : '🙉';
    });

    initGoogleQuickLogin();

    document.getElementById('form-login').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const correo = document.getElementById('login-correo').value.trim();
      const password = document.getElementById('login-password').value;
      const errorBox = document.getElementById('login-error');
      errorBox.hidden = true;
      try {
        const resultado = await callServer('apiLogin', correo, password);
        guardarSesion(resultado);
        mostrarPantallaCarga(() => render());
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });
  }

  /**
   * Detecta la cuenta de Google con la que ya se accedió a la webapp (el
   * acceso restringido a dominio obliga a iniciar sesión con Google antes de
   * siquiera llegar aquí) y, si coincide con un usuario activo, muestra el
   * botón de acceso directo "Continuar como [nombre]".
   */
  async function initGoogleQuickLogin() {
    const chip = document.getElementById('google-account-chip');
    const divisor = document.getElementById('login-or-divider');
    try {
      const identidad = await callServer('apiIdentidadGoogle');
      if (!identidad || !identidad.coincide) return; // se queda solo el formulario manual

      document.getElementById('google-account-avatar').textContent =
        (identidad.nombre || identidad.correo).trim().charAt(0).toUpperCase();
      document.getElementById('google-account-name').textContent = identidad.nombre || identidad.correo;
      document.getElementById('google-account-email').textContent = identidad.correo;
      chip.hidden = false;
      divisor.hidden = false;

      chip.addEventListener('click', async () => {
        const errorBox = document.getElementById('login-error');
        errorBox.hidden = true;
        try {
          const resultado = await callServer('apiLoginConGoogle');
          guardarSesion(resultado);
          mostrarPantallaCarga(() => render());
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.hidden = false;
        }
      });
    } catch (err) {
      // Si falla la detección (poco común), simplemente se queda el formulario manual.
    }
  }

  // ---------- Dashboard ----------
  function initDashboard() {
    document.querySelectorAll('.nav-module[data-view]').forEach((el) => {
      el.addEventListener('click', () => navegarA(el.dataset.view));
    });
  }

  // ---------- Accesorios ----------
  async function initAccesorios() {
    const selectArticulo = document.getElementById('mov-articulo');
    const tabla = document.getElementById('tabla-articulos');

    async function cargar() {
      const articulos = await callServer('apiListarArticulosConStock', state.token);

      selectArticulo.innerHTML = articulos
        .map((a) => `<option value="${a.ID}">${a.NOMBRE}</option>`).join('');

      tabla.innerHTML = articulos.map((a) => {
        const bajo = Number(a.STOCK) <= Number(a.STOCK_MINIMO || 0);
        return `<tr>
          <td>${a.CATEGORIA || ''}</td>
          <td>${a.NOMBRE || ''}</td>
          <td>${a.MARCA || ''}</td>
          <td><span class="badge ${bajo ? 'low' : 'ok'}">${a.STOCK}</span></td>
        </tr>`;
      }).join('');
    }

    document.getElementById('form-movimiento').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('mov-error');
      errorBox.hidden = true;
      try {
        await callServer(
          'apiRegistrarMovimiento',
          state.token,
          selectArticulo.value,
          document.getElementById('mov-tipo').value,
          Number(document.getElementById('mov-cantidad').value),
          ''
        );
        document.getElementById('mov-cantidad').value = '';
        await cargar();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });

    await cargar();
  }

  document.getElementById('btn-logout').addEventListener('click', cerrarSesion);
  document.querySelectorAll('#sidebar .nav-item[data-view]').forEach((el) => {
    el.addEventListener('click', () => navegarA(el.dataset.view));
  });

  renderNavGrupos();
  render();
</script>
