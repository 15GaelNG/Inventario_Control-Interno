<script>
  /**
   * api.js — envuelve google.script.run en promesas para poder usar async/await
   * en el resto del código del cliente.
   */
  function callServer(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => {
          const error = new Error(err.message || String(err));
          // El token vive en sessionStorage pero la sesión del servidor caduca (8 h): sin
          // esto la app se queda "adentro" con todo fallando y el menú vacío.
          if (/sesi[oó]n expirada/i.test(error.message)) {
            window.dispatchEvent(new CustomEvent('sesion-expirada'));
          }
          reject(error);
        })
        [fnName](...args);
    });
  }
</script>
