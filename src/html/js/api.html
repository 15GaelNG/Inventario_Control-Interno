<script>
  /**
   * api.js — envuelve google.script.run en promesas para poder usar async/await
   * en el resto del código del cliente.
   */
  /**
   * Cuánto tarda cada llamada al servidor (las últimas 300). En la consola del navegador,
   * verTiempos() las resume por función: para saber qué es lo lento antes de optimizar.
   */
  const tiemposServidor = [];
  function verTiempos() {
    const porFuncion = {};
    tiemposServidor.forEach((t) => {
      const f = porFuncion[t.fn] || (porFuncion[t.fn] = { llamadas: 0, total: 0, max: 0, errores: 0 });
      f.llamadas++; f.total += t.ms; f.max = Math.max(f.max, t.ms); if (!t.ok) f.errores++;
    });
    const tabla = Object.keys(porFuncion).map((fn) => ({
      funcion: fn, llamadas: porFuncion[fn].llamadas, promedio_ms: Math.round(porFuncion[fn].total / porFuncion[fn].llamadas),
      max_ms: porFuncion[fn].max, errores: porFuncion[fn].errores,
    })).sort((a, b) => b.promedio_ms * b.llamadas - a.promedio_ms * a.llamadas);
    console.table(tabla);
    return tabla;
  }

  /**
   * El piso de una llamada al servidor: `veces` llamadas seguidas a apiPing, que no hace
   * nada. Lo que tarda es puro viaje + arranque de Apps Script, lo mismo que paga cualquier
   * otra llamada antes de hacer su trabajo. En la consola: await medirPiso()
   */
  async function medirPiso(veces) {
    const ms = [];
    for (let i = 0; i < (veces || 5); i++) {
      const t = performance.now();
      await pedir_('apiPing', []);
      ms.push(Math.round(performance.now() - t));
    }
    const orden = ms.slice().sort((a, b) => a - b);
    const r = { llamadas: ms, minimo_ms: orden[0], mediana_ms: orden[Math.floor(orden.length / 2)] };
    console.log('Piso por llamada: mediana ' + r.mediana_ms + ' ms, mínimo ' + r.minimo_ms + ' ms', ms);
    return r;
  }
  function anotarTiempo_(fn, inicio, ok) {
    tiemposServidor.push({ fn: fn, ms: Math.round(performance.now() - inicio), ok: ok });
    if (tiemposServidor.length > 300) tiemposServidor.shift();
  }

  /**
   * Pedir algo ANTES de que la pantalla lo necesite (p. ej. el Inicio mientras corre la
   * animación de entrada): la siguiente callServer con la misma función y argumentos recibe
   * esa misma respuesta en vez de pedirla otra vez. Se usa una sola vez y caduca en 30 s.
   */
  const adelantadas = {};
  const ADELANTADA_MS = 30 * 1000;
  function adelantar(fnName, ...args) {
    const clave = fnName + JSON.stringify(args);
    const promesa = pedir_(fnName, args);
    promesa.catch(() => { /* si nadie la usa, que no quede como error sin atender */ });
    adelantadas[clave] = { promesa: promesa, ts: Date.now() };
  }

  function callServer(fnName, ...args) {
    const clave = fnName + JSON.stringify(args);
    const adelantada = adelantadas[clave];
    if (adelantada) {
      delete adelantadas[clave];
      if (Date.now() - adelantada.ts < ADELANTADA_MS) return adelantada.promesa;
    }
    return pedir_(fnName, args);
  }

  function pedir_(fnName, args) {
    const inicio = performance.now();
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((r) => { anotarTiempo_(fnName, inicio, true); resolve(r); })
        .withFailureHandler((err) => {
          anotarTiempo_(fnName, inicio, false);
          const mensaje = err.message || String(err);
          // Sesión expirada (Auth.validarSesion, server-side): sin importar
          // desde qué pantalla/módulo venga la llamada, se maneja aquí una
          // sola vez — regresa al login con un aviso, en vez de dejar cada
          // pantalla a medias cargar (selects vacíos, etc.) sin explicación.
          if (/sesi[oó]n expirada/i.test(mensaje) && typeof manejarSesionExpirada === 'function') {
            manejarSesionExpirada();
          }
          reject(new Error(mensaje));
        })
        [fnName](...args);
    });
  }

  /**
   * Igual que callServer, pero para catálogos de referencia que casi nunca
   * cambian (Departamentos, Sedes, Marcas, Razones sociales, Oficinas,
   * Ubicaciones por sede, los 17 reactivos fijos de Arqueos...) — se piden
   * una sola vez por sesión (no una vez por cada visita al módulo, que es
   * lo que pasaba antes: cada navegación a Vehículos/Uber/Tickets/etc.
   * volvía a pedirle lo mismo al servidor). El resultado (o la promesa en
   * curso, para no duplicar la llamada si dos módulos lo piden casi al
   * mismo tiempo) se guarda en memoria; recargar la página limpia la caché
   * sola. A propósito NO se usa para catálogos que sí cambian seguido con
   * el uso normal del sistema (ej. folios de vehículos, solicitantes de
   * tickets) — esos siguen pidiéndose fresco cada vez con callServer.
   */
  /**
   * Almacen: donde viven las copias del navegador (listas y catálogos). IndexedDB, que aguanta
   * cientos de MB; si el navegador no lo deja (modo privado, bloqueado), localStorage (~5 MB
   * para todo el sitio); si tampoco, nada (solo memoria). Todo async, todo por persona (la
   * llave lleva el correo) y se borra al cerrar sesión. Si algo falla, regresa "no hay copia"
   * y se pide al servidor como siempre: nunca truena por esto.
   */
  const Almacen = (function () {
    const BD = 'control-interno';
    const TABLA = 'copias';
    const MAX_LOCAL = 1500000;   // en localStorage (5 MB para todo): lo más grande no se guarda
    let abierta = null;          // Promise<IDBDatabase|null>

    function abrir_() {
      if (abierta) return abierta;
      abierta = new Promise((resolve) => {
        try {
          if (!window.indexedDB) { resolve(null); return; }
          const pet = indexedDB.open(BD, 1);
          pet.onupgradeneeded = () => pet.result.createObjectStore(TABLA);
          pet.onsuccess = () => resolve(pet.result);
          pet.onerror = () => resolve(null);
          pet.onblocked = () => resolve(null);
        } catch (e) { resolve(null); }
      }).then((bd) => {
        // Con IndexedDB, las copias viejas de localStorage (antes vivían ahí) solo ocupan lugar
        if (bd) borrarLocal_((k) => k.indexOf(PREFIJO_LISTAS) === 0 || k.indexOf(PREFIJO_CATALOGOS) === 0);
        return bd;
      });
      return abierta;
    }

    /** Corre fn(tabla) en una transacción; regresa el .result de lo que fn regrese (o undefined si algo falla) */
    function tx_(bd, modo, fn) {
      return new Promise((resolve) => {
        try {
          const t = bd.transaction(TABLA, modo);
          const pet = fn(t.objectStore(TABLA));
          t.oncomplete = () => resolve(pet ? pet.result : undefined);
          t.onerror = () => resolve(undefined);
          t.onabort = () => resolve(undefined);
        } catch (e) { resolve(undefined); }
      });
    }

    function borrarLocal_(prueba) {
      try { Object.keys(localStorage).filter(prueba).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* no-op */ }
    }

    async function leer(llave) {
      const bd = await abrir_();
      if (bd) {
        const v = await tx_(bd, 'readonly', (t) => t.get(llave));
        return typeof v === 'string' ? v : null;
      }
      try { return localStorage.getItem(llave); } catch (e) { return null; }
    }

    async function guardar(llave, texto) {
      const bd = await abrir_();
      if (bd) { await tx_(bd, 'readwrite', (t) => t.put(texto, llave)); return; }
      try {
        if (texto.length <= MAX_LOCAL) localStorage.setItem(llave, texto);
        else localStorage.removeItem(llave);
      } catch (e) { /* no cupo: se queda en memoria */ }
    }

    async function borrar(llave) {
      const bd = await abrir_();
      if (bd) await tx_(bd, 'readwrite', (t) => t.delete(llave));
      try { localStorage.removeItem(llave); } catch (e) { /* no-op */ }
    }

    /** Todo lo que empiece con alguno de los prefijos (al cerrar sesión) */
    async function borrarPrefijos(prefijos) {
      const bd = await abrir_();
      if (bd) {
        await tx_(bd, 'readwrite', (t) => {
          prefijos.forEach((p) => t.delete(IDBKeyRange.bound(p, p + '￿')));
          return null;
        });
      }
      borrarLocal_((k) => prefijos.some((p) => k.indexOf(p) === 0));
    }

    return { leer, guardar, borrar, borrarPrefijos };
  })();

  const PREFIJO_CATALOGOS = 'catalogo:';
  // El token cambia en cada sesión: la llave de lo guardado no lo lleva
  const sinToken_ = (args) => args.filter((a) => typeof state === 'undefined' || a !== state.token);
  const llaveCatalogo_ = (fnName, args) => PREFIJO_CATALOGOS + correoSesion_() + ':' + fnName + JSON.stringify(sinToken_(args));

  /**
   * Catálogos: una vez por carga de página. Si hay copia de una visita anterior se usa AL
   * INSTANTE y se pide lo fresco por detrás (la siguiente vez ya sale lo nuevo); sin copia,
   * se espera al servidor como antes.
   */
  const cacheCatalogos = {};
  function callServerCacheado(fnName, ...args) {
    const clave = fnName + JSON.stringify(args);
    if (!cacheCatalogos[clave]) {
      const llave = llaveCatalogo_(fnName, args);
      const esta = Almacen.leer(llave).then((texto) => {
        const fresco = callServer(fnName, ...args).then((valor) => {
          // Si mientras tanto se invalidó, esta respuesta ya no manda (ni se guarda)
          if (cacheCatalogos[clave] !== esta) return valor;
          Almacen.guardar(llave, JSON.stringify(valor === undefined ? null : valor));
          cacheCatalogos[clave] = Promise.resolve(valor);
          return valor;
        });
        if (texto === null) return fresco;
        fresco.catch(() => { /* por detrás: si falla, se queda la copia */ });
        try { return JSON.parse(texto); } catch (e) { return fresco; }
      }).catch((err) => {
        // si falla, la próxima vez se reintenta en vez de quedar guardado el error
        if (cacheCatalogos[clave] === esta) delete cacheCatalogos[clave];
        throw err;
      });
      cacheCatalogos[clave] = esta;
    }
    return cacheCatalogos[clave];
  }

  /**
   * Las listas PRINCIPALES de cada tabla (apiListarXResumen), con la idea de
   * "pinta con lo que ya tienes y actualiza por detrás" (stale-while-revalidate):
   *
   *   - Si ya hay una copia (en memoria, o en localStorage de una visita anterior,
   *     aunque se haya recargado la página), se devuelve AL INSTANTE.
   *   - Al mismo tiempo se pide lo fresco (salvo que se haya pedido hace menos de
   *     REPEDIR_MS). Si llega distinto, se guarda y se avisa con el evento
   *     "lista-actualizada": el módulo que la esté mostrando se vuelve a pintar
   *     (escucharLista). Si llega igual, no pasa nada.
   *   - Sin copia, se espera al servidor, como antes.
   *
   * Después de crear/editar/eliminar, invalidarCacheLista borra la copia: el
   * cargar() que sigue espera el dato recién guardado, nunca el viejo.
   *
   * La copia en localStorage es por persona (correo) y se borra al cerrar sesión
   * (limpiarListasGuardadas). La llave no incluye el token: cambia en cada sesión.
   */
  const REPEDIR_MS = 15000;
  const PREFIJO_LISTAS = 'lista:';
  const cacheListas = {};        // llave → { valor, texto, ts, promesa, carga }

  const correoSesion_ = () => {
    try { return (state && state.sesion && state.sesion.correo) || ''; } catch (e) { return ''; }
  };
  const llaveLista_ = (fnName, args) => fnName + JSON.stringify(args.slice(1));   // args[0] es el token
  const llaveGuardada_ = (llave) => PREFIJO_LISTAS + correoSesion_() + ':' + llave;

  /** La entrada en memoria de una lista; la primera vez trae su copia del Almacen (carga) */
  function entradaLista_(llave) {
    if (cacheListas[llave]) return cacheListas[llave];
    const entrada = { valor: undefined, texto: null, ts: 0, promesa: null, carga: null };
    entrada.carga = Almacen.leer(llaveGuardada_(llave)).then((texto) => {
      // Si mientras tanto ya llegó lo del servidor, eso manda
      if (texto === null || entrada.texto !== null) return;
      try { entrada.valor = JSON.parse(texto); entrada.texto = texto; } catch (e) { /* copia dañada: se ignora */ }
    });
    return (cacheListas[llave] = entrada);
  }

  function pedirLista_(fnName, args, llave) {
    const entrada = entradaLista_(llave);
    if (entrada.promesa) return entrada.promesa;
    entrada.promesa = entrada.carga.then(() => {
      const teniaCopia = entrada.texto !== null;
      return callServer(fnName, ...args).then((valor) => {
        const texto = JSON.stringify(valor === undefined ? null : valor);
        const cambio = texto !== entrada.texto;
        Object.assign(entrada, { valor: valor, texto: texto, ts: Date.now(), promesa: null });
        Almacen.guardar(llaveGuardada_(llave), texto);
        if (cambio && teniaCopia) {
          window.dispatchEvent(new CustomEvent('lista-actualizada', { detail: { fn: fnName } }));
        }
        return valor;
      });
    }).catch((err) => {
      entrada.promesa = null;   // si falla, la próxima vez se reintenta
      throw err;
    });
    return entrada.promesa;
  }

  async function callServerListaCacheada(fnName, ...args) {
    const llave = llaveLista_(fnName, args);
    const entrada = entradaLista_(llave);
    await entrada.carga;
    if (entrada.texto === null) return pedirLista_(fnName, args, llave);
    if (!entrada.promesa && Date.now() - entrada.ts > REPEDIR_MS) {
      pedirLista_(fnName, args, llave).catch(() => { /* por detrás: si falla, se queda la copia */ });
    }
    return entrada.valor;
  }

  /**
   * Vuelve a llamar a `recargar` cuando la lista `fnName` llegue distinta de lo que se
   * pintó. Deja de escuchar sola en cuanto `elemento` ya no está en la página (se
   * navegó a otro módulo).
   */
  function escucharLista(fnName, recargar, elemento) {
    const alActualizar = (ev) => {
      if (!elemento || !document.body.contains(elemento)) { window.removeEventListener('lista-actualizada', alActualizar); return; }
      if (ev.detail && ev.detail.fn === fnName) recargar();
    };
    window.addEventListener('lista-actualizada', alActualizar);
  }

  /** Pide por detrás, sin pintar nada, para que el módulo abra al instante (precarga al entrar) */
  function precargarLista(fnName, ...args) {
    return pedirLista_(fnName, args, llaveLista_(fnName, args)).catch(() => null);
  }

  /** Borra una entrada de callServerListaCacheada — se llama justo después de
   * crear/editar/eliminar un registro EN ESE MISMO módulo, para que el
   * siguiente cargar() (que corre de inmediato) espere el dato fresco. */
  function invalidarCacheLista(fnName, ...args) {
    const llave = llaveLista_(fnName, args);
    // Una entrada vacía y ya "cargada": el cargar() que sigue no lee la copia vieja del Almacen
    // aunque su borrado todavía no termine; espera al servidor
    cacheListas[llave] = { valor: undefined, texto: null, ts: 0, promesa: null, carga: Promise.resolve() };
    Almacen.borrar(llaveGuardada_(llave));
  }

  /** invalidarCacheLista de todas las variantes de una función (p. ej. con distinto límite) */
  function invalidarListasDe(fnName) {
    Object.keys(cacheListas).filter((k) => k.indexOf(fnName + '[') === 0).forEach((k) => {
      cacheListas[k] = { valor: undefined, texto: null, ts: 0, promesa: null, carga: Promise.resolve() };
      Almacen.borrar(llaveGuardada_(k));
    });
  }

  /** Al cerrar sesión: que en una computadora compartida no quede nada guardado */
  function limpiarListasGuardadas() {
    Object.keys(cacheListas).forEach((k) => { delete cacheListas[k]; });
    Object.keys(cacheCatalogos).forEach((k) => { delete cacheCatalogos[k]; });
    return Almacen.borrarPrefijos([PREFIJO_LISTAS, PREFIJO_CATALOGOS]);
  }

  /** Igual, pero para callServerCacheado (catálogos de sesión completa) —
   * se usa cuando una acción cambia un dato que otro módulo trae cacheado
   * como catálogo (ej. una reasignación cambia el RESPONSABLE de un
   * vehículo, y apiListarVehiculosBasico lo usan Sensores/Hologramas/etc.). */
  function invalidarCacheCatalogo(fnName, ...args) {
    delete cacheCatalogos[fnName + JSON.stringify(args)];
    Almacen.borrar(llaveCatalogo_(fnName, args));
  }
</script>
