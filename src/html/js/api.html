<script>
  /**
   * api.js — envuelve google.script.run en promesas para poder usar async/await
   * en el resto del código del cliente.
   */
  function callServer(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => {
          const mensaje = err.message || String(err);
          // Sesión expirada (Auth.validarSesion, server-side): sin importar
          // desde qué pantalla/módulo venga la llamada, se maneja aquí una
          // sola vez — regresa al login con un aviso, en vez de dejar cada
          // pantalla a medias cargar (selects vacíos, etc.) sin explicación.
          if (/sesi[oó]n expirada/i.test(mensaje) && typeof manejarSesionExpirada === 'function') {
            manejarSesionExpirada();
          }
          reject(new Error(mensaje));
        })
        [fnName](...args);
    });
  }

  /**
   * Igual que callServer, pero para catálogos de referencia que casi nunca
   * cambian (Departamentos, Sedes, Marcas, Razones sociales, Oficinas,
   * Ubicaciones por sede, los 17 reactivos fijos de Arqueos...) — se piden
   * una sola vez por sesión (no una vez por cada visita al módulo, que es
   * lo que pasaba antes: cada navegación a Vehículos/Uber/Tickets/etc.
   * volvía a pedirle lo mismo al servidor). El resultado (o la promesa en
   * curso, para no duplicar la llamada si dos módulos lo piden casi al
   * mismo tiempo) se guarda en memoria; recargar la página limpia la caché
   * sola. A propósito NO se usa para catálogos que sí cambian seguido con
   * el uso normal del sistema (ej. folios de vehículos, solicitantes de
   * tickets) — esos siguen pidiéndose fresco cada vez con callServer.
   */
  const cacheCatalogos = {};
  function callServerCacheado(fnName, ...args) {
    const clave = fnName + JSON.stringify(args);
    if (!cacheCatalogos[clave]) {
      cacheCatalogos[clave] = callServer(fnName, ...args).catch((err) => {
        delete cacheCatalogos[clave]; // si falla, la próxima vez se reintenta en vez de quedar cacheado el error
        throw err;
      });
    }
    return cacheCatalogos[clave];
  }

  /**
   * Igual que callServerCacheado, pero para las listas PRINCIPALES de cada
   * tabla (apiListarXResumen) — a diferencia de los catálogos, estas sí
   * cambian con el uso normal, así que el caché vence solo a los
   * TTL_LISTAS_MS (15s). Sirve para que entrar-salir-entrar al mismo módulo
   * (o pasar de un módulo a otro y regresar) se sienta instantáneo en vez de
   * volver a pagar el costo de abrir el spreadsheet compartido cada vez.
   * Además, cada crear/editar/eliminar invalida a mano (invalidarCacheLista)
   * la lista de SU PROPIO módulo justo después de guardar — así el cargar()
   * que corre a continuación siempre trae el dato recién guardado, sin
   * esperar el TTL.
   */
  const TTL_LISTAS_MS = 15000;
  const cacheListas = {};
  function callServerListaCacheada(fnName, ...args) {
    const clave = fnName + JSON.stringify(args);
    const entrada = cacheListas[clave];
    if (entrada && (Date.now() - entrada.ts) < TTL_LISTAS_MS) {
      return entrada.promesa;
    }
    const promesa = callServer(fnName, ...args).catch((err) => {
      delete cacheListas[clave]; // si falla, la próxima vez se reintenta en vez de quedar cacheado el error
      throw err;
    });
    cacheListas[clave] = { ts: Date.now(), promesa };
    return promesa;
  }

  /** Borra una entrada de callServerListaCacheada — se llama justo después de
   * crear/editar/eliminar un registro EN ESE MISMO módulo, para que el
   * siguiente cargar() (que corre de inmediato) traiga el dato fresco en vez
   * de esperar a que venzan los 15s. */
  function invalidarCacheLista(fnName, ...args) {
    delete cacheListas[fnName + JSON.stringify(args)];
  }

  /** Igual, pero para callServerCacheado (catálogos de sesión completa) —
   * se usa cuando una acción cambia un dato que otro módulo trae cacheado
   * como catálogo (ej. una reasignación cambia el RESPONSABLE de un
   * vehículo, y apiListarVehiculosBasico lo usan Sensores/Hologramas/etc.). */
  function invalidarCacheCatalogo(fnName, ...args) {
    delete cacheCatalogos[fnName + JSON.stringify(args)];
  }
</script>
