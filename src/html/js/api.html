<script>
  /**
   * api.js — envuelve google.script.run en promesas para poder usar async/await
   * en el resto del código del cliente.
   */
  function callServer(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => reject(new Error(err.message || String(err))))
        [fnName](...args);
    });
  }
</script>
