<script>
  /**
   * api.js — envuelve google.script.run en promesas para poder usar async/await
   * en el resto del código del cliente.
   */
  /**
   * Cuánto tarda cada llamada al servidor (las últimas 300). En la consola del navegador,
   * verTiempos() las resume por función: para saber qué es lo lento antes de optimizar.
   */
  const tiemposServidor = [];
  function verTiempos() {
    const porFuncion = {};
    tiemposServidor.forEach((t) => {
      const f = porFuncion[t.fn] || (porFuncion[t.fn] = { llamadas: 0, total: 0, max: 0, errores: 0 });
      f.llamadas++; f.total += t.ms; f.max = Math.max(f.max, t.ms); if (!t.ok) f.errores++;
    });
    const tabla = Object.keys(porFuncion).map((fn) => ({
      funcion: fn, llamadas: porFuncion[fn].llamadas, promedio_ms: Math.round(porFuncion[fn].total / porFuncion[fn].llamadas),
      max_ms: porFuncion[fn].max, errores: porFuncion[fn].errores,
    })).sort((a, b) => b.promedio_ms * b.llamadas - a.promedio_ms * a.llamadas);
    console.table(tabla);
    return tabla;
  }

  /**
   * El piso de una llamada al servidor: `veces` llamadas seguidas a apiPing, que no hace
   * nada. Lo que tarda es puro viaje + arranque de Apps Script, lo mismo que paga cualquier
   * otra llamada antes de hacer su trabajo. En la consola: await medirPiso()
   */
  async function medirPiso(veces) {
    const ms = [];
    for (let i = 0; i < (veces || 5); i++) {
      const t = performance.now();
      await pedir_('apiPing', []);
      ms.push(Math.round(performance.now() - t));
    }
    const orden = ms.slice().sort((a, b) => a - b);
    const r = { llamadas: ms, minimo_ms: orden[0], mediana_ms: orden[Math.floor(orden.length / 2)] };
    console.log('Piso por llamada: mediana ' + r.mediana_ms + ' ms, mínimo ' + r.minimo_ms + ' ms', ms);
    return r;
  }
  function anotarTiempo_(fn, inicio, ok) {
    tiemposServidor.push({ fn: fn, ms: Math.round(performance.now() - inicio), ok: ok });
    if (tiemposServidor.length > 300) tiemposServidor.shift();
  }

  /**
   * Pedir algo ANTES de que la pantalla lo necesite (p. ej. el Inicio mientras corre la
   * animación de entrada): la siguiente callServer con la misma función y argumentos recibe
   * esa misma respuesta en vez de pedirla otra vez. Se usa una sola vez y caduca en 30 s.
   */
  const adelantadas = {};
  const ADELANTADA_MS = 30 * 1000;
  function adelantar(fnName, ...args) {
    const clave = fnName + JSON.stringify(args);
    const promesa = pedir_(fnName, args);
    promesa.catch(() => { /* si nadie la usa, que no quede como error sin atender */ });
    adelantadas[clave] = { promesa: promesa, ts: Date.now() };
  }

  function callServer(fnName, ...args) {
    const clave = fnName + JSON.stringify(args);
    const adelantada = adelantadas[clave];
    if (adelantada) {
      delete adelantadas[clave];
      if (Date.now() - adelantada.ts < ADELANTADA_MS) return adelantada.promesa;
    }
    return pedir_(fnName, args);
  }

  /**
   * Las llamadas que escriben. Cuando una sale bien se borran las fichas guardadas (la de un
   * vehículo trae lo de 10 módulos: cualquier alta, cambio o baja puede tocarla), así que la
   * siguiente vez que se abra espera lo fresco en vez de enseñar la copia vieja.
   */
  const ESCRIBE = /^api(Crear|Actualizar|Eliminar|Registrar|Subir|Cambiar|Cerrar|Guardar|Marcar|Reactivar|Sincronizar|Reasignar)/;
  const FICHAS_GUARDADAS = ['apiFichaVehiculo', 'apiFichaCajaChica'];

  /**
   * El cupo de Apps Script: unas 30 ejecuciones a la vez POR CUENTA, y la app corre con la de quien despliega
   * (USER_DEPLOYING), así que todas las pestañas de todos comparten ese cupo (y los activadores). Al llenarse, Google
   * rechaza la llamada ANTES de correrla ("Hay demasiadas secuencias de comandos ejecutándose de forma simultánea…", 29-oct),
   * así que reintentarla es seguro aun si escribe. Por eso, aquí:
   *   - cada pestaña tiene a lo más `maxEnVuelo` llamadas en curso; las demás esperan su turno (entrar ya no pide 8-10
   *     cosas de golpe);
   *   - ese error se reintenta solo, tras una espera al azar de hasta `esperas[n]` (azar completo, como recomienda AWS:
   *     si no, las pestañas que fallaron juntas reintentan juntas). En verTiempos() cuenta como `saturado:<fn>`.
   */
  const llamadasConfig = { maxEnVuelo: 4, esperas: [1000, 2000, 4000, 8000] };
  const SATURADO = /demasiadas secuencias|too many scripts|simult[aá]neamente|simultaneous/i;
  let enVuelo = 0;
  const enEspera = [];
  /** Corre `enviar` ya si hay lugar (como siempre: la llamada sale en el momento) o cuando se libere uno */
  function enTurno_(enviar) {
    if (enVuelo < llamadasConfig.maxEnVuelo) {
      enVuelo++;
      enviar();
    } else {
      enEspera.push(enviar);
    }
  }
  function liberar_() {
    const siguiente = enEspera.shift();
    if (siguiente) siguiente();   // el lugar pasa directo al siguiente
    else enVuelo--;
  }

  function pedir_(fnName, args, etiqueta, intento) {   // etiqueta: con qué nombre se anota en verTiempos (la lista, no la envoltura)
    const vez = intento || 0;
    return new Promise((resolve, reject) => enTurno_(() => {
      const inicio = performance.now();
      google.script.run
        .withSuccessHandler((r) => {
          liberar_();
          anotarTiempo_(etiqueta || fnName, inicio, true);
          if (ESCRIBE.test(fnName)) FICHAS_GUARDADAS.forEach(invalidarListasDe);
          resolve(r);
        })
        .withFailureHandler((err) => {
          liberar_();
          const mensaje = err.message || String(err);
          if (SATURADO.test(mensaje) && vez < llamadasConfig.esperas.length) {
            anotarTiempo_('saturado:' + (etiqueta || fnName), inicio, false);
            const tope = llamadasConfig.esperas[vez];
            const piso = Math.min(200, tope);
            setTimeout(() => { pedir_(fnName, args, etiqueta, vez + 1).then(resolve, reject); }, piso + Math.random() * (tope - piso));
            return;
          }
          anotarTiempo_(etiqueta || fnName, inicio, false);
          // Sesión expirada (Auth.validarSesion, server-side): sin importar
          // desde qué pantalla/módulo venga la llamada, se maneja aquí una
          // sola vez — regresa al login con un aviso, en vez de dejar cada
          // pantalla a medias cargar (selects vacíos, etc.) sin explicación.
          if (/sesi[oó]n expirada/i.test(mensaje) && typeof manejarSesionExpirada === 'function') {
            manejarSesionExpirada();
          }
          reject(new Error(mensaje));
        })
        [fnName](...args);
    }));
  }

  /**
   * El lote (29-oct): las llamadas «de fondo» (precargar una lista, el vigía, revalidar una lista que ya se está viendo)
   * no salen solas: se juntan con las que se piden en el mismo instante y viajan como UNA ejecución (apiLote, en
   * ClientApi.gs), así gastan menos del cupo compartido. Cada parte recibe su propia respuesta o su propio error. Lo
   * interactivo (guardar, abrir una ficha, una lista que la persona está esperando) nunca va aquí: en lote esperaría a
   * las demás. Solo lo que esté en LOTE_PERMITIDAS_ del servidor; una llamada sola sale como siempre, sin envoltura.
   */
  const LOTE_MAX = 6;   // el mismo tope que apiLote
  let loteAbierto = null;
  function pedirFondo_(fnName, args, etiqueta) {
    return new Promise((resolve, reject) => {
      if (!loteAbierto) {
        const lote = { pedidos: [] };
        setTimeout(() => { if (loteAbierto === lote) mandarLote_(); }, 0);
        loteAbierto = lote;
      }
      loteAbierto.pedidos.push({ fn: fnName, args: args, etiqueta: etiqueta, resolve: resolve, reject: reject });
      if (loteAbierto.pedidos.length >= LOTE_MAX) mandarLote_();
    });
  }
  function mandarLote_() {
    const lote = loteAbierto;
    loteAbierto = null;
    if (!lote || !lote.pedidos.length) return;
    if (lote.pedidos.length === 1) {
      const p = lote.pedidos[0];
      pedir_(p.fn, p.args, p.etiqueta).then(p.resolve, p.reject);
      return;
    }
    const inicio = performance.now();
    const token = lote.pedidos[0].args[0];
    pedir_('apiLote', [token, lote.pedidos.map((p) => ({ fn: p.fn, args: p.args }))], 'apiLote ×' + lote.pedidos.length)
      .then((respuestas) => lote.pedidos.forEach((p, i) => {
        const r = (respuestas || [])[i] || { ok: false, error: 'El lote no trajo respuesta para ' + p.fn };
        anotarTiempo_(p.etiqueta || p.fn, inicio, !!r.ok);
        if (r.ok) {
          p.resolve(r.v);
          return;
        }
        if (/sesi[oó]n expirada/i.test(r.error) && typeof manejarSesionExpirada === 'function') manejarSesionExpirada();
        p.reject(new Error(r.error));
      }))
      .catch((err) => lote.pedidos.forEach((p) => p.reject(err)));
  }

  /**
   * Igual que callServer, pero para catálogos de referencia que casi nunca
   * cambian (Departamentos, Sedes, Marcas, Razones sociales, Oficinas,
   * Ubicaciones por sede, los 17 reactivos fijos de Arqueos...) — se piden
   * una sola vez por sesión (no una vez por cada visita al módulo, que es
   * lo que pasaba antes: cada navegación a Vehículos/Uber/Tickets/etc.
   * volvía a pedirle lo mismo al servidor). El resultado (o la promesa en
   * curso, para no duplicar la llamada si dos módulos lo piden casi al
   * mismo tiempo) se guarda en memoria; recargar la página limpia la caché
   * sola. A propósito NO se usa para catálogos que sí cambian seguido con
   * el uso normal del sistema (ej. folios de vehículos, solicitantes de
   * tickets) — esos siguen pidiéndose fresco cada vez con callServer.
   */
  /**
   * Almacen: donde viven las copias del navegador (listas y catálogos). IndexedDB, que aguanta
   * cientos de MB; si el navegador no lo deja (modo privado, bloqueado), localStorage (~5 MB
   * para todo el sitio); si tampoco, nada (solo memoria). Todo async, todo por persona (la
   * llave lleva el correo) y se borra al cerrar sesión. Si algo falla, regresa "no hay copia"
   * y se pide al servidor como siempre: nunca truena por esto.
   */
  const Almacen = (function () {
    const BD = 'control-interno';
    const TABLA = 'copias';
    const MAX_LOCAL = 1500000;   // en localStorage (5 MB para todo): lo más grande no se guarda
    let abierta = null;          // Promise<IDBDatabase|null>

    function abrir_() {
      if (abierta) return abierta;
      abierta = new Promise((resolve) => {
        try {
          if (!window.indexedDB) { resolve(null); return; }
          const pet = indexedDB.open(BD, 1);
          pet.onupgradeneeded = () => pet.result.createObjectStore(TABLA);
          pet.onsuccess = () => resolve(pet.result);
          pet.onerror = () => resolve(null);
          pet.onblocked = () => resolve(null);
        } catch (e) { resolve(null); }
      }).then((bd) => {
        // Con IndexedDB, las copias viejas de localStorage (antes vivían ahí) solo ocupan lugar
        if (bd) borrarLocal_((k) => k.indexOf(PREFIJO_LISTAS) === 0 || k.indexOf(PREFIJO_CATALOGOS) === 0);
        return bd;
      });
      return abierta;
    }

    /** Corre fn(tabla) en una transacción; regresa el .result de lo que fn regrese (o undefined si algo falla) */
    function tx_(bd, modo, fn) {
      return new Promise((resolve) => {
        try {
          const t = bd.transaction(TABLA, modo);
          const pet = fn(t.objectStore(TABLA));
          t.oncomplete = () => resolve(pet ? pet.result : undefined);
          t.onerror = () => resolve(undefined);
          t.onabort = () => resolve(undefined);
        } catch (e) { resolve(undefined); }
      });
    }

    function borrarLocal_(prueba) {
      try { Object.keys(localStorage).filter(prueba).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* no-op */ }
    }

    async function leer(llave) {
      const bd = await abrir_();
      if (bd) {
        const v = await tx_(bd, 'readonly', (t) => t.get(llave));
        return typeof v === 'string' ? v : null;
      }
      try { return localStorage.getItem(llave); } catch (e) { return null; }
    }

    async function guardar(llave, texto) {
      const bd = await abrir_();
      if (bd) { await tx_(bd, 'readwrite', (t) => t.put(texto, llave)); return; }
      try {
        if (texto.length <= MAX_LOCAL) localStorage.setItem(llave, texto);
        else localStorage.removeItem(llave);
      } catch (e) { /* no cupo: se queda en memoria */ }
    }

    async function borrar(llave) {
      const bd = await abrir_();
      if (bd) await tx_(bd, 'readwrite', (t) => t.delete(llave));
      try { localStorage.removeItem(llave); } catch (e) { /* no-op */ }
    }

    /** Todo lo que empiece con alguno de los prefijos (al cerrar sesión) */
    async function borrarPrefijos(prefijos) {
      const bd = await abrir_();
      if (bd) {
        await tx_(bd, 'readwrite', (t) => {
          prefijos.forEach((p) => t.delete(IDBKeyRange.bound(p, p + '￿')));
          return null;
        });
      }
      borrarLocal_((k) => prefijos.some((p) => k.indexOf(p) === 0));
    }

    return { leer, guardar, borrar, borrarPrefijos };
  })();

  const PREFIJO_CATALOGOS = 'catalogo:';
  // El token cambia en cada sesión: la llave de lo guardado no lo lleva
  const sinToken_ = (args) => args.filter((a) => typeof state === 'undefined' || a !== state.token);
  const llaveCatalogo_ = (fnName, args) => PREFIJO_CATALOGOS + correoSesion_() + ':' + fnName + JSON.stringify(sinToken_(args));

  /**
   * Catálogos: una vez por carga de página. Si hay copia de una visita anterior se usa AL
   * INSTANTE y se pide lo fresco por detrás (la siguiente vez ya sale lo nuevo); sin copia,
   * se espera al servidor como antes.
   */
  const cacheCatalogos = {};
  function callServerCacheado(fnName, ...args) {
    const clave = fnName + JSON.stringify(args);
    if (!cacheCatalogos[clave]) {
      const llave = llaveCatalogo_(fnName, args);
      const esta = Almacen.leer(llave).then((texto) => {
        const fresco = callServer(fnName, ...args).then((valor) => {
          // Si mientras tanto se invalidó, esta respuesta ya no manda (ni se guarda)
          if (cacheCatalogos[clave] !== esta) return valor;
          Almacen.guardar(llave, JSON.stringify(valor === undefined ? null : valor));
          cacheCatalogos[clave] = Promise.resolve(valor);
          return valor;
        });
        if (texto === null) return fresco;
        fresco.catch(() => { /* por detrás: si falla, se queda la copia */ });
        try { return JSON.parse(texto); } catch (e) { return fresco; }
      }).catch((err) => {
        // si falla, la próxima vez se reintenta en vez de quedar guardado el error
        if (cacheCatalogos[clave] === esta) delete cacheCatalogos[clave];
        throw err;
      });
      cacheCatalogos[clave] = esta;
    }
    return cacheCatalogos[clave];
  }

  /**
   * Las listas PRINCIPALES de cada tabla (apiListarXResumen), con la idea de
   * "pinta con lo que ya tienes y actualiza por detrás" (stale-while-revalidate):
   *
   *   - Si ya hay una copia (en memoria, o en localStorage de una visita anterior,
   *     aunque se haya recargado la página), se devuelve AL INSTANTE.
   *   - Al mismo tiempo se pide lo fresco (salvo que se haya pedido hace menos de
   *     REPEDIR_MS). Si llega distinto, se guarda y se avisa con el evento
   *     "lista-actualizada": el módulo que la esté mostrando se vuelve a pintar
   *     (escucharLista). Si llega igual, no pasa nada.
   *   - Sin copia, se espera al servidor, como antes.
   *
   * Después de crear/editar/eliminar, invalidarCacheLista borra la copia: el
   * cargar() que sigue espera el dato recién guardado, nunca el viejo.
   *
   * La copia en localStorage es por persona (correo) y se borra al cerrar sesión
   * (limpiarListasGuardadas). La llave no incluye el token: cambia en cada sesión.
   */
  const REPEDIR_MS = 15000;
  const PREFIJO_LISTAS = 'lista:';
  const cacheListas = {};        // llave → { valor, texto, ts, promesa, carga }

  const correoSesion_ = () => {
    try { return (state && state.sesion && state.sesion.correo) || ''; } catch (e) { return ''; }
  };
  const llaveLista_ = (fnName, args) => fnName + JSON.stringify(args.slice(1));   // args[0] es el token
  const llaveGuardada_ = (llave) => PREFIJO_LISTAS + correoSesion_() + ':' + llave;

  /** La entrada en memoria de una lista; la primera vez trae su copia del Almacen (carga) */
  function entradaLista_(llave) {
    if (cacheListas[llave]) return cacheListas[llave];
    const entrada = { valor: undefined, texto: null, ts: 0, promesa: null, carga: null };
    entrada.carga = Almacen.leer(llaveGuardada_(llave)).then((texto) => {
      // Si mientras tanto ya llegó lo del servidor, eso manda
      if (texto === null || entrada.texto !== null) return;
      try { entrada.valor = JSON.parse(texto); entrada.texto = texto; } catch (e) { /* copia dañada: se ignora */ }
    });
    return (cacheListas[llave] = entrada);
  }

  /**
   * La lista y su huella: de qué versiones de hoja salió (apiListaConHuella, en el servidor). Con la huella, el vigía
   * sabe si cambió sin volver a pedir la lista. Si la lista ya se había adelantado (adelantar), se usa esa respuesta
   * y la huella llega en la siguiente vuelta del vigía (huella null = todavía no se sabe).
   */
  function pedirConHuella_(fnName, args, fondo) {
    if (adelantadas[fnName + JSON.stringify(args)]) {
      return callServer(fnName, ...args).then((v) => ({ valor: v, huella: null }));
    }
    const pedir = fondo ? pedirFondo_ : pedir_;   // de fondo: en lote con lo que se pida al mismo tiempo
    return pedir('apiListaConHuella', [args[0], fnName, args.slice(1)], fnName).then((r) => ({ valor: r.v, huella: r.huella || {} }));
  }

  /**
   * Lo que una lista NO debe dejar en el navegador (los PIN del índice de Líneas, que el servidor solo le manda a un ADMIN):
   * guardarListaLimpia(fn, limpiar) hace que la copia guardada (y la que se compara) sea limpiar(valor); el valor real
   * solo vive en memoria. Si lo que se pintó salió de la copia y el real trae algo que la copia no, se avisa igual
   * ("lista-actualizada") para que se vuelva a pintar con lo real.
   */
  const LIMPIAR_AL_GUARDAR = {};
  function guardarListaLimpia(fnName, limpiar) { LIMPIAR_AL_GUARDAR[fnName] = limpiar; }

  /** fondo: nadie la está esperando (precarga, vigía, revalidar una lista que ya se ve), así que puede ir en lote */
  function pedirLista_(fnName, args, llave, fondo) {
    const entrada = entradaLista_(llave);
    if (entrada.promesa) return entrada.promesa;
    entrada.fn = fnName;
    entrada.args = args;
    entrada.promesa = entrada.carga.then(() => {
      const teniaCopia = entrada.texto !== null;
      return pedirConHuella_(fnName, args, fondo).then(({ valor, huella }) => {
        const limpiar = LIMPIAR_AL_GUARDAR[fnName];
        const guardable = limpiar ? limpiar(valor) : valor;
        const texto = JSON.stringify(guardable === undefined ? null : guardable);
        const cambio = texto !== entrada.texto || (guardable !== valor && !entrada.real);
        Object.assign(entrada, { valor: valor, texto: texto, ts: Date.now(), promesa: null, huella: huella, real: true });
        Almacen.guardar(llaveGuardada_(llave), texto);
        if (cambio && teniaCopia) {
          window.dispatchEvent(new CustomEvent('lista-actualizada', { detail: { fn: fnName } }));
        }
        return valor;
      });
    }).catch((err) => {
      entrada.promesa = null;   // si falla, la próxima vez se reintenta
      throw err;
    });
    return entrada.promesa;
  }

  async function callServerListaCacheada(fnName, ...args) {
    const llave = llaveLista_(fnName, args);
    const entrada = entradaLista_(llave);
    await entrada.carga;
    if (entrada.texto === null) return pedirLista_(fnName, args, llave);   // la persona la está esperando: sola
    if (!entrada.promesa && Date.now() - entrada.ts > REPEDIR_MS) {
      // Ya ve la copia: lo fresco puede ir en lote
      pedirLista_(fnName, args, llave, true).catch(() => { /* por detrás: si falla, se queda la copia */ });
    }
    return entrada.valor;
  }

  /**
   * Vuelve a llamar a `recargar` cuando la lista `fnName` llegue distinta de lo que se
   * pintó. Deja de escuchar sola en cuanto `elemento` ya no está en la página (se
   * navegó a otro módulo).
   */
  function escucharLista(fnName, recargar, elemento) {
    const alActualizar = (ev) => {
      if (!elemento || !document.body.contains(elemento)) { window.removeEventListener('lista-actualizada', alActualizar); return; }
      if (ev.detail && ev.detail.fn === fnName) recargar();
    };
    window.addEventListener('lista-actualizada', alActualizar);
    listasEnPantalla.push({ fn: fnName, elemento: elemento });
  }

  /**
   * El vigía: que la pantalla abierta se actualice sola cuando alguien más cambia sus datos (otra persona en la
   * app, otro módulo que copia datos, o alguien a mano en la hoja: AvisoDeCambios.gs). Cada VIGIA_MS, y solo con la
   * pestaña a la vista, pregunta por las listas que una pantalla está escuchando (escucharLista) si cambió alguna de
   * las versiones de su huella (apiHuellasVigentes: solo CacheService, ninguna hoja). Si cambió, pide esa lista; al
   * llegar distinta, "lista-actualizada" la vuelve a pintar como ya pasaba.
   *   - huella null (se usó una respuesta adelantada): se pide en la siguiente vuelta para tener huella.
   *   - huella vacía (la lista no sale de CacheHojas): se vuelve a pedir completa cada SIN_HUELLA_MS.
   */
  const VIGIA_MS = 60 * 1000;
  const SIN_HUELLA_MS = 5 * 60 * 1000;
  const listasEnPantalla = [];   // { fn, elemento } de escucharLista; se limpian cuando el elemento sale de la página
  let ultimaVigia = 0;

  function listasALaVista_() {
    for (let i = listasEnPantalla.length - 1; i >= 0; i--) {
      const el = listasEnPantalla[i].elemento;
      if (!el || !document.body.contains(el)) listasEnPantalla.splice(i, 1);
    }
    return new Set(listasEnPantalla.map((l) => l.fn));
  }

  const tokenActual_ = () => (typeof state !== 'undefined' && state && state.token) || '';
  /** Las listas a la vista con huella: [llave, entrada] */
  function listasConHuella_() {
    const vistas = listasALaVista_();
    return Object.keys(cacheListas).map((k) => [k, cacheListas[k]])
      .filter(([, e]) => e.fn && vistas.has(e.fn) && !e.promesa && e.texto !== null && e.huella && Object.keys(e.huella).length);
  }
  /** Vuelve a pedir (de fondo, en lote) una lista que el vigía vio cambiar */
  function repedirLista_(k, e) {
    pedirLista_(e.fn, [tokenActual_()].concat(e.args.slice(1)), k, true).catch(() => { /* se queda lo que hay */ });
  }
  /** Con las versiones vigentes, repide las listas a la vista que cambiaron. → cuántas */
  function aplicarVigentes_(vigentes) {
    // Sin ninguna clave: el servidor no pudo leer las versiones (CacheService lento). No se sabe si algo cambió, así que
    // no se repide nada (si no, una falla de Google haría que todas las pantallas pidieran todo a la vez)
    if (!vigentes || !Object.keys(vigentes).length || !tokenActual_()) return 0;
    let pedidas = 0;
    listasConHuella_().forEach(([k, e]) => {
      const propias = Object.keys(e.huella).filter((c) => c in vigentes);
      if (propias.some((c) => vigentes[c] !== e.huella[c])) {
        pedidas++;
        repedirLista_(k, e);
      }
    });
    return pedidas;
  }

  async function vigilarListas(forzar) {
    const token = tokenActual_();
    if (!token || document.hidden) return 0;
    if (!forzar && Date.now() - ultimaVigia < VIGIA_MS - 1000) return 0;
    ultimaVigia = Date.now();
    const vistas = listasALaVista_();
    let pedidas = 0;
    // Sin huella (adelantada) o con huella vacía: lo de cada pestaña, como siempre
    Object.keys(cacheListas).map((k) => [k, cacheListas[k]])
      .filter(([, e]) => e.fn && vistas.has(e.fn) && !e.promesa && e.texto !== null)
      .forEach(([k, e]) => {
        if (e.huella === null || e.huella === undefined) { pedidas++; repedirLista_(k, e); }
        else if (!Object.keys(e.huella).length && Date.now() - e.ts > SIN_HUELLA_MS) { pedidas++; repedirLista_(k, e); }
      });
    const conHuella = listasConHuella_();
    if (!conHuella.length) return pedidas;
    const claves = Array.from(new Set([].concat(...conHuella.map(([, e]) => Object.keys(e.huella)))));
    // Con varias pestañas: una sola pregunta por todas (la vigía); esta solo dice qué claves le interesan
    if (VigiaCompartido.publicar(claves)) return pedidas;
    let vigentes;
    try {
      vigentes = await pedirFondo_('apiHuellasVigentes', [token, claves]);
    } catch (err) {
      return pedidas;   // sin red o sesión vencida: se intenta en la siguiente vuelta
    }
    return pedidas + aplicarVigentes_(vigentes);
  }

  /**
   * Un solo vigía por navegador (29-oct): con varias pestañas abiertas, cada una preguntaba cada minuto (una ejecución
   * por pestaña del cupo compartido). Ahora la pestaña que tiene el candado `vigia:<correo>` (Web Locks: si se cierra,
   * la siguiente lo toma sola) junta las claves que le publican las demás a la vista (BroadcastChannel), pregunta UNA
   * vez y les manda las versiones; cada una repide solo lo suyo. Sin Web Locks o BroadcastChannel (o sin sesión), cada
   * pestaña pregunta sola, como antes. Las versiones de hoja no son de nadie: la vigía pregunta con su propio token.
   */
  const VigiaCompartido = (function () {
    const soportado = () => typeof navigator !== 'undefined' && navigator.locks && typeof navigator.locks.request === 'function' &&
      typeof BroadcastChannel === 'function';
    const yo = Math.random().toString(36).slice(2);
    let canal = null;
    let nombre = '';
    let soyVigia = false;
    let soltar = null;
    let interval = null;
    const pedidas = {};   // pestaña → { claves, ts }

    function conectar_() {
      const correo = correoSesion_();
      if (!soportado() || !correo || !tokenActual_()) return false;
      const n = 'vigia:' + correo;
      if (n === nombre && canal) return true;
      desconectar();
      nombre = n;
      canal = new BroadcastChannel(n);
      canal.onmessage = (ev) => {
        const m = (ev && ev.data) || {};
        if (m.tipo === 'claves' && soyVigia && Array.isArray(m.claves)) pedidas[m.de] = { claves: m.claves, ts: Date.now() };
        if (m.tipo === 'vigentes' && m.vigentes && typeof m.vigentes === 'object') aplicarVigentes_(m.vigentes);
      };
      navigator.locks.request(n, () => new Promise((listo) => {
        if (nombre !== n) { listo(); return; }   // ya se desconectó mientras esperaba
        soyVigia = true;
        soltar = listo;
        interval = setInterval(consultar_, VIGIA_MS);
      })).catch(() => { /* sin candado: sigue publicando */ });
      return true;
    }

    /** La vigía: una sola pregunta con las claves de todas las pestañas a la vista (las de los últimos dos minutos) */
    async function consultar_() {
      const ahora = Date.now();
      const todas = new Set();
      Object.keys(pedidas).forEach((k) => {
        if (ahora - pedidas[k].ts > 2 * VIGIA_MS) delete pedidas[k];
        else pedidas[k].claves.forEach((c) => todas.add(c));
      });
      const token = tokenActual_();
      if (!todas.size || !token || !canal) return;
      let vigentes;
      try {
        vigentes = await pedirFondo_('apiHuellasVigentes', [token, Array.from(todas).slice(0, 300)]);
      } catch (err) {
        return;   // sesión vencida: manejarSesionExpirada cierra aquí y el candado pasa a otra
      }
      if (canal) canal.postMessage({ tipo: 'vigentes', vigentes: vigentes });   // a las demás (BroadcastChannel no se avisa a sí misma)
      aplicarVigentes_(vigentes);
    }

    /** Las claves de esta pestaña. → true si las atiende la vigía (no hay que preguntar aquí) */
    function publicar(claves) {
      if (!conectar_()) return false;
      if (soyVigia) pedidas[yo] = { claves: claves, ts: Date.now() };
      else canal.postMessage({ tipo: 'claves', de: yo, claves: claves });
      return true;
    }

    /** Al cerrar sesión: suelta el candado (otra pestaña toma el relevo) y cierra el canal */
    function desconectar() {
      if (interval) clearInterval(interval);
      interval = null;
      if (soltar) soltar();
      soltar = null;
      soyVigia = false;
      if (canal) canal.close();
      canal = null;
      nombre = '';
      Object.keys(pedidas).forEach((k) => { delete pedidas[k]; });
    }

    return { publicar, desconectar, esVigia: () => soyVigia, consultar: consultar_ };
  })();

  setInterval(() => { vigilarListas(false); }, VIGIA_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) vigilarListas(false); });

  /** Pide por detrás, sin pintar nada, para que el módulo abra al instante (precarga al entrar) */
  function precargarLista(fnName, ...args) {
    return pedirLista_(fnName, args, llaveLista_(fnName, args), true).catch(() => null);
  }

  /** Borra una entrada de callServerListaCacheada — se llama justo después de
   * crear/editar/eliminar un registro EN ESE MISMO módulo, para que el
   * siguiente cargar() (que corre de inmediato) espere el dato fresco. */
  function invalidarCacheLista(fnName, ...args) {
    const llave = llaveLista_(fnName, args);
    // Una entrada vacía y ya "cargada": el cargar() que sigue no lee la copia vieja del Almacen
    // aunque su borrado todavía no termine; espera al servidor
    cacheListas[llave] = { valor: undefined, texto: null, ts: 0, promesa: null, carga: Promise.resolve() };
    Almacen.borrar(llaveGuardada_(llave));
  }

  /** invalidarCacheLista de todas las variantes de una función (p. ej. con distinto límite) */
  function invalidarListasDe(fnName) {
    Object.keys(cacheListas).filter((k) => k.indexOf(fnName + '[') === 0).forEach((k) => {
      cacheListas[k] = { valor: undefined, texto: null, ts: 0, promesa: null, carga: Promise.resolve() };
      Almacen.borrar(llaveGuardada_(k));
    });
  }

  /** Al cerrar sesión: que en una computadora compartida no quede nada guardado */
  function limpiarListasGuardadas() {
    VigiaCompartido.desconectar();   // si era la vigía, otra pestaña toma el relevo
    Object.keys(cacheListas).forEach((k) => { delete cacheListas[k]; });
    Object.keys(cacheCatalogos).forEach((k) => { delete cacheCatalogos[k]; });
    return Almacen.borrarPrefijos([PREFIJO_LISTAS, PREFIJO_CATALOGOS]);
  }

  /** Igual, pero para callServerCacheado (catálogos de sesión completa) —
   * se usa cuando una acción cambia un dato que otro módulo trae cacheado
   * como catálogo (ej. una reasignación cambia el RESPONSABLE de un
   * vehículo, y apiListarVehiculosBasico lo usan Sensores/Hologramas/etc.). */
  function invalidarCacheCatalogo(fnName, ...args) {
    delete cacheCatalogos[fnName + JSON.stringify(args)];
    Almacen.borrar(llaveCatalogo_(fnName, args));
  }
</script>
