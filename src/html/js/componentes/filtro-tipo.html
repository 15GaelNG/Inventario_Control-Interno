<style>
  /* Filtro rápido por tipo / clase / estatus: franja de íconos a la izquierda de la tabla que se despliega con el mouse
     (o el teclado) POR ENCIMA de la tabla, como el menú lateral de Gmail; la tabla no se mueve. Retraso corto al entrar
     (que no se abra solo por cruzarla) y un poco más al salir (que no se cierre al rozar el borde). Nació en Líneas. */
  .con-filtro-tipo { display: flex; align-items: stretch; gap: 10px; }
  .con-filtro-tipo-tabla { flex: 1; min-width: 0; }
  .filtro-tipo { flex: 0 0 44px; position: relative; z-index: 6; }
  .filtro-tipo:empty { display: none; }
  .filtro-tipo-panel { position: absolute; top: 0; left: 0; width: 44px; display: flex; flex-direction: column; gap: 2px;
    padding: 0 4px 6px; overflow: hidden; background: var(--color-surface); border-right: 1px solid var(--color-border);
    border-radius: 0 var(--radio-xl) var(--radio-xl) 0; transition: width .2s cubic-bezier(.2, 0, 0, 1) .3s, box-shadow .2s ease .3s, border-color .2s ease .3s; }
  .filtro-tipo:hover .filtro-tipo-panel, .filtro-tipo:focus-within .filtro-tipo-panel {
    width: 214px; border-color: transparent; box-shadow: var(--shadow-lg); transition-delay: .12s; }
  .filtro-tipo-titulo { height: 28px; display: flex; align-items: center; padding: 0 8px 0 10px; font-size: var(--texto-xs); font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-muted); white-space: nowrap; }
  .filtro-tipo-item { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 200px; min-height: 32px; padding: 5px 10px 5px 10px;
    border: none; border-radius: var(--radio-m); background: transparent; color: var(--color-text); font-size: var(--texto-s); font-weight: 500;
    text-align: left; cursor: pointer; transition: background-color .15s; }
  .filtro-tipo-item:hover { background: var(--color-bg); }
  .filtro-tipo-item.activo { background: var(--color-primary-soft); font-weight: 600; }
  .filtro-tipo-item:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .filtro-tipo-ico { display: inline-flex; flex-shrink: 0; color: var(--color-text-muted); }
  .filtro-tipo-ico .ico { width: 16px; height: 16px; }
  .filtro-tipo-nombre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filtro-tipo-num { flex-shrink: 0; color: var(--color-text-muted); font-size: var(--texto-s); font-weight: 500; font-variant-numeric: tabular-nums; }
  .filtro-tipo-item-vacio .filtro-tipo-nombre, .filtro-tipo-item-vacio .filtro-tipo-num { color: var(--color-text-muted); }
  /* Recogida: solo los íconos (los textos se desvanecen; el nombre y el conteo siguen en el title) */
  .filtro-tipo-titulo, .filtro-tipo-nombre, .filtro-tipo-num { opacity: 0; transition: opacity .12s ease .3s; }
  .filtro-tipo:hover .filtro-tipo-titulo, .filtro-tipo:hover .filtro-tipo-nombre, .filtro-tipo:hover .filtro-tipo-num,
  .filtro-tipo:focus-within .filtro-tipo-titulo, .filtro-tipo:focus-within .filtro-tipo-nombre, .filtro-tipo:focus-within .filtro-tipo-num {
    opacity: 1; transition-delay: .2s; }
  @media (prefers-reduced-motion: reduce) {
    .filtro-tipo-panel, .filtro-tipo-titulo, .filtro-tipo-nombre, .filtro-tipo-num { transition-duration: 0s; }
  }
</style>

<script>
  /**
   * FiltroTipo — la franja de íconos a la izquierda de una tabla para filtrar por tipo, clase o estatus (Vehículos,
   * Incidencias, Uber, Caja Chica, Líneas). La vista deja el contenedor:
   *   <div class="con-filtro-tipo"><nav class="filtro-tipo" id="veh-clases" aria-label="Filtrar por clase"></nav>
   *     <div class="con-filtro-tipo-tabla">…la tabla…</div></div>
   *
   *   const clases = FiltroTipo.crear(document.getElementById('veh-clases'), {
   *     titulo: 'Clase', todos: 'Todas',
   *     campo: 'CLASE',                      // de dónde sale el valor de cada fila (en mayúsculas); o valorDe: (fila) => …
   *     orden: ['AUTOMOVIL', …],             // estos primero (aunque vengan en 0) y luego los demás que aparezcan
   *     estilos: CLASE_ESTILO,               // { VALOR: { icono, color } }; o estilo: (valor) => …
   *     nombre: (valor) => NOMBRE[valor],    // lo que se lee (si no, el valor)
   *     alElegir: (valor) => tabla.setFiltro('CLASE', valor ? { valores: [valor] } : null),   // null = todos
   *   });
   *   clases.pintar(filas)                   // o pintar({ conteo: { VALOR: n }, total, valores }) si ya viene contado
   *   clases.marcar(filtros.CLASE)           // el filtro de esa columna en la tabla (DataTable): marca lo elegido
   *
   * Un clic en el elegido (o en «Todas») quita el filtro. Prueba: tests/filtro-tipo.test.js.
   */
  const FiltroTipo = (function () {
    const esc = Formato.esc;
    const SIN_ESTILO = { icono: 'circle', color: '' };

    function crear(cont, opciones) {
      const o = opciones || {};
      const valorDe = o.valorDe || ((fila) => String(fila[o.campo] || '').toUpperCase());
      const estilo = o.estilo || ((v) => (o.estilos && o.estilos[v]) || SIN_ESTILO);
      const nombre = o.nombre || ((v) => v);
      let elegidos = null;

      const boton = (valor, icono, color, texto, n) =>
        '<button type="button" class="filtro-tipo-item' + (n ? '' : ' filtro-tipo-item-vacio') + '" data-valor="' + esc(valor) +
        '" aria-pressed="false" title="' + esc(texto + ' · ' + Formato.miles(n)) + '">' +
        '<span class="filtro-tipo-ico"' + (color ? ' style="color:' + esc(color) + '"' : '') + '>' + Iconos.svg(icono) + '</span>' +
        '<span class="filtro-tipo-nombre">' + esc(texto) + '</span><span class="filtro-tipo-num">' + Formato.miles(n) + '</span></button>';

      function pintar(datos) {
        let conteo = {};
        let total = 0;
        let valores;
        if (Array.isArray(datos)) {
          datos.forEach((f) => { const v = valorDe(f); conteo[v] = (conteo[v] || 0) + 1; });
          total = datos.length;
        } else {
          conteo = datos.conteo || {};
          total = datos.total;
          valores = datos.valores;
        }
        const orden = o.orden || [];
        valores = valores || orden.concat(Object.keys(conteo).filter((v) => v && orden.indexOf(v) < 0));
        cont.innerHTML = '<div class="filtro-tipo-panel"><div class="filtro-tipo-titulo">' + esc(o.titulo || '') + '</div>' +
          boton('*', 'layers', '', o.todos || 'Todos', total) +
          valores.map((v) => { const e = estilo(v) || SIN_ESTILO; return boton(v, e.icono || 'circle', e.color || '', nombre(v), conteo[v] || 0); }).join('') +
          '</div>';
        marcarBotones();
      }

      function marcarBotones() {
        cont.querySelectorAll('.filtro-tipo-item').forEach((b) => {
          const activo = b.dataset.valor === '*' ? !elegidos : !!(elegidos && elegidos.indexOf(b.dataset.valor) >= 0);
          b.classList.toggle('activo', activo);
          b.setAttribute('aria-pressed', String(activo));
        });
      }

      /** filtro: el de la columna en la tabla ({ valores: […] }), o un arreglo de valores, o null */
      function marcar(filtro) {
        const v = Array.isArray(filtro) ? filtro : filtro && filtro.valores;
        elegidos = v && v.length ? v : null;
        marcarBotones();
      }

      cont.addEventListener('click', (ev) => {
        const b = ev.target.closest('.filtro-tipo-item');
        if (!b || !o.alElegir) return;
        const v = b.dataset.valor;
        o.alElegir(v === '*' || b.classList.contains('activo') ? null : v);
      });

      return { pintar, marcar };
    }

    return { crear };
  })();
</script>
