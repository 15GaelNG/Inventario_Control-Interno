<script>
  /**
   * FolioNucco — el par de campos Folio / Nucco para elegir un vehículo.
   * Requiere CampoAuto.
   *
   * Por qué existe: Incidencias, Reasignaciones, Sensores y Verificaciones traían cada uno
   * su copia de lo mismo (resolver el vehículo con cualquiera de los dos y poner el otro).
   * Una sola copia: si cambia cómo se busca un vehículo, cambia aquí.
   *
   * Regla del sistema: todo formulario que pide un vehículo ofrece el Nucco (es lo que más se
   * usa), primero, y el Folio al lado. Con Formulario basta buscar.nucco (ver formulario.html);
   * un formulario escrito a mano usa ligar() + opcionesLista() con un Combobox.
   *
   * Los dos campos son INDEPENDIENTES (uno no va dentro del otro): escribir en cualquiera
   * resuelve el vehículo y pone el valor que le corresponde al otro, con la etiqueta "auto".
   * Si no hay coincidencia no se borra nada (se sigue escribiendo). Lo que se guarda es FOLIO.
   *
   * ─── USO ──────────────────────────────────────────────────────────────────────────
   *   const porClave = FolioNucco.indexar(vehiculos);        // { AUT0100: v, '12': v, … }
   *   datalistNucco.innerHTML = FolioNucco.opcionesNucco(vehiculos);
   *   FolioNucco.ligar('inc-folio', 'inc-nucco', {
   *     buscar: (texto) => porClave[texto],     // vehículo o nada
   *     alResolver: (vehiculo) => {},          // opcional: autollenar lo demás (null = no hay)
   *     dispararFolio: true,                   // opcional: al resolver por Nucco, lanzar 'input'
   *   });                                      // en el Folio (para que su buscador corra)
   *   Combobox.crear(campoNucco, { opciones: FolioNucco.opcionesLista(vehiculos) });
   *                                            // [{ valor: '24', etiqueta: 'AUT0024 · GGY886F · CHEVROLET' }]
   *
   *   Todo junto, para un formulario escrito a mano (listas en los dos campos, índice y ligado):
   *   const par = FolioNucco.montar('editar-folio', 'editar-nucco', () => callServerCacheado('apiListarVehiculosBasico', token));
   *   par.sincronizar();                       // al abrir un registro: el Nucco de su folio
   *
   * Los vehículos son los de apiListarVehiculosBasico: FOLIO, NUCO (sin doble C), MARCA…
   */
  const FolioNucco = (function () {
    const elementoDe = (el) => (typeof el === 'string' ? document.getElementById(el) : el);
    const esc = (s) => String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    /** Una entrada por FOLIO y otra por NUCO, las dos al mismo vehículo. */
    function indexar(vehiculos, destino) {
      const porClave = destino || {};
      (vehiculos || []).forEach((v) => {
        porClave[v.FOLIO] = v;
        if (v.NUCO) porClave[v.NUCO] = v;
      });
      return porClave;
    }

    /** <option> del datalist de Nucco, en orden (1, 2, 3…) y no en el del catálogo. */
    function opcionesNucco(vehiculos, conEtiqueta) {
      return (vehiculos || []).filter((v) => v.NUCO)
        .sort((a, b) => Number(a.NUCO) - Number(b.NUCO))
        .map((v) => `<option value="${esc(v.NUCO)}">` +
          (conEtiqueta ? esc([v.MARCA, v.LINEA_VEHICULO].filter(Boolean).join(' ')) : '') + '</option>')
        .join('');
    }

    /** Opciones del Combobox del Nucco, en orden numérico, con folio y placa para reconocer la unidad. */
    function opcionesLista(vehiculos) {
      return (vehiculos || []).filter((v) => v.NUCO)
        .sort((a, b) => Number(a.NUCO) - Number(b.NUCO))
        .map((v) => ({ valor: String(v.NUCO), etiqueta: [v.FOLIO, v.PLACA, v.MARCA].filter(Boolean).join(' · ') }));
    }

    function ligar(folio, nucco, opciones) {
      folio = elementoDe(folio);
      nucco = elementoDe(nucco);
      if (!folio || !nucco) return;
      const o = opciones || {};
      let propagando = false;   // el 'input' que lanzamos nosotros en el Folio no vuelve a llenar el Nucco
      folio.addEventListener('input', () => {
        if (propagando) return;
        const v = o.buscar(folio.value.trim());
        if (v) CampoAuto.llenar(nucco, v.NUCO || '');
        else CampoAuto.quitar(nucco);
        if (o.alResolver) o.alResolver(v || null);
      });
      nucco.addEventListener('input', () => {
        const v = o.buscar(nucco.value.trim());
        if (v) {
          CampoAuto.llenar(folio, v.FOLIO);
          if (o.dispararFolio) {
            propagando = true;
            try { folio.dispatchEvent(new Event('input', { bubbles: true })); } finally { propagando = false; }
          }
        } else {
          CampoAuto.quitar(folio);
        }
        if (o.alResolver) o.alResolver(v || null);
      });
    }

    /**
     * Listas (Combobox) en los dos campos, índice y ligado, con los vehículos que traiga
     * cargarVehiculos(). opciones: alResolver, dispararFolio (como en ligar).
     * Regresa { listo, sincronizar }: sincronizar() pone (o quita) el Nucco del folio que ya
     * tiene el campo, p. ej. al abrir un registro para editarlo.
     */
    function montar(folio, nucco, cargarVehiculos, opciones) {
      folio = elementoDe(folio);
      nucco = elementoDe(nucco);
      // Sin los campos (p. ej. la vista no los pinta para solo lectura) no hay nada que montar
      if (!folio || !nucco) return { listo: Promise.resolve([]), sincronizar: () => Promise.resolve() };
      const o = opciones || {};
      const porClave = {};
      // Si el catálogo no carga, los dos campos siguen funcionando como texto libre (sin lista)
      const listo = Promise.resolve().then(cargarVehiculos).then((vehiculos) => {
        indexar(vehiculos, porClave);
        Combobox.crear(nucco, { opciones: opcionesLista(vehiculos) });
        Combobox.crear(folio, {
          opciones: (vehiculos || []).map((v) => ({ valor: v.FOLIO, etiqueta: [v.PLACA, v.MARCA, v.LINEA_VEHICULO].filter(Boolean).join(' · ') })),
        });
        return vehiculos;
      }).catch(() => []);
      ligar(folio, nucco, { buscar: (texto) => porClave[texto], alResolver: o.alResolver, dispararFolio: o.dispararFolio });
      return {
        listo,
        sincronizar: () => listo.then(() => {
          const v = porClave[folio.value.trim()];
          CampoAuto.llenar(nucco, v && v.NUCO ? v.NUCO : '');
        }),
      };
    }

    return { indexar, opcionesNucco, opcionesLista, ligar, montar };
  })();
</script>
