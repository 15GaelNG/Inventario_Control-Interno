          textoConfirmar: n === 1 ? 'Eliminar' : `Eliminar ${n}`,
          peligro: true,
          palabraClave: n >= cfg.umbralPalabraClave ? 'ELIMINAR' : null,
        });
        if (!ok) return;

        await conBotonOcupado(boton, 'Eliminando…', async () => {
          try {
            await cfg.alEliminar(filas);
            const ids = new Set(filas.map(idDe));
            st.datos = st.datos.filter((f) => !ids.has(idDe(f)));
            ids.forEach((id) => st.seleccion.delete(id));
            if (ids.has(st.ancla)) st.ancla = null;
            st.historial = st.historial.filter((e) => !ids.has(e.id));
            if (panel && ids.has(st.detalleId)) cerrarPanel();
            render();
            Notificar.exito(`${n} ${plural(n, 'registro')} ${plural(n, 'eliminado')}`);
          } catch (err) {
            Notificar.error('No se eliminó: ' + err.message);
          }
        });
      }

      /** Seleccionados como texto separado por tabuladores (se pega en Excel en columnas) */
      function textoSeleccion() {
        const cols = columnasVisibles().filter((c) => c.exportable);
        const filas = filasFiltradas().filter((f) => st.seleccion.has(idDe(f)));
        const limpiar = (t) => String(t).replace(/[\t\r\n]+/g, ' ');
        return [cols.map((c) => limpiar(c.titulo)).join('\t')]
          .concat(filas.map((f) => cols.map((c) => limpiar(c.valorExportar ? c.valorExportar(f) : textoVisible(c, f))).join('\t')))
          .join('\n');
      }

      async function copiarAlPortapapeles(texto) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(texto); return true; }
        } catch (e) { /* el marco de Apps Script puede bloquear la API: usar el método clásico */ }
        const area = document.createElement('textarea');
        area.value = texto;
        area.setAttribute('readonly', '');
        area.style.cssText = 'position:fixed;top:-1000px;opacity:0';
        document.body.appendChild(area);
        area.select();
        let copiado = false;
        try { copiado = document.execCommand('copy'); } catch (e) { copiado = false; }
        area.remove();
        return copiado;
      }

      async function copiarSeleccion() {
        const n = st.seleccion.size;
        if (!n) return '';
        const texto = textoSeleccion();
        if (await copiarAlPortapapeles(texto)) Notificar.exito(`${n} ${plural(n, 'registro')} ${plural(n, 'copiado')}: pégalos en Excel`);
        else Notificar.error('El navegador no permitió copiar. Usa "Exportar a Excel".');
        return texto;
      }

      async function exportarExcel(boton) {
        const cols = columnasVisibles().filter((c) => c.exportable);
        const filas = filasFiltradas();
        if (!filas.length) { Notificar.error('No hay registros para exportar con los filtros actuales'); return; }
        await conBotonOcupado(boton, 'Exportando…', async () => {
          try {
            await ExportarExcel.descargar({
              nombreArchivo: cfg.exportar.nombreArchivo,
              nombreHoja: cfg.exportar.nombreHoja,
              columnas: cols.map((c) => ({ titulo: c.titulo, tipo: tipoDe(c).exportarComo })),
              filas: filas.map((fila) => cols.map((c) => (c.valorExportar ? c.valorExportar(fila) : valorDe(c, fila)))),
            });
            Notificar.exito(`${filas.length} ${plural(filas.length, 'registro')} ${plural(filas.length, 'exportado')}`);
          } catch (err) {
            Notificar.error('No se pudo exportar: ' + err.message);
          }
        });
        render();   // el botón vuelve a su estado según haya datos o no
      }

      // =====================================================================
      // 10. Panel lateral de detalle
      // =====================================================================
      const hayEditorEnPanel = () => !!(panel && panel.elemento.querySelector('.dt-campo-valor input, .dt-campo-valor select'));

      function cerrarPanel() {
        if (!panel) return;
        panel.fondo.remove();
        panel.elemento.remove();
        document.removeEventListener('keydown', panel.alTecla, true);
        const foco = panel.focoPrevio;
        panel = null;
        st.detalleId = null;
        if (foco && document.body.contains(foco)) foco.focus();
      }

      function abrirPanel(id) {
        cerrarPopover();
        const focoPrevio = document.activeElement;
        if (panel) cerrarPanel();
        st.detalleId = id;

        const fondo = document.createElement('div');
        fondo.className = 'dt-panel-fondo';
        const elemento = document.createElement('aside');
        elemento.className = 'dt-panel';
        elemento.setAttribute('role', 'dialog');
        elemento.setAttribute('aria-modal', 'true');
        document.body.append(fondo, elemento);

        // Esc cierra el panel, salvo que se esté editando un campo (ese Esc cancela la edición)
        const alTecla = (ev) => {
          if (ev.key === 'Escape' && !hayEditorEnPanel()) { ev.stopPropagation(); cerrarPanel(); }
        };
        document.addEventListener('keydown', alTecla, true);
        fondo.addEventListener('click', cerrarPanel);
        panel = { fondo, elemento, alTecla, focoPrevio };
        pintarPanel();
        const cerrar = elemento.querySelector('.dt-panel-cerrar');
        if (cerrar) cerrar.focus();
      }

      function refrescarPanel() {
        if (panel && !hayEditorEnPanel()) pintarPanel();
      }

      function htmlCampoDetalle(col, fila) {
        const contenido = col.render
          ? col.render(valorDe(col, fila), fila)
          : (esc(textoVisible(col, fila)) || '<span style="color:var(--color-text-muted)">—</span>');
        return `<div class="dt-campo" data-campo="${esc(col.campo)}">
          <div class="dt-campo-titulo">${esc(col.titulo)}</div>
          <div class="dt-campo-valor"><span class="dt-campo-texto">${contenido}</span>
            ${puedeEditarPanel(col) ? `<button type="button" class="secondary dt-btn-editar-campo" aria-label="Editar ${esc(col.titulo)}">${ic('editar')} Editar</button>` : ''}
          </div>
        </div>`;
      }

      function pintarPanel() {
        if (!panel) return;
        const fila = filaPorId(st.detalleId);
        if (!fila) { cerrarPanel(); return; }
        const opciones = cfg.detalle || {};
        const titulo = opciones.titulo ? opciones.titulo(fila) : etiquetaDe(fila);

        // Vacío y no editable → al grupo plegado; lo editable se queda a la vista aunque esté
        // vacío, porque justo para llenarlo se abre el detalle
        const vacio = (col) => { const v = valorDe(col, fila); return v === '' || v === null || v === undefined; };
        const enDetalle = columnas.filter((c) => c.enDetalle);
        const sinDato = enDetalle.filter((c) => vacio(c) && !puedeEditarPanel(c));
        const conDato = enDetalle.filter((c) => sinDato.indexOf(c) === -1);
        panel.elemento.setAttribute('aria-label', titulo);
        panel.elemento.innerHTML = `
          <div class="dt-panel-header">
            <div><h3>${esc(titulo)}</h3><p>Detalle del registro</p></div>
            ${botonIcono('modal-close dt-panel-cerrar', 'cerrar', 'Cerrar')}
          </div>
          <div class="dt-panel-cuerpo">
            ${opciones.extraPrimero ? '<div class="dt-panel-extra dt-extra-primero"></div>' : ''}
            ${conDato.map((col) => htmlCampoDetalle(col, fila)).join('')}
            ${sinDato.length ? `<details class="dt-campos-vacios"><summary>${sinDato.length} ${sinDato.length === 1 ? 'campo' : 'campos'} sin dato</summary>
              ${sinDato.map((col) => htmlCampoDetalle(col, fila)).join('')}</details>` : ''}
            ${opciones.extraPrimero ? '' : '<div class="dt-panel-extra"></div>'}
          </div>
          <div class="dt-panel-pie">${cfg.alEliminar ? `<button type="button" class="danger dt-btn-eliminar-detalle">${ic('eliminar')} Eliminar registro</button>` : ''}</div>`;

        const el = panel.elemento;
        el.querySelector('.dt-panel-cerrar').addEventListener('click', cerrarPanel);
        el.querySelectorAll('.dt-btn-editar-campo').forEach((btn) => {
          btn.addEventListener('click', () => editarEnPanel(fila, colPorCampo(btn.closest('.dt-campo').dataset.campo)));
        });
        const eliminar = el.querySelector('.dt-btn-eliminar-detalle');
        if (eliminar) eliminar.addEventListener('click', () => eliminarFilas([fila], eliminar));
        if (opciones.contenidoExtra) opciones.contenidoExtra(fila, el.querySelector('.dt-panel-extra'));
      }

      function editarEnPanel(fila, col) {
        const zona = panel.elemento.querySelector(`.dt-campo[data-campo="${CSS.escape(col.campo)}"] .dt-campo-valor`);
        const control = crearControl(col, valorDe(col, fila));
        const btnGuardar = crearBoton('Guardar');
        const btnCancelar = crearBoton('Cancelar', 'secondary');
        zona.innerHTML = '';
        zona.append(control, btnGuardar, btnCancelar);
        control.focus();

        const bloquear = (si) => { btnGuardar.disabled = btnCancelar.disabled = control.disabled = si; };
        const guardar = async () => {
          bloquear(true);
          btnGuardar.textContent = 'Guardando…';
          try {
            await guardarCambio(fila, col, control.value);
            render();
            pintarPanel();
          } catch (err) {
            Notificar.error('No se guardó: ' + err.message);
            bloquear(false);
            btnGuardar.textContent = 'Guardar';
            control.focus();
          }
        };
        btnGuardar.addEventListener('click', guardar);
        btnCancelar.addEventListener('click', pintarPanel);
        control.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); guardar(); }
          if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); pintarPanel(); }
        });
      }

      // =====================================================================
      // 11. Eventos
      // =====================================================================
      // ---- Barra, chips, aviso y paginación ----
      buscador.addEventListener('input', () => cambiarBusqueda(buscador.value));
      $('.dt-btn-columnas').addEventListener('click', (ev) => abrirVista(ev.currentTarget));
      $('.dt-tamano').addEventListener('change', (ev) => { st.pagina = 1; cambiarVista(() => { st.tamanoPagina = Number(ev.target.value); }); });
      const irAPagina = (calcular) => () => { st.pagina = calcular(st.pagina); render(); };
      $('.dt-primera').addEventListener('click', irAPagina(() => 1));
      $('.dt-prev').addEventListener('click', irAPagina((p) => p - 1));
      $('.dt-next').addEventListener('click', irAPagina((p) => p + 1));
      $('.dt-ultima').addEventListener('click', irAPagina(() => Infinity));   // render() lo limita a la última
      if (cfg.exportar) $('.dt-btn-excel').addEventListener('click', (ev) => exportarExcel(ev.currentTarget));

      $('.dt-toolbar').addEventListener('click', (ev) => {
        const boton = ev.target.closest('[data-accion-sel]');
        if (!boton) return;
        const accion = accionesSeleccion[Number(boton.dataset.accionSel)];
        const filas = st.datos.filter((f) => st.seleccion.has(idDe(f)));
        if (!filas.length) return;
        if (accion.propia) { accion.alHacer(filas, boton); return; }
        // Acciones del módulo: si tardan, el botón muestra que está trabajando; si fallan, se avisa
        conBotonOcupado(boton, 'Procesando…', async () => accion.alHacer(filas))
          .catch((err) => Notificar.error(`${accion.texto}: ${err.message}`));
      });

      $('.dt-filtros-activos').addEventListener('click', (ev) => {
        const quitar = ev.target.closest('[data-quitar-filtro]');
        if (quitar) cambiarFiltro(quitar.dataset.quitarFiltro, null);
        else if (ev.target.closest('[data-quitar-busqueda]')) cambiarBusqueda('');
        else if (ev.target.closest('[data-limpiar-todo]')) limpiarTodo();
      });

      $('.dt-banner').addEventListener('click', (ev) => {
        if (ev.target.closest('[data-seleccionar-todos]')) { filasFiltradas().forEach((f) => st.seleccion.add(idDe(f))); render(); }
        if (ev.target.closest('[data-quitar-seleccion]')) limpiarSeleccion();
      });

      // ---- Encabezado: ordenar, filtrar, seleccionar página ----
      thead.addEventListener('click', (ev) => {
        const btnFiltro = ev.target.closest('.dt-btn-filtro');
        if (btnFiltro) { ev.stopPropagation(); abrirFiltro(btnFiltro, colPorCampo(btnFiltro.dataset.campo)); return; }
        const titulo = ev.target.closest('.dt-th-titulo');
        const col = titulo && colPorCampo(titulo.dataset.campo);
        if (col && col.ordenable) alternarOrden(col, ev.shiftKey);
      });

      thead.addEventListener('change', (ev) => {
        if (!ev.target.classList.contains('dt-check-pagina')) return;
        // Solo la página visible; para todos, el aviso ofrece "Seleccionar los N registros"
        const ids = idsPaginaActual(filasFiltradas());
        ids.forEach((id) => (ev.target.checked ? st.seleccion.add(id) : st.seleccion.delete(id)));
        st.ancla = null;
        render();
      });

      // ---- Encabezado: ajustar ancho arrastrando el borde (doble clic = automático) ----
      thead.addEventListener('mousedown', (ev) => {
        const manija = ev.target.closest('.dt-resize');
        if (!manija) return;
        ev.preventDefault();
        ev.stopPropagation();
        const campo = manija.dataset.campo;
        const th = manija.closest('th');
        th.draggable = false;
        const xInicial = ev.clientX;
        const anchoInicial = th.getBoundingClientRect().width;
        manija.classList.add('activo');
        document.body.classList.add('dt-redimensionando');

        const celdas = contenedor.querySelectorAll(`[data-col="${CSS.escape(campo)}"], td[data-campo="${CSS.escape(campo)}"]`);
        const mover = (e) => {
          const w = Math.max(ANCHO_MINIMO, Math.round(anchoInicial + e.clientX - xInicial));
          st.anchos[campo] = w;
          celdas.forEach((c) => { c.style.width = c.style.minWidth = c.style.maxWidth = w + 'px'; });
          aplicarFijadas();
        };
        const soltar = () => {
          document.removeEventListener('mousemove', mover);
          document.removeEventListener('mouseup', soltar);
          document.body.classList.remove('dt-redimensionando');
          cambiarVista(() => {});
        };
        document.addEventListener('mousemove', mover);
        document.addEventListener('mouseup', soltar);
      });
      thead.addEventListener('dblclick', (ev) => {
        const manija = ev.target.closest('.dt-resize');
        if (manija) cambiarVista(() => { delete st.anchos[manija.dataset.campo]; });
      });

      // ---- Encabezado: reordenar columnas arrastrando ----
      let arrastrando = null;
      const thDe = (ev) => ev.target.closest && ev.target.closest('th[data-col]');
      const limpiarMarcas = () => thead.querySelectorAll('th').forEach((th) => th.classList.remove('dt-drop-antes', 'dt-drop-despues', 'dt-arrastrando'));
      thead.addEventListener('dragstart', (ev) => {
        const th = thDe(ev);
        if (!th) return;
        arrastrando = th.dataset.col;
        th.classList.add('dt-arrastrando');
        if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', arrastrando); }
      });
      thead.addEventListener('dragover', (ev) => {
        const th = thDe(ev);
        if (!arrastrando || !th || th.dataset.col === arrastrando) return;
        ev.preventDefault();
        const r = th.getBoundingClientRect();
        limpiarMarcas();
        const origen = thead.querySelector(`th[data-col="${CSS.escape(arrastrando)}"]`);
        if (origen) origen.classList.add('dt-arrastrando');
        th.classList.add(ev.clientX > r.left + r.width / 2 ? 'dt-drop-despues' : 'dt-drop-antes');
      });
      thead.addEventListener('drop', (ev) => {
        const th = thDe(ev);
        if (!arrastrando || !th) return;
        ev.preventDefault();
        const destino = th.dataset.col;
        if (destino !== arrastrando) {
          const orden = st.ordenColumnas.filter((c) => c !== arrastrando);
          const siguiente = th.classList.contains('dt-drop-despues') ? orden[orden.indexOf(destino) + 1] || null : destino;
          moverColumna(arrastrando, siguiente);
        }
        arrastrando = null;
        limpiarMarcas();
      });
      thead.addEventListener('dragend', () => { arrastrando = null; limpiarMarcas(); });

      // ---- Cuerpo: selección (clic y Shift+clic en rango), acciones por fila, edición ----
      tbody.addEventListener('mousedown', (ev) => {
        // Shift+clic no debe seleccionar texto de la página
        if (ev.shiftKey && ev.target.classList.contains('dt-check')) ev.preventDefault();
      });

      function alternarSeleccion(id, marcar, enRangoDesdeAncla) {
        const aplicar = (x) => (marcar ? st.seleccion.add(x) : st.seleccion.delete(x));
        const ids = enRangoDesdeAncla && st.ancla && st.ancla !== id ? filasFiltradas().map(idDe) : null;
        const a = ids ? ids.indexOf(st.ancla) : -1;
        const b = ids ? ids.indexOf(id) : -1;
        if (a !== -1 && b !== -1) ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(aplicar);
        else aplicar(id);
        st.ancla = id;
        render();
        // Mantener el foco en la casilla para seguir con teclado (Espacio / Shift)
        const casilla = tbody.querySelector(`tr[data-id="${CSS.escape(id)}"] .dt-check`);
        if (casilla) casilla.focus();
      }

      tbody.addEventListener('click', (ev) => {
        const tr = ev.target.closest('tr[data-id]');
        if (!tr) return;

        const check = ev.target.closest('.dt-check');
        if (check) { alternarSeleccion(tr.dataset.id, check.checked, ev.shiftKey); return; }

        const botonFila = ev.target.closest('[data-accion-fila]');
        if (botonFila) {
          const fila = filaPorId(tr.dataset.id);
          if (fila) accionesFila[Number(botonFila.dataset.accionFila)].alHacer(fila);
          return;
        }

        const lapiz = ev.target.closest('.dt-btn-editar-celda');
        if (lapiz) { iniciarEdicion(lapiz.closest('td')); return; }

        // En pantallas táctiles (sin doble clic ni hover), tocar la fila abre el detalle
        const interactivo = ev.target.closest('button, a, input, select, label, .dt-editor');
        if (esTactil() && conDetalle && !st.editando && !interactivo) abrirPanel(tr.dataset.id);
      });

      // Doble clic (atajo para quien ya lo conoce) y F2 con foco en el lápiz, como en Excel
      const editarDesde = (ev) => {
        const td = ev.target.closest('td.dt-editable');
        if (!td || td.classList.contains('dt-editando')) return false;
        iniciarEdicion(td);
        return true;
      };
      tbody.addEventListener('dblclick', editarDesde);
      tbody.addEventListener('keydown', (ev) => {
        if (ev.key === 'F2' && editarDesde(ev)) ev.preventDefault();
      });

      // ---- Atajos globales (solo si esta tabla está a la vista) ----
      const desmontado = () => {
        if (document.body.contains(contenedor)) return false;
        limpiarGlobales();
        return true;
      };
      // "A la vista" = conectada y sin un contenedor oculto (así esconde Tabs las pestañas).
      // No se usa offsetParent: es null dentro de elementos position:fixed aunque se vea.
      const visible = () => document.body.contains(contenedor) && !contenedor.closest('[hidden]');

      const alClicFuera = (ev) => {
        if (desmontado()) return;
        if (popover && !popover.contains(ev.target) && !ev.target.closest('.dt-btn-filtro, .dt-btn-columnas')) cerrarPopover();
      };

      const alTecla = (ev) => {
        if (desmontado()) return;
        if (ev.key === 'Escape') {
          if (popover) { cerrarPopover(); return; }
          // Quitar selección solo si el usuario está trabajando dentro de esta tabla
          if (!panel && !st.editando && st.seleccion.size && contenedor.contains(document.activeElement)) limpiarSeleccion();
          return;
        }
        const ctrl = ev.ctrlKey || ev.metaKey;
        if (!ctrl || panel || st.editando || escribiendo(ev.target) || document.querySelector('.confirmar-card') || !visible()) return;
        const tecla = ev.key.toLowerCase();

        if (tecla === 'z' && !ev.shiftKey && st.historial.length) {
          ev.preventDefault();
          deshacer(st.historial[st.historial.length - 1]);
        }
        if (tecla === 'c' && st.seleccion.size) {
          const hayTextoSeleccionado = window.getSelection && String(window.getSelection()).trim() !== '';
          const enTabla = contenedor.contains(document.activeElement) || document.activeElement === document.body;
          if (!hayTextoSeleccionado && enTabla) { ev.preventDefault(); copiarSeleccion(); }
        }
      };

      const alRedimensionar = () => { if (!desmontado()) { ajustarAlto(); aplicarFijadas(); } };

      function limpiarGlobales() {
        cerrarPopover();
        cerrarPanel();
        document.removeEventListener('mousedown', alClicFuera);
        document.removeEventListener('keydown', alTecla);
        window.removeEventListener('resize', alRedimensionar);
      }
      document.addEventListener('mousedown', alClicFuera);
      document.addEventListener('keydown', alTecla);
      window.addEventListener('resize', alRedimensionar);

      render();

      // =====================================================================
      // 12. API pública
      // =====================================================================
      return {
        setDatos(datos) {
          st.datos = datos || [];
          st.cargando = false;
          st.refrescando = false;
          st.error = null;
          if (!st.editando) { render(); refrescarPanel(); }
        },
        /** Sin datos aún: filas grises. Con datos a la vista: barra de carga arriba, sin borrar lo que se ve. */
        setCargando(valor) {
          st.refrescando = !!valor && st.datos.length > 0;
          st.cargando = !!valor && !st.refrescando;
          if (valor) st.error = null;
          render();
        },
        setError(mensaje) { st.error = mensaje || null; st.cargando = false; st.refrescando = false; render(); },
        getDatos: () => st.datos.slice(),
        getSeleccion: () => st.datos.filter((f) => st.seleccion.has(idDe(f))),
        limpiarSeleccion,
        copiarSeleccion,
        textoSeleccion,
        setFiltro: cambiarFiltro,
        limpiarFiltros: limpiarTodo,
        moverColumna,
        fijarColumna,
        ocultarColumna,
        mostrarColumna,
        setDensidad,
        restablecerVista,
        getVista: vistaActual,
        abrirDetalle: abrirPanel,
        /** Llamar si la tabla estaba oculta (p. ej. en otra pestaña) y se acaba de mostrar */
        ajustarAlto() { ajustarAlto(); aplicarFijadas(); },
        destruir() { limpiarGlobales(); contenedor.innerHTML = ''; },
      };
    }

    return { crear, registrarTipo, tipos: () => Object.keys(TIPOS) };
  })();
</script>
