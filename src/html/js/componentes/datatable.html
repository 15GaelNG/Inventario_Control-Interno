<script>
  /**
   * DataTable — tabla de datos reutilizable (estilo AppSheet / AG Grid), sin dependencias.
   * Requiere Notificar, Confirmar y ExportarExcel (se incluyen antes en Index.html).
   *
   *   const tabla = DataTable.crear(elementoContenedor, {
   *     idCampo: 'ID',                         // clave única de cada fila
   *     idTabla: 'verificaciones',             // para recordar la vista de cada usuario (columnas, anchos, orden…)
   *     columnas: [
   *       { campo: 'FOLIO', titulo: 'Folio', tipo: 'texto', editable: 'panel', fijada: true },
   *       { campo: 'KM', titulo: 'Kilometraje', tipo: 'numero', editable: true, agregado: 'suma' },
   *       { campo: 'FECHA', titulo: 'Fecha', tipo: 'fecha', editable: true },       // valor ISO o Date
   *       { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista', editable: true,
   *         opciones: ['ACTIVO', 'BAJA'] },     // si se omite, usa los valores existentes
   *       { campo: 'FOTO', titulo: 'Foto', filtrable: false, ordenable: false,
   *         render: (valor, fila) => '<button …>' },  // HTML propio (el módulo escapa lo que use)
   *       { campo: 'DIAS', titulo: 'Días', tipo: 'numero',
   *         valor: (fila) => calcularDias(fila) },    // columna calculada
   *       // editable: true    → se edita en la celda (✏️, doble clic, Tab+Enter o F2) y en el panel
   *       // editable: 'panel' → SOLO en el panel de detalle (cambios con consecuencias, p. ej. un folio)
   *       // fijada: true      → fija a la izquierda por defecto (el usuario puede cambiarlo)
   *       // ancho: 160        → ancho inicial en px (el usuario puede arrastrarlo)
   *       // agregado: 'suma' | 'promedio' | 'min' | 'max' | 'conteo'  → fila de totales (sobre lo filtrado)
   *       // Otras: visible:false, exportable:false, valorExportar:(fila)=>…, enDetalle:false
   *     ],
   *     tamanoPagina: 25,
   *     densidad: 'normal',                    // 'compacta' | 'normal' | 'comoda'
   *     seleccionable: true,
   *     ordenInicial: { campo: 'FECHA', dir: 'desc' },   // o un arreglo para orden múltiple
   *     textoVacio: 'Sin registros',
   *     ayuda: 'Texto de ayuda…',               // tooltip "ⓘ Ayuda" (opcional)
   *     exportar: { nombreArchivo: 'Verificaciones' },   // botón verde; false lo oculta
   *     alCambiarFiltros: (filtros) => {},      // opcional, p. ej. para marcar chips de KPI
   *     etiquetaFila: (fila) => fila.FOLIO,     // cómo nombrar una fila en confirmaciones y avisos
   *     detalle: { titulo: (fila) => '…', contenidoExtra: (fila, contenedor) => {} },   // false lo desactiva
   *     umbralPalabraClave: 10,                 // eliminar pide escribir "ELIMINAR" desde N filas
   *     alEditar: async (fila, campo, valorNuevo) => filaActualizada,   // lanza error para rechazar
   *     alEliminar: async (filas) => {},        // si se omite, no aparece la opción
   *     motivoSinEliminar: 'Solo administradores pueden eliminar',
   *   });
   *
   *   tabla.setDatos(datos)      tabla.setCargando(true)    tabla.setError('msg')
   *   tabla.getSeleccion()       tabla.limpiarSeleccion()   tabla.copiarSeleccion()
   *   tabla.setFiltro(campo, { valores: [...] } | { op, v1, v2 } | null)   tabla.limpiarFiltros()
   *   tabla.moverColumna(campo, antesDeCampo)   tabla.fijarColumna(campo, true)
   *   tabla.setDensidad('compacta')   tabla.restablecerVista()   tabla.abrirDetalle(id)
   *   tabla.ajustarAlto()        tabla.destruir()
   *
   * Atajos: Shift+clic en casillas = rango · Shift+clic en encabezado = orden múltiple ·
   *   Ctrl+C = copiar seleccionados (pegar en Excel) · Ctrl+Z = deshacer última edición ·
   *   Esc = cerrar menús / quitar selección · F2 = editar celda con foco.
   *
   * Valores de edición que recibe alEditar: texto → string, numero → Number|null,
   * fecha → "yyyy-MM-dd" (o "" si se borra), lista → string.
   * Guardar es explícito (✓ o Enter); salir de la celda o Esc CANCELA. Tras guardar hay "Deshacer".
   * En pantallas táctiles, tocar una fila abre el panel de detalle.
   */
  const DataTable = (function () {
    const OPERADORES = {
      texto: [
        ['contiene', 'Contiene'], ['no_contiene', 'No contiene'], ['igual', 'Es igual a'],
        ['empieza', 'Empieza con'], ['termina', 'Termina con'], ['vacio', 'Está vacío'], ['no_vacio', 'No está vacío'],
      ],
      numero: [
        ['=', 'Igual a (=)'], ['!=', 'Distinto de (≠)'], ['>', 'Mayor que (>)'], ['>=', 'Mayor o igual (≥)'],
        ['<', 'Menor que (<)'], ['<=', 'Menor o igual (≤)'], ['entre', 'Entre'], ['vacio', 'Está vacío'], ['no_vacio', 'No está vacío'],
      ],
      fecha: [
        ['igual', 'Es el día'], ['antes', 'Antes de'], ['despues', 'Después de'], ['entre', 'Entre'],
        ['vacio', 'Está vacía'], ['no_vacio', 'No está vacía'],
      ],
    };
    const SIN_VALOR = ['vacio', 'no_vacio'];
    const FILAS_SKELETON = 8;
    const ANCHO_MINIMO = 60;
    const MAX_HISTORIAL = 20;
    const ETIQUETA_AGREGADO = { suma: 'Σ', promedio: 'x̄', min: 'mín', max: 'máx', conteo: 'n' };

    // ---------- utilidades ----------
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }
    function vacio(v) { return v === null || v === undefined || String(v).trim() === ''; }

    /** Minúsculas y sin acentos, carácter por carácter (misma longitud, para poder resaltar) */
    function normalizarCaracter(c) { return c.normalize('NFD').charAt(0).toLowerCase(); }
    function normalizar(texto) { return Array.from(String(texto == null ? '' : texto)).map(normalizarCaracter).join(''); }

    /** Fecha → "yyyy-MM-dd" en hora local (para comparar por día) */
    function claveFecha(v) {
      if (vacio(v)) return '';
      if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
      const f = v instanceof Date ? v : new Date(v);
      if (isNaN(f)) return '';
      return claveDeDate(f);
    }
    function claveDeDate(f) {
      return [f.getFullYear(), String(f.getMonth() + 1).padStart(2, '0'), String(f.getDate()).padStart(2, '0')].join('-');
    }
    function sumarDias(dias) { const f = new Date(); f.setDate(f.getDate() + dias); return claveDeDate(f); }
    /** "yyyy-MM-dd" → "dd/mm/aaaa" (siempre con ceros, igual que el Excel exportado y AppSheet) */
    function fechaLegible(clave) {
      if (!clave) return '';
      const [y, m, d] = clave.split('-');
      return `${d}/${m}/${y}`;
    }
    function aNumero(v) {
      if (vacio(v)) return null;
      const n = Number(String(v).replace(/[$,\s]/g, ''));
      return isNaN(n) ? null : n;
    }
    function plural(n, singular, pluralTexto) { return n === 1 ? singular : (pluralTexto || singular + 's'); }
    function escribiendo(el) {
      return !!(el && el.closest && el.closest('input:not([type="checkbox"]), textarea, select, [contenteditable="true"]'));
    }

    function crear(contenedor, config) {
      const cfg = Object.assign({
        tamanoPagina: 25, seleccionable: true, textoVacio: 'Sin registros', exportar: true,
        detalle: {}, umbralPalabraClave: 10, densidad: 'normal',
      }, config);
      if (cfg.exportar === true) cfg.exportar = { nombreArchivo: 'Datos' };
      const columnas = cfg.columnas.map((c) => Object.assign(
        { tipo: 'texto', editable: false, filtrable: true, ordenable: true, visible: true, exportable: true, enDetalle: true }, c
      ));
      const idDe = (fila) => String(fila[cfg.idCampo]);
      const etiquetaDe = (fila) => (cfg.etiquetaFila ? cfg.etiquetaFila(fila) : idDe(fila));
      const colPorCampo = (campo) => columnas.find((c) => c.campo === campo);
      const aArreglo = (o) => (!o ? [] : Array.isArray(o) ? o.map((x) => Object.assign({}, x)) : [Object.assign({}, o)]);

      /** Vista por defecto (lo que "Restablecer vista" recupera) */
      const vistaDefault = () => ({
        ocultas: columnas.filter((c) => !c.visible).map((c) => c.campo),
        ordenColumnas: columnas.map((c) => c.campo),
        anchos: Object.fromEntries(columnas.filter((c) => c.ancho).map((c) => [c.campo, c.ancho])),
        fijadas: columnas.filter((c) => c.fijada).map((c) => c.campo),
        orden: aArreglo(cfg.ordenInicial),
        tamanoPagina: cfg.tamanoPagina,
        densidad: cfg.densidad,
      });

      const st = {
        datos: cfg.datos || [],
        cargando: !cfg.datos,        // sin datos iniciales = todavía cargando
        refrescando: false,
        error: null,
        busqueda: '',
        filtros: {},                 // campo -> { op, v1, v2 } | { valores: [..] }
        pagina: 1,
        seleccion: new Set(),
        ancla: null,                 // última casilla marcada (para Shift+clic)
        editando: null,
        detalleId: null,
        historial: [],               // ediciones para Ctrl+Z
      };
      aplicarVista(Object.assign(vistaDefault(), leerVistaGuardada()));

      function aplicarVista(v) {
        const existe = (campo) => !!colPorCampo(campo);
        st.ocultas = new Set((v.ocultas || []).filter(existe));
        // Columnas nuevas (agregadas después de guardar la vista) van al final
        const orden = (v.ordenColumnas || []).filter(existe);
        columnas.forEach((c) => { if (!orden.includes(c.campo)) orden.push(c.campo); });
        st.ordenColumnas = orden;
        st.anchos = Object.fromEntries(Object.entries(v.anchos || {}).filter(([k]) => existe(k)));
        st.fijadas = new Set((v.fijadas || []).filter(existe));
        st.orden = aArreglo(v.orden).filter((o) => existe(o.campo));
        st.tamanoPagina = [10, 25, 50, 100].includes(Number(v.tamanoPagina)) ? Number(v.tamanoPagina) : 25;
        st.densidad = ['compacta', 'normal', 'comoda'].includes(v.densidad) ? v.densidad : 'normal';
      }

      function claveVista() { return cfg.idTabla ? 'dt-vista:' + cfg.idTabla : null; }
      function leerVistaGuardada() {
        const clave = claveVista();
        if (!clave) return {};
        try { return JSON.parse(localStorage.getItem(clave) || '{}') || {}; } catch (e) { return {}; }
      }
      function guardarVista() {
        const clave = claveVista();
        if (!clave) return;
        try {
          localStorage.setItem(clave, JSON.stringify({
            ocultas: Array.from(st.ocultas), ordenColumnas: st.ordenColumnas, anchos: st.anchos,
            fijadas: Array.from(st.fijadas), orden: st.orden, tamanoPagina: st.tamanoPagina, densidad: st.densidad,
          }));
        } catch (e) { /* localStorage puede no estar disponible: la vista solo no se recuerda */ }
      }

      const valorDe = (col, fila) => (col.valor ? col.valor(fila) : fila[col.campo]);
      /** Visibles en el orden del usuario, con las fijadas primero */
      const columnasVisibles = () => {
        const ordenadas = st.ordenColumnas.map(colPorCampo).filter((c) => c && !st.ocultas.has(c.campo));
        return ordenadas.filter((c) => st.fijadas.has(c.campo)).concat(ordenadas.filter((c) => !st.fijadas.has(c.campo)));
      };
      const puedeEditarCelda = (col) => col.editable === true && !!cfg.alEditar;
      const puedeEditarPanel = (col) => !!col.editable && !!cfg.alEditar;
      const esTactil = () => window.matchMedia && window.matchMedia('(hover: none)').matches;
      const conDetalle = () => cfg.detalle !== false;

      function textoVisible(col, fila) {
        const v = valorDe(col, fila);
        if (col.tipo === 'fecha') return fechaLegible(claveFecha(v));
        if (col.tipo === 'numero') { const n = aNumero(v); return n === null ? '' : n.toLocaleString('es-MX'); }
        return vacio(v) ? '' : String(v);
      }

      /** Texto escapado con las coincidencias de la búsqueda resaltadas (sin importar acentos) */
      function resaltar(texto) {
        const q = normalizar(st.busqueda.trim());
        if (!q) return esc(texto);
        const caracteres = Array.from(texto);
        const base = caracteres.map(normalizarCaracter).join('');
        let salida = '';
        let desde = 0;
        let i = base.indexOf(q);
        if (i === -1) return esc(texto);
        const largo = Array.from(q).length;
        while (i !== -1) {
          salida += esc(caracteres.slice(desde, i).join('')) + '<mark>' + esc(caracteres.slice(i, i + largo).join('')) + '</mark>';
          desde = i + largo;
          i = base.indexOf(q, desde);
        }
        return salida + esc(caracteres.slice(desde).join(''));
      }

      // ---------- esqueleto ----------
      contenedor.innerHTML = `
        <div class="dt">
          <div class="dt-toolbar">
            <input type="search" class="dt-buscar" placeholder="Buscar en la tabla…" aria-label="Buscar en la tabla" />
            <button type="button" class="secondary dt-btn-columnas" title="Columnas, orden, ancho y densidad">☰ Vista</button>
            ${cfg.ayuda ? `<span class="dt-ayuda" title="${esc(cfg.ayuda)}">ⓘ Ayuda</span>` : ''}
            <span class="dt-espacio"></span>
            <span class="dt-seleccion-info" hidden></span>
            <button type="button" class="secondary dt-btn-copiar" hidden title="Copia los seleccionados para pegarlos en Excel (Ctrl+C)">📋 Copiar</button>
            <button type="button" class="danger dt-btn-eliminar" hidden>🗑️ Eliminar seleccionados</button>
            ${cfg.exportar ? '<button type="button" class="btn-excel dt-btn-excel" title="Descarga lo que ves: columnas visibles, filtros, búsqueda y orden (todas las páginas)">📥 Exportar a Excel</button>' : ''}
          </div>
          <div class="dt-filtros-activos" hidden></div>
          <div class="dt-banner" hidden></div>
          <div class="dt-scroll"><div class="dt-barra-carga" hidden></div><table><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
          <div class="dt-pie">
            <span class="dt-resumen" aria-live="polite"></span>
            <span class="dt-atajos" title="Shift+clic en casillas: seleccionar rango · Shift+clic en encabezado: ordenar por varias columnas · Ctrl+C: copiar seleccionados · Ctrl+Z: deshacer edición · Arrastra encabezados para reordenar y sus bordes para cambiar el ancho">⌨️ Atajos</span>
            <div class="dt-paginacion">
              <select class="dt-tamano" aria-label="Registros por página">${[10, 25, 50, 100].map((n) => `<option value="${n}">${n} por página</option>`).join('')}</select>
              <button type="button" class="secondary dt-primera" aria-label="Primera página" title="Primera página">«</button>
              <button type="button" class="secondary dt-prev" aria-label="Página anterior">‹</button>
              <span class="dt-pagina"></span>
              <button type="button" class="secondary dt-next" aria-label="Página siguiente">›</button>
              <button type="button" class="secondary dt-ultima" aria-label="Última página" title="Última página">»</button>
            </div>
          </div>
        </div>`;

      const $ = (sel) => contenedor.querySelector(sel);
      const raiz = $('.dt');
      const thead = $('thead');
      const tbody = $('tbody');
      const tfoot = $('tfoot');
      let popover = null;
      let panel = null;
      let ultimaFirmaFiltros = '{}';
      let ultimaFirmaVista = '';
      let secuenciaHistorial = 0;

      function avisar(texto, tipo) {
        if (tipo === 'error') Notificar.error(texto); else Notificar.exito(texto);
      }

      // ---------- filtrar / ordenar ----------
      function cumpleFiltro(col, fila, f) {
        const v = valorDe(col, fila);
        if (f.valores) return f.valores.includes(vacio(v) ? '' : String(v));
        if (f.op === 'vacio') return vacio(v);
        if (f.op === 'no_vacio') return !vacio(v);

        if (col.tipo === 'numero') {
          const n = aNumero(v); const a = aNumero(f.v1); const b = aNumero(f.v2);
          if (n === null || a === null) return false;
          switch (f.op) {
            case '=': return n === a;
            case '!=': return n !== a;
            case '>': return n > a;
            case '>=': return n >= a;
            case '<': return n < a;
            case '<=': return n <= a;
            case 'entre': return b !== null && n >= Math.min(a, b) && n <= Math.max(a, b);
          }
          return true;
        }
        if (col.tipo === 'fecha') {
          const k = claveFecha(v);
          if (!k || !f.v1) return false;
          switch (f.op) {
            case 'igual': return k === f.v1;
            case 'antes': return k < f.v1;
            case 'despues': return k > f.v1;
            case 'entre': return !!f.v2 && k >= (f.v1 < f.v2 ? f.v1 : f.v2) && k <= (f.v1 < f.v2 ? f.v2 : f.v1);
          }
          return true;
        }
        const t = normalizar(vacio(v) ? '' : v);
        const q = normalizar(f.v1 || '');
        switch (f.op) {
          case 'contiene': return t.includes(q);
          case 'no_contiene': return !t.includes(q);
          case 'igual': return t === q;
          case 'empieza': return t.startsWith(q);
          case 'termina': return t.endsWith(q);
        }
        return true;
      }

      function claveOrden(col, fila) {
        const v = valorDe(col, fila);
        if (col.tipo === 'numero') return aNumero(v);
        if (col.tipo === 'fecha') return claveFecha(v) || null;
        return vacio(v) ? null : normalizar(v);
      }

      function filasFiltradas() {
        const q = normalizar(st.busqueda.trim());
        const visibles = columnasVisibles();
        let filas = st.datos.filter((fila) => {
          for (const campo in st.filtros) {
            const col = colPorCampo(campo);
            if (col && !cumpleFiltro(col, fila, st.filtros[campo])) return false;
          }
          return !q || visibles.some((col) => normalizar(textoVisible(col, fila)).includes(q));
        });

        const criterios = st.orden.map((o) => ({ col: colPorCampo(o.campo), signo: o.dir === 'desc' ? -1 : 1 })).filter((c) => c.col);
        if (criterios.length) {
          filas = filas.slice().sort((a, b) => {
            for (const { col, signo } of criterios) {
              const x = claveOrden(col, a); const y = claveOrden(col, b);
              if (x === null && y === null) continue;
              if (x === null) return 1;          // vacíos siempre al final
              if (y === null) return -1;
              if (x < y) return -1 * signo;
              if (x > y) return 1 * signo;
            }
            return 0;
          });
        }
        return filas;
      }

      /** Texto legible de un filtro para el chip: "Días para vencer < 30" */
      function describirFiltro(col, f) {
        if (f.valores) {
          if (!f.valores.length) return `${col.titulo}: (ninguno)`;
          const nombres = f.valores.map((v) => (v === '' ? '(vacío)' : v));
          return `${col.titulo}: ${nombres.length <= 3 ? nombres.join(', ') : nombres.length + ' valores'}`;
        }
        const ops = OPERADORES[col.tipo] || OPERADORES.texto;
        const etiquetaOp = (ops.find(([k]) => k === f.op) || [, f.op])[1].replace(/\s*\(.*\)$/, '');
        if (SIN_VALOR.includes(f.op)) return `${col.titulo} ${etiquetaOp.toLowerCase()}`;
        const valor = (x) => (col.tipo === 'fecha' ? fechaLegible(x) : col.tipo === 'numero' ? x : `“${x}”`);
        const simbolo = { '=': '=', '!=': '≠', '>': '>', '>=': '≥', '<': '<', '<=': '≤' }[f.op];
        if (f.op === 'entre') return `${col.titulo} entre ${valor(f.v1)} y ${valor(f.v2)}`;
        if (simbolo) return `${col.titulo} ${simbolo} ${valor(f.v1)}`;
        return `${col.titulo} ${etiquetaOp.toLowerCase()} ${valor(f.v1)}`;
      }

      function calcularAgregado(col, filas) {
        if (col.agregado === 'conteo') return filas.filter((f) => !vacio(valorDe(col, f))).length.toLocaleString('es-MX');
        const nums = filas.map((f) => aNumero(valorDe(col, f))).filter((n) => n !== null);
        if (!nums.length) return '—';
        let r;
        if (col.agregado === 'suma') r = nums.reduce((a, b) => a + b, 0);
        if (col.agregado === 'promedio') r = nums.reduce((a, b) => a + b, 0) / nums.length;
        if (col.agregado === 'min') r = Math.min(...nums);
        if (col.agregado === 'max') r = Math.max(...nums);
        return r === undefined ? '' : r.toLocaleString('es-MX', { maximumFractionDigits: 2 });
      }

      // ---------- render ----------
      function estiloAncho(campo) {
        const w = st.anchos[campo];
        return w ? ` style="width:${w}px;min-width:${w}px;max-width:${w}px"` : '';
      }

      function render() {
        const visibles = columnasVisibles();
        const nFijasSistema = (cfg.seleccionable ? 1 : 0) + (conDetalle() ? 1 : 0);
        const nColumnas = visibles.length + nFijasSistema;
        const filas = st.cargando || st.error ? [] : filasFiltradas();
        raiz.className = 'dt dt-densidad-' + st.densidad;

        // Al cambiar filtros o búsqueda, soltar la selección de lo que ya no se ve
        // (evita borrar registros que el usuario no tiene en pantalla)
        const firmaVista = JSON.stringify([st.filtros, st.busqueda.trim()]);
        if (firmaVista !== ultimaFirmaVista) {
          ultimaFirmaVista = firmaVista;
          const visiblesIds = new Set(filas.map(idDe));
          st.seleccion.forEach((id) => { if (!visiblesIds.has(id)) st.seleccion.delete(id); });
        }

        const totalPaginas = Math.max(1, Math.ceil(filas.length / st.tamanoPagina));
        st.pagina = Math.min(Math.max(1, st.pagina), totalPaginas);
        const inicio = (st.pagina - 1) * st.tamanoPagina;
        const pagina = filas.slice(inicio, inicio + st.tamanoPagina);

        const existentes = new Set(st.datos.map(idDe));
        st.seleccion.forEach((id) => { if (!existentes.has(id)) st.seleccion.delete(id); });
        const idsPagina = pagina.map(idDe);
        const selPagina = idsPagina.filter((id) => st.seleccion.has(id)).length;
        const multiOrden = st.orden.length > 1;

        // Encabezado
        thead.innerHTML = '<tr>' +
          (cfg.seleccionable ? '<th class="dt-col-check dt-fija"><input type="checkbox" class="dt-check-pagina" title="Seleccionar esta página" aria-label="Seleccionar esta página" /></th>' : '') +
          (conDetalle() ? '<th class="dt-col-ver dt-fija" aria-label="Detalle"></th>' : '') +
          visibles.map((col) => {
            const idx = st.orden.findIndex((o) => o.campo === col.campo);
            const orden = idx === -1 ? null : st.orden[idx].dir;
            const ariaSort = orden === 'asc' ? 'ascending' : orden === 'desc' ? 'descending' : 'none';
            const clases = [col.tipo === 'numero' ? 'dt-num' : '', st.fijadas.has(col.campo) ? 'dt-fija' : ''].join(' ').trim();
            return `<th aria-sort="${ariaSort}" class="${clases}" data-col="${esc(col.campo)}" draggable="true"${estiloAncho(col.campo)}><div class="dt-th">
              <span class="dt-th-titulo" data-campo="${esc(col.campo)}" title="${col.ordenable ? 'Ordenar (Shift+clic: agregar orden)' : ''}">${st.fijadas.has(col.campo) ? '📌 ' : ''}${esc(col.titulo)}${orden ? `<span class="dt-orden">${orden === 'asc' ? '▲' : '▼'}${multiOrden ? `<sub>${idx + 1}</sub>` : ''}</span>` : ''}</span>
              ${col.filtrable ? `<button type="button" class="dt-btn-filtro ${st.filtros[col.campo] ? 'activo' : ''}" data-campo="${esc(col.campo)}" title="Filtrar y opciones de columna" aria-label="Filtrar ${esc(col.titulo)}">▾</button>` : ''}
              <span class="dt-resize" data-campo="${esc(col.campo)}" title="Arrastra para cambiar el ancho · doble clic para ajustar"></span>
            </div></th>`;
          }).join('') + '</tr>';

        const checkPagina = thead.querySelector('.dt-check-pagina');
        if (checkPagina) {
          checkPagina.disabled = !idsPagina.length;
          checkPagina.checked = idsPagina.length > 0 && selPagina === idsPagina.length;
          checkPagina.indeterminate = selPagina > 0 && selPagina < idsPagina.length;
        }

        // Cuerpo
        const qActiva = st.busqueda.trim() !== '';
        if (st.cargando) {
          tbody.innerHTML = Array.from({ length: FILAS_SKELETON }, () => '<tr>' +
            Array.from({ length: nColumnas }, (_, i) => `<td><span class="dt-skel" style="width:${i < nFijasSistema ? 14 : 40 + ((i * 37) % 50)}px"></span></td>`).join('') +
            '</tr>').join('');
        } else if (st.error) {
          tbody.innerHTML = `<tr><td class="dt-vacio dt-error" colspan="${nColumnas}">⚠️ ${esc(st.error)}</td></tr>`;
        } else if (!pagina.length) {
          tbody.innerHTML = `<tr><td class="dt-vacio" colspan="${nColumnas}">${esc(st.datos.length ? 'Ningún registro coincide con los filtros' : cfg.textoVacio)}</td></tr>`;
        } else {
          tbody.innerHTML = pagina.map((fila) => {
            const id = idDe(fila);
            const sel = st.seleccion.has(id);
            return `<tr data-id="${esc(id)}" class="${sel ? 'dt-fila-seleccionada' : ''}">` +
              (cfg.seleccionable ? `<td class="dt-col-check dt-fija"><input type="checkbox" class="dt-check" ${sel ? 'checked' : ''} aria-label="Seleccionar ${esc(etiquetaDe(fila))}" /></td>` : '') +
              (conDetalle() ? `<td class="dt-col-ver dt-fija"><button type="button" class="dt-btn-ver" title="Ver detalle" aria-label="Ver detalle de ${esc(etiquetaDe(fila))}">🔍</button></td>` : '') +
              visibles.map((col) => {
                const editable = puedeEditarCelda(col);
                const clases = [editable ? 'dt-editable' : '', col.tipo === 'numero' ? 'dt-num' : '', st.fijadas.has(col.campo) ? 'dt-fija' : ''].join(' ').trim();
                const texto = textoVisible(col, fila);
                const contenido = col.render ? col.render(valorDe(col, fila), fila) : (qActiva ? resaltar(texto) : esc(texto));
                const titulo = col.render ? '' : ` title="${esc(texto)}"`;
                const lapiz = editable
                  ? `<button type="button" class="dt-btn-editar-celda" title="Editar ${esc(col.titulo)}" aria-label="Editar ${esc(col.titulo)} de ${esc(etiquetaDe(fila))}">✏️</button>`
                  : '';
                return `<td data-campo="${esc(col.campo)}" class="${clases}"${titulo}${estiloAncho(col.campo)}>${contenido}${lapiz}</td>`;
              }).join('') + '</tr>';
          }).join('');
        }

        // Fila de totales (sobre TODO lo filtrado, no solo la página)
        const conAgregados = visibles.some((c) => c.agregado);
        tfoot.innerHTML = conAgregados && !st.cargando && !st.error && filas.length
          ? '<tr>' + (cfg.seleccionable ? '<td class="dt-col-check dt-fija"></td>' : '') + (conDetalle() ? '<td class="dt-col-ver dt-fija"></td>' : '') +
            visibles.map((col) => `<td data-campo="${esc(col.campo)}" class="${[col.tipo === 'numero' ? 'dt-num' : '', st.fijadas.has(col.campo) ? 'dt-fija' : ''].join(' ').trim()}"${estiloAncho(col.campo)}>${col.agregado
              ? `<span class="dt-agregado-etiqueta" title="${esc(col.agregado)} de ${filas.length} registros filtrados">${ETIQUETA_AGREGADO[col.agregado]}</span>${esc(calcularAgregado(col, filas))}`
              : ''}</td>`).join('') + '</tr>'
          : '';

        // Chips de filtros activos
        const chips = Object.keys(st.filtros).map((campo) => {
          const col = colPorCampo(campo);
          return col ? `<span class="dt-chip">${esc(describirFiltro(col, st.filtros[campo]))}<button type="button" data-quitar-filtro="${esc(campo)}" aria-label="Quitar filtro">✕</button></span>` : '';
        });
        if (qActiva) {
          chips.unshift(`<span class="dt-chip">Búsqueda: “${esc(st.busqueda.trim())}”<button type="button" data-quitar-busqueda aria-label="Quitar búsqueda">✕</button></span>`);
        }
        const zonaChips = $('.dt-filtros-activos');
        zonaChips.hidden = chips.length === 0;
        zonaChips.innerHTML = chips.length
          ? `<span class="dt-filtros-titulo">Filtros:</span>${chips.join('')}<button type="button" class="dt-link" data-limpiar-todo>Limpiar todo</button>`
          : '';

        // Aviso de selección (patrón Gmail)
        const selFiltradas = filas.filter((f) => st.seleccion.has(idDe(f))).length;
        const banner = $('.dt-banner');
        if (cfg.seleccionable && idsPagina.length && selPagina === idsPagina.length && filas.length > idsPagina.length) {
          banner.hidden = false;
          banner.innerHTML = selFiltradas === filas.length
            ? `Los <strong>${filas.length}</strong> registros ${Object.keys(st.filtros).length || qActiva ? 'filtrados ' : ''}están seleccionados. <button type="button" class="dt-link" data-quitar-seleccion>Quitar selección</button>`
            : `Seleccionaste los <strong>${idsPagina.length}</strong> registros de esta página. <button type="button" class="dt-link" data-seleccionar-todos>Seleccionar los ${filas.length} registros</button>`;
        } else {
          banner.hidden = true;
          banner.innerHTML = '';
        }

        // Pie y botones
        $('.dt-barra-carga').hidden = !st.refrescando;
        $('.dt-resumen').textContent = st.cargando ? 'Cargando…'
          : filas.length
            ? `Mostrando ${inicio + 1}–${inicio + pagina.length} de ${filas.length}` + (filas.length !== st.datos.length ? ` (filtrados de ${st.datos.length})` : '')
            : `0 de ${st.datos.length}`;
        $('.dt-pagina').textContent = `${st.pagina} / ${totalPaginas}`;
        $('.dt-tamano').value = String(st.tamanoPagina);
        $('.dt-primera').disabled = $('.dt-prev').disabled = st.pagina <= 1;
        $('.dt-ultima').disabled = $('.dt-next').disabled = st.pagina >= totalPaginas;
        if (cfg.exportar) $('.dt-btn-excel').disabled = st.cargando || !!st.error;

        const nSel = st.seleccion.size;
        $('.dt-seleccion-info').hidden = nSel === 0;
        // Sin permiso para eliminar: decir por qué en vez de esconder la acción sin explicación
        $('.dt-seleccion-info').textContent = `${nSel} ${plural(nSel, 'seleccionado')}` +
          (!cfg.alEliminar && cfg.motivoSinEliminar ? ` · ${cfg.motivoSinEliminar}` : '');
        $('.dt-btn-copiar').hidden = nSel === 0;
        $('.dt-btn-eliminar').hidden = nSel === 0 || !cfg.alEliminar;

        aplicarFijadas();
        ajustarAlto();
        const firmaFiltros = JSON.stringify(st.filtros);
        if (cfg.alCambiarFiltros && firmaFiltros !== ultimaFirmaFiltros) {
          ultimaFirmaFiltros = firmaFiltros;
          cfg.alCambiarFiltros(JSON.parse(firmaFiltros));
        }
      }

      /** Posición "left" de las columnas fijas, según el ancho real de las anteriores */
      function aplicarFijadas() {
        const filaEncabezado = thead.rows[0];
        if (!filaEncabezado) return;
        const filasTabla = [filaEncabezado].concat(Array.from(tbody.rows), Array.from(tfoot.rows));
        let izquierda = 0;
        let ultima = -1;
        for (let i = 0; i < filaEncabezado.cells.length; i++) {
          const th = filaEncabezado.cells[i];
          if (!th.classList.contains('dt-fija')) break;
          filasTabla.forEach((tr) => {
            const celda = tr.cells[i];
            if (celda && celda.classList.contains('dt-fija')) { celda.style.left = izquierda + 'px'; celda.classList.remove('dt-fija-ultima'); }
          });
          izquierda += th.offsetWidth;
          ultima = i;
        }
        // La sombra solo tiene sentido si el usuario fijó columnas de datos
        if (ultima >= 0 && st.fijadas.size) {
          filasTabla.forEach((tr) => { const c = tr.cells[ultima]; if (c && c.classList.contains('dt-fija')) c.classList.add('dt-fija-ultima'); });
        }
      }

      /** Alto del área con scroll = lo que queda de ventana debajo de la tabla (menos el pie) */
      function ajustarAlto() {
        const scroll = $('.dt-scroll');
        if (!scroll || scroll.offsetParent === null) return;   // pestaña oculta: se ajusta al mostrarse
        const pie = $('.dt-pie');
        const disponible = window.innerHeight - scroll.getBoundingClientRect().top - (pie ? pie.offsetHeight : 0) - 36;
        scroll.style.maxHeight = Math.max(240, disponible) + 'px';
      }

      // ---------- vista: columnas, anchos, orden, densidad ----------
      function moverColumna(campo, antesDe) {
        if (campo === antesDe || !colPorCampo(campo)) return;
        const orden = st.ordenColumnas.filter((c) => c !== campo);
        const destino = antesDe ? orden.indexOf(antesDe) : -1;
        orden.splice(destino === -1 ? orden.length : destino, 0, campo);
        st.ordenColumnas = orden;
        guardarVista(); render();
      }
      function fijarColumna(campo, fijar) {
        if (fijar) { st.fijadas.add(campo); st.ocultas.delete(campo); } else st.fijadas.delete(campo);
        guardarVista(); render();
      }
      function ocultarColumna(campo) {
        if (columnasVisibles().length <= 1) return;
        st.ocultas.add(campo); st.fijadas.delete(campo);
        guardarVista(); render();
      }
      function setDensidad(densidad) {
        if (!['compacta', 'normal', 'comoda'].includes(densidad)) return;
        st.densidad = densidad; guardarVista(); render();
      }
      function restablecerVista() {
        aplicarVista(vistaDefault());
        try { if (claveVista()) localStorage.removeItem(claveVista()); } catch (e) { /* no-op */ }
        st.pagina = 1; render();
      }

      // ---------- popovers ----------
      function cerrarPopover() {
        if (popover) { popover.remove(); popover = null; }
      }

      function abrirPopover(ancla, html, alMontar) {
        cerrarPopover();
        popover = document.createElement('div');
        popover.className = 'dt-popover';
        popover.innerHTML = html;
        document.body.appendChild(popover);
        const r = ancla.getBoundingClientRect();
        const ancho = popover.offsetWidth;
        const alto = popover.offsetHeight;
        popover.style.left = Math.max(8, Math.min(r.left, window.innerWidth - ancho - 8)) + 'px';
        popover.style.top = (r.bottom + alto + 8 > window.innerHeight ? Math.max(8, r.top - alto - 6) : r.bottom + 6) + 'px';
        if (alMontar) alMontar(popover);
      }

      function abrirFiltro(ancla, col) {
        const actual = st.filtros[col.campo] || {};
        const esTexto = col.tipo === 'texto' || col.tipo === 'lista';
        const ordenHtml = col.ordenable ? `<div class="dt-pop-orden">
            <button type="button" class="secondary" data-orden="asc">${esTexto ? 'A → Z' : col.tipo === 'fecha' ? 'Más antigua' : 'Menor → mayor'}</button>
            <button type="button" class="secondary" data-orden="desc">${esTexto ? 'Z → A' : col.tipo === 'fecha' ? 'Más reciente' : 'Mayor → menor'}</button>
          </div>` : '';
        const acciones = `<div class="dt-pop-acciones">
            <button type="button" class="secondary" data-accion="quitar">Quitar filtro</button>
            <button type="button" data-accion="aplicar">Aplicar</button>
          </div>`;
        const opcionesColumna = `<div class="dt-pop-col">
            <button type="button" class="secondary" data-accion="fijar">${st.fijadas.has(col.campo) ? '📌 Desfijar' : '📌 Fijar a la izquierda'}</button>
            <button type="button" class="secondary" data-accion="ocultar" ${columnasVisibles().length <= 1 ? 'disabled' : ''}>🙈 Ocultar</button>
          </div>`;

        if (col.tipo === 'lista') {
          const conteo = new Map();
          st.datos.forEach((fila) => {
            const v = valorDe(col, fila); const k = vacio(v) ? '' : String(v);
            conteo.set(k, (conteo.get(k) || 0) + 1);
          });
          const valores = Array.from(conteo.keys()).sort((a, b) => a.localeCompare(b, 'es'));
          const marcados = actual.valores ? new Set(actual.valores) : new Set(valores);
          abrirPopover(ancla, `<h4>${esc(col.titulo)}</h4>${ordenHtml}
            <div class="dt-pop-fila"><input type="search" class="dt-pop-buscar" placeholder="Buscar valor…" /></div>
            <div class="dt-pop-fila"><button type="button" class="secondary" data-accion="todos" style="flex:1">Todos</button><button type="button" class="secondary" data-accion="ninguno" style="flex:1">Ninguno</button></div>
            <div class="dt-lista-valores">${valores.map((v) => `
              <label data-texto="${esc(normalizar(v))}"><input type="checkbox" value="${esc(v)}" ${marcados.has(v) ? 'checked' : ''} />
                <span>${v === '' ? '<em>(vacío)</em>' : esc(v)}</span>
                <button type="button" class="dt-solo" data-solo="${esc(v)}" title="Filtrar solo por este valor">solo</button>
                <span class="dt-conteo">${conteo.get(v)}</span></label>`).join('')}
            </div>${acciones}${opcionesColumna}`, (pop) => {
            const checks = () => Array.from(pop.querySelectorAll('.dt-lista-valores input'));
            pop.querySelector('.dt-pop-buscar').addEventListener('input', (ev) => {
              const q = normalizar(ev.target.value);
              pop.querySelectorAll('.dt-lista-valores label').forEach((l) => { l.hidden = !l.dataset.texto.includes(q); });
            });
            pop.querySelector('[data-accion="todos"]').addEventListener('click', () => checks().forEach((c) => { if (!c.parentElement.hidden) c.checked = true; }));
            pop.querySelector('[data-accion="ninguno"]').addEventListener('click', () => checks().forEach((c) => { if (!c.parentElement.hidden) c.checked = false; }));
            pop.querySelectorAll('[data-solo]').forEach((b) => b.addEventListener('click', (ev) => {
              ev.preventDefault();   // no marcar la casilla del label
              st.filtros[col.campo] = { valores: [b.dataset.solo] };
              st.pagina = 1; cerrarPopover(); render();
            }));
            pop.querySelector('[data-accion="aplicar"]').addEventListener('click', () => {
              const elegidos = checks().filter((c) => c.checked).map((c) => c.value);
              if (elegidos.length === valores.length) delete st.filtros[col.campo];
              else st.filtros[col.campo] = { valores: elegidos };
              st.pagina = 1; cerrarPopover(); render();
            });
            conectarComunes(pop, col);
            pop.querySelector('.dt-pop-buscar').focus();
          });
          return;
        }

        const ops = OPERADORES[col.tipo] || OPERADORES.texto;
        const tipoInput = col.tipo === 'numero' ? 'number' : col.tipo === 'fecha' ? 'date' : 'text';
        const presets = col.tipo === 'fecha' ? `<div class="dt-pop-presets">
            <button type="button" class="secondary" data-preset="hoy">Hoy</button>
            <button type="button" class="secondary" data-preset="ult7">Últimos 7 días</button>
            <button type="button" class="secondary" data-preset="ult30">Últimos 30 días</button>
            <button type="button" class="secondary" data-preset="mes">Este mes</button>
            <button type="button" class="secondary" data-preset="prox30">Próximos 30 días</button>
            <button type="button" class="secondary" data-preset="pasadas">Antes de hoy</button>
          </div>` : '';
        abrirPopover(ancla, `<h4>${esc(col.titulo)}</h4>${ordenHtml}${presets}
          <div class="dt-pop-fila"><select class="dt-pop-op" aria-label="Condición">${ops.map(([k, t]) => `<option value="${k}" ${actual.op === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
          <div class="dt-pop-fila"><input type="${tipoInput}" class="dt-pop-v1" step="any" placeholder="Valor" aria-label="Valor" value="${esc(actual.v1 || '')}" /></div>
          <div class="dt-pop-fila dt-pop-fila-v2"><input type="${tipoInput}" class="dt-pop-v2" step="any" placeholder="y…" aria-label="Hasta" value="${esc(actual.v2 || '')}" /></div>
          ${acciones}${opcionesColumna}`, (pop) => {
          const op = pop.querySelector('.dt-pop-op');
          const v1 = pop.querySelector('.dt-pop-v1');
          const filaV2 = pop.querySelector('.dt-pop-fila-v2');
          const sync = () => {
            v1.parentElement.hidden = SIN_VALOR.includes(op.value);
            filaV2.hidden = op.value !== 'entre';
          };
          op.addEventListener('change', sync);
          sync();
          (v1.parentElement.hidden ? op : v1).focus();

          const aplicar = () => {
            const f = { op: op.value, v1: v1.value, v2: pop.querySelector('.dt-pop-v2').value };
            if (!SIN_VALOR.includes(f.op) && f.v1 === '') delete st.filtros[col.campo];
            else st.filtros[col.campo] = f;
            st.pagina = 1; cerrarPopover(); render();
          };
          pop.querySelector('[data-accion="aplicar"]').addEventListener('click', aplicar);
          pop.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') aplicar(); }));

          pop.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => {
            const hoy = sumarDias(0);
            const primeroDeMes = hoy.slice(0, 8) + '01';
            const rangos = {
              hoy: { op: 'igual', v1: hoy },
              ult7: { op: 'entre', v1: sumarDias(-6), v2: hoy },
              ult30: { op: 'entre', v1: sumarDias(-29), v2: hoy },
              mes: { op: 'entre', v1: primeroDeMes, v2: hoy },
              prox30: { op: 'entre', v1: hoy, v2: sumarDias(30) },
              pasadas: { op: 'antes', v1: hoy },
            };
            st.filtros[col.campo] = rangos[b.dataset.preset];
            st.pagina = 1; cerrarPopover(); render();
          }));
          conectarComunes(pop, col);
        });
      }

      function conectarComunes(pop, col) {
        pop.querySelector('[data-accion="quitar"]').addEventListener('click', () => {
          delete st.filtros[col.campo]; st.pagina = 1; cerrarPopover(); render();
        });
        pop.querySelectorAll('[data-orden]').forEach((b) => b.addEventListener('click', () => {
          st.orden = [{ campo: col.campo, dir: b.dataset.orden }]; guardarVista(); cerrarPopover(); render();
        }));
        pop.querySelector('[data-accion="fijar"]').addEventListener('click', () => { cerrarPopover(); fijarColumna(col.campo, !st.fijadas.has(col.campo)); });
        pop.querySelector('[data-accion="ocultar"]').addEventListener('click', () => { cerrarPopover(); ocultarColumna(col.campo); });
      }

      function abrirVista(ancla) {
        const pintar = (pop) => {
          const orden = st.ordenColumnas.map(colPorCampo);
          pop.innerHTML = `<h4>Columnas</h4><div class="dt-columnas">${orden.map((c, i) => `
            <div class="dt-columna-item">
              <label><input type="checkbox" value="${esc(c.campo)}" ${st.ocultas.has(c.campo) ? '' : 'checked'} /> ${esc(c.titulo)}</label>
              <button type="button" data-fijar="${esc(c.campo)}" class="${st.fijadas.has(c.campo) ? 'activo' : ''}" title="${st.fijadas.has(c.campo) ? 'Desfijar' : 'Fijar a la izquierda'}" aria-label="Fijar ${esc(c.titulo)}">📌</button>
              <button type="button" data-subir="${esc(c.campo)}" ${i === 0 ? 'disabled' : ''} title="Mover arriba" aria-label="Mover ${esc(c.titulo)} arriba">↑</button>
              <button type="button" data-bajar="${esc(c.campo)}" ${i === orden.length - 1 ? 'disabled' : ''} title="Mover abajo" aria-label="Mover ${esc(c.titulo)} abajo">↓</button>
            </div>`).join('')}</div>
            <div class="dt-vista-opciones">
              <label style="margin:0">Densidad
                <select class="dt-densidad" style="margin-top:4px">
                  <option value="compacta" ${st.densidad === 'compacta' ? 'selected' : ''}>Compacta</option>
                  <option value="normal" ${st.densidad === 'normal' ? 'selected' : ''}>Normal</option>
                  <option value="comoda" ${st.densidad === 'comoda' ? 'selected' : ''}>Cómoda</option>
                </select>
              </label>
              <button type="button" class="secondary dt-restablecer">↺ Restablecer vista</button>
              ${cfg.idTabla ? '<span class="page-subtitle" style="font-size:11px">Tu vista se guarda en este navegador.</span>' : ''}
            </div>`;

          pop.querySelectorAll('.dt-columnas input').forEach((i) => i.addEventListener('change', () => {
            if (i.checked) st.ocultas.delete(i.value);
            else if (columnasVisibles().length > 1) { st.ocultas.add(i.value); st.fijadas.delete(i.value); }
            else i.checked = true; // siempre al menos una columna
            guardarVista(); render(); pintar(pop);
          }));
          pop.querySelectorAll('[data-fijar]').forEach((b) => b.addEventListener('click', () => { fijarColumna(b.dataset.fijar, !st.fijadas.has(b.dataset.fijar)); pintar(pop); }));
          pop.querySelectorAll('[data-subir]').forEach((b) => b.addEventListener('click', () => {
            const i = st.ordenColumnas.indexOf(b.dataset.subir);
            moverColumna(b.dataset.subir, st.ordenColumnas[i - 1]); pintar(pop);
          }));
          pop.querySelectorAll('[data-bajar]').forEach((b) => b.addEventListener('click', () => {
            const i = st.ordenColumnas.indexOf(b.dataset.bajar);
            moverColumna(b.dataset.bajar, st.ordenColumnas[i + 2] || null); pintar(pop);
          }));
          pop.querySelector('.dt-densidad').addEventListener('change', (ev) => setDensidad(ev.target.value));
          pop.querySelector('.dt-restablecer').addEventListener('click', () => { restablecerVista(); pintar(pop); Notificar.info('Vista restablecida'); });
        };
        abrirPopover(ancla, '', pintar);
      }

      // ---------- edición (compartida por celda y panel) ----------
      function crearControl(col, valor) {
        let control;
        if (col.tipo === 'lista') {
          const opciones = col.opciones || Array.from(new Set(st.datos.map((f) => valorDe(col, f)).filter((v) => !vacio(v)).map(String))).sort();
          control = document.createElement('select');
          control.innerHTML = ['<option value=""></option>'].concat(opciones.map((o) => `<option ${String(o) === String(valor) ? 'selected' : ''}>${esc(o)}</option>`)).join('');
        } else {
          control = document.createElement('input');
          control.type = col.tipo === 'numero' ? 'number' : col.tipo === 'fecha' ? 'date' : 'text';
          if (col.tipo === 'numero') control.step = 'any';
          control.value = valorOriginal(col, valor);
        }
        control.setAttribute('aria-label', col.titulo);
        return control;
      }
      function valorOriginal(col, valor) {
        return col.tipo === 'fecha' ? claveFecha(valor) : (vacio(valor) ? '' : String(valor));
      }

      /** Llama alEditar y actualiza la fila en memoria. Lanza si el servidor rechaza. */
      async function aplicarCambio(fila, col, textoControl) {
        const nuevo = col.tipo === 'numero' ? aNumero(textoControl) : textoControl;
        const resultado = await cfg.alEditar(fila, col.campo, nuevo);
        if (resultado && typeof resultado === 'object') {
          const i = st.datos.findIndex((f) => idDe(f) === idDe(fila));
          if (i !== -1) st.datos[i] = resultado;
        }
      }

      /** Revierte una edición del historial (desde "Deshacer" del aviso o con Ctrl+Z) */
      async function deshacer(entrada) {
        st.historial = st.historial.filter((e) => e !== entrada);
        const actual = st.datos.find((f) => idDe(f) === entrada.id);
        if (!actual) { Notificar.error('No se puede deshacer: el registro ya no existe'); return; }
        try {
          await aplicarCambio(actual, entrada.col, entrada.anterior);
          render();
          refrescarPanel();
          Notificar.info(`Se restauró ${entrada.col.titulo} de ${etiquetaDe(actual)}`);
        } catch (err) {
          Notificar.error('No se pudo deshacer: ' + err.message);
        }
      }

      /**
       * Guarda un campo (celda o panel). Regresa true si guardó, false si no había cambio. Lanza si falla.
       * El aviso de éxito ofrece "Deshacer" y la edición queda en el historial para Ctrl+Z.
       */
      async function guardarCambio(fila, col, textoControl) {
        const anterior = valorOriginal(col, valorDe(col, fila));
        if (textoControl === anterior) return false;
        await aplicarCambio(fila, col, textoControl);

        const entrada = { seq: ++secuenciaHistorial, id: idDe(fila), col, anterior };
        st.historial.push(entrada);
        if (st.historial.length > MAX_HISTORIAL) st.historial.shift();
        Notificar.exito(`${col.titulo} de ${etiquetaDe(fila)} actualizado`, {
          duracion: 8000,
          accion: { texto: 'Deshacer', alHacer: () => deshacer(entrada) },
        });
        return true;
      }

      /** Devuelve el foco al ✏️ de una celda (usuarios de teclado no pierden su lugar) */
      function enfocarLapiz(id, campo) {
        const btn = tbody.querySelector(`tr[data-id="${CSS.escape(id)}"] td[data-campo="${CSS.escape(campo)}"] .dt-btn-editar-celda`);
        if (btn) { btn.style.opacity = '1'; btn.focus(); btn.addEventListener('blur', () => { btn.style.opacity = ''; }, { once: true }); }
      }

      function iniciarEdicion(td) {
        const tr = td.closest('tr');
        const col = colPorCampo(td.dataset.campo);
        const fila = st.datos.find((f) => idDe(f) === tr.dataset.id);
        if (!col || !fila || !puedeEditarCelda(col) || st.editando) return;
        cerrarPopover();

        const id = idDe(fila);
        const control = crearControl(col, valorDe(col, fila));
        const editor = document.createElement('div');
        editor.className = 'dt-editor';
        const btnOk = document.createElement('button');
        btnOk.type = 'button'; btnOk.textContent = '✓'; btnOk.title = 'Guardar (Enter)';
        btnOk.setAttribute('aria-label', 'Guardar');
        const btnCancelar = document.createElement('button');
        btnCancelar.type = 'button'; btnCancelar.className = 'secondary'; btnCancelar.textContent = '✕';
        btnCancelar.title = 'Cancelar (Esc)'; btnCancelar.setAttribute('aria-label', 'Cancelar');
        editor.append(control, btnOk, btnCancelar);

        st.editando = { id, campo: col.campo };
        td.classList.add('dt-editando');
        td.classList.remove('dt-error-celda');
        td.removeAttribute('title');
        td.innerHTML = '';
        td.appendChild(editor);
        control.focus();
        if (control.select && control.type === 'text') control.select();

        let terminado = false;
        const cancelar = (devolverFoco) => {
          if (terminado) return;
          terminado = true; st.editando = null; render();
          if (devolverFoco) enfocarLapiz(id, col.campo);
        };
        const guardar = async () => {
          if (terminado) return;
          terminado = true;
          td.classList.add('dt-guardando');
          control.disabled = btnOk.disabled = btnCancelar.disabled = true;
          try {
            await guardarCambio(fila, col, control.value);
            st.editando = null;
            render();
            refrescarPanel();
            enfocarLapiz(id, col.campo);
          } catch (err) {
            st.editando = null;
            render();
            const celda = tbody.querySelector(`tr[data-id="${CSS.escape(id)}"] td[data-campo="${CSS.escape(col.campo)}"]`);
            if (celda) { celda.classList.add('dt-error-celda'); celda.title = err.message; }
            avisar('No se guardó: ' + err.message, 'error');
          }
        };

        control.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); guardar(); }
          if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); cancelar(true); }
        });
        btnOk.addEventListener('click', guardar);
        btnCancelar.addEventListener('click', () => cancelar(true));
        // Salir de la celda sin confirmar CANCELA (un clic accidental no cambia datos)
        editor.addEventListener('focusout', (ev) => {
          if (ev.relatedTarget && editor.contains(ev.relatedTarget)) return;
          setTimeout(() => { if (!editor.contains(document.activeElement)) cancelar(false); }, 0);
        });
      }

      // ---------- copiar ----------
      /** Seleccionados como texto separado por tabuladores (se pega en Excel en columnas) */
      function textoSeleccion() {
        const cols = columnasVisibles().filter((c) => c.exportable);
        const filas = filasFiltradas().filter((f) => st.seleccion.has(idDe(f)));
        const limpiar = (t) => String(t).replace(/[\t\r\n]+/g, ' ');
        return [cols.map((c) => limpiar(c.titulo)).join('\t')]
          .concat(filas.map((f) => cols.map((c) => limpiar(c.valorExportar ? c.valorExportar(f) : textoVisible(c, f))).join('\t')))
          .join('\n');
      }

      async function copiarSeleccion() {
        const n = st.seleccion.size;
        if (!n) return '';
        const texto = textoSeleccion();
        let copiado = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(texto); copiado = true; }
        } catch (e) { /* el marco de Apps Script puede bloquear la API: usar el método clásico */ }
        if (!copiado) {
          const area = document.createElement('textarea');
          area.value = texto;
          area.setAttribute('readonly', '');
          area.style.cssText = 'position:fixed;top:-1000px;opacity:0';
          document.body.appendChild(area);
          area.select();
          try { copiado = document.execCommand('copy'); } catch (e) { copiado = false; }
          area.remove();
        }
        if (copiado) Notificar.exito(`${n} ${plural(n, 'registro')} ${plural(n, 'copiado')}: pégalos en Excel`);
        else Notificar.error('El navegador no permitió copiar. Usa "Exportar a Excel".');
        return texto;
      }

      // ---------- panel lateral de detalle ----------
      function cerrarPanel() {
        if (!panel) return;
        panel.fondo.remove();
        panel.elemento.remove();
        document.removeEventListener('keydown', panel.alTecla, true);
        const foco = panel.focoPrevio;
        panel = null;
        st.detalleId = null;
        if (foco && document.body.contains(foco)) foco.focus();
      }

      function abrirPanel(id) {
        cerrarPopover();
        const focoPrevio = document.activeElement;
        if (panel) cerrarPanel();
        st.detalleId = id;

        const fondo = document.createElement('div');
        fondo.className = 'dt-panel-fondo';
        const elemento = document.createElement('aside');
        elemento.className = 'dt-panel';
        elemento.setAttribute('role', 'dialog');
        elemento.setAttribute('aria-modal', 'true');
        document.body.append(fondo, elemento);

        const alTecla = (ev) => {
          if (ev.key === 'Escape' && !elemento.querySelector('.dt-campo-valor input, .dt-campo-valor select')) {
            ev.stopPropagation(); cerrarPanel();
          }
        };
        document.addEventListener('keydown', alTecla, true);
        fondo.addEventListener('click', cerrarPanel);
        panel = { fondo, elemento, alTecla, focoPrevio };
        pintarPanel();
        const cerrar = elemento.querySelector('.dt-panel-cerrar');
        if (cerrar) cerrar.focus();
      }

      function refrescarPanel() {
        if (panel && !panel.elemento.querySelector('.dt-campo-valor input, .dt-campo-valor select')) pintarPanel();
      }

      function pintarPanel() {
        if (!panel) return;
        const fila = st.datos.find((f) => idDe(f) === st.detalleId);
        if (!fila) { cerrarPanel(); return; }
        const opciones = cfg.detalle || {};
        const titulo = opciones.titulo ? opciones.titulo(fila) : etiquetaDe(fila);

        panel.elemento.setAttribute('aria-label', titulo);
        panel.elemento.innerHTML = `
          <div class="dt-panel-header">
            <div><h3>${esc(titulo)}</h3><p>Detalle del registro</p></div>
            <button type="button" class="modal-close dt-panel-cerrar" aria-label="Cerrar">✕</button>
          </div>
          <div class="dt-panel-cuerpo">
            ${columnas.filter((c) => c.enDetalle).map((col) => {
              const valor = valorDe(col, fila);
              const contenido = col.render ? col.render(valor, fila) : (esc(textoVisible(col, fila)) || '<span style="color:var(--color-text-muted)">—</span>');
              return `<div class="dt-campo" data-campo="${esc(col.campo)}">
                <div class="dt-campo-titulo">${esc(col.titulo)}</div>
                <div class="dt-campo-valor"><span class="dt-campo-texto">${contenido}</span>
                  ${puedeEditarPanel(col) ? `<button type="button" class="secondary dt-btn-editar-campo" aria-label="Editar ${esc(col.titulo)}">✏️ Editar</button>` : ''}
                </div>
              </div>`;
            }).join('')}
            <div class="dt-panel-extra"></div>
          </div>`;

        panel.elemento.querySelector('.dt-panel-cerrar').addEventListener('click', cerrarPanel);
        panel.elemento.querySelectorAll('.dt-btn-editar-campo').forEach((btn) => {
          btn.addEventListener('click', () => editarEnPanel(fila, colPorCampo(btn.closest('.dt-campo').dataset.campo)));
        });
        if (opciones.contenidoExtra) opciones.contenidoExtra(fila, panel.elemento.querySelector('.dt-panel-extra'));
      }

      function editarEnPanel(fila, col) {
        const zona = panel.elemento.querySelector(`.dt-campo[data-campo="${CSS.escape(col.campo)}"] .dt-campo-valor`);
        const control = crearControl(col, valorDe(col, fila));
        zona.innerHTML = '';
        const guardarBtn = document.createElement('button');
        guardarBtn.type = 'button'; guardarBtn.textContent = 'Guardar';
        const cancelarBtn = document.createElement('button');
        cancelarBtn.type = 'button'; cancelarBtn.className = 'secondary'; cancelarBtn.textContent = 'Cancelar';
        zona.append(control, guardarBtn, cancelarBtn);
        control.focus();

        const guardar = async () => {
          guardarBtn.disabled = cancelarBtn.disabled = control.disabled = true;
          guardarBtn.textContent = 'Guardando…';
          try {
            await guardarCambio(fila, col, control.value);
            render();
            pintarPanel();
          } catch (err) {
            avisar('No se guardó: ' + err.message, 'error');
            guardarBtn.disabled = cancelarBtn.disabled = control.disabled = false;
            guardarBtn.textContent = 'Guardar';
            control.focus();
          }
        };
        guardarBtn.addEventListener('click', guardar);
        cancelarBtn.addEventListener('click', pintarPanel);
        control.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); guardar(); }
          if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); pintarPanel(); }
        });
      }

      // ---------- eventos ----------
      $('.dt-buscar').addEventListener('input', (ev) => { st.busqueda = ev.target.value; st.pagina = 1; render(); });
      $('.dt-btn-columnas').addEventListener('click', (ev) => abrirVista(ev.currentTarget));
      $('.dt-tamano').addEventListener('change', (ev) => { st.tamanoPagina = Number(ev.target.value); st.pagina = 1; guardarVista(); render(); });
      $('.dt-primera').addEventListener('click', () => { st.pagina = 1; render(); });
      $('.dt-prev').addEventListener('click', () => { st.pagina--; render(); });
      $('.dt-next').addEventListener('click', () => { st.pagina++; render(); });
      $('.dt-ultima').addEventListener('click', () => { st.pagina = Infinity; render(); });
      $('.dt-btn-copiar').addEventListener('click', copiarSeleccion);

      function limpiarTodo() {
        st.filtros = {}; st.busqueda = ''; $('.dt-buscar').value = ''; st.pagina = 1; render();
      }

      $('.dt-filtros-activos').addEventListener('click', (ev) => {
        const quitar = ev.target.closest('[data-quitar-filtro]');
        if (quitar) { delete st.filtros[quitar.dataset.quitarFiltro]; st.pagina = 1; render(); return; }
        if (ev.target.closest('[data-quitar-busqueda]')) { st.busqueda = ''; $('.dt-buscar').value = ''; st.pagina = 1; render(); return; }
        if (ev.target.closest('[data-limpiar-todo]')) limpiarTodo();
      });

      $('.dt-banner').addEventListener('click', (ev) => {
        if (ev.target.closest('[data-seleccionar-todos]')) { filasFiltradas().forEach((f) => st.seleccion.add(idDe(f))); render(); }
        if (ev.target.closest('[data-quitar-seleccion]')) { st.seleccion.clear(); st.ancla = null; render(); }
      });

      thead.addEventListener('click', (ev) => {
        const btnFiltro = ev.target.closest('.dt-btn-filtro');
        if (btnFiltro) { ev.stopPropagation(); abrirFiltro(btnFiltro, colPorCampo(btnFiltro.dataset.campo)); return; }

        const titulo = ev.target.closest('.dt-th-titulo');
        if (titulo) {
          const col = colPorCampo(titulo.dataset.campo);
          if (!col || !col.ordenable) return;
          const i = st.orden.findIndex((o) => o.campo === col.campo);
          if (ev.shiftKey) {
            // Orden múltiple: agregar / invertir / quitar esta columna sin tocar las demás
            if (i === -1) st.orden.push({ campo: col.campo, dir: 'asc' });
            else if (st.orden[i].dir === 'asc') st.orden[i].dir = 'desc';
            else st.orden.splice(i, 1);
          } else {
            // Clic normal: orden solo por esta columna, asc → desc → sin orden
            if (i === -1 || st.orden.length > 1) st.orden = [{ campo: col.campo, dir: 'asc' }];
            else if (st.orden[0].dir === 'asc') st.orden[0].dir = 'desc';
            else st.orden = [];
          }
          guardarVista();
          render();
        }
      });

      thead.addEventListener('change', (ev) => {
        if (!ev.target.classList.contains('dt-check-pagina')) return;
        // Solo la página visible; para todos, el aviso ofrece "Seleccionar los N registros"
        const inicio = (st.pagina - 1) * st.tamanoPagina;
        const ids = filasFiltradas().slice(inicio, inicio + st.tamanoPagina).map(idDe);
        if (ev.target.checked) ids.forEach((id) => st.seleccion.add(id));
        else ids.forEach((id) => st.seleccion.delete(id));
        st.ancla = null;
        render();
      });

      // --- Ajuste de ancho (arrastrar el borde del encabezado) ---
      thead.addEventListener('mousedown', (ev) => {
        const manija = ev.target.closest('.dt-resize');
        if (!manija) return;
        ev.preventDefault();
        ev.stopPropagation();
        const campo = manija.dataset.campo;
        const th = manija.closest('th');
        th.draggable = false;
        const xInicial = ev.clientX;
        const anchoInicial = th.getBoundingClientRect().width;
        manija.classList.add('activo');
        document.body.classList.add('dt-redimensionando');

        const aplicar = (w) => {
          contenedor.querySelectorAll(`[data-col="${CSS.escape(campo)}"], td[data-campo="${CSS.escape(campo)}"]`).forEach((c) => {
            c.style.width = c.style.minWidth = c.style.maxWidth = w + 'px';
          });
        };
        const mover = (e) => {
          st.anchos[campo] = Math.max(ANCHO_MINIMO, Math.round(anchoInicial + e.clientX - xInicial));
          aplicar(st.anchos[campo]);
          aplicarFijadas();
        };
        const soltar = () => {
          document.removeEventListener('mousemove', mover);
          document.removeEventListener('mouseup', soltar);
          document.body.classList.remove('dt-redimensionando');
          guardarVista();
          render();
        };
        document.addEventListener('mousemove', mover);
        document.addEventListener('mouseup', soltar);
      });
      thead.addEventListener('dblclick', (ev) => {
        const manija = ev.target.closest('.dt-resize');
        if (!manija) return;
        delete st.anchos[manija.dataset.campo];   // vuelve al ancho automático según el contenido
        guardarVista();
        render();
      });

      // --- Reordenar columnas arrastrando el encabezado ---
      let arrastrando = null;
      const limpiarMarcas = () => thead.querySelectorAll('th').forEach((th) => th.classList.remove('dt-drop-antes', 'dt-drop-despues', 'dt-arrastrando'));
      thead.addEventListener('dragstart', (ev) => {
        const th = ev.target.closest && ev.target.closest('th[data-col]');
        if (!th) return;
        arrastrando = th.dataset.col;
        th.classList.add('dt-arrastrando');
        if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', arrastrando); }
      });
      thead.addEventListener('dragover', (ev) => {
        const th = ev.target.closest && ev.target.closest('th[data-col]');
        if (!arrastrando || !th || th.dataset.col === arrastrando) return;
        ev.preventDefault();
        const r = th.getBoundingClientRect();
        const despues = ev.clientX > r.left + r.width / 2;
        limpiarMarcas();
        thead.querySelector(`th[data-col="${CSS.escape(arrastrando)}"]`)?.classList.add('dt-arrastrando');
        th.classList.add(despues ? 'dt-drop-despues' : 'dt-drop-antes');
      });
      thead.addEventListener('drop', (ev) => {
        const th = ev.target.closest && ev.target.closest('th[data-col]');
        if (!arrastrando || !th) return;
        ev.preventDefault();
        const destino = th.dataset.col;
        if (destino !== arrastrando) {
          const despues = th.classList.contains('dt-drop-despues');
          const orden = st.ordenColumnas.filter((c) => c !== arrastrando);
          const siguiente = despues ? orden[orden.indexOf(destino) + 1] || null : destino;
          moverColumna(arrastrando, siguiente);
        }
        arrastrando = null;
        limpiarMarcas();
      });
      thead.addEventListener('dragend', () => { arrastrando = null; limpiarMarcas(); });

      // --- Selección: clic y Shift+clic en rango ---
      tbody.addEventListener('mousedown', (ev) => {
        // Shift+clic no debe seleccionar texto de la página
        if (ev.shiftKey && ev.target.classList.contains('dt-check')) ev.preventDefault();
      });

      tbody.addEventListener('click', (ev) => {
        const check = ev.target.closest('.dt-check');
        if (check) {
          const id = check.closest('tr').dataset.id;
          const marcar = check.checked;
          if (ev.shiftKey && st.ancla && st.ancla !== id) {
            const ids = filasFiltradas().map(idDe);
            const a = ids.indexOf(st.ancla);
            const b = ids.indexOf(id);
            if (a !== -1 && b !== -1) {
              ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach((x) => (marcar ? st.seleccion.add(x) : st.seleccion.delete(x)));
            } else if (marcar) st.seleccion.add(id); else st.seleccion.delete(id);
          } else if (marcar) st.seleccion.add(id); else st.seleccion.delete(id);
          st.ancla = id;
          render();
          // Mantener el foco en la casilla para seguir con teclado (Espacio / Shift)
          const nueva = tbody.querySelector(`tr[data-id="${CSS.escape(id)}"] .dt-check`);
          if (nueva) nueva.focus();
          return;
        }

        const ver = ev.target.closest('.dt-btn-ver');
        if (ver) { abrirPanel(ver.closest('tr').dataset.id); return; }

        const lapiz = ev.target.closest('.dt-btn-editar-celda');
        if (lapiz) { iniciarEdicion(lapiz.closest('td')); return; }

        // En pantallas táctiles (sin doble clic ni hover), tocar la fila abre el detalle
        if (esTactil() && conDetalle() && !st.editando) {
          const tr = ev.target.closest('tr[data-id]');
          const interactivo = ev.target.closest('button, a, input, select, label, .dt-editor');
          if (tr && !interactivo) abrirPanel(tr.dataset.id);
        }
      });

      // F2 sobre una celda editable (con foco en su ✏️) abre la edición, como en Excel
      tbody.addEventListener('keydown', (ev) => {
        if (ev.key !== 'F2') return;
        const td = ev.target.closest('td.dt-editable');
        if (td && !td.classList.contains('dt-editando')) { ev.preventDefault(); iniciarEdicion(td); }
      });

      // Atajo para quien ya lo conoce (como en Excel); la forma visible es el ✏️
      tbody.addEventListener('dblclick', (ev) => {
        const td = ev.target.closest('td.dt-editable');
        if (td && !td.classList.contains('dt-editando')) iniciarEdicion(td);
      });

      $('.dt-btn-eliminar').addEventListener('click', async () => {
        const filas = st.datos.filter((f) => st.seleccion.has(idDe(f)));
        if (!filas.length) return;
        const n = filas.length;
        // Fricción según el riesgo: 1 → simple; varios → lista de afectados; muchos → escribir ELIMINAR
        const ok = await Confirmar.pedir({
          titulo: n === 1 ? '¿Eliminar este registro?' : `¿Eliminar ${n} registros?`,
          mensaje: 'Esta acción no se puede deshacer.' + (n > 1 ? ' Se eliminarán:' : ''),
          detalle: filas.map(etiquetaDe),
          textoConfirmar: n === 1 ? 'Eliminar' : `Eliminar ${n}`,
          peligro: true,
          palabraClave: n >= cfg.umbralPalabraClave ? 'ELIMINAR' : null,
        });
        if (!ok) return;

        const boton = $('.dt-btn-eliminar');
        boton.disabled = true;
        boton.textContent = 'Eliminando…';
        try {
          await cfg.alEliminar(filas);
          const ids = new Set(filas.map(idDe));
          st.datos = st.datos.filter((f) => !ids.has(idDe(f)));
          st.seleccion.clear();
          st.ancla = null;
          st.historial = st.historial.filter((e) => !ids.has(e.id));
          if (panel && ids.has(st.detalleId)) cerrarPanel();
          render();
          avisar(`${n} ${plural(n, 'registro')} ${plural(n, 'eliminado')}`);
        } catch (err) {
          avisar('No se eliminó: ' + err.message, 'error');
        } finally {
          boton.disabled = false;
          boton.textContent = '🗑️ Eliminar seleccionados';
        }
      });

      if (cfg.exportar) {
        $('.dt-btn-excel').addEventListener('click', async () => {
          const boton = $('.dt-btn-excel');
          const cols = columnasVisibles().filter((c) => c.exportable);
          const filas = filasFiltradas();
          if (!filas.length) { avisar('No hay registros para exportar con los filtros actuales', 'error'); return; }
          boton.disabled = true;
          boton.textContent = 'Exportando…';
          try {
            await ExportarExcel.descargar({
              nombreArchivo: cfg.exportar.nombreArchivo,
              nombreHoja: cfg.exportar.nombreHoja,
              columnas: cols.map((c) => ({ titulo: c.titulo, tipo: c.tipo === 'lista' ? 'texto' : c.tipo })),
              filas: filas.map((fila) => cols.map((c) => (c.valorExportar ? c.valorExportar(fila) : valorDe(c, fila)))),
            });
            avisar(`${filas.length} ${plural(filas.length, 'registro')} ${plural(filas.length, 'exportado')}`);
          } catch (err) {
            avisar('No se pudo exportar: ' + err.message, 'error');
          } finally {
            boton.disabled = false;
            boton.textContent = '📥 Exportar a Excel';
          }
        });
      }

      // ---------- atajos globales (solo si esta tabla está a la vista) ----------
      const desmontado = () => {
        if (document.body.contains(contenedor)) return false;
        limpiarGlobales();
        return true;
      };
      // "A la vista" = conectada y sin un contenedor oculto (así esconde Tabs las pestañas).
      // No se usa offsetParent: es null dentro de elementos position:fixed aunque se vea.
      const visible = () => document.body.contains(contenedor) && !contenedor.closest('[hidden]');
      const alClicFuera = (ev) => {
        if (desmontado()) return;
        if (popover && !popover.contains(ev.target) && !ev.target.closest('.dt-btn-filtro, .dt-btn-columnas')) cerrarPopover();
      };
      const alTecla = (ev) => {
        if (desmontado()) return;
        if (ev.key === 'Escape') {
          if (popover) { cerrarPopover(); return; }
          // Quitar selección solo si el usuario está trabajando dentro de esta tabla
          if (!panel && !st.editando && st.seleccion.size && contenedor.contains(document.activeElement)) {
            st.seleccion.clear(); st.ancla = null; render();
          }
          return;
        }
        const ctrl = ev.ctrlKey || ev.metaKey;
        if (!ctrl || panel || st.editando || escribiendo(ev.target) || document.querySelector('.confirmar-card')) return;
        const tecla = ev.key.toLowerCase();

        if (tecla === 'z' && !ev.shiftKey && st.historial.length && visible()) {
          ev.preventDefault();
          deshacer(st.historial[st.historial.length - 1]);
        }
        if (tecla === 'c' && st.seleccion.size && visible()) {
          const hayTextoSeleccionado = window.getSelection && String(window.getSelection()).trim() !== '';
          const enTabla = contenedor.contains(document.activeElement) || document.activeElement === document.body;
          if (!hayTextoSeleccionado && enTabla) { ev.preventDefault(); copiarSeleccion(); }
        }
      };
      const alRedimensionar = () => { if (!desmontado()) { ajustarAlto(); aplicarFijadas(); } };
      function limpiarGlobales() {
        cerrarPopover();
        cerrarPanel();
        document.removeEventListener('mousedown', alClicFuera);
        document.removeEventListener('keydown', alTecla);
        window.removeEventListener('resize', alRedimensionar);
      }
      document.addEventListener('mousedown', alClicFuera);
      document.addEventListener('keydown', alTecla);
      window.addEventListener('resize', alRedimensionar);

      render();

      return {
        setDatos(datos) {
          st.datos = datos || [];
          st.cargando = false;
          st.refrescando = false;
          st.error = null;
          if (!st.editando) { render(); refrescarPanel(); }
        },
        /** Sin datos aún: filas grises. Con datos a la vista: barra de carga arriba, sin borrar lo que se ve. */
        setCargando(valor) {
          if (valor && st.datos.length) { st.refrescando = true; st.cargando = false; }
          else { st.cargando = !!valor; st.refrescando = false; }
          if (valor) st.error = null;
          render();
        },
        setError(mensaje) { st.error = mensaje || null; st.cargando = false; st.refrescando = false; render(); },
        getDatos: () => st.datos.slice(),
        getSeleccion: () => st.datos.filter((f) => st.seleccion.has(idDe(f))),
        limpiarSeleccion() { st.seleccion.clear(); st.ancla = null; render(); },
        copiarSeleccion,
        textoSeleccion,
        setFiltro(campo, filtro) {
          if (filtro) st.filtros[campo] = filtro; else delete st.filtros[campo];
          st.pagina = 1; render();
        },
        limpiarFiltros: limpiarTodo,
        moverColumna,
        fijarColumna,
        ocultarColumna,
        setDensidad,
        restablecerVista,
        getVista: () => ({ ordenColumnas: st.ordenColumnas.slice(), fijadas: Array.from(st.fijadas), ocultas: Array.from(st.ocultas), anchos: Object.assign({}, st.anchos), orden: st.orden.map((o) => Object.assign({}, o)), densidad: st.densidad, tamanoPagina: st.tamanoPagina }),
        abrirDetalle: abrirPanel,
        /** Llamar si la tabla estaba oculta (p. ej. en otra pestaña) y se acaba de mostrar */
        ajustarAlto() { ajustarAlto(); aplicarFijadas(); },
        destruir() { limpiarGlobales(); contenedor.innerHTML = ''; },
      };
    }

    return { crear };
  })();
</script>
