<style>
  /* ============ DataTable — estilos (todo con prefijo .dt) ============ */
  .dt { position: relative; }
  .dt .ico { width: 1.05em; height: 1.05em; }

  /* ---- Barra superior ---- */
  .dt-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .dt-toolbar .dt-buscar { max-width: 260px; }
  .dt-toolbar button { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; font-size: 13px; white-space: nowrap; }
  .dt-toolbar .dt-espacio { flex: 1; }
  .dt-seleccion-info { font-size: 12.5px; color: var(--color-text-muted); }
  .dt-ayuda { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-text-muted); cursor: help; padding: 4px 6px; }

  /* ---- Filtros activos (chips) ---- */
  .dt-filtros-activos { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; font-size: 12px; }
  .dt-filtros-activos .dt-filtros-titulo { color: var(--color-text-muted); }
  .dt-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 999px;
    background: var(--color-accent-soft); color: var(--color-text); border: 1px solid var(--color-accent);
  }
  .dt-chip button {
    display: inline-flex; background: transparent; color: var(--color-text-muted); border: none; padding: 3px 5px; font-size: 11px; border-radius: 999px;
  }
  .dt-chip button:hover { background: var(--color-surface); color: var(--color-danger); }
  .dt-link { background: transparent; border: none; color: var(--color-primary); padding: 2px 4px; font-size: 12px; text-decoration: underline; }
  :root[data-theme="dark"] .dt-link { color: var(--color-accent); }
  .dt-link:hover { background: transparent; }

  /* ---- Aviso de selección (patrón Gmail) ---- */
  .dt-banner {
    display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap;
    padding: 7px 10px; margin-bottom: 8px; border-radius: 8px; font-size: 12.5px;
    background: var(--color-primary-soft); color: var(--color-text);
  }

  /* ---- Tabla ---- */
  /* Ocupa el alto disponible de la ventana (se ajusta en JS según dónde quedó la tabla) */
  .dt-scroll { position: relative; overflow: auto; max-height: 64vh; min-height: 240px; border: 1px solid var(--color-border); border-radius: 10px; }
  .dt table { font-size: 12.5px; }
  .dt thead th {
    position: sticky; top: 0; z-index: 3; background: var(--color-surface);
    white-space: nowrap; user-select: none; padding: 0; border-bottom: 1px solid var(--color-border);
  }
  .dt-th { position: relative; display: flex; align-items: center; gap: 2px; padding: 8px 12px 8px 10px; }
  .dt-th-titulo { flex: 1; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  .dt-th-titulo:hover { color: var(--color-text); }
  .dt-th-titulo .dt-pin { color: var(--color-accent); }
  .dt-orden { display: inline-flex; align-items: center; font-size: 11px; color: var(--color-accent); }
  .dt-orden sub { font-size: 9px; }
  .dt-btn-filtro {
    display: inline-flex; background: transparent; border: none; color: var(--color-text-muted); padding: 3px 4px;
    border-radius: 6px; font-size: 12px; line-height: 1;
  }
  .dt-btn-filtro:hover { background: var(--color-bg); color: var(--color-text); }
  .dt-btn-filtro.activo { background: var(--color-accent); color: #fff; }
  .dt thead th[draggable="true"] { cursor: grab; }
  .dt thead th.dt-arrastrando { opacity: .45; }
  .dt thead th.dt-drop-antes { box-shadow: inset 3px 0 0 var(--color-accent); }
  .dt thead th.dt-drop-despues { box-shadow: inset -3px 0 0 var(--color-accent); }

  /* Ajuste de ancho: borde derecho del encabezado */
  .dt-resize { position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 2; }
  .dt-resize:hover, .dt-resize.activo { background: var(--color-accent); opacity: .6; }
  body.dt-redimensionando, body.dt-redimensionando * { cursor: col-resize !important; user-select: none !important; }

  .dt tbody td { white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  .dt tbody tr:hover td { background: var(--color-bg); }
  .dt tbody tr.dt-fila-seleccionada td { background: var(--color-primary-soft); }
  .dt .dt-num { text-align: right; font-variant-numeric: tabular-nums; }
  .dt mark { background: #ffe58a; color: inherit; padding: 0 1px; border-radius: 2px; }
  :root[data-theme="dark"] .dt mark { background: #7a6420; }

  /* Columna de casillas */
  .dt .dt-col-check { width: 36px; min-width: 36px; text-align: center; padding: 0 8px; }
  .dt .dt-col-check input { width: auto; cursor: pointer; }

  /* Columna de acciones por fila: fija a la DERECHA, siempre a la vista aunque haya scroll */
  .dt .dt-col-acciones {
    position: sticky; right: 0; z-index: 1; width: 1%; padding: 0 6px; text-align: right;
    background: var(--color-surface); box-shadow: -3px 0 4px -2px rgba(6,38,58,.12);
  }
  .dt thead th.dt-col-acciones { z-index: 4; padding: 0 10px; font-weight: 600; }
  .dt tfoot td.dt-col-acciones { z-index: 3; }
  .dt-acciones-fila { display: inline-flex; gap: 2px; }
  .dt .dt-btn-fila {
    display: inline-flex; align-items: center; background: transparent; border: none;
    padding: 5px 6px; border-radius: 6px; font-size: 13px; color: var(--color-text-muted);
  }
  .dt .dt-btn-fila:hover, .dt .dt-btn-fila:focus-visible { background: var(--color-primary-soft); color: var(--color-text); }
  .dt .dt-btn-fila.dt-peligro:hover, .dt .dt-btn-fila.dt-peligro:focus-visible { background: #F3ECD6; color: var(--color-danger); }
  :root[data-theme="dark"] .dt .dt-btn-fila.dt-peligro:hover { background: rgba(255,138,128,.15); color: #ff8a80; }

  /* Columnas fijas a la izquierda (casillas y las que el usuario fije) */
  .dt .dt-fija { position: sticky; z-index: 1; }
  .dt tbody td.dt-fija, .dt tfoot td.dt-fija { background: var(--color-surface); }
  .dt thead th.dt-fija { z-index: 4; }
  .dt .dt-fija-ultima { box-shadow: 3px 0 4px -2px rgba(6,38,58,.15); }

  /* Densidad */
  .dt.dt-densidad-compacta tbody td, .dt.dt-densidad-compacta tfoot td { padding-top: 3px; padding-bottom: 3px; }
  .dt.dt-densidad-comoda tbody td, .dt.dt-densidad-comoda tfoot td { padding-top: 13px; padding-bottom: 13px; }

  /* Fila de totales */
  .dt tfoot td {
    position: sticky; bottom: 0; z-index: 2; background: var(--color-surface); font-weight: 600;
    border-top: 2px solid var(--color-border); border-bottom: none; white-space: nowrap;
  }
  .dt tfoot td.dt-fija { z-index: 3; }
  .dt-agregado-etiqueta { font-weight: 400; color: var(--color-text-muted); font-size: 11px; margin-right: 4px; }

  /* ---- Edición en celda: botón de lápiz real (clic, Tab + Enter), visible al pasar el mouse o con foco ---- */
  .dt td.dt-editable { position: relative; padding-right: 30px; }
  .dt td.dt-editable:hover { box-shadow: inset 0 0 0 1px var(--color-accent); }
  .dt .dt-btn-editar-celda {
    position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    display: inline-flex; background: transparent; border: none; padding: 3px 5px; border-radius: 6px;
    font-size: 12px; line-height: 1; color: var(--color-text-muted); opacity: 0;
  }
  .dt td.dt-editable:hover .dt-btn-editar-celda, .dt .dt-btn-editar-celda:focus-visible { opacity: 1; }
  .dt .dt-btn-editar-celda:hover, .dt .dt-btn-editar-celda:focus-visible { background: var(--color-accent-soft); color: var(--color-text); }
  @media (hover: none) { .dt .dt-btn-editar-celda { opacity: .7; } }
  /* Una celda editable usa position:relative como ancla del lápiz. Si ADEMÁS está fijada,
     manda sticky (va después a propósito): si no, la columna deja de fijarse y al hacer
     scroll horizontal se encima sobre las de la izquierda. El lápiz sigue en su lugar,
     porque sticky también sirve de ancla para un elemento absolute. */
  .dt tbody td.dt-editable.dt-fija { position: sticky; }

  .dt td.dt-editando { padding: 2px 4px; overflow: visible; box-shadow: inset 0 0 0 2px var(--color-accent); }
  .dt-editor { display: flex; align-items: center; gap: 4px; }
  .dt-editor input, .dt-editor select { padding: 5px 8px; font-size: 12.5px; min-width: 130px; }
  .dt-editor button { display: inline-flex; padding: 5px 8px; font-size: 13px; line-height: 1; flex-shrink: 0; }
  .dt td.dt-guardando { opacity: .5; }
  .dt td.dt-error-celda { box-shadow: inset 0 0 0 2px var(--color-danger); }
  .dt-vacio { text-align: center; color: var(--color-text-muted); padding: 28px 0 !important; white-space: normal !important; }
  .dt-vacio.dt-error { color: var(--color-danger); }

  /* ---- Carga: skeleton (sin datos) y barra superior (refrescando con datos a la vista) ---- */
  .dt-skel {
    display: block; height: 10px; border-radius: 6px; width: 70%;
    background: linear-gradient(90deg, var(--color-border) 25%, var(--color-bg) 50%, var(--color-border) 75%);
    background-size: 200% 100%; animation: dt-brillo 1.2s ease-in-out infinite;
  }
  @keyframes dt-brillo { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .dt-barra-carga { position: sticky; top: 0; left: 0; height: 3px; z-index: 5; overflow: hidden; margin-bottom: -3px; }
  .dt-barra-carga::before {
    content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--color-accent);
    animation: dt-barra 1.1s ease-in-out infinite;
  }
  @keyframes dt-barra { from { left: -35%; } to { left: 100%; } }

  /* ---- Pie y paginación ---- */
  .dt-pie { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--color-text-muted); }
  .dt-paginacion { display: flex; gap: 6px; align-items: center; }
  .dt-paginacion button { display: inline-flex; padding: 6px 8px; }
  .dt-paginacion select { width: auto; padding: 6px 8px; }
  .dt-atajos { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; cursor: help; }

  /* ---- Menús flotantes (filtro de columna y Vista) ---- */
  .dt-popover {
    position: fixed; z-index: 600; width: 280px; max-height: calc(100vh - 16px); overflow-y: auto; background: var(--color-surface);
    border: 1px solid var(--color-border); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 12px;
    font-size: 12.5px;
  }
  .dt-popover h4 { margin: 0 0 8px; font-size: 13px; }
  .dt-popover button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .dt-popover .dt-pop-fila { display: flex; gap: 6px; margin-bottom: 8px; }
  .dt-popover .dt-pop-fila button { flex: 1; }
  .dt-popover input, .dt-popover select { padding: 7px 9px; font-size: 12.5px; }
  .dt-popover .dt-pop-acciones { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }
  .dt-popover .dt-pop-acciones button, .dt-popover .dt-pop-orden button, .dt-popover .dt-pop-col button { padding: 6px 10px; font-size: 12px; }
  .dt-popover .dt-pop-orden { display: flex; gap: 6px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--color-border); }
  .dt-popover .dt-pop-orden button { flex: 1; }
  .dt-popover .dt-pop-col { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-border); }
  .dt-popover .dt-pop-col button { flex: 1; }
  .dt-pop-presets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .dt-pop-presets button { padding: 3px 8px; font-size: 11.5px; border-radius: 999px; }
  .dt-lista-valores { max-height: 200px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: 8px; padding: 4px; }
  .dt-lista-valores label {
    display: flex; align-items: center; gap: 8px; margin: 0; padding: 4px 6px; border-radius: 6px;
    font-size: 12.5px; color: var(--color-text); font-weight: 400; cursor: pointer;
  }
  .dt-lista-valores label:hover { background: var(--color-bg); }
  .dt-lista-valores input { width: auto; }
  .dt-lista-valores .dt-conteo { margin-left: auto; color: var(--color-text-muted); font-size: 11px; }
  .dt-lista-valores .dt-solo { visibility: hidden; background: transparent; border: none; color: var(--color-primary); padding: 0 4px; font-size: 11px; text-decoration: underline; }
  .dt-lista-valores label:hover .dt-solo, .dt-lista-valores .dt-solo:focus-visible { visibility: visible; }

  .dt-columnas { display: flex; flex-direction: column; gap: 2px; }
  .dt-columna-item { display: flex; align-items: center; gap: 4px; padding: 2px; border-radius: 6px; }
  .dt-columna-item:hover { background: var(--color-bg); }
  .dt-columna-item label { flex: 1; display: flex; align-items: center; gap: 8px; margin: 0; color: var(--color-text); font-weight: 400; cursor: pointer; font-size: 12.5px; }
  .dt-columna-item input { width: auto; }
  .dt-columna-item button { background: transparent; border: none; color: var(--color-text-muted); padding: 4px 5px; font-size: 12px; border-radius: 6px; }
  .dt-columna-item button:hover:not(:disabled) { background: var(--color-surface); color: var(--color-text); }
  .dt-columna-item button:disabled { opacity: .3; cursor: default; }
  .dt-columna-item button.activo { color: var(--color-accent); }
  .dt-vista-opciones { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 8px; }

  /* ---- Panel lateral de detalle ---- */
  .dt-panel-fondo { position: fixed; inset: 0; z-index: 700; background: rgba(6,20,30,.35); }
  .dt-panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 701; width: min(600px, 100vw);
    background: var(--color-surface); box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
    animation: dt-panel-entrar .2s ease-out;
  }
  @keyframes dt-panel-entrar { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .dt-panel-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 16px 18px; border-bottom: 1px solid var(--color-border);
  }
  .dt-panel-header h3 { margin: 0; font-size: 16px; }
  .dt-panel-header p { margin: 2px 0 0; font-size: 12px; color: var(--color-text-muted); }
  .dt-panel-cuerpo { flex: 1; overflow-y: auto; padding: 8px 18px 18px; }
  .dt-panel-pie { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--color-border); }
  .dt-panel-pie:empty { display: none; }
  .dt-panel button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .dt-campo { display: grid; grid-template-columns: 40% 1fr; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--color-border); font-size: 13px; }
  .dt-campo-titulo { color: var(--color-text-muted); font-size: 12px; font-weight: 500; }
  .dt-campo-valor { display: flex; align-items: center; gap: 6px; min-width: 0; word-break: break-word; }
  .dt-campo-valor .dt-campo-texto { flex: 1; }
  .dt-campo-valor button { padding: 4px 8px; font-size: 12px; flex-shrink: 0; }
  /* "Editar" discreto: con ocho campos editables eran ocho botones con borde compitiendo
     con el dato; se nota al pasar el mouse por el renglón */
  .dt-campo-valor .dt-btn-editar-campo { background: transparent; border-color: transparent; color: var(--color-text-muted); box-shadow: none; }
  .dt-campo:hover .dt-btn-editar-campo, .dt-btn-editar-campo:focus-visible { border-color: var(--color-border); color: var(--color-text); }
  /* Los campos sin dato (y que no se pueden llenar aquí) van juntos y plegados: son ruido
     cuando se abre el detalle para ver lo importante */
  .dt-campos-vacios { margin-top: 10px; font-size: 12.5px; color: var(--color-text-muted); }
  .dt-campos-vacios summary { cursor: pointer; padding: 6px 0; font-weight: 500; }
  .dt-campos-vacios summary:hover { color: var(--color-text); }
  .dt-panel-extra.dt-extra-primero { margin: 6px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--color-border); }
  .dt-campo-valor input, .dt-campo-valor select { padding: 6px 8px; font-size: 13px; }
  .dt-panel-extra:empty { display: none; }
  .dt-panel-extra { margin-top: 14px; }
</style>

<script>
  /**
   * DataTable — tabla de datos reutilizable (estilo AppSheet / AG Grid), sin dependencias.
   * Requiere Iconos, Notificar, Confirmar y ExportarExcel (se incluyen antes en Index.html).
   *
   * ─── USO ──────────────────────────────────────────────────────────────────────────
   *   const tabla = DataTable.crear(elementoContenedor, {
   *     idCampo: 'ID',                         // clave única de cada fila
   *     idTabla: 'verificaciones',             // para recordar la vista de cada usuario (columnas, anchos, orden…)
   *     columnas: [
   *       { campo: 'FOLIO', titulo: 'Folio', tipo: 'texto', editable: 'panel', fijada: true },
   *       { campo: 'KM', titulo: 'Kilometraje', tipo: 'numero', editable: true, agregado: 'suma' },
   *       { campo: 'FECHA', titulo: 'Fecha', tipo: 'fecha', editable: true },       // valor ISO o Date
   *       { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista', editable: true,
   *         opciones: ['ACTIVO', 'BAJA'] },     // si se omite, usa los valores existentes
   *       { campo: 'FOTO', titulo: 'Foto', filtrable: false, ordenable: false,
   *         render: (valor, fila) => '<button …>' },  // HTML propio (el módulo escapa lo que use)
   *       { campo: 'DIAS', titulo: 'Días', tipo: 'numero',
   *         valor: (fila) => calcularDias(fila) },    // columna calculada
   *     ],
   *     seleccionable: true,                   // casillas (copiar, eliminar y acciones masivas)
   *     alEditar: async (fila, campo, valorNuevo) => filaActualizada,   // lanza error para rechazar
   *     alEliminar: async (filas) => {},        // si se omite, no aparece "Eliminar"
   *     motivoSinEliminar: 'Solo administradores pueden eliminar',
   *     accionesFila: [ … ],                    // botones extra por fila (ver EXTENDER)
   *     accionesSeleccion: [ … ],               // botones extra con registros seleccionados
   *     detalle: { titulo: (fila) => '…', contenidoExtra: (fila, contenedor) => {},   // false lo desactiva
   *               extraPrimero: true },   // lo del módulo arriba de los campos (cuando es lo que se viene a ver)
   *     etiquetaFila: (fila) => fila.FOLIO,     // cómo nombrar una fila en confirmaciones y avisos
   *     tamanoPagina: 25,  densidad: 'normal',  ordenInicial: { campo: 'FECHA', dir: 'desc' },
   *     textoVacio: 'Sin registros',  ayuda: 'Texto de ayuda…',
   *     exportar: { nombreArchivo: 'Verificaciones' },   // botón verde; false lo oculta
   *     alCambiarFiltros: (filtros) => {},      // p. ej. para marcar chips de KPI
   *     umbralPalabraClave: 10,                 // eliminar pide escribir "ELIMINAR" desde N filas
   *   });
   *
   * Opciones de columna:
   *   editable: true     → en la celda (lápiz, doble clic, F2) y en el panel
   *   editable: 'panel'  → SOLO en el panel de detalle (cambios con consecuencias, p. ej. un folio)
   *   fijada: true · ancho: 160 · visible: false · filtrable/ordenable: false
   *   agregado: 'suma' | 'promedio' | 'min' | 'max' | 'conteo'   → fila de totales (sobre lo filtrado)
   *   exportable: false · valorExportar: (fila) => … · enDetalle: false
   *
   * Métodos:
   *   setDatos(datos) · setCargando(true) · setError('msg') · getDatos() · getSeleccion()
   *   limpiarSeleccion() · copiarSeleccion() · textoSeleccion()
   *   setFiltro(campo, { valores: [...] } | { op, v1, v2 } | null) · limpiarFiltros()
   *   moverColumna(campo, antesDeCampo) · fijarColumna(campo, true) · ocultarColumna(campo)
   *   setDensidad('compacta') · restablecerVista() · getVista() · abrirDetalle(id)
   *   ajustarAlto() · destruir()
   *
   * ─── EXTENDER ─────────────────────────────────────────────────────────────────────
   *   Acción por fila (aparece junto a "Ver detalle" y "Eliminar"):
   *     accionesFila: [{ icono: 'car', titulo: 'Ver vehículo', alHacer: (fila) => …,
   *                      visible: (fila) => !!fila.FOLIO, peligro: false }]
   *   Acción masiva (aparece en la barra al seleccionar):
   *     accionesSeleccion: [{ icono: 'mail', texto: 'Enviar aviso', alHacer: async (filas) => … }]
   *     (si alHacer regresa una promesa, el botón muestra "Procesando…" mientras tanto)
   *   Tipo de columna nuevo (disponible para todas las tablas):
   *     DataTable.registrarTipo('moneda', { hereda: 'numero',
   *       formatear: (v) => (v == null || v === '' ? '' : '$' + Number(v).toLocaleString('es-MX')) });
   *     (lo que no se defina se toma del tipo del que hereda; ver TIPOS abajo)
   *
   * ─── ATAJOS ───────────────────────────────────────────────────────────────────────
   *   Shift+clic en casillas = rango · Shift+clic en encabezado = orden múltiple ·
   *   Ctrl+C = copiar seleccionados (pegar en Excel) · Ctrl+Z = deshacer última edición ·
   *   Esc = cerrar menús / quitar selección · F2 = editar celda con foco.
   *   Guardar es explícito (✓ o Enter); salir de la celda o Esc CANCELA. Tras guardar hay "Deshacer".
   *   En pantallas táctiles, tocar una fila abre el panel de detalle.
   *
   * ─── ÍNDICE DEL ARCHIVO ───────────────────────────────────────────────────────────
   *   1. Constantes y utilidades        4. crear(): estado y vista guardada
   *   2. Tipos de columna (registro)    5. crear(): datos → filas visibles
   *   3. Íconos y HTML compartido       6. crear(): pintado   7. menús   8. edición
   *   9. acciones (eliminar, copiar, exportar)   10. panel   11. eventos   12. API
   */
  const DataTable = (function () {
    // =====================================================================
    // 1. Constantes y utilidades (funciones puras, sin estado de la tabla)
    // =====================================================================
    const SIN_VALOR = ['vacio', 'no_vacio'];           // operadores que no piden valor
    const TAMANOS_PAGINA = [10, 25, 50, 100];
    const DENSIDADES = { compacta: 'Compacta', normal: 'Normal', comoda: 'Cómoda' };
    const FILAS_SKELETON = 8;
    const ANCHO_MINIMO = 60;
    const MAX_HISTORIAL = 20;
    const AGREGADOS = {
      suma: { etiqueta: 'Σ', calcular: (nums) => nums.reduce((a, b) => a + b, 0) },
      promedio: { etiqueta: 'x̄', calcular: (nums) => nums.reduce((a, b) => a + b, 0) / nums.length },
      min: { etiqueta: 'mín', calcular: (nums) => Math.min(...nums) },
      max: { etiqueta: 'máx', calcular: (nums) => Math.max(...nums) },
    };
    const TEXTO_ATAJOS = 'Shift+clic en casillas: seleccionar rango · Shift+clic en encabezado: ordenar por varias columnas · ' +
      'Ctrl+C: copiar seleccionados · Ctrl+Z: deshacer edición · Arrastra encabezados para reordenar y sus bordes para cambiar el ancho';

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }
    function vacio(v) { return v === null || v === undefined || String(v).trim() === ''; }

    /** Minúsculas y sin acentos, carácter por carácter (misma longitud, para poder resaltar) */
    function normalizarCaracter(c) { return c.normalize('NFD').charAt(0).toLowerCase(); }
    function normalizar(texto) { return Array.from(String(texto == null ? '' : texto)).map(normalizarCaracter).join(''); }

    /** Fecha → "yyyy-MM-dd" en hora local (para comparar por día) */
    function claveFecha(v) {
      if (vacio(v)) return '';
      if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
      const f = v instanceof Date ? v : new Date(v);
      return isNaN(f) ? '' : claveDeDate(f);
    }
    function claveDeDate(f) {
      return [f.getFullYear(), String(f.getMonth() + 1).padStart(2, '0'), String(f.getDate()).padStart(2, '0')].join('-');
    }
    function sumarDias(dias) { const f = new Date(); f.setDate(f.getDate() + dias); return claveDeDate(f); }
    /** "yyyy-MM-dd" → "dd/mm/aaaa" (siempre con ceros, igual que el Excel exportado y AppSheet) */
    function fechaLegible(clave) {
      if (!clave) return '';
      const [y, m, d] = clave.split('-');
      return `${d}/${m}/${y}`;
    }
    function aNumero(v) {
      if (vacio(v)) return null;
      const n = Number(String(v).replace(/[$,\s]/g, ''));
      return isNaN(n) ? null : n;
    }
    function plural(n, singular, pluralTexto) { return n === 1 ? singular : (pluralTexto || singular + 's'); }
    function escribiendo(el) {
      return !!(el && el.closest && el.closest('input:not([type="checkbox"]), textarea, select, [contenteditable="true"]'));
    }
    /** Primer valor en [a, b] sin importar el orden en que vengan */
    function enRango(x, a, b) { return a <= b ? x >= a && x <= b : x >= b && x <= a; }

    /** Deshabilita el botón y muestra un texto mientras corre la tarea; al terminar lo deja como estaba */
    async function conBotonOcupado(boton, textoOcupado, tarea) {
      if (!boton) return tarea();
      const html = boton.innerHTML;
      boton.disabled = true;
      boton.textContent = textoOcupado;
      try { return await tarea(); } finally { boton.disabled = false; boton.innerHTML = html; }
    }

    // =====================================================================
    // 2. Tipos de columna
    //    Todo lo que cambia según el tipo vive aquí. Para un tipo nuevo, usa
    //    DataTable.registrarTipo(nombre, { hereda, ...solo lo que cambia }).
    //
    //    formatear(valor)        → texto que se ve, se busca y se copia
    //    claveOrden(valor)       → valor comparable, o null (los vacíos van al final)
    //    operadores              → [[op, etiqueta, símbolo?]] del filtro por condición
    //    cumple(valor, op, v1, v2) → ¿la fila pasa el filtro? ('vacio'/'no_vacio' ya se resuelven antes)
    //    describir(v)            → cómo se lee un valor del filtro en el chip
    //    filtroPorValores        → true: el filtro es una lista de casillas (como Excel)
    //    presets                 → atajos del filtro: [{ id, texto, filtro: () => ({ op, v1, v2 }) }]
    //    input                   → type del <input> para filtrar y editar
    //    etiquetasOrden          → [ascendente, descendente] en el menú de columna
    //    alinearDerecha          → números a la derecha
    //    exportarComo            → 'texto' | 'numero' | 'fecha' (formato de la celda en Excel)
    //    aControl(valor)         → valor inicial del control de edición
    //    deControl(texto)        → valor que recibe alEditar
    //    crearControl(valor, col, valoresExistentes) → elemento para editar
    // =====================================================================
    const TIPOS = {};

    function registrarTipo(nombre, definicion) {
      const base = TIPOS[definicion.hereda || 'texto'];
      if (!base && nombre !== 'texto') throw new Error(`DataTable: el tipo base "${definicion.hereda}" no existe`);
      TIPOS[nombre] = Object.assign({}, base, definicion, { nombre });
    }
    const tipoDe = (col) => TIPOS[col.tipo] || TIPOS.texto;

    registrarTipo('texto', {
      formatear: (v) => (vacio(v) ? '' : String(v)),
      claveOrden: (v) => (vacio(v) ? null : normalizar(v)),
      operadores: [
        ['contiene', 'Contiene'], ['no_contiene', 'No contiene'], ['igual', 'Es igual a'],
        ['empieza', 'Empieza con'], ['termina', 'Termina con'], ['vacio', 'Está vacío'], ['no_vacio', 'No está vacío'],
      ],
      cumple(v, op, v1) {
        const t = normalizar(vacio(v) ? '' : v);
        const q = normalizar(v1 || '');
        switch (op) {
          case 'contiene': return t.includes(q);
          case 'no_contiene': return !t.includes(q);
          case 'igual': return t === q;
          case 'empieza': return t.startsWith(q);
          case 'termina': return t.endsWith(q);
          default: return true;
        }
      },
      describir: (x) => `“${x}”`,
      filtroPorValores: false,
      presets: [],
      input: 'text',
      etiquetasOrden: ['A → Z', 'Z → A'],
      alinearDerecha: false,
      exportarComo: 'texto',
      aControl: (v) => (vacio(v) ? '' : String(v)),
      deControl: (texto) => texto,
      crearControl(valor, col) {
        const control = document.createElement('input');
        control.type = this.input;
        if (this.input === 'number') control.step = 'any';
        control.value = this.aControl(valor);
        return control;
      },
    });

    registrarTipo('numero', {
      formatear: (v) => { const n = aNumero(v); return n === null ? '' : n.toLocaleString('es-MX'); },
      claveOrden: aNumero,
      operadores: [
        ['=', 'Igual a (=)', '='], ['!=', 'Distinto de (≠)', '≠'], ['>', 'Mayor que (>)', '>'], ['>=', 'Mayor o igual (≥)', '≥'],
        ['<', 'Menor que (<)', '<'], ['<=', 'Menor o igual (≤)', '≤'], ['entre', 'Entre'], ['vacio', 'Está vacío'], ['no_vacio', 'No está vacío'],
      ],
      cumple(v, op, v1, v2) {
        const n = aNumero(v); const a = aNumero(v1); const b = aNumero(v2);
        if (n === null || a === null) return false;
        switch (op) {
          case '=': return n === a;
          case '!=': return n !== a;
          case '>': return n > a;
          case '>=': return n >= a;
          case '<': return n < a;
          case '<=': return n <= a;
          case 'entre': return b !== null && enRango(n, a, b);
          default: return true;
        }
      },
      describir: (x) => x,
      input: 'number',
      etiquetasOrden: ['Menor → mayor', 'Mayor → menor'],
      alinearDerecha: true,
      exportarComo: 'numero',
      deControl: aNumero,
    });

    registrarTipo('fecha', {
      formatear: (v) => fechaLegible(claveFecha(v)),
      claveOrden: (v) => claveFecha(v) || null,
      operadores: [
        ['igual', 'Es el día'], ['antes', 'Antes de'], ['despues', 'Después de'], ['entre', 'Entre'],
        ['vacio', 'Está vacía'], ['no_vacio', 'No está vacía'],
      ],
      cumple(v, op, v1, v2) {
        const k = claveFecha(v);
        if (!k || !v1) return false;
        switch (op) {
          case 'igual': return k === v1;
          case 'antes': return k < v1;
          case 'despues': return k > v1;
          case 'entre': return !!v2 && enRango(k, v1, v2);
          default: return true;
        }
      },
      describir: fechaLegible,
      presets: [
        { id: 'hoy', texto: 'Hoy', filtro: () => ({ op: 'igual', v1: sumarDias(0) }) },
        { id: 'ult7', texto: 'Últimos 7 días', filtro: () => ({ op: 'entre', v1: sumarDias(-6), v2: sumarDias(0) }) },
        { id: 'ult30', texto: 'Últimos 30 días', filtro: () => ({ op: 'entre', v1: sumarDias(-29), v2: sumarDias(0) }) },
        { id: 'mes', texto: 'Este mes', filtro: () => ({ op: 'entre', v1: sumarDias(0).slice(0, 8) + '01', v2: sumarDias(0) }) },
        { id: 'prox30', texto: 'Próximos 30 días', filtro: () => ({ op: 'entre', v1: sumarDias(0), v2: sumarDias(30) }) },
        { id: 'pasadas', texto: 'Antes de hoy', filtro: () => ({ op: 'antes', v1: sumarDias(0) }) },
      ],
      input: 'date',
      etiquetasOrden: ['Más antigua', 'Más reciente'],
      exportarComo: 'fecha',
      aControl: claveFecha,
    });

    registrarTipo('lista', {
      filtroPorValores: true,
      crearControl(valor, col, valoresExistentes) {
        const opciones = col.opciones || valoresExistentes();
        const control = document.createElement('select');
        control.innerHTML = ['<option value=""></option>']
          .concat(opciones.map((o) => `<option ${String(o) === String(valor) ? 'selected' : ''}>${esc(o)}</option>`)).join('');
        return control;
      },
    });

    // =====================================================================
    // 3. Íconos y piezas de HTML compartidas
    // =====================================================================
    // Iconos se declara con const (no queda en window): se revisa con typeof
    const ic = (nombre) => (typeof Iconos !== 'undefined' ? Iconos.svg(nombre) : '');

    /** Botón solo-ícono: el texto va en title y aria-label (lectores de pantalla) */
    function botonIcono(clase, icono, titulo, atributos) {
      return `<button type="button" class="${clase}" title="${esc(titulo)}" aria-label="${esc(titulo)}" ${atributos || ''}>${ic(icono)}</button>`;
    }

    // =====================================================================
    // 4. crear(): configuración, estado y vista guardada
    // =====================================================================
    function crear(contenedor, config) {
      const cfg = Object.assign({
        tamanoPagina: 25, seleccionable: true, textoVacio: 'Sin registros', exportar: true,
        detalle: {}, umbralPalabraClave: 10, densidad: 'normal', accionesFila: [], accionesSeleccion: [],
      }, config);
      if (cfg.exportar === true) cfg.exportar = { nombreArchivo: 'Datos' };
      const columnas = cfg.columnas.map((c) => Object.assign(
        { tipo: 'texto', editable: false, filtrable: true, ordenable: true, visible: true, exportable: true, enDetalle: true }, c
      ));

      const idDe = (fila) => String(fila[cfg.idCampo]);
      const filaPorId = (id) => st.datos.find((f) => idDe(f) === id);
      const etiquetaDe = (fila) => (cfg.etiquetaFila ? cfg.etiquetaFila(fila) : idDe(fila));
      const colPorCampo = (campo) => columnas.find((c) => c.campo === campo);
      const valorDe = (col, fila) => (col.valor ? col.valor(fila) : fila[col.campo]);
      const textoVisible = (col, fila) => tipoDe(col).formatear(valorDe(col, fila));
      const valoresExistentes = (col) => () =>
        Array.from(new Set(st.datos.map((f) => valorDe(col, f)).filter((v) => !vacio(v)).map(String))).sort();
      const puedeEditarCelda = (col) => col.editable === true && !!cfg.alEditar;
      const puedeEditarPanel = (col) => !!col.editable && !!cfg.alEditar;
      const esTactil = () => !!(window.matchMedia && window.matchMedia('(hover: none)').matches);
      const conDetalle = cfg.detalle !== false;
      const aArreglo = (o) => (!o ? [] : Array.isArray(o) ? o.map((x) => Object.assign({}, x)) : [Object.assign({}, o)]);

      /** Botones de cada fila: Ver detalle · (los del módulo) · Eliminar */
      const accionesFila = [].concat(
        conDetalle ? [{ icono: 'ver', titulo: 'Ver detalle', clase: 'dt-btn-ver', alHacer: (fila) => abrirPanel(idDe(fila)) }] : [],
        cfg.accionesFila,
        cfg.alEliminar ? [{ icono: 'eliminar', titulo: 'Eliminar', clase: 'dt-btn-eliminar-fila', peligro: true, alHacer: (fila) => eliminarFilas([fila]) }] : []
      );
      /** Botones de la barra cuando hay selección: Copiar · (los del módulo) · Eliminar
       *  (propia: la tabla ya maneja sus avisos y el estado "ocupado" del botón) */
      const accionesSeleccion = [].concat(
        [{ icono: 'copiar', texto: 'Copiar', clase: 'dt-btn-copiar', propia: true, titulo: 'Copia los seleccionados para pegarlos en Excel (Ctrl+C)', alHacer: () => copiarSeleccion() }],
        cfg.accionesSeleccion,
        cfg.alEliminar ? [{ icono: 'eliminar', texto: 'Eliminar seleccionados', clase: 'dt-btn-eliminar', propia: true, peligro: true, alHacer: (filas, boton) => eliminarFilas(filas, boton) }] : []
      );
      const hayAccionesFila = accionesFila.length > 0;

      const st = {
        datos: cfg.datos || [],
        cargando: !cfg.datos,        // sin datos iniciales = todavía cargando
        refrescando: false,
        error: null,
        busqueda: '',
        filtros: {},                 // campo -> { op, v1, v2 } | { valores: [..] }
        pagina: 1,
        seleccion: new Set(),
        ancla: null,                 // última casilla marcada (para Shift+clic)
        editando: null,
        detalleId: null,
        historial: [],               // ediciones para Ctrl+Z
        // Vista (se recuerda por usuario si hay idTabla): ver aplicarVista()
        ocultas: new Set(), ordenColumnas: [], anchos: {}, fijadas: new Set(), orden: [], tamanoPagina: 25, densidad: 'normal',
      };

      /** Vista por defecto (lo que "Restablecer vista" recupera) */
      const vistaDefault = () => ({
        ocultas: columnas.filter((c) => !c.visible).map((c) => c.campo),
        ordenColumnas: columnas.map((c) => c.campo),
        anchos: Object.fromEntries(columnas.filter((c) => c.ancho).map((c) => [c.campo, c.ancho])),
        fijadas: columnas.filter((c) => c.fijada).map((c) => c.campo),
        orden: aArreglo(cfg.ordenInicial),
        tamanoPagina: cfg.tamanoPagina,
        densidad: cfg.densidad,
      });

      /** Aplica una vista guardada ignorando columnas que ya no existen */
      function aplicarVista(v) {
        const existe = (campo) => !!colPorCampo(campo);
        st.ocultas = new Set((v.ocultas || []).filter(existe));
        // Columnas nuevas (agregadas después de guardar la vista) van al final
        const orden = (v.ordenColumnas || []).filter(existe);
        columnas.forEach((c) => { if (!orden.includes(c.campo)) orden.push(c.campo); });
        st.ordenColumnas = orden;
        st.anchos = Object.fromEntries(Object.entries(v.anchos || {}).filter(([k]) => existe(k)));
        st.fijadas = new Set((v.fijadas || []).filter(existe));
        st.orden = aArreglo(v.orden).filter((o) => existe(o.campo));
        st.tamanoPagina = TAMANOS_PAGINA.includes(Number(v.tamanoPagina)) ? Number(v.tamanoPagina) : 25;
        st.densidad = DENSIDADES[v.densidad] ? v.densidad : 'normal';
      }

      function vistaActual() {
        return {
          ocultas: Array.from(st.ocultas), ordenColumnas: st.ordenColumnas.slice(), anchos: Object.assign({}, st.anchos),
          fijadas: Array.from(st.fijadas), orden: st.orden.map((o) => Object.assign({}, o)),
          tamanoPagina: st.tamanoPagina, densidad: st.densidad,
        };
      }

      // localStorage puede no estar disponible (incógnito, vista previa): la vista solo no se recuerda
      const almacen = {
        clave: cfg.idTabla ? 'dt-vista:' + cfg.idTabla : null,
        leer() {
          if (!this.clave) return {};
          try { return JSON.parse(localStorage.getItem(this.clave) || '{}') || {}; } catch (e) { return {}; }
        },
        guardar() {
          if (!this.clave) return;
          try { localStorage.setItem(this.clave, JSON.stringify(vistaActual())); } catch (e) { /* no-op */ }
        },
        borrar() {
          if (!this.clave) return;
          try { localStorage.removeItem(this.clave); } catch (e) { /* no-op */ }
        },
      };

      aplicarVista(Object.assign(vistaDefault(), almacen.leer()));

      /** Visibles en el orden del usuario, con las fijadas primero */
      function columnasVisibles() {
        const ordenadas = st.ordenColumnas.map(colPorCampo).filter((c) => c && !st.ocultas.has(c.campo));
        return ordenadas.filter((c) => st.fijadas.has(c.campo)).concat(ordenadas.filter((c) => !st.fijadas.has(c.campo)));
      }

      // =====================================================================
      // 5. Datos → filas visibles (filtrar, buscar, ordenar, totales)
      // =====================================================================
      function cumpleFiltro(col, fila, f) {
        const v = valorDe(col, fila);
        if (f.valores) return f.valores.includes(vacio(v) ? '' : String(v));
        if (f.op === 'vacio') return vacio(v);
        if (f.op === 'no_vacio') return !vacio(v);
        return tipoDe(col).cumple(v, f.op, f.v1, f.v2);
      }

      function compararFilas(criterios) {
        return (a, b) => {
          for (const { col, signo } of criterios) {
            const x = tipoDe(col).claveOrden(valorDe(col, a));
            const y = tipoDe(col).claveOrden(valorDe(col, b));
            if (x === null && y === null) continue;
            if (x === null) return 1;          // vacíos siempre al final
            if (y === null) return -1;
            if (x < y) return -signo;
            if (x > y) return signo;
          }
          return 0;
        };
      }

      function filasFiltradas() {
        const q = normalizar(st.busqueda.trim());
        const visibles = columnasVisibles();
        const filas = st.datos.filter((fila) => {
          for (const campo in st.filtros) {
            const col = colPorCampo(campo);
            if (col && !cumpleFiltro(col, fila, st.filtros[campo])) return false;
          }
          return !q || visibles.some((col) => normalizar(textoVisible(col, fila)).includes(q));
        });
        const criterios = st.orden
          .map((o) => ({ col: colPorCampo(o.campo), signo: o.dir === 'desc' ? -1 : 1 }))
          .filter((c) => c.col);
        return criterios.length ? filas.sort(compararFilas(criterios)) : filas;
      }

      /** Ids de las filas de la página actual */
      function idsPaginaActual(filas) {
        const inicio = (st.pagina - 1) * st.tamanoPagina;
        return filas.slice(inicio, inicio + st.tamanoPagina).map(idDe);
      }

      /** Texto legible de un filtro para el chip: "Días para vencer < 30" */
      function describirFiltro(col, f) {
        if (f.valores) {
          if (!f.valores.length) return `${col.titulo}: (ninguno)`;
          const nombres = f.valores.map((v) => (v === '' ? '(vacío)' : v));
          return `${col.titulo}: ${nombres.length <= 3 ? nombres.join(', ') : nombres.length + ' valores'}`;
        }
        const tipo = tipoDe(col);
        const [, etiqueta = f.op, simbolo] = tipo.operadores.find(([k]) => k === f.op) || [];
        const texto = String(etiqueta).replace(/\s*\(.*\)$/, '').toLowerCase();
        if (SIN_VALOR.includes(f.op)) return `${col.titulo} ${texto}`;
        if (f.op === 'entre') return `${col.titulo} entre ${tipo.describir(f.v1)} y ${tipo.describir(f.v2)}`;
        return `${col.titulo} ${simbolo || texto} ${tipo.describir(f.v1)}`;
      }

      function calcularAgregado(col, filas) {
        if (col.agregado === 'conteo') return filas.filter((f) => !vacio(valorDe(col, f))).length.toLocaleString('es-MX');
        const agregado = AGREGADOS[col.agregado];
        const nums = filas.map((f) => aNumero(valorDe(col, f))).filter((n) => n !== null);
        if (!agregado) return '';
        if (!nums.length) return '—';
        return agregado.calcular(nums).toLocaleString('es-MX', { maximumFractionDigits: 2 });
      }
      const etiquetaAgregado = (col) => (col.agregado === 'conteo' ? 'n' : (AGREGADOS[col.agregado] || {}).etiqueta || '');

      // =====================================================================
      // 6. Pintado
      // =====================================================================
      contenedor.innerHTML = `
        <div class="dt">
          <div class="dt-toolbar">
            <input type="search" class="dt-buscar" placeholder="Buscar en la tabla…" aria-label="Buscar en la tabla" />
            <button type="button" class="secondary dt-btn-columnas" title="Columnas, orden, ancho y densidad">${ic('vista')} Vista</button>
            ${cfg.ayuda ? `<span class="dt-ayuda" title="${esc(cfg.ayuda)}">${ic('ayuda')} Ayuda</span>` : ''}
            <span class="dt-espacio"></span>
            <span class="dt-seleccion-info" hidden></span>
            ${accionesSeleccion.map((a, i) => `<button type="button" class="${a.peligro ? 'danger' : 'secondary'} ${a.clase || ''}" data-accion-sel="${i}" ${a.titulo ? `title="${esc(a.titulo)}"` : ''} hidden>${ic(a.icono)} ${esc(a.texto)}</button>`).join('')}
            ${cfg.exportar ? `<button type="button" class="btn-excel dt-btn-excel" title="Descarga lo que ves: columnas visibles, filtros, búsqueda y orden (todas las páginas)">${ic('exportar')} Exportar a Excel</button>` : ''}
          </div>
          <div class="dt-filtros-activos" hidden></div>
          <div class="dt-banner" hidden></div>
          <div class="dt-scroll"><div class="dt-barra-carga" hidden></div><table><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
          <div class="dt-pie">
            <span class="dt-resumen" aria-live="polite"></span>
            <span class="dt-atajos" title="${esc(TEXTO_ATAJOS)}">${ic('atajos')} Atajos</span>
            <div class="dt-paginacion">
              <select class="dt-tamano" aria-label="Registros por página">${TAMANOS_PAGINA.map((n) => `<option value="${n}">${n} por página</option>`).join('')}</select>
              ${botonIcono('secondary dt-primera', 'primera', 'Primera página')}
              ${botonIcono('secondary dt-prev', 'anterior', 'Página anterior')}
              <span class="dt-pagina"></span>
              ${botonIcono('secondary dt-next', 'siguiente', 'Página siguiente')}
              ${botonIcono('secondary dt-ultima', 'ultima', 'Última página')}
            </div>
          </div>
        </div>`;

      const $ = (sel) => contenedor.querySelector(sel);
      const raiz = $('.dt');
      const thead = $('thead');
      const tbody = $('tbody');
      const tfoot = $('tfoot');
      const buscador = $('.dt-buscar');
      let popover = null;
      let panel = null;
      let ultimaFirmaFiltros = '{}';
      let ultimaFirmaVista = '';

      const celdaCheck = (contenido) => (cfg.seleccionable ? `<td class="dt-col-check dt-fija">${contenido || ''}</td>` : '');
      const celdaAcciones = (contenido) => (hayAccionesFila ? `<td class="dt-col-acciones">${contenido || ''}</td>` : '');
      const nColumnasSistema = () => (cfg.seleccionable ? 1 : 0) + (hayAccionesFila ? 1 : 0);

      function estiloAncho(campo) {
        const w = st.anchos[campo];
        return w ? ` style="width:${w}px;min-width:${w}px;max-width:${w}px"` : '';
      }
      function clasesColumna(col, extra) {
        return [extra, tipoDe(col).alinearDerecha ? 'dt-num' : '', st.fijadas.has(col.campo) ? 'dt-fija' : '']
          .filter(Boolean).join(' ');
      }

      /** Texto escapado con las coincidencias de la búsqueda resaltadas (sin importar acentos) */
      function resaltar(texto) {
        const q = normalizar(st.busqueda.trim());
        const caracteres = Array.from(texto);
        const base = caracteres.map(normalizarCaracter).join('');
        let i = q ? base.indexOf(q) : -1;
        if (i === -1) return esc(texto);
        const largo = Array.from(q).length;
        let salida = '';
        let desde = 0;
        while (i !== -1) {
          salida += esc(caracteres.slice(desde, i).join('')) + '<mark>' + esc(caracteres.slice(i, i + largo).join('')) + '</mark>';
          desde = i + largo;
          i = base.indexOf(q, desde);
        }
        return salida + esc(caracteres.slice(desde).join(''));
      }

      /** Calcula todo lo que el pintado necesita (una sola pasada de filtrado) */
      function calcularModelo() {
        const visibles = columnasVisibles();
        const filas = st.cargando || st.error ? [] : filasFiltradas();

        // Al cambiar filtros o búsqueda, soltar la selección de lo que ya no se ve
        // (evita borrar registros que el usuario no tiene en pantalla)
        const firmaVista = JSON.stringify([st.filtros, st.busqueda.trim()]);
        if (firmaVista !== ultimaFirmaVista) {
          ultimaFirmaVista = firmaVista;
          const visiblesIds = new Set(filas.map(idDe));
          st.seleccion.forEach((id) => { if (!visiblesIds.has(id)) st.seleccion.delete(id); });
        }
        const existentes = new Set(st.datos.map(idDe));
        st.seleccion.forEach((id) => { if (!existentes.has(id)) st.seleccion.delete(id); });

        const totalPaginas = Math.max(1, Math.ceil(filas.length / st.tamanoPagina));
        st.pagina = Math.min(Math.max(1, st.pagina), totalPaginas);
        const inicio = (st.pagina - 1) * st.tamanoPagina;
        const pagina = filas.slice(inicio, inicio + st.tamanoPagina);
        const idsPagina = pagina.map(idDe);
        return {
          visibles, filas, pagina, idsPagina, inicio, totalPaginas,
          selPagina: idsPagina.filter((id) => st.seleccion.has(id)).length,
          busquedaActiva: st.busqueda.trim() !== '',
          nColumnas: visibles.length + nColumnasSistema(),
        };
      }

      function render() {
        const m = calcularModelo();
        raiz.className = 'dt dt-densidad-' + st.densidad;
        pintarEncabezado(m);
        pintarCuerpo(m);
        pintarTotales(m);
        pintarChips(m);
        pintarBanner(m);
        pintarBarraYPie(m);
        aplicarFijadas();
        ajustarAlto();
        avisarCambioDeFiltros();
      }

      function pintarEncabezado({ visibles, idsPagina, selPagina }) {
        const multiOrden = st.orden.length > 1;
        const th = (col) => {
          const idx = st.orden.findIndex((o) => o.campo === col.campo);
          const dir = idx === -1 ? null : st.orden[idx].dir;
          const ariaSort = dir === 'asc' ? 'ascending' : dir === 'desc' ? 'descending' : 'none';
          const campo = esc(col.campo);
          const indicador = dir
            ? `<span class="dt-orden">${ic(dir === 'asc' ? 'ordenAsc' : 'ordenDesc')}${multiOrden ? `<sub>${idx + 1}</sub>` : ''}</span>`
            : '';
          return `<th aria-sort="${ariaSort}" class="${clasesColumna(col)}" data-col="${campo}" draggable="true"${estiloAncho(col.campo)}><div class="dt-th">
            <span class="dt-th-titulo" data-campo="${campo}" title="${col.ordenable ? 'Ordenar (Shift+clic: agregar orden)' : ''}">${st.fijadas.has(col.campo) ? `<span class="dt-pin">${ic('fijar')}</span>` : ''}${esc(col.titulo)}${indicador}</span>
            ${col.filtrable ? botonIcono(`dt-btn-filtro ${st.filtros[col.campo] ? 'activo' : ''}`, 'filtro', `Filtrar y opciones de ${col.titulo}`, `data-campo="${campo}"`) : ''}
            <span class="dt-resize" data-campo="${campo}" title="Arrastra para cambiar el ancho · doble clic para ajustar"></span>
          </div></th>`;
        };

        thead.innerHTML = '<tr>' +
          (cfg.seleccionable ? '<th class="dt-col-check dt-fija"><input type="checkbox" class="dt-check-pagina" title="Seleccionar esta página" aria-label="Seleccionar esta página" /></th>' : '') +
          visibles.map(th).join('') +
          (hayAccionesFila ? '<th class="dt-col-acciones">Acciones</th>' : '') +
          '</tr>';

        const checkPagina = thead.querySelector('.dt-check-pagina');
        if (checkPagina) {
          checkPagina.disabled = !idsPagina.length;
          checkPagina.checked = idsPagina.length > 0 && selPagina === idsPagina.length;
          checkPagina.indeterminate = selPagina > 0 && selPagina < idsPagina.length;
        }
      }

      function htmlCelda(col, fila, busquedaActiva) {
        const editable = puedeEditarCelda(col);
        const texto = textoVisible(col, fila);
        const contenido = col.render ? col.render(valorDe(col, fila), fila) : (busquedaActiva ? resaltar(texto) : esc(texto));
        const titulo = col.render ? '' : ` title="${esc(texto)}"`;
        const lapiz = editable
          ? botonIcono('dt-btn-editar-celda', 'editar', `Editar ${col.titulo} de ${etiquetaDe(fila)}`)
          : '';
        return `<td data-campo="${esc(col.campo)}" class="${clasesColumna(col, editable ? 'dt-editable' : '')}"${titulo}${estiloAncho(col.campo)}>${contenido}${lapiz}</td>`;
      }

      function htmlAccionesFila(fila) {
        const etiqueta = etiquetaDe(fila);
        return '<div class="dt-acciones-fila">' + accionesFila.map((a, i) => (
          a.visible && !a.visible(fila) ? '' : botonIcono(
            `dt-btn-fila ${a.clase || ''} ${a.peligro ? 'dt-peligro' : ''}`, a.icono, `${a.titulo}: ${etiqueta}`, `data-accion-fila="${i}"`
          )
        )).join('') + '</div>';
      }

      function pintarCuerpo({ visibles, pagina, nColumnas, busquedaActiva }) {
        if (st.cargando) {
          const celdas = Array.from({ length: nColumnas }, (_, i) => {
            const sistema = (cfg.seleccionable && i === 0) || (hayAccionesFila && i === nColumnas - 1);
            return `<td><span class="dt-skel" style="width:${sistema ? 14 : 40 + ((i * 37) % 50)}px"></span></td>`;
          }).join('');
          tbody.innerHTML = `<tr>${celdas}</tr>`.repeat(FILAS_SKELETON);
          return;
        }
        if (st.error) {
          tbody.innerHTML = `<tr><td class="dt-vacio dt-error" colspan="${nColumnas}">${ic('alerta')} ${esc(st.error)}</td></tr>`;
          return;
        }
        if (!pagina.length) {
          const mensaje = st.datos.length ? 'Ningún registro coincide con los filtros' : cfg.textoVacio;
          tbody.innerHTML = `<tr><td class="dt-vacio" colspan="${nColumnas}">${esc(mensaje)}</td></tr>`;
          return;
        }
        tbody.innerHTML = pagina.map((fila) => {
          const id = idDe(fila);
          const sel = st.seleccion.has(id);
          return `<tr data-id="${esc(id)}" class="${sel ? 'dt-fila-seleccionada' : ''}">` +
            celdaCheck(`<input type="checkbox" class="dt-check" ${sel ? 'checked' : ''} aria-label="Seleccionar ${esc(etiquetaDe(fila))}" />`) +
            visibles.map((col) => htmlCelda(col, fila, busquedaActiva)).join('') +
            celdaAcciones(htmlAccionesFila(fila)) +
            '</tr>';
        }).join('');
      }

      /** Fila de totales (sobre TODO lo filtrado, no solo la página) */
      function pintarTotales({ visibles, filas }) {
        const conAgregados = visibles.some((c) => c.agregado);
        if (!conAgregados || st.cargando || st.error || !filas.length) { tfoot.innerHTML = ''; return; }
        tfoot.innerHTML = '<tr>' + celdaCheck() +
          visibles.map((col) => `<td data-campo="${esc(col.campo)}" class="${clasesColumna(col)}"${estiloAncho(col.campo)}>${col.agregado
            ? `<span class="dt-agregado-etiqueta" title="${esc(col.agregado)} de ${filas.length} registros filtrados">${etiquetaAgregado(col)}</span>${esc(calcularAgregado(col, filas))}`
            : ''}</td>`).join('') +
          celdaAcciones() + '</tr>';
      }

      function pintarChips({ busquedaActiva }) {
        const chip = (texto, atributo) =>
          `<span class="dt-chip">${esc(texto)}${botonIcono('', 'cancelar', 'Quitar filtro', atributo)}</span>`;
        const chips = Object.keys(st.filtros)
          .filter(colPorCampo)
          .map((campo) => chip(describirFiltro(colPorCampo(campo), st.filtros[campo]), `data-quitar-filtro="${esc(campo)}"`));
        if (busquedaActiva) chips.unshift(chip(`Búsqueda: “${st.busqueda.trim()}”`, 'data-quitar-busqueda'));

        const zona = $('.dt-filtros-activos');
        zona.hidden = chips.length === 0;
        zona.innerHTML = chips.length
          ? `<span class="dt-filtros-titulo">Filtros:</span>${chips.join('')}<button type="button" class="dt-link" data-limpiar-todo>Limpiar todo</button>`
          : '';
      }

      /** Aviso de selección (patrón Gmail) */
      function pintarBanner({ filas, idsPagina, selPagina, busquedaActiva }) {
        const banner = $('.dt-banner');
        const paginaCompleta = cfg.seleccionable && idsPagina.length && selPagina === idsPagina.length;
        if (!paginaCompleta || filas.length <= idsPagina.length) {
          banner.hidden = true;
          banner.innerHTML = '';
          return;
        }
        const selFiltradas = filas.filter((f) => st.seleccion.has(idDe(f))).length;
        const filtrados = Object.keys(st.filtros).length || busquedaActiva ? 'filtrados ' : '';
        banner.hidden = false;
        banner.innerHTML = selFiltradas === filas.length
          ? `Los <strong>${filas.length}</strong> registros ${filtrados}están seleccionados. <button type="button" class="dt-link" data-quitar-seleccion>Quitar selección</button>`
          : `Seleccionaste los <strong>${idsPagina.length}</strong> registros de esta página. <button type="button" class="dt-link" data-seleccionar-todos>Seleccionar los ${filas.length} registros</button>`;
      }

      function pintarBarraYPie({ filas, pagina, inicio, totalPaginas }) {
        $('.dt-barra-carga').hidden = !st.refrescando;
        $('.dt-resumen').textContent = st.cargando ? 'Cargando…'
          : filas.length
            ? `Mostrando ${inicio + 1}–${inicio + pagina.length} de ${filas.length}` + (filas.length !== st.datos.length ? ` (filtrados de ${st.datos.length})` : '')
            : `0 de ${st.datos.length}`;
        $('.dt-pagina').textContent = `${st.pagina} / ${totalPaginas}`;
        $('.dt-tamano').value = String(st.tamanoPagina);
        $('.dt-primera').disabled = $('.dt-prev').disabled = st.pagina <= 1;
        $('.dt-ultima').disabled = $('.dt-next').disabled = st.pagina >= totalPaginas;
        if (cfg.exportar) $('.dt-btn-excel').disabled = st.cargando || !!st.error;

        const nSel = st.seleccion.size;
        const info = $('.dt-seleccion-info');
        info.hidden = nSel === 0;
        // Sin permiso para eliminar: decir por qué en vez de esconder la acción sin explicación
        info.textContent = `${nSel} ${plural(nSel, 'seleccionado')}` +
          (!cfg.alEliminar && cfg.motivoSinEliminar ? ` · ${cfg.motivoSinEliminar}` : '');
        contenedor.querySelectorAll('[data-accion-sel]').forEach((b) => { b.hidden = nSel === 0; });
      }

      /** Posición "left" de las columnas fijas, según el ancho real de las anteriores */
      function aplicarFijadas() {
        const encabezado = thead.rows[0];
        if (!encabezado) return;
        const filasTabla = [encabezado].concat(Array.from(tbody.rows), Array.from(tfoot.rows));
        let izquierda = 0;
        let ultima = -1;
        for (let i = 0; i < encabezado.cells.length; i++) {
          const th = encabezado.cells[i];
          if (!th.classList.contains('dt-fija')) break;
          filasTabla.forEach((tr) => {
            const celda = tr.cells[i];
            if (celda && celda.classList.contains('dt-fija')) { celda.style.left = izquierda + 'px'; celda.classList.remove('dt-fija-ultima'); }
          });
          izquierda += th.offsetWidth;
          ultima = i;
        }
        // La sombra solo tiene sentido si el usuario fijó columnas de datos
        if (ultima >= 0 && st.fijadas.size) {
          filasTabla.forEach((tr) => { const c = tr.cells[ultima]; if (c && c.classList.contains('dt-fija')) c.classList.add('dt-fija-ultima'); });
        }
      }

      /** Alto del área con scroll = lo que queda de ventana debajo de la tabla (menos el pie) */
      function ajustarAlto() {
        const scroll = $('.dt-scroll');
        if (!scroll || scroll.offsetParent === null) return;   // pestaña oculta: se ajusta al mostrarse
        const pie = $('.dt-pie');
        const disponible = window.innerHeight - scroll.getBoundingClientRect().top - (pie ? pie.offsetHeight : 0) - 36;
        scroll.style.maxHeight = Math.max(240, disponible) + 'px';
      }

      function avisarCambioDeFiltros() {
        const firma = JSON.stringify(st.filtros);
        if (!cfg.alCambiarFiltros || firma === ultimaFirmaFiltros) return;
        ultimaFirmaFiltros = firma;
        cfg.alCambiarFiltros(JSON.parse(firma));
      }

      // ---------- cambios de estado + repintado ----------
      function cambiarFiltro(campo, filtro) {
        if (filtro) st.filtros[campo] = filtro; else delete st.filtros[campo];
        st.pagina = 1;
        cerrarPopover();
        render();
      }
      function cambiarBusqueda(texto) {
        st.busqueda = texto;
        if (buscador.value !== texto) buscador.value = texto;
        st.pagina = 1;
        render();
      }
      function limpiarTodo() {
        st.filtros = {};
        cambiarBusqueda('');
      }
      function limpiarSeleccion() {
        st.seleccion.clear();
        st.ancla = null;
        render();
      }
      /** Cambia la vista, la recuerda y repinta */
      function cambiarVista(mutar) {
        mutar();
        almacen.guardar();
        render();
      }

      function moverColumna(campo, antesDe) {
        if (campo === antesDe || !colPorCampo(campo)) return;
        cambiarVista(() => {
          const orden = st.ordenColumnas.filter((c) => c !== campo);
          const destino = antesDe ? orden.indexOf(antesDe) : -1;
          orden.splice(destino === -1 ? orden.length : destino, 0, campo);
          st.ordenColumnas = orden;
        });
      }
      function fijarColumna(campo, fijar) {
        cambiarVista(() => {
          if (fijar) { st.fijadas.add(campo); st.ocultas.delete(campo); } else st.fijadas.delete(campo);
        });
      }
      function ocultarColumna(campo) {
        if (columnasVisibles().length <= 1) return;   // siempre al menos una columna
        cambiarVista(() => { st.ocultas.add(campo); st.fijadas.delete(campo); });
      }
      function mostrarColumna(campo) {
        cambiarVista(() => st.ocultas.delete(campo));
      }
      function setDensidad(densidad) {
        if (DENSIDADES[densidad]) cambiarVista(() => { st.densidad = densidad; });
      }
      /** Orden desde el encabezado: clic = solo esta columna (asc → desc → nada); Shift+clic = agrega a las demás */
      function alternarOrden(col, multiple) {
        cambiarVista(() => {
          const i = st.orden.findIndex((o) => o.campo === col.campo);
          if (multiple) {
            if (i === -1) st.orden.push({ campo: col.campo, dir: 'asc' });
            else if (st.orden[i].dir === 'asc') st.orden[i].dir = 'desc';
            else st.orden.splice(i, 1);
          } else if (i === -1 || st.orden.length > 1) st.orden = [{ campo: col.campo, dir: 'asc' }];
          else if (st.orden[0].dir === 'asc') st.orden[0].dir = 'desc';
          else st.orden = [];
        });
      }
      function restablecerVista() {
        aplicarVista(vistaDefault());
        almacen.borrar();
        st.pagina = 1;
        render();
      }

      // =====================================================================
      // 7. Menús flotantes: filtro por columna y "Vista"
      // =====================================================================
      function cerrarPopover() {
        if (popover) { popover.remove(); popover = null; }
      }

      /** Abre un menú bajo (o sobre) el ancla, sin salirse de la ventana */
      function abrirPopover(ancla, html, alMontar) {
        cerrarPopover();
        popover = document.createElement('div');
        popover.className = 'dt-popover';
        popover.innerHTML = html;
        document.body.appendChild(popover);
        const r = ancla.getBoundingClientRect();
        const ancho = popover.offsetWidth;
        const alto = popover.offsetHeight;
        popover.style.left = Math.max(8, Math.min(r.left, window.innerWidth - ancho - 8)) + 'px';
        popover.style.top = (r.bottom + alto + 8 > window.innerHeight ? Math.max(8, r.top - alto - 6) : r.bottom + 6) + 'px';
        if (alMontar) alMontar(popover);
      }

      /** Partes comunes del menú de columna: ordenar arriba; quitar/aplicar y fijar/ocultar abajo */
      function partesMenuColumna(col) {
        const [asc, desc] = tipoDe(col).etiquetasOrden;
        const fijada = st.fijadas.has(col.campo);
        return {
          arriba: col.ordenable ? `<div class="dt-pop-orden">
              <button type="button" class="secondary" data-orden="asc">${esc(asc)}</button>
              <button type="button" class="secondary" data-orden="desc">${esc(desc)}</button>
            </div>` : '',
          abajo: `<div class="dt-pop-acciones">
              <button type="button" class="secondary" data-accion="quitar">Quitar filtro</button>
              <button type="button" data-accion="aplicar">Aplicar</button>
            </div>
            <div class="dt-pop-col">
              <button type="button" class="secondary" data-accion="fijar">${ic(fijada ? 'desfijar' : 'fijar')} ${fijada ? 'Desfijar' : 'Fijar'}</button>
              <button type="button" class="secondary" data-accion="ocultar" ${columnasVisibles().length <= 1 ? 'disabled' : ''}>${ic('ocultar')} Ocultar</button>
            </div>`,
        };
      }

      function conectarMenuColumna(pop, col, aplicar) {
        const on = (sel, fn) => pop.querySelectorAll(sel).forEach((el) => el.addEventListener('click', fn));
        on('[data-accion="aplicar"]', aplicar);
        on('[data-accion="quitar"]', () => cambiarFiltro(col.campo, null));
        on('[data-orden]', (ev) => {
          cerrarPopover();
          cambiarVista(() => { st.orden = [{ campo: col.campo, dir: ev.currentTarget.dataset.orden }]; });
        });
        on('[data-accion="fijar"]', () => { cerrarPopover(); fijarColumna(col.campo, !st.fijadas.has(col.campo)); });
        on('[data-accion="ocultar"]', () => { cerrarPopover(); ocultarColumna(col.campo); });
      }

      function abrirFiltro(ancla, col) {
        if (tipoDe(col).filtroPorValores) abrirFiltroPorValores(ancla, col);
        else abrirFiltroPorCondicion(ancla, col);
      }

      /** Lista de casillas con los valores existentes y su conteo (como el filtro de Excel) */
      function abrirFiltroPorValores(ancla, col) {
        const actual = st.filtros[col.campo] || {};
        const conteo = new Map();
        st.datos.forEach((fila) => {
          const v = valorDe(col, fila);
          const k = vacio(v) ? '' : String(v);
          conteo.set(k, (conteo.get(k) || 0) + 1);
        });
        const valores = Array.from(conteo.keys()).sort((a, b) => a.localeCompare(b, 'es'));
        const marcados = actual.valores ? new Set(actual.valores) : new Set(valores);
        const { arriba, abajo } = partesMenuColumna(col);

        abrirPopover(ancla, `<h4>${esc(col.titulo)}</h4>${arriba}
          <div class="dt-pop-fila"><input type="search" class="dt-pop-buscar" placeholder="Buscar valor…" aria-label="Buscar valor" /></div>
          <div class="dt-pop-fila">
            <button type="button" class="secondary" data-marcar="1">Todos</button>
            <button type="button" class="secondary" data-marcar="">Ninguno</button>
          </div>
          <div class="dt-lista-valores">${valores.map((v) => `
            <label data-texto="${esc(normalizar(v))}"><input type="checkbox" value="${esc(v)}" ${marcados.has(v) ? 'checked' : ''} />
              <span>${v === '' ? '<em>(vacío)</em>' : esc(v)}</span>
              <button type="button" class="dt-solo" data-solo="${esc(v)}" title="Filtrar solo por este valor">solo</button>
              <span class="dt-conteo">${conteo.get(v)}</span></label>`).join('')}
          </div>${abajo}`, (pop) => {
          const casillas = () => Array.from(pop.querySelectorAll('.dt-lista-valores input'));
          const buscar = pop.querySelector('.dt-pop-buscar');
          buscar.addEventListener('input', () => {
            const q = normalizar(buscar.value);
            pop.querySelectorAll('.dt-lista-valores label').forEach((l) => { l.hidden = !l.dataset.texto.includes(q); });
          });
          // Todos / Ninguno solo afectan lo que se ve tras buscar
          pop.querySelectorAll('[data-marcar]').forEach((b) => b.addEventListener('click', () => {
            casillas().forEach((c) => { if (!c.parentElement.hidden) c.checked = !!b.dataset.marcar; });
          }));
          pop.querySelectorAll('[data-solo]').forEach((b) => b.addEventListener('click', (ev) => {
            ev.preventDefault();   // no marcar la casilla del label
            cambiarFiltro(col.campo, { valores: [b.dataset.solo] });
          }));
          conectarMenuColumna(pop, col, () => {
            const elegidos = casillas().filter((c) => c.checked).map((c) => c.value);
            cambiarFiltro(col.campo, elegidos.length === valores.length ? null : { valores: elegidos });
          });
          buscar.focus();
        });
      }

      /** Condición + valor(es), con atajos si el tipo los tiene (fechas) */
      function abrirFiltroPorCondicion(ancla, col) {
        const tipo = tipoDe(col);
        const actual = st.filtros[col.campo] || {};
        const { arriba, abajo } = partesMenuColumna(col);
        const presets = tipo.presets.length
          ? `<div class="dt-pop-presets">${tipo.presets.map((p) => `<button type="button" class="secondary" data-preset="${esc(p.id)}">${esc(p.texto)}</button>`).join('')}</div>`
          : '';
        const input = (clase, placeholder, etiqueta, valor) =>
          `<input type="${tipo.input}" class="${clase}" step="any" placeholder="${placeholder}" aria-label="${etiqueta}" value="${esc(valor || '')}" />`;

        abrirPopover(ancla, `<h4>${esc(col.titulo)}</h4>${arriba}${presets}
          <div class="dt-pop-fila"><select class="dt-pop-op" aria-label="Condición">${tipo.operadores.map(([k, t]) => `<option value="${k}" ${actual.op === k ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
          <div class="dt-pop-fila dt-pop-fila-v1">${input('dt-pop-v1', 'Valor', 'Valor', actual.v1)}</div>
          <div class="dt-pop-fila dt-pop-fila-v2">${input('dt-pop-v2', 'y…', 'Hasta', actual.v2)}</div>
          ${abajo}`, (pop) => {
          const op = pop.querySelector('.dt-pop-op');
          const v1 = pop.querySelector('.dt-pop-v1');
          const v2 = pop.querySelector('.dt-pop-v2');
          const mostrarCampos = () => {
            pop.querySelector('.dt-pop-fila-v1').hidden = SIN_VALOR.includes(op.value);
            pop.querySelector('.dt-pop-fila-v2').hidden = op.value !== 'entre';
          };
          const aplicar = () => {
            const sinValor = !SIN_VALOR.includes(op.value) && v1.value === '';
            cambiarFiltro(col.campo, sinValor ? null : { op: op.value, v1: v1.value, v2: v2.value });
          };
          op.addEventListener('change', mostrarCampos);
          mostrarCampos();
          pop.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') aplicar(); }));
          pop.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => {
            cambiarFiltro(col.campo, tipo.presets.find((p) => p.id === b.dataset.preset).filtro());
          }));
          conectarMenuColumna(pop, col, aplicar);
          (SIN_VALOR.includes(op.value) ? op : v1).focus();
        });
      }

      /** Menú "Vista": columnas visibles, fijar, reordenar, densidad y restablecer */
      function abrirVista(ancla) {
        const pintar = (pop) => {
          const orden = st.ordenColumnas.map(colPorCampo);
          pop.innerHTML = `<h4>Columnas</h4><div class="dt-columnas">${orden.map((c, i) => {
            const campo = esc(c.campo);
            const fijada = st.fijadas.has(c.campo);
            return `<div class="dt-columna-item">
              <label><input type="checkbox" value="${campo}" ${st.ocultas.has(c.campo) ? '' : 'checked'} /> ${esc(c.titulo)}</label>
              ${botonIcono(fijada ? 'activo' : '', 'fijar', `${fijada ? 'Desfijar' : 'Fijar a la izquierda'}: ${c.titulo}`, `data-fijar="${campo}"`)}
              ${botonIcono('', 'subir', `Mover arriba: ${c.titulo}`, `data-subir="${campo}" ${i === 0 ? 'disabled' : ''}`)}
              ${botonIcono('', 'bajar', `Mover abajo: ${c.titulo}`, `data-bajar="${campo}" ${i === orden.length - 1 ? 'disabled' : ''}`)}
            </div>`;
          }).join('')}</div>
            <div class="dt-vista-opciones">
              <label style="margin:0">Densidad
                <select class="dt-densidad" style="margin-top:4px">
                  ${Object.entries(DENSIDADES).map(([k, t]) => `<option value="${k}" ${st.densidad === k ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
              </label>
              <button type="button" class="secondary dt-restablecer">${ic('restablecer')} Restablecer vista</button>
              ${cfg.idTabla ? '<span class="page-subtitle" style="font-size:11px">Tu vista se guarda en este navegador.</span>' : ''}
            </div>`;

          // Cada cambio repinta la tabla y también este menú (queda abierto)
          const alClic = (sel, fn) => pop.querySelectorAll(sel).forEach((el) => el.addEventListener('click', () => { fn(el); pintar(pop); }));
          pop.querySelectorAll('.dt-columnas input').forEach((casilla) => casilla.addEventListener('change', () => {
            if (casilla.checked) mostrarColumna(casilla.value); else ocultarColumna(casilla.value);
            pintar(pop);
          }));
          alClic('[data-fijar]', (b) => fijarColumna(b.dataset.fijar, !st.fijadas.has(b.dataset.fijar)));
          alClic('[data-subir]', (b) => moverColumna(b.dataset.subir, st.ordenColumnas[st.ordenColumnas.indexOf(b.dataset.subir) - 1]));
          alClic('[data-bajar]', (b) => moverColumna(b.dataset.bajar, st.ordenColumnas[st.ordenColumnas.indexOf(b.dataset.bajar) + 2] || null));
          alClic('.dt-restablecer', () => { restablecerVista(); Notificar.info('Vista restablecida'); });
          pop.querySelector('.dt-densidad').addEventListener('change', (ev) => setDensidad(ev.target.value));
        };
        abrirPopover(ancla, '', pintar);
      }

      // =====================================================================
      // 8. Edición (compartida por celda y panel) y deshacer
      // =====================================================================
      let secuenciaHistorial = 0;

      function crearControl(col, valor) {
        const control = tipoDe(col).crearControl(valor, col, valoresExistentes(col));
        control.setAttribute('aria-label', col.titulo);
        return control;
      }
      const valorParaControl = (col, valor) => tipoDe(col).aControl(valor);

      /** Llama alEditar y actualiza la fila en memoria. Lanza si el servidor rechaza. */
      async function aplicarCambio(fila, col, textoControl) {
        const resultado = await cfg.alEditar(fila, col.campo, tipoDe(col).deControl(textoControl));
        if (resultado && typeof resultado === 'object') {
          const i = st.datos.findIndex((f) => idDe(f) === idDe(fila));
          if (i !== -1) st.datos[i] = resultado;
        }
      }

      /**
       * Guarda un campo (celda o panel). Regresa true si guardó, false si no había cambio. Lanza si falla.
       * El aviso de éxito ofrece "Deshacer" y la edición queda en el historial para Ctrl+Z.
       */
      async function guardarCambio(fila, col, textoControl) {
        const anterior = valorParaControl(col, valorDe(col, fila));
        if (textoControl === anterior) return false;
        await aplicarCambio(fila, col, textoControl);

        const entrada = { seq: ++secuenciaHistorial, id: idDe(fila), col, anterior };
        st.historial.push(entrada);
        if (st.historial.length > MAX_HISTORIAL) st.historial.shift();
        Notificar.exito(`${col.titulo} de ${etiquetaDe(fila)} actualizado`, {
          duracion: 8000,
          accion: { texto: 'Deshacer', alHacer: () => deshacer(entrada) },
        });
        return true;
      }

      /** Revierte una edición del historial (desde "Deshacer" del aviso o con Ctrl+Z) */
      async function deshacer(entrada) {
        st.historial = st.historial.filter((e) => e !== entrada);
        const actual = filaPorId(entrada.id);
        if (!actual) { Notificar.error('No se puede deshacer: el registro ya no existe'); return; }
        try {
          await aplicarCambio(actual, entrada.col, entrada.anterior);
          render();
          refrescarPanel();
          Notificar.info(`Se restauró ${entrada.col.titulo} de ${etiquetaDe(actual)}`);
        } catch (err) {
          Notificar.error('No se pudo deshacer: ' + err.message);
        }
      }

      const celdaDe = (id, campo) => tbody.querySelector(`tr[data-id="${CSS.escape(id)}"] td[data-campo="${CSS.escape(campo)}"]`);

      /** Devuelve el foco al lápiz de una celda (usuarios de teclado no pierden su lugar) */
      function enfocarLapiz(id, campo) {
        const celda = celdaDe(id, campo);
        const btn = celda && celda.querySelector('.dt-btn-editar-celda');
        if (!btn) return;
        btn.style.opacity = '1';
        btn.focus();
        btn.addEventListener('blur', () => { btn.style.opacity = ''; }, { once: true });
      }

      function crearBoton(texto, clase, titulo, html) {
        const b = document.createElement('button');
        b.type = 'button';
        if (clase) b.className = clase;
        if (html) b.innerHTML = html; else b.textContent = texto;
        if (titulo) { b.title = titulo; b.setAttribute('aria-label', texto); }
        return b;
      }

      function iniciarEdicion(td) {
        const col = colPorCampo(td.dataset.campo);
        const fila = filaPorId(td.closest('tr').dataset.id);
        if (!col || !fila || !puedeEditarCelda(col) || st.editando) return;
        cerrarPopover();

        const id = idDe(fila);
        const control = crearControl(col, valorDe(col, fila));
        const btnOk = crearBoton('Guardar', '', 'Guardar (Enter)', ic('guardar'));
        const btnCancelar = crearBoton('Cancelar', 'secondary', 'Cancelar (Esc)', ic('cancelar'));
        const editor = document.createElement('div');
        editor.className = 'dt-editor';
        editor.append(control, btnOk, btnCancelar);

        st.editando = { id, campo: col.campo };
        td.classList.add('dt-editando');
        td.classList.remove('dt-error-celda');
        td.removeAttribute('title');
        td.innerHTML = '';
        td.appendChild(editor);
        control.focus();
        if (control.select && control.type === 'text') control.select();

        let terminado = false;
        const terminar = () => {
          if (terminado) return false;
          terminado = true;
          return true;
        };
        const cancelar = (devolverFoco) => {
          if (!terminar()) return;
          st.editando = null;
          render();
          if (devolverFoco) enfocarLapiz(id, col.campo);
        };
        const guardar = async () => {
          if (!terminar()) return;
          td.classList.add('dt-guardando');
          control.disabled = btnOk.disabled = btnCancelar.disabled = true;
          try {
            await guardarCambio(fila, col, control.value);
            st.editando = null;
            render();
            refrescarPanel();
            enfocarLapiz(id, col.campo);
          } catch (err) {
            st.editando = null;
            render();
            const celda = celdaDe(id, col.campo);
            if (celda) { celda.classList.add('dt-error-celda'); celda.title = err.message; }
            Notificar.error('No se guardó: ' + err.message);
          }
        };

        control.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); guardar(); }
          if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); cancelar(true); }
        });
        btnOk.addEventListener('click', guardar);
        btnCancelar.addEventListener('click', () => cancelar(true));
        // Salir de la celda sin confirmar CANCELA (un clic accidental no cambia datos)
        editor.addEventListener('focusout', (ev) => {
          if (ev.relatedTarget && editor.contains(ev.relatedTarget)) return;
          setTimeout(() => { if (!editor.contains(document.activeElement)) cancelar(false); }, 0);
        });
      }

      // =====================================================================
      // 9. Acciones: eliminar, copiar, exportar
      // =====================================================================
      /** Confirma según el riesgo y elimina. Sirve para una fila (botón de la fila / panel) o varias. */
      async function eliminarFilas(filas, boton) {
        if (!cfg.alEliminar || !filas.length) return;
        const n = filas.length;
        // Fricción según el riesgo: 1 → simple; varios → lista de afectados; muchos → escribir ELIMINAR
        const ok = await Confirmar.pedir({
          titulo: n === 1 ? '¿Eliminar este registro?' : `¿Eliminar ${n} registros?`,
          mensaje: n === 1 ? `Se eliminará ${etiquetaDe(filas[0])}. Esta acción no se puede deshacer.` : 'Esta acción no se puede deshacer. Se eliminarán:',
          detalle: n === 1 ? [] : filas.map(etiquetaDe),
