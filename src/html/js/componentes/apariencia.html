<style>
  /* ============ Apariencia: el engrane de la barra de arriba y su panel lateral ============
     Cada quien elige cómo ve el sistema (modo claro / oscuro / el de su computadora, color,
     ancho y letra); se guarda en su navegador. Todo cuelga de atributos en <html>:
       data-theme="dark"            lo de siempre (styles.html); Auto lo pone o lo quita solo
       data-color="azul"            cambia --color-primary (botones, enlaces, lo activo); el
                                    menú lateral sigue navy de marca
       data-ancho="contenedor"      el contenido no pasa de 1360 px y se centra
       data-letra="inter"           --letra (styles.html la usa en body)
     La temporada (Día de Muertos) pone aquí su sección: Temporada.opciones(cont). */
  :root[data-letra="inter"] { --letra: 'Inter'; }
  :root[data-letra="roboto"] { --letra: 'Roboto'; }
  :root[data-letra="public-sans"] { --letra: 'Public Sans'; }

  /* Colores: claro y oscuro de cada uno (en oscuro, uno más vivo para que se lea sobre el fondo) */
  :root[data-color="azul"] { --color-primary: #1d4ed8; --color-primary-hover: #1e40af; --color-primary-soft: #dbeafe; }
  :root[data-color="morado"] { --color-primary: #6d28d9; --color-primary-hover: #5b21b6; --color-primary-soft: #ede9fe; }
  :root[data-color="verde"] { --color-primary: #15803d; --color-primary-hover: #166534; --color-primary-soft: #dcfce7; }
  :root[data-color="turquesa"] { --color-primary: #0f766e; --color-primary-hover: #115e59; --color-primary-soft: #ccfbf1; }
  :root[data-color="naranja"] { --color-primary: #c2410c; --color-primary-hover: #9a3412; --color-primary-soft: #ffedd5; }
  :root[data-color="rosa"] { --color-primary: #be185d; --color-primary-hover: #9d174d; --color-primary-soft: #fce7f3; }
  :root[data-theme="dark"][data-color="azul"] { --color-primary: #2563eb; --color-primary-hover: #3b82f6; --color-primary-soft: #172554; }
  :root[data-theme="dark"][data-color="morado"] { --color-primary: #7c3aed; --color-primary-hover: #8b5cf6; --color-primary-soft: #2e1065; }
  :root[data-theme="dark"][data-color="verde"] { --color-primary: #16a34a; --color-primary-hover: #22c55e; --color-primary-soft: #14361f; }
  :root[data-theme="dark"][data-color="turquesa"] { --color-primary: #0d9488; --color-primary-hover: #14b8a6; --color-primary-soft: #123a37; }
  :root[data-theme="dark"][data-color="naranja"] { --color-primary: #ea580c; --color-primary-hover: #f97316; --color-primary-soft: #3b1d0c; }
  :root[data-theme="dark"][data-color="rosa"] { --color-primary: #db2777; --color-primary-hover: #ec4899; --color-primary-soft: #3b0f26; }

  /* Contenedor: el relleno crece para que lo de adentro no pase de 1360 px (no toca las vistas) */
  :root { --ap-relleno: 32px; }
  :root[data-ancho="contenedor"] #view-container {
    padding-left: max(var(--ap-relleno), calc((100% - 1360px) / 2));
    padding-right: max(var(--ap-relleno), calc((100% - 1360px) / 2));
  }

  /* ---------- El engrane ---------- */
  .ap-boton {
    background: transparent; border: 1px solid var(--color-border); border-radius: 999px; color: var(--color-text-muted);
    width: 34px; height: 34px; padding: 0; flex-shrink: 0;
  }
  .ap-boton .ico { width: 18px; height: 18px; transition: transform .45s ease; }
  .ap-boton:hover, .ap-boton[aria-expanded="true"] { background: var(--color-bg); color: var(--color-text); }
  .ap-boton:hover .ico, .ap-boton[aria-expanded="true"] .ico { transform: rotate(60deg); }

  /* ---------- El panel: sale por la derecha; por debajo de las ventanas (500), que pueden abrirse encima ---------- */
  .ap-fondo { position: fixed; inset: 0; z-index: 470; background: rgba(6, 20, 30, .35); opacity: 0; transition: opacity .2s ease; }
  .ap-fondo.ap-visible { opacity: 1; }
  .ap-panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 480; width: 360px; max-width: 100vw;
    display: flex; flex-direction: column; background: var(--color-surface); color: var(--color-text);
    border-left: 1px solid var(--color-border); box-shadow: -16px 0 40px rgba(6, 20, 30, .18);
    transform: translateX(100%); transition: transform .25s cubic-bezier(.2, 0, 0, 1);
  }
  .ap-panel.ap-visible { transform: none; }
  .ap-fondo[hidden], .ap-panel[hidden] { display: none; }
  .ap-cabeza {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--color-border);
  }
  .ap-cabeza h2 { margin: 0; font-size: var(--texto-l); display: flex; align-items: center; gap: 8px; }
  .ap-cerrar {
    background: transparent; color: var(--color-text-muted); width: 32px; height: 32px; padding: 0; border-radius: var(--radio-m);
  }
  .ap-cerrar:hover { background: var(--color-bg); color: var(--color-text); }
  .ap-cuerpo { flex: 1; overflow-y: auto; padding: 4px 18px 18px; }
  .ap-seccion { padding: 14px 0; border-bottom: 1px solid var(--color-border); }
  .ap-seccion:last-child { border-bottom: none; }
  .ap-seccion[hidden] { display: none; }
  .ap-subtitulo { margin: 0 0 10px; font-size: var(--texto-m); font-weight: 600; }
  .ap-nota { margin: 8px 0 0; color: var(--color-text-muted); font-size: var(--texto-s); }

  .ap-rejilla { display: grid; gap: 8px; grid-template-columns: repeat(var(--ap-columnas, 2), minmax(0, 1fr)); }
  .ap-rejilla[data-columnas="3"] { --ap-columnas: 3; }
  .ap-opcion {
    flex-direction: column; gap: 6px; padding: 10px 6px; min-height: 64px;
    background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border);
    border-radius: var(--radio-l); font-weight: 500; font-size: var(--texto-s);
  }
  .ap-opcion:hover { background: var(--color-bg); }
  .ap-opcion[aria-pressed="true"] {
    border-color: var(--color-primary); background: var(--color-primary-soft);
    box-shadow: 0 0 0 1px var(--color-primary);
  }
  .ap-opcion .ico { width: 20px; height: 20px; }
  .ap-aa { font-size: var(--texto-xl); font-weight: 600; line-height: 1; }

  /* Dibujito del ancho: la barra del menú y el contenido, a lo ancho o centrado */
  .ap-dibujo {
    position: relative; width: 64px; height: 34px; border: 1px solid var(--color-border); border-radius: var(--radio-xs);
    background: var(--color-bg); overflow: hidden;
  }
  .ap-dibujo::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: #06263A; }
  .ap-dibujo span { position: absolute; top: 7px; bottom: 7px; left: 15px; right: 5px; border-radius: var(--radio-xs); background: var(--color-primary); opacity: .55; }
  .ap-dibujo.ap-centrado span { left: 23px; right: 13px; }

  .ap-colores { display: flex; flex-wrap: wrap; gap: 10px; }
  .ap-color {
    width: 34px; height: 34px; padding: 0; border-radius: 999px; background: var(--ap-muestra); color: #fff;
    border: 2px solid var(--color-surface); box-shadow: 0 0 0 1px var(--color-border);
  }
  .ap-color:hover { background: var(--ap-muestra); transform: scale(1.08); }
  .ap-color .ico { width: 16px; height: 16px; opacity: 0; }
  .ap-color[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--color-text); }
  .ap-color[aria-pressed="true"] .ico { opacity: 1; }

  .ap-pie {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 18px; border-top: 1px solid var(--color-border);
  }
  .ap-pie p { margin: 0; color: var(--color-text-muted); font-size: var(--texto-s); }
  .ap-enlace {
    background: transparent; color: var(--color-primary); padding: 6px 8px; font-size: var(--texto-s); border-radius: var(--radio-s);
  }
  :root[data-theme="dark"] .ap-enlace { color: var(--color-accent); }
  .ap-enlace:hover { background: var(--color-bg); }

  @media (max-width: 1024px) {
    :root { --ap-relleno: 16px; }
    /* En tableta y celular el contenido ya ocupa todo: el ancho no cambia nada */
    .ap-seccion-ancho { display: none; }
  }
  @media (max-width: 640px) {
    :root { --ap-relleno: 12px; }
    .ap-panel { width: 100vw; border-left: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ap-panel, .ap-fondo, .ap-boton .ico { transition: none; }
  }
</style>

<script>
  /**
   * Apariencia — el engrane de la barra de arriba (.ap-boton en Index.html) y su panel lateral.
   *
   * Lo que elige cada quien se guarda en su navegador (localStorage 'apariencia'; antes de esto
   * solo existía 'tema', que se sigue leyendo la primera vez):
   *   modo    'light' | 'dark' | 'auto' (el del sistema operativo, con Pantalla.prefiereOscuro)
   *   color   'marca' | 'azul' | 'morado' | 'verde' | 'turquesa' | 'naranja' | 'rosa'
   *   ancho   'fluido' | 'contenedor'
   *   letra   'poppins' | 'inter' | 'roboto' | 'public-sans'
   *
   *   Apariencia.abrir() / cerrar()
   *   Apariencia.cambiar({ modo: 'dark' })   guarda y aplica (los botones sol/luna del login lo usan)
   *   Apariencia.preferencias()              lo guardado
   *   Apariencia.oscuro()                    ¿se está viendo en oscuro? (ya resuelto el Auto)
   *
   * Cuando cambia el tema que se ve (claro ↔ oscuro) avisa con el evento 'tema-cambiado' en
   * document (app.html marca los botones del login y cambia la foto del fondo).
   * La temporada pone su sección con Temporada.opciones(cont), si existe.
   * Ojo con la regla del repo: las direcciones van con la diagonal escapada.
   */
  const Apariencia = (function () {
    const LLAVE = 'apariencia';
    const BASE = { modo: 'light', color: 'marca', ancho: 'fluido', letra: 'poppins' };
    const MODOS = [
      { valor: 'light', nombre: 'Claro', icono: 'sun' },
      { valor: 'dark', nombre: 'Oscuro', icono: 'moon' },
      { valor: 'auto', nombre: 'Auto', icono: 'monitor' },
    ];
    const COLORES = [
      // Marca: navy y dorado (solo navy no se vería en oscuro)
      { valor: 'marca', nombre: 'Marca', muestra: 'linear-gradient(135deg, #06263A 50%, #B4A169 50%)' },
      { valor: 'azul', nombre: 'Azul', muestra: '#1d4ed8' },
      { valor: 'morado', nombre: 'Morado', muestra: '#6d28d9' },
      { valor: 'verde', nombre: 'Verde', muestra: '#15803d' },
      { valor: 'turquesa', nombre: 'Turquesa', muestra: '#0f766e' },
      { valor: 'naranja', nombre: 'Naranja', muestra: '#c2410c' },
      { valor: 'rosa', nombre: 'Rosa', muestra: '#be185d' },
    ];
    const ANCHOS = [
      { valor: 'fluido', nombre: 'Fluido', clase: '' },
      { valor: 'contenedor', nombre: 'Contenedor', clase: ' ap-centrado' },
    ];
    // familia: como la pide Google Fonts (Poppins ya viene en styles.html)
    const LETRAS = [
      { valor: 'poppins', nombre: 'Poppins', css: 'Poppins' },
      { valor: 'inter', nombre: 'Inter', css: 'Inter', familia: 'Inter:wght@300;400;500;600;700;800' },
      { valor: 'roboto', nombre: 'Roboto', css: 'Roboto', familia: 'Roboto:wght@300;400;500;700' },
      { valor: 'public-sans', nombre: 'Public Sans', css: 'Public Sans', familia: 'Public+Sans:wght@300;400;500;600;700;800' },
    ];
    const valido = (lista, v) => lista.some((o) => o.valor === v);

    function leer() {
      let guardada = null;
      try { guardada = JSON.parse(localStorage.getItem(LLAVE) || 'null'); } catch (e) { guardada = null; }
      const p = Object.assign({}, BASE);
      if (guardada && typeof guardada === 'object') Object.assign(p, guardada);
      else {
        try { if (localStorage.getItem('tema') === 'dark') p.modo = 'dark'; } catch (e) { /* sin almacenamiento */ }
      }
      if (!valido(MODOS, p.modo)) p.modo = BASE.modo;
      if (!valido(COLORES, p.color)) p.color = BASE.color;
      if (!valido(ANCHOS, p.ancho)) p.ancho = BASE.ancho;
      if (!valido(LETRAS, p.letra)) p.letra = BASE.letra;
      return p;
    }
    let pref = leer();

    const oscuro = () => document.documentElement.getAttribute('data-theme') === 'dark';
    const quiereOscuro = () => pref.modo === 'dark' || (pref.modo === 'auto' && typeof Pantalla !== 'undefined' && Pantalla.prefiereOscuro());

    const cargadas = {};
    function cargarLetra(valor) {
      const l = LETRAS.find((o) => o.valor === valor);
      if (!l || !l.familia || cargadas[valor]) return;
      cargadas[valor] = true;
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https:\/\/fonts.googleapis.com/css2?family=' + l.familia + '&display=swap';
      document.head.appendChild(link);
    }

    function aplicar() {
      const raiz = document.documentElement;
      const antes = oscuro();
      if (quiereOscuro()) raiz.setAttribute('data-theme', 'dark');
      else raiz.removeAttribute('data-theme');
      const atributo = (nombre, valor, base) => { if (valor === base) raiz.removeAttribute(nombre); else raiz.setAttribute(nombre, valor); };
      atributo('data-color', pref.color, 'marca');
      atributo('data-ancho', pref.ancho, 'fluido');
      atributo('data-letra', pref.letra, 'poppins');
      cargarLetra(pref.letra);
      if (oscuro() !== antes) document.dispatchEvent(new CustomEvent('tema-cambiado', { detail: { oscuro: oscuro() } }));
    }

    function cambiar(cambios) {
      pref = Object.assign({}, pref, cambios);
      try {
        localStorage.setItem(LLAVE, JSON.stringify(pref));
        localStorage.setItem('tema', quiereOscuro() ? 'dark' : 'light');   // por si alguien vuelve a una versión anterior
      } catch (e) { /* sin almacenamiento: solo dura esta visita */ }
      aplicar();
      marcar();
    }

    aplicar();
    if (typeof Pantalla !== 'undefined') Pantalla.alCambiarEsquema(() => { if (pref.modo === 'auto') aplicar(); });

    // ---------- El panel ----------

    const panel = () => document.getElementById('ap-panel');
    const boton = () => document.querySelector('.ap-boton');
    let fondo = null;
    let cerrando = null;

    function opcion(clave, o, contenido) {
      return `<button type="button" class="ap-opcion" data-ap="${clave}" data-valor="${o.valor}" aria-pressed="false">${contenido}<span>${o.nombre}</span></button>`;
    }

    function armar() {
      const modos = MODOS.map((o) => opcion('modo', o, `<i data-lucide="${o.icono}" class="ico"></i>`)).join('');
      const colores = COLORES.map((o) =>
        `<button type="button" class="ap-color" data-ap="color" data-valor="${o.valor}" style="--ap-muestra:${o.muestra}" title="${o.nombre}" aria-label="${o.nombre}" aria-pressed="false"><i data-lucide="check" class="ico"></i></button>`).join('');
      const anchos = ANCHOS.map((o) => opcion('ancho', o, `<span class="ap-dibujo${o.clase}" aria-hidden="true"><span></span></span>`)).join('');
      const letras = LETRAS.map((o) => opcion('letra', o, `<span class="ap-aa" style="font-family:'${o.css}', sans-serif">Aa</span>`)).join('');
      document.body.insertAdjacentHTML('beforeend',
        '<div class="ap-fondo" hidden></div>' +
        '<aside class="ap-panel" id="ap-panel" role="dialog" aria-modal="true" aria-labelledby="ap-titulo" hidden>' +
          '<div class="ap-cabeza"><h2 id="ap-titulo"><i data-lucide="settings" class="ico"></i>Apariencia</h2>' +
            '<button type="button" class="ap-cerrar" data-ap-cerrar aria-label="Cerrar"><i data-lucide="x" class="ico"></i></button></div>' +
          '<div class="ap-cuerpo">' +
            `<section class="ap-seccion"><h3 class="ap-subtitulo">Modo</h3><div class="ap-rejilla" data-columnas="3">${modos}</div>` +
              '<p class="ap-nota">Auto sigue el modo de tu computadora o teléfono.</p></section>' +
            `<section class="ap-seccion"><h3 class="ap-subtitulo">Color</h3><div class="ap-colores">${colores}</div></section>` +
            `<section class="ap-seccion ap-seccion-ancho"><h3 class="ap-subtitulo">Ancho del diseño</h3><div class="ap-rejilla">${anchos}</div></section>` +
            `<section class="ap-seccion"><h3 class="ap-subtitulo">Tipografía</h3><div class="ap-rejilla">${letras}</div></section>` +
            '<section class="ap-seccion" id="ap-temporada" hidden></section>' +
          '</div>' +
          '<div class="ap-pie"><p>Solo cambia en este navegador.</p><button type="button" class="ap-enlace" data-ap-restablecer>Restablecer</button></div>' +
        '</aside>');
      fondo = document.querySelector('.ap-fondo');
      const p = panel();
      fondo.addEventListener('click', cerrar);
      p.addEventListener('click', (ev) => {
        const el = ev.target.closest('[data-ap]');
        if (el) { cambiar({ [el.dataset.ap]: el.dataset.valor }); return; }
        if (ev.target.closest('[data-ap-restablecer]')) cambiar(BASE);
        else if (ev.target.closest('[data-ap-cerrar]')) cerrar();
      });
      p.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { ev.stopPropagation(); cerrar(); } });
      if (typeof refreshIcons === 'function') refreshIcons();
      else if (window.lucide) window.lucide.createIcons();
    }

    /** Marca lo elegido en el panel (si ya existe) */
    function marcar() {
      const p = panel();
      if (!p) return;
      p.querySelectorAll('[data-ap]').forEach((el) => {
        el.setAttribute('aria-pressed', String(pref[el.dataset.ap] === el.dataset.valor));
      });
    }

    function abierto() { const p = panel(); return !!p && !p.hidden && p.classList.contains('ap-visible'); }

    function abrir() {
      if (!panel()) armar();
      const p = panel();
      clearTimeout(cerrando);
      // Para ver cada letra en su botón
      LETRAS.forEach((l) => cargarLetra(l.valor));
      marcar();
      const temporada = document.getElementById('ap-temporada');
      temporada.hidden = !(typeof Temporada !== 'undefined' && Temporada.opciones && Temporada.opciones(temporada));
      fondo.hidden = false;
      p.hidden = false;
      requestAnimationFrame(() => { fondo.classList.add('ap-visible'); p.classList.add('ap-visible'); });
      const b = boton();
      if (b) b.setAttribute('aria-expanded', 'true');
      const cerrarBtn = p.querySelector('[data-ap-cerrar]');
      if (cerrarBtn) cerrarBtn.focus({ preventScroll: true });
    }

    function cerrar() {
      const p = panel();
      if (!p || p.hidden) return;
      p.classList.remove('ap-visible');
      fondo.classList.remove('ap-visible');
      cerrando = setTimeout(() => { p.hidden = true; fondo.hidden = true; }, 260);
      const b = boton();
      if (b) { b.setAttribute('aria-expanded', 'false'); b.focus({ preventScroll: true }); }
    }

    document.addEventListener('click', (ev) => {
      if (!ev.target.closest('.ap-boton')) return;
      if (abierto()) cerrar(); else abrir();
    });
    document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && abierto()) cerrar(); });

    return { abrir, cerrar, cambiar, oscuro, preferencias: () => Object.assign({}, pref) };
  })();
</script>
