<style>
  /* ============ Combobox — escribir o elegir de una lista ============ */
  .cbx { position: relative; }
  .cbx-lista {
    position: absolute; z-index: 650; left: 0; right: 0; top: calc(100% + 4px);
    max-height: 260px; overflow-y: auto; padding: 4px;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: 10px; box-shadow: var(--shadow-lg);
  }
  .cbx-opcion {
    display: flex; align-items: baseline; gap: 8px; padding: 7px 9px; border-radius: 7px;
    font-size: 13px; color: var(--color-text); cursor: pointer;
  }
  .cbx-opcion:hover, .cbx-opcion.cbx-activa { background: var(--color-primary-soft); }
  .cbx-opcion .cbx-valor { font-weight: 600; white-space: nowrap; }
  .cbx-opcion .cbx-etiqueta { color: var(--color-text-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cbx-opcion mark { background: #ffe58a; color: inherit; padding: 0 1px; border-radius: 2px; }
  :root[data-theme="dark"] .cbx-opcion mark { background: #7a6420; }
  .cbx-vacio, .cbx-mas { padding: 8px 9px; font-size: 12px; color: var(--color-text-muted); }
  .cbx-mas { border-top: 1px solid var(--color-border); margin-top: 4px; }
</style>

<script>
  /**
   * Combobox — campo de texto con lista de sugerencias filtrable.
   *
   * Reemplaza a <datalist>, que se ve distinto en cada navegador, no se puede
   * estilizar y mezcla el valor con la etiqueta. Aquí la lista es HTML propio:
   * se ve igual en todos lados, resalta lo que coincide y funciona con teclado.
   *
   *   const cbx = Combobox.crear(input, {
   *     opciones: [{ valor: 'AUT0100', etiqueta: 'ABC-123 · NISSAN NP300' }],
   *     alElegir: (opcion) => {},        // opcional
   *     maximo: 50,                      // cuántas se listan a la vez
   *     textoVacio: 'Sin coincidencias',
   *   });
   *   cbx.setOpciones([...])   cbx.destruir()
   *
   * Teclado: ↓/↑ mueve, Enter elige, Esc cierra. Escribir libre también vale:
   * el campo sigue siendo un input normal (hay folios que no están en la lista).
   */
  const Combobox = (function () {
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }
    /** Minúsculas y sin acentos, carácter por carácter (misma longitud, para poder resaltar) */
    const normalizarCaracter = (c) => c.normalize('NFD').charAt(0).toLowerCase();
    const normalizar = (texto) => Array.from(String(texto == null ? '' : texto)).map(normalizarCaracter).join('');

    function resaltar(texto, consulta) {
      const caracteres = Array.from(String(texto || ''));
      const base = caracteres.map(normalizarCaracter).join('');
      const i = consulta ? base.indexOf(consulta) : -1;
      if (i === -1) return esc(texto);
      const largo = Array.from(consulta).length;
      return esc(caracteres.slice(0, i).join('')) +
        '<mark>' + esc(caracteres.slice(i, i + largo).join('')) + '</mark>' +
        esc(caracteres.slice(i + largo).join(''));
    }

    function crear(input, config) {
      const cfg = Object.assign({ maximo: 50, textoVacio: 'Sin coincidencias' }, config);
      let opciones = (cfg.opciones || []).map((o) => (typeof o === 'object' ? o : { valor: o, etiqueta: '' }));
      let lista = null;
      let activa = -1;
      let visibles = [];

      const envoltura = document.createElement('div');
      envoltura.className = 'cbx';
      input.parentNode.insertBefore(envoltura, input);
      envoltura.appendChild(input);

      input.setAttribute('role', 'combobox');
      input.setAttribute('aria-expanded', 'false');
      input.setAttribute('aria-autocomplete', 'list');
      const idLista = 'cbx-' + Math.random().toString(36).slice(2, 8);

      /**
       * Lo escrito, salvo que sea EXACTAMENTE una opción ya elegida: en ese caso no se filtra,
       * para poder cambiar de opción al volver al campo (si no, solo se vería la ya elegida).
       */
      function consulta() {
        const texto = input.value.trim();
        const yaElegida = opciones.some((o) => String(o.valor) === texto);
        return yaElegida ? '' : normalizar(texto);
      }

      function abrir() {
        const q = consulta();
        const todas = opciones.filter((o) => !q || normalizar(o.valor).includes(q) || normalizar(o.etiqueta).includes(q));
        visibles = todas.slice(0, cfg.maximo);
        if (!lista) {
          lista = document.createElement('div');
          lista.className = 'cbx-lista';
          lista.id = idLista;
          lista.setAttribute('role', 'listbox');
          envoltura.appendChild(lista);
          input.setAttribute('aria-expanded', 'true');
          input.setAttribute('aria-controls', idLista);
        }
        lista.innerHTML = visibles.length
          ? visibles.map((o, i) => `<div class="cbx-opcion" role="option" id="${idLista}-${i}" data-i="${i}" aria-selected="false">
              <span class="cbx-valor">${resaltar(o.valor, q)}</span>
              <span class="cbx-etiqueta">${resaltar(o.etiqueta, q)}</span>
            </div>`).join('') + (todas.length > visibles.length
              ? `<div class="cbx-mas">y ${todas.length - visibles.length} más — sigue escribiendo para filtrar</div>` : '')
          : `<div class="cbx-vacio">${esc(cfg.textoVacio)}</div>`;
        marcarActiva(-1);
      }

      function cerrar() {
        if (!lista) return;
        lista.remove();
        lista = null;
        activa = -1;
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
      }

      function marcarActiva(i) {
        activa = i;
        if (!lista) return;
        Array.from(lista.querySelectorAll('.cbx-opcion')).forEach((el, idx) => {
          const esActiva = idx === i;
          el.classList.toggle('cbx-activa', esActiva);
          el.setAttribute('aria-selected', esActiva ? 'true' : 'false');
          if (esActiva) {
            if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });   // no está en todos los entornos
            input.setAttribute('aria-activedescendant', el.id);
          }
        });
        if (i === -1) input.removeAttribute('aria-activedescendant');
      }

      let eligiendo = false;

      function elegir(i) {
        const opcion = visibles[i];
        if (!opcion) return;
        input.value = opcion.valor;
        // Avisar del cambio SIN que el propio aviso vuelva a abrir la lista
        eligiendo = true;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
        eligiendo = false;
        cerrar();
        if (cfg.alElegir) cfg.alElegir(opcion);
      }

      const alEscribir = () => { if (!eligiendo) abrir(); };
      const alEnfocar = () => abrir();
      const alTeclear = (ev) => {
        if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          if (!lista) { abrir(); return; }
          const total = visibles.length;
          if (!total) return;
          marcarActiva(ev.key === 'ArrowDown'
            ? (activa + 1) % total
            : (activa <= 0 ? total - 1 : activa - 1));
          return;
        }
        if (ev.key === 'Enter' && lista && activa >= 0) { ev.preventDefault(); elegir(activa); return; }
        if (ev.key === 'Escape' && lista) { ev.stopPropagation(); cerrar(); }
        if (ev.key === 'Tab') cerrar();
      };
      const alClicLista = (ev) => {
        const opcion = ev.target.closest('.cbx-opcion');
        if (opcion) elegir(Number(opcion.dataset.i));
      };
      const alClicFuera = (ev) => {
        if (!document.body.contains(input)) { destruir(); return; }
        if (lista && !envoltura.contains(ev.target)) cerrar();
      };

      input.addEventListener('input', alEscribir);
      input.addEventListener('focus', alEnfocar);
      input.addEventListener('keydown', alTeclear);
      envoltura.addEventListener('mousedown', (ev) => { if (ev.target.closest('.cbx-opcion')) ev.preventDefault(); });
      envoltura.addEventListener('click', alClicLista);
      document.addEventListener('mousedown', alClicFuera);

      function destruir() {
        cerrar();
        input.removeEventListener('input', alEscribir);
        input.removeEventListener('focus', alEnfocar);
        input.removeEventListener('keydown', alTeclear);
        document.removeEventListener('mousedown', alClicFuera);
      }

      return {
        setOpciones(nuevas) {
          opciones = (nuevas || []).map((o) => (typeof o === 'object' ? o : { valor: o, etiqueta: '' }));
          if (lista) abrir();
        },
        abrir,
        cerrar,
        destruir,
      };
    }

    return { crear };
  })();
</script>
