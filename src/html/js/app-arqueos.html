  /** Genera los <div class="field"> agrupados por sección para un formulario de arqueo.
   *  soloGrupos (opcional): limita a esos grupos -- lo usa renderPasosArqueo para
   *  pintar solo los campos del paso actual. */
  function renderCamposArqueo(prefijo, soloGrupos) {
    // Componente CamposHoja. Las firmas las conecta crearFirmaPad (data-tiene-trazo lo lee
    // subirFirmasArqueo); Evidencias (multiple) se junta en un PDF al guardar
    // (subirArchivosArqueo); los totales soloLectura no llevan "$": ya salen formateados.
    return CamposHoja.html(CAMPOS_ARQUEO, { prefijo, soloGrupos });
  }

  // Top-level a propósito (no dentro de initArqueos): lo usa también la ficha de Caja Chica
  // (app-cajachica.html, pestaña Arqueos), otro <script> que comparte este mismo scope global.
  // En blanco (registros de antes de que existiera la columna) se ve como COMPLETO -- la
  // mayoría de lo que ya estaba ya se había terminado, PENDIENTE es la excepción que alguien
  // tiene que marcar a mano. Mismo patrón que badgeEstatusCaja (app-cajachica.html).
  function badgeEstatusArqueo(estatus) {
    const valor = String(estatus || '').toUpperCase();
    if (valor === 'PENDIENTE') {
      return '<span class="badge-estado pendiente"><i data-lucide="clock" class="ico"></i> Pendiente</span>';
    }
    return '<span class="badge-estado activo"><i data-lucide="circle-check" class="ico"></i> Completo</span>';
  }

  /** Agrupa los 9 "grupo" de CAMPOS_ARQUEO en 5 pasos, mismo patrón visual que
   *  el wizard de Inspección Vehicular (chips + Atrás/Siguiente). */
  const PASOS_ARQUEO = [
    { titulo: 'Identificación', grupos: ['Identificación', 'Cuenta bancaria', 'Fechas y método'] },
    { titulo: 'Efectivo', grupos: ['Efectivo — Monedas', 'Efectivo — Billetes', 'Cheques'] },
    { titulo: 'Gastos', grupos: ['Totales de gasto'] },
    { titulo: 'Auditoría', grupos: ['Auditoría'] },
    { titulo: 'Firmas y evidencia', grupos: ['Firmas y evidencia'] },
    { titulo: 'Estatus', grupos: ['Estatus'] },
  ];

  /**
   * Arma el formulario de Arqueo por pasos: chips arriba + un <section class="form-paso">
   * por paso (mismo CSS que ya usa Inspección Vehicular, definido en formulario.html) +
   * Atrás/Siguiente/Guardar al final. Ningún campo de Arqueo es "requerido" (el checklist
   * de auditoría se valida aparte, con REALIZAR_AUDITORIA), así que a diferencia de
   * Inspección los pasos se navegan libres, sin bloquear "Siguiente".
   *
   * El botón final ES el submit real del <form> que envuelve al contenedor donde se
   * inserta esto (se le pone id y texto a la medida de quien llama, para no duplicar
   * el wiring de "deshabilitar mientras guarda" que ya existe por fuera).
   */
  function renderPasosArqueo(prefijo, idBotonGuardar, textoBotonGuardar, iconoBotonGuardar) {
    const secciones = PASOS_ARQUEO.map((p, i) => `
      <section class="form-paso" data-paso="${i}"${i ? ' hidden' : ''}>
        <h3 class="form-paso-titulo" tabindex="-1">${p.titulo}</h3>
        <div class="form-campos" style="--form-columnas:2">${renderCamposArqueo(prefijo, p.grupos)}</div>
      </section>`).join('');
    return '<ol class="form-pasos" data-arq-pasos></ol>' + secciones +
      '<div class="form-acciones form-acciones-pasos">' +
      '<button type="button" class="secondary" data-arq-atras hidden>' + Iconos.svg('anterior') + ' Atrás</button>' +
      '<button type="button" data-arq-siguiente>Siguiente ' + Iconos.svg('siguiente') + '</button>' +
      '<button type="submit" id="' + idBotonGuardar + '" data-arq-guardar hidden><i data-lucide="' + iconoBotonGuardar + '" class="ico"></i> ' + textoBotonGuardar + '</button>' +
      '<span class="form-cuenta" data-arq-cuenta></span></div>';
  }

  /** Conecta la navegación de los pasos que pintó renderPasosArqueo -- se llama una sola
   *  vez, después de insertar ese HTML en el DOM. `contenedor` = el elemento que recibió
   *  ese innerHTML directo (ahí adentro están los .form-paso, los chips y los botones). */
  function wirePasosArqueo(contenedor) {
    let pasoActual = 0;
    function actualizarChips() {
      const lista = contenedor.querySelector('[data-arq-pasos]');
      lista.innerHTML = PASOS_ARQUEO.map((p, i) => `
        <li><button type="button" class="form-paso-chip ${i === pasoActual ? 'activo' : ''}" data-ir="${i}">
          <span class="form-paso-num">${i + 1}</span>${escaparHtml(p.titulo)}</button></li>`).join('');
      lista.querySelectorAll('[data-ir]').forEach((b) => b.addEventListener('click', () => mostrarPaso(Number(b.dataset.ir))));
      const ultimo = pasoActual === PASOS_ARQUEO.length - 1;
      contenedor.querySelector('[data-arq-atras]').hidden = pasoActual === 0;
      contenedor.querySelector('[data-arq-siguiente]').hidden = ultimo;
      contenedor.querySelector('[data-arq-guardar]').hidden = !ultimo;
      contenedor.querySelector('[data-arq-cuenta]').textContent = `Paso ${pasoActual + 1} de ${PASOS_ARQUEO.length}`;
    }
    function mostrarPaso(i) {
      pasoActual = i;
      contenedor.querySelectorAll('.form-paso').forEach((s) => { s.hidden = Number(s.dataset.paso) !== i; });
      actualizarChips();
      refreshIcons();
      const titulo = contenedor.querySelector(`.form-paso[data-paso="${i}"] .form-paso-titulo`);
      if (titulo) titulo.focus({ preventScroll: true });
      if (i > 0 && contenedor.scrollIntoView) contenedor.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
    contenedor.querySelector('[data-arq-siguiente]').addEventListener('click', () => {
      if (pasoActual < PASOS_ARQUEO.length - 1) mostrarPaso(pasoActual + 1);
    });
    contenedor.querySelector('[data-arq-atras]').addEventListener('click', () => {
      if (pasoActual > 0) mostrarPaso(pasoActual - 1);
    });
    mostrarPaso(0);
    return { irAPaso: mostrarPaso };
  }

  /** Lee los campos de captura manual (deja fuera soloLectura, file y firma — esos se manejan aparte). */

  /**
   * "¿Se realiza auditoría?": si es SI se habilitan los 17 reactivos +
   * Observaciones finales; si es NO (o está vacío) quedan bloqueados —
   * mismo patrón que Administrada por/Capturista en Caja Chica.
   * CALIFICACION_AUDITORIA_FINAL se excluye porque siempre es soloLectura

  const CAMPOS_AUDITORIA_DEPENDIENTES = CAMPOS_ARQUEO
    .filter((c) => c.grupo === 'Auditoría' && c.clave !== 'REALIZAR_AUDITORIA' && !c.soloLectura)
    .map((c) => c.clave);
  function actualizarBloqueoAuditoria(prefijo, limpiarSiBloqueado) {
    const select = document.getElementById(prefijo + '-' + slugCampo('REALIZAR_AUDITORIA'));
    if (!select) return;
    const liberar = select.value === 'SI';
    CAMPOS_AUDITORIA_DEPENDIENTES.forEach((clave) => {
      const el = document.getElementById(prefijo + '-' + slugCampo(clave));

  /** Llena el formulario con un objeto {columna real: valor} (ej. de buscarPorId). */
  const CAMPOS_MONEDA_ARQUEO = ['MONTO CAJA', 'TOTAL M', 'TOTAL B', 'TOTAL EFECTIVO', 'SUBTOTAL TOTALES DE GASTO', 'TOTAL GENERAL', 'DIFERENCIA'];
  function poblarFormularioArqueo(prefijo, datos) {
    // La firma guardada se ve como imagen y el recuadro arranca limpio (no con el trazo de
    // la sesión anterior). REALIZAR_AUDITORIA va antes que los 17 reactivos: el bloqueo ya
    // refleja el valor recién cargado cuando se llega a ellos.
    CamposHoja.poblar(CAMPOS_ARQUEO, prefijo, datos, {
      limpiarFirma: limpiarFirmaPad,
      despues: { REALIZAR_AUDITORIA: (p) => actualizarBloqueoAuditoria(p, false) },
      mostrar: (campo, valor, el) => {
        if (CAMPOS_MONEDA_ARQUEO.includes(campo.clave)) {
          el.dataset.valor = valor || 0; // valor crudo, lo usa recalcularTotalesArqueo (Monto caja)
          return formatearMoneda(valor || 0);
        }
        if (campo.clave === 'CALIFICACION_AUDITORIA_FINAL') return valor === '' ? '' : valor + '%';
        return valor;   // Arqueo no tiene fechas tipo date: todo va tal cual
      },
    });
  }

  /** Sube (si el usuario eligió) los archivos de Arqueo y regresa {columna real: url}. */

  /** Dibuja la foto en un canvas, la achica si hace falta (nunca la agranda,
   *  Math.min(..., 1)) y la regresa como JPEG comprimido. Las fotos de
   *  cámara sin tocar (varios MB cada una, 3000-4000px) hacían que el PDF
   *  combinado de Evidencias pasara el límite de tamaño que google.script.run
   *  deja mandar en una sola llamada -- la subida tronaba con un
   *  "NetworkError... HTTP 400" genérico, sin mensaje claro, en vez de
   *  llegar siquiera al límite de 10 MB que ya revisa el servidor
   *  (ArqueosService.subirArchivo). Bajar cada foto a 1600px de lado más
   *  largo y comprimirla la deja perfectamente legible y mucho más ligera. */
  function comprimirImagenArqueo_(file) {
    const LADO_MAX = 1600;
    const CALIDAD = 0.75;
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, LADO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
        const ancho = Math.round(img.naturalWidth * escala);
        const alto = Math.round(img.naturalHeight * escala);
        const canvas = document.createElement('canvas');
        canvas.width = ancho;
        canvas.height = alto;
        const ctx = canvas.getContext('2d');
        // Fondo blanco antes de dibujar: una foto PNG con transparencia se
        // vería negra al exportar a JPEG (sin canal alfa) si no se rellena.
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, ancho, alto);
        ctx.drawImage(img, 0, 0, ancho, alto);
        URL.revokeObjectURL(url);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', CALIDAD), ancho, alto });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer una de las imágenes')); };
      img.src = url;
    });
  }
  /** Junta varias fotos en un solo PDF (una por página, centrada y ajustada a
   *  la hoja carta con margen de 0.5") -- lo usa el campo "Evidencias" de
   *  Arqueos, que acepta varias imágenes pero en la hoja de cálculo sigue
   *  siendo un único archivo. jsPDF corre entero en el navegador (cargado en
   *  Index.html); no hace falta mandar las fotos sueltas al servidor.
   *  Regresa el base64 crudo (sin el prefijo "data:...;base64,"), listo para
   *  apiSubirArchivoArqueo, igual que leerArchivoBase64. */
  async function combinarImagenesEnPdf(files) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const margen = 36;
    for (let i = 0; i < files.length; i++) {
      const { dataUrl, ancho, alto } = await comprimirImagenArqueo_(files[i]);
      if (i > 0) doc.addPage();
      const anchoDisponible = doc.internal.pageSize.getWidth() - margen * 2;
      const altoDisponible = doc.internal.pageSize.getHeight() - margen * 2;
      const escala = Math.min(anchoDisponible / ancho, altoDisponible / alto, 1);
      const anchoFinal = ancho * escala;
      const altoFinal = alto * escala;
      const x = margen + (anchoDisponible - anchoFinal) / 2;
      const y = margen + (altoDisponible - altoFinal) / 2;
      doc.addImage(dataUrl, 'JPEG', x, y, anchoFinal, altoFinal);
    }
    return doc.output('datauristring').split(',')[1] || '';
  }

  async function subirArchivosArqueo(prefijo) {
    const resultado = {};
    const camposArchivo = CAMPOS_ARQUEO.filter((c) => c.tipo === 'file');
    for (const campo of camposArchivo) {
      const input = document.getElementById(prefijo + '-' + slugCampo(campo.clave));
      if (!input || !input.files || !input.files.length) continue;
      if (campo.multiple) {
        // Evidencias: a su propia carpeta (apiSubirEvidenciaArqueo, no apiSubirArchivoArqueo).
        // _FILE_ID no es columna real -- viaja para que el servidor renombre el PDF a
        // "<ID ARQUEO>_EVIDENCIA_<fecha>" una vez que sabe el ID real (ArqueosService
        // crear/actualizar lo descartan antes de guardar).
        const base64 = await combinarImagenesEnPdf(Array.from(input.files));
        const subido = await callServer('apiSubirEvidenciaArqueo', state.token, 'evidencias.pdf', 'application/pdf', base64);
        resultado[campo.clave] = subido.url;
        resultado[campo.clave + '_FILE_ID'] = subido.id;
        continue;
      }
      const file = input.files[0];
      const base64 = await leerArchivoBase64(file);
      const subido = await callServer('apiSubirArchivoArqueo', state.token, file.name, file.type, base64);
      resultado[campo.clave] = subido.url;
    }
    return resultado;
  }

  /**
   * Recuadro para firmar con mouse/dedo (canvas), en vez de subir un
   * archivo. Conecta los eventos de dibujo — funciona igual con mouse
   * (mousedown/move/up) y con touch (touchstart/move/end, con
   * preventDefault para que el navegador no haga scroll mientras se firma).
   * canvas.dataset.tieneTrazo indica si ya se dibujó algo (lo usa
   * subirFirmasArqueo al guardar, para no mandar un canvas vacío).
   */
  function crearFirmaPad(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1a1a2e';
    let dibujando = false;
    let ultimoPunto = null;

    function posicion(ev) {
      const rect = canvas.getBoundingClientRect();
      const punto = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
      return {
        x: (punto.clientX - rect.left) * (canvas.width / rect.width),
        y: (punto.clientY - rect.top) * (canvas.height / rect.height),
      };
    }
    function iniciar(ev) {
      ev.preventDefault();
      dibujando = true;
      ultimoPunto = posicion(ev);
    }
    function mover(ev) {
      if (!dibujando) return;
      ev.preventDefault();
      const punto = posicion(ev);
      ctx.beginPath();
      ctx.moveTo(ultimoPunto.x, ultimoPunto.y);
      ctx.lineTo(punto.x, punto.y);
      ctx.stroke();
      ultimoPunto = punto;
      canvas.dataset.tieneTrazo = '1';
    }
    function terminar() { dibujando = false; ultimoPunto = null; }

    canvas.addEventListener('mousedown', iniciar);
    canvas.addEventListener('mousemove', mover);
    canvas.addEventListener('mouseup', terminar);
    canvas.addEventListener('mouseleave', terminar);
    canvas.addEventListener('touchstart', iniciar, { passive: false });
    canvas.addEventListener('touchmove', mover, { passive: false });
    canvas.addEventListener('touchend', terminar);
  }

  /** Borra el dibujo del recuadro de firma y lo deja como recién abierto. */
  function limpiarFirmaPad(canvas) {
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    canvas.dataset.tieneTrazo = '0';
  }

  /** Sube (si el usuario firmó) las firmas dibujadas y regresa {columna real: url,
   * columna + '_FILE_ID': id} — mismo patrón que subirArchivosArqueo, pero
   * exportando el canvas a PNG en vez de leer un <input type="file">, y a su
   * propia carpeta (apiSubirFirmaArqueo, no apiSubirArchivoArqueo). El
   * '_FILE_ID' no es una columna real: viaja para que el servidor renombre la
   * firma a "<ID ARQUEO>_<quién firma>_<fecha>" una vez que sabe el ID real
   * (ArqueosService.crear/actualizar lo descartan antes de guardar). Sin
   * trazo nuevo, no se manda nada (así crear()/actualizar() no le tocan la
   * firma que ya tenía guardada). */
  async function subirFirmasArqueo(prefijo) {
    const resultado = {};
    const camposFirma = CAMPOS_ARQUEO.filter((c) => c.tipo === 'firma');
    for (const campo of camposFirma) {
      const canvas = document.getElementById(prefijo + '-' + slugCampo(campo.clave));
      if (!canvas || canvas.dataset.tieneTrazo !== '1') continue;
      const base64 = canvas.toDataURL('image/png').split(',')[1];
      const subido = await callServer('apiSubirFirmaArqueo', state.token, 'firma.png', 'image/png', base64);
      resultado[campo.clave] = subido.url;
      resultado[campo.clave + '_FILE_ID'] = subido.id;
    }
    return resultado;
  }

  /**
   * Recalcula en vivo (solo para que el usuario lo vea mientras captura —
   * el servidor vuelve a calcular todo, no se confía en esto) los totales
   * de un formulario de Arqueo: Total M/B/Efectivo, Total general,
   * Diferencia y Calificación final. `auditItems` = catálogo de los 17
   * reactivos (ya cargado del servidor).
   */
  function recalcularTotalesArqueo(prefijo, auditItems) {
    const val = (clave) => {
      const el = document.getElementById(prefijo + '-' + slugCampo(clave));
      return el ? Number(el.value) || 0 : 0;
    };
    const totalM = val('M 0,50') * 0.5 + val('M 1,00') * 1 + val('M 2,00') * 2 + val('M 5,00') * 5 + val('M 10,00') * 10 + val('M 20,00') * 20;
    const totalB = val('B 20,00') * 20 + val('B 50,00') * 50 + val('B 100,00') * 100 + val('B 200,00') * 200 + val('B 500,00') * 500 + val('B 1000,00') * 1000;
    const totalEfectivo = totalM + totalB;

    const sumaGastos = [
      'TOTAL CAJA CHICA CON FACTURAS / XML', 'TOTAL CAJA CHICA GASTOS NO DEDUCIBLES',
      'TOTAL VIATICOS CON FACTURAS / XML', 'TOTAL VIATICOS NO DEDUCIBLES',
      'TOTAL CAJA CHICA CON FACTURAS (PENDIENTES)', 'TOTAL VIATICOS CON FACTURAS (PENDIENTES)',
      'TOTAL CAJA CHICA NO DEDUCIBLES (PENDIENTES)', 'TOTAL VIATICOS NO DEDUCIBLES (PENDIENTES)',
    ].reduce((acc, clave) => acc + val(clave), 0);
    // Subtotal de TODO el grupo "Totales de gasto" (los 8 de arriba + Otros + Cheques --
    // usuario, 7-oct: el total de cheques no se sumaba en ningún lado, ahora entra aquí),
    // antes de sumarle Efectivo/Disponible para el Total general. Mismo total final de
    // siempre (Cheques ya no se suma aparte, para no contarlo dos veces).
    const subtotalGastos = sumaGastos + val('OTROS') + val('TOTAL CHEQUES');
    const totalGeneral = totalEfectivo + val('DISPONIBLE CUENTA BANCARIA') + subtotalGastos;

    const montoCajaEl = document.getElementById(prefijo + '-' + slugCampo('MONTO CAJA'));
    const montoCaja = montoCajaEl ? Number(montoCajaEl.dataset.valor) || 0 : 0;
    const diferencia = totalGeneral - montoCaja;

    document.getElementById(prefijo + '-' + slugCampo('TOTAL M')).value = formatearMoneda(totalM);
    document.getElementById(prefijo + '-' + slugCampo('TOTAL B')).value = formatearMoneda(totalB);
    document.getElementById(prefijo + '-' + slugCampo('TOTAL EFECTIVO')).value = formatearMoneda(totalEfectivo);
    document.getElementById(prefijo + '-' + slugCampo('SUBTOTAL TOTALES DE GASTO')).value = formatearMoneda(subtotalGastos);
    document.getElementById(prefijo + '-' + slugCampo('TOTAL GENERAL')).value = formatearMoneda(totalGeneral);
    document.getElementById(prefijo + '-' + slugCampo('DIFERENCIA')).value = formatearMoneda(diferencia);

    let sumaAudit = 0;
    let contestadas = 0;
    (auditItems || []).forEach((item) => {
      const el = document.getElementById(prefijo + '-' + slugCampo(item.clave));
      const seleccion = el ? el.value : '';
      if (seleccion) contestadas++;
      const opcion = (item.opciones || []).find((o) => o.texto === seleccion);
      sumaAudit += opcion ? opcion.puntos : 0;
    });
    const total = (auditItems || []).length || 17;
    const calificacion = Math.round((sumaAudit / 17) * 100) / 100;
    document.getElementById(prefijo + '-' + slugCampo('CALIFICACION_AUDITORIA_FINAL')).value = calificacion + '%';
    actualizarBadgeCalificacionArqueo(prefijo, contestadas, total, calificacion);
  }

  /** Insignia "Calificación" de la cabecera (ver imagen de referencia: Líneas
   * Telefónicas usa el mismo patrón) — mientras no se haya contestado ningún
   * reactivo se ve "—"; ya con al menos uno, muestra el % en vivo. */
  function actualizarBadgeCalificacionArqueo(prefijo, contestadas, total, calificacion) {
    const valor = document.getElementById(prefijo + '-calif-badge-valor');
    const barra = document.getElementById(prefijo + '-calif-badge-barra');
    const nota = document.getElementById(prefijo + '-calif-badge-nota');
    if (!valor || !barra || !nota) return;
    valor.textContent = contestadas ? calificacion + '%' : '—';
    barra.style.width = (total ? (contestadas / total) * 100 : 0) + '%';
    nota.textContent = contestadas + ' de ' + total + ' puntos calificados';
  }


  // ---------- Arqueos ----------
  function idArq(prefijo, clave) { return prefijo + '-' + slugCampo(clave); }

  // Campos que afectan Total M/B/Efectivo/General/Diferencia — se les
  // engancha "input" para recalcular en vivo (los 17 de auditoría van
  // aparte, con "change", porque son <select>).
  const CAMPOS_QUE_AFECTAN_TOTALES_ARQUEO = [
    'M 0,50', 'M 1,00', 'M 2,00', 'M 5,00', 'M 10,00', 'M 20,00',
    'B 20,00', 'B 50,00', 'B 100,00', 'B 200,00', 'B 500,00', 'B 1000,00',
    'DISPONIBLE CUENTA BANCARIA', 'TOTAL CHEQUES',
    'TOTAL CAJA CHICA CON FACTURAS / XML', 'TOTAL CAJA CHICA GASTOS NO DEDUCIBLES',
    'TOTAL VIATICOS CON FACTURAS / XML', 'TOTAL VIATICOS NO DEDUCIBLES',
    'TOTAL CAJA CHICA CON FACTURAS (PENDIENTES)', 'TOTAL VIATICOS CON FACTURAS (PENDIENTES)',
    'TOTAL CAJA CHICA NO DEDUCIBLES (PENDIENTES)', 'TOTAL VIATICOS NO DEDUCIBLES (PENDIENTES)', 'OTROS',
  ];
  /** A nivel de módulo (no solo dentro de initArqueos) porque construirCapturaArqueo
   *  (el arqueo embebido en la ficha de Caja Chica) también lo necesita, con su
   *  propio prefijo. */
  function wireRecalculoArqueo(prefijo, auditItems) {
    CAMPOS_QUE_AFECTAN_TOTALES_ARQUEO.forEach((clave) => {
      const el = document.getElementById(idArq(prefijo, clave));
      if (el) el.addEventListener('input', () => recalcularTotalesArqueo(prefijo, auditItems));
    });
    (auditItems || []).forEach((item) => {
      const el = document.getElementById(idArq(prefijo, item.clave));
      if (el) el.addEventListener('change', () => recalcularTotalesArqueo(prefijo, auditItems));
    });
  }
  function wireVisibilidadCondicionalArqueo(prefijo) {
    CAMPOS_ARQUEO.filter((c) => c.mostrarSiCampo).forEach((campo) => {
      const dependeDe = document.getElementById(idArq(prefijo, campo.mostrarSiCampo));
      if (dependeDe) dependeDe.addEventListener('change', () => actualizarVisibilidadCondicionalArqueo(prefijo));
    });
    actualizarVisibilidadCondicionalArqueo(prefijo);
  }

  /**
   * Arqueo embebido en la ficha de Caja Chica (mismo patrón que prepararCaptura de
   * Inspección Vehicular): arma el formulario COMPLETO de Arqueo dentro de cualquier
   * contenedor, ya con la caja chica fija (sin selector, autollenado de una vez) y
   * llama a alGuardado() en vez de "listo para el siguiente".
   */
  async function construirCapturaArqueo(contenedor, prefijo, caja, alGuardado, idEditar) {
    contenedor.innerHTML = '<p class="empty-state"><span class="spinner"></span> Cargando…</p>';
    let auditItems, completo;
    try {
      const resultados = await Promise.all([
        callServerCacheado('apiListarAuditItems', state.token),
        idEditar ? callServer('apiBuscarArqueoPorId', state.token, idEditar) : Promise.resolve(null),
      ]);
      auditItems = resultados[0] || [];
      completo = resultados[1];
      if (idEditar && !completo) throw new Error('No se encontró el arqueo ' + idEditar);
    } catch (err) {
      contenedor.innerHTML = '<p class="error-msg">No se pudo cargar: ' + escaparHtml(err.message) + '</p>';
      return;
    }
    if (!document.body.contains(contenedor) || !contenedor.offsetParent) return; // se cerró mientras cargaba

    // Insignia "Calificación": vive en la cabecera de verdad del modal
    // (#cch-modal-captura), no aquí adentro -- para que salga arriba del todo,
    // igual que en Registrar/Editar arqueo. Empieza oculta ahí (la comparte con
    // Cambio de monto, que no tiene calificación); se destapa y resetea aquí.
    const badge = document.getElementById(prefijo + '-calif-badge');
    if (badge) {
      badge.hidden = false;
      document.getElementById(prefijo + '-calif-badge-valor').textContent = '—';
      document.getElementById(prefijo + '-calif-badge-barra').style.width = '0%';
      document.getElementById(prefijo + '-calif-badge-nota').textContent = '0 de 17 puntos calificados';
    }

    contenedor.innerHTML =
      '<form id="' + prefijo + '-form" novalidate>' +
      '<div id="' + prefijo + '-campos" class="modal-form-scroll"></div>' +
      '</form><div class="error-msg" id="' + prefijo + '-error" hidden></div>';

    document.getElementById(prefijo + '-campos').innerHTML = renderPasosArqueo(prefijo, prefijo + '-btn-guardar',
      idEditar ? 'Guardar cambios' : 'Registrar arqueo', idEditar ? 'save' : 'clipboard-check');
    wirePasosArqueo(document.getElementById(prefijo + '-campos'));
    refreshIcons();

    contenedor.querySelectorAll('.firma-pad').forEach((canvas) => crearFirmaPad(canvas));
    contenedor.querySelectorAll('.firma-pad-limpiar').forEach((btn) => {
      btn.addEventListener('click', () => {
        const canvas = document.getElementById(btn.dataset.target);
        if (canvas) limpiarFirmaPad(canvas);
      });
    });

    document.getElementById(idArq(prefijo, 'QUIEN REGISTRO')).value = (state.sesion && state.sesion.nombre) || '';
    ['FECHA DEL ULTIMO ARQUEO', 'FECHA INICIO', 'FECHA FIN'].forEach((clave) => {
      const el = document.getElementById(idArq(prefijo, clave));
      if (el) el.value = new Date().toLocaleDateString('es-MX');
    });

    auditItems.forEach((item) => {
      const el = document.getElementById(idArq(prefijo, item.clave));
      if (!el) return;
      el.innerHTML = '<option value="">Selecciona…</option>' +
        item.opciones.map((o) => `<option value="${o.texto}">${o.texto}</option>`).join('');
    });

    // Ya se sabe la caja chica (se abrió desde su ficha) — se autollena de una vez,
    // sin el selector "Caja chica" que sí necesita el módulo de Arqueos por su cuenta.
    document.getElementById(idArq(prefijo, 'RESPONSABLE')).value = caja.RESPONSABLE || '';
    document.getElementById(idArq(prefijo, 'PUESTO')).value = caja.PUESTO || '';
    document.getElementById(idArq(prefijo, 'AREA / DEPARTAMENTO')).value = caja.DEPARTAMENTO || '';
    document.getElementById(idArq(prefijo, 'RAZON SOCIAL')).value = caja.EMPRESA_ORIGEN || '';
    document.getElementById(idArq(prefijo, 'METODO REEMBOLSO')).value = caja.METODO_REEMBOLSO || '';
    const montoEl = document.getElementById(idArq(prefijo, 'MONTO CAJA'));
    if (montoEl) { montoEl.value = formatearMoneda(caja.MONTO_ACTUAL || 0); montoEl.dataset.valor = caja.MONTO_ACTUAL || 0; }

    wireRecalculoArqueo(prefijo, auditItems);
    wireVisibilidadCondicionalArqueo(prefijo);
    if (idEditar && completo) {
      // poblarFormularioArqueo ya llama actualizarBloqueoAuditoria/actualizarVisibilidadCondicionalArqueo
      // con el valor REAL guardado (no el "false" de un formulario recién armado).
      poblarFormularioArqueo(prefijo, completo);
    } else {
      actualizarBloqueoAuditoria(prefijo, false);
    }
    document.getElementById(idArq(prefijo, 'REALIZAR_AUDITORIA')).addEventListener('change', () => {
      actualizarBloqueoAuditoria(prefijo, true);
      recalcularTotalesArqueo(prefijo, auditItems); // refleja de una vez la calificación en 0% si se acaba de bloquear
    });
    recalcularTotalesArqueo(prefijo, auditItems);

    document.getElementById(prefijo + '-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById(prefijo + '-error');
      errorBox.hidden = true;
      const btn = document.getElementById(prefijo + '-btn-guardar');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Subiendo archivos y guardando…';
      toastCargando(idEditar ? 'Guardando cambios…' : 'Registrando…');
      try {
        const archivos = await subirArchivosArqueo(prefijo);
        const firmas = await subirFirmasArqueo(prefijo);
        const datos = Object.assign(recolectarDatosArqueo(prefijo), archivos, firmas);
        if (idEditar) {
          await callServer('apiActualizarArqueo', state.token, idEditar, datos);
        } else {
          datos['ID CCH'] = caja.ID_CCH || caja['ID CCH'];
          await callServer('apiCrearArqueo', state.token, datos);
        }
        invalidarCacheLista('apiListarArqueosResumen', state.token);
        invalidarCacheLista('apiListarCajasChicasResumen', state.token);
        toastExito(idEditar ? 'Actualizado exitosamente' : 'Registrado exitosamente');
        alGuardado();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError((idEditar ? 'No se pudo actualizar: ' : 'No se pudo registrar: ') + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });
  }

  /**
   * Abre FORMATO ARQUEO/EVIDENCIAS: si ya es una URL (arqueos capturados con esta app), directo;
   * si es la ruta vieja de AppSheet ("ARQUEOS/2026/archivo.pdf", arqueos migrados), la resuelve
   * con el servidor antes de abrirla (ArqueosService.resolverArchivo).
   */
  async function abrirArchivoArqueo_(valor) {
    if (!valor) return;
    if (/^https?:/i.test(valor)) { window.open(valor, '_blank', 'noopener'); return; }
    try {
      const url = await callServer('apiUrlArchivoArqueo', state.token, valor);
      window.open(url, '_blank', 'noopener');
    } catch (err) {
      toastError(err.message);
    }
  }

  async function initArqueos() {
    wireTabsSimple(document.getElementById('view-container'));
    // Permisos del módulo (el servidor los vuelve a revisar en cada llamada)
    const puedeEditar = puedeEditarModulo('arqueos');
    if (!puedeEditar) document.querySelector('#arq-tabs .tab-btn[data-tab="registrar"]').remove();
    const modalEditar = document.getElementById('modal-editar-arqueo');
    let arqueosPorId = {};
    let cajasPorId = {};
    let todosLosArqueos = [];
    let auditItems = [];

    document.getElementById('campos-form-arqueo').innerHTML = renderPasosArqueo('arq', 'btn-guardar-arqueo', 'Registrar arqueo', 'wallet');
    document.getElementById('campos-form-editar-arqueo').innerHTML = renderPasosArqueo('editar-arqueo', 'btn-guardar-editar-arqueo', 'Guardar cambios', 'save');
    const pasosArq = wirePasosArqueo(document.getElementById('campos-form-arqueo'));
    const pasosEditarArq = wirePasosArqueo(document.getElementById('campos-form-editar-arqueo'));

    // Recuadros de firma: conecta el dibujo en cada canvas y el botón
    // "Limpiar firma" de cada uno.
    document.querySelectorAll('.firma-pad').forEach((canvas) => crearFirmaPad(canvas));
    document.querySelectorAll('.firma-pad-limpiar').forEach((btn) => {
      btn.addEventListener('click', () => {
        const canvas = document.getElementById(btn.dataset.target);
        if (canvas) limpiarFirmaPad(canvas);
      });
    });

    // Quién registró / fechas: solo vista previa (el servidor las vuelve a
    // fijar siempre) — se ven ya llenas desde que se abre el formulario.
    document.getElementById(idArq('arq', 'QUIEN REGISTRO')).value = (state.sesion && state.sesion.nombre) || '';
    ['FECHA DEL ULTIMO ARQUEO', 'FECHA INICIO', 'FECHA FIN'].forEach((clave) => {
      const el = document.getElementById(idArq('arq', clave));
      if (el) el.value = new Date().toLocaleDateString('es-MX');
    });

    try {
      const [cajas, items] = await Promise.all([
        callServerListaCacheada('apiListarCajasChicasResumen', state.token),
        callServerCacheado('apiListarAuditItems', state.token),
      ]);
      auditItems = items || [];
      (cajas || []).forEach((c) => { cajasPorId[c.ID_CCH] = c; });
      const opcionesCaja = '<option value="">Selecciona…</option>' +
        (cajas || []).map((c) => `<option value="${escaparHtml(c.ID_CCH)}">${escaparHtml(c.ID_CCH)} — ${escaparHtml(c.RESPONSABLE || 'Sin responsable')}</option>`).join('');
      document.getElementById('arq-id-cch').innerHTML = opcionesCaja;

      ['arq', 'editar-arqueo'].forEach((prefijo) => {
        auditItems.forEach((item) => {
          const el = document.getElementById(idArq(prefijo, item.clave));
          if (!el) return;
          el.innerHTML = '<option value="">Selecciona…</option>' +
            item.opciones.map((o) => `<option value="${o.texto}">${o.texto}</option>`).join('');
        });
      });
    } catch (err) {
      console.error('No se pudieron cargar los catálogos de Caja chica / Auditoría:', err);
      const errorBox = document.getElementById('arq-error');
      errorBox.textContent = 'No se pudieron cargar los catálogos: ' + err.message;
      errorBox.hidden = false;
    }

    // wireRecalculoArqueo/wireVisibilidadCondicionalArqueo son de nivel de módulo
    // (construirCapturaArqueo, el arqueo embebido en Caja Chica, también las usa).
    wireRecalculoArqueo('arq', auditItems);
    wireRecalculoArqueo('editar-arqueo', auditItems);
    wireVisibilidadCondicionalArqueo('arq');
    wireVisibilidadCondicionalArqueo('editar-arqueo');

    // ¿Se realiza auditoría? → los 17 reactivos + Observaciones finales:
    // estado inicial (recién armado el formulario, vacío → bloqueados) y
    // wiring del cambio manual del select.
    ['arq', 'editar-arqueo'].forEach((prefijo) => {
      actualizarBloqueoAuditoria(prefijo, false);
      document.getElementById(idArq(prefijo, 'REALIZAR_AUDITORIA')).addEventListener('change', () => {
        actualizarBloqueoAuditoria(prefijo, true);
        recalcularTotalesArqueo(prefijo, auditItems); // refleja de una vez la calificación en 0% si se acaba de bloquear
      });
    });

    // Elegir la caja chica autollena Responsable/Puesto/Área/Razón social/
    // Método de reembolso/Monto caja (soloLectura) y previsualiza el ID
    // Arqueo — igual que el autollenado de folio en Incidencias.
    const selectCajaArqueo = document.getElementById('arq-id-cch');
    const campoIdArqueoPreview = document.getElementById('arq-id-arqueo');
    selectCajaArqueo.addEventListener('change', async () => {
      const caja = cajasPorId[selectCajaArqueo.value];
      const montoEl = document.getElementById(idArq('arq', 'MONTO CAJA'));
      if (!caja) {
        ['RESPONSABLE', 'PUESTO', 'AREA / DEPARTAMENTO', 'RAZON SOCIAL', 'METODO REEMBOLSO'].forEach((clave) => {
          const el = document.getElementById(idArq('arq', clave));
          if (el) el.value = '';
        });
        if (montoEl) { montoEl.value = ''; montoEl.dataset.valor = 0; }
        campoIdArqueoPreview.value = '';
        recalcularTotalesArqueo('arq', auditItems);
        return;
      }
      document.getElementById(idArq('arq', 'RESPONSABLE')).value = caja.RESPONSABLE || '';
      document.getElementById(idArq('arq', 'PUESTO')).value = caja.PUESTO || '';
      document.getElementById(idArq('arq', 'AREA / DEPARTAMENTO')).value = caja.DEPARTAMENTO || '';
      document.getElementById(idArq('arq', 'RAZON SOCIAL')).value = caja.EMPRESA_ORIGEN || '';
      document.getElementById(idArq('arq', 'METODO REEMBOLSO')).value = caja.METODO_REEMBOLSO || '';
      if (montoEl) {
        montoEl.value = formatearMoneda(caja.MONTO_ACTUAL || 0);
        montoEl.dataset.valor = caja.MONTO_ACTUAL || 0;
      }
      recalcularTotalesArqueo('arq', auditItems);
      try {
        campoIdArqueoPreview.value = await callServer('apiPrevisualizarIdArqueo', state.token, selectCajaArqueo.value);
      } catch (err) {
        console.error('No se pudo previsualizar el ID Arqueo:', err);
      }
    });

    function badgeDiferencia(diferencia) {
      const n = Number(diferencia) || 0;
      if (n === 0) return '<span class="badge-estado activo"><i data-lucide="circle-check" class="ico"></i> Cuadra</span>';
      return `<span class="badge-estado ${n > 0 ? 'pendiente' : 'baja'}"><i data-lucide="${n > 0 ? 'clock' : 'ban'}" class="ico"></i> ${formatearMoneda(n)}</span>`;
    }

    // Campos con valor en pesos, para mostrarlos bien en el detalle completo.
    const CAMPOS_MONEDA_DETALLE_ARQUEO = [
      'MONTO CAJA', 'TOTAL M', 'TOTAL B', 'TOTAL EFECTIVO', 'DISPONIBLE CUENTA BANCARIA', 'TOTAL CHEQUES',
      'TOTAL CAJA CHICA CON FACTURAS / XML', 'TOTAL CAJA CHICA GASTOS NO DEDUCIBLES',
      'TOTAL VIATICOS CON FACTURAS / XML', 'TOTAL VIATICOS NO DEDUCIBLES',
      'TOTAL CAJA CHICA CON FACTURAS (PENDIENTES)', 'TOTAL VIATICOS CON FACTURAS (PENDIENTES)',
      'TOTAL CAJA CHICA NO DEDUCIBLES (PENDIENTES)', 'TOTAL VIATICOS NO DEDUCIBLES (PENDIENTES)',
      'OTROS', 'TOTAL GENERAL', 'DIFERENCIA',
    ];
    /** Panel de detalle: el registro completo (79 columnas, no las 9 del
     *  resumen) — las columnas de la tabla van con enDetalle:false para no
     *  repetir esos mismos campos arriba. Mismo patrón que Vehículos. */
    async function mostrarDetalleArqueoEnPanel(resumen, contenedor) {
      contenedor.innerHTML = '<div class="loading-inline"><span class="spinner"></span> Cargando…</div>';
      try {
        const completo = await callServer('apiBuscarArqueoPorId', state.token, resumen.ID);
        if (!completo) {
          contenedor.innerHTML = '<p class="empty-state">No se encontró el registro completo.</p>';
          return;
        }
        contenedor.innerHTML = Object.keys(completo)
          .filter((k) => completo[k] !== '' && completo[k] !== null && completo[k] !== undefined)
          .map((k) => {
            let valor = completo[k];
            if (CAMPOS_MONEDA_DETALLE_ARQUEO.includes(k)) valor = formatearMoneda(valor);
            else if (k === 'CALIFICACION_AUDITORIA_FINAL') valor = valor + '%';
            return itemInfo(tituloDesdeClave(k), valor);
          })
          .join('');
      } catch (err) {
        contenedor.innerHTML = '<p class="error-msg">No se pudo cargar: ' + escaparHtml(err.message) + '</p>';
      }
    }

    const tabla = DataTable.crear(document.getElementById('arq-tabla'), {
      idCampo: 'ID',
      idTabla: 'arqueos',
      ordenInicial: { campo: 'FECHA_INICIO', dir: 'desc' },
      textoVacio: 'Todavía no hay arqueos registrados',
      exportar: {
        nombreArchivo: 'Arqueos',
        titulo: 'Descarga la base completa: todas las filas y columnas de la hoja, sin importar filtros ni búsqueda',
        descargar: async () => ExportarExcel.descargarCrudo({ nombreArchivo: 'Arqueos', filas: JSON.parse(await callServer('apiArqueosCompleto', state.token)) }),
      },
      columnasCompletas: { idHoja: 'ID ARQUEO', cargar: async () => JSON.parse(await callServer('apiArqueosCompleto', state.token)) },
      etiquetaFila: (a) => a.ID,
      alCambiarFiltros: (filtros) => marcarKpiActivo(filtros),
      detalle: {
        titulo: (a) => 'ID Arqueo: ' + (a.ID || ''),
        contenidoExtra: (a, contenedor) => mostrarDetalleArqueoEnPanel(a, contenedor),
      },
      // Selección estilo Google Drive/Apple (rama emmanuel, ver componentes/datatable.html):
      // clic = selecciona, doble clic/tocar = abre el panel de detalle (tabla.abrirDetalle
      // se resuelve en el momento del clic, para entonces `tabla` ya está asignada).
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (a) => tabla.abrirDetalle(String(a.ID)),
      alTocarFila: (a) => tabla.abrirDetalle(String(a.ID)),
      columnas: [
        { campo: 'ID', titulo: 'ID Arqueo', tipo: 'texto', fijada: true, enDetalle: false },
        { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista', render: (v) => badgeEstatusArqueo(v), enDetalle: false },
        { campo: 'ID_CCH', titulo: 'ID CCH', tipo: 'texto', enDetalle: false },
        { campo: 'RESPONSABLE', titulo: 'Responsable', tipo: 'texto', enDetalle: false },
        { campo: 'TIPO_ARQUEO', titulo: 'Tipo', tipo: 'lista', enDetalle: false },
        { campo: 'FECHA_INICIO', titulo: 'Fecha', tipo: 'fecha', enDetalle: false },
        { campo: 'TOTAL_GENERAL', titulo: 'Total general', tipo: 'numero', render: (v) => escaparHtml(formatearMoneda(v)), enDetalle: false },
        { campo: 'DIFERENCIA', titulo: 'Diferencia', tipo: 'numero', render: (v) => badgeDiferencia(v), enDetalle: false },
        { campo: 'CALIFICACION', titulo: 'Calificación', tipo: 'numero', render: (v) => (v === '' ? '—' : escaparHtml(v + '%')), enDetalle: false },
        { campo: 'ESTADO_PDF', titulo: 'Estado PDF', tipo: 'lista', enDetalle: false },
      ],
      accionesFila: [].concat(
        [
          { icono: 'wallet', titulo: 'Ver caja chica', alHacer: (a) => verFichaCajaChicaDesdeOtroModulo(a.ID_CCH) },
          { icono: 'documento', titulo: 'Ver PDF', visible: (a) => !!a.FORMATO_ARQUEO, alHacer: (a) => abrirArchivoArqueo_(a.FORMATO_ARQUEO) },
          { icono: 'imagen', titulo: 'Ver evidencia', visible: (a) => !!a.EVIDENCIAS, alHacer: (a) => abrirArchivoArqueo_(a.EVIDENCIAS) },
        ],
        puedeEditar ? [{ icono: 'pencil', titulo: 'Editar', alHacer: (a) => abrirEditarArqueo(a.ID) }] : []
      ),
      alEliminar: puedeEditar ? async (filas) => {
        await Promise.all(filas.map((f) => callServer('apiEliminarArqueo', state.token, f.ID)));
        // También invalida Caja Chica: CALIFICACION PROMEDIO se calcula a partir de los Arqueos.
        invalidarCacheLista('apiListarArqueosResumen', state.token);
        invalidarCacheLista('apiListarCajasChicasResumen', state.token);
      } : null,
      motivoSinEliminar: 'Tu permiso en este módulo es de solo lectura',
    });

    // Total/Con diferencia/Pendientes son "categorías" clickeables — Calificación
    // promedio es un promedio, no algo que se pueda filtrar como categoría.
    const tileTotalArq = document.getElementById('arq-stat-total').closest('.stat-tile');
    const tileDiferenciasArq = document.getElementById('arq-stat-diferencias').closest('.stat-tile');
    const tilePendientesArq = document.getElementById('arq-stat-pendientes').closest('.stat-tile');
    [tileTotalArq, tileDiferenciasArq, tilePendientesArq].forEach((t) => t.classList.add('stat-tile-clickable'));
    // "Total" limpia los dos filtros de categoría, no solo el de diferencia.
    tileTotalArq.addEventListener('click', () => { tabla.setFiltro('DIFERENCIA', null); tabla.setFiltro('ESTATUS', null); });
    tileDiferenciasArq.addEventListener('click', () => {
      const yaActivo = tileDiferenciasArq.classList.contains('stat-tile-activo');
      tabla.setFiltro('DIFERENCIA', yaActivo ? null : { op: '!=', v1: 0 });
    });
    tilePendientesArq.addEventListener('click', () => {
      const yaActivo = tilePendientesArq.classList.contains('stat-tile-activo');
      tabla.setFiltro('ESTATUS', yaActivo ? null : { valores: ['PENDIENTE'] });
    });
    function marcarKpiActivo(filtros) {
      const f = filtros.DIFERENCIA;
      const e = filtros.ESTATUS;
      tileTotalArq.classList.toggle('stat-tile-activo', !f && !e);
      tileDiferenciasArq.classList.toggle('stat-tile-activo', !!(f && f.op === '!=' && f.v1 === 0));
      tilePendientesArq.classList.toggle('stat-tile-activo', !!(e && e.valores && e.valores.indexOf('PENDIENTE') >= 0));
      actualizarKpis(tabla.getFiltradas());
    }

    function actualizarKpis(filas) {
      document.getElementById('arq-stat-total').textContent = filas.length;
      const calificaciones = filas.map((a) => Number(a.CALIFICACION)).filter((n) => !isNaN(n));
      const promedio = calificaciones.length ? calificaciones.reduce((a, b) => a + b, 0) / calificaciones.length : 0;
      document.getElementById('arq-stat-calificacion').textContent = Math.round(promedio * 100) / 100 + '%';
      document.getElementById('arq-stat-diferencias').textContent =
        filas.filter((a) => (Number(a.DIFERENCIA) || 0) !== 0).length;
      document.getElementById('arq-stat-pendientes').textContent =
        filas.filter((a) => String(a.ESTATUS || '').toUpperCase() === 'PENDIENTE').length;
    }

    async function cargar() {
      tabla.setCargando(true);
      try {
        todosLosArqueos = (await callServerListaCacheada('apiListarArqueosResumen', state.token)) || [];
      } catch (err) {
        tabla.setError('No se pudo cargar el historial: ' + err.message);
        return;
      }

      arqueosPorId = {};
      todosLosArqueos.forEach((a) => { arqueosPorId[a.ID] = a; });

      actualizarKpis(todosLosArqueos);
      tabla.setDatos(todosLosArqueos);
    }
    // Pinta al instante con lo guardado; si del servidor llega algo distinto, se vuelve a pintar (api.html)
    escucharLista('apiListarArqueosResumen', cargar, document.getElementById('view-container').firstElementChild);

    async function abrirEditarArqueo(id) {
      const resumen = arqueosPorId[id];
      if (!resumen) return;
      document.getElementById('editar-arqueo-id').value = id;
      document.getElementById('editar-arqueo-label').textContent = 'ID Arqueo: ' + id;
      document.getElementById('editar-arqueo-id-arqueo').value = id;
      document.getElementById('editar-arqueo-error').hidden = true;
      modalEditar.hidden = false;

      // EL BUG REAL de "se borran campos al editar": el modal se abre y
      // Guardar queda disponible de inmediato, pero el formulario TODAVÍA
      // tiene los valores en blanco de cuando se armó (renderCamposArqueo,
      // al iniciar el módulo) — el registro completo llega después, por
      // este await. Si alguien le da Guardar antes de que termine de
      // cargar, se manda el formulario en blanco y se sobreescribe TODO el
      // registro. Se bloquea Guardar hasta que sí termine de poblarse.
      const btnGuardar = document.getElementById('btn-guardar-editar-arqueo');
      const textoOriginalBtn = btnGuardar.innerHTML;
      btnGuardar.disabled = true;
      btnGuardar.innerHTML = '<span class="spinner"></span> Cargando datos…';
      try {
        const completo = await callServer('apiBuscarArqueoPorId', state.token, id);
        if (completo) {
          const caja = cajasPorId[completo['ID CCH']];
          document.getElementById('editar-arqueo-id-cch').value =
            completo['ID CCH'] + (caja ? ' — ' + caja.RESPONSABLE : '');
          poblarFormularioArqueo('editar-arqueo', completo);
          recalcularTotalesArqueo('editar-arqueo', auditItems);
          btnGuardar.disabled = false;
          btnGuardar.innerHTML = textoOriginalBtn;
        } else {
          const errorBox = document.getElementById('editar-arqueo-error');
          errorBox.textContent = 'No se encontró el registro completo — cierra esta ventana e inténtalo de nuevo.';
          errorBox.hidden = false;
          // Guardar se queda bloqueado a propósito: sin el registro
          // completo, guardar ahorita borraría todo lo demás.
        }
      } catch (err) {
        const errorBox = document.getElementById('editar-arqueo-error');
        errorBox.textContent = 'No se pudo cargar el registro: ' + err.message + ' — cierra esta ventana e inténtalo de nuevo.';
        errorBox.hidden = false;
        // Ídem: Guardar se queda bloqueado, no se reactiva en este caso.
      }
    }
    function cerrarEditarArqueo() {
      modalEditar.hidden = true;
      document.getElementById('form-editar-arqueo').reset();
      document.getElementById('editar-arqueo-error').hidden = true;
      pasosEditarArq.irAPaso(0);
    }
    document.getElementById('btn-cancelar-editar-arqueo').addEventListener('click', cerrarEditarArqueo);
    modalEditar.addEventListener('click', (ev) => { if (ev.target === modalEditar) cerrarEditarArqueo(); });

    document.getElementById('form-editar-arqueo').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('editar-arqueo-error');
      errorBox.hidden = true;
      const btn = document.getElementById('btn-guardar-editar-arqueo');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Subiendo archivos y guardando…';
      toastCargando('Guardando cambios…');
      try {
        const archivos = await subirArchivosArqueo('editar-arqueo');
        const firmas = await subirFirmasArqueo('editar-arqueo');
        const datos = Object.assign(recolectarDatosArqueo('editar-arqueo'), archivos, firmas);
        await callServer('apiActualizarArqueo', state.token, document.getElementById('editar-arqueo-id').value, datos);
        cerrarEditarArqueo();
        invalidarCacheLista('apiListarArqueosResumen', state.token);
        invalidarCacheLista('apiListarCajasChicasResumen', state.token);
        await cargar();
        toastExito('Actualizado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo actualizar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    document.getElementById('form-arqueo').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('arq-error');
      errorBox.hidden = true;
      if (!selectCajaArqueo.value) {
        errorBox.textContent = 'Selecciona la caja chica.';
        errorBox.hidden = false;
        return;
      }
      const btn = document.getElementById('btn-guardar-arqueo');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Subiendo archivos y guardando…';
      toastCargando('Registrando…');
      try {
        const archivos = await subirArchivosArqueo('arq');
        const firmas = await subirFirmasArqueo('arq');
        const datos = Object.assign(recolectarDatosArqueo('arq'), archivos, firmas);
        datos['ID CCH'] = selectCajaArqueo.value;
        await callServer('apiCrearArqueo', state.token, datos);
        ev.target.reset();
        pasosArq.irAPaso(0);
        invalidarCacheLista('apiListarArqueosResumen', state.token);
        invalidarCacheLista('apiListarCajasChicasResumen', state.token);
        document.querySelectorAll('#campos-form-arqueo .firma-pad').forEach((canvas) => limpiarFirmaPad(canvas));
        campoIdArqueoPreview.value = '';
        document.getElementById(idArq('arq', 'QUIEN REGISTRO')).value = (state.sesion && state.sesion.nombre) || '';
        ['FECHA DEL ULTIMO ARQUEO', 'FECHA INICIO', 'FECHA FIN'].forEach((clave) => {
          const el = document.getElementById(idArq('arq', clave));
          if (el) el.value = new Date().toLocaleDateString('es-MX');
        });
        recalcularTotalesArqueo('arq', auditItems);
        await cargar();
        toastExito('Registrado exitosamente');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
        toastError('No se pudo registrar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });

    document.getElementById('btn-calendario-arqueos').addEventListener('click', () => {
      // "\/\/" (no "//") — ver comentario en app.html, botón de reporte de Vehículos.

    });

    await cargar();
  }
