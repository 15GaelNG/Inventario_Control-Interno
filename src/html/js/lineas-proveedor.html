<script>
  /**
   * Módulo «Proveedor» de Líneas (parte 7, plan §7.1; usuario, 7-oct): quien pide los archivos del mes los sube, el
   * navegador los lee y el servidor (LineasProveedor.gs) revisa contra el inventario y carga ADENDUMS, FACTURAS y
   * LINEAS. Etapa 1: adendums de Telcel (.xlsx) y barridos de AT&T (.xls).
   *
   *   LineasProveedor.leer      lectura de cada archivo (sin pantalla; la usan las pruebas)
   */
  const LineasProveedor = (function () {
    'use strict';

    // ---------------- Lectura: un archivo del proveedor → { tipo, cuentas, fecha, lineas } ----------------
    // Reglas de reporte_lineas/scripts (conciliacion.py: carga_adendums y carga_barridos; generar.py: _leer_adendum).

    const txt = (v) => (v === null || v === undefined ? '' : String(v).trim());
    /** Sin el «.0» con que Excel deja los números enteros. */
    const entero = (v) => txt(v).replace(/\.0+$/, '');
    function telefono(v) {
      const d = entero(v).replace(/\D/g, '');
      return d.length >= 10 ? d.slice(-10) : '';
    }
    /** ICCID tal cual, sin la «F» final de AT&T. Vacío si Excel lo dejó en notación científica. */
    function sim(v) {
      const s = txt(v).toUpperCase();
      if (/E\+/.test(s)) return '';
      const d = s.replace(/\D/g, '');
      return d.length >= 18 ? d : '';
    }
    function imei(v) {
      const s = entero(v);
      if (/E\+/i.test(s)) return '';
      const d = s.replace(/\D/g, '');
      return d.length >= 14 ? d : '';
    }
    /** «$ 1,549.00», 1549 o «1549.00» → 1549; vacío → null. */
    function monto(v) {
      if (typeof v === 'number') return v;
      const m = txt(v).replace(/[$\s,]/g, '').match(/^-?\d+(\.\d+)?$/);
      return m ? Number(m[0]) : null;
    }

    /**
     * Fecha del proveedor tal como viene escrita (usuario, 30-sep: sin conversiones de horario; cada formato manda en su
     * archivo): «24/05/2026» → 2026-05-24; «2026-05-25T05:59:59.000+00:00» y «2026-04-08 00:00:00» → su día escrito.
     */
    function fecha(v) {
      const s = txt(v);
      let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
      m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? m[1] + '-' + m[2] + '-' + m[3] : '';
    }
    /** yyyy-mm-dd + n meses (el día se ajusta al último del mes). */
    function masMeses(ymd, n) {
      const [y, m, d] = ymd.split('-').map(Number);
      const total = m - 1 + n;
      const anio = y + Math.floor(total / 12);
      const mes = ((total % 12) + 12) % 12;
      const ultimo = new Date(Date.UTC(anio, mes + 1, 0)).getUTCDate();
      return anio + '-' + ('0' + (mes + 1)).slice(-2) + '-' + ('0' + Math.min(d, ultimo)).slice(-2);
    }
    const diasEntre = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
    /**
     * Fin del contrato o fecha de baja. En una baja, «Fecha Fin de Servicio» es el día de la baja: no cuadra con inicio +
     * plazo. Verificado el 7-oct en los 7 adendums: en el formato viejo son justo las 19 con hora que no es «:59:59», y
     * en el nuevo, las 38 «Pre-desactivado».
     */
    function finOBaja(inicio, fin, plazo) {
      if (!fin || !inicio || !(plazo > 0)) return { fin: fin, baja: '' };
      return Math.abs(diasEntre(masMeses(inicio, plazo), fin)) <= 3 ? { fin: fin, baja: '' } : { fin: '', baja: fin };
    }

    /** Fecha en el nombre: «TAL050620CI1_28_09_2026_387550.xlsx» o «…_2026-09-28…». Vacío si no trae. */
    function fechaDelNombre(nombre) {
      const s = txt(nombre);
      let m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (m) return m[1] + '-' + m[2] + '-' + m[3];
      m = s.match(/(\d{2})_(\d{2})_(\d{4})/);
      if (m) return m[3] + '-' + m[2] + '-' + m[1];
      m = s.match(/descargado (\d{2})-(\d{2})-(\d{4})/i);
      return m ? m[3] + '-' + m[2] + '-' + m[1] : '';
    }

    /** Renglón de encabezados: el primero que trae todas las columnas pedidas (sin acentos ni mayúsculas). */
    const sinAcentos = (s) => txt(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    function encabezados(filas, pedidas) {
      for (let i = 0; i < Math.min(filas.length, 15); i++) {
        const h = (filas[i] || []).map(sinAcentos);
        if (pedidas.every((p) => h.indexOf(p) >= 0)) return { fila: i, col: (nombre) => h.indexOf(sinAcentos(nombre)) };
      }
      return null;
    }

    /**
     * Adendum de Telcel: el «Reporte de Cálculo de Penalización» (hoja report) o el formato corto del portal (Hoja1).
     * Una cuenta padre por renglón; el RFC dice la razón social.
     */
    function adendumTelcel(filas, nombre) {
      const e = encabezados(filas, ['telefono', 'iccid', 'fecha fin de servicio']);
      if (!e) return null;
      const v = (r, c) => (e.col(c) >= 0 ? r[e.col(c)] : null);
      const lineas = [];
      filas.slice(e.fila + 1).forEach((r) => {
        const numero = telefono(v(r, 'Telefono'));
        if (!numero) return;
        const inicio = fecha(v(r, 'Fecha Inicio de Servicio'));
        const plazo = Number(entero(v(r, 'Plazo de Servicio'))) || null;
        const f = finOBaja(inicio, fecha(v(r, 'Fecha Fin de Servicio')), plazo);
        lineas.push({
          numero: numero, cuentaPadre: entero(v(r, 'Cuenta Responsabilidad de Pago')), cuenta: entero(v(r, 'Cuenta')),
          rfc: txt(v(r, 'RFC')).toUpperCase(), estatus: txt(v(r, 'Estatus Suscripcion')), sim: sim(v(r, 'ICCID')), imei: imei(v(r, 'IMEI')),
          plan: txt(v(r, 'Nombre de Oferta Primaria')), renta: monto(v(r, 'Monto de Renta con IVA')), equipo: txt(v(r, 'Equipo')),
          plazo: plazo, inicio: inicio, fin: f.fin, baja: f.baja,
          penalizacion: e.col('Penalizacion por Cancelacion de Servicio') >= 0 ? monto(v(r, 'Penalizacion por Cancelacion de Servicio')) : null,
        });
      });
      return { tipo: 'ADENDUM', compania: 'TELCEL', fecha: fechaDelNombre(nombre), lineas: lineas };
    }

    /** Barrido de AT&T (ReporteEmpresarial .xls): no trae fecha adentro; renta del nombre del plan («…$399_ARR»). */
    function barridoAtt(filas, nombre) {
      const e = encabezados(filas, ['cuenta', 'sim', 'fecha fin plazo']);
      if (!e) return null;
      const h = (filas[e.fila] || []).map(sinAcentos);
      const iNumero = h.findIndex((x) => /^n/.test(x) && x.indexOf('tel') >= 0);
      const v = (r, c) => (e.col(c) >= 0 ? r[e.col(c)] : null);
      const lineas = [];
      filas.slice(e.fila + 1).forEach((r) => {
        const numero = telefono(r[iNumero]);
        if (!numero) return;
        const plan = txt(v(r, 'Plan Tarifario'));
        const precio = plan.match(/\$\s?(\d+(?:\.\d+)?)/);
        lineas.push({
          numero: numero, cuentaPadre: entero(v(r, 'Cuenta')), cuenta: '', rfc: '', estatus: txt(v(r, 'Estatus')),
          sim: sim(v(r, 'SIM')), imei: imei(v(r, 'IMEI')), plan: plan, renta: precio ? Number(precio[1]) : null,
          equipo: txt(v(r, 'Modelo del equipo')), plazo: Number(entero(v(r, 'Plazo'))) || null,
          inicio: fecha(v(r, 'Fecha inicio plazo')), fin: fecha(v(r, 'Fecha fin plazo')), baja: '', penalizacion: null,
        });
      });
      return { tipo: 'BARRIDO', compania: 'AT&T', fecha: fechaDelNombre(nombre), lineas: lineas };
    }

    /** Cualquier Excel del proveedor: { nombre, hojas: [{ nombre, filas }] } → el primero que se reconoce, o null. */
    function excel(nombre, hojas) {
      for (const h of hojas || []) {
        const r = adendumTelcel(h.filas, nombre) || barridoAtt(h.filas, nombre);
        if (r && r.lineas.length) return Object.assign(r, { archivo: nombre, hoja: h.nombre });
      }
      return null;
    }

    const leer = { excel, adendumTelcel, barridoAtt, fecha, finOBaja, fechaDelNombre, telefono, sim, imei, monto };

    return { leer };
  })();
</script>
