          (extra || '') + (!mas ? '' : '<button type="button" class="ln-btn-icono ln-btn-mas" data-ln-ficha-mas="' + esc(tipo) + '" data-id="' + esc(id) + '" title="Más opciones" aria-label="Más opciones">' + icono('ellipsis-vertical') + '</button>');
      }

      /** ⋮ de la ficha: lo que no está a la vista, según sea equipo o línea (con los datos del índice). */
      function abrirMenuFicha(boton) {
        const tipo = boton.dataset.lnFichaMas;
        const id = boton.dataset.id;
        const ix = memoria.indice || { equipos: [], lineas: [] };
        const r = (tipo === 'equipo' ? ix.equipos : ix.lineas).filter((x) => x.id === id)[0] || { id: id };
        const operar = !!(memoria.permisos && memoria.permisos.puedeOperar);
        const comunes = [
          { icono: 'pencil', texto: 'Editar información', alHacer: () => abrirEditor(id) },
        ];
        // La carpeta de Drive va sola, separada de inspección y responsiva (usuario, 30-sep)
        const carpeta = fichaActual && fichaActual.id === id ? fichaActual.carpetaDriveId : null;
        const drive = carpeta ? [{ icono: 'folder-open', texto: 'Ver carpeta en Drive', separador: true,
          alHacer: () => window.open('https:\/\/drive.google.com/drive/folders/' + encodeURIComponent(carpeta), '_blank', 'noopener') }] : [];
        const documentos = [
          tieneNuco(r) ? { icono: 'file-search', texto: 'Ver última inspección', alHacer: () => abrirUltimoDesdeMenu('INSPECCION', id) } : null,
          tieneNuco(r) ? { icono: 'file-text', texto: 'Ver última responsiva', alHacer: () => abrirUltimoDesdeMenu('RESPONSIVA', id) } : null,
        ].filter(Boolean);
        if (documentos.length) documentos[0].titulo = 'Documentos';
        const items = tipo === 'equipo' ? (operar ? comunes.concat([
          { icono: 'archive', texto: 'Mandar a resguardo', separador: true, alHacer: () => abrirResguardo([r]) },
          { icono: 'user-round-pen', texto: 'Reasignar', alHacer: () => abrirReasignar(r) },
        ]) : []).concat(drive, documentos, [
          r.lineaId ? { icono: 'card-sim', texto: 'Ir a la línea', separador: true, alHacer: () => abrir('linea', r.lineaId) } : null,
          { icono: 'history', texto: 'Historial', separador: !r.lineaId, alHacer: () => mostrarPestanaFicha('historial') },
        ]) : comunes.concat([
          r.numero ? { icono: 'phone-off', texto: 'Mandar a cancelación', separador: true, alHacer: () => abrirCancelacion([r]) } : null,
          r.equipoId ? { icono: 'smartphone', texto: 'Ir al equipo', separador: true, alHacer: () => abrir('equipo', r.equipoId) } : null,
          { icono: 'history', texto: 'Historial', separador: !r.equipoId, alHacer: () => mostrarPestanaFicha('historial') },
        ]);
        menuFlotante(boton, items.filter(Boolean));
      }

      // ---- Detalles: la columna DETALLES LINEAS TELEFONICAS del AppSheet, con botón para copiarla ----
      // Mismo texto y orden que copiaban del módulo "Detalles Líneas Telefónicas". AppSheet deja en blanco
      // motivo, ticket y estatus actual para llenarlos al pegar; aquí se escriben antes de copiar (no se guardan)
      // y el estatus actual se propone con ESTATUS LINEA.
      function textoDetalles() {
        const d = detallesFicha || {};
        const caja = $('[data-ln-copiar]', raiz);
        const escrito = (campo) => (caja ? caja.querySelector('[data-ln-copiar-campo="' + campo + '"]').value.trim() : '');
        const valor = (v) => (v === null || v === undefined ? '' : (esFechaIso(v) ? fechaTabla(v) : String(v)));
        return 'NUCO ' + valor(d.nuco) + '\n-------------------------------------------------------\n' +
          'Motivo de resguardo: ' + escrito('motivo') + '\n' +
          'Ticket / Asunto: ' + escrito('ticket') + '\n' +
          'Código de resguardo: ' + valor(d.responsable) + '\n' +
          'IMEI: ' + valor(d.imei) + '\n' +
          'SIM: ' + valor(d.sim) + '\n' +
          'Número: ' + valor(d.numero) + '\n' +
          'Modelo: ' + valor(d.modelo) + '\n' +
          'Compañía: ' + valor(d.compania) + '\n' +
          'Razón Social: ' + valor(d.razonSocial) + '\n' +
          'Estatus de adendum: ' + valor(d.finPlan) + '\n' +
          'Estatus actual de la línea: ' + escrito('estatus');
      }
      function pintarTextoDetalles() {
        const pre = $('[data-ln-copiar-texto]', raiz);
        if (pre) pre.textContent = textoDetalles();
      }
      function tarjetaDetallesCopiar(d) {
        detallesFicha = d || null;
        if (!d) return '';
        const valor = (v) => (v === null || v === undefined ? '' : (esFechaIso(v) ? fechaTabla(v) : String(v)));
        const entrada = (clave, v, ayuda) => '<input type="text" class="ln-detalle-entrada" data-ln-copiar-campo="' + clave + '" value="' + esc(v || '') + '" autocomplete="off" placeholder="' + esc(ayuda) + '">';
        // Mismo diseño que General (etiqueta · valor); al copiar sale el texto del AppSheet (textoDetalles)
        return '<div class="card ln-card ln-copiar" data-ln-copiar data-respetar-texto>' +
          '<div class="ln-copiar-cabecera"><h3>' + icono('clipboard-list') + ' Detalles</h3>' +
          '<button type="button" class="ln-btn-icono" data-ln-copiar-detalles>' + icono('copy') + ' Copiar detalles</button></div>' +
          campos([
            ['NUCO', valor(d.nuco)],
            ['Motivo de resguardo', entrada('motivo', '', 'Escribe el motivo'), true],
            ['Ticket / Asunto', entrada('ticket', '', 'Escribe el ticket o asunto'), true],
            ['Código de resguardo', valor(d.responsable)],
            ['IMEI', valor(d.imei)],
            ['SIM', valor(d.sim)],
            ['Número', valor(d.numero)],
            ['Modelo', valor(d.modelo)],
            ['Compañía', valor(d.compania)],
            ['Razón Social', valor(d.razonSocial)],
            ['Estatus de adendum', valor(d.finPlan)],
            ['Estatus actual de la línea', entrada('estatus', d.estatusLinea, 'Escribe el estatus'), true],
          ]) + '</div>';
      }
      function copiarDetalles(boton) {
        copiarTexto(textoDetalles()).then((ok) => {
          if (!ok) { aviso(icono('triangle-alert', 'ln-alerta') + ' El navegador no permitió copiar. Selecciona el texto y cópialo con Ctrl+C.', 8000); return; }
          aviso('Detalles copiados: pégalos en el ticket o correo.', 4000);
          const original = boton.innerHTML;
          boton.innerHTML = icono('check') + ' Copiado';
          setTimeout(() => { if (document.body.contains(boton)) boton.innerHTML = original; }, 1800);
        });
      }

      function cargarEvidencias(id) {
        const pila0 = pila.length;
        llamar('apiLineasEvidencias', id).then((ev) => {
          const cont = $('#ln-evidencias', raiz);
          if (!vigente() || !cont || pila.length !== pila0) return;
          pintarDocumentos(cont, ev.inspecciones || [], ev.responsivas || [], id);
        }).catch((e) => {
          const cont = $('#ln-evidencias', raiz);
          if (cont) cont.innerHTML = tarjeta(icono('clipboard-check') + ' Inspecciones y responsivas', '<p class="error-msg">' + mensajeError(e) + '</p>');
        });
      }

      /** PDF que el sistema no alcanzó a generar al guardar una inspección o responsiva. */
      function generarPdfPendiente(tipo, idDoc, carpetaId) {
        captura = { guardada: true, firmas: {}, carpetaId: carpetaId || '' };
        mostrarModalCaptura();
        $('#ln-captura-titulo', raiz).textContent = 'Generar PDF pendiente';
        refrescarDespuesDeCaptura(pila[pila.length - 1].id, tipo, idDoc);
      }

      /**
       * Regenerar PDF (usuario, 5-oct): la responsiva se vuelve a hacer con la plantilla y lo que ya está guardado, sin
       * llenar el formulario; queda como versión nueva del mismo PDF (LineasCaptura.generarPdf con forzar).
       */
      function regenerarPdf(d) {
        captura = { guardada: true, firmas: {}, carpetaId: d.carpetaId || '' };
        mostrarModalCaptura();
        $('#ln-captura-icono', raiz).innerHTML = icono('signature');
        $('#ln-captura-tipo', raiz).textContent = 'Responsiva de entrega';
        $('#ln-captura-titulo', raiz).textContent = 'Regenerar PDF';
        $('#ln-captura-subtitulo', raiz).textContent = [fecha(d.fecha), d.responsable].filter(Boolean).join(' · ');
        $('#ln-captura-cuerpo', raiz).innerHTML = '';
        refrescarDespuesDeCaptura(pila[pila.length - 1].id, d.tipoPdf, d.id, true);
      }

      /**
       * Las firmas de la captura ya no están (el servidor las guarda 6 h; no se guardan como archivos, acuerdo del
       * 18-sep): se vuelven a firmar aquí y se genera el PDF. Control Interno es obligatoria; el patrón lo dibuja el servidor.
       */
      function pedirFirmasPdf(sesion, tipo, nombres, continuar) {
        const esInspeccion = tipo === 'INSPECCION';
        const fondo = esInspeccion ? '#ddebf7' : '#ffffff';
        ocultarEspera();
        $('#ln-captura-cuerpo', raiz).innerHTML =
          '<div class="ln-nota">' + icono('info', 'ln-icon-sm') + ' Las firmas de la captura ya no están disponibles.</div>' +
          '<div class="ln-firmas">' + htmlFirma('responsable', 'pdf-firma-responsable') + htmlFirma('ci', 'pdf-firma-ci') + '</div>' +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div>' +
          '<div class="ln-captura-acciones"><button type="button" class="secondary" data-cerrar-modal>Cancelar</button>' +
          '<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('circle-check') + ' Generar PDF</button></div>';
        const responsable = crearFirma(document.getElementById('pdf-firma-responsable'), nombres.responsable);
        const ci = crearFirma(document.getElementById('pdf-firma-ci'), esInspeccion ? nombres.inspector : nombres.ci);
        $('#cap-guardar', raiz).addEventListener('click', () => {
          if (ci.estaVacia()) { mostrarErrorCaptura('Falta la firma de Control Interno.'); return; }
          $('#cap-error', raiz).hidden = true;
          mostrarEspera('Generando tu PDF');
          Promise.all([responsable.estaVacia() ? null : responsable.base64(fondo), ci.base64(fondo)]).then(([r, c]) => {
            sesion.pdfFirmas = esInspeccion ? { inspector: c, responsable: r, patron: null } : { ci: c, responsable: r, patron: null };
            continuar();
          });
        });
      }

      /**
       * PDF firmado (usuario, 5-oct): la inspección o la responsiva se guardó sin la firma del responsable; ya firmada se
       * sube aquí y reemplaza su PDF (el mismo archivo de Drive, LineasCaptura.subirPdfFirmado). Solo PDF.
       */
      function subirPdfFirmado(registroId, d) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/pdf,.pdf';
        input.addEventListener('change', () => {
          const f = input.files && input.files[0];
          if (!f) return;
          if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) { aviso(icono('triangle-alert', 'ln-alerta') + ' Solo se aceptan archivos PDF.', 6000); return; }
          if (f.size > 15 * 1024 * 1024) { aviso(icono('triangle-alert', 'ln-alerta') + ' El archivo supera 15 MB.', 6000); return; }
          const sesion = captura = { guardada: true, guardando: true, firmas: {}, carpetaId: '' };
          mostrarModalCaptura();
          $('#ln-captura-titulo', raiz).textContent = 'PDF firmado';
          $('#ln-captura-subtitulo', raiz).textContent = [d.documento, fecha(d.fecha), d.responsable].filter(Boolean).join(' · ');
          $('#ln-captura-cuerpo', raiz).innerHTML = '';
          const modal = $('#ln-modal-captura', raiz);
          modal.setAttribute('aria-busy', 'true');
          modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = true; });
          mostrarEspera('Subiendo PDF firmado');
          new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(String(r.result).split(',')[1]);
            r.onerror = () => reject(new Error('No se pudo leer ' + f.name));
            r.readAsDataURL(f);
          }).then((base64) => llamar('apiLineasSubirPdfFirmado', registroId, d.tipoPdf, d.id, d.pdfId || '', base64)).then((pdf) => {
            if (!vigente() || captura !== sesion) return;
            mostrarEspera('PDF firmado guardado', { tono: 'listo', icono: 'circle-check', texto: '',
              acciones: enlaceDrive(pdf.id, 'Ver PDF', true) + '<button type="button" class="secondary" data-cerrar-modal>Cerrar</button>' });
            cargarEvidencias(registroId);
            cargarHistorial(registroId);
          }).catch((e) => {
            if (!vigente() || captura !== sesion) return;
            mostrarEspera('No se pudo subir el PDF', { tono: 'error', icono: 'file-warning', texto: '', detalle: mensajeError(e),
              acciones: '<button type="button" class="secondary" data-cerrar-modal>Cerrar</button>' });
          }).finally(() => {
            sesion.guardando = false;
            modal.removeAttribute('aria-busy');
            modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = false; });
          });
        });
        input.click();
      }

      function soltarDocumentos() {
        if (tablaDocumentos) tablaDocumentos.destruir();
        tablaDocumentos = null;
      }

      const ORIGEN_DOCUMENTO = { APPSHEET: 'AppSheet', SISTEMA: 'Sistema nuevo', DRIVE: 'Carpeta NUCOS' };
      const COLOR_ORIGEN_DOCUMENTO = { AppSheet: 'azul', 'Sistema nuevo': 'verde', 'Carpeta NUCOS': 'neutro' };

      /**
       * Documentos de la ficha, con el mismo diseño que Historial: indicadores (cuántas hay y la más reciente) y una
       * sola tabla de inspecciones y responsivas, de la hoja (AppSheet o sistema nuevo) y de la carpeta NUCOS.
       * Cada fila tiene sus acciones: ver la inspección, abrir el PDF o la carpeta.
       */
      function pintarDocumentos(cont, inspecciones, responsivas, id) {
        const filas = inspecciones.map((d) => Object.assign({}, d, { documento: 'Inspección', tipoPdf: 'INSPECCION' }))
          .concat(responsivas.map((d) => Object.assign({}, d, { documento: 'Responsiva', tipoPdf: 'RESPONSIVA' })))
          .map((d, n) => Object.assign(d, { _clave: 'doc' + n, origenTexto: ORIGEN_DOCUMENTO[d.origen] || d.origen || '' }));
        contarEnPestana('documentos', filas.length);
        // El servidor las manda de la más reciente a la más antigua
        const ultimaInsp = inspecciones[0];
        const ultimaResp = responsivas[0];
        cont.innerHTML = '<div class="stat-row ln-docs-kpis"></div>' +
          '<div class="card ln-card ln-historial">' +
          '<div class="ln-historial-cabecera"><h3>' + icono('folder-check') + ' Inspecciones y responsivas (' + miles(filas.length) + ')</h3></div>' +
          '<p class="ln-tenue ln-docs-ayuda">Las registradas en AppSheet o en el sistema nuevo y las guardadas en la carpeta NUCOS de Drive. ' +
          'Selecciona una fila: en la barra (o con clic derecho) ves la inspección, abres el PDF o la carpeta.</p>' +
          (filas.length ? '<div class="ln-docs-tabla"></div>' : '<p class="empty-state">Este registro no tiene inspecciones ni responsivas.</p>') + '</div>';
        const conFecha = (d) => (d ? fecha(d.fecha) || 'Sin fecha' : 'Ninguna');
        const marcar = tilesKpi($('.ln-docs-kpis', cont), [
          { icono: 'clipboard-check', valor: miles(inspecciones.length), etiqueta: 'Inspecciones', titulo: 'Mostrar solo inspecciones',
            filtros: { documento: { valores: ['Inspección'] } }, calcular: (f) => miles(f.filter((d) => d.documento === 'Inspección').length) },
          { icono: 'calendar-check', valor: conFecha(ultimaInsp), etiqueta: 'Última inspección', filtros: false },
          { icono: 'signature', valor: miles(responsivas.length), etiqueta: 'Responsivas', titulo: 'Mostrar solo responsivas',
            filtros: { documento: { valores: ['Responsiva'] } }, calcular: (f) => miles(f.filter((d) => d.documento === 'Responsiva').length) },
          { icono: 'calendar-check', valor: conFecha(ultimaResp), etiqueta: 'Última responsiva', filtros: false },
        ], () => tablaDocumentos);
        if (!filas.length) return;
        soltarDocumentos();
        const operar = !!(memoria.permisos && memoria.permisos.puedeOperar);
        const tabla = tablaDocumentos = tablaLineas($('.ln-docs-tabla', cont), {
          idCampo: '_clave',
          idTabla: 'lineas-documentos-v1',
          exportar: false,
          tamanoPagina: 25,
          // Seleccionable (30-sep): sus botones (ver inspección, PDF, carpeta) van en la barra y el clic derecho.
          // Una fila a la vez: no hay acciones masivas
          seleccionUnica: true,
          ordenInicial: { campo: 'fecha', dir: 'desc' },
          textoVacio: 'Sin documentos con esos filtros',
          etiquetaFila: (d) => d.documento + ' · ' + (fecha(d.fecha) || 'Sin fecha'),
          detalle: false,
          alCambiarFiltros: marcar,
          accionesFila: [
            { icono: 'eye', titulo: 'Ver inspección', visible: (d) => d.documento === 'Inspección', alHacer: (d) => abrir('inspeccion', d.id) },
            { icono: 'file-text', titulo: 'Ver PDF', visible: (d) => !!d.pdfId,
              alHacer: (d) => window.open('https:\/\/drive.google.com/file/d/' + encodeURIComponent(d.pdfId) + '/view', '_blank', 'noopener') },
            { icono: 'folder-open', titulo: 'Ver carpeta en Drive', visible: (d) => !!d.carpetaId,
              alHacer: (d) => window.open('https:\/\/drive.google.com/drive/folders/' + encodeURIComponent(d.carpetaId), '_blank', 'noopener') },
            { icono: 'file-plus', titulo: 'Generar PDF', visible: (d) => !!d.pdfPendiente, alHacer: (d) => generarPdfPendiente(d.tipoPdf, d.id, d.carpetaId) },
            // Del sistema, con su PDF ya generado; del AppSheet y de NUCOS siempre (usuario, 5-oct)
            { icono: 'file-up', titulo: 'Subir PDF firmado', visible: (d) => operar && (!!d.pdfId || d.origen !== 'SISTEMA'), alHacer: (d) => subirPdfFirmado(id, d) },
            { icono: 'refresh-ccw', titulo: 'Regenerar PDF', visible: (d) => operar && d.tipoPdf === 'RESPONSIVA' && d.origen === 'SISTEMA' && !!d.pdfId,
              alHacer: (d) => regenerarPdf(d) },
          ],
          ayuda: 'Inspecciones y responsivas del registro. Doble clic en una fila abre la inspección, o el PDF de la responsiva. ' +
            'Los indicadores de arriba filtran por tipo; la flecha de cada columna filtra u ordena. ' +
            'Origen: AppSheet y Sistema nuevo son registros de la hoja; Carpeta NUCOS son los que solo están en Drive.',
          columnas: [
            { campo: 'fecha', titulo: 'Fecha', tipo: 'lnFechaHora', fijada: true, ancho: 130, render: (v) => esc(fecha(v) || 'Sin fecha') },
            { campo: 'documento', titulo: 'Documento', tipo: 'lista', ancho: 150,
              render: (v) => '<span class="ln-movimiento">' + ico(v === 'Inspección' ? 'clipboard-check' : 'signature') + ' ' + esc(v) + '</span>' },
            { campo: 'origenTexto', titulo: 'Origen', tipo: 'lista', ancho: 150, render: (v) => chip(v, COLOR_ORIGEN_DOCUMENTO[v] || 'neutro') },
            { campo: 'responsable', titulo: 'Responsable', tipo: 'texto', ancho: 230 },
            { campo: 'inspector', titulo: 'Realizó', tipo: 'texto', ancho: 210 },
            { campo: 'calificacion', titulo: 'Calificación', tipo: 'numero', ancho: 120, render: (v) => (v === null || v === undefined ? vacio : esc(porcentaje(v))) },
            { campo: 'fotos', titulo: 'Fotos', tipo: 'numero', ancho: 90, render: (v) => (v ? miles(v) : vacio) },
          ],
        });
        tabla.setDatos(filas);
        // Doble clic en la fila: la inspección; en una responsiva, su PDF (o su carpeta si no tiene PDF)
        const porClave = {};
        filas.forEach((d) => { porClave[d._clave] = d; });
        $('.ln-docs-tabla', cont).addEventListener('dblclick', (ev) => {
          const tr = ev.target.closest('tbody tr[data-id]');
          const d = tr && !ev.target.closest('button, input, a') ? porClave[tr.dataset.id] : null;
          if (!d) return;
          if (d.documento === 'Inspección') abrir('inspeccion', d.id);
          else if (d.pdfId) window.open('https:\/\/drive.google.com/file/d/' + encodeURIComponent(d.pdfId) + '/view', '_blank', 'noopener');
          else if (d.carpetaId) window.open('https:\/\/drive.google.com/drive/folders/' + encodeURIComponent(d.carpetaId), '_blank', 'noopener');
        });
      }

      /**
       * Reasignar (usuario, 4-oct): abre directo la responsiva, sin formulario intermedio. Equipo y línea van fijos; se
       * elige a la persona nueva y su comentario es el de la acción.
       * La inspección también es obligatoria (usuario, 5-oct), en este orden: 1) la responsiva se llena y se revisa (aún
       * no se guarda), 2) la inspección se captura y se guarda, 3) se reasigna con las dos (el servidor exige la
       * inspección) y se genera el PDF de la responsiva. Cerrar cualquiera sin guardar no reasigna; si la reasignación
       * falla, la inspección del día ya no se vuelve a pedir.
       */
      async function abrirReasignar(fila) {
        if (!fila) return;
        const nombre = 'NUCO ' + (fila.nuco || '—');
        const subtitulo = [nombre, fila.modelo, fila.responsable].filter(Boolean).join(' · ');
        const resp = await capturarEnFlujo('RESPONSIVA', { equipoId: fila.id, modo: 'REASIGNAR' }, {
          titulo: 'Reasignar', subtitulo: subtitulo, boton: 'Seguir a la inspección', espera: 'Revisando la responsiva', sinPdf: true,
          // Lo mismo que rechaza el servidor (LineasAcciones.reasignar), antes de pasar a la inspección
          guardar: (datos) => {
            const v = datos.valores || {};
            if (String(v.COMENTARIO || '').trim().length <= 3) return Promise.reject(new Error('Escribe el comentario (queda en el historial).'));
            const nuevo = String(v.RESPONSABLE || '').trim().toUpperCase();
            if (nuevo && nuevo === String(fila.responsable || '').trim().toUpperCase()) {
              return Promise.reject(new Error(nombre + ' ya lo tiene ' + fila.responsable + ': elige a la persona nueva.'));
            }
            return Promise.resolve({ datos: datos });
          },
        });
        if (!resp) return;
        let inspeccionId = inspeccionHecha(fila.id);
        if (!inspeccionId) {
          const r = await capturarEnFlujo('INSPECCION', { equipoId: fila.id }, { aviso: 'Inspección · ' + nombre, boton: 'Guardar inspección y reasignar' });
          if (!r) return;
          inspeccionesDelDia[fila.id] = { id: r.id, dia: hoyLocal() };
          inspeccionId = r.id;
        }
        const d = resp.datos;
        const sesion = captura = { guardada: true, guardando: true, firmas: {}, carpetaId: '',
          pdfFirmas: { responsable: d.firmaResponsableBase64 || null, ci: d.firmaCiBase64, patron: d.patronBase64 || null } };
        mostrarModalCaptura();
        $('#ln-captura-icono', raiz).innerHTML = icono('user-round-pen');
        $('#ln-captura-tipo', raiz).textContent = 'Responsiva de entrega';
        $('#ln-captura-titulo', raiz).textContent = 'Reasignar';
        $('#ln-captura-subtitulo', raiz).textContent = subtitulo;
        $('#ln-captura-cuerpo', raiz).innerHTML = '';
        const modal = $('#ln-modal-captura', raiz);
        modal.setAttribute('aria-busy', 'true');
        modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = true; });
        mostrarEspera('Reasignando');
        llamar('apiLineasReasignar', Object.assign({}, d, { inspeccionId: inspeccionId })).then((r) => {
          if (!vigente() || captura !== sesion) return;
          refrescarDespuesDeCaptura(fila.id, 'RESPONSIVA', r.id);
          aplicarCambiosIndice(r.filas).then(() => {
            Object.keys(tablas).forEach((m) => { if (tablas[m]) tablas[m].limpiarSeleccion(); });
            if (vigente()) { pintarIndicadores(); pintarListado(); }
            // La ficha abierta se vuelve a pintar con la persona y los estatus nuevos (como Mandar a resguardo, 4-oct)
            const actual = pila[pila.length - 1];
            if (vigente() && actual && actual.id === fila.id) abrir(actual.tipo, actual.id, true);
          }).catch(() => {});
        }).catch((e) => {
          if (!vigente() || captura !== sesion) return;
          sesion.guardando = false;
          modal.removeAttribute('aria-busy');
          modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = false; });
          mostrarEspera('No se pudo reasignar', { tono: 'error', icono: 'triangle-alert', texto: 'La inspección sí quedó guardada.', detalle: mensajeError(e),
            acciones: '<button type="button" class="secondary" data-cerrar-modal>Cerrar</button>' });
        });
      }

      /**
       * Inspección capturada dentro de una acción (mandar a resguardo, reasignar). Si
       * la acción no se completó, al reintentarla el mismo día no se vuelve a pedir: se guarda aquí por registro.
       */
      const inspeccionesDelDia = {};
      const hoyLocal = () => new Date().toDateString();
      const inspeccionHecha = (id) => (inspeccionesDelDia[id] && inspeccionesDelDia[id].dia === hoyLocal() ? inspeccionesDelDia[id].id : null);

      /**
       * Pide en orden la inspección de cada equipo que todavía no la tiene. Regresa { idRegistro: idInspeccion } o null
       * si se cerró alguna sin guardar (la acción no sigue).
       */
      async function inspeccionesEnFlujo(equipos, para) {
        const ids = {};
        for (let i = 0; i < equipos.length; i++) {
          const q = equipos[i];
          const hecha = inspeccionHecha(q.id);
          if (hecha) { ids[q.id] = hecha; continue; }
          // enAccion = dentro de Mandar a resguardo: el comentario ya lo pidió la acción y el responsable es quien recibe
          // (las personas de procesos, usuario 4-oct)
          const r = await capturarEnFlujo('INSPECCION', { equipoId: q.id, enAccion: true }, {
            aviso: 'Inspección · NUCO ' + (q.nuco || '—') + (equipos.length > 1 ? ' · ' + (i + 1) + ' de ' + equipos.length : ''),
            boton: i + 1 < equipos.length ? 'Guardar inspección y seguir' : 'Guardar inspección y terminar',
          });
          if (!r) return null;
          inspeccionesDelDia[q.id] = { id: r.id, dia: hoyLocal() };
          ids[q.id] = r.id;
        }
        return ids;
      }

      /**
       * Acción masiva sobre los equipos seleccionados (2 o más): el servidor arma el formulario
       * (apiLineasFormularioMasivo) y aplica el cambio equipo por equipo con su bitácora (apiLineasAccionMasiva).
       * Reasignar deja el equipo en USO; su línea solo cambia si estaba DISPONIBLE (pasa a USO con él).
       */
      async function abrirMasiva(accion, filas) {
        const permisos = await cargarPermisos().catch(() => null);
        if (!permisos || !permisos.puedeOperar) { aviso(icono('triangle-alert', 'ln-alerta') + ' Tu rol no permite modificar equipos.', 6000); return; }
        const ids = filas.map((r) => r.id);
        // Entregar una línea suelta usa el mismo formulario: solo cambian los textos (línea en vez de equipo)
        const esLinea = accion.parte === 'linea';
        const unidad = esLinea ? 'líneas' : 'equipos';
        const nombreDe = (r) => (esLinea ? 'Línea ' + (r.numero || '—') : 'NUCO ' + (r.nuco || '—'));
        const etiqueta = (r) => nombreDe(r) + ' · ' + (esLinea ? (r.compania || 'Sin compañía') : (r.modelo || 'Sin modelo')) + ' · ' + (r.responsable || 'Sin responsable') + ' · ' + (r.estatus || 'Sin estatus');
        mostrarModalCaptura();
        $('#ln-captura-icono', raiz).innerHTML = icono(accion.icono);
        $('#ln-captura-tipo', raiz).textContent = 'ACCIÓN MASIVA';
        $('#ln-captura-titulo', raiz).textContent = accion.texto;
        $('#ln-captura-subtitulo', raiz).textContent = miles(filas.length) + ' ' + unidad + ' seleccionados · cada cambio queda en su historial';
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        cuerpo.innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        const sesion = captura = { tipo: 'MASIVA', firmas: {} };
        let form;
        try {
          form = await llamar('apiLineasFormularioMasivo', accion.clave);
        } catch (e) {
          if (captura === sesion) cuerpo.innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>';
          return;
        }
        if (captura !== sesion) return;
        const elementos = form.elementos;
        captura.contexto = { formulario: elementos };
        const excede = filas.length > form.maximo;

        // Reasignar "uno por uno": por cada equipo, sus datos de responsable (precargados con los actuales para
        // editarlos rápido). Las columnas llevan prefijo "FILA|<id>|" para que cada campo sea único.
        const colsResp = form.columnasResponsable || [];
        const esReasignar = colsResp.length > 0;
        const columnaFila = (id, c) => 'FILA|' + id + '|' + c;
        const actualDe = (r) => ({ 'NO EMPLEADO': r['NO EMPLEADO'], RESPONSABLE: r.RESPONSABLE || r.responsable, PUESTO: r.PUESTO, DEPARTAMENTO: r.DEPARTAMENTO || r.departamento });
        const elementosFila = {};
        if (esReasignar) {
          filas.forEach((r) => {
            const actual = actualDe(r);
            elementosFila[r.id] = colsResp.map((c) => {
              const base = elementos.filter((e) => e.columna === c)[0];
              const autollenar = base.autollenar ? Object.fromEntries(Object.entries(base.autollenar).map(([k, v]) => [columnaFila(r.id, k), v])) : undefined;
              return Object.assign({}, base, { columna: columnaFila(r.id, c), valor: actual[c] || '', requerido: 'NUNCA', autollenar: autollenar });
            });
          });
        }
        const htmlIndividual = !esReasignar ? '' : '<div class="ln-masiva-individual" hidden>' +
          '<p class="ln-tenue ln-masiva-ayuda">Cada equipo trae su responsable actual: cambia solo los que necesites. Los que dejes igual no se tocan.</p>' +
          filas.map((r) => '<section class="ln-af-seccion ln-masiva-fila" data-masiva-fila="' + esc(r.id) + '"><h4 class="ln-af-titulo">' + icono(esLinea ? 'card-sim' : 'smartphone') + ' ' +
            esc(nombreDe(r)) + ' · ' + esc(esLinea ? (r.compania || 'Sin compañía') : (r.modelo || 'Sin modelo')) + '</h4><div class="ln-af-grid">' + elementosFila[r.id].map(htmlElementoFormulario).join('') + '</div></section>').join('') +
          '</div>';
        const htmlModo = !esReasignar ? '' : '<div class="ln-segmentado ln-masiva-modo" role="group" aria-label="Cómo reasignar">' +
          '<button type="button" class="secondary activo" data-modo="TODOS" aria-pressed="true">' + icono('users') + ' Mismo responsable para todos</button>' +
          '<button type="button" class="secondary" data-modo="INDIVIDUAL" aria-pressed="false">' + icono('list') + ' Uno por uno</button></div>';

        cuerpo.innerHTML =
          '<div class="ln-nota">' + icono('info', 'ln-icon-sm') + ' <span class="ln-masiva-efecto">' + esc(accion.efecto) + '</span></div>' +
          (excede ? '<div class="error-msg">Son ' + miles(filas.length) + ' equipos; el máximo por operación es ' + form.maximo + '. Quita algunos de la selección.</div>' : '') +
          htmlModo +
          '<details class="ln-masiva-lista"><summary>' + icono('list') + ' Ver los ' + miles(filas.length) + ' ' + unidad + ' seleccionados</summary><ul>' +
            filas.map((r) => '<li>' + esc(etiqueta(r)) + '</li>').join('') + '</ul></details>' +
          htmlIndividual +
          htmlFormularioAppSheet(elementos) +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div><div class="ln-captura-acciones"><button type="button" class="secondary" data-cerrar-modal>Cancelar</button>' +
          '<button type="button" class="' + (accion.peligro ? 'danger' : 'primary') + ' ln-btn-icono" id="cap-guardar"' + (excede ? ' disabled' : '') + '>' +
            icono(accion.icono) + ' ' + esc(accion.boton) + ' (' + miles(filas.length) + ')</button></div>';
        pintarIconos(cuerpo);
        activarCombosEn(cuerpo, elementos);
        const ctx = { nuevo: false, tipoInicial: '' };

        let modo = 'TODOS';
        if (esReasignar) {
          const cambiarModo = (nuevo) => {
            modo = nuevo;
            cuerpo.querySelectorAll('.ln-masiva-modo [data-modo]').forEach((b) => {
              b.classList.toggle('activo', b.dataset.modo === modo);
              b.setAttribute('aria-pressed', String(b.dataset.modo === modo));
            });
            $('.ln-masiva-individual', cuerpo).hidden = modo !== 'INDIVIDUAL';
            $('.ln-masiva-efecto', cuerpo).textContent = modo === 'INDIVIDUAL'
              ? 'Cada equipo pasa al responsable que le pongas y queda en USO (su línea también, si estaba DISPONIBLE); los que dejes igual no se modifican.' : accion.efecto;
            $('.ln-masiva-lista', cuerpo).hidden = modo === 'INDIVIDUAL';
            colsResp.forEach((c) => {
              const campo = cuerpo.querySelector('.ln-af-campo[data-af-columna="' + CSS.escape(c) + '"]');
              if (campo) campo.classList.toggle('ln-oculto', modo === 'INDIVIDUAL');
            });
            marcarErroresEn(cuerpo, []);
          };
          cuerpo.querySelector('.ln-masiva-modo').addEventListener('click', (ev) => {
            const b = ev.target.closest('[data-modo]');
            if (b) cambiarModo(b.dataset.modo);
          });
          // Las listas de colaboradores de cada equipo se activan al entrar a su sección (con 150 equipos serían cientos)
          cuerpo.addEventListener('focusin', (ev) => {
            const sec = ev.target.closest && ev.target.closest('[data-masiva-fila]');
            if (!sec || sec.dataset.combos) return;
            sec.dataset.combos = '1';
            activarCombosEn(sec, elementosFila[sec.dataset.masivaFila]);
          });
        }
        /** Lo que se valida y se lee según el modo: en "uno por uno", los campos de cada equipo en vez de los comunes. */
        const elementosActivos = () => (modo !== 'INDIVIDUAL' ? elementos
          : elementos.filter((e) => e.tipo !== 'campo' || colsResp.indexOf(e.columna) < 0)
            .concat(filas.reduce((todos, r) => todos.concat(elementosFila[r.id]), [])));
        const nucoDeColumna = (columna) => {
          const partes = String(columna).split('|');
          const r = partes[0] === 'FILA' ? filas.filter((x) => x.id === partes[1])[0] : null;
          return r ? nombreDe(r) + ' · ' : '';
        };

        $('#cap-guardar', raiz).addEventListener('click', async () => {
          $('#cap-error', raiz).hidden = true;
          const activos = elementosActivos();
          const valores = leerFormularioEn(cuerpo, activos);
          const datos = { valores: valores };
          let detalle = filas.slice(0, 12).map(etiqueta).concat(filas.length > 12 ? ['… y ' + (filas.length - 12) + ' más'] : []);
          let cuantos = filas.length;
          // Uno por uno: solo cuentan (y se validan) los campos que se cambiaron; un equipo sin cambios no se toca
          const cambiadas = {};
          if (modo === 'INDIVIDUAL') {
            datos.modo = 'INDIVIDUAL';
            datos.porEquipo = {};
            const resumen = [];
            filas.forEach((r) => {
              const actual = actualDe(r);
              const nuevo = (c) => String(valores[columnaFila(r.id, c)] || '').trim();
              const campos = colsResp.filter((c) => nuevo(c) && nuevo(c) !== String(actual[c] || '').trim());
              if (!campos.length) return;
              campos.forEach((c) => { cambiadas[columnaFila(r.id, c)] = true; });
              const v = { _ETIQUETA: nombreDe(r), RESPONSABLE: nuevo('RESPONSABLE') };
              campos.forEach((c) => { v[c] = nuevo(c); });
              datos.porEquipo[r.id] = v;
              resumen.push(nombreDe(r) + ': ' + (campos.indexOf('RESPONSABLE') >= 0 ? (actual.RESPONSABLE || 'Sin responsable') + ' → ' + v.RESPONSABLE
                : v.RESPONSABLE + ' (' + campos.map((c) => c.toLowerCase()).join(', ') + ')'));
            });
            if (!resumen.length) { mostrarErrorCaptura('No cambiaste los datos de ' + (esLinea ? 'ninguna línea.' : 'ningún equipo.')); return; }
            cuantos = resumen.length;
            detalle = resumen.slice(0, 12).concat(resumen.length > 12 ? ['… y ' + (resumen.length - 12) + ' más'] : []);
          }
          const errores = erroresFormularioEn(cuerpo, activos, '', ctx)
            .filter((x) => modo !== 'INDIVIDUAL' || String(x.columna).indexOf('FILA|') !== 0 || cambiadas[x.columna]);
          marcarErroresEn(cuerpo, errores.map((x) => ({ columna: x.columna, msg: x.corto })));
          if (errores.length) { mostrarErrorCaptura(errores.map((x) => nucoDeColumna(x.columna) + x.msg).slice(0, 4).join(' · ')); return; }
          const ok = await Confirmar.pedir({
            titulo: '¿' + accion.boton + ' ' + miles(cuantos) + ' ' + unidad + '?',
            mensaje: (modo === 'INDIVIDUAL' ? 'Cada uno pasa al responsable que le pusiste.' : accion.efecto) +
              (modo !== 'INDIVIDUAL' && valores.RESPONSABLE ? ' Nuevo responsable: ' + valores.RESPONSABLE + '.' : '') + ' Cada uno deja su historial.',
            detalle: detalle,
            textoConfirmar: accion.boton, peligro: !!accion.peligro,
            palabraClave: accion.peligro && filas.length >= 10 ? 'CANCELAR' : undefined,
          });
          if (!ok || captura !== sesion) return;
          estadoGuardado('Aplicando a ' + miles(cuantos) + ' ' + unidad);
          try {
            const r = await llamar('apiLineasAccionMasiva', accion.clave, ids, datos);
            await aplicarCambiosIndice(r.indice);
            cerrarCaptura(true);
            Object.keys(tablas).forEach((m) => { if (tablas[m]) tablas[m].limpiarSeleccion(); });
            if (vigente()) { pintarIndicadores(); pintarListado(); }
            const omitidos = r.omitidos || [];
            aviso(icono('circle-check') + ' ' + accion.texto + ': ' + miles(r.hechos.length) + ' ' + unidad + ' actualizados' +
              (omitidos.length ? ' · ' + omitidos.length + ' sin cambio' : '') + '.', 8000);
            if (omitidos.length) {
              aviso(icono('triangle-alert', 'ln-alerta') + ' Sin cambio: ' + omitidos.slice(0, 6).map((o) => (o.numero ? 'Línea ' + o.numero : 'NUCO ' + (o.nuco || o.id)) + ' (' + o.motivo + ')').join(' · ') +
                (omitidos.length > 6 ? ' · …' : ''), 12000);
            }
            // Desde la ficha: que muestre lo guardado (igual que Mandar a resguardo)
            const actual = pila[pila.length - 1];
            if (actual && ids.indexOf(actual.id) >= 0) abrir(actual.tipo, actual.id, true);
          } catch (e) {
            errorAlGuardar(e);
          }
        });
      }

      /**
       * Mandar a resguardo (reunión con Líneas, 30-sep): uno o varios equipos, cada NUCO con sus datos
       * (departamento, sede, oficina, estatus del equipo y de la línea, comentario). Los datos de la persona pasan a
       * N/A en el servidor; la línea se propone DISPONIBLE o EN PROCESO DE CANCELACION según su FIN PLAN.
       * Al guardar se crea el renglón de la bandeja de Pau (Resguardos y cancelaciones).
       * opciones.estatus: estatus del equipo ya elegido (desde "Cambiar estatus": PARA VENTA, PARA DESECHO…).
       */
      async function abrirResguardo(filas, opciones) {
        const estatusInicial = (opciones && opciones.estatus) || 'RESGUARDO';
        const permisos = await cargarPermisos().catch(() => null);
        if (!permisos || !permisos.puedeOperar) { aviso(icono('triangle-alert', 'ln-alerta') + ' Tu rol no permite modificar equipos.', 6000); return; }
        mostrarModalCaptura();
        $('#ln-captura-icono', raiz).innerHTML = icono('archive');
        $('#ln-captura-tipo', raiz).textContent = 'RESGUARDO';
        $('#ln-captura-titulo', raiz).textContent = estatusInicial === 'RESGUARDO' ? 'Mandar a resguardo' : 'Pasar a ' + estatusInicial;
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        cuerpo.innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        const sesion = captura = { tipo: 'RESGUARDO', firmas: {} };
        let form;
        try {
          form = await llamar('apiLineasFormularioResguardo', filas.map((r) => r.id));
        } catch (e) {
          if (captura === sesion) cuerpo.innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>';
          return;
        }
        if (captura !== sesion) return;
        const equipos = form.equipos || [];
        if (!equipos.length) {
          cuerpo.innerHTML = '<p class="error-msg">Ninguno de los seleccionados es un equipo: ' + esc((form.omitidos || []).map((o) => o.motivo).join(' · ')) + '</p>';
          return;
        }
        const columnaFila = (id, c) => 'FILA|' + id + '|' + c;
        const base = (c) => (form.campos || []).filter((e) => e.columna === c)[0];
        const enLista = (e, v) => !v || !e || e.control !== 'lista' || (e.opciones || []).map((o) => String(o).toUpperCase()).indexOf(String(v).toUpperCase()) >= 0;
        const campo = (columna, etiqueta, control, extra) => Object.assign({ tipo: 'campo', columna: columna, etiqueta: etiqueta, control: control,
          requerido: 'NUNCA', mostrar: 'SIEMPRE', editable: 'SIEMPRE', soloLectura: false }, extra || {});
        const ubicacion = ['DEPARTAMENTO', 'SEDE', 'OFICINA / DESARROLLO'];
        const accionTexto = estatusInicial === 'RESGUARDO' ? 'Mandar a resguardo' : 'Pasar a ' + estatusInicial;
        $('#ln-captura-subtitulo', raiz).textContent = equipos.length === 1
          ? ['NUCO ' + (equipos[0].nuco || '—'), equipos[0].modelo].filter(Boolean).join(' · ')
          : miles(equipos.length) + ' equipos';
        // Formulario intermedio (usuario, 4-oct): equipo, línea y adendum informativos, como en la inspección; solo se
        // captura el destino, el comentario y el ticket. Los datos de la persona no se muestran: quedan en blanco
        const vigenciaTexto = (q) => (q.vigencia === 'vencido' ? 'VENCIDO' : (q.vigencia === 'vigente' ? 'VIGENTE' : 'SIN FECHA'));
        const info = (q, columna, etiqueta, valor) => campo('INFO|' + q.id + '|' + columna, etiqueta, 'texto', { valor: valor || '—', soloLectura: true, editable: 'NUNCA' });
        const titulo = (q, texto, icono) => ({ tipo: 'titulo', texto: (equipos.length > 1 ? 'NUCO ' + (q.nuco || '—') + ' · ' : '') + texto, icono: icono });
        const ETIQUETA_UBICACION = { 'DEPARTAMENTO': 'Departamento', 'SEDE': 'Sede', 'OFICINA / DESARROLLO': 'Oficina o desarrollo' };
        const elementosFila = {}; // lo que se captura de cada equipo (con prefijo FILA|<id>| para que sea único)
        const vistaFila = {}; // lo que se dibuja: lo informativo y lo que se captura
        equipos.forEach((q) => {
          const actual = { DEPARTAMENTO: 'DISPONIBLE', SEDE: q.sede, 'OFICINA / DESARROLLO': q.oficina };
          const els = ubicacion.map((c) => {
            const b = base(c);
            return Object.assign({}, b, { columna: columnaFila(q.id, c), etiqueta: ETIQUETA_UBICACION[c], valor: enLista(b, actual[c]) ? actual[c] || '' : '', requerido: 'SIEMPRE', autollenar: undefined });
          });
          // Estatus con botones y su significado al pasar el ratón. Con el adendum vencido la línea va a cancelación, sin
          // elegir; vigente o sin fecha, se elige DISPONIBLE o cancelación (usuario, 4-oct; el servidor revisa lo mismo)
          const estatus = [campo(columnaFila(q.id, 'ESTATUS EQUIPO'), 'Estatus del equipo', 'escala', { opciones: form.estatusEquipo, valor: estatusInicial, requerido: 'SIEMPRE', ayudas: SIGNIFICADO_ESTATUS })];
          if (q.tieneLinea) {
            const vencido = q.propuestaLinea === 'EN PROCESO DE CANCELACION';
            estatus.push(campo(columnaFila(q.id, 'ESTATUS LINEA'), 'Estatus de la línea', 'escala', { opciones: vencido ? [q.propuestaLinea] : form.estatusLinea,
              valor: q.propuestaLinea, requerido: 'SIEMPRE', ayudas: SIGNIFICADO_ESTATUS }));
          }
          elementosFila[q.id] = els.concat(estatus);
          vistaFila[q.id] = [titulo(q, 'EQUIPO', 'smartphone'),
            info(q, 'NUCO', 'NUCO', q.nuco), info(q, 'TIPO', 'Tipo', q.tipo), info(q, 'MODELO', 'Modelo', q.modelo), info(q, 'IMEI', 'IMEI', q.imei),
            info(q, 'COLOR', 'Color', q.color), info(q, 'ESTATUS EQUIPO', 'Estatus actual', q.estatusEquipo)]
            .concat(q.tieneLinea ? [titulo(q, 'LÍNEA', 'card-sim'),
              info(q, 'NUMERO', 'Número', q.numero), info(q, 'SIM', 'SIM', q.sim), info(q, 'COMPANIA', 'Compañía', q.compania),
              info(q, 'RAZON SOCIAL', 'Razón social', q.razonSocial), info(q, 'ESTATUS LINEA', 'Estatus actual', q.estatusLinea),
              titulo(q, 'ADENDUM', 'file-text'),
              info(q, 'INICIO PLAN', 'Inicio', q.inicioPlan), info(q, 'FIN PLAN', 'Fin', q.finPlan), info(q, 'COSTO PLAN', 'Costo del plan', q.costoPlan),
              info(q, 'VIGENCIA', 'Vigencia', vigenciaTexto(q))] : [])
            .concat([titulo(q, 'DESTINO', 'archive')], els, [titulo(q, 'ESTATUS', 'toggle-right')], estatus);
        });
        // Un solo COMENTARIO (plan §5.2) y el TICKET
        const motivoEl = campo('_MOTIVO', 'Comentario', 'area', { requerido: 'SIEMPRE', valor: '' });
        const ticketEl = campo('_TICKET', 'Ticket', 'texto', { valor: '', literal: true });
        cuerpo.innerHTML =
          ((form.omitidos || []).length ? '<div class="ln-nota ln-alerta">' + icono('triangle-alert', 'ln-icon-sm') + ' No se incluyen: ' +
            esc(form.omitidos.map((o) => (o.nuco ? 'NUCO ' + o.nuco + ' ' : '') + '(' + o.motivo + ')').join(' · ')) + '</div>' : '') +
          equipos.map((q) => '<div data-resg-fila="' + esc(q.id) + '">' + htmlFormularioAppSheet(vistaFila[q.id], { acomodar: true }) + '</div>').join('') +
          htmlFormularioAppSheet([{ tipo: 'titulo', texto: 'COMENTARIO', icono: 'message-square-text' }, motivoEl, ticketEl], { acomodar: true }) +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div><div class="ln-captura-acciones"><button type="button" class="secondary" data-cerrar-modal>Cancelar</button>' +
          '<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('archive') + ' ' + esc(accionTexto) + (equipos.length > 1 ? ' (' + miles(equipos.length) + ')' : '') + '</button></div>';
        pintarIconos(cuerpo);
        activarCombosEn(cuerpo, equipos.reduce((lista, q) => lista.concat(elementosFila[q.id]), []));
        $('#cap-guardar', raiz).addEventListener('click', async () => {
          $('#cap-error', raiz).hidden = true;
          const todos = equipos.reduce((lista, q) => lista.concat(elementosFila[q.id]), []).concat([motivoEl, ticketEl]);
          const errores = erroresFormularioEn(cuerpo, todos, '', { nuevo: false, tipoInicial: '' });
          marcarErroresEn(cuerpo, errores.map((x) => ({ columna: x.columna, msg: x.corto })));
          const nucoDe = (columna) => {
            const partes = String(columna).split('|');
            const q = partes[0] === 'FILA' ? equipos.filter((x) => x.id === partes[1])[0] : null;
            return q ? 'NUCO ' + (q.nuco || '—') + ' · ' : '';
          };
          if (errores.length) { mostrarErrorCaptura(errores.map((x) => nucoDe(x.columna) + x.msg).slice(0, 4).join(' · ')); return; }
          const valores = leerFormularioEn(cuerpo, todos);
          const porEquipo = {};
          equipos.forEach((q) => {
            const v = (c) => String(valores[columnaFila(q.id, c)] || '').trim();
            porEquipo[q.id] = { _ETIQUETA: 'NUCO ' + (q.nuco || '—'), DEPARTAMENTO: v('DEPARTAMENTO'), SEDE: v('SEDE'), 'OFICINA / DESARROLLO': v('OFICINA / DESARROLLO'),
              'ESTATUS EQUIPO': v('ESTATUS EQUIPO'),
              'ESTATUS LINEA': !q.tieneLinea ? '' : (q.propuestaLinea === 'EN PROCESO DE CANCELACION' ? q.propuestaLinea : v('ESTATUS LINEA')) };
          });
          if (captura !== sesion) return; // sin ventana de confirmación (usuario, 4-oct)
          // La inspección es obligatoria al mandar a resguardo (pendiente 2.6) y se captura dentro de la acción (decisión
          // del usuario, 3-oct): una por cada equipo que viene de una persona. Si se cierra una sin guardar, no se manda
          // ninguno; las que ya se guardaron no se vuelven a pedir hoy
          const deUnaPersona = equipos.filter((q) => String(q.estatusEquipo || '').toUpperCase() === 'USO');
          let inspecciones = {};
          let enModal = true;
          if (deUnaPersona.length) {
            cerrarCaptura(true);
            enModal = false;
            inspecciones = await inspeccionesEnFlujo(deUnaPersona, 'al mandarlo a resguardo');
            if (!inspecciones) {
              aviso(icono('triangle-alert', 'ln-alerta') + ' Sin mandar a resguardo · falta la inspección', 8000);
              return;
            }
            aviso((estatusInicial === 'RESGUARDO' ? 'Mandando ' + miles(equipos.length) + ' a resguardo' : 'Pasando ' + miles(equipos.length) + ' a ' + estatusInicial) + '…', 6000);
          } else estadoGuardado(estatusInicial === 'RESGUARDO' ? 'Mandando ' + miles(equipos.length) + ' a resguardo' : 'Pasando ' + miles(equipos.length) + ' a ' + estatusInicial);
          try {
            const r = await llamar('apiLineasMandarResguardo', equipos.map((q) => q.id), { comentario: valores._MOTIVO, ticket: valores._TICKET, porEquipo: porEquipo, inspecciones: inspecciones });
            await aplicarCambiosIndice(r.indice);
            if (enModal && captura === sesion) cerrarCaptura(true);
            if (tablas.equipos) tablas.equipos.limpiarSeleccion();
            if (vigente()) { pintarIndicadores(); pintarListado(); }
            const omitidos = r.omitidos || [];
            const porRecibir = r.hechos.filter((h) => !h.yaGuardado).length;
            aviso(icono('circle-check') + ' ' + miles(r.hechos.length) + ' equipo(s) actualizados' + (omitidos.length ? ' · ' + omitidos.length + ' sin cambio' : '') +
              (porRecibir ? '. ' + miles(porRecibir) + ' por recibir en Resguardos y cancelaciones.' : '. Ya estaban en resguardo: no se pide otra recepción.'), 8000);
            if (omitidos.length) {
              aviso(icono('triangle-alert', 'ln-alerta') + ' Sin cambio: ' + omitidos.slice(0, 6).map((o) => 'NUCO ' + (o.nuco || o.id) + ' (' + o.motivo + ')').join(' · '), 12000);
            }
            const actual = pila[pila.length - 1];
            if (actual && equipos.some((q) => q.id === actual.id)) abrir(actual.tipo, actual.id, true);
          } catch (e) {
            if (!enModal) { aviso(icono('triangle-alert', 'ln-alerta') + ' No se mandó a resguardo: ' + mensajeError(e) + ' Las inspecciones quedaron guardadas: vuelve a mandarlo y no se piden otra vez.', 15000); return; }
            errorAlGuardar(e);
          }
        });
      }

      /**
       * "Mandar a cancelación" (30-sep): una o varias líneas pasan a la pestaña Cancelaciones de la bandeja (carta
       * firmada → enviada → cancelada), sin mandar el equipo a resguardo. La línea queda EN PROCESO DE CANCELACION.
       */
      async function abrirCancelacion(filas) {
        const permisos = await cargarPermisos().catch(() => null);
        if (!permisos || !permisos.puedeOperar) { aviso(icono('triangle-alert', 'ln-alerta') + ' Tu rol no permite modificar líneas.', 6000); return; }
        const conNumero = filas.filter((r) => r.numero);
        if (!conNumero.length) { aviso(icono('triangle-alert', 'ln-alerta') + ' Ninguno de los seleccionados tiene línea.', 6000); return; }
        // Textos técnicos y espera desde el clic (usuario, 4-oct)
        const lista = conNumero.slice(0, 6).map((r) => r.numero).join(' · ') + (conNumero.length > 6 ? ' …' : '');
        const subtitulo = (conNumero.length > 1 ? miles(conNumero.length) + ' líneas · ' : '') + lista;
        try {
          const r = await pedirDatos('Mandar a cancelación', subtitulo,
            [{ clave: 'comentario', etiqueta: 'Comentario', requerido: true, area: true, minimo: 4 }, { clave: 'ticket', etiqueta: 'Ticket' }],
            'Mandar a cancelación', {
              espera: 'Mandando a cancelación',
              alConfirmar: (datos) => llamar('apiLineasMandarCancelacion', conNumero.map((x) => x.id), { comentario: datos.comentario, ticket: datos.ticket }),
            });
          if (!r) return;
          await aplicarCambiosIndice(r.indice);
          Object.keys(tablas).forEach((m) => { if (tablas[m]) tablas[m].limpiarSeleccion(); });
          if (vigente()) { pintarIndicadores(); pintarListado(); }
          const omitidos = r.omitidos || [];
          aviso(icono('circle-check') + ' ' + miles(r.hechos.length) + ' línea(s) en la bandeja de cancelaciones' + (omitidos.length ? ' · ' + omitidos.length + ' sin cambio: ' +
            omitidos.slice(0, 4).map((o) => (o.numero || (o.nuco ? 'NUCO ' + o.nuco : o.id)) + ' (' + o.motivo + ')').join(' · ') : '') + '.', 9000);
          const actual = pila[pila.length - 1];
          if (actual && conNumero.some((q) => q.id === actual.id)) abrir(actual.tipo, actual.id, true);
        } catch (e) {
          aviso(icono('triangle-alert', 'ln-alerta') + ' ' + mensajeError(e), 10000);
        }
      }

      // ---- Alta y edición directa del inventario ----
      /**
       * Editar información y Agregar equipo / Agregar línea (usuario, 4-oct): todo lo guardado en pestañas (equipo,
       * responsable, línea, adendum, accesorios y accesos); FOLIO, NUCO y TIPO fijos y el TIPO se asigna solo. Los estatus
       * se cambian aquí: RESGUARDO, PARA VENTA y PARA DESECHO abren Mandar a resguardo y EN PROCESO DE CANCELACION, Mandar
       * a cancelación (al guardar). `parte` (alta): EQUIPO o LINEA.
       */
      function abrirEditor(id, parte) {
        const agregar = parte === 'LINEA' ? 'Agregar línea' : 'Agregar equipo';
        mostrarModalCaptura();
        $('#ln-captura-icono', raiz).innerHTML = icono(id ? 'pencil' : (parte === 'LINEA' ? 'card-sim' : 'smartphone'));
        $('#ln-captura-tipo', raiz).textContent = 'LINEAS TELEFONICAS';
        $('#ln-captura-titulo', raiz).textContent = id ? 'Editar información' : agregar;
        $('#ln-captura-subtitulo', raiz).textContent = '';
        $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        const sesionEditor = captura = { tipo: 'REGISTRO', idObjetivo: id, firmas: {} };
        llamar('apiLineasFormularioRegistro', id || '', parte || '').then((form) => {
          if (!captura || captura.tipo !== 'REGISTRO') return;
          const cuerpo = $('#ln-captura-cuerpo', raiz);
          const elementos = form.elementos;
          const valorDe = (c) => ((elementos.filter((e) => e.columna === c)[0] || {}).valor) || '';
          const ctx = { nuevo: form.nuevo, id: id, idDG: form.idDG || null, tipoInicial: form.tipo || '', parte: form.parte, historico: !!form.historico,
            nuco: form.nuevo ? '' : valorDe('NUCO') };
          captura.contexto = { formulario: elementos };
          $('#ln-captura-subtitulo', raiz).textContent = !id ? '' : (form.parte === 'LINEA'
            ? [valorDe('NUMERO TELEFONO'), valorDe('RESPONSABLE')] : ['NUCO ' + (valorDe('NUCO') || '—'), valorDe('EQUIPO'), valorDe('RESPONSABLE')]).filter(Boolean).join(' · ');
          // Alta: paso por paso. Edición: se salta a cualquier pestaña y se guarda desde cualquiera. Un solo COMENTARIO
          // obligatorio y el TICKET opcional, como en todas las acciones
          // El comentario y el ticket van en otra ventana, al aceptar los cambios (usuario, 4-oct)
          cuerpo.innerHTML = htmlPasosAppSheet(elementos, form.parte === 'LINEA' ? PASOS_FORMULARIO.REGISTRO_LINEA : PASOS_FORMULARIO.REGISTRO_EQUIPO) +
            '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div>' +
            htmlAccionesPasos('<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('circle-check') + (id ? ' Guardar cambios' : ' ' + agregar) + '</button>');
          pintarIconos(cuerpo);
          activarCombosEn(cuerpo, elementos);
          const patron = elementos.filter((e) => e.control === 'patron')[0];
          if (patron) {
            captura.patronInicial = esPuntosPatron(patron.valor) ? patron.valor : null;
            captura.controlPatron = activarPatron('af-' + patron.columna.replace(/[^A-Za-z0-9]+/g, '-') + '-patron', captura.patronInicial ? captura.patronInicial.split('-') : []);
          }
          const aplicar = () => aplicarReglasEn(cuerpo, elementos, ctx);
          cuerpo.addEventListener('input', aplicar);
          cuerpo.addEventListener('change', aplicar);
          cuerpo.addEventListener('click', (ev) => {
            const multi = ev.target.closest('.ln-pastilla-multi');
            if (multi) { ev.stopPropagation(); alternarMulti(multi); aplicar(); return; }
            if (ev.target.closest('.ln-pastilla')) setTimeout(aplicar, 0);
          }, true);
          aplicar();
          const conCorto = (lista) => lista.map((x) => ({ columna: x.columna, msg: x.corto }));
          captura.reaplicar = aplicar; // al reactivar tras un error, los campos no editables vuelven a bloquearse
          const pasos = captura.pasos = activarPasos(cuerpo, {
            atras: cuerpo.querySelector('[data-paso-atras]'), siguiente: cuerpo.querySelector('[data-paso-siguiente]'),
            guardar: $('#cap-guardar', raiz), cuenta: cuerpo.querySelector('.form-cuenta'), libre: !!id,
            validar: (seccion) => {
              const errores = erroresFormularioEn(cuerpo, elementos, '', ctx).filter((x) => seccion.querySelector('[data-af-columna="' + CSS.escape(x.columna) + '"]'));
              marcarErroresEn(cuerpo, conCorto(errores));
              $('#cap-error', raiz).hidden = true;
              return errores;
            },
          });
          $('#cap-guardar', raiz).addEventListener('click', () => {
            $('#cap-error', raiz).hidden = true;
            const errores = erroresFormularioEn(cuerpo, elementos, '', ctx);
            if (errores.length) {
              pasos.irAlCampo(errores[0].columna);
              marcarErroresEn(cuerpo, conCorto(errores));
              mostrarErrorCaptura(errores.map((x) => x.msg).slice(0, 4).join(' · ') + (errores.length > 4 ? '…' : ''), null);
              return;
            }
            const valores = leerFormularioEn(cuerpo, elementos);
            // Estatus que siguen su flujo (usuario, 4-oct): RESGUARDO, PARA VENTA y PARA DESECHO → Mandar a resguardo;
            // EN PROCESO DE CANCELACION → Mandar a cancelación. Lo demás se guarda aquí; si solo cambió el estatus, se va
            // directo al flujo (su formulario pide su comentario)
            const inicial = {};
            elementos.forEach((e) => { if (e.tipo === 'campo') inicial[e.columna] = String(e.valor === undefined || e.valor === null ? '' : e.valor); });
            let flujo = null;
            if (id && valores['ESTATUS EQUIPO'] !== inicial['ESTATUS EQUIPO'] && ESTATUS_EQUIPO_RESGUARDO.indexOf(valores['ESTATUS EQUIPO']) >= 0) {
              flujo = { tipo: 'RESGUARDO', estatus: valores['ESTATUS EQUIPO'] };
              valores['ESTATUS EQUIPO'] = inicial['ESTATUS EQUIPO'];
            } else if (id && valores['ESTATUS LINEA'] !== inicial['ESTATUS LINEA'] && valores['ESTATUS LINEA'] === 'EN PROCESO DE CANCELACION') {
              flujo = { tipo: 'CANCELACION' };
              valores['ESTATUS LINEA'] = inicial['ESTATUS LINEA'];
            }
            const seguirFlujo = () => {
              if (!flujo) return;
              const ix = memoria.indice || { equipos: [], lineas: [] };
              const r = ix.equipos.filter((x) => x.id === id)[0] || ix.lineas.filter((x) => x.id === id)[0] || { id: id };
              if (flujo.tipo === 'RESGUARDO') abrirResguardo([{ id: id }], { estatus: flujo.estatus }); else abrirCancelacion([r]);
            };
            const norma = (x) => String(x === undefined || x === null ? '' : x).replace(/\s+/g, '').toUpperCase();
            const otros = Object.keys(valores).some((c) => c !== (patron && patron.columna) && norma(valores[c]) !== norma(inicial[c])) ||
              (patron && patronParaGuardar() !== undefined);
            if (flujo && !otros) { cerrarCaptura(true); seguirFlujo(); return; }
            if (patron) {
              const p = patronParaGuardar();
              if (p === undefined) delete valores[patron.columna]; else valores[patron.columna] = p;
            }
            // Segunda ventana: un solo COMENTARIO obligatorio y el TICKET (plan §5.2), ya con los cambios aceptados
            pedirDatos('Comentario', $('#ln-captura-subtitulo', raiz).textContent || (ctx.parte === 'LINEA' ? 'Agregar línea' : 'Agregar equipo'),
              [{ clave: 'comentario', etiqueta: 'Comentario', requerido: true, area: true, minimo: 4 }, { clave: 'ticket', etiqueta: 'Ticket' }],
              id ? 'Guardar cambios' : (ctx.parte === 'LINEA' ? 'Agregar línea' : 'Agregar equipo')).then((nota) => {
              if (!nota || captura !== sesionEditor) return null;
              return leerArchivosEn(cuerpo).then((archivos) => {
              estadoGuardado(id ? 'Guardando cambios' : 'Guardando');
              const datos = { valores: valores, archivos: archivos, comentario: nota.comentario, ticket: nota.ticket, parte: ctx.parte };
              return (id ? llamar('apiLineasEditarRegistro', id, datos) : llamar('apiLineasCrearRegistro', datos)).then((r) => aplicarCambiosIndice(r.filas).then(() => {
                cerrarCaptura(true);
                aviso(icono('circle-check') + ' ' + (id ? 'Información actualizada' : (ctx.parte === 'LINEA' ? 'Línea agregada' : 'Equipo agregado')), 6000);
                if (flujo) { seguirFlujo(); return; }
                abrirRegistro(id || r.id);
              }));
              });
            }).catch(errorAlGuardar);
          });
        }).catch((e) => { $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>'; });
      }

      // ---- Captura: inspección y responsiva nuevas ----

      /** La ventana de captura se reutiliza: se abre siempre sin la marca de guardado de la anterior (con ella el lienzo
       *  de firma no recibe trazos; pasaba en Reasignar después de la inspección de Mandar a resguardo, 4-oct). */
      function mostrarModalCaptura() {
        const modal = $('#ln-modal-captura', raiz);
        modal.removeAttribute('aria-busy');
        modal.hidden = false;
      }

      function cerrarCaptura(guardada) {
        if (captura && captura.guardando && !guardada) return;
        const borrador = captura;
        $('#ln-modal-captura', raiz).removeAttribute('aria-busy');
        $('#ln-modal-captura', raiz).hidden = true;
        $('#ln-calif-vivo', raiz).hidden = true;
        ocultarEspera();
        $('#ln-captura-cuerpo', raiz).innerHTML = '';
        captura = null;
        // Documento dentro de una acción: si se cierra sin guardarlo, la acción no sigue
        if (borrador && borrador.flujo && !borrador.guardada) borrador.flujo.resolver(null);
        if (!guardada && borrador && !borrador.guardada && borrador.carpetaId) {
          llamar('apiLineasCancelarEvidencia', borrador.carpetaId, borrador.fotosCarpetaId)
            .catch((e) => aviso(icono('triangle-alert', 'ln-alerta') + ' No se pudo limpiar la carpeta cancelada: ' + mensajeError(e), 9000));
        }
      }

      /** Valores actuales del formulario, por columna del AppSheet. */
      function leerFormularioAppSheet() {
        return leerFormularioEn($('#ln-captura-cuerpo', raiz), captura && captura.contexto ? captura.contexto.formulario : []);
      }

      function tipoFormulario() {
        const el = raiz.querySelector('#ln-captura-cuerpo [data-columna="TIPO"]');
        return el ? el.value : (captura && captura.tipoFijo) || '';
      }

      /** Show_If / Required_If en vivo y la CALIFICACION calculada. */
      function actualizarFormularioAppSheet() {
        if (!captura) return;
        const tipo = tipoFormulario();
        raiz.querySelectorAll('#ln-captura-cuerpo .ln-af-campo').forEach((campo) => {
          const visible = cumpleCondicion(campo.dataset.mostrar, tipo);
          campo.hidden = !visible;
          campo.querySelector('.ln-af-req').hidden = !(visible && cumpleCondicion(campo.dataset.requerido, tipo));
        });
        raiz.querySelectorAll('#ln-captura-cuerpo .ln-af-seccion:not(.ln-af-extra)').forEach((sec) => {
          sec.hidden = !sec.querySelector('.ln-af-campo:not([hidden])');
        });
        const calif = $('#af-CALIFICACION', raiz);
        if (calif) calif.textContent = (calificacionAppSheet(leerFormularioAppSheet()) * 100).toFixed(2) + '%';
        if (captura.tipo === 'INSPECCION') pintarCalificacionVivo();
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        aplicarBloqueo(cuerpo, false);
        // El nombre de quien firma va debajo de su firma
        Object.keys(captura.firmas || {}).forEach((col) => {
          const f = captura.firmas[col];
          const origen = NOMBRE_DE_FIRMA[col] && cuerpo.querySelector('[data-columna="' + CSS.escape(NOMBRE_DE_FIRMA[col]) + '"]');
          if (f && f.setNombre && origen) f.setNombre(origen.value);
        });
      }
      const actualizarProgresoChecklist = actualizarFormularioAppSheet;

      /**
       * Calificación en vivo en la esquina del encabezado (misma fórmula del AppSheet que CALIFICACION). Cuenta solo los
       * puntos que califican y que se ven para el TIPO; sin umbrales de color porque el AppSheet no define "buena/mala".
       */
      function pintarCalificacionVivo() {
        const caja = $('#ln-calif-vivo', raiz);
        if (!caja) return;
        const valores = leerFormularioAppSheet();
        const califican = CALIFICACION_SI.concat(Object.keys(CALIFICACION_DESEMPENO));
        const visibles = califican.filter((c) => {
          const campo = raiz.querySelector('#ln-captura-cuerpo .ln-af-campo[data-af-columna="' + CSS.escape(c) + '"]');
          return campo && !campo.hidden;
        });
        const contestados = visibles.filter((c) => valores[c] === 'SI' || valores[c] === 'NO' || /^(BUENO|REGULAR|MALO)$/.test(valores[c] || '')).length;
        const valor = calificacionAppSheet(valores);
        $('#ln-calif-vivo-numero', raiz).textContent = contestados ? (valor * 100).toFixed(2) + '%' : '—';
        $('#ln-calif-vivo-barra', raiz).style.width = (visibles.length ? (contestados / visibles.length) * 100 : 0) + '%';
        $('#ln-calif-vivo-pie', raiz).textContent = contestados + ' de ' + visibles.length + ' puntos calificados';
        caja.hidden = false;
      }

      /** Obligatorios visibles vacíos (misma regla que el servidor). */
      function faltantesFormularioAppSheet() {
        const tipo = tipoFormulario();
        const valores = leerFormularioAppSheet();
        const faltan = [];
        (captura.contexto.formulario || []).forEach((e) => {
          if (e.tipo !== 'campo' || e.soloLectura || e.control === 'calculado' || e.valorOculto || e.virtual) return;
          if (!cumpleCondicion(e.mostrar, tipo) || !cumpleCondicion(e.requerido, tipo)) return;
          if (e.control === 'firma') {
            const f = captura.firmas[e.columna];
            if (!f || f.estaVacia()) faltan.push(e);
            return;
          }
          if (e.control === 'patron') return;
          if (!valores[e.columna]) faltan.push(e);
        });
        return faltan;
      }

      function iniciarFormularioAppSheet() {
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        (captura.contexto.formulario || []).forEach((e) => {
          if (e.tipo !== 'campo') return;
          const id = 'af-' + e.columna.replace(/[^A-Za-z0-9]+/g, '-');
          if (e.control === 'firma') {
            const origen = NOMBRE_DE_FIRMA[e.columna] && cuerpo.querySelector('[data-columna="' + CSS.escape(NOMBRE_DE_FIRMA[e.columna]) + '"]');
            captura.firmas[e.columna] = crearFirma(document.getElementById(id + '-firma'), origen ? origen.value : '');
          }
          if (e.control === 'patron') {
            captura.columnaPatron = e.columna;
            captura.patronInicial = esPuntosPatron(e.valor) ? e.valor : null;
            captura.controlPatron = activarPatron(id + '-patron', captura.patronInicial ? captura.patronInicial.split('-') : []);
          }
        });
        activarCombosEn(cuerpo, captura.contexto.formulario);
        cuerpo.addEventListener('change', (ev) => { if (ev.target.matches('[data-columna="_BLOQUEO"]')) aplicarBloqueo(cuerpo, true); });
        cuerpo.addEventListener('input', (ev) => { if (ev.target.matches('[data-columna]')) actualizarFormularioAppSheet(); });
        cuerpo.addEventListener('change', (ev) => { if (ev.target.matches('[data-columna]')) actualizarFormularioAppSheet(); });
        actualizarFormularioAppSheet();
        if (cuerpo.querySelector('.form-paso')) {
          captura.pasos = activarPasos(cuerpo, {
            atras: cuerpo.querySelector('[data-paso-atras]'), siguiente: cuerpo.querySelector('[data-paso-siguiente]'),
            guardar: $('#cap-guardar', raiz), cuenta: cuerpo.querySelector('.form-cuenta'),
            // El lienzo de firma se mide al mostrarse (en un paso oculto mediría 0)
            alMostrar: () => Object.keys(captura.firmas).forEach((c) => { if (captura.firmas[c] && captura.firmas[c].ajustar) captura.firmas[c].ajustar(); }),
            validar: (seccion) => {
              const errores = erroresCaptura(seccion);
              marcarErroresEn(cuerpo, errores);
              $('#cap-error', raiz).hidden = true;
              return errores;
            },
          });
        }
      }

      /** Obligatorios vacíos, firmas y valores fuera de lista (todo el formulario o solo un paso). */
      function erroresCaptura(seccion) {
        const tipo = tipoFormulario();
        const valores = leerFormularioAppSheet();
        const errores = faltantesFormularioAppSheet().map((e) => ({ columna: e.columna, etiqueta: e.etiqueta, msg: e.control === 'firma' ? 'Falta la firma' : 'Obligatorio' }));
        (captura.contexto.formulario || []).forEach((e) => {
          if (e.tipo !== 'campo' || e.control !== 'lista' || e.virtual || !cumpleCondicion(e.mostrar, tipo) || !valores[e.columna]) return;
          if ((e.opciones || []).map((o) => String(o).toUpperCase()).indexOf(valores[e.columna].toUpperCase()) < 0) {
            errores.push({ columna: e.columna, etiqueta: e.etiqueta, msg: 'Elige un valor de la lista' });
          }
        });
        return seccion ? errores.filter((x) => seccion.querySelector('[data-af-columna="' + CSS.escape(x.columna) + '"]')) : errores;
      }

      /**
       * PATRON a enviar: los puntos trazados, '' si se borró uno que venía en puntos, o undefined para
       * conservar el valor inicial (p. ej. la imagen que dejó AppSheet).
       */
      function patronParaGuardar() {
        if (!captura.controlPatron) return undefined;
        const actual = captura.controlPatron.valor();
        if (actual) return actual;
        return captura.patronInicial ? '' : undefined;
      }

      /** Valida antes de enviar; regresa false y lleva al paso y campo del primer error. */
      function validarFormularioAppSheet() {
        if (captura.pasos) {
          const errores = erroresCaptura();
          if (!errores.length) return true;
          captura.pasos.irAlCampo(errores[0].columna);
          const cuerpo = $('#ln-captura-cuerpo', raiz);
          marcarErroresEn(cuerpo, errores);
          mostrarErrorCaptura(errores.length === 1 ? errores[0].etiqueta + ': ' + errores[0].msg : 'Faltan ' + errores.length + ' datos: ' + errores.slice(0, 4).map((x) => x.etiqueta).join(', ') + (errores.length > 4 ? '…' : ''),
            null);
          return false;
        }
        const faltan = faltantesFormularioAppSheet();
        // Valid_If de las listas (IN(..., LISTAS TELEFONOS[...])): un valor fuera de la lista no se acepta
        const tipo = tipoFormulario();
        const valores = leerFormularioAppSheet();
        const fueraDeLista = (captura.contexto.formulario || []).filter((e) => e.tipo === 'campo' && e.control === 'lista' && cumpleCondicion(e.mostrar, tipo) &&
          valores[e.columna] && (e.opciones || []).map((o) => String(o).toUpperCase()).indexOf(valores[e.columna].toUpperCase()) < 0);
        if (!faltan.length && fueraDeLista.length) {
          const campo = raiz.querySelector('#ln-captura-cuerpo [data-af-columna="' + CSS.escape(fueraDeLista[0].columna) + '"] select');
          mostrarErrorCaptura(fueraDeLista.map((e) => e.etiqueta).join(', ') + ': elige un valor de la lista (VALOR NO ENCONTRADO EN LA LISTA).', campo ? '#' + campo.id : null);
          return false;
        }
        if (!faltan.length) return true;
        const primero = faltan[0];
        const destino = raiz.querySelector('#ln-captura-cuerpo [data-af-columna="' + CSS.escape(primero.columna) + '"]');
        mostrarErrorCaptura(faltan.map((e) => e.etiqueta).slice(0, 6).join(', ') + (faltan.length > 6 ? '…' : '') + (faltan.length === 1 ? ' es obligatorio.' : ' son obligatorios.'),
          destino ? '#' + (destino.querySelector('[id]') || destino).id : null);
        return false;
      }

      function activarPatron(prefijo, inicial) {
        const bloque = $('#' + prefijo + '-bloque', raiz);
        if (!bloque) return { puntos: () => [], valor: () => '', base64: () => null };
        cargarPatronesAppSheet(bloque.parentNode);
        const posiciones = POSICIONES_PATRON;
        const estado = { puntos: (inicial || []).map(Number).filter((n) => n >= 1 && n <= 9) };
        const pintar = () => {
          bloque.querySelectorAll('.ln-patron-punto').forEach((p) => {
            const orden = estado.puntos.indexOf(Number(p.dataset.punto));
            p.classList.toggle('activa', orden >= 0);
            p.classList.toggle('inicio', orden === 0);
            p.textContent = orden >= 0 ? String(orden + 1) : '';
          });
          $('#' + prefijo + '-lineas', raiz).innerHTML = estado.puntos.length > 1
            ? '<polyline points="' + estado.puntos.map((n) => posiciones[n - 1].join(',')).join(' ') + '" />' +
              flechasPatron(estado.puntos, 20).map((f) => '<polygon class="ln-patron-flecha" points="' + f.map((n) => n.toFixed(1)).join(',') + '" />').join('')
            : '';
        };
        bloque.querySelectorAll('.ln-patron-punto').forEach((p) => p.addEventListener('click', () => {
          const n = Number(p.dataset.punto); if (estado.puntos.indexOf(n) < 0) estado.puntos.push(n); pintar();
        }));
        $('#' + prefijo + '-limpiar', raiz).addEventListener('click', () => { estado.puntos = []; pintar(); });
        pintar();
        return {
          puntos: () => estado.puntos.slice(),
          valor: () => estado.puntos.join('-'),
          base64: (fondoPdf) => {
            if (!estado.puntos.length) return null;
            const c = document.createElement('canvas'); c.width = 300; c.height = 300;
            const x = c.getContext('2d'); x.fillStyle = fondoPdf || '#ffffff'; x.fillRect(0, 0, 300, 300); x.strokeStyle = '#0b5d7a'; x.lineWidth = 8; x.lineCap = 'round';
            x.beginPath(); estado.puntos.forEach((n, i) => { const p = posiciones[n - 1]; if (!i) x.moveTo(p[0], p[1]); else x.lineTo(p[0], p[1]); }); x.stroke();
            // Flechas hacia donde va cada tramo
            x.fillStyle = '#c9a227';
            flechasPatron(estado.puntos, 24).forEach((f) => { x.beginPath(); x.moveTo(f[0], f[1]); x.lineTo(f[2], f[3]); x.lineTo(f[4], f[5]); x.closePath(); x.fill(); });
            // Los 9 puntos, como en pantalla (svgPatron; usuario, 6-oct): los que no se usan, grises y chicos, encima del trazo
            x.fillStyle = '#b8c4ca';
            posiciones.forEach((p, i) => { if (estado.puntos.indexOf(i + 1) < 0) { x.beginPath(); x.arc(p[0], p[1], 10, 0, Math.PI * 2); x.fill(); } });
            // Puntos con su orden (1 = inicio, con anillo)
            x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = 'bold 17px Arial';
            estado.puntos.forEach((n, i) => {
              const p = posiciones[n - 1];
              x.beginPath(); x.fillStyle = '#0b5d7a'; x.arc(p[0], p[1], 16, 0, Math.PI * 2); x.fill();
              if (!i) { x.beginPath(); x.strokeStyle = '#c9a227'; x.lineWidth = 5; x.arc(p[0], p[1], 20, 0, Math.PI * 2); x.stroke(); }
              x.fillStyle = '#ffffff'; x.fillText(String(i + 1), p[0], p[1] + 1);
            });
            return c.toDataURL('image/png').split(',')[1];
          },
        };
      }

      function subirImagenCaptura(archivo, listaId, carpetaId, onSubido, sinQuitar) {
        const lista = document.getElementById(listaId);
        if (!lista) return Promise.resolve();
        const chip = document.createElement('span');
        chip.className = 'ln-foto-chip ln-foto-subiendo';
        chip.innerHTML = icono('loader-circle', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(archivo.name) + '</span>';
        lista.appendChild(chip);
        return Promise.all([redimensionarImagen(archivo, 1600), Promise.resolve(typeof carpetaId === 'function' ? carpetaId() : carpetaId)])
          .then(([img, carpeta]) => llamar('apiLineasSubirArchivo', carpeta, archivo.name, img.mime, img.base64))
          .then((subido) => {
            chip.className = 'ln-foto-chip';
            chip.innerHTML = icono('check', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(subido.nombre) + '</span>' +
              (sinQuitar ? '' : '<button type="button" data-quitar-foto="' + esc(subido.id) + '">' + icono('x', 'ln-icon-sm') + '</button>');
            onSubido(subido);
          }).catch((e) => {
            chip.className = 'ln-foto-chip';
            chip.style.background = 'var(--ln-rojo-bg)'; chip.style.color = 'var(--ln-rojo-tx)';
            chip.innerHTML = icono('triangle-alert', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(mensajeError(e)) + '</span>';
            onSubido(null);
          });
      }

      function manejarSubidaArchivo(inputId, listaId, obtenerCarpetaId, multiple, onSubido, alTerminar, sinQuitar) {
        const input = document.getElementById(inputId);
        if (!input) return;
        input.addEventListener('change', () => {
          const archivos = Array.from(input.files || []);
          input.value = '';
          if (!archivos.length) return;
          if (!multiple) document.getElementById(listaId).innerHTML = '';
          Promise.all(archivos.slice(0, multiple ? archivos.length : 1).map((archivo) => subirImagenCaptura(archivo, listaId, obtenerCarpetaId, onSubido, sinQuitar)))
            .then(() => { if (alTerminar) alTerminar(); });
        });
      }

      /**
       * Carpeta de fotos de la inspección en Drive (INSPECCIONES LINEAS_Images/FOTOS <ID>): se crea al subir la
       * primera foto, no al abrir el formulario (abre más rápido y sin fotos no queda nada que limpiar).
       */
      function asegurarCarpeta() {
        const sesion = captura;
        if (!sesion) return Promise.reject(new Error('La captura se cerró.'));
        if (!sesion.carpetaPromesa) {
          sesion.carpetaPromesa = llamar('apiLineasPrepararEvidencia', sesion.tipo, sesion.ref, sesion.contexto && sesion.contexto.idPropuesto).then((c) => {
            sesion.carpetaId = c.carpetaId;
            sesion.fotosCarpetaId = c.fotosCarpetaId || c.carpetaId;
            sesion.ruta = c.ruta;
