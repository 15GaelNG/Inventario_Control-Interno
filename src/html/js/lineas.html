            // Si se canceló mientras se creaba, se descarta
            if (captura !== sesion && !sesion.guardada) llamar('apiLineasCancelarEvidencia', c.carpetaId).catch(() => {});
            return c;
          });
          sesion.carpetaPromesa.catch(() => { sesion.carpetaPromesa = null; });
        }
        return sesion.carpetaPromesa;
      }

      /**
       * Pantalla de espera (regla del usuario, 4-oct): en cuanto se da clic a guardar, una pantalla cubre la ventana y
       * dice solo lo que está pasando ("Generando tu PDF"), para que no se dé clic en otra parte ni se recargue. Sin
       * pasos internos: no le interesan a quien captura.
       */
      /**
       * La misma pantalla sirve para el resultado (usuario, 4-oct): o = { tono: 'listo' | 'error', icono, texto,
       * detalle (HTML ya escapado), acciones (HTML de botones) }. Sin `o`, es la espera con su círculo girando.
       */
      function mostrarEspera(titulo, o) {
        const espera = $('#ln-captura-espera', raiz);
        if (!espera) return;
        o = o || {};
        espera.className = 'ln-espera' + (o.tono ? ' ln-espera-' + o.tono : '');
        espera.setAttribute('role', o.tono === 'error' ? 'alert' : 'status');
        $('#ln-espera-circulo', raiz).innerHTML = o.icono ? icono(o.icono) : '<span class="ln-spinner"></span>';
        $('#ln-espera-titulo', raiz).textContent = titulo;
        $('#ln-espera-texto', raiz).textContent = o.texto !== undefined ? o.texto : 'No cierres esta ventana.';
        $('#ln-espera-texto', raiz).hidden = !$('#ln-espera-texto', raiz).textContent;
        $('#ln-espera-detalle', raiz).innerHTML = o.detalle || '';
        $('#ln-espera-detalle', raiz).hidden = !o.detalle;
        $('#ln-espera-acciones', raiz).innerHTML = o.acciones || '';
        $('#ln-espera-acciones', raiz).hidden = !o.acciones;
        pintarIconos(espera);
        espera.hidden = false;
        const boton = espera.querySelector('#ln-espera-acciones button, #ln-espera-acciones a');
        (boton || espera).focus({ preventScroll: true });
      }

      /** Error al guardar: el mismo diseño de la espera; "Volver" regresa al formulario con lo capturado. */
      function errorAlGuardar(e) {
        mostrarErrorCaptura(mensajeError(e));
        restaurarGuardado();
        mostrarEspera('No se pudo guardar', { tono: 'error', icono: 'triangle-alert', texto: 'Lo que capturaste sigue aquí.',
          detalle: mensajeError(e), acciones: '<button type="button" class="primary" data-espera-volver>Volver</button>' });
      }
      function ocultarEspera() {
        const espera = $('#ln-captura-espera', raiz);
        if (espera) espera.hidden = true;
      }

      function estadoGuardado(texto) {
        if (!captura) return;
        captura.guardando = true;
        const modal = $('#ln-modal-captura', raiz);
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = true; });
        captura.textoGuardar = $('#cap-guardar', raiz).innerHTML;
        $('#cap-guardar', raiz).innerHTML = '<span class="ln-spinner"></span> ' + esc(texto);
        modal.setAttribute('aria-busy', 'true');
        mostrarEspera(texto);
      }

      function restaurarGuardado() {
        if (!captura) return;
        captura.guardando = false;
        ocultarEspera();
        const modal = $('#ln-modal-captura', raiz);
        modal.removeAttribute('aria-busy');
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = false; });
        if (captura.textoGuardar) $('#cap-guardar', raiz).innerHTML = captura.textoGuardar;
        if (captura.pasos) captura.pasos.pintar();
        if (captura.reaplicar) captura.reaplicar();
        $('#ln-captura-subtitulo', raiz).textContent = 'No se completó el guardado. Revisa el mensaje y vuelve a intentar.';
      }

      function mostrarErrorCaptura(mensaje, destino) {
        const errorBox = $('#cap-error', raiz);
        if (!errorBox) return;
        errorBox.textContent = mensaje;
        errorBox.hidden = false;
        const marcado = raiz.querySelector('#ln-captura-cuerpo .form-campo-error');
        const objetivo = destino ? $(destino, raiz) : (marcado || errorBox);
        (objetivo || errorBox).scrollIntoView({ behavior: 'smooth', block: 'center' });
        errorBox.setAttribute('tabindex', '-1');
        errorBox.focus({ preventScroll: true });
      }

      /** `regenerar`: el PDF ya existe y se vuelve a hacer (Regenerar PDF). */
      function refrescarDespuesDeCaptura(idAbierto, tipo, nuevoId, regenerar) {
        const sesionCaptura = captura;
        sesionCaptura.guardada = true;
        memoria.cargadoEn = 0;
        const modal = $('#ln-modal-captura', raiz);
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        const generar = () => {
          sesionCaptura.guardando = true;
          modal.setAttribute('aria-busy', 'true');
          modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = true; });
          mostrarEspera('Generando tu PDF'); // sigue la misma pantalla de espera desde el clic en Guardar
          return llamar('apiLineasGenerarPdf', tipo, nuevoId, !!regenerar, sesionCaptura.pdfFirmas || null).then((pdf) => {
            if (!vigente() || captura !== sesionCaptura) return;
            sesionCaptura.guardando = false;
            if (pdf && pdf.faltanFirmas) { pedirFirmasPdf(sesionCaptura, tipo, pdf.nombres || {}, generar); return; }
            mostrarEspera('Tu PDF está listo', { tono: 'listo', icono: 'circle-check', texto: '',
              acciones: enlaceDrive(pdf.id, 'Ver PDF', true) + '<button type="button" class="secondary" data-cerrar-modal>Cerrar</button>' });
            // La captura cambia lo que muestra General (responsable, color, patrón): la ficha de atrás se pinta de nuevo
            // (trae también Documentos e Historial); si se está viendo otra cosa, solo esas dos
            const arriba = pila[pila.length - 1];
            if (arriba && arriba.id === idAbierto && (arriba.tipo === 'equipo' || arriba.tipo === 'linea')) abrir(arriba.tipo, arriba.id, true, true);
            else {
              cargarEvidencias(idAbierto);
              cargarHistorial(idAbierto);
            }
          }).catch((e) => {
            if (!vigente() || captura !== sesionCaptura) return;
            sesionCaptura.guardando = false;
            mostrarEspera('No se pudo generar el PDF', { tono: 'error', icono: 'file-warning', texto: 'Tus datos sí se guardaron.', detalle: mensajeError(e),
              acciones: '<button type="button" class="primary ln-btn-icono" id="cap-reintentar-pdf">' + icono('refresh-cw') + ' Intentar de nuevo</button>' +
                '<button type="button" class="secondary" data-cerrar-modal>Cerrar</button>' });
            $('#cap-reintentar-pdf', raiz).addEventListener('click', generar);
            cargarEvidencias(idAbierto);
            cargarHistorial(idAbierto);
          }).finally(() => {
            sesionCaptura.guardando = false;
            modal.removeAttribute('aria-busy');
            modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = false; });
          });
        };
        generar();
      }

      // -- Inspección (INSPECCIONES LINEAS_Form) --

      const BOTON_GUARDAR_PDF = '<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('circle-check') + ' Guardar y generar PDF</button>';

      /** Botones para agregar fotos: cámara (solo en pantallas táctiles) y galería / archivos. Opcional. */
      function htmlSubirFotos(prefijo, nota) {
        return '<div class="ln-fotos-botones">' +
          '<label class="ln-upload ln-solo-tactil">' + icono('camera') + '<span><b>Tomar foto</b><small>Con la cámara del equipo</small></span>' +
          '<input type="file" id="' + prefijo + '-camara" accept="image/*" capture="environment" multiple /></label>' +
          '<label class="ln-upload">' + icono('images') + '<span><b>Elegir fotos</b><small>De la galería o de la computadora</small></span>' +
          '<input type="file" id="' + prefijo + '" accept="image/*" multiple /></label></div>' +
          '<div class="ln-fotos-lista" id="' + prefijo + '-lista"></div>' + (nota ? '<p class="ln-tenue ln-fotos-nota">' + esc(nota) + '</p>' : '');
      }

      function formularioInspeccion(ctx) {
        const pasos = PASOS_FORMULARIO.INSPECCION;
        const fotos = '<section class="ln-af-seccion ln-af-extra">' +
          htmlSubirFotos('cap-fotos') + '</section>';
        return htmlPasosAppSheet(ctx.formulario, pasos, { [pasos.findIndex((p) => p.desde === 'extra:FOTOS')]: fotos }, { acomodar: true }) +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div>' + htmlAccionesPasos(BOTON_GUARDAR_PDF);
      }

      function iniciarFormularioInspeccion() {
        iniciarFormularioAppSheet();
        ['cap-fotos', 'cap-fotos-camara'].forEach((inputId) => manejarSubidaArchivo(inputId, 'cap-fotos-lista',
          () => asegurarCarpeta().then(() => captura.fotosCarpetaId), true, (s) => { if (s && captura) captura.fotos.push(s); }));
        $('#cap-guardar', raiz).addEventListener('click', guardarInspeccionDesdeFormulario);
      }

      function guardarInspeccionDesdeFormulario() {
        $('#cap-error', raiz).hidden = true;
        if (!validarFormularioAppSheet()) return;
        if (raiz.querySelector('.ln-foto-subiendo')) { mostrarErrorCaptura('Espera a que terminen de subir las imágenes.', '#cap-fotos-lista'); return; }
        const firmaInspector = captura.firmas['FIRMA INSPECTOR'];
        const firmaResponsable = captura.firmas['FIRMA RESPONSABLE'];
        const idAbierto = captura.idObjetivo;
        const patron = patronParaGuardar();
        const valores = leerFormularioAppSheet();
        const sesion = captura;
        estadoGuardado(sesion.flujo ? 'Guardando la inspección' : 'Generando tu PDF');
        // La carpeta de fotos solo existe si se subió alguna (ya quedó creada al subirla)
        Promise.all([firmaInspector.base64('#ddebf7'), firmaResponsable && !firmaResponsable.estaVacia() ? firmaResponsable.base64('#ddebf7') : null, sesion.carpetaPromesa || null]).then(([inspector, responsable]) => {
          sesion.pdfFirmas = { inspector: inspector, responsable: responsable, patron: sesion.controlPatron ? sesion.controlPatron.base64('#ddebf7') : null };
          const datos = Object.assign({}, sesion.ref, {
            id: sesion.contexto.idPropuesto, valores: valores, patron: patron,
            carpetaId: sesion.carpetaId || null, fotosCarpetaId: sesion.fotosCarpetaId || null, ruta: sesion.ruta || '', fotos: sesion.fotos,
            firmaInspectorBase64: sesion.pdfFirmas.inspector, firmaResponsableBase64: sesion.pdfFirmas.responsable, patronBase64: sesion.pdfFirmas.patron,
          });
          return sesion.flujo && sesion.flujo.guardar ? sesion.flujo.guardar(datos) : llamar('apiLineasGuardarInspeccion', datos);
        }).then((r) => {
          if (sesion.flujo) terminarFlujo(sesion, 'INSPECCION', r);
          else refrescarDespuesDeCaptura(idAbierto, 'INSPECCION', r.id);
        }).catch(errorAlGuardar);
      }

      // -- Responsiva (RESPONSIVAS LINEAS_Form) --

      function formularioResponsiva(ctx) {
        return htmlPasosAppSheet(ctx.formulario, PASOS_FORMULARIO.RESPONSIVA, null, { acomodar: true }) +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div>' + htmlAccionesPasos(BOTON_GUARDAR_PDF);
      }

      function iniciarFormularioResponsiva() {
        iniciarFormularioAppSheet();
        $('#cap-guardar', raiz).addEventListener('click', guardarResponsivaDesdeFormulario);
      }

      function guardarResponsivaDesdeFormulario() {
        $('#cap-error', raiz).hidden = true;
        if (!validarFormularioAppSheet()) return;
        const firmaResponsable = captura.firmas['FIRMA RESPONSABLE'];
        const firmaCi = captura.firmas['FIRMA CI'];
        const idAbierto = captura.idObjetivo;
        const patron = patronParaGuardar();
        const valores = leerFormularioAppSheet();
        const sesion = captura;
        estadoGuardado(sesion.flujo && sesion.flujo.espera ? sesion.flujo.espera : (sesion.flujo && !sesion.flujo.pdfAqui ? 'Guardando la responsiva' : 'Generando tu PDF'));
        Promise.all([firmaResponsable && !firmaResponsable.estaVacia() ? firmaResponsable.base64('#ffffff') : null, firmaCi.base64('#ffffff')]).then(([responsable, ci]) => {
          sesion.pdfFirmas = { responsable: responsable, ci: ci, patron: sesion.controlPatron ? sesion.controlPatron.base64('#ffffff') : null };
          const datos = Object.assign({}, sesion.ref, {
            id: sesion.contexto.idPropuesto, valores: valores, patron: patron,
            firmaResponsableBase64: sesion.pdfFirmas.responsable, firmaCiBase64: sesion.pdfFirmas.ci, patronBase64: sesion.pdfFirmas.patron,
          });
          return sesion.flujo && sesion.flujo.guardar ? sesion.flujo.guardar(datos) : llamar('apiLineasGuardarResponsiva', datos);
        }).then((r) => {
          if (sesion.flujo && !sesion.flujo.pdfAqui) terminarFlujo(sesion, 'RESPONSIVA', r);
          else {
            refrescarDespuesDeCaptura(idAbierto, 'RESPONSIVA', r.id);
            if (sesion.flujo && sesion.flujo.despues) Promise.resolve(sesion.flujo.despues(r)).catch(() => {});
          }
        }).catch(errorAlGuardar);
      }

      // -- Abrir el modal --

      /**
       * Documento dentro de la acción (decisión del usuario, 3-oct): abre la inspección o la responsiva en el mismo modal,
       * con un aviso arriba de para qué es. Regresa una promesa con lo que regresó el guardado ({ id, … }) o null si se
       * cerró sin guardar. opciones = { aviso, boton, guardar(datos) → promesa (en lugar del guardado normal) }.
       */
      function capturarEnFlujo(tipo, ref, opciones) {
        return new Promise((resolve) => abrirCaptura(tipo, ref, Object.assign({}, opciones, { resolver: resolve })));
      }

      /**
       * Documento guardado dentro de una acción: su PDF se genera aparte (si falla, queda «Generar PDF» en Documentos).
       * `sinPdf`: el documento solo se revisó y lo guarda la acción después (la responsiva de Reasignar).
       */
      function terminarFlujo(sesion, tipo, r) {
        sesion.guardada = true;
        if (!sesion.flujo.sinPdf) llamar('apiLineasGenerarPdf', tipo, r.id, false, sesion.pdfFirmas || null)
          .catch((e) => aviso(icono('triangle-alert', 'ln-alerta') + ' El documento quedó guardado, pero su PDF no se generó: ' + mensajeError(e) + '. En Documentos está «Generar PDF».', 12000));
        const flujo = sesion.flujo;
        if (captura === sesion) cerrarCaptura(true);
        flujo.resolver(r);
      }

      function abrirCaptura(tipo, ref, flujo) {
        mostrarModalCaptura();
        $('#ln-captura-icono', raiz).innerHTML = icono(tipo === 'INSPECCION' ? 'clipboard-check' : 'signature');
        $('#ln-captura-tipo', raiz).textContent = tipo === 'INSPECCION' ? 'Inspección de telefonía' : 'Responsiva de entrega';
        $('#ln-captura-titulo', raiz).textContent = tipo === 'INSPECCION' ? 'Nueva inspección' : 'Nueva responsiva';
        $('#ln-captura-subtitulo', raiz).textContent = 'Preparando datos y carpeta de evidencia…';
        $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        captura = { tipo: tipo, ref: ref, idObjetivo: ref.equipoId || ref.lineaId, fotos: [], patronId: null, firmas: {}, flujo: flujo || null };
        $('#ln-calif-vivo', raiz).hidden = true; // aparece cuando la inspección ya está en pantalla

        const pedirContexto = tipo === 'INSPECCION' ? llamar('apiLineasContextoInspeccion', ref) : llamar('apiLineasContextoResponsiva', ref);
        const sesion = captura;
        Promise.all([pedirContexto, cargarCatalogos()]).then(([ctx, catalogos]) => {
          if (captura !== sesion) return;
          ctx.catalogos = catalogos;
          ctx.formulario = conSelectorBloqueo(ctx.formulario || []);
          captura.contexto = ctx;
          const valorDe = (c) => ((ctx.formulario || []).filter((e) => e.columna === c)[0] || {}).valor || '';
          $('#ln-captura-subtitulo', raiz).textContent = flujo && flujo.subtitulo ? flujo.subtitulo
            : ['NUCO ' + (valorDe('NUCO') || '—'), valorDe('MODELO'), valorDe('RESPONSABLE')].filter(Boolean).join(' · ');
          if (flujo && flujo.titulo) $('#ln-captura-titulo', raiz).textContent = flujo.titulo;
          if (tipo === 'INSPECCION') {
            $('#ln-captura-cuerpo', raiz).innerHTML = formularioInspeccion(ctx);
            pintarIconos($('#ln-captura-cuerpo', raiz));
            iniciarFormularioInspeccion();
          } else {
            $('#ln-captura-cuerpo', raiz).innerHTML = formularioResponsiva(ctx);
            pintarIconos($('#ln-captura-cuerpo', raiz));
            iniciarFormularioResponsiva();
          }
          if (flujo && flujo.aviso) {
            $('#ln-captura-cuerpo', raiz).insertAdjacentHTML('afterbegin', '<div class="ln-nota ln-nota-flujo">' + icono('route', 'ln-icon-sm') + ' ' + esc(flujo.aviso) + '</div>');
            pintarIconos($('#ln-captura-cuerpo', raiz));
          }
          if (flujo && flujo.boton) $('#cap-guardar', raiz).innerHTML = icono('circle-check') + ' ' + esc(flujo.boton);
        }).catch((e) => {
          if (!captura) return;
          $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>';
        });
      }

      // ---- Historial: todos los movimientos del registro, filtrables y exportables a Excel ----
      const ICONO_MOVIMIENTO = {
        'Alta de registro': 'circle-plus', 'Reasignación': 'arrow-left-right', 'Cambio de estatus': 'toggle-right',
        'Cambio de línea': 'card-sim', 'Cambio de plan': 'receipt-text', 'Cambio de equipo': 'smartphone',
        'Cambio de área o ubicación': 'map-pin', 'Cambio de accesos': 'key-round', 'Otros cambios': 'file-pen-line',
        'Inspección': 'clipboard-check', 'Responsiva': 'signature', 'Reactivación': 'refresh-cw', 'Desecho': 'trash-2',
        // Acciones con nombre (etapa 3, paso 2)
        'Entrega': 'hand-helping', 'Cierre': 'flag', 'Nota': 'message-square', 'Resguardo': 'archive', 'Cancelación de línea': 'phone-off', 'Venta': 'badge-dollar-sign',
        'Edición': 'file-pen-line', 'Comentario anterior': 'message-square-text', 'PDF firmado': 'file-up', 'PDF regenerado': 'refresh-ccw',
      };
      const COLOR_ORIGEN = { 'Nuevo sistema': 'verde', AppSheet: 'azul', Drive: 'neutro', 'Migración': 'neutro' };

      /** Botón visible dentro de una tabla que abre la ficha de una línea o un equipo (delegación data-ln-ir). */
      function botonIr(tipo, id, texto) {
        return '<a href="#" class="ln-ir-chip" data-ln-ir="' + tipo + '" data-id="' + esc(id) + '" title="Abrir ' +
          (tipo === 'linea' ? 'la línea' : 'el equipo') + '">' + ico(tipo === 'linea' ? 'card-sim' : 'smartphone') + '<span>' + esc(texto) + '</span>' +
          ico('chevron-right') + '</a>';
      }

      /**
       * A quién pertenece hoy un número, NUCO o IMEI (índice del inventario), para los cambios de línea y de equipo
       * del historial. Se arma una vez por historial.
       */
      function destinosInventario() {
        const ix = memoria.indice || { equipos: [], lineas: [] };
        const d = { numero: {}, nuco: {}, imei: {} };
        const digitos = (v) => String(v || '').replace(/\D/g, '');
        const nuco4 = (v) => { const t = String(v || '').trim(); return /^\d+$/.test(t) ? t.padStart(4, '0') : t.toUpperCase(); };
        ix.lineas.forEach((l) => { const n = digitos(l.numero); if (n && !(n in d.numero)) d.numero[n] = l.id; });
        ix.equipos.forEach((e) => {
          const n = nuco4(e.nuco); if (n && !(n in d.nuco)) d.nuco[n] = e.id;
          const i = digitos(e.imei); if (i && !(i in d.imei)) d.imei[i] = e.id;
        });
        return {
          /** { tipo, id } del registro que hoy tiene ese valor, o null. */
          de: (campo, valor) => {
            const c = String(campo || '').toUpperCase().trim();
            if (c === 'NUMERO TELEFONO') { const id = d.numero[digitos(valor)]; return id ? { tipo: 'linea', id: id } : null; }
            if (c === 'NUCO') { const id = d.nuco[nuco4(valor)]; return id ? { tipo: 'equipo', id: id } : null; }
            if (c === 'IMEI') { const id = d.imei[digitos(valor)]; return id ? { tipo: 'equipo', id: id } : null; }
            return null;
          },
        };
      }

      /** Opción del filtro Movimiento que cambia la tabla por la de asignaciones número ↔ NUCO. */
      const MOV_ASIGNACIONES = '__asignaciones';
      const TITULO_ASIGNACIONES = { equipo: 'Números que ha tenido', linea: 'Equipos en los que ha estado' };

      /** Las DataTable del historial escuchan eventos del documento: se destruyen al salir de la ficha. */
      function soltarHistorial() {
        if (tablaHistorial) tablaHistorial.destruir();
        if (tablaAsignaciones) tablaAsignaciones.destruir();
        tablaHistorial = null;
        tablaAsignaciones = null;
      }

      function cargarHistorial(id, nombre, vista) {
        if (nombre) nombreHistorial = nombre; else nombre = nombreHistorial;
        if (vista) vistaHistorial = vista; else vista = vistaHistorial;
        const abierta = pila[pila.length - 1];
        const sigue = () => vigente() && pila[pila.length - 1] === abierta;
        asignaciones = null;
        llamar('apiLineasHistorial', id).then((h) => {
          const cont = $('#ln-historial', raiz);
          if (!sigue() || !cont) return;
          pintarHistorial(cont, h.eventos || [], nombre);
        }).catch((e) => {
          const cont = $('#ln-historial', raiz);
          if (cont) cont.innerHTML = tarjeta(icono('history') + ' Historial', '<p class="error-msg">' + mensajeError(e) + '</p>');
        });
        // En paralelo: se reconstruye aparte porque recorre la bitácora de otras filas
        llamar('apiLineasAsignaciones', id, vista).catch((e) => ({ error: mensajeError(e) })).then((r) => {
          if (!sigue()) return;
          asignaciones = r;
          const cont = $('#ln-historial', raiz);
          if (!cont) return;
          const opcion = cont.querySelector('option[value="' + MOV_ASIGNACIONES + '"]');
          if (opcion) opcion.textContent = textoOpcionAsignaciones();
          const panel = $('#ln-asignaciones', cont);
          if (panel && !panel.hidden) pintarAsignaciones(panel);
        });
      }

      function textoOpcionAsignaciones() {
        const a = asignaciones;
        const n = !a ? ' (cargando…)' : (a.error ? '' : ' (' + miles((a.periodos || []).length) + ')');
        return TITULO_ASIGNACIONES[vistaHistorial] + n;
      }

      /** Grupos del filtro Movimiento, en orden fijo (lo que no esté aquí va a "Otros"). */
      const GRUPOS_MOVIMIENTO = [
        ['Responsable y ubicación', ['Entrega', 'Reasignación', 'Cambio de área o ubicación']],
        ['Equipo y línea', ['Edición', 'Cambio de equipo', 'Cambio de línea', 'Cambio de plan', 'Cambio de estatus', 'Cambio de accesos']],
        ['Documentos', ['Inspección', 'Responsiva', 'PDF firmado', 'PDF regenerado']],
        ['Resguardo, cancelación y bajas', ['Resguardo', 'Cancelación de línea', 'Venta', 'Cierre']],
        ['Notas', ['Nota', 'Comentario anterior']],
        ['Alta, reactivación y desecho', ['Alta de registro', 'Reactivación', 'Desecho']],
      ];

      /** Opciones del filtro: asignaciones arriba y luego cada grupo con sus movimientos presentes. */
      function opcionesMovimiento(conteo) {
        const opcion = (m) => '<option value="' + esc(m) + '">' + esc(m) + ' (' + miles(conteo[m]) + ')</option>';
        const agrupados = [].concat.apply([], GRUPOS_MOVIMIENTO.map((g) => g[1]));
        const otros = Object.keys(conteo).filter((m) => agrupados.indexOf(m) < 0).sort((a, b) => (a === 'Otros cambios') - (b === 'Otros cambios') || a.localeCompare(b));
        return '<optgroup label="Historial de asignaciones"><option value="' + MOV_ASIGNACIONES + '">' + esc(textoOpcionAsignaciones()) + '</option></optgroup>' +
          GRUPOS_MOVIMIENTO.concat([['Otros', otros]]).map((g) => {
            const presentes = g[1].filter((m) => conteo[m]);
            return presentes.length ? '<optgroup label="' + esc(g[0]) + '">' + presentes.map(opcion).join('') + '</optgroup>' : '';
          }).join('');
      }

      function pintarHistorial(cont, eventos, nombre) {
        contarEnPestana('historial', eventos.length);
        const conteo = contarPor(eventos, 'movimiento');
        cont.innerHTML = '<div class="card ln-card ln-historial">' +
          '<div class="ln-historial-cabecera"><h3>' + icono('history') + ' Historial (' + miles(eventos.length) + ')</h3></div>' +
          // Barra de filtros propia del historial: qué movimiento ver y, en asignaciones, ocultar las transiciones
          '<div class="ln-historial-filtros">' +
          '<label class="ln-historial-filtro">' + icono('list-filter') + '<span>Movimiento</span><select id="ln-historial-mov">' +
            '<option value="">Todos los movimientos (' + miles(eventos.length) + ')</option>' + opcionesMovimiento(conteo) +
          '</select></label>' +
          '<label class="ln-historial-check" id="ln-asig-ocultar" hidden><input type="checkbox" id="ln-asig-ocultar-check"' + (ocultarSinAsignar ? ' checked' : '') + ' />' +
            '<span>Ocultar «' + (vistaHistorial === 'equipo' ? 'Sin línea' : 'Sin equipo') + '»</span></label></div>' +
          '<div id="ln-historial-tabla">' + (eventos.length ? '' : '<p class="empty-state">Sin movimientos registrados.</p>') + '</div>' +
          '<div id="ln-asignaciones" hidden></div></div>';
        const select = $('#ln-historial-mov', cont);
        const principal = $('#ln-historial-tabla', cont);
        const panel = $('#ln-asignaciones', cont);
        const ocultar = $('#ln-asig-ocultar', cont);
        soltarHistorial();
        let tabla = null;
        const destinos = destinosInventario();
        const valorCambio = (columna) => (v, m) => {
          const destino = v ? destinos.de(m.campo, v) : null;
          return destino ? botonIr(destino.tipo, destino.id, v) : (formatoAppSheet('CAMBIOS', columna, v) || vacio);
        };
        // Un renglón por acción (paso 3, §5.5): cada cambio en su línea, CAMPO antes → después
        const cambiosHtml = (v, m) => (m.cambios && m.cambios.length ? '<div class="ln-cambios">' + m.cambios.map((c) =>
          '<div><span class="ln-cambio-campo">' + esc(c.campo) + '</span> ' + valorCambio('ANTES')(c.antes, c) + ' → ' + valorCambio('DESPUES')(c.despues, c) + '</div>').join('') + '</div>' : vacio);
        const textoLargo = (v) => (v ? '<span class="ln-texto-largo">' + esc(v) + '</span>' : vacio);
        $('#ln-asig-ocultar-check', cont).addEventListener('change', (ev) => {
          ocultarSinAsignar = ev.target.checked;
          if (tablaAsignaciones && asignaciones) tablaAsignaciones.setDatos(periodosVisibles(asignaciones));
        });
        select.addEventListener('change', () => {
          const verAsignaciones = select.value === MOV_ASIGNACIONES;
          principal.hidden = verAsignaciones;
          panel.hidden = !verAsignaciones;
          ocultar.hidden = !verAsignaciones;
          if (verAsignaciones) { if (!tablaAsignaciones) pintarAsignaciones(panel); else tablaAsignaciones.ajustarAlto(); return; }
          if (tabla) { tabla.setFiltro('movimiento', select.value ? { valores: [select.value] } : null); tabla.ajustarAlto(); }
        });
        if (!eventos.length) return;
        tabla = tablaHistorial = tablaLineas(principal, {
          idCampo: 'id',
          idTabla: 'lineas-historial-v2',
          tamanoPagina: 25,
          // Seleccionable (30-sep): Ver detalle, Ver inspección y Ver PDF van en la barra y el clic derecho.
          // Una fila a la vez: no hay acciones masivas
          seleccionUnica: true,
          ordenInicial: { campo: 'fecha', dir: 'desc' },
          textoVacio: 'Sin movimientos con esos filtros',
          exportar: { nombreArchivo: 'Historial ' + nombre, nombreHoja: 'Historial' },
          etiquetaFila: (m) => m.movimiento + ' · ' + fechaTabla(m.fecha),
          detalle: { titulo: (m) => m.movimiento + ' · ' + fechaTabla(m.fecha) },
          accionesFila: [
            { icono: 'clipboard-check', titulo: 'Ver inspección', visible: (m) => m.refTipo === 'inspeccion' && !!m.refId, alHacer: (m) => abrir('inspeccion', m.refId) },
            { icono: 'file-text', titulo: 'Ver PDF', visible: (m) => !!m.pdfId, alHacer: (m) => window.open('https:\/\/drive.google.com/file/d/' + encodeURIComponent(m.pdfId) + '/view', '_blank', 'noopener') },
          ],
          ayuda: 'Un renglón por acción, del AppSheet y del sistema nuevo. Responsable y estatus: los de ese momento.',
          alCambiarFiltros: (f) => {
            if (select.value === MOV_ASIGNACIONES) return;
            const valores = f && f.movimiento && f.movimiento.valores;
            select.value = valores && valores.length === 1 ? valores[0] : '';
          },
          columnas: [
            { campo: 'fecha', titulo: 'Fecha', tipo: 'lnFechaHora', fijada: true, ancho: 140 },
            { campo: 'movimiento', titulo: 'Movimiento', tipo: 'lista', ancho: 200, render: (v) => '<span class="ln-movimiento">' + ico(ICONO_MOVIMIENTO[v] || 'dot') + ' ' + esc(v) + '</span>' },
            { campo: 'comentario', titulo: 'Comentario', tipo: 'texto', ancho: 260, render: textoLargo },
            { campo: 'cambiosTexto', titulo: 'Cambios', tipo: 'texto', ancho: 340, render: cambiosHtml },
            { campo: 'responsable', titulo: 'Responsable', tipo: 'lista', ancho: 200 },
            { campo: 'estatusEquipo', titulo: 'Estatus equipo', tipo: 'lista', ancho: 140 },
            { campo: 'estatusLinea', titulo: 'Estatus línea', tipo: 'lista', ancho: 150 },
            { campo: 'ticket', titulo: 'Ticket', tipo: 'texto', ancho: 120 },
            { campo: 'detalle', titulo: 'Detalle', tipo: 'texto', ancho: 200, render: textoLargo },
            { campo: 'usuario', titulo: 'Usuario', tipo: 'lista', ancho: 190 },
            { campo: 'origen', titulo: 'Origen', tipo: 'lista', ancho: 130, render: (v) => chip(v, COLOR_ORIGEN[v] || 'neutro') },
          ],
        });
        tabla.setDatos(eventos);
      }

      /**
       * Movimiento "Números que ha tenido" / "Equipos en los que ha estado": un periodo por fila (desde, hasta y
       * por qué), reconstruido de la bitácora, con el botón para abrir el número o el NUCO de cada periodo.
       */
      function pintarAsignaciones(panel) {
        const a = asignaciones;
        if (tablaAsignaciones) { tablaAsignaciones.destruir(); tablaAsignaciones = null; }
        if (!a) { panel.innerHTML = '<p class="ln-tenue"><span class="ln-spinner"></span> Reconstruyendo los periodos desde la bitácora…</p>'; return; }
        if (a.error) { panel.innerHTML = '<p class="error-msg">' + a.error + '</p>'; return; }
        const porNuco = a.vista === 'equipo';
        if (!a.clave) {
          panel.innerHTML = '<p class="empty-state">' + (porNuco ? 'Este registro no tiene NUCO' : 'Esta línea no tiene número') + ': no hay periodos que reconstruir.</p>';
          return;
        }
        panel.innerHTML = (a.incompleto ? '<div class="ln-nota">' + icono('info') + ' Se muestran los primeros 25 registros relacionados.</div>' : '') +
          '<div class="ln-asignaciones-tabla"></div>';
        // La columna principal (el otro lado de la asignación) es un botón que abre su ficha si sigue en el inventario
        const numeroTexto = (v, p) => (!v ? '<span class="ln-tenue">' + (porNuco ? 'Sin línea' : 'Sin número') + '</span>'
          : (porNuco && p.irId ? botonIr('linea', p.irId, v) : '<span class="ln-mono">' + esc(v) + '</span>'));
        const nucoTexto = (v, p) => (!v ? '<span class="ln-tenue">Sin equipo (suelta)</span>'
          : (!porNuco && p.irId ? botonIr('equipo', p.irId, v) : '<span class="ln-mono">' + esc(v) + '</span>'));
        const columnaNumero = { campo: 'numero', titulo: 'Número', tipo: 'texto', ancho: 150, render: numeroTexto };
        const columnaNuco = { campo: 'nuco', titulo: 'NUCO', tipo: 'texto', ancho: 150, render: nucoTexto };
        const principal = porNuco ? columnaNumero : columnaNuco;
        principal.fijada = true;
        tablaAsignaciones = tablaLineas($('.ln-asignaciones-tabla', panel), {
          idCampo: 'id',
          idTabla: 'lineas-asignaciones-v1',
          tamanoPagina: 25,
          // Seleccionable para que "Ir al número / Ir al NUCO" salga en la barra y el clic derecho (sin columna, 30-sep)
          textoVacio: porNuco ? 'La bitácora no registra números para este NUCO' : 'La bitácora no registra equipos para este número',
          exportar: { nombreArchivo: (porNuco ? 'Números del NUCO ' : 'Equipos de la línea ') + a.clave, nombreHoja: 'Asignaciones' },
          etiquetaFila: (p) => (porNuco ? 'Número ' + (p.numero || 'sin línea') : 'NUCO ' + (p.nuco || 'sin equipo')),
          accionesFila: [
            { icono: porNuco ? 'card-sim' : 'smartphone', titulo: porNuco ? 'Ir al número' : 'Ir al NUCO', visible: (p) => !!p.irId,
              alHacer: (p) => abrir(porNuco ? 'linea' : 'equipo', p.irId) },
          ],
          ayuda: 'Un periodo por fila: desde cuándo y hasta cuándo estuvo ' + (porNuco ? 'cada número en este NUCO' : 'este número en cada NUCO') +
            '. "Actual" es lo que tiene hoy. ' + (porNuco ? '"Ir al número"' : '"Ir al NUCO"') + ' abre su ficha si sigue en el inventario.',
          columnas: [
            principal,
            porNuco ? columnaNuco : columnaNumero,
            { campo: 'desde', titulo: 'Desde', tipo: 'lnFechaHora', ancho: 150,
              render: (v, p) => esc(v ? fechaTabla(v) : (p.hasta ? 'Antes del ' + fecha(p.hasta) : 'Sin fecha')) },
            { campo: 'hasta', titulo: 'Hasta', tipo: 'lnFechaHora', ancho: 150,
              render: (v, p) => (p.vigente ? chip('Actual', 'verde') : (v ? esc(fechaTabla(v)) : '<span class="ln-tenue">' + (p.registroExiste ? 'Sin fecha' : 'Registro eliminado') + '</span>')) },
            { campo: 'motivo', titulo: 'Motivo', tipo: 'texto', ancho: 280, render: (v) => (v ? esc(v) : '<span class="ln-tenue">Sin motivo registrado</span>') },
            { campo: 'usuario', titulo: 'Usuario', tipo: 'lista', ancho: 190 },
            { campo: 'origen', titulo: 'Origen', tipo: 'lista', ancho: 130, render: (v) => (v ? chip(v, COLOR_ORIGEN[v] || 'neutro') : vacio) },
          ],
        });
        tablaAsignaciones.setDatos(periodosVisibles(a));
        pintarIconos(panel);
      }

      /** Periodos a mostrar: sin los "Sin línea" / "Sin equipo" si se pidió ocultarlos (no se borran). */
      function periodosVisibles(a) {
        const campo = a.vista === 'equipo' ? 'numero' : 'nuco';
        return (a.periodos || []).filter((p) => !ocultarSinAsignar || p[campo]);
      }

      // ---- Inspección ----
      function pintarInspeccion(detalle, id) {
        return llamar('apiLineasInspeccion', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'inspeccion' || pila[pila.length - 1].id !== id) return;
          const i = r.inspeccion;
          const e = r.equipo;
          const s = i.snapshot || {};
          const fotos = r.fotos || [];
          const firmas = r.firmas || [];
          const galeria = (lista) => '<div class="ln-galeria">' + lista.map((f) =>
            '<a class="ln-evidencia" target="_blank" rel="noopener" href="' + esc(f.enlace) + '">' +
            '<span class="ln-foto">' +
            (f.miniatura ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(f.miniatura) + '" alt="' + esc(f.nombre) + '">' : icono(f.video ? 'video' : 'image')) +
            '</span><span class="ln-evidencia-nombre">' + esc(f.nombre || 'Evidencia') + '<small>' + icono('external-link') + ' Abrir en Drive</small></span></a>').join('') + '</div>';
          const deDrive = i.origen === 'DRIVE';
          pila[pila.length - 1].etiqueta = 'Inspección' + (fecha(i.fecha) ? ' ' + fecha(i.fecha) : '');
          detalle.innerHTML = migas() +
            encabezado('clipboard-check', 'Inspección ' + esc(fecha(i.fecha) || ''),
              chip(ORIGEN_DOCUMENTO[i.origen] || i.origen, COLOR_ORIGEN_DOCUMENTO[ORIGEN_DOCUMENTO[i.origen]] || 'neutro') + (e ? chip('NUCO ' + (e.nuco || '—'), 'neutro') : ''),
              (e ? '<button type="button" class="ln-btn-icono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' Ver equipo</button>' : '') +
              (i.drive ? enlaceDrive(i.drive.carpetaId, 'Ver carpeta en Drive') : '') +
              (r.pdfs || []).map((p, indice) => enlaceDrive(p.id, 'Ver PDF' + (r.pdfs.length > 1 ? ' ' + (indice + 1) : ''), true)).join(''),
              deDrive
                ? [['NUCO', i.nuco || (e && e.nuco)], ['Fotos', miles(fotos.length)], ['PDF', (r.pdfs || []).length ? 'Sí' : 'No']]
                : [['Responsable', s.responsable], ['Inspector', i.inspector], ['Calificación', porcentaje(i.calificacion)], ['Fotos', miles(fotos.length)], ['Ticket', i.ticket]]) +
            (deDrive
              ? ''
              : '<div class="ln-grid-2">' +
                tarjeta(icono('user') + ' Responsable', campos([['Nombre', s.responsable], ['Departamento', s.departamento], ['Sede', s.sede], ['Puesto', s.puesto]])) +
                tarjeta(icono('smartphone') + ' Activo revisado', campos([['Número', s.numero], ['IMEI', s.imei], ['Modelo', s.modelo], ['Compañía', s.compania]])) +
                '</div>' +
                tarjeta(icono('message-square-text') + ' Observaciones', '<p class="ln-lectura-notas">' + esc(i.observaciones || 'Sin observaciones registradas.') + '</p>')) +
            tarjeta(icono('images') + ' Fotografías (' + fotos.length + ')',
              (fotos.length ? galeria(fotos) : '<p class="empty-state">No hay fotografías de esta inspección.</p>') +
              (r.puedeOperar ? '<div class="ln-fotos-despues"><h4>' + icono('image-plus') + ' Agregar fotos</h4>' +
                htmlSubirFotos('insp-fotos', deDrive
                  ? 'Se guardan en Drive, en la carpeta de la app (la de NUCOS es de solo consulta), y se ven aquí con las demás.'
                  : 'Se guardan en la carpeta FOTOS de esta inspección en Drive.') + '</div>' : ''));
          if (r.puedeOperar) {
            // Mejora: subir fotos a una inspección ya registrada (la carpeta se prepara al elegir la primera). Las de NUCOS
            // (solo lectura) van a una carpeta de la app ligada a la inspección (LineasCaptura.fotosInspeccion)
            let carpeta = null;
            const obtener = () => (carpeta = carpeta || llamar('apiLineasFotosInspeccion', id, 'preparar').then((c) => c.fotosCarpetaId));
            const terminar = () => llamar('apiLineasFotosInspeccion', id, 'actualizar').then(() => {
              aviso('Fotos agregadas a la inspección.', 4000);
              if (vigente() && pila.length && pila[pila.length - 1].id === id) abrir('inspeccion', id, true);
            }).catch((e) => aviso(icono('triangle-alert', 'ln-alerta') + ' ' + mensajeError(e), 8000));
            ['insp-fotos', 'insp-fotos-camara'].forEach((inputId) => manejarSubidaArchivo(inputId, 'insp-fotos-lista', obtener, true, () => {}, terminar, true));
          }
          detalle.querySelectorAll('.ln-evidencia img').forEach((img) => img.addEventListener('error', () => {
            img.parentElement.innerHTML = icono('image-off') + '<span>Vista previa no disponible</span>';
          }, { once: true }));
        });
      }

    }

    /** Desde una bitácora: abre el registro en Líneas Telefónicas. */
    function irARegistro(id) {
      memoria.abrirAlEntrar = id;
      navegarA('lineas-telefonicas', 'Líneas Telefónicas');
    }

    /** Desde el Panorama: abre Líneas Telefónicas en Equipos o Líneas, filtrada por un estatus. */
    function irConEstatus(modulo, estatus) {
      memoria.modulo = modulo;
      memoria.filtrarAlEntrar = estatus && estatus !== 'SIN ESTATUS' ? { modulo: modulo, estatus: estatus } : null;
      navegarA('lineas-telefonicas', 'Líneas Telefónicas');
    }

    // ======================================================================
    // Panorama de Líneas: equipos y líneas por estatus, hoy y al cierre de cada mes (apiLineasPanorama)
    // ======================================================================
    const MESES_CORTOS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const mesCorto = (ym) => MESES_CORTOS[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(2, 4);
    const mesLargo = (ym) => MESES_CORTOS[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4);
    const SERIES_PANORAMA = 7; // colores fijos (--lnp-s1…s7); el resto se junta en "OTROS"

    /** Techo "redondo" del eje y (1, 2, 2.5, 5 × 10^n) y sus marcas. */
    function ejeRedondo(maximo) {
      const max = Math.max(1, maximo);
      const bruto = max / 4;
      const pot = Math.pow(10, Math.floor(Math.log10(bruto)));
      const paso = [1, 2, 2.5, 5, 10].map((m) => m * pot).find((p) => p >= bruto);
      const techo = Math.ceil(max / paso) * paso;
      const marcas = [];
      for (let v = 0; v <= techo + 1e-9; v += paso) marcas.push(Math.round(v * 100) / 100);
      return { techo: techo, marcas: marcas };
    }

    // Grupos de estatus del Panorama (estatus del 30-sep; los valores viejos caen donde los manda la conversión)
    const GRUPO_LINEA = {
      'USO': 'uso', 'USO TEMPORAL': 'uso', 'RENOVADA': 'uso', 'EN ENVIO': 'uso', 'ESPERA DE RESPONSIVA': 'uso',
      'DISPONIBLE': 'disponible', 'RESGUARDO': 'disponible',
      'EN PROCESO DE CANCELACION': 'cancelacion',
      'CANCELADA': 'cancelada', 'CANCELADO': 'cancelada',
      'SIN LINEA': 'sin', 'SIN ESTATUS': 'sin', '': 'sin',
    }; // el resto (SUSPENDIDA, ESPERA DE EQUIPO…) = 'revisar'
    const COMPOSICION_LINEAS = [
      { clave: 'uso', nombre: 'En uso', color: 'var(--lnp-s1)', estatus: 'USO' },
      { clave: 'disponible', nombre: 'Disponibles', color: 'var(--lnp-s2)', estatus: 'DISPONIBLE' },
      { clave: 'cancelacion', nombre: 'En cancelación', color: 'var(--lnp-s3)', estatus: 'EN PROCESO DE CANCELACION' },
      { clave: 'revisar', nombre: 'Por revisar', color: 'var(--lnp-s4)', estatus: '' },
    ];
    const GRUPO_EQUIPO = {
      'USO': 'uso', 'EN ENVIO': 'uso', 'ESPERA DE RESPONSIVA': 'uso',
      'RESGUARDO': 'guardado', 'PARA VENTA': 'guardado', 'VENTA': 'guardado', 'POSIBLE VENTA': 'guardado',
      'PARA DESECHO': 'guardado', 'DESECHO': 'guardado',
      'VENDIDO': 'baja', 'DONADO': 'baja', 'DESECHADO': 'baja', 'EXTRAVIO-ROBO': 'baja', 'EXTRAVIADO': 'baja', 'ROBADO': 'baja', 'ROBO': 'baja',
    }; // el resto (FUERA DE INVENTARIO, CANCELADO, N/A…) = 'revisar'
    const CUENTAS = [
      { clave: 'TELCEL FRO', nombre: 'Telcel · FRO' }, { clave: 'TELCEL GPH', nombre: 'Telcel · GPH' }, { clave: 'AT&T', nombre: 'AT&T' },
      { clave: 'TELCEL', nombre: 'Telcel · sin razón social' }, { clave: '', nombre: 'Sin compañía' },
    ];
    const dinero = (n) => '$' + Math.round(n || 0).toLocaleString('es-MX');
    const dineroCorto = (n) => (Math.abs(n) >= 1e6 ? '$' + (n / 1e6).toLocaleString('es-MX', { maximumFractionDigits: 2 }) + ' M'
      : Math.abs(n) >= 1e4 ? '$' + (n / 1e3).toLocaleString('es-MX', { maximumFractionDigits: 1 }) + ' mil' : dinero(n));

    /**
     * El servidor manda los registros en columnas y el estatus de cada mes en corridas (LineasPanorama → registros):
     * aquí se regresan a un objeto por registro con su estatus por mes, que es lo que usa calcularResumen.
     */
    function expandirRegistros(R) {
      if (Array.isArray(R.lineas)) return R; // formato anterior (caché del servidor de antes del 1-oct)
      const meses = (s, n) => {
        if (typeof s === 'number') return new Array(n).fill(s);
        const salida = [];
        for (let i = 0; i < s.length; i += 2) for (let j = 0; j < s[i + 1]; j++) salida.push(s[i]);
        return salida;
      };
      const n = R.mesesTotal;
      const L = R.lineas;
      const E = R.equipos;
      return {
        dic: R.dic, deps: R.deps,
        lineas: L.s.map((s, i) => ({ c: R.cuentas[L.c[i]], b: L.b[i], d: L.d[i], p: L.p[i], f: R.fechas[L.f[i]], s: meses(s, n) })),
        equipos: E.s.map((s, i) => ({ d: E.d[i], s: meses(s, n) })),
      };
    }
    // Última respuesta del Panorama: al volver a entrar se pinta al instante y se actualiza por detrás. Se guarda
    // también en este navegador (solo conteos, departamentos y costos; sin nombres ni números) para la primera vez.
    const COPIA_PANORAMA = 'lineas.panorama.v3';
    let copiaPanorama = null;
    function leerCopiaPanorama() {
      if (copiaPanorama) return copiaPanorama;
      try { copiaPanorama = JSON.parse(localStorage.getItem(COPIA_PANORAMA) || 'null'); } catch (e) { copiaPanorama = null; }
      return copiaPanorama && copiaPanorama.meses && copiaPanorama.registros ? copiaPanorama : null;
    }
    function guardarCopiaPanorama(r) {
      copiaPanorama = r;
      try { localStorage.setItem(COPIA_PANORAMA, JSON.stringify(r)); } catch (e) { /* sin espacio o bloqueado: solo en memoria */ }
    }

    function initPanorama() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-panorama');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const est = {
        conjunto: 'equipos', rango: 12, forma: 'grafica', seleccion: { equipos: null, lineas: null }, datos: null,
        k: 0, medida: 'lineas', rangoTendencia: 12, deptosTodos: false, resumenes: null, series: {},
      };
      let tabla = null;

      const pct = (v, total) => (total ? (Math.round((v / total) * 1000) / 10).toLocaleString('es-MX') + '%' : '—');
      const esHoy = () => est.k === est.datos.meses.length - 1;
      const dosDigitos = (v) => String(v).padStart(2, '0');
      const ymd = (d) => d.getFullYear() + '-' + dosDigitos(d.getMonth() + 1) + '-' + dosDigitos(d.getDate());
      /** Fecha de corte del mes k ('yyyy-mm-dd'): hoy, o el último día del mes. */
      function corte(k) {
        if (k === est.datos.meses.length - 1) return ymd(new Date());
        const ym = est.datos.meses[k];
        return ymd(new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0));
      }
      const sumarDias = (txt, dias) => ymd(new Date(Number(txt.slice(0, 4)), Number(txt.slice(5, 7)) - 1, Number(txt.slice(8, 10)) + dias));

      /** Todo lo de la portada para el mes k, calculado con los registros (estatus de cada uno al cierre de ese mes). */
      function calcularResumen(k) {
        const R = est.datos.registros;
        const dic = R.dic;
        const r = {
          activas: 0, planes: 0, basicos: 0, renta: 0, grupos: { uso: 0, disponible: 0, cancelacion: 0, revisar: 0 },
          porCuenta: {}, porDepto: {}, vig: { vencido: 0, pronto: 0, vigente: 0, sinFecha: 0 },
          equipos: { total: 0, uso: 0, guardado: 0, baja: 0, revisar: 0 },
        };
        const hoy = corte(k);
        const en30 = sumarDias(hoy, 30);
        R.lineas.forEach((l) => {
          const s = l.s[k];
          if (s < 0) return;
          const g = GRUPO_LINEA[dic[s]] || 'revisar';
          if (g === 'cancelada' || g === 'sin') return;
          r.activas++;
          r.grupos[g]++;
          const dep = R.deps[l.d];
          const d = r.porDepto[dep] = r.porDepto[dep] || { lineas: 0, renta: 0 };
          d.lineas++;
          if (l.b) { r.basicos++; return; } // los SIM básicos no tienen adendum y su costo real sale de la factura
          r.planes++;
          r.renta += l.p || 0;
          d.renta += l.p || 0;
          const c = r.porCuenta[l.c] = r.porCuenta[l.c] || { lineas: 0, renta: 0, vencidas: 0 };
          c.lineas++;
          c.renta += l.p || 0;
          if (!l.f) r.vig.sinFecha++;
          else if (l.f < hoy) { r.vig.vencido++; c.vencidas++; }
          else if (l.f <= en30) r.vig.pronto++;
          else r.vig.vigente++;
        });
        R.equipos.forEach((e) => {
          const s = e.s[k];
          if (s < 0) return;
          r.equipos.total++;
          r.equipos[GRUPO_EQUIPO[dic[s]] || 'revisar']++;
        });
        return r;
      }
      const resumen = (k) => {
        if (!est.resumenes) est.resumenes = {};
        return est.resumenes[k] || (est.resumenes[k] = calcularResumen(k));
      };

      // ---------------- Filtro de mes ----------------

      function pintarSelectorMes() {
        const meses = est.datos.meses;
        const sel = $('#lnp-mes', raiz);
        sel.innerHTML = meses.map((ym, k) => k).reverse().map((k) =>
          '<option value="' + k + '"' + (k === est.k ? ' selected' : '') + '>' + esc(k === meses.length - 1 ? 'Hoy' : mesLargo(meses[k])) + '</option>').join('');
        sel.disabled = false;
        $('#lnp-filtro-nota', raiz).textContent = esHoy() ? '' : 'Estás viendo el cierre de ' + mesLargo(meses[est.k]) + '. El departamento, la cuenta y el costo de cada línea son los de hoy.';
      }

      function elegirMes(k) {
        if (!est.datos || k === est.k) return;
        est.k = Math.max(0, Math.min(est.datos.meses.length - 1, k));
        pintarTodo();
      }

      // ---------------- Portada ----------------

      function pintarPortada() {
        const r = resumen(est.k);
        const previo = est.k > 0 ? resumen(est.k - 1) : null;
        $('#lnp-activas', raiz).textContent = miles(r.activas);
        $('#lnp-activas-sub', raiz).innerHTML = '<strong>' + miles(r.planes) + '</strong> con plan · <strong>' + miles(r.basicos) + '</strong> SIM básicos';
        const delta = $('#lnp-delta', raiz);
        if (previo) {
          const dif = r.activas - previo.activas;
          delta.innerHTML = (dif ? ico(dif > 0 ? 'trending-up' : 'trending-down') + ' ' + (dif > 0 ? '+' : '−') + miles(Math.abs(dif)) : 'Sin cambio') +
            '<span> vs cierre de ' + esc(mesLargo(est.datos.meses[est.k - 1])) + '</span>';
        } else delta.innerHTML = '';

        // Composición: una barra apilada (parte del todo) + leyenda con número y porcentaje, que es la que se lee
        const grupos = COMPOSICION_LINEAS.filter((g) => r.grupos[g.clave] || g.clave !== 'revisar');
        $('#lnp-composicion', raiz).innerHTML =
          '<div class="lnp-pila" role="img" aria-label="' + esc(grupos.map((g) => g.nombre + ' ' + r.grupos[g.clave]).join(', ')) + '">' +
            grupos.filter((g) => r.grupos[g.clave]).map((g) => '<span class="lnp-pila-seg" style="flex-grow:' + r.grupos[g.clave] + ';background:' + g.color + '" title="' +
              esc(g.nombre + ': ' + miles(r.grupos[g.clave]) + ' (' + pct(r.grupos[g.clave], r.activas) + ')') + '"></span>').join('') +
          '</div><div class="lnp-leyenda">' +
            grupos.map((g) => '<button type="button" class="lnp-leyenda-item"' + (g.estatus && esHoy() ? ' data-lnp-ir="lineas" data-estatus="' + esc(g.estatus) + '" title="Ver en Líneas Telefónicas"' : ' disabled') + '>' +
              '<span class="lnp-leyenda-marca" style="background:' + g.color + '"></span><span class="lnp-leyenda-nombre">' + esc(g.nombre) + '</span>' +
              '<strong>' + miles(r.grupos[g.clave]) + '</strong><span class="lnp-leyenda-pct">' + pct(r.grupos[g.clave], r.activas) + '</span></button>').join('') +
          '</div>' + (r.grupos.revisar ? '<p class="lnp-nota">"Por revisar": estatus que ya no existen (por ejemplo SUSPENDIDA). Líneas los corrige en Correcciones de Líneas.</p>' : '');

        // Dinero por cuenta: lo que más pregunta dirección. Los SIM básicos van aparte, solo con su número.
        $('#lnp-renta', raiz).textContent = dinero(r.renta);
        $('#lnp-renta-sub', raiz).textContent = miles(r.planes) + ' planes activos · con el costo de plan del inventario (el del adendum)';
        const filas = CUENTAS.filter((c) => r.porCuenta[c.clave]).map((c) => {
          const x = r.porCuenta[c.clave];
          return '<tr><th scope="row">' + esc(c.nombre) + '</th><td>' + miles(x.lineas) + '</td><td>' + dinero(x.renta) + '</td>' +
            '<td>' + (x.vencidas ? '<span class="lnp-vencidas">' + miles(x.vencidas) + '</span>' : '<span class="ln-tenue">0</span>') + '</td></tr>';
        });
        $('#lnp-cuentas', raiz).innerHTML = '<table class="lnp-tabla-cuentas"><thead><tr><th scope="col">Cuenta</th><th scope="col">Líneas</th><th scope="col">Renta</th>' +
          '<th scope="col" title="Planes activos con el adendum vencido">Vencidas</th></tr></thead><tbody>' + filas.join('') +
          '<tr class="lnp-fila-basicos"><th scope="row">SIM básicos</th><td>' + miles(r.basicos) + '</td><td colspan="2" class="ln-tenue">Sin adendum; su costo sale de la factura</td></tr>' +
          '</tbody></table>';

        // Vigencia de los adendums de los planes activos
        const v = r.vig;
        const tile = (icono, valor, etiqueta, clase, titulo) => ({ icono: icono, valor: miles(valor), etiqueta: etiqueta, clase: clase, filtros: false, titulo: titulo });
        tilesKpi($('#lnp-vigencia', raiz), [
          tile('circle-alert', v.vencido, 'Con el adendum vencido · ' + pct(v.vencido, r.planes), 'stat-tile-warn'),
          tile('clock', v.pronto, 'Vencen en los siguientes 30 días'),
          tile('circle-check', v.vigente, 'Vigentes', 'stat-tile-ok'),
          tile('circle-help', v.sinFecha, 'Sin fecha de fin de adendum'),
        ], () => null);

        // Departamentos: líneas activas y renta de sus planes
        const deps = Object.keys(r.porDepto).map((d) => [d, r.porDepto[d]]).sort((a, b) => b[1].lineas - a[1].lineas || a[0].localeCompare(b[0]));
        const visibles = est.deptosTodos ? deps : deps.slice(0, 10);
        const max = deps.length ? deps[0][1].lineas : 1;
        $('#lnp-deptos-total', raiz).textContent = miles(deps.length) + ' departamentos';
        $('#lnp-deptos', raiz).innerHTML = (visibles.length ? '<div class="lnp-depto lnp-depto-cabeza"><span>Departamento</span><span></span><span>Líneas</span><span>Renta</span></div>' : '') +
          (visibles.map(([d, x]) =>
            '<div class="lnp-depto"><span class="lnp-barra-nombre" title="' + esc(d) + '">' + esc(d) + '</span>' +
              '<span class="lnp-barra-pista"><span class="lnp-barra-valor" style="width:' + Math.max(1.5, (x.lineas / max) * 100) + '%"></span></span>' +
              '<span class="lnp-barra-num">' + miles(x.lineas) + '</span><span class="lnp-barra-pct">' + esc(dineroCorto(x.renta)) + '</span></div>').join('') ||
          '<p class="ln-tenue">Sin líneas activas.</p>');
        const mas = $('#lnp-deptos-mas', raiz);
        mas.hidden = deps.length <= 10;
        mas.textContent = est.deptosTodos ? 'Ver solo los 10 primeros' : 'Ver los ' + miles(deps.length);

        // Equipos
        const e = r.equipos;
        tilesKpi($('#lnp-kpis-equipos', raiz), [
          tile('smartphone', e.total, 'Equipos registrados'),
          tile('circle-check', e.uso, 'En uso · ' + pct(e.uso, e.total), 'stat-tile-ok'),
          tile('archive', e.guardado, 'Guardados', '', 'Resguardo, para venta, posible venta-daño o para desecho'),
          tile('package-x', e.baja, 'Ya no están', '', 'Vendidos, donados, extraviados o robados y desechados'),
          tile('circle-help', e.revisar, 'Por revisar', e.revisar ? 'stat-tile-warn' : '', 'Fuera de inventario, cancelados y otros estatus que ya no existen: se corrigen en Correcciones de Líneas'),
        ], () => null);
      }

      // ---------------- Tendencia ----------------

      /** Serie de la tendencia: líneas activas o renta de los planes al cierre de cada mes (se calcula una vez). */
      function serieTendencia() {
        if (!est.series[est.medida]) est.series[est.medida] = est.datos.meses.map((_, k) => (est.medida === 'renta' ? resumen(k).renta : resumen(k).activas));
        return est.series[est.medida];
      }

      /** Una sola serie con su área, el mes elegido marcado y clic para elegir otro mes. */
      function pintarTendencia() {
        const cont = $('#lnp-tendencia', raiz);
        const todos = est.datos.meses;
        const desde = est.rangoTendencia ? Math.max(0, todos.length - est.rangoTendencia) : 0;
        const meses = todos.slice(desde);
        const valores = serieTendencia().slice(desde);
        const esRenta = est.medida === 'renta';
        $('#lnp-tendencia-titulo', raiz).innerHTML = ico('chart-line') + ' ' + (esRenta ? 'Renta mensual de los planes' : 'Líneas activas') + ' al cierre de cada mes';
        const fmt = esRenta ? dineroCorto : miles;
        const ancho = Math.max(280, cont.clientWidth || 520);
        const angosto = ancho < 480;
        const m = { arriba: 24, derecha: 18, abajo: 30, izquierda: esRenta ? 70 : 46 };
        const alto = 250;
        const w = ancho - m.izquierda - m.derecha;
        const h = alto - m.arriba - m.abajo;
        const eje = ejeRedondo(Math.max(1, ...valores));
        const x = (k) => m.izquierda + (meses.length === 1 ? w / 2 : (k * w) / (meses.length - 1));
        const y = (v) => m.arriba + h - (v / eje.techo) * h;
        const cadaCuanto = Math.max(1, Math.ceil(meses.length / (angosto ? 4 : 7)));
        const sel = est.k - desde;
        let svg = '<svg class="lnp-svg" viewBox="0 0 ' + ancho + ' ' + alto + '" width="' + ancho + '" height="' + alto + '" role="img" tabindex="0" aria-label="' +
          esc((esRenta ? 'Renta mensual' : 'Líneas activas') + ' al cierre de cada mes. Flechas para recorrer y Enter para ver ese mes.') + '">';
        eje.marcas.forEach((v) => {
          svg += '<line class="lnp-rejilla" x1="' + m.izquierda + '" x2="' + (m.izquierda + w) + '" y1="' + y(v) + '" y2="' + y(v) + '"></line>' +
            '<text class="lnp-eje" x="' + (m.izquierda - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + esc(fmt(v)) + '</text>';
        });
        meses.forEach((ym, k) => {
          const ultimo = meses.length - 1;
          if (k !== ultimo && (k % cadaCuanto || ultimo - k < Math.max(2, cadaCuanto))) return;
          svg += '<text class="lnp-eje" x="' + x(k) + '" y="' + (alto - 8) + '" text-anchor="middle">' + esc(k === ultimo ? 'Hoy' : mesCorto(ym)) + '</text>';
        });
        const puntos = valores.map((v, k) => x(k).toFixed(1) + ' ' + y(v).toFixed(1));
        svg += '<path class="lnp-area" d="M' + puntos.join(' L') + ' L' + x(valores.length - 1).toFixed(1) + ' ' + y(0) + ' L' + x(0).toFixed(1) + ' ' + y(0) + ' Z"></path>';
        svg += '<path class="lnp-linea" d="M' + puntos.join(' L') + '" style="stroke:var(--lnp-s1)"></path>';
        if (sel >= 0 && sel < valores.length) {
          svg += '<line class="lnp-marca-mes" x1="' + x(sel) + '" x2="' + x(sel) + '" y1="' + m.arriba + '" y2="' + (m.arriba + h) + '"></line>' +
            '<circle class="lnp-punto" cx="' + x(sel) + '" cy="' + y(valores[sel]) + '" r="5" style="fill:var(--lnp-s1)"></circle>' +
            '<text class="lnp-etiqueta" x="' + Math.min(Math.max(x(sel), m.izquierda + 34), m.izquierda + w - 34) + '" y="' + Math.max(14, y(valores[sel]) - 12) + '" text-anchor="middle">' +
              '<tspan class="lnp-etiqueta-valor">' + esc(fmt(valores[sel])) + '</tspan></text>';
        }
        svg += '<line class="lnp-cruz" y1="' + m.arriba + '" y2="' + (m.arriba + h) + '" hidden></line>';
        svg += '<rect class="lnp-captura lnp-captura-clic" x="' + m.izquierda + '" y="' + m.arriba + '" width="' + w + '" height="' + h + '"></rect></svg>';
        cont.innerHTML = svg + '<div class="lnp-tooltip" hidden></div>';

        const lienzo = cont.querySelector('svg');
        const cruz = cont.querySelector('.lnp-cruz');
        const tip = cont.querySelector('.lnp-tooltip');
        let actual = -1;
        const mostrar = (k) => {
          actual = k;
          cruz.setAttribute('x1', x(k)); cruz.setAttribute('x2', x(k)); cruz.removeAttribute('hidden');
          tip.innerHTML = '<div class="lnp-tooltip-mes">' + esc(k === meses.length - 1 ? 'Hoy' : 'Cierre de ' + mesLargo(meses[k])) + '</div>' +
            '<div class="lnp-tooltip-fila"><span class="lnp-tooltip-clave" style="background:var(--lnp-s1)"></span><strong>' + esc(esRenta ? dinero(valores[k]) : miles(valores[k])) + '</strong>' +
            '<span>' + (esRenta ? 'de renta' : 'líneas activas') + '</span></div><div class="lnp-tooltip-pie">Clic para ver ese mes</div>';
          tip.hidden = false;
          const escala = lienzo.getBoundingClientRect().width / ancho;
          const px = x(k) * escala;
          tip.style.left = Math.min(Math.max(0, px + 12), cont.clientWidth - tip.offsetWidth) + 'px';
          if (px + 12 + tip.offsetWidth > cont.clientWidth) tip.style.left = Math.max(0, px - tip.offsetWidth - 12) + 'px';
          tip.style.top = '6px';
        };
        const ocultar = () => { actual = -1; cruz.setAttribute('hidden', ''); tip.hidden = true; };
        const cercano = (ev) => {
          const r = lienzo.getBoundingClientRect();
          const px = ((ev.clientX - r.left) / r.width) * ancho;
          return Math.max(0, Math.min(meses.length - 1, Math.round(((px - m.izquierda) / (w || 1)) * (meses.length - 1))));
        };
        lienzo.addEventListener('pointermove', (ev) => mostrar(cercano(ev)));
        lienzo.addEventListener('pointerleave', ocultar);
        lienzo.addEventListener('click', (ev) => elegirMes(desde + cercano(ev)));
        lienzo.addEventListener('focus', () => mostrar(Math.max(0, sel)));
        lienzo.addEventListener('blur', ocultar);
        lienzo.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' && actual >= 0) { ev.preventDefault(); elegirMes(desde + actual); return; }
          if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
          ev.preventDefault();
          mostrar(Math.max(0, Math.min(meses.length - 1, (actual < 0 ? meses.length - 1 : actual) + (ev.key === 'ArrowLeft' ? -1 : 1))));
        });
      }

      // ---------------- Equipos y líneas por estatus (al cierre del mes elegido) ----------------

      /** Una barra por estatus (un solo color: se compara cantidad). Clic = ver esos registros (solo con "Hoy"). */
      function pintarBarras(conjunto) {
        const b = est.datos[conjunto];
        const filas = Object.keys(b.historico).map((s) => [s, (b.historico[s] || [])[est.k] || 0]).filter((f) => f[1])
          .sort((a, c) => c[1] - a[1] || a[0].localeCompare(c[0]));
        const total = filas.reduce((t, f) => t + f[1], 0);
        const max = filas.length ? filas[0][1] : 1;
        const clic = esHoy();
        $('#lnp-total-' + conjunto, raiz).textContent = miles(total) + ' en total';
        $('#lnp-barras-' + conjunto, raiz).innerHTML = filas.length ? filas.map(([s, v]) =>
          '<button type="button" class="lnp-barra"' + (clic ? ' data-lnp-ir="' + conjunto + '" data-estatus="' + esc(s) + '" title="Ver ' + esc(s) + ' en Líneas Telefónicas"' : ' disabled') + '>' +
            '<span class="lnp-barra-nombre">' + esc(s) + '</span>' +
            '<span class="lnp-barra-pista"><span class="lnp-barra-valor" style="width:' + Math.max(1.5, (v / max) * 100) + '%"></span></span>' +
            '<span class="lnp-barra-num">' + miles(v) + '</span><span class="lnp-barra-pct">' + pct(v, total) + '</span></button>').join('')
          : '<p class="ln-tenue">Sin registros.</p>';
      }

      // ---------------- Detalle por estatus, mes a mes ----------------

      /** Estatus del conjunto en orden fijo (más registros hoy primero); los 7 primeros tienen color, el resto va a OTROS. */
      function seriesDe(conjunto) {
        const b = est.datos[conjunto];
        const nombres = Object.keys(Object.assign({}, b.historico, b.actual));
        const ultimo = (s) => (b.historico[s] || []).reduce((m, v) => Math.max(m, v), 0);
        nombres.sort((a, c) => ((b.actual[c] || 0) - (b.actual[a] || 0)) || (ultimo(c) - ultimo(a)) || a.localeCompare(c));
        const conColor = nombres.slice(0, SERIES_PANORAMA);
        const resto = nombres.slice(SERIES_PANORAMA);
        const series = conColor.map((s, i) => ({ clave: s, nombre: s, color: 'var(--lnp-s' + (i + 1) + ')', valores: b.historico[s] || est.datos.meses.map(() => 0) }));
        if (resto.length) {
          series.push({
            clave: '__OTROS', nombre: 'OTROS (' + resto.length + ')', color: 'var(--lnp-otros)', detalle: resto,
            valores: est.datos.meses.map((_, k) => resto.reduce((s, x) => s + ((b.historico[x] || [])[k] || 0), 0)),
          });
        }
        return series;
      }

      function mesesVisibles() {
        const todos = est.datos.meses;
        const desde = est.rango ? Math.max(0, todos.length - est.rango) : 0;
        return { desde: desde, meses: todos.slice(desde) };
      }

      function pintarChips(series) {
        const sel = est.seleccion[est.conjunto];
        $('#lnp-chips', raiz).innerHTML = series.map((s) =>
          '<button type="button" class="lnp-chip' + (sel.indexOf(s.clave) >= 0 ? ' activo' : '') + '" data-serie="' + esc(s.clave) + '" aria-pressed="' + (sel.indexOf(s.clave) >= 0) + '"' +
            (s.detalle ? ' title="' + esc(s.detalle.join(', ')) + '"' : '') + '>' +
            '<span class="lnp-chip-marca" style="background:' + s.color + '"></span>' + esc(s.nombre) + '</button>').join('');
      }

      /** Líneas por estatus al cierre de cada mes, con cruz que sigue al puntero y etiqueta al final de cada línea. */
      function pintarGrafica(series) {
        const cont = $('#lnp-grafica', raiz);
        const { desde, meses } = mesesVisibles();
        const visibles = series.filter((s) => est.seleccion[est.conjunto].indexOf(s.clave) >= 0).map((s) => Object.assign({}, s, { valores: s.valores.slice(desde) }));
        if (!visibles.length) { cont.innerHTML = '<p class="ln-tenue lnp-vacio">Elige al menos un estatus arriba.</p>'; return; }
        const ancho = Math.max(300, cont.clientWidth || 700);
        const angosto = ancho < 560;
        const m = { arriba: 14, derecha: angosto ? 12 : 150, abajo: 30, izquierda: 44 };
        const alto = 300;
        const w = ancho - m.izquierda - m.derecha;
        const h = alto - m.arriba - m.abajo;
        const eje = ejeRedondo(visibles.reduce((mx, s) => Math.max(mx, ...s.valores), 0));
        const x = (k) => m.izquierda + (meses.length === 1 ? w / 2 : (k * w) / (meses.length - 1));
        const y = (v) => m.arriba + h - (v / eje.techo) * h;
        const cadaCuanto = Math.max(1, Math.ceil(meses.length / (angosto ? 4 : 8)));

        let svg = '<svg class="lnp-svg" viewBox="0 0 ' + ancho + ' ' + alto + '" width="' + ancho + '" height="' + alto + '" role="img" aria-label="' +
          esc((est.conjunto === 'equipos' ? 'Equipos' : 'Líneas') + ' por estatus al cierre de cada mes') + '" tabindex="0">';
        eje.marcas.forEach((v) => {
          svg += '<line class="lnp-rejilla" x1="' + m.izquierda + '" x2="' + (m.izquierda + w) + '" y1="' + y(v) + '" y2="' + y(v) + '"></line>' +
            '<text class="lnp-eje" x="' + (m.izquierda - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + miles(v) + '</text>';
        });
        meses.forEach((ym, k) => {
          const ultimo = meses.length - 1;
          if (k !== ultimo && (k % cadaCuanto || ultimo - k < Math.max(2, cadaCuanto))) return; // sin encimarse con "Hoy"
          svg += '<text class="lnp-eje" x="' + x(k) + '" y="' + (alto - 8) + '" text-anchor="middle">' + esc(k === meses.length - 1 ? 'Hoy' : mesCorto(ym)) + '</text>';
        });
        visibles.forEach((s) => {
          const d = s.valores.map((v, k) => (k ? 'L' : 'M') + x(k).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
          svg += '<path class="lnp-linea" d="' + d + '" style="stroke:' + s.color + '"></path>';
          const u = s.valores.length - 1;
          svg += '<circle class="lnp-punto" cx="' + x(u) + '" cy="' + y(s.valores[u]) + '" r="4" style="fill:' + s.color + '"></circle>';
        });
        // Etiquetas al final: las de más valor primero; si chocan, la otra se queda en la leyenda y el tooltip
        if (!angosto) {
          const puestas = [];
          visibles.slice().sort((a, b) => b.valores[b.valores.length - 1] - a.valores[a.valores.length - 1]).forEach((s) => {
            const v = s.valores[s.valores.length - 1];
            const yy = y(v);
            if (puestas.some((p) => Math.abs(p - yy) < 15)) return;
            puestas.push(yy);
            svg += '<text class="lnp-etiqueta" x="' + (m.izquierda + w + 10) + '" y="' + (yy + 4) + '"><tspan class="lnp-etiqueta-valor">' + miles(v) + '</tspan> ' +
              esc(s.nombre.length > 16 ? s.nombre.slice(0, 15) + '…' : s.nombre) + '</text>';
          });
        }
        svg += '<line class="lnp-cruz" y1="' + m.arriba + '" y2="' + (m.arriba + h) + '" hidden></line>';
        svg += '<rect class="lnp-captura" x="' + m.izquierda + '" y="' + m.arriba + '" width="' + w + '" height="' + h + '"></rect></svg>';
        cont.innerHTML = svg + '<div class="lnp-tooltip" hidden></div>';

        // Tooltip: el mes más cercano al puntero y el valor de todas las series visibles
        const lienzo = cont.querySelector('svg');
        const cruz = cont.querySelector('.lnp-cruz');
        const tip = cont.querySelector('.lnp-tooltip');
        let actual = -1;
        const mostrar = (k) => {
          actual = k;
          cruz.setAttribute('x1', x(k)); cruz.setAttribute('x2', x(k)); cruz.removeAttribute('hidden');
          const filas = visibles.map((s) => [s, s.valores[k]]).sort((a, b) => b[1] - a[1]);
          tip.innerHTML = '<div class="lnp-tooltip-mes">' + esc(k === meses.length - 1 ? 'Hoy' : 'Cierre de ' + mesLargo(meses[k])) + '</div>' +
            filas.map(([s, v]) => '<div class="lnp-tooltip-fila"><span class="lnp-tooltip-clave" style="background:' + s.color + '"></span><strong>' + miles(v) + '</strong><span>' + esc(s.nombre) + '</span></div>').join('');
          tip.hidden = false;
          const escala = lienzo.getBoundingClientRect().width / ancho;
          const px = x(k) * escala;
          tip.style.left = Math.min(Math.max(0, px + 12), cont.clientWidth - tip.offsetWidth) + 'px';
          if (px + 12 + tip.offsetWidth > cont.clientWidth) tip.style.left = Math.max(0, px - tip.offsetWidth - 12) + 'px';
          tip.style.top = '8px';
        };
        const ocultar = () => { actual = -1; cruz.setAttribute('hidden', ''); tip.hidden = true; };
        const cercano = (ev) => {
          const r = lienzo.getBoundingClientRect();
          const px = ((ev.clientX - r.left) / r.width) * ancho;
          return Math.max(0, Math.min(meses.length - 1, Math.round(((px - m.izquierda) / (w || 1)) * (meses.length - 1))));
        };
        lienzo.addEventListener('pointermove', (ev) => mostrar(cercano(ev)));
        lienzo.addEventListener('pointerleave', ocultar);
        lienzo.addEventListener('focus', () => mostrar(meses.length - 1));
        lienzo.addEventListener('blur', ocultar);
        lienzo.addEventListener('keydown', (ev) => {
          if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
          ev.preventDefault();
          mostrar(Math.max(0, Math.min(meses.length - 1, (actual < 0 ? meses.length - 1 : actual) + (ev.key === 'ArrowLeft' ? -1 : 1))));
        });
      }

      /** Tabla: un renglón por mes y una columna por estatus (todos, no solo los elegidos). Exportable a Excel. */
      function pintarTabla(series) {
        const cont = $('#lnp-tabla', raiz);
        if (tabla) { tabla.destruir(); tabla = null; }
        cont.innerHTML = '<div></div>';
        const { desde, meses } = mesesVisibles();
        const b = est.datos[est.conjunto];
        const nombres = series.reduce((l, s) => l.concat(s.detalle || [s.clave]), []);
        const filas = meses.map((ym, k) => {
          const f = { _id: ym, mes: k === meses.length - 1 ? 'Hoy (' + mesLargo(ym) + ')' : mesLargo(ym), orden: ym };
          let total = 0;
          nombres.forEach((s) => { const v = (b.historico[s] || [])[desde + k] || 0; f[s] = v; total += v; });
          f._total = total;
          return f;
        });
        tabla = tablaLineas(cont.firstChild, {
          idCampo: '_id', idTabla: 'lineas-panorama-' + est.conjunto + '-v1', seleccionable: false, detalle: false,
          columnas: [{ campo: 'orden', titulo: 'Mes', tipo: 'texto', fijada: true, render: (v, f) => esc(f.mes), valorExportar: (f) => f.mes }]
            .concat(nombres.map((s) => ({ campo: s, titulo: s, tipo: 'numero' })))
            .concat([{ campo: '_total', titulo: 'Total', tipo: 'numero' }]),
          ordenInicial: { campo: 'orden', dir: 'desc' },
          exportar: { nombreArchivo: 'Panorama ' + (est.conjunto === 'equipos' ? 'equipos' : 'lineas') + ' por estatus', nombreHoja: 'Por mes' },
          textoVacio: 'Sin datos',
        });
        tabla.setDatos(filas);
      }

      function pintarEvolucion() {
        const series = seriesDe(est.conjunto);
        if (!est.seleccion[est.conjunto]) est.seleccion[est.conjunto] = series.slice(0, 4).map((s) => s.clave);
        pintarChips(series);
        $('#lnp-grafica', raiz).hidden = est.forma !== 'grafica';
        $('#lnp-chips', raiz).hidden = est.forma !== 'grafica';
        $('#lnp-tabla', raiz).hidden = est.forma !== 'tabla';
        if (est.forma === 'grafica') pintarGrafica(series); else pintarTabla(series);
        const d = est.datos;
        $('#lnp-nota', raiz).textContent = d.desde
          ? 'Al cierre de cada mes, reconstruido con la bitácora de cambios de estatus (' + miles(d.cambiosDeEstatus) + ' cambios desde ' + fecha(d.desde) +
            '). Antes de su primer cambio registrado, cada registro conserva el estatus que tenía; cuenta desde su fecha de registro. El último punto es hoy.'
          : 'La bitácora no tiene cambios de estatus: solo se muestra el estatus de hoy.';
      }

      function pintarTodo() {
        pintarSelectorMes();
        pintarPortada();
        pintarTendencia();
        pintarBarras('equipos');
        pintarBarras('lineas');
        pintarEvolucion();
        $('#lnp-generado', raiz).textContent = 'Datos de la hoja al ' + fechaHora(est.datos.generadoEn) + ' (se guardan 30 min; "Actualizar" los vuelve a calcular).';
        refreshIcons();
      }

      /** Pinta una respuesta del servidor; si es la misma serie de meses, se queda en el mes que se estaba viendo. */
      function mostrar(r) {
        const mismosMeses = est.datos && est.datos.meses.join() === r.meses.join();
        est.datos = Object.assign({}, r, { registros: expandirRegistros(Object.assign({ mesesTotal: r.meses.length }, r.registros)) });
        if (!mismosMeses) est.k = r.meses.length - 1;
        est.resumenes = null;
        est.series = {};
        pintarTodo();
      }

      async function cargar(forzar) {
        const boton = $('#lnp-actualizar', raiz);
        boton.disabled = true;
        const copia = !forzar && !est.datos ? leerCopiaPanorama() : null;
        if (copia) {
          mostrar(copia);
          raiz.classList.add('lnp-refrescando');
          $('#lnp-generado', raiz).textContent = 'Datos al ' + fechaHora(copia.generadoEn) + ' · actualizando…';
        } else {
          raiz.classList.add('lnp-cargando');
        }
        try {
          const r = await llamar('apiLineasPanorama', !!forzar);
          if (!vigente()) return;
          guardarCopiaPanorama(r);
          mostrar(r);
        } catch (e) {
          if (!vigente()) return;
          if (est.datos) Notificar.error('No se pudo actualizar el panorama: ' + mensajeError(e));
          else $('#lnp-activas', raiz).innerHTML = '<span class="error-msg">No se pudo cargar el panorama: ' + esc(mensajeError(e)) + '</span>';
        } finally {
          boton.disabled = false;
          raiz.classList.remove('lnp-cargando', 'lnp-refrescando');
        }
      }

      const segmentado = (id, alElegir, repintar) => $(id, raiz).addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-valor]');
        if (!b || !est.datos) return;
        $(id, raiz).querySelectorAll('[data-valor]').forEach((x) => { x.classList.toggle('activo', x === b); x.setAttribute('aria-pressed', String(x === b)); });
        alElegir(b.dataset.valor);
        repintar();
      });
      segmentado('#lnp-medida', (v) => { est.medida = v; }, pintarTendencia);
      segmentado('#lnp-rango-tendencia', (v) => { est.rangoTendencia = Number(v); }, pintarTendencia);
      segmentado('#lnp-conjunto', (v) => { est.conjunto = v; }, pintarEvolucion);
      segmentado('#lnp-rango', (v) => { est.rango = Number(v); }, pintarEvolucion);
      segmentado('#lnp-forma', (v) => { est.forma = v; }, pintarEvolucion);
      $('#lnp-mes', raiz).addEventListener('change', (ev) => elegirMes(Number(ev.target.value)));
      $('#lnp-deptos-mas', raiz).addEventListener('click', () => { est.deptosTodos = !est.deptosTodos; pintarPortada(); refreshIcons(); });
      $('#lnp-chips', raiz).addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-serie]');
        if (!b) return;
        const sel = est.seleccion[est.conjunto];
        const i = sel.indexOf(b.dataset.serie);
        if (i >= 0) sel.splice(i, 1); else sel.push(b.dataset.serie);
        pintarEvolucion();
      });
      const ir = (ev) => {
        const b = ev.target.closest('[data-lnp-ir]');
        if (b && !b.disabled) irConEstatus(b.dataset.lnpIr, b.dataset.estatus);
      };
      raiz.addEventListener('click', ir);
      raiz.addEventListener('keydown', (ev) => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.stat-tile[data-lnp-ir]')) { ev.preventDefault(); ir(ev); } });
      $('#lnp-actualizar', raiz).addEventListener('click', () => cargar(true));
      let espera = null;
      const alRedimensionar = () => {
        if (!vigente()) { window.removeEventListener('resize', alRedimensionar); return; }
        clearTimeout(espera);
        espera = setTimeout(() => {
          if (!est.datos) return;
          pintarTendencia();
          if (est.forma === 'grafica') pintarGrafica(seriesDe(est.conjunto));
        }, 150);
      };
      window.addEventListener('resize', alRedimensionar);
      cargar(false);
    }

    // ======================================================================
    // Gestión de Activos: busca un colaborador y muestra sus líneas/equipos
    // (vehículos, hologramas, Uber y cajas chicas se integran con los demás módulos)
    // ======================================================================

    function initGestionActivos() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-gestion-activos');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const paso = 48;
      pintarIconos(raiz);

      let colaboradores = [];
      let filtrados = [];
      let visibles = paso;
      let temporizador = null;

      function filasPorResponsable(indice, nombre) {
        const texto = normal(nombre);
        return {
          equipos: indice.equipos.filter((r) => normal(r.responsable) === texto),
          lineas: indice.lineas.filter((r) => r.suelta && normal(r.responsable) === texto),
        };
      }

      function tarjetaLineas(nombre, datos) {
        const filaEq = (r) => '<tr class="ln-fila-clic" data-ir="' + esc(r.id) + '"><td><button type="button" class="ln-btn-icono" data-ir="' + esc(r.id) + '">' + icono('smartphone') + ' NUCO ' + guion(r.nuco) + ' ' + icono('chevron-right') + '</button></td><td>' +
          esc(TIPO_EQUIPO[r.tipo] || r.tipo || '') + '</td><td>' + guion(r.modelo) + '</td><td>' + chip(r.estatus) + '</td><td class="ln-mono">' +
