    function initBitacora(tipo) {
      const n = ++montaje;
      const cfg = BITACORAS[tipo];
      const raiz = document.getElementById('ln-bitacora');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const consulta = { q: '', pagina: 0 };
      let ultima = null;

      $('#ln-bit-titulo', raiz).textContent = cfg.titulo;
      $('#ln-bit-subtitulo', raiz).textContent = cfg.subtitulo;
      $('#ln-bit-icono', raiz).innerHTML = icono(cfg.icono);
      $('#ln-bit-titulo-icono', raiz).innerHTML = icono(cfg.icono);
      pintarIconos(raiz);

      const norm = (h) => String(h || '').toUpperCase().replace(/\s+/g, ' ').trim();
      const buscarEncabezado = (encabezados, nombre) => encabezados.find((h) => norm(h) === norm(nombre));
      const valorCelda = (h, v) => {
        if (v === null || v === undefined || v === '') return vacio;
        if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) {
          const d = new Date(v);
          return esc(d.getHours() || d.getMinutes() ? fechaHora(v) : fecha(v)); // sin hora capturada: solo la fecha
        }
        return esc(v);
      };

      function cargar() {
        const tbody = $('#ln-bit-tbody', raiz);
        tbody.innerHTML = '<tr><td class="empty-state"><span class="ln-spinner"></span> Cargando…</td></tr>';
        $('#ln-bit-error', raiz).hidden = true;
        ['#ln-bit-anterior', '#ln-bit-siguiente'].forEach((s) => { $(s, raiz).disabled = true; });
        llamar('apiLineasBitacora', tipo, { q: consulta.q, pagina: consulta.pagina, porPagina: POR_PAGINA }).then((r) => {
          if (!vigente()) return;
          ultima = r;
          const cols = cfg.columnas.map(([nombre, titulo]) => ({ h: buscarEncabezado(r.encabezados, nombre), titulo: titulo })).filter((c) => c.h);
          const columnas = cols.length ? cols : r.encabezados.map((h) => ({ h: h, titulo: h }));
          const hId = buscarEncabezado(r.encabezados, cfg.idRegistro);
          ultima.columnas = columnas;

          $('#ln-bit-thead', raiz).innerHTML = '<tr>' + columnas.map((c) => '<th>' + esc(c.titulo) + '</th>').join('') + (hId ? '<th></th>' : '') + '</tr>';
          tbody.innerHTML = r.filas.length
            ? r.filas.map((f) => '<tr>' + columnas.map((c) => '<td class="' + (/NUCO|IMEI|FOLIO/i.test(c.h) ? 'ln-mono' : '') + '">' + valorCelda(c.h, f[c.h]) + '</td>').join('') +
                (hId ? '<td>' + (f[hId] ? '<button type="button" class="secondary ln-btn-chico ln-btn-icono" data-ln-registro="' + esc(f[hId]) + '">' + icono('eye') + ' Ver</button>' : '') + '</td>' : '') + '</tr>').join('')
            : '<tr><td colspan="' + (columnas.length + 1) + '" class="empty-state">Sin resultados</td></tr>';

          if (!consulta.q) $('#ln-bit-total', raiz).textContent = miles(r.total);
          $('#ln-bit-coinciden', raiz).textContent = consulta.q ? miles(r.total) : '—';
          $('#ln-bit-conteo', raiz).textContent = consulta.q
            ? miles(r.total) + ' coincidencia(s) con "' + consulta.q + '"'
            : 'Del más reciente al más antiguo';
          $('#ln-bit-pagina', raiz).textContent = 'Página ' + (r.pagina + 1) + ' de ' + miles(r.paginas);
          $('#ln-bit-anterior', raiz).disabled = r.pagina === 0;
          $('#ln-bit-siguiente', raiz).disabled = r.pagina >= r.paginas - 1;
        }).catch((e) => {
          if (!vigente()) return;
          tbody.innerHTML = '<tr><td class="empty-state">Sin datos</td></tr>';
          const box = $('#ln-bit-error', raiz);
          box.textContent = 'No se pudo cargar la bitácora: ' + (e.message || e);
          box.hidden = false;
        });
      }

      $('#ln-bit-form', raiz).addEventListener('submit', (ev) => {
        ev.preventDefault();
        consulta.q = $('#ln-bit-q', raiz).value.trim();
        consulta.pagina = 0;
        cargar();
      });
      $('#ln-bit-limpiar', raiz).addEventListener('click', () => {
        $('#ln-bit-q', raiz).value = '';
        consulta.q = '';
        consulta.pagina = 0;
        cargar();
      });
      $('#ln-bit-anterior', raiz).addEventListener('click', () => { consulta.pagina--; cargar(); });
      $('#ln-bit-siguiente', raiz).addEventListener('click', () => { consulta.pagina++; cargar(); });
      $('#ln-bit-exportar', raiz).addEventListener('click', () => {
        if (!ultima || !ultima.filas.length) return;
        exportarCsv(cfg.csv, ultima.encabezados, ultima.filas);
      });
      raiz.addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-ln-registro]');
        if (b) irARegistro(b.dataset.lnRegistro);
      });

      cargar();
    }

    return {
      initTelefonicas: initTelefonicas,
      initDetalles: initDetalles,
      initGestionActivos: initGestionActivos,
      initAccesoriosLineas: initAccesoriosLineas,
      initReactivacion: () => initOperativa('REACTIVACION'),
      initSolicitud: () => initOperativa('SOLICITUD'),
      initPostVenta: () => initOperativa('POST_VENTA'),
      initCambios: () => initBitacora('CAMBIOS'),
      initReasignaciones: () => initBitacora('REASIGNACIONES'),
      initDesechos: () => initBitacora('DESECHOS'),
      precargar: precargar,
    };
  })();
</script>
