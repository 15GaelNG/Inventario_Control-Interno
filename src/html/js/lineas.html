          t.classList.toggle('stat-tile-activo', !!d.filtro && d.filtro !== 'TODOS' && $('#lnga-filtro-activos', raiz).value === d.filtro);
        });
        cont.querySelectorAll('[data-kpi]').forEach((t) => {
          const d = defs[Number(t.dataset.kpi)];
          if (!d.filtro) return;
          const clic = () => {
            const select = $('#lnga-filtro-activos', raiz);
            select.value = select.value === d.filtro ? 'TODOS' : d.filtro;
            aplicarFiltros();
            marcar();
          };
          t.addEventListener('click', clic);
          t.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); clic(); } });
        });
        $('#lnga-filtro-activos', raiz).addEventListener('change', marcar);
        marcar();
      }

      $('#lnga-filtro-activos', raiz).addEventListener('change', aplicarFiltros);
      $('#lnga-mas', raiz).addEventListener('click', () => { visibles += paso; pintarCuadros(); });
      raiz.addEventListener('click', (ev) => {
        const sug = ev.target.closest('[data-colaborador-i]');
        if (sug) {
          const c = colaboradores[Number(sug.dataset.colaboradorI)];
          if (c) mostrarColaborador(c, sug);
          return;
        }
        const f = ev.target.closest('[data-ir]');
        if (f) irARegistro(f.dataset.ir);
      });

      Promise.all([cargarColaboradores(), cargarIndice()]).then(([r, indice]) => {
        if (!vigente()) return;
        const conteo = {};
        indice.equipos.forEach((a) => { const k = normal(a.responsable); if (k) conteo[k] = (conteo[k] || 0) + 1; });
        indice.lineas.filter((a) => a.suelta).forEach((a) => { const k = normal(a.responsable); if (k) conteo[k] = (conteo[k] || 0) + 1; });
        colaboradores = filasComoObjetos(r).map((c, i) => Object.assign(c, { _i: i, totalActivos: conteo[normal(c.nombre)] || 0 }));
        pintarKpis();
        aplicarFiltros();
      }).catch((e) => {
        if (!vigente()) return;
        $('#lnga-grid', raiz).innerHTML = '';
        $('#lnga-error', raiz).textContent = 'No se pudieron cargar los colaboradores: ' + mensajeError(e);
        $('#lnga-error', raiz).hidden = false;
      });
    }

    // ======================================================================
    // Inventario de Accesorios (Líneas) — ACCESORIOS CELULARES / MOVIMIENTOS_ACCESORIOS
    // en la copia de pruebas de Líneas; no toca el módulo de accesorios del equipo.
    // ======================================================================

    function initAccesoriosLineas() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-accesorios');
      const vigente = () => n === montaje && document.body.contains(raiz);
      pintarIconos(raiz);

      let indiceAcc = null;
      let seleccionado = null;
      let guardandoAccesorio = false;
      let movimientoActual = 0;

      let tabla = null;
      let filtrosAcc = {};
      let marcarKpi = null;

      function pintarIndicadores() {
        if (!indiceAcc) return;
        const filas = indiceAcc.filas;
        marcarKpi = tilesKpi($('#lac-indicadores', raiz), [
          { icono: 'package', valor: miles(filas.length), etiqueta: 'Artículos' },
          { icono: 'triangle-alert', valor: miles(filas.filter((a) => a.reabasto).length), etiqueta: 'Por reabastecer',
            titulo: 'Aviso del AppSheet: Cargadores ≤ 10, Micas ≤ 182, Fundas ≤ 182',
            clase: 'stat-tile-warn', filtros: { reabasto: { valores: ['Sí'] } } },
          { icono: 'package-x', valor: miles(filas.filter((a) => (Number(a.stock) || 0) <= 0).length), etiqueta: 'Sin stock',
            clase: 'stat-tile-warn', filtros: { stock: { op: '<=', v1: 0 } } },
          { icono: 'circle-check', valor: miles(filas.reduce((t, a) => t + (Number(a.stock) || 0), 0)), etiqueta: 'Piezas en stock', clase: 'stat-tile-ok', filtros: false },
        ], () => tabla);
        marcarKpi(filtrosAcc);
      }

      /** Panel de detalle de DataTable: movimientos del artículo, del más reciente al más antiguo. */
      function movimientosEnPanel(a, cont) {
        const turno = ++movimientoActual;
        cont.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Movimientos</div><p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p>';
        llamar('apiLineasAccesoriosMovimientos', a.id).then((movs) => {
          if (!vigente() || turno !== movimientoActual || !document.body.contains(cont)) return;
          cont.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Movimientos (' + movs.length + ')</div>' + (movs.length
            ? '<div class="historial-timeline">' + movs.map((m) => '<div class="historial-item"><div class="historial-icon' + (m.tipo === 'ENTRADA' ? '' : ' historial-icon-accent') + '">' +
                ico(m.tipo === 'ENTRADA' ? 'arrow-down-to-line' : 'arrow-up-from-line') + '</div><div style="flex:1; min-width:0">' +
                '<div><strong>' + (m.tipo === 'ENTRADA' ? 'Entrada' : 'Salida') + ' de ' + esc(String(m.cantidad)) + '</strong> <span class="ln-tenue">· ' + esc(fechaTabla(m.fecha)) + '</span></div>' +
                '<div class="ln-tenue">' + guion(m.usuario) + (m.comentarios ? ' — ' + esc(m.comentarios) : '') + '</div></div></div>').join('') + '</div>'
            : '<p class="empty-state">Sin movimientos.</p>');
        }).catch((e) => { if (vigente() && turno === movimientoActual) cont.innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>'; });
      }

      function crearTablaAcc() {
        tabla = tablaLineas($('#lac-tabla', raiz), {
          idCampo: 'id',
          idTabla: 'lineas-accesorios-v2',
          ordenInicial: { campo: 'categoria', dir: 'asc' },
          textoVacio: 'Sin artículos',
          exportar: exportarBase('ACCESORIOS', 'Inventario de accesorios'),
          etiquetaFila: (a) => a.nombre,
          detalle: { titulo: (a) => a.nombre, contenidoExtra: movimientosEnPanel },
          ayuda: 'El ojo en Acciones muestra el artículo y sus movimientos. Las flechas registran entradas y salidas.',
          alCambiarFiltros: (f) => { filtrosAcc = f || {}; if (marcarKpi) marcarKpi(filtrosAcc); },
          accionesFila: [
            { icono: 'arrow-down-to-line', titulo: 'Registrar entrada', alHacer: (a) => abrirModalMovimiento(a.id, 'ENTRADA') },
            { icono: 'arrow-up-from-line', titulo: 'Registrar salida', alHacer: (a) => abrirModalMovimiento(a.id, 'SALIDA') },
          ],
          columnas: [
            // Orden de la vista INVENTARIO DE ACCESORIOS del AppSheet (agrupada por Categoria)
            { campo: 'reabasto', titulo: 'Aviso Reabastecimiento', tipo: 'lista', valor: (a) => (a.reabasto ? 'Sí' : 'No'),
              render: (v) => (v === 'Sí' ? '<span class="ln-regla" style="color:#d62020;font-weight:700">' + ico('triangle-alert') + ' REABASTECER PRODUCTO</span>' : '') },

            { campo: 'categoria', titulo: 'Categoria', tipo: 'lista', render: (v) => formatoAppSheet('ACCESORIOS', 'Categoria', v) || esc(v) },
            { campo: 'nombre', titulo: 'Nombre del Articulo', tipo: 'texto', fijada: false },
            { campo: 'marca', titulo: 'Marca', tipo: 'texto' },
            { campo: 'stock', titulo: 'Stock', tipo: 'numero', agregado: 'suma',
              // Reglas ALERTA BAJO STOCK (rojo sobre amarillo, ícono) y Stock disponible (#2f7d23), solo para las 3 categorías
              render: (v, a) => (a.reabasto
                ? '<span class="ln-regla ln-regla-chip" style="color:#d62020;background:#fff3b0;border:1px solid #e6c700;font-weight:700">' + ico('rotate-cw') + ' ' + esc(String(v)) + '</span>'
                : (['Cargadores', 'Micas', 'Fundas'].indexOf(a.categoria) >= 0 ? '<span class="ln-regla" style="color:#2f7d23;font-weight:700">' + esc(String(v)) + '</span>' : esc(String(v)))) },
          ],
        });
      }

      function cargar(forzar) {
        if (!tabla) crearTablaAcc();
        tabla.setCargando(true);
        cargarAccesorios(!!forzar).then((r) => {
          if (!vigente()) return;
          indiceAcc = r;
          pintarIndicadores();
          tabla.setDatos(r.filas);
        }).catch((e) => {
          if (!vigente()) return;
          tabla.setError('No se pudo cargar el inventario: ' + mensajeError(e));
        });
      }

      // Nombre y Marca: listas con lo ya registrado (se puede escribir uno nuevo)
      let combosArticulo = null;
      function opcionesArticulo() {
        const filas = (indiceAcc && indiceAcc.filas) || [];
        const marcas = filas.map((a) => String(a.marca || '').trim()).filter((v, i, x) => v && x.indexOf(v) === i).sort();
        return {
          nombres: filas.map((a) => ({ valor: a.nombre, etiqueta: [a.categoria, a.marca, 'stock ' + a.stock].filter(Boolean).join(' · ') })),
          marcas: marcas,
        };
      }
      function abrirModalNuevo() {
        const ops = opcionesArticulo();
        if (!combosArticulo && typeof Combobox !== 'undefined') {
          combosArticulo = {
            nombre: Combobox.crear($('#lac-nombre', raiz), { opciones: ops.nombres, maximo: 50 }),
            marca: Combobox.crear($('#lac-marca', raiz), { opciones: ops.marcas, maximo: 50 }),
          };
        } else if (combosArticulo) {
          combosArticulo.nombre.setOpciones(ops.nombres);
          combosArticulo.marca.setOpciones(ops.marcas);
        }
        $('#lac-nombre', raiz).value = ''; $('#lac-categoria', raiz).value = ''; $('#lac-marca', raiz).value = '';
        $('#lac-nuevo-error', raiz).hidden = true;
        $('#lac-modal-nuevo', raiz).hidden = false;
      }
      function cerrarModalNuevo() { if (!guardandoAccesorio) $('#lac-modal-nuevo', raiz).hidden = true; }

      function abrirModalMovimiento(id, tipo) {
        seleccionado = { id: id, tipo: tipo };
        const a = (indiceAcc.filas || []).filter((x) => x.id === id)[0];
        $('#lac-mov-titulo', raiz).textContent = (tipo === 'ENTRADA' ? 'Registrar entrada' : 'Registrar salida');
        $('#lac-mov-subtitulo', raiz).textContent = (a ? a.nombre + ' · stock actual ' + a.stock : '');
        $('#lac-cantidad', raiz).value = '';
        $('#lac-comentarios', raiz).value = '';
        $('#lac-mov-error', raiz).hidden = true;
        $('#lac-modal-mov', raiz).hidden = false;
      }
      function cerrarModalMov() { if (guardandoAccesorio) return; $('#lac-modal-mov', raiz).hidden = true; seleccionado = null; }

      function estadoAccesorio(modalId, ocupado) {
        guardandoAccesorio = ocupado;
        const modal = $(modalId, raiz);
        modal.querySelectorAll('button, input, textarea').forEach((el) => { el.disabled = ocupado; });
        const boton = modal.querySelector('.primary');
        if (ocupado) { boton.dataset.texto = boton.innerHTML; boton.innerHTML = '<span class="ln-spinner"></span> Guardando…'; }
        else boton.innerHTML = boton.dataset.texto;
      }

      $('#lac-nuevo', raiz).addEventListener('click', abrirModalNuevo);
      raiz.querySelectorAll('[data-cerrar-modal-nuevo]').forEach((b) => b.addEventListener('click', cerrarModalNuevo));
      raiz.querySelectorAll('[data-cerrar-modal-mov]').forEach((b) => b.addEventListener('click', cerrarModalMov));
      $('#lac-modal-nuevo', raiz).addEventListener('click', (ev) => { if (ev.target.id === 'lac-modal-nuevo') cerrarModalNuevo(); });
      $('#lac-modal-mov', raiz).addEventListener('click', (ev) => { if (ev.target.id === 'lac-modal-mov') cerrarModalMov(); });

      $('#lac-guardar-nuevo', raiz).addEventListener('click', () => {
        if (guardandoAccesorio) return;
        const nombre = $('#lac-nombre', raiz).value.trim();
        const categoria = $('#lac-categoria', raiz).value;
        const faltan = [!categoria && 'Categoria', !nombre && 'Nombre del Articulo'].filter(Boolean);
        if (faltan.length) { $('#lac-nuevo-error', raiz).textContent = faltan.join(', ') + (faltan.length > 1 ? ' son obligatorios.' : ' es obligatorio.'); $('#lac-nuevo-error', raiz).hidden = false; return; }
        const repetido = ((indiceAcc && indiceAcc.filas) || []).some((a) => a.categoria === categoria && normal(a.nombre).trim() === normal(nombre));
        if (repetido) { $('#lac-nuevo-error', raiz).textContent = 'Ese artículo ya existe en ' + categoria + ': registra una entrada con la flecha de su fila.'; $('#lac-nuevo-error', raiz).hidden = false; return; }
        estadoAccesorio('#lac-modal-nuevo', true);
        llamar('apiLineasAccesoriosAgregarArticulo', { nombre: nombre, categoria: $('#lac-categoria', raiz).value, marca: $('#lac-marca', raiz).value })
          .then(() => { guardandoAccesorio = false; cerrarModalNuevo(); aviso('Artículo guardado correctamente.', 6000); cargar(true); })
          .catch((e) => { $('#lac-nuevo-error', raiz).textContent = mensajeError(e); $('#lac-nuevo-error', raiz).hidden = false; })
          .finally(() => estadoAccesorio('#lac-modal-nuevo', false));
      });

      $('#lac-guardar-mov', raiz).addEventListener('click', () => {
        if (!seleccionado || guardandoAccesorio) return;
        const cantidad = Number($('#lac-cantidad', raiz).value);
        if (!Number.isInteger(cantidad) || cantidad <= 0) { $('#lac-mov-error', raiz).textContent = 'Captura una cantidad entera mayor que cero.'; $('#lac-mov-error', raiz).hidden = false; return; }
        estadoAccesorio('#lac-modal-mov', true);
        llamar('apiLineasAccesoriosRegistrarMovimiento', { accesorioId: seleccionado.id, tipo: seleccionado.tipo, cantidad: cantidad, comentarios: $('#lac-comentarios', raiz).value })
          .then(() => { guardandoAccesorio = false; cerrarModalMov(); aviso('Movimiento registrado correctamente.', 6000); cargar(true); })
          .catch((e) => { $('#lac-mov-error', raiz).textContent = mensajeError(e); $('#lac-mov-error', raiz).hidden = false; })
          .finally(() => estadoAccesorio('#lac-modal-mov', false));
      });

      cargar();
    }

    // ======================================================================
    // Reactivación y Solicitud de Líneas
    // ======================================================================

    const OPERATIVAS = {
      REACTIVACION: {
        // Vista REACTIVACION DE LINEAS del AppSheet: todas estas columnas, agrupada por ESTATUS
        resumen: ['FOLIO', 'LINIEA SUSPENDIDA', 'COMPAÑIA', 'SIM', 'CORREO / TICKET', 'FECHA DE SUSPENSION', 'ESTATUS', 'ESTADO DEL EQUIPO', 'IMEI',
          'RETRO DE SOLICITUD', 'FECHA DE REACTIVACION', 'NUEVO NUMERO', 'FECHA DE REGISTRO', 'QUIEN REGISTRO', 'COMENTARIOS'],
        agrupar: 'ESTATUS',
        titulo: 'Reactivación de Líneas', icono: 'check-check', textoAlta: 'Registrar reactivación',
        subtitulo: 'Seguimiento de líneas suspendidas, canceladas y reactivadas', filtro: 'Todos los estatus',
        altas: true,
        // Display name de las columnas en el AppSheet
        nombres: { 'LINIEA SUSPENDIDA': 'LINEA SUSPENDIDA' },
      },
      SOLICITUD: {
        // Vista SOLICITUD DE LINEAS del AppSheet: todas las columnas en el orden de la tabla
        resumen: ['FOLIO', 'FECHA DE SOLICITUD', 'TIPO DE PLAN', 'TICKET', 'NO EMPLEADO SOLICITANTE', 'NOMBRE SOLICITANTE', 'PUESTO SOLICITANTE',
          'DEPARTAMENTO SOLICITANTE', 'SEDE', 'DEPARTAMENTO', 'TIPO', 'PUESTO', 'COLABORADOR', 'SOLICITANTE', 'FECHA DE ENTREGA', 'ASIGNACION',
          'REASIGNACION', 'COMPAÑIA', 'EQUIPO', 'NUMERO ANTERIOR', 'NUMERO ACTUAL', 'IMEI', 'SIM', 'ESTATUS', 'FECHA DE REGISTRO', 'QUIEN REGISTRO', 'COMENTARIOS'],
        titulo: 'Solicitud de Líneas', icono: 'target', textoAlta: 'Registrar solicitud',
        subtitulo: 'Solicitudes de asignación y reasignación de líneas telefónicas', filtro: 'Todos los estatus',
        altas: true,
        // Display name de las columnas en el AppSheet
        nombres: { 'NO EMPLEADO SOLICITANTE': 'NÚMERO DE EMPLEADO DEL SOLICITANTE', 'NOMBRE SOLICITANTE': 'NOMBRE COMPLETO DEL SOLICITANTE', 'PUESTO SOLICITANTE': 'PUESTO DEL SOLICITANTE', 'DEPARTAMENTO SOLICITANTE': 'DEPARTAMENTO DEL SOLICITANTE' },
      },
    };

    function initOperativa(tipo) {
      const n = ++montaje;
      const cfg = OPERATIVAS[tipo];
      const raiz = document.getElementById('ln-operativa');
      const vigente = () => n === montaje && document.body.contains(raiz);
      let tabla = null;
      let filtrosOp = {};
      let marcarKpi = null;
      let solicitud = 0;
      let guardando = false;
      const modal = $('#ln-op-modal');

      $('#ln-op-titulo', raiz).textContent = cfg.titulo;
      $('#ln-op-subtitulo', raiz).textContent = cfg.subtitulo;
      $('#ln-op-titulo-icono', raiz).innerHTML = ico(cfg.icono);
      $('#ln-op-nuevo', raiz).innerHTML = ico('plus') + ' ' + esc(cfg.textoAlta);
      pintarIconos(raiz);
      refreshIcons();

      function cerrarAlta() {
        if (guardando) return;
        modal.hidden = true;
        $('#ln-op-alta-error').hidden = true;
      }

      let elementosAlta = [];
      let pasosAlta = null;
      function abrirAlta() {
        const cuerpo = $('#ln-op-campos');
        $('#ln-op-modal-titulo').textContent = cfg.textoAlta;
        $('#ln-op-alta-error').hidden = true;
        cuerpo.innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando formulario…</p>';
        modal.hidden = false;
        llamar('apiLineasFormularioOperativa', tipo).then((elementos) => {
          if (!vigente() || modal.hidden) return;
          elementosAlta = elementos;
          const pasos = PASOS_FORMULARIO[tipo];
          cuerpo.innerHTML = pasos ? htmlPasosAppSheet(elementos, pasos) : htmlFormularioAppSheet(elementos);
          activarCombosEn(cuerpo, elementosAlta);
          actualizarDerivadosEn(cuerpo, elementosAlta);
          pasosAlta = null;
          const acciones = $('#ln-op-alta-form .ln-captura-acciones');
          acciones.querySelectorAll('[data-paso-atras], [data-paso-siguiente], .form-cuenta').forEach((b) => b.remove());
          acciones.classList.toggle('ln-acciones-pasos', !!pasos);
          $('#ln-op-guardar').hidden = false;
          if (pasos) {
            acciones.insertAdjacentHTML('beforeend', '<span class="form-cuenta" aria-live="polite"></span>' +
              '<button type="button" class="secondary" data-paso-atras hidden>' + icono('chevron-left') + ' Atrás</button>' +
              '<button type="button" data-paso-siguiente>Siguiente ' + icono('chevron-right') + '</button>');
            acciones.appendChild($('#ln-op-guardar'));
            pasosAlta = activarPasos(cuerpo, {
              atras: acciones.querySelector('[data-paso-atras]'), siguiente: acciones.querySelector('[data-paso-siguiente]'),
              guardar: $('#ln-op-guardar'), cuenta: acciones.querySelector('.form-cuenta'),
              validar: (seccion) => {
                const errores = erroresFormularioEn(cuerpo, elementosAlta, '').filter((x) => seccion.querySelector('[data-af-columna="' + CSS.escape(x.columna) + '"]'));
                marcarErroresEn(cuerpo, errores.map((x) => ({ columna: x.columna, msg: x.corto })));
                $('#ln-op-alta-error').hidden = true;
                return errores;
              },
            });
          }
          const primero = cuerpo.querySelector('.form-paso:not([hidden]) input:not([readonly]), .form-paso:not([hidden]) select') || cuerpo.querySelector('input:not([readonly]), select, textarea');
          if (primero) primero.focus();
        }).catch((e) => { cuerpo.innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>'; });
      }

      function cargar() {
        const turno = ++solicitud;
        const clave = 'op:' + tipo;
        const previo = memoria.tablas[clave];
        if (previo) procesar(previo); else if (tabla) tabla.setCargando(true);
        llamar('apiLineasVistaOperativaTabla', tipo, {}).then((texto) => {
          if (!vigente() || turno !== solicitud) return;
          memoria.tablas[clave] = texto;
          if (texto !== previo) procesar(texto);
        }).catch((e) => {
          if (!vigente() || turno !== solicitud) return;
          if (previo) return; // se queda lo último que se vio
          if (!tabla) {
            tabla = tablaLineas($('#ln-op-tabla', raiz), { idCampo: '_fila', columnas: [{ campo: '_fila', titulo: 'Fila' }], detalle: false, exportar: false });
          }
          tabla.setError('No se pudo cargar ' + cfg.titulo + ': ' + mensajeError(e));
        });
      }

      /** Pinta la respuesta del servidor (o la que quedó en memoria de la visita anterior). */
      function procesar(texto) {
        {
          const r = JSON.parse(texto);
          const campoGrupo = r.campoGrupo;
          if (!tabla) {
            // Títulos: las etiquetas del formulario de alta y, si no hay, el encabezado en formato de oración
            const titulos = { FOLIO: 'Folio', 'FECHA DE REGISTRO': 'Fecha de registro', 'QUIEN REGISTRO': 'Registró' };
            Object.keys(cfg.nombres || {}).forEach((nombre) => { titulos[normEncabezado(nombre)] = tituloLegible(cfg.nombres[nombre]); });
            const columnas = columnasDeHoja(r.encabezados, r.filas, cfg.resumen, titulos, tipo);
            // El servidor agrupa en mayúsculas y sin espacios de más: la columna filtra con el mismo valor
            const colGrupo = columnas.find((c) => c.campo === campoGrupo);
            if (colGrupo) {
              colGrupo.tipo = 'lista';
              colGrupo.valor = (f) => String(f[campoGrupo] === null || f[campoGrupo] === undefined ? '' : f[campoGrupo]).trim().toUpperCase();
            }
            const campoFolio = r.encabezados.find((h) => /^FOLIO$/i.test(h)) || r.encabezados.find((h) => /NUCO|NUMERO/i.test(h));
            tabla = tablaLineas($('#ln-op-tabla', raiz), {
              idCampo: '_fila',
              idTabla: 'lineas-' + tipo.toLowerCase() + '-v2',
              columnas: columnas,
              // AppSheet agrupa por ESTATUS / TIPO: se ordena por esa columna (DataTable no agrupa)
              ordenInicial: cfg.agrupar && columnas.some((c) => c.campo === cfg.agrupar) ? { campo: cfg.agrupar, dir: 'asc' }
                : (campoFolio && /FOLIO/i.test(campoFolio) ? { campo: campoFolio, dir: 'desc' } : undefined),
              textoVacio: 'Sin registros',
              exportar: exportarBase(tipo, cfg.titulo),
              etiquetaFila: (f) => (campoFolio && f[campoFolio] ? String(f[campoFolio]) : 'Registro'),
              detalle: { titulo: (f) => cfg.titulo + (campoFolio && f[campoFolio] ? ' · ' + f[campoFolio] : '') },
              // View Ref (IMEI) del AppSheet: abre la línea referenciada
              accionesFila: [{ icono: 'circle-chevron-right', titulo: 'Ver línea', visible: (f) => !!f._ref, alHacer: (f) => irARegistro(f._ref) }],
              ayuda: 'El ojo en Acciones muestra todos los campos del registro. "Columnas" agrega los que no se ven; la flecha de cada columna filtra y ordena.',
              alCambiarFiltros: (f) => { filtrosOp = f || {}; if (marcarKpi) marcarKpi(filtrosOp); },
            });
          }
          // KPIs: total y los estatus (o tipos) más frecuentes; clic = filtrar
          const grupos = r.grupos.slice().sort((a, b) => b.total - a.total).slice(0, 4);
          marcarKpi = tilesKpi($('#ln-op-kpis', raiz), [{ icono: cfg.icono, valor: miles(r.totalSinFiltro), etiqueta: 'Registros' }]
            .concat(grupos.map((g) => ({
              icono: /CANCEL|TRAMITE CANCELADO/.test(g.nombre) ? 'circle-x' : /FINALIZADO|EN USO|DISPONIBLE/.test(g.nombre) ? 'circle-check' : 'tag',
              clase: /CANCEL/.test(g.nombre) ? 'stat-tile-warn' : /FINALIZADO|EN USO|DISPONIBLE/.test(g.nombre) ? 'stat-tile-ok' : '',
              valor: miles(g.total), etiqueta: g.nombre === 'SIN ESTATUS' ? 'Sin estatus' : g.nombre,
              filtros: campoGrupo ? { [campoGrupo]: { valores: [g.nombre === 'SIN ESTATUS' ? '' : g.nombre] } } : false,
            }))), () => tabla);
          marcarKpi(filtrosOp);
          tabla.setDatos(r.filas);
        }
      }

      $('#ln-op-nuevo', raiz).addEventListener('click', abrirAlta);
      $('#ln-op-cerrar').addEventListener('click', cerrarAlta);
      $('#ln-op-cancelar').addEventListener('click', cerrarAlta);
      modal.addEventListener('click', (ev) => {
        if (ev.target === modal) { cerrarAlta(); return; }
        const pastilla = ev.target.closest('.ln-pastilla');
        if (pastilla) {
          pastilla.parentElement.querySelectorAll('.ln-pastilla').forEach((b) => b.classList.remove('activa'));
          pastilla.classList.add('activa');
          actualizarDerivadosEn($('#ln-op-campos'), elementosAlta);
        }
      });
      $('#ln-op-campos').addEventListener('input', () => actualizarDerivadosEn($('#ln-op-campos'), elementosAlta));
      $('#ln-op-campos').addEventListener('change', () => actualizarDerivadosEn($('#ln-op-campos'), elementosAlta));
      $('#ln-op-alta-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        if (guardando) return;
        const cuerpo = $('#ln-op-campos');
        const errores = erroresFormularioEn(cuerpo, elementosAlta, '');
        if (errores.length) {
          if (pasosAlta) pasosAlta.irAlCampo(errores[0].columna);
          marcarErroresEn(cuerpo, errores.map((x) => ({ columna: x.columna, msg: x.corto })));
          const box = $('#ln-op-alta-error');
          box.textContent = errores.map((x) => x.msg).slice(0, 6).join(' · ');
          box.hidden = false;
          const campo = cuerpo.querySelector('[data-af-columna="' + CSS.escape(errores[0].e.columna) + '"] input, [data-af-columna="' + CSS.escape(errores[0].e.columna) + '"] select, [data-af-columna="' + CSS.escape(errores[0].e.columna) + '"] .ln-pastilla');
          if (campo) { campo.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (campo.focus) campo.focus(); }
          return;
        }
        const datos = leerFormularioEn(cuerpo, elementosAlta);
        const guardar = $('#ln-op-guardar');
        guardando = true;
        const textoGuardar = guardar.innerHTML;
        guardar.innerHTML = '<span class="ln-spinner"></span> Guardando…';
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = true; });
        $('#ln-op-alta-error').hidden = true;
        llamar('apiLineasCrearVistaOperativa', tipo, datos).then((r) => {
          if (!vigente()) return;
          guardando = false;
          cerrarAlta();
          aviso(icono('circle-check') + ' Registro ' + esc(r.folio) + ' guardado correctamente.', 6000);
          delete memoria.tablas['op:' + tipo];
          cargar();
        }).catch((e) => {
          const box = $('#ln-op-alta-error');
          box.textContent = mensajeError(e);
          box.hidden = false;
        }).finally(() => {
          guardando = false;
          guardar.innerHTML = textoGuardar;
          modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = false; });
        });
      });
      if (cfg.altas) {
        cargarPermisos().then((p) => { if (vigente()) $('#ln-op-nuevo', raiz).hidden = !p.puedeOperar; });
      }
      cargar();
    }

    // ======================================================================
    // Bitácoras: Control de Cambios, Control de Reasignaciones, Bitácora de Desechos
    // ======================================================================

    const BITACORAS = {
      CAMBIOS: {
        titulo: 'Control de Cambios - Líneas', icono: 'eye',
        subtitulo: 'Bitácora de campos modificados en LINEAS TELEFONICAS (AppSheet y nuevo sistema)',
        idRegistro: 'ID_LINEA', fecha: 'FECHA ACTUALIZACION',
        kpis: (filas) => {
          const deCampo = (lista) => filas.filter((f) => lista.indexOf(String(f['CAMPO'] || '').trim()) >= 0).length;
          return [
            { icono: 'toggle-right', valor: miles(deCampo(['ESTATUS LINEA', 'ESTATUS EQUIPO'])), etiqueta: 'Cambios de estatus', filtros: { CAMPO: { valores: ['ESTATUS LINEA', 'ESTATUS EQUIPO'] } } },
            { icono: 'recycle', valor: miles(deCampo(['RESPONSABLE'])), etiqueta: 'Cambios de responsable', filtros: { CAMPO: { valores: ['RESPONSABLE'] } } },
          ];
        },
        // Vista CONTROL DE CAMBIOS - LINEAS del AppSheet
        columnas: [
          ['NUCO', 'NUCO'], ['IMEI', 'IMEI'], ['CAMPO', 'Campo'], ['ANTES', 'Antes'], ['DESPUES', 'Después'],
          ['ACTUALIZADO POR', 'Actualizado por'], ['FECHA ACTUALIZACION', 'Fecha actualización'],
        ],
      },
      REASIGNACIONES: {
        titulo: 'Control de Reasignaciones - Líneas', icono: 'recycle',
        subtitulo: 'Cambios de responsable de equipos y líneas',
        idRegistro: 'ID Linea', fecha: 'Fecha de Reasignacion',
        kpis: (filas) => {
          const distintos = (campo) => filas.map((f) => String(f[campo] || '').trim()).filter((v, i, a) => v && a.indexOf(v) === i).length;
          return [
            { icono: 'smartphone', valor: miles(distintos('ID Linea')), etiqueta: 'Activos reasignados', filtros: false },
            { icono: 'users', valor: miles(distintos('Responsable Entrante')), etiqueta: 'Responsables entrantes', filtros: false },
          ];
        },
        // Vista CONTROL DE REASIGNACIONES - LINEAS del AppSheet: todas las columnas en el orden de la tabla
        columnas: [
          ['Fecha de Reasignacion', 'Fecha de reasignación'], ['NUCO', 'NUCO'], ['No Empleado Saliente', 'No. empleado saliente'],
          ['Responsable Saliente', 'Responsable saliente'], ['Departamento Saliente', 'Departamento saliente'],
          ['No Empleado Entrante', 'No. empleado entrante'], ['Responsable Entrante', 'Responsable entrante'],
          ['Departamento Entrante', 'Departamento entrante'], ['QUIEN REGISTRO', 'Registró'],
        ],
      },
      DESECHOS: {
        titulo: 'Bitácora de Desechos', icono: 'trash-2',
        alta: 'DESECHO', textoAlta: 'Registrar desecho',
        subtitulo: 'Equipos dados de baja definitiva (folio DR)',
        idRegistro: 'ID_EQUIPO', fecha: 'FECHA DE DESECHO',
        kpis: (filas, encabezados, hFecha) => {
          const anio = String(new Date().getFullYear());
          const esteAnio = hFecha ? filas.filter((f) => f[hFecha] && !isNaN(new Date(f[hFecha])) && String(new Date(f[hFecha]).getFullYear()) === anio).length : 0;
          const lugares = contarPor(filas, 'LUGAR DE DESECHO');
          const top = Object.keys(lugares).filter(Boolean).sort((a, b) => lugares[b] - lugares[a])[0];
          const defs = hFecha ? [{ icono: 'calendar-range', valor: miles(esteAnio), etiqueta: 'En ' + anio, filtros: { [hFecha]: { op: 'entre', v1: anio + '-01-01', v2: diaClave(0) } } }] : [];
          if (top) defs.push({ icono: 'map-pin', valor: miles(lugares[top]), etiqueta: top, titulo: 'Lugar de desecho más frecuente', filtros: { 'LUGAR DE DESECHO': { valores: [top] } } });
          return defs;
        },
        // Vista BITACORA DE DESECHOS del AppSheet (ID_EQUIPO se muestra con su etiqueta: el IMEI)
        columnas: [
          ['FOLIO DESECHO', 'Folio desecho'], ['IMEI', 'IMEI equipo'], ['FOLIO EQUIPO', 'Folio equipo'], ['EQUIPO', 'Equipo'],
          ['LUGAR DE DESECHO', 'Lugar de desecho'], ['EVIDENCIA', 'Evidencia'], ['AUTORIZACION', 'Autorización'], ['ESTADO', 'Estado'],
          ['MOTIVO', 'Motivo'], ['FECHA DE DESECHO', 'Fecha de desecho'], ['FECHA DE REGISTRO', 'Fecha de registro'], ['QUIEN REGISTRO', 'Registró'],
        ],
      },
    };

    function initBitacora(tipo) {
      const n = ++montaje;
      const cfg = BITACORAS[tipo];
      const raiz = document.getElementById('ln-bitacora');
      const vigente = () => n === montaje && document.body.contains(raiz);
      let solicitud = 0;
      let tabla = null;
      let filtrosBit = {};
      let marcarKpi = null;
      let busqueda = '';

      $('#ln-bit-titulo', raiz).textContent = cfg.titulo;
      $('#ln-bit-subtitulo', raiz).textContent = cfg.subtitulo;
      $('#ln-bit-titulo-icono', raiz).innerHTML = ico(cfg.icono);
      refreshIcons();

      const norm = normEncabezado;
      const buscarEncabezado = (encabezados, nombre) => encabezados.find((h) => norm(h) === norm(nombre));

      function crearTabla(r) {
        const titulos = {};
        cfg.columnas.forEach(([nombre, titulo]) => { titulos[norm(nombre)] = titulo; });
        const columnas = columnasDeHoja(r.encabezados, r.filas, cfg.columnas.map((c) => c[0]), titulos, tipo);
        const hId = buscarEncabezado(r.encabezados, cfg.idRegistro);
        const hFecha = buscarEncabezado(r.encabezados, cfg.fecha || cfg.columnas[0][0]);
        const hFolio = buscarEncabezado(r.encabezados, 'NUCO') || buscarEncabezado(r.encabezados, 'FOLIO DESECHO');
        tabla = tablaLineas($('#ln-bit-tabla', raiz), {
          idCampo: '_fila',
          idTabla: 'lineas-bitacora-' + tipo.toLowerCase() + '-v2',
          columnas: columnas,
          ordenInicial: hFecha ? { campo: hFecha, dir: 'desc' } : undefined,
          textoVacio: 'Sin registros',
          exportar: exportarBase(tipo, cfg.titulo),
          etiquetaFila: (f) => [hFolio && f[hFolio], hFecha && fechaTabla(f[hFecha])].filter(Boolean).join(' · ') || 'Registro',
          detalle: { titulo: (f) => cfg.titulo + (hFolio && f[hFolio] ? ' · ' + f[hFolio] : '') },
          accionesFila: hId ? [{ icono: 'circle-chevron-right', titulo: 'Ver activo', visible: (f) => !!f[hId], alHacer: (f) => irARegistro(f[hId]) }] : [],
          ayuda: 'Bitácora de solo lectura. El ojo abre todos los campos del registro y el celular abre la ficha del activo.',
          alCambiarFiltros: (f) => { filtrosBit = f || {}; if (marcarKpi) marcarKpi(filtrosBit); },
        });
        tabla.hFecha = hFecha;
      }

      function pintarKpis(r) {
        const hFecha = tabla && tabla.hFecha;
        const defs = [{ icono: cfg.icono, valor: miles(r.total), etiqueta: busqueda ? 'Coinciden con "' + busqueda + '"' : 'Registros en la hoja' }];
        if (hFecha) {
          defs.push({ icono: 'calendar-days', valor: miles(contarDesde(r.filas, hFecha, 29)), etiqueta: 'Últimos 30 días', filtros: { [hFecha]: { op: 'entre', v1: diaClave(29), v2: diaClave(0) } } });
          defs.push({ icono: 'clock', valor: miles(contarDesde(r.filas, hFecha, 0)), etiqueta: 'Hoy', clase: 'stat-tile-ok', filtros: { [hFecha]: { op: 'igual', v1: diaClave(0) } } });
        }
        (cfg.kpis ? cfg.kpis(r.filas, r.encabezados, hFecha) : []).forEach((d) => defs.push(d));
        marcarKpi = tilesKpi($('#ln-bit-kpis', raiz), defs, () => tabla);
        marcarKpi(filtrosBit);
      }

      function cargar() {
        const turno = ++solicitud;
        const clave = 'bit:' + tipo;
        const previo = busqueda ? null : memoria.tablas[clave];
        if (previo) procesar(previo); else if (tabla) tabla.setCargando(true);
        llamar('apiLineasBitacoraTabla', tipo, { q: busqueda }).then((texto) => {
          if (!vigente() || turno !== solicitud) return;
          if (!busqueda) memoria.tablas[clave] = texto;
          if (texto !== previo) procesar(texto);
        }).catch((e) => {
          if (!vigente() || turno !== solicitud) return;
          if (previo) return;
          if (!tabla) tabla = tablaLineas($('#ln-bit-tabla', raiz), { idCampo: '_fila', columnas: [{ campo: '_fila', titulo: 'Fila' }], detalle: false, exportar: false });
          tabla.setError('No se pudo cargar la bitácora: ' + mensajeError(e));
        });
      }

      /** Pinta la respuesta del servidor (o la que quedó en memoria de la visita anterior). */
      function procesar(texto) {
        {
          const r = JSON.parse(texto);
          if (!tabla) crearTabla(r);
          pintarKpis(r);
          tabla.setDatos(r.filas);
          // Si la hoja tiene más filas de las que se cargan, se ofrece buscar en todo el historial
          const form = $('#ln-bit-form', raiz);
          form.hidden = !busqueda && r.filas.length >= r.total;
          $('#ln-bit-limpiar', raiz).hidden = !busqueda;
          $('#ln-bit-aviso', raiz).textContent = busqueda
            ? miles(r.total) + ' coincidencia(s) en todo el historial' + (r.filas.length < r.total ? ' (se muestran las ' + miles(r.filas.length) + ' más recientes)' : '') + '.'
            : 'Se muestran los ' + miles(r.filas.length) + ' registros más recientes de ' + miles(r.total) + '.';
        }
      }

      if (cfg.alta) {
        cargarPermisos().then((p) => { if (vigente()) $('#ln-bit-nuevo', raiz).hidden = !p.puedeOperar; });
        $('#ln-bit-nuevo', raiz).innerHTML = ico('plus') + ' ' + esc(cfg.textoAlta);
        $('#ln-bit-nuevo', raiz).addEventListener('click', () => abrirAltaAppSheet(cfg.alta, cfg.textoAlta, () => { delete memoria.tablas['bit:' + tipo]; if (vigente()) cargar(); }));
      }

      $('#ln-bit-form', raiz).addEventListener('submit', (ev) => {
        ev.preventDefault();
        busqueda = $('#ln-bit-q', raiz).value.trim();
        cargar();
      });
      $('#ln-bit-limpiar', raiz).addEventListener('click', () => {
        $('#ln-bit-q', raiz).value = '';
        busqueda = '';
        cargar();
      });

      cargar();
    }

    return {
      initTelefonicas: initTelefonicas,
      initGestionActivos: initGestionActivos,
      initAccesoriosLineas: initAccesoriosLineas,
      initReactivacion: () => initOperativa('REACTIVACION'),
      initSolicitud: () => initOperativa('SOLICITUD'),
      initCambios: () => initBitacora('CAMBIOS'),
      initReasignaciones: () => initBitacora('REASIGNACIONES'),
      initDesechos: () => initBitacora('DESECHOS'),
      precargar: precargar,
    };
  })();
</script>
