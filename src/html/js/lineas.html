<script>
  /**
   * lineas.js — vistas del módulo de Líneas (grupo "Líneas" del menú).
   * Todo vive dentro del namespace `Lineas` para no chocar con el resto de app.js.
   * Usa los globales del shell: callServer(), state.token y navegarA().
   *
   *   Lineas.initTelefonicas()     Líneas Telefónicas: inventario (tabla o tarjetas), ficha, inspecciones e historial
   *   Lineas.initGestionActivos()  Gestión de Activos: activos por colaborador (acceso propio en el menú)
   *   Lineas.initResguardos()      Resguardos y cancelaciones (APP_RESGUARDOS): bandeja de quien recibe los equipos
   *   Lineas.initCambios()         Control de Cambios - Líneas (CAMBIOS LINEAS TELEFONICAS), fuera del menú
   *   (Reactivación, Solicitud, Reasignaciones y Desechos se retiraron el 30-sep con sus pestañas)
   */
  const Lineas = (function () {
    'use strict';

    // ---------------- Utilidades ----------------
    const $ = (sel, raiz) => (raiz || document).querySelector(sel);
    const esc = (v) => {
      if (v === null || v === undefined || v === '') return '';
      return String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    };
    const vacio = '<span class="ln-tenue">—</span>';
    const guion = (v) => (v === null || v === undefined || v === '' ? vacio : esc(v));
    const fecha = (iso) => {
      if (!iso) return null;
      const d = new Date(iso);
      return isNaN(d) ? null : d.toLocaleDateString('es-MX', { year: 'numeric', month: 'short', day: '2-digit' });
    };
    const fechaHora = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? '' : d.toLocaleString('es-MX', { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    };
    const normal = (s) => String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const porcentaje = (v) => {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Math.round(n > 1 ? n : n * 100) + '%';
    };
    const miles = (n) => Number(n || 0).toLocaleString('es-MX');
    /** Ícono de Lucide (lucide.dev/icons) como SVG en línea: icono('smartphone'). */
    function icono(nombre, clase) {
      const nombrePascal = String(nombre).replace(/(^|-)([a-z0-9])/g, (m, sep, c) => c.toUpperCase());
      const nodos = window.lucide && window.lucide.icons && window.lucide.icons[nombrePascal];
      if (!nodos) return '';
      const svg = window.lucide.createElement(nodos);
      svg.setAttribute('class', 'ln-icon ' + (clase || ''));
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      return svg.outerHTML;
    }
    /** Rellena los <span data-ln-icon="nombre"> de las plantillas. */
    function pintarIconos(raiz) {
      raiz.querySelectorAll('[data-ln-icon]').forEach((el) => { el.innerHTML = icono(el.dataset.lnIcon); });
    }
    const enlaceDrive = (id, texto, esArchivo) => {
      if (!id) return '';
      const url = esArchivo ? 'https:\/\/drive.google.com/file/d/' + esc(id) + '/view' : 'https:\/\/drive.google.com/drive/folders/' + esc(id);
      return '<a class="externo ln-boton" target="_blank" rel="noopener" href="' + url + '">' + icono(esArchivo ? 'file-text' : 'folder-open') + ' ' + esc(texto) + ' ' + icono('external-link', 'ln-icon-sm') + '</a>';
    };

    function llamar(fn, ...args) {
      return callServer(fn, state.token, ...args);
    }

    // ---------------- Archivos del AppSheet ----------------
    // Las columnas File/Image/Signature del AppSheet guardan "TABLA_Files_/archivo.ext" (relativo a su carpeta
    // raíz en Drive). Se muestran con su ícono, como en AppSheet, y al hacer clic el servidor busca el archivo
    // (apiLineasArchivo) y se abre. Los enlaces de Drive que guarda el sistema nuevo se abren directo.
    // Algunas filas guardan el enlace del AppSheet (appsheet.com/template/gettablefileurl?…&fileName=TABLA_Files_/…, o
    // image/getimageurl en las imágenes): se toma la ruta de fileName y se abre desde Drive igual que las demás.
    const rutaDeEnlaceAppSheet = (v) => {
      const m = /appsheet\.com[\/](template[\/]gettablefileurl|image[\/]getimageurl)/i.test(v) && String(v).match(/[?&]fileName=([^&#]+)/i);
      if (!m) return null;
      try { return decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return null; }
    };
    // Igual que LineasArchivos.rutaAppSheet: sin enlace del AppSheet ni la tabla delante ("TABLA::TABLA_Images/…")
    const rutaAppSheetLimpia = (v) => (rutaDeEnlaceAppSheet(String(v || '').trim()) || String(v || '').trim()).replace(/^[^\/]*::/, '').trim();
    const esRutaArchivo = (v) => /^[^\/]+_(Files_|Images)\/[^\/].*\.\w{2,5}$/i.test(String(v || '').trim()) ||
      /^https?:\/\/(drive|docs)\.google\.com[\/]/i.test(String(v || '').trim()) || !!rutaDeEnlaceAppSheet(String(v || '').trim());
    function botonArchivo(ruta, texto) {
      let v = String(ruta === null || ruta === undefined ? '' : ruta).trim();
      if (!v) return vacio;
      v = rutaDeEnlaceAppSheet(v) || v;
      if (!esRutaArchivo(v)) return esc(v); // "••••" (oculto para el rol) o texto que no es archivo
      let nombre = v.split('/').pop().split('?')[0];
      try { nombre = decodeURIComponent(nombre); } catch (e) { /* nombre con "%" suelto: se deja igual */ }
      const ic = icono(/\.pdf$/i.test(nombre) ? 'file-text' : /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(nombre) ? 'image' : 'file');
      const etiqueta = ic + ' ' + esc(texto || 'Ver archivo');
      if (/^https?:/i.test(v)) return '<a class="ln-btn-icono ln-archivo" target="_blank" rel="noopener" href="' + esc(v) + '" title="' + esc(nombre) + '">' + etiqueta + '</a>';
      return '<button type="button" class="ln-btn-icono ln-archivo" data-ln-archivo="' + esc(v) + '" title="' + esc(nombre) + '">' + etiqueta + '</button>';
    }
    async function abrirArchivoAppSheet(boton) {
      // La ventana se abre en el clic (si no, el navegador la bloquea) y se le da la dirección al llegar
      const ventana = window.open('', '_blank');
      boton.disabled = true;
      try {
        const r = await llamar('apiLineasArchivo', boton.dataset.lnArchivo);
        if (ventana) ventana.location.href = r.url; else window.open(r.url, '_blank');
      } catch (e) {
        if (ventana) ventana.close();
        Notificar.error(mensajeError(e));
      } finally {
        boton.disabled = false;
      }
    }
    document.addEventListener('click', (ev) => {
      const b = ev.target.closest && ev.target.closest('[data-ln-archivo]');
      if (!b) return;
      ev.preventDefault();
      ev.stopPropagation();
      abrirArchivoAppSheet(b);
    }, true);

    /**
     * "Última responsiva" / "Última inspección": la más reciente de la carpeta del NUCO en NUCOS (solo consulta).
     * Para que abra rápido, la respuesta se pide antes de dar clic (al abrir la vista rápida o la ficha, o al dejar el
     * mouse sobre el botón) y se guarda 9 min en memoria; el servidor ya solo recorre la rama de ese tipo.
     */
    const ultimosNucos = {};
    function ultimoNucos(id, tipo) {
      const k = id + '|' + tipo;
      const c = ultimosNucos[k];
      if (c && Date.now() - c.en < 9 * 60 * 1000) return c.promesa;
      const promesa = llamar('apiLineasUltimoDocumentoNuco', id, tipo);
      ultimosNucos[k] = { en: Date.now(), promesa: promesa };
      promesa.catch(() => { if (ultimosNucos[k] && ultimosNucos[k].promesa === promesa) delete ultimosNucos[k]; });
      return promesa;
    }
    function precargarUltimosNucos(id) {
      if (id) ['RESPONSIVA', 'INSPECCION'].forEach((t) => ultimoNucos(id, t).catch(() => { /* se avisa si le dan clic */ }));
    }
    let esperaUltimo = null;
    document.addEventListener('pointerover', (ev) => {
      const b = ev.target.closest && ev.target.closest('[data-ln-ultimo]');
      clearTimeout(esperaUltimo);
      if (b) esperaUltimo = setTimeout(() => ultimoNucos(b.dataset.id, b.dataset.lnUltimo).catch(() => {}), 150);
    });

    async function abrirUltimoNucos(boton) {
      const ventana = window.open('', '_blank');
      // Mientras llega la dirección, la pestaña nueva dice qué está pasando (antes se quedaba en blanco)
      if (ventana) {
        try {
          ventana.document.title = 'Buscando documento…';
          ventana.document.body.innerHTML = '<p style="font:15px system-ui,sans-serif;color:#5c6b72;padding:32px">Buscando el documento en la carpeta NUCOS de Drive…</p>';
        } catch (e) { /* otra ventana sin acceso: solo queda en blanco */ }
      }
      const original = boton.innerHTML;
      boton.disabled = true;
      boton.innerHTML = '<span class="ln-spinner"></span> ' + boton.textContent.trim();
      try {
        const r = await ultimoNucos(boton.dataset.id, boton.dataset.lnUltimo);
        if (ventana) ventana.location.href = r.url; else window.open(r.url, '_blank');
        if (r.carpeta) Notificar.info('La última carpeta (' + r.nombre + ') no tiene PDF: se abrió la carpeta.');
      } catch (e) {
        if (ventana) ventana.close();
        Notificar.error(mensajeError(e));
      } finally {
        boton.disabled = false;
        boton.innerHTML = original;
      }
    }
    document.addEventListener('click', (ev) => {
      const b = ev.target.closest && ev.target.closest('[data-ln-ultimo]');
      if (!b) return;
      ev.preventDefault();
      ev.stopPropagation();
      if (!b.disabled) abrirUltimoNucos(b);
    }, true);

    const COLOR_ESTATUS = {
      'USO': 'verde', 'EN USO': 'verde', 'RENOVADA': 'verde',
      'RESGUARDO': 'azul', 'DISPONIBLE': 'azul', 'EN ENVIO': 'azul', 'ESPERA DE RESPONSIVA': 'azul', 'ESPERA DE EQUIPO': 'azul',
      'PARA VENTA': 'ambar', 'PARA DESECHO': 'ambar', 'EN PROCESO DE CANCELACION': 'ambar',
      // Bandeja de resguardos y cancelaciones
      'PENDIENTE DE RECEPCION': 'ambar', 'EN RESGUARDO': 'azul', 'ENTREGADO A LINEAS': 'verde',
      'POR FIRMAR': 'ambar', 'CARTA FIRMADA': 'ambar', 'CARTA ENVIADA': 'azul',
      'SUSPENDIDA': 'ambar', 'POSIBLE VENTA': 'ambar', 'VENTA': 'ambar', 'USO TEMPORAL': 'ambar', 'SIN LINEA': 'ambar',
      'EXTRAVIO-ROBO': 'rojo', 'CANCELADA': 'rojo', 'DESECHADO': 'rojo',
      // Valores de antes del 30-sep que siguen en la hoja hasta que Líneas los corrija
      'EXTRAVIADO': 'rojo', 'ROBO': 'rojo', 'ROBADO': 'rojo', 'CANCELADO': 'rojo', 'DESECHO': 'rojo', 'BLOQUEADO': 'rojo', 'FUERA DE INVENTARIO': 'rojo',
    };
    /** Qué significa cada estatus (reunión 30-sep); se ve al pasar el ratón (usuario, 4-oct). */
    const SIGNIFICADO_ESTATUS = {
      'USO': 'En operación, con una persona', 'RESGUARDO': 'Guardado en almacén; puede volver a usarse',
      'PARA VENTA': 'Buen estado; se ofrece en venta',
      'PARA DESECHO': 'Apartado para desecharse', 'VENDIDO': 'Ya se vendió', 'DONADO': 'Donado a fundación o personas',
      'DESECHADO': 'Ya se desechó', 'EXTRAVIO-ROBO': 'Extraviado o robado',
      'DISPONIBLE': 'Línea viva sin persona; lista para asignarse', 'EN PROCESO DE CANCELACION': 'Pasa a la bandeja de cancelaciones; se pide al proveedor',
      'CANCELADA': 'Cancelada; confirmada con el proveedor',
    };
    const significado = (estatus) => SIGNIFICADO_ESTATUS[String(estatus || '').trim().toUpperCase()] || '';
    const chip = (estatus, clase) => {
      if (!estatus) return vacio;
      const ayuda = significado(estatus);
      return '<span class="ln-chip ' + (clase || COLOR_ESTATUS[String(estatus).toUpperCase()] || '') + '"' + (ayuda ? ' title="' + esc(ayuda) + '"' : '') + '>' + esc(estatus) + '</span>';
    };
    const TIPO_EQUIPO = { CELULAR: 'Celular', CELULAR_BASICO: 'Celular básico', MODEM: 'Módem', BANDA_ANCHA: 'Banda ancha', CAMARA: 'Cámara' };

    // ---------------- Tablas y KPIs con los componentes del sistema (rama jorge) ----------------
    /** Ícono con la clase .ico del sistema, para HTML que se repinta (tablas, KPIs, títulos). */
    const ico = (nombre) => (typeof Iconos !== 'undefined' ? Iconos.svg(nombre) : icono(nombre));

    /** Fecha como la muestra DataTable (dd/mm/aaaa) y con hora solo si la trae. */
    function fechaTabla(v) {
      if (v === null || v === undefined || v === '') return '';
      const d = v instanceof Date ? v : new Date(v);
      if (isNaN(d)) return String(v);
      const dos = (x) => String(x).padStart(2, '0');
      const dia = dos(d.getDate()) + '/' + dos(d.getMonth() + 1) + '/' + d.getFullYear();
      return d.getHours() || d.getMinutes() ? dia + ' ' + dos(d.getHours()) + ':' + dos(d.getMinutes()) : dia;
    }
    const esFechaIso = (v) => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v);
    const esBooleano = (v) => v === true || v === false || /^(TRUE|FALSE)$/i.test(String(v));
    const booleano = (v) => (v === '' || v === null || v === undefined ? '' : (v === true || String(v).toUpperCase() === 'TRUE' ? 'Sí' : 'No'));

    // ---------------- Reglas de formato del AppSheet (Format Rules de Telefonía) ----------------
    // Color, tamaño, negritas/cursiva e ícono de cada regla (Logica/docs/06_reglas_formato_configuracion.md).
    // Los colores con nombre del AppSheet se traducen a un tono legible sobre fondo claro u oscuro;
    // los íconos Font Awesome se sustituyen por su equivalente de Lucide.
    const COLOR_APPSHEET = {
      green: '#1e8a3a', orange: '#e67e00', yellow: '#b59a00', red: '#d62020', pink: '#d4508a',
      themeMainColor: 'var(--color-primary)', minorText: 'var(--color-text-muted)',
    };
    const colorAppSheet = (c) => COLOR_APPSHEET[c] || COLOR_APPSHEET[String(c).toLowerCase()] || c;
    // `fondo`: la regla trae Highlight color (se pinta como etiqueta con fondo tenue del mismo color).
    // `fondo`: la regla trae Highlight color (se pinta como etiqueta con fondo tenue del mismo color).
    const REGLAS_FORMATO = {
      REACTIVACION: {
        'ESTATUS': {
          'EN USO': { color: 'green', tam: 1.1, bold: true, italic: true, fondo: true },
          'DISPONIBLE': { color: '#006400', tam: 1.1, bold: true, italic: true, fondo: true },
          'EN PROCESO DE ASIGNACION': { color: 'themeMainColor', tam: 1.1, bold: true, italic: true, fondo: true },
          'CANCELADA': { color: 'red', bold: true, italic: true, fondo: true },
          'PROCESO DE CANCELACION': { color: 'orange', bold: true, italic: true, fondo: true },
          'ACTUALIZACIÓN DE LINEA TELEFONICA': { color: '#305496', bold: true, italic: true, fondo: true },
        },
        'RETRO DE SOLICITUD': {
          'SUSPENSION DE LINEA': { color: 'orange', tam: 0.9, italic: true, fondo: true },
          'ACTIVACION DE LINEA': { color: 'yellow', tam: 0.9, italic: true, fondo: true },
          'CAMBIO DE NUMERO': { color: 'themeMainColor', tam: 0.9, italic: true, fondo: true },
          'TRAMITE CONCLUIDO': { color: 'green', tam: 0.9, italic: true, fondo: true },
          'PENDIENTE DE ENTREGA': { color: 'red', tam: 0.9, italic: true, fondo: true },
          'CANCELACION': { color: '#8B0000', italic: true, fondo: true },
        },
      },
      SOLICITUD: {
        'ESTATUS': {
          'PROCESO DE ADQUISICION': { color: 'themeMainColor', tam: 0.9, italic: true, fondo: true },
          'FINALIZADO': { color: 'green', tam: 0.9, italic: true, fondo: true },
          'TRAMITE CANCELADO': { color: 'orange', tam: 0.9, italic: true, fondo: true },
        },
      },
      LINEAS: {
        'TIPO': {
          'MODEM': { color: 'themeMainColor', icono: 'hard-drive', bold: true, italic: true, fondo: true },
          'LINEA': { color: 'yellow', icono: 'card-sim', bold: true, italic: true, fondo: true },
          'EQUIPO + SIM': { color: 'green', icono: 'smartphone', bold: true, italic: true, fondo: true },
          'BANDA ANCHA': { color: 'pink', icono: 'radio-tower', bold: true, italic: true, fondo: true },
          'EQUIPO': { color: 'minorText', icono: 'smartphone', bold: true, italic: true, fondo: true },
          'EQUIPO + SIM BASICO': { color: '#54AE98', icono: 'card-sim', bold: true, italic: true, fondo: true },
          'CAMARA': { color: '#004734', icono: 'camera', bold: true, italic: true, fondo: true },
          'LINEA BASICA': { color: '#B3A184', icono: 'card-sim', bold: true, italic: true, fondo: true },
        },
      },
      // Bitácora: ANTES con flecha hacia abajo y DESPUES hacia arriba (fa-caret-circle-down / up)
      CAMBIOS: {
        'ANTES': { '*': { color: '#b78360', icono: 'circle-chevron-down', bold: true, fondo: true } },
        'DESPUES': { '*': { color: 'themeMainColor', icono: 'circle-chevron-up', bold: true, fondo: true } },
      },
      // Control de reasignaciones: quién entra (flechas arriba, verde) y quién sale (flechas abajo, rojo)
      REASIGNACIONES: {
        'Responsable Entrante': { '*': { color: 'green', icono: 'chevrons-up', fondo: true } },
        'Responsable Saliente': { '*': { color: 'red', icono: 'chevrons-down', fondo: true } },
      },
      ACCESORIOS: {
        'Categoria': {
          'Cargadores': { color: '#006699', bold: true, italic: true },
          'Fundas': { color: 'pink', bold: true, italic: true },
          'Micas': { color: '#998459', bold: true, italic: true },
        },
      },
    };

    /** HTML con la regla de formato del AppSheet para ese valor (o null si no hay regla). */
    function estiloAppSheet(regla, texto) {
      const c = colorAppSheet(regla.color);
      const estilo = 'color:' + c + ';' + (regla.tam ? 'font-size:' + regla.tam + 'em;' : '') + (regla.bold ? 'font-weight:700;' : '') + (regla.italic ? 'font-style:italic;' : '') +
        (regla.fondo ? 'background:color-mix(in srgb, ' + c + ' 12%, transparent);border:1px solid color-mix(in srgb, ' + c + ' 45%, transparent);' : '');
      return '<span class="ln-regla' + (regla.fondo ? ' ln-regla-chip' : '') + '" style="' + estilo + '">' + (regla.icono ? ico(regla.icono) + ' ' : '') + esc(texto) + '</span>';
    }
    function formatoAppSheet(modulo, columna, valor) {
      const porColumna = (REGLAS_FORMATO[modulo] || {})[columna];
      if (!porColumna || valor === null || valor === undefined || valor === '') return null;
      const regla = porColumna[String(valor).trim().toUpperCase()] || porColumna[String(valor).trim()] || porColumna['*'];
      return regla ? estiloAppSheet(regla, String(valor)) : null;
    }

    let tiposTablaListos = false;
    /** DataTable con los valores por omisión del módulo (el tipo lnFechaHora ordena por fecha y hora). */
    function tablaLineas(contenedor, config) {
      if (!tiposTablaListos) {
        tiposTablaListos = true;
        DataTable.registrarTipo('lnFechaHora', {
          hereda: 'fecha',
          formatear: fechaTabla,
          claveOrden: (v) => {
            const d = v instanceof Date ? v : new Date(v);
            return v === '' || v === null || v === undefined || isNaN(d) ? null : d.getTime();
          },
        });
      }
      // Selección como en Google Drive (30-sep): un clic selecciona y arriba salen sus acciones (⋮ con las demás, también
      // con clic derecho); doble clic abre; Ctrl/Shift para varias; el cuadro se arrastra desde fuera de las filas
      // Sin Copiar ni Exportar selección en el menú (usuario, 30-sep; Ctrl+C sigue copiando). La selección se conserva
      // al usar las tarjetas, la captura o el ⋮ de la ficha; cualquier otro clic fuera de la tabla la quita
      return DataTable.crear(contenedor, Object.assign({
        tamanoPagina: 50, seleccionable: true, modoSeleccion: true, seleccionDrive: true, accionesDeTabla: false,
        // Líneas trae su propia vista de tarjetas (#ln-modo-vista): hasta unificarla (plan responsivo, fase 4)
        // no se suma el botón Tabla / Tarjetas del DataTable
        tarjetas: false,
        conservarSeleccion: (el) => !!el.closest('#ln-listado .ln-cuadro, #ln-modal-captura, .ln-menu-flotante'),
      }, config));
    }

    /**
     * Panel lateral con el mismo aspecto y comportamiento que el detalle de DataTable (clases .dt-panel):
     * se cierra con Esc, con la X o con clic fuera, y regresa el foco a donde estaba.
     * Regresa { cuerpo, cerrar, alCerrar }. Solo hay uno abierto a la vez.
     */
    let panelAbierto = null;
    function abrirPanelLateral(titulo, subtitulo, opciones) {
      const o = opciones || {};
      // "Detalles" (no modal, como en Drive): si ya está abierto se reutiliza, sin animación ni robar el foco
      if (o.noModal && panelAbierto && panelAbierto.noModal) {
        const api = panelAbierto;
        api.elemento.querySelector('.dt-panel-header > div').innerHTML = '<h3>' + esc(titulo) + '</h3>' + (subtitulo ? '<p>' + esc(subtitulo) + '</p>' : '');
        const nuevo = api.cuerpo.cloneNode(false);
        api.cuerpo.replaceWith(nuevo);
        api.cuerpo = nuevo;
        return api;
      }
      if (panelAbierto) panelAbierto.cerrar();
      const focoPrevio = document.activeElement;
      const fondo = document.createElement('div');
      fondo.className = 'dt-panel-fondo';
      const elemento = document.createElement('aside');
      elemento.className = 'dt-panel ln-panel' + (o.noModal ? ' ln-panel-nomodal' : '');
      elemento.setAttribute('role', 'dialog');
      elemento.setAttribute('aria-modal', o.noModal ? 'false' : 'true');
      elemento.setAttribute('aria-label', titulo);
      elemento.innerHTML = '<div class="dt-panel-header"><div><h3>' + esc(titulo) + '</h3>' + (subtitulo ? '<p>' + esc(subtitulo) + '</p>' : '') + '</div>' +
        '<button type="button" class="modal-close dt-panel-cerrar" title="Cerrar" aria-label="Cerrar">' + icono('x') + '</button></div>' +
        '<div class="dt-panel-cuerpo"></div>';
      // Sin fondo en el modo no modal: la tabla sigue a la mano para elegir otra fila
      if (o.noModal) document.body.append(elemento); else document.body.append(fondo, elemento);
      const alTecla = (ev) => { if (ev.key === 'Escape') { ev.stopPropagation(); cerrar(); } };
      const api = { elemento: elemento, cuerpo: elemento.querySelector('.dt-panel-cuerpo'), cerrar: cerrar, alCerrar: null, noModal: !!o.noModal };
      function cerrar() {
        if (panelAbierto !== api) return;
        panelAbierto = null;
        fondo.remove();
        elemento.remove();
        document.removeEventListener('keydown', alTecla, true);
        if (api.alCerrar) api.alCerrar();
        if (focoPrevio && document.body.contains(focoPrevio)) focoPrevio.focus();
      }
      document.addEventListener('keydown', alTecla, true);
      document.addEventListener('app:before-navigate', cerrar, { once: true });
      fondo.addEventListener('click', cerrar);
      elemento.querySelector('.dt-panel-cerrar').addEventListener('click', cerrar);
      panelAbierto = api;
      pintarIconos(elemento);
      if (!o.noModal) elemento.querySelector('.dt-panel-cerrar').focus();
      return api;
    }

    /** Menú flotante con el mismo aspecto que el ⋮ de las tablas. items = [{ icono, texto, alHacer, separador, peligro }] */
    function menuFlotante(ancla, items) {
      document.querySelectorAll('.ln-menu-flotante').forEach((m) => m.remove());
      if (!items.length) return;
      const menu = document.createElement('div');
      menu.className = 'dt-popover dt-menu ln-menu-flotante';
      menu.setAttribute('role', 'menu');
      menu.innerHTML = items.map((it, i) => ((it.separador || it.titulo) && i ? '<hr>' : '') +
        (it.titulo ? '<div class="dt-menu-titulo">' + esc(it.titulo) + '</div>' : '') +
        '<button type="button" data-i="' + i + '"' + (it.peligro ? ' class="dt-peligro"' : '') + '>' + icono(it.icono) + ' ' + esc(it.texto) + '</button>').join('');
      document.body.appendChild(menu);
      pintarIconos(menu);
      const r = ancla.getBoundingClientRect();
      menu.style.left = Math.max(8, Math.min(r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 8)) + 'px';
      menu.style.top = (r.bottom + menu.offsetHeight + 8 > window.innerHeight ? Math.max(8, r.top - menu.offsetHeight - 6) : r.bottom + 6) + 'px';
      const cerrar = () => {
        menu.remove();
        document.removeEventListener('mousedown', fuera, true);
        document.removeEventListener('keydown', tecla, true);
      };
      const fuera = (ev) => { if (!menu.contains(ev.target) && !ancla.contains(ev.target)) cerrar(); };
      const tecla = (ev) => { if (ev.key === 'Escape') { ev.stopPropagation(); cerrar(); } };
      document.addEventListener('mousedown', fuera, true);
      document.addEventListener('keydown', tecla, true);
      document.addEventListener('app:before-navigate', cerrar, { once: true });
      menu.addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-i]');
        if (!b) return;
        cerrar();
        items[Number(b.dataset.i)].alHacer();
      });
      menu.querySelector('button').focus();
    }

    /** "Última responsiva / inspección" desde un menú: usa el mismo camino que el botón (pestaña nueva, avisos). */
    function abrirUltimoDesdeMenu(tipo, id) {
      const b = document.createElement('button');
      b.dataset.lnUltimo = tipo;
      b.dataset.id = id;
      b.textContent = tipo === 'RESPONSIVA' ? 'Última responsiva' : 'Última inspección';
      abrirUltimoNucos(b);
    }

    /**
     * "Exportar a Excel" de los módulos: descarga la base completa (todas las filas y todas las columnas de
     * su pestaña, sin importar filtros ni búsqueda), no solo lo que se ve. Llega del servidor comprimida.
     * modulo: INVENTARIO | CAMBIOS | REASIGNACIONES | DESECHOS | REACTIVACION | SOLICITUD | ACCESORIOS
     */
    function exportarBase(modulo, nombreArchivo) {
      const descomprimir = async (b64) => {
        const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
        return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      };
      return {
        nombreArchivo: nombreArchivo,
        titulo: 'Descarga la base completa del módulo: todas las filas y columnas de la hoja, sin importar filtros ni búsqueda',
        descargar: async () => {
          const comprimir = typeof DecompressionStream === 'function';
          const r = await llamar('apiLineasExportarBase', modulo, comprimir);
          const base = JSON.parse(comprimir ? await descomprimir(r) : r);
          await ExportarExcel.descargarLibro({ nombreArchivo: nombreArchivo, hojas: base.hojas });
          return base.hojas.reduce((n, h) => n + h.filas.length, 0);
        },
      };
    }

    /**
     * Columnas de DataTable a partir de los encabezados de una hoja del AppSheet: las de `visibles`
     * se muestran en ese orden y las demás quedan ocultas (se activan desde "Columnas" y salen en
     * el panel de detalle y en el Excel). Detecta fechas y casillas por su contenido.
     */
    /** Encabezado comparable: mayúsculas, sin acentos y con un solo espacio. */
    const normEncabezado = (h) => String(h || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();

    /** "FECHA DE REGISTRO" → "Fecha de registro"; siglas cortas (NUCO, IMEI, SIM) se quedan igual. */
    const tituloLegible = (h) => {
      const t = String(h || '').trim();
      return t.length <= 5 && !/\s/.test(t) ? t : t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
    };

    function columnasDeHoja(encabezados, filas, visibles, titulos, modulo) {
      const orden = (visibles || []).map(normEncabezado);
      const norm = normEncabezado;
      const muestra = filas.slice(0, 300);
      const ordenados = encabezados.slice().sort((a, b) => {
        const ia = orden.indexOf(norm(a));
        const ib = orden.indexOf(norm(b));
        return (ia < 0 ? 1e6 : ia) - (ib < 0 ? 1e6 : ib);
      });
      return ordenados.map((h, i) => {
        const valores = muestra.map((f) => f[h]).filter((v) => v !== '' && v !== null && v !== undefined);
        const col = { campo: h, titulo: (titulos && titulos[norm(h)]) || tituloLegible(h), tipo: 'texto', visible: orden.indexOf(norm(h)) >= 0 };
        // Fecha si todo es fecha, o si el encabezado lo dice y casi todo lo es (AppSheet mezcla "N/A" y texto)
        const fechas = valores.filter(esFechaIso).length;
        if (valores.length && (fechas === valores.length || (/FECHA/.test(norm(h)) && fechas >= valores.length * 0.8))) col.tipo = 'lnFechaHora';
        else if (/^FOLIO$/.test(norm(h)) && valores.length && valores.every((v) => /^\d+$/.test(String(v).trim()))) col.tipo = 'numero';
        else if (valores.length && valores.every(esBooleano)) { col.tipo = 'lista'; col.valor = (f) => booleano(f[h]); }
        else if (/ESTATUS|ESTADO|COMPA[ÑN]IA|^TIPO|SEDE|DEPARTAMENTO|MOTIVO|LUGAR|CAMPO$/.test(norm(h))) col.tipo = 'lista';
        if (/ESTATUS|ESTADO/.test(norm(h))) col.render = (v) => chip(v);
        // Columna File/Image del AppSheet (p. ej. EVIDENCIA y AUTORIZACION de desechos): ícono que abre el archivo
        if (valores.length && valores.filter(esRutaArchivo).length >= valores.length * 0.8) {
          col.render = (v) => botonArchivo(v, 'Ver');
          col.exportarComo = 'texto';
        }
        const reglasCol = modulo && (REGLAS_FORMATO[modulo] || {})[h];
        if (reglasCol) col.render = (v) => formatoAppSheet(modulo, h, v) || (/ESTATUS|ESTADO/.test(norm(h)) ? chip(v) : esc(v));
        if (i === 0 && col.visible) col.fijada = true;
        return col;
      });
    }

    /**
     * KPIs (stat-tile de la rama jorge) que filtran la tabla con un clic, como en Vehículos o Uber.
     * defs: [{ icono, etiqueta, valor, clase, titulo, filtros, calcular }]. `filtros: { campo: filtro }`
     * usa el formato de DataTable.setFiltro; sin `filtros` el tile es "Total" (quita los de los KPIs);
     * `filtros: false` lo deja solo informativo. Otro clic sobre el activo quita su filtro.
     * `calcular: (filasFiltradas) => valor` (opcional): si se da, el valor del tile se recalcula con lo
     * que queda bajo los filtros activos de la tabla cada vez que cambian (si no se da, se queda fijo
     * en `valor`, útil para KPIs que no son un conteo, como "Última inspección").
     * Regresa marcar(filtros) para llamarlo desde `alCambiarFiltros`.
     */
    function tilesKpi(contenedor, defs, obtenerTabla) {
      const campos = defs.reduce((lista, d) => lista.concat(Object.keys(d.filtros || {})), [])
        .filter((c, i, lista) => lista.indexOf(c) === i);
      contenedor.innerHTML = defs.map((d, i) => {
        const clic = d.filtros !== false;
        return '<div class="stat-tile ' + (d.clase || '') + (clic ? ' stat-tile-clickable' : '') + '" data-kpi="' + i + '"' +
          (clic ? ' role="button" tabindex="0"' : '') + (d.titulo ? ' title="' + esc(d.titulo) + '"' : '') + '>' +
          '<div class="stat-icon">' + ico(d.icono) + '</div><div><div class="stat-value">' + esc(d.valor) + '</div>' +
          '<div class="stat-label">' + esc(d.etiqueta) + '</div></div></div>';
      }).join('');
      const tiles = Array.from(contenedor.querySelectorAll('[data-kpi]'));
      const igual = (a, b) => JSON.stringify(a || null) === JSON.stringify(b || null);
      const activo = (d, filtros) => d.filtros !== false && campos.every((c) => igual(filtros[c], (d.filtros || {})[c]));
      function marcar(filtros) {
        const tabla = obtenerTabla();
        // Sin datos todavía (los tiles se pintan antes de setDatos) se queda `valor`: si no, todo saldría en 0
        const filas = tabla && tabla.getDatos().length ? tabla.getFiltradas() : null;
        tiles.forEach((t) => {
          const d = defs[Number(t.dataset.kpi)];
          t.classList.toggle('stat-tile-activo', activo(d, filtros || {}));
          if (d.calcular && filas) {
            const valorEl = t.querySelector('.stat-value');
            if (valorEl) valorEl.textContent = d.calcular(filas);
          }
        });
      }
      function clic(t) {
        const d = defs[Number(t.dataset.kpi)];
        if (d.filtros === false) return;
        const tabla = obtenerTabla();
        if (!tabla) return;
        const quitar = !!d.filtros && t.classList.contains('stat-tile-activo');
        campos.forEach((c) => tabla.setFiltro(c, quitar ? null : ((d.filtros || {})[c] || null)));
      }
      tiles.forEach((t) => {
        t.addEventListener('click', () => clic(t));
        t.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); clic(t); } });
      });
      return marcar;
    }

    /** Días atrás como "yyyy-mm-dd" local (formato de los filtros de fecha de DataTable). */
    function diaClave(diasAtras) {
      const f = new Date();
      f.setDate(f.getDate() - (diasAtras || 0));
      return [f.getFullYear(), String(f.getMonth() + 1).padStart(2, '0'), String(f.getDate()).padStart(2, '0')].join('-');
    }
    function contarDesde(filas, campo, diasAtras) {
      const desde = diaClave(diasAtras);
      return filas.filter((f) => {
        if (!f[campo]) return false;
        const d = new Date(f[campo]);
        if (isNaN(d)) return false;
        const clave = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
        return clave >= desde;
      }).length;
    }

    // ---------------- Formularios con la definición del AppSheet ----------------
    // El servidor manda los elementos en el orden del formulario del AppSheet (titulo | campo con
    // control, opciones, valor inicial y códigos de Show_If / Required_If); aquí se dibujan y se
    // leen. Se usan en inspecciones, responsivas y altas de Reactivación y Solicitud.
    // Escalas del checklist: un control segmentado con opciones del mismo ancho (usuario, 3-oct). El valor que se
    // guarda no cambia (SI, NO, N/A…); solo el texto en pantalla y el color según lo que significa.
    const TEXTO_ESCALA = { SI: 'Sí', NO: 'No', 'N/A': 'N/A', BUENO: 'Bueno', REGULAR: 'Regular', MALO: 'Malo', INSTALADA: 'Instalada', 'NO INSTALADA': 'No instalada' };
    const CLASE_ESCALA = { SI: 'ln-pastilla-bien', BUENO: 'ln-pastilla-bien', INSTALADA: 'ln-pastilla-bien', NO: 'ln-pastilla-mal', MALO: 'ln-pastilla-mal', REGULAR: 'ln-pastilla-media' };
    function grupoEscala(opciones, valorPrevio, ayudas) {
      const textos = opciones.map((v) => TEXTO_ESCALA[v] || v);
      const ancho = Math.max(64, Math.max.apply(null, textos.map((t) => t.length)) * 8 + 28);
      return '<div class="ln-pastillas ln-segmento" role="radiogroup" style="--ancho-opcion:' + ancho + 'px">' + opciones.map((v, i) =>
        '<button type="button" role="radio" aria-checked="' + (v === valorPrevio) + '" class="ln-pastilla' + (v === valorPrevio ? ' activa' : '') + (CLASE_ESCALA[v] ? ' ' + CLASE_ESCALA[v] : '') +
        '" data-valor="' + esc(v) + '"' + (ayudas && ayudas[v] ? ' title="' + esc(ayudas[v]) + '"' : '') + '>' + esc(textos[i]) + '</button>').join('') + '</div>';
    }

    /**
     * Patrón: además de la forma, el orden y la dirección (usuario, 4-oct). Cada punto marcado lleva su número (1 = donde
     * empieza) y cada tramo una flecha hacia donde va. Lo usan la inspección, la responsiva y Editar; la imagen del PDF
     * se dibuja igual (activarPatron → base64).
     */
    const POSICIONES_PATRON = [[50, 50], [150, 50], [250, 50], [50, 150], [150, 150], [250, 150], [50, 250], [150, 250], [250, 250]];
    /**
     * Puntas de flecha de cada tramo: [[x1,y1, x2,y2, x3,y3], …] (triángulo apuntando hacia donde va). Van en los
     * espacios libres entre puntos: un tramo como 1→3 pasa por el centro del punto 2, que taparía una flecha a la mitad.
     */
    function flechasPatron(puntos, tam) {
      const t = tam || 13;
      const mcd = (x, y) => (y ? mcd(y, x % y) : x);
      const flechas = [];
      for (let i = 1; i < puntos.length; i++) {
        const a = POSICIONES_PATRON[puntos[i - 1] - 1];
        const b = POSICIONES_PATRON[puntos[i] - 1];
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        const pasos = Math.max(1, mcd(Math.abs(b[0] - a[0]) / 100, Math.abs(b[1] - a[1]) / 100)); // puntos que cruza + 1
        for (let k = 0; k < pasos; k++) {
          const f = (2 * k + 1) / (2 * pasos);
          const cx = a[0] + (b[0] - a[0]) * f + Math.cos(ang) * t * 0.3;
          const cy = a[1] + (b[1] - a[1]) * f + Math.sin(ang) * t * 0.3;
          const p = (d, r) => [cx + Math.cos(ang + d) * r, cy + Math.sin(ang + d) * r];
          flechas.push([].concat(p(0, t * 0.6), p(Math.PI * 0.75, t), p(-Math.PI * 0.75, t)));
        }
      }
      return flechas;
    }

    function htmlPatron(prefijo, oculto) {
      return '<div id="' + prefijo + '-bloque"' + (oculto ? ' hidden' : '') + '><div class="ln-patron" id="' + prefijo + '-lienzo"><svg id="' + prefijo + '-lineas" viewBox="0 0 300 300" aria-hidden="true"></svg>' +
        Array.from({ length: 9 }, (_, i) => '<button type="button" class="ln-patron-punto" data-punto="' + (i + 1) + '" aria-label="Punto ' + (i + 1) + '"></button>').join('') +
        '</div><div class="ln-patron-acciones"><span></span><button type="button" class="secondary ln-btn-chico" id="' + prefijo + '-limpiar">Limpiar patrón</button></div></div>';
    }

    /**
     * Patrón para consulta (pestaña General y capturas). PATRON guarda los puntos trazados en el sistema ("1-5-9") o, si
     * viene del AppSheet, la ruta de su imagen ("INSPECCIONES LINEAS_Images/xxxx.PATRON.123456.png"): los puntos se
     * dibujan como en la captura y la imagen se pide al servidor (cargarPatronesAppSheet). Al trazar uno nuevo la
     * columna guarda los puntos y la imagen del AppSheet deja de mostrarse (usuario, 5-oct).
     */
    function rutaPatronAppSheet(valor) {
      const v = rutaAppSheetLimpia(valor);
      return /^[^\/]+_(Files_|Images)\/[^\/]+\.PATRON\.[^\/]*$/i.test(v) ? v : null;
    }
    function svgPatron(valor) {
      const pts = String(valor).split('-').map(Number);
      const pos = (n) => POSICIONES_PATRON[n - 1];
      return '<svg class="ln-patron-vista" viewBox="0 0 300 300" role="img" aria-label="Patrón ' + esc(pts.join(' → ')) + '">' +
        (pts.length > 1 ? '<polyline points="' + pts.map((n) => pos(n).join(',')).join(' ') + '" />' : '') +
        flechasPatron(pts, 24).map((f) => '<polygon class="ln-patron-flecha" points="' + f.map((n) => n.toFixed(1)).join(',') + '" />').join('') +
        POSICIONES_PATRON.map((p, i) => {
          const orden = pts.indexOf(i + 1);
          if (orden < 0) return '<circle class="ln-patron-libre" cx="' + p[0] + '" cy="' + p[1] + '" r="10" />';
          return (orden === 0 ? '<circle class="ln-patron-inicio" cx="' + p[0] + '" cy="' + p[1] + '" r="21" />' : '') +
            '<circle class="ln-patron-marcado" cx="' + p[0] + '" cy="' + p[1] + '" r="16" />' +
            '<text x="' + p[0] + '" y="' + (p[1] + 1) + '">' + (orden + 1) + '</text>';
        }).join('') + '</svg>';
    }
    function vistaPatron(valor) {
      const v = String(valor === null || valor === undefined ? '' : valor).trim();
      if (!v) return vacio;
      if (esPuntosPatron(v)) return '<div class="ln-patron-consulta">' + svgPatron(v) + '</div>';   // el dibujo ya marca inicio, orden y dirección
      const ruta = rutaPatronAppSheet(v);
      if (!ruta) return esRutaArchivo(v) ? botonArchivo(v, 'Ver patrón') : esc(v); // "••••" (oculto para el rol)
      return '<div class="ln-patron-consulta" data-ln-patron-appsheet="' + esc(ruta) + '"><span class="ln-tenue"><span class="ln-spinner"></span> Patrón de AppSheet…</span></div>';
    }
    const patronesAppSheet = {};   // ruta → promesa de la imagen (en memoria mientras dure la página)
    function cargarPatronesAppSheet(contenedor) {
      if (!contenedor) return;
      contenedor.querySelectorAll('[data-ln-patron-appsheet]:not([data-cargado])').forEach((el) => {
        el.dataset.cargado = '1';
        const ruta = el.dataset.lnPatronAppsheet;
        const promesa = patronesAppSheet[ruta] || (patronesAppSheet[ruta] = llamar('apiLineasPatronAppSheet', ruta));
        promesa.then((r) => {
          el.innerHTML = '<img class="ln-patron-vista" alt="Patrón capturado en AppSheet" src="' + esc(r.imagen) + '" /><span class="ln-tenue">Capturado en AppSheet</span>';
        }).catch((e) => {
          delete patronesAppSheet[ruta];
          el.innerHTML = '<span class="ln-tenue">' + icono('image-off', 'ln-icon-sm') + ' ' + mensajeError(e) + '</span>';
        });
      });
    }

    /**
     * Varias opciones (accesorios): cada una se prende o apaga; NINGUNO apaga las demás y elegir otra apaga NINGUNO
     * (usuario, 4-oct: solo dejaba elegir una).
     */
    function alternarMulti(boton) {
      const todos = Array.from(boton.parentElement.querySelectorAll('.ln-pastilla-multi'));
      const ninguno = (b) => String(b.dataset.valor || '').toUpperCase() === 'NINGUNO';
      const prender = !boton.classList.contains('activa');
      if (prender && ninguno(boton)) todos.forEach((b) => b.classList.remove('activa'));
      if (prender && !ninguno(boton)) todos.filter(ninguno).forEach((b) => b.classList.remove('activa'));
      boton.classList.toggle('activa', prender);
    }

    // ---- Formularios del AppSheet (INSPECCIONES LINEAS_Form / RESPONSIVAS LINEAS_Form) ----
    // El servidor manda los elementos en el orden del AppSheet; aquí se dibujan y se aplican
    // los Show_If / Required_If sobre [TIPO] con los mismos códigos (LineasChecklist.CONDICIONES).
    const CONDICIONES_APPSHEET = {
      SIEMPRE: () => true,
      NUNCA: () => false,
      NO_LINEA: (t) => t !== 'LINEA',
      NO_EQUIPO: (t) => t !== 'EQUIPO',
      EQUIPOS: (t) => t === 'EQUIPO + SIM' || t === 'EQUIPO',
      VOZ: (t) => t === 'EQUIPO + SIM' || t === 'LINEA',
      BATERIA: (t) => ['EQUIPO + SIM', 'EQUIPO', 'BANDA ANCHA'].indexOf(t) >= 0,
      EQUIPOS_Y_MODEMS: (t) => ['EQUIPO + SIM', 'EQUIPO', 'MODEM', 'BANDA ANCHA'].indexOf(t) >= 0,
      MODEM: (t) => t.indexOf('MODEM') >= 0 || t.indexOf('BANDA ANCHA') >= 0,
      MODEM_Y_BANDA: (t) => t.indexOf('MODEM') >= 0 && t.indexOf('BANDA ANCHA') >= 0,
    };
    /**
     * Show_If / Required_If / Editable_If. `cond` es un código sobre [TIPO] (CONDICIONES_APPSHEET) o un
     * objeto como los de LineasRegistros.gs: { tipoLleno } { tipoEn } { tipoNoEn } { campo, igual } { nuevo } { y }.
     */
    function cumpleCondicion(cond, tipo, valores, ctx) {
      if (typeof cond === 'string' && cond.charAt(0) === '{') { try { cond = JSON.parse(cond); } catch (e) { return true; } }
      if (cond === undefined || cond === null || cond === '' || cond === 'SIEMPRE') return true;
      if (cond === 'NUNCA') return false;
      const t = String((valores && valores.TIPO !== undefined ? valores.TIPO : tipo) || '').trim().toUpperCase();
      // Los tipos básicos no existían en el AppSheet: para sus reglas valen como EQUIPO + SIM y LINEA (LineasChecklist.tipoBase)
      if (typeof cond === 'string') return !!CONDICIONES_APPSHEET[cond] && CONDICIONES_APPSHEET[cond](t.replace(/ BASIC[OA]$/, ''));
      if (cond.y) return cond.y.every((c) => cumpleCondicion(c, tipo, valores, ctx));
      if (cond.tipoLleno) return !!t;
      if (cond.tipoEn) return cond.tipoEn.indexOf(t) >= 0;
      if (cond.tipoNoEn) return cond.tipoNoEn.indexOf(t) < 0;
      if (cond.nuevo) return !!(ctx && ctx.nuevo);
      if (cond.campo) return String((valores || {})[cond.campo] || '').trim().toUpperCase() === String(cond.igual).toUpperCase();
      return true;
    }
    const condAtributo = (c) => esc(typeof c === 'object' && c !== null ? JSON.stringify(c) : (c || 'SIEMPRE'));

    // CALIFICACION: misma AppFormula del AppSheet (ver LineasChecklist.calificacion)
    const CALIFICACION_SI = ['IDENTIFICACION', 'CUBO', 'CABLE', 'FUNDA', 'MICA', 'PANTALLA', 'BOTONES VOLUMEN', 'BOTON ENCENDIDO',
      'CUERPO EQUIPO', 'CAMARA', 'PUERTO CARGA', 'ALTAVOZ', 'BOCINAS', 'MICROFONO', 'LINEA DE VOZ'];
    const CALIFICACION_DESEMPENO = { 'DURACION BATERIA': 1, 'TEMPERATURA': 1, 'DESEMPEÑO': 1 };
    function calificacionAppSheet(valores) {
      let suma = 0;
      let contestados = 0;
      CALIFICACION_SI.forEach((c) => { if (valores[c] === 'SI') { suma++; contestados++; } else if (valores[c] === 'NO') contestados++; });
      Object.keys(CALIFICACION_DESEMPENO).forEach((c) => {
        const n = { BUENO: 1, REGULAR: 0.5, MALO: 0 }[valores[c]];
        if (n !== undefined) { suma += n; contestados++; }
      });
      return suma / Math.max(1, contestados);
    }

    const esPuntosPatron = (v) => /^[1-9](-[1-9])*$/.test(String(v || ''));

    // "AUTO" solo en lo que el formulario llena solo (fórmula o copia de otro campo; lo que llega al elegir a la persona lo
    // marca CampoAuto.llenar). Lo que solo se muestra (datos del equipo en Mandar a resguardo, NUCO fijo, fecha de alta) no:
    // el usuario lo marcó como error en producción (4-oct).
    const autoDe = (e) => !!(e.formula || e.deriva || e.auto);

    function htmlElementoFormulario(e) {
      if (e.tipo === 'titulo') return '<h4 class="ln-af-titulo">' + (e.icono ? icono(e.icono) + ' ' : '') + esc(e.texto) + '</h4>';
      const id = 'af-' + e.columna.replace(/[^A-Za-z0-9]+/g, '-');
      const attrs = ' id="' + id + '" data-columna="' + esc(e.columna) + '"' + (e.virtual ? ' data-virtual' : '') + (e.deriva ? ' data-deriva-de="' + esc(e.deriva.de) + '" data-deriva-dato="' + esc(e.deriva.dato) + '"' : '') + (e.literal || e.secreto ? ' data-respetar-texto' : '') + (e.soloLectura ? ' readonly tabindex="-1"' : '') + (autoDe(e) ? ' data-auto' : '');
      const valor = e.valor === null || e.valor === undefined ? '' : String(e.valor);
      let control;
      if (e.control === 'escala') {
        control = '<div class="ln-checklist-punto" data-columna="' + esc(e.columna) + '">' + grupoEscala(e.opciones || [], valor || null, e.ayudas) + '</div>';
      } else if (e.control === 'lista') {
        const opciones = (e.opciones || []).slice();
        const fuera = valor && opciones.map((o) => String(o).toUpperCase()).indexOf(valor.toUpperCase()) < 0;
        control = '<select' + attrs + '><option value="">Selecciona…</option>' +
          (fuera ? '<option value="' + esc(valor) + '" selected>' + esc(valor) + ' (no está en la lista)</option>' : '') +
          opciones.map((o) => '<option value="' + esc(o) + '"' + (String(o).toUpperCase() === valor.toUpperCase() ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
      } else if (e.control === 'listaAbierta') {
        // Enum con AllowOtherValues del AppSheet: sugerencias en su orden y cualquier otro valor
        control = '<input type="text"' + attrs + ' data-lista-abierta="1" value="' + esc(valor) + '" autocomplete="off" />';
      } else if (e.control === 'numero') {
        control = '<input type="text" inputmode="decimal"' + attrs + ' value="' + esc(valor) + '" autocomplete="off" />';
      } else if (e.control === 'multi') {
        // EnumList del AppSheet: varias opciones; se guarda "A , B". "SD" de antes es "TARJETA SD" (usuario, 4-oct)
        const conTarjeta = (e.opciones || []).indexOf('TARJETA SD') >= 0;
        const elegidas = valor.split(',').map((x) => x.trim().toUpperCase()).filter(Boolean).map((x) => (x === 'SD' && conTarjeta ? 'TARJETA SD' : x));
        control = '<div class="ln-multi" data-columna="' + esc(e.columna) + '"><div class="ln-pastillas">' + (e.opciones || []).map((o) =>
          '<button type="button" class="ln-pastilla ln-pastilla-multi' + (elegidas.indexOf(String(o).toUpperCase()) >= 0 ? ' activa' : '') + '" data-valor="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div></div>';
      } else if (e.control === 'archivo') {
        const enlace = valor ? botonArchivo(valor, 'Ver archivo actual') : '<span class="ln-tenue">Sin archivo</span>';
        control = '<div class="ln-af-archivo">' + enlace + '<input type="file" id="' + id + '" data-archivo="' + esc(e.columna) + '" accept="application/pdf,image/*" /></div>';
      } else if (e.control === 'fecha') {
        control = '<input type="date"' + attrs + ' value="' + esc(valor) + '" />';
      } else if (e.control === 'siNo') {
        control = '<div class="ln-checklist-punto" data-columna="' + esc(e.columna) + '" data-si-no="1"><div class="ln-pastillas">' +
          [['TRUE', 'Sí'], ['FALSE', 'No']].map(([v, t]) => '<button type="button" class="ln-pastilla' + (valor.toUpperCase() === v ? ' activa' : '') + (v === 'FALSE' ? ' ln-pastilla-mal' : '') + '" data-valor="' + v + '">' + t + '</button>').join('') + '</div></div>';
      } else if (e.control === 'referencia') {
        // Ref del AppSheet: se elige por etiqueta y se guarda el ID de la fila
        const elegida = valor ? (e.opciones || []).filter((o) => String(o.id) === valor)[0] : null;
        control = '<input type="text"' + attrs + ' data-referencia="1" autocomplete="off" placeholder="Escribe para buscar…" value="' + esc(elegida ? elegida.etiqueta : '') + '" />';
      } else if (e.control === 'area') {
        control = '<textarea' + attrs + ' rows="4">' + esc(valor) + '</textarea>';
      } else if (e.control === 'fechaHora') {
        control = '<input type="datetime-local"' + attrs + ' value="' + esc(valor) + '" />';
      } else if (e.control === 'patron') {
        const nota = e.valorOculto ? 'Registrado (solo lo ven administradores y el área de Líneas). Si no trazas uno nuevo, se conserva.'
          : (valor && !esPuntosPatron(valor) ? 'Hay un patrón capturado en AppSheet (imagen). Si no trazas uno nuevo, se conserva.' : '');
        // El del AppSheet se ve junto a la nota hasta que se trace uno nuevo
        const anterior = !e.valorOculto && valor && !esPuntosPatron(valor) && rutaPatronAppSheet(valor) ? vistaPatron(valor) : '';
        control = (nota ? '<div class="ln-nota">' + icono('info', 'ln-icon-sm') + ' ' + esc(nota) + '</div>' : '') + anterior + htmlPatron(id + '-patron', false);
      } else if (e.control === 'firma') {
        control = htmlFirma(ROL_FIRMA[e.columna] || 'ci', id + '-firma');
      } else if (e.control === 'calculado') {
        control = '<div' + (autoDe(e) ? ' data-auto' : '') + ' class="ln-af-calculado' + (e.fijo ? ' ln-af-fijo' : (e.formula ? '' : ' ln-af-calculado-texto')) + '" id="' + id + '"' + (e.formula ? ' data-formula="' + esc(e.formula) + '"' : '') + '>' + (valor ? esc(valor) : '—') + '</div>';
      } else {
        control = '<input type="text"' + attrs + ' value="' + esc(valor) + '" autocomplete="off"' + (e.valorOculto ? ' placeholder="•••• (se conserva el valor registrado)"' : '') + ' />';
      }
      const ancho = ['escala', 'area', 'patron', 'firma'].indexOf(e.control) >= 0 ? ' ln-af-ancho' : '';
      return '<div class="field ln-af-campo' + ancho + (e.control === 'escala' ? ' ln-af-escala' : '') + (e.soloLectura ? ' ln-af-lectura' : '') + '" data-af-columna="' + esc(e.columna) + '" data-mostrar="' + condAtributo(e.mostrar) + '" data-requerido="' + condAtributo(e.requerido) + '" data-editable="' + condAtributo(e.editable) + '">' +
        '<label for="' + id + '">' + esc(e.etiqueta) + '<span class="ln-af-req"' + (e.requerido === 'SIEMPRE' ? '' : ' hidden') + '> *</span></label>' + control + '</div>';
    }

    // Firmas: quién firma (su nombre va debajo de la línea) y de qué lado
    const NOMBRE_DE_FIRMA = { 'FIRMA INSPECTOR': 'NOMBRE INSPECTOR', 'FIRMA CI': 'NOMBRE CI', 'FIRMA RESPONSABLE': 'RESPONSABLE' };
    const ROL_FIRMA = { 'FIRMA INSPECTOR': 'ci', 'FIRMA CI': 'ci', 'FIRMA RESPONSABLE': 'responsable' };

    /**
     * Dibuja el formulario agrupando cada título del AppSheet con sus campos. Con `acomodar` (inspección y
     * responsiva) cada sección muestra primero lo que ya se sabe (solo lectura, como datos), luego lo que se
     * captura, después los campos anchos (observaciones, patrón) y al final las firmas lado a lado. Es solo
     * acomodo visual: el orden, las condiciones y lo que se guarda siguen siendo los del AppSheet.
     */
    function htmlFormularioAppSheet(elementos, opciones) {
      const acomodar = opciones && opciones.acomodar;
      const secciones = [];
      elementos.forEach((e) => {
        if (e.tipo === 'titulo' || !secciones.length) secciones.push({ titulo: e.tipo === 'titulo' ? e : null, campos: [] });
        if (e.tipo !== 'titulo') secciones[secciones.length - 1].campos.push(e);
      });
      const html = (lista) => lista.map(htmlElementoFormulario).join('');
      const mayus = (t) => String(t || '').trim().toUpperCase();
      return secciones.map((sec) => {
        let cuerpo;
        if (!acomodar) {
          cuerpo = '<div class="ln-af-grid">' + html(sec.campos) + '</div>';
        } else {
          const nombresDeFirma = sec.campos.filter((e) => e.control === 'firma' && NOMBRE_DE_FIRMA[e.columna] && NOMBRE_DE_FIRMA[e.columna] !== 'RESPONSABLE')
            .map((e) => NOMBRE_DE_FIRMA[e.columna]);
          const ocultos = sec.campos.filter((e) => e.soloLectura && nombresDeFirma.indexOf(e.columna) >= 0);
          const lectura = sec.campos.filter((e) => e.soloLectura && e.control !== 'calculado' && ocultos.indexOf(e) < 0);
          const firmas = sec.campos.filter((e) => e.control === 'firma');
          const anchos = sec.campos.filter((e) => e.control === 'area' || e.control === 'patron');
          const escalas = sec.campos.filter((e) => e.control === 'escala' && e.checklist); // renglones del checklist; las demás, a todo lo ancho
          const resto = sec.campos.filter((e) => [ocultos, lectura, firmas, anchos, escalas].every((g) => g.indexOf(e) < 0));
          cuerpo = (lectura.length ? '<div class="ln-af-grid ln-af-datos">' + html(lectura) + '</div>' : '') +
            (escalas.length ? '<div class="ln-checklist-lista">' + html(escalas) + '</div>' : '') +
            (resto.length ? '<div class="ln-af-grid">' + html(resto) + '</div>' : '') +
            anchos.map((e) => '<div class="ln-af-completo' + (sec.campos.length === 1 && sec.titulo && mayus(e.etiqueta) === mayus(sec.titulo.texto) ? ' ln-af-sin-etiqueta' : '') + '">' +
              htmlElementoFormulario(e) + '</div>').join('') +
            (firmas.length ? '<div class="ln-firmas">' + html(firmas) + '</div>' : '') +
            (ocultos.length ? '<div hidden>' + html(ocultos) + '</div>' : '');
        }
        return '<section class="ln-af-seccion">' + (sec.titulo ? htmlElementoFormulario(sec.titulo) : '') + cuerpo + '</section>';
      }).join('');
    }

    // ---- Bloqueo del equipo (mejora): una lista decide si se captura PIN, patrón o contraseña ----
    // El valor se sigue guardando como en AppSheet: PIN EQUIPO lleva el PIN, la contraseña o "PATRON".
    const OPCIONES_BLOQUEO = ['PIN', 'PATRÓN', 'CONTRASEÑA', 'SIN BLOQUEO'];
    function conSelectorBloqueo(elementos) {
      const pin = elementos.filter((e) => e.columna === 'PIN EQUIPO')[0];
      const patron = elementos.filter((e) => e.control === 'patron')[0];
      if (!pin || !patron || elementos.some((e) => e.columna === '_BLOQUEO')) return elementos;
      const v = String(pin.valor || '').trim().toUpperCase();
      const inicial = v === 'PATRON' || v === 'PATRÓN' || esPuntosPatron(patron.valor) ? 'PATRÓN'
        : (/^\d+$/.test(v) ? 'PIN' : (/^(N\/A|NA|NO APLICA|NINGUNO|SIN BLOQUEO)$/.test(v) ? 'SIN BLOQUEO' : (v ? 'CONTRASEÑA' : '')));
      const selector = { tipo: 'campo', columna: '_BLOQUEO', etiqueta: 'TIPO DE BLOQUEO DEL EQUIPO', control: 'lista', opciones: OPCIONES_BLOQUEO, valor: inicial, mostrar: pin.mostrar, requerido: 'NUNCA', virtual: true };
      const i = elementos.indexOf(pin);
      return elementos.slice(0, i).concat([selector], elementos.slice(i));
    }
    /** Muestra el PIN, la contraseña o el patrón según el bloqueo elegido. `cambio`: el usuario acaba de elegirlo. */
    function aplicarBloqueo(cuerpo, cambio) {
      const sel = cuerpo.querySelector('select[data-columna="_BLOQUEO"]');
      if (!sel) return;
      const t = sel.value;
      const campoPin = cuerpo.querySelector('.ln-af-campo[data-af-columna="PIN EQUIPO"]');
      const lienzo = cuerpo.querySelector('.ln-patron');
      const campoPatron = lienzo && lienzo.closest('.ln-af-campo');
      if (campoPin) {
        const input = campoPin.querySelector('input');
        campoPin.classList.toggle('ln-oculto', t !== 'PIN' && t !== 'CONTRASEÑA');
        const etiqueta = campoPin.querySelector('label');
        if (etiqueta && etiqueta.firstChild) etiqueta.firstChild.textContent = t === 'CONTRASEÑA' ? 'CONTRASEÑA DEL EQUIPO' : 'PIN DEL EQUIPO';
        if (input) {
          input.inputMode = t === 'PIN' ? 'numeric' : 'text';
          if (cambio) {
            if (t === 'PATRÓN') input.value = 'PATRON';
            else if (t === 'SIN BLOQUEO') input.value = 'N/A';
            else if (/^(PATRON|N\/A)$/i.test(input.value)) input.value = '';
          }
        }
      }
      if (campoPatron) campoPatron.classList.toggle('ln-oculto', t !== 'PATRÓN');
    }

    /** Caja de firma: marco dorado para el responsable y azul para Control Interno; el lienzo lo pone crearFirma. */
    function htmlFirma(rol, idLienzo) {
      return '<div class="ln-firma ln-firma-' + rol + '"><div class="ln-firma-cabecera">' + icono(rol === 'ci' ? 'shield-check' : 'user') + ' ' +
        (rol === 'ci' ? 'Firma de Control Interno' : 'Firma del responsable') + '</div><div class="ln-firma-lienzo" id="' + idLienzo + '"></div></div>';
    }

    /** Firma con el componente del sistema; misma interfaz que antes (estaVacia, limpiar, base64 → promesa). */
    function crearFirma(contenedor, nombre) {
      if (!contenedor || typeof Firma === 'undefined') return null;
      const f = Firma.crear(contenedor, { nombre: nombre || '', marca: 'Firma aquí con el dedo' });
      return {
        estaVacia: () => f.vacia(),
        limpiar: () => f.limpiar(),
        ajustar: () => f.ajustar(),
        setNombre: (n) => f.setNombre(n || ''),
        /** PNG con el color de la celda del PDF (la firma llega recortada al trazo). */
        base64: (fondo) => {
          const x = f.exportar();
          if (!x) return Promise.resolve(null);
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              const c = document.createElement('canvas');
              c.width = img.naturalWidth; c.height = img.naturalHeight;
              const g = c.getContext('2d');
              g.fillStyle = fondo || '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0);
              resolve(c.toDataURL('image/png').split(',')[1]);
            };
            img.onerror = () => resolve(x.base64);
            img.src = 'data:' + x.mimeType + ';base64,' + x.base64;
          });
        },
      };
    }

    // ---------------- Formularios por pasos ----------------
    // Mismo aspecto y comportamiento que el componente Formulario del sistema (.form-pasos, .form-paso-chip,
    // "Paso x de y", Atrás / Siguiente): se valida cada paso antes de avanzar, solo se salta a pasos ya
    // vistos y los pasos sin campos visibles (Show_If según el TIPO) se omiten. Los elementos conservan el
    // orden del AppSheet: cada paso empieza en la columna o el título (`titulo:…`) que indica `desde`.
    const PASOS_FORMULARIO = {
      INSPECCION: [
        // Sin textos de ayuda en los pasos (usuario, 4-oct): el título y los campos bastan
        { titulo: 'Datos', icono: 'id-card', desde: 'titulo:EQUIPO' },
        { titulo: 'Accesorios y sistema', icono: 'package-check', desde: 'titulo:DOCUMENTACIÓN / ACCESORIOS' },
        { titulo: 'Estado físico', icono: 'smartphone', desde: 'titulo:ESTADO FÍSICO GENERAL' },
        { titulo: 'Accesos y apps', icono: 'key-round', desde: 'titulo:BLOQUEO Y CONTRASEÑAS' },
        { titulo: 'Fotos', icono: 'camera', desde: 'extra:FOTOS', siempre: true },
        { titulo: 'Firmas', icono: 'signature', desde: 'titulo:DATOS DE LA INSPECCIÓN' },
      ],
      RESPONSIVA: [
        { titulo: 'Datos', icono: 'id-card', desde: 'titulo:EQUIPO' },
        { titulo: 'Accesorios y accesos', icono: 'key-round', desde: 'titulo:ACCESORIOS Y ACCESOS' },
        { titulo: 'Firmas', icono: 'signature', desde: 'titulo:DATOS DE LA RESPONSIVA' },
      ],
      // Editar y Agregar (usuario, 4-oct): una pestaña por parte de lo guardado
      REGISTRO_EQUIPO: [
        { titulo: 'Equipo', icono: 'smartphone', desde: 'titulo:EQUIPO' },
        { titulo: 'Responsable', icono: 'user', desde: 'titulo:RESPONSABLE' },
        { titulo: 'Línea', icono: 'card-sim', desde: 'titulo:LÍNEA' },
        { titulo: 'Adendum', icono: 'file-text', desde: 'titulo:ADENDUM' },
        { titulo: 'Accesorios y accesos', icono: 'key-round', desde: 'titulo:ACCESORIOS Y ACCESOS' },
      ],
      REGISTRO_LINEA: [
        { titulo: 'Línea', icono: 'card-sim', desde: 'titulo:LÍNEA' },
        { titulo: 'Responsable', icono: 'user', desde: 'titulo:RESPONSABLE' },
        { titulo: 'Adendum', icono: 'file-text', desde: 'titulo:ADENDUM' },
        { titulo: 'Accesos', icono: 'key-round', desde: 'titulo:ACCESOS' },
      ],
      SOLICITUD: [
        { titulo: 'Solicitud', icono: 'file-plus', desde: 'FOLIO' },
        { titulo: 'Solicitante', icono: 'user', desde: 'NO EMPLEADO SOLICITANTE', descripcion: 'Elige a la persona y se llenan sus datos.' },
        { titulo: 'Asignación', icono: 'users', desde: 'SEDE' },
        { titulo: 'Línea y equipo', icono: 'smartphone', desde: 'COMPAÑIA' },
      ],
    };

    /** Reparte los elementos (en orden del AppSheet) entre los pasos según `desde`. */
    function repartirEnPasos(elementos, pasos) {
      const grupos = pasos.map(() => []);
      let actual = 0;
      elementos.forEach((e) => {
        const clave = e.tipo === 'titulo' ? 'titulo:' + e.texto : e.columna;
        const siguiente = pasos.findIndex((p, k) => k > actual && p.desde === clave);
        if (siguiente > actual) actual = siguiente;
        grupos[actual].push(e);
      });
      // Un paso que es una sola sección del AppSheet no repite su título (ya lo dice el paso)
      return grupos.map((g) => (g.filter((e) => e.tipo === 'titulo').length === 1 && g[0] && g[0].tipo === 'titulo' ? g.slice(1) : g));
    }

    /** Indicador de pasos + un <section class="form-paso"> por paso. `extras`: { índice: html } al final del paso. */
    function htmlPasosAppSheet(elementos, pasos, extras, opciones) {
      const grupos = repartirEnPasos(elementos, pasos);
      return '<div class="ln-pasos-barra"><ol class="form-pasos">' + pasos.map((p, i) =>
        '<li><button type="button" class="form-paso-chip" data-ir-paso="' + i + '"' + (i ? ' disabled' : '') + '><span class="form-paso-num">' + (i + 1) + '</span>' + esc(p.titulo) + '</button></li>').join('') +
        '</ol></div>' +
        pasos.map((p, i) => '<section class="form-paso ln-paso" data-paso="' + i + '"' + (p.siempre ? ' data-paso-siempre' : '') + (i ? ' hidden' : '') + '>' +
          '<h3 class="form-paso-titulo" tabindex="-1">' + (p.icono ? icono(p.icono) + ' ' : '') + esc(p.titulo) + '</h3>' +
          (p.descripcion ? '<p class="form-paso-desc">' + esc(p.descripcion) + '</p>' : '') +
          (grupos[i].length ? htmlFormularioAppSheet(grupos[i], opciones) : '') + ((extras || {})[i] || '') + '</section>').join('');
    }

    /** Botones del pie para un formulario por pasos (Cancelar · Paso x de y · Atrás · Siguiente · Guardar). */
    function htmlAccionesPasos(botonGuardar) {
      return '<div class="ln-captura-acciones ln-acciones-pasos"><button type="button" class="secondary ln-pasos-cancelar" data-cerrar-modal>Cancelar</button>' +
        '<span class="form-cuenta" aria-live="polite"></span>' +
        '<button type="button" class="secondary" data-paso-atras hidden>' + icono('chevron-left') + ' Atrás</button>' +
        '<button type="button" data-paso-siguiente>Siguiente ' + icono('chevron-right') + '</button>' + botonGuardar + '</div>';
    }

    /**
     * Navegación de un formulario por pasos. cfg: { atras, siguiente, guardar, cuenta, validar(seccion) → errores,
     * libre (edición: se puede ir a cualquier paso y guardar desde cualquiera) }. Regresa { ir, irAlCampo }.
     */
    function activarPasos(cont, cfg) {
      const secciones = Array.from(cont.querySelectorAll('.form-paso[data-paso]'));
      const chips = Array.from(cont.querySelectorAll('.form-paso-chip[data-ir-paso]'));
      const vistos = {};
      let actual = 0;
      const aplica = (s) => s.hasAttribute('data-paso-siempre') || !!s.querySelector('.ln-af-campo:not([hidden]):not(.ln-af-lectura), .ln-af-campo:not([hidden]) .ln-pastillas');
      const visibles = () => secciones.map((s, i) => i).filter((i) => aplica(secciones[i]));
      const scroll = cont.closest('.modal-form-scroll') || cont;
      function pintar() {
        const vis = visibles();
        const pos = vis.indexOf(actual);
        chips.forEach((chip, i) => {
          const si = vis.indexOf(i) >= 0;
          chip.closest('li').hidden = !si;
          chip.classList.toggle('activo', i === actual);
          chip.classList.toggle('completado', si && vis.indexOf(i) < pos && !!vistos[i]);
          chip.disabled = !cfg.libre && !vistos[i] && i > actual;
          chip.querySelector('.form-paso-num').textContent = vis.indexOf(i) + 1;
        });
        const ultimo = pos === vis.length - 1;
        cfg.atras.hidden = pos <= 0;
        cfg.siguiente.hidden = ultimo;
        cfg.guardar.hidden = !ultimo && !cfg.libre;
        if (cfg.cuenta) cfg.cuenta.textContent = 'Paso ' + (pos + 1) + ' de ' + vis.length;
      }
      function ir(i, sinFoco) {
        const vis = visibles();
        if (vis.indexOf(i) < 0) {
          const despues = vis.filter((x) => x > i)[0];
          i = despues !== undefined ? despues : vis.filter((x) => x < i).pop();
        }
        if (i === undefined) return;
        actual = i;
        vistos[i] = true;
        secciones.forEach((sec, k) => { sec.hidden = k !== i; });
        pintar();
        if (cfg.alMostrar) cfg.alMostrar(i);
        if (!sinFoco) {
          scroll.scrollTop = 0;
          const titulo = secciones[i].querySelector('.form-paso-titulo');
          if (titulo) titulo.focus({ preventScroll: true });
        }
      }
      function avanzar() {
        if (cfg.validar && cfg.validar(secciones[actual]).length) return;
        const sig = visibles().filter((x) => x > actual)[0];
        if (sig !== undefined) ir(sig);
      }
      cfg.siguiente.addEventListener('click', avanzar);
      cfg.atras.addEventListener('click', () => { const ant = visibles().filter((x) => x < actual).pop(); if (ant !== undefined) ir(ant); });
      chips.forEach((chip, i) => chip.addEventListener('click', () => {
        if (i <= actual || cfg.libre || vistos[i]) ir(i);
        else if (!cfg.validar || !cfg.validar(secciones[actual]).length) ir(i);
      }));
      // Enter avanza de paso en vez de guardar a medias (si la lista del Combobox no lo usó)
      cont.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Enter' || ev.defaultPrevented || ev.target.tagName !== 'INPUT' || !cfg.siguiente || cfg.siguiente.hidden) return;
        ev.preventDefault();
        avanzar();
      });
      // Show_If puede ocultar o mostrar pasos completos al cambiar el TIPO
      cont.addEventListener('change', () => setTimeout(pintar, 0));
      ir(0, true);
      return {
        ir: ir,
        pintar: pintar,
        /** Lleva al paso donde está la columna (p. ej. el primer error al guardar). */
        irAlCampo: (columna) => {
          const k = secciones.findIndex((sec) => sec.querySelector('[data-af-columna="' + CSS.escape(columna) + '"]'));
          if (k >= 0 && k !== actual) ir(k, true);
        },
      };
    }

    /**
     * Marca los campos con error (borde y mensaje debajo, como el componente Formulario) y lleva al primero.
     * errores: [{ columna, msg }]. Un campo deja de marcarse en cuanto se corrige.
     */
    function marcarErroresEn(cuerpo, errores) {
      cuerpo.querySelectorAll('.ln-af-campo.form-campo-error').forEach((c) => {
        c.classList.remove('form-campo-error');
        const m = c.querySelector('.form-error-campo');
        if (m) m.remove();
      });
      errores.forEach((x) => {
        const campo = cuerpo.querySelector('.ln-af-campo[data-af-columna="' + CSS.escape(x.columna) + '"]');
        if (!campo || campo.classList.contains('form-campo-error')) return;
        campo.classList.add('form-campo-error');
        campo.insertAdjacentHTML('beforeend', '<span class="form-error-campo">' + esc(x.msg) + '</span>');
      });
      if (!cuerpo.dataset.limpiaErrores) {
        cuerpo.dataset.limpiaErrores = '1';
        const limpiar = (ev) => {
          const campo = ev.target.closest && ev.target.closest('.ln-af-campo.form-campo-error');
          if (!campo) return;
          campo.classList.remove('form-campo-error');
          const m = campo.querySelector('.form-error-campo');
          if (m) m.remove();
        };
        ['input', 'change', 'click'].forEach((t) => cuerpo.addEventListener(t, limpiar));
      }
      const primero = errores.length && cuerpo.querySelector('.ln-af-campo.form-campo-error');
      if (primero) {
        primero.scrollIntoView({ behavior: 'smooth', block: 'center' });
        // Las listas con búsqueda se abren al enfocarse y taparían el mensaje: esas solo se muestran
        const control = primero.querySelector('input:not([type="file"]):not([data-lista-abierta]):not([data-referencia]), select, textarea, .ln-pastilla');
        if (control) control.focus({ preventScroll: true });
      }
    }

    /** Valores por columna del AppSheet dentro de `cuerpo` (las referencias se traducen a ID). */
    function leerFormularioEn(cuerpo, elementos) {
      const valores = {};
      cuerpo.querySelectorAll('input[data-columna], select[data-columna], textarea[data-columna]').forEach((el) => {
        if (el.readOnly || el.hasAttribute('data-virtual')) return;
        let v = el.value.trim();
        if (el.dataset.referencia) {
          const def = (elementos || []).filter((e) => e.columna === el.dataset.columna)[0];
          const op = def && (def.opciones || []).filter((o) => o.etiqueta === v)[0];
          v = op ? op.id : (v ? '¿' + v : '');
        }
        valores[el.dataset.columna] = v;
      });
      cuerpo.querySelectorAll('.ln-checklist-punto[data-columna]').forEach((fila) => {
        const activa = fila.querySelector('.ln-pastilla.activa');
        valores[fila.dataset.columna] = activa ? activa.dataset.valor : '';
      });
      cuerpo.querySelectorAll('.ln-multi[data-columna]').forEach((fila) => {
        valores[fila.dataset.columna] = Array.from(fila.querySelectorAll('.ln-pastilla.activa')).map((b) => b.dataset.valor).join(' , ');
      });
      return valores;
    }

    /** Listas abiertas (Enum con AllowOtherValues) y referencias con el Combobox de la librería del sistema. */
    /** Mayúsculas y sin acentos (la Ñ se conserva), como piden las validaciones MAYUS del AppSheet. */
    const mayusSinAcentos = (v) => String(v === null || v === undefined ? '' : v).trim().toUpperCase()
      .replace(/[ÁÀÄÂ]/g, 'A').replace(/[ÉÈËÊ]/g, 'E').replace(/[ÍÌÏÎ]/g, 'I').replace(/[ÓÒÖÔ]/g, 'O').replace(/[ÚÙÜÛ]/g, 'U');

    /**
     * Opciones que completa el navegador para campos que en AppSheet eran texto libre:
     * PERSONAS / NO_EMPLEADO / PUESTOS / DEPARTAMENTOS salen de COLABORADORES (Gestión de Activos) y
     * NUMEROS / IMEIS / SIMS del índice de Líneas. Las de personas traen `datos` para autollenar.
     */
    function opcionesSugeridas(tipo) {
      if (tipo === 'NUMEROS' || tipo === 'IMEIS' || tipo === 'SIMS') {
        const campo = { NUMEROS: 'numero', IMEIS: 'imei', SIMS: 'sim' }[tipo];
        return cargarIndice().then((ix) => {
          const vistos = {};
          // Números y SIM salen de las líneas y traen sus datos para llenar los demás campos al elegirlos (usuario, 4-oct)
          const equipoDe = {};
          ix.equipos.forEach((e) => { if (e.lineaId) equipoDe[e.lineaId] = e; });
          const filas = tipo === 'IMEIS' ? ix.equipos.concat(ix.lineas) : ix.lineas;
          return filas.reduce((ops, r) => {
            const v = r[campo];
            if (!v || vistos[v]) return ops;
            vistos[v] = true;
            const nuco = r.nuco || r.nucoEquipo;
            const op = { valor: String(v), etiqueta: [nuco ? 'NUCO ' + nuco : '', r.responsable || ''].filter(Boolean).join(' · ') };
            if (tipo !== 'IMEIS') {
              const eq = equipoDe[r.id] || {};
              op.datos = { numero: r.numero ? String(r.numero) : '', sim: r.sim ? String(r.sim) : '', compania: r.compania || '',
                razonSocial: r['RAZON SOCIAL'] || eq['RAZON SOCIAL'] || '' };
            }
            ops.push(op);
            return ops;
          }, []);
        });
      }
      return cargarColaboradores().then((r) => {
        // Personas activas de Capital Humano con los datos que se llenan al elegirlas (autollenar)
        const gente = filasComoObjetos(r).map((c) => ({
          nombre: mayusSinAcentos(c.nombre), noEmpleado: c.noEmpleado ? String(c.noEmpleado).trim().toUpperCase() : '',
          puesto: mayusSinAcentos(c.puesto), departamento: mayusSinAcentos(c.departamento),
          area: c.area || '', sede: c.sede || '', oficina: c.oficina || '', director: c.director || '', jefe: c.jefe || '',
          correo: c.correo ? String(c.correo).trim().toLowerCase() : '',
          baja: c.estatus && String(c.estatus).toUpperCase() !== 'ACTIVO',
        })).filter((c) => c.nombre);
        const distintos = (campo) => gente.map((c) => c[campo]).filter((v, i, a) => v && a.indexOf(v) === i).sort();
        const etiquetaDe = (partes, c) => partes.filter(Boolean).join(' · ') + (c.baja ? ' · BAJA' : '');
        if (tipo === 'PUESTOS') return distintos('puesto');
        if (tipo === 'DEPARTAMENTOS') return distintos('departamento');
        if (tipo === 'NO_EMPLEADO') {
          return gente.filter((c) => c.noEmpleado).map((c) => ({ valor: c.noEmpleado, etiqueta: etiquetaDe([c.nombre, c.puesto], c), datos: c }));
        }
        return gente.map((c) => ({ valor: c.nombre, etiqueta: etiquetaDe([c.noEmpleado ? 'No. ' + c.noEmpleado : '', c.puesto], c), datos: c }));
      });
    }

    /** Une listas de opciones (texto u objetos { valor, etiqueta }) sin repetir valores. */
    function unirOpciones(a, b) {
      const vistos = {};
      return (a || []).concat(b || []).map((o) => (typeof o === 'object' ? o : { valor: String(o), etiqueta: '' }))
        .filter((o) => { const k = String(o.valor).toUpperCase(); if (!o.valor || vistos[k]) return false; vistos[k] = true; return true; });
    }

    /**
     * Listas desplegables con búsqueda (Combobox) para las listas abiertas y referencias del formulario.
     * `e.sugerencias` agrega opciones de COLABORADORES o del índice; `e.autollenar` ({ COLUMNA: dato })
     * copia datos de la persona elegida en otros campos editables del mismo formulario.
     */
    /**
     * Datos del responsable que salen de Capital Humano: se elige de la lista y, si no está, hay que seleccionar
     * "Agregar 'x'" (lo que solo se teclea no se guarda). Lo agregado se queda en ese registro y no entra a la lista
     * de nadie más (PLAN_REESTRUCTURA_LINEAS.md §3.6). En las acciones masivas la columna llega como "id|COLUMNA".
     */
    const COLUMNAS_CH = ['RESPONSABLE', 'NO EMPLEADO', 'PUESTO', 'DEPARTAMENTO', 'AREA', 'SEDE', 'OFICINA / DESARROLLO',
      'DIRECTOR', 'JEFE DIRECTO', 'NOMBRE QUIEN USA', 'PUESTO QUIEN USA']
      .concat(['SEGUNDO', 'TERCER', 'CUARTO', 'QUINTO'].reduce((a, n) => a.concat(['NOMBRE ' + n + ' RESPONSABLE', 'PUESTO ' + n + ' RESPONSABLE']), []));
    const esColumnaCH = (columna) => COLUMNAS_CH.indexOf(String(columna || '').split('|').pop().toUpperCase().replace(/\s+/g, ' ').trim()) >= 0;

    function activarCombosEn(cuerpo, elementos) {
      if (typeof Combobox === 'undefined') return;
      (elementos || []).forEach((e) => {
        if (e.tipo !== 'campo' || (e.control !== 'listaAbierta' && e.control !== 'referencia')) return;
        const input = cuerpo.querySelector('[data-columna="' + CSS.escape(e.columna) + '"]');
        if (!input || input.dataset.comboListo) return;
        input.dataset.comboListo = '1';
        const cbx = Combobox.crear(input, {
          opciones: e.control === 'referencia' ? (e.opciones || []).map((o) => ({ valor: o.etiqueta, etiqueta: '' })) : unirOpciones(e.opciones),
          // Todas las listas (usuario, 4-oct): lo que no está se elige con "Agregar 'x'"; solo queda en ese registro
          agregar: e.control === 'listaAbierta' && !e.soloLista,
          maximo: 50,
          alElegir: (opcion) => {
            if (e.autollenar && opcion && opcion.datos) {
              Object.keys(e.autollenar).forEach((columna) => {
                const destino = cuerpo.querySelector('[data-columna="' + CSS.escape(columna) + '"]');
                const valor = opcion.datos[e.autollenar[columna]];
                if (!destino || destino.disabled || destino.readOnly || !valor) return;
                CampoAuto.llenar(destino, valor);   // "auto" hasta que lo cambien
                // solo "change": "input" abriría la lista del otro campo
                destino.dispatchEvent(new Event('change', { bubbles: true }));
              });
            }
            input.dispatchEvent(new Event('change', { bubbles: true }));
          },
        });
        if (e.sugerencias) {
          opcionesSugeridas(e.sugerencias).then((ops) => {
            // soloLista: solo las personas de la lista, con sus datos de Capital Humano para llenar lo demás
            const permitidas = (e.opciones || []).map((o) => String(o).toUpperCase());
            cbx.setOpciones(e.soloLista ? unirOpciones(ops.filter((o) => o && permitidas.indexOf(String(o.valor).toUpperCase()) >= 0), e.opciones) : unirOpciones(ops, e.opciones));
            // llenarVacios (usuario, 4-oct): al abrir, si la persona está en Capital Humano, sus datos vacíos se llenan
            // solos (antes había que volver a elegirla). Lo que ya trae el registro no se toca.
            const actual = String(input.value || '').trim().toUpperCase();
            const persona = e.llenarVacios && e.autollenar && actual && ops.filter((o) => o && o.datos && String(o.valor).toUpperCase() === actual)[0];
            if (!persona) return;
            Object.keys(e.autollenar).forEach((columna) => {
              const destino = cuerpo.querySelector('[data-columna="' + CSS.escape(columna) + '"]');
              const valor = persona.datos[e.autollenar[columna]];
              if (!destino || destino.disabled || destino.readOnly || !valor || String(destino.value || '').trim()) return;
              destino.value = valor;
              destino.dispatchEvent(new Event('change', { bubbles: true }));
            });
          }).catch(() => { /* quedan las del servidor */ });
        }
      });
    }

    /** Campos derivados de una referencia (p. ej. LINEA SUSPENDIDA = [IMEI].[NUMERO TELEFONO]) y fórmulas. */
    function actualizarDerivadosEn(cuerpo, elementos) {
      const valores = leerFormularioEn(cuerpo, elementos);
      cuerpo.querySelectorAll('[data-deriva-de]').forEach((el) => {
        const def = (elementos || []).filter((e) => e.columna === el.dataset.derivaDe)[0];
        const op = def && (def.opciones || []).filter((o) => o.id === valores[el.dataset.derivaDe])[0];
        el.value = op ? (op.datos[el.dataset.derivaDato] || '') : '';
      });
      cuerpo.querySelectorAll('[data-formula="NO_ASIGNACION"]').forEach((el) => {
        const a = valores['ASIGNACION'];
        el.textContent = a === 'TRUE' ? 'No' : (a === 'FALSE' ? 'Sí' : '—');
      });
    }

    /** Obligatorios vacíos y valores fuera de lista (mismas reglas que valida el servidor). */
    const VALIDA_CLIENTE = {
