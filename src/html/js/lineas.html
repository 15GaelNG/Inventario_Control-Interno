<script>
  /**
   * lineas.js — vistas del módulo de Líneas (grupo "Líneas" del menú).
   * Todo vive dentro del namespace `Lineas` para no chocar con el resto de app.js.
   * Usa los globales del shell: callServer(), state.token y navegarA().
   *
   *   Lineas.initTelefonicas()     Líneas Telefónicas: inventario, ficha, inspecciones e historial
   *   Lineas.initCambios()         Control de Cambios - Líneas (CAMBIOS LINEAS TELEFONICAS)
   *   Lineas.initReasignaciones()  Control de Reasignaciones - Líneas (HISTORIAL_REASIGNACIONES)
   *   Lineas.initDesechos()        Bitácora de Desechos (BITACORA DE DESECHO)
   */
  const Lineas = (function () {
    'use strict';

    // ---------------- Utilidades ----------------
    const $ = (sel, raiz) => (raiz || document).querySelector(sel);
    const esc = (v) => {
      if (v === null || v === undefined || v === '') return '';
      return String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    };
    const vacio = '<span class="ln-tenue">—</span>';
    const guion = (v) => (v === null || v === undefined || v === '' ? vacio : esc(v));
    const fecha = (iso) => {
      if (!iso) return null;
      const d = new Date(iso);
      return isNaN(d) ? null : d.toLocaleDateString('es-MX', { year: 'numeric', month: 'short', day: '2-digit' });
    };
    const fechaHora = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? '' : d.toLocaleString('es-MX', { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    };
    const normal = (s) => String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const porcentaje = (v) => {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Math.round(n > 1 ? n : n * 100) + '%';
    };
    const miles = (n) => Number(n || 0).toLocaleString('es-MX');
    /** Ícono de Lucide (https://lucide.dev/icons) como SVG en línea: icono('smartphone'). */
    const ATRIBUTOS_SVG = 'xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
    function icono(nombre, clase) {
      const nombrePascal = String(nombre).replace(/(^|-)([a-z0-9])/g, (m, sep, c) => c.toUpperCase());
      const nodos = window.lucide && window.lucide.icons && window.lucide.icons[nombrePascal];
      if (!nodos) return '';
      const svg = window.lucide.createElement(nodos);
      svg.setAttribute('class', 'ln-icon ' + (clase || ''));
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      return svg.outerHTML;
    }
    /** Rellena los <span data-ln-icon="nombre"> de las plantillas. */
    function pintarIconos(raiz) {
      raiz.querySelectorAll('[data-ln-icon]').forEach((el) => { el.innerHTML = icono(el.dataset.lnIcon); });
    }
    const enlaceDrive = (id, texto, esArchivo) => {
      if (!id) return '';
      const url = esArchivo ? 'https://drive.google.com/file/d/' + esc(id) + '/view' : 'https://drive.google.com/drive/folders/' + esc(id);
      return '<a class="ln-enlace ln-accion-enlace" target="_blank" rel="noopener" href="' + url + '">' + icono(esArchivo ? 'file-text' : 'folder-open') + ' ' + esc(texto) + ' ' + icono('external-link', 'ln-icon-sm') + '</a>';
    };

    function llamar(fn, ...args) {
      return callServer(fn, state.token, ...args);
    }

    const COLOR_ESTATUS = {
      'USO': 'verde', 'EN USO': 'verde', 'RENOVADA': 'verde',
      'RESGUARDO': 'azul', 'EN ENVIO': 'azul', 'ESPERA DE RESPONSIVA': 'azul', 'ESPERA DE EQUIPO': 'azul',
      'SUSPENDIDA': 'ambar', 'POSIBLE VENTA': 'ambar', 'VENTA': 'ambar', 'USO TEMPORAL': 'ambar', 'SIN LINEA': 'ambar', 'EN PROCESO DE CANCELACION': 'ambar',
      'EXTRAVIADO': 'rojo', 'ROBO': 'rojo', 'ROBADO': 'rojo', 'CANCELADA': 'rojo', 'CANCELADO': 'rojo', 'DESECHO': 'rojo', 'DESECHADO': 'rojo', 'BLOQUEADO': 'rojo',
    };
    const chip = (estatus, clase) => {
      if (!estatus) return vacio;
      return '<span class="ln-chip ' + (clase || COLOR_ESTATUS[String(estatus).toUpperCase()] || '') + '">' + esc(estatus) + '</span>';
    };
    const TIPO_EQUIPO = { CELULAR: 'Celular', CELULAR_BASICO: 'Celular básico', MODEM: 'Módem', BANDA_ANCHA: 'Banda ancha', CAMARA: 'Cámara' };
    const ORIGEN = {
      DRIVE: '<span class="ln-chip">Solo Drive</span>',
      SISTEMA: '<span class="ln-chip verde">Nuevo sistema</span>',
      APPSHEET: '<span class="ln-chip azul">AppSheet</span>',
    };

    /** Descarga un CSV (UTF-8 con BOM para que Excel respete acentos). */
    function exportarCsv(nombre, columnas, filas, titulos) {
      const celda = (v) => {
        if (v === null || v === undefined) return '';
        const s = String(v);
        return /[",\n;]/.test(s) || /^\d{11,}$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const texto = '\uFEFF' + [(titulos || columnas).map(celda).join(',')]
        .concat(filas.map((r) => columnas.map((c) => celda(r[c])).join(','))).join('\n');
      const url = URL.createObjectURL(new Blob([texto], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = nombre + ' ' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    }

    /** Redimensiona una imagen en el navegador antes de subirla (máx. `maxDim` px, JPEG calidad .82). */
    function redimensionarImagen(archivo, maxDim) {
      return new Promise((resolve, reject) => {
        const lector = new FileReader();
        lector.onerror = () => reject(new Error('No se pudo leer el archivo.'));
        lector.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Archivo de imagen inválido.'));
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              const factor = maxDim / Math.max(w, h);
              w = Math.round(w * factor); h = Math.round(h * factor);
            }
            const lienzo = document.createElement('canvas');
            lienzo.width = w; lienzo.height = h;
            lienzo.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mime: 'image/jpeg', base64: lienzo.toDataURL('image/jpeg', 0.82).split(',')[1] });
          };
          img.src = lector.result;
        };
        lector.readAsDataURL(archivo);
      });
    }

    /** Aviso flotante (errores de cargas en segundo plano). */
    function aviso(html, duracion) {
      let caja = document.getElementById('ln-avisos');
      if (!caja) {
        caja = document.createElement('div');
        caja.id = 'ln-avisos';
        document.body.appendChild(caja);
      }
      const item = document.createElement('div');
      item.className = 'ln-aviso';
      item.innerHTML = '<div>' + html + '</div><button type="button" class="modal-close" aria-label="Cerrar">' + icono('x') + '</button>';
      item.querySelector('button').addEventListener('click', () => item.remove());
      caja.appendChild(item);
      if (duracion) setTimeout(() => item.remove(), duracion);
    }
    const mensajeError = (e) => esc(e && e.message ? e.message : e);

    // ---------------- Estado del módulo ----------------
    // Se conserva entre navegaciones para evitar volver a pedir los mismos catálogos.
    const POR_PAGINA = 50;
    const VIGENCIA_INDICE_MS = 15 * 60 * 1000;
    const VIGENCIA_CATALOGO_MS = 15 * 60 * 1000;
    const memoria = {
      indice: null,
      cargadoEn: 0,
      indicePendiente: null,
      permisos: null,
      colaboradores: null,
      colaboradoresCargadosEn: 0,
      colaboradoresPendientes: null,
      accesorios: null,
      accesoriosCargadosEn: 0,
      accesoriosPendientes: null,
      modulo: 'equipos',
      filtros: {
        equipos: { q: '', tipo: '', estatus: '', depto: '', conLinea: '', pagina: 0 },
        lineas: { q: '', compania: '', estatus: '', suelta: '', pagina: 0 },
      },
      abrirAlEntrar: null, // id de registro a abrir al entrar a Líneas Telefónicas (desde una bitácora)
    };
    let montaje = 0; // cambia en cada init: respuestas tardías de una vista anterior se ignoran

    function filasComoObjetos(ix) {
      return ix.filas.map((f) => {
        const o = {};
        ix.columnas.forEach((c, i) => { o[c] = f[i]; });
        return o;
      });
    }

    function cargarIndice(forzar) {
      if (!forzar && memoria.indice && Date.now() - memoria.cargadoEn < VIGENCIA_INDICE_MS) return Promise.resolve(memoria.indice);
      if (!forzar && memoria.indicePendiente) return memoria.indicePendiente;
      memoria.indicePendiente = llamar('apiLineasIndice').then((r) => {
        const porNuco = (a, b) => {
          const na = Number(a.nuco || a.nucoEquipo);
          const nb = Number(b.nuco || b.nucoEquipo);
          if (isNaN(na) && isNaN(nb)) return 0;
          if (isNaN(na)) return 1;
          if (isNaN(nb)) return -1;
          return na - nb;
        };
        memoria.indice = {
          columnas: { equipos: r.equipos.columnas, lineas: r.lineas.columnas },
          equipos: filasComoObjetos(r.equipos).sort(porNuco),
          lineas: filasComoObjetos(r.lineas).sort(porNuco),
          generadoEn: r.equipos.generadoEn,
        };
        memoria.cargadoEn = Date.now();
        return memoria.indice;
      });
      memoria.indicePendiente.then(() => { memoria.indicePendiente = null; }, () => { memoria.indicePendiente = null; });
      return memoria.indicePendiente;
    }

    function cargarPermisos() {
      if (memoria.permisos) return Promise.resolve(memoria.permisos);
      return llamar('apiLineasPermisos').then((p) => (memoria.permisos = p));
    }

    function cargarColaboradores(forzar) {
      if (!forzar && memoria.colaboradores && Date.now() - memoria.colaboradoresCargadosEn < VIGENCIA_CATALOGO_MS) return Promise.resolve(memoria.colaboradores);
      if (!forzar && memoria.colaboradoresPendientes) return memoria.colaboradoresPendientes;
      memoria.colaboradoresPendientes = llamar('apiLineasColaboradores').then((r) => {
        memoria.colaboradores = r;
        memoria.colaboradoresCargadosEn = Date.now();
        return r;
      });
      memoria.colaboradoresPendientes.then(() => { memoria.colaboradoresPendientes = null; }, () => { memoria.colaboradoresPendientes = null; });
      return memoria.colaboradoresPendientes;
    }

    function cargarAccesorios(forzar) {
      if (!forzar && memoria.accesorios && Date.now() - memoria.accesoriosCargadosEn < VIGENCIA_CATALOGO_MS) return Promise.resolve(memoria.accesorios);
      if (!forzar && memoria.accesoriosPendientes) return memoria.accesoriosPendientes;
      memoria.accesoriosPendientes = llamar('apiLineasAccesoriosIndice').then((r) => {
        memoria.accesorios = r;
        memoria.accesoriosCargadosEn = Date.now();
        return r;
      });
      memoria.accesoriosPendientes.then(() => { memoria.accesoriosPendientes = null; }, () => { memoria.accesoriosPendientes = null; });
      return memoria.accesoriosPendientes;
    }

    function precargar() {
      Promise.all([cargarPermisos(), cargarIndice()]).catch(() => {});
    }

    function contarPor(filas, campo) {
      const m = {};
      filas.forEach((f) => { const k = f[campo] || ''; m[k] = (m[k] || 0) + 1; });
      return m;
    }
    const unicos = (filas, campo) => Object.keys(contarPor(filas, campo)).filter(Boolean).sort();

    // ======================================================================
    // Líneas Telefónicas
    // ======================================================================

    const LISTADOS = {
      equipos: {
        nombreCsv: 'equipos telefonicos',
        placeholder: 'Buscar por NUCO, IMEI, modelo, responsable o número…',
        busqueda: ['nuco', 'imei', 'modelo', 'responsable', 'numero', 'departamento'],
        detalle: 'equipo',
        selects: [
          { campo: 'tipo', todos: 'Todos los tipos', traducir: TIPO_EQUIPO, valores: (t) => unicos(t, 'tipo'), coincide: (r, v) => r.tipo === v },
          { campo: 'estatus', todos: 'Todos los estatus', valores: (t) => unicos(t, 'estatus'), coincide: (r, v) => r.estatus === v },
          { campo: 'depto', todos: 'Todos los departamentos', valores: (t) => unicos(t, 'departamento'), coincide: (r, v) => r.departamento === v },
          { campo: 'conLinea', todos: 'Con y sin línea', traducir: { si: 'Con línea', no: 'Sin línea' }, valores: () => ['si', 'no'], coincide: (r, v) => (v === 'si' ? !!r.lineaId : !r.lineaId) },
        ],
        columnas: [
          { titulo: 'NUCO', clase: 'ln-mono ln-fuerte', valor: (r) => guion(r.nuco) },
          { titulo: 'Tipo', valor: (r) => esc(TIPO_EQUIPO[r.tipo] || r.tipo) },
          { titulo: 'Modelo', valor: (r) => guion(r.modelo) },
          { titulo: 'IMEI', clase: 'ln-mono ln-tenue', valor: (r) => guion(r.imei) },
          { titulo: 'Estatus', valor: (r) => chip(r.estatus) },
          { titulo: 'Línea', clase: 'ln-mono', valor: (r) => (r.numero ? esc(r.numero) : '<span class="ln-tenue">Sin línea</span>') },
          { titulo: 'Responsable', valor: (r) => guion(r.responsable) },
          { titulo: 'Departamento', clase: 'ln-tenue', valor: (r) => guion(r.departamento) },
        ],
      },
      lineas: {
        nombreCsv: 'lineas telefonicas',
        placeholder: 'Buscar por número, SIM, NUCO o responsable…',
        busqueda: ['numero', 'sim', 'nucoEquipo', 'responsable', 'departamento'],
        detalle: 'linea',
        selects: [
          { campo: 'compania', todos: 'Todas las compañías', valores: (t) => unicos(t, 'compania'), coincide: (r, v) => r.compania === v },
          { campo: 'estatus', todos: 'Todos los estatus', valores: (t) => unicos(t, 'estatus'), coincide: (r, v) => r.estatus === v },
          { campo: 'suelta', todos: 'Con y sin equipo', traducir: { si: 'Solo sueltas', no: 'Solo en equipo' }, valores: () => ['si', 'no'], coincide: (r, v) => (v === 'si' ? r.suelta : !r.suelta) },
        ],
        columnas: [
          { titulo: 'Número', clase: 'ln-mono ln-fuerte', valor: (r) => guion(r.numero) },
          { titulo: 'Compañía', valor: (r) => guion(r.compania) },
          { titulo: 'Estatus', valor: (r) => chip(r.estatus) },
          { titulo: 'Equipo (NUCO)', clase: 'ln-mono', valor: (r) => (r.suelta ? chip('Suelta', 'ambar') + (r.nucoEquipo ? ' <span class="ln-tenue">' + esc(r.nucoEquipo) + '</span>' : '') : guion(r.nucoEquipo)) },
          { titulo: 'SIM', clase: 'ln-mono ln-tenue', valor: (r) => guion(r.sim) },
          { titulo: 'Responsable', valor: (r) => guion(r.responsable) },
          { titulo: 'Departamento', clase: 'ln-tenue', valor: (r) => guion(r.departamento) },
        ],
      },
    };

    function initTelefonicas() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-telefonicas');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const pila = []; // navegación dentro del detalle: [{ tipo, id }]
      let captura = null; // sesión de captura de inspección/responsiva en curso (null si el modal está cerrado)
      pintarIconos(raiz);
      document.addEventListener('app:before-navigate', () => { if (vigente() && captura) cerrarCaptura(); }, { once: true });

      // ---- Eventos ----
      raiz.querySelectorAll('.ln-tab').forEach((tab) => {
        tab.addEventListener('click', () => { memoria.modulo = tab.dataset.modulo; pintarListado(); });
      });
      $('#ln-anterior', raiz).addEventListener('click', () => { memoria.filtros[memoria.modulo].pagina--; pintarTabla(); });
      $('#ln-siguiente', raiz).addEventListener('click', () => { memoria.filtros[memoria.modulo].pagina++; pintarTabla(); });
      $('#ln-exportar', raiz).addEventListener('click', () => {
        if (!memoria.indice) return;
        exportarCsv(LISTADOS[memoria.modulo].nombreCsv, memoria.indice.columnas[memoria.modulo], filtradas());
      });
      $('#ln-recargar', raiz).addEventListener('click', (ev) => {
        const b = ev.currentTarget;
        b.disabled = true;
        llamar('apiLineasRecargarDatos')
          .then(() => cargarIndice(true))
          .then(() => { if (vigente()) { pintarIndicadores(); pintarListado(); } })
          .catch((e) => aviso(icono('triangle-alert', 'ln-alerta') + ' ' + mensajeError(e), 12000))
          .then(() => { b.disabled = false; });
      });

      // Clic en filas, enlaces internos y botones del detalle (delegación).
      raiz.addEventListener('click', (ev) => {
        const pdfPendiente = ev.target.closest('[data-ln-pdf]');
        if (pdfPendiente) {
          ev.preventDefault();
          captura = { guardada: true, firmas: {}, carpetaId: pdfPendiente.dataset.carpeta };
          $('#ln-modal-captura', raiz).hidden = false;
          $('#ln-captura-titulo', raiz).textContent = 'Generar PDF pendiente';
          refrescarDespuesDeCaptura(pila[pila.length - 1].id, pdfPendiente.dataset.lnPdf, pdfPendiente.dataset.id);
          return;
        }
        if (ev.target.closest('a[target="_blank"]')) return;
        const ir = ev.target.closest('[data-ln-ir]');
        if (ir) {
          ev.preventDefault();
          abrir(ir.dataset.lnIr, ir.dataset.id);
          return;
        }
        if (ev.target.closest('[data-ln-volver]')) { ev.preventDefault(); volver(); return; }
        if (ev.target.closest('[data-ln-lista]')) { ev.preventDefault(); cerrarDetalle(); return; }
        const filtro = ev.target.closest('[data-ln-filtro]');
        if (filtro) {
          const [modulo, campo, valor] = filtro.dataset.lnFiltro.split('|');
          Object.assign(memoria.filtros[modulo], LISTADOS[modulo].selects.reduce((o, s) => { o[s.campo] = ''; return o; }, { q: '', pagina: 0 }));
          if (campo) memoria.filtros[modulo][campo] = valor;
          memoria.modulo = modulo;
          cerrarDetalle();
          pintarListado();
          return;
        }
        const btnCaptura = ev.target.closest('[data-ln-captura]');
        if (btnCaptura) {
          ev.preventDefault();
          const ref = btnCaptura.dataset.equipoId ? { equipoId: btnCaptura.dataset.equipoId } : { lineaId: btnCaptura.dataset.lineaId };
          abrirCaptura(btnCaptura.dataset.lnCaptura, ref);
          return;
        }
        const pastilla = ev.target.closest('.ln-pastilla');
        if (pastilla) {
          pastilla.parentElement.querySelectorAll('.ln-pastilla').forEach((b) => b.classList.remove('activa'));
          pastilla.classList.add('activa');
          actualizarProgresoChecklist();
          return;
        }
        const limpiarFirma = ev.target.closest('[data-limpiar-firma]');
        if (limpiarFirma) {
          if (captura && captura.firmas[limpiarFirma.dataset.limpiarFirma]) captura.firmas[limpiarFirma.dataset.limpiarFirma].limpiar();
          return;
        }
        const quitarFoto = ev.target.closest('[data-quitar-foto]');
        if (quitarFoto) {
          if (captura) captura.fotos = captura.fotos.filter((f) => f.id !== quitarFoto.dataset.quitarFoto);
          quitarFoto.closest('.ln-foto-chip').remove();
          return;
        }
      });
      raiz.addEventListener('keydown', (ev) => {
        if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][tabindex="0"]')) {
          ev.preventDefault();
          ev.target.click();
        }
        if (ev.key === 'Escape' && !$('#ln-modal-captura', raiz).hidden) cerrarCaptura();
      });
      $('#ln-modal-captura', raiz).addEventListener('click', (ev) => {
        if (ev.target.id === 'ln-modal-captura' || ev.target.closest('[data-cerrar-modal]')) cerrarCaptura();
      });

      // ---- Carga inicial ----
      Promise.all([cargarPermisos(), cargarIndice()]).then(([permisos]) => {
        if (!vigente()) return;
        $('#ln-recargar', raiz).hidden = !permisos.esAdmin;
        pintarIndicadores();
        pintarListado();
        if (memoria.abrirAlEntrar) {
          const id = memoria.abrirAlEntrar;
          memoria.abrirAlEntrar = null;
          abrirRegistro(id);
        }
      }).catch((e) => {
        if (!vigente()) return;
        const box = $('#ln-error', raiz);
        box.textContent = 'No se pudo cargar el inventario: ' + (e.message || e);
        box.hidden = false;
        $('#ln-tbody', raiz).innerHTML = '<tr><td class="empty-state">Sin datos</td></tr>';
      });

      // ---- Indicadores ----
      function pintarIndicadores() {
        const ix = memoria.indice;
        const eq = ix.equipos;
        const li = ix.lineas;
        const tile = (ico, valor, etiqueta, filtro, clase, id) =>
          '<div class="stat-tile ln-tile ' + (clase || '') + '"' + (id ? ' id="' + id + '"' : '') + (filtro ? ' data-ln-filtro="' + esc(filtro) + '"' : '') + ' role="button" tabindex="0">' +
          '<div class="stat-icon">' + icono(ico) + '</div><div><div class="stat-value">' + valor + '</div><div class="stat-label">' + esc(etiqueta) + '</div></div></div>';
        $('#ln-indicadores', raiz).innerHTML =
          tile('smartphone', miles(eq.length), 'Equipos', 'equipos') +
          tile('circle-check', miles(eq.filter((e) => e.estatus === 'USO').length), 'Equipos en uso', 'equipos|estatus|USO', 'stat-tile-ok') +
          tile('unplug', miles(eq.filter((e) => !e.lineaId).length), 'Equipos sin línea', 'equipos|conLinea|no') +
          tile('card-sim', miles(li.length), 'Líneas', 'lineas') +
          tile('unlink', miles(li.filter((l) => l.suelta).length), 'Líneas sueltas', 'lineas|suelta|si');
        $('#ln-num-equipos', raiz).textContent = miles(eq.length);
        $('#ln-num-lineas', raiz).textContent = miles(li.length);
      }

      // ---- Listado ----
      function filtradas() {
        const cfg = LISTADOS[memoria.modulo];
        const f = memoria.filtros[memoria.modulo];
        const q = normal(f.q).trim();
        return memoria.indice[memoria.modulo].filter((r) => {
          for (let i = 0; i < cfg.selects.length; i++) {
            const s = cfg.selects[i];
            if (f[s.campo] && !s.coincide(r, f[s.campo])) return false;
          }
          return !q || cfg.busqueda.some((c) => normal(r[c]).indexOf(q) >= 0);
        });
      }

      function pintarListado() {
        if (!memoria.indice) return;
        const cfg = LISTADOS[memoria.modulo];
        const f = memoria.filtros[memoria.modulo];
        const todas = memoria.indice[memoria.modulo];
        raiz.querySelectorAll('.ln-tab').forEach((t) => t.classList.toggle('active', t.dataset.modulo === memoria.modulo));

        const opciones = (s) => '<option value="">' + esc(s.todos) + '</option>' + s.valores(todas).map((v) =>
          '<option value="' + esc(v) + '"' + (v === f[s.campo] ? ' selected' : '') + '>' + esc(s.traducir ? (s.traducir[v] || v) : v) + '</option>').join('');
        $('#ln-filtros', raiz).innerHTML =
          '<input type="search" id="ln-q" placeholder="' + esc(cfg.placeholder) + '" value="' + esc(f.q) + '" autocomplete="off" />' +
          cfg.selects.map((s) => '<select data-campo="' + s.campo + '">' + opciones(s) + '</select>').join('');
        $('#ln-thead', raiz).innerHTML = '<tr>' + cfg.columnas.map((c) => '<th>' + esc(c.titulo) + '</th>').join('') + '</tr>';

        let temporizador = null;
        $('#ln-q', raiz).addEventListener('input', (ev) => {
          clearTimeout(temporizador);
          temporizador = setTimeout(() => { f.q = ev.target.value; f.pagina = 0; pintarTabla(); }, 150);
        });
        raiz.querySelectorAll('#ln-filtros select').forEach((sel) => {
          sel.addEventListener('change', () => { f[sel.dataset.campo] = sel.value; f.pagina = 0; pintarTabla(); });
        });
        pintarTabla();
      }

      function pintarTabla() {
        const cfg = LISTADOS[memoria.modulo];
        const f = memoria.filtros[memoria.modulo];
        const lista = filtradas();
        const total = memoria.indice[memoria.modulo].length;
        const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
        if (f.pagina >= paginas) f.pagina = paginas - 1;
        if (f.pagina < 0) f.pagina = 0;
        const visibles = lista.slice(f.pagina * POR_PAGINA, (f.pagina + 1) * POR_PAGINA);
        $('#ln-tbody', raiz).innerHTML = visibles.length
          ? visibles.map((r) => '<tr class="ln-fila-clic" data-ln-ir="' + cfg.detalle + '" data-id="' + esc(r.id) + '">' +
              cfg.columnas.map((c) => '<td class="' + (c.clase || '') + '">' + c.valor(r) + '</td>').join('') + '</tr>').join('')
          : '<tr><td colspan="' + cfg.columnas.length + '" class="empty-state">Sin resultados</td></tr>';
        $('#ln-conteo', raiz).textContent = miles(lista.length) + ' de ' + miles(total) + ' · datos de ' + fechaHora(memoria.indice.generadoEn);
        $('#ln-pagina', raiz).textContent = 'Página ' + (f.pagina + 1) + ' de ' + paginas;
        $('#ln-anterior', raiz).disabled = f.pagina === 0;
        $('#ln-siguiente', raiz).disabled = f.pagina >= paginas - 1;
      }

      // ---- Detalle ----
      function abrir(tipo, id, sinApilar) {
        if (!sinApilar) pila.push({ tipo: tipo, id: id });
        $('#ln-listado', raiz).hidden = true;
        const detalle = $('#ln-detalle', raiz);
        detalle.hidden = false;
        detalle.innerHTML = migas() + '<div class="card ln-cargando"><span class="ln-spinner"></span> Cargando…</div>';
        document.getElementById('view-container').scrollTop = 0;
        window.scrollTo(0, 0);
        const pintar = { equipo: pintarEquipo, linea: pintarLinea, inspeccion: pintarInspeccion }[tipo];
        pintar(detalle, id).catch((e) => {
          if (!vigente()) return;
          detalle.innerHTML = migas() + '<div class="card"><p class="error-msg">No se pudo cargar: ' + mensajeError(e) + '</p></div>';
        });
      }

      /** Abre un registro sabiendo solo su ID (equipo si existe como equipo; si no, línea). */
      function abrirRegistro(id) {
        const esEquipo = memoria.indice.equipos.some((e) => e.id === id);
        abrir(esEquipo ? 'equipo' : 'linea', id);
      }

      function volver() {
        pila.pop();
        const anterior = pila[pila.length - 1];
        if (anterior) abrir(anterior.tipo, anterior.id, true);
        else cerrarDetalle();
      }

      function cerrarDetalle() {
        pila.length = 0;
        $('#ln-detalle', raiz).hidden = true;
        $('#ln-detalle', raiz).innerHTML = '';
        $('#ln-listado', raiz).hidden = false;
      }

      function migas() {
        const etiquetas = { equipo: 'Equipo', linea: 'Línea', inspeccion: 'Inspección' };
        return '<div class="ln-migas"><button type="button" class="secondary ln-btn-icono" data-ln-volver>' + icono('chevron-left') + ' Volver</button>' +
          '<span><a href="#" class="ln-enlace" data-ln-lista>Líneas Telefónicas</a>' +
          pila.map((p) => ' ' + icono('chevron-right', 'ln-icon-sm') + ' ' + esc(etiquetas[p.tipo])).join('') + '</span></div>';
      }

      function campos(pares) {
        return '<dl class="ln-campos">' + pares.filter(Boolean).map((p) =>
          '<dt>' + esc(p[0]) + '</dt><dd>' + (p[2] ? (p[1] || vacio) : guion(p[1])) + '</dd>').join('') + '</dl>';
      }

      function tarjeta(titulo, cuerpo, clase) {
        return '<div class="card ln-card ' + (clase || '') + '"><h3>' + titulo + '</h3>' + cuerpo + '</div>';
      }

      function tarjetaResponsable(r, titulo) {
        r = r || {};
        const adicionales = (r.usuariosAdicionales || []).length
          ? '<div class="ln-subtitulo">Usuarios adicionales</div>' + campos(r.usuariosAdicionales.map((u) => [u.rol, esc(u.nombre) + (u.puesto ? ' <span class="ln-tenue">· ' + esc(u.puesto) + '</span>' : ''), true]))
          : '';
        return tarjeta(icono('user') + ' ' + esc(titulo || 'Responsable'), campos([
          ['Nombre', (r.nombres && r.nombres.length > 1) ? r.nombres.map(esc).join('<br>') : esc(r.nombre || ''), true],
          r.codigoResguardo ? ['Código de resguardo', r.codigoResguardo] : null,
          ['No. empleado', r.noEmpleado],
          ['Puesto', r.puesto],
          ['Departamento', r.departamento],
          ['Área', r.area],
          ['Sede', r.sede],
          ['Oficina / desarrollo', r.oficina],

            '<div class="ln-grid-2">' +
              tarjeta(icono('card-sim') + ' Línea', campos([
                ['Compañía', l.compania], ['SIM', l.sim], ['PIN WhatsApp', l.pinWhatsapp], ['Razón social', l.razonSocial],
                ['Costo plan', costo], ['Inicio plan', fecha(l.inicioPlan)], ['Fin plan', fecha(l.finPlan)],
                l.usoTemporal ? ['Uso temporal', 'Desde ' + esc(fecha(l.usoTemporal.desde) || '—') + ' · ' + esc(l.usoTemporal.correo || ''), true] : null,

                ['Tipo', TIPO_EQUIPO[e.tipo] || e.tipo], ['Modelo', e.modelo], ['IMEI', e.imei], ['Estatus', chip(e.estatus), true],
              ]) : '<p class="empty-state">Línea suelta: no está instalada en un equipo de la empresa.</p>') +

          if (!vigente() || !cont || pila.length !== pila0) return;

          const cont = $('#ln-evidencias', raiz);
          if (cont) cont.innerHTML = tarjeta(icono('clipboard-check') + ' Inspecciones y responsivas', '<p class="error-msg">' + mensajeError(e) + '</p>');

              '<td>' + guion(porcentaje(i.calificacion)) + '</td><td>' + (i.fotos || '<span class="ln-tenue">0</span>') + '</td>' +

              '<td>' + accionPdf(r, 'RESPONSIVA') + '</td>' +

        return tarjeta(icono('clipboard-check') + ' Inspecciones (' + inspecciones.length + ')', tablaInsp) + tarjeta(icono('signature') + ' Responsivas (' + responsivas.length + ')', tablaResp);

        const borrador = captura;
        $('#ln-modal-captura', raiz).hidden = true;
        $('#ln-captura-cuerpo', raiz).innerHTML = '';

      function grupoEscala(escala, valorPrevio) {

      function leerChecklistFormulario() {
        const checklist = {};
        raiz.querySelectorAll('#ln-captura-cuerpo .ln-checklist-punto').forEach((fila) => {
          const activa = fila.querySelector('.ln-pastilla.activa');

      function actualizarProgresoChecklist(incompleto) {
        const progreso = $('#cap-checklist-avance', raiz);
        if (!progreso) return;
        const filas = Array.from(raiz.querySelectorAll('#ln-captura-cuerpo .ln-checklist-punto'));
        const contestadas = filas.filter((fila) => fila.querySelector('.ln-pastilla.activa')).length;
        const total = filas.length;
        $('#cap-checklist-conteo', raiz).textContent = contestadas + ' de ' + total + ' puntos con respuesta';
        $('#cap-checklist-barra', raiz).style.width = (total ? Math.round(contestadas / total * 100) : 0) + '%';
        progreso.classList.toggle('incompleto', !!incompleto && contestadas < total);
      }

      function activarFirma(id) {
        const canvas = document.getElementById(id);
        if (!canvas) return null;
        const ctx2d = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const escala = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, rect.width) * escala;
        canvas.height = Math.max(1, rect.height) * escala;
        ctx2d.scale(escala, escala);
        ctx2d.lineWidth = 2.2; ctx2d.lineCap = 'round'; ctx2d.lineJoin = 'round'; ctx2d.strokeStyle = '#111';
        const estado = { vacia: true, dibujando: false };
        const posicion = (ev) => {
          const r = canvas.getBoundingClientRect();
          return { x: ev.clientX - r.left, y: ev.clientY - r.top };
        };
        const empezar = (ev) => { ev.preventDefault(); estado.dibujando = true; estado.vacia = false; const p = posicion(ev); ctx2d.beginPath(); ctx2d.moveTo(p.x, p.y); };
        const mover = (ev) => { if (!estado.dibujando) return; ev.preventDefault(); const p = posicion(ev); ctx2d.lineTo(p.x, p.y); ctx2d.stroke(); };
        const terminar = () => { estado.dibujando = false; };
        canvas.addEventListener('pointerdown', empezar);
        canvas.addEventListener('pointermove', mover);
        canvas.addEventListener('pointerup', terminar);
        canvas.addEventListener('pointerleave', terminar);
        return {
          estaVacia: () => estado.vacia,
          limpiar: () => { ctx2d.clearRect(0, 0, canvas.width, canvas.height); estado.vacia = true; },
          base64: () => canvas.toDataURL('image/png').split(',')[1],
        };
      }

      function subirImagenCaptura(archivo, listaId, carpetaId, onSubido) {
        const lista = document.getElementById(listaId);
        if (!lista) return;
        const chip = document.createElement('span');
        chip.className = 'ln-foto-chip ln-foto-subiendo';
        chip.innerHTML = icono('loader-circle', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(archivo.name) + '</span>';
        lista.appendChild(chip);
        redimensionarImagen(archivo, 1600)
          .then((img) => llamar('apiLineasSubirArchivo', carpetaId, archivo.name, img.mime, img.base64))
          .then((subido) => {
            chip.className = 'ln-foto-chip';
            chip.innerHTML = icono('check', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(subido.nombre) + '</span>' +
              '<button type="button" data-quitar-foto="' + esc(subido.id) + '">' + icono('x', 'ln-icon-sm') + '</button>';
            onSubido(subido);
          }).catch((e) => {
            chip.className = 'ln-foto-chip';
            chip.style.background = 'var(--ln-rojo-bg)'; chip.style.color = 'var(--ln-rojo-tx)';
            chip.innerHTML = icono('triangle-alert', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(mensajeError(e)) + '</span>';
            onSubido(null);
          });
      }

      function manejarSubidaArchivo(inputId, listaId, obtenerCarpetaId, multiple, onSubido) {
        const input = document.getElementById(inputId);
        if (!input) return;
        input.addEventListener('change', () => {
          const archivos = Array.from(input.files || []);
          input.value = '';
          if (!multiple) document.getElementById(listaId).innerHTML = '';
          archivos.slice(0, multiple ? archivos.length : 1).forEach((archivo) => subirImagenCaptura(archivo, listaId, obtenerCarpetaId(), onSubido));
        });
      }

      function estadoGuardado(texto) {
        if (!captura) return;
        captura.guardando = true;
        const modal = $('#ln-modal-captura', raiz);
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = true; });
        $('#cap-guardar', raiz).innerHTML = '<span class="ln-spinner"></span> ' + esc(texto);
        $('#ln-captura-subtitulo', raiz).textContent = texto + '. Mantén esta ventana abierta.';
        modal.setAttribute('aria-busy', 'true');
      }

      function restaurarGuardado() {
        if (!captura) return;
        captura.guardando = false;
        const modal = $('#ln-modal-captura', raiz);
        modal.removeAttribute('aria-busy');
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = false; });
        $('#cap-guardar', raiz).innerHTML = icono('circle-check') + ' Guardar y generar PDF';
        $('#ln-captura-subtitulo', raiz).textContent = 'No se completó el guardado. Revisa el mensaje y vuelve a intentar.';
      }

      function refrescarDespuesDeCaptura(idAbierto, tipo, nuevoId) {
        const sesionCaptura = captura;
        sesionCaptura.guardada = true;
        memoria.cargadoEn = 0;
        const modal = $('#ln-modal-captura', raiz);
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        const generar = () => {
          sesionCaptura.guardando = true;
          modal.setAttribute('aria-busy', 'true');
          modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = true; });
          $('#ln-captura-subtitulo', raiz).textContent = 'Registro guardado. Preparando el documento PDF.';
          cuerpo.innerHTML = '<div class="ln-pdf-estado" role="status"><span class="ln-spinner"></span><h3>Generando tu PDF</h3>' +
            '<p>Las firmas y los datos ya están guardados. Estamos completando la plantilla y creando el archivo en Drive.</p>' +
            '<ol><li>Firmas cargadas</li><li>Registro guardado</li><li aria-current="step">Generación del PDF en curso</li></ol>' +
            '<p class="ln-tenue">Este paso puede tardar unos segundos. El enlace aparecerá aquí al terminar.</p></div>';
          cuerpo.scrollTop = 0;
          return llamar('apiLineasGenerarPdf', tipo, nuevoId, false).then((pdf) => {
            if (!vigente() || captura !== sesionCaptura) return;
            $('#ln-captura-subtitulo', raiz).textContent = 'Documento listo para consultar o descargar.';
            cuerpo.innerHTML = '<div class="ln-pdf-estado" role="status">' + icono('circle-check') + '<h3>Tu PDF está listo</h3><p>' + esc(pdf.nombre || 'Documento generado') + '</p>' +
              '<div class="ln-pdf-acciones">' + enlaceDrive(pdf.id, 'Abrir PDF', true) + enlaceDrive(sesionCaptura.carpetaId, 'Carpeta en Drive') +
              '<button type="button" class="secondary" data-cerrar-modal>Volver al equipo</button></div></div>';
            cargarEvidencias(idAbierto);
            cargarHistorial(idAbierto);
          }).catch((e) => {
            if (!vigente() || captura !== sesionCaptura) return;
            $('#ln-captura-subtitulo', raiz).textContent = 'Registro guardado; PDF pendiente.';
            cuerpo.innerHTML = '<div class="ln-pdf-estado" role="alert">' + icono('file-warning') + '<h3>No se pudo completar el PDF</h3><p>' + mensajeError(e) + '</p>' +
              '<p>Tus datos y firmas están guardados. Puedes reintentar el PDF sin volver a llenar el formulario.</p>' +
              '<button type="button" class="primary ln-btn-icono" id="cap-reintentar-pdf">' + icono('refresh-cw') + ' Reintentar PDF</button></div>';
            $('#cap-reintentar-pdf', raiz).addEventListener('click', generar);
            cargarEvidencias(idAbierto);
            cargarHistorial(idAbierto);
          }).finally(() => {
            sesionCaptura.guardando = false;
            modal.removeAttribute('aria-busy');
            modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = false; });
          });
        };
        generar();
      }

      function iniciarFormularioInspeccion() {
        captura.firmas.inspector = activarFirma('cap-firma-inspector');

        ]).then(([fInspector, fResponsable]) => { estadoGuardado('Guardando inspección'); return llamar('apiLineasGuardarInspeccion', Object.assign({}, refCaptura, {

          actualizarAccesorios: $('#cap-actualizar-accesorios', raiz) ? $('#cap-actualizar-accesorios', raiz).checked : false,

      // -- Abrir el modal --

      function abrirCaptura(tipo, ref) {
        $('#ln-modal-captura', raiz).hidden = false;
        $('#ln-captura-icono', raiz).innerHTML = icono(tipo === 'INSPECCION' ? 'clipboard-check' : 'signature');
        $('#ln-captura-tipo', raiz).textContent = tipo === 'INSPECCION' ? 'Inspección de telefonía' : 'Responsiva de entrega';
        $('#ln-captura-titulo', raiz).textContent = tipo === 'INSPECCION' ? 'Nueva inspección' : 'Nueva responsiva';
        $('#ln-captura-subtitulo', raiz).textContent = 'Preparando datos y carpeta de evidencia…';
        $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        captura = { tipo: tipo, ref: ref, idObjetivo: ref.equipoId || ref.lineaId, fotos: [], patronId: null, firmas: {} };

        const pedirContexto = tipo === 'INSPECCION' ? llamar('apiLineasContextoInspeccion', ref) : llamar('apiLineasContextoResponsiva', ref);
        Promise.all([pedirContexto, llamar('apiLineasPrepararEvidencia', tipo, ref), llamar('apiLineasCatalogos')]).then(([ctx, carpeta, catalogos]) => {
          if (!captura) {
            llamar('apiLineasCancelarEvidencia', carpeta.carpetaId, carpeta.fotosCarpetaId).catch(() => {});
            return;
          }
          ctx.catalogos = catalogos;
          captura.contexto = ctx;
          captura.carpetaId = carpeta.carpetaId;
          captura.fotosCarpetaId = carpeta.fotosCarpetaId || carpeta.carpetaId;
          captura.ruta = carpeta.ruta;
          $('#ln-captura-subtitulo', raiz).textContent = tipo === 'INSPECCION'
            ? 'Revisa el estado del activo, agrega evidencia y valida con firma.'
            : 'Confirma la entrega, registra la evidencia y recaba ambas firmas.';
          if (tipo === 'INSPECCION') {
            $('#ln-captura-cuerpo', raiz).innerHTML = formularioInspeccion(ctx);
            pintarIconos($('#ln-captura-cuerpo', raiz));
            iniciarFormularioInspeccion();
          } else {
            $('#ln-captura-cuerpo', raiz).innerHTML = formularioResponsiva(ctx);
            pintarIconos($('#ln-captura-cuerpo', raiz));
            iniciarFormularioResponsiva();
          }
        }).catch((e) => {
          if (!captura) return;
          $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>';
        });
      }

      // ---- Historial ----
      const ETIQUETA_MOV = {
        ASIGNAR_LINEA: 'Línea asignada', RETIRAR_LINEA: 'Línea retirada', CAMBIO_EQUIPO: 'Cambio de equipo',
        REASIGNACION: 'Reasignación de responsable', CAMBIO_ESTATUS_EQUIPO: 'Cambio de estatus (equipo)',
        CAMBIO_ESTATUS_LINEA: 'Cambio de estatus (línea)', DESECHO: 'Desecho', INSPECCION: 'Inspección', RESPONSIVA: 'Responsiva firmada',
        EDICION: 'Edición de datos', ALTA: 'Alta de registro',
      };

      function describirMovimiento(m) {
        const a = m.antes || {};
        const d = m.despues || {};
        const partes = [];
        if (m.tipo === 'REASIGNACION') {
          partes.push(esc((a.responsable && a.responsable.nombre) || '(sin responsable)') + ' → <b>' + esc((d.responsable && d.responsable.nombre) || '—') + '</b>');
        } else if (m.tipo === 'ASIGNAR_LINEA' || m.tipo === 'RETIRAR_LINEA') {
          partes.push('Línea <b>' + esc(m.numero || '') + '</b> ' + (m.tipo === 'ASIGNAR_LINEA' ? 'en' : 'fuera de') + ' NUCO <b>' + esc(m.nuco || '') + '</b>');
        } else if (m.tipo === 'CAMBIO_EQUIPO') {
          partes.push('Línea <b>' + esc(m.numero || '') + '</b>: NUCO ' + esc(m.nuco || '') + ' → <b>NUCO ' + esc(m.nucoDestino || '') + '</b>');
        } else if (/^CAMBIO_ESTATUS/.test(m.tipo)) {
          partes.push(esc(a.estatus || '—') + ' → <b>' + esc(d.estatus || '—') + '</b>');
        } else if (m.tipo === 'INSPECCION') {
          partes.push('<a href="#" class="ln-enlace" data-ln-ir="inspeccion" data-id="' + esc(m.inspeccionId) + '">Ver inspección</a>' +
            (d.calificacion !== null && d.calificacion !== undefined ? ' · Calificación ' + Math.round(d.calificacion * 100) + '%' : ''));
        } else if (m.tipo === 'RESPONSIVA') {
          partes.push('Responsable: <b>' + esc((d.responsable && d.responsable.nombre) || '—') + '</b>');
        } else if (m.tipo === 'DESECHO') {
          partes.push('Folio ' + esc(m.folio || '—') + (m.detalle && m.detalle.lugar ? ' · ' + esc(m.detalle.lugar) : ''));
        }
        if (m.motivo) partes.push('Motivo: ' + esc(m.motivo));
        if (m.ticket) partes.push('Ticket: ' + esc(m.ticket));
        if (m.cambios && m.cambios.length) {
          partes.push('<details><summary class="ln-tenue">' + m.cambios.length + ' campo(s) modificados</summary><ul class="ln-tenue">' +
            m.cambios.map((c) => '<li>' + esc(c.campo) + ': ' + esc(c.antes || '—') + ' → <b>' + esc(c.despues || '—') + '</b></li>').join('') + '</ul></details>');
        }
        return partes.join('<br>');
      }

      function cargarHistorial(id) {
        const pila0 = pila.length;
        llamar('apiLineasHistorial', id).then((h) => {
          const cont = $('#ln-historial', raiz);
          if (!vigente() || !cont || pila.length !== pila0) return;
          const items = h.movimientos.map((m) => ({
            fecha: m.fecha, titulo: ETIQUETA_MOV[m.tipo] || m.tipo, origen: m.origen, cuerpo: describirMovimiento(m),
            usuario: m.usuario && (m.usuario.nombre || m.usuario.correo),
          }));
          (h.legado ? h.legado.eventos : []).forEach((e) => {
            items.push({ fecha: e.fecha, titulo: 'Cambio: ' + (e.campo || ''), origen: 'BITACORA', cuerpo: esc(e.antes || '—') + ' → <b>' + esc(e.despues || '—') + '</b>', usuario: e.usuario });
          });
          items.sort((a, b) => new Date(b.fecha || 0) - new Date(a.fecha || 0));
          const origen = { SISTEMA: chip('Nuevo sistema', 'verde'), LEGADO: chip('AppSheet', 'azul'), BITACORA: chip('Bitácora AppSheet', 'neutro') };
          cont.innerHTML = tarjeta(icono('history') + ' Historial (' + items.length + ')', items.length
            ? '<ol class="ln-timeline">' + items.slice(0, 150).map((it) =>
                '<li><div class="ln-tl-cabecera"><b>' + esc(it.titulo) + '</b> ' + (origen[it.origen] || '') +
                '<span class="ln-tenue ln-tl-fecha">' + esc(fechaHora(it.fecha)) + (it.usuario ? ' · ' + esc(it.usuario) : '') + '</span></div>' +
                '<div class="ln-tl-cuerpo">' + it.cuerpo + '</div></li>').join('') + '</ol>' +
              (items.length > 150 ? '<p class="ln-tenue ln-pie">Mostrando los 150 más recientes.</p>' : '')
            : '<p class="empty-state">Sin movimientos registrados.</p>');
        }).catch((e) => {
          const cont = $('#ln-historial', raiz);
          if (cont) cont.innerHTML = tarjeta(icono('history') + ' Historial', '<p class="error-msg">' + mensajeError(e) + '</p>');
        });
      }

      // ---- Inspección ----
      function pintarInspeccion(detalle, id) {
        return llamar('apiLineasInspeccion', id).then((r) => {
          if (!vigente()) return;
          const i = r.inspeccion;
          const e = r.equipo;
          const s = i.snapshot || {};
          const CLASE_VALOR = { SI: 'verde', BUENO: 'verde', INSTALADA: 'verde', REGULAR: 'ambar', NO: 'rojo', MALO: 'rojo', 'NO INSTALADA': 'neutro' };
          const checklist = i.origen === 'DRIVE'
            ? '<div class="ln-nota">Inspección histórica que solo existe en Drive: no tiene checklist capturado, solo sus archivos.</div>'
            : '<div class="ln-grid-2">' + r.checklist.map((sec) => {
                const puntos = sec.puntos.filter((p) => i.checklist && i.checklist[p.clave]);
                if (!puntos.length) return '';
                return tarjeta(icono('list-checks') + ' ' + esc(sec.seccion), campos(puntos.map((p) => {
                  const v = i.checklist[p.clave];
                  return [p.etiqueta, chip(v, CLASE_VALOR[v] || 'neutro'), true];
                })));
              }).join('') + '</div>';

          const galeria = (lista, clase) => '<div class="ln-galeria">' + lista.map((f) =>
            '<a class="ln-foto ' + (clase || '') + '" target="_blank" rel="noopener" href="' + esc(f.enlace) + '" title="' + esc(f.nombre) + '">' +
            (f.miniatura ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(f.miniatura) + '" alt="' + esc(f.nombre) + '">' : '<span>' + (f.video ? icono('video') : icono('image')) + '</span>') +
            '</a>').join('') + '</div>';

          detalle.innerHTML = migas() +
            encabezado('clipboard-check', 'Inspección ' + esc(fecha(i.fecha) || ''),
              (ORIGEN[i.origen] || '') + (e ? chip('NUCO ' + (e.nuco || '—'), 'neutro') : '') +
              (i.calificacion !== null && i.calificacion !== undefined ? chip('Calificación ' + porcentaje(i.calificacion), 'verde') : ''),
              (e ? '<button type="button" class="secondary ln-btn-icono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' Ver equipo</button>' : '') +
              (i.drive ? enlaceDrive(i.drive.carpetaId, 'Carpeta en Drive') : '') +
              (r.pdfs || []).map((p) => enlaceDrive(p.id, p.nombre || 'PDF', true)).join('')) +
            '<div class="ln-grid-2">' +
              (i.origen !== 'DRIVE' ? tarjeta(icono('user') + ' Datos al momento de la inspección', campos([
                ['Responsable', s.responsable], ['Departamento', s.departamento], ['Sede', s.sede], ['Puesto', s.puesto],
                ['Número', s.numero], ['IMEI', s.imei], ['Modelo', s.modelo], ['Compañía', s.compania],
                ['Inspector', i.inspector], ['Ticket', i.ticket], ['Observaciones', i.observaciones],
              ])) : '') +
              tarjeta(icono('folder-open') + ' Evidencias', campos([
                ['Carpeta', i.drive ? esc(i.drive.ruta) : null, true],
                ['Coincidencia', i.drive ? (i.drive.coincidenciaExacta ? 'Misma fecha' : 'Fecha ±1 día') : 'Sin carpeta en Drive'],
                ['Fotos', String(r.fotos.length)],
              ])) +
            '</div>' +
            checklist +
            tarjeta(icono('images') + ' Fotos (' + r.fotos.length + ')', r.fotos.length ? galeria(r.fotos) : '<p class="empty-state">Sin fotos en la carpeta de Drive.</p>') +
            (r.firmas && r.firmas.length ? tarjeta(icono('signature') + ' Firmas', galeria(r.firmas, 'ln-firma')) : '');
        });
      }
    }

    /** Desde una bitácora: abre el registro en Líneas Telefónicas. */
    function irARegistro(id) {
      memoria.abrirAlEntrar = id;
      navegarA('lineas-telefonicas', 'Líneas Telefónicas');
    }

    // ======================================================================
    // Detalles Líneas Telefónicas: buscador rápido que salta a la ficha
    // ======================================================================

    function initDetalles() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-detalles-lineas');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const paso = 48;
      let registros = [];
      let filtrados = [];
      let visibles = paso;
      let temporizador = null;
      pintarIconos(raiz);

      function tarjetaDetalle(r) {
        const esEquipo = r.clase === 'EQUIPO';
        const titulo = esEquipo ? (r.nuco || 'Sin NUCO') : (r.numero || 'Sin número');
        const principal = esEquipo ? (r.numero || r.modelo || 'Sin línea asociada') : (r.responsable || 'Línea sin responsable');
        const subtitulo = esEquipo ? (r.modelo || TIPO_EQUIPO[r.tipo] || r.tipo || 'Equipo') : (r.compania || 'Línea telefónica');
        const identidad = esEquipo ? r.imei : r.sim;
        return '<button type="button" class="card ln-cuadro ln-cuadro-activo" data-ir="' + esc(r.id) + '" aria-label="Abrir ' + esc(titulo) + '">' +
          '<div class="ln-cuadro-superior"><span class="ln-cuadro-folio ln-mono">' + esc(titulo) + '</span>' +
          '<span class="ln-cuadro-tipo">' + icono(esEquipo ? 'smartphone' : 'sim-card') + ' ' + (esEquipo ? 'Equipo' : 'Línea') + '</span></div>' +
          '<div class="ln-cuadro-depto">' + guion(r.departamento) + '</div>' +
          '<div class="ln-cuadro-principal">' + guion(principal) + '</div>' +
          '<div class="ln-cuadro-secundario">' + guion(subtitulo) + '</div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('user') + ' ' + guion(r.responsable) + '</span>' +
          '<span class="ln-mono">' + icono(esEquipo ? 'scan-line' : 'credit-card') + ' ' + guion(identidad) + '</span></div>' +
          '<div class="ln-cuadro-pie"><span>' + chip(r.estatus) + '</span>' +
          (esEquipo && r.compania ? '<span>' + esc(r.compania) + '</span>' : '') + '</div></button>';
      }

      function aplicarFiltros() {
        const texto = normal($('#lnd-q', raiz).value).trim();
        const tipo = $('#lnd-tipo', raiz).value;
        filtrados = registros.filter((r) => {
          if (tipo !== 'TODOS' && r.clase !== tipo) return false;
          return !texto || ['nuco', 'numero', 'imei', 'sim', 'modelo', 'compania', 'responsable', 'departamento', 'estatus']
            .some((c) => normal(r[c]).indexOf(texto) >= 0);
        });
        visibles = paso;
        pintar();
      }

      function pintar() {
        const grid = $('#lnd-grid', raiz);
        grid.innerHTML = filtrados.length
          ? filtrados.slice(0, visibles).map(tarjetaDetalle).join('')
          : '<div class="card empty-state ln-cuadro-vacio">No hay líneas o equipos que coincidan con los filtros.</div>';
        $('#lnd-total', raiz).textContent = miles(registros.length);
        $('#lnd-filtrados', raiz).textContent = miles(filtrados.length);
        $('#lnd-conteo', raiz).textContent = 'Mostrando ' + miles(Math.min(visibles, filtrados.length)) + ' de ' + miles(filtrados.length);
        $('#lnd-mas', raiz).hidden = visibles >= filtrados.length;
      }

      $('#lnd-q', raiz).addEventListener('input', (ev) => {
        clearTimeout(temporizador);
        temporizador = setTimeout(aplicarFiltros, 150);
      });
      $('#lnd-tipo', raiz).addEventListener('change', aplicarFiltros);
      $('#lnd-mas', raiz).addEventListener('click', () => { visibles += paso; pintar(); });
      $('#lnd-exportar', raiz).addEventListener('click', () => {
        const columnas = ['clase', 'nuco', 'numero', 'modelo', 'imei', 'sim', 'compania', 'estatus', 'responsable', 'departamento'];
        exportarCsv('detalles lineas telefonicas', columnas, filtrados,
          ['Tipo', 'NUCO', 'Número', 'Modelo', 'IMEI', 'SIM', 'Compañía', 'Estatus', 'Responsable', 'Departamento']);
      });
      raiz.addEventListener('click', (ev) => {
        const f = ev.target.closest('[data-ir]');
        if (f) irARegistro(f.dataset.ir);
      });

      Promise.all([cargarPermisos(), cargarIndice()]).then(([, indice]) => {
        if (!vigente()) return;
        registros = indice.equipos.map((r) => Object.assign({ clase: 'EQUIPO' }, r))
          .concat(indice.lineas.filter((r) => r.suelta).map((r) => Object.assign({ clase: 'LINEA' }, r)));
        aplicarFiltros();
      })
        .catch((e) => {
          if (!vigente()) return;
          $('#lnd-error', raiz).textContent = 'No se pudo cargar el índice: ' + mensajeError(e);
          $('#lnd-error', raiz).hidden = false;
        });
    }

    // ======================================================================
    // Gestión de Activos: busca un colaborador y muestra sus líneas/equipos
    // (vehículos, hologramas, Uber y cajas chicas se integran con los demás módulos)
    // ======================================================================

    function initGestionActivos() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-gestion-activos');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const paso = 48;
      pintarIconos(raiz);

      let colaboradores = [];
      let filtrados = [];
      let visibles = paso;
      let temporizador = null;

      function filasPorResponsable(indice, nombre) {
        const texto = normal(nombre);
        return {
          equipos: indice.equipos.filter((r) => normal(r.responsable) === texto),
          lineas: indice.lineas.filter((r) => r.suelta && normal(r.responsable) === texto),
        };
      }

      function tarjetaLineas(nombre, datos) {
        const filaEq = (r) => '<tr class="ln-fila-clic" data-ir="' + esc(r.id) + '"><td class="ln-mono ln-fuerte">' + guion(r.nuco) + '</td><td>' +
          esc(TIPO_EQUIPO[r.tipo] || r.tipo || '') + '</td><td>' + guion(r.modelo) + '</td><td>' + chip(r.estatus) + '</td><td class="ln-mono">' +
          (r.numero ? esc(r.numero) : '<span class="ln-tenue">Sin línea</span>') + '</td></tr>';
        const filaLi = (r) => '<tr class="ln-fila-clic" data-ir="' + esc(r.id) + '"><td class="ln-mono ln-fuerte">' + guion(r.numero) +
          '</td><td>Línea suelta</td><td>' + guion(r.compania) + '</td><td>' + chip(r.estatus) + '</td><td>—</td></tr>';
        const filas = datos.equipos.map(filaEq).concat(datos.lineas.map(filaLi));
        return '<div class="card ln-card"><h3>' + icono('smartphone') + ' Líneas y equipos (' + filas.length + ')</h3>' +
          (filas.length
            ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>NUCO / Número</th><th>Tipo</th><th>Modelo / Compañía</th><th>Estatus</th><th>Línea</th></tr></thead><tbody>' + filas.join('') + '</tbody></table></div>'
            : '<p class="empty-state">Sin líneas ni equipos asignados a ' + esc(nombre) + '.</p>') + '</div>';
      }

      function tarjetaPendiente(titulo, ico) {
        return '<div class="card ln-card"><h3>' + icono(ico) + ' ' + esc(titulo) + '</h3>' +
          '<p class="ln-tenue">Pendiente: se integra cuando se junten los módulos del equipo (no es de Líneas).</p></div>';
      }

      function mostrarColaborador(c, tarjeta) {
        cargarIndice().then((indice) => {
          if (!vigente()) return;
          const datos = filasPorResponsable(indice, c.nombre);
          raiz.querySelectorAll('.ln-cuadro-colaborador.seleccionado').forEach((el) => el.classList.remove('seleccionado'));
          if (tarjeta) tarjeta.classList.add('seleccionado');
          $('#lnga-resultado', raiz).innerHTML =
            '<div class="ln-detalle-header card"><div class="ln-detalle-icono">' + icono('user') + '</div>' +
            '<div class="ln-detalle-titulo"><h2>' + esc(c.nombre) + '</h2><div class="ln-chips">' +
              (c.puesto ? chip(c.puesto, 'neutro') : '') + (c.departamento ? chip(c.departamento, 'azul') : '') + (c.estatus ? chip(c.estatus) : '') +
            '</div><p class="ln-pie ln-tenue">' + [c.noEmpleado ? 'Empleado ' + esc(c.noEmpleado) : '', c.sede, c.oficina].filter(Boolean).join(' · ') + '</p></div></div>' +
            tarjetaLineas(c.nombre, datos) +
            '<div class="ln-grid-2">' + tarjetaPendiente('Vehículos', 'car') + tarjetaPendiente('Hologramas / combustible', 'fuel') + '</div>' +
            '<div class="ln-grid-2">' + tarjetaPendiente('Uber', 'car-front') + tarjetaPendiente('Cajas chicas', 'wallet') + '</div>';
          $('#lnga-resultado', raiz).scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }

      function tarjetaColaborador(c) {
        const conActivos = c.totalActivos > 0;
        return '<button type="button" class="card ln-cuadro ln-cuadro-colaborador ' + (conActivos ? 'con-activos' : 'sin-activos') + '" data-colaborador-i="' + c._i + '">' +
          '<div class="ln-cuadro-superior"><span class="ln-cuadro-departamento">' + guion(c.departamento) + '</span>' +
          '<span class="ln-cuadro-area">' + guion(c.area) + '</span></div>' +
          '<div class="ln-cuadro-principal">' + guion(c.nombre) + '</div>' +
          '<div class="ln-cuadro-secundario">' + guion(c.puesto) + '</div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('map-pin') + ' ' + guion(c.sede) + '</span><span>' + icono('building-2') + ' ' + guion(c.oficina) + '</span></div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('briefcase-business') + ' ' + chip(c.estatus || 'Sin estatus', String(c.estatus).toUpperCase() === 'ACTIVO' ? 'verde' : 'neutro') + '</span>' +
          '<span class="ln-activos-estado ' + (conActivos ? 'si' : 'no') + '">' + icono(conActivos ? 'package-check' : 'package-x') + ' ' +
          (conActivos ? miles(c.totalActivos) + ' activo(s)' : 'Sin activos') + '</span></div></button>';
      }

      function pintarCuadros() {
        $('#lnga-grid', raiz).innerHTML = filtrados.length
          ? filtrados.slice(0, visibles).map(tarjetaColaborador).join('')
          : '<div class="card empty-state ln-cuadro-vacio">No hay colaboradores que coincidan con los filtros.</div>';
        $('#lnga-conteo', raiz).textContent = 'Mostrando ' + miles(Math.min(visibles, filtrados.length)) + ' de ' + miles(filtrados.length);
        $('#lnga-mas', raiz).hidden = visibles >= filtrados.length;
      }

      function aplicarFiltros() {
        const texto = normal($('#lnga-q', raiz).value).trim();
        const activos = $('#lnga-filtro-activos', raiz).value;
        filtrados = colaboradores.filter((c) => {
          if (activos === 'CON' && !c.totalActivos) return false;
          if (activos === 'SIN' && c.totalActivos) return false;
          return !texto || ['nombre', 'noEmpleado', 'puesto', 'departamento', 'area', 'sede', 'oficina']
            .some((campo) => normal(c[campo]).indexOf(texto) >= 0);
        });
        visibles = paso;
        pintarCuadros();
      }

      $('#lnga-q', raiz).addEventListener('input', (ev) => {
        clearTimeout(temporizador);
        temporizador = setTimeout(aplicarFiltros, 150);
      });
      $('#lnga-filtro-activos', raiz).addEventListener('change', aplicarFiltros);
      $('#lnga-mas', raiz).addEventListener('click', () => { visibles += paso; pintarCuadros(); });
      raiz.addEventListener('click', (ev) => {
        const sug = ev.target.closest('[data-colaborador-i]');
        if (sug) {
          const c = colaboradores[Number(sug.dataset.colaboradorI)];
          if (c) mostrarColaborador(c, sug);
          return;
        }
        const f = ev.target.closest('[data-ir]');
        if (f) irARegistro(f.dataset.ir);
      });

      Promise.all([cargarColaboradores(), cargarIndice()]).then(([r, indice]) => {
        if (!vigente()) return;
        const conteo = {};
        indice.equipos.forEach((a) => { const k = normal(a.responsable); if (k) conteo[k] = (conteo[k] || 0) + 1; });
        indice.lineas.filter((a) => a.suelta).forEach((a) => { const k = normal(a.responsable); if (k) conteo[k] = (conteo[k] || 0) + 1; });
        colaboradores = filasComoObjetos(r).map((c, i) => Object.assign(c, { _i: i, totalActivos: conteo[normal(c.nombre)] || 0 }));
        $('#lnga-total', raiz).textContent = miles(colaboradores.length);
        $('#lnga-con-activos', raiz).textContent = miles(colaboradores.filter((c) => c.totalActivos).length);
        aplicarFiltros();
      }).catch((e) => {
        if (!vigente()) return;
        $('#lnga-grid', raiz).innerHTML = '';
        $('#lnga-error', raiz).textContent = 'No se pudieron cargar los colaboradores: ' + mensajeError(e);
        $('#lnga-error', raiz).hidden = false;
      });
    }

    // ======================================================================
    // Inventario de Accesorios (Líneas) — ACCESORIOS CELULARES / MOVIMIENTOS_ACCESORIOS
    // en la copia de pruebas de Líneas; no toca el módulo de accesorios del equipo.
    // ======================================================================

    function initAccesoriosLineas() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-accesorios');
      const vigente = () => n === montaje && document.body.contains(raiz);
      pintarIconos(raiz);

      let indiceAcc = null;
      let seleccionado = null;
      let filtroQ = '';
      let temporizador = null;

      function tarjeta(titulo, cuerpo) {
        return '<div class="card ln-card"><h3>' + titulo + '</h3>' + cuerpo + '</div>';
      }

      function pintarIndicadores() {
        if (!indiceAcc) return;
        const stockBajo = indiceAcc.filas.filter((a) => a.reabasto).length;
        $('#lac-indicadores', raiz).innerHTML =
          '<div class="stat-tile"><div class="stat-icon">' + icono('package') + '</div><div><div class="stat-value">' + miles(indiceAcc.filas.length) + '</div><div class="stat-label">Artículos</div></div></div>' +
          '<div class="stat-tile stat-tile-warn"><div class="stat-icon">' + icono('triangle-alert') + '</div><div><div class="stat-value">' + miles(stockBajo) + '</div><div class="stat-label">Con stock bajo (≤ ' + indiceAcc.umbralReabasto + ')</div></div></div>';
      }

      function filtradas() {
        const texto = normal(filtroQ).trim();
        if (!texto) return indiceAcc.filas;
        return indiceAcc.filas.filter((a) => ['nombre', 'categoria', 'marca'].some((c) => normal(a[c]).indexOf(texto) >= 0));
      }

      function pintarTabla() {
        if (!indiceAcc) return;
        const filas = filtradas();
        $('#lac-tbody', raiz).innerHTML = filas.length ? filas.map((a) =>
          '<tr class="ln-fila-clic" data-articulo="' + esc(a.id) + '"><td class="ln-fuerte">' + guion(a.nombre) + '</td><td>' + guion(a.categoria) +
          '</td><td class="ln-tenue">' + guion(a.marca) + '</td><td class="lac-stock-celda"><span class="lac-stock' + (a.reabasto ? ' bajo' : '') + '">' + esc(String(a.stock)) + '</span></td>' +
          '<td><button type="button" class="secondary ln-btn-chico" data-entrada="' + esc(a.id) + '">+ Entrada</button> ' +
          '<button type="button" class="secondary ln-btn-chico" data-salida="' + esc(a.id) + '">− Salida</button></td></tr>').join('')
          : '<tr><td colspan="5" class="empty-state">Sin artículos</td></tr>';
      }

      function cargar(forzar) {
        cargarAccesorios(!!forzar).then((r) => {
          if (!vigente()) return;
          indiceAcc = r;
          pintarIndicadores();
          pintarTabla();
        }).catch((e) => {
          if (!vigente()) return;
          $('#lac-error', raiz).textContent = 'No se pudo cargar el inventario: ' + mensajeError(e);
          $('#lac-error', raiz).hidden = false;
        });
      }

      function abrirDetalle(id) {
        const a = (indiceAcc.filas || []).filter((x) => x.id === id)[0];
        if (!a) return;
        const cont = $('#lac-detalle', raiz);
        cont.hidden = false;
        cont.innerHTML = tarjeta(icono('history') + ' Movimientos de ' + esc(a.nombre), '<p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p>');
        llamar('apiLineasAccesoriosMovimientos', id).then((movs) => {
          if (!vigente()) return;
          cont.innerHTML = tarjeta(icono('history') + ' Movimientos de ' + esc(a.nombre) + ' (' + movs.length + ')', movs.length
            ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th>Usuario</th><th>Comentarios</th></tr></thead><tbody>' +
              movs.map((m) => '<tr><td>' + guion(fechaHora(m.fecha)) + '</td><td>' + chip(m.tipo, m.tipo === 'ENTRADA' ? 'verde' : 'ambar') + '</td><td>' +
                esc(String(m.cantidad)) + '</td><td>' + guion(m.usuario) + '</td><td>' + guion(m.comentarios) + '</td></tr>').join('') + '</tbody></table></div>'
            : '<p class="empty-state">Sin movimientos.</p>');
        }).catch((e) => { if (vigente()) cont.innerHTML = tarjeta(icono('history') + ' Movimientos', '<p class="error-msg">' + mensajeError(e) + '</p>'); });
      }

      function abrirModalNuevo() {
        $('#lac-nombre', raiz).value = ''; $('#lac-categoria', raiz).value = ''; $('#lac-marca', raiz).value = '';
        $('#lac-nuevo-error', raiz).hidden = true;
        $('#lac-modal-nuevo', raiz).hidden = false;
      }
      function cerrarModalNuevo() { $('#lac-modal-nuevo', raiz).hidden = true; }

      function abrirModalMovimiento(id, tipo) {
        seleccionado = { id: id, tipo: tipo };
        const a = (indiceAcc.filas || []).filter((x) => x.id === id)[0];
        $('#lac-mov-titulo', raiz).textContent = (tipo === 'ENTRADA' ? 'Entrada de ' : 'Salida de ') + (a ? a.nombre : '');
        $('#lac-cantidad', raiz).value = '';
        $('#lac-comentarios', raiz).value = '';
        $('#lac-mov-error', raiz).hidden = true;
        $('#lac-modal-mov', raiz).hidden = false;
      }
      function cerrarModalMov() { $('#lac-modal-mov', raiz).hidden = true; seleccionado = null; }

      $('#lac-nuevo', raiz).addEventListener('click', abrirModalNuevo);
      raiz.querySelectorAll('[data-cerrar-modal-nuevo]').forEach((b) => b.addEventListener('click', cerrarModalNuevo));
      raiz.querySelectorAll('[data-cerrar-modal-mov]').forEach((b) => b.addEventListener('click', cerrarModalMov));
      $('#lac-modal-nuevo', raiz).addEventListener('click', (ev) => { if (ev.target.id === 'lac-modal-nuevo') cerrarModalNuevo(); });
      $('#lac-modal-mov', raiz).addEventListener('click', (ev) => { if (ev.target.id === 'lac-modal-mov') cerrarModalMov(); });

      $('#lac-guardar-nuevo', raiz).addEventListener('click', () => {
        const nombre = $('#lac-nombre', raiz).value.trim();
        if (!nombre) { $('#lac-nuevo-error', raiz).textContent = 'El nombre es obligatorio.'; $('#lac-nuevo-error', raiz).hidden = false; return; }
        llamar('apiLineasAccesoriosAgregarArticulo', { nombre: nombre, categoria: $('#lac-categoria', raiz).value, marca: $('#lac-marca', raiz).value })
          .then(() => { cerrarModalNuevo(); cargar(true); })
          .catch((e) => { $('#lac-nuevo-error', raiz).textContent = mensajeError(e); $('#lac-nuevo-error', raiz).hidden = false; });
      });

      $('#lac-guardar-mov', raiz).addEventListener('click', () => {
        if (!seleccionado) return;
        const cantidad = Number($('#lac-cantidad', raiz).value);
        if (!cantidad || cantidad <= 0) { $('#lac-mov-error', raiz).textContent = 'Captura una cantidad válida.'; $('#lac-mov-error', raiz).hidden = false; return; }
        llamar('apiLineasAccesoriosRegistrarMovimiento', { accesorioId: seleccionado.id, tipo: seleccionado.tipo, cantidad: cantidad, comentarios: $('#lac-comentarios', raiz).value })
          .then(() => { cerrarModalMov(); cargar(true); })
          .catch((e) => { $('#lac-mov-error', raiz).textContent = mensajeError(e); $('#lac-mov-error', raiz).hidden = false; });
      });

      $('#lac-q', raiz).addEventListener('input', (ev) => {
        clearTimeout(temporizador);
        temporizador = setTimeout(() => { filtroQ = ev.target.value; pintarTabla(); }, 150);
      });

      raiz.addEventListener('click', (ev) => {
        const entrada = ev.target.closest('[data-entrada]');
        if (entrada) { abrirModalMovimiento(entrada.dataset.entrada, 'ENTRADA'); return; }
        const salida = ev.target.closest('[data-salida]');
        if (salida) { abrirModalMovimiento(salida.dataset.salida, 'SALIDA'); return; }
        const fila = ev.target.closest('[data-articulo]');
        if (fila) abrirDetalle(fila.dataset.articulo);
      });

      cargar();
    }

    function initOperativa(tipo) {
      const n = ++montaje;
      const cfg = OPERATIVAS[tipo];
      const raiz = document.getElementById('ln-operativa');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const consulta = { q: '', grupo: '', pagina: 0 };
      let ultima = null;
      const modal = $('#ln-op-modal');

      $('#ln-op-titulo', raiz).textContent = cfg.titulo;
      $('#ln-op-subtitulo', raiz).textContent = cfg.subtitulo;
      $('#ln-op-titulo-icono', raiz).innerHTML = icono(cfg.icono);
      pintarIconos(raiz);

      function cerrarAlta() {
        modal.hidden = true;
        $('#ln-op-alta-error').hidden = true;
      }

      function abrirAlta() {
        const hoy = new Date();
        const fechaHoy = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');
        $('#ln-op-modal-titulo').textContent = 'Nuevo registro · ' + cfg.titulo;
        $('#ln-op-campos').innerHTML = cfg.campos.map(([nombre, etiqueta, tipoCampo, requerido, opciones]) => {
          const req = requerido ? ' required' : '';
          const valorInicial = tipoCampo === 'date' && /FECHA DE (SOLICITUD|ENTREGA)/.test(nombre) ? fechaHoy : '';
          let control;
          if (tipoCampo === 'select') {
            control = '<select name="' + esc(nombre) + '"' + req + '><option value="">Selecciona…</option>' +
              opciones.map((o) => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('') + '</select>';
          } else if (tipoCampo === 'textarea') {
            control = '<textarea name="' + esc(nombre) + '" rows="3"' + req + '></textarea>';
          } else if (tipoCampo === 'checkbox') {
            control = '<label class="ln-op-check"><input name="' + esc(nombre) + '" type="checkbox"> <span data-ln-icon="check"></span> Sí</label>';
          } else {
            control = '<input name="' + esc(nombre) + '" type="' + tipoCampo + '" value="' + valorInicial + '"' + req + '>';
          }
          return '<div class="field' + (tipoCampo === 'textarea' ? ' ln-op-campo-ancho' : '') + '"><label>' + esc(etiqueta) + (requerido ? ' *' : '') + '</label>' + control + '</div>';
        }).join('');
        $('#ln-op-alta-form').reset();
        $('#ln-op-campos').querySelectorAll('input[type="date"]').forEach((el) => {
          if (/FECHA DE (SOLICITUD|ENTREGA)/.test(el.name)) el.value = fechaHoy;
        });
        modal.hidden = false;
        pintarIconos(modal);
        const primero = modal.querySelector('input:not([type="checkbox"]), select, textarea');
        if (primero) primero.focus();
      }

      function valor(v) {
        if (v === null || v === undefined || v === '') return vacio;
        if (v === true || String(v).toUpperCase() === 'TRUE') return '<span class="ln-booleano ln-si" title="Sí">' + icono('check') + '<span>Sí</span></span>';
        if (v === false || String(v).toUpperCase() === 'FALSE') return '<span class="ln-booleano ln-no" title="No">' + icono('x') + '<span>No</span></span>';
        if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) {
          const d = new Date(v);
          return esc(d.getHours() || d.getMinutes() || d.getSeconds() ? fechaHora(v) : fecha(v));
        }
        return esc(v);
      }

      function cargar() {
        const tbody = $('#ln-op-tbody', raiz);
        tbody.innerHTML = '<tr><td class="empty-state"><span class="ln-spinner"></span> Cargando…</td></tr>';
        $('#ln-op-error', raiz).hidden = true;
        $('#ln-op-anterior', raiz).disabled = true;
        $('#ln-op-siguiente', raiz).disabled = true;
        llamar('apiLineasVistaOperativa', tipo, {
          q: consulta.q, grupo: consulta.grupo, pagina: consulta.pagina, porPagina: POR_PAGINA,
        }).then((r) => {
          if (!vigente()) return;
          ultima = r;
          $('#ln-op-thead', raiz).innerHTML = '<tr>' + r.encabezados.map((h) => '<th>' + esc(h) + '</th>').join('') + '</tr>';
          tbody.innerHTML = r.filas.length
            ? r.filas.map((f) => '<tr>' + r.encabezados.map((h) => '<td class="' + (/FOLIO|NUCO|IMEI|SIM|NUMERO|L[IÍ]NEA/i.test(h) ? 'ln-mono' : '') + '">' + valor(f[h]) + '</td>').join('') + '</tr>').join('')
            : '<tr><td colspan="' + Math.max(1, r.encabezados.length) + '" class="empty-state">Sin resultados</td></tr>';

          const selector = $('#ln-op-grupo', raiz);
          selector.innerHTML = '<option value="">' + esc(cfg.filtro) + '</option>' + r.grupos.map((g) =>
            '<option value="' + esc(g.nombre) + '"' + (g.nombre === consulta.grupo ? ' selected' : '') + '>' + esc(g.nombre) + ' (' + miles(g.total) + ')</option>').join('');
          $('#ln-op-total', raiz).textContent = miles(r.totalSinFiltro);
          $('#ln-op-resultados', raiz).textContent = miles(r.total);
          $('#ln-op-conteo', raiz).textContent = r.total ? miles(r.total) + ' registro(s)' : 'Sin registros';
          $('#ln-op-pagina', raiz).textContent = 'Página ' + (r.pagina + 1) + ' de ' + miles(r.paginas);
          $('#ln-op-anterior', raiz).disabled = r.pagina === 0;
          $('#ln-op-siguiente', raiz).disabled = r.pagina >= r.paginas - 1;
        }).catch((e) => {
          if (!vigente()) return;
          tbody.innerHTML = '<tr><td class="empty-state">No se pudieron cargar los datos</td></tr>';
          const box = $('#ln-op-error', raiz);
          box.textContent = 'No se pudo cargar ' + cfg.titulo + ': ' + mensajeError(e);
          box.hidden = false;
        });
      }

      $('#ln-op-form', raiz).addEventListener('submit', (ev) => {
        ev.preventDefault();
        consulta.q = $('#ln-op-q', raiz).value.trim();
        consulta.grupo = $('#ln-op-grupo', raiz).value;
        consulta.pagina = 0;
        cargar();
      });
      $('#ln-op-grupo', raiz).addEventListener('change', (ev) => {
        consulta.grupo = ev.target.value;
        consulta.pagina = 0;
        cargar();
      });
      $('#ln-op-limpiar', raiz).addEventListener('click', () => {
        $('#ln-op-q', raiz).value = '';
        consulta.q = '';
        consulta.grupo = '';
        consulta.pagina = 0;
        cargar();
      });
      $('#ln-op-anterior', raiz).addEventListener('click', () => { consulta.pagina--; cargar(); });
      $('#ln-op-siguiente', raiz).addEventListener('click', () => { consulta.pagina++; cargar(); });
      $('#ln-op-exportar', raiz).addEventListener('click', () => {
        if (ultima && ultima.filas.length) exportarCsv(cfg.csv, ultima.encabezados, ultima.filas);
      });
      $('#ln-op-nuevo', raiz).addEventListener('click', abrirAlta);
      $('#ln-op-cerrar').addEventListener('click', cerrarAlta);
      $('#ln-op-cancelar').addEventListener('click', cerrarAlta);
      modal.addEventListener('click', (ev) => { if (ev.target === modal) cerrarAlta(); });
      $('#ln-op-alta-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const datos = {};
        cfg.campos.forEach(([nombre, , tipoCampo]) => {
          const control = ev.currentTarget.elements.namedItem(nombre);
          datos[nombre] = tipoCampo === 'checkbox' ? control.checked : control.value.trim();
        });
        const guardar = $('#ln-op-guardar');
        guardar.disabled = true;
        $('#ln-op-alta-error').hidden = true;
        llamar('apiLineasCrearVistaOperativa', tipo, datos).then((r) => {
          if (!vigente()) return;
          cerrarAlta();
          consulta.pagina = 0;
          aviso('Registro ' + r.folio + ' guardado correctamente.', 'exito');
          cargar();
        }).catch((e) => {
          const box = $('#ln-op-alta-error');
          box.textContent = mensajeError(e);
          box.hidden = false;
        }).finally(() => { guardar.disabled = false; });
      });
      if (cfg.campos) {
        cargarPermisos().then((p) => { if (vigente()) $('#ln-op-nuevo', raiz).hidden = !p.puedeOperar; });
      }
      cargar();
    }

    const BITACORAS = {
      CAMBIOS: {
        titulo: 'Control de Cambios - Líneas', icono: 'file-pen-line', csv: 'control de cambios lineas',
        subtitulo: 'Bitácora de campos modificados en LINEAS TELEFONICAS (AppSheet y nuevo sistema)',
        idRegistro: 'ID_LINEA',
