<script>
  /**
   * lineas.js — vistas del módulo de Líneas (grupo "Líneas" del menú).
   * Todo vive dentro del namespace `Lineas` para no chocar con el resto de app.js.
   * Usa los globales del shell: callServer(), state.token y navegarA().
   *
   *   Lineas.initTelefonicas()     Líneas Telefónicas: inventario, ficha, inspecciones e historial
   *   Lineas.initCambios()         Control de Cambios - Líneas (CAMBIOS LINEAS TELEFONICAS)
   *   Lineas.initReasignaciones()  Control de Reasignaciones - Líneas (HISTORIAL_REASIGNACIONES)
   *   Lineas.initDesechos()        Bitácora de Desechos (BITACORA DE DESECHO)
   */
  const Lineas = (function () {
    'use strict';

    // ---------------- Utilidades ----------------
    const $ = (sel, raiz) => (raiz || document).querySelector(sel);
    const esc = (v) => {
      if (v === null || v === undefined || v === '') return '';
      return String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    };
    const vacio = '<span class="ln-tenue">—</span>';
    const guion = (v) => (v === null || v === undefined || v === '' ? vacio : esc(v));
    const fecha = (iso) => {
      if (!iso) return null;
      const d = new Date(iso);
      return isNaN(d) ? null : d.toLocaleDateString('es-MX', { year: 'numeric', month: 'short', day: '2-digit' });
    };
    const fechaHora = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? '' : d.toLocaleString('es-MX', { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    };
    const normal = (s) => String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const porcentaje = (v) => {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Math.round(n > 1 ? n : n * 100) + '%';
    };
    const miles = (n) => Number(n || 0).toLocaleString('es-MX');
    /** Ícono de Lucide (lucide.dev/icons) como SVG en línea: icono('smartphone'). */
    function icono(nombre, clase) {
      const nombrePascal = String(nombre).replace(/(^|-)([a-z0-9])/g, (m, sep, c) => c.toUpperCase());
      const nodos = window.lucide && window.lucide.icons && window.lucide.icons[nombrePascal];
      if (!nodos) return '';
      const svg = window.lucide.createElement(nodos);
      svg.setAttribute('class', 'ln-icon ' + (clase || ''));
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      return svg.outerHTML;
    }
    /** Rellena los <span data-ln-icon="nombre"> de las plantillas. */
    function pintarIconos(raiz) {
      raiz.querySelectorAll('[data-ln-icon]').forEach((el) => { el.innerHTML = icono(el.dataset.lnIcon); });
    }
    const enlaceDrive = (id, texto, esArchivo) => {
      if (!id) return '';
      const url = esArchivo ? 'https:\/\/drive.google.com/file/d/' + esc(id) + '/view' : 'https:\/\/drive.google.com/drive/folders/' + esc(id);
      return '<a class="ln-enlace ln-accion-enlace" target="_blank" rel="noopener" href="' + url + '">' + icono(esArchivo ? 'file-text' : 'folder-open') + ' ' + esc(texto) + ' ' + icono('external-link', 'ln-icon-sm') + '</a>';
    };

    function llamar(fn, ...args) {
      return callServer(fn, state.token, ...args);
    }

    const COLOR_ESTATUS = {
      'USO': 'verde', 'EN USO': 'verde', 'RENOVADA': 'verde',
      'RESGUARDO': 'azul', 'EN ENVIO': 'azul', 'ESPERA DE RESPONSIVA': 'azul', 'ESPERA DE EQUIPO': 'azul',
      'SUSPENDIDA': 'ambar', 'POSIBLE VENTA': 'ambar', 'VENTA': 'ambar', 'USO TEMPORAL': 'ambar', 'SIN LINEA': 'ambar', 'EN PROCESO DE CANCELACION': 'ambar',
      'EXTRAVIADO': 'rojo', 'ROBO': 'rojo', 'ROBADO': 'rojo', 'CANCELADA': 'rojo', 'CANCELADO': 'rojo', 'DESECHO': 'rojo', 'DESECHADO': 'rojo', 'BLOQUEADO': 'rojo',
    };
    const chip = (estatus, clase) => {
      if (!estatus) return vacio;
      return '<span class="ln-chip ' + (clase || COLOR_ESTATUS[String(estatus).toUpperCase()] || '') + '">' + esc(estatus) + '</span>';
    };
    const TIPO_EQUIPO = { CELULAR: 'Celular', CELULAR_BASICO: 'Celular básico', MODEM: 'Módem', BANDA_ANCHA: 'Banda ancha', CAMARA: 'Cámara' };
    const ORIGEN = {
      DRIVE: '<span class="ln-chip">Solo Drive</span>',
      SISTEMA: '<span class="ln-chip verde">Nuevo sistema</span>',
      APPSHEET: '<span class="ln-chip azul">AppSheet</span>',
    };

    /** Descarga un CSV (UTF-8 con BOM para que Excel respete acentos). */
    function exportarCsv(nombre, columnas, filas, titulos) {
      const celda = (v) => {
        if (v === null || v === undefined) return '';
        const s = String(v);
        return /[",\n;]/.test(s) || /^\d{11,}$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const texto = '\uFEFF' + [(titulos || columnas).map(celda).join(',')]
        .concat(filas.map((r) => columnas.map((c) => celda(r[c])).join(','))).join('\n');
      const url = URL.createObjectURL(new Blob([texto], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = nombre + ' ' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    }

    // ---------------- Tablas y KPIs con los componentes del sistema (rama jorge) ----------------
    /** Ícono con la clase .ico del sistema, para HTML que se repinta (tablas, KPIs, títulos). */
    const ico = (nombre) => (typeof Iconos !== 'undefined' ? Iconos.svg(nombre) : icono(nombre));

    /** Fecha como la muestra DataTable (dd/mm/aaaa) y con hora solo si la trae. */
    function fechaTabla(v) {
      if (v === null || v === undefined || v === '') return '';
      const d = v instanceof Date ? v : new Date(v);
      if (isNaN(d)) return String(v);
      const dos = (x) => String(x).padStart(2, '0');
      const dia = dos(d.getDate()) + '/' + dos(d.getMonth() + 1) + '/' + d.getFullYear();
      return d.getHours() || d.getMinutes() ? dia + ' ' + dos(d.getHours()) + ':' + dos(d.getMinutes()) : dia;
    }
    const esFechaIso = (v) => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v);
    const esBooleano = (v) => v === true || v === false || /^(TRUE|FALSE)$/i.test(String(v));
    const booleano = (v) => (v === '' || v === null || v === undefined ? '' : (v === true || String(v).toUpperCase() === 'TRUE' ? 'Sí' : 'No'));

    let tiposTablaListos = false;
    /** DataTable con los valores por omisión del módulo (el tipo lnFechaHora ordena por fecha y hora). */
    function tablaLineas(contenedor, config) {
      if (!tiposTablaListos) {
        tiposTablaListos = true;
        DataTable.registrarTipo('lnFechaHora', {
          hereda: 'fecha',
          formatear: fechaTabla,
          claveOrden: (v) => {
            const d = v instanceof Date ? v : new Date(v);
            return v === '' || v === null || v === undefined || isNaN(d) ? null : d.getTime();
          },
        });
      }
      return DataTable.crear(contenedor, Object.assign({ tamanoPagina: 50, seleccionable: true }, config));
    }

    /**
     * Columnas de DataTable a partir de los encabezados de una hoja del AppSheet: las de `visibles`
     * se muestran en ese orden y las demás quedan ocultas (se activan desde "Columnas" y salen en
     * el panel de detalle y en el Excel). Detecta fechas y casillas por su contenido.
     */
    /** Encabezado comparable: mayúsculas, sin acentos y con un solo espacio. */
    const normEncabezado = (h) => String(h || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();

    /** "FECHA DE REGISTRO" → "Fecha de registro"; siglas cortas (NUCO, IMEI, SIM) se quedan igual. */
    const tituloLegible = (h) => {
      const t = String(h || '').trim();
      return t.length <= 5 && !/\s/.test(t) ? t : t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
    };

    function columnasDeHoja(encabezados, filas, visibles, titulos) {
      const orden = (visibles || []).map(normEncabezado);
      const norm = normEncabezado;
      const muestra = filas.slice(0, 300);
      const ordenados = encabezados.slice().sort((a, b) => {
        const ia = orden.indexOf(norm(a));
        const ib = orden.indexOf(norm(b));
        return (ia < 0 ? 1e6 : ia) - (ib < 0 ? 1e6 : ib);
      });
      return ordenados.map((h, i) => {
        const valores = muestra.map((f) => f[h]).filter((v) => v !== '' && v !== null && v !== undefined);
        const col = { campo: h, titulo: (titulos && titulos[norm(h)]) || tituloLegible(h), tipo: 'texto', visible: orden.indexOf(norm(h)) >= 0 };
        // Fecha si todo es fecha, o si el encabezado lo dice y casi todo lo es (AppSheet mezcla "N/A" y texto)
        const fechas = valores.filter(esFechaIso).length;
        if (valores.length && (fechas === valores.length || (/FECHA/.test(norm(h)) && fechas >= valores.length * 0.8))) col.tipo = 'lnFechaHora';
        else if (/^FOLIO$/.test(norm(h)) && valores.length && valores.every((v) => /^\d+$/.test(String(v).trim()))) col.tipo = 'numero';
        else if (valores.length && valores.every(esBooleano)) { col.tipo = 'lista'; col.valor = (f) => booleano(f[h]); }
        else if (/ESTATUS|ESTADO|COMPA[ÑN]IA|^TIPO|SEDE|DEPARTAMENTO|MOTIVO|LUGAR|CAMPO$/.test(norm(h))) col.tipo = 'lista';
        if (/ESTATUS|ESTADO/.test(norm(h))) col.render = (v) => chip(v);
        if (i === 0 && col.visible) col.fijada = true;
        return col;
      });
    }

    /**
     * KPIs (stat-tile de la rama jorge) que filtran la tabla con un clic, como en Vehículos o Uber.
     * defs: [{ icono, etiqueta, valor, clase, titulo, filtros }]. `filtros: { campo: filtro }` usa el
     * formato de DataTable.setFiltro; sin `filtros` el tile es "Total" (quita los de los KPIs);
     * `filtros: false` lo deja solo informativo. Otro clic sobre el activo quita su filtro.
     * Regresa marcar(filtros) para llamarlo desde `alCambiarFiltros`.
     */
    function tilesKpi(contenedor, defs, obtenerTabla) {
      const campos = defs.reduce((lista, d) => lista.concat(Object.keys(d.filtros || {})), [])
        .filter((c, i, lista) => lista.indexOf(c) === i);
      contenedor.innerHTML = defs.map((d, i) => {
        const clic = d.filtros !== false;
        return '<div class="stat-tile ' + (d.clase || '') + (clic ? ' stat-tile-clickable' : '') + '" data-kpi="' + i + '"' +
          (clic ? ' role="button" tabindex="0"' : '') + (d.titulo ? ' title="' + esc(d.titulo) + '"' : '') + '>' +
          '<div class="stat-icon">' + ico(d.icono) + '</div><div><div class="stat-value">' + esc(d.valor) + '</div>' +
          '<div class="stat-label">' + esc(d.etiqueta) + '</div></div></div>';
      }).join('');
      const tiles = Array.from(contenedor.querySelectorAll('[data-kpi]'));
      const igual = (a, b) => JSON.stringify(a || null) === JSON.stringify(b || null);
      const activo = (d, filtros) => d.filtros !== false && campos.every((c) => igual(filtros[c], (d.filtros || {})[c]));
      function marcar(filtros) {
        tiles.forEach((t) => t.classList.toggle('stat-tile-activo', activo(defs[Number(t.dataset.kpi)], filtros || {})));
      }
      function clic(t) {
        const d = defs[Number(t.dataset.kpi)];
        if (d.filtros === false) return;
        const tabla = obtenerTabla();
        if (!tabla) return;
        const quitar = !!d.filtros && t.classList.contains('stat-tile-activo');
        campos.forEach((c) => tabla.setFiltro(c, quitar ? null : ((d.filtros || {})[c] || null)));
      }
      tiles.forEach((t) => {
        t.addEventListener('click', () => clic(t));
        t.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); clic(t); } });
      });
      return marcar;
    }

    /** Días atrás como "yyyy-mm-dd" local (formato de los filtros de fecha de DataTable). */
    function diaClave(diasAtras) {
      const f = new Date();
      f.setDate(f.getDate() - (diasAtras || 0));
      return [f.getFullYear(), String(f.getMonth() + 1).padStart(2, '0'), String(f.getDate()).padStart(2, '0')].join('-');
    }
    function contarDesde(filas, campo, diasAtras) {
      const desde = diaClave(diasAtras);
      return filas.filter((f) => {
        if (!f[campo]) return false;
        const d = new Date(f[campo]);
        if (isNaN(d)) return false;
        const clave = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
        return clave >= desde;
      }).length;
    }

    /** Redimensiona una imagen en el navegador antes de subirla (máx. `maxDim` px, JPEG calidad .82). */
    function redimensionarImagen(archivo, maxDim) {
      return new Promise((resolve, reject) => {
        const lector = new FileReader();
        lector.onerror = () => reject(new Error('No se pudo leer el archivo.'));
        lector.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Archivo de imagen inválido.'));
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              const factor = maxDim / Math.max(w, h);
              w = Math.round(w * factor); h = Math.round(h * factor);
            }
            const lienzo = document.createElement('canvas');
            lienzo.width = w; lienzo.height = h;
            lienzo.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mime: 'image/jpeg', base64: lienzo.toDataURL('image/jpeg', 0.82).split(',')[1] });
          };
          img.src = lector.result;
        };
        lector.readAsDataURL(archivo);
      });
    }

    /**
     * Aviso flotante. Usa Notificar (toasts del sistema); el HTML se reduce a texto y los
     * que traen el ícono de alerta salen como error. Sin Notificar, cae al aviso propio.
     */
    function aviso(html, duracion) {
      if (typeof Notificar !== 'undefined') {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        const texto = tmp.textContent.trim();
        if (/ln-alerta/.test(html)) Notificar.error(texto, duracion ? { duracion: duracion } : undefined);
        else Notificar.exito(texto, duracion ? { duracion: duracion } : undefined);
        return;
      }
      let caja = document.getElementById('ln-avisos');
      if (!caja) {
        caja = document.createElement('div');
        caja.id = 'ln-avisos';
        document.body.appendChild(caja);
      }
      const item = document.createElement('div');
      item.className = 'ln-aviso';
      item.innerHTML = '<div>' + html + '</div><button type="button" class="modal-close" aria-label="Cerrar">' + icono('x') + '</button>';
      item.querySelector('button').addEventListener('click', () => item.remove());
      caja.appendChild(item);
      if (duracion) setTimeout(() => item.remove(), duracion);
    }
    const mensajeError = (e) => esc(e && e.message ? e.message : e);

    // ---------------- Estado del módulo ----------------
    // Se conserva entre navegaciones para evitar volver a pedir los mismos catálogos.
    const POR_PAGINA = 50;
    const VIGENCIA_INDICE_MS = 15 * 60 * 1000;
    const VIGENCIA_CATALOGO_MS = 15 * 60 * 1000;
    const memoria = {
      indice: null,
      cargadoEn: 0,
      indicePendiente: null,
      permisos: null,
      colaboradores: null,
      colaboradoresCargadosEn: 0,
      colaboradoresPendientes: null,
      accesorios: null,
      accesoriosCargadosEn: 0,
      accesoriosPendientes: null,
      modulo: 'equipos',
      abrirAlEntrar: null, // id de registro a abrir al entrar a Líneas Telefónicas (desde una bitácora)
    };
    let montaje = 0; // cambia en cada init: respuestas tardías de una vista anterior se ignoran

    function filasComoObjetos(ix) {
      return ix.filas.map((f) => {
        const o = {};
        ix.columnas.forEach((c, i) => { o[c] = f[i]; });
        return o;
      });
    }

    function cargarIndice(forzar) {
      if (!forzar && memoria.indice && Date.now() - memoria.cargadoEn < VIGENCIA_INDICE_MS) return Promise.resolve(memoria.indice);
      if (!forzar && memoria.indicePendiente) return memoria.indicePendiente;
      memoria.indicePendiente = llamar('apiLineasIndice').then((r) => {
        const porNuco = (a, b) => {
          const na = Number(a.nuco || a.nucoEquipo);
          const nb = Number(b.nuco || b.nucoEquipo);
          if (isNaN(na) && isNaN(nb)) return 0;
          if (isNaN(na)) return 1;
          if (isNaN(nb)) return -1;
          return na - nb;
        };
        memoria.indice = {
          columnas: { equipos: r.equipos.columnas, lineas: r.lineas.columnas },
          equipos: filasComoObjetos(r.equipos).sort(porNuco),
          lineas: filasComoObjetos(r.lineas).sort(porNuco),
          generadoEn: r.equipos.generadoEn,
        };
        memoria.cargadoEn = Date.now();
        return memoria.indice;
      });
      memoria.indicePendiente.then(() => { memoria.indicePendiente = null; }, () => { memoria.indicePendiente = null; });
      return memoria.indicePendiente;
    }

    function cargarPermisos() {
      if (memoria.permisos) return Promise.resolve(memoria.permisos);
      return llamar('apiLineasPermisos').then((p) => (memoria.permisos = p));
    }

    function cargarColaboradores(forzar) {
      if (!forzar && memoria.colaboradores && Date.now() - memoria.colaboradoresCargadosEn < VIGENCIA_CATALOGO_MS) return Promise.resolve(memoria.colaboradores);
      if (!forzar && memoria.colaboradoresPendientes) return memoria.colaboradoresPendientes;
      memoria.colaboradoresPendientes = llamar('apiLineasColaboradores').then((r) => {
        memoria.colaboradores = r;
        memoria.colaboradoresCargadosEn = Date.now();
        return r;
      });
      memoria.colaboradoresPendientes.then(() => { memoria.colaboradoresPendientes = null; }, () => { memoria.colaboradoresPendientes = null; });
      return memoria.colaboradoresPendientes;
    }

    function cargarAccesorios(forzar) {
      if (!forzar && memoria.accesorios && Date.now() - memoria.accesoriosCargadosEn < VIGENCIA_CATALOGO_MS) return Promise.resolve(memoria.accesorios);
      if (!forzar && memoria.accesoriosPendientes) return memoria.accesoriosPendientes;
      memoria.accesoriosPendientes = llamar('apiLineasAccesoriosIndice').then((r) => {
        memoria.accesorios = r;
        memoria.accesoriosCargadosEn = Date.now();
        return r;
      });
      memoria.accesoriosPendientes.then(() => { memoria.accesoriosPendientes = null; }, () => { memoria.accesoriosPendientes = null; });
      return memoria.accesoriosPendientes;
    }

    function precargar() {
      Promise.all([cargarPermisos(), cargarIndice()]).catch(() => {});
    }

    function contarPor(filas, campo) {
      const m = {};
      filas.forEach((f) => { const k = f[campo] || ''; m[k] = (m[k] || 0) + 1; });
      return m;
    }
    const unicos = (filas, campo) => Object.keys(contarPor(filas, campo)).filter(Boolean).sort();

    // ======================================================================
    // Líneas Telefónicas
    // ======================================================================

    /** Columnas del inventario (DataTable). Las ocultas se activan desde "Columnas". */
    const TABLAS_INVENTARIO = {
      equipos: {
        detalle: 'equipo', nombreArchivo: 'Equipos telefonicos', textoVacio: 'Sin equipos',
        etiqueta: (r) => 'NUCO ' + (r.nuco || '—') + (r.modelo ? ' · ' + r.modelo : ''),
        columnas: [
          { campo: 'nuco', titulo: 'NUCO', tipo: 'texto', fijada: true, render: (v) => '<span class="ln-mono ln-fuerte">' + guion(v) + '</span>' },
          { campo: 'tipo', titulo: 'Tipo', tipo: 'lista', valor: (r) => TIPO_EQUIPO[r.tipo] || r.tipo || '' },
          { campo: 'modelo', titulo: 'Modelo', tipo: 'texto' },
          { campo: 'imei', titulo: 'IMEI', tipo: 'texto', render: (v) => '<span class="ln-mono">' + guion(v) + '</span>' },
          { campo: 'estatus', titulo: 'Estatus', tipo: 'lista', render: (v) => chip(v) },
          { campo: 'numero', titulo: 'Línea', tipo: 'texto', render: (v) => (v ? '<span class="ln-mono">' + esc(v) + '</span>' : '<span class="ln-tenue">Sin línea</span>') },
          { campo: 'compania', titulo: 'Compañía', tipo: 'lista', visible: false },
          { campo: 'estatusLinea', titulo: 'Estatus de la línea', tipo: 'lista', visible: false, render: (v) => chip(v) },
          { campo: 'responsable', titulo: 'Responsable', tipo: 'texto' },
          { campo: 'departamento', titulo: 'Departamento', tipo: 'lista' },
          { campo: 'sede', titulo: 'Sede', tipo: 'lista', visible: false },
        ],
      },
      lineas: {
        detalle: 'linea', nombreArchivo: 'Lineas telefonicas', textoVacio: 'Sin líneas',
        etiqueta: (r) => 'Línea ' + (r.numero || '—'),
        columnas: [
          { campo: 'numero', titulo: 'Número', tipo: 'texto', fijada: true, render: (v) => '<span class="ln-mono ln-fuerte">' + guion(v) + '</span>' },
          { campo: 'compania', titulo: 'Compañía', tipo: 'lista' },
          { campo: 'estatus', titulo: 'Estatus', tipo: 'lista', render: (v) => chip(v) },
          { campo: 'suelta', titulo: 'Suelta', tipo: 'lista', valor: (r) => (r.suelta ? 'Sí' : 'No'), render: (v) => (v === 'Sí' ? chip('Suelta', 'ambar') : '<span class="ln-tenue">En equipo</span>') },
          { campo: 'nucoEquipo', titulo: 'Equipo (NUCO)', tipo: 'texto', render: (v) => '<span class="ln-mono">' + guion(v) + '</span>' },
          { campo: 'sim', titulo: 'SIM', tipo: 'texto', render: (v) => '<span class="ln-mono">' + guion(v) + '</span>' },
          { campo: 'responsable', titulo: 'Responsable', tipo: 'texto' },
          { campo: 'departamento', titulo: 'Departamento', tipo: 'lista' },
        ],
      },
    };

    function initTelefonicas() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-telefonicas');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const pila = []; // navegación dentro del detalle: [{ tipo, id }]
      let captura = null; // sesión de captura de inspección/responsiva en curso (null si el modal está cerrado)
      pintarIconos(raiz);
      document.addEventListener('app:before-navigate', () => { if (vigente() && captura) cerrarCaptura(); }, { once: true });

      // ---- Eventos ----
      const tablas = {};
      const filtrosActuales = { equipos: {}, lineas: {} };
      let marcarKpi = null;
      raiz.querySelectorAll('#ln-tabs .tab-btn').forEach((tab) => {
        tab.addEventListener('click', () => mostrarModulo(tab.dataset.tab));
      });
      $('#ln-recargar', raiz).addEventListener('click', (ev) => {
        const b = ev.currentTarget;
        b.disabled = true;
        llamar('apiLineasRecargarDatos')
          .then(() => cargarIndice(true))
          .then(() => { if (vigente()) { pintarIndicadores(); pintarListado(); } })
          .catch((e) => aviso(icono('triangle-alert', 'ln-alerta') + ' ' + mensajeError(e), 12000))
          .then(() => { b.disabled = false; });
      });
      $('#ln-nuevo-registro', raiz).addEventListener('click', () => abrirEditor(null));

      // Clic en filas, enlaces internos y botones del detalle (delegación).
      raiz.addEventListener('click', (ev) => {
        const seccion = ev.target.closest('[data-ln-seccion]');
        if (seccion) {
          const destino = document.getElementById(seccion.dataset.lnSeccion);
          if (destino) { destino.scrollIntoView({ behavior: 'smooth', block: 'start' }); destino.focus({ preventScroll: true }); }
          return;
        }
        const pdfPendiente = ev.target.closest('[data-ln-pdf]');
        if (pdfPendiente) {
          ev.preventDefault();
          captura = { guardada: true, firmas: {}, carpetaId: pdfPendiente.dataset.carpeta };
          $('#ln-modal-captura', raiz).hidden = false;
          $('#ln-captura-titulo', raiz).textContent = 'Generar PDF pendiente';
          refrescarDespuesDeCaptura(pila[pila.length - 1].id, pdfPendiente.dataset.lnPdf, pdfPendiente.dataset.id);
          return;
        }
        if (ev.target.closest('a[target="_blank"]')) return;
        const ir = ev.target.closest('[data-ln-ir]');
        if (ir) {
          ev.preventDefault();
          abrir(ir.dataset.lnIr, ir.dataset.id);
          return;
        }
        if (ev.target.closest('[data-ln-volver]')) { ev.preventDefault(); volver(); return; }
        if (ev.target.closest('[data-ln-lista]')) { ev.preventDefault(); cerrarDetalle(); return; }
        const miga = ev.target.closest('[data-ln-miga]');
        if (miga) {
          ev.preventDefault();
          const indice = Number(miga.dataset.lnMiga);
          const destino = pila[indice];
          if (destino) { pila.splice(indice + 1); abrir(destino.tipo, destino.id, true); }
          return;
        }
        const btnCaptura = ev.target.closest('[data-ln-captura]');
        if (btnCaptura) {
          ev.preventDefault();
          const ref = btnCaptura.dataset.equipoId ? { equipoId: btnCaptura.dataset.equipoId } : { lineaId: btnCaptura.dataset.lineaId };
          abrirCaptura(btnCaptura.dataset.lnCaptura, ref);
          return;
        }
        const btnEditar = ev.target.closest('[data-ln-editar]');
        if (btnEditar) { ev.preventDefault(); abrirEditor(btnEditar.dataset.lnEditar); return; }
        const pastilla = ev.target.closest('.ln-pastilla');
        if (pastilla) {
          pastilla.parentElement.querySelectorAll('.ln-pastilla').forEach((b) => b.classList.remove('activa'));
          pastilla.classList.add('activa');
          actualizarProgresoChecklist();
          return;
        }
        const limpiarFirma = ev.target.closest('[data-limpiar-firma]');
        if (limpiarFirma) {
          if (captura && captura.firmas[limpiarFirma.dataset.limpiarFirma]) captura.firmas[limpiarFirma.dataset.limpiarFirma].limpiar();
          return;
        }
        const quitarFoto = ev.target.closest('[data-quitar-foto]');
        if (quitarFoto) {
          if (captura) captura.fotos = captura.fotos.filter((f) => f.id !== quitarFoto.dataset.quitarFoto);
          quitarFoto.closest('.ln-foto-chip').remove();
          return;
        }
      });
      raiz.addEventListener('keydown', (ev) => {
        if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][tabindex="0"]')) {
          ev.preventDefault();
          ev.target.click();
        }
        if (ev.key === 'Escape' && !$('#ln-modal-captura', raiz).hidden) cerrarCaptura();
      });
      $('#ln-modal-captura', raiz).addEventListener('click', (ev) => {
        if (ev.target.id === 'ln-modal-captura' || ev.target.closest('[data-cerrar-modal]')) cerrarCaptura();
      });

      // ---- Carga inicial ----
      mostrarModulo(memoria.modulo, true);
      crearTabla(memoria.modulo).setCargando(true);
      Promise.all([cargarPermisos(), cargarIndice()]).then(([permisos]) => {
        if (!vigente()) return;
        $('#ln-recargar', raiz).hidden = !permisos.esAdmin;
        pintarIndicadores();
        pintarListado();
        if (memoria.abrirAlEntrar) {
          const id = memoria.abrirAlEntrar;
          memoria.abrirAlEntrar = null;
          abrirRegistro(id);
        }
      }).catch((e) => {
        if (!vigente()) return;
        crearTabla(memoria.modulo).setError('No se pudo cargar el inventario: ' + (e.message || e));
      });

      // ---- Indicadores (clic = filtrar, como en los módulos de la rama jorge) ----
      function pintarIndicadores() {
        const ix = memoria.indice;
        const eq = ix.equipos;
        const li = ix.lineas;
        const defs = [
          { icono: 'smartphone', valor: miles(eq.length), etiqueta: 'Equipos', modulo: 'equipos', filtros: {} },
          { icono: 'circle-check', valor: miles(eq.filter((e) => e.estatus === 'USO').length), etiqueta: 'Equipos en uso', clase: 'stat-tile-ok', modulo: 'equipos', filtros: { estatus: { valores: ['USO'] } } },
          { icono: 'unplug', valor: miles(eq.filter((e) => !e.lineaId).length), etiqueta: 'Equipos sin línea', modulo: 'equipos', filtros: { numero: { op: 'vacio' } } },
          { icono: 'card-sim', valor: miles(li.length), etiqueta: 'Líneas', modulo: 'lineas', filtros: {} },
          { icono: 'unlink', valor: miles(li.filter((l) => l.suelta).length), etiqueta: 'Líneas sueltas', clase: 'stat-tile-warn', modulo: 'lineas', filtros: { suelta: { valores: ['Sí'] } } },
        ];
        const cont = $('#ln-indicadores', raiz);
        cont.innerHTML = defs.map((d, i) => '<div class="stat-tile stat-tile-clickable ' + (d.clase || '') + '" data-kpi="' + i + '" role="button" tabindex="0">' +
          '<div class="stat-icon">' + ico(d.icono) + '</div><div><div class="stat-value">' + d.valor + '</div><div class="stat-label">' + esc(d.etiqueta) + '</div></div></div>').join('');
        const campos = { equipos: ['estatus', 'numero'], lineas: ['suelta'] };
        const igual = (x, y) => JSON.stringify(x || null) === JSON.stringify(y || null);
        marcarKpi = () => {
          cont.querySelectorAll('[data-kpi]').forEach((t) => {
            const d = defs[Number(t.dataset.kpi)];
            const f = filtrosActuales[d.modulo] || {};
            t.classList.toggle('stat-tile-activo', memoria.modulo === d.modulo && campos[d.modulo].every((c) => igual(f[c], d.filtros[c])));
          });
        };
        const clic = (t) => {
          const d = defs[Number(t.dataset.kpi)];
          const quitar = t.classList.contains('stat-tile-activo') && Object.keys(d.filtros).length > 0;
          mostrarModulo(d.modulo);
          const tabla = crearTabla(d.modulo);
          campos[d.modulo].forEach((c) => tabla.setFiltro(c, quitar ? null : (d.filtros[c] || null)));
          marcarKpi();
        };
        cont.querySelectorAll('[data-kpi]').forEach((t) => {
          t.addEventListener('click', () => clic(t));
          t.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); clic(t); } });
        });
        marcarKpi();
        $('#ln-num-equipos', raiz).textContent = miles(eq.length);
        $('#ln-num-lineas', raiz).textContent = miles(li.length);
      }

      // ---- Listado: una DataTable por pestaña (se crea al mostrarla) ----
      function crearTabla(modulo) {
        if (tablas[modulo]) return tablas[modulo];
        const cfg = TABLAS_INVENTARIO[modulo];
        const contenedor = $('#ln-tabla-' + modulo, raiz);
        tablas[modulo] = tablaLineas(contenedor, {
          idCampo: 'id',
          idTabla: 'lineas-' + modulo,
          columnas: cfg.columnas,
          textoVacio: cfg.textoVacio,
          exportar: { nombreArchivo: cfg.nombreArchivo },
          etiquetaFila: cfg.etiqueta,
          detalle: false, // la ficha completa (responsable, evidencias, historial) es su propia pantalla
          accionesFila: [{ icono: 'eye', titulo: 'Ver ficha', alHacer: (r) => abrir(cfg.detalle, r.id) }],
          ayuda: 'Doble clic en una fila (o el ojo en Acciones) abre su ficha. La flecha de cada columna filtra, ordena, fija u oculta; ' +
            '"Columnas" agrega compañía, sede y otros datos. Los indicadores de arriba filtran con un clic.',
          alCambiarFiltros: (filtros) => { filtrosActuales[modulo] = filtros || {}; if (marcarKpi) marcarKpi(); },
        });
        // Doble clic en la fila = abrir la ficha (DataTable no trae clic de fila propio)
        contenedor.addEventListener('dblclick', (ev) => {
          const tr = ev.target.closest('tbody tr[data-id]');
          if (tr && !ev.target.closest('button, input, a')) abrir(cfg.detalle, tr.dataset.id);
        });
        if (memoria.indice) tablas[modulo].setDatos(memoria.indice[modulo]);
        return tablas[modulo];
      }

      function mostrarModulo(modulo, sinTabla) {
        memoria.modulo = modulo;
        raiz.querySelectorAll('#ln-tabs .tab-btn').forEach((t) => t.classList.toggle('active', t.dataset.tab === modulo));
        raiz.querySelectorAll('#ln-listado .tab-panel').forEach((p) => { p.hidden = p.dataset.tabPanel !== modulo; });
        if (sinTabla) return;
        crearTabla(modulo).ajustarAlto();
        if (marcarKpi) marcarKpi();
      }

      function pintarListado() {
        if (!memoria.indice) return;
        Object.keys(tablas).forEach((m) => tablas[m].setDatos(memoria.indice[m]));
        mostrarModulo(memoria.modulo);
        $('#ln-conteo', raiz).textContent = 'Datos de la hoja al ' + fechaHora(memoria.indice.generadoEn) + '.';
      }

      // ---- Detalle ----
      function abrir(tipo, id, sinApilar) {
        if (!sinApilar) {
          const existente = pila.findIndex((p) => p.tipo === tipo && p.id === id);
          if (existente >= 0) pila.splice(existente + 1);
          else pila.push({ tipo: tipo, id: id, etiqueta: tipo === 'inspeccion' ? 'Inspección' : null });
        }
        $('#ln-listado', raiz).hidden = true;
        const detalle = $('#ln-detalle', raiz);
        detalle.hidden = false;
        detalle.innerHTML = migas() + '<div class="card ln-cargando"><span class="ln-spinner"></span> Cargando…</div>';
        document.getElementById('view-container').scrollTop = 0;
        window.scrollTo(0, 0);
        const pintar = { equipo: pintarEquipo, linea: pintarLinea, inspeccion: pintarInspeccion }[tipo];
        pintar(detalle, id).catch((e) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== tipo || pila[pila.length - 1].id !== id) return;
          detalle.innerHTML = migas() + '<div class="card"><p class="error-msg">No se pudo cargar: ' + mensajeError(e) + '</p></div>';
        });
      }

      /** Abre un registro sabiendo solo su ID (equipo si existe como equipo; si no, línea). */
      function abrirRegistro(id) {
        const esEquipo = memoria.indice.equipos.some((e) => e.id === id);
        abrir(esEquipo ? 'equipo' : 'linea', id);
      }

      function volver() {
        pila.pop();
        const anterior = pila[pila.length - 1];
        if (anterior) abrir(anterior.tipo, anterior.id, true);
        else cerrarDetalle();
      }

      function cerrarDetalle() {
        pila.length = 0;
        $('#ln-detalle', raiz).hidden = true;
        $('#ln-detalle', raiz).innerHTML = '';
        $('#ln-listado', raiz).hidden = false;
        // Refleja altas y ediciones hechas desde la ficha (el índice ya se recargó al guardar)
        if (memoria.indice) { pintarIndicadores(); pintarListado(); }
      }

      function migas() {
        const etiquetas = { equipo: 'Equipo', linea: 'Línea', inspeccion: 'Inspección' };
        return '<div class="ln-migas"><button type="button" class="secondary ln-btn-icono" data-ln-volver>' + icono('chevron-left') + ' Volver</button>' +
          '<span><a href="#" class="ln-enlace" data-ln-lista>Líneas Telefónicas</a>' +
          pila.map((p, i) => ' ' + icono('chevron-right', 'ln-icon-sm') + ' ' +
            (i < pila.length - 1 ? '<button type="button" class="ln-miga-enlace" data-ln-miga="' + i + '">' + esc(p.etiqueta || etiquetas[p.tipo]) + '</button>' :
              '<span aria-current="page">' + esc(p.etiqueta || etiquetas[p.tipo]) + '</span>')).join('') + '</span></div>';
      }

      function campos(pares) {
        return '<dl class="ln-campos">' + pares.filter(Boolean).map((p) =>
          '<dt>' + esc(p[0]) + '</dt><dd>' + (p[2] ? (p[1] || vacio) : guion(p[1])) + '</dd>').join('') + '</dl>';
      }

      function tarjeta(titulo, cuerpo, clase) {
        return '<div class="card ln-card ' + (clase || '') + '"><h3>' + titulo + '</h3>' + cuerpo + '</div>';
      }

      function tarjetaResponsable(r, titulo) {
        r = r || {};
        const adicionales = (r.usuariosAdicionales || []).length
          ? '<div class="ln-subtitulo">Usuarios adicionales</div>' + campos(r.usuariosAdicionales.map((u) => [u.rol, esc(u.nombre) + (u.puesto ? ' <span class="ln-tenue">· ' + esc(u.puesto) + '</span>' : ''), true]))
          : '';
        return tarjeta(icono('user') + ' ' + esc(titulo || 'Responsable'), campos([
          ['Nombre', (r.nombres && r.nombres.length > 1) ? r.nombres.map(esc).join('<br>') : esc(r.nombre || ''), true],
          r.codigoResguardo ? ['Código de resguardo', r.codigoResguardo] : null,
          ['No. empleado', r.noEmpleado],
          ['Puesto', r.puesto],
          ['Departamento', r.departamento],
          ['Área', r.area],
          ['Sede', r.sede],
          ['Oficina / desarrollo', r.oficina],
          ['Jefe directo', r.jefeDirecto],
          ['Director', r.director],
          ['Razón social', r.razonSocial],
        ]) + adicionales);
      }

      function tarjetaRegistro(l) {
        l = l || {};
        return tarjeta(icono('file-spreadsheet') + ' Registro en la hoja', campos([
          ['ID', l.id], ['Folio', l.folio], ['Tipo', l.tipo], ['Fila en hoja', l.fila],
          ['Estatus general', chip(l.estatusGeneral), true], ['Fecha registro', fecha(l.fechaRegistro)], ['Última inspección', fecha(l.fechaInspeccion)],
          ['Comentarios', l.comentarios],
        ]));
      }

      function encabezado(ico, titulo, chips, botones) {
        return '<div class="ln-detalle-header card">' +
          '<div class="ln-detalle-icono">' + icono(ico) + '</div>' +
          '<div class="ln-detalle-titulo"><h2>' + titulo + '</h2><div class="ln-chips">' + chips + '</div></div>' +
          '<div class="ln-detalle-botones">' + (botones || '') + '</div></div>';
      }

      function pintarEquipo(detalle, id) {
        return llamar('apiLineasEquipo', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'equipo' || pila[pila.length - 1].id !== id) return;
          const e = r.equipo;
          const l = r.linea;
          const costo = l && l.costoPlan !== null && l.costoPlan !== undefined ? '$' + Number(l.costoPlan).toLocaleString('es-MX') : null;
          const puedeOperar = memoria.permisos && memoria.permisos.puedeOperar;
          pila[pila.length - 1].etiqueta = 'NUCO ' + (e.nuco || '—');
          detalle.innerHTML = migas() +
            encabezado('smartphone', 'NUCO ' + esc(e.nuco || '—'),
              chip(e.estatus) + chip(TIPO_EQUIPO[e.tipo] || e.tipo, 'neutro') + (l ? chip('Con línea', 'verde') : chip('Sin línea', 'ambar')),
              (puedeOperar ? '<button type="button" class="secondary ln-btn-icono" data-ln-editar="' + esc(id) + '">' + icono('pencil') + ' Editar información</button>' +
                '<button type="button" class="secondary ln-btn-icono" data-ln-captura="INSPECCION" data-equipo-id="' + esc(id) + '">' + icono('clipboard-check') + ' Nueva inspección</button>' +
                '<button type="button" class="secondary ln-btn-icono" data-ln-captura="RESPONSIVA" data-equipo-id="' + esc(id) + '">' + icono('signature') + ' Nueva responsiva</button>' : '') +
              (e.carpetaDriveId ? enlaceDrive(e.carpetaDriveId, 'Carpeta en Drive') : '')) +
            (e._secretosVisibles ? '' : '<div class="ln-nota">' + icono('lock') + ' Los PIN, patrones y contraseñas están ocultos para tu rol.</div>') +
            '<div class="ln-grid-2">' +
              tarjeta(icono('smartphone') + ' Equipo', campos([
                ['Modelo', e.modelo], ['IMEI', e.imei], ['Color', e.color], ['Accesorios', (e.accesorios || []).join(', ')],
                e.tipo !== 'MODEM' && e.tipo !== 'BANDA_ANCHA' && e.tipo !== 'CAMARA' ? ['Cuenta Google', e.cuentaGoogle] : null,
                e.tipo === 'CELULAR' || e.tipo === 'CELULAR_BASICO' ? ['PIN equipo', e.pinEquipo] : null,
                e.tipo === 'CELULAR' || e.tipo === 'CELULAR_BASICO' ? ['Patrón', e.patronRuta] : null,
                e.tipo === 'MODEM' || e.tipo === 'BANDA_ANCHA' ? ['Contraseña módem', e.contrasenaModem] : null,
                e.simResidual ? ['SIM residual', chip(e.simResidual, 'ambar'), true] : null,
              ])) +
              tarjeta(icono('card-sim') + ' Línea asignada', l ? campos([
                ['Número', '<a href="#" class="ln-enlace ln-mono ln-accion-enlace" data-ln-ir="linea" data-id="' + esc(l._id) + '">' + icono('phone') + ' ' + esc(l.numero || '(sin número)') + ' ' + icono('chevron-right') + '</a>', true],
                ['Compañía', l.compania], ['Estatus', chip(l.estatus), true], ['SIM', l.sim], ['PIN WhatsApp', l.pinWhatsapp],
                ['Costo plan', costo], ['Plan', [fecha(l.inicioPlan), fecha(l.finPlan)].filter(Boolean).join(' → ')],
              ]) : '<p class="empty-state">Este equipo no tiene línea asignada.</p>') +
              tarjetaResponsable(e.responsable) +
              tarjetaRegistro(e.legado) +
            '</div>' +
            '<div id="ln-evidencias">' + tarjeta(icono('clipboard-check') + ' Inspecciones y responsivas', '<p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p>') + '</div>' +
            '<div id="ln-historial">' + tarjeta(icono('history') + ' Historial', '<p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p>') + '</div>';
          cargarEvidencias(id);
          cargarHistorial(id);
        });
      }

      function pintarLinea(detalle, id) {
        return llamar('apiLineasLinea', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'linea' || pila[pila.length - 1].id !== id) return;
          const l = r.linea;
          const e = r.equipo;
          const costo = l.costoPlan !== null && l.costoPlan !== undefined ? '$' + Number(l.costoPlan).toLocaleString('es-MX') : null;
          const puedeOperarLinea = !e && memoria.permisos && memoria.permisos.puedeOperar;
          pila[pila.length - 1].etiqueta = e ? 'NUCO ' + (e.nuco || '—') : 'Línea ' + (l.numero || '—');
          detalle.innerHTML = migas() +
            encabezado('card-sim', esc(l.numero || 'Línea sin número'), chip(l.estatus) + (e ? chip('En NUCO ' + (e.nuco || '—'), 'neutro') : chip('Suelta', 'ambar')),
              puedeOperarLinea ? '<button type="button" class="secondary ln-btn-icono" data-ln-editar="' + esc(id) + '">' + icono('pencil') + ' Editar información</button>' +
                '<button type="button" class="secondary ln-btn-icono" data-ln-captura="INSPECCION" data-linea-id="' + esc(id) + '">' + icono('clipboard-check') + ' Nueva inspección</button>' +
                '<button type="button" class="secondary ln-btn-icono" data-ln-captura="RESPONSIVA" data-linea-id="' + esc(id) + '">' + icono('signature') + ' Nueva responsiva</button>' : '') +
            '<div class="ln-grid-2">' +
              tarjeta(icono('card-sim') + ' Línea', campos([
                ['Compañía', l.compania], ['SIM', l.sim], ['PIN WhatsApp', l.pinWhatsapp], ['Razón social', l.razonSocial],
                ['Costo plan', costo], ['Inicio plan', fecha(l.inicioPlan)], ['Fin plan', fecha(l.finPlan)],
                l.usoTemporal ? ['Uso temporal', 'Desde ' + esc(fecha(l.usoTemporal.desde) || '—') + ' · ' + esc(l.usoTemporal.correo || ''), true] : null,
                !e && l.nucoLegado ? ['NUCO (anterior)', l.nucoLegado] : null,
              ])) +
              tarjeta(icono('smartphone') + ' Equipo', e ? campos([
                ['NUCO', '<a href="#" class="ln-enlace ln-mono ln-accion-enlace" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' ' + esc(e.nuco || '—') + ' ' + icono('chevron-right') + '</a>', true],
                ['Tipo', TIPO_EQUIPO[e.tipo] || e.tipo], ['Modelo', e.modelo], ['IMEI', e.imei], ['Estatus', chip(e.estatus), true],
              ]) : '<p class="empty-state">Línea suelta: no está instalada en un equipo de la empresa.</p>') +
              tarjetaResponsable(e ? e.responsable : l.responsable, e ? 'Responsable (del equipo)' : 'Responsable') +
              tarjetaRegistro(l.legado) +
            '</div>' +
            (e ? '' : '<div id="ln-evidencias">' + tarjeta(icono('clipboard-check') + ' Inspecciones y responsivas', '<p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p>') + '</div>') +
            '<div id="ln-historial">' + tarjeta(icono('history') + ' Historial', '<p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p>') + '</div>';
          if (!e) cargarEvidencias(id);
          cargarHistorial(id);
        });
      }

      function cargarEvidencias(id) {
        const pila0 = pila.length;
        llamar('apiLineasEvidencias', id).then((ev) => {
          const cont = $('#ln-evidencias', raiz);
          if (!vigente() || !cont || pila.length !== pila0) return;
          cont.innerHTML = tarjetaEvidencias(ev.inspecciones || [], ev.responsivas || []);
        }).catch((e) => {
          const cont = $('#ln-evidencias', raiz);
          if (cont) cont.innerHTML = tarjeta(icono('clipboard-check') + ' Inspecciones y responsivas', '<p class="error-msg">' + mensajeError(e) + '</p>');
        });
      }

      function accionPdf(d, tipo) {
        if (d.pdfId) return enlaceDrive(d.pdfId, 'Abrir PDF', true);
        return d.pdfPendiente ? '<button type="button" class="secondary ln-btn-icono" data-ln-pdf="' + tipo + '" data-id="' + esc(d.id) + '" data-carpeta="' + esc(d.carpetaId || '') + '">' + icono('file-text') + ' Generar PDF</button>' : vacio;
      }

      function tarjetaEvidencias(inspecciones, responsivas) {
        const tablaInsp = inspecciones.length
          ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>Fecha</th><th>Origen</th><th>Calificación</th><th>Fotos</th><th>Responsable</th><th>Inspector</th><th>Consulta</th><th>Documento</th></tr></thead><tbody>' +
            inspecciones.map((i) => '<tr class="ln-fila-clic" data-ln-ir="inspeccion" data-id="' + esc(i.id) + '"><td>' + guion(fecha(i.fecha)) + '</td><td>' + (ORIGEN[i.origen] || '') + '</td>' +
              '<td>' + guion(porcentaje(i.calificacion)) + '</td><td>' + (i.fotos || '<span class="ln-tenue">0</span>') + '</td>' +
              '<td>' + guion(i.responsable) + '</td><td class="ln-tenue">' + guion(i.inspector) + '</td><td><button type="button" class="secondary ln-btn-icono" data-ln-ir="inspeccion" data-id="' + esc(i.id) + '">' + icono('eye') + ' Ver inspección</button></td><td>' + accionPdf(i, 'INSPECCION') + '</td></tr>').join('') +
            '</tbody></table></div>'
          : '<p class="empty-state">Sin inspecciones registradas.</p>';
        const tablaResp = responsivas.length
          ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>Fecha</th><th>Origen</th><th>Responsable</th><th>Documento</th><th>Carpeta</th></tr></thead><tbody>' +
            responsivas.map((r) => '<tr><td>' + guion(fecha(r.fecha)) + '</td><td>' + (ORIGEN[r.origen] || '') + '</td><td>' + guion(r.responsable) + '</td>' +
              '<td>' + accionPdf(r, 'RESPONSIVA') + '</td>' +
              '<td>' + (r.carpetaId ? enlaceDrive(r.carpetaId, 'Abrir') : vacio) + '</td></tr>').join('') +
            '</tbody></table></div>'
          : '<p class="empty-state">Sin responsivas registradas.</p>';
        return tarjeta(icono('clipboard-check') + ' Inspecciones (' + inspecciones.length + ')', tablaInsp) + tarjeta(icono('signature') + ' Responsivas (' + responsivas.length + ')', tablaResp);
      }

      // ---- Alta y edición directa del inventario ----
      function campoEditor(id, etiqueta, valor, tipo, opciones, grupo) {
        // Correos, PIN y contraseñas se guardan tal cual (sin las mayúsculas automáticas del sistema)
        const literal = /^(CUENTA GOOGLE|CONTRASEÑA MODEM|PIN WHATSAPP|PIN EQUIPO)$/.test(id) ? ' data-respetar-texto' : '';
        const attrs = ' id="reg-' + id + '" data-campo="' + esc(id) + '"' + (grupo ? ' data-grupo="' + grupo + '"' : '') + literal;
        if (tipo === 'select') return '<div class="field"' + (grupo ? ' data-reg-grupo="' + grupo + '"' : '') + '><label>' + esc(etiqueta) + '</label><select' + attrs + '>' +
          (opciones || []).map((v) => '<option value="' + esc(v) + '"' + (String(v) === String(valor || '') ? ' selected' : '') + '>' + esc(v || 'Selecciona…') + '</option>').join('') + '</select></div>';
        return '<div class="field"' + (grupo ? ' data-reg-grupo="' + grupo + '"' : '') + '><label>' + esc(etiqueta) + '</label><input' + attrs + ' type="' + (tipo || 'text') + '" value="' + esc(valor || '') + '" autocomplete="off" /></div>';
      }

      function datosEditor(r) {
        const e = r && r.equipo || {};
        const l = r && r.linea || {};
        const leg = e.legado || l.legado || {};
        const resp = e.responsable || l.responsable || {};
        return {
          'TIPO': leg.tipo || '', 'NUCO': e.nuco || l.nucoLegado || '', 'EQUIPO': e.modelo || '', 'IMEI': e.imei || '', 'COLOR': e.color || '',
          'ACCESORIOS': (e.accesorios || []).join(', '), 'ESTATUS EQUIPO': e.estatus || '', 'CUENTA GOOGLE': e.cuentaGoogle || '', 'PIN EQUIPO': e.pinEquipo || '',
          'PATRON': e.patronRuta || '', 'CONTRASEÑA MODEM': e.contrasenaModem || '', 'NUMERO TELEFONO': l.numero || '', 'NUMERO SIM': l.sim || '',
          'COMPAÑIA': l.compania || '', 'COSTO PLAN': l.costoPlan === null || l.costoPlan === undefined ? '' : l.costoPlan,
          'INICIO PLAN': fechaInput(l.inicioPlan), 'FIN PLAN': fechaInput(l.finPlan), 'ESTATUS LINEA': l.estatus || '', 'PIN WHATSAPP': l.pinWhatsapp || '',
          'NO EMPLEADO': resp.noEmpleado || '', 'RESPONSABLE': resp.nombre || '', 'PUESTO': resp.puesto || '', 'SEDE': resp.sede || '',
          'OFICINA / DESARROLLO': resp.oficina || '', 'DEPARTAMENTO': resp.departamento || '', 'AREA': resp.area || '', 'JEFE DIRECTO': resp.jefeDirecto || '',
          'DIRECTOR': resp.director || '', 'RAZON SOCIAL': resp.razonSocial || '', 'COMENTARIOS': leg.comentarios || '',
        };
      }

      function fechaInput(v) {
        if (!v) return '';
        const d = new Date(v);
        return isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
      }

      function formularioEditor(datos, catalogos, editando) {
        const f = (id, et, tipo, opciones, grupo) => campoEditor(id, et, datos[id], tipo, opciones, grupo);
        const puedeVerSecretos = memoria.permisos && memoria.permisos.puedeVerSecretos;
        const seguridadEquipo = '<div class="ln-seguridad-editor" data-reg-grupo="celular"><div class="ln-editor-grid">' +
          '<div class="field"><label for="reg-tipo-seguridad">Seguridad del equipo</label><select id="reg-tipo-seguridad">' +
            (editando ? '<option value="CONSERVAR">Conservar configuración actual</option>' : '') +
            '<option value="SIN">Sin PIN o patrón</option><option value="PIN">PIN</option><option value="PATRON">Patrón</option><option value="CONTRASEÑA">Contraseña</option></select></div>' +
          '<div class="field" id="reg-seguridad-valor-campo" hidden><label for="reg-seguridad-valor">PIN o contraseña</label><input type="text" id="reg-seguridad-valor" data-respetar-texto autocomplete="new-password" /></div></div>' +
          '<div class="ln-nota" id="reg-patron-ayuda" hidden>' + icono('info', 'ln-icon-sm') + ' Selecciona los puntos en el orden del patrón.</div>' + htmlPatron('reg-patron', true) + '</div>';
        const secretosEquipo = puedeVerSecretos ? f('CONTRASEÑA MODEM', 'Contraseña del módem', null, null, 'modem') : '';
        const secretosLinea = puedeVerSecretos ? f('PIN WHATSAPP', 'PIN WhatsApp', null, null, 'linea') : '';
        return '<div class="ln-nota">' + icono('history') + ' Cada cambio se registrará automáticamente en el historial del activo.</div>' +
          seccionCaptura(1, 'layout-list', 'Tipo e identificación', 'Define qué clase de activo se registrará.', '<div class="ln-editor-grid">' +
            f('TIPO', 'Tipo *', 'select', [''].concat(catalogos.tipos || [])) + f('NUCO', 'NUCO *') + '</div>') +
          seccionCaptura(2, 'smartphone', 'Datos del equipo', 'Solo se guardan para tipos que incluyen equipo.', '<div class="ln-editor-grid">' +
            f('EQUIPO', 'Modelo *', null, null, 'equipo') + f('IMEI', 'IMEI', null, null, 'equipo') + f('COLOR', 'Color', null, null, 'equipo') +
            f('ACCESORIOS', 'Accesorios (separados por coma)', null, null, 'equipo') + f('ESTATUS EQUIPO', 'Estatus del equipo', 'select', [''].concat(catalogos.estatusEquipo || []), 'equipo') +
            f('CUENTA GOOGLE', 'Cuenta Google', null, null, 'celular') + secretosEquipo + '</div>' + seguridadEquipo) +
          seccionCaptura(3, 'card-sim', 'Datos de la línea', 'Solo se guardan para tipos que incluyen SIM o línea.', '<div class="ln-editor-grid">' +
            f('NUMERO TELEFONO', 'Número telefónico', null, null, 'linea') + f('NUMERO SIM', 'Número SIM', null, null, 'linea') +
            f('COMPAÑIA', 'Compañía', 'select', [''].concat(catalogos.companias || []), 'linea') + f('COSTO PLAN', 'Costo del plan', 'number', null, 'linea') +
            f('INICIO PLAN', 'Inicio del plan', 'date', null, 'linea') + f('FIN PLAN', 'Fin del plan', 'date', null, 'linea') +
            f('ESTATUS LINEA', 'Estatus de la línea', 'select', [''].concat(catalogos.estatusLinea || []), 'linea') + secretosLinea + '</div>') +
          seccionCaptura(4, 'user-round', 'Responsable y ubicación', 'Información operativa del activo.', '<div class="ln-editor-grid">' +
            f('NO EMPLEADO', 'No. empleado') + f('RESPONSABLE', 'Responsable') + f('PUESTO', 'Puesto') + f('SEDE', 'Sede') + f('OFICINA / DESARROLLO', 'Oficina / desarrollo') +
            f('DEPARTAMENTO', 'Departamento') + f('AREA', 'Área') + f('JEFE DIRECTO', 'Jefe directo') + f('DIRECTOR', 'Director') + f('RAZON SOCIAL', 'Razón social') + '</div>' +
            '<div class="field"><label>Comentarios</label><textarea id="reg-COMENTARIOS" data-campo="COMENTARIOS" rows="4">' + esc(datos.COMENTARIOS || '') + '</textarea></div>') +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div><div class="ln-captura-acciones"><button type="button" class="secondary" data-cerrar-modal>Cancelar</button>' +
          '<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('save') + ' ' + (editando ? 'Guardar cambios' : 'Crear registro') + '</button></div>';
      }

      function actualizarCamposEditor() {
        const tipo = ($('#reg-TIPO', raiz) || {}).value || '';
        const equipo = /^(EQUIPO|MODEM|BANDA ANCHA|CAMARA)/.test(tipo);
        const linea = ['EQUIPO + SIM', 'EQUIPO + SIM BASICO', 'LINEA', 'LINEA BASICA', 'MODEM', 'BANDA ANCHA', 'CAMARA'].indexOf(tipo) >= 0;
        raiz.querySelectorAll('[data-reg-grupo="equipo"]').forEach((n) => { n.hidden = !equipo; });
        raiz.querySelectorAll('[data-reg-grupo="linea"]').forEach((n) => { n.hidden = !linea; });
        raiz.querySelectorAll('[data-reg-grupo="celular"]').forEach((n) => { n.hidden = !/^EQUIPO/.test(tipo); });
        raiz.querySelectorAll('[data-reg-grupo="modem"]').forEach((n) => { n.hidden = ['MODEM', 'BANDA ANCHA'].indexOf(tipo) < 0; });
      }

      function actualizarSeguridadEditor() {
        const selector = $('#reg-tipo-seguridad', raiz); if (!selector) return;
        const modo = selector.value;
        $('#reg-seguridad-valor-campo', raiz).hidden = modo !== 'PIN' && modo !== 'CONTRASEÑA';
        $('#reg-patron-bloque', raiz).hidden = modo !== 'PATRON';
        $('#reg-patron-ayuda', raiz).hidden = modo !== 'PATRON';
      }

      function abrirEditor(id) {
        $('#ln-modal-captura', raiz).hidden = false;
        $('#ln-captura-icono', raiz).innerHTML = icono(id ? 'pencil' : 'plus');
        $('#ln-captura-tipo', raiz).textContent = 'Inventario de telefonía';
        $('#ln-captura-titulo', raiz).textContent = id ? 'Editar información' : 'Agregar nuevo NUCO';
        $('#ln-captura-subtitulo', raiz).textContent = 'Cargando campos y catálogos…';
        $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        captura = { tipo: 'REGISTRO', idObjetivo: id, firmas: {} };
        const detalleReq = id ? (memoria.indice.equipos.some((e) => e.id === id) ? llamar('apiLineasEquipo', id) : llamar('apiLineasLinea', id)) : Promise.resolve(null);
        Promise.all([detalleReq, llamar('apiLineasCatalogos')]).then(([detalleReg, catalogos]) => {
          if (!captura || captura.tipo !== 'REGISTRO') return;
          const datos = datosEditor(detalleReg);
          $('#ln-captura-subtitulo', raiz).textContent = id ? 'Actualiza los datos necesarios; el historial conservará antes y después.' : 'Completa los datos del nuevo equipo o línea.';
          $('#ln-captura-cuerpo', raiz).innerHTML = formularioEditor(datos, catalogos, !!id);
          pintarIconos($('#ln-captura-cuerpo', raiz));
          $('#reg-TIPO', raiz).addEventListener('change', actualizarCamposEditor);
          captura.controlPatron = activarPatron('reg-patron');
          $('#reg-tipo-seguridad', raiz).addEventListener('change', actualizarSeguridadEditor);
          actualizarCamposEditor();
          actualizarSeguridadEditor();
          $('#cap-guardar', raiz).addEventListener('click', () => {
            const valores = {};
            raiz.querySelectorAll('#ln-captura-cuerpo [data-campo]').forEach((el) => { valores[el.dataset.campo] = el.value; });
            const errorBox = $('#cap-error', raiz); errorBox.hidden = true;
            const modoSeguridad = $('#reg-tipo-seguridad', raiz).value;
            if (modoSeguridad === 'PATRON' && captura.controlPatron.puntos().length < 2) { mostrarErrorCaptura('Traza al menos dos puntos para guardar el patrón.', '#reg-patron-bloque'); return; }
            if ((modoSeguridad === 'PIN' || modoSeguridad === 'CONTRASEÑA') && !$('#reg-seguridad-valor', raiz).value.trim()) { mostrarErrorCaptura('Captura el PIN o la contraseña del equipo.', '#reg-seguridad-valor'); return; }
            if (modoSeguridad !== 'CONSERVAR') {
              valores['PIN EQUIPO'] = modoSeguridad === 'PATRON' ? 'PATRON' : (modoSeguridad === 'SIN' ? '' : $('#reg-seguridad-valor', raiz).value.trim());
              valores.PATRON = modoSeguridad === 'PATRON' ? captura.controlPatron.valor() : '';
            }
            estadoGuardado(id ? 'Guardando cambios' : 'Creando registro');
            const promesa = id ? llamar('apiLineasEditarRegistro', id, valores) : llamar('apiLineasCrearRegistro', valores);
            promesa.then((r) => cargarIndice(true).then(() => {
              cerrarCaptura(true);
              aviso(icono('circle-check') + ' ' + (id ? 'Información actualizada.' : 'Registro creado.'), 6000);
              if (id) abrirRegistro(id); else abrirRegistro(r.id);
            })).catch((e) => { mostrarErrorCaptura(mensajeError(e)); restaurarGuardado(); });
          });
        }).catch((e) => { $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>'; });
      }

      // ---- Captura: inspección y responsiva nuevas ----

      function cerrarCaptura(guardada) {
        if (captura && captura.guardando && !guardada) return;
        const borrador = captura;
        $('#ln-modal-captura', raiz).hidden = true;
        $('#ln-captura-cuerpo', raiz).innerHTML = '';
        captura = null;
        if (!guardada && borrador && !borrador.guardada && borrador.carpetaId) {
          llamar('apiLineasCancelarEvidencia', borrador.carpetaId, borrador.fotosCarpetaId)
            .catch((e) => aviso(icono('triangle-alert', 'ln-alerta') + ' No se pudo limpiar la carpeta cancelada: ' + mensajeError(e), 9000));
        }
      }

      function grupoEscala(opciones, valorPrevio) {
        const claseMala = { NO: 'ln-pastilla-mal', MALO: 'ln-pastilla-mal', REGULAR: 'ln-pastilla-media' };
        return '<div class="ln-pastillas">' + opciones.map((v) =>
          '<button type="button" class="ln-pastilla' + (v === valorPrevio ? ' activa' : '') + (claseMala[v] ? ' ' + claseMala[v] : '') + '" data-valor="' + esc(v) + '">' + esc(v) + '</button>').join('') + '</div>';
      }

      function seccionCaptura(numero, ico, titulo, ayuda, contenido) {
        return '<section class="ln-form-seccion"><div class="ln-form-seccion-cabecera"><span class="ln-form-seccion-num">' + numero + '</span><div>' +
          '<h3>' + icono(ico) + ' ' + esc(titulo) + '</h3><p>' + esc(ayuda) + '</p></div></div>' +
          '<div class="ln-form-seccion-contenido">' + contenido + '</div></section>';
      }

      // ---- Formularios del AppSheet (INSPECCIONES LINEAS_Form / RESPONSIVAS LINEAS_Form) ----
      // El servidor manda los elementos en el orden del AppSheet; aquí se dibujan y se aplican
      // los Show_If / Required_If sobre [TIPO] con los mismos códigos (LineasChecklist.CONDICIONES).
      const CONDICIONES_APPSHEET = {
        SIEMPRE: () => true,
        NUNCA: () => false,
        NO_LINEA: (t) => t !== 'LINEA',
        NO_EQUIPO: (t) => t !== 'EQUIPO',
        EQUIPOS: (t) => t === 'EQUIPO + SIM' || t === 'EQUIPO',
        VOZ: (t) => t === 'EQUIPO + SIM' || t === 'LINEA',
        BATERIA: (t) => ['EQUIPO + SIM', 'EQUIPO', 'BANDA ANCHA'].indexOf(t) >= 0,
        EQUIPOS_Y_MODEMS: (t) => ['EQUIPO + SIM', 'EQUIPO', 'MODEM', 'BANDA ANCHA'].indexOf(t) >= 0,
        MODEM: (t) => t.indexOf('MODEM') >= 0 || t.indexOf('BANDA ANCHA') >= 0,
        MODEM_Y_BANDA: (t) => t.indexOf('MODEM') >= 0 && t.indexOf('BANDA ANCHA') >= 0,
      };
      const cumpleCondicion = (codigo, tipo) => !!CONDICIONES_APPSHEET[codigo] && CONDICIONES_APPSHEET[codigo](String(tipo || '').trim().toUpperCase());

      // CALIFICACION: misma AppFormula del AppSheet (ver LineasChecklist.calificacion)
      const CALIFICACION_SI = ['IDENTIFICACION', 'CUBO', 'CABLE', 'FUNDA', 'MICA', 'PANTALLA', 'BOTONES VOLUMEN', 'BOTON ENCENDIDO',
        'CUERPO EQUIPO', 'CAMARA', 'PUERTO CARGA', 'ALTAVOZ', 'BOCINAS', 'MICROFONO', 'LINEA DE VOZ'];
      const CALIFICACION_DESEMPENO = { 'DURACION BATERIA': 1, 'TEMPERATURA': 1, 'DESEMPEÑO': 1 };
      function calificacionAppSheet(valores) {
        let suma = 0;
        let contestados = 0;
        CALIFICACION_SI.forEach((c) => { if (valores[c] === 'SI') { suma++; contestados++; } else if (valores[c] === 'NO') contestados++; });
        Object.keys(CALIFICACION_DESEMPENO).forEach((c) => {
          const n = { BUENO: 1, REGULAR: 0.5, MALO: 0 }[valores[c]];
          if (n !== undefined) { suma += n; contestados++; }
        });
        return suma / Math.max(1, contestados);
      }

      const esPuntosPatron = (v) => /^[1-9](-[1-9])*$/.test(String(v || ''));

      function htmlElementoFormulario(e) {
        if (e.tipo === 'titulo') return '<h4 class="ln-af-titulo">' + (e.icono ? icono(e.icono) + ' ' : '') + esc(e.texto) + '</h4>';
        const id = 'af-' + e.columna.replace(/[^A-Za-z0-9]+/g, '-');
        const attrs = ' id="' + id + '" data-columna="' + esc(e.columna) + '"' + (e.literal || e.secreto ? ' data-respetar-texto' : '') + (e.soloLectura ? ' readonly tabindex="-1"' : '');
        const valor = e.valor === null || e.valor === undefined ? '' : String(e.valor);
        let control;
        if (e.control === 'escala') {
          control = '<div class="ln-checklist-punto" data-columna="' + esc(e.columna) + '">' + grupoEscala(e.opciones || [], valor || null) + '</div>';
        } else if (e.control === 'lista') {
          const opciones = (e.opciones || []).slice();
          const fuera = valor && opciones.map((o) => String(o).toUpperCase()).indexOf(valor.toUpperCase()) < 0;
          control = '<select' + attrs + '><option value="">Selecciona…</option>' +
            (fuera ? '<option value="' + esc(valor) + '" selected>' + esc(valor) + ' (no está en la lista)</option>' : '') +
            opciones.map((o) => '<option value="' + esc(o) + '"' + (String(o).toUpperCase() === valor.toUpperCase() ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
        } else if (e.control === 'area') {
          control = '<textarea' + attrs + ' rows="4">' + esc(valor) + '</textarea>';
        } else if (e.control === 'fechaHora') {
          control = '<input type="datetime-local"' + attrs + ' value="' + esc(valor) + '" />';
        } else if (e.control === 'patron') {
          const nota = e.valorOculto ? 'Registrado (solo administradores lo ven). Si no trazas uno nuevo, se conserva.'
            : (valor && !esPuntosPatron(valor) ? 'Hay un patrón capturado en AppSheet (imagen). Si no trazas uno nuevo, se conserva.' : '');
          control = (nota ? '<div class="ln-nota">' + icono('info', 'ln-icon-sm') + ' ' + esc(nota) + '</div>' : '') + htmlPatron(id + '-patron', false);
        } else if (e.control === 'firma') {
          control = '<div class="ln-firma-caja"><canvas id="' + id + '-firma"></canvas><div class="ln-firma-acciones"><span class="ln-firma-vacia">Dibuja con el dedo o el mouse</span>' +
            '<button type="button" class="secondary ln-btn-chico" data-limpiar-firma="' + esc(e.columna) + '">Limpiar</button></div></div>';
        } else if (e.control === 'calculado') {
          control = '<div class="ln-af-calculado" id="' + id + '">—</div>';
        } else {
          control = '<input type="text"' + attrs + ' value="' + esc(valor) + '" autocomplete="off"' + (e.valorOculto ? ' placeholder="•••• (se conserva el valor registrado)"' : '') + ' />';
        }
        const ancho = ['escala', 'area', 'patron', 'firma'].indexOf(e.control) >= 0 ? ' ln-af-ancho' : '';
        return '<div class="field ln-af-campo' + ancho + (e.soloLectura ? ' ln-af-lectura' : '') + '" data-af-columna="' + esc(e.columna) + '" data-mostrar="' + esc(e.mostrar) + '" data-requerido="' + esc(e.requerido) + '">' +
          '<label for="' + id + '">' + esc(e.etiqueta) + '<span class="ln-af-req" hidden> *</span></label>' + control + '</div>';
      }

      /** Dibuja el formulario agrupando cada título del AppSheet con sus campos. */
      function htmlFormularioAppSheet(elementos) {
        let html = '';
        let abierto = false;
        elementos.forEach((e) => {
          if (e.tipo === 'titulo') {
            if (abierto) html += '</div></section>';
            html += '<section class="ln-af-seccion">' + htmlElementoFormulario(e) + '<div class="ln-af-grid">';
            abierto = true;
            return;
          }
          if (!abierto) { html += '<section class="ln-af-seccion"><div class="ln-af-grid">'; abierto = true; }
          html += htmlElementoFormulario(e);
        });
        return html + (abierto ? '</div></section>' : '');
      }

      /** Valores actuales del formulario, por columna del AppSheet. */
      function leerFormularioAppSheet() {
        const valores = {};
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        cuerpo.querySelectorAll('input[data-columna], select[data-columna], textarea[data-columna]').forEach((el) => {
          if (!el.readOnly) valores[el.dataset.columna] = el.value.trim();
        });
        cuerpo.querySelectorAll('.ln-checklist-punto[data-columna]').forEach((fila) => {
          const activa = fila.querySelector('.ln-pastilla.activa');
          valores[fila.dataset.columna] = activa ? activa.dataset.valor : '';
        });
        return valores;
      }

      function tipoFormulario() {
        const el = raiz.querySelector('#ln-captura-cuerpo [data-columna="TIPO"]');
        return el ? el.value : (captura && captura.tipoFijo) || '';
      }

      /** Show_If / Required_If en vivo y la CALIFICACION calculada. */
      function actualizarFormularioAppSheet() {
        if (!captura) return;
        const tipo = tipoFormulario();
        raiz.querySelectorAll('#ln-captura-cuerpo .ln-af-campo').forEach((campo) => {
          const visible = cumpleCondicion(campo.dataset.mostrar, tipo);
          campo.hidden = !visible;
          campo.querySelector('.ln-af-req').hidden = !(visible && cumpleCondicion(campo.dataset.requerido, tipo));
        });
        raiz.querySelectorAll('#ln-captura-cuerpo .ln-af-seccion').forEach((sec) => {
          sec.hidden = !sec.querySelector('.ln-af-campo:not([hidden])');
        });
        const calif = $('#af-CALIFICACION', raiz);
        if (calif) calif.textContent = (calificacionAppSheet(leerFormularioAppSheet()) * 100).toFixed(2) + '%';
      }
      const actualizarProgresoChecklist = actualizarFormularioAppSheet;

      /** Obligatorios visibles vacíos (misma regla que el servidor). */
      function faltantesFormularioAppSheet() {
        const tipo = tipoFormulario();
        const valores = leerFormularioAppSheet();
        const faltan = [];
        (captura.contexto.formulario || []).forEach((e) => {
          if (e.tipo !== 'campo' || e.soloLectura || e.control === 'calculado' || e.valorOculto) return;
          if (!cumpleCondicion(e.mostrar, tipo) || !cumpleCondicion(e.requerido, tipo)) return;
          if (e.control === 'firma') {
            const f = captura.firmas[e.columna];
            if (!f || f.estaVacia()) faltan.push(e);
            return;
          }
          if (e.control === 'patron') return;
          if (!valores[e.columna]) faltan.push(e);
        });
        return faltan;
      }

      function iniciarFormularioAppSheet() {
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        (captura.contexto.formulario || []).forEach((e) => {
          if (e.tipo !== 'campo') return;
          const id = 'af-' + e.columna.replace(/[^A-Za-z0-9]+/g, '-');
          if (e.control === 'firma') captura.firmas[e.columna] = activarFirma(id + '-firma');
          if (e.control === 'patron') {
            captura.columnaPatron = e.columna;
            captura.patronInicial = esPuntosPatron(e.valor) ? e.valor : null;
            captura.controlPatron = activarPatron(id + '-patron', captura.patronInicial ? captura.patronInicial.split('-') : []);
          }
        });
        cuerpo.addEventListener('input', (ev) => { if (ev.target.matches('[data-columna]')) actualizarFormularioAppSheet(); });
        cuerpo.addEventListener('change', (ev) => { if (ev.target.matches('[data-columna]')) actualizarFormularioAppSheet(); });
        actualizarFormularioAppSheet();
      }

      /**
       * PATRON a enviar: los puntos trazados, '' si se borró uno que venía en puntos, o undefined para
       * conservar el valor inicial (p. ej. la imagen que dejó AppSheet).
       */
      function patronParaGuardar() {
        if (!captura.controlPatron) return undefined;
        const actual = captura.controlPatron.valor();
        if (actual) return actual;
        return captura.patronInicial ? '' : undefined;
      }

      /** Valida antes de enviar; regresa false y lleva al primer campo faltante. */
      function validarFormularioAppSheet() {
        const faltan = faltantesFormularioAppSheet();
        // Valid_If de las listas (IN(..., LISTAS TELEFONOS[...])): un valor fuera de la lista no se acepta
        const tipo = tipoFormulario();
        const valores = leerFormularioAppSheet();
        const fueraDeLista = (captura.contexto.formulario || []).filter((e) => e.tipo === 'campo' && e.control === 'lista' && cumpleCondicion(e.mostrar, tipo) &&
          valores[e.columna] && (e.opciones || []).map((o) => String(o).toUpperCase()).indexOf(valores[e.columna].toUpperCase()) < 0);
        if (!faltan.length && fueraDeLista.length) {
          const campo = raiz.querySelector('#ln-captura-cuerpo [data-af-columna="' + CSS.escape(fueraDeLista[0].columna) + '"] select');
          mostrarErrorCaptura(fueraDeLista.map((e) => e.etiqueta).join(', ') + ': elige un valor de la lista (VALOR NO ENCONTRADO EN LA LISTA).', campo ? '#' + campo.id : null);
          return false;
        }
        if (!faltan.length) return true;
        const primero = faltan[0];
        const destino = raiz.querySelector('#ln-captura-cuerpo [data-af-columna="' + CSS.escape(primero.columna) + '"]');
        mostrarErrorCaptura(faltan.map((e) => e.etiqueta).slice(0, 6).join(', ') + (faltan.length > 6 ? '…' : '') + (faltan.length === 1 ? ' es obligatorio.' : ' son obligatorios.'),
          destino ? '#' + (destino.querySelector('[id]') || destino).id : null);
        return false;
      }

      function activarFirma(id) {
        const canvas = document.getElementById(id);
        if (!canvas) return null;
        const ctx2d = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const escala = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, rect.width) * escala;
        canvas.height = Math.max(1, rect.height) * escala;
        ctx2d.scale(escala, escala);
        ctx2d.lineWidth = 2.2; ctx2d.lineCap = 'round'; ctx2d.lineJoin = 'round'; ctx2d.strokeStyle = '#111';
        const estado = { vacia: true, dibujando: false };
        const posicion = (ev) => {
          const r = canvas.getBoundingClientRect();
          return { x: ev.clientX - r.left, y: ev.clientY - r.top };
        };
        const empezar = (ev) => { ev.preventDefault(); estado.dibujando = true; estado.vacia = false; const p = posicion(ev); ctx2d.beginPath(); ctx2d.moveTo(p.x, p.y); };
        const mover = (ev) => { if (!estado.dibujando) return; ev.preventDefault(); const p = posicion(ev); ctx2d.lineTo(p.x, p.y); ctx2d.stroke(); };
        const terminar = () => { estado.dibujando = false; };
        canvas.addEventListener('pointerdown', empezar);
        canvas.addEventListener('pointermove', mover);
        canvas.addEventListener('pointerup', terminar);
        canvas.addEventListener('pointerleave', terminar);
        return {
          estaVacia: () => estado.vacia,
          limpiar: () => { ctx2d.clearRect(0, 0, rect.width, rect.height); estado.vacia = true; },
          base64: (fondoPdf) => {
            const salida = document.createElement('canvas'); salida.width = canvas.width; salida.height = canvas.height;
            const x = salida.getContext('2d'); x.fillStyle = fondoPdf || '#ffffff'; x.fillRect(0, 0, salida.width, salida.height); x.drawImage(canvas, 0, 0);
            return salida.toDataURL('image/png').split(',')[1];
          },
        };
      }

      function htmlPatron(prefijo, oculto) {
        return '<div id="' + prefijo + '-bloque"' + (oculto ? ' hidden' : '') + '><div class="ln-patron" id="' + prefijo + '-lienzo"><svg id="' + prefijo + '-lineas" viewBox="0 0 300 300" aria-hidden="true"></svg>' +
          Array.from({ length: 9 }, (_, i) => '<button type="button" class="ln-patron-punto" data-punto="' + (i + 1) + '" aria-label="Punto ' + (i + 1) + '"></button>').join('') +
          '</div><div class="ln-patron-acciones"><span id="' + prefijo + '-texto">Sin patrón trazado</span><button type="button" class="secondary ln-btn-chico" id="' + prefijo + '-limpiar">Limpiar patrón</button></div></div>';
      }

      function activarPatron(prefijo, inicial) {
        const bloque = $('#' + prefijo + '-bloque', raiz);
        if (!bloque) return { puntos: () => [], valor: () => '', base64: () => null };
        const posiciones = [[50,50],[150,50],[250,50],[50,150],[150,150],[250,150],[50,250],[150,250],[250,250]];
        const estado = { puntos: (inicial || []).map(Number).filter((n) => n >= 1 && n <= 9) };
        const pintar = () => {
          bloque.querySelectorAll('.ln-patron-punto').forEach((p) => p.classList.toggle('activa', estado.puntos.indexOf(Number(p.dataset.punto)) >= 0));
          $('#' + prefijo + '-lineas', raiz).innerHTML = estado.puntos.length > 1 ? '<polyline points="' + estado.puntos.map((n) => posiciones[n - 1].join(',')).join(' ') + '" />' : '';
          $('#' + prefijo + '-texto', raiz).textContent = estado.puntos.length ? 'Patrón: ' + estado.puntos.join(' → ') : 'Sin patrón trazado';
        };
        bloque.querySelectorAll('.ln-patron-punto').forEach((p) => p.addEventListener('click', () => {
          const n = Number(p.dataset.punto); if (estado.puntos.indexOf(n) < 0) estado.puntos.push(n); pintar();
        }));
        $('#' + prefijo + '-limpiar', raiz).addEventListener('click', () => { estado.puntos = []; pintar(); });
        pintar();
        return {
          puntos: () => estado.puntos.slice(),
          valor: () => estado.puntos.join('-'),
          base64: (fondoPdf) => {
            if (!estado.puntos.length) return null;
            const c = document.createElement('canvas'); c.width = 300; c.height = 300;
            const x = c.getContext('2d'); x.fillStyle = fondoPdf || '#ffffff'; x.fillRect(0, 0, 300, 300); x.strokeStyle = '#0b5d7a'; x.lineWidth = 8; x.lineCap = 'round';
            x.beginPath(); estado.puntos.forEach((n, i) => { const p = posiciones[n - 1]; if (!i) x.moveTo(p[0], p[1]); else x.lineTo(p[0], p[1]); }); x.stroke();
            estado.puntos.forEach((n) => { const p = posiciones[n - 1]; x.beginPath(); x.fillStyle = '#0b5d7a'; x.arc(p[0], p[1], 13, 0, Math.PI * 2); x.fill(); });
            return c.toDataURL('image/png').split(',')[1];
          },
        };
      }

      function subirImagenCaptura(archivo, listaId, carpetaId, onSubido) {
        const lista = document.getElementById(listaId);
        if (!lista) return;
        const chip = document.createElement('span');
        chip.className = 'ln-foto-chip ln-foto-subiendo';
        chip.innerHTML = icono('loader-circle', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(archivo.name) + '</span>';
        lista.appendChild(chip);
        redimensionarImagen(archivo, 1600)
          .then((img) => llamar('apiLineasSubirArchivo', carpetaId, archivo.name, img.mime, img.base64))
          .then((subido) => {
            chip.className = 'ln-foto-chip';
            chip.innerHTML = icono('check', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(subido.nombre) + '</span>' +
              '<button type="button" data-quitar-foto="' + esc(subido.id) + '">' + icono('x', 'ln-icon-sm') + '</button>';
            onSubido(subido);
          }).catch((e) => {
            chip.className = 'ln-foto-chip';
            chip.style.background = 'var(--ln-rojo-bg)'; chip.style.color = 'var(--ln-rojo-tx)';
            chip.innerHTML = icono('triangle-alert', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(mensajeError(e)) + '</span>';
            onSubido(null);
          });
      }

      function manejarSubidaArchivo(inputId, listaId, obtenerCarpetaId, multiple, onSubido) {
        const input = document.getElementById(inputId);
        if (!input) return;
        input.addEventListener('change', () => {
          const archivos = Array.from(input.files || []);
          input.value = '';
          if (!multiple) document.getElementById(listaId).innerHTML = '';
          archivos.slice(0, multiple ? archivos.length : 1).forEach((archivo) => subirImagenCaptura(archivo, listaId, obtenerCarpetaId(), onSubido));
        });
      }

      function estadoGuardado(texto) {
        if (!captura) return;
        captura.guardando = true;
        const modal = $('#ln-modal-captura', raiz);
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = true; });
        $('#cap-guardar', raiz).innerHTML = '<span class="ln-spinner"></span> ' + esc(texto);
        $('#ln-captura-subtitulo', raiz).textContent = texto + '. Mantén esta ventana abierta.';
        modal.setAttribute('aria-busy', 'true');
      }

      function restaurarGuardado() {
        if (!captura) return;
        captura.guardando = false;
        const modal = $('#ln-modal-captura', raiz);
        modal.removeAttribute('aria-busy');
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = false; });
        $('#cap-guardar', raiz).innerHTML = icono('circle-check') + ' Guardar y generar PDF';
        $('#ln-captura-subtitulo', raiz).textContent = 'No se completó el guardado. Revisa el mensaje y vuelve a intentar.';
      }

      function mostrarErrorCaptura(mensaje, destino) {
