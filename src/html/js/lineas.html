          correo: c.correo ? String(c.correo).trim().toLowerCase() : '',
          baja: c.estatus && String(c.estatus).toUpperCase() !== 'ACTIVO',
        })).filter((c) => c.nombre);
        const distintos = (campo) => gente.map((c) => c[campo]).filter((v, i, a) => v && a.indexOf(v) === i).sort();
        const etiquetaDe = (partes, c) => partes.filter(Boolean).join(' · ') + (c.baja ? ' · BAJA' : '');
        if (tipo === 'PUESTOS') return distintos('puesto');
        if (tipo === 'DEPARTAMENTOS') return distintos('departamento');
        if (tipo === 'NO_EMPLEADO') {
          return gente.filter((c) => c.noEmpleado).map((c) => ({ valor: c.noEmpleado, etiqueta: etiquetaDe([c.nombre, c.puesto], c), datos: c }));
        }
        return gente.map((c) => ({ valor: c.nombre, etiqueta: etiquetaDe([c.noEmpleado ? 'No. ' + c.noEmpleado : '', c.puesto], c), datos: c }));
      });
    }

    /** Une listas de opciones (texto u objetos { valor, etiqueta }) sin repetir valores. */
    function unirOpciones(a, b) {
      const vistos = {};
      return (a || []).concat(b || []).map((o) => (typeof o === 'object' ? o : { valor: String(o), etiqueta: '' }))
        .filter((o) => { const k = String(o.valor).toUpperCase(); if (!o.valor || vistos[k]) return false; vistos[k] = true; return true; });
    }

    /**
     * Listas desplegables con búsqueda (Combobox) para las listas abiertas y referencias del formulario.
     * `e.sugerencias` agrega opciones de COLABORADORES o del índice; `e.autollenar` ({ COLUMNA: dato })
     * copia datos de la persona elegida en otros campos editables del mismo formulario.
     */
    /**
     * Datos del responsable que salen de Capital Humano: se elige de la lista y, si no está, hay que seleccionar
     * "Agregar 'x'" (lo que solo se teclea no se guarda). Lo agregado se queda en ese registro y no entra a la lista
     * de nadie más (PLAN_REESTRUCTURA_LINEAS.md §3.6). En las acciones masivas la columna llega como "id|COLUMNA".
     */
    const COLUMNAS_CH = ['RESPONSABLE', 'NO EMPLEADO', 'PUESTO', 'DEPARTAMENTO', 'AREA', 'SEDE', 'OFICINA / DESARROLLO',
      'DIRECTOR', 'JEFE DIRECTO']
      .concat(['SEGUNDO', 'TERCER', 'CUARTO', 'QUINTO'].reduce((a, n) => a.concat(['NOMBRE ' + n + ' RESPONSABLE', 'NO EMPLEADO ' + n + ' RESPONSABLE']), []));
    const esColumnaCH = (columna) => COLUMNAS_CH.indexOf(String(columna || '').split('|').pop().toUpperCase().replace(/\s+/g, ' ').trim()) >= 0;

    function activarCombosEn(cuerpo, elementos) {
      if (typeof Combobox === 'undefined') return;
      (elementos || []).forEach((e) => {
        if (e.tipo !== 'campo' || (e.control !== 'listaAbierta' && e.control !== 'referencia')) return;
        const input = cuerpo.querySelector('[data-columna="' + CSS.escape(e.columna) + '"]');
        if (!input || input.dataset.comboListo) return;
        input.dataset.comboListo = '1';
        const cbx = Combobox.crear(input, {
          opciones: e.control === 'referencia' ? (e.opciones || []).map((o) => ({ valor: o.etiqueta, etiqueta: '' })) : unirOpciones(e.opciones),
          // Todas las listas (usuario, 4-oct): lo que no está se elige con "Agregar 'x'"; solo queda en ese registro
          agregar: e.control === 'listaAbierta' && !e.soloLista,
          maximo: 50,
          alElegir: (opcion) => {
            if (e.autollenar && opcion && opcion.datos) {
              Object.keys(e.autollenar).forEach((columna) => {
                const destino = cuerpo.querySelector('[data-columna="' + CSS.escape(columna) + '"]');
                const valor = opcion.datos[e.autollenar[columna]];
                if (!destino || destino.disabled || destino.readOnly || !valor) return;
                CampoAuto.llenar(destino, valor);   // "auto" hasta que lo cambien
                // solo "change": "input" abriría la lista del otro campo
                destino.dispatchEvent(new Event('change', { bubbles: true }));
              });
            }
            input.dispatchEvent(new Event('change', { bubbles: true }));
          },
        });
        if (e.sugerencias) {
          opcionesSugeridas(e.sugerencias).then((ops) => {
            // soloLista: solo las personas de la lista, con sus datos de Capital Humano para llenar lo demás
            const permitidas = (e.opciones || []).map((o) => String(o).toUpperCase());
            cbx.setOpciones(e.soloLista ? unirOpciones(ops.filter((o) => o && permitidas.indexOf(String(o.valor).toUpperCase()) >= 0), e.opciones) : unirOpciones(ops, e.opciones));
            // llenarVacios (usuario, 4-oct): al abrir, si la persona está en Capital Humano, sus datos vacíos se llenan
            // solos (antes había que volver a elegirla). Lo que ya trae el registro no se toca.
            const actual = String(input.value || '').trim().toUpperCase();
            const persona = e.llenarVacios && e.autollenar && actual && ops.filter((o) => o && o.datos && String(o.valor).toUpperCase() === actual)[0];
            if (!persona) return;
            Object.keys(e.autollenar).forEach((columna) => {
              const destino = cuerpo.querySelector('[data-columna="' + CSS.escape(columna) + '"]');
              const valor = persona.datos[e.autollenar[columna]];
              if (!destino || destino.disabled || destino.readOnly || !valor || String(destino.value || '').trim()) return;
              destino.value = valor;
              destino.dispatchEvent(new Event('change', { bubbles: true }));
            });
          }).catch(() => { /* quedan las del servidor */ });
        }
      });
    }

    /** Campos derivados de una referencia (p. ej. LINEA SUSPENDIDA = [IMEI].[NUMERO TELEFONO]) y fórmulas. */
    function actualizarDerivadosEn(cuerpo, elementos) {
      const valores = leerFormularioEn(cuerpo, elementos);
      cuerpo.querySelectorAll('[data-deriva-de]').forEach((el) => {
        const def = (elementos || []).filter((e) => e.columna === el.dataset.derivaDe)[0];
        const op = def && (def.opciones || []).filter((o) => o.id === valores[el.dataset.derivaDe])[0];
        el.value = op ? (op.datos[el.dataset.derivaDato] || '') : '';
      });
      cuerpo.querySelectorAll('[data-formula="NO_ASIGNACION"]').forEach((el) => {
        const a = valores['ASIGNACION'];
        el.textContent = a === 'TRUE' ? 'No' : (a === 'FALSE' ? 'Sí' : '—');
      });
    }

    /** Obligatorios vacíos y valores fuera de lista (mismas reglas que valida el servidor). */
    const VALIDA_CLIENTE = {
      MAYUS: { f: (v) => v === v.toUpperCase() && !/[ÁÉÍÓÚ]/.test(v), msg: 'ESCRIBIR EN MAYUSCULAS Y SIN ACENTOS' },
      NUCO: { f: (v) => /^\d+$/.test(v), msg: 'ESTE CAMPO DEBE SER NUMEROS Y NO SE DEBE REPETIR' },
      // Sin TIPO que elegir (4-oct): las mismas reglas que el servidor (LineasRegistros.valida_)
      EQUIPO: { f: (v) => v !== 'NO APLICA', msg: 'ELIGE EL MODELO' },
      PIN_WA: { f: (v) => v === 'NO APLICA' || v.length <= 13, msg: 'NO MAYOR A 13 CARACTERES' },
      PIN_EQ: { f: (v) => v === 'NO APLICA' || v.length <= 6, msg: 'NO MAYOR A 6 CARACTERES' },
      COMENTARIOS: { f: (v) => v.length > 3, msg: 'ESCRIBE MÁS DE 3 CARACTERES' },
    };

    /** Obligatorios vacíos y Valid_If (mismas reglas que valida el servidor, salvo unicidad). */
    function erroresFormularioEn(cuerpo, elementos, tipo, ctx) {
      const valores = leerFormularioEn(cuerpo, elementos);
      const t = String(valores.TIPO !== undefined ? valores.TIPO : (tipo || '')).trim().toUpperCase();
      const errores = [];
      (elementos || []).forEach((e) => {
        if (e.tipo !== 'campo' || e.soloLectura || e.control === 'calculado' || e.control === 'firma' || e.control === 'patron' || e.control === 'archivo' || e.valorOculto) return;
        if (!cumpleCondicion(e.mostrar, t, valores, ctx)) return;
        // La lista de bloqueo no se guarda (data-virtual): su valor se lee aparte. Solo se pide si está a la vista
        // (usuario, 9-oct: al editar una línea salió «obligatorio» sin que se viera; la pantalla decide con su ctx)
        if (e.columna === '_BLOQUEO' && bloqueoElegido(cuerpo) === null) return;
        const v = (e.columna === '_BLOQUEO' ? bloqueoElegido(cuerpo) : valores[e.columna]) || '';
        const error = (corto) => errores.push({ e: e, columna: e.columna, corto: corto, msg: e.etiqueta + ': ' + corto });
        if (!v) { if (cumpleCondicion(e.requerido, t, valores, ctx)) errores.push({ e: e, columna: e.columna, corto: 'Obligatorio', msg: e.etiqueta + ' es obligatorio' }); return; }
        if ((e.control === 'lista' || e.soloLista) && (e.opciones || []).map((o) => String(o).toUpperCase()).indexOf(v.toUpperCase()) < 0) { error(e.mensaje || 'VALOR NO ENCONTRADO EN LA LISTA'); return; }
        if (e.control === 'referencia' && v.charAt(0) === '¿') error('Elige un valor de la lista');
        const regla = e.valida && VALIDA_CLIENTE[e.valida];
        if (regla && !regla.f(v, t)) error(regla.msg);
      });
      const pin = errorPinBloqueo(cuerpo);
      const campoPin = (elementos || []).filter((e) => e.columna === 'PIN EQUIPO')[0];
      if (pin && campoPin && !errores.some((x) => x.columna === 'PIN EQUIPO')) errores.push({ e: campoPin, columna: 'PIN EQUIPO', corto: pin, msg: 'PIN DEL EQUIPO: ' + pin });
      return errores;
    }

    /** FOLIO y ESTATUS GENERAL (AppFormula de LINEAS TELEFONICAS) para mostrarlos en vivo. */
    /**
     * TIPO asignado solo (usuario, 4-oct; la misma cuenta que LineasRegistros.tipoAutomatico_): equipo sin línea → EQUIPO;
     * con línea → EQUIPO + SIM, o EQUIPO + SIM BASICO si es básica; línea sola → LINEA o SIM BASICO. Una línea
     * CANCELADA ya no cuenta. MODEM, BANDA ANCHA y CAMARA (histórico) se quedan como están.
     */
    function tipoAutomatico(v, ctx) {
      if (ctx && ctx.historico) return ctx.tipoInicial || '';
      const txt = (c) => String((v || {})[c] || '').trim().toUpperCase();
      const vacio = (x) => !x || ['N/A', 'NA', 'NO APLICA', '-', 'SOLO LINEA', 'SIN EQUIPO'].indexOf(x) >= 0;
      const conLinea = (!vacio(txt('NUMERO TELEFONO')) || !vacio(txt('NUMERO SIM'))) && txt('ESTATUS LINEA') !== 'CANCELADA';
      const basica = txt('TIPO DE LINEA') === 'SIM BASICO';
      if (ctx && ctx.parte === 'LINEA' && txt('_VINCULAR') !== 'TRUE') return basica ? 'SIM BASICO' : 'LINEA';
      if (ctx && ctx.parte === 'LINEA') return basica ? 'EQUIPO + SIM BASICO' : 'EQUIPO + SIM';
      return !conLinea ? 'EQUIPO' : (basica ? 'EQUIPO + SIM BASICO' : 'EQUIPO + SIM');
    }

    /** El equipo del índice con ese NUCO (a 4 dígitos), o null. */
    function equipoPorNuco(nuco) {
      const n = String(nuco || '').trim();
      if (!/^\d+$/.test(n)) return null;
      const clave = ('0000' + n).slice(-4);
      return ((memoria.indice || {}).equipos || []).filter((e) => String(e.nuco || '') === clave)[0] || null;
    }

    function formulaRegistro(nombre, v, id) {
      const tipo = String(v.TIPO || '').toUpperCase();
      // Agregar línea (usuario, 8-oct; misma cuenta que LineasRegistros.estatusAltaLinea_): con equipo, USO si está en uso
      // y DISPONIBLE si está guardado; sola, USO con responsable y DISPONIBLE sin él
      const conEquipo = String(v._VINCULAR || '').toUpperCase() === 'TRUE';
      if (nombre === 'ESTATUS_LINEA_ALTA') {
        if (conEquipo) {
          const eq = equipoPorNuco(v._NUCO);
          return eq ? (String(eq.estatus || '').toUpperCase() === 'USO' ? 'USO' : 'DISPONIBLE') : '';
        }
        return String(v.RESPONSABLE || '').trim() ? 'USO' : 'DISPONIBLE';
      }
      if (nombre === 'RESPONSABLE_EQUIPO') {
        const eq = conEquipo ? equipoPorNuco(v._NUCO) : null;
        return eq ? (eq.responsable || 'SIN RESPONSABLE · ' + (eq.estatus || '')) : '';
      }
      if (nombre === 'TIPO_EQUIPO' || nombre === 'TIPO_LINEA') return tipo;
      if (nombre === 'FOLIO') {
        const prefijo = { 'EQUIPO + SIM': 'EQS', 'LINEA': 'LIN', 'MODEM': 'MOD', 'CAMARA': 'CAM', 'BANDA ANCHA': 'BAN', 'EQUIPO': 'EQP' }[tipo] || '';
        return prefijo + ('0000' + (v.NUCO || '')).slice(-4);
      }
      if (nombre === 'ESTATUS_GENERAL') {
        if (/^DG/i.test(id || '')) return 'PERSONAL DG';
        if (tipo === 'EQUIPO') return { 'ESPERA DE RESPONSIVA': 'USO', 'EN ENVIO': 'USO', 'VENTA': 'RESGUARDO', 'DESECHADO': 'DESECHO' }[v['ESTATUS EQUIPO']] || v['ESTATUS EQUIPO'] || '';
        if (['EQUIPO + SIM', 'LINEA', 'MODEM', 'BANDA ANCHA'].indexOf(tipo) >= 0) return { 'ESPERA DE RESPONSIVA': 'USO', 'SIN LINEA': 'CANCELADA', 'EN PROCESO DE CANCELACION': 'CANCELADA' }[v['ESTATUS LINEA']] || v['ESTATUS LINEA'] || '';
        return '';
      }
      return '';
    }

    /**
     * Show_If, Required_If, Editable_If y Reset_If en vivo (formulario de LINEAS TELEFONICAS).
     * `tipoAnterior` sirve para los Reset_If que solo aplican cuando cambia TIPO.
     */
    function aplicarReglasEn(cuerpo, elementos, ctx) {
      let valores = leerFormularioEn(cuerpo, elementos);
      // El TIPO ya no se elige (4-oct): se calcula con lo capturado. El NUCO fijo (edición) no es un campo: viene del contexto
      if (ctx && ctx.parte) valores.TIPO = tipoAutomatico(valores, ctx);
      if (ctx && ctx.nuco && valores.NUCO === undefined) valores.NUCO = ctx.nuco;
      const t = String(valores.TIPO || '').toUpperCase();
      const tipoCambio = ctx.nuevo || t !== String(ctx.tipoInicial || '').toUpperCase();
      (elementos || []).forEach((e) => {
        if (e.tipo !== 'campo' || !e.reset) return;
        if (!cumpleCondicion(e.reset.cuando, t, valores, ctx) || (e.reset.soloCambioTipo && !tipoCambio)) return;
        const el = cuerpo.querySelector('input[data-columna="' + CSS.escape(e.columna) + '"]');
        if (el) el.value = e.reset.copiar ? (valores[e.reset.copiar] || '') : e.reset.valor;
      });
      valores = leerFormularioEn(cuerpo, elementos);
      if (ctx && ctx.parte) valores.TIPO = t;
      if (ctx && ctx.nuco && valores.NUCO === undefined) valores.NUCO = ctx.nuco;
      cuerpo.querySelectorAll('.ln-af-campo').forEach((campo) => {
        const visible = cumpleCondicion(campo.dataset.mostrar, t, valores, ctx);
        campo.hidden = !visible;
        campo.querySelector('.ln-af-req').hidden = !(visible && cumpleCondicion(campo.dataset.requerido, t, valores, ctx));
        const editable = cumpleCondicion(campo.dataset.editable, t, valores, ctx);
        campo.classList.toggle('ln-af-bloqueado', !editable);
        campo.querySelectorAll('input:not([readonly]), select, textarea, .ln-pastilla, input[type="file"]').forEach((el) => { el.disabled = !editable; });
      });
      cuerpo.querySelectorAll('.ln-af-seccion:not(.ln-af-extra)').forEach((sec) => { sec.hidden = !sec.querySelector('.ln-af-campo:not([hidden])'); });
      cuerpo.querySelectorAll('[data-formula]').forEach((el) => {
        if (el.dataset.formula === 'NO_ASIGNACION') return;
        el.textContent = formulaRegistro(el.dataset.formula, valores, ctx.idDG || ctx.id) || '—';
      });
    }

    /** Archivos elegidos en columnas File → { COLUMNA: { nombre, mime, base64 } }. */
    function leerArchivosEn(cuerpo) {
      const lectores = Array.from(cuerpo.querySelectorAll('input[type="file"][data-archivo]')).filter((i) => i.files && i.files[0]).map((input) => new Promise((resolve, reject) => {
        const f = input.files[0];
        if (f.size > 15 * 1024 * 1024) { reject(new Error(input.dataset.archivo + ': el archivo supera 15 MB.')); return; }
        const r = new FileReader();
        r.onload = () => resolve([input.dataset.archivo, { nombre: f.name, mime: f.type || 'application/pdf', base64: String(r.result).split(',')[1] }]);
        r.onerror = () => reject(new Error('No se pudo leer ' + f.name));
        r.readAsDataURL(f);
      }));
      return Promise.all(lectores).then((pares) => pares.reduce((o, [k, v]) => { o[k] = v; return o; }, {}));
    }

    /** Redimensiona una imagen en el navegador antes de subirla (máx. `maxDim` px, JPEG calidad .82). */
    function redimensionarImagen(archivo, maxDim) {
      return new Promise((resolve, reject) => {
        const lector = new FileReader();
        lector.onerror = () => reject(new Error('No se pudo leer el archivo.'));
        lector.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Archivo de imagen inválido.'));
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              const factor = maxDim / Math.max(w, h);
              w = Math.round(w * factor); h = Math.round(h * factor);
            }
            const lienzo = document.createElement('canvas');
            lienzo.width = w; lienzo.height = h;
            lienzo.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mime: 'image/jpeg', base64: lienzo.toDataURL('image/jpeg', 0.82).split(',')[1] });
          };
          img.src = lector.result;
        };
        lector.readAsDataURL(archivo);
      });
    }

    // ---- Identificación de cada responsable en la responsiva (usuario, 9-oct; pendiente 2.27) ----
    // Fotos (una, o frente y vuelta) o un PDF, que se ven antes de guardar. Las fotos se juntan aquí en un solo PDF; el
    // servidor solo recibe PDF y lo guarda en la carpeta de la responsiva (LineasIdentificaciones).
    const INE_MAX_FOTOS = 4;
    const INE_MAX_MB = 15;

    function htmlIdentificacion(e, id) {
      const tipo = e.conTipo ? '<select data-ine-tipo aria-label="Tipo de identificación">' +
        (e.opciones || []).map((o) => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('') + '</select>' : '';
      return '<div class="ln-ine" data-ine-orden="' + Number(e.orden || 0) + '">' + tipo +
        '<div class="ln-ine-registrada" hidden></div>' +
        '<div class="ln-fotos-botones">' +
        '<label class="ln-upload ln-solo-tactil">' + icono('camera') + '<span><b>Tomar foto</b><small>Con la cámara del equipo</small></span>' +
        '<input type="file" accept="image/*" capture="environment" data-ine-archivo /></label>' +
        '<label class="ln-upload">' + icono('id-card') + '<span><b>Elegir fotos o PDF</b><small>De la galería o de la computadora</small></span>' +
        '<input type="file" id="' + id + '" accept="image/*,application/pdf" multiple data-ine-archivo /></label></div>' +
        '<div class="ln-ine-lista"></div></div>';
    }

    // Paso 3 (pendiente 2.29): de quién es cada apartado, para buscar su identificación registrada
    const columnasResponsable = (orden) => (orden === 0 ? ['RESPONSABLE', 'No EMPLEADO', 'CORREO']
      : ['NOMBRE ' + ORDEN_ADICIONALES[orden - 1] + ' RESPONSABLE', 'NO EMPLEADO ' + ORDEN_ADICIONALES[orden - 1] + ' RESPONSABLE', '']);
    const COLUMNAS_IDENTIFICADO = [0, 1, 2, 3, 4].reduce((a, o) => a.concat(columnasResponsable(o).filter(Boolean)), []);

    /**
     * Lo elegido en cada apartado vive en el propio elemento: caja._ine = { pdf, fotos: [{ archivo, url }], reutilizar },
     * caja._registrada = la identificación que ya tiene la persona en el registro (o null) y caja._clave = de quién se
     * buscó (nombre|número). Con una registrada se pregunta «¿Es correcta?»: sí = se usa esa (reutilizar = su registro).
     */
    function activarIdentificaciones(cuerpo) {
      const pintarRegistrada = (caja) => {
        const r = caja._registrada;
        const s = caja._ine;
        const bloque = caja.querySelector('.ln-ine-registrada');
        const usa = !!(r && s.reutilizar);
        bloque.hidden = !r || r.descartada;
        caja.querySelector('.ln-fotos-botones').hidden = usa;
        caja.querySelector('.ln-ine-lista').hidden = usa;
        if (bloque.hidden) { bloque.innerHTML = ''; return; }
        const detalle = [r.tipo || 'INE', 'registrada', r.nuco ? 'NUCO ' + r.nuco : '', r.fecha].filter(Boolean).join(' · ');
        bloque.innerHTML = icono('id-card') + '<span class="ln-ine-registrada-texto">' + esc(detalle) + '</span>' +
          '<a href="https:\/\/drive.google.com/file/d/' + esc(r.archivoId) + '/view" target="_blank" rel="noopener">Ver</a>' +
          (usa ? '<button type="button" class="secondary ln-btn-chico" data-ine-registrada="cambiar">Cambiar</button>'
            : '<span class="ln-ine-pregunta">¿Es correcta?</span>' +
              '<button type="button" class="primary ln-btn-chico" data-ine-registrada="si">Sí</button>' +
              '<button type="button" class="secondary ln-btn-chico" data-ine-registrada="no">No</button>');
        pintarIconos(bloque);
      };
      const pintar = (caja) => {
        const s = caja._ine;
        const lista = caja.querySelector('.ln-ine-lista');
        pintarRegistrada(caja);
        lista.innerHTML = s.pdf
          // El PDF como las fotos, con su carátula (usuario, 13-oct)
          ? htmlMiniaturaPdf(s.pdf.url, s.pdf.archivo.name, s.pdf.caratula, '<button type="button" data-ine-quitar="pdf" aria-label="Quitar">' + icono('x', 'ln-icon-sm') + '</button>')
          : s.fotos.map((f, i) => '<span class="ln-miniatura"><img src="' + esc(f.url) + '" alt="' + esc(f.archivo.name) + '" data-ver-foto />' +
            '<button type="button" data-ine-quitar="' + i + '" aria-label="Quitar">' + icono('x', 'ln-icon-sm') + '</button></span>').join('');
        pintarIconos(lista);
      };
      const vaciar = (caja) => {
        const s = caja._ine;
        if (s.pdf) URL.revokeObjectURL(s.pdf.url);
        s.fotos.forEach((f) => URL.revokeObjectURL(f.url));
        caja._ine = { pdf: null, fotos: [], reutilizar: null };
      };
      const cajaDe = (orden) => cuerpo.querySelector('.ln-ine[data-ine-orden="' + orden + '"]');
      // La registrada de cada responsable: se busca cuando cambia su nombre o su número (una vez por persona)
      const buscarRegistradas = () => {
        const valor = (col) => { const el = col && cuerpo.querySelector('[data-columna="' + CSS.escape(col) + '"]'); return el ? String(el.value || '').trim() : ''; };
        const pedir = [];
        cuerpo.querySelectorAll('.ln-ine').forEach((caja) => {
          const orden = Number(caja.dataset.ineOrden);
          const [nombre, numero, correo] = columnasResponsable(orden).map(valor);
          const clave = (nombre + '|' + numero).toUpperCase();
          if (clave === caja._clave) return;
          caja._clave = clave;
          caja._registrada = null;
          caja._ine.reutilizar = null;
          pintarRegistrada(caja);
          if (nombre) pedir.push({ orden: orden, nombre: nombre, noEmpleado: numero, correo: correo, clave: clave });
        });
        if (!pedir.length) return;
        llamar('apiLineasIdentificacionesRegistradas', pedir.map((p) => ({ orden: p.orden, nombre: p.nombre, noEmpleado: p.noEmpleado, correo: p.correo })))
          .then((r) => (r || []).forEach((x) => {
            const caja = cajaDe(x.orden);
            const pedida = pedir.filter((p) => p.orden === x.orden)[0];
            // Si mientras tanto cambió la persona, esta respuesta ya no es suya
            if (!caja || !pedida || caja._clave !== pedida.clave || !x.registrada) return;
            caja._registrada = x.registrada;
            pintarRegistrada(caja);
          }))
          .catch(() => { /* sin la registrada: se sube como siempre */ });
      };
      cuerpo.querySelectorAll('.ln-ine').forEach((caja) => { caja._ine = { pdf: null, fotos: [], reutilizar: null }; caja._registrada = null; caja._clave = null; });
      cuerpo._buscarRegistradas = buscarRegistradas;
      buscarRegistradas();
      // El cuerpo del modal se reutiliza (Editar, inspección, responsiva): se escucha una sola vez, como activarAdicionales
      if (cuerpo._identificacionesActivas) return;
      cuerpo._identificacionesActivas = true;
      let espera = null;
      cuerpo.addEventListener('change', (ev) => {
        if (!ev.target.matches || !ev.target.matches('[data-columna]') || COLUMNAS_IDENTIFICADO.indexOf(ev.target.dataset.columna) < 0) return;
        clearTimeout(espera);
        espera = setTimeout(() => cuerpo._buscarRegistradas && cuerpo._buscarRegistradas(), 300);
      });
      cuerpo.addEventListener('change', (ev) => {
        const input = ev.target.closest('input[data-ine-archivo]');
        if (!input) return;
        const caja = input.closest('.ln-ine');
        const archivos = Array.from(input.files || []);
        input.value = '';
        if (!archivos.length) return;
        const pdfs = archivos.filter((a) => a.type === 'application/pdf' || /\.pdf$/i.test(a.name));
        const fotos = archivos.filter((a) => pdfs.indexOf(a) < 0);
        const error = (t) => aviso(icono('triangle-alert', 'ln-alerta') + ' ' + esc(t), 7000);
        if (pdfs.length && fotos.length) return error('Elige fotos o un PDF, no los dos.');
        if (pdfs.length > 1) return error('Elige un solo PDF.');
        if (archivos.some((a) => a.size > INE_MAX_MB * 1024 * 1024)) return error('El archivo supera ' + INE_MAX_MB + ' MB.');
        if (pdfs.length) {
          vaciar(caja);
          const pdf = { archivo: pdfs[0], url: URL.createObjectURL(pdfs[0]), caratula: null };
          caja._ine.pdf = pdf;
          caratulaPdf(pdfs[0]).then((c) => { if (caja._ine.pdf === pdf) { pdf.caratula = c; pintar(caja); } }).catch(() => { /* sin carátula: el ícono */ });
        } else {
          if (caja._ine.pdf) vaciar(caja);
          if (caja._ine.fotos.length + fotos.length > INE_MAX_FOTOS) return error('Son hasta ' + INE_MAX_FOTOS + ' fotos.');
          fotos.forEach((a) => caja._ine.fotos.push({ archivo: a, url: URL.createObjectURL(a) }));
        }
        pintar(caja);
      });
      cuerpo.addEventListener('click', (ev) => {
        const respuesta = ev.target.closest('[data-ine-registrada]');
        if (respuesta) {
          const caja = respuesta.closest('.ln-ine');
          const r = caja._registrada;
          if (!r) return;
          if (respuesta.dataset.ineRegistrada === 'si') { vaciar(caja); caja._ine.reutilizar = r.registro; }
          else if (respuesta.dataset.ineRegistrada === 'no') { r.descartada = true; caja._ine.reutilizar = null; }
          else caja._ine.reutilizar = null;
          pintar(caja);
          return;
        }
        const quitar = ev.target.closest('[data-ine-quitar]');
        if (quitar) {
          const caja = quitar.closest('.ln-ine');
          const s = caja._ine;
          if (quitar.dataset.ineQuitar === 'pdf') vaciar(caja);
          else { const f = s.fotos.splice(Number(quitar.dataset.ineQuitar), 1)[0]; if (f) URL.revokeObjectURL(f.url); }
          pintar(caja);
          return;
        }
        // Al quitar un responsable adicional, los de abajo suben un lugar (activarAdicionales): sus identificaciones también
        const otro = ev.target.closest('[data-quitar-adicional]');
        if (otro) {
          const desde = Number(otro.dataset.quitarAdicional) + 1;
          if (!cajaDe(desde)) return;
          vaciar(cajaDe(desde));
          cajaDe(desde)._registrada = null;
          cajaDe(desde)._clave = null;
          for (let orden = desde; orden < ORDEN_ADICIONALES.length; orden++) {
            const actual = cajaDe(orden), siguiente = cajaDe(orden + 1);
            if (!actual || !siguiente) break;
            actual._ine = siguiente._ine;
            actual._registrada = siguiente._registrada;
            actual._clave = siguiente._clave;
            siguiente._ine = { pdf: null, fotos: [], reutilizar: null };
            siguiente._registrada = null;
            siguiente._clave = null;
            const t1 = actual.querySelector('[data-ine-tipo]'), t2 = siguiente.querySelector('[data-ine-tipo]');
            if (t1 && t2) { t1.value = t2.value; t2.selectedIndex = 0; }
          }
          cuerpo.querySelectorAll('.ln-ine').forEach(pintar);
        }
      });
    }

    /** La foto en grande (identificación e inspección), para revisarla antes de guardar. */
    function verFotoEnGrande(url) {
      verFotos([{ grande: url }], 0);
    }

    // ---- Arrastrar y soltar archivos y carátula de los PDF (usuario, 13-oct; pendiente 2.42) ----
    // Soltar archivos sobre un botón de subir (.ln-upload) o un campo de archivo (.ln-af-archivo) es como elegirlos: se
    // ponen en su input y se avisa con 'change', así cada pantalla los maneja como siempre. Fuera de esos lugares, dentro
    // de Líneas, soltar un archivo no hace nada (el navegador no lo abre encima de la app).
    const ZONAS_SOLTAR = '.ln-upload, .ln-af-archivo';
    const conArchivos = (ev) => !!(ev.dataTransfer && Array.from(ev.dataTransfer.types || []).indexOf('Files') >= 0);
    const inputDeZona = (zona) => zona.querySelector('input[type="file"]:not([capture]):not([disabled])');
    /** ¿El archivo entra en el accept del input? («image/*», «application/pdf», «.pdf»; sin accept, todo). */
    function aceptaArchivo(input, archivo) {
      const reglas = String(input.accept || '').split(',').map((x) => x.trim().toLowerCase()).filter(Boolean);
      if (!reglas.length) return true;
      const tipo = String(archivo.type || '').toLowerCase();
      const nombre = String(archivo.name || '').toLowerCase();
      return reglas.some((r) => (r.charAt(0) === '.' ? nombre.slice(-r.length) === r
        : r.slice(-1) === '*' ? tipo.indexOf(r.slice(0, -1)) === 0 : tipo === r)); // «image/» + comodín
    }
    let zonaEncima = null;
    const marcarZona = (zona) => {
      if (zonaEncima === zona) return;
      if (zonaEncima) zonaEncima.classList.remove('ln-soltar');
      zonaEncima = zona;
      if (zona) zona.classList.add('ln-soltar');
    };
    // Mientras se arrastran archivos sobre Líneas, todos los lugares para soltar se marcan («Suelta aquí», usuario 13-oct);
    // se quita solo si deja de llegar dragover (salió de la ventana o se soltó)
    let finArrastre = null;
    const arrastrando = (si) => {
      clearTimeout(finArrastre);
      document.documentElement.classList.toggle('ln-arrastrando', si);
      if (si) finArrastre = setTimeout(() => { arrastrando(false); marcarZona(null); }, 250);
    };
    document.addEventListener('dragover', (ev) => {
      if (!conArchivos(ev) || !ev.target.closest || !ev.target.closest('.ln-modulo')) return;
      ev.preventDefault();
      arrastrando(true);
      const zona = ev.target.closest(ZONAS_SOLTAR);
      const input = zona && inputDeZona(zona);
      ev.dataTransfer.dropEffect = input ? 'copy' : 'none';
      marcarZona(input ? zona : null);
    });
    document.addEventListener('dragleave', (ev) => { if (zonaEncima && !zonaEncima.contains(ev.relatedTarget)) marcarZona(null); });
    document.addEventListener('drop', (ev) => {
      if (!conArchivos(ev) || !ev.target.closest || !ev.target.closest('.ln-modulo')) return;
      ev.preventDefault();
      marcarZona(null);
      arrastrando(false);
      const zona = ev.target.closest(ZONAS_SOLTAR);
      const input = zona && inputDeZona(zona);
      if (!input) return;
      const archivos = Array.from(ev.dataTransfer.files || []);
      const sirven = archivos.filter((a) => aceptaArchivo(input, a)).slice(0, input.multiple ? archivos.length : 1);
      if (!sirven.length) { aviso(icono('triangle-alert', 'ln-alerta') + ' Ese tipo de archivo no se puede subir aquí.', 6000); return; }
      const dt = new DataTransfer();
      sirven.forEach((a) => dt.items.add(a));
      input.files = dt.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    });

    // Carátula (primera hoja) de un PDF, como imagen, con pdf.js; se carga la primera vez que hace falta
    const URL_PDFJS = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    let cargandoPdfJs = null;
    function cargarPdfJs() {
      if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
      if (!cargandoPdfJs) {
        cargandoPdfJs = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = URL_PDFJS + 'pdf.min.js';
          script.onload = () => {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL_PDFJS + 'pdf.worker.min.js';
            resolve(window.pdfjsLib);
          };
          script.onerror = () => { cargandoPdfJs = null; reject(new Error('No se pudo cargar el lector de PDF.')); };
          document.head.appendChild(script);
        });
      }
      return cargandoPdfJs;
    }
    /** archivo (File o Blob de un PDF) → promesa con la carátula en data URL (JPEG de `ancho` px). */
    function caratulaPdf(archivo, ancho) {
      return Promise.all([cargarPdfJs(), archivo.arrayBuffer()])
        .then(([pdfjs, datos]) => pdfjs.getDocument({ data: datos }).promise)
        .then((pdf) => pdf.getPage(1))
        .then((pagina) => {
          const vista = pagina.getViewport({ scale: (ancho || 360) / pagina.getViewport({ scale: 1 }).width });
          const lienzo = document.createElement('canvas');
          lienzo.width = Math.round(vista.width);
          lienzo.height = Math.round(vista.height);
          const ctx = lienzo.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, lienzo.width, lienzo.height);
          return pagina.render({ canvasContext: ctx, viewport: vista }).promise.then(() => lienzo.toDataURL('image/jpeg', 0.85));
        });
    }
    const esPdf = (archivo) => archivo.type === 'application/pdf' || /\.pdf$/i.test(archivo.name || '');
    /**
     * Miniatura de un PDF elegido: su carátula (al llegar; mientras, el ícono) con la etiqueta PDF; clic = el PDF en otra
     * pestaña. `quitar`: el HTML del botón para quitarlo.
     */
    function htmlMiniaturaPdf(url, nombre, caratula, quitar) {
      return '<span class="ln-miniatura ln-miniatura-pdf"><a href="' + esc(url) + '" target="_blank" rel="noopener" title="' + esc(nombre) + '">' +
        (caratula ? '<img src="' + esc(caratula) + '" alt="' + esc(nombre) + '" />' : icono('file-text')) + '</a>' +
        '<span class="ln-miniatura-etiqueta">PDF</span>' + (quitar || '') + '</span>';
    }

    // Campo de archivo (Editar): lo elegido o soltado se ve en miniatura, la foto o la carátula del PDF, con X para quitarlo
    document.addEventListener('change', (ev) => {
      const input = ev.target.closest && ev.target.closest('.ln-af-archivo input[type="file"][data-archivo]');
      if (!input) return;
      const caja = input.closest('.ln-af-archivo');
      const anterior = caja.querySelector('.ln-af-vista');
      if (anterior) { if (anterior._url) URL.revokeObjectURL(anterior._url); anterior.remove(); }
      const archivo = input.files && input.files[0];
      if (!archivo) return;
      const vista = document.createElement('div');
      vista.className = 'ln-af-vista';
      vista._url = URL.createObjectURL(archivo);
      const quitar = '<button type="button" data-af-quitar aria-label="Quitar">' + icono('x', 'ln-icon-sm') + '</button>';
      const pintar = (caratula) => {
        vista.innerHTML = esPdf(archivo) ? htmlMiniaturaPdf(vista._url, archivo.name, caratula, quitar)
          : '<span class="ln-miniatura"><img src="' + esc(vista._url) + '" alt="' + esc(archivo.name) + '" data-ver-foto />' + quitar + '</span>';
        pintarIconos(vista);
      };
      pintar(null);
      caja.appendChild(vista);
      if (esPdf(archivo)) caratulaPdf(archivo).then((c) => { if (vista.isConnected) pintar(c); }).catch(() => { /* sin carátula: el ícono */ });
    });
    document.addEventListener('click', (ev) => {
      const b = ev.target.closest && ev.target.closest('[data-af-quitar]');
      if (!b) return;
      const caja = b.closest('.ln-af-archivo');
      const input = caja && caja.querySelector('input[type="file"][data-archivo]');
      if (input) { input.value = ''; input.dispatchEvent(new Event('change', { bubbles: true })); }
    });

    /** La miniatura de Drive (thumbnailLink, «…=s220») en otro tamaño. */
    const miniaturaDe = (url, lado) => String(url || '').replace(/=s\d+(-[a-z0-9-]+)?$/i, '') + '=s' + lado;
    /** La foto grande del visor (la de Drive a 2400 px), pedida antes para que abra nítida. */
    const fotoGrande = (f) => f.grande || (f.miniatura ? miniaturaDe(f.miniatura, 2400) : '');
    const fotosPedidas = {};
    function pedirFotoGrande(f) {
      const url = fotoGrande(f);
      if (!url || fotosPedidas[url]) return;
      const pre = new Image();
      pre.referrerPolicy = 'no-referrer';
      pre.src = url;
      fotosPedidas[url] = pre;
    }

    /**
     * Visor de fotos (usuario, 13-oct: «que se amplíe para verlo más cerca», en vez de mandar a Drive). fotos: [{ grande,
     * miniatura, nombre, enlace, id }]; se pasa con las flechas (teclado o botones), clic en la foto la acerca y la sigue
     * el cursor, Escape o la X cierran. o.alQuitar(foto) (promesa): botón «Quitar foto»; si se quita, sale de la lista.
     */
    function verFotos(fotos, inicio, opciones) {
      const o = opciones || {};
      const lista = fotos.slice();
      let i = Math.max(0, Math.min(inicio || 0, lista.length - 1));
      const capa = document.createElement('div');
      capa.className = 'ln-visor';
      capa.setAttribute('role', 'dialog');
      capa.setAttribute('aria-modal', 'true');
      capa.innerHTML = '<div class="ln-visor-barra"><span class="ln-visor-nombre" data-nombre></span><span class="ln-visor-cuenta" data-cuenta></span>' +
        '<span class="ln-visor-botones">' +
        '<a class="ln-visor-boton" data-drive target="_blank" rel="noopener" title="Abrir en Drive">' + ico('external-link') + '<span>Abrir en Drive</span></a>' +
        (o.alQuitar ? '<button type="button" class="ln-visor-boton ln-visor-quitar" data-quitar title="Quitar foto">' + ico('trash-2') + '<span>Quitar foto</span></button>' : '') +
        '<button type="button" class="ln-visor-boton" data-cerrar title="Cerrar" aria-label="Cerrar">' + ico('x') + '</button></span></div>' +
        '<div class="ln-visor-escena" data-escena><img alt="" data-img /></div>' +
        '<button type="button" class="ln-visor-flecha ln-visor-anterior" data-paso="-1" aria-label="Anterior">' + ico('chevron-left') + '</button>' +
        '<button type="button" class="ln-visor-flecha ln-visor-siguiente" data-paso="1" aria-label="Siguiente">' + ico('chevron-right') + '</button>';
      const img = capa.querySelector('[data-img]');
      const escena = capa.querySelector('[data-escena]');
      const cerrar = () => { capa.remove(); document.removeEventListener('keydown', tecla, true); };
      const acercar = (si, ev) => {
        escena.classList.toggle('ln-visor-cerca', si);
        if (si && ev) seguir(ev);
        else img.style.transformOrigin = '';
      };
      const seguir = (ev) => {
        const r = img.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const x = Math.max(0, Math.min(100, (ev.clientX - r.left) / r.width * 100));
        const y = Math.max(0, Math.min(100, (ev.clientY - r.top) / r.height * 100));
        img.style.transformOrigin = x + '% ' + y + '%';
      };
      const mostrar = () => {
        if (!lista.length) { cerrar(); return; }
        const f = lista[i];
        acercar(false);
        // Primero la miniatura que ya se ve; luego la grande
        const grande = fotoGrande(f);
        const pedida = fotosPedidas[grande];
        // Ya llegó (se pidió al pasar el cursor o al ver la de al lado): directo la grande
        img.src = pedida && pedida.complete && pedida.naturalWidth ? grande : (f.miniatura || grande);
        if (grande && grande !== img.src) {
          const pre = new Image();
          pre.referrerPolicy = 'no-referrer';
          pre.onload = () => { if (lista[i] === f) img.src = grande; };
          pre.src = grande;
          fotosPedidas[grande] = pre;
        }
        // La anterior y la siguiente, para que las flechas también abran nítidas
        if (lista.length > 1) { pedirFotoGrande(lista[(i + 1) % lista.length]); pedirFotoGrande(lista[(i - 1 + lista.length) % lista.length]); }
        capa.querySelector('[data-nombre]').textContent = f.nombre || '';
        capa.querySelector('[data-cuenta]').textContent = lista.length > 1 ? (i + 1) + ' de ' + lista.length : '';
        const drive = capa.querySelector('[data-drive]');
        drive.hidden = !f.enlace;
        if (f.enlace) drive.href = f.enlace;
        capa.querySelectorAll('[data-paso]').forEach((b) => { b.hidden = lista.length < 2; });
      };
      const pasar = (n) => { if (lista.length > 1) { i = (i + n + lista.length) % lista.length; mostrar(); } };
      const quitar = () => {
        const f = lista[i];
        o.alQuitar(f).then((hecho) => {
          if (!hecho || !document.body.contains(capa)) return;
          lista.splice(lista.indexOf(f), 1);
          i = Math.min(i, lista.length - 1);
          mostrar();
        });
      };
      const tecla = (ev) => {
        // Una ventana o un menú abiertos encima (Quitar foto, clic derecho) tienen sus teclas; la captura de abajo no
        if (document.querySelector('.ln-menu-flotante')) return;
        if (Array.from(document.querySelectorAll('.modal-backdrop')).some((m) => capa.compareDocumentPosition(m) & Node.DOCUMENT_POSITION_FOLLOWING)) return;
        if (ev.key === 'Escape') { ev.stopPropagation(); cerrar(); }
        else if (ev.key === 'ArrowLeft') pasar(-1);
        else if (ev.key === 'ArrowRight') pasar(1);
      };
      img.referrerPolicy = 'no-referrer';
      // La foto ocupa toda la escena (object-fit: contain): lo que se ve de ella es este rectángulo; alrededor es fondo
      const sobreFoto = (ev) => {
        const r = img.getBoundingClientRect();
        const nw = img.naturalWidth;
        const nh = img.naturalHeight;
        if (!nw || !nh || !r.width || !r.height) return true;
        const k = Math.min(r.width / nw, r.height / nh);
        const ancho = nw * k;
        const alto = nh * k;
        const x = ev.clientX - r.left - (r.width - ancho) / 2;
        const y = ev.clientY - r.top - (r.height - alto) / 2;
        return x >= 0 && y >= 0 && x <= ancho && y <= alto;
      };
      // Clic fuera de la foto cierra (usuario, 13-oct: antes acercaba aunque fuera en lo oscuro); acercada, cualquier clic aleja
      img.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const cerca = escena.classList.contains('ln-visor-cerca');
        if (!cerca && !sobreFoto(ev)) { cerrar(); return; }
        acercar(!cerca, ev);
      });
      img.addEventListener('mousemove', (ev) => {
        const cerca = escena.classList.contains('ln-visor-cerca');
        if (cerca) seguir(ev);
        img.style.cursor = cerca ? 'zoom-out' : (sobreFoto(ev) ? 'zoom-in' : 'default');
      });
      img.addEventListener('error', () => {
        const f = lista[i];
        if (f && f.miniatura && img.src !== f.miniatura) img.src = f.miniatura;
      });
      capa.addEventListener('click', (ev) => {
        const paso = ev.target.closest('[data-paso]');
        if (paso) { pasar(Number(paso.dataset.paso)); return; }
        if (ev.target.closest('[data-quitar]')) { quitar(); return; }
        if (ev.target.closest('[data-cerrar]') || ev.target === escena || ev.target === capa) cerrar();
      });
      document.addEventListener('keydown', tecla, true);
      // El menú del clic derecho de la galería no se queda encima del visor (usuario, 13-oct); el visor no tiene el suyo
      cerrarMenusFlotantes();
      document.body.appendChild(capa);
      pintarIconos(capa);
      mostrar();
    }

    /**
     * Lo que va al servidor: [{ orden, tipo, base64 }] de cada responsable que sigue en la responsiva (con nombre). Las
     * fotos van en un PDF; un PDF va tal cual. La registrada que se confirmó va como { orden, tipo, reutilizar }.
     */
    function leerIdentificaciones(cuerpo, valores) {
      const nombreDe = (orden) => String(valores[orden === 0 ? 'RESPONSABLE' : 'NOMBRE ' + ORDEN_ADICIONALES[orden - 1] + ' RESPONSABLE'] || '').trim();
      const cajas = Array.from(cuerpo.querySelectorAll('.ln-ine')).filter((caja) => {
        const s = caja._ine;
        const campo = caja.closest('.ln-af-campo');
        return s && (s.pdf || s.fotos.length || s.reutilizar) && !(campo && campo.hidden) && nombreDe(Number(caja.dataset.ineOrden));
      });
      return Promise.all(cajas.map((caja) => {
        const s = caja._ine;
        const tipo = caja.querySelector('[data-ine-tipo]');
        if (s.reutilizar) return { orden: Number(caja.dataset.ineOrden), tipo: tipo ? tipo.value : '', reutilizar: s.reutilizar };
        const bytes = s.pdf ? s.pdf.archivo.arrayBuffer().then((b) => new Uint8Array(b)) : pdfDeFotos(s.fotos.map((f) => f.archivo));
        return bytes.then((b) => {
          if (b.length > INE_MAX_MB * 1024 * 1024) throw new Error('La identificación de ' + nombreDe(Number(caja.dataset.ineOrden)) + ' supera ' + INE_MAX_MB + ' MB.');
          return { orden: Number(caja.dataset.ineOrden), tipo: tipo ? tipo.value : '', base64: base64DeBytes(b) };
        });
      }));
    }

    function base64DeBytes(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(bin);
    }

    /**
     * Fotos → un PDF carta, dos por hoja (frente arriba, vuelta abajo), enteras y centradas; una sola foto ocupa la hoja.
     * Cada foto se vuelve a guardar como JPEG de calidad .92 y hasta 2400 px por lado (el navegador ya la endereza): una
     * identificación se sigue leyendo igual al acercarse y el archivo no pesa de más. Sin librerías: el JPEG va tal cual
     * dentro del PDF (DCTDecode).
     */
    function pdfDeFotos(archivos) {
      return Promise.all(archivos.map((a) => jpegDeFoto(a, 2400, 0.92))).then(armarPdfDeJpeg);
    }

    function jpegDeFoto(archivo, maxDim, calidad) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(archivo);
        const img = new Image();
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(archivo.name + ': no se pudo leer la imagen.')); };
        img.onload = () => {
          const k = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * k));
          const h = Math.max(1, Math.round(img.naturalHeight * k));
          const lienzo = document.createElement('canvas');
          lienzo.width = w; lienzo.height = h;
          const g = lienzo.getContext('2d');
          g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
          g.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          const bin = atob(lienzo.toDataURL('image/jpeg', calidad).split(',')[1]);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          resolve({ ancho: w, alto: h, bytes: bytes });
        };
        img.src = url;
      });
    }

    function armarPdfDeJpeg(fotos) {
      const texto = new TextEncoder();
      const partes = [];
      const posiciones = [];
      let largo = 0;
      const poner = (x) => { const b = typeof x === 'string' ? texto.encode(x) : x; partes.push(b); largo += b.length; };
      const ANCHO = 612, ALTO = 792, MARGEN = 36, ENTRE = 18, POR_HOJA = 2;
      const hojas = [];
      for (let i = 0; i < fotos.length; i += POR_HOJA) hojas.push(fotos.slice(i, i + POR_HOJA));
      let n = 3;
      const objetos = hojas.map((fs) => ({ pagina: n++, contenido: n++, fotos: fs.map(() => n++) }));
      const total = n - 1;
      const objeto = (num, dicc, flujo) => {
        posiciones[num] = largo;
        poner(num + ' 0 obj\n' + dicc);
        if (flujo) { poner('\nstream\n'); poner(flujo); poner('\nendstream'); }
        poner('\nendobj\n');
      };
      poner('%PDF-1.4\n');
      poner(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
      objeto(1, '<< /Type /Catalog /Pages 2 0 R >>');
      objeto(2, '<< /Type /Pages /Kids [' + objetos.map((o) => o.pagina + ' 0 R').join(' ') + '] /Count ' + hojas.length + ' >>');
      const anchoCelda = ANCHO - 2 * MARGEN;
      const altoCelda = fotos.length === 1 ? ALTO - 2 * MARGEN : (ALTO - 2 * MARGEN - ENTRE * (POR_HOJA - 1)) / POR_HOJA;
      hojas.forEach((fs, h) => {
        const o = objetos[h];
        const dibujo = fs.map((f, i) => {
          const k = Math.min(anchoCelda / f.ancho, altoCelda / f.alto);
          const w = f.ancho * k, alto = f.alto * k;
          const x = MARGEN + (anchoCelda - w) / 2;
          const y = ALTO - MARGEN - i * (altoCelda + ENTRE) - (altoCelda - alto) / 2 - alto;
          return 'q ' + w.toFixed(2) + ' 0 0 ' + alto.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' cm /F' + i + ' Do Q';
        }).join('\n');
        objeto(o.pagina, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + ANCHO + ' ' + ALTO + '] /Resources << /XObject << ' +
          fs.map((f, i) => '/F' + i + ' ' + o.fotos[i] + ' 0 R').join(' ') + ' >> >> /Contents ' + o.contenido + ' 0 R >>');
        const c = texto.encode(dibujo);
        objeto(o.contenido, '<< /Length ' + c.length + ' >>', c);
        fs.forEach((f, i) => objeto(o.fotos[i], '<< /Type /XObject /Subtype /Image /Width ' + f.ancho + ' /Height ' + f.alto +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + f.bytes.length + ' >>', f.bytes));
      });
      const inicioTabla = largo;
      let tabla = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
      for (let i = 1; i <= total; i++) tabla += String(posiciones[i]).padStart(10, '0') + ' 00000 n \n';
      poner(tabla + 'trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + inicioTabla + '\n%%EOF\n');
      const salida = new Uint8Array(largo);
      let p = 0;
      partes.forEach((b) => { salida.set(b, p); p += b.length; });
      return salida;
    }

    /**
     * Aviso flotante. Usa Notificar (toasts del sistema); el HTML se reduce a texto y los
     * que traen el ícono de alerta salen como error. Sin Notificar, cae al aviso propio.
     */
    function aviso(html, duracion) {
      if (typeof Notificar !== 'undefined') {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        const texto = tmp.textContent.trim();
        if (/ln-alerta/.test(html)) Notificar.error(texto, duracion ? { duracion: duracion } : undefined);
        else Notificar.exito(texto, duracion ? { duracion: duracion } : undefined);
        return;
      }
      let caja = document.getElementById('ln-avisos');
      if (!caja) {
        caja = document.createElement('div');
        caja.id = 'ln-avisos';
        document.body.appendChild(caja);
      }
      const item = document.createElement('div');
      item.className = 'ln-aviso';
      item.innerHTML = '<div>' + html + '</div><button type="button" class="modal-close" aria-label="Cerrar">' + icono('x') + '</button>';
      item.querySelector('button').addEventListener('click', () => item.remove());
      caja.appendChild(item);
      if (duracion) setTimeout(() => item.remove(), duracion);
    }
    const mensajeError = (e) => esc(e && e.message ? e.message : e);

    /** Copia texto al portapapeles; dentro del iframe de Apps Script cae a execCommand si la API no está permitida. */
    function copiarTexto(texto) {
      const conArea = () => {
        const area = document.createElement('textarea');
        area.value = texto;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        area.remove();
        return ok;
      };
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texto).then(() => true, conArea);
      return Promise.resolve(conArea());
    }

    // ---------------- Estado del módulo ----------------
    // Se conserva entre navegaciones (los catálogos viven en callServerCacheado, api.html).
    const POR_PAGINA = 50;
    const VIGENCIA_INDICE_MS = 15 * 60 * 1000;
    const memoria = {
      indice: null,
      cargadoEn: 0,
      indicePendiente: null,
      tablas: {}, // última respuesta de cada bitácora / trámite: se pinta al instante y luego se actualiza
      modulo: 'equipos',
      modoVista: null, // 'tabla' | 'tarjetas' (se recuerda en el navegador)
      abrirAlEntrar: null, // id de registro a abrir al entrar a Líneas Telefónicas (desde una bitácora)
      filtrarAlEntrar: null, // { modulo, estatus }: filtro al entrar a Líneas Telefónicas (desde el Panorama)
    };
    const montaje = { n: 0 }; // cambia en cada init: respuestas tardías de una vista anterior se ignoran

    function filasComoObjetos(ix) {
      return ix.filas.map((f) => {
        const o = {};
        ix.columnas.forEach((c, i) => { o[c] = f[i]; });
        return o;
      });
    }

    /**
     * El índice es una lista como las de los demás módulos (callServerListaCacheada, api.html; fase 5.2b): con la copia
     * del navegador se pinta AL INSTANTE y por detrás se pide lo fresco; el vigía pregunta cada minuto si cambió (huella:
     * LineasRepo.huellaIndice_). Cuando llega distinto ("lista-actualizada") se vuelve a armar memoria.indice, que es lo
     * que se pinta (y lo que aplicarCambiosIndice parcha después de una acción). La copia guardada va SIN los PIN
     * (guardarListaLimpia): a un ADMIN el servidor se los manda, pero en una computadora compartida no deben quedar.
     */
    guardarListaLimpia('apiLineasIndice', sinSecretos_);
    function cargarIndice(forzar) {
      if (!forzar && memoria.indicePendiente) return memoria.indicePendiente;
      if (!forzar && memoria.indice && Date.now() - memoria.cargadoEn < VIGENCIA_INDICE_MS) return Promise.resolve(memoria.indice);
      if (forzar) invalidarCacheLista('apiLineasIndice', state.token);
      return pedirIndice_();
    }

    function pedirIndice_() {
      const p = callServerListaCacheada('apiLineasIndice', state.token).then(procesarIndice_);
      memoria.indicePendiente = p;
      const soltar = () => { if (memoria.indicePendiente === p) memoria.indicePendiente = null; };
      p.then(soltar, soltar);
      return p;
    }
    // Llegó un índice distinto (de otra persona, de la hoja o el real de un ADMIN): se vuelve a armar antes de que la
    // pantalla repinte (escucharLista de Líneas Telefónicas pide cargarIndice(), que espera a este)
    window.addEventListener('lista-actualizada', (ev) => {
      if (ev.detail && ev.detail.fn === 'apiLineasIndice' && memoria.indice) pedirIndice_().catch(() => { /* se queda el que hay */ });
    });

    /** Copia del índice con las columnas secretas (PIN WHATSAPP, PIN EQUIPO) en "••••", como las ve quien no es ADMIN */
    function sinSecretos_(r) {
      const vista = r && r.vista;
      if (!vista || !(vista.secretas || []).length) return r;
      const posiciones = vista.secretas.map((c) => vista.columnas.indexOf(c) + 1).filter((i) => i > 0);
      const conPinReal = (fila) => posiciones.some((i) => fila[i] && fila[i] !== '••••');
      if (!vista.filas.some(conPinReal)) return r;   // ya venía sin PIN (quien no es ADMIN): la misma
      return Object.assign({}, r, {
        vista: Object.assign({}, vista, {
          filas: vista.filas.map((fila) => {
            if (!conPinReal(fila)) return fila;
            const copia = fila.slice();
            posiciones.forEach((i) => { if (copia[i]) copia[i] = '••••'; });
            return copia;
          }),
        }),
      });
    }

    const porNucoIndice_ = (a, b) => {
      const na = Number(a.nuco || a.nucoEquipo);
      const nb = Number(b.nuco || b.nucoEquipo);
      if (isNaN(na) && isNaN(nb)) return 0;
      if (isNaN(na)) return 1;
      if (isNaN(nb)) return -1;
      return na - nb;
    };

    /**
     * Rapidez (etapa 3, paso 2): después de una acción el servidor regresa solo los registros que cambiaron
     * (LineasRepo.refrescarIndice: { equipos, lineas, vista, quitar }). Se cambian en el índice que ya está en memoria en
     * vez de volver a pedirlo completo. Si no vienen (o no hay índice en memoria), se pide completo, como antes.
     */
    function aplicarCambiosIndice(cambios) {
      const ix = memoria.indice;
      if (!ix || !memoria.vistaColumnas || !cambios || !Array.isArray(cambios.equipos) || !Array.isArray(cambios.lineas) || !Array.isArray(cambios.vista)) {
        return cargarIndice(true);
      }
      const vista = {};
      cambios.vista.forEach((f) => {
        const o = {};
        memoria.vistaColumnas.forEach((c, i) => { o[c] = f[i + 1]; });
        vista[f[0]] = o;
      });
      const conVista = (x) => Object.assign(x, vista[x.id] || {});
      const cambiar = (lista, columnas, nuevas, quitar) => {
        const filas = filasComoObjetos({ columnas: columnas, filas: nuevas }).map(conVista);
        const fuera = new Set((quitar || []).concat(filas.map((x) => x.id)));
        return lista.filter((x) => !fuera.has(x.id)).concat(filas).sort(porNucoIndice_);
      };
      const quitar = cambios.quitar || {};
      ix.equipos = cambiar(ix.equipos, ix.columnas.equipos, cambios.equipos, quitar.equipos);
      ix.lineas = cambiar(ix.lineas, ix.columnas.lineas, cambios.lineas, quitar.lineas);
      memoria.cargadoEn = Date.now();
      return Promise.resolve(ix);
    }

    function procesarIndice_(r) {
      {
        const porNuco = porNucoIndice_;
        memoria.vistaColumnas = (r.vista && r.vista.columnas) || null;
        // Columnas de la vista de tabla del AppSheet (por ID del registro) dentro de cada fila del índice
        const vista = {};
        ((r.vista && r.vista.filas) || []).forEach((f) => {
          const o = {};
          r.vista.columnas.forEach((c, i) => { o[c] = f[i + 1]; });
          vista[f[0]] = o;
        });
        const conVista = (x) => Object.assign(x, vista[x.id] || {});
        memoria.indice = {
          columnas: { equipos: r.equipos.columnas, lineas: r.lineas.columnas },
          equipos: filasComoObjetos(r.equipos).map(conVista).sort(porNuco),
          lineas: filasComoObjetos(r.lineas).map(conVista).sort(porNuco),
          generadoEn: r.equipos.generadoEn,
        };
        memoria.cargadoEn = Date.now();
        return memoria.indice;
      }
    }

    /**
     * Los permisos de Líneas salen de los de la sesión (state.permisos, ya resueltos por el servidor), sin otra
     * llamada: operar = EDICION en Líneas Telefónicas (TelefoniaService.puedeOperar_ pregunta lo mismo).
     */
    const puedeOperar = () => puedeEditarModulo('lineas-telefonicas');
    /**
     * Las pestañas de la ficha son secciones de Líneas Telefónicas (Modulos.gs: lineas-telefonicas.detalles,
     * .documentos, .historial, .facturacion), con su permiso ya resuelto del servidor (puede, app.html). El
     * servidor pide la misma sección (TelefoniaService.leerSeccion_); esto solo no pinta lo que no va a abrir.
     * Rol CLIENT (POST VENTA, 14-oct): ve la ficha como está hoy, sin su pasado. Documentos e Historial no respetan el
     * alcance (Modulos.gs), así que a quien está limitado el servidor ya se las resuelve Sin acceso (Permisos.resolver_)
     * y además se las niega con TelefoniaService.sinAlcance_.
     */
    const veSeccion = (seccion) => puede('lineas-telefonicas.' + seccion);
    const veDocumentos = () => veSeccion('documentos');
    const veHistorial = () => veSeccion('historial');

    /**
     * Catálogos de los formularios, el directorio de Capital Humano y el índice de accesorios: como los catálogos de los
     * demás módulos (callServerCacheado, api.html): una vez por carga de página, con la copia de la visita anterior al
     * instante y lo fresco por detrás. forzar (o CATALOGOS_LINEAS.forEach(olvidar…)) pide lo nuevo.
     */
    const CATALOGOS_LINEAS = ['apiLineasCatalogos', 'apiLineasColaboradores', 'apiLineasAccesoriosIndice'];
    function catalogoLineas_(fn, forzar) {
      if (forzar) invalidarCacheCatalogo(fn, state.token);
      return callServerCacheado(fn, state.token);
    }
    const cargarColaboradores = (forzar) => catalogoLineas_('apiLineasColaboradores', forzar);
    const cargarAccesorios = (forzar) => catalogoLineas_('apiLineasAccesoriosIndice', forzar);
    const cargarCatalogos = (forzar) => catalogoLineas_('apiLineasCatalogos', forzar);

    /** Calienta en segundo plano lo que usan las vistas y los formularios (no bloquea nada). */
    function precargar() {
      cargarIndice()
        // El directorio de Capital Humano es para los formularios: solo se adelanta a quien captura (a un CLIENT el
        // servidor se lo niega; Gestión de activos lo pide al abrirse)
        .then(() => Promise.all([cargarCatalogos(), puedeOperar() ? cargarColaboradores() : null]))
        .catch(() => {});
    }

    function contarPor(filas, campo) {
      const m = {};
      filas.forEach((f) => { const k = f[campo] || ''; m[k] = (m[k] || 0) + 1; });
      return m;
    }
    const unicos = (filas, campo) => Object.keys(contarPor(filas, campo)).filter(Boolean).sort();

    // ---------------- De las pantallas, para varias (partir.js, fase 6.2) ----------------
    const dinero = (n) => Formato.moneda(n || 0, { centavos: false });

    // ======================================================================
    // Resguardos y cancelaciones (bandeja de Pau, reunión con Líneas 30-sep)
    // ======================================================================

    /**
     * Ventana chica para pedir datos antes de un paso de la bandeja. campos: [{ clave, etiqueta, valor, requerido,
     * opciones }]. Regresa una promesa con { clave: valor } o null si se cancela.
     * opciones.alConfirmar(valores) (promesa): la ventana se queda con la pantalla de espera (opciones.espera) desde el
     * clic hasta que termina; si falla, muestra el error y "Volver" regresa a lo capturado. Regresa lo que regrese.
     * opciones.detalle: lista de lo que se va a tocar (como Confirmar); opciones.peligro: botón rojo. Sin campos sirve
     * de confirmación con espera (pasos de la bandeja de Pau, 13-oct). opciones.encima: por arriba del visor de fotos.
     */
    function pedirDatos(titulo, mensaje, campos, textoConfirmar, opciones) {
      const o = opciones || {};
      const detalle = o.detalle || [];
      return new Promise((resolve) => {
        const fondo = document.createElement('div');
        fondo.className = 'modal-backdrop';
        if (o.encima) fondo.style.zIndex = '800';
        fondo.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true" style="max-width:480px;position:relative">' +
          '<div class="modal-header"><div><h3 style="margin:0">' + esc(titulo) + '</h3>' + (mensaje ? '<p class="modal-subtitle">' + esc(mensaje) + '</p>' : '') + '</div>' +
          '<button type="button" class="modal-close" data-cerrar aria-label="Cerrar">' + ico('x') + '</button></div>' +
          (detalle.length ? '<ul class="confirmar-detalle">' + detalle.slice(0, 50).map((d) => '<li>' + esc(d) + '</li>').join('') +
            (detalle.length > 50 ? '<li><em>…y ' + miles(detalle.length - 50) + ' más</em></li>' : '') + '</ul>' : '') +
          campos.map((c, i) => '<div class="field"><label for="lnr-dato-' + i + '">' + esc(c.etiqueta) + (c.requerido ? ' *' : '') + '</label>' +
            // elegir: la lista empieza sin nada elegido («Selecciona…»), como las de los formularios
            (c.opciones ? '<select id="lnr-dato-' + i + '" data-clave="' + esc(c.clave) + '">' + (c.elegir ? '<option value="">Selecciona…</option>' : '') +
              c.opciones.map((o) => '<option' + (o === c.valor ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
              : c.area ? '<textarea id="lnr-dato-' + i + '" data-clave="' + esc(c.clave) + '" rows="4">' + esc(c.valor || '') + '</textarea>'
              : '<input type="text" id="lnr-dato-' + i + '" data-clave="' + esc(c.clave) + '" value="' + esc(c.valor || '') + '" autocomplete="off" data-respetar-texto />') + '</div>').join('') +
          '<div class="error-msg" data-error hidden></div>' +
          '<div class="ln-captura-acciones"><button type="button" class="secondary" data-cerrar>Cancelar</button><button type="button"' + (o.peligro ? ' class="danger"' : '') + ' data-ok>' + esc(textoConfirmar || 'Aceptar') + '</button></div>' +
          '<div class="ln-espera" data-espera hidden></div></div>';
        document.body.appendChild(fondo);
        const espera = fondo.querySelector('[data-espera]');
        let ocupado = false;
        const cerrar = (valor) => { fondo.remove(); document.removeEventListener('keydown', tecla, true); resolve(valor); };
        const tecla = (ev) => { if (ev.key === 'Escape') { ev.stopPropagation(); if (!ocupado) cerrar(null); } };
        document.addEventListener('keydown', tecla, true);
        fondo.addEventListener('click', (ev) => {
          if (ev.target.closest('[data-espera-volver]')) { espera.hidden = true; ocupado = false; return; }
          if (!ocupado && ev.target.closest('[data-cerrar]')) cerrar(null);
        });
        const pintarEspera = (tituloEspera, texto, error) => {
          espera.className = 'ln-espera' + (error ? ' ln-espera-error' : '');
          espera.innerHTML = '<span class="ln-espera-circulo">' + (error ? icono('triangle-alert') : '<span class="ln-spinner"></span>') + '</span>' +
            '<h3>' + esc(tituloEspera) + '</h3><p>' + esc(texto) + '</p>' +
            (error ? '<div class="ln-espera-acciones"><button type="button" class="primary" data-espera-volver>Volver</button></div>' : '');
          espera.hidden = false;
        };
        fondo.querySelector('[data-ok]').addEventListener('click', async () => {
          const valores = {};
          fondo.querySelectorAll('[data-clave]').forEach((el) => { valores[el.dataset.clave] = String(el.value || '').trim(); });
          const falta = campos.filter((c) => (c.requerido && !valores[c.clave]) || (c.minimo && valores[c.clave].length < c.minimo))[0];
          if (falta) { const e = fondo.querySelector('[data-error]'); e.textContent = falta.etiqueta + ' es obligatorio.'; e.hidden = false; return; }
          if (!o.alConfirmar) { cerrar(valores); return; }
          ocupado = true;
          pintarEspera(o.espera || 'Guardando', 'No cierres esta ventana.');
          try {
            cerrar(await o.alConfirmar(valores));
          } catch (e) {
            pintarEspera('No se pudo guardar', mensajeError(e), true);
          }
        });
        pintarIconos(fondo);
        const primero = fondo.querySelector('[data-clave]');
        if (primero) primero.focus();
      });
    }

    return {
      precargar: precargar,
      // La base para las pantallas (lineas-*.html, fase 6.2) y para los módulos en su propio archivo (p. ej. el temporal
      // de correcciones, html/js/lineas-correcciones.html). Cada pantalla agrega su init… con Object.assign(Lineas, …).
      comun: {
        $: $, esc: esc, guion: guion, miles: miles, ico: ico, chip: chip, fechaTabla: fechaTabla,
        tablaLineas: tablaLineas, tilesKpi: tilesKpi, aviso: aviso, icono: icono, mensajeError: mensajeError,
        llamar: llamar, pedirDatos: pedirDatos, CALIFICACION_DESEMPENO: CALIFICACION_DESEMPENO,
        CALIFICACION_SI: CALIFICACION_SI, CATALOGOS_LINEAS: CATALOGOS_LINEAS, COLOR_ESTATUS: COLOR_ESTATUS,
        NOMBRE_DE_FIRMA: NOMBRE_DE_FIRMA, PASOS_FORMULARIO: PASOS_FORMULARIO, POSICIONES_PATRON: POSICIONES_PATRON,
        REGLAS_FORMATO: REGLAS_FORMATO, SIGNIFICADO_ESTATUS: SIGNIFICADO_ESTATUS, TIPO_EQUIPO: TIPO_EQUIPO,
        abrirPanelLateral: abrirPanelLateral, abrirUltimoDesdeMenu: abrirUltimoDesdeMenu,
        activarAdicionales: activarAdicionales, activarBloqueo: activarBloqueo, activarCombosEn: activarCombosEn,
        activarIdentificaciones: activarIdentificaciones, activarPasos: activarPasos, alternarMulti: alternarMulti,
        aplicarBloqueo: aplicarBloqueo, aplicarCambiosIndice: aplicarCambiosIndice, aplicarReglasEn: aplicarReglasEn,
        bloqueoElegido: bloqueoElegido, calificacionAppSheet: calificacionAppSheet, cargarAccesorios: cargarAccesorios,
        cargarCatalogos: cargarCatalogos, cargarColaboradores: cargarColaboradores, cargarIndice: cargarIndice,
        cargarPatronesAppSheet: cargarPatronesAppSheet, colorAppSheet: colorAppSheet, columnasDeHoja: columnasDeHoja,
        conSelectorBloqueo: conSelectorBloqueo, contarDesde: contarDesde, contarPor: contarPor,
        copiarTexto: copiarTexto, crearFirma: crearFirma, cumpleCondicion: cumpleCondicion, deOtroModulo: deOtroModulo,
        diaClave: diaClave, dinero: dinero, enlaceDrive: enlaceDrive, errorPinBloqueo: errorPinBloqueo,
        erroresFormularioEn: erroresFormularioEn, esFechaIso: esFechaIso, esPuntosPatron: esPuntosPatron,
        exportarBase: exportarBase, fecha: fecha, fechaHora: fechaHora, filasComoObjetos: filasComoObjetos,
        firmaGuardadaEn: firmaGuardadaEn, flechasPatron: flechasPatron, formatoAppSheet: formatoAppSheet,
        htmlAccionesPasos: htmlAccionesPasos, htmlElementoFormulario: htmlElementoFormulario, htmlFirma: htmlFirma,
        htmlFormularioAppSheet: htmlFormularioAppSheet, htmlPasosAppSheet: htmlPasosAppSheet,
        leerArchivosEn: leerArchivosEn, leerFormularioEn: leerFormularioEn, leerIdentificaciones: leerIdentificaciones,
        marcarErroresEn: marcarErroresEn, memoria: memoria, menuFlotante: menuFlotante, montaje: montaje,
        normEncabezado: normEncabezado, normal: normal, panelActual: panelActual, pedirFotoGrande: pedirFotoGrande,
        pintarIconos: pintarIconos, porcentaje: porcentaje, precargarUltimosNucos: precargarUltimosNucos,
        puedeOperar: puedeOperar, redimensionarImagen: redimensionarImagen, vacio: vacio, veDocumentos: veDocumentos,
        veHistorial: veHistorial, veSeccion: veSeccion, verFotoEnGrande: verFotoEnGrande, verFotos: verFotos,
        vistaPatron: vistaPatron,
      },
    };
  })();
</script>
