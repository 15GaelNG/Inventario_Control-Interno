      MAYUS: { f: (v) => v === v.toUpperCase() && !/[ÁÉÍÓÚ]/.test(v), msg: 'ESCRIBIR EN MAYUSCULAS Y SIN ACENTOS' },
      NUCO: { f: (v) => /^\d+$/.test(v), msg: 'ESTE CAMPO DEBE SER NUMEROS Y NO SE DEBE REPETIR' },
      // Sin TIPO que elegir (4-oct): las mismas reglas que el servidor (LineasRegistros.valida_)
      EQUIPO: { f: (v) => v !== 'NO APLICA', msg: 'ELIGE EL MODELO' },
      PIN_WA: { f: (v) => v === 'NO APLICA' || v.length <= 13, msg: 'NO MAYOR A 13 CARACTERES' },
      PIN_EQ: { f: (v) => v === 'NO APLICA' || v.length <= 6, msg: 'NO MAYOR A 6 CARACTERES' },
      COMENTARIOS: { f: (v) => v.length > 3, msg: 'ESCRIBE MÁS DE 3 CARACTERES' },
    };

    /** Obligatorios vacíos y Valid_If (mismas reglas que valida el servidor, salvo unicidad). */
    function erroresFormularioEn(cuerpo, elementos, tipo, ctx) {
      const valores = leerFormularioEn(cuerpo, elementos);
      const t = String(valores.TIPO !== undefined ? valores.TIPO : (tipo || '')).trim().toUpperCase();
      const errores = [];
      (elementos || []).forEach((e) => {
        if (e.tipo !== 'campo' || e.soloLectura || e.control === 'calculado' || e.control === 'firma' || e.control === 'patron' || e.control === 'archivo' || e.valorOculto) return;
        if (!cumpleCondicion(e.mostrar, t, valores, ctx)) return;
        const v = valores[e.columna] || '';
        const error = (corto) => errores.push({ e: e, columna: e.columna, corto: corto, msg: e.etiqueta + ': ' + corto });
        if (!v) { if (cumpleCondicion(e.requerido, t, valores, ctx)) errores.push({ e: e, columna: e.columna, corto: 'Obligatorio', msg: e.etiqueta + ' es obligatorio' }); return; }
        if ((e.control === 'lista' || e.soloLista) && (e.opciones || []).map((o) => String(o).toUpperCase()).indexOf(v.toUpperCase()) < 0) { error(e.mensaje || 'VALOR NO ENCONTRADO EN LA LISTA'); return; }
        if (e.control === 'referencia' && v.charAt(0) === '¿') error('Elige un valor de la lista');
        const regla = e.valida && VALIDA_CLIENTE[e.valida];
        if (regla && !regla.f(v, t)) error(regla.msg);
      });
      return errores;
    }

    /** FOLIO y ESTATUS GENERAL (AppFormula de LINEAS TELEFONICAS) para mostrarlos en vivo. */
    /**
     * TIPO asignado solo (usuario, 4-oct; la misma cuenta que LineasRegistros.tipoAutomatico_): equipo sin línea → EQUIPO;
     * con línea → EQUIPO + SIM, o EQUIPO + SIM BASICO si es básica; línea sola → LINEA o LINEA BASICA. Una línea
     * CANCELADA ya no cuenta. MODEM, BANDA ANCHA y CAMARA (histórico) se quedan como están.
     */
    function tipoAutomatico(v, ctx) {
      if (ctx && ctx.historico) return ctx.tipoInicial || '';
      const txt = (c) => String((v || {})[c] || '').trim().toUpperCase();
      const vacio = (x) => !x || ['N/A', 'NA', 'NO APLICA', '-', 'SOLO LINEA', 'SIN EQUIPO'].indexOf(x) >= 0;
      const conLinea = (!vacio(txt('NUMERO TELEFONO')) || !vacio(txt('NUMERO SIM'))) && txt('ESTATUS LINEA') !== 'CANCELADA';
      const basica = txt('TIPO DE LINEA') === 'SIM BASICO';
      if (ctx && ctx.parte === 'LINEA') return basica ? 'LINEA BASICA' : 'LINEA';
      return !conLinea ? 'EQUIPO' : (basica ? 'EQUIPO + SIM BASICO' : 'EQUIPO + SIM');
    }

    function formulaRegistro(nombre, v, id) {
      const tipo = String(v.TIPO || '').toUpperCase();
      if (nombre === 'TIPO_EQUIPO' || nombre === 'TIPO_LINEA') return tipo;
      if (nombre === 'FOLIO') {
        const prefijo = { 'EQUIPO + SIM': 'EQS', 'LINEA': 'LIN', 'MODEM': 'MOD', 'CAMARA': 'CAM', 'BANDA ANCHA': 'BAN', 'EQUIPO': 'EQP' }[tipo] || '';
        return prefijo + ('0000' + (v.NUCO || '')).slice(-4);
      }
      if (nombre === 'ESTATUS_GENERAL') {
        if (/^DG/i.test(id || '')) return 'PERSONAL DG';
        if (tipo === 'EQUIPO') return { 'ESPERA DE RESPONSIVA': 'USO', 'EN ENVIO': 'USO', 'VENTA': 'RESGUARDO', 'DESECHADO': 'DESECHO' }[v['ESTATUS EQUIPO']] || v['ESTATUS EQUIPO'] || '';
        if (['EQUIPO + SIM', 'LINEA', 'MODEM', 'BANDA ANCHA'].indexOf(tipo) >= 0) return { 'ESPERA DE RESPONSIVA': 'USO', 'SIN LINEA': 'CANCELADA', 'EN PROCESO DE CANCELACION': 'CANCELADA' }[v['ESTATUS LINEA']] || v['ESTATUS LINEA'] || '';
        return '';
      }
      return '';
    }

    /**
     * Show_If, Required_If, Editable_If y Reset_If en vivo (formulario de LINEAS TELEFONICAS).
     * `tipoAnterior` sirve para los Reset_If que solo aplican cuando cambia TIPO.
     */
    function aplicarReglasEn(cuerpo, elementos, ctx) {
      let valores = leerFormularioEn(cuerpo, elementos);
      // El TIPO ya no se elige (4-oct): se calcula con lo capturado. El NUCO fijo (edición) no es un campo: viene del contexto
      if (ctx && ctx.parte) valores.TIPO = tipoAutomatico(valores, ctx);
      if (ctx && ctx.nuco && valores.NUCO === undefined) valores.NUCO = ctx.nuco;
      const t = String(valores.TIPO || '').toUpperCase();
      const tipoCambio = ctx.nuevo || t !== String(ctx.tipoInicial || '').toUpperCase();
      (elementos || []).forEach((e) => {
        if (e.tipo !== 'campo' || !e.reset) return;
        if (!cumpleCondicion(e.reset.cuando, t, valores, ctx) || (e.reset.soloCambioTipo && !tipoCambio)) return;
        const el = cuerpo.querySelector('input[data-columna="' + CSS.escape(e.columna) + '"]');
        if (el) el.value = e.reset.copiar ? (valores[e.reset.copiar] || '') : e.reset.valor;
      });
      valores = leerFormularioEn(cuerpo, elementos);
      if (ctx && ctx.parte) valores.TIPO = t;
      if (ctx && ctx.nuco && valores.NUCO === undefined) valores.NUCO = ctx.nuco;
      cuerpo.querySelectorAll('.ln-af-campo').forEach((campo) => {
        const visible = cumpleCondicion(campo.dataset.mostrar, t, valores, ctx);
        campo.hidden = !visible;
        campo.querySelector('.ln-af-req').hidden = !(visible && cumpleCondicion(campo.dataset.requerido, t, valores, ctx));
        const editable = cumpleCondicion(campo.dataset.editable, t, valores, ctx);
        campo.classList.toggle('ln-af-bloqueado', !editable);
        campo.querySelectorAll('input:not([readonly]), select, textarea, .ln-pastilla, input[type="file"]').forEach((el) => { el.disabled = !editable; });
      });
      cuerpo.querySelectorAll('.ln-af-seccion:not(.ln-af-extra)').forEach((sec) => { sec.hidden = !sec.querySelector('.ln-af-campo:not([hidden])'); });
      cuerpo.querySelectorAll('[data-formula]').forEach((el) => {
        if (el.dataset.formula === 'NO_ASIGNACION') return;
        el.textContent = formulaRegistro(el.dataset.formula, valores, ctx.idDG || ctx.id) || '—';
      });
    }

    /** Archivos elegidos en columnas File → { COLUMNA: { nombre, mime, base64 } }. */
    function leerArchivosEn(cuerpo) {
      const lectores = Array.from(cuerpo.querySelectorAll('input[type="file"][data-archivo]')).filter((i) => i.files && i.files[0]).map((input) => new Promise((resolve, reject) => {
        const f = input.files[0];
        if (f.size > 15 * 1024 * 1024) { reject(new Error(input.dataset.archivo + ': el archivo supera 15 MB.')); return; }
        const r = new FileReader();
        r.onload = () => resolve([input.dataset.archivo, { nombre: f.name, mime: f.type || 'application/pdf', base64: String(r.result).split(',')[1] }]);
        r.onerror = () => reject(new Error('No se pudo leer ' + f.name));
        r.readAsDataURL(f);
      }));
      return Promise.all(lectores).then((pares) => pares.reduce((o, [k, v]) => { o[k] = v; return o; }, {}));
    }

    /** Redimensiona una imagen en el navegador antes de subirla (máx. `maxDim` px, JPEG calidad .82). */
    function redimensionarImagen(archivo, maxDim) {
      return new Promise((resolve, reject) => {
        const lector = new FileReader();
        lector.onerror = () => reject(new Error('No se pudo leer el archivo.'));
        lector.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Archivo de imagen inválido.'));
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              const factor = maxDim / Math.max(w, h);
              w = Math.round(w * factor); h = Math.round(h * factor);
            }
            const lienzo = document.createElement('canvas');
            lienzo.width = w; lienzo.height = h;
            lienzo.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mime: 'image/jpeg', base64: lienzo.toDataURL('image/jpeg', 0.82).split(',')[1] });
          };
          img.src = lector.result;
        };
        lector.readAsDataURL(archivo);
      });
    }

    /**
     * Aviso flotante. Usa Notificar (toasts del sistema); el HTML se reduce a texto y los
     * que traen el ícono de alerta salen como error. Sin Notificar, cae al aviso propio.
     */
    function aviso(html, duracion) {
      if (typeof Notificar !== 'undefined') {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        const texto = tmp.textContent.trim();
        if (/ln-alerta/.test(html)) Notificar.error(texto, duracion ? { duracion: duracion } : undefined);
        else Notificar.exito(texto, duracion ? { duracion: duracion } : undefined);
        return;
      }
      let caja = document.getElementById('ln-avisos');
      if (!caja) {
        caja = document.createElement('div');
        caja.id = 'ln-avisos';
        document.body.appendChild(caja);
      }
      const item = document.createElement('div');
      item.className = 'ln-aviso';
      item.innerHTML = '<div>' + html + '</div><button type="button" class="modal-close" aria-label="Cerrar">' + icono('x') + '</button>';
      item.querySelector('button').addEventListener('click', () => item.remove());
      caja.appendChild(item);
      if (duracion) setTimeout(() => item.remove(), duracion);
    }
    const mensajeError = (e) => esc(e && e.message ? e.message : e);

    /** Copia texto al portapapeles; dentro del iframe de Apps Script cae a execCommand si la API no está permitida. */
    function copiarTexto(texto) {
      const conArea = () => {
        const area = document.createElement('textarea');
        area.value = texto;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        area.remove();
        return ok;
      };
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texto).then(() => true, conArea);
      return Promise.resolve(conArea());
    }

    // ---------------- Estado del módulo ----------------
    // Se conserva entre navegaciones para evitar volver a pedir los mismos catálogos.
    const POR_PAGINA = 50;
    const VIGENCIA_INDICE_MS = 15 * 60 * 1000;
    const VIGENCIA_CATALOGO_MS = 15 * 60 * 1000;
    const memoria = {
      indice: null,
      cargadoEn: 0,
      indicePendiente: null,
      permisos: null,
      colaboradores: null,
      colaboradoresCargadosEn: 0,
      colaboradoresPendientes: null,
      accesorios: null,
      accesoriosCargadosEn: 0,
      accesoriosPendientes: null,
      catalogos: null,
      catalogosCargadosEn: 0,
      catalogosPendientes: null,
      tablas: {}, // última respuesta de cada bitácora / trámite: se pinta al instante y luego se actualiza
      modulo: 'equipos',
      modoVista: null, // 'tabla' | 'tarjetas' (se recuerda en el navegador)
      abrirAlEntrar: null, // id de registro a abrir al entrar a Líneas Telefónicas (desde una bitácora)
      filtrarAlEntrar: null, // { modulo, estatus }: filtro al entrar a Líneas Telefónicas (desde el Panorama)
    };
    let montaje = 0; // cambia en cada init: respuestas tardías de una vista anterior se ignoran

    function filasComoObjetos(ix) {
      return ix.filas.map((f) => {
        const o = {};
        ix.columnas.forEach((c, i) => { o[c] = f[i]; });
        return o;
      });
    }

    /**
     * El índice también se guarda en el navegador (como las listas de api.html, se borra al
     * cerrar sesión): al recargar la página se pinta con esa copia AL INSTANTE y por detrás se
     * pide el fresco; si llegó distinto, "lista-actualizada" hace que Líneas Telefónicas se
     * vuelva a pintar. Las recargas forzadas (después de una operación) esperan lo fresco.
     */
    const LLAVE_INDICE = () => llaveGuardada_('apiLineasIndice[]');
    function cargarIndice(forzar) {
      if (!forzar && memoria.indice && Date.now() - memoria.cargadoEn < VIGENCIA_INDICE_MS) return Promise.resolve(memoria.indice);
      if (!forzar && memoria.indicePendiente) return memoria.indicePendiente;
      if (!forzar && !memoria.indice) {
        let texto = null;
        try { texto = localStorage.getItem(LLAVE_INDICE()); } catch (e) { texto = null; }
        if (texto) {
          try {
            procesarIndice_(JSON.parse(texto));
            memoria.indiceTexto = texto;
            pedirIndice_(true).catch(() => { /* se queda la copia */ });
            return Promise.resolve(memoria.indice);
          } catch (e) { /* copia dañada: se pide normal */ }
        }
      }
      return pedirIndice_(false);
    }

    function pedirIndice_(avisarSiCambia) {
      memoria.indicePendiente = llamar('apiLineasIndice').then((r) => {
        // Lo que se guarda en el navegador va SIN los PIN (a un ADMIN el servidor se los manda):
        // en una computadora compartida no deben quedar escritos. Los reales solo viven en memoria.
        const guardable = sinSecretos_(r);
        const texto = JSON.stringify(guardable);
        // Si trae PIN reales (ADMIN), también hay que repintar: lo pintado desde la copia los tenía ocultos
        const cambio = texto !== memoria.indiceTexto || guardable !== r;
        memoria.indiceTexto = texto;
        try {
          if (texto.length <= MAX_GUARDAR) localStorage.setItem(LLAVE_INDICE(), texto);
          else localStorage.removeItem(LLAVE_INDICE());
        } catch (e) { /* no cupo: solo memoria */ }
        procesarIndice_(r);
        if (cambio && avisarSiCambia) window.dispatchEvent(new CustomEvent('lista-actualizada', { detail: { fn: 'apiLineasIndice' } }));
        return memoria.indice;
      });
      memoria.indicePendiente.then(() => { memoria.indicePendiente = null; }, () => { memoria.indicePendiente = null; });
      return memoria.indicePendiente;
    }

    /** Copia del índice con las columnas secretas (PIN WHATSAPP, PIN EQUIPO) en "••••", como las ve quien no es ADMIN */
    function sinSecretos_(r) {
      const vista = r && r.vista;
      if (!vista || !(vista.secretas || []).length) return r;
      const posiciones = vista.secretas.map((c) => vista.columnas.indexOf(c) + 1).filter((i) => i > 0);
      const conPinReal = (fila) => posiciones.some((i) => fila[i] && fila[i] !== '••••');
      if (!vista.filas.some(conPinReal)) return r;   // ya venía sin PIN (quien no es ADMIN): la misma
      return Object.assign({}, r, {
        vista: Object.assign({}, vista, {
          filas: vista.filas.map((fila) => {
            if (!conPinReal(fila)) return fila;
            const copia = fila.slice();
            posiciones.forEach((i) => { if (copia[i]) copia[i] = '••••'; });
            return copia;
          }),
        }),
      });
    }

    const porNucoIndice_ = (a, b) => {
      const na = Number(a.nuco || a.nucoEquipo);
      const nb = Number(b.nuco || b.nucoEquipo);
      if (isNaN(na) && isNaN(nb)) return 0;
      if (isNaN(na)) return 1;
      if (isNaN(nb)) return -1;
      return na - nb;
    };

    /**
     * Rapidez (etapa 3, paso 2): después de una acción el servidor regresa solo los registros que cambiaron
     * (LineasRepo.refrescarIndice: { equipos, lineas, vista, quitar }). Se cambian en el índice que ya está en memoria en
     * vez de volver a pedirlo completo. Si no vienen (o no hay índice en memoria), se pide completo, como antes.
     */
    function aplicarCambiosIndice(cambios) {
      const ix = memoria.indice;
      if (!ix || !memoria.vistaColumnas || !cambios || !Array.isArray(cambios.equipos) || !Array.isArray(cambios.lineas) || !Array.isArray(cambios.vista)) {
        return cargarIndice(true);
      }
      const vista = {};
      cambios.vista.forEach((f) => {
        const o = {};
        memoria.vistaColumnas.forEach((c, i) => { o[c] = f[i + 1]; });
        vista[f[0]] = o;
      });
      const conVista = (x) => Object.assign(x, vista[x.id] || {});
      const cambiar = (lista, columnas, nuevas, quitar) => {
        const filas = filasComoObjetos({ columnas: columnas, filas: nuevas }).map(conVista);
        const fuera = new Set((quitar || []).concat(filas.map((x) => x.id)));
        return lista.filter((x) => !fuera.has(x.id)).concat(filas).sort(porNucoIndice_);
      };
      const quitar = cambios.quitar || {};
      ix.equipos = cambiar(ix.equipos, ix.columnas.equipos, cambios.equipos, quitar.equipos);
      ix.lineas = cambiar(ix.lineas, ix.columnas.lineas, cambios.lineas, quitar.lineas);
      memoria.cargadoEn = Date.now();
      return Promise.resolve(ix);
    }

    function procesarIndice_(r) {
      {
        const porNuco = porNucoIndice_;
        memoria.vistaColumnas = (r.vista && r.vista.columnas) || null;
        // Columnas de la vista de tabla del AppSheet (por ID del registro) dentro de cada fila del índice
        const vista = {};
        ((r.vista && r.vista.filas) || []).forEach((f) => {
          const o = {};
          r.vista.columnas.forEach((c, i) => { o[c] = f[i + 1]; });
          vista[f[0]] = o;
        });
        const conVista = (x) => Object.assign(x, vista[x.id] || {});
        memoria.indice = {
          columnas: { equipos: r.equipos.columnas, lineas: r.lineas.columnas },
          equipos: filasComoObjetos(r.equipos).map(conVista).sort(porNuco),
          lineas: filasComoObjetos(r.lineas).map(conVista).sort(porNuco),
          generadoEn: r.equipos.generadoEn,
        };
        memoria.cargadoEn = Date.now();
        return memoria.indice;
      }
    }

    function cargarPermisos() {
      if (memoria.permisos) return Promise.resolve(memoria.permisos);
      return llamar('apiLineasPermisos').then((p) => (memoria.permisos = p));
    }

    function cargarColaboradores(forzar) {
      if (!forzar && memoria.colaboradores && Date.now() - memoria.colaboradoresCargadosEn < VIGENCIA_CATALOGO_MS) return Promise.resolve(memoria.colaboradores);
      if (!forzar && memoria.colaboradoresPendientes) return memoria.colaboradoresPendientes;
      memoria.colaboradoresPendientes = llamar('apiLineasColaboradores').then((r) => {
        memoria.colaboradores = r;
        memoria.colaboradoresCargadosEn = Date.now();
        return r;
      });
      memoria.colaboradoresPendientes.then(() => { memoria.colaboradoresPendientes = null; }, () => { memoria.colaboradoresPendientes = null; });
      return memoria.colaboradoresPendientes;
    }

    function cargarAccesorios(forzar) {
      if (!forzar && memoria.accesorios && Date.now() - memoria.accesoriosCargadosEn < VIGENCIA_CATALOGO_MS) return Promise.resolve(memoria.accesorios);
      if (!forzar && memoria.accesoriosPendientes) return memoria.accesoriosPendientes;
      memoria.accesoriosPendientes = llamar('apiLineasAccesoriosIndice').then((r) => {
        memoria.accesorios = r;
        memoria.accesoriosCargadosEn = Date.now();
        return r;
      });
      memoria.accesoriosPendientes.then(() => { memoria.accesoriosPendientes = null; }, () => { memoria.accesoriosPendientes = null; });
      return memoria.accesoriosPendientes;
    }

    /** Catálogos de los formularios (se guardan en memoria; el servidor ya los tiene en caché). */
    function cargarCatalogos(forzar) {
      if (!forzar && memoria.catalogos && Date.now() - memoria.catalogosCargadosEn < VIGENCIA_CATALOGO_MS) return Promise.resolve(memoria.catalogos);
      if (!forzar && memoria.catalogosPendientes) return memoria.catalogosPendientes;
      memoria.catalogosPendientes = llamar('apiLineasCatalogos').then((c) => {
        memoria.catalogos = c;
        memoria.catalogosCargadosEn = Date.now();
        return c;
      });
      memoria.catalogosPendientes.then(() => { memoria.catalogosPendientes = null; }, () => { memoria.catalogosPendientes = null; });
      return memoria.catalogosPendientes;
    }

    /** Calienta en segundo plano lo que usan las vistas y los formularios (no bloquea nada). */
    function precargar() {
      Promise.all([cargarPermisos(), cargarIndice()])
        .then(() => Promise.all([cargarCatalogos(), cargarColaboradores()]))
        .catch(() => {});
    }

    function contarPor(filas, campo) {
      const m = {};
      filas.forEach((f) => { const k = f[campo] || ''; m[k] = (m[k] || 0) + 1; });
      return m;
    }
    const unicos = (filas, campo) => Object.keys(contarPor(filas, campo)).filter(Boolean).sort();

    // ======================================================================

      ['PUESTO', 'Puesto'], ['NOMBRE RESPONSABLES 2', 'Nombre colaborador/es'], ['PUESTO RESPONSABLES 2', 'Puesto colaborador/es'],

    /** "Ver": abre la última inspección o responsiva de la carpeta del NUCO en NUCOS (se busca al hacer clic). */

    function columnasVistaLineas(sinEstas) {

    /**

    /** Acciones masivas de equipos (barra de la tabla con 2 o más seleccionados). `clave` = LineasRegistros.MASIVAS. */
    const ACCIONES_MASIVAS = [
      // Mandar a resguardo tiene su propio formulario (abrirResguardo): datos por NUCO, N/A y bandeja de Pau (30-sep)
      { clave: 'RESGUARDO', texto: 'Mandar a resguardo', icono: 'archive', minimo: 1, propia: true,

    const TABLAS_INVENTARIO = {

          { campo: 'tipoHoja', titulo: 'Tipo', tipo: 'lista', render: (v) => formatoAppSheet('LINEAS', 'TIPO', v) || guion(v) },
          { campo: 'compania', titulo: 'Compañía', tipo: 'lista' },
          { campo: 'estatus', titulo: 'Estatus', tipo: 'lista', render: (v) => chip(v) },
          { campo: 'suelta', titulo: 'Suelta', tipo: 'lista', valor: (r) => (r.suelta ? 'Sí' : 'No'), render: (v) => (v === 'Sí' ? chip('Suelta', 'ambar') : '<span class="ln-tenue">En equipo</span>') },
          { campo: 'nucoEquipo', titulo: 'Equipo (NUCO)', tipo: 'texto', render: (v) => '<span class="ln-mono">' + guion(v) + '</span>' },
          { campo: 'sim', titulo: 'SIM', tipo: 'texto', render: (v) => '<span class="ln-mono">' + guion(v) + '</span>' },
          { campo: 'responsable', titulo: 'Responsable', tipo: 'texto' },
          { campo: 'departamento', titulo: 'Departamento', tipo: 'lista' },
        ].concat(columnasVistaLineas(['NUMERO TELEFONO', 'TIPO', 'COMPAÑIA', 'ESTATUS LINEA', 'NUCO', 'NUMERO SIM', 'RESPONSABLE', 'DEPARTAMENTO'])),
      },
    };

    function initTelefonicas() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-telefonicas');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const pila = []; // navegación dentro del detalle: [{ tipo, id }]
      let captura = null; // sesión de captura de inspección/responsiva en curso (null si el modal está cerrado)
      pintarIconos(raiz);
      document.addEventListener('app:before-navigate', () => { if (vigente() && captura) cerrarCaptura(); }, { once: true });

      // ---- Eventos ----
      const tablas = {};
      const filtrosActuales = { equipos: {}, lineas: {} };
      const PASO_TARJETAS = 48; // vista de tarjetas: cuántas se agregan con "Mostrar más"
      const tarjetasVisibles = { equipos: PASO_TARJETAS, lineas: PASO_TARJETAS };
      let detallesFicha = null; // datos de la tarjeta "Detalles" de la ficha abierta
      let tablaHistorial = null; // DataTable del historial de la ficha abierta
      let tablaDocumentos = null; // DataTable de Documentos (inspecciones y responsivas) de la ficha abierta
      let nombreHistorial = ''; // para el nombre del Excel del historial
      let vistaHistorial = 'equipo'; // 'equipo' o 'linea': qué asignaciones muestra el historial
      let asignaciones = null; // números del NUCO o NUCOs del número de la ficha abierta (null mientras carga)
      let tablaAsignaciones = null; // DataTable de esas asignaciones
      let ocultarSinAsignar = false; // oculta los periodos "Sin línea" / "Sin equipo" (suelen ser transiciones)
      let fichaActual = null; // la ficha abierta (su carpeta de Drive, para el ⋮)
      // Estatus del equipo que van por el formulario de resguardo (LineasResguardos.ESTATUS_EQUIPO_RESGUARDO)
      const ESTATUS_EQUIPO_RESGUARDO = ['RESGUARDO', 'PARA VENTA', 'PARA DESECHO'];
      let marcarKpi = null;
      raiz.querySelectorAll('#ln-tabs .tab-btn').forEach((tab) => {
        tab.addEventListener('click', () => mostrarModulo(tab.dataset.tab));
      });
      $('#ln-recargar', raiz).addEventListener('click', (ev) => {
        const b = ev.currentTarget;
        b.disabled = true;
        llamar('apiLineasRecargarDatos')
          .then(() => cargarIndice(true))
          .then(() => { if (vigente()) { pintarIndicadores(); pintarListado(); } })
          .catch((e) => aviso(icono('triangle-alert', 'ln-alerta') + ' ' + mensajeError(e), 12000))
          .then(() => { b.disabled = false; });
      });
      // Agregar equipo o línea (usuario, 4-oct): el TIPO ya no se elige, se asigna solo
      $('#ln-nuevo-equipo', raiz).addEventListener('click', () => abrirEditor(null, 'EQUIPO'));
      $('#ln-nueva-linea', raiz).addEventListener('click', () => abrirEditor(null, 'LINEA'));
      raiz.querySelectorAll('#ln-modo-vista [data-modo]').forEach((b) => b.addEventListener('click', () => {
        memoria.modoVista = b.dataset.modo;
        try { localStorage.setItem('lineas.modoVista', memoria.modoVista); } catch (e) { /* solo no se recuerda */ }
        aplicarModoVista();
      }));

      // Clic en filas, enlaces internos y botones del detalle (delegación).
      raiz.addEventListener('click', (ev) => {
        if (ev.target.closest('a[target="_blank"]')) return;
        const ir = ev.target.closest('[data-ln-ir]');
        if (ir) {
          ev.preventDefault();
          // Tarjetas del listado, como en Drive: con el mouse el clic selecciona (doble clic abre); con el dedo o el
          // teclado (Enter) se abre la ficha
          const tabla = ir.classList.contains('ln-cuadro') && ir.closest('#ln-listado') ? tablas[memoria.modulo] : null;
          const conMouse = ev.detail > 0 && (ev.pointerType ? ev.pointerType === 'mouse' : !(window.matchMedia && window.matchMedia('(hover: none)').matches));
          if (tabla && conMouse) { tabla.clicSeleccion(ir.dataset.id, ev); return; }
          abrir(ir.dataset.lnIr, ir.dataset.id);
          return;
        }
        const masFicha = ev.target.closest('[data-ln-ficha-mas]');
        if (masFicha) { ev.preventDefault(); abrirMenuFicha(masFicha); return; }
        const pestana = ev.target.closest('[data-ficha-tab]');
        if (pestana) { mostrarPestanaFicha(pestana.dataset.fichaTab); return; }
        const mas = ev.target.closest('[data-ln-mas-tarjetas]');
        if (mas) { tarjetasVisibles[mas.dataset.lnMasTarjetas] += PASO_TARJETAS; pintarTarjetas(mas.dataset.lnMasTarjetas); return; }
        const copiar = ev.target.closest('[data-ln-copiar-detalles]');
        if (copiar) { copiarDetalles(copiar); return; }
        if (ev.target.closest('[data-ln-volver]')) { ev.preventDefault(); volver(); return; }
        if (ev.target.closest('[data-ln-lista]')) { ev.preventDefault(); cerrarDetalle(); return; }
        const miga = ev.target.closest('[data-ln-miga]');
        if (miga) {
          ev.preventDefault();
          const indice = Number(miga.dataset.lnMiga);
          const destino = pila[indice];
          if (destino) { pila.splice(indice + 1); abrir(destino.tipo, destino.id, true); }
          return;
        }
        const btnCaptura = ev.target.closest('[data-ln-captura]');
        if (btnCaptura) {
          ev.preventDefault();
          const ref = btnCaptura.dataset.equipoId ? { equipoId: btnCaptura.dataset.equipoId } : { lineaId: btnCaptura.dataset.lineaId };
          abrirCaptura(btnCaptura.dataset.lnCaptura, ref);
          return;
        }
        const multi = ev.target.closest('.ln-pastilla-multi');
        if (multi) { alternarMulti(multi); actualizarProgresoChecklist(); return; }
        const pastilla = ev.target.closest('.ln-pastilla');
        if (pastilla) {
          pastilla.parentElement.querySelectorAll('.ln-pastilla').forEach((b) => { b.classList.remove('activa'); if (b.hasAttribute('aria-checked')) b.setAttribute('aria-checked', 'false'); });
          pastilla.classList.add('activa');
          if (pastilla.hasAttribute('aria-checked')) pastilla.setAttribute('aria-checked', 'true');
          actualizarProgresoChecklist();
          return;
        }
        const quitarFoto = ev.target.closest('[data-quitar-foto]');
        if (quitarFoto) {
          if (captura) captura.fotos = captura.fotos.filter((f) => f.id !== quitarFoto.dataset.quitarFoto);
          quitarFoto.closest('.ln-foto-chip').remove();
          return;
        }
      });
      raiz.addEventListener('dblclick', (ev) => {
        const tarjeta = ev.target.closest('#ln-listado .ln-cuadro[data-ln-ir]');
        if (tarjeta) abrir(tarjeta.dataset.lnIr, tarjeta.dataset.id);
      });
      raiz.addEventListener('contextmenu', (ev) => {
        const tarjeta = ev.target.closest('#ln-listado .ln-cuadro[data-ln-ir]');
        const tabla = tarjeta ? tablas[memoria.modulo] : null;
        if (!tabla) return;
        ev.preventDefault();
        tabla.asegurarSeleccionada(tarjeta.dataset.id);
        tabla.abrirMenu(ev.clientX, ev.clientY);
      });
      raiz.addEventListener('input', (ev) => { if (ev.target.closest('[data-ln-copiar]')) pintarTextoDetalles(); });
      raiz.addEventListener('keydown', (ev) => {
        if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][tabindex="0"]')) {
          ev.preventDefault();
          ev.target.click();
        }
        if (ev.key === 'Escape' && !$('#ln-modal-captura', raiz).hidden) cerrarCaptura();
        // Tarjetas: el foco queda en la tarjeta (no en la tabla), así que Esc quita la selección desde aquí
        else if (ev.key === 'Escape' && ev.target.closest && ev.target.closest('#ln-listado .ln-cuadro') && tablas[memoria.modulo]) tablas[memoria.modulo].limpiarSeleccion();
      });
      $('#ln-modal-captura', raiz).addEventListener('click', (ev) => {
        if (ev.target.closest('[data-espera-volver]')) { ocultarEspera(); return; }
        // Un clic afuera no cierra la ventana (usuario, 4-oct): solo la X, Cancelar o Cerrar
        if (ev.target.closest('[data-cerrar-modal]')) cerrarCaptura();
      });

      // ---- Carga inicial ----
      if (!memoria.modoVista) {
        // Sin preferencia guardada: tarjetas en celular (una tabla de 10 columnas no cabe) y tabla en lo demás
        const porDefecto = window.matchMedia && window.matchMedia('(max-width: 700px)').matches ? 'tarjetas' : 'tabla';
        let guardado = null;
        try { guardado = localStorage.getItem('lineas.modoVista'); } catch (e) { guardado = null; }
        memoria.modoVista = guardado === 'tarjetas' || guardado === 'tabla' ? guardado : porDefecto;
      }
      mostrarModulo(memoria.modulo, true);
      crearTabla(memoria.modulo).setCargando(true);
      aplicarModoVista();
      // Atrás / Adelante del navegador (gesto de dos dedos): la ficha que se veía en ese paso
      const subInicial = typeof HistorialApp !== 'undefined' ? HistorialApp.registrar('lineas-telefonicas', (sub) => { if (vigente()) restaurarPaso(sub); }) : null;
      // Se pintó con el índice guardado en el navegador y llegó uno distinto: pintar de nuevo
      escucharLista('apiLineasIndice', () => { if (vigente()) { pintarIndicadores(); pintarListado(); } }, raiz);
      Promise.all([cargarPermisos(), cargarIndice()]).then(([permisos]) => {
        if (!vigente()) return;
        $('#ln-recargar', raiz).hidden = !permisos.esAdmin;
        pintarIndicadores();
        pintarListado();
        if (subInicial) restaurarPaso(subInicial);
        if (memoria.abrirAlEntrar) {
          const id = memoria.abrirAlEntrar;
          memoria.abrirAlEntrar = null;
          abrirRegistro(id);
        }
        if (memoria.filtrarAlEntrar) {
          const f = memoria.filtrarAlEntrar;
          memoria.filtrarAlEntrar = null;
          crearTabla(f.modulo).setFiltro('estatus', { valores: Array.isArray(f.estatus) ? f.estatus : [f.estatus] });
        }
      }).catch((e) => {
        if (!vigente()) return;
        crearTabla(memoria.modulo).setError('No se pudo cargar el inventario: ' + (e.message || e));
      });

      // ---- Indicadores (clic = filtrar, como en los módulos de la rama jorge) ----
      function pintarIndicadores() {
        const ix = memoria.indice;
        const eq = ix.equipos;
        const li = ix.lineas;
        // filasDe: lo que hay bajo los filtros activos de esa tabla (o el índice completo si
        // esa tabla todavía no se ha creado — no puede haber filtro sin tabla).
        const filasDe = (modulo) => (tablas[modulo] ? tablas[modulo].getFiltradas() : (modulo === 'equipos' ? eq : li));
        const defs = [
          { icono: 'smartphone', calcular: (f) => f.length, etiqueta: 'Equipos', modulo: 'equipos', filtros: {} },
          { icono: 'circle-check', calcular: (f) => f.filter((e) => e.estatus === 'USO').length, etiqueta: 'Equipos en uso', clase: 'stat-tile-ok', modulo: 'equipos', filtros: { estatus: { valores: ['USO'] } } },
          { icono: 'unplug', calcular: (f) => f.filter((e) => !e.lineaId).length, etiqueta: 'Equipos sin línea', modulo: 'equipos', filtros: { numero: { op: 'vacio' } } },
          { icono: 'card-sim', calcular: (f) => f.length, etiqueta: 'Líneas', modulo: 'lineas', filtros: {} },
          { icono: 'unlink', calcular: (f) => f.filter((l) => l.suelta).length, etiqueta: 'Líneas sueltas', clase: 'stat-tile-warn', modulo: 'lineas', filtros: { suelta: { valores: ['Sí'] } } },
        ];
        const cont = $('#ln-indicadores', raiz);
        cont.innerHTML = defs.map((d, i) => '<div class="stat-tile stat-tile-clickable ' + (d.clase || '') + '" data-kpi="' + i + '" role="button" tabindex="0">' +
          '<div class="stat-icon">' + ico(d.icono) + '</div><div><div class="stat-value">' + miles(d.calcular(filasDe(d.modulo))) + '</div><div class="stat-label">' + esc(d.etiqueta) + '</div></div></div>').join('');
        const campos = { equipos: ['estatus', 'numero'], lineas: ['suelta'] };
        const igual = (x, y) => JSON.stringify(x || null) === JSON.stringify(y || null);
        // Los valores reflejan lo que hay bajo los filtros activos de cada tabla, no siempre
        // el índice completo — igual que el resto de los módulos (jorge).
        marcarKpi = () => {
          cont.querySelectorAll('[data-kpi]').forEach((t) => {
            const d = defs[Number(t.dataset.kpi)];
            const f = filtrosActuales[d.modulo] || {};
            t.classList.toggle('stat-tile-activo', memoria.modulo === d.modulo && campos[d.modulo].every((c) => igual(f[c], d.filtros[c])));
            const valorEl = t.querySelector('.stat-value');
            if (valorEl) valorEl.textContent = miles(d.calcular(filasDe(d.modulo)));
          });
        };
        const clic = (t) => {
          const d = defs[Number(t.dataset.kpi)];
          const quitar = t.classList.contains('stat-tile-activo') && Object.keys(d.filtros).length > 0;
          mostrarModulo(d.modulo);
          const tabla = crearTabla(d.modulo);
          campos[d.modulo].forEach((c) => tabla.setFiltro(c, quitar ? null : (d.filtros[c] || null)));
          marcarKpi();
        };
        cont.querySelectorAll('[data-kpi]').forEach((t) => {
          t.addEventListener('click', () => clic(t));
          t.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); clic(t); } });
        });
        marcarKpi();
        $('#ln-num-equipos', raiz).textContent = miles(eq.length);
        $('#ln-num-lineas', raiz).textContent = miles(li.length);
      }

      // ---- Selección estilo Google Drive (30-sep): acciones de la barra, del ⋮ y del clic derecho ----
      let puedeOperarTabla = false;
      cargarPermisos().then((p) => {
        puedeOperarTabla = !!(p && p.puedeOperar);
        Object.keys(tablas).forEach((m) => { if (tablas[m]) tablas[m].refrescarSeleccion(); });
      }).catch(() => { /* sin permisos: solo las acciones de consulta */ });
      const ACCION_REASIGNAR = ACCIONES_MASIVAS.filter((a) => a.clave === 'REASIGNAR')[0];


      /** Abre la ficha directo en una pestaña (p. ej. Historial desde el menú). */
      function abrirEnPestana(tipo, id, pestana) {
        const existente = pila.findIndex((x) => x.tipo === tipo && x.id === id);
        if (existente >= 0) pila.splice(existente + 1); else pila.push({ tipo: tipo, id: id, etiqueta: null });
        pila[pila.length - 1].pestana = pestana;
        abrir(tipo, id, true);
      }

      /**
       * enBarra (por omisión) = a la vista en la barra azul; enBarra: false = dentro de ⋮. El clic derecho y el ⋮ de la
       * fila muestran todas. `grupo` separa con una línea en el menú. Reparto acordado con el usuario el 30-sep. Las
       * acciones no dependen del estatus («¿Qué pasó?» se quitó el 4-oct, usuario) y los estatus se cambian en Editar
       * (sin «Cambiar estatus», 4-oct).
       * Sin acciones masivas por ahora (usuario, 3-oct): todas son de un registro a la vez (UNO) hasta pulir cada
       * proceso; después se regresan las de varios.
       */
      function accionesSeleccionDe(modulo) {
        const tipo = TABLAS_INVENTARIO[modulo].detalle;
        const operar = () => puedeOperarTabla;
        const UNO = 1; // sin acciones masivas por ahora
        const detalles = { icono: 'info', texto: 'Detalles', titulo: 'Panel con lo fundamental; sigue a la fila que selecciones', maximo: 1, grupo: 'ver',
          activo: () => detallesAbiertos, alHacer: (f) => (detallesAbiertos && panelAbierto ? panelAbierto.cerrar() : mostrarDetalles(tipo, f[0])) };
        const editar = { icono: 'pencil', texto: 'Editar información', maximo: 1, enBarra: false, grupo: 'abrir', visible: operar, alHacer: (f) => abrirEditor(f[0].id) };
        const historial = { icono: 'history', texto: 'Historial', maximo: 1, enBarra: false, grupo: 'linea', alHacer: (f) => abrirEnPestana(tipo, f[0].id, 'historial') };
        if (modulo === 'equipos') {
          return [detalles,
            { icono: 'archive', texto: 'Mandar a resguardo', titulo: 'El equipo con su ubicación y el estatus de su línea; se cierra la asignación de la persona', maximo: UNO, grupo: 'mover',
              visible: operar, alHacer: (f) => abrirResguardo(f) },
            { icono: 'user-round-pen', texto: 'Reasignar', titulo: 'Asigna el equipo a otro responsable', maximo: UNO, grupo: 'mover', visible: operar,
              alHacer: (f) => abrirReasignar(f[0]) },
            editar,
            // Documentos separados por tipo, con su título, para no confundir "nueva" con "ver la última" (usuario, 30-sep)
            { icono: 'clipboard-check', texto: 'Nueva inspección', maximo: 1, enBarra: false, grupo: 'inspeccion', tituloGrupo: 'Inspección', visible: operar,
              alHacer: (f) => abrirCaptura('INSPECCION', { equipoId: f[0].id }) },
            { icono: 'file-search', texto: 'Ver última inspección', maximo: 1, enBarra: false, grupo: 'inspeccion', tituloGrupo: 'Inspección', visible: (f) => tieneNuco(f[0]),
              alHacer: (f) => abrirUltimoDesdeMenu('INSPECCION', f[0].id) },
            { icono: 'signature', texto: 'Nueva responsiva', maximo: 1, enBarra: false, grupo: 'responsiva', tituloGrupo: 'Responsiva', visible: operar,
              alHacer: (f) => abrirCaptura('RESPONSIVA', { equipoId: f[0].id }) },
            { icono: 'file-text', texto: 'Ver última responsiva', maximo: 1, enBarra: false, grupo: 'responsiva', tituloGrupo: 'Responsiva', visible: (f) => tieneNuco(f[0]),
              alHacer: (f) => abrirUltimoDesdeMenu('RESPONSIVA', f[0].id) },
            // Lo de la línea (estatus, cancelación) se hace desde la línea (usuario, 4-oct)
            { icono: 'card-sim', texto: 'Ir a la línea', maximo: 1, grupo: 'mover', visible: (f) => !!f[0].lineaId, alHacer: (f) => abrir('linea', f[0].lineaId) },
            historial];
        }
        return [detalles,
          { icono: 'phone-off', texto: 'Mandar a cancelación', titulo: 'Pasa a la bandeja de cancelaciones de quien la tramita; el equipo no cambia', maximo: UNO, grupo: 'mover',
            visible: operar, alHacer: (f) => abrirCancelacion(f) },
          { icono: 'smartphone', texto: 'Ir al equipo', maximo: 1, grupo: 'mover', visible: (f) => !!f[0].equipoId, alHacer: (f) => abrir('equipo', f[0].equipoId) },
          editar, historial];
      }

      // "Detalles" = la vista rápida como el panel "Ver detalles" de Drive: abierto, sigue a la fila seleccionada
      let detallesAbiertos = false;
      function mostrarDetalles(tipo, r) {
        vistaRapida(tipo, r, { noModal: true });
        detallesAbiertos = true;
        if (panelAbierto) {
          panelAbierto.alCerrar = () => {
            detallesAbiertos = false;
            Object.keys(tablas).forEach((m) => { if (tablas[m]) tablas[m].refrescarSeleccion(); });
          };
        }
      }
      function alCambiarSeleccion(modulo, filas) {
        if (detallesAbiertos && filas.length === 1 && modulo === memoria.modulo && vigente()) mostrarDetalles(TABLAS_INVENTARIO[modulo].detalle, filas[0]);
        marcarTarjetasSeleccionadas(modulo);
      }
      function marcarTarjetasSeleccionadas(modulo) {
        const cont = $('#ln-tarjetas-' + modulo, raiz);
        if (!cont || !tablas[modulo]) return;
        const sel = new Set(tablas[modulo].getSeleccion().map((r) => r.id));
        cont.querySelectorAll('.ln-cuadro[data-id]').forEach((b) => {
          b.classList.toggle('ln-cuadro-sel', sel.has(b.dataset.id));
          b.setAttribute('aria-pressed', String(sel.has(b.dataset.id)));
        });
      }

      // ---- Listado: una DataTable por pestaña (se crea al mostrarla) ----
      function crearTabla(modulo) {
        if (tablas[modulo]) return tablas[modulo];
        const cfg = TABLAS_INVENTARIO[modulo];
        const contenedor = $('#ln-tabla-' + modulo, raiz);
        tablas[modulo] = tablaLineas(contenedor, {
          idCampo: 'id',
          idTabla: 'lineas-' + modulo + '-v4',
          columnas: cfg.columnas,
          textoVacio: cfg.textoVacio,
          exportar: exportarBase('INVENTARIO', 'Lineas telefonicas'),
          etiquetaFila: cfg.etiqueta,
          detalle: false, // la ficha completa (responsable, evidencias, historial) es su propia pantalla
          // Estilo Google Drive (30-sep): clic = seleccionar (barra con lo más usado y ⋮), doble clic = ficha,
          // "Detalles" = la vista rápida que sigue a la selección; con el dedo, tocar abre la vista rápida
          accionesSeleccion: accionesSeleccionDe(modulo),
          alAbrirFila: (r) => abrir(cfg.detalle, r.id),
          alTocarFila: (r) => vistaRapida(cfg.detalle, r),
          alCambiarSeleccion: (filas) => alCambiarSeleccion(modulo, filas),
          ayuda: 'Como en Google Drive: un clic selecciona la fila y arriba aparecen sus acciones; ⋮ (o el clic derecho) trae las demás. ' +
            'Doble clic abre la ficha. Ctrl+clic agrega o quita filas y Shift+clic marca un rango; para marcar varias arrastrando, empieza ' +
            'fuera de las filas (en el espacio de abajo). "Detalles" abre el panel de la derecha, que sigue a la fila que selecciones. ' +
            'Esc quita la selección. En celular: tocar abre la vista rápida y mantener presionado selecciona. ' +
            'La flecha de cada columna filtra, ordena, fija u oculta; ' +
            '"Vista" agrega las demás columnas del AppSheet (compañía, sede, comentarios, PIN…). "Última responsiva" y "Última inspección" ' +
            'abren la más reciente de la carpeta del NUCO en NUCOS. Los indicadores de arriba filtran con un clic.',
          alCambiarFiltros: (filtros) => { filtrosActuales[modulo] = filtros || {}; if (marcarKpi) marcarKpi(); marcarTipos(modulo); },
        });
        // La tabla se repinta con cada filtro, búsqueda, orden o KPI: las tarjetas la siguen
        let repintePendiente = false;
        new MutationObserver(() => {
          if (memoria.modoVista !== 'tarjetas' || repintePendiente) return;
          repintePendiente = true;
          requestAnimationFrame(() => { repintePendiente = false; tarjetasVisibles[modulo] = PASO_TARJETAS; pintarTarjetas(modulo); });
        }).observe(contenedor.querySelector('tbody'), { childList: true });
        if (memoria.indice) tablas[modulo].setDatos(memoria.indice[modulo]);
        return tablas[modulo];
      }

      // ---- Vista rápida: panel lateral con lo fundamental (sin ir al servidor: sale del índice y la vista) ----
      /** Días al fin del adendum como chip (vencido / vence pronto / vigente). */
      function chipAdendum(valor) {
        if (!valor) return '';
        const d = new Date(valor);
        if (isNaN(d)) return '';
        const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
        const dias = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - hoy) / 864e5);
        if (dias < 0) return chip('Vencido hace ' + miles(-dias) + ' días', 'rojo');
        if (dias <= 30) return chip(dias === 0 ? 'Vence hoy' : 'Vence en ' + dias + ' días', 'ambar');
        return chip('Vigente', 'verde');
      }

      function vistaRapida(tipo, r, opciones) {
        const v = (c) => (r[c] === undefined || r[c] === null ? '' : r[c]);
        const nuco = r.nuco || r.nucoEquipo || v('NUCO');
        const titulo = tipo === 'equipo' ? 'NUCO ' + (nuco || '—') : 'Línea ' + (r.numero || v('NUMERO TELEFONO') || '—');
        const sub = tipo === 'equipo' ? [r.modelo || v('EQUIPO'), r.numero ? 'Línea ' + r.numero : 'Sin línea'].filter(Boolean).join(' · ')
          : [r.compania || v('COMPAÑIA'), nuco ? 'NUCO ' + nuco : 'Suelta'].filter(Boolean).join(' · ');
        const panel = abrirPanelLateral(titulo, sub, opciones);
        if (tieneNuco(r)) precargarUltimosNucos(r.id); // "Última responsiva / inspección" listos al dar clic
        const campo = (t, valor, html) => '<div class="dt-campo"><div class="dt-campo-titulo">' + esc(t) + '</div><div class="dt-campo-valor">' +
          (html ? (valor || vacio) : guion(valor)) + '</div></div>';
        const seccion = (icono, t, filas) => '<section class="ln-vr-seccion"><h4>' + ico(icono) + ' ' + esc(t) + '</h4>' + filas.join('') + '</section>';
        const finPlan = v('FIN PLAN');
        // Todo conectado: desde el equipo se salta a su línea y desde la línea a su equipo, sin salir de la vista rápida
        const ix = memoria.indice || { equipos: [], lineas: [] };
        const suLinea = tipo === 'equipo' ? ix.lineas.filter((x) => x.id === r.id)[0] : null;
        const suEquipo = tipo === 'linea' ? ix.equipos.filter((x) => x.id === (r.equipoId || r.id))[0] : null;
        const saltar = (destino, texto, icon) => '<button type="button" class="ln-ir-chip" data-vr-ir="' + destino + '">' + ico(icon) +
          '<span>' + esc(texto) + '</span>' + ico('chevron-right') + '</button>';
        const numero = r.numero || v('NUMERO TELEFONO');
        const celdaNumero = suLinea && numero ? saltar('linea', numero, 'card-sim') : numero;
        const celdaNuco = suEquipo && nuco ? saltar('equipo', 'NUCO ' + nuco, 'smartphone') : nuco;
        panel.cuerpo.innerHTML =
          '<div class="ln-vr-resumen"><div class="ln-chips">' +
            (v('ESTATUS EQUIPO') ? chip('Equipo: ' + v('ESTATUS EQUIPO'), COLOR_ESTATUS[String(v('ESTATUS EQUIPO')).toUpperCase()]) : '') +
            (v('ESTATUS LINEA') ? chip('Línea: ' + v('ESTATUS LINEA'), COLOR_ESTATUS[String(v('ESTATUS LINEA')).toUpperCase()]) : '') +
            (formatoAppSheet('LINEAS', 'TIPO', r.tipoHoja) || (r.tipoHoja ? chip(r.tipoHoja) : '')) +
          '</div><div class="ln-vr-acciones">' +
            '<button type="button" class="ln-btn-icono" data-vr-ficha>' + icono('maximize-2') + ' Abrir ficha completa</button>' +
            (tieneNuco(r) ? botonUltimoNucos('RESPONSIVA', r.id).replace(' Ver</button>', ' Última responsiva</button>') +
              botonUltimoNucos('INSPECCION', r.id).replace(' Ver</button>', ' Última inspección</button>') : '') +
          '</div></div>' +
          seccion('user', 'Responsable', [
            campo('Responsable', v('RESPONSABLE') || r.responsable), campo('No. empleado', v('NO EMPLEADO')), campo('Puesto', v('PUESTO')),
            campo('Departamento', v('DEPARTAMENTO') || r.departamento), campo('Área', v('AREA')),
            campo('Sede', v('SEDE') || r.sede), campo('Oficina / desarrollo', v('OFICINA / DESARROLLO')), campo('Jefe directo', v('JEFE DIRECTO')),
          ]) +
          seccion('smartphone', 'Equipo', [
            campo('NUCO', celdaNuco, !!suEquipo && !!nuco), campo('Modelo', r.modelo || v('EQUIPO')), campo('IMEI', v('IMEI') || r.imei),
            campo('Accesorios', v('ACCESORIOS')), campo('Última inspección', fecha(v('FECHA INSPECCION'))),
          ]) +
          seccion('card-sim', 'Línea', [
            campo('Número', celdaNumero, !!suLinea && !!numero), campo('SIM', v('NUMERO SIM') || r.sim), campo('Compañía', r.compania || v('COMPAÑIA')),
            campo('Razón social', v('RAZON SOCIAL')), campo('Costo del plan', v('COSTO PLAN') !== '' ? '$' + Number(v('COSTO PLAN')).toLocaleString('es-MX') : ''),
            campo('Fin del adendum', finPlan ? esc(fecha(finPlan) || finPlan) + ' ' + chipAdendum(finPlan) : '', true),
          ]) +
          (v('COMENTARIOS') ? seccion('message-square-text', 'Comentarios', ['<p class="ln-vr-comentario">' + esc(v('COMENTARIOS')) + '</p>']) : '');
        panel.cuerpo.querySelector('[data-vr-ficha]').addEventListener('click', () => { panel.cerrar(); abrir(tipo, r.id); });
        panel.cuerpo.addEventListener('click', (ev) => {
          const b = ev.target.closest('[data-vr-ir]');
          if (!b) return;
          if (b.dataset.vrIr === 'linea' && suLinea) vistaRapida('linea', suLinea, opciones);
          if (b.dataset.vrIr === 'equipo' && suEquipo) vistaRapida('equipo', suEquipo, opciones);
        });
        pintarIconos(panel.cuerpo);
      }

      // ---- Vista de tarjetas (antes el módulo "Detalles Líneas Telefónicas") ----
      // Muestra lo mismo que la tabla: la búsqueda, los filtros de columna, el orden y los KPIs de arriba.

      function tarjetaInventario(modulo, r) {
        const tipo = formatoAppSheet('LINEAS', 'TIPO', r.tipoHoja) || guion(r.tipoHoja);
        const pie = (izq, der) => '<div class="ln-cuadro-pie"><span>' + izq + '</span><span>' + der + '</span></div>';
        if (modulo === 'equipos') {
          return '<button type="button" class="card ln-cuadro ln-cuadro-activo" data-ln-ir="equipo" data-id="' + esc(r.id) + '" aria-label="Abrir NUCO ' + esc(r.nuco || '') + '">' +
            '<div class="ln-cuadro-superior"><span class="ln-cuadro-folio ln-mono">NUCO ' + guion(r.nuco) + '</span><span class="ln-cuadro-tipo">' + tipo + '</span></div>' +
            '<div class="ln-cuadro-depto">' + guion(r.departamento) + '</div>' +
            '<div class="ln-cuadro-principal">' + guion(r.responsable) + '</div>' +
            '<div class="ln-cuadro-secundario">' + guion(r.modelo) + '</div>' +
            pie(icono('phone') + ' <span class="ln-mono">' + (r.numero ? esc(r.numero) : 'Sin línea') + '</span>', icono('scan-line') + ' <span class="ln-mono">' + guion(r.imei) + '</span>') +
            pie(chip(r.estatus), 'Ver ficha ' + icono('chevron-right')) + '</button>';
        }
        return '<button type="button" class="card ln-cuadro ln-cuadro-activo" data-ln-ir="linea" data-id="' + esc(r.id) + '" aria-label="Abrir línea ' + esc(r.numero || '') + '">' +
          '<div class="ln-cuadro-superior"><span class="ln-cuadro-folio ln-mono">' + guion(r.numero) + '</span><span class="ln-cuadro-tipo">' + tipo + '</span></div>' +
          '<div class="ln-cuadro-depto">' + guion(r.departamento) + '</div>' +
          '<div class="ln-cuadro-principal">' + guion(r.responsable) + '</div>' +
          '<div class="ln-cuadro-secundario">' + guion(r.compania) + '</div>' +
          pie(icono('card-sim') + ' <span class="ln-mono">' + guion(r.sim) + '</span>', r.suelta ? chip('Suelta', 'ambar') : icono('smartphone') + ' NUCO ' + guion(r.nucoEquipo)) +
          pie(chip(r.estatus), 'Ver ficha ' + icono('chevron-right')) + '</button>';
      }

      function pintarTarjetas(modulo) {
        const cont = $('#ln-tarjetas-' + modulo, raiz);
        if (!cont || memoria.modoVista !== 'tarjetas' || !tablas[modulo]) return;
        const filas = tablas[modulo].getFiltradas();
        const visibles = Math.min(tarjetasVisibles[modulo], filas.length);
        cont.innerHTML = (filas.length
          ? '<div class="ln-cuadros-grid">' + filas.slice(0, visibles).map((r) => tarjetaInventario(modulo, r)).join('') + '</div>'
          : '<p class="empty-state">' + (memoria.indice ? 'No hay registros que coincidan con la búsqueda o los filtros.' : '<span class="ln-spinner"></span> Cargando…') + '</p>') +
          '<div class="ln-cuadros-mas"><span class="ln-tenue">Mostrando ' + miles(visibles) + ' de ' + miles(filas.length) + '</span>' +
          (visibles < filas.length ? '<button type="button" class="secondary" data-ln-mas-tarjetas="' + modulo + '">Mostrar más</button>' : '') + '</div>';
        marcarTarjetasSeleccionadas(modulo);
      }

      function aplicarModoVista() {
        const tarjetas = memoria.modoVista === 'tarjetas';
        $('#ln-listado', raiz).classList.toggle('ln-modo-tarjetas', tarjetas);
        raiz.querySelectorAll('#ln-modo-vista [data-modo]').forEach((b) => {
          const activo = b.dataset.modo === memoria.modoVista;
          b.classList.toggle('activo', activo);
          b.setAttribute('aria-pressed', String(activo));
        });
        ['equipos', 'lineas'].forEach((m) => { $('#ln-tarjetas-' + m, raiz).hidden = !tarjetas; });
        if (tarjetas) { tarjetasVisibles[memoria.modulo] = PASO_TARJETAS; pintarTarjetas(memoria.modulo); }
        else if (tablas[memoria.modulo]) tablas[memoria.modulo].ajustarAlto();
      }

      function mostrarModulo(modulo, sinTabla) {
        memoria.modulo = modulo;
        raiz.querySelectorAll('#ln-tabs .tab-btn').forEach((t) => t.classList.toggle('active', t.dataset.tab === modulo));
        raiz.querySelectorAll('#ln-listado .tab-panel').forEach((p) => { p.hidden = p.dataset.tabPanel !== modulo; });
        if (sinTabla) return;
        crearTabla(modulo).ajustarAlto();
        if (memoria.modoVista === 'tarjetas') pintarTarjetas(modulo);
        if (marcarKpi) marcarKpi();
      }

      // ---- Filtro rápido por tipo: columna a la izquierda, como la lista agrupada del AppSheet (usuario, 1-oct) ----
      // Las MISMAS opciones en Equipos y en Líneas (todas las del AppSheet, aunque hoy tengan 0) con el ícono y el color de
      // la columna Tipo y cuántos registros hay (como el AppSheet: registros de la hoja, sin contar dos veces un equipo con
      // línea). Clic = solo ese tipo; si en esta pestaña no hay de ese tipo (una LINEA suelta en Equipos), lleva a la
      // otra pestaña con el filtro. Otra vez (o Todos) = todos. Es una franja de íconos que se despliega con el mouse
      // (o el teclado) por encima de la tabla, como el menú lateral de Gmail: sin botón y sin mover la tabla (solo CSS).
      const ORDEN_TIPOS = ['EQUIPO', 'EQUIPO + SIM', 'EQUIPO + SIM BASICO', 'LINEA', 'LINEA BASICA', 'BANDA ANCHA', 'MODEM', 'CAMARA'];
      const TIPOS_APPSHEET = ORDEN_TIPOS.filter((t) => t !== 'CAMARA'); // la lista del AppSheet; CAMARA solo si hay
      const PESTANA_TIPO = { 'LINEA': 'lineas', 'LINEA BASICA': 'lineas' }; // sin registros: a dónde lleva (el resto, Equipos)
      const NOMBRE_TIPO = { 'EQUIPO': 'Equipo', 'EQUIPO + SIM': 'Equipo + SIM', 'EQUIPO + SIM BASICO': 'Equipo + SIM básico', 'LINEA': 'Línea',
        'LINEA BASICA': 'Línea básica', 'BANDA ANCHA': 'Banda ancha', 'MODEM': 'Módem', 'CAMARA': 'Cámara' };
      /** { tipo: { total (registros únicos), equipos, lineas } } de todo el inventario. */
      function conteoTipos() {
        const c = {};
        const vistos = {};
        ['equipos', 'lineas'].forEach((m) => memoria.indice[m].forEach((r) => {
          const t = r.tipoHoja || '';
          const x = c[t] = c[t] || { total: 0, equipos: 0, lineas: 0 };
          x[m]++;
          if (!vistos[r.id]) { vistos[r.id] = true; x.total++; }
        }));
        return c;
      }
      /** Pestaña donde se filtra un tipo: la actual si tiene de ese tipo; si no, la que sí tiene. */
      function pestanaDeTipo(t, actual) {
        const x = conteoTipos()[t];
        if (x && x[actual]) return actual;
        if (x) return x.equipos ? 'equipos' : 'lineas';
        return PESTANA_TIPO[t] || 'equipos';
      }
      function pintarTipos(modulo) {
        const cont = $('#ln-tipos-' + modulo, raiz);
        if (!cont || !memoria.indice) return;
        const conteo = conteoTipos();
        const tipos = TIPOS_APPSHEET.concat(Object.keys(conteo).filter((t) => TIPOS_APPSHEET.indexOf(t) < 0)).sort((a, b) => {
          const ia = ORDEN_TIPOS.indexOf(a);
          const ib = ORDEN_TIPOS.indexOf(b);
          return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
        });
        const total = Object.keys(conteo).reduce((s, t) => s + conteo[t].total, 0);
        const regla = (t) => ((REGLAS_FORMATO.LINEAS || {}).TIPO || {})[t] || null;
        const fila = (valor, icono, color, nombre, n) =>
          '<button type="button" class="ln-tipo' + (n ? '' : ' ln-tipo-vacio') + '" data-tipo="' + esc(valor) + '" aria-pressed="false" title="' + esc(nombre + ' · ' + miles(n)) + '">' +
            '<span class="ln-tipo-ico"' + (color ? ' style="color:' + esc(color) + '"' : '') + '>' + ico(icono) + '</span>' +
            '<span class="ln-tipo-nombre">' + esc(nombre) + '</span><span class="ln-tipo-num">' + miles(n) + '</span></button>';
        cont.innerHTML = '<div class="ln-tipos-panel"><div class="ln-tipos-titulo">Tipo</div>' +
          fila('*', 'layers', '', 'Todos', total) +
          tipos.map((t) => {
            const r = regla(t);
            return fila(t, (r && r.icono) || 'circle', r ? colorAppSheet(r.color) : '', t ? (NOMBRE_TIPO[t] || t) : 'Sin tipo', conteo[t] ? conteo[t].total : 0);
          }).join('') + '</div>';
        marcarTipos(modulo);
      }
      function marcarTipos(modulo) {
        const cont = $('#ln-tipos-' + modulo, raiz);
        if (!cont) return;
        const f = (filtrosActuales[modulo] || {}).tipoHoja;
        const elegidos = f && f.valores && f.valores.length ? f.valores : null;
        cont.querySelectorAll('.ln-tipo').forEach((b) => {
          const activo = b.dataset.tipo === '*' ? !elegidos : !!(elegidos && elegidos.indexOf(b.dataset.tipo) >= 0);
          b.classList.toggle('activo', activo);
          b.setAttribute('aria-pressed', String(activo));
        });
      }
      ['equipos', 'lineas'].forEach((modulo) => {
        $('#ln-tipos-' + modulo, raiz).addEventListener('click', (ev) => {
          const b = ev.target.closest('.ln-tipo');
          if (!b) return;
          const t = b.dataset.tipo;
          if (t === '*' || b.classList.contains('activo')) {
            crearTabla(modulo).setFiltro('tipoHoja', null);
            marcarTipos(modulo);
            return;
          }
          // Un tipo que vive en la otra pestaña (LINEA estando en Equipos): se va allá con el filtro
          const destino = pestanaDeTipo(t, modulo);
          if (destino !== modulo) mostrarModulo(destino);
          crearTabla(destino).setFiltro('tipoHoja', { valores: [t] });
          marcarTipos(destino);
        });
      });

      function pintarListado() {
        if (!memoria.indice) return;
        Object.keys(tablas).forEach((m) => tablas[m].setDatos(memoria.indice[m]));
        pintarTipos('equipos');
        pintarTipos('lineas');
        mostrarModulo(memoria.modulo);
        $('#ln-conteo', raiz).textContent = 'Datos de la hoja al ' + fechaHora(memoria.indice.generadoEn) + '.';
      }

      // ---- Atrás / Adelante del navegador (html/historial-navegador.html) ----
      // Cada ficha que se abre es un paso; la pestaña solo actualiza el paso actual (no llena el historial).
      const pilaParaHistorial = () => ({ pila: pila.map((p) => ({ tipo: p.tipo, id: p.id, etiqueta: p.etiqueta || null, pestana: p.pestana || null })) });
      function pasoHistorial() { if (typeof HistorialApp !== 'undefined') HistorialApp.paso(pilaParaHistorial()); }
      /** Aplica un paso guardado: la lista (sin pila) o la ficha de hasta arriba de su pila. No guarda otro paso. */
      function restaurarPaso(sub) {
        if (panelAbierto) panelAbierto.cerrar();
        const destino = sub && sub.pila && sub.pila.length ? sub.pila : null;
        if (!destino) { if (pila.length) cerrarDetalle(true); return; }
        pila.length = 0;
        destino.forEach((p) => pila.push(Object.assign({}, p)));
        const arriba = pila[pila.length - 1];
        abrir(arriba.tipo, arriba.id, true, true);
      }

      // ---- Detalle ----
      function abrir(tipo, id, sinApilar, sinHistorial) {
        if (!sinApilar) {
          const existente = pila.findIndex((p) => p.tipo === tipo && p.id === id);
          if (existente >= 0) pila.splice(existente + 1);
          else pila.push({ tipo: tipo, id: id, etiqueta: tipo === 'inspeccion' ? 'Inspección' : null });
        }
        if (!sinHistorial) pasoHistorial();
        $('#ln-listado', raiz).hidden = true;
        soltarHistorial();
        soltarDocumentos();
        const detalle = $('#ln-detalle', raiz);
        detalle.hidden = false;
        detalle.innerHTML = migas() + '<div class="card ln-cargando"><span class="ln-spinner"></span> Cargando…</div>';
        document.getElementById('view-container').scrollTop = 0;
        window.scrollTo(0, 0);
        const pintar = { equipo: pintarEquipo, linea: pintarLinea, inspeccion: pintarInspeccion }[tipo];
        pintar(detalle, id).catch((e) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== tipo || pila[pila.length - 1].id !== id) return;
          detalle.innerHTML = migas() + '<div class="card"><p class="error-msg">No se pudo cargar: ' + mensajeError(e) + '</p></div>';
        });
      }

      /** Abre un registro sabiendo solo su ID (equipo si existe como equipo; si no, línea). */
      function abrirRegistro(id) {
        const esEquipo = memoria.indice.equipos.some((e) => e.id === id);
        abrir(esEquipo ? 'equipo' : 'linea', id);
      }

      function volver() {
        pila.pop();
        const anterior = pila[pila.length - 1];
        if (anterior) abrir(anterior.tipo, anterior.id, true);
        else cerrarDetalle();
      }

      function cerrarDetalle(sinHistorial) {
        if (sinHistorial !== true && typeof HistorialApp !== 'undefined') HistorialApp.paso(null);
        soltarHistorial();
        soltarDocumentos();
        pila.length = 0;
        $('#ln-detalle', raiz).hidden = true;
        $('#ln-detalle', raiz).innerHTML = '';
        $('#ln-listado', raiz).hidden = false;
        // Refleja altas y ediciones hechas desde la ficha (el índice ya se recargó al guardar)
        if (memoria.indice) { pintarIndicadores(); pintarListado(); }
      }

      /**
       * Migas: Líneas Telefónicas › NUCO 0008 › Línea 4421155221 › Inspección 18 ago 2026. Cada nivel se nombra por lo que
       * ES (un equipo por su NUCO, una línea por su número, una inspección por su fecha), la página actual va en negritas
       * y los anteriores son enlaces discretos. "Volver" dice a dónde regresa. En celular solo se ven Volver y la actual.
       */
      const ETIQUETA_MIGA = { equipo: 'Equipo', linea: 'Línea', inspeccion: 'Inspección' };
      const etiquetaMiga = (p) => (p ? p.etiqueta || ETIQUETA_MIGA[p.tipo] : 'Líneas Telefónicas');
      function migas() {
        const anterior = pila.length > 1 ? pila[pila.length - 2] : null;
        return '<nav class="ln-migas" aria-label="Ruta"><button type="button" class="secondary ln-btn-icono" data-ln-volver title="Volver a ' +
          esc(etiquetaMiga(anterior)) + '">' + icono('chevron-left') + ' <span class="ln-migas-volver">Volver a ' + esc(etiquetaMiga(anterior)) + '</span></button>' +
          '<ol class="ln-migas-ruta"><li><a href="#" class="ln-miga-enlace" data-ln-lista>Líneas Telefónicas</a></li>' +
          pila.map((p, i) => '<li>' + icono('chevron-right', 'ln-icon-sm') +
            (i < pila.length - 1 ? '<button type="button" class="ln-miga-enlace" data-ln-miga="' + i + '">' + esc(etiquetaMiga(p)) + '</button>' :
              '<span class="ln-miga-actual" aria-current="page">' + esc(etiquetaMiga(p)) + '</span>') + '</li>').join('') + '</ol></nav>';
      }

      function campos(pares) {
        return '<dl class="ln-campos">' + pares.filter(Boolean).map((p) =>
          '<dt>' + esc(p[0]) + '</dt><dd>' + (p[2] ? (p[1] || vacio) : guion(p[1])) + '</dd>').join('') + '</dl>';
      }

      function tarjeta(titulo, cuerpo, clase) {
        return '<div class="card ln-card ' + (clase || '') + '"><h3>' + titulo + '</h3>' + cuerpo + '</div>';
      }

      function tarjetaResponsable(r, titulo) {
        r = r || {};
        const adicionales = (r.usuariosAdicionales || []).length
          ? '<div class="ln-subtitulo">Usuarios adicionales</div>' + campos(r.usuariosAdicionales.map((u) => [u.rol, esc(u.nombre) + (u.puesto ? ' <span class="ln-tenue">· ' + esc(u.puesto) + '</span>' : ''), true]))
          : '';
        return tarjeta(icono('user') + ' ' + esc(titulo || 'Responsable'), campos([
          ['Nombre', (r.nombres && r.nombres.length > 1) ? r.nombres.map(esc).join('<br>') : esc(r.nombre || ''), true],
          r.codigoResguardo ? ['Código de resguardo', r.codigoResguardo] : null,
          ['No. empleado', r.noEmpleado],
          ['Puesto', r.puesto],
          ['Departamento', r.departamento],
          ['Área', r.area],
          ['Sede', r.sede],
          ['Oficina / desarrollo', r.oficina],
          ['Jefe directo', r.jefeDirecto],
          ['Director', r.director],
          // La razón social es de la línea (el contrato), no del responsable: se ve en la tarjeta de la línea
        ]) + adicionales);
      }

      /** TIPO del registro (columna TIPO del AppSheet) con su color e ícono. */
      function tipoRegistro(legado) {
        const t = legado && legado.tipo;
        return t ? formatoAppSheet('LINEAS', 'TIPO', t) || esc(t) : vacio;
      }

      /**
       * Encabezado de la ficha: qué es, su estado, las acciones y un resumen rápido con lo que más se
       * consulta (para revisar un equipo o línea sin bajar por la página).
       */
      function encabezado(ico, titulo, chips, botones, resumen) {
        const datos = (resumen || []).filter(Boolean);
        return '<div class="ln-detalle-header card">' +
          '<div class="ln-detalle-icono">' + icono(ico) + '</div>' +
          '<div class="ln-detalle-titulo"><h2>' + titulo + '</h2><div class="ln-chips">' + chips + '</div></div>' +
          '<div class="ln-detalle-botones">' + (botones || '') + '</div>' +
          (datos.length ? '<dl class="ln-resumen-rapido">' + datos.map((d) => '<div><dt>' + esc(d[0]) + '</dt><dd>' + (d[2] ? (d[1] || vacio) : guion(d[1])) + '</dd></div>').join('') + '</dl>' : '') +
          '</div>';
      }

      /**
       * Ficha en pestañas: General (datos), Detalles (texto para copiar), Documentos (inspecciones y
       * responsivas) e Historial. Lo esencial queda arriba y el resto a un toque, en vez de una página larguísima.
       */
      function fichaEnPestanas(general, detalles, conDocumentos) {
        const pestanas = [['general', 'General', 'layout-grid'], ['detalles', 'Detalles', 'clipboard-list'],
          conDocumentos ? ['documentos', 'Documentos', 'folder-check'] : null, ['historial', 'Historial', 'history']].filter(Boolean);
        // Al regresar a esta ficha (Volver o migas) se abre en la pestaña donde se estaba, no siempre en General
        const guardada = (pila[pila.length - 1] || {}).pestana;
        const activa = pestanas.some((t) => t[0] === guardada) ? guardada : 'general';
        const cargando = '<div class="card ln-card"><p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p></div>';
        return '<div class="tabs-simple ln-ficha-tabs" role="tablist" aria-label="Secciones de la ficha">' + pestanas.map((t) =>
          '<button type="button" class="tab-btn' + (t[0] === activa ? ' active' : '') + '" role="tab" aria-selected="' + (t[0] === activa) + '" data-ficha-tab="' + t[0] + '">' +
          icono(t[2]) + ' ' + t[1] + ' <span class="ln-tab-num" data-ficha-num="' + t[0] + '"></span></button>').join('') + '</div>' +
          '<div data-ficha-panel="general"' + (activa === 'general' ? '' : ' hidden') + '>' + general + '</div>' +
          '<div data-ficha-panel="detalles"' + (activa === 'detalles' ? '' : ' hidden') + '>' + detalles + '</div>' +
          (conDocumentos ? '<div data-ficha-panel="documentos"' + (activa === 'documentos' ? '' : ' hidden') + '><div id="ln-evidencias">' + cargando + '</div></div>' : '') +
          '<div data-ficha-panel="historial"' + (activa === 'historial' ? '' : ' hidden') + '><div id="ln-historial">' + cargando + '</div></div>';
      }

      function mostrarPestanaFicha(nombre) {
        if (pila.length) pila[pila.length - 1].pestana = nombre;
        if (typeof HistorialApp !== 'undefined') HistorialApp.actualizar(pilaParaHistorial());
        raiz.querySelectorAll('[data-ficha-tab]').forEach((b) => {
          const activa = b.dataset.fichaTab === nombre;
          b.classList.toggle('active', activa);
          b.setAttribute('aria-selected', String(activa));
        });
        raiz.querySelectorAll('[data-ficha-panel]').forEach((p) => { p.hidden = p.dataset.fichaPanel !== nombre; });
        if (nombre === 'historial' && tablaHistorial) tablaHistorial.ajustarAlto();
        if (nombre === 'historial' && tablaAsignaciones && !$('#ln-asignaciones', raiz).hidden) tablaAsignaciones.ajustarAlto();
        if (nombre === 'documentos' && tablaDocumentos) tablaDocumentos.ajustarAlto();
      }

      function contarEnPestana(nombre, n) {
        const el = raiz.querySelector('[data-ficha-num="' + nombre + '"]');
        if (el) el.textContent = miles(n);
      }

      function pintarEquipo(detalle, id) {
        return llamar('apiLineasEquipo', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'equipo' || pila[pila.length - 1].id !== id) return;
          const e = r.equipo;
          const l = r.linea;
          const costo = l && l.costoPlan !== null && l.costoPlan !== undefined ? '$' + Number(l.costoPlan).toLocaleString('es-MX') : null;
          const puedeOperar = memoria.permisos && memoria.permisos.puedeOperar;
          pila[pila.length - 1].etiqueta = 'NUCO ' + (e.nuco || '—');
          const resp = e.responsable || {};
          fichaActual = { id: id, titulo: 'NUCO ' + (e.nuco || '—'), estatusEquipo: e.estatus || '', estatusLinea: null, carpetaDriveId: e.carpetaDriveId || null };
          if (e.nuco) precargarUltimosNucos(id);
          detalle.innerHTML = migas() +
            encabezado('smartphone', 'NUCO ' + esc(e.nuco || '—'),
              chip(e.estatus) + chip(TIPO_EQUIPO[e.tipo] || e.tipo, 'neutro') + (l ? chip('Con línea', 'verde') + usoTemporalVencido(l) : chip('Sin línea', 'ambar')),
              botonesFicha('data-equipo-id', id, 'equipo', puedeOperar, '', true),
              [['Responsable', resp.nombre], ['Modelo', e.modelo], ['IMEI', e.imei],
                ['Línea', l ? '<a href="#" class="ln-enlace ln-mono" data-ln-ir="linea" data-id="' + esc(l._id) + '">' + esc(l.numero || '(sin número)') + '</a>' + (l.compania ? ' · ' + esc(l.compania) : '') : '<span class="ln-tenue">Sin línea</span>', true],
                ['Departamento', resp.departamento]]) +
            fichaEnPestanas(
              (e._secretosVisibles ? '' : '<div class="ln-nota">' + icono('lock') + ' Los PIN, patrones y contraseñas solo los ven administradores y el área de Líneas.</div>') +
            '<div class="ln-grid-2">' +
              tarjeta(icono('smartphone') + ' Equipo', campos([
                ['Tipo', tipoRegistro(e.legado), true],
                ['Modelo', e.modelo], ['IMEI', e.imei], ['Color', e.color], ['Accesorios', (e.accesorios || []).join(', ')],
                e.tipo !== 'MODEM' && e.tipo !== 'BANDA_ANCHA' && e.tipo !== 'CAMARA' ? ['Cuenta Google', e.cuentaGoogle] : null,
                // PIN EQUIPO = PATRON con patrón guardado: solo la fila «Patrón» (no se repite la palabra, usuario 5-oct)
                (e.tipo === 'CELULAR' || e.tipo === 'CELULAR_BASICO') && !(e.patronRuta && /^PATR[OÓ]N$/i.test(String(e.pinEquipo || '').trim()))
                  ? ['PIN equipo', e.pinEquipo] : null,
                e.patronRuta ? ['Patrón', vistaPatron(e.patronRuta), true] : null,   // sin patrón (ni del AppSheet ni trazado) no se muestra
                e.tipo === 'MODEM' || e.tipo === 'BANDA_ANCHA' ? ['Contraseña módem', e.contrasenaModem] : null,
                e.simResidual ? ['SIM residual', chip(e.simResidual, 'ambar'), true] : null,
              ])) +
              tarjeta(icono('card-sim') + ' Línea asignada', l ? campos([
                ['Número', '<a href="#" class="ln-enlace ln-mono ln-accion-enlace" data-ln-ir="linea" data-id="' + esc(l._id) + '">' + icono('phone') + ' ' + esc(l.numero || '(sin número)') + ' ' + icono('chevron-right') + '</a>', true],
                ['Compañía', l.compania], ['Razón social', l.razonSocial], ['Estatus', chip(l.estatus), true], ['SIM', l.sim], ['PIN WhatsApp', l.pinWhatsapp],
                ['Costo plan', costo], ['Plan', [fecha(l.inicioPlan), fecha(l.finPlan)].filter(Boolean).join(' → ')],
              ]) : '<p class="empty-state">Este equipo no tiene línea asignada.</p>') +
              tarjetaResponsable(e.responsable) +
            '</div>', tarjetaDetallesCopiar(r.detalles), true);
          cargarPatronesAppSheet(detalle);
          cargarEvidencias(id);
          cargarHistorial(id, 'NUCO ' + (e.nuco || id), 'equipo');
        });
      }

      function pintarLinea(detalle, id) {
        return llamar('apiLineasLinea', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'linea' || pila[pila.length - 1].id !== id) return;
          const l = r.linea;
          const e = r.equipo;
          const costo = l.costoPlan !== null && l.costoPlan !== undefined ? '$' + Number(l.costoPlan).toLocaleString('es-MX') : null;
          const puedeOperarLinea = memoria.permisos && memoria.permisos.puedeOperar;
          // La miga nombra lo que se está viendo: la línea (antes decía el NUCO de su equipo y confundía)
          pila[pila.length - 1].etiqueta = 'Línea ' + (l.numero || '—');
          const respL = (e ? e.responsable : l.responsable) || {};
          fichaActual = { id: id, titulo: 'Línea ' + (l.numero || '—'), estatusEquipo: null, estatusLinea: l.estatus || '' };
          detalle.innerHTML = migas() +
            encabezado('card-sim', esc(l.numero || 'Línea sin número'), chip(l.estatus) + usoTemporalVencido(l) + (e ? chip('En NUCO ' + (e.nuco || '—'), 'neutro') : chip('Suelta', 'ambar')),
              // Con equipo, las capturas son del equipo: a la vista "Ver equipo"; suelta: sus capturas. El resto en ⋮
              botonesFicha('data-linea-id', id, 'linea', puedeOperarLinea && !e,
                e ? '<button type="button" class="ln-btn-icono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' Ver equipo</button>' : '', puedeOperarLinea),
              [['Responsable', respL.nombre], ['Compañía', l.compania], ['SIM', l.sim], ['Fin de plan', fecha(l.finPlan)],
                ['Equipo', e ? '<a href="#" class="ln-enlace ln-mono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">NUCO ' + esc(e.nuco || '—') + '</a>' + (e.modelo ? ' · ' + esc(e.modelo) : '') : '<span class="ln-tenue">Suelta</span>', true]]) +
            fichaEnPestanas(
            '<div class="ln-grid-2">' +
              tarjeta(icono('card-sim') + ' Línea', campos([
                !e ? ['Tipo', tipoRegistro(l.legado), true] : null,
                ['Compañía', l.compania], ['SIM', l.sim], ['PIN WhatsApp', l.pinWhatsapp], ['Razón social', l.razonSocial],
                ['Costo plan', costo], ['Inicio plan', fecha(l.inicioPlan)], ['Fin plan', fecha(l.finPlan)],
                l.usoTemporal ? ['Uso temporal', 'Desde ' + esc(fecha(l.usoTemporal.desde) || '—') + ' · ' + esc(l.usoTemporal.correo || ''), true] : null,
                !e && l.nucoLegado ? ['NUCO (anterior)', l.nucoLegado] : null,
              ])) +
              tarjeta(icono('smartphone') + ' Equipo', e ? campos([
                ['NUCO', '<a href="#" class="ln-enlace ln-mono ln-accion-enlace" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' ' + esc(e.nuco || '—') + ' ' + icono('chevron-right') + '</a>', true],
                ['Tipo', tipoRegistro(e.legado), true], ['Modelo', e.modelo], ['IMEI', e.imei], ['Estatus', chip(e.estatus), true],
              ]) : '<p class="empty-state">Línea suelta: no está instalada en un equipo de la empresa.</p>') +
              tarjetaResponsable(e ? e.responsable : l.responsable, e ? 'Responsable (del equipo)' : 'Responsable') +
            '</div>', tarjetaDetallesCopiar(r.detalles), !e);
          if (!e) cargarEvidencias(id);
          cargarHistorial(id, e ? 'NUCO ' + (e.nuco || id) : 'Linea ' + (l.numero || id), 'linea');
        });
      }

      /** Regla ESTATUS TEMPORAL del AppSheet: USO TEMPORAL con 13 días o más desde FECHA CAMBIO TEMPORAL (rojo, triángulo). */
      function usoTemporalVencido(l) {
        const desde = l && l.usoTemporal && l.usoTemporal.desde ? new Date(l.usoTemporal.desde) : null;
        if (!desde || isNaN(desde) || (Date.now() - desde.getTime()) / 3600000 < 13 * 24) return '';
        return '<span class="ln-regla ln-regla-chip" style="color:#F80000;font-weight:700;background:color-mix(in srgb, #F80000 12%, transparent);border:1px solid color-mix(in srgb, #F80000 45%, transparent)">' +
          ico('triangle-alert') + ' Uso temporal de ' + Math.floor((Date.now() - desde.getTime()) / 86400000) + ' días</span>';
      }

      /**
       * Acciones de la ficha (estilo Drive, usuario 30-sep): a la vista solo Nueva inspección y Nueva responsiva
       * (`conCaptura`; una línea en un equipo no captura, lo hace su equipo), luego `extra` (Drive o Ver equipo) y
       * al final ⋮ con todo lo demás (abrirMenuFicha). Sin permiso de operar solo queda `extra`.
       */
      function botonesFicha(atributoRef, id, tipo, conCaptura, extra, conMas) {
        const mas = conMas === undefined ? conCaptura : conMas;
        return (!conCaptura ? '' :
          '<button type="button" class="ln-btn-icono" data-ln-captura="INSPECCION" ' + atributoRef + '="' + esc(id) + '">' + icono('clipboard-check') + ' Nueva inspección</button>' +
          '<button type="button" class="ln-btn-icono" data-ln-captura="RESPONSIVA" ' + atributoRef + '="' + esc(id) + '">' + icono('signature') + ' Nueva responsiva</button>') +
