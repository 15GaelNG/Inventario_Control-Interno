          (r.numero ? esc(r.numero) : '<span class="ln-tenue">Sin línea</span>') + '</td></tr>';
        const filaLi = (r) => '<tr class="ln-fila-clic" data-ir="' + esc(r.id) + '"><td><button type="button" class="ln-btn-icono" data-ir="' + esc(r.id) + '">' + icono('phone') + ' ' + guion(r.numero) + ' ' + icono('chevron-right') + '</button>' +
          '</td><td>Línea suelta</td><td>' + guion(r.compania) + '</td><td>' + chip(r.estatus) + '</td><td>—</td></tr>';
        const filas = datos.equipos.map(filaEq).concat(datos.lineas.map(filaLi));
        return '<div class="card ln-card"><h3>' + icono('smartphone') + ' Líneas y equipos (' + filas.length + ')</h3>' +
          (filas.length
            ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>NUCO / Número</th><th>Tipo</th><th>Modelo / Compañía</th><th>Estatus</th><th>Línea</th></tr></thead><tbody>' + filas.join('') + '</tbody></table></div>'
            : '<p class="empty-state">Sin líneas ni equipos asignados a ' + esc(nombre) + '.</p>') + '</div>';
      }

      /** Vehículos del colaborador (apiListarVehiculosBasico, el mismo catálogo cacheado que
       *  ya usan Vehículos/Incidencias/Reasignaciones/etc. para autocompletar por folio) --
       *  mismo patrón que tarjetaLineas, pero clic va a la ficha de Vehículos (data-ir-vehiculo,
       *  no data-ir: ese es de Líneas/irARegistro). El identificador principal que se muestra
       *  es el NUCO (igual que en el resto de la app desde este ciclo), pero la navegación
       *  sigue usando el FOLIO real: verFichaVehiculoDesdeOtroModulo necesita folio, no nuco. */
      function tarjetaVehiculos(nombre, lista) {
        const fila = (v) => '<tr class="ln-fila-clic" data-ir-vehiculo="' + esc(v.FOLIO) + '"><td><button type="button" class="ln-btn-icono" data-ir-vehiculo="' + esc(v.FOLIO) + '">' +
          icono('car') + ' NUCO ' + guion(v.NUCO) + ' ' + icono('chevron-right') + '</button></td><td class="ln-mono">' + guion(v.FOLIO) + '</td><td>' +
          esc([v.MARCA, v.LINEA_VEHICULO].filter(Boolean).join(' ')) + '</td><td>' + guion(v.MODELO) + '</td></tr>';
        return '<div class="card ln-card"><h3>' + icono('car') + ' Vehículos (' + lista.length + ')</h3>' +
          (lista.length
            ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>Nucco</th><th>Folio</th><th>Marca / Línea</th><th>Año</th></tr></thead><tbody>' + lista.map(fila).join('') + '</tbody></table></div>'
            : '<p class="empty-state">Sin vehículos asignados a ' + esc(nombre) + '.</p>') + '</div>';
      }

      /** Hologramas / combustible del colaborador (apiListarHologramas, catálogo cacheado).
       *  Cuando el holograma ya está ligado a un vehículo del catálogo trae FOLIO -- en ese
       *  caso la fila es clicable e igual navega a la ficha de Vehículos; si no, es informativa. */
      function tarjetaHologramas(nombre, lista) {
        const claseEox = (e) => (String(e).toUpperCase() === 'HABILITADO' ? 'verde' : 'rojo');
        const fila = (h) => {
          const folio = h.FOLIO || '';
          const etiqueta = icono('sticker') + ' ' + guion(h.PLACA) + (folio ? ' ' + icono('chevron-right') : '');
          const celda = folio
            ? '<button type="button" class="ln-btn-icono" data-ir-vehiculo="' + esc(folio) + '">' + etiqueta + '</button>'
            : etiqueta;
          return '<tr' + (folio ? ' class="ln-fila-clic" data-ir-vehiculo="' + esc(folio) + '"' : '') + '><td>' + celda + '</td><td>' + guion(h.CALCOMANIA) + '</td><td>' +
            esc([h.MARCA, h.LINEA].filter(Boolean).join(' ')) + '</td><td>' + chip(h.ESTATUS_EOX || 'Sin estatus', claseEox(h.ESTATUS_EOX)) + '</td></tr>';
        };
        return '<div class="card ln-card"><h3>' + icono('fuel') + ' Hologramas / combustible (' + lista.length + ')</h3>' +
          (lista.length
            ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>Placa</th><th>Calcomanía</th><th>Marca / Línea</th><th>Estatus EOX</th></tr></thead><tbody>' + lista.map(fila).join('') + '</tbody></table></div>'
            : '<p class="empty-state">Sin hologramas asignados a ' + esc(nombre) + '.</p>') + '</div>';
      }

      /** Uber del colaborador (apiListarUberResumen). No tiene ficha propia en otro módulo
       *  (su detalle vive solo en el panel lateral de la tabla de Uber), así que es informativa. */
      function tarjetaUber(nombre, lista) {
        const fila = (u) => '<tr><td>' + guion(u.ROL) + '</td><td>' + chip(u.ESTATUS || 'Sin estatus', String(u.ESTATUS).toUpperCase() === 'ACTIVO' ? 'verde' : 'neutro') + '</td><td>' + guion(u.RAZON_SOCIAL) + '</td></tr>';
        return '<div class="card ln-card"><h3>' + icono('car-front') + ' Uber (' + lista.length + ')</h3>' +
          (lista.length
            ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>Rol</th><th>Estatus</th><th>Razón social</th></tr></thead><tbody>' + lista.map(fila).join('') + '</tbody></table></div>'
            : '<p class="empty-state">Sin registro de Uber para ' + esc(nombre) + '.</p>') + '</div>';
      }

      /** Cajas chicas del colaborador (apiListarCajasChicasResumen) -- clic va a la ficha de
       *  Caja Chica (data-ir-cch → verFichaCajaChicaDesdeOtroModulo, igual patrón que Vehículos). */
      function tarjetaCajasChicas(nombre, lista) {
        const claseCch = (e) => {
          const u = String(e).toUpperCase();
          return u === 'VIGENTE' ? 'verde' : u === 'CERRADA' ? 'rojo' : u === 'EN PROCESO DE CIERRE' ? 'ambar' : 'neutro';
        };
        const fila = (c) => '<tr class="ln-fila-clic" data-ir-cch="' + esc(c.ID_CCH) + '"><td><button type="button" class="ln-btn-icono" data-ir-cch="' + esc(c.ID_CCH) + '">' +
          icono('wallet') + ' ' + esc(c.ID_CCH) + ' ' + icono('chevron-right') + '</button></td><td>' + guion(c.DEPARTAMENTO) + '</td><td>' + guion(c.SEDE) + '</td><td>' +
          chip(c.ESTATUS || 'Sin estatus', claseCch(c.ESTATUS)) + '</td></tr>';
        return '<div class="card ln-card"><h3>' + icono('wallet') + ' Cajas chicas (' + lista.length + ')</h3>' +
          (lista.length
            ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>ID CCH</th><th>Departamento</th><th>Sede</th><th>Estatus</th></tr></thead><tbody>' + lista.map(fila).join('') + '</tbody></table></div>'
            : '<p class="empty-state">Sin cajas chicas asignadas a ' + esc(nombre) + '.</p>') + '</div>';
      }

      /** Asignaciones del colaborador en el panel lateral (como el detalle de los demás módulos): la lista no se mueve. */
      function mostrarColaborador(c, tarjeta) {
        raiz.querySelectorAll('.ln-cuadro-colaborador.seleccionado').forEach((el) => el.classList.remove('seleccionado'));
        if (tarjeta) tarjeta.classList.add('seleccionado');
        const panel = abrirPanelLateral(c.nombre || 'Colaborador', [c.puesto, c.departamento].filter(Boolean).join(' · ') || 'Activos asignados');
        panel.alCerrar = () => { if (tarjeta) tarjeta.classList.remove('seleccionado'); };
        panel.cuerpo.innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Consultando asignaciones…</p>';
        // Ir a una línea/equipo (Líneas, data-ir), a un vehículo/holograma (Control Vehicular,
        // data-ir-vehiculo) o a una caja chica (data-ir-cch): se cierra el panel y se abre su
        // ficha en el módulo que toque.
        panel.cuerpo.addEventListener('click', (ev) => {
          const fLinea = ev.target.closest('[data-ir]');
          if (fLinea) { panel.cerrar(); irARegistro(fLinea.dataset.ir); return; }
          const fVehiculo = ev.target.closest('[data-ir-vehiculo]');
          if (fVehiculo) { panel.cerrar(); verFichaVehiculoDesdeOtroModulo(fVehiculo.dataset.irVehiculo); return; }
          const fCch = ev.target.closest('[data-ir-cch]');
          if (fCch) { panel.cerrar(); verFichaCajaChicaDesdeOtroModulo(fCch.dataset.irCch); return; }
        });
        // callServerCacheado vive en api.html (mismo scope global que todo el cliente) -- son
        // los mismos catálogos ya cacheados para el resto de la app, así que esto normalmente
        // no pide nada nuevo al servidor.
        Promise.all([
          cargarIndice(),
          callServerCacheado('apiListarVehiculosBasico', state.token).catch(() => []),
          callServerCacheado('apiListarHologramas', state.token).catch(() => []),
          callServerCacheado('apiListarUberResumen', state.token).catch(() => []),
          callServerCacheado('apiListarCajasChicasResumen', state.token).catch(() => []),
        ]).then(([indice, vehiculos, hologramas, uber, cajasChicas]) => {
          if (!vigente() || panelAbierto !== panel) return;
          const datos = filasPorResponsable(indice, c.nombre);
          const texto = normal(c.nombre);
          const misVehiculos = (vehiculos || []).filter((v) => normal(v.RESPONSABLE_VEHICULO) === texto);
          const misHologramas = (hologramas || []).filter((h) => normal(h.RESPONSABLE) === texto);
          const miUber = (uber || []).filter((u) => normal(u.NOMBRE_COMPLETO) === texto);
          const misCch = (cajasChicas || []).filter((cch) => normal(cch.RESPONSABLE) === texto);
          const pie = [c.noEmpleado ? 'Empleado ' + c.noEmpleado : '', c.area, c.sede, c.oficina].filter(Boolean).map(esc).join(' · ');
          panel.cuerpo.innerHTML =
            '<div class="ln-panel-resumen"><div class="ln-chips">' +
              (c.estatus ? chip(c.estatus, String(c.estatus).toUpperCase() === 'ACTIVO' ? 'verde' : 'neutro') : '') +
              (c.departamento ? chip(c.departamento, 'azul') : '') +
            '</div>' + (pie ? '<p class="ln-pie ln-tenue">' + pie + '</p>' : '') + '</div>' +
            tarjetaLineas(c.nombre, datos) +
            tarjetaVehiculos(c.nombre, misVehiculos) +
            tarjetaHologramas(c.nombre, misHologramas) +
            tarjetaUber(c.nombre, miUber) +
            tarjetaCajasChicas(c.nombre, misCch);
          pintarIconos(panel.cuerpo);
        }).catch((e) => {
          if (panelAbierto === panel) panel.cuerpo.innerHTML = '<p class="error-msg">No se pudieron consultar las asignaciones: ' + mensajeError(e) + '</p>';
        });
      }

      function tarjetaColaborador(c) {
        const conActivos = c.totalActivos > 0;
        return '<button type="button" class="card ln-cuadro ln-cuadro-colaborador ' + (conActivos ? 'con-activos' : 'sin-activos') + '" data-colaborador-i="' + c._i + '">' +
          '<div class="ln-cuadro-superior"><span class="ln-cuadro-departamento">' + guion(c.departamento) + '</span>' +
          '<span class="ln-cuadro-area">' + guion(c.area) + '</span></div>' +
          '<div class="ln-cuadro-principal">' + guion(c.nombre) + '</div>' +
          '<div class="ln-cuadro-secundario">' + guion(c.puesto) + '</div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('map-pin') + ' ' + guion(c.sede) + '</span><span>' + icono('building-2') + ' ' + guion(c.oficina) + '</span></div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('briefcase-business') + ' ' + chip(c.estatus || 'Sin estatus', String(c.estatus).toUpperCase() === 'ACTIVO' ? 'verde' : 'neutro') + '</span>' +
          '<span class="ln-activos-estado ' + (conActivos ? 'si' : 'no') + '">' + icono(conActivos ? 'package-check' : 'package-x') + ' ' +
          (conActivos ? miles(c.totalActivos) + ' activo(s)' : 'Sin activos') + '</span></div><div class="ln-cuadro-pie"><span>Consultar asignaciones ' + icono('chevron-right') + '</span></div></button>';
      }

      function pintarCuadros() {
        $('#lnga-grid', raiz).innerHTML = filtrados.length
          ? filtrados.slice(0, visibles).map(tarjetaColaborador).join('')
          : '<div class="card empty-state ln-cuadro-vacio">No hay colaboradores que coincidan con los filtros.</div>';
        $('#lnga-conteo', raiz).textContent = 'Mostrando ' + miles(Math.min(visibles, filtrados.length)) + ' de ' + miles(filtrados.length);
        $('#lnga-mas', raiz).hidden = visibles >= filtrados.length;
      }

      function aplicarFiltros() {
        const texto = normal($('#lnga-q', raiz).value).trim();
        const activos = $('#lnga-filtro-activos', raiz).value;
        filtrados = colaboradores.filter((c) => {
          if (activos === 'CON' && !c.totalActivos) return false;
          if (activos === 'SIN' && c.totalActivos) return false;
          return !texto || ['nombre', 'noEmpleado', 'puesto', 'departamento', 'area', 'sede', 'oficina']
            .some((campo) => normal(c[campo]).indexOf(texto) >= 0);
        });
        visibles = paso;
        pintarCuadros();
        pintarKpis();
      }

      $('#lnga-q', raiz).addEventListener('input', (ev) => {
        clearTimeout(temporizador);
        temporizador = setTimeout(aplicarFiltros, 150);
      });
      // KPIs: clic = filtro "Con / Sin activos" (el mismo del selector); otro clic lo quita.
      // Los valores reflejan `filtrados` (lo que hay bajo el texto/selector actuales), no
      // siempre todos los colaboradores — igual que en el resto de los módulos.
      function valoresKpi(lista) {
        const con = lista.filter((c) => c.totalActivos).length;
        return {
          TODOS: lista.length, CON: con, SIN: lista.length - con,
          asignados: lista.reduce((t, c) => t + c.totalActivos, 0),
        };
      }
      function pintarKpis() {
        const v = valoresKpi(filtrados);
        const kpiDefs = [
          { icono: 'users', valor: v.TODOS, etiqueta: 'Colaboradores', filtro: 'TODOS' },
          { icono: 'user-check', valor: v.CON, etiqueta: 'Con activos', clase: 'stat-tile-ok', filtro: 'CON' },
          { icono: 'user-x', valor: v.SIN, etiqueta: 'Sin activos', clase: 'stat-tile-warn', filtro: 'SIN' },
          { icono: 'package', valor: v.asignados, etiqueta: 'Activos asignados' },
        ];
        const cont = $('#lnga-kpis', raiz);
        cont.innerHTML = kpiDefs.map((d, i) => '<div class="stat-tile ' + (d.clase || '') + (d.filtro ? ' stat-tile-clickable' : '') + '" data-kpi="' + i + '"' +
          (d.filtro ? ' role="button" tabindex="0"' : '') + '><div class="stat-icon">' + ico(d.icono) + '</div><div><div class="stat-value">' + miles(d.valor) + '</div>' +
          '<div class="stat-label">' + esc(d.etiqueta) + '</div></div></div>').join('');
        const marcar = () => cont.querySelectorAll('[data-kpi]').forEach((t) => {
          const d = kpiDefs[Number(t.dataset.kpi)];
          t.classList.toggle('stat-tile-activo', !!d.filtro && d.filtro !== 'TODOS' && $('#lnga-filtro-activos', raiz).value === d.filtro);
        });
        cont.querySelectorAll('[data-kpi]').forEach((t) => {
          const d = kpiDefs[Number(t.dataset.kpi)];
          if (!d.filtro) return;
          const clic = () => {
            const select = $('#lnga-filtro-activos', raiz);
            select.value = select.value === d.filtro ? 'TODOS' : d.filtro;
            aplicarFiltros();
          };
          t.addEventListener('click', clic);
          t.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); clic(); } });
        });
        marcar();
      }

      $('#lnga-filtro-activos', raiz).addEventListener('change', aplicarFiltros);
      $('#lnga-mas', raiz).addEventListener('click', () => { visibles += paso; pintarCuadros(); });
      raiz.addEventListener('click', (ev) => {
        const sug = ev.target.closest('[data-colaborador-i]');
        if (sug) {
          const c = colaboradores[Number(sug.dataset.colaboradorI)];
          if (c) mostrarColaborador(c, sug);
          return;
        }
        const f = ev.target.closest('[data-ir]');
        if (f) irARegistro(f.dataset.ir);
      });

      // El conteo de "activos" debe reflejar TODO lo que puede traer un colaborador en el panel
      // lateral (mostrarColaborador), no solo equipos/líneas de Líneas -- si no, alguien con
      // solo un vehículo, holograma, Uber o caja chica aparecía como "Sin activos".
      Promise.all([
        cargarColaboradores(),
        cargarIndice(),
        callServerCacheado('apiListarVehiculosBasico', state.token).catch(() => []),
        callServerCacheado('apiListarHologramas', state.token).catch(() => []),
        callServerCacheado('apiListarUberResumen', state.token).catch(() => []),
        callServerCacheado('apiListarCajasChicasResumen', state.token).catch(() => []),
      ]).then(([r, indice, vehiculos, hologramas, uber, cajasChicas]) => {
        if (!vigente()) return;
        const conteo = {};
        const suma = (lista, campo) => (lista || []).forEach((a) => { const k = normal(a[campo]); if (k) conteo[k] = (conteo[k] || 0) + 1; });
        indice.equipos.forEach((a) => { const k = normal(a.responsable); if (k) conteo[k] = (conteo[k] || 0) + 1; });
        indice.lineas.filter((a) => a.suelta).forEach((a) => { const k = normal(a.responsable); if (k) conteo[k] = (conteo[k] || 0) + 1; });
        suma(vehiculos, 'RESPONSABLE_VEHICULO');
        suma(hologramas, 'RESPONSABLE');
        suma(uber, 'NOMBRE_COMPLETO');
        suma(cajasChicas, 'RESPONSABLE');
        colaboradores = filasComoObjetos(r).map((c, i) => Object.assign(c, { _i: i, totalActivos: conteo[normal(c.nombre)] || 0 }));
        aplicarFiltros();
      }).catch((e) => {
        if (!vigente()) return;
        $('#lnga-grid', raiz).innerHTML = '';
        $('#lnga-error', raiz).textContent = 'No se pudieron cargar los colaboradores: ' + mensajeError(e);
        $('#lnga-error', raiz).hidden = false;
      });
    }

    // ======================================================================
    // Inventario de Accesorios (Líneas) — ACCESORIOS CELULARES / MOVIMIENTOS_ACCESORIOS
    // en la copia de pruebas de Líneas; no toca el módulo de accesorios del equipo.
    // ======================================================================

    function initAccesoriosLineas() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-accesorios');
      const vigente = () => n === montaje && document.body.contains(raiz);
      pintarIconos(raiz);

      let indiceAcc = null;
      let seleccionado = null;
      let guardandoAccesorio = false;
      let movimientoActual = 0;

      let tabla = null;
      let filtrosAcc = {};
      let marcarKpi = null;

      function pintarIndicadores() {
        if (!indiceAcc) return;
        const filas = indiceAcc.filas;
        marcarKpi = tilesKpi($('#lac-indicadores', raiz), [
          { icono: 'package', valor: miles(filas.length), etiqueta: 'Artículos', calcular: (f) => miles(f.length) },
          { icono: 'triangle-alert', valor: miles(filas.filter((a) => a.reabasto).length), etiqueta: 'Por reabastecer',
            titulo: 'Aviso del AppSheet: Cargadores ≤ 10, Micas ≤ 182, Fundas ≤ 182',
            clase: 'stat-tile-warn', filtros: { reabasto: { valores: ['Sí'] } }, calcular: (f) => miles(f.filter((a) => a.reabasto).length) },
          { icono: 'package-x', valor: miles(filas.filter((a) => (Number(a.stock) || 0) <= 0).length), etiqueta: 'Sin stock',
            clase: 'stat-tile-warn', filtros: { stock: { op: '<=', v1: 0 } }, calcular: (f) => miles(f.filter((a) => (Number(a.stock) || 0) <= 0).length) },
          { icono: 'circle-check', valor: miles(filas.reduce((t, a) => t + (Number(a.stock) || 0), 0)), etiqueta: 'Piezas en stock', clase: 'stat-tile-ok', filtros: false,
            calcular: (f) => miles(f.reduce((t, a) => t + (Number(a.stock) || 0), 0)) },
        ], () => tabla);
        marcarKpi(filtrosAcc);
      }

      /** Panel de detalle de DataTable: movimientos del artículo, del más reciente al más antiguo. */
      function movimientosEnPanel(a, cont) {
        const turno = ++movimientoActual;
        cont.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Movimientos</div><p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p>';
        llamar('apiLineasAccesoriosMovimientos', a.id).then((movs) => {
          if (!vigente() || turno !== movimientoActual || !document.body.contains(cont)) return;
          cont.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Movimientos (' + movs.length + ')</div>' + (movs.length
            ? '<div class="historial-timeline">' + movs.map((m) => '<div class="historial-item"><div class="historial-icon' + (m.tipo === 'ENTRADA' ? '' : ' historial-icon-accent') + '">' +
                ico(m.tipo === 'ENTRADA' ? 'arrow-down-to-line' : 'arrow-up-from-line') + '</div><div style="flex:1; min-width:0">' +
                '<div><strong>' + (m.tipo === 'ENTRADA' ? 'Entrada' : 'Salida') + ' de ' + esc(String(m.cantidad)) + '</strong> <span class="ln-tenue">· ' + esc(fechaTabla(m.fecha)) + '</span></div>' +
                '<div class="ln-tenue">' + guion(m.usuario) + (m.comentarios ? ' — ' + esc(m.comentarios) : '') + '</div></div></div>').join('') + '</div>'
            : '<p class="empty-state">Sin movimientos.</p>');
        }).catch((e) => { if (vigente() && turno === movimientoActual) cont.innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>'; });
      }

      function crearTablaAcc() {
        tabla = tablaLineas($('#lac-tabla', raiz), {
          idCampo: 'id',
          idTabla: 'lineas-accesorios-v2',
          ordenInicial: { campo: 'categoria', dir: 'asc' },
          textoVacio: 'Sin artículos',
          exportar: exportarBase('ACCESORIOS', 'Inventario de accesorios'),
          etiquetaFila: (a) => a.nombre,
          detalle: { titulo: (a) => a.nombre, contenidoExtra: movimientosEnPanel },
          ayuda: 'Selecciona un artículo: en la barra (o con clic derecho) "Ver detalle" muestra el artículo y sus movimientos, y ' +
            '"Registrar entrada" / "Registrar salida" sus movimientos.',
          alCambiarFiltros: (f) => { filtrosAcc = f || {}; if (marcarKpi) marcarKpi(filtrosAcc); },
          // Solo con EDICION en el inventario (en AppSheet, la tabla la editaba una lista de correos)
          accionesFila: puedeEditarModulo('accesorios-lineas') ? [
            { icono: 'arrow-down-to-line', titulo: 'Registrar entrada', alHacer: (a) => abrirModalMovimiento(a.id, 'ENTRADA') },
            { icono: 'arrow-up-from-line', titulo: 'Registrar salida', alHacer: (a) => abrirModalMovimiento(a.id, 'SALIDA') },
          ] : [],
          columnas: [
            // Orden de la vista INVENTARIO DE ACCESORIOS del AppSheet (agrupada por Categoria)
            { campo: 'reabasto', titulo: 'Aviso Reabastecimiento', tipo: 'lista', valor: (a) => (a.reabasto ? 'Sí' : 'No'),
              render: (v) => (v === 'Sí' ? '<span class="ln-regla" style="color:#d62020;font-weight:700">' + ico('triangle-alert') + ' REABASTECER PRODUCTO</span>' : '') },

            { campo: 'categoria', titulo: 'Categoria', tipo: 'lista', render: (v) => formatoAppSheet('ACCESORIOS', 'Categoria', v) || esc(v) },
            { campo: 'nombre', titulo: 'Nombre del Articulo', tipo: 'texto', fijada: false },
            { campo: 'marca', titulo: 'Marca', tipo: 'texto' },
            { campo: 'stock', titulo: 'Stock', tipo: 'numero', agregado: 'suma',
              // Reglas ALERTA BAJO STOCK (rojo sobre amarillo, ícono) y Stock disponible (#2f7d23), solo para las 3 categorías
              render: (v, a) => (a.reabasto
                ? '<span class="ln-regla ln-regla-chip" style="color:#d62020;background:#fff3b0;border:1px solid #e6c700;font-weight:700">' + ico('rotate-cw') + ' ' + esc(String(v)) + '</span>'
                : (['Cargadores', 'Micas', 'Fundas'].indexOf(a.categoria) >= 0 ? '<span class="ln-regla" style="color:#2f7d23;font-weight:700">' + esc(String(v)) + '</span>' : esc(String(v)))) },
          ],
        });
      }

      function cargar(forzar) {
        if (!tabla) crearTablaAcc();
        tabla.setCargando(true);
        cargarAccesorios(!!forzar).then((r) => {
          if (!vigente()) return;
          indiceAcc = r;
          pintarIndicadores();
          tabla.setDatos(r.filas);
        }).catch((e) => {
          if (!vigente()) return;
          tabla.setError('No se pudo cargar el inventario: ' + mensajeError(e));
        });
      }

      // Nombre y Marca: listas con lo ya registrado (se puede escribir uno nuevo)
      let combosArticulo = null;
      function opcionesArticulo() {
        const filas = (indiceAcc && indiceAcc.filas) || [];
        const marcas = filas.map((a) => String(a.marca || '').trim()).filter((v, i, x) => v && x.indexOf(v) === i).sort();
        return {
          nombres: filas.map((a) => ({ valor: a.nombre, etiqueta: [a.categoria, a.marca, 'stock ' + a.stock].filter(Boolean).join(' · ') })),
          marcas: marcas,
        };
      }
      function abrirModalNuevo() {
        const ops = opcionesArticulo();
        if (!combosArticulo && typeof Combobox !== 'undefined') {
          combosArticulo = {
            nombre: Combobox.crear($('#lac-nombre', raiz), { opciones: ops.nombres, maximo: 50 }),
            marca: Combobox.crear($('#lac-marca', raiz), { opciones: ops.marcas, maximo: 50 }),
          };
        } else if (combosArticulo) {
          combosArticulo.nombre.setOpciones(ops.nombres);
          combosArticulo.marca.setOpciones(ops.marcas);
        }
        $('#lac-nombre', raiz).value = ''; $('#lac-categoria', raiz).value = ''; $('#lac-marca', raiz).value = '';
        $('#lac-nuevo-error', raiz).hidden = true;
        $('#lac-modal-nuevo', raiz).hidden = false;
      }
      function cerrarModalNuevo() { if (!guardandoAccesorio) $('#lac-modal-nuevo', raiz).hidden = true; }

      function abrirModalMovimiento(id, tipo) {
        seleccionado = { id: id, tipo: tipo };
        const a = (indiceAcc.filas || []).filter((x) => x.id === id)[0];
        $('#lac-mov-titulo', raiz).textContent = (tipo === 'ENTRADA' ? 'Registrar entrada' : 'Registrar salida');
        $('#lac-mov-subtitulo', raiz).textContent = (a ? a.nombre + ' · stock actual ' + a.stock : '');
        $('#lac-cantidad', raiz).value = '';
        $('#lac-comentarios', raiz).value = '';
        $('#lac-mov-error', raiz).hidden = true;
        $('#lac-modal-mov', raiz).hidden = false;
      }
      function cerrarModalMov() { if (guardandoAccesorio) return; $('#lac-modal-mov', raiz).hidden = true; seleccionado = null; }

      function estadoAccesorio(modalId, ocupado) {
        guardandoAccesorio = ocupado;
        const modal = $(modalId, raiz);
        modal.querySelectorAll('button, input, textarea').forEach((el) => { el.disabled = ocupado; });
        const boton = modal.querySelector('.primary');
        if (ocupado) { boton.dataset.texto = boton.innerHTML; boton.innerHTML = '<span class="ln-spinner"></span> Guardando…'; }
        else boton.innerHTML = boton.dataset.texto;
      }

      $('#lac-nuevo', raiz).hidden = !puedeEditarModulo('accesorios-lineas');
      $('#lac-nuevo', raiz).addEventListener('click', abrirModalNuevo);
      raiz.querySelectorAll('[data-cerrar-modal-nuevo]').forEach((b) => b.addEventListener('click', cerrarModalNuevo));
      raiz.querySelectorAll('[data-cerrar-modal-mov]').forEach((b) => b.addEventListener('click', cerrarModalMov));

      $('#lac-guardar-nuevo', raiz).addEventListener('click', () => {
        if (guardandoAccesorio) return;
        const nombre = $('#lac-nombre', raiz).value.trim();
        const categoria = $('#lac-categoria', raiz).value;
        const faltan = [!categoria && 'Categoria', !nombre && 'Nombre del Articulo'].filter(Boolean);
        if (faltan.length) { $('#lac-nuevo-error', raiz).textContent = faltan.join(', ') + (faltan.length > 1 ? ' son obligatorios.' : ' es obligatorio.'); $('#lac-nuevo-error', raiz).hidden = false; return; }
        const repetido = ((indiceAcc && indiceAcc.filas) || []).some((a) => a.categoria === categoria && normal(a.nombre).trim() === normal(nombre));
        if (repetido) { $('#lac-nuevo-error', raiz).textContent = 'Ese artículo ya existe en ' + categoria + ': registra una entrada con la flecha de su fila.'; $('#lac-nuevo-error', raiz).hidden = false; return; }
        estadoAccesorio('#lac-modal-nuevo', true);
        llamar('apiLineasAccesoriosAgregarArticulo', { nombre: nombre, categoria: $('#lac-categoria', raiz).value, marca: $('#lac-marca', raiz).value })
          .then(() => { guardandoAccesorio = false; cerrarModalNuevo(); aviso('Artículo guardado correctamente.', 6000); cargar(true); })
          .catch((e) => { $('#lac-nuevo-error', raiz).textContent = mensajeError(e); $('#lac-nuevo-error', raiz).hidden = false; })
          .finally(() => estadoAccesorio('#lac-modal-nuevo', false));
      });

      $('#lac-guardar-mov', raiz).addEventListener('click', () => {
        if (!seleccionado || guardandoAccesorio) return;
        const cantidad = Number($('#lac-cantidad', raiz).value);
        if (!Number.isInteger(cantidad) || cantidad <= 0) { $('#lac-mov-error', raiz).textContent = 'Captura una cantidad entera mayor que cero.'; $('#lac-mov-error', raiz).hidden = false; return; }
        estadoAccesorio('#lac-modal-mov', true);
        llamar('apiLineasAccesoriosRegistrarMovimiento', { accesorioId: seleccionado.id, tipo: seleccionado.tipo, cantidad: cantidad, comentarios: $('#lac-comentarios', raiz).value })
          .then(() => { guardandoAccesorio = false; cerrarModalMov(); aviso('Movimiento registrado correctamente.', 6000); cargar(true); })
          .catch((e) => { $('#lac-mov-error', raiz).textContent = mensajeError(e); $('#lac-mov-error', raiz).hidden = false; })
          .finally(() => estadoAccesorio('#lac-modal-mov', false));
      });

      cargar();
    }

    // ======================================================================
    // Resguardos y cancelaciones (bandeja de Pau, reunión con Líneas 30-sep)
    // ======================================================================

    /**
     * Ventana chica para pedir datos antes de un paso de la bandeja. campos: [{ clave, etiqueta, valor, requerido,
     * opciones }]. Regresa una promesa con { clave: valor } o null si se cancela.
     * opciones.alConfirmar(valores) (promesa): la ventana se queda con la pantalla de espera (opciones.espera) desde el
     * clic hasta que termina; si falla, muestra el error y "Volver" regresa a lo capturado. Regresa lo que regrese.
     */
    function pedirDatos(titulo, mensaje, campos, textoConfirmar, opciones) {
      const o = opciones || {};
      return new Promise((resolve) => {
        const fondo = document.createElement('div');
        fondo.className = 'modal-backdrop';
        fondo.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true" style="max-width:480px;position:relative">' +
          '<div class="modal-header"><div><h3 style="margin:0">' + esc(titulo) + '</h3>' + (mensaje ? '<p class="modal-subtitle">' + esc(mensaje) + '</p>' : '') + '</div>' +
          '<button type="button" class="modal-close" data-cerrar aria-label="Cerrar">' + ico('x') + '</button></div>' +
          campos.map((c, i) => '<div class="field"><label for="lnr-dato-' + i + '">' + esc(c.etiqueta) + (c.requerido ? ' *' : '') + '</label>' +
            (c.opciones ? '<select id="lnr-dato-' + i + '" data-clave="' + esc(c.clave) + '">' + c.opciones.map((o) => '<option' + (o === c.valor ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
              : c.area ? '<textarea id="lnr-dato-' + i + '" data-clave="' + esc(c.clave) + '" rows="4">' + esc(c.valor || '') + '</textarea>'
              : '<input type="text" id="lnr-dato-' + i + '" data-clave="' + esc(c.clave) + '" value="' + esc(c.valor || '') + '" autocomplete="off" data-respetar-texto />') + '</div>').join('') +
          '<div class="error-msg" data-error hidden></div>' +
          '<div class="ln-captura-acciones"><button type="button" class="secondary" data-cerrar>Cancelar</button><button type="button" data-ok>' + esc(textoConfirmar || 'Aceptar') + '</button></div>' +
          '<div class="ln-espera" data-espera hidden></div></div>';
        document.body.appendChild(fondo);
        const espera = fondo.querySelector('[data-espera]');
        let ocupado = false;
        const cerrar = (valor) => { fondo.remove(); document.removeEventListener('keydown', tecla, true); resolve(valor); };
        const tecla = (ev) => { if (ev.key === 'Escape') { ev.stopPropagation(); if (!ocupado) cerrar(null); } };
        document.addEventListener('keydown', tecla, true);
        fondo.addEventListener('click', (ev) => {
          if (ev.target.closest('[data-espera-volver]')) { espera.hidden = true; ocupado = false; return; }
          if (!ocupado && ev.target.closest('[data-cerrar]')) cerrar(null);
        });
        const pintarEspera = (tituloEspera, texto, error) => {
          espera.className = 'ln-espera' + (error ? ' ln-espera-error' : '');
          espera.innerHTML = '<span class="ln-espera-circulo">' + (error ? icono('triangle-alert') : '<span class="ln-spinner"></span>') + '</span>' +
            '<h3>' + esc(tituloEspera) + '</h3><p>' + esc(texto) + '</p>' +
            (error ? '<div class="ln-espera-acciones"><button type="button" class="primary" data-espera-volver>Volver</button></div>' : '');
          espera.hidden = false;
        };
        fondo.querySelector('[data-ok]').addEventListener('click', async () => {
          const valores = {};
          fondo.querySelectorAll('[data-clave]').forEach((el) => { valores[el.dataset.clave] = String(el.value || '').trim(); });
          const falta = campos.filter((c) => (c.requerido && !valores[c.clave]) || (c.minimo && valores[c.clave].length < c.minimo))[0];
          if (falta) { const e = fondo.querySelector('[data-error]'); e.textContent = falta.etiqueta + ' es obligatorio.'; e.hidden = false; return; }
          if (!o.alConfirmar) { cerrar(valores); return; }
          ocupado = true;
          pintarEspera(o.espera || 'Guardando', 'No cierres esta ventana.');
          try {
            cerrar(await o.alConfirmar(valores));
          } catch (e) {
            pintarEspera('No se pudo guardar', mensajeError(e), true);
          }
        });
        pintarIconos(fondo);
        const primero = fondo.querySelector('[data-clave]');
        if (primero) primero.focus();
      });
    }

    function initResguardos() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-resguardos');
      const vigente = () => n === montaje && document.body.contains(raiz);
      let vista = 'RESGUARDOS';
      let datos = null;
      let tabla = null;
      let marcarKpi = null;
      let filtros = {};
      refreshIcons();

      const fechaCorta = (v) => (v ? fechaTabla(v) : '');
      const COLUMNAS = {
        RESGUARDOS: [
          { campo: 'FECHA', titulo: 'Mandado', tipo: 'lnFechaHora', fijada: true },
          { campo: 'NUCO', titulo: 'NUCO', tipo: 'texto', render: (v) => '<span class="ln-mono ln-fuerte">' + guion(v) + '</span>' },
          { campo: 'ESTADO', titulo: 'Estado', tipo: 'lista', render: (v) => chip(v) },
          { campo: 'MODELO', titulo: 'Modelo', tipo: 'texto' },
          { campo: 'IMEI', titulo: 'IMEI', tipo: 'texto', render: (v) => '<span class="ln-mono">' + guion(v) + '</span>' },
          { campo: 'ESTATUS_EQUIPO', titulo: 'Estatus del equipo', tipo: 'lista', render: (v) => chip(v) },
          { campo: 'NUMERO', titulo: 'Línea', tipo: 'texto', render: (v) => (v ? '<span class="ln-mono">' + esc(v) + '</span>' : '<span class="ln-tenue">Sin línea</span>') },
          { campo: 'ESTATUS_LINEA', titulo: 'Estatus de la línea', tipo: 'lista', render: (v) => chip(v) },
          { campo: 'SEDE', titulo: 'Sede', tipo: 'lista' },
          { campo: 'OFICINA', titulo: 'Oficina / desarrollo', tipo: 'lista' },
          { campo: 'SOLICITO_NOMBRE', titulo: 'Mandó', tipo: 'lista' },
          { campo: 'MOTIVO', titulo: 'Motivo', tipo: 'texto' },
          { campo: 'COMENTARIO', titulo: 'Comentario', tipo: 'texto', visible: false },
          { campo: 'RECIBIDO_EN', titulo: 'Recibido', tipo: 'lnFechaHora' },
          { campo: 'RECIBIO', titulo: 'Recibió', tipo: 'lista', visible: false },
          { campo: 'ENTREGADO_EN', titulo: 'Entregado', tipo: 'lnFechaHora', visible: false },
          { campo: 'ENTREGADO_A', titulo: 'Entregado a', tipo: 'lista', visible: false },
          { campo: 'ENTREGA_ASUNTO', titulo: 'Asunto / correo', tipo: 'texto', visible: false },
          { campo: 'DEPARTAMENTO', titulo: 'Departamento', tipo: 'lista', visible: false },
          { campo: 'TIPO', titulo: 'Tipo', tipo: 'lista', visible: false },
        ],
        CANCELACIONES: [
          { campo: 'FECHA', titulo: 'Mandado', tipo: 'lnFechaHora', fijada: true },
          { campo: 'NUMERO', titulo: 'Línea', tipo: 'texto', render: (v) => '<span class="ln-mono ln-fuerte">' + guion(v) + '</span>' },
          { campo: 'CANCELACION', titulo: 'Cancelación', tipo: 'lista', render: (v) => chip(v) },
          { campo: 'NUCO', titulo: 'NUCO', tipo: 'texto', render: (v) => '<span class="ln-mono">' + guion(v) + '</span>' },
          { campo: 'COMPANIA', titulo: 'Compañía', tipo: 'lista' },
          { campo: 'RAZON_SOCIAL', titulo: 'Razón social', tipo: 'lista' },
          { campo: 'FIN_PLAN', titulo: 'Fin del adendum', tipo: 'texto' },
          { campo: 'ASESOR', titulo: 'Asesor', tipo: 'lista' },
          { campo: 'CARTA_FIRMADA_EN', titulo: 'Carta firmada', tipo: 'lnFechaHora' },
          { campo: 'CARTA_ENVIADA_EN', titulo: 'Carta enviada', tipo: 'lnFechaHora' },
          { campo: 'CANCELADA_EN', titulo: 'Cancelada', tipo: 'lnFechaHora' },
          { campo: 'CANCELACION_ASUNTO', titulo: 'Asunto / correo', tipo: 'texto' },
          { campo: 'ESTADO', titulo: 'Equipo (resguardo)', tipo: 'lista', render: (v) => chip(v), visible: false },
          { campo: 'SOLICITO_NOMBRE', titulo: 'Mandó', tipo: 'lista', visible: false },
          { campo: 'CANCELO', titulo: 'Confirmó', tipo: 'lista', visible: false },
        ],
      };

      /** Paso de la bandeja: pide lo necesario, confirma y llama al servidor. */
      async function paso(accion, filas, opciones) {
        const o = opciones || {};
        let extra = {};
        if (o.campos) {
          extra = await pedirDatos(o.titulo, o.mensaje, o.campos, o.boton);
          if (!extra) return;
        } else {
          const ok = await Confirmar.pedir({
            titulo: o.titulo, mensaje: o.mensaje, textoConfirmar: o.boton, peligro: !!o.peligro,
            detalle: filas.slice(0, 20).map((f) => 'NUCO ' + (f.NUCO || '—') + (f.NUMERO ? ' · ' + f.NUMERO : '') + ' · ' + (f.ESTADO || '')),
          });
          if (!ok) return;
        }
        try {
          const r = await llamar('apiLineasAccionBandejaResguardo', accion, filas.map((f) => f.ID), extra);
          const omitidos = r.omitidos || [];
          const avisos = (r.hechos || []).filter((h) => h.aviso);
          aviso(icono('circle-check') + ' ' + o.hecho + ': ' + miles((r.hechos || []).length) + (omitidos.length ? ' · ' + omitidos.length + ' sin cambio (' +
            omitidos.slice(0, 4).map((x) => 'NUCO ' + (x.nuco || x.id) + ': ' + x.motivo).join(' · ') + ')' : '') + '.', 8000);
          avisos.forEach((h) => aviso(icono('triangle-alert', 'ln-alerta') + ' NUCO ' + h.nuco + ': ' + h.aviso, 10000));
          if (tabla) tabla.limpiarSeleccion();
          if (o.inventario) memoria.cargadoEn = 0; // el inventario cambió: que Líneas Telefónicas lo vuelva a pedir
          cargar();
        } catch (e) {
          aviso(icono('triangle-alert', 'ln-alerta') + ' ' + mensajeError(e), 10000);
        }
      }

      const ACCIONES = {
        RESGUARDOS: [
          { icono: 'package-check', texto: 'Recibir', titulo: 'Confirma que recibiste físicamente los equipos', minimo: 1,
            alHacer: (filas) => paso('RECIBIR', filas, { titulo: '¿Confirmas que recibiste ' + miles(filas.length) + ' equipo(s)?',
              mensaje: 'Pasan a EN RESGUARDO con la fecha de hoy.', boton: 'Recibí los equipos', hecho: 'Recibidos' }) },
          { icono: 'hand-helping', texto: 'Entregar a Líneas', titulo: 'Un equipo guardado se entrega a Líneas para asignarlo', minimo: 1,
            alHacer: (filas) => paso('ENTREGAR', filas, { titulo: 'Entregar a Líneas', mensaje: miles(filas.length) + ' equipo(s) pasan a ENTREGADO A LINEAS.',
              campos: [{ clave: 'recibe', etiqueta: 'Quién de Líneas lo recibe', requerido: true }, { clave: 'asunto', etiqueta: 'Asunto del correo o ticket (opcional)' }],
              boton: 'Entregar', hecho: 'Entregados' }) },
          { icono: 'badge-dollar-sign', texto: 'Vendido', titulo: 'El equipo se vendió: también cambia su estatus en el inventario', minimo: 1,
            alHacer: (filas) => paso('VENDIDO', filas, { titulo: 'Marcar como vendido', mensaje: miles(filas.length) + ' equipo(s) pasan a VENDIDO aquí y en el inventario.',
              campos: [{ clave: 'asunto', etiqueta: 'Referencia de la venta (opcional)' }], boton: 'Marcar vendido', hecho: 'Vendidos', inventario: true }) },
        ],
        CANCELACIONES: [
          { icono: 'signature', texto: 'Carta firmada', titulo: 'La carta de cancelación ya está firmada', minimo: 1,
            alHacer: (filas) => paso('CARTA_FIRMADA', filas, { titulo: 'Carta firmada', mensaje: miles(filas.length) + ' línea(s) pasan a CARTA FIRMADA.',
              campos: [{ clave: 'asesor', etiqueta: 'Asesor', valor: filas[0].ASESOR || '', opciones: ['KARLA', 'WILBERTO', 'ALFREDO'].indexOf(filas[0].ASESOR) >= 0 || !filas[0].ASESOR ? ['KARLA', 'WILBERTO', 'ALFREDO'] : null }],
              boton: 'Guardar', hecho: 'Cartas firmadas' }) },
          { icono: 'send', texto: 'Carta enviada', titulo: 'La cancelación ya se pidió al proveedor', minimo: 1,
            alHacer: (filas) => paso('CARTA_ENVIADA', filas, { titulo: 'Carta enviada al proveedor', mensaje: miles(filas.length) + ' línea(s) pasan a CARTA ENVIADA.',
              campos: [{ clave: 'asunto', etiqueta: 'Asunto del correo (opcional)' }], boton: 'Guardar', hecho: 'Cartas enviadas' }) },
          { icono: 'phone-off', texto: 'Confirmar cancelada', titulo: 'El proveedor confirmó: la línea queda CANCELADA y el NUCO pasa a solo EQUIPO', minimo: 1, peligro: true,
            alHacer: (filas) => paso('CANCELADA', filas, { titulo: '¿Confirmar la cancelación de ' + miles(filas.length) + ' línea(s)?',
              mensaje: 'En el inventario la línea queda CANCELADA, el NUCO pasa a solo EQUIPO y el número queda en su historial.', boton: 'Confirmar cancelada',
              peligro: true, hecho: 'Canceladas', inventario: true }) },
        ],
      };

      function filasVista() {
        const todas = (datos && datos.filas) || [];
        // Las líneas mandadas a cancelación sin resguardo no tienen recepción (ESTADO vacío): solo salen en Cancelaciones
        return vista === 'RESGUARDOS' ? todas.filter((f) => f.ESTADO) : todas.filter((f) => f.CANCELACION);
      }

      function pintarKpis() {
        const filas = filasVista();
        const cuenta = (campo, valor) => filas.filter((f) => f[campo] === valor).length;
        const defs = vista === 'RESGUARDOS' ? [
          { icono: 'archive', valor: miles(filas.length), etiqueta: 'Mandados a resguardo' },
          { icono: 'clock', valor: miles(cuenta('ESTADO', 'PENDIENTE DE RECEPCION')), etiqueta: 'Por recibir', clase: 'stat-tile-warn', filtros: { ESTADO: { valores: ['PENDIENTE DE RECEPCION'] } } },
          { icono: 'package-check', valor: miles(cuenta('ESTADO', 'EN RESGUARDO')), etiqueta: 'En resguardo', filtros: { ESTADO: { valores: ['EN RESGUARDO'] } } },
          { icono: 'hand-helping', valor: miles(cuenta('ESTADO', 'ENTREGADO A LINEAS')), etiqueta: 'Entregados a Líneas', clase: 'stat-tile-ok', filtros: { ESTADO: { valores: ['ENTREGADO A LINEAS'] } } },
          { icono: 'badge-dollar-sign', valor: miles(cuenta('ESTADO', 'VENDIDO')), etiqueta: 'Vendidos', filtros: { ESTADO: { valores: ['VENDIDO'] } } },
        ] : [
          { icono: 'phone-off', valor: miles(filas.length), etiqueta: 'Líneas a cancelar' },
          { icono: 'pen-line', valor: miles(cuenta('CANCELACION', 'POR FIRMAR')), etiqueta: 'Por firmar', clase: 'stat-tile-warn', filtros: { CANCELACION: { valores: ['POR FIRMAR'] } } },
          { icono: 'signature', valor: miles(cuenta('CANCELACION', 'CARTA FIRMADA')), etiqueta: 'Carta firmada', filtros: { CANCELACION: { valores: ['CARTA FIRMADA'] } } },
          { icono: 'send', valor: miles(cuenta('CANCELACION', 'CARTA ENVIADA')), etiqueta: 'Carta enviada', filtros: { CANCELACION: { valores: ['CARTA ENVIADA'] } } },
          { icono: 'circle-check', valor: miles(cuenta('CANCELACION', 'CANCELADA')), etiqueta: 'Canceladas', clase: 'stat-tile-ok', filtros: { CANCELACION: { valores: ['CANCELADA'] } } },
        ];
        marcarKpi = tilesKpi($('#lnr-kpis', raiz), defs, () => tabla);
        marcarKpi(filtros);
      }

      function crearTabla() {
        const puede = !!(datos && datos.puedeAprobar);
        $('#lnr-tabla', raiz).innerHTML = '';
        tabla = tablaLineas($('#lnr-tabla', raiz), {
          idCampo: 'ID',
          idTabla: 'lineas-resguardos-' + vista.toLowerCase() + '-v1',
          columnas: COLUMNAS[vista],
          ordenInicial: { campo: 'FECHA', dir: 'desc' },
          textoVacio: vista === 'RESGUARDOS' ? 'Todavía no se ha mandado nada a resguardo' : 'No hay líneas en cancelación',
          exportar: { nombreArchivo: vista === 'RESGUARDOS' ? 'Resguardos' : 'Cancelaciones de lineas' },
          etiquetaFila: (f) => 'NUCO ' + (f.NUCO || '—') + (f.NUMERO ? ' · ' + f.NUMERO : '') + ' · ' + fechaCorta(f.FECHA),
          detalle: { titulo: (f) => 'NUCO ' + (f.NUCO || '—') },
          accionesFila: [{ icono: 'circle-chevron-right', titulo: 'Ver equipo', visible: (f) => !!f.REGISTRO_ID, alHacer: (f) => irARegistro(f.REGISTRO_ID) }],
          accionesSeleccion: puede ? ACCIONES[vista] : [],
          ayuda: puede ? 'Selecciona uno o varios renglones para confirmar el paso (recibir, entregar, carta firmada o enviada, cancelada). La flecha abre el equipo.'
            : 'Aquí ves el avance de lo que se mandó a resguardo y a cancelación. La flecha abre el equipo.',
          alCambiarFiltros: (f) => { filtros = f || {}; if (marcarKpi) marcarKpi(filtros); },
        });
        tabla.setDatos(filasVista());
        $('#lnr-solo-lectura', raiz).hidden = puede;
      }

      function cargar() {
        if (tabla) tabla.setCargando(true);
        llamar('apiLineasBandejaResguardos').then((texto) => {
          if (!vigente()) return;
          datos = JSON.parse(texto);
          crearTabla();
          pintarKpis();
        }).catch((e) => {
          if (!vigente()) return;
          if (!tabla) tabla = tablaLineas($('#lnr-tabla', raiz), { idCampo: 'ID', columnas: [{ campo: 'ID', titulo: 'ID' }], detalle: false, exportar: false });
          tabla.setError('No se pudo cargar la bandeja: ' + mensajeError(e));
        });
      }

      raiz.querySelector('.lnr-pestanas').addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-lnr-vista]');
        if (!b || b.dataset.lnrVista === vista) return;
        vista = b.dataset.lnrVista;
        filtros = {};
        raiz.querySelectorAll('[data-lnr-vista]').forEach((x) => {
          x.classList.toggle('activo', x === b);
          x.setAttribute('aria-selected', String(x === b));
        });
        if (datos) { crearTabla(); pintarKpis(); }
      });
      $('#lnr-actualizar', raiz).addEventListener('click', cargar);
      cargar();
    }

    // ======================================================================
    // Bitácora: Control de Cambios (fuera del menú; su pestaña alimenta el Historial y el Panorama)
    // ======================================================================

    const BITACORAS = {
      CAMBIOS: {
        titulo: 'Control de Cambios - Líneas', icono: 'eye',
        subtitulo: 'Bitácora de campos modificados en LINEAS TELEFONICAS (AppSheet y nuevo sistema)',
        idRegistro: 'ID_LINEA', fecha: 'FECHA ACTUALIZACION',
        kpis: (filas) => {
          const deCampo = (lista, arr) => arr.filter((f) => lista.indexOf(String(f['CAMPO'] || '').trim()) >= 0).length;
          return [
            { icono: 'toggle-right', valor: miles(deCampo(['ESTATUS LINEA', 'ESTATUS EQUIPO'], filas)), etiqueta: 'Cambios de estatus',
              filtros: { CAMPO: { valores: ['ESTATUS LINEA', 'ESTATUS EQUIPO'] } }, calcular: (f) => miles(deCampo(['ESTATUS LINEA', 'ESTATUS EQUIPO'], f)) },
            { icono: 'recycle', valor: miles(deCampo(['RESPONSABLE'], filas)), etiqueta: 'Cambios de responsable',
              filtros: { CAMPO: { valores: ['RESPONSABLE'] } }, calcular: (f) => miles(deCampo(['RESPONSABLE'], f)) },
          ];
        },
        // Vista CONTROL DE CAMBIOS - LINEAS del AppSheet
        columnas: [
          ['NUCO', 'NUCO'], ['IMEI', 'IMEI'], ['CAMPO', 'Campo'], ['ANTES', 'Antes'], ['DESPUES', 'Después'],
          ['ACTUALIZADO POR', 'Actualizado por'], ['FECHA ACTUALIZACION', 'Fecha actualización'],
        ],
      },
    };

    function initBitacora(tipo) {
      const n = ++montaje;
      const cfg = BITACORAS[tipo];
      const raiz = document.getElementById('ln-bitacora');
      const vigente = () => n === montaje && document.body.contains(raiz);
      let solicitud = 0;
      let tabla = null;
      let filtrosBit = {};
      let marcarKpi = null;
      let busqueda = '';

      $('#ln-bit-titulo', raiz).textContent = cfg.titulo;
      $('#ln-bit-subtitulo', raiz).textContent = cfg.subtitulo;
      $('#ln-bit-titulo-icono', raiz).innerHTML = ico(cfg.icono);
      refreshIcons();

      const norm = normEncabezado;
      const buscarEncabezado = (encabezados, nombre) => encabezados.find((h) => norm(h) === norm(nombre));

      function crearTabla(r) {
        const titulos = {};
        cfg.columnas.forEach(([nombre, titulo]) => { titulos[norm(nombre)] = titulo; });
        const columnas = columnasDeHoja(r.encabezados, r.filas, cfg.columnas.map((c) => c[0]), titulos, tipo);
        const hId = buscarEncabezado(r.encabezados, cfg.idRegistro);
        const hFecha = buscarEncabezado(r.encabezados, cfg.fecha || cfg.columnas[0][0]);
        const hFolio = buscarEncabezado(r.encabezados, 'NUCO') || buscarEncabezado(r.encabezados, 'FOLIO DESECHO');
        tabla = tablaLineas($('#ln-bit-tabla', raiz), {
          idCampo: '_fila',
          idTabla: 'lineas-bitacora-' + tipo.toLowerCase() + '-v2',
          columnas: columnas,
          ordenInicial: hFecha ? { campo: hFecha, dir: 'desc' } : undefined,
          textoVacio: 'Sin registros',
          exportar: exportarBase(tipo, cfg.titulo),
          etiquetaFila: (f) => [hFolio && f[hFolio], hFecha && fechaTabla(f[hFecha])].filter(Boolean).join(' · ') || 'Registro',
          detalle: { titulo: (f) => cfg.titulo + (hFolio && f[hFolio] ? ' · ' + f[hFolio] : '') },
          accionesFila: hId ? [{ icono: 'circle-chevron-right', titulo: 'Ver activo', visible: (f) => !!f[hId], alHacer: (f) => irARegistro(f[hId]) }] : [],
          ayuda: 'Bitácora de solo lectura. El ojo abre todos los campos del registro y el celular abre la ficha del activo.',
          alCambiarFiltros: (f) => { filtrosBit = f || {}; if (marcarKpi) marcarKpi(filtrosBit); },
        });
        tabla.hFecha = hFecha;
      }

      function pintarKpis(r) {
        const hFecha = tabla && tabla.hFecha;
        // "Registros en la hoja" no recalcula con calcular: r.total es el total REAL de la hoja
        // (la tabla solo carga un lote), no el de las filas cargadas — dejarlo fijo evita mentir.
        const defs = [{ icono: cfg.icono, valor: miles(r.total), etiqueta: busqueda ? 'Coinciden con "' + busqueda + '"' : 'Registros en la hoja' }];
        if (hFecha) {
          defs.push({ icono: 'calendar-days', valor: miles(contarDesde(r.filas, hFecha, 29)), etiqueta: 'Últimos 30 días',
            filtros: { [hFecha]: { op: 'entre', v1: diaClave(29), v2: diaClave(0) } }, calcular: (f) => miles(contarDesde(f, hFecha, 29)) });
          defs.push({ icono: 'clock', valor: miles(contarDesde(r.filas, hFecha, 0)), etiqueta: 'Hoy', clase: 'stat-tile-ok',
            filtros: { [hFecha]: { op: 'igual', v1: diaClave(0) } }, calcular: (f) => miles(contarDesde(f, hFecha, 0)) });
        }
        (cfg.kpis ? cfg.kpis(r.filas, r.encabezados, hFecha) : []).forEach((d) => defs.push(d));
        marcarKpi = tilesKpi($('#ln-bit-kpis', raiz), defs, () => tabla);
        marcarKpi(filtrosBit);
      }

      function cargar() {
        const turno = ++solicitud;
        const clave = 'bit:' + tipo;
        const previo = busqueda ? null : memoria.tablas[clave];
        if (previo) procesar(previo); else if (tabla) tabla.setCargando(true);
        llamar('apiLineasBitacoraTabla', tipo, { q: busqueda }).then((texto) => {
          if (!vigente() || turno !== solicitud) return;
          if (!busqueda) memoria.tablas[clave] = texto;
          if (texto !== previo) procesar(texto);
        }).catch((e) => {
          if (!vigente() || turno !== solicitud) return;
          if (previo) return;
          if (!tabla) tabla = tablaLineas($('#ln-bit-tabla', raiz), { idCampo: '_fila', columnas: [{ campo: '_fila', titulo: 'Fila' }], detalle: false, exportar: false });
          tabla.setError('No se pudo cargar la bitácora: ' + mensajeError(e));
        });
      }

      /** Pinta la respuesta del servidor (o la que quedó en memoria de la visita anterior). */
      function procesar(texto) {
        {
          const r = JSON.parse(texto);
          if (!tabla) crearTabla(r);
          pintarKpis(r);
          tabla.setDatos(r.filas);
          // Si la hoja tiene más filas de las que se cargan, se ofrece buscar en todo el historial
          const form = $('#ln-bit-form', raiz);
          form.hidden = !busqueda && r.filas.length >= r.total;
          $('#ln-bit-limpiar', raiz).hidden = !busqueda;
          $('#ln-bit-aviso', raiz).textContent = busqueda
            ? miles(r.total) + ' coincidencia(s) en todo el historial' + (r.filas.length < r.total ? ' (se muestran las ' + miles(r.filas.length) + ' más recientes)' : '') + '.'
            : 'Se muestran los ' + miles(r.filas.length) + ' registros más recientes de ' + miles(r.total) + '.';
        }
      }

      $('#ln-bit-form', raiz).addEventListener('submit', (ev) => {
        ev.preventDefault();
        busqueda = $('#ln-bit-q', raiz).value.trim();
        cargar();
      });
      $('#ln-bit-limpiar', raiz).addEventListener('click', () => {
        $('#ln-bit-q', raiz).value = '';
        busqueda = '';
        cargar();
      });

      cargar();
    }

    return {
      initTelefonicas: initTelefonicas,
      initGestionActivos: initGestionActivos,
      initAccesoriosLineas: initAccesoriosLineas,
      initCambios: () => initBitacora('CAMBIOS'),
      precargar: precargar,
      irARegistro: irARegistro, // desde Notificaciones: "Ver línea"
      irConEstatus: irConEstatus, // desde Notificaciones: "Ver líneas disponibles"
      initPanorama: initPanorama,
      initResguardos: initResguardos,
      // Apoyos para módulos en su propio archivo (p. ej. el temporal de correcciones, html/js/lineas-correcciones.html)
      comun: {
        $: $, esc: esc, guion: guion, miles: miles, ico: ico, chip: chip, fechaTabla: fechaTabla, tablaLineas: tablaLineas,
        tilesKpi: tilesKpi, aviso: aviso, icono: icono, mensajeError: mensajeError, llamar: llamar, pedirDatos: pedirDatos,
      },
    };
  })();
</script>
