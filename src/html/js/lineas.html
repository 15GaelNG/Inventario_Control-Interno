        const errorBox = $('#cap-error', raiz);
        if (!errorBox) return;
        errorBox.textContent = mensaje;
        errorBox.hidden = false;
        const objetivo = destino ? $(destino, raiz) : errorBox;
        (objetivo || errorBox).scrollIntoView({ behavior: 'smooth', block: 'center' });
        errorBox.setAttribute('tabindex', '-1');
        errorBox.focus({ preventScroll: true });
      }

      function refrescarDespuesDeCaptura(idAbierto, tipo, nuevoId) {
        const sesionCaptura = captura;
        sesionCaptura.guardada = true;
        memoria.cargadoEn = 0;
        const modal = $('#ln-modal-captura', raiz);
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        const generar = () => {
          sesionCaptura.guardando = true;
          modal.setAttribute('aria-busy', 'true');
          modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = true; });
          $('#ln-captura-subtitulo', raiz).textContent = 'Registro guardado. Preparando el documento PDF.';
          cuerpo.innerHTML = '<div class="ln-pdf-estado" role="status"><span class="ln-spinner"></span><h3>Generando tu PDF</h3>' +
            '<p>Los datos ya están guardados. Las firmas permanecen temporalmente en esta sesión mientras se completa la plantilla y se crea el PDF.</p>' +
            '<ol><li>Firmas cargadas</li><li>Registro guardado</li><li aria-current="step">Generación del PDF en curso</li></ol>' +
            '<p class="ln-tenue">Este paso puede tardar unos segundos. El enlace aparecerá aquí al terminar.</p></div>';
          cuerpo.scrollTop = 0;
          return llamar('apiLineasGenerarPdf', tipo, nuevoId, false, sesionCaptura.pdfFirmas || null).then((pdf) => {
            if (!vigente() || captura !== sesionCaptura) return;
            $('#ln-captura-subtitulo', raiz).textContent = 'Documento listo para consultar o descargar.';
            cuerpo.innerHTML = '<div class="ln-pdf-estado" role="status">' + icono('circle-check') + '<h3>Tu PDF está listo</h3><p>' + esc(pdf.nombre || 'Documento generado') + '</p>' +
              '<div class="ln-pdf-acciones">' + enlaceDrive(pdf.id, 'Abrir PDF', true) + enlaceDrive(sesionCaptura.carpetaId, 'Carpeta en Drive') +
              '<button type="button" class="secondary" data-cerrar-modal>Volver al equipo</button></div></div>';
            cargarEvidencias(idAbierto);
            cargarHistorial(idAbierto);
          }).catch((e) => {
            if (!vigente() || captura !== sesionCaptura) return;
            $('#ln-captura-subtitulo', raiz).textContent = 'Registro guardado; PDF pendiente.';
            cuerpo.innerHTML = '<div class="ln-pdf-estado" role="alert">' + icono('file-warning') + '<h3>No se pudo completar el PDF</h3><p>' + mensajeError(e) + '</p>' +
            '<p>Tus datos están guardados y las firmas permanecen en esta sesión para reintentar sin volver a llenar el formulario.</p>' +
              '<button type="button" class="primary ln-btn-icono" id="cap-reintentar-pdf">' + icono('refresh-cw') + ' Reintentar PDF</button></div>';
            $('#cap-reintentar-pdf', raiz).addEventListener('click', generar);
            cargarEvidencias(idAbierto);
            cargarHistorial(idAbierto);
          }).finally(() => {
            sesionCaptura.guardando = false;
            modal.removeAttribute('aria-busy');
            modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = false; });
          });
        };
        generar();
      }

      // -- Inspección (INSPECCIONES LINEAS_Form) --

      function formularioInspeccion(ctx) {
        const fotos = '<section class="ln-af-seccion ln-af-extra"><h4 class="ln-af-titulo">' + icono('images') + ' FOTOGRAFÍAS <span class="ln-tenue">(del sistema nuevo, opcional)</span></h4>' +
          '<label class="ln-upload">' + icono('images') + '<span><b>Agregar fotografías</b><small>Se guardan en la carpeta de evidencia del NUCO en Drive.</small></span>' +
          '<input type="file" id="cap-fotos" accept="image/*" capture="environment" multiple /></label><div class="ln-fotos-lista" id="cap-fotos-lista"></div></section>';
        return htmlFormularioAppSheet(ctx.formulario) + fotos +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div>' +
          '<div class="ln-captura-acciones"><button type="button" class="secondary" data-cerrar-modal>Cancelar</button>' +
            '<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('circle-check') + ' Guardar y generar PDF</button></div>';
      }

      function iniciarFormularioInspeccion() {
        iniciarFormularioAppSheet();
        manejarSubidaArchivo('cap-fotos', 'cap-fotos-lista', () => captura.fotosCarpetaId, true, (s) => { if (s) captura.fotos.push(s); });
        $('#cap-guardar', raiz).addEventListener('click', guardarInspeccionDesdeFormulario);
      }

      function guardarInspeccionDesdeFormulario() {
        $('#cap-error', raiz).hidden = true;
        if (!validarFormularioAppSheet()) return;
        if (raiz.querySelector('.ln-foto-subiendo')) { mostrarErrorCaptura('Espera a que terminen de subir las imágenes.', '#cap-fotos-lista'); return; }
        const firmaInspector = captura.firmas['FIRMA INSPECTOR'];
        const firmaResponsable = captura.firmas['FIRMA RESPONSABLE'];
        const idAbierto = captura.idObjetivo;
        const patron = patronParaGuardar();
        captura.pdfFirmas = {
          inspector: firmaInspector.base64('#ddebf7'),
          responsable: firmaResponsable && !firmaResponsable.estaVacia() ? firmaResponsable.base64('#ddebf7') : null,
          patron: captura.controlPatron ? captura.controlPatron.base64('#ddebf7') : null,
        };
        estadoGuardado('Guardando inspección');
        llamar('apiLineasGuardarInspeccion', Object.assign({}, captura.ref, {
          id: captura.contexto.idPropuesto, valores: leerFormularioAppSheet(), patron: patron,
          carpetaId: captura.carpetaId, fotosCarpetaId: captura.fotosCarpetaId, ruta: captura.ruta, fotos: captura.fotos,
          firmaInspectorBase64: captura.pdfFirmas.inspector, firmaResponsableBase64: captura.pdfFirmas.responsable, patronBase64: captura.pdfFirmas.patron,
        })).then((r) => {
          refrescarDespuesDeCaptura(idAbierto, 'INSPECCION', r.id);
        }).catch((e) => {
          mostrarErrorCaptura(mensajeError(e));
          restaurarGuardado();
        });
      }

      // -- Responsiva (RESPONSIVAS LINEAS_Form) --

        return htmlFormularioAppSheet(ctx.formulario) +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div>' +
          '<div class="ln-captura-acciones"><button type="button" class="secondary" data-cerrar-modal>Cancelar</button>' +
            '<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('circle-check') + ' Guardar y generar PDF</button></div>';
      }

      function guardarResponsivaDesdeFormulario() {
        $('#cap-error', raiz).hidden = true;
        if (!validarFormularioAppSheet()) return;
        const firmaResponsable = captura.firmas['FIRMA RESPONSABLE'];
        const firmaCi = captura.firmas['FIRMA CI'];
        const idAbierto = captura.idObjetivo;
        const patron = patronParaGuardar();
        captura.pdfFirmas = {
          responsable: firmaResponsable && !firmaResponsable.estaVacia() ? firmaResponsable.base64('#ffffff') : null,
          ci: firmaCi.base64('#ffffff'),
          patron: captura.controlPatron ? captura.controlPatron.base64('#ffffff') : null,
        };
        estadoGuardado('Guardando responsiva');
        llamar('apiLineasGuardarResponsiva', Object.assign({}, captura.ref, {
          id: captura.contexto.idPropuesto, valores: leerFormularioAppSheet(), patron: patron,
          carpetaId: captura.carpetaId, ruta: captura.ruta,
          firmaResponsableBase64: captura.pdfFirmas.responsable, firmaCiBase64: captura.pdfFirmas.ci, patronBase64: captura.pdfFirmas.patron,
        })).then((r) => {
          refrescarDespuesDeCaptura(idAbierto, 'RESPONSIVA', r.id);
        }).catch((e) => {
          mostrarErrorCaptura(mensajeError(e));
          restaurarGuardado();
        });

      // -- Abrir el modal --

      function abrirCaptura(tipo, ref) {
        $('#ln-modal-captura', raiz).hidden = false;
        $('#ln-captura-icono', raiz).innerHTML = icono(tipo === 'INSPECCION' ? 'clipboard-check' : 'signature');
        $('#ln-captura-tipo', raiz).textContent = tipo === 'INSPECCION' ? 'Inspección de telefonía' : 'Responsiva de entrega';
        $('#ln-captura-titulo', raiz).textContent = tipo === 'INSPECCION' ? 'Nueva inspección' : 'Nueva responsiva';
        $('#ln-captura-subtitulo', raiz).textContent = 'Preparando datos y carpeta de evidencia…';
        $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        captura = { tipo: tipo, ref: ref, idObjetivo: ref.equipoId || ref.lineaId, fotos: [], patronId: null, firmas: {} };

        const pedirContexto = tipo === 'INSPECCION' ? llamar('apiLineasContextoInspeccion', ref) : llamar('apiLineasContextoResponsiva', ref);
        Promise.all([pedirContexto, llamar('apiLineasPrepararEvidencia', tipo, ref), llamar('apiLineasCatalogos')]).then(([ctx, carpeta, catalogos]) => {
          if (!captura) {
            llamar('apiLineasCancelarEvidencia', carpeta.carpetaId, carpeta.fotosCarpetaId).catch(() => {});
            return;
          }
          ctx.catalogos = catalogos;
          captura.contexto = ctx;
          captura.carpetaId = carpeta.carpetaId;
          captura.fotosCarpetaId = carpeta.fotosCarpetaId || carpeta.carpetaId;
          captura.ruta = carpeta.ruta;
          $('#ln-captura-subtitulo', raiz).textContent = tipo === 'INSPECCION'
            ? 'Mismo formulario que en AppSheet: los campos cambian según el TIPO.'
            : 'Mismo formulario que en AppSheet. La firma de Control Interno es obligatoria.';
          if (tipo === 'INSPECCION') {
            $('#ln-captura-cuerpo', raiz).innerHTML = formularioInspeccion(ctx);
            pintarIconos($('#ln-captura-cuerpo', raiz));
            iniciarFormularioInspeccion();
          } else {
            $('#ln-captura-cuerpo', raiz).innerHTML = formularioResponsiva(ctx);
            pintarIconos($('#ln-captura-cuerpo', raiz));
            iniciarFormularioResponsiva();
          }
        }).catch((e) => {
          if (!captura) return;
          $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>';
        });
      }

      // ---- Historial ----
      const ETIQUETA_MOV = {
        ASIGNAR_LINEA: 'Línea asignada', RETIRAR_LINEA: 'Línea retirada', CAMBIO_EQUIPO: 'Cambio de equipo',
        REASIGNACION: 'Reasignación de responsable', CAMBIO_ESTATUS_EQUIPO: 'Cambio de estatus (equipo)',
        CAMBIO_ESTATUS_LINEA: 'Cambio de estatus (línea)', DESECHO: 'Desecho', INSPECCION: 'Inspección', RESPONSIVA: 'Responsiva firmada',
        EDICION: 'Edición de datos', ALTA: 'Alta de registro',
      };

      function describirMovimiento(m) {
        const a = m.antes || {};
        const d = m.despues || {};
        const partes = [];
        if (m.tipo === 'REASIGNACION') {
          partes.push(esc((a.responsable && a.responsable.nombre) || '(sin responsable)') + ' → <b>' + esc((d.responsable && d.responsable.nombre) || '—') + '</b>');
        } else if (m.tipo === 'ASIGNAR_LINEA' || m.tipo === 'RETIRAR_LINEA') {
          partes.push('Línea <b>' + esc(m.numero || '') + '</b> ' + (m.tipo === 'ASIGNAR_LINEA' ? 'en' : 'fuera de') + ' NUCO <b>' + esc(m.nuco || '') + '</b>');
        } else if (m.tipo === 'CAMBIO_EQUIPO') {
          partes.push('Línea <b>' + esc(m.numero || '') + '</b>: NUCO ' + esc(m.nuco || '') + ' → <b>NUCO ' + esc(m.nucoDestino || '') + '</b>');
        } else if (/^CAMBIO_ESTATUS/.test(m.tipo)) {
          partes.push(esc(a.estatus || '—') + ' → <b>' + esc(d.estatus || '—') + '</b>');
        } else if (m.tipo === 'INSPECCION') {
          partes.push('<a href="#" class="ln-enlace" data-ln-ir="inspeccion" data-id="' + esc(m.inspeccionId) + '">Ver inspección</a>' +
            (d.calificacion !== null && d.calificacion !== undefined ? ' · Calificación ' + Math.round(d.calificacion * 100) + '%' : ''));
        } else if (m.tipo === 'RESPONSIVA') {
          partes.push('Responsable: <b>' + esc((d.responsable && d.responsable.nombre) || '—') + '</b>');
        } else if (m.tipo === 'DESECHO') {
          partes.push('Folio ' + esc(m.folio || '—') + (m.detalle && m.detalle.lugar ? ' · ' + esc(m.detalle.lugar) : ''));
        }
        if (m.motivo) partes.push('Motivo: ' + esc(m.motivo));
        if (m.ticket) partes.push('Ticket: ' + esc(m.ticket));
        if (m.cambios && m.cambios.length) {
          partes.push('<details><summary class="ln-tenue">' + m.cambios.length + ' campo(s) modificados</summary><ul class="ln-tenue">' +
            m.cambios.map((c) => '<li>' + esc(c.campo) + ': ' + esc(c.antes || '—') + ' → <b>' + esc(c.despues || '—') + '</b></li>').join('') + '</ul></details>');
        }
        return partes.join('<br>');
      }

      function cargarHistorial(id) {
        const pila0 = pila.length;
        llamar('apiLineasHistorial', id).then((h) => {
          const cont = $('#ln-historial', raiz);
          if (!vigente() || !cont || pila.length !== pila0) return;
          const items = h.movimientos.map((m) => ({
            fecha: m.fecha, titulo: ETIQUETA_MOV[m.tipo] || m.tipo, origen: m.origen, cuerpo: describirMovimiento(m),
            usuario: m.usuario && (m.usuario.nombre || m.usuario.correo),
          }));
          (h.legado ? h.legado.eventos : []).forEach((e) => {
            items.push({ fecha: e.fecha, titulo: 'Cambio: ' + (e.campo || ''), origen: 'BITACORA', cuerpo: esc(e.antes || '—') + ' → <b>' + esc(e.despues || '—') + '</b>', usuario: e.usuario });
          });
          items.sort((a, b) => new Date(b.fecha || 0) - new Date(a.fecha || 0));
          const origen = { SISTEMA: chip('Nuevo sistema', 'verde'), LEGADO: chip('AppSheet', 'azul'), BITACORA: chip('Bitácora AppSheet', 'neutro') };
          cont.innerHTML = tarjeta(icono('history') + ' Historial (' + items.length + ')', items.length
            ? '<ol class="ln-timeline">' + items.slice(0, 150).map((it) =>
                '<li><div class="ln-tl-cabecera"><b>' + esc(it.titulo) + '</b> ' + (origen[it.origen] || '') +
                '<span class="ln-tenue ln-tl-fecha">' + esc(fechaHora(it.fecha)) + (it.usuario ? ' · ' + esc(it.usuario) : '') + '</span></div>' +
                '<div class="ln-tl-cuerpo">' + it.cuerpo + '</div></li>').join('') + '</ol>' +
              (items.length > 150 ? '<p class="ln-tenue ln-pie">Mostrando los 150 más recientes.</p>' : '')
            : '<p class="empty-state">Sin movimientos registrados.</p>');
        }).catch((e) => {
          const cont = $('#ln-historial', raiz);
          if (cont) cont.innerHTML = tarjeta(icono('history') + ' Historial', '<p class="error-msg">' + mensajeError(e) + '</p>');
        });
      }

      // ---- Inspección ----
      function pintarInspeccion(detalle, id) {
        return llamar('apiLineasInspeccion', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'inspeccion' || pila[pila.length - 1].id !== id) return;
          const i = r.inspeccion;
          const e = r.equipo;
          const s = i.snapshot || {};
          const fotos = r.fotos || [];
          const firmas = r.firmas || [];
          const CLASE_VALOR = { SI: 'verde', BUENO: 'verde', INSTALADA: 'verde', REGULAR: 'ambar', NO: 'rojo', MALO: 'rojo', 'NO INSTALADA': 'neutro' };
          const checklist = i.origen === 'DRIVE'
            ? '<div class="ln-nota">Esta inspección se conserva en Drive. Consulta sus archivos; no hay respuestas de checklist registradas en el sistema.</div>'
            : '<div class="ln-grid-2">' + (r.checklist || []).map((sec) => {
                const puntos = sec.puntos.filter((p) => i.checklist && i.checklist[p.clave]);
                if (!puntos.length) return '';
                return tarjeta(icono('list-checks') + ' ' + esc(sec.seccion), campos(puntos.map((p) => {
                  const v = i.checklist[p.clave];
                  return [p.etiqueta, chip(v, CLASE_VALOR[v] || 'neutro'), true];
                })));
              }).join('') + '</div>';
          const galeria = (lista, firma) => '<div class="ln-galeria">' + lista.map((f) =>
            '<a class="ln-evidencia" target="_blank" rel="noopener" href="' + esc(f.enlace) + '">' +
            '<span class="ln-foto' + (firma ? ' ln-firma' : '') + '">' +
            (f.miniatura ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(f.miniatura) + '" alt="' + esc(f.nombre) + '">' : icono(f.video ? 'video' : 'image')) +
            '</span><span class="ln-evidencia-nombre">' + esc(f.nombre || 'Evidencia') + '<small>' + icono('external-link') + ' Abrir en Drive</small></span></a>').join('') + '</div>';
          const seccion = (num, ico, titulo, ayuda, contenido) => '<section class="ln-seccion-consulta" id="ln-consulta-' + num + '" tabindex="-1">' + seccionCaptura(num, ico, titulo, ayuda, contenido) + '</section>';
          const resumen = (ico, etiqueta, valor) => '<div class="ln-captura-dato">' + icono(ico) + '<span><small>' + esc(etiqueta) + '</small><b>' + guion(valor) + '</b></span></div>';
          detalle.innerHTML = migas() +
            encabezado('clipboard-check', 'Inspección ' + esc(fecha(i.fecha) || ''),
              (ORIGEN[i.origen] || '') + (e ? chip('NUCO ' + (e.nuco || '—'), 'neutro') : ''),
              (e ? '<button type="button" class="secondary ln-btn-icono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' Ver equipo</button>' : '') +
              (i.drive ? enlaceDrive(i.drive.carpetaId, 'Carpeta en Drive') : '') +
              (r.pdfs || []).map((p, indice) => enlaceDrive(p.id, 'Abrir PDF' + (r.pdfs.length > 1 ? ' ' + (indice + 1) : ''), true)).join('')) +
            '<div class="ln-captura-resumen">' + resumen('user', 'Inspector', i.inspector) + resumen('clipboard-check', 'Calificación', porcentaje(i.calificacion)) + resumen('images', 'Evidencia fotográfica', fotos.length + ' archivo(s)') + '</div>' +
            '<nav class="ln-secciones-nav" aria-label="Secciones de la inspección">' +
              ['Datos', 'Checklist', 'Fotos y observaciones', 'Firmas'].map((t, n) => '<button type="button" class="secondary" data-ln-seccion="ln-consulta-' + (n + 1) + '">' + (n + 1) + '. ' + t + '</button>').join('') + '</nav>' +
            seccion(1, 'user', 'Datos de la inspección', 'Información registrada al realizar la revisión.',
              i.origen !== 'DRIVE' ? '<div class="ln-grid-2">' +
                tarjeta(icono('user') + ' Responsable', campos([['Nombre', s.responsable], ['Departamento', s.departamento], ['Sede', s.sede], ['Puesto', s.puesto]])) +
                tarjeta(icono('smartphone') + ' Activo revisado', campos([['Número', s.numero], ['IMEI', s.imei], ['Modelo', s.modelo], ['Compañía', s.compania], ['Ticket', i.ticket]])) + '</div>'
                : '<p class="ln-tenue">Los datos de esta inspección histórica se encuentran en el documento PDF.</p>') +
            seccion(2, 'list-checks', 'Revisión del activo', 'Respuestas y estado de cada componente al momento de la inspección.', checklist) +
            seccion(3, 'camera', 'Evidencia y observaciones', 'Abre cualquier archivo para consultar la imagen completa en Drive.',
              '<h4>Observaciones</h4><p class="ln-lectura-notas">' + esc(i.observaciones || 'Sin observaciones registradas.') + '</p>' +
              '<h4>Fotografías (' + fotos.length + ')</h4>' + (fotos.length ? galeria(fotos) : '<p class="empty-state">No se adjuntaron fotografías a esta inspección.</p>') +
              (i.drive ? '<details class="ln-pie"><summary>Ubicación de los archivos</summary><p>' + esc(i.drive.ruta || '') + '</p></details>' : '')) +
            seccion(4, 'signature', 'Firmas de validación', 'Firmas disponibles en la carpeta de esta inspección.',
              firmas.length ? galeria(firmas, true) : '<p class="empty-state">No hay imágenes de firmas disponibles en esta carpeta. Consulta el PDF para revisar el documento.</p>');
          detalle.querySelectorAll('.ln-evidencia img').forEach((img) => img.addEventListener('error', () => {
            img.parentElement.innerHTML = icono('image-off') + '<span>Vista previa no disponible</span>';
          }, { once: true }));
        });
      }

    }

    /** Desde una bitácora: abre el registro en Líneas Telefónicas. */
    function irARegistro(id) {
      memoria.abrirAlEntrar = id;
      navegarA('lineas-telefonicas', 'Líneas Telefónicas');
    }

    // ======================================================================
    // Detalles Líneas Telefónicas: buscador rápido que salta a la ficha
    // ======================================================================

    function initDetalles() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-detalles-lineas');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const paso = 48;
      let registros = [];
      let filtrados = [];
      let visibles = paso;
      let temporizador = null;
      pintarIconos(raiz);

      function tarjetaDetalle(r) {
        const esEquipo = r.clase === 'EQUIPO';
        const titulo = esEquipo ? (r.nuco || 'Sin NUCO') : (r.numero || 'Sin número');
        const principal = esEquipo ? (r.numero || r.modelo || 'Sin línea asociada') : (r.responsable || 'Línea sin responsable');
        const subtitulo = esEquipo ? (r.modelo || TIPO_EQUIPO[r.tipo] || r.tipo || 'Equipo') : (r.compania || 'Línea telefónica');
        const identidad = esEquipo ? r.imei : r.sim;
        return '<button type="button" class="card ln-cuadro ln-cuadro-activo" data-ir="' + esc(r.id) + '" aria-label="Abrir ' + esc(titulo) + '">' +
          '<div class="ln-cuadro-superior"><span class="ln-cuadro-folio ln-mono">' + esc(titulo) + '</span>' +
          '<span class="ln-cuadro-tipo">' + icono(esEquipo ? 'smartphone' : 'card-sim') + ' ' + (esEquipo ? 'Equipo' : 'Línea') + '</span></div>' +
          '<div class="ln-cuadro-depto">' + guion(r.departamento) + '</div>' +
          '<div class="ln-cuadro-principal">' + guion(principal) + '</div>' +
          '<div class="ln-cuadro-secundario">' + guion(subtitulo) + '</div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('user') + ' ' + guion(r.responsable) + '</span>' +
          '<span class="ln-mono">' + icono(esEquipo ? 'scan-line' : 'credit-card') + ' ' + guion(identidad) + '</span></div>' +
          '<div class="ln-cuadro-pie"><span>' + chip(r.estatus) + '</span>' +
          '<span>Ver ficha ' + icono('chevron-right') + '</span></div></button>';
      }

      function aplicarFiltros() {
        const texto = normal($('#lnd-q', raiz).value).trim();
        const tipo = $('#lnd-tipo', raiz).value;
        filtrados = registros.filter((r) => {
          if (tipo !== 'TODOS' && r.clase !== tipo) return false;
          return !texto || ['nuco', 'numero', 'imei', 'sim', 'modelo', 'compania', 'responsable', 'departamento', 'estatus']
            .some((c) => normal(r[c]).indexOf(texto) >= 0);
        });
        visibles = paso;
        pintar();
      }

      function pintar() {
        const grid = $('#lnd-grid', raiz);
        grid.innerHTML = filtrados.length
          ? filtrados.slice(0, visibles).map(tarjetaDetalle).join('')
          : '<div class="card empty-state ln-cuadro-vacio">No hay líneas o equipos que coincidan con los filtros.</div>';
        $('#lnd-total', raiz).textContent = miles(registros.length);
        $('#lnd-filtrados', raiz).textContent = miles(filtrados.length);
        $('#lnd-conteo', raiz).textContent = 'Mostrando ' + miles(Math.min(visibles, filtrados.length)) + ' de ' + miles(filtrados.length);
        $('#lnd-mas', raiz).hidden = visibles >= filtrados.length;
      }

      $('#lnd-q', raiz).addEventListener('input', (ev) => {
        clearTimeout(temporizador);
        temporizador = setTimeout(aplicarFiltros, 150);
      });
      $('#lnd-tipo', raiz).addEventListener('change', aplicarFiltros);
      $('#lnd-mas', raiz).addEventListener('click', () => { visibles += paso; pintar(); });
      $('#lnd-exportar', raiz).addEventListener('click', () => {
        const columnas = ['clase', 'nuco', 'numero', 'modelo', 'imei', 'sim', 'compania', 'estatus', 'responsable', 'departamento'];
        exportarCsv('detalles lineas telefonicas', columnas, filtrados,
          ['Tipo', 'NUCO', 'Número', 'Modelo', 'IMEI', 'SIM', 'Compañía', 'Estatus', 'Responsable', 'Departamento']);
      });
      raiz.addEventListener('click', (ev) => {
        const f = ev.target.closest('[data-ir]');
        if (f) irARegistro(f.dataset.ir);
      });

      Promise.all([cargarPermisos(), cargarIndice()]).then(([, indice]) => {
        if (!vigente()) return;
        registros = indice.equipos.map((r) => Object.assign({ clase: 'EQUIPO' }, r))
          .concat(indice.lineas.filter((r) => r.suelta).map((r) => Object.assign({ clase: 'LINEA' }, r)));
        aplicarFiltros();
      })
        .catch((e) => {
          if (!vigente()) return;
          $('#lnd-error', raiz).textContent = 'No se pudo cargar el índice: ' + mensajeError(e);
          $('#lnd-error', raiz).hidden = false;
        });
    }

    // ======================================================================
    // Gestión de Activos: busca un colaborador y muestra sus líneas/equipos
    // (vehículos, hologramas, Uber y cajas chicas se integran con los demás módulos)
    // ======================================================================

    function initGestionActivos() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-gestion-activos');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const paso = 48;
      pintarIconos(raiz);

      let colaboradores = [];
      let filtrados = [];
      let visibles = paso;
      let temporizador = null;

      function filasPorResponsable(indice, nombre) {
        const texto = normal(nombre);
        return {
          equipos: indice.equipos.filter((r) => normal(r.responsable) === texto),
          lineas: indice.lineas.filter((r) => r.suelta && normal(r.responsable) === texto),
        };
      }

      function tarjetaLineas(nombre, datos) {
        const filaEq = (r) => '<tr class="ln-fila-clic" data-ir="' + esc(r.id) + '"><td><button type="button" class="secondary ln-btn-icono" data-ir="' + esc(r.id) + '">' + icono('smartphone') + ' NUCO ' + guion(r.nuco) + ' ' + icono('chevron-right') + '</button></td><td>' +
          esc(TIPO_EQUIPO[r.tipo] || r.tipo || '') + '</td><td>' + guion(r.modelo) + '</td><td>' + chip(r.estatus) + '</td><td class="ln-mono">' +
          (r.numero ? esc(r.numero) : '<span class="ln-tenue">Sin línea</span>') + '</td></tr>';
        const filaLi = (r) => '<tr class="ln-fila-clic" data-ir="' + esc(r.id) + '"><td><button type="button" class="secondary ln-btn-icono" data-ir="' + esc(r.id) + '">' + icono('phone') + ' ' + guion(r.numero) + ' ' + icono('chevron-right') + '</button>' +
          '</td><td>Línea suelta</td><td>' + guion(r.compania) + '</td><td>' + chip(r.estatus) + '</td><td>—</td></tr>';
        const filas = datos.equipos.map(filaEq).concat(datos.lineas.map(filaLi));
        return '<div class="card ln-card"><h3>' + icono('smartphone') + ' Líneas y equipos (' + filas.length + ')</h3>' +
          (filas.length
            ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>NUCO / Número</th><th>Tipo</th><th>Modelo / Compañía</th><th>Estatus</th><th>Línea</th></tr></thead><tbody>' + filas.join('') + '</tbody></table></div>'
            : '<p class="empty-state">Sin líneas ni equipos asignados a ' + esc(nombre) + '.</p>') + '</div>';
      }

      function tarjetaPendiente(titulo, ico) {
        return '<div class="card ln-card"><h3>' + icono(ico) + ' ' + esc(titulo) + '</h3>' +
          '<p class="ln-tenue">Esta información aún no está disponible en esta vista.</p></div>';
      }

      function mostrarColaborador(c, tarjeta) {
        cargarIndice().then((indice) => {
          if (!vigente()) return;
          const datos = filasPorResponsable(indice, c.nombre);
          raiz.querySelectorAll('.ln-cuadro-colaborador.seleccionado').forEach((el) => el.classList.remove('seleccionado'));
          if (tarjeta) tarjeta.classList.add('seleccionado');
          $('#lnga-resultado', raiz).innerHTML =
            '<div class="ln-detalle-header card"><div class="ln-detalle-icono">' + icono('user') + '</div>' +
            '<div class="ln-detalle-titulo"><h2>' + esc(c.nombre) + '</h2><div class="ln-chips">' +
              (c.puesto ? chip(c.puesto, 'neutro') : '') + (c.departamento ? chip(c.departamento, 'azul') : '') + (c.estatus ? chip(c.estatus) : '') +
            '</div><p class="ln-pie ln-tenue">' + [c.noEmpleado ? 'Empleado ' + esc(c.noEmpleado) : '', c.sede, c.oficina].filter(Boolean).join(' · ') + '</p></div></div>' +
            tarjetaLineas(c.nombre, datos) +
            '<div class="ln-grid-2">' + tarjetaPendiente('Vehículos', 'car') + tarjetaPendiente('Hologramas / combustible', 'fuel') + '</div>' +
            '<div class="ln-grid-2">' + tarjetaPendiente('Uber', 'car-front') + tarjetaPendiente('Cajas chicas', 'wallet') + '</div>';
          $('#lnga-resultado', raiz).scrollIntoView({ behavior: 'smooth', block: 'start' });
        }).catch((e) => { if (vigente()) $('#lnga-resultado', raiz).innerHTML = '<p class="error-msg">No se pudieron consultar las asignaciones: ' + mensajeError(e) + '</p>'; });
      }

      function tarjetaColaborador(c) {
        const conActivos = c.totalActivos > 0;
        return '<button type="button" class="card ln-cuadro ln-cuadro-colaborador ' + (conActivos ? 'con-activos' : 'sin-activos') + '" data-colaborador-i="' + c._i + '">' +
          '<div class="ln-cuadro-superior"><span class="ln-cuadro-departamento">' + guion(c.departamento) + '</span>' +
          '<span class="ln-cuadro-area">' + guion(c.area) + '</span></div>' +
          '<div class="ln-cuadro-principal">' + guion(c.nombre) + '</div>' +
          '<div class="ln-cuadro-secundario">' + guion(c.puesto) + '</div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('map-pin') + ' ' + guion(c.sede) + '</span><span>' + icono('building-2') + ' ' + guion(c.oficina) + '</span></div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('briefcase-business') + ' ' + chip(c.estatus || 'Sin estatus', String(c.estatus).toUpperCase() === 'ACTIVO' ? 'verde' : 'neutro') + '</span>' +
          '<span class="ln-activos-estado ' + (conActivos ? 'si' : 'no') + '">' + icono(conActivos ? 'package-check' : 'package-x') + ' ' +
          (conActivos ? miles(c.totalActivos) + ' activo(s)' : 'Sin activos') + '</span></div><div class="ln-cuadro-pie"><span>Consultar asignaciones ' + icono('chevron-right') + '</span></div></button>';
      }

      function pintarCuadros() {
        $('#lnga-grid', raiz).innerHTML = filtrados.length
          ? filtrados.slice(0, visibles).map(tarjetaColaborador).join('')
          : '<div class="card empty-state ln-cuadro-vacio">No hay colaboradores que coincidan con los filtros.</div>';
        $('#lnga-conteo', raiz).textContent = 'Mostrando ' + miles(Math.min(visibles, filtrados.length)) + ' de ' + miles(filtrados.length);
        $('#lnga-mas', raiz).hidden = visibles >= filtrados.length;
      }

      function aplicarFiltros() {
        const texto = normal($('#lnga-q', raiz).value).trim();
        const activos = $('#lnga-filtro-activos', raiz).value;
        filtrados = colaboradores.filter((c) => {
          if (activos === 'CON' && !c.totalActivos) return false;
          if (activos === 'SIN' && c.totalActivos) return false;
          return !texto || ['nombre', 'noEmpleado', 'puesto', 'departamento', 'area', 'sede', 'oficina']
            .some((campo) => normal(c[campo]).indexOf(texto) >= 0);
        });
        visibles = paso;
        pintarCuadros();
      }

      $('#lnga-q', raiz).addEventListener('input', (ev) => {
        clearTimeout(temporizador);
        temporizador = setTimeout(aplicarFiltros, 150);
      });
      $('#lnga-filtro-activos', raiz).addEventListener('change', aplicarFiltros);
      $('#lnga-mas', raiz).addEventListener('click', () => { visibles += paso; pintarCuadros(); });
      raiz.addEventListener('click', (ev) => {
        const sug = ev.target.closest('[data-colaborador-i]');
        if (sug) {
          const c = colaboradores[Number(sug.dataset.colaboradorI)];
          if (c) mostrarColaborador(c, sug);
          return;
        }
        const f = ev.target.closest('[data-ir]');
        if (f) irARegistro(f.dataset.ir);
      });

      Promise.all([cargarColaboradores(), cargarIndice()]).then(([r, indice]) => {
        if (!vigente()) return;
        const conteo = {};
        indice.equipos.forEach((a) => { const k = normal(a.responsable); if (k) conteo[k] = (conteo[k] || 0) + 1; });
        indice.lineas.filter((a) => a.suelta).forEach((a) => { const k = normal(a.responsable); if (k) conteo[k] = (conteo[k] || 0) + 1; });
        colaboradores = filasComoObjetos(r).map((c, i) => Object.assign(c, { _i: i, totalActivos: conteo[normal(c.nombre)] || 0 }));
        $('#lnga-total', raiz).textContent = miles(colaboradores.length);
        $('#lnga-con-activos', raiz).textContent = miles(colaboradores.filter((c) => c.totalActivos).length);
        aplicarFiltros();
      }).catch((e) => {
        if (!vigente()) return;
        $('#lnga-grid', raiz).innerHTML = '';
        $('#lnga-error', raiz).textContent = 'No se pudieron cargar los colaboradores: ' + mensajeError(e);
        $('#lnga-error', raiz).hidden = false;
      });
    }

    // ======================================================================
    // Inventario de Accesorios (Líneas) — ACCESORIOS CELULARES / MOVIMIENTOS_ACCESORIOS
    // en la copia de pruebas de Líneas; no toca el módulo de accesorios del equipo.
    // ======================================================================

    function initAccesoriosLineas() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-accesorios');
      const vigente = () => n === montaje && document.body.contains(raiz);
      pintarIconos(raiz);

      let indiceAcc = null;
      let seleccionado = null;
      let guardandoAccesorio = false;
      let movimientoActual = 0;

      let tabla = null;
      let filtrosAcc = {};
      let marcarKpi = null;

      function pintarIndicadores() {
        if (!indiceAcc) return;
        const filas = indiceAcc.filas;
        marcarKpi = tilesKpi($('#lac-indicadores', raiz), [
          { icono: 'package', valor: miles(filas.length), etiqueta: 'Artículos' },
          { icono: 'triangle-alert', valor: miles(filas.filter((a) => a.reabasto).length), etiqueta: 'Con stock bajo (≤ ' + indiceAcc.umbralReabasto + ')',
            clase: 'stat-tile-warn', filtros: { reabasto: { valores: ['Sí'] } } },
          { icono: 'circle-check', valor: miles(filas.reduce((t, a) => t + (Number(a.stock) || 0), 0)), etiqueta: 'Piezas en stock', clase: 'stat-tile-ok', filtros: false },
        ], () => tabla);
        marcarKpi(filtrosAcc);
      }

      /** Panel de detalle de DataTable: movimientos del artículo, del más reciente al más antiguo. */
      function movimientosEnPanel(a, cont) {
        const turno = ++movimientoActual;
        cont.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Movimientos</div><p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p>';
        llamar('apiLineasAccesoriosMovimientos', a.id).then((movs) => {
          if (!vigente() || turno !== movimientoActual || !document.body.contains(cont)) return;
          cont.innerHTML = '<div class="dt-campo-titulo" style="margin-bottom:8px">Movimientos (' + movs.length + ')</div>' + (movs.length
            ? '<div class="historial-timeline">' + movs.map((m) => '<div class="historial-item"><div class="historial-icon' + (m.tipo === 'ENTRADA' ? '' : ' historial-icon-accent') + '">' +
                ico(m.tipo === 'ENTRADA' ? 'arrow-down-to-line' : 'arrow-up-from-line') + '</div><div style="flex:1; min-width:0">' +
                '<div><strong>' + (m.tipo === 'ENTRADA' ? 'Entrada' : 'Salida') + ' de ' + esc(String(m.cantidad)) + '</strong> <span class="ln-tenue">· ' + esc(fechaTabla(m.fecha)) + '</span></div>' +
                '<div class="ln-tenue">' + guion(m.usuario) + (m.comentarios ? ' — ' + esc(m.comentarios) : '') + '</div></div></div>').join('') + '</div>'
            : '<p class="empty-state">Sin movimientos.</p>');
        }).catch((e) => { if (vigente() && turno === movimientoActual) cont.innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>'; });
      }

      function crearTablaAcc() {
        tabla = tablaLineas($('#lac-tabla', raiz), {
          idCampo: 'id',
          idTabla: 'lineas-accesorios',
          ordenInicial: { campo: 'nombre', dir: 'asc' },
          textoVacio: 'Sin artículos',
          exportar: { nombreArchivo: 'Inventario de accesorios' },
          etiquetaFila: (a) => a.nombre,
          detalle: { titulo: (a) => a.nombre, contenidoExtra: movimientosEnPanel },
          ayuda: 'El ojo en Acciones muestra el artículo y sus movimientos. Las flechas registran entradas y salidas.',
          alCambiarFiltros: (f) => { filtrosAcc = f || {}; if (marcarKpi) marcarKpi(filtrosAcc); },
          accionesFila: [
            { icono: 'arrow-down-to-line', titulo: 'Registrar entrada', alHacer: (a) => abrirModalMovimiento(a.id, 'ENTRADA') },
            { icono: 'arrow-up-from-line', titulo: 'Registrar salida', alHacer: (a) => abrirModalMovimiento(a.id, 'SALIDA') },
          ],
          columnas: [
            { campo: 'nombre', titulo: 'Artículo', tipo: 'texto', fijada: true },
            { campo: 'categoria', titulo: 'Categoría', tipo: 'lista' },
            { campo: 'marca', titulo: 'Marca / modelo', tipo: 'texto' },
            { campo: 'stock', titulo: 'Stock', tipo: 'numero', agregado: 'suma',
              render: (v, a) => '<span class="lac-stock' + (a.reabasto ? ' bajo' : '') + '">' + esc(String(v)) + '</span>' },
            { campo: 'reabasto', titulo: 'Stock bajo', tipo: 'lista', valor: (a) => (a.reabasto ? 'Sí' : 'No'),
              render: (v) => (v === 'Sí' ? chip('Reabastecer', 'rojo') : '<span class="ln-tenue">No</span>') },
          ],
        });
      }

      function cargar(forzar) {
        if (!tabla) crearTablaAcc();
        tabla.setCargando(true);
        cargarAccesorios(!!forzar).then((r) => {
          if (!vigente()) return;
          indiceAcc = r;
          pintarIndicadores();
          tabla.setDatos(r.filas);
        }).catch((e) => {
          if (!vigente()) return;
          tabla.setError('No se pudo cargar el inventario: ' + mensajeError(e));
        });
      }

      function abrirModalNuevo() {
        $('#lac-nombre', raiz).value = ''; $('#lac-categoria', raiz).value = ''; $('#lac-marca', raiz).value = '';
        $('#lac-nuevo-error', raiz).hidden = true;
        $('#lac-modal-nuevo', raiz).hidden = false;
      }
      function cerrarModalNuevo() { if (!guardandoAccesorio) $('#lac-modal-nuevo', raiz).hidden = true; }

      function abrirModalMovimiento(id, tipo) {
        seleccionado = { id: id, tipo: tipo };
        const a = (indiceAcc.filas || []).filter((x) => x.id === id)[0];
        $('#lac-mov-titulo', raiz).textContent = (tipo === 'ENTRADA' ? 'Registrar entrada' : 'Registrar salida');
        $('#lac-mov-subtitulo', raiz).textContent = (a ? a.nombre + ' · stock actual ' + a.stock : '');
        $('#lac-cantidad', raiz).value = '';
        $('#lac-comentarios', raiz).value = '';
        $('#lac-mov-error', raiz).hidden = true;
        $('#lac-modal-mov', raiz).hidden = false;
      }
      function cerrarModalMov() { if (guardandoAccesorio) return; $('#lac-modal-mov', raiz).hidden = true; seleccionado = null; }

      function estadoAccesorio(modalId, ocupado) {
        guardandoAccesorio = ocupado;
        const modal = $(modalId, raiz);
        modal.querySelectorAll('button, input, textarea').forEach((el) => { el.disabled = ocupado; });
        const boton = modal.querySelector('.primary');
        if (ocupado) { boton.dataset.texto = boton.innerHTML; boton.innerHTML = '<span class="ln-spinner"></span> Guardando…'; }
        else boton.innerHTML = boton.dataset.texto;
      }

      $('#lac-nuevo', raiz).addEventListener('click', abrirModalNuevo);
      raiz.querySelectorAll('[data-cerrar-modal-nuevo]').forEach((b) => b.addEventListener('click', cerrarModalNuevo));
      raiz.querySelectorAll('[data-cerrar-modal-mov]').forEach((b) => b.addEventListener('click', cerrarModalMov));
      $('#lac-modal-nuevo', raiz).addEventListener('click', (ev) => { if (ev.target.id === 'lac-modal-nuevo') cerrarModalNuevo(); });
      $('#lac-modal-mov', raiz).addEventListener('click', (ev) => { if (ev.target.id === 'lac-modal-mov') cerrarModalMov(); });

      $('#lac-guardar-nuevo', raiz).addEventListener('click', () => {
        if (guardandoAccesorio) return;
        const nombre = $('#lac-nombre', raiz).value.trim();
        if (!nombre) { $('#lac-nuevo-error', raiz).textContent = 'El nombre es obligatorio.'; $('#lac-nuevo-error', raiz).hidden = false; return; }
        estadoAccesorio('#lac-modal-nuevo', true);
        llamar('apiLineasAccesoriosAgregarArticulo', { nombre: nombre, categoria: $('#lac-categoria', raiz).value, marca: $('#lac-marca', raiz).value })
          .then(() => { guardandoAccesorio = false; cerrarModalNuevo(); aviso('Artículo guardado correctamente.', 6000); cargar(true); })
          .catch((e) => { $('#lac-nuevo-error', raiz).textContent = mensajeError(e); $('#lac-nuevo-error', raiz).hidden = false; })
          .finally(() => estadoAccesorio('#lac-modal-nuevo', false));
      });

      $('#lac-guardar-mov', raiz).addEventListener('click', () => {
        if (!seleccionado || guardandoAccesorio) return;
        const cantidad = Number($('#lac-cantidad', raiz).value);
        if (!Number.isInteger(cantidad) || cantidad <= 0) { $('#lac-mov-error', raiz).textContent = 'Captura una cantidad entera mayor que cero.'; $('#lac-mov-error', raiz).hidden = false; return; }
        estadoAccesorio('#lac-modal-mov', true);
        llamar('apiLineasAccesoriosRegistrarMovimiento', { accesorioId: seleccionado.id, tipo: seleccionado.tipo, cantidad: cantidad, comentarios: $('#lac-comentarios', raiz).value })
          .then(() => { guardandoAccesorio = false; cerrarModalMov(); aviso('Movimiento registrado correctamente.', 6000); cargar(true); })
          .catch((e) => { $('#lac-mov-error', raiz).textContent = mensajeError(e); $('#lac-mov-error', raiz).hidden = false; })
          .finally(() => estadoAccesorio('#lac-modal-mov', false));
      });

      cargar();
    }

    // ======================================================================
    // Reactivación, Solicitud y Líneas Post Venta
    // ======================================================================

    const OPERATIVAS = {
      REACTIVACION: {
        resumen: ['FOLIO', 'LINIEA SUSPENDIDA', 'COMPAÑIA', 'ESTATUS', 'FECHA DE REACTIVACION'],
        titulo: 'Reactivación de Líneas', icono: 'refresh-cw', csv: 'reactivacion de lineas',
        subtitulo: 'Seguimiento de líneas suspendidas, canceladas y reactivadas', filtro: 'Todos los estatus',
        campos: [
          ['LINIEA SUSPENDIDA', 'Línea suspendida', 'tel', true], ['COMPAÑIA', 'Compañía', 'select', false, ['TELCEL', 'TELCEL GPH', 'TELCEL FRO', 'AT&T', 'BAIT']],
          ['SIM', 'SIM', 'text'], ['CORREO / TICKET', 'Correo / ticket', 'text'], ['FECHA DE SUSPENSION', 'Fecha de suspensión', 'date'],
          ['ESTATUS', 'Estatus', 'select', true, ['ACTUALIZACIÓN DE LINEA TELEFONICA', 'CANCELADA', 'DISPONIBLE', 'EN USO', 'PROCESO DE CANCELACION']],
          ['ESTADO DEL EQUIPO', 'Estado del equipo', 'text'], ['IMEI', 'IMEI', 'text'], ['RETRO DE SOLICITUD', 'Retro de solicitud', 'text'],
          ['FECHA DE REACTIVACION', 'Fecha de reactivación', 'date'], ['NUEVO NUMERO', 'Nuevo número', 'tel'], ['COMENTARIOS', 'Comentarios', 'textarea'],
        ],
      },
      SOLICITUD: {
        resumen: ['FOLIO', 'FECHA DE SOLICITUD', 'NOMBRE SOLICITANTE', 'TIPO DE PLAN', 'ESTATUS'],
        titulo: 'Solicitud de Líneas', icono: 'clipboard-list', csv: 'solicitud de lineas',
        subtitulo: 'Solicitudes de asignación y reasignación de líneas telefónicas', filtro: 'Todos los estatus',
        campos: [
          ['FECHA DE SOLICITUD', 'Fecha de solicitud', 'date', true], ['TIPO DE PLAN', 'Tipo de plan', 'text', true], ['TICKET', 'Ticket', 'text'],
          ['NO EMPLEADO SOLICITANTE', 'Número de empleado del solicitante', 'text'],
          ['NOMBRE SOLICITANTE', 'Nombre completo del solicitante', 'text'], ['PUESTO SOLICITANTE', 'Puesto del solicitante', 'text'],
          ['DEPARTAMENTO SOLICITANTE', 'Departamento del solicitante', 'text'], ['SEDE', 'Sede', 'text'], ['DEPARTAMENTO', 'Departamento', 'text'],
          ['TIPO', 'Tipo', 'text'], ['PUESTO', 'Puesto', 'text'], ['COLABORADOR', 'Colaborador', 'text'], ['SOLICITANTE', 'Solicitante', 'text'],
          ['FECHA DE ENTREGA', 'Fecha de entrega', 'date'], ['ASIGNACION', 'Asignación', 'checkbox'], ['REASIGNACION', 'Reasignación', 'checkbox'],
          ['COMPAÑIA', 'Compañía', 'select', false, ['TELCEL', 'TELCEL GPH', 'TELCEL FRO', 'AT&T', 'BAIT']], ['EQUIPO', 'Equipo', 'text'],
          ['NUMERO ANTERIOR', 'Número anterior', 'tel'], ['NUMERO ACTUAL', 'Número actual', 'tel'], ['IMEI', 'IMEI', 'text'], ['SIM', 'SIM', 'text'],
          ['ESTATUS', 'Estatus', 'select', false, ['FINALIZADO', 'TRAMITE CANCELADO']], ['COMENTARIOS', 'Comentarios', 'textarea'],
        ],
      },
      POST_VENTA: {
        resumen: ['NUCO', 'NUMERO TELEFONO', 'RESPONSABLE', 'EQUIPO', 'ESTATUS LINEA'],
        titulo: 'Líneas Post Venta', icono: 'headset', csv: 'lineas post venta',
        subtitulo: 'Equipos y líneas asignados al departamento de Post Venta', filtro: 'Todos los tipos',
      },
    };

    function initOperativa(tipo) {
      const n = ++montaje;
      const cfg = OPERATIVAS[tipo];
      const raiz = document.getElementById('ln-operativa');
      const vigente = () => n === montaje && document.body.contains(raiz);
      let tabla = null;
      let filtrosOp = {};
      let marcarKpi = null;
      let solicitud = 0;
      let guardando = false;
      const modal = $('#ln-op-modal');

      $('#ln-op-titulo', raiz).textContent = cfg.titulo;
      $('#ln-op-subtitulo', raiz).textContent = cfg.subtitulo;
      $('#ln-op-titulo-icono', raiz).innerHTML = ico(cfg.icono);
      pintarIconos(raiz);
      refreshIcons();

      function cerrarAlta() {
        if (guardando) return;
        modal.hidden = true;
        $('#ln-op-alta-error').hidden = true;
      }

      function abrirAlta() {
        const hoy = new Date();
        const fechaHoy = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');
        $('#ln-op-modal-titulo').textContent = 'Nuevo registro · ' + cfg.titulo;
        $('#ln-op-campos').innerHTML = cfg.campos.map(([nombre, etiqueta, tipoCampo, requerido, opciones], indice) => {
          const idCampo = 'ln-op-campo-' + indice;
          const req = requerido ? ' required' : '';
          const valorInicial = tipoCampo === 'date' && /FECHA DE (SOLICITUD|ENTREGA)/.test(nombre) ? fechaHoy : '';
          let control;
          if (tipoCampo === 'select') {
            control = '<select name="' + esc(nombre) + '"' + req + '><option value="">Selecciona…</option>' +
              opciones.map((o) => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('') + '</select>';
          } else if (tipoCampo === 'textarea') {
            control = '<textarea name="' + esc(nombre) + '" rows="3"' + req + '></textarea>';
          } else if (tipoCampo === 'checkbox') {
            control = '<label class="ln-op-check"><input name="' + esc(nombre) + '" type="checkbox"> <span data-ln-icon="check"></span> Sí</label>';
          } else {
            control = '<input name="' + esc(nombre) + '" type="' + tipoCampo + '" value="' + valorInicial + '"' + req + '>';
          }
          control = control.replace(/<(input|select|textarea) /, '<$1 id="' + idCampo + '" ');
          return '<div class="field' + (tipoCampo === 'textarea' ? ' ln-op-campo-ancho' : '') + '"><label for="' + idCampo + '">' + esc(etiqueta) + (requerido ? ' *' : '') + '</label>' + control + '</div>';
        }).join('');
        $('#ln-op-alta-form').reset();
        $('#ln-op-campos').querySelectorAll('input[type="date"]').forEach((el) => {
          if (/FECHA DE (SOLICITUD|ENTREGA)/.test(el.name)) el.value = fechaHoy;
        });
        modal.hidden = false;
        pintarIconos(modal);
        const primero = modal.querySelector('input:not([type="checkbox"]), select, textarea');
        if (primero) primero.focus();
      }

      function cargar() {
        const turno = ++solicitud;
        if (tabla) tabla.setCargando(true);
        llamar('apiLineasVistaOperativaTabla', tipo, {}).then((texto) => {
          if (!vigente() || turno !== solicitud) return;
          const r = JSON.parse(texto);
          const campoGrupo = r.campoGrupo;
          if (!tabla) {
            // Títulos: las etiquetas del formulario de alta y, si no hay, el encabezado en formato de oración
            const titulos = { FOLIO: 'Folio', 'FECHA DE REGISTRO': 'Fecha de registro', 'QUIEN REGISTRO': 'Registró' };
            (cfg.campos || []).forEach(([nombre, etiqueta]) => { titulos[normEncabezado(nombre)] = etiqueta; });
            const columnas = columnasDeHoja(r.encabezados, r.filas, cfg.resumen, titulos);
            // El servidor agrupa en mayúsculas y sin espacios de más: la columna filtra con el mismo valor
            const colGrupo = columnas.find((c) => c.campo === campoGrupo);
            if (colGrupo) {
              colGrupo.tipo = 'lista';
              colGrupo.valor = (f) => String(f[campoGrupo] === null || f[campoGrupo] === undefined ? '' : f[campoGrupo]).trim().toUpperCase();
            }
            const campoFolio = r.encabezados.find((h) => /^FOLIO$/i.test(h)) || r.encabezados.find((h) => /NUCO|NUMERO/i.test(h));
            tabla = tablaLineas($('#ln-op-tabla', raiz), {
              idCampo: '_fila',
              idTabla: 'lineas-' + tipo.toLowerCase(),
              columnas: columnas,
              ordenInicial: campoFolio && /FOLIO/i.test(campoFolio) ? { campo: campoFolio, dir: 'desc' } : undefined,
              textoVacio: 'Sin registros',
              exportar: { nombreArchivo: cfg.titulo },
              etiquetaFila: (f) => (campoFolio && f[campoFolio] ? String(f[campoFolio]) : 'Registro'),
              detalle: { titulo: (f) => cfg.titulo + (campoFolio && f[campoFolio] ? ' · ' + f[campoFolio] : '') },
              ayuda: 'El ojo en Acciones muestra todos los campos del registro. "Columnas" agrega los que no se ven; la flecha de cada columna filtra y ordena.',
              alCambiarFiltros: (f) => { filtrosOp = f || {}; if (marcarKpi) marcarKpi(filtrosOp); },
            });
          }
          // KPIs: total y los estatus (o tipos) más frecuentes; clic = filtrar
          const grupos = r.grupos.slice().sort((a, b) => b.total - a.total).slice(0, 4);
          marcarKpi = tilesKpi($('#ln-op-kpis', raiz), [{ icono: cfg.icono, valor: miles(r.totalSinFiltro), etiqueta: 'Registros' }]
            .concat(grupos.map((g) => ({
              icono: /CANCEL|TRAMITE CANCELADO/.test(g.nombre) ? 'circle-x' : /FINALIZADO|EN USO|DISPONIBLE/.test(g.nombre) ? 'circle-check' : 'tag',
              clase: /CANCEL/.test(g.nombre) ? 'stat-tile-warn' : /FINALIZADO|EN USO|DISPONIBLE/.test(g.nombre) ? 'stat-tile-ok' : '',
              valor: miles(g.total), etiqueta: g.nombre === 'SIN ESTATUS' ? 'Sin estatus' : g.nombre,
              filtros: campoGrupo ? { [campoGrupo]: { valores: [g.nombre === 'SIN ESTATUS' ? '' : g.nombre] } } : false,
            }))), () => tabla);
          marcarKpi(filtrosOp);
          tabla.setDatos(r.filas);
        }).catch((e) => {
          if (!vigente() || turno !== solicitud) return;
          if (!tabla) {
            tabla = tablaLineas($('#ln-op-tabla', raiz), { idCampo: '_fila', columnas: [{ campo: '_fila', titulo: 'Fila' }], detalle: false, exportar: false });
          }
          tabla.setError('No se pudo cargar ' + cfg.titulo + ': ' + mensajeError(e));
        });
      }

      $('#ln-op-nuevo', raiz).addEventListener('click', abrirAlta);
      $('#ln-op-cerrar').addEventListener('click', cerrarAlta);
      $('#ln-op-cancelar').addEventListener('click', cerrarAlta);
      modal.addEventListener('click', (ev) => { if (ev.target === modal) cerrarAlta(); });
      $('#ln-op-alta-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        if (guardando) return;
        const datos = {};
        cfg.campos.forEach(([nombre, , tipoCampo]) => {
          const control = ev.currentTarget.elements.namedItem(nombre);
          datos[nombre] = tipoCampo === 'checkbox' ? control.checked : control.value.trim();
        });
        const guardar = $('#ln-op-guardar');
        guardando = true;
        const textoGuardar = guardar.innerHTML;
        guardar.innerHTML = '<span class="ln-spinner"></span> Guardando…';
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = true; });
        $('#ln-op-alta-error').hidden = true;
        llamar('apiLineasCrearVistaOperativa', tipo, datos).then((r) => {
          if (!vigente()) return;
          guardando = false;
          cerrarAlta();
          aviso(icono('circle-check') + ' Registro ' + esc(r.folio) + ' guardado correctamente.', 6000);
          cargar();
        }).catch((e) => {
          const box = $('#ln-op-alta-error');
          box.textContent = mensajeError(e);
          box.hidden = false;
        }).finally(() => {
          guardando = false;
          guardar.innerHTML = textoGuardar;
          modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = false; });
        });
      });
      if (cfg.campos) {
        cargarPermisos().then((p) => { if (vigente()) $('#ln-op-nuevo', raiz).hidden = !p.puedeOperar; });
      }
      cargar();
    }

    // ======================================================================
    // Bitácoras: Control de Cambios, Control de Reasignaciones, Bitácora de Desechos
    // ======================================================================

    const BITACORAS = {
      CAMBIOS: {
        titulo: 'Control de Cambios - Líneas', icono: 'file-pen-line', csv: 'control de cambios lineas',
        subtitulo: 'Bitácora de campos modificados en LINEAS TELEFONICAS (AppSheet y nuevo sistema)',
        idRegistro: 'ID_LINEA',
        columnas: [
          ['FECHA ACTUALIZACION', 'Fecha'], ['NUCO', 'NUCO'], ['CAMPO', 'Campo'], ['ANTES', 'Antes'], ['DESPUES', 'Después'],
          ['ACTUALIZADO POR', 'Actualizado por'], ['IMEI', 'IMEI'],
        ],
      },
      REASIGNACIONES: {
        titulo: 'Control de Reasignaciones - Líneas', icono: 'repeat', csv: 'control de reasignaciones lineas',
        subtitulo: 'Cambios de responsable de equipos y líneas',
        idRegistro: 'ID Linea',
        columnas: [
          ['Fecha de Reasignacion', 'Fecha'], ['NUCO', 'NUCO'],
          ['Responsable Saliente', 'Responsable saliente'], ['Departamento Saliente', 'Depto. saliente'],
          ['Responsable Entrante', 'Responsable entrante'], ['Departamento Entrante', 'Depto. entrante'],
          ['QUIEN REGISTRO', 'Registró'],
        ],
      },
      DESECHOS: {
        titulo: 'Bitácora de Desechos', icono: 'trash-2', csv: 'bitacora de desechos',
        subtitulo: 'Equipos dados de baja definitiva (folio DR)',
        idRegistro: 'ID_EQUIPO',
        columnas: [
          ['FOLIO DESECHO', 'Folio'], ['FECHA DE DESECHO', 'Fecha de desecho'], ['MOTIVO', 'Motivo'],
          ['LUGAR DE DESECHO', 'Lugar'], ['ESTADO', 'Estado'], ['QUIEN REGISTRO', 'Registró'], ['FECHA DE REGISTRO', 'Registrado'],
        ],
      },
    };

    function initBitacora(tipo) {
      const n = ++montaje;
      const cfg = BITACORAS[tipo];
      const raiz = document.getElementById('ln-bitacora');
      const vigente = () => n === montaje && document.body.contains(raiz);
      let solicitud = 0;
      let tabla = null;
      let filtrosBit = {};
      let marcarKpi = null;
      let busqueda = '';

      $('#ln-bit-titulo', raiz).textContent = cfg.titulo;
      $('#ln-bit-subtitulo', raiz).textContent = cfg.subtitulo;
      $('#ln-bit-titulo-icono', raiz).innerHTML = ico(cfg.icono);
      refreshIcons();

      const norm = normEncabezado;
      const buscarEncabezado = (encabezados, nombre) => encabezados.find((h) => norm(h) === norm(nombre));

      function crearTabla(r) {
        const titulos = {};
        cfg.columnas.forEach(([nombre, titulo]) => { titulos[norm(nombre)] = titulo; });
        const columnas = columnasDeHoja(r.encabezados, r.filas, cfg.columnas.map((c) => c[0]), titulos);
        const hId = buscarEncabezado(r.encabezados, cfg.idRegistro);
        const hFecha = buscarEncabezado(r.encabezados, cfg.columnas[0][0]);
        const hFolio = buscarEncabezado(r.encabezados, 'NUCO') || buscarEncabezado(r.encabezados, 'FOLIO DESECHO');
        tabla = tablaLineas($('#ln-bit-tabla', raiz), {
          idCampo: '_fila',
          idTabla: 'lineas-bitacora-' + tipo.toLowerCase(),
          columnas: columnas,
          ordenInicial: hFecha ? { campo: hFecha, dir: 'desc' } : undefined,
          textoVacio: 'Sin registros',
          exportar: { nombreArchivo: cfg.titulo },
          etiquetaFila: (f) => [hFolio && f[hFolio], hFecha && fechaTabla(f[hFecha])].filter(Boolean).join(' · ') || 'Registro',
          detalle: { titulo: (f) => cfg.titulo + (hFolio && f[hFolio] ? ' · ' + f[hFolio] : '') },
          accionesFila: hId ? [{ icono: 'smartphone', titulo: 'Ver activo', visible: (f) => !!f[hId], alHacer: (f) => irARegistro(f[hId]) }] : [],
          ayuda: 'Bitácora de solo lectura. El ojo abre todos los campos del registro y el celular abre la ficha del activo.',
          alCambiarFiltros: (f) => { filtrosBit = f || {}; if (marcarKpi) marcarKpi(filtrosBit); },
        });
        tabla.hFecha = hFecha;
      }

      function pintarKpis(r) {
        const hFecha = tabla && tabla.hFecha;
        const defs = [{ icono: cfg.icono, valor: miles(r.total), etiqueta: busqueda ? 'Coinciden con "' + busqueda + '"' : 'Registros en la hoja' }];
        if (r.filas.length < r.total) defs.push({ icono: 'layers', valor: miles(r.filas.length), etiqueta: 'Cargados (los más recientes)', filtros: false });
        if (hFecha) {
          defs.push({ icono: 'calendar-days', valor: miles(contarDesde(r.filas, hFecha, 29)), etiqueta: 'Últimos 30 días', filtros: { [hFecha]: { op: 'entre', v1: diaClave(29), v2: diaClave(0) } } });
          defs.push({ icono: 'clock', valor: miles(contarDesde(r.filas, hFecha, 0)), etiqueta: 'Hoy', clase: 'stat-tile-ok', filtros: { [hFecha]: { op: 'igual', v1: diaClave(0) } } });
        }
        marcarKpi = tilesKpi($('#ln-bit-kpis', raiz), defs, () => tabla);
        marcarKpi(filtrosBit);
      }

      function cargar() {
        const turno = ++solicitud;
        if (tabla) tabla.setCargando(true);
        llamar('apiLineasBitacoraTabla', tipo, { q: busqueda }).then((texto) => {
          if (!vigente() || turno !== solicitud) return;
          const r = JSON.parse(texto);
          if (!tabla) crearTabla(r);
          pintarKpis(r);
          tabla.setDatos(r.filas);
          // Si la hoja tiene más filas de las que se cargan, se ofrece buscar en todo el historial
          const form = $('#ln-bit-form', raiz);
          form.hidden = !busqueda && r.filas.length >= r.total;
          $('#ln-bit-limpiar', raiz).hidden = !busqueda;
          $('#ln-bit-aviso', raiz).textContent = busqueda
            ? miles(r.total) + ' coincidencia(s) en todo el historial' + (r.filas.length < r.total ? ' (se muestran las ' + miles(r.filas.length) + ' más recientes)' : '') + '.'
            : 'Se muestran los ' + miles(r.filas.length) + ' registros más recientes de ' + miles(r.total) + '.';
        }).catch((e) => {
          if (!vigente() || turno !== solicitud) return;
          if (!tabla) tabla = tablaLineas($('#ln-bit-tabla', raiz), { idCampo: '_fila', columnas: [{ campo: '_fila', titulo: 'Fila' }], detalle: false, exportar: false });
          tabla.setError('No se pudo cargar la bitácora: ' + mensajeError(e));
        });
      }

      $('#ln-bit-form', raiz).addEventListener('submit', (ev) => {
        ev.preventDefault();
        busqueda = $('#ln-bit-q', raiz).value.trim();
        cargar();
      });
      $('#ln-bit-limpiar', raiz).addEventListener('click', () => {
        $('#ln-bit-q', raiz).value = '';
        busqueda = '';
        cargar();
      });

      cargar();
    }

    return {
      initTelefonicas: initTelefonicas,
      initDetalles: initDetalles,
      initGestionActivos: initGestionActivos,
      initAccesoriosLineas: initAccesoriosLineas,
      initReactivacion: () => initOperativa('REACTIVACION'),
      initSolicitud: () => initOperativa('SOLICITUD'),
      initPostVenta: () => initOperativa('POST_VENTA'),
      initCambios: () => initBitacora('CAMBIOS'),
      initReasignaciones: () => initBitacora('REASIGNACIONES'),
      initDesechos: () => initBitacora('DESECHOS'),
      precargar: precargar,
    };
  })();
</script>
