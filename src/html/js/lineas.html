          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== tipo || pila[pila.length - 1].id !== id) return;
          detalle.innerHTML = migas() + '<div class="card"><p class="error-msg">No se pudo cargar: ' + mensajeError(e) + '</p></div>';
        });
      }

      /** Abre un registro sabiendo solo su ID (equipo si existe como equipo; si no, línea). */
      function abrirRegistro(id) {
        const esEquipo = memoria.indice.equipos.some((e) => e.id === id);
        abrir(esEquipo ? 'equipo' : 'linea', id);
      }

      function volver() {
        pila.pop();
        const anterior = pila[pila.length - 1];
        if (anterior) abrir(anterior.tipo, anterior.id, true);
        else cerrarDetalle();
      }

      function cerrarDetalle() {
        soltarHistorial();
        pila.length = 0;
        $('#ln-detalle', raiz).hidden = true;
        $('#ln-detalle', raiz).innerHTML = '';
        $('#ln-listado', raiz).hidden = false;
        // Refleja altas y ediciones hechas desde la ficha (el índice ya se recargó al guardar)
        if (memoria.indice) { pintarIndicadores(); pintarListado(); }
      }

      function migas() {
        const etiquetas = { equipo: 'Equipo', linea: 'Línea', inspeccion: 'Inspección' };
        return '<div class="ln-migas"><button type="button" class="secondary ln-btn-icono" data-ln-volver>' + icono('chevron-left') + ' Volver</button>' +
          '<span><a href="#" class="ln-enlace" data-ln-lista>Líneas Telefónicas</a>' +
          pila.map((p, i) => ' ' + icono('chevron-right', 'ln-icon-sm') + ' ' +
            (i < pila.length - 1 ? '<button type="button" class="ln-miga-enlace" data-ln-miga="' + i + '">' + esc(p.etiqueta || etiquetas[p.tipo]) + '</button>' :
              '<span aria-current="page">' + esc(p.etiqueta || etiquetas[p.tipo]) + '</span>')).join('') + '</span></div>';
      }

      function campos(pares) {
        return '<dl class="ln-campos">' + pares.filter(Boolean).map((p) =>
          '<dt>' + esc(p[0]) + '</dt><dd>' + (p[2] ? (p[1] || vacio) : guion(p[1])) + '</dd>').join('') + '</dl>';
      }

      function tarjeta(titulo, cuerpo, clase) {
        return '<div class="card ln-card ' + (clase || '') + '"><h3>' + titulo + '</h3>' + cuerpo + '</div>';
      }

      function tarjetaResponsable(r, titulo) {
        r = r || {};
        const adicionales = (r.usuariosAdicionales || []).length
          ? '<div class="ln-subtitulo">Usuarios adicionales</div>' + campos(r.usuariosAdicionales.map((u) => [u.rol, esc(u.nombre) + (u.puesto ? ' <span class="ln-tenue">· ' + esc(u.puesto) + '</span>' : ''), true]))
          : '';
        return tarjeta(icono('user') + ' ' + esc(titulo || 'Responsable'), campos([
          ['Nombre', (r.nombres && r.nombres.length > 1) ? r.nombres.map(esc).join('<br>') : esc(r.nombre || ''), true],
          r.codigoResguardo ? ['Código de resguardo', r.codigoResguardo] : null,
          ['No. empleado', r.noEmpleado],
          ['Puesto', r.puesto],
          ['Departamento', r.departamento],
          ['Área', r.area],
          ['Sede', r.sede],
          ['Oficina / desarrollo', r.oficina],
          ['Jefe directo', r.jefeDirecto],
          ['Director', r.director],
          ['Razón social', r.razonSocial],
        ]) + adicionales);
      }

      function tarjetaRegistro(l) {
        l = l || {};
        return tarjeta(icono('file-spreadsheet') + ' Registro en la hoja', campos([
          ['ID', l.id], ['Folio', l.folio], ['Tipo', l.tipo], ['Fila en hoja', l.fila],
          ['Estatus general', chip(l.estatusGeneral), true], ['Fecha registro', fecha(l.fechaRegistro)], ['Última inspección', fecha(l.fechaInspeccion)],
          ['Comentarios', l.comentarios],
        ]), 'ln-solo-escritorio');
      }

      /**
       * Encabezado de la ficha: qué es, su estado, las acciones y un resumen rápido con lo que más se
       * consulta (para revisar un equipo o línea sin bajar por la página).
       */
      function encabezado(ico, titulo, chips, botones, resumen) {
        const datos = (resumen || []).filter(Boolean);
        return '<div class="ln-detalle-header card">' +
          '<div class="ln-detalle-icono">' + icono(ico) + '</div>' +
          '<div class="ln-detalle-titulo"><h2>' + titulo + '</h2><div class="ln-chips">' + chips + '</div></div>' +
          '<div class="ln-detalle-botones">' + (botones || '') + '</div>' +
          (datos.length ? '<dl class="ln-resumen-rapido">' + datos.map((d) => '<div><dt>' + esc(d[0]) + '</dt><dd>' + (d[2] ? (d[1] || vacio) : guion(d[1])) + '</dd></div>').join('') + '</dl>' : '') +
          '</div>';
      }

      /**
       * Ficha en pestañas: General (datos), Detalles (texto para copiar), Documentos (inspecciones y
       * responsivas) e Historial. Lo esencial queda arriba y el resto a un toque, en vez de una página larguísima.
       */
      function fichaEnPestanas(general, detalles, conDocumentos) {
        const pestanas = [['general', 'General', 'layout-grid'], ['detalles', 'Detalles', 'clipboard-list'],
          conDocumentos ? ['documentos', 'Documentos', 'folder-check'] : null, ['historial', 'Historial', 'history']].filter(Boolean);
        const cargando = '<div class="card ln-card"><p class="ln-tenue"><span class="ln-spinner"></span> Cargando…</p></div>';
        return '<div class="tabs-simple ln-ficha-tabs" role="tablist" aria-label="Secciones de la ficha">' + pestanas.map((t, n) =>
          '<button type="button" class="tab-btn' + (n ? '' : ' active') + '" role="tab" aria-selected="' + (n ? 'false' : 'true') + '" data-ficha-tab="' + t[0] + '">' +
          icono(t[2]) + ' ' + t[1] + ' <span class="ln-tab-num" data-ficha-num="' + t[0] + '"></span></button>').join('') + '</div>' +
          '<div data-ficha-panel="general">' + general + '</div>' +
          '<div data-ficha-panel="detalles" hidden>' + detalles + '</div>' +
          (conDocumentos ? '<div data-ficha-panel="documentos" hidden><div id="ln-evidencias">' + cargando + '</div></div>' : '') +
          '<div data-ficha-panel="historial" hidden><div id="ln-historial">' + cargando + '</div></div>';
      }

      function mostrarPestanaFicha(nombre) {
        raiz.querySelectorAll('[data-ficha-tab]').forEach((b) => {
          const activa = b.dataset.fichaTab === nombre;
          b.classList.toggle('active', activa);
          b.setAttribute('aria-selected', String(activa));
        });
        raiz.querySelectorAll('[data-ficha-panel]').forEach((p) => { p.hidden = p.dataset.fichaPanel !== nombre; });
        if (nombre === 'historial' && tablaHistorial) tablaHistorial.ajustarAlto();
      }

      function contarEnPestana(nombre, n) {
        const el = raiz.querySelector('[data-ficha-num="' + nombre + '"]');
        if (el) el.textContent = miles(n);
      }

      function pintarEquipo(detalle, id) {
        return llamar('apiLineasEquipo', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'equipo' || pila[pila.length - 1].id !== id) return;
          const e = r.equipo;
          const l = r.linea;
          const costo = l && l.costoPlan !== null && l.costoPlan !== undefined ? '$' + Number(l.costoPlan).toLocaleString('es-MX') : null;
          const puedeOperar = memoria.permisos && memoria.permisos.puedeOperar;
          pila[pila.length - 1].etiqueta = 'NUCO ' + (e.nuco || '—');
          const resp = e.responsable || {};
          fichaActual = { id: id, titulo: 'NUCO ' + (e.nuco || '—'), estatusEquipo: e.estatus || '', estatusLinea: l ? (l.estatus || '') : null };
          detalle.innerHTML = migas() +
            encabezado('smartphone', 'NUCO ' + esc(e.nuco || '—'),
              chip(e.estatus) + chip(TIPO_EQUIPO[e.tipo] || e.tipo, 'neutro') + (l ? chip('Con línea', 'verde') + usoTemporalVencido(l) : chip('Sin línea', 'ambar')),
              (puedeOperar ? botonesFicha('data-equipo-id', id) : '') +
              (e.carpetaDriveId ? enlaceDrive(e.carpetaDriveId, 'Ver carpeta en Drive') : ''),
              [['Responsable', resp.nombre], ['Modelo', e.modelo], ['IMEI', e.imei],
                ['Línea', l ? '<a href="#" class="ln-enlace ln-mono" data-ln-ir="linea" data-id="' + esc(l._id) + '">' + esc(l.numero || '(sin número)') + '</a>' + (l.compania ? ' · ' + esc(l.compania) : '') : '<span class="ln-tenue">Sin línea</span>', true],
                ['Departamento', resp.departamento]]) +
            fichaEnPestanas(
              (e._secretosVisibles ? '' : '<div class="ln-nota">' + icono('lock') + ' Los PIN, patrones y contraseñas están ocultos para tu rol.</div>') +
            '<div class="ln-grid-2">' +
              tarjeta(icono('smartphone') + ' Equipo', campos([
                ['Modelo', e.modelo], ['IMEI', e.imei], ['Color', e.color], ['Accesorios', (e.accesorios || []).join(', ')],
                e.tipo !== 'MODEM' && e.tipo !== 'BANDA_ANCHA' && e.tipo !== 'CAMARA' ? ['Cuenta Google', e.cuentaGoogle] : null,
                e.tipo === 'CELULAR' || e.tipo === 'CELULAR_BASICO' ? ['PIN equipo', e.pinEquipo] : null,
                e.tipo === 'CELULAR' || e.tipo === 'CELULAR_BASICO' ? ['Patrón', e.patronRuta] : null,
                e.tipo === 'MODEM' || e.tipo === 'BANDA_ANCHA' ? ['Contraseña módem', e.contrasenaModem] : null,
                e.simResidual ? ['SIM residual', chip(e.simResidual, 'ambar'), true] : null,
              ])) +
              tarjeta(icono('card-sim') + ' Línea asignada', l ? campos([
                ['Número', '<a href="#" class="ln-enlace ln-mono ln-accion-enlace" data-ln-ir="linea" data-id="' + esc(l._id) + '">' + icono('phone') + ' ' + esc(l.numero || '(sin número)') + ' ' + icono('chevron-right') + '</a>', true],
                ['Compañía', l.compania], ['Estatus', chip(l.estatus), true], ['SIM', l.sim], ['PIN WhatsApp', l.pinWhatsapp],
                ['Costo plan', costo], ['Plan', [fecha(l.inicioPlan), fecha(l.finPlan)].filter(Boolean).join(' → ')],
              ]) : '<p class="empty-state">Este equipo no tiene línea asignada.</p>') +
              tarjetaResponsable(e.responsable) +
              tarjetaRegistro(e.legado) +
            '</div>', tarjetaDetallesCopiar(r.detalles), true);
          cargarEvidencias(id);
          cargarHistorial(id, 'NUCO ' + (e.nuco || id));
        });
      }

      function pintarLinea(detalle, id) {
        return llamar('apiLineasLinea', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'linea' || pila[pila.length - 1].id !== id) return;
          const l = r.linea;
          const e = r.equipo;
          const costo = l.costoPlan !== null && l.costoPlan !== undefined ? '$' + Number(l.costoPlan).toLocaleString('es-MX') : null;
          const puedeOperarLinea = !e && memoria.permisos && memoria.permisos.puedeOperar;
          pila[pila.length - 1].etiqueta = e ? 'NUCO ' + (e.nuco || '—') : 'Línea ' + (l.numero || '—');
          const respL = (e ? e.responsable : l.responsable) || {};
          fichaActual = { id: id, titulo: 'Línea ' + (l.numero || '—'), estatusEquipo: null, estatusLinea: l.estatus || '' };
          detalle.innerHTML = migas() +
            encabezado('card-sim', esc(l.numero || 'Línea sin número'), chip(l.estatus) + usoTemporalVencido(l) + (e ? chip('En NUCO ' + (e.nuco || '—'), 'neutro') : chip('Suelta', 'ambar')),
              puedeOperarLinea ? botonesFicha('data-linea-id', id) : (e ? '<button type="button" class="ln-btn-icono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' Ver equipo</button>' : ''),
              [['Responsable', respL.nombre], ['Compañía', l.compania], ['SIM', l.sim], ['Fin de plan', fecha(l.finPlan)],
                ['Equipo', e ? '<a href="#" class="ln-enlace ln-mono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">NUCO ' + esc(e.nuco || '—') + '</a>' + (e.modelo ? ' · ' + esc(e.modelo) : '') : '<span class="ln-tenue">Suelta</span>', true]]) +
            fichaEnPestanas(
            '<div class="ln-grid-2">' +
              tarjeta(icono('card-sim') + ' Línea', campos([
                ['Compañía', l.compania], ['SIM', l.sim], ['PIN WhatsApp', l.pinWhatsapp], ['Razón social', l.razonSocial],
                ['Costo plan', costo], ['Inicio plan', fecha(l.inicioPlan)], ['Fin plan', fecha(l.finPlan)],
                l.usoTemporal ? ['Uso temporal', 'Desde ' + esc(fecha(l.usoTemporal.desde) || '—') + ' · ' + esc(l.usoTemporal.correo || ''), true] : null,
                !e && l.nucoLegado ? ['NUCO (anterior)', l.nucoLegado] : null,
              ])) +
              tarjeta(icono('smartphone') + ' Equipo', e ? campos([
                ['NUCO', '<a href="#" class="ln-enlace ln-mono ln-accion-enlace" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' ' + esc(e.nuco || '—') + ' ' + icono('chevron-right') + '</a>', true],
                ['Tipo', TIPO_EQUIPO[e.tipo] || e.tipo], ['Modelo', e.modelo], ['IMEI', e.imei], ['Estatus', chip(e.estatus), true],
              ]) : '<p class="empty-state">Línea suelta: no está instalada en un equipo de la empresa.</p>') +
              tarjetaResponsable(e ? e.responsable : l.responsable, e ? 'Responsable (del equipo)' : 'Responsable') +
              tarjetaRegistro(l.legado) +
            '</div>', tarjetaDetallesCopiar(r.detalles), !e);
          if (!e) cargarEvidencias(id);
          cargarHistorial(id, e ? 'NUCO ' + (e.nuco || id) : 'Linea ' + (l.numero || id));
        });
      }

      /** Regla ESTATUS TEMPORAL del AppSheet: USO TEMPORAL con 13 días o más desde FECHA CAMBIO TEMPORAL (rojo, triángulo). */
      function usoTemporalVencido(l) {
        const desde = l && l.usoTemporal && l.usoTemporal.desde ? new Date(l.usoTemporal.desde) : null;
        if (!desde || isNaN(desde) || (Date.now() - desde.getTime()) / 3600000 < 13 * 24) return '';
        return '<span class="ln-regla ln-regla-chip" style="color:#F80000;font-weight:700;background:color-mix(in srgb, #F80000 12%, transparent);border:1px solid color-mix(in srgb, #F80000 45%, transparent)">' +
          ico('triangle-alert') + ' Uso temporal de ' + Math.floor((Date.now() - desde.getTime()) / 86400000) + ' días</span>';
      }

      /** Acciones de la ficha: botones principales (con color) para que se reconozcan como botones. */
      function botonesFicha(atributoRef, id) {
        return '<button type="button" class="ln-btn-icono" data-ln-editar="' + esc(id) + '">' + icono('pencil') + ' Editar información</button>' +
          '<button type="button" class="ln-btn-icono" data-ln-estatus="' + esc(id) + '">' + icono('toggle-right') + ' Cambiar estatus</button>' +
          '<button type="button" class="ln-btn-icono" data-ln-captura="INSPECCION" ' + atributoRef + '="' + esc(id) + '">' + icono('clipboard-check') + ' Nueva inspección</button>' +
          '<button type="button" class="ln-btn-icono" data-ln-captura="RESPONSIVA" ' + atributoRef + '="' + esc(id) + '">' + icono('signature') + ' Nueva responsiva</button>';
      }

      // ---- Detalles: la columna DETALLES LINEAS TELEFONICAS del AppSheet, con botón para copiarla ----
      // Mismo texto y orden que copiaban del módulo "Detalles Líneas Telefónicas". AppSheet deja en blanco
      // motivo, ticket y estatus actual para llenarlos al pegar; aquí se escriben antes de copiar (no se guardan)
      // y el estatus actual se propone con ESTATUS LINEA.
      function textoDetalles() {
        const d = detallesFicha || {};
        const caja = $('[data-ln-copiar]', raiz);
        const escrito = (campo) => (caja ? caja.querySelector('[data-ln-copiar-campo="' + campo + '"]').value.trim() : '');
        const valor = (v) => (v === null || v === undefined ? '' : (esFechaIso(v) ? fechaTabla(v) : String(v)));
        return 'NUCO ' + valor(d.nuco) + '\n-------------------------------------------------------\n' +
          'Motivo de resguardo: ' + escrito('motivo') + '\n' +
          'Ticket / Asunto: ' + escrito('ticket') + '\n' +
          'Código de resguardo: ' + valor(d.responsable) + '\n' +
          'IMEI: ' + valor(d.imei) + '\n' +
          'SIM: ' + valor(d.sim) + '\n' +
          'Número: ' + valor(d.numero) + '\n' +
          'Modelo: ' + valor(d.modelo) + '\n' +
          'Compañía: ' + valor(d.compania) + '\n' +
          'Razón Social: ' + valor(d.razonSocial) + '\n' +
          'Estatus de adendum: ' + valor(d.finPlan) + '\n' +
          'Estatus actual de la línea: ' + escrito('estatus');
      }
      function pintarTextoDetalles() {
        const pre = $('[data-ln-copiar-texto]', raiz);
        if (pre) pre.textContent = textoDetalles();
      }
      function tarjetaDetallesCopiar(d) {
        detallesFicha = d || null;
        if (!d) return '';
        const valor = (v) => (v === null || v === undefined ? '' : (esFechaIso(v) ? fechaTabla(v) : String(v)));
        const entrada = (clave, v, ayuda) => '<input type="text" class="ln-detalle-entrada" data-ln-copiar-campo="' + clave + '" value="' + esc(v || '') + '" autocomplete="off" placeholder="' + esc(ayuda) + '">';
        // Mismo diseño que General (etiqueta · valor); al copiar sale el texto del AppSheet (textoDetalles)
        return '<div class="card ln-card ln-copiar" data-ln-copiar data-respetar-texto>' +
          '<div class="ln-copiar-cabecera"><h3>' + icono('clipboard-list') + ' Detalles</h3>' +
          '<button type="button" class="ln-btn-icono" data-ln-copiar-detalles>' + icono('copy') + ' Copiar detalles</button></div>' +
          campos([
            ['NUCO', valor(d.nuco)],
            ['Motivo de resguardo', entrada('motivo', '', 'Escribe el motivo'), true],
            ['Ticket / Asunto', entrada('ticket', '', 'Escribe el ticket o asunto'), true],
            ['Código de resguardo', valor(d.responsable)],
            ['IMEI', valor(d.imei)],
            ['SIM', valor(d.sim)],
            ['Número', valor(d.numero)],
            ['Modelo', valor(d.modelo)],
            ['Compañía', valor(d.compania)],
            ['Razón Social', valor(d.razonSocial)],
            ['Estatus de adendum', valor(d.finPlan)],
            ['Estatus actual de la línea', entrada('estatus', d.estatusLinea, 'Escribe el estatus'), true],
          ]) + '</div>';
      }
      function copiarDetalles(boton) {
        copiarTexto(textoDetalles()).then((ok) => {
          if (!ok) { aviso(icono('triangle-alert', 'ln-alerta') + ' El navegador no permitió copiar. Selecciona el texto y cópialo con Ctrl+C.', 8000); return; }
          aviso('Detalles copiados: pégalos en el ticket o correo.', 4000);
          const original = boton.innerHTML;
          boton.innerHTML = icono('check') + ' Copiado';
          setTimeout(() => { if (document.body.contains(boton)) boton.innerHTML = original; }, 1800);
        });
      }

      function cargarEvidencias(id) {
        const pila0 = pila.length;
        llamar('apiLineasEvidencias', id).then((ev) => {
          const cont = $('#ln-evidencias', raiz);
          if (!vigente() || !cont || pila.length !== pila0) return;
          cont.innerHTML = tarjetaEvidencias(ev.inspecciones || [], ev.responsivas || []);
        }).catch((e) => {
          const cont = $('#ln-evidencias', raiz);
          if (cont) cont.innerHTML = tarjeta(icono('clipboard-check') + ' Inspecciones y responsivas', '<p class="error-msg">' + mensajeError(e) + '</p>');
        });
      }

      function accionPdf(d, tipo) {
        if (d.pdfId) return enlaceDrive(d.pdfId, 'Ver PDF', true);
        return d.pdfPendiente ? '<button type="button" class="ln-btn-icono" data-ln-pdf="' + tipo + '" data-id="' + esc(d.id) + '" data-carpeta="' + esc(d.carpetaId || '') + '">' + icono('file-text') + ' Generar PDF</button>' : vacio;
      }

      /** Inspecciones y responsivas como lista: fecha y tipo arriba, datos en una línea y acciones a la derecha. */
      function tarjetaEvidencias(inspecciones, responsivas) {
        const item = (ico, titulo, chips, datos, acciones, ir) => '<li class="ln-doc' + (ir ? ' ln-fila-clic' : '') + '"' + (ir ? ' data-ln-ir="inspeccion" data-id="' + esc(ir) + '"' : '') + '>' +
          '<span class="ln-doc-icono">' + icono(ico) + '</span>' +
          '<div class="ln-doc-cuerpo"><div class="ln-doc-titulo"><b>' + titulo + '</b>' + chips + '</div>' +
          '<div class="ln-doc-datos">' + datos.filter(Boolean).map(esc).join(' · ') + '</div></div>' +
          '<div class="ln-doc-acciones">' + acciones + '</div></li>';
        const listaInsp = inspecciones.length
          ? '<ul class="ln-docs">' + inspecciones.map((i) => item('clipboard-check', esc(fecha(i.fecha) || 'Sin fecha'),
              (ORIGEN[i.origen] || '') + (i.calificacion !== null && i.calificacion !== undefined ? chip(porcentaje(i.calificacion), 'neutro') : ''),
              [i.responsable, i.inspector ? 'Inspector: ' + i.inspector : '', i.fotos ? i.fotos + ' foto(s)' : ''],
              '<button type="button" class="ln-btn-icono" data-ln-ir="inspeccion" data-id="' + esc(i.id) + '">' + icono('eye') + ' Ver</button>' + accionPdf(i, 'INSPECCION').replace(vacio, ''),
              i.id)).join('') + '</ul>'
          : '<p class="empty-state">Sin inspecciones registradas.</p>';
        const listaResp = responsivas.length
          ? '<ul class="ln-docs">' + responsivas.map((r) => item('signature', esc(fecha(r.fecha) || 'Sin fecha'), ORIGEN[r.origen] || '',
              [r.responsable],
              accionPdf(r, 'RESPONSIVA').replace(vacio, '') + (r.carpetaId ? enlaceDrive(r.carpetaId, 'Carpeta') : ''))).join('') + '</ul>'
          : '<p class="empty-state">Sin responsivas registradas.</p>';
        contarEnPestana('documentos', inspecciones.length + responsivas.length);
        return tarjeta(icono('clipboard-check') + ' Inspecciones (' + inspecciones.length + ')', listaInsp) + tarjeta(icono('signature') + ' Responsivas (' + responsivas.length + ')', listaResp);
      }

      /**
       * Cambio rápido de ESTATUS EQUIPO / ESTATUS LINEA (mejora: sin abrir todo el formulario). Usa las listas
       * del AppSheet y deja la bitácora igual que una edición; el motivo queda en el historial.
       */
      function abrirCambioEstatus() {
        const f = fichaActual;
        if (!f) return;
        $('#ln-modal-captura', raiz).hidden = false;
        $('#ln-captura-icono', raiz).innerHTML = icono('toggle-right');
        $('#ln-captura-tipo', raiz).textContent = 'LINEAS TELEFONICAS';
        $('#ln-captura-titulo', raiz).textContent = 'Cambiar estatus';
        $('#ln-captura-subtitulo', raiz).textContent = f.titulo + ' · el cambio queda en la bitácora';
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        cuerpo.innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        const sesion = captura = { tipo: 'ESTATUS', firmas: {} };
        cargarCatalogos().then((cat) => {
          if (captura !== sesion) return;
          const lista = (clave, etiqueta, opciones, actual) => {
            const fuera = actual && opciones.indexOf(actual) < 0;
            return '<div class="field ln-af-campo"><label for="ln-estatus-' + clave + '">' + esc(etiqueta) + '</label><select id="ln-estatus-' + clave + '" data-estatus="' + clave + '">' +
              (fuera ? '<option value="" selected>' + esc(actual) + ' (actual, no está en la lista)</option>' : '') +
              opciones.map((o) => '<option value="' + esc(o) + '"' + (o === actual ? ' selected' : '') + '>' + esc(o) + (o === actual ? ' (actual)' : '') + '</option>').join('') + '</select></div>';
          };
          cuerpo.innerHTML = '<section class="ln-af-seccion"><div class="ln-af-grid ln-estatus-grid">' +
            (f.estatusEquipo !== null ? lista('equipo', 'ESTATUS DEL EQUIPO', cat.estatusEquipo || [], f.estatusEquipo) : '') +
            (f.estatusLinea !== null ? lista('linea', 'ESTATUS DE LA LÍNEA', cat.estatusLinea || [], f.estatusLinea) : '') +
            '</div><div class="field ln-af-campo"><label for="ln-estatus-motivo">MOTIVO (opcional)</label>' +
            '<textarea id="ln-estatus-motivo" rows="3" placeholder="Por qué cambia; queda en el historial"></textarea></div></section>' +
            '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div><div class="ln-captura-acciones"><button type="button" class="secondary" data-cerrar-modal>Cancelar</button>' +
            '<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('circle-check') + ' Guardar cambios</button></div>';
          $('#cap-guardar', raiz).addEventListener('click', () => {
            const elegido = (clave, actual) => {
              const sel = cuerpo.querySelector('[data-estatus="' + clave + '"]');
              return sel && sel.value && sel.value !== actual ? sel.value : '';
            };
            const datos = { estatusEquipo: elegido('equipo', f.estatusEquipo), estatusLinea: elegido('linea', f.estatusLinea), motivo: $('#ln-estatus-motivo', raiz).value };
            if (!datos.estatusEquipo && !datos.estatusLinea) { mostrarErrorCaptura('Elige un estatus diferente al actual.'); return; }
            estadoGuardado('Guardando estatus');
            llamar('apiLineasCambiarEstatus', f.id, datos).then(() => cargarIndice(true)).then(() => {
              cerrarCaptura(true);
              aviso('Estatus actualizado.', 5000);
              const actual = pila[pila.length - 1];
              if (actual) abrir(actual.tipo, actual.id, true);
            }).catch((e) => { mostrarErrorCaptura(mensajeError(e)); restaurarGuardado(); });
          });
        }).catch((e) => { cuerpo.innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>'; });
      }

      // ---- Alta y edición directa del inventario ----
      function abrirEditor(id) {
        $('#ln-modal-captura', raiz).hidden = false;
        $('#ln-captura-icono', raiz).innerHTML = icono(id ? 'pencil' : 'plus');
        $('#ln-captura-tipo', raiz).textContent = 'LINEAS TELEFONICAS';
        $('#ln-captura-titulo', raiz).textContent = id ? 'Editar información' : 'Registrar NUCO';
        $('#ln-captura-subtitulo', raiz).textContent = 'Cargando formulario…';
        $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        captura = { tipo: 'REGISTRO', idObjetivo: id, firmas: {} };
        llamar('apiLineasFormularioRegistro', id || '').then((form) => {
          if (!captura || captura.tipo !== 'REGISTRO') return;
          const cuerpo = $('#ln-captura-cuerpo', raiz);
          const elementos = form.elementos;
          const tipoInicial = (elementos.filter((e) => e.columna === 'TIPO')[0] || {}).valor || '';
          const ctx = { nuevo: form.nuevo, id: id, tipoInicial: tipoInicial };
          captura.contexto = { formulario: elementos };
          const valorDe = (c) => ((elementos.filter((e) => e.columna === c)[0] || {}).valor) || '';
          $('#ln-captura-subtitulo', raiz).textContent = id ? ['NUCO ' + (valorDe('NUCO') || '—'), valorDe('EQUIPO'), valorDe('RESPONSABLE')].filter(Boolean).join(' · ') + ' · cada cambio queda en la bitácora'
            : 'Elige primero el TIPO: los campos se habilitan según él, igual que en AppSheet.';
          // Alta: paso por paso. Edición: se salta a cualquier sección y se guarda desde cualquiera.
          cuerpo.innerHTML = htmlPasosAppSheet(elementos, PASOS_FORMULARIO.REGISTRO) +
            '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div>' +
            htmlAccionesPasos('<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('circle-check') + (id ? ' Guardar cambios' : ' Registrar') + '</button>');
          pintarIconos(cuerpo);
          activarCombosEn(cuerpo, elementos);
          const patron = elementos.filter((e) => e.control === 'patron')[0];
          if (patron) {
            captura.patronInicial = esPuntosPatron(patron.valor) ? patron.valor : null;
            captura.controlPatron = activarPatron('af-' + patron.columna.replace(/[^A-Za-z0-9]+/g, '-') + '-patron', captura.patronInicial ? captura.patronInicial.split('-') : []);
          }
          const aplicar = () => aplicarReglasEn(cuerpo, elementos, ctx);
          cuerpo.addEventListener('input', aplicar);
          cuerpo.addEventListener('change', aplicar);
          cuerpo.addEventListener('click', (ev) => {
            const multi = ev.target.closest('.ln-pastilla-multi');
            if (multi) { ev.stopPropagation(); multi.classList.toggle('activa'); aplicar(); return; }
            if (ev.target.closest('.ln-pastilla')) setTimeout(aplicar, 0);
          }, true);
          aplicar();
          const conCorto = (lista) => lista.map((x) => ({ columna: x.columna, msg: x.corto }));
          captura.reaplicar = aplicar; // al reactivar tras un error, los campos no editables vuelven a bloquearse
          const pasos = captura.pasos = activarPasos(cuerpo, {
            atras: cuerpo.querySelector('[data-paso-atras]'), siguiente: cuerpo.querySelector('[data-paso-siguiente]'),
            guardar: $('#cap-guardar', raiz), cuenta: cuerpo.querySelector('.form-cuenta'), libre: !!id,
            validar: (seccion) => {
              const errores = erroresFormularioEn(cuerpo, elementos, '', ctx).filter((x) => seccion.querySelector('[data-af-columna="' + CSS.escape(x.columna) + '"]'));
              marcarErroresEn(cuerpo, conCorto(errores));
              $('#cap-error', raiz).hidden = true;
              return errores;
            },
          });
          $('#cap-guardar', raiz).addEventListener('click', () => {
            $('#cap-error', raiz).hidden = true;
            const errores = erroresFormularioEn(cuerpo, elementos, '', ctx);
            if (errores.length) {
              pasos.irAlCampo(errores[0].columna);
              marcarErroresEn(cuerpo, conCorto(errores));
              mostrarErrorCaptura(errores.map((x) => x.msg).slice(0, 4).join(' · ') + (errores.length > 4 ? '…' : ''), null);
              return;
            }
            const valores = leerFormularioEn(cuerpo, elementos);
            if (patron) {
              const p = patronParaGuardar();
              if (p === undefined) delete valores[patron.columna]; else valores[patron.columna] = p;
            }
            leerArchivosEn(cuerpo).then((archivos) => {
              estadoGuardado(id ? 'Guardando cambios' : 'Creando registro');
              const datos = { valores: valores, archivos: archivos };
              return (id ? llamar('apiLineasEditarRegistro', id, datos) : llamar('apiLineasCrearRegistro', datos)).then((r) => cargarIndice(true).then(() => {
                cerrarCaptura(true);
                aviso(icono('circle-check') + ' ' + (id ? 'Información actualizada.' : 'Registro creado.'), 6000);
                abrirRegistro(id || r.id);
              }));
            }).catch((e) => { mostrarErrorCaptura(mensajeError(e)); restaurarGuardado(); });
          });
        }).catch((e) => { $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>'; });
      }

      // ---- Captura: inspección y responsiva nuevas ----

      function cerrarCaptura(guardada) {
        if (captura && captura.guardando && !guardada) return;
        const borrador = captura;
        $('#ln-modal-captura', raiz).hidden = true;
        $('#ln-captura-cuerpo', raiz).innerHTML = '';
        captura = null;
        if (!guardada && borrador && !borrador.guardada && borrador.carpetaId) {
          llamar('apiLineasCancelarEvidencia', borrador.carpetaId, borrador.fotosCarpetaId)
            .catch((e) => aviso(icono('triangle-alert', 'ln-alerta') + ' No se pudo limpiar la carpeta cancelada: ' + mensajeError(e), 9000));
        }
      }

      function seccionCaptura(numero, ico, titulo, ayuda, contenido) {
        return '<section class="ln-form-seccion"><div class="ln-form-seccion-cabecera"><span class="ln-form-seccion-num">' + numero + '</span><div>' +
          '<h3>' + icono(ico) + ' ' + esc(titulo) + '</h3><p>' + esc(ayuda) + '</p></div></div>' +
          '<div class="ln-form-seccion-contenido">' + contenido + '</div></section>';
      }

      /** Valores actuales del formulario, por columna del AppSheet. */
      function leerFormularioAppSheet() {
        return leerFormularioEn($('#ln-captura-cuerpo', raiz), captura && captura.contexto ? captura.contexto.formulario : []);
      }

      function tipoFormulario() {
        const el = raiz.querySelector('#ln-captura-cuerpo [data-columna="TIPO"]');
        return el ? el.value : (captura && captura.tipoFijo) || '';
      }

      /** Show_If / Required_If en vivo y la CALIFICACION calculada. */
      function actualizarFormularioAppSheet() {
        if (!captura) return;
        const tipo = tipoFormulario();
        raiz.querySelectorAll('#ln-captura-cuerpo .ln-af-campo').forEach((campo) => {
          const visible = cumpleCondicion(campo.dataset.mostrar, tipo);
          campo.hidden = !visible;
          campo.querySelector('.ln-af-req').hidden = !(visible && cumpleCondicion(campo.dataset.requerido, tipo));
        });
        raiz.querySelectorAll('#ln-captura-cuerpo .ln-af-seccion:not(.ln-af-extra)').forEach((sec) => {
          sec.hidden = !sec.querySelector('.ln-af-campo:not([hidden])');
        });
        const calif = $('#af-CALIFICACION', raiz);
        if (calif) calif.textContent = (calificacionAppSheet(leerFormularioAppSheet()) * 100).toFixed(2) + '%';
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        aplicarBloqueo(cuerpo, false);
        // El nombre de quien firma va debajo de su firma
        Object.keys(captura.firmas || {}).forEach((col) => {
          const f = captura.firmas[col];
          const origen = NOMBRE_DE_FIRMA[col] && cuerpo.querySelector('[data-columna="' + CSS.escape(NOMBRE_DE_FIRMA[col]) + '"]');
          if (f && f.setNombre && origen) f.setNombre(origen.value);
        });
      }
      const actualizarProgresoChecklist = actualizarFormularioAppSheet;

      /** Obligatorios visibles vacíos (misma regla que el servidor). */
      function faltantesFormularioAppSheet() {
        const tipo = tipoFormulario();
        const valores = leerFormularioAppSheet();
        const faltan = [];
        (captura.contexto.formulario || []).forEach((e) => {
          if (e.tipo !== 'campo' || e.soloLectura || e.control === 'calculado' || e.valorOculto || e.virtual) return;
          if (!cumpleCondicion(e.mostrar, tipo) || !cumpleCondicion(e.requerido, tipo)) return;
          if (e.control === 'firma') {
            const f = captura.firmas[e.columna];
            if (!f || f.estaVacia()) faltan.push(e);
            return;
          }
          if (e.control === 'patron') return;
          if (!valores[e.columna]) faltan.push(e);
        });
        return faltan;
      }

      function iniciarFormularioAppSheet() {
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        (captura.contexto.formulario || []).forEach((e) => {
          if (e.tipo !== 'campo') return;
          const id = 'af-' + e.columna.replace(/[^A-Za-z0-9]+/g, '-');
          if (e.control === 'firma') {
            const origen = NOMBRE_DE_FIRMA[e.columna] && cuerpo.querySelector('[data-columna="' + CSS.escape(NOMBRE_DE_FIRMA[e.columna]) + '"]');
            captura.firmas[e.columna] = crearFirma(document.getElementById(id + '-firma'), origen ? origen.value : '');
          }
          if (e.control === 'patron') {
            captura.columnaPatron = e.columna;
            captura.patronInicial = esPuntosPatron(e.valor) ? e.valor : null;
            captura.controlPatron = activarPatron(id + '-patron', captura.patronInicial ? captura.patronInicial.split('-') : []);
          }
        });
        activarCombosEn(cuerpo, captura.contexto.formulario);
        cuerpo.addEventListener('change', (ev) => { if (ev.target.matches('[data-columna="_BLOQUEO"]')) aplicarBloqueo(cuerpo, true); });
        cuerpo.addEventListener('input', (ev) => { if (ev.target.matches('[data-columna]')) actualizarFormularioAppSheet(); });
        cuerpo.addEventListener('change', (ev) => { if (ev.target.matches('[data-columna]')) actualizarFormularioAppSheet(); });
        actualizarFormularioAppSheet();
        if (cuerpo.querySelector('.form-paso')) {
          captura.pasos = activarPasos(cuerpo, {
            atras: cuerpo.querySelector('[data-paso-atras]'), siguiente: cuerpo.querySelector('[data-paso-siguiente]'),
            guardar: $('#cap-guardar', raiz), cuenta: cuerpo.querySelector('.form-cuenta'),
            // El lienzo de firma se mide al mostrarse (en un paso oculto mediría 0)
            alMostrar: () => Object.keys(captura.firmas).forEach((c) => { if (captura.firmas[c] && captura.firmas[c].ajustar) captura.firmas[c].ajustar(); }),
            validar: (seccion) => {
              const errores = erroresCaptura(seccion);
              marcarErroresEn(cuerpo, errores);
              $('#cap-error', raiz).hidden = true;
              return errores;
            },
          });
        }
      }

      /** Obligatorios vacíos, firmas y valores fuera de lista (todo el formulario o solo un paso). */
      function erroresCaptura(seccion) {
        const tipo = tipoFormulario();
        const valores = leerFormularioAppSheet();
        const errores = faltantesFormularioAppSheet().map((e) => ({ columna: e.columna, etiqueta: e.etiqueta, msg: e.control === 'firma' ? 'Falta la firma' : 'Obligatorio' }));
        (captura.contexto.formulario || []).forEach((e) => {
          if (e.tipo !== 'campo' || e.control !== 'lista' || e.virtual || !cumpleCondicion(e.mostrar, tipo) || !valores[e.columna]) return;
          if ((e.opciones || []).map((o) => String(o).toUpperCase()).indexOf(valores[e.columna].toUpperCase()) < 0) {
            errores.push({ columna: e.columna, etiqueta: e.etiqueta, msg: 'Elige un valor de la lista' });
          }
        });
        return seccion ? errores.filter((x) => seccion.querySelector('[data-af-columna="' + CSS.escape(x.columna) + '"]')) : errores;
      }

      /**
       * PATRON a enviar: los puntos trazados, '' si se borró uno que venía en puntos, o undefined para
       * conservar el valor inicial (p. ej. la imagen que dejó AppSheet).
       */
      function patronParaGuardar() {
        if (!captura.controlPatron) return undefined;
        const actual = captura.controlPatron.valor();
        if (actual) return actual;
        return captura.patronInicial ? '' : undefined;
      }

      /** Valida antes de enviar; regresa false y lleva al paso y campo del primer error. */
      function validarFormularioAppSheet() {
        if (captura.pasos) {
          const errores = erroresCaptura();
          if (!errores.length) return true;
          captura.pasos.irAlCampo(errores[0].columna);
          const cuerpo = $('#ln-captura-cuerpo', raiz);
          marcarErroresEn(cuerpo, errores);
          mostrarErrorCaptura(errores.length === 1 ? errores[0].etiqueta + ': ' + errores[0].msg : 'Faltan ' + errores.length + ' datos: ' + errores.slice(0, 4).map((x) => x.etiqueta).join(', ') + (errores.length > 4 ? '…' : ''),
            null);
          return false;
        }
        const faltan = faltantesFormularioAppSheet();
        // Valid_If de las listas (IN(..., LISTAS TELEFONOS[...])): un valor fuera de la lista no se acepta
        const tipo = tipoFormulario();
        const valores = leerFormularioAppSheet();
        const fueraDeLista = (captura.contexto.formulario || []).filter((e) => e.tipo === 'campo' && e.control === 'lista' && cumpleCondicion(e.mostrar, tipo) &&
          valores[e.columna] && (e.opciones || []).map((o) => String(o).toUpperCase()).indexOf(valores[e.columna].toUpperCase()) < 0);
        if (!faltan.length && fueraDeLista.length) {
          const campo = raiz.querySelector('#ln-captura-cuerpo [data-af-columna="' + CSS.escape(fueraDeLista[0].columna) + '"] select');
          mostrarErrorCaptura(fueraDeLista.map((e) => e.etiqueta).join(', ') + ': elige un valor de la lista (VALOR NO ENCONTRADO EN LA LISTA).', campo ? '#' + campo.id : null);
          return false;
        }
        if (!faltan.length) return true;
        const primero = faltan[0];
        const destino = raiz.querySelector('#ln-captura-cuerpo [data-af-columna="' + CSS.escape(primero.columna) + '"]');
        mostrarErrorCaptura(faltan.map((e) => e.etiqueta).slice(0, 6).join(', ') + (faltan.length > 6 ? '…' : '') + (faltan.length === 1 ? ' es obligatorio.' : ' son obligatorios.'),
          destino ? '#' + (destino.querySelector('[id]') || destino).id : null);
        return false;
      }

      function activarPatron(prefijo, inicial) {
        const bloque = $('#' + prefijo + '-bloque', raiz);
        if (!bloque) return { puntos: () => [], valor: () => '', base64: () => null };
        const posiciones = [[50,50],[150,50],[250,50],[50,150],[150,150],[250,150],[50,250],[150,250],[250,250]];
        const estado = { puntos: (inicial || []).map(Number).filter((n) => n >= 1 && n <= 9) };
        const pintar = () => {
          bloque.querySelectorAll('.ln-patron-punto').forEach((p) => p.classList.toggle('activa', estado.puntos.indexOf(Number(p.dataset.punto)) >= 0));
          $('#' + prefijo + '-lineas', raiz).innerHTML = estado.puntos.length > 1 ? '<polyline points="' + estado.puntos.map((n) => posiciones[n - 1].join(',')).join(' ') + '" />' : '';
          $('#' + prefijo + '-texto', raiz).textContent = estado.puntos.length ? 'Patrón: ' + estado.puntos.join(' → ') : 'Sin patrón trazado';
        };
        bloque.querySelectorAll('.ln-patron-punto').forEach((p) => p.addEventListener('click', () => {
          const n = Number(p.dataset.punto); if (estado.puntos.indexOf(n) < 0) estado.puntos.push(n); pintar();
        }));
        $('#' + prefijo + '-limpiar', raiz).addEventListener('click', () => { estado.puntos = []; pintar(); });
        pintar();
        return {
          puntos: () => estado.puntos.slice(),
          valor: () => estado.puntos.join('-'),
          base64: (fondoPdf) => {
            if (!estado.puntos.length) return null;
            const c = document.createElement('canvas'); c.width = 300; c.height = 300;
            const x = c.getContext('2d'); x.fillStyle = fondoPdf || '#ffffff'; x.fillRect(0, 0, 300, 300); x.strokeStyle = '#0b5d7a'; x.lineWidth = 8; x.lineCap = 'round';
            x.beginPath(); estado.puntos.forEach((n, i) => { const p = posiciones[n - 1]; if (!i) x.moveTo(p[0], p[1]); else x.lineTo(p[0], p[1]); }); x.stroke();
            estado.puntos.forEach((n) => { const p = posiciones[n - 1]; x.beginPath(); x.fillStyle = '#0b5d7a'; x.arc(p[0], p[1], 13, 0, Math.PI * 2); x.fill(); });
            return c.toDataURL('image/png').split(',')[1];
          },
        };
      }

      function subirImagenCaptura(archivo, listaId, carpetaId, onSubido, sinQuitar) {
        const lista = document.getElementById(listaId);
        if (!lista) return Promise.resolve();
        const chip = document.createElement('span');
        chip.className = 'ln-foto-chip ln-foto-subiendo';
        chip.innerHTML = icono('loader-circle', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(archivo.name) + '</span>';
        lista.appendChild(chip);
        return Promise.all([redimensionarImagen(archivo, 1600), Promise.resolve(typeof carpetaId === 'function' ? carpetaId() : carpetaId)])
          .then(([img, carpeta]) => llamar('apiLineasSubirArchivo', carpeta, archivo.name, img.mime, img.base64))
          .then((subido) => {
            chip.className = 'ln-foto-chip';
            chip.innerHTML = icono('check', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(subido.nombre) + '</span>' +
              (sinQuitar ? '' : '<button type="button" data-quitar-foto="' + esc(subido.id) + '">' + icono('x', 'ln-icon-sm') + '</button>');
            onSubido(subido);
          }).catch((e) => {
            chip.className = 'ln-foto-chip';
            chip.style.background = 'var(--ln-rojo-bg)'; chip.style.color = 'var(--ln-rojo-tx)';
            chip.innerHTML = icono('triangle-alert', 'ln-icon-sm') + '<span class="ln-foto-nombre">' + esc(mensajeError(e)) + '</span>';
            onSubido(null);
          });
      }

      function manejarSubidaArchivo(inputId, listaId, obtenerCarpetaId, multiple, onSubido, alTerminar, sinQuitar) {
        const input = document.getElementById(inputId);
        if (!input) return;
        input.addEventListener('change', () => {
          const archivos = Array.from(input.files || []);
          input.value = '';
          if (!archivos.length) return;
          if (!multiple) document.getElementById(listaId).innerHTML = '';
          Promise.all(archivos.slice(0, multiple ? archivos.length : 1).map((archivo) => subirImagenCaptura(archivo, listaId, obtenerCarpetaId, onSubido, sinQuitar)))
            .then(() => { if (alTerminar) alTerminar(); });
        });
      }

      /**
       * Carpeta de evidencia en Drive: se crea al subir la primera foto o al guardar, no al abrir el formulario
       * (abre más rápido y si se cancela sin fotos no queda nada que limpiar).
       */
      function asegurarCarpeta() {
        const sesion = captura;
        if (!sesion) return Promise.reject(new Error('La captura se cerró.'));
        if (!sesion.carpetaPromesa) {
          sesion.carpetaPromesa = llamar('apiLineasPrepararEvidencia', sesion.tipo, sesion.ref).then((c) => {
            sesion.carpetaId = c.carpetaId;
            sesion.fotosCarpetaId = c.fotosCarpetaId || c.carpetaId;
            sesion.ruta = c.ruta;
            // Si se canceló mientras se creaba, se descarta
            if (captura !== sesion && !sesion.guardada) llamar('apiLineasCancelarEvidencia', c.carpetaId, c.fotosCarpetaId).catch(() => {});
            return c;
          });
          sesion.carpetaPromesa.catch(() => { sesion.carpetaPromesa = null; });
        }
        return sesion.carpetaPromesa;
      }

      function estadoGuardado(texto) {
        if (!captura) return;
        captura.guardando = true;
        const modal = $('#ln-modal-captura', raiz);
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = true; });
        captura.textoGuardar = $('#cap-guardar', raiz).innerHTML;
        $('#cap-guardar', raiz).innerHTML = '<span class="ln-spinner"></span> ' + esc(texto);
        $('#ln-captura-subtitulo', raiz).textContent = texto + '. Mantén esta ventana abierta.';
        modal.setAttribute('aria-busy', 'true');
      }

      function restaurarGuardado() {
        if (!captura) return;
        captura.guardando = false;
        const modal = $('#ln-modal-captura', raiz);
        modal.removeAttribute('aria-busy');
        modal.querySelectorAll('button, input, select, textarea').forEach((el) => { el.disabled = false; });
        if (captura.textoGuardar) $('#cap-guardar', raiz).innerHTML = captura.textoGuardar;
        if (captura.pasos) captura.pasos.pintar();
        if (captura.reaplicar) captura.reaplicar();
        $('#ln-captura-subtitulo', raiz).textContent = 'No se completó el guardado. Revisa el mensaje y vuelve a intentar.';
      }

      function mostrarErrorCaptura(mensaje, destino) {
        const errorBox = $('#cap-error', raiz);
        if (!errorBox) return;
        errorBox.textContent = mensaje;
        errorBox.hidden = false;
        const marcado = raiz.querySelector('#ln-captura-cuerpo .form-campo-error');
        const objetivo = destino ? $(destino, raiz) : (marcado || errorBox);
        (objetivo || errorBox).scrollIntoView({ behavior: 'smooth', block: 'center' });
        errorBox.setAttribute('tabindex', '-1');
        errorBox.focus({ preventScroll: true });
      }

      function refrescarDespuesDeCaptura(idAbierto, tipo, nuevoId) {
        const sesionCaptura = captura;
        sesionCaptura.guardada = true;
        memoria.cargadoEn = 0;
        const modal = $('#ln-modal-captura', raiz);
        const cuerpo = $('#ln-captura-cuerpo', raiz);
        const generar = () => {
          sesionCaptura.guardando = true;
          modal.setAttribute('aria-busy', 'true');
          modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = true; });
          $('#ln-captura-subtitulo', raiz).textContent = 'Registro guardado. Preparando el documento PDF.';
          cuerpo.innerHTML = '<div class="ln-pdf-estado" role="status"><span class="ln-spinner"></span><h3>Generando tu PDF</h3>' +
            '<p>Los datos ya están guardados. Las firmas permanecen temporalmente en esta sesión mientras se completa la plantilla y se crea el PDF.</p>' +
            '<ol><li>Firmas cargadas</li><li>Registro guardado</li><li aria-current="step">Generación del PDF en curso</li></ol>' +
            '<p class="ln-tenue">Este paso puede tardar unos segundos. El enlace aparecerá aquí al terminar.</p></div>';
          cuerpo.scrollTop = 0;
          return llamar('apiLineasGenerarPdf', tipo, nuevoId, false, sesionCaptura.pdfFirmas || null).then((pdf) => {
            if (!vigente() || captura !== sesionCaptura) return;
            $('#ln-captura-subtitulo', raiz).textContent = 'Documento listo para consultar o descargar.';
            cuerpo.innerHTML = '<div class="ln-pdf-estado" role="status">' + icono('circle-check') + '<h3>Tu PDF está listo</h3><p>' + esc(pdf.nombre || 'Documento generado') + '</p>' +
              '<div class="ln-pdf-acciones">' + enlaceDrive(pdf.id, 'Ver PDF', true) + enlaceDrive(sesionCaptura.carpetaId, 'Ver carpeta en Drive') +
              '<button type="button" class="secondary" data-cerrar-modal>Volver al equipo</button></div></div>';
            cargarEvidencias(idAbierto);
            cargarHistorial(idAbierto);
          }).catch((e) => {
            if (!vigente() || captura !== sesionCaptura) return;
            $('#ln-captura-subtitulo', raiz).textContent = 'Registro guardado; PDF pendiente.';
            cuerpo.innerHTML = '<div class="ln-pdf-estado" role="alert">' + icono('file-warning') + '<h3>No se pudo completar el PDF</h3><p>' + mensajeError(e) + '</p>' +
            '<p>Tus datos están guardados y las firmas permanecen en esta sesión para reintentar sin volver a llenar el formulario.</p>' +
              '<button type="button" class="primary ln-btn-icono" id="cap-reintentar-pdf">' + icono('refresh-cw') + ' Reintentar PDF</button></div>';
            $('#cap-reintentar-pdf', raiz).addEventListener('click', generar);
            cargarEvidencias(idAbierto);
            cargarHistorial(idAbierto);
          }).finally(() => {
            sesionCaptura.guardando = false;
            modal.removeAttribute('aria-busy');
            modal.querySelectorAll('[data-cerrar-modal]').forEach((b) => { b.disabled = false; });
          });
        };
        generar();
      }

      // -- Inspección (INSPECCIONES LINEAS_Form) --

      const BOTON_GUARDAR_PDF = '<button type="button" class="primary ln-btn-icono" id="cap-guardar">' + icono('circle-check') + ' Guardar y generar PDF</button>';

      /** Botones para agregar fotos: cámara (solo en pantallas táctiles) y galería / archivos. Opcional. */
      function htmlSubirFotos(prefijo, nota) {
        return '<div class="ln-fotos-botones">' +
          '<label class="ln-upload ln-solo-tactil">' + icono('camera') + '<span><b>Tomar foto</b><small>Con la cámara del equipo</small></span>' +
          '<input type="file" id="' + prefijo + '-camara" accept="image/*" capture="environment" multiple /></label>' +
          '<label class="ln-upload">' + icono('images') + '<span><b>Elegir fotos</b><small>De la galería o de la computadora</small></span>' +
          '<input type="file" id="' + prefijo + '" accept="image/*" multiple /></label></div>' +
          '<div class="ln-fotos-lista" id="' + prefijo + '-lista"></div>' + (nota ? '<p class="ln-tenue ln-fotos-nota">' + esc(nota) + '</p>' : '');
      }

      function formularioInspeccion(ctx) {
        const pasos = PASOS_FORMULARIO.INSPECCION;
        const fotos = '<section class="ln-af-seccion ln-af-extra">' +
          htmlSubirFotos('cap-fotos', 'Opcional. Se guardan en la carpeta de la inspección en Drive: NUCO / INSPECCIONES / año / cuatrimestre / mes / INSP DD MM / FOTOS.') + '</section>';
        return htmlPasosAppSheet(ctx.formulario, pasos, { [pasos.findIndex((p) => p.desde === 'extra:FOTOS')]: fotos }, { acomodar: true }) +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div>' + htmlAccionesPasos(BOTON_GUARDAR_PDF);
      }

      function iniciarFormularioInspeccion() {
        iniciarFormularioAppSheet();
        ['cap-fotos', 'cap-fotos-camara'].forEach((inputId) => manejarSubidaArchivo(inputId, 'cap-fotos-lista',
          () => asegurarCarpeta().then(() => captura.fotosCarpetaId), true, (s) => { if (s && captura) captura.fotos.push(s); }));
        $('#cap-guardar', raiz).addEventListener('click', guardarInspeccionDesdeFormulario);
      }

      function guardarInspeccionDesdeFormulario() {
        $('#cap-error', raiz).hidden = true;
        if (!validarFormularioAppSheet()) return;
        if (raiz.querySelector('.ln-foto-subiendo')) { mostrarErrorCaptura('Espera a que terminen de subir las imágenes.', '#cap-fotos-lista'); return; }
        const firmaInspector = captura.firmas['FIRMA INSPECTOR'];
        const firmaResponsable = captura.firmas['FIRMA RESPONSABLE'];
        const idAbierto = captura.idObjetivo;
        const patron = patronParaGuardar();
        const valores = leerFormularioAppSheet();
        const sesion = captura;
        estadoGuardado('Guardando inspección');
        Promise.all([firmaInspector.base64('#ddebf7'), firmaResponsable && !firmaResponsable.estaVacia() ? firmaResponsable.base64('#ddebf7') : null, asegurarCarpeta()]).then(([inspector, responsable]) => {
          sesion.pdfFirmas = { inspector: inspector, responsable: responsable, patron: sesion.controlPatron ? sesion.controlPatron.base64('#ddebf7') : null };
          return llamar('apiLineasGuardarInspeccion', Object.assign({}, sesion.ref, {
            id: sesion.contexto.idPropuesto, valores: valores, patron: patron,
            carpetaId: sesion.carpetaId, fotosCarpetaId: sesion.fotosCarpetaId, ruta: sesion.ruta, fotos: sesion.fotos,
            firmaInspectorBase64: sesion.pdfFirmas.inspector, firmaResponsableBase64: sesion.pdfFirmas.responsable, patronBase64: sesion.pdfFirmas.patron,
          }));
        }).then((r) => {
          refrescarDespuesDeCaptura(idAbierto, 'INSPECCION', r.id);
        }).catch((e) => {
          mostrarErrorCaptura(mensajeError(e));
          restaurarGuardado();
        });
      }

      // -- Responsiva (RESPONSIVAS LINEAS_Form) --

      function formularioResponsiva(ctx) {
        return htmlPasosAppSheet(ctx.formulario, PASOS_FORMULARIO.RESPONSIVA, null, { acomodar: true }) +
          '<div class="error-msg ln-error-fijo" id="cap-error" hidden></div>' + htmlAccionesPasos(BOTON_GUARDAR_PDF);
      }

      function iniciarFormularioResponsiva() {
        iniciarFormularioAppSheet();
        $('#cap-guardar', raiz).addEventListener('click', guardarResponsivaDesdeFormulario);
      }

      function guardarResponsivaDesdeFormulario() {
        $('#cap-error', raiz).hidden = true;
        if (!validarFormularioAppSheet()) return;
        const firmaResponsable = captura.firmas['FIRMA RESPONSABLE'];
        const firmaCi = captura.firmas['FIRMA CI'];
        const idAbierto = captura.idObjetivo;
        const patron = patronParaGuardar();
        const valores = leerFormularioAppSheet();
        const sesion = captura;
        estadoGuardado('Guardando responsiva');
        Promise.all([firmaResponsable && !firmaResponsable.estaVacia() ? firmaResponsable.base64('#ffffff') : null, firmaCi.base64('#ffffff'), asegurarCarpeta()]).then(([responsable, ci]) => {
          sesion.pdfFirmas = { responsable: responsable, ci: ci, patron: sesion.controlPatron ? sesion.controlPatron.base64('#ffffff') : null };
          return llamar('apiLineasGuardarResponsiva', Object.assign({}, sesion.ref, {
            id: sesion.contexto.idPropuesto, valores: valores, patron: patron,
            carpetaId: sesion.carpetaId, ruta: sesion.ruta,
            firmaResponsableBase64: sesion.pdfFirmas.responsable, firmaCiBase64: sesion.pdfFirmas.ci, patronBase64: sesion.pdfFirmas.patron,
          }));
        }).then((r) => {
          refrescarDespuesDeCaptura(idAbierto, 'RESPONSIVA', r.id);
        }).catch((e) => {
          mostrarErrorCaptura(mensajeError(e));
          restaurarGuardado();
        });
      }

      // -- Abrir el modal --

      function abrirCaptura(tipo, ref) {
        $('#ln-modal-captura', raiz).hidden = false;
        $('#ln-captura-icono', raiz).innerHTML = icono(tipo === 'INSPECCION' ? 'clipboard-check' : 'signature');
        $('#ln-captura-tipo', raiz).textContent = tipo === 'INSPECCION' ? 'Inspección de telefonía' : 'Responsiva de entrega';
        $('#ln-captura-titulo', raiz).textContent = tipo === 'INSPECCION' ? 'Nueva inspección' : 'Nueva responsiva';
        $('#ln-captura-subtitulo', raiz).textContent = 'Preparando datos y carpeta de evidencia…';
        $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Cargando…</p>';
        captura = { tipo: tipo, ref: ref, idObjetivo: ref.equipoId || ref.lineaId, fotos: [], patronId: null, firmas: {} };

        const pedirContexto = tipo === 'INSPECCION' ? llamar('apiLineasContextoInspeccion', ref) : llamar('apiLineasContextoResponsiva', ref);
        const sesion = captura;
        Promise.all([pedirContexto, cargarCatalogos()]).then(([ctx, catalogos]) => {
          if (captura !== sesion) return;
          ctx.catalogos = catalogos;
          ctx.formulario = conSelectorBloqueo(ctx.formulario || []);
          captura.contexto = ctx;
          const valorDe = (c) => ((ctx.formulario || []).filter((e) => e.columna === c)[0] || {}).valor || '';
          $('#ln-captura-subtitulo', raiz).textContent = ['NUCO ' + (valorDe('NUCO') || '—'), valorDe('MODELO'), valorDe('RESPONSABLE')].filter(Boolean).join(' · ');
          if (tipo === 'INSPECCION') {
            $('#ln-captura-cuerpo', raiz).innerHTML = formularioInspeccion(ctx);
            pintarIconos($('#ln-captura-cuerpo', raiz));
            iniciarFormularioInspeccion();
          } else {
            $('#ln-captura-cuerpo', raiz).innerHTML = formularioResponsiva(ctx);
            pintarIconos($('#ln-captura-cuerpo', raiz));
            iniciarFormularioResponsiva();
          }
        }).catch((e) => {
          if (!captura) return;
          $('#ln-captura-cuerpo', raiz).innerHTML = '<p class="error-msg">' + mensajeError(e) + '</p>';
        });
      }

      // ---- Historial: todos los movimientos del registro, filtrables y exportables a Excel ----
      const ICONO_MOVIMIENTO = {
        'Alta de registro': 'circle-plus', 'Reasignación': 'arrow-left-right', 'Cambio de estatus': 'toggle-right',
        'Cambio de línea': 'card-sim', 'Cambio de plan': 'receipt-text', 'Cambio de equipo': 'smartphone',
        'Cambio de área o ubicación': 'map-pin', 'Cambio de accesos': 'key-round', 'Otros cambios': 'file-pen-line',
        'Inspección': 'clipboard-check', 'Responsiva': 'signature', 'Reactivación': 'refresh-cw', 'Desecho': 'trash-2',
      };
      const COLOR_ORIGEN = { 'Nuevo sistema': 'verde', AppSheet: 'azul', Drive: 'neutro' };

      /** La DataTable del historial escucha eventos del documento: se destruye al salir de la ficha. */
      function soltarHistorial() {
        if (tablaHistorial) tablaHistorial.destruir();
        tablaHistorial = null;
      }

      function cargarHistorial(id, nombre) {
        if (nombre) nombreHistorial = nombre; else nombre = nombreHistorial;
        const pila0 = pila.length;
        llamar('apiLineasHistorial', id).then((h) => {
          const cont = $('#ln-historial', raiz);
          if (!vigente() || !cont || pila.length !== pila0) return;
          pintarHistorial(cont, h.eventos || [], nombre);
        }).catch((e) => {
          const cont = $('#ln-historial', raiz);
          if (cont) cont.innerHTML = tarjeta(icono('history') + ' Historial', '<p class="error-msg">' + mensajeError(e) + '</p>');
        });
      }

      function pintarHistorial(cont, eventos, nombre) {
        contarEnPestana('historial', eventos.length);
        const conteo = contarPor(eventos, 'movimiento');
        const movimientos = Object.keys(conteo).sort((a, b) => conteo[b] - conteo[a] || a.localeCompare(b));
        cont.innerHTML = '<div class="card ln-card ln-historial">' +
          '<div class="ln-historial-cabecera"><h3>' + icono('history') + ' Historial (' + miles(eventos.length) + ')</h3>' +
          (eventos.length ? '<label class="ln-historial-filtro"><span>Movimiento</span><select id="ln-historial-mov">' +
            '<option value="">Todos los movimientos (' + miles(eventos.length) + ')</option>' +
            movimientos.map((m) => '<option value="' + esc(m) + '">' + esc(m) + ' (' + miles(conteo[m]) + ')</option>').join('') +
            '</select></label>' : '') + '</div>' +
          (eventos.length ? '<div id="ln-historial-tabla"></div>' : '<p class="empty-state">Sin movimientos registrados.</p>') + '</div>';
        if (!eventos.length) return;
        const select = $('#ln-historial-mov', cont);
        soltarHistorial();
        const tabla = tablaHistorial = tablaLineas($('#ln-historial-tabla', cont), {
          idCampo: 'id',
          idTabla: 'lineas-historial-v2',
          tamanoPagina: 25,
          seleccionable: false,
          ordenInicial: { campo: 'fecha', dir: 'desc' },
          textoVacio: 'Sin movimientos con esos filtros',
          exportar: { nombreArchivo: 'Historial ' + nombre, nombreHoja: 'Historial' },
          etiquetaFila: (m) => m.movimiento + ' · ' + fechaTabla(m.fecha),
          detalle: { titulo: (m) => m.movimiento + (m.campo ? ' · ' + m.campo : '') },
          accionesFila: [
            { icono: 'clipboard-check', titulo: 'Ver inspección', visible: (m) => m.refTipo === 'inspeccion' && !!m.refId, alHacer: (m) => abrir('inspeccion', m.refId) },
            { icono: 'file-text', titulo: 'Ver PDF', visible: (m) => !!m.pdfId, alHacer: (m) => window.open('https:\/\/drive.google.com/file/d/' + encodeURIComponent(m.pdfId) + '/view', '_blank', 'noopener') },
          ],
          ayuda: 'Todos los movimientos del registro: reasignaciones, cambios de cada campo, inspecciones, responsivas, reactivaciones y desechos, ' +
            'del AppSheet y del sistema nuevo. "Movimiento" filtra por tipo; la flecha de cada columna filtra por campo, usuario, origen o rango de fechas. ' +
            '"Exportar a Excel" descarga lo filtrado.',
          alCambiarFiltros: (f) => {
            const valores = f && f.movimiento && f.movimiento.valores;
            select.value = valores && valores.length === 1 ? valores[0] : '';
          },
          columnas: [
            { campo: 'fecha', titulo: 'Fecha', tipo: 'lnFechaHora', fijada: true, ancho: 140 },
            { campo: 'movimiento', titulo: 'Movimiento', tipo: 'lista', ancho: 220, render: (v) => '<span class="ln-movimiento">' + ico(ICONO_MOVIMIENTO[v] || 'dot') + ' ' + esc(v) + '</span>' },
            { campo: 'campo', titulo: 'Campo', tipo: 'lista', ancho: 170 },
            { campo: 'antes', titulo: 'Antes', tipo: 'texto', ancho: 200, render: (v) => formatoAppSheet('CAMBIOS', 'ANTES', v) || vacio },
            { campo: 'despues', titulo: 'Después', tipo: 'texto', ancho: 200, render: (v) => formatoAppSheet('CAMBIOS', 'DESPUES', v) || vacio },
            { campo: 'detalle', titulo: 'Detalle', tipo: 'texto', ancho: 260 },
            { campo: 'usuario', titulo: 'Usuario', tipo: 'lista', ancho: 190 },
            { campo: 'origen', titulo: 'Origen', tipo: 'lista', ancho: 130, render: (v) => chip(v, COLOR_ORIGEN[v] || 'neutro') },
          ],
        });
        tabla.setDatos(eventos);
        select.addEventListener('change', () => tabla.setFiltro('movimiento', select.value ? { valores: [select.value] } : null));
      }

      // ---- Inspección ----
      function pintarInspeccion(detalle, id) {
        return llamar('apiLineasInspeccion', id).then((r) => {
          if (!vigente() || !pila.length || pila[pila.length - 1].tipo !== 'inspeccion' || pila[pila.length - 1].id !== id) return;
          const i = r.inspeccion;
          const e = r.equipo;
          const s = i.snapshot || {};
          const fotos = r.fotos || [];
          const firmas = r.firmas || [];
          const CLASE_VALOR = { SI: 'verde', BUENO: 'verde', INSTALADA: 'verde', REGULAR: 'ambar', NO: 'rojo', MALO: 'rojo', 'NO INSTALADA': 'neutro' };
          const checklist = i.origen === 'DRIVE'
            ? '<div class="ln-nota">Esta inspección se conserva en Drive. Consulta sus archivos; no hay respuestas de checklist registradas en el sistema.</div>'
            : '<div class="ln-grid-2">' + (r.checklist || []).map((sec) => {
                const puntos = sec.puntos.filter((p) => i.checklist && i.checklist[p.clave]);
                if (!puntos.length) return '';
                return tarjeta(icono('list-checks') + ' ' + esc(sec.seccion), campos(puntos.map((p) => {
                  const v = i.checklist[p.clave];
                  return [p.etiqueta, chip(v, CLASE_VALOR[v] || 'neutro'), true];
                })));
              }).join('') + '</div>';
          const galeria = (lista, firma) => '<div class="ln-galeria">' + lista.map((f) =>
            '<a class="ln-evidencia" target="_blank" rel="noopener" href="' + esc(f.enlace) + '">' +
            '<span class="ln-foto' + (firma ? ' ln-firma' : '') + '">' +
            (f.miniatura ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(f.miniatura) + '" alt="' + esc(f.nombre) + '">' : icono(f.video ? 'video' : 'image')) +
            '</span><span class="ln-evidencia-nombre">' + esc(f.nombre || 'Evidencia') + '<small>' + icono('external-link') + ' Abrir en Drive</small></span></a>').join('') + '</div>';
          const seccion = (num, ico, titulo, ayuda, contenido) => '<section class="ln-seccion-consulta" id="ln-consulta-' + num + '" tabindex="-1">' + seccionCaptura(num, ico, titulo, ayuda, contenido) + '</section>';
          const resumen = (ico, etiqueta, valor) => '<div class="ln-captura-dato">' + icono(ico) + '<span><small>' + esc(etiqueta) + '</small><b>' + guion(valor) + '</b></span></div>';
          detalle.innerHTML = migas() +
            encabezado('clipboard-check', 'Inspección ' + esc(fecha(i.fecha) || ''),
              (ORIGEN[i.origen] || '') + (e ? chip('NUCO ' + (e.nuco || '—'), 'neutro') : ''),
              (e ? '<button type="button" class="ln-btn-icono" data-ln-ir="equipo" data-id="' + esc(e._id) + '">' + icono('smartphone') + ' Ver equipo</button>' : '') +
              (i.drive ? enlaceDrive(i.drive.carpetaId, 'Ver carpeta en Drive') : '') +
              (r.pdfs || []).map((p, indice) => enlaceDrive(p.id, 'Ver PDF' + (r.pdfs.length > 1 ? ' ' + (indice + 1) : ''), true)).join('')) +
            '<div class="ln-captura-resumen">' + resumen('user', 'Inspector', i.inspector) + resumen('clipboard-check', 'Calificación', porcentaje(i.calificacion)) + resumen('images', 'Evidencia fotográfica', fotos.length + ' archivo(s)') + '</div>' +
            '<nav class="ln-secciones-nav" aria-label="Secciones de la inspección">' +
              ['Datos', 'Checklist', 'Fotos y observaciones', 'Firmas'].map((t, n) => '<button type="button" class="secondary" data-ln-seccion="ln-consulta-' + (n + 1) + '">' + (n + 1) + '. ' + t + '</button>').join('') + '</nav>' +
            seccion(1, 'user', 'Datos de la inspección', 'Información registrada al realizar la revisión.',
              i.origen !== 'DRIVE' ? '<div class="ln-grid-2">' +
                tarjeta(icono('user') + ' Responsable', campos([['Nombre', s.responsable], ['Departamento', s.departamento], ['Sede', s.sede], ['Puesto', s.puesto]])) +
                tarjeta(icono('smartphone') + ' Activo revisado', campos([['Número', s.numero], ['IMEI', s.imei], ['Modelo', s.modelo], ['Compañía', s.compania], ['Ticket', i.ticket]])) + '</div>'
                : '<p class="ln-tenue">Los datos de esta inspección histórica se encuentran en el documento PDF.</p>') +
            seccion(2, 'list-checks', 'Revisión del activo', 'Respuestas y estado de cada componente al momento de la inspección.', checklist) +
            seccion(3, 'camera', 'Evidencia y observaciones', 'Abre cualquier archivo para consultar la imagen completa en Drive.',
              '<h4>Observaciones</h4><p class="ln-lectura-notas">' + esc(i.observaciones || 'Sin observaciones registradas.') + '</p>' +
              '<h4>Fotografías (' + fotos.length + ')</h4>' + (fotos.length ? galeria(fotos) : '<p class="empty-state">No se adjuntaron fotografías a esta inspección.</p>') +
              (r.puedeOperar ? '<div class="ln-fotos-despues"><h4>' + icono('image-plus') + ' Agregar fotos</h4>' +
                htmlSubirFotos('insp-fotos', 'Se guardan en la carpeta FOTOS de esta inspección en Drive.') + '</div>' : '') +
              (i.drive ? '<details class="ln-pie"><summary>Ubicación de los archivos</summary><p>' + esc(i.drive.ruta || '') + '</p></details>' : '')) +
            seccion(4, 'signature', 'Firmas de validación', 'Firmas disponibles en la carpeta de esta inspección.',
              firmas.length ? galeria(firmas, true) : '<p class="empty-state">No hay imágenes de firmas disponibles en esta carpeta. Consulta el PDF para revisar el documento.</p>');
          if (r.puedeOperar) {
            // Mejora: subir fotos a una inspección ya registrada (la carpeta se prepara al elegir la primera)
            let carpeta = null;
            const obtener = () => (carpeta = carpeta || llamar('apiLineasFotosInspeccion', id, 'preparar').then((c) => c.fotosCarpetaId));
            const terminar = () => llamar('apiLineasFotosInspeccion', id, 'actualizar').then(() => {
              aviso('Fotos agregadas a la inspección.', 4000);
              if (vigente() && pila.length && pila[pila.length - 1].id === id) abrir('inspeccion', id, true);
            }).catch((e) => aviso(icono('triangle-alert', 'ln-alerta') + ' ' + mensajeError(e), 8000));
            ['insp-fotos', 'insp-fotos-camara'].forEach((inputId) => manejarSubidaArchivo(inputId, 'insp-fotos-lista', obtener, true, () => {}, terminar, true));
          }
          detalle.querySelectorAll('.ln-evidencia img').forEach((img) => img.addEventListener('error', () => {
            img.parentElement.innerHTML = icono('image-off') + '<span>Vista previa no disponible</span>';
          }, { once: true }));
        });
      }

    }

    /** Desde una bitácora: abre el registro en Líneas Telefónicas. */
    function irARegistro(id) {
      memoria.abrirAlEntrar = id;
      navegarA('lineas-telefonicas', 'Líneas Telefónicas');
    }

    // ======================================================================
    // Gestión de Activos: busca un colaborador y muestra sus líneas/equipos
    // (vehículos, hologramas, Uber y cajas chicas se integran con los demás módulos)
    // ======================================================================

    function initGestionActivos() {
      const n = ++montaje;
      const raiz = document.getElementById('ln-gestion-activos');
      const vigente = () => n === montaje && document.body.contains(raiz);
      const paso = 48;
      pintarIconos(raiz);

      let colaboradores = [];
      let filtrados = [];
      let visibles = paso;
      let temporizador = null;

      function filasPorResponsable(indice, nombre) {
        const texto = normal(nombre);
        return {
          equipos: indice.equipos.filter((r) => normal(r.responsable) === texto),
          lineas: indice.lineas.filter((r) => r.suelta && normal(r.responsable) === texto),
        };
      }

      function tarjetaLineas(nombre, datos) {
        const filaEq = (r) => '<tr class="ln-fila-clic" data-ir="' + esc(r.id) + '"><td><button type="button" class="ln-btn-icono" data-ir="' + esc(r.id) + '">' + icono('smartphone') + ' NUCO ' + guion(r.nuco) + ' ' + icono('chevron-right') + '</button></td><td>' +
          esc(TIPO_EQUIPO[r.tipo] || r.tipo || '') + '</td><td>' + guion(r.modelo) + '</td><td>' + chip(r.estatus) + '</td><td class="ln-mono">' +
          (r.numero ? esc(r.numero) : '<span class="ln-tenue">Sin línea</span>') + '</td></tr>';
        const filaLi = (r) => '<tr class="ln-fila-clic" data-ir="' + esc(r.id) + '"><td><button type="button" class="ln-btn-icono" data-ir="' + esc(r.id) + '">' + icono('phone') + ' ' + guion(r.numero) + ' ' + icono('chevron-right') + '</button>' +
          '</td><td>Línea suelta</td><td>' + guion(r.compania) + '</td><td>' + chip(r.estatus) + '</td><td>—</td></tr>';
        const filas = datos.equipos.map(filaEq).concat(datos.lineas.map(filaLi));
        return '<div class="card ln-card"><h3>' + icono('smartphone') + ' Líneas y equipos (' + filas.length + ')</h3>' +
          (filas.length
            ? '<div class="ln-tabla-wrap"><table class="ln-tabla"><thead><tr><th>NUCO / Número</th><th>Tipo</th><th>Modelo / Compañía</th><th>Estatus</th><th>Línea</th></tr></thead><tbody>' + filas.join('') + '</tbody></table></div>'
            : '<p class="empty-state">Sin líneas ni equipos asignados a ' + esc(nombre) + '.</p>') + '</div>';
      }

      function tarjetaPendiente(titulo, ico) {
        return '<div class="card ln-card"><h3>' + icono(ico) + ' ' + esc(titulo) + '</h3>' +
          '<p class="ln-tenue">Esta información aún no está disponible en esta vista.</p></div>';
      }

      /** Asignaciones del colaborador en el panel lateral (como el detalle de los demás módulos): la lista no se mueve. */
      function mostrarColaborador(c, tarjeta) {
        raiz.querySelectorAll('.ln-cuadro-colaborador.seleccionado').forEach((el) => el.classList.remove('seleccionado'));
        if (tarjeta) tarjeta.classList.add('seleccionado');
        const panel = abrirPanelLateral(c.nombre || 'Colaborador', [c.puesto, c.departamento].filter(Boolean).join(' · ') || 'Activos asignados');
        panel.alCerrar = () => { if (tarjeta) tarjeta.classList.remove('seleccionado'); };
        panel.cuerpo.innerHTML = '<p class="empty-state"><span class="ln-spinner"></span> Consultando asignaciones…</p>';
        // Ir a una línea o equipo: se cierra el panel y se abre su ficha
        panel.cuerpo.addEventListener('click', (ev) => {
          const f = ev.target.closest('[data-ir]');
          if (!f) return;
          panel.cerrar();
          irARegistro(f.dataset.ir);
        });
        cargarIndice().then((indice) => {
          if (!vigente() || panelAbierto !== panel) return;
          const datos = filasPorResponsable(indice, c.nombre);
          const pie = [c.noEmpleado ? 'Empleado ' + c.noEmpleado : '', c.area, c.sede, c.oficina].filter(Boolean).map(esc).join(' · ');
          panel.cuerpo.innerHTML =
            '<div class="ln-panel-resumen"><div class="ln-chips">' +
              (c.estatus ? chip(c.estatus, String(c.estatus).toUpperCase() === 'ACTIVO' ? 'verde' : 'neutro') : '') +
              (c.departamento ? chip(c.departamento, 'azul') : '') +
            '</div>' + (pie ? '<p class="ln-pie ln-tenue">' + pie + '</p>' : '') + '</div>' +
            tarjetaLineas(c.nombre, datos) +
            tarjetaPendiente('Vehículos', 'car') + tarjetaPendiente('Hologramas / combustible', 'fuel') +
            tarjetaPendiente('Uber', 'car-front') + tarjetaPendiente('Cajas chicas', 'wallet');
          pintarIconos(panel.cuerpo);
        }).catch((e) => {
          if (panelAbierto === panel) panel.cuerpo.innerHTML = '<p class="error-msg">No se pudieron consultar las asignaciones: ' + mensajeError(e) + '</p>';
        });
      }

      function tarjetaColaborador(c) {
        const conActivos = c.totalActivos > 0;
        return '<button type="button" class="card ln-cuadro ln-cuadro-colaborador ' + (conActivos ? 'con-activos' : 'sin-activos') + '" data-colaborador-i="' + c._i + '">' +
          '<div class="ln-cuadro-superior"><span class="ln-cuadro-departamento">' + guion(c.departamento) + '</span>' +
          '<span class="ln-cuadro-area">' + guion(c.area) + '</span></div>' +
          '<div class="ln-cuadro-principal">' + guion(c.nombre) + '</div>' +
          '<div class="ln-cuadro-secundario">' + guion(c.puesto) + '</div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('map-pin') + ' ' + guion(c.sede) + '</span><span>' + icono('building-2') + ' ' + guion(c.oficina) + '</span></div>' +
          '<div class="ln-cuadro-pie"><span>' + icono('briefcase-business') + ' ' + chip(c.estatus || 'Sin estatus', String(c.estatus).toUpperCase() === 'ACTIVO' ? 'verde' : 'neutro') + '</span>' +
          '<span class="ln-activos-estado ' + (conActivos ? 'si' : 'no') + '">' + icono(conActivos ? 'package-check' : 'package-x') + ' ' +
          (conActivos ? miles(c.totalActivos) + ' activo(s)' : 'Sin activos') + '</span></div><div class="ln-cuadro-pie"><span>Consultar asignaciones ' + icono('chevron-right') + '</span></div></button>';
      }

      function pintarCuadros() {
        $('#lnga-grid', raiz).innerHTML = filtrados.length
          ? filtrados.slice(0, visibles).map(tarjetaColaborador).join('')
          : '<div class="card empty-state ln-cuadro-vacio">No hay colaboradores que coincidan con los filtros.</div>';
        $('#lnga-conteo', raiz).textContent = 'Mostrando ' + miles(Math.min(visibles, filtrados.length)) + ' de ' + miles(filtrados.length);
        $('#lnga-mas', raiz).hidden = visibles >= filtrados.length;
      }

      function aplicarFiltros() {
        const texto = normal($('#lnga-q', raiz).value).trim();
        const activos = $('#lnga-filtro-activos', raiz).value;
        filtrados = colaboradores.filter((c) => {
          if (activos === 'CON' && !c.totalActivos) return false;
          if (activos === 'SIN' && c.totalActivos) return false;
          return !texto || ['nombre', 'noEmpleado', 'puesto', 'departamento', 'area', 'sede', 'oficina']
            .some((campo) => normal(c[campo]).indexOf(texto) >= 0);
        });
        visibles = paso;
        pintarCuadros();
      }

      $('#lnga-q', raiz).addEventListener('input', (ev) => {
        clearTimeout(temporizador);
        temporizador = setTimeout(aplicarFiltros, 150);
      });
      // KPIs: clic = filtro "Con / Sin activos" (el mismo del selector); otro clic lo quita
      function pintarKpis() {
        const con = colaboradores.filter((c) => c.totalActivos).length;
        const activosAsignados = colaboradores.reduce((t, c) => t + c.totalActivos, 0);
        const defs = [
          { icono: 'users', valor: colaboradores.length, etiqueta: 'Colaboradores', filtro: 'TODOS' },
          { icono: 'user-check', valor: con, etiqueta: 'Con activos', clase: 'stat-tile-ok', filtro: 'CON' },
          { icono: 'user-x', valor: colaboradores.length - con, etiqueta: 'Sin activos', clase: 'stat-tile-warn', filtro: 'SIN' },
          { icono: 'smartphone', valor: activosAsignados, etiqueta: 'Equipos y líneas asignados' },
        ];
        const cont = $('#lnga-kpis', raiz);
        cont.innerHTML = defs.map((d, i) => '<div class="stat-tile ' + (d.clase || '') + (d.filtro ? ' stat-tile-clickable' : '') + '" data-kpi="' + i + '"' +
          (d.filtro ? ' role="button" tabindex="0"' : '') + '><div class="stat-icon">' + ico(d.icono) + '</div><div><div class="stat-value">' + miles(d.valor) + '</div>' +
          '<div class="stat-label">' + esc(d.etiqueta) + '</div></div></div>').join('');
        const marcar = () => cont.querySelectorAll('[data-kpi]').forEach((t) => {
          const d = defs[Number(t.dataset.kpi)];
