<script>
  /**
   * app-permisos.html — Administración > Usuarios y permisos (solo ADMIN).
   *
   * Mismo patrón que Vehículos y Líneas: KPIs + tabla (Personas | Áreas); doble clic abre la
   * ficha con pestañas (Permisos, Datos / Personas). Los permisos se cambian con el botón
   * "Editar permisos", que abre una ventana con un selector por módulo y manda los cambios a
   * apiPermisosGuardar (los escribe en la hoja PERMISOS y regresa todo de nuevo).
   *
   * Dos pestañas más: "Matriz por área" (todas las áreas contra todos los módulos; un clic en
   * la celda la cambia y se guarda todo junto, con el mismo apiPermisosGuardar) e "Historial"
   * (cada cambio guardado: el servidor lo anota en PERMISOS_HISTORIAL y lo manda en el panel).
   * Cada ficha trae también su pestaña Historial, solo con lo de esa persona o esa área.
   *
   * Permisos en árbol (14-oct-2026): cada módulo tiene secciones (sus pestañas, Exportar…; Modulos.gs)
   * que HEREDAN su nivel salvo una regla propia, y nunca pasan de él. En las fichas solo se listan las
   * secciones que se apartan de su módulo; en la ventana y la matriz cada sección tiene además
   * "Hereda" (sin regla propia).
   *
   * La cuenta de qué tiene cada quien se repite aquí para pintar al instante; la que manda es
   * la del servidor (Permisos.resolver_). Si cambian las reglas de allá, cambiar deArea() y
   * efectivo() también: tests/permisos-pantalla.test.cjs corre los dos con los mismos casos.
   */

  const PERM_TEXTO = { NINGUNO: 'Sin acceso', LECTURA: 'Ver', EDICION: 'Editar', HEREDA: 'Hereda', ASIGNADO: 'Asignado', AREA: 'Solo su área' };
  const PERM_ICONO = { NINGUNO: 'eye-off', LECTURA: 'eye', EDICION: 'pencil', ASIGNADO: 'layers', AREA: 'map-pin' };
  const PERM_ROLES_TOTALES = ['ADMIN', 'SUPER'];

  // Usuarios y permisos en partes (fase 6.1c): initPermisosAdmin es el arranque y la lista; ficha, ventana, matriz
  // viven en app-permisos-<parte>.html y se registran aquí (componentes/partes.html).
  const PermisosAdmin = Partes.crear('Usuarios y permisos');

  async function initPermisosAdmin() {
    // Las partes (app-permisos-*.html, componentes/partes.html): se montan abajo, con lo del arranque
    const T = PermisosAdmin.contexto();
    const { abrirFicha, volver } = T.de('ficha');
    const { abrirAsignar, abrirEditar, alClicVentana, cerrarEditar, eliminarPerfil, guardarEdicion, pintarPieVentana } = T.de('ventana');
    const { alClicMatriz, guardarMatriz, pintarMatriz } = T.de('matriz');
    const $ = (id) => document.getElementById(id);
    let datos = null;
    let originales = {};   // llave → permiso, como están en la hoja
    let todasLasSecciones = false;   // matriz: "Ver todas las secciones"; si no, solo las que tienen alguna regla o un cambio

    // ---------------------------------------------------------------- reglas
    const normal = (t) => Formato.normal(t).toUpperCase().trim().replace(/\s+/g, ' ');
    const llave = (quien, modulo) => normal(quien) + '|' + modulo;
    const modulos = () => datos.grupos.reduce((t, g) => t.concat(g.modulos), []);
    /** Las secciones de un módulo (o []), como las manda el panel: { id, etiqueta, icono, hereda } */
    const seccionesDe = (m) => m.secciones || [];
    /** Módulos y secciones, cada sección con su padre (se arma una vez por carga: la matriz pregunta mucho) */
    let nodos_ = null;
    let porId_ = {};
    function nodos() {
      if (!nodos_) {
        nodos_ = modulos().reduce((t, m) => t.concat([m], seccionesDe(m).map((s) => Object.assign({ padre: m.id }, s))), []);
        porId_ = {};
        nodos_.forEach((n) => { porId_[n.id] = n; });
      }
      return nodos_;
    }
    const nodo = (id) => (nodos(), porId_[id] || null);
    const padreDe = (id) => (nodo(id) || {}).padre || null;
    const regla = (quien, modulo) => originales[llave(quien, modulo)];
    const NIVEL_N = { NINGUNO: 0, LECTURA: 1, EDICION: 2 };
    /** Nunca más que su módulo */
    const tope = (v, padre) => (NIVEL_N[v] > NIVEL_N[padre] ? padre : v);
    const mayor = (a, b) => (NIVEL_N[a] >= NIVEL_N[b] ? a : b);

    // ---- perfiles (fase 2): paquetes de reglas con nombre que se asignan a áreas
    let perfilesPorClave = {};   // normal(nombre) → { nombre, reglas: { nodo: nivel }, areas: [área] }
    let perfilesDeArea = {};     // normal(área) → [normal(nombre)]
    const quienPerfil = (nombre) => 'perfil:' + nombre;
    const perfilesDe = (area) => (area ? perfilesDeArea[normal(area)] || [] : []);
    const reglaPerfil = (k, id) => (perfilesPorClave[k] || { reglas: {} }).reglas[id];
    /** Lo que da un perfil solo en un nodo: su regla o, en una sección, lo que hereda dentro del perfil (sin tope) */
    function valorPerfil(k, id) {
      const v = reglaPerfil(k, id);
      if (v !== undefined) return v;
      const n = nodo(id);
      return n && n.padre && n.hereda !== false ? valorPerfil(k, n.padre) : 'NINGUNO';
    }
    /** Los perfiles de esa lista que dicen algo de ese nodo y dan lo más alto (para decir "por su perfil X") */
    function perfilesQueDan(perfiles, id) {
      const dicen = perfiles.filter((k) => reglaPerfil(k, id) !== undefined);
      if (!dicen.length) return [];
      const mx = dicen.reduce((m, k) => mayor(valorPerfil(k, id), m), 'NINGUNO');
      return dicen.filter((k) => valorPerfil(k, id) === mx).map((k) => perfilesPorClave[k].nombre);
    }

    /**
     * Permisos.resolver_ aquí, para pintar al instante (tests/permisos-pantalla.test.cjs exige que dé lo mismo):
     * `capas` son funciones (id) → nivel | undefined, de la más fuerte a la más débil (correo, área…); si ninguna
     * dice nada, el más alto de los `perfiles` que digan algo de ese nodo; si tampoco, una sección hereda de su
     * módulo. Nunca más que su módulo; `soloConsultaTope` (VIEWER, CLIENT) deja Editar en Ver; `limitado` (alcance:
     * CLIENT o un perfil que limita) cierra lo que no respeta el alcance. → (id) → nivel.
     */
    function resolvedor(capas, perfiles, soloConsultaTope, limitado) {
      const memo = {};
      const val = (id) => {
        if (id in memo) return memo[id];
        const n = nodo(id);
        const padre = n && n.padre;
        let v;
        for (let i = 0; i < capas.length && v === undefined; i++) v = capas[i](id);
        if (v === undefined && perfiles.some((k) => reglaPerfil(k, id) !== undefined)) {
          v = perfiles.reduce((mx, k) => mayor(valorPerfil(k, id), mx), 'NINGUNO');
        }
        if (v === undefined) v = padre && n.hereda !== false ? val(padre) : 'NINGUNO';
        if (padre) v = tope(v, val(padre));
        if (soloConsultaTope && v === 'EDICION') v = 'LECTURA';
        // Limitado a lo de su área (fase 3): solo lo que respeta el alcance (Modulos.gs: alcance; el panel lo manda)
        if (limitado && !(n && n.alcance)) v = 'NINGUNO';
        return (memo[id] = v);
      };
      return val;
    }
    /** Lo de un área en un nodo (Permisos.resolver_ sin el correo): su regla, sus perfiles o lo que hereda */
    // Si un perfil del área limita a lo de su área (fase 3), lo que da el área también se cierra donde no se respeta
    const deArea = (area, id) => resolvedor([(x) => (area ? regla(area, x) : undefined)], perfilesDe(area), false,
      perfilesDe(area).some(perfilLimita))(id);
    /** Lo que da un perfil solo, con su herencia y el tope de su módulo */
    const dePerfil = (k, id) => resolvedor([(x) => reglaPerfil(k, x)], [], false)(id);
    const tieneTotal = (p) => PERM_ROLES_TOTALES.indexOf(p.rol) !== -1;
    /** VIEWER y CLIENT solo consultan: Editar se les queda en Ver (Permisos.resolver_) */
    const soloConsulta = (p) => p.rol === 'VIEWER' || p.rol === 'CLIENT';
    /** Los departamentos que ve un CLIENT (Permisos.alcance_): DPTOS PERMITIDOS o, si está vacío, su área */
    const alcanceCliente = (p) => {
      const lista = String(p.dptosPermitidos || '').split(',').map((d) => d.trim()).filter(Boolean);
      return lista.length ? lista : (p.area ? [p.area] : []);
    };
    /**
     * Lo que tiene por su rol, su regla propia, la de su área, los perfiles de su área o lo que hereda de su
     * módulo (Permisos.resolver_); VIEWER y CLIENT no editan. (Sin ver si está activo: eso se avisa aparte.)
     */
    function efectivo(p, id) {
      if (tieneTotal(p)) return 'EDICION';   // "usuarios" (lo único que SUPER no tiene) no está en esta lista
      return resolvedor([(x) => regla(p.correo, x), (x) => (p.area ? regla(p.area, x) : undefined)],
        perfilesDe(p.area), soloConsulta(p), estaLimitado(p))(id);
    }
    /** ¿Solo ve lo de su área? Un CLIENT, o (fase 3) quien tiene en su área un perfil que limita (Permisos.alcance_) */
    const perfilLimita = (k) => (perfilesPorClave[k] || {}).alcance === 'AREA';
    const estaLimitado = (p) => !tieneTotal(p) && (p.rol === 'CLIENT' || perfilesDe(p.area).some(perfilLimita));
    const excepcionesDe = (p) => (tieneTotal(p) ? [] : nodos().filter((m) => regla(p.correo, m.id) !== undefined));
    const conAcceso = (p) => modulos().filter((m) => efectivo(p, m.id) !== 'NINGUNO').length;
    const persona = (correo) => datos.personas.find((p) => normal(p.correo) === normal(correo));
    const area = (nombre) => datos.areas.find((a) => normal(a.nombre) === normal(nombre));
    const delArea = (nombre) => datos.personas.filter((p) => normal(p.area) === normal(nombre));
    const perfil = (nombre) => perfilesPorClave[normal(nombre)] || null;

    function cargar(respuesta) {
      datos = respuesta;
      datos.historial = datos.historial || [];
      datos.perfiles = datos.perfiles || [];
      nodos_ = null;
      originales = {};
      datos.reglas.forEach((r) => {
        // NINGUNO de un área sin perfiles en un módulo es lo mismo que no tener regla (el servidor ya no lo guarda)
        originales[llave(r.quien, r.modulo)] = r.permiso;
      });
      perfilesPorClave = {};
      perfilesDeArea = {};
      datos.perfiles.forEach((pf) => {
        const k = normal(pf.nombre);
        perfilesPorClave[k] = { nombre: pf.nombre, reglas: {}, areas: pf.areas || [], alcance: pf.alcance || '' };
        (pf.reglas || []).forEach((r) => { perfilesPorClave[k].reglas[r.modulo] = r.permiso; });
        (pf.areas || []).forEach((a) => { (perfilesDeArea[normal(a)] = perfilesDeArea[normal(a)] || []).push(k); });
      });
    }

    // ---------------------------------------------------------------- piezas de HTML
    const ico = (nombre) => '<i data-lucide="' + nombre + '" class="ico"></i>';
    const nivel = (v) => '<span class="usr-nivel ' + v + '">' + ico(PERM_ICONO[v]) + PERM_TEXTO[v] + '</span>';
    /** "Vehículos › Documentos" */
    const etiquetaNodo = (id) => {
      const n = nodo(id);
      if (!n) return id;
      return n.padre ? (nodo(n.padre) || {}).etiqueta + ' › ' + n.etiqueta : n.etiqueta;
    };
    const badgeRol = (rol) => (rol === 'USER' ? '' : '<span class="badge-estado pendiente">' + escaparHtml(rol) + '</span>');
    const badgeActivo = (activo) => '<span class="badge-estado ' + (activo ? 'activo' : 'baja') + '">' + (activo ? 'Activo' : 'Inactivo') + '</span>';
    const plural = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);

    /** El ícono de cada módulo es el mismo que tiene su vista (NAV_GRUPOS, app.html); el que vive en la ficha de otro lo trae en Modulos.gs */
    function iconoModulo(id) {
      const n = nodo(id);
      if (n && n.padre) return n.icono || iconoModulo(n.padre);   // una sección: su ícono o el de su módulo
      const vista = vistaDe(id);
      return vista ? vista.icono : ((n || {}).icono || 'square');
    }

    // ---------------------------------------------------------------- lo que implica un permiso
    const NIVELES = ['NINGUNO', 'LECTURA', 'EDICION'];
    const familiaDe = (id) => (datos.grupos.find((g) => g.modulos.some((m) => m.id === id)) || { modulos: [] }).modulos;
    const nombres = (ms) => ms.slice(0, 3).map((m) => m.etiqueta).join(', ') + (ms.length > 3 ? ' y ' + (ms.length - 3) + ' más' : '');

    /**
     * Lo que estos permisos dejan hacer FUERA de las pantallas de cada módulo, sacado del
     * catálogo de módulos (Modulos.gs: referencia / editaEn), no escrito a mano por módulo:
     *  - una consulta de referencia de su familia (el catálogo de vehículos para quien tiene Sensores);
     *  - una parte de otro módulo que se edita o no según este (la sección de sensor en Vehículos).
     * nivelDe(idModulo) → 'NINGUNO' | 'LECTURA' | 'EDICION'. Regresa [[icono, texto], …].
     */
    function implicaciones(nivelDe) {
      const lista = [];
      modulos().forEach((m) => {
        if (m.referencia && nivelDe(m.id) === 'NINGUNO') {
          const por = familiaDe(m.id).filter((o) => o.id !== m.id && nivelDe(o.id) !== 'NINGUNO');
          if (por.length) lista.push(['search', 'Podrá consultar ' + m.referencia + ', aunque no tenga ' + m.etiqueta + ': lo necesita en ' + nombres(por) + '.']);
        }
        (m.editaEn || []).forEach((e) => {
          const otro = modulos().find((o) => o.id === e.modulo);
          if (!otro || nivelDe(e.modulo) !== 'EDICION') return;
          lista.push(nivelDe(m.id) === 'EDICION'
            ? ['pencil', 'En ' + otro.etiqueta + ' también podrá editar ' + e.que + ' (porque edita ' + m.etiqueta + ').']
            : ['lock', 'En ' + otro.etiqueta + ' no podrá editar ' + e.que + ': eso solo lo edita quien tiene Editar en ' + m.etiqueta + '.']);
        });
      });
      return lista;
    }

    function tarjetaImplicaciones(lista) {
      if (!lista.length) return '';
      return '<div class="card ln-card usr-implica"><h3>' + ico('link-2') + ' Lo que esto implica fuera de sus pantallas</h3><ul>' +
        lista.map((x) => '<li>' + ico(x[0]) + '<span>' + escaparHtml(x[1]) + '</span></li>').join('') + '</ul></div>';
    }

    // ---------------------------------------------------------------- historial
    /** Un nodo ("Vehículos › Documentos") o, en una asignación, el perfil ("Perfil Flotilla") */
    const etiquetaModulo = (id) => (/^perfil:/i.test(id) ? 'Perfil ' + String(id).replace(/^perfil:/i, '')
      : id === '@alcance' ? 'Alcance (solo lo de su área)' : etiquetaNodo(id));
    const esDePersona = (h) => h.quien.indexOf('@') !== -1;
    const esDePerfil = (h) => /^perfil:/i.test(h.quien);
    /** '' en el historial = sin regla: la persona tiene lo de su área; el área, sin acceso (en una sección: hereda;
     *  en una asignación de perfil: sin asignar) */
    const textoHistorial = (valor, dePersona, modulo) => (valor ? PERM_TEXTO[valor]
      : (/^perfil:/i.test(modulo) ? 'Sin asignar' : dePersona ? 'Lo de su área' : padreDe(modulo) ? PERM_TEXTO.HEREDA : PERM_TEXTO.NINGUNO));
    const chipHistorial = (valor, dePersona, modulo) => (valor ? nivel(valor)
      : /^perfil:/i.test(modulo) ? '<span class="usr-origen area">' + ico('square') + ' Sin asignar</span>'
        : dePersona ? '<span class="usr-origen area">' + ico('users') + ' Lo de su área</span>'
          : padreDe(modulo) ? '<span class="usr-origen area">' + ico('corner-down-right') + ' Hereda</span>' : nivel('NINGUNO'));
    const cambioHistorial = (h) => '<span class="usr-historial-cambio">' + chipHistorial(h.antes, esDePersona(h), h.modulo) + ico('arrow-right') +
      chipHistorial(h.despues, esDePersona(h), h.modulo) + '</span>';
    const fechaHora = (iso) => Formato.fechaHora(iso) || '—';
    /** Lo de ese área, correo o perfil; de un perfil, también sus asignaciones (que se anotan con el área) */
    const historialDe = (quien) => datos.historial.filter((h) => normal(h.quien) === normal(quien) ||
      (/^perfil:/i.test(quien) && normal(h.modulo) === normal(quien)));

    function pestanaHistorial(quien) {
      const lista = historialDe(quien);
      return {
        id: 'historial', titulo: 'Historial', icono: 'history', num: lista.length,
        contenido: '<div class="card ln-card"><h3>' + ico('history') + ' Cambios de permisos</h3>' + (lista.length
          ? tablaFicha([
            { t: 'Fecha', r: (h) => fechaHora(h.fecha) },
            { t: 'Módulo', r: (h) => escaparHtml(etiquetaModulo(h.modulo)) },
            { t: 'Cambio', r: cambioHistorial },
            { t: 'Lo cambió', r: (h) => escaparHtml(h.nombre || h.correo || '—') },
          ], lista)
          : '<p class="empty-state">Sin cambios desde que se lleva el historial.</p>') + '</div>',
      };
    }

    // ---------------------------------------------------------------- listado: tablas y KPIs
    const filaPersona = (p) => ({
      ID: p.correo, NOMBRE: p.nombre || p.correo, CORREO: p.correo, AREA: p.area || 'Sin área', ROL: p.rol,
      ESTATUS: p.activo ? 'Activo' : 'Inactivo', MODULOS: conAcceso(p), EXCEPCIONES: excepcionesDe(p).length,
      COORDINACION: p.coordinacion, OFICINA: p.oficina, SEDE: p.sede, NO_EMPLEADO: p.noEmpleado,
    });
    const filaArea = (a) => {
      const activas = delArea(a.nombre).filter((p) => p.activo);
      return {
        ID: a.nombre, AREA: a.nombre, PERSONAS: activas.length,
        EDITA: modulos().filter((m) => deArea(a.nombre, m.id) === 'EDICION').length,
        VE: modulos().filter((m) => deArea(a.nombre, m.id) === 'LECTURA').length,
        EXCEPCIONES: activas.filter((p) => excepcionesDe(p).length).length,
      };
    };
    const conteo = (v, cero) => (v ? String(v) : (cero || '—'));

    const tablaPersonas = DataTable.crear($('usr-tabla-personas'), {
      idCampo: 'ID',
      idTabla: 'usuarios-personas',
      textoVacio: 'No hay personas en USUARIOS',
      exportar: { nombreArchivo: 'Usuarios y permisos - personas' },
      etiquetaFila: (f) => f.NOMBRE,
      detalle: false,
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (f) => abrirFicha('persona', f.ID),
      alTocarFila: (f) => abrirFicha('persona', f.ID),
      alCambiarFiltros: (filtros) => marcarKpis(filtros),
      ordenInicial: { campo: 'NOMBRE', dir: 'asc' },
      columnas: [
        { campo: 'NOMBRE', titulo: 'Nombre', tipo: 'texto', fijada: true,
          render: (v, f) => '<span class="usr-nombre">' + Avatar.html(f.CORREO, v, { tam: 26 }) + escaparHtml(v) + '</span>' },
        { campo: 'AREA', titulo: 'Área', tipo: 'lista' },
        { campo: 'ROL', titulo: 'Rol', tipo: 'lista', render: (v) => badgeRol(v) || escaparHtml(v) },
        { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista', render: (v) => badgeActivo(v === 'Activo') },
        { campo: 'MODULOS', titulo: 'Módulos', tipo: 'numero', render: (v) => conteo(v, 'Ninguno') },
        { campo: 'EXCEPCIONES', titulo: 'Excepciones', tipo: 'numero',
          render: (v) => (v ? '<span class="usr-origen excepcion">' + ico('sparkles') + ' ' + v + '</span>' : '—') },
        { campo: 'CORREO', titulo: 'Correo', tipo: 'texto', visible: false },
        { campo: 'COORDINACION', titulo: 'Coordinación', tipo: 'lista', visible: false },
        { campo: 'OFICINA', titulo: 'Oficina', tipo: 'lista', visible: false },
        { campo: 'SEDE', titulo: 'Sede', tipo: 'lista', visible: false },
        { campo: 'NO_EMPLEADO', titulo: 'No. de empleado', tipo: 'texto', visible: false },
      ],
      accionesFila: [
        { icono: 'eye', titulo: 'Ver ficha', alHacer: (f) => abrirFicha('persona', f.ID) },
        { icono: 'pencil', titulo: 'Editar permisos', visible: (f) => !tieneTotal(persona(f.ID)), alHacer: (f) => abrirEditar('persona', f.ID) },
      ],
    });

    const tablaAreas = DataTable.crear($('usr-tabla-areas'), {
      idCampo: 'ID',
      idTabla: 'usuarios-areas',
      textoVacio: 'Nadie tiene área en USUARIOS',
      exportar: { nombreArchivo: 'Usuarios y permisos - areas' },
      etiquetaFila: (f) => f.AREA,
      detalle: false,
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (f) => abrirFicha('area', f.ID),
      alTocarFila: (f) => abrirFicha('area', f.ID),
      ordenInicial: { campo: 'AREA', dir: 'asc' },
      columnas: [
        { campo: 'AREA', titulo: 'Área', tipo: 'texto', fijada: true },
        { campo: 'PERSONAS', titulo: 'Personas activas', tipo: 'numero' },
        { campo: 'EDITA', titulo: 'Edita', tipo: 'numero', render: (v) => (v ? plural(v, 'módulo', 'módulos') : '—') },
        { campo: 'VE', titulo: 'Solo ve', tipo: 'numero', render: (v) => (v ? plural(v, 'módulo', 'módulos') : '—') },
        { campo: 'EXCEPCIONES', titulo: 'Personas con excepciones', tipo: 'numero',
          render: (v) => (v ? '<span class="usr-origen excepcion">' + ico('sparkles') + ' ' + v + '</span>' : '—') },
      ],
      accionesFila: [
        { icono: 'eye', titulo: 'Ver ficha', alHacer: (f) => abrirFicha('area', f.ID) },
        { icono: 'pencil', titulo: 'Editar permisos', alHacer: (f) => abrirEditar('area', f.ID) },
      ],
    });

    const filaHistorial = (h, i) => {
      const dePersona = esDePersona(h);
      const p = dePersona ? persona(h.quien) : null;
      return {
        ID: i, FECHA: h.fecha, HORA: Formato.hora(h.fecha),
        QUIEN: h.quien, A_QUIEN: p ? (p.nombre || p.correo) : esDePerfil(h) ? 'Perfil ' + h.quien.replace(/^perfil:/i, '') : h.quien,
        TIPO: dePersona ? 'Persona' : esDePerfil(h) ? 'Perfil' : 'Área',
        MODULO: etiquetaModulo(h.modulo), ANTES: textoHistorial(h.antes, dePersona, h.modulo), DESPUES: textoHistorial(h.despues, dePersona, h.modulo),
        CAMBIO: cambioHistorial(h), LO_CAMBIO: h.nombre || h.correo || '—',
      };
    };
    const tablaHistorial = DataTable.crear($('usr-tabla-historial'), {
      idCampo: 'ID',
      idTabla: 'usuarios-historial',
      textoVacio: 'Todavía no hay cambios: aquí aparece cada permiso que se cambie desde esta pantalla.',
      exportar: { nombreArchivo: 'Usuarios y permisos - historial' },
      etiquetaFila: (f) => f.A_QUIEN + ' · ' + f.MODULO,
      detalle: false,
      alAbrirFila: (f) => abrirDesdeHistorial(f),
      alTocarFila: (f) => abrirDesdeHistorial(f),
      columnas: [
        { campo: 'FECHA', titulo: 'Fecha', tipo: 'fecha' },
        { campo: 'HORA', titulo: 'Hora', tipo: 'texto' },
        { campo: 'A_QUIEN', titulo: 'A quién', tipo: 'texto', fijada: true },
        { campo: 'TIPO', titulo: 'Persona o área', tipo: 'lista' },
        { campo: 'MODULO', titulo: 'Módulo', tipo: 'lista' },
        { campo: 'CAMBIO', titulo: 'Cambio', tipo: 'texto', render: (v) => v, exportable: false, filtrable: false, ordenable: false },
        { campo: 'ANTES', titulo: 'Antes', tipo: 'lista', visible: false },
        { campo: 'DESPUES', titulo: 'Después', tipo: 'lista', visible: false },
        { campo: 'LO_CAMBIO', titulo: 'Lo cambió', tipo: 'lista' },
      ],
      accionesFila: [
        { icono: 'eye', titulo: 'Ver ficha', alHacer: (f) => abrirDesdeHistorial(f) },
      ],
    });
    function abrirDesdeHistorial(f) {
      if (f.TIPO === 'Persona') abrirFicha('persona', f.QUIEN);
      else if (f.TIPO === 'Perfil') abrirFicha('perfil', f.QUIEN.replace(/^perfil:/i, ''));
      else abrirFicha('area', f.QUIEN);
    }

    const filaPerfil = (pf) => ({
      ID: pf.nombre, NOMBRE: pf.nombre, REGLAS: pf.reglas.length, AREAS: pf.areas.join(', ') || '—', ALCANCE: pf.alcance === 'AREA' ? 'Solo su área' : 'Todo',
      PERSONAS: datos.personas.filter((p) => p.activo && pf.areas.some((a) => normal(a) === normal(p.area))).length,
    });
    const tablaPerfiles = DataTable.crear($('usr-tabla-perfiles'), {
      idCampo: 'ID',
      idTabla: 'usuarios-perfiles',
      textoVacio: 'Todavía no hay perfiles. Un perfil es un paquete de permisos con nombre que se asigna a áreas: créalo con "Nuevo perfil".',
      exportar: { nombreArchivo: 'Usuarios y permisos - perfiles' },
      etiquetaFila: (f) => f.NOMBRE,
      detalle: false,
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (f) => abrirFicha('perfil', f.ID),
      alTocarFila: (f) => abrirFicha('perfil', f.ID),
      ordenInicial: { campo: 'NOMBRE', dir: 'asc' },
      columnas: [
        { campo: 'NOMBRE', titulo: 'Perfil', tipo: 'texto', fijada: true },
        { campo: 'REGLAS', titulo: 'Reglas', tipo: 'numero' },
        { campo: 'AREAS', titulo: 'Áreas', tipo: 'texto' },
        { campo: 'ALCANCE', titulo: 'Alcance', tipo: 'lista' },
        { campo: 'PERSONAS', titulo: 'Personas activas', tipo: 'numero' },
      ],
      accionesFila: [
        { icono: 'eye', titulo: 'Ver ficha', alHacer: (f) => abrirFicha('perfil', f.ID) },
        { icono: 'pencil', titulo: 'Editar permisos', alHacer: (f) => abrirEditar('perfil', f.ID) },
      ],
    });

    const tablaActiva = () => {
      const pestana = Tabs.actual($('usr-listado'));
      return pestana === 'areas' ? tablaAreas : pestana === 'perfiles' ? tablaPerfiles : pestana === 'historial' ? tablaHistorial : tablaPersonas;
    };

    /** Cada tarjeta filtra la tabla de personas; otro clic en la misma la quita */
    const KPIS = {
      'usr-kpi-total': { filtros: {}, cuenta: () => datos.personas.length },
      'usr-kpi-activas': { filtros: { ESTATUS: { valores: ['Activo'] } }, cuenta: () => datos.personas.filter((p) => p.activo).length },
      'usr-kpi-inactivas': { filtros: { ESTATUS: { valores: ['Inactivo'] } }, cuenta: () => datos.personas.filter((p) => !p.activo).length },
      'usr-kpi-rol': { filtros: { ROL: { valores: ['ADMIN', 'SUPER'] } }, cuenta: () => datos.personas.filter(tieneTotal).length },
      'usr-kpi-excepciones': { filtros: { ESTATUS: { valores: ['Activo'] }, EXCEPCIONES: { op: '>', v1: 0 } },
        cuenta: () => datos.personas.filter((p) => p.activo && excepcionesDe(p).length).length },
      'usr-kpi-sinacceso': { filtros: { ESTATUS: { valores: ['Activo'] }, MODULOS: { op: '=', v1: 0 } },
        cuenta: () => datos.personas.filter((p) => p.activo && !conAcceso(p)).length },
    };
    // La tarjeta marcada sale de los filtros que tiene la tabla: si alguien los cambia a mano
    // y ya no coinciden con ninguna, ninguna queda marcada
    const firma = (filtros) => JSON.stringify(Object.keys(filtros || {}).sort().map((k) => [k, filtros[k]]));
    let filtrosActuales = {};
    const kpiDe = (filtros) => Object.keys(KPIS).find((id) => firma(KPIS[id].filtros) === firma(filtros)) || null;
    Object.keys(KPIS).forEach((id) => {
      const tile = $(id);
      tile.classList.add('stat-tile-clickable');
      tile.addEventListener('click', () => {
        const nuevo = kpiDe(filtrosActuales) === id ? 'usr-kpi-total' : id;
        $('usr-tabs').querySelector('[data-tab="personas"]').click();
        tablaPersonas.limpiarFiltros();
        Object.keys(KPIS[nuevo].filtros).forEach((campo) => tablaPersonas.setFiltro(campo, KPIS[nuevo].filtros[campo]));
        marcarKpis(KPIS[nuevo].filtros);
      });
    });
    function marcarKpis(filtros) {
      if (filtros) filtrosActuales = filtros;
      const activo = kpiDe(filtrosActuales);
      Object.keys(KPIS).forEach((id) => $(id).classList.toggle('stat-tile-activo', id === activo));
    }

    function refrescarListado() {
      tablaPersonas.setDatos(datos.personas.map(filaPersona));
      tablaAreas.setDatos(datos.areas.map(filaArea));
      tablaPerfiles.setDatos(datos.perfiles.map(filaPerfil));
      tablaHistorial.setDatos(datos.historial.map(filaHistorial));
      pintarMatriz();
      Object.keys(KPIS).forEach((id) => { $(id).querySelector('.stat-value').textContent = KPIS[id].cuenta(); });
      marcarKpis();
    }

    // ---------------------------------------------------------------- eventos
    Tabs.iniciar($('usr-listado'));
    $('usr-tabs').querySelectorAll('.tab-btn').forEach((b) => b.addEventListener('click', () => requestAnimationFrame(() => tablaActiva().ajustarAlto())));
    // Lo que también usan otras partes (T.datos, T.todasLasSecciones, T.perfilesPorClave)
    Object.defineProperty(T, 'datos', { get: () => datos, set: (v) => { datos = v; } });
    Object.defineProperty(T, 'todasLasSecciones', { get: () => todasLasSecciones, set: (v) => { todasLasSecciones = v; } });
    Object.defineProperty(T, 'perfilesPorClave', { get: () => perfilesPorClave, set: (v) => { perfilesPorClave = v; } });
    T.montar({
      $, NIVELES, alcanceCliente, area, badgeActivo, badgeRol, cargar, conAcceso, deArea, dePerfil, delArea,
      efectivo, estaLimitado, etiquetaNodo, excepcionesDe, ico, iconoModulo, implicaciones, modulos, nivel, nodo,
      nodos, normal, padreDe, perfil, perfilLimita, perfilesDe, perfilesQueDan, persona, pestanaHistorial, plural,
      quienPerfil, refrescarListado, regla, reglaPerfil, resolvedor, seccionesDe, soloConsulta, tablaActiva,
      tarjetaImplicaciones, tieneTotal,
    });

    $('usr-detalle').addEventListener('click', (ev) => {
      const el = ev.target.closest('button');
      if (!el) return;
      // la pestaña la cambia Tabs; aquí solo se recuerda para volver a ella al repintar
      if (el.dataset.tab) { T.fichaActual.pestana = el.dataset.tab; return; }
      if (el.hasAttribute('data-usr-volver')) { volver(); return; }
      if (el.hasAttribute('data-usr-editar')) { abrirEditar(T.fichaActual.tipo, T.fichaActual.id); return; }
      if (el.hasAttribute('data-usr-asignar')) { abrirAsignar(T.fichaActual.tipo, T.fichaActual.id); return; }
      if (el.hasAttribute('data-usr-eliminar-perfil')) { eliminarPerfil(T.fichaActual.id); return; }
      // data-usr-contrasena, no data-usr-restablecer: ese ya es el ↺ de la ventana de editar permisos
      if (el.hasAttribute('data-usr-contrasena')) { const p = persona(T.fichaActual.id); Seguridad.restablecer(p.correo, p.nombre); return; }
      if (el.hasAttribute('data-usr-olvidar')) { const p = persona(T.fichaActual.id); Seguridad.olvidarDispositivos(p.correo, p.nombre); return; }
      if (el.dataset.usrPerfil) { abrirFicha('perfil', el.dataset.usrPerfil, true); return; }
      if (el.dataset.usrArea) { abrirFicha('area', el.dataset.usrArea, true); return; }
      if (el.dataset.usrPersona) abrirFicha('persona', el.dataset.usrPersona, true);
    });

    $('usr-matriz').addEventListener('click', alClicMatriz);
    $('usr-matriz-guardar').addEventListener('click', guardarMatriz);
    $('usr-matriz-descartar').addEventListener('click', () => { T.pendientesMatriz = {}; pintarMatriz(); });
    $('usr-matriz-secciones').addEventListener('click', (ev) => {
      todasLasSecciones = !todasLasSecciones;
      ev.currentTarget.setAttribute('aria-pressed', String(todasLasSecciones));
      ev.currentTarget.lastChild.textContent = todasLasSecciones ? ' Solo secciones con reglas' : ' Ver todas las secciones';
      pintarMatriz();
    });

    $('usr-modal-cuerpo').addEventListener('click', alClicVentana);
    // El nombre de un perfil se escribe sin repintar (si no, el cursor se perdería): solo el pie
    $('usr-modal-cuerpo').addEventListener('input', (ev) => {
      if (ev.target.id !== 'usr-perfil-nombre' || !T.edicion) return;
      T.edicion.nombre = ev.target.value;
      pintarPieVentana();
    });
    $('usr-nuevo-perfil').addEventListener('click', () => abrirEditar('perfil', null));
    $('usr-matriz-modo').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-modo]');
      if (!b || b.dataset.modo === T.modoMatriz) return;
      T.modoMatriz = b.dataset.modo;
      pintarMatriz();
    });
    $('usr-modal-guardar').addEventListener('click', guardarEdicion);
    $('usr-modal-cancelar').addEventListener('click', cerrarEditar);
    $('usr-modal-cerrar').addEventListener('click', cerrarEditar);
    $('usr-modal').addEventListener('click', (ev) => { if (ev.target.id === 'usr-modal') cerrarEditar(); });
    $('usr-modal').addEventListener('keydown', (ev) => { if (ev.key === 'Escape') cerrarEditar(); });

    // ---------------------------------------------------------------- carga
    tablaPersonas.setCargando(true);
    tablaAreas.setCargando(true);
    tablaPerfiles.setCargando(true);
    tablaHistorial.setCargando(true);
    try {
      cargar(await callServer('apiPermisosPanel', state.token));
    } catch (err) {
      [tablaPersonas, tablaAreas, tablaPerfiles, tablaHistorial].forEach((t) => t.setError('No se pudieron cargar los permisos: ' + err.message));
      return;
    }
    if (!document.body.contains($('usr-listado'))) return;   // se navegó a otra vista mientras cargaba
    refrescarListado();
    refreshIcons();
  }

  const AYUDA_USUARIOS = [
    { pregunta: '¿Qué son los tres niveles de permiso?', respuesta: 'Sin acceso (rojo), Ver (azul, solo consulta) y Editar (verde, puede capturar/cambiar) -- por módulo.' },
    { pregunta: '¿Cómo cambio el permiso de una persona?', respuesta: 'Abre su ficha (pestaña Personas) y usa "Editar permisos", o cambia celdas directo en "Matriz por área".' },
    { pregunta: '¿Qué es una "excepción" (dorado)?', respuesta: 'Un permiso distinto al que le da su área -- por ejemplo, alguien con Ver en un módulo donde su área en general no tiene acceso.' },
    { pregunta: '¿Qué pasa si cambio el permiso de un área en vez de una persona?', respuesta: 'Afecta a todas las personas de esa área que no tengan ya una excepción propia en ese módulo.' },
    { pregunta: '¿Dónde veo quién cambió qué permiso y cuándo?', respuesta: 'Pestaña "Historial" -- cada cambio real queda registrado con fecha, quién lo hizo, a quién y el antes/después.' },
    { pregunta: '¿Qué es un perfil?', respuesta: 'Un paquete de permisos con nombre (p. ej. "Flotilla - consulta") que se asigna a una o varias áreas: sus personas reciben lo que da. Si un área tiene varios, gana el más alto; lo que el área tenga como regla propia, y las excepciones de cada persona, mandan sobre el perfil. Pestaña Perfiles.' },
    { pregunta: '¿Qué son las secciones de un módulo?', respuesta: 'Las pestañas de su ficha (Documentos, Historial…) y Exportar a Excel. Heredan el nivel del módulo, así que normalmente no hay que tocarlas; para quitarle a alguien solo una, ponle "Sin acceso" en esa sección. Nunca pasan del nivel del módulo.' },
  ];
</script>
