<script>
  /**
   * app-permisos.html — Administración > Usuarios y permisos (solo ADMIN).
   *
   * Mismo patrón que Vehículos y Líneas: KPIs + tabla (Personas | Áreas); doble clic abre la
   * ficha con pestañas (Permisos, Datos / Personas). Los permisos se cambian con el botón
   * "Editar permisos", que abre una ventana con un selector por módulo y manda los cambios a
   * apiPermisosGuardar (los escribe en la hoja PERMISOS y regresa todo de nuevo).
   *
   * Dos pestañas más: "Matriz por área" (todas las áreas contra todos los módulos; un clic en
   * la celda la cambia y se guarda todo junto, con el mismo apiPermisosGuardar) e "Historial"
   * (cada cambio guardado: el servidor lo anota en PERMISOS_HISTORIAL y lo manda en el panel).
   * Cada ficha trae también su pestaña Historial, solo con lo de esa persona o esa área.
   *
   * Permisos en árbol (14-oct-2026): cada módulo tiene secciones (sus pestañas, Exportar…; Modulos.gs)
   * que HEREDAN su nivel salvo una regla propia, y nunca pasan de él. En las fichas solo se listan las
   * secciones que se apartan de su módulo; en la ventana y la matriz cada sección tiene además
   * "Hereda" (sin regla propia).
   *
   * La cuenta de qué tiene cada quien se repite aquí para pintar al instante; la que manda es
   * la del servidor (Permisos.resolver_). Si cambian las reglas de allá, cambiar deArea() y
   * efectivo() también: tests/permisos-pantalla.test.cjs corre los dos con los mismos casos.
   */

  const PERM_TEXTO = { NINGUNO: 'Sin acceso', LECTURA: 'Ver', EDICION: 'Editar', HEREDA: 'Hereda', ASIGNADO: 'Asignado', AREA: 'Solo su área' };
  const PERM_ICONO = { NINGUNO: 'eye-off', LECTURA: 'eye', EDICION: 'pencil', ASIGNADO: 'layers', AREA: 'map-pin' };
  const PERM_ROLES_TOTALES = ['ADMIN', 'SUPER'];

  async function initPermisosAdmin() {
    const $ = (id) => document.getElementById(id);
    let datos = null;
    let originales = {};   // llave → permiso, como están en la hoja
    let pila = [];         // fichas abiertas antes de la actual: "Volver" regresa a la anterior
    let fichaActual = null;   // { tipo: 'persona' | 'area' | 'perfil', id, pestana }

    // ---------------------------------------------------------------- reglas
    const normal = (t) => Formato.normal(t).toUpperCase().trim().replace(/\s+/g, ' ');
    const llave = (quien, modulo) => normal(quien) + '|' + modulo;
    const modulos = () => datos.grupos.reduce((t, g) => t.concat(g.modulos), []);
    /** Las secciones de un módulo (o []), como las manda el panel: { id, etiqueta, icono, hereda } */
    const seccionesDe = (m) => m.secciones || [];
    /** Módulos y secciones, cada sección con su padre (se arma una vez por carga: la matriz pregunta mucho) */
    let nodos_ = null;
    let porId_ = {};
    function nodos() {
      if (!nodos_) {
        nodos_ = modulos().reduce((t, m) => t.concat([m], seccionesDe(m).map((s) => Object.assign({ padre: m.id }, s))), []);
        porId_ = {};
        nodos_.forEach((n) => { porId_[n.id] = n; });
      }
      return nodos_;
    }
    const nodo = (id) => (nodos(), porId_[id] || null);
    const padreDe = (id) => (nodo(id) || {}).padre || null;
    const regla = (quien, modulo) => originales[llave(quien, modulo)];
    const NIVEL_N = { NINGUNO: 0, LECTURA: 1, EDICION: 2 };
    /** Nunca más que su módulo */
    const tope = (v, padre) => (NIVEL_N[v] > NIVEL_N[padre] ? padre : v);
    const mayor = (a, b) => (NIVEL_N[a] >= NIVEL_N[b] ? a : b);

    // ---- perfiles (fase 2): paquetes de reglas con nombre que se asignan a áreas
    let perfilesPorClave = {};   // normal(nombre) → { nombre, reglas: { nodo: nivel }, areas: [área] }
    let perfilesDeArea = {};     // normal(área) → [normal(nombre)]
    const quienPerfil = (nombre) => 'perfil:' + nombre;
    const perfilesDe = (area) => (area ? perfilesDeArea[normal(area)] || [] : []);
    const reglaPerfil = (k, id) => (perfilesPorClave[k] || { reglas: {} }).reglas[id];
    /** Lo que da un perfil solo en un nodo: su regla o, en una sección, lo que hereda dentro del perfil (sin tope) */
    function valorPerfil(k, id) {
      const v = reglaPerfil(k, id);
      if (v !== undefined) return v;
      const n = nodo(id);
      return n && n.padre && n.hereda !== false ? valorPerfil(k, n.padre) : 'NINGUNO';
    }
    /** Los perfiles de esa lista que dicen algo de ese nodo y dan lo más alto (para decir "por su perfil X") */
    function perfilesQueDan(perfiles, id) {
      const dicen = perfiles.filter((k) => reglaPerfil(k, id) !== undefined);
      if (!dicen.length) return [];
      const mx = dicen.reduce((m, k) => mayor(valorPerfil(k, id), m), 'NINGUNO');
      return dicen.filter((k) => valorPerfil(k, id) === mx).map((k) => perfilesPorClave[k].nombre);
    }

    /**
     * Permisos.resolver_ aquí, para pintar al instante (tests/permisos-pantalla.test.cjs exige que dé lo mismo):
     * `capas` son funciones (id) → nivel | undefined, de la más fuerte a la más débil (correo, área…); si ninguna
     * dice nada, el más alto de los `perfiles` que digan algo de ese nodo; si tampoco, una sección hereda de su
     * módulo. Nunca más que su módulo; `soloConsultaTope` (VIEWER, CLIENT) deja Editar en Ver; `limitado` (alcance:
     * CLIENT o un perfil que limita) cierra lo que no respeta el alcance. → (id) → nivel.
     */
    function resolvedor(capas, perfiles, soloConsultaTope, limitado) {
      const memo = {};
      const val = (id) => {
        if (id in memo) return memo[id];
        const n = nodo(id);
        const padre = n && n.padre;
        let v;
        for (let i = 0; i < capas.length && v === undefined; i++) v = capas[i](id);
        if (v === undefined && perfiles.some((k) => reglaPerfil(k, id) !== undefined)) {
          v = perfiles.reduce((mx, k) => mayor(valorPerfil(k, id), mx), 'NINGUNO');
        }
        if (v === undefined) v = padre && n.hereda !== false ? val(padre) : 'NINGUNO';
        if (padre) v = tope(v, val(padre));
        if (soloConsultaTope && v === 'EDICION') v = 'LECTURA';
        // Limitado a lo de su área (fase 3): solo lo que respeta el alcance (Modulos.gs: alcance; el panel lo manda)
        if (limitado && !(n && n.alcance)) v = 'NINGUNO';
        return (memo[id] = v);
      };
      return val;
    }
    /** Lo de un área en un nodo (Permisos.resolver_ sin el correo): su regla, sus perfiles o lo que hereda */
    // Si un perfil del área limita a lo de su área (fase 3), lo que da el área también se cierra donde no se respeta
    const deArea = (area, id) => resolvedor([(x) => (area ? regla(area, x) : undefined)], perfilesDe(area), false,
      perfilesDe(area).some(perfilLimita))(id);
    /** Lo que da un perfil solo, con su herencia y el tope de su módulo */
    const dePerfil = (k, id) => resolvedor([(x) => reglaPerfil(k, x)], [], false)(id);
    const tieneTotal = (p) => PERM_ROLES_TOTALES.indexOf(p.rol) !== -1;
    /** VIEWER y CLIENT solo consultan: Editar se les queda en Ver (Permisos.resolver_) */
    const soloConsulta = (p) => p.rol === 'VIEWER' || p.rol === 'CLIENT';
    /** Los departamentos que ve un CLIENT (Permisos.alcance_): DPTOS PERMITIDOS o, si está vacío, su área */
    const alcanceCliente = (p) => {
      const lista = String(p.dptosPermitidos || '').split(',').map((d) => d.trim()).filter(Boolean);
      return lista.length ? lista : (p.area ? [p.area] : []);
    };
    /**
     * Lo que tiene por su rol, su regla propia, la de su área, los perfiles de su área o lo que hereda de su
     * módulo (Permisos.resolver_); VIEWER y CLIENT no editan. (Sin ver si está activo: eso se avisa aparte.)
     */
    function efectivo(p, id) {
      if (tieneTotal(p)) return 'EDICION';   // "usuarios" (lo único que SUPER no tiene) no está en esta lista
      return resolvedor([(x) => regla(p.correo, x), (x) => (p.area ? regla(p.area, x) : undefined)],
        perfilesDe(p.area), soloConsulta(p), estaLimitado(p))(id);
    }
    /** ¿Solo ve lo de su área? Un CLIENT, o (fase 3) quien tiene en su área un perfil que limita (Permisos.alcance_) */
    const perfilLimita = (k) => (perfilesPorClave[k] || {}).alcance === 'AREA';
    const estaLimitado = (p) => !tieneTotal(p) && (p.rol === 'CLIENT' || perfilesDe(p.area).some(perfilLimita));
    const excepcionesDe = (p) => (tieneTotal(p) ? [] : nodos().filter((m) => regla(p.correo, m.id) !== undefined));
    const conAcceso = (p) => modulos().filter((m) => efectivo(p, m.id) !== 'NINGUNO').length;
    const persona = (correo) => datos.personas.find((p) => normal(p.correo) === normal(correo));
    const area = (nombre) => datos.areas.find((a) => normal(a.nombre) === normal(nombre));
    const delArea = (nombre) => datos.personas.filter((p) => normal(p.area) === normal(nombre));
    const perfil = (nombre) => perfilesPorClave[normal(nombre)] || null;

    function cargar(respuesta) {
      datos = respuesta;
      datos.historial = datos.historial || [];
      datos.perfiles = datos.perfiles || [];
      nodos_ = null;
      originales = {};
      datos.reglas.forEach((r) => {
        // NINGUNO de un área sin perfiles en un módulo es lo mismo que no tener regla (el servidor ya no lo guarda)
        originales[llave(r.quien, r.modulo)] = r.permiso;
      });
      perfilesPorClave = {};
      perfilesDeArea = {};
      datos.perfiles.forEach((pf) => {
        const k = normal(pf.nombre);
        perfilesPorClave[k] = { nombre: pf.nombre, reglas: {}, areas: pf.areas || [], alcance: pf.alcance || '' };
        (pf.reglas || []).forEach((r) => { perfilesPorClave[k].reglas[r.modulo] = r.permiso; });
        (pf.areas || []).forEach((a) => { (perfilesDeArea[normal(a)] = perfilesDeArea[normal(a)] || []).push(k); });
      });
    }

    // ---------------------------------------------------------------- piezas de HTML
    const ico = (nombre) => '<i data-lucide="' + nombre + '" class="ico"></i>';
    const nivel = (v) => '<span class="usr-nivel ' + v + '">' + ico(PERM_ICONO[v]) + PERM_TEXTO[v] + '</span>';
    /** "Vehículos › Documentos" */
    const etiquetaNodo = (id) => {
      const n = nodo(id);
      if (!n) return id;
      return n.padre ? (nodo(n.padre) || {}).etiqueta + ' › ' + n.etiqueta : n.etiqueta;
    };
    const badgeRol = (rol) => (rol === 'USER' ? '' : '<span class="badge-estado pendiente">' + escaparHtml(rol) + '</span>');
    const badgeActivo = (activo) => '<span class="badge-estado ' + (activo ? 'activo' : 'baja') + '">' + (activo ? 'Activo' : 'Inactivo') + '</span>';
    const plural = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);

    /** El ícono de cada módulo es el mismo que tiene su vista (NAV_GRUPOS, app.html); el que vive en la ficha de otro lo trae en Modulos.gs */
    function iconoModulo(id) {
      const n = nodo(id);
      if (n && n.padre) return n.icono || iconoModulo(n.padre);   // una sección: su ícono o el de su módulo
      const vista = vistaDe(id);
      return vista ? vista.icono : ((n || {}).icono || 'square');
    }

    // ---------------------------------------------------------------- lo que implica un permiso
    const NIVELES = ['NINGUNO', 'LECTURA', 'EDICION'];
    const familiaDe = (id) => (datos.grupos.find((g) => g.modulos.some((m) => m.id === id)) || { modulos: [] }).modulos;
    const nombres = (ms) => ms.slice(0, 3).map((m) => m.etiqueta).join(', ') + (ms.length > 3 ? ' y ' + (ms.length - 3) + ' más' : '');

    /**
     * Lo que estos permisos dejan hacer FUERA de las pantallas de cada módulo, sacado del
     * catálogo de módulos (Modulos.gs: referencia / editaEn), no escrito a mano por módulo:
     *  - una consulta de referencia de su familia (el catálogo de vehículos para quien tiene Sensores);
     *  - una parte de otro módulo que se edita o no según este (la sección de sensor en Vehículos).
     * nivelDe(idModulo) → 'NINGUNO' | 'LECTURA' | 'EDICION'. Regresa [[icono, texto], …].
     */
    function implicaciones(nivelDe) {
      const lista = [];
      modulos().forEach((m) => {
        if (m.referencia && nivelDe(m.id) === 'NINGUNO') {
          const por = familiaDe(m.id).filter((o) => o.id !== m.id && nivelDe(o.id) !== 'NINGUNO');
          if (por.length) lista.push(['search', 'Podrá consultar ' + m.referencia + ', aunque no tenga ' + m.etiqueta + ': lo necesita en ' + nombres(por) + '.']);
        }
        (m.editaEn || []).forEach((e) => {
          const otro = modulos().find((o) => o.id === e.modulo);
          if (!otro || nivelDe(e.modulo) !== 'EDICION') return;
          lista.push(nivelDe(m.id) === 'EDICION'
            ? ['pencil', 'En ' + otro.etiqueta + ' también podrá editar ' + e.que + ' (porque edita ' + m.etiqueta + ').']
            : ['lock', 'En ' + otro.etiqueta + ' no podrá editar ' + e.que + ': eso solo lo edita quien tiene Editar en ' + m.etiqueta + '.']);
        });
      });
      return lista;
    }

    function tarjetaImplicaciones(lista) {
      if (!lista.length) return '';
      return '<div class="card ln-card usr-implica"><h3>' + ico('link-2') + ' Lo que esto implica fuera de sus pantallas</h3><ul>' +
        lista.map((x) => '<li>' + ico(x[0]) + '<span>' + escaparHtml(x[1]) + '</span></li>').join('') + '</ul></div>';
    }

    // ---------------------------------------------------------------- historial
    /** Un nodo ("Vehículos › Documentos") o, en una asignación, el perfil ("Perfil Flotilla") */
    const etiquetaModulo = (id) => (/^perfil:/i.test(id) ? 'Perfil ' + String(id).replace(/^perfil:/i, '')
      : id === '@alcance' ? 'Alcance (solo lo de su área)' : etiquetaNodo(id));
    const esDePersona = (h) => h.quien.indexOf('@') !== -1;
    const esDePerfil = (h) => /^perfil:/i.test(h.quien);
    const esAsignacion = (h) => /^perfil:/i.test(h.modulo);
    /** '' en el historial = sin regla: la persona tiene lo de su área; el área, sin acceso (en una sección: hereda;
     *  en una asignación de perfil: sin asignar) */
    const textoHistorial = (valor, dePersona, modulo) => (valor ? PERM_TEXTO[valor]
      : (/^perfil:/i.test(modulo) ? 'Sin asignar' : dePersona ? 'Lo de su área' : padreDe(modulo) ? PERM_TEXTO.HEREDA : PERM_TEXTO.NINGUNO));
    const chipHistorial = (valor, dePersona, modulo) => (valor ? nivel(valor)
      : /^perfil:/i.test(modulo) ? '<span class="usr-origen area">' + ico('square') + ' Sin asignar</span>'
        : dePersona ? '<span class="usr-origen area">' + ico('users') + ' Lo de su área</span>'
          : padreDe(modulo) ? '<span class="usr-origen area">' + ico('corner-down-right') + ' Hereda</span>' : nivel('NINGUNO'));
    const cambioHistorial = (h) => '<span class="usr-historial-cambio">' + chipHistorial(h.antes, esDePersona(h), h.modulo) + ico('arrow-right') +
      chipHistorial(h.despues, esDePersona(h), h.modulo) + '</span>';
    const fechaHora = (iso) => Formato.fechaHora(iso) || '—';
    /** Lo de ese área, correo o perfil; de un perfil, también sus asignaciones (que se anotan con el área) */
    const historialDe = (quien) => datos.historial.filter((h) => normal(h.quien) === normal(quien) ||
      (/^perfil:/i.test(quien) && normal(h.modulo) === normal(quien)));

    function pestanaHistorial(quien) {
      const lista = historialDe(quien);
      return {
        id: 'historial', titulo: 'Historial', icono: 'history', num: lista.length,
        contenido: '<div class="card ln-card"><h3>' + ico('history') + ' Cambios de permisos</h3>' + (lista.length
          ? tablaFicha([
            { t: 'Fecha', r: (h) => fechaHora(h.fecha) },
            { t: 'Módulo', r: (h) => escaparHtml(etiquetaModulo(h.modulo)) },
            { t: 'Cambio', r: cambioHistorial },
            { t: 'Lo cambió', r: (h) => escaparHtml(h.nombre || h.correo || '—') },
          ], lista)
          : '<p class="empty-state">Sin cambios desde que se lleva el historial.</p>') + '</div>',
      };
    }

    function renglon(m, valor, origen, excepcion) {
      return '<div class="usr-permiso' + (excepcion ? ' excepcion' : '') + (padreDe(m.id) ? ' usr-seccion' : '') + '">' +
        '<span class="usr-permiso-ico">' + ico(iconoModulo(m.id)) + '</span>' +
        '<div class="usr-permiso-nombre">' + escaparHtml(m.etiqueta) + (origen ? '<div class="usr-permiso-origen">' + origen + '</div>' : '') + '</div>' +
        nivel(valor) + '</div>';
    }

    /**
     * Los módulos por grupo, una tarjeta por grupo. `mostrar(m)` decide qué renglón va arriba;
     * el resto se junta al final en "Sin acceso a N módulos", plegado.
     */
    function listaDePermisos(mostrar, pintarRenglon, nivelDe, conRegla) {
      let html = '';
      const ocultos = [];
      // Debajo de cada módulo, solo las secciones que se apartan de él (las que heredan van implícitas)
      const conSecciones = (m) => pintarRenglon(m) + seccionesDe(m)
        .filter((s) => nivelDe(s.id) !== nivelDe(m.id) || conRegla(s.id))
        .map((s) => pintarRenglon(Object.assign({ padre: m.id }, s))).join('');
      datos.grupos.forEach((g) => {
        const visibles = g.modulos.filter((m) => { const si = mostrar(m); if (!si) ocultos.push(m); return si; });
        if (!visibles.length) return;
        html += '<div class="card ln-card"><h3>' + ico(g.icono) + ' ' + escaparHtml(g.etiqueta) + '</h3>' +
          visibles.map(conSecciones).join('') + '</div>';
      });
      if (!html) html = '<div class="card ln-card"><p class="empty-state">No tiene acceso a ningún módulo.</p></div>';
      if (ocultos.length) {
        html += '<div class="card ln-card"><details class="usr-plegado"><summary>Sin acceso a ' + plural(ocultos.length, 'módulo', 'módulos') + '</summary>' +
          ocultos.map(pintarRenglon).join('') + '</details></div>';
      }
      return html;
    }

    function migas() {
      const anterior = pila.length ? pila[pila.length - 1] : null;
      const texto = anterior ? (anterior.tipo === 'persona' ? ((persona(anterior.id) || {}).nombre || anterior.id) : anterior.id) : 'Usuarios y permisos';
      return Ficha.migas({ volver: { atributos: 'data-usr-volver' }, ruta: [{ texto: texto, atributos: 'data-usr-volver' }] });
    }

    // ---------------------------------------------------------------- ficha de persona
    function fichaPersona(p) {
      const total = tieneTotal(p);
      let aviso = '';
      if (!p.activo) aviso = ['user-x', 'Está inactivo en USUARIOS: no puede entrar a la app. Abajo está lo que tendría si se reactiva.'];
      else if (total) aviso = ['shield-check', 'Su rol ' + p.rol + ' le da acceso total' + (p.rol === 'SUPER' ? ', menos Usuarios y permisos' : '') + '. Para quitárselo hay que cambiar su ROL en USUARIOS.'];
      else if (p.rol === 'VIEWER') aviso = ['eye', 'Su rol VIEWER solo deja consultar: aunque tenga Editar, no podrá modificar nada.'];
      else if (p.rol === 'CLIENT') {
        const dptos = alcanceCliente(p);
        aviso = ['eye', 'Su rol CLIENT solo deja consultar, y en Vehículos y Líneas solo ve lo de ' +
          (dptos.length ? dptos.join(', ') : 'ningún departamento (no tiene área ni DPTOS PERMITIDOS)') + '.'];
      }
      else if (estaLimitado(p)) {
        const limitan = perfilesDe(p.area).filter(perfilLimita).map((k) => perfilesPorClave[k].nombre);
        aviso = ['map-pin', 'Su perfil ' + limitan.join(', ') + ' la limita a lo de su área (' + (alcanceCliente(p).join(', ') || 'ningún departamento') +
          '): solo tiene lo que respeta ese límite, y ahí solo ve sus renglones.'];
      }
      else if (!p.area) aviso = ['info', 'No tiene área en USUARIOS: solo tiene las excepciones que se le den aquí.'];

      const resumen = [['Correo', p.correo], ['Área', p.area], ['Coordinación', p.coordinacion], ['Sede', [p.oficina, p.sede].filter(Boolean).join(' · ')]]
        .filter((d) => d[1]);
      let html = migas() + Ficha.encabezado({
        iconoHtml: Avatar.html(p.correo, p.nombre, { tam: 0, clase: 'usr-avatar' }), titulo: p.nombre || p.correo,
        chips: badgeRol(p.rol) + badgeActivo(p.activo) +
          (p.area ? '<button type="button" class="badge-estado pendiente usr-chip-enlace" data-usr-area="' + escaparHtml(p.area) + '" title="Ver el área">' + ico('users') + ' ' + escaparHtml(p.area) + '</button>' : ''),
        // Restablecer: una contraseña temporal (Seguridad, js/app-seguridad.html; 23-oct)
        botones: (total ? '' : '<button type="button" data-usr-editar>' + ico('pencil') + ' Editar permisos</button>') +
          '<button type="button" class="secondary" data-usr-contrasena>' + ico('key-round') + ' Restablecer contraseña</button>' +
          '<button type="button" class="secondary" data-usr-olvidar>' + ico('monitor-x') + ' Olvidar sus dispositivos</button>',
        resumen: resumen,
      });
      html += Seguridad.avisoBloqueo(p);   // bloqueada por seguridad (js/app-seguridad.html)

      // En una línea: cuánto le viene de su área (y sus perfiles) y cuánto es solo suyo
      const porSuArea = modulos().filter((m) => regla(p.correo, m.id) === undefined && deArea(p.area, m.id) !== 'NINGUNO').length;
      const excepciones = excepcionesDe(p).length;
      const susPerfiles = perfilesDe(p.area).map((k) => perfilesPorClave[k].nombre);
      const herencia = total ? '' : '<p class="usr-herencia">' + ico('users') + '<span>' +
        (p.area ? 'Su área <b>' + escaparHtml(p.area) + '</b>' + (susPerfiles.length ? ' (perfiles: ' + susPerfiles.map((n) =>
          '<button type="button" class="usr-enlace" data-usr-perfil="' + escaparHtml(n) + '">' + escaparHtml(n) + '</button>').join(', ') + ')' : '') +
          ' le da ' + plural(porSuArea, 'módulo', 'módulos') : 'Sin área en USUARIOS') +
        (excepciones ? ' · más ' + plural(excepciones, 'excepción propia', 'excepciones propias') : ' · sin excepciones') + '</span></p>';

      const permisos = (aviso ? '<div class="usr-aviso">' + ico(aviso[0]) + '<div>' + aviso[1] + '</div></div>' : '') + herencia +
        listaDePermisos(
          (m) => efectivo(p, m.id) !== 'NINGUNO' || regla(p.correo, m.id) !== undefined,
          (m) => {
            const propio = total ? undefined : regla(p.correo, m.id);
            const reglaArea = p.area ? regla(p.area, m.id) : undefined;
            const porPerfil = perfilesQueDan(perfilesDe(p.area), m.id);
            let origen;
            if (total) origen = '<span class="usr-origen rol">' + ico('shield-check') + ' Por su rol ' + escaparHtml(p.rol) + '</span>';
            else if (propio !== undefined) {
              origen = '<span class="usr-origen excepcion">' + ico('sparkles') + ' Excepción</span>' +
                (p.area ? '<span>su área: ' + PERM_TEXTO[deArea(p.area, m.id)] + '</span>' : '');
            } else if (reglaArea !== undefined) origen = '<span class="usr-origen area">' + ico('users') + ' Por su área</span>';
            else if (porPerfil.length) origen = '<span class="usr-origen area">' + ico('layers') + ' Por su perfil ' + escaparHtml(porPerfil.join(', ')) + '</span>';
            else if (m.padre) {
              origen = '<span class="usr-origen area">' + ico('corner-down-right') + ' ' + (m.hereda === false ? 'No hereda: se da aparte' : 'Hereda de ' + escaparHtml(etiquetaNodo(m.padre))) + '</span>';
            }
            return renglon(m, efectivo(p, m.id), origen, propio !== undefined);
          },
          (id) => efectivo(p, id),
          (id) => !total && (regla(p.correo, id) !== undefined || (!!p.area && regla(p.area, id) !== undefined) ||
            perfilesDe(p.area).some((k) => reglaPerfil(k, id) !== undefined))) +
        tarjetaImplicaciones(implicaciones((id) => efectivo(p, id)));

      const datosHoja = '<div class="card ln-card"><h3>' + ico('id-card') + ' Datos en USUARIOS</h3><div class="info-grid">' +
        [['Nombre', p.nombre], ['Correo', p.correo], ['No. de empleado', p.noEmpleado], ['Rol', p.rol], ['Estatus', p.activo ? 'Activo' : 'Inactivo'],
          ['Área', p.area], ['Coordinación', p.coordinacion], ['Oficina', p.oficina], ['Sede', p.sede], ['Departamentos permitidos', p.dptosPermitidos]]
          .map((d) => itemInfo(d[0], d[1] || '—')).join('') +
        '</div><p class="ln-tenue" style="margin:10px 0 0; font-size:var(--texto-s)">Estos datos se cambian en la hoja USUARIOS.</p></div>';

      return html + Tabs.html([
        { id: 'permisos', titulo: 'Permisos', icono: 'shield-check', contenido: permisos, num: conAcceso(p) },
        { id: 'datos', titulo: 'Datos', icono: 'id-card', contenido: datosHoja },
        pestanaHistorial(p.correo),
      ]);
    }

    // ---------------------------------------------------------------- ficha de área
    function fichaArea(a) {
      const gente = delArea(a.nombre);
      const activas = gente.filter((p) => p.activo);
      const cuenta = (v) => modulos().filter((m) => deArea(a.nombre, m.id) === v).length;
      const resumen = [['Edita', plural(cuenta('EDICION'), 'módulo', 'módulos')], ['Solo ve', plural(cuenta('LECTURA'), 'módulo', 'módulos')],
        ['Con excepciones', plural(activas.filter((p) => excepcionesDe(p).length).length, 'persona', 'personas')]];
      let html = migas() + Ficha.encabezado({
        icono: 'users', titulo: a.nombre,
        chips: '<span class="badge-estado pendiente">Área</span><span class="badge-estado activo">' + plural(activas.length, 'persona activa', 'personas activas') + '</span>',
        botones: '<button type="button" data-usr-editar>' + ico('pencil') + ' Editar permisos</button>',
        resumen: resumen,
      });

      const susPerfiles = perfilesDe(a.nombre).map((k) => perfilesPorClave[k].nombre);
      const tarjetaPerfiles = '<div class="card ln-card usr-perfiles-area"><h3>' + ico('layers') + ' Perfiles' +
        '<button type="button" class="secondary usr-btn-chico" data-usr-asignar>' + ico('pencil') + ' Asignar perfiles</button></h3>' +
        (susPerfiles.length ? '<div class="usr-chips-perfil">' + susPerfiles.map((n) => '<button type="button" class="usr-chip-perfil" data-usr-perfil="' +
          escaparHtml(n) + '">' + ico('layers') + ' ' + escaparHtml(n) + '</button>').join('') + '</div>'
          : '<p class="ln-tenue" style="margin:0">Sin perfiles: solo sus reglas propias.</p>') + '</div>';
      const permisos = '<div class="usr-aviso">' + ico('info') + '<div>Lo que tenga el área (sus perfiles y sus reglas propias, que mandan sobre los perfiles) lo reciben todas sus personas, salvo quien tenga una excepción en ese módulo. ADMIN y SUPER tienen todo por su rol.</div></div>' +
        tarjetaPerfiles +
        listaDePermisos(
          (m) => deArea(a.nombre, m.id) !== 'NINGUNO',
          (m) => {
            const conExc = activas.filter((p) => !tieneTotal(p) && regla(p.correo, m.id) !== undefined);
            const origen = conExc.length
              ? '<button type="button" class="usr-enlace" data-usr-persona="' + escaparHtml(conExc[0].correo) + '" title="' +
                escaparHtml(conExc.map((p) => (p.nombre || p.correo) + ': ' + PERM_TEXTO[regla(p.correo, m.id)]).join('\n')) + '">' +
                ico('sparkles') + ' ' + (conExc.length === 1 ? escaparHtml(conExc[0].nombre || conExc[0].correo) + ' tiene una excepción' : conExc.length + ' personas con excepción') + '</button>'
              : regla(a.nombre, m.id) !== undefined ? (susPerfiles.length ? '<span class="usr-origen excepcion">' + ico('sparkles') + ' Regla del área</span>' : '')
                : perfilesQueDan(perfilesDe(a.nombre), m.id).length
                  ? '<span class="usr-origen area">' + ico('layers') + ' Por su perfil ' + escaparHtml(perfilesQueDan(perfilesDe(a.nombre), m.id).join(', ')) + '</span>'
                  : (m.padre ? '<span class="usr-origen area">' + ico('corner-down-right') + ' ' +
                    (m.hereda === false ? 'No hereda: se da aparte' : 'Hereda de ' + escaparHtml(etiquetaNodo(m.padre))) + '</span>' : '');
            return renglon(m, deArea(a.nombre, m.id), origen, false);
          },
          (id) => deArea(a.nombre, id),
          (id) => regla(a.nombre, id) !== undefined || perfilesDe(a.nombre).some((k) => reglaPerfil(k, id) !== undefined) ||
            activas.some((p) => !tieneTotal(p) && regla(p.correo, id) !== undefined)) +
        tarjetaImplicaciones(implicaciones((id) => deArea(a.nombre, id)));

      const personas = '<div class="card ln-card"><h3>' + ico('users') + ' Personas del área</h3>' + (gente.length
        ? tablaFicha([
          { t: 'Nombre', r: (p) => '<button type="button" class="usr-enlace" data-usr-persona="' + escaparHtml(p.correo) + '">' + escaparHtml(p.nombre || p.correo) + '</button>' },
          { t: 'Rol', r: (p) => escaparHtml(p.rol) },
          { t: 'Estatus', r: (p) => badgeActivo(p.activo) },
          { t: 'Excepciones', r: (p) => { const n = excepcionesDe(p).length; return n ? '<span class="usr-origen excepcion">' + ico('sparkles') + ' ' + n + '</span>' : '—'; } },
        ], gente.slice().sort((x, y) => (y.activo - x.activo) || String(x.nombre).localeCompare(String(y.nombre))))
        : '<p class="empty-state">Nadie tiene esta área.</p>') + '</div>';

      return html + Tabs.html([
        { id: 'permisos', titulo: 'Permisos', icono: 'shield-check', contenido: permisos, num: cuenta('EDICION') + cuenta('LECTURA') },
        { id: 'personas', titulo: 'Personas', icono: 'users', contenido: personas, num: gente.length },
        pestanaHistorial(a.nombre),
      ]);
    }

    // ---------------------------------------------------------------- ficha de perfil
    function fichaPerfil(pf) {
      const k = normal(pf.nombre);
      const areas = pf.areas.map((n) => area(n) || { nombre: n });
      const gente = datos.personas.filter((p) => p.activo && pf.areas.some((a) => normal(a) === normal(p.area)));
      const cuenta = (v) => modulos().filter((m) => dePerfil(k, m.id) === v).length;
      const resumen = [['Edita', plural(cuenta('EDICION'), 'módulo', 'módulos')], ['Solo ve', plural(cuenta('LECTURA'), 'módulo', 'módulos')],
        ['Lo reciben', plural(gente.length, 'persona activa', 'personas activas')]];
      let html = migas() + Ficha.encabezado({
        icono: 'layers', titulo: pf.nombre,
        chips: '<span class="badge-estado pendiente">Perfil</span><span class="badge-estado activo">' + plural(areas.length, 'área', 'áreas') + '</span>' +
          (pf.alcance === 'AREA' ? '<span class="badge-estado pendiente">' + ico('map-pin') + ' Solo lo de su área</span>' : ''),
        botones: '<button type="button" data-usr-editar>' + ico('pencil') + ' Editar permisos</button>' +
          '<button type="button" class="secondary" data-usr-asignar>' + ico('users') + ' Áreas</button>' +
          '<button type="button" class="secondary" data-usr-eliminar-perfil title="Eliminar el perfil">' + ico('trash-2') + '</button>',
        resumen: resumen,
      });

      const permisos = '<div class="usr-aviso">' + ico('info') + '<div>Lo reciben todas las áreas que tienen este perfil (y sus personas). Si un área tiene varios perfiles, gana el más alto; lo que el área o la persona tengan como regla propia manda sobre el perfil.</div></div>' +
        (pf.alcance === 'AREA' ? '<div class="usr-aviso">' + ico('map-pin') + '<div><b>Solo lo de su área.</b> Quien tenga este perfil (aunque sea USER) solo ve los renglones de su área (DPTOS PERMITIDOS o su AREA), y solo en lo que respeta ese límite (Vehículos y Líneas Telefónicas, sin el pasado de la ficha); lo demás se le cierra.</div></div>' : '') +
        listaDePermisos(
          (m) => dePerfil(k, m.id) !== 'NINGUNO',
          (m) => renglon(m, dePerfil(k, m.id), m.padre && reglaPerfil(k, m.id) === undefined ? '<span class="usr-origen area">' + ico('corner-down-right') + ' ' +
            (m.hereda === false ? 'No hereda: se da aparte' : 'Hereda de ' + escaparHtml(etiquetaNodo(m.padre))) + '</span>' : '', false),
          (id) => dePerfil(k, id),
          (id) => reglaPerfil(k, id) !== undefined) +
        tarjetaImplicaciones(implicaciones((id) => dePerfil(k, id)));

      const listaAreas = '<div class="card ln-card"><h3>' + ico('users') + ' Áreas con este perfil' +
        '<button type="button" class="secondary usr-btn-chico" data-usr-asignar>' + ico('pencil') + ' Cambiar</button></h3>' + (areas.length
        ? tablaFicha([
          { t: 'Área', r: (a) => '<button type="button" class="usr-enlace" data-usr-area="' + escaparHtml(a.nombre) + '">' + escaparHtml(a.nombre) + '</button>' },
          { t: 'Personas activas', r: (a) => String(delArea(a.nombre).filter((p) => p.activo).length) },
          { t: 'Otros perfiles', r: (a) => escaparHtml(perfilesDe(a.nombre).filter((x) => x !== k).map((x) => perfilesPorClave[x].nombre).join(', ') || '—') },
        ], areas)
        : '<p class="empty-state">Ninguna área tiene este perfil todavía.</p>') + '</div>';

      return html + Tabs.html([
        { id: 'permisos', titulo: 'Permisos', icono: 'shield-check', contenido: permisos, num: cuenta('EDICION') + cuenta('LECTURA') },
        { id: 'areas', titulo: 'Áreas', icono: 'users', contenido: listaAreas, num: areas.length },
        pestanaHistorial(quienPerfil(pf.nombre)),
      ]);
    }

    // ---------------------------------------------------------------- abrir / cerrar fichas
    function pintarFicha() {
      const detalle = $('usr-detalle');
      if (!fichaActual) {
        detalle.hidden = true;
        detalle.innerHTML = '';
        $('usr-listado').hidden = false;
        tablaActiva().ajustarAlto();
        return;
      }
      if (fichaActual.tipo === 'perfil' && !perfil(fichaActual.id)) { fichaActual = pila.pop() || null; pintarFicha(); return; }   // se eliminó
      const html = fichaActual.tipo === 'area' ? fichaArea(area(fichaActual.id) || { nombre: fichaActual.id, personas: 0 })
        : fichaActual.tipo === 'perfil' ? fichaPerfil(perfil(fichaActual.id)) : fichaPersona(persona(fichaActual.id));
      $('usr-listado').hidden = true;
      detalle.hidden = false;
      detalle.innerHTML = html;
      if (fichaActual.pestana) Tabs.mostrar(detalle, fichaActual.pestana);
      refreshIcons();
      document.getElementById('view-container').scrollTop = 0;
    }
    function abrirFicha(tipo, id, desdeOtraFicha) {
      if (tipo === 'persona' && !persona(id)) return;
      if (desdeOtraFicha && fichaActual) pila.push(fichaActual);
      else pila = [];
      fichaActual = { tipo: tipo, id: id, pestana: 'permisos' };
      pintarFicha();
    }
    function volver() {
      fichaActual = pila.pop() || null;
      pintarFicha();
    }

    // ---------------------------------------------------------------- ventana "Editar permisos"
    /**
     * Ventana ancha a dos columnas (rediseño 14-oct): a la izquierda los grupos (cuántos módulos tienen acceso, si algo
     * cambió); a la derecha los módulos del grupo elegido, con "Todo el grupo" arriba. Cada módulo: su nombre, de dónde
     * le viene en texto ("Su área: Ver", "Excepción · su área: Sin acceso ↺", "Por su perfil X") y los tres niveles
     * (Sin acceso rojo, Ver azul, Editar verde). Elegir lo que ya tendría sin regla propia es no tener regla (valor '');
     * otro nivel es una regla propia (dorada, con ↺). Con acceso, sus pestañas y Exportar van debajo como chips (igual
     * que el módulo → solo ver → oculta). Abajo, lo que implica lo elegido fuera de las pantallas (implicaciones).
     *
     * edicion = { tipo: 'persona' | 'area' | 'perfil', id, p (la persona o null), nombre / original (el perfil),
     *   iniciales: {nodo: valor}, valores: {nodo: valor}, grupo (el que está a la vista) }; valor = la regla propia o ''.
     * La misma ventana asigna perfiles: { tipo: 'asignar', de: 'area' | 'perfil', id, iniciales/valores: {clave: bool} }.
     */
    let edicion = null;

    /** Las capas y los perfiles con los que se resuelve en la ventana (como resolvedor), sin la regla de `sin` */
    function capasVentana(sin) {
      const propia = (x) => (x === sin || edicion.valores[x] === '' || edicion.valores[x] === undefined ? undefined : edicion.valores[x]);
      if (edicion.tipo === 'persona') {
        const p = edicion.p;
        return { capas: [propia, (x) => (p.area ? regla(p.area, x) : undefined)], perfiles: perfilesDe(p.area), tope: soloConsulta(p), limitado: estaLimitado(p) };
      }
      return { capas: [propia], perfiles: edicion.tipo === 'area' ? perfilesDe(edicion.id) : [], tope: false, limitado: false };
    }
    /** Lo que tendría un nodo sin regla propia en la ventana (lo de su área o sus perfiles, o lo que hereda) */
    function heredadoDe(id) {
      const c = capasVentana(id);
      return resolvedor(c.capas, c.perfiles, c.tope, c.limitado)(id);
    }
    /** El nivel que queda en la ventana; a VIEWER, Editar se le queda en Ver (como en efectivo) */
    function nivelEnVentana(id) {
      const c = capasVentana(null);
      return resolvedor(c.capas, c.perfiles, c.tope, c.limitado)(id);
    }
    /** Elegir un nivel: el mismo que ya tendría sin regla (de su área, sus perfiles o heredado) no es regla propia */
    function elegir(id, nivel) {
      edicion.valores[id] = nivel === 'HEREDA' || nivel === heredadoDe(id) ? '' : nivel;
    }
    const textoSinRegla = () => (edicion.tipo === 'persona' ? 'Lo que le da su área' : edicion.tipo === 'area' ? 'Lo que le dan sus perfiles' : 'Sin regla');

    function segmento(actual, heredado, atributos, conHereda, tope) {
      const max = tope ? NIVELES.indexOf(tope) : NIVELES.length;
      return '<div class="usr-segmento" role="radiogroup" ' + atributos + '>' + (conHereda ? ['HEREDA'] : []).concat(NIVELES).map((n) =>
        '<button type="button" role="radio" aria-checked="' + (n === actual) + '" data-nivel="' + n + '"' +
        (NIVELES.indexOf(n) > max ? ' disabled title="No puede tener más que su módulo"' : '') +
        ' class="usr-op ' + n + (n === actual ? ' activa' : '') + (n === heredado ? ' heredada' : '') + '"' +
        (n === heredado ? ' title="' + (conHereda ? 'Lo que tendría sin regla propia' : textoSinRegla()) + '"' : '') + '>' + PERM_TEXTO[n] + '</button>').join('') + '</div>';
    }

    /**
     * De dónde le viene a un nodo lo que tiene en la ventana, en texto (en vez del punto de antes): "Su área: Ver",
     * "Excepción · su área: Sin acceso", "Por su perfil Flotilla", "Regla del área · sus perfiles: Ver". { texto, propia }
     */
    function origenVentana(id) {
      const v = edicion.valores[id];
      const sinRegla = heredadoDe(id);
      if (edicion.tipo === 'persona') {
        const p = edicion.p;
        if (v !== '') return { texto: 'Excepción' + (p.area ? ' · su área: ' + PERM_TEXTO[sinRegla] : ''), propia: true };
        if (p.area && regla(p.area, id) !== undefined) return { texto: 'Su área: ' + PERM_TEXTO[sinRegla] };
        const pf = perfilesQueDan(perfilesDe(p.area), id);
        if (pf.length) return { texto: 'Por su perfil ' + pf.join(', ') };
        return { texto: p.area ? 'Su área no le da acceso' : 'Sin área en USUARIOS' };
      }
      if (edicion.tipo === 'area') {
        const conPerfiles = perfilesDe(edicion.id).length > 0;
        if (v !== '') return { texto: conPerfiles ? 'Regla del área · sus perfiles: ' + PERM_TEXTO[sinRegla] : '', propia: conPerfiles };
        const pf = perfilesQueDan(perfilesDe(edicion.id), id);
        return { texto: pf.length ? 'Por su perfil ' + pf.join(', ') : '' };
      }
      return { texto: '' };
    }

    /**
     * Exportar a Excel de un módulo, como un ícono junto a sus niveles: verde si puede, rojo si se le quitó. Clic: alterna
     * (quitarlo es regla propia; volver a permitirlo la quita). Sin acceso al módulo no cuenta: gris y sin clic.
     */
    function botonExportar(s, nivelMod) {
      if (!s) return '';
      if (nivelMod === 'NINGUNO') return '<span class="usr-exp apagado" title="Exportar a Excel: sin acceso al módulo">' + ico('file-spreadsheet') + '</span>';
      const permitido = nivelEnVentana(s.id) !== 'NINGUNO';
      const propia = edicion.valores[s.id] !== '';
      const texto = 'Exportar a Excel: ' + (permitido ? 'puede exportar' : 'no puede exportar') + (propia ? ' (regla propia)' : '');
      return '<button type="button" class="usr-exp ' + (permitido ? 'permitido' : 'prohibido') + (propia ? ' propia' : '') +
        (edicion.valores[s.id] !== edicion.iniciales[s.id] ? ' cambiada' : '') + '" data-usr-chip="' + s.id + '" aria-pressed="' + permitido +
        '" aria-label="' + texto + '" title="' + texto + '. Clic para cambiar">' + ico(permitido ? 'file-spreadsheet' : 'file-x') + '</button>';
    }

    /** Una pestaña: como un módulo, en chiquito, colgada de él en árbol; nunca pasa de su módulo (los niveles de más se apagan) */
    function filaSeccion(m, s, nivelMod) {
      const v = edicion.valores[s.id];
      const nivel = nivelEnVentana(s.id);
      const propia = v !== '';
      // Con regla propia: qué tendría sin ella (lo del módulo, o lo que diga su área o perfil para esa pestaña)
      const texto = propia ? (edicion.tipo === 'persona' ? 'Excepción' : 'Regla propia') + ' · sin ella: ' + PERM_TEXTO[heredadoDe(s.id)]
        : nivel === nivelMod ? 'Igual que ' + m.etiqueta : origenVentana(s.id).texto;
      return '<div class="usr-sec' + (v !== edicion.iniciales[s.id] ? ' cambiada' : '') + (propia ? ' propia' : '') + '" data-modulo="' + s.id + '">' +
        '<div class="usr-sec-nombre"><span>' + escaparHtml(s.etiqueta) + '</span>' +
        (texto ? '<span class="usr-mod-origen' + (propia ? ' propia' : '') + '">' + escaparHtml(texto) + '</span>' : '') + '</div>' +
        (propia ? '<button type="button" class="usr-restablecer" data-usr-restablecer="' + s.id + '" title="Quitar la regla: igual que ' +
          escaparHtml(m.etiqueta) + '" aria-label="Quitar la regla">' + ico('rotate-ccw') + '</button>' : '') +
        segmento(nivel, null, 'aria-label="' + escaparHtml(m.etiqueta + ' › ' + s.etiqueta) + '"', false, nivelMod) + '</div>';
    }

    /** Un módulo: su nombre, de dónde viene (en texto), Exportar y los tres niveles; con acceso, sus pestañas en árbol debajo */
    function filaModulo(m) {
      const v = edicion.valores[m.id];
      const origen = origenVentana(m.id);
      const nivelMod = nivelEnVentana(m.id);
      const secs = seccionesDe(m);
      const quitable = (edicion.tipo === 'persona' || (edicion.tipo === 'area' && perfilesDe(edicion.id).length)) && v !== '';
      const pestanas = secs.filter((s) => s.id !== m.id + '.exportar');
      const exportar = secs.find((s) => s.id === m.id + '.exportar');
      return '<div class="usr-mod' + (v !== edicion.iniciales[m.id] || secs.some((s) => edicion.valores[s.id] !== edicion.iniciales[s.id]) ? ' cambiada' : '') +
        (origen.propia ? ' excepcion' : '') + (nivelMod === 'NINGUNO' ? ' sin-acceso' : '') + '" data-modulo="' + m.id + '">' +
        '<div class="usr-mod-cab">' + '<span class="usr-mod-ico">' + ico(iconoModulo(m.id)) + '</span>' +
        '<div class="usr-mod-nombre"><span>' + escaparHtml(m.etiqueta) + '</span>' +
        (origen.texto ? '<span class="usr-mod-origen' + (origen.propia ? ' propia' : '') + '">' + (origen.propia ? ico('sparkles') : '') + escaparHtml(origen.texto) + '</span>' : '') + '</div>' +
        (quitable ? '<button type="button" class="usr-restablecer" data-usr-restablecer="' + m.id + '" title="Quitar la regla: ' + textoSinRegla().toLowerCase() + '"' +
          ' aria-label="Quitar la regla">' + ico('rotate-ccw') + '</button>' : '') +
        botonExportar(exportar, nivelMod) +
        segmento(nivelMod, null, 'aria-label="' + escaparHtml(m.etiqueta) + '"') + '</div>' +
        // Las pestañas solo cuentan con acceso al módulo (nunca pasan de él)
        (nivelMod !== 'NINGUNO' && pestanas.length ? '<div class="usr-mod-secs">' + pestanas.map((s) => filaSeccion(m, s, nivelMod)).join('') + '</div>' : '') +
        '</div>';
    }

    /** "Todo el grupo": el mismo nivel a todos sus módulos (y sus pestañas vuelven a ser iguales a su módulo) */
    function filaGrupo(g) {
      const niveles = g.modulos.map((m) => nivelEnVentana(m.id));
      const todos = niveles.every((n) => n === niveles[0]) ? niveles[0] : null;   // si son distintos, ninguno marcado
      return '<div class="usr-editar-grupo">' + ico(g.icono) + '<span class="usr-editar-grupo-nombre">' + escaparHtml(g.etiqueta) + '</span>' +
        '<span class="usr-editar-grupo-todo">Todo el grupo</span>' +
        segmento(todos, null, 'data-usr-grupo="' + g.id + '" aria-label="Todo ' + escaparHtml(g.etiqueta) + '"') + '</div>';
    }

    /** La columna de los grupos: cuántos módulos tienen acceso y si algo cambió */
    function navGrupos() {
      return '<nav class="usr-editor-grupos" aria-label="Grupos de módulos" data-scroll-x>' + datos.grupos.map((g) => {
        const con = g.modulos.filter((m) => nivelEnVentana(m.id) !== 'NINGUNO').length;
        const cambio = g.modulos.some((m) => [m].concat(seccionesDe(m)).some((n) => edicion.valores[n.id] !== edicion.iniciales[n.id]));
        return '<button type="button" class="usr-editor-grupo' + (g.id === edicion.grupo ? ' activa' : '') + (cambio ? ' cambiada' : '') +
          '" data-usr-ir-grupo="' + g.id + '" aria-current="' + (g.id === edicion.grupo) + '">' + ico(g.icono) +
          '<span class="usr-editor-grupo-nombre">' + escaparHtml(g.etiqueta) + '</span>' +
          '<span class="usr-editor-grupo-cuenta">' + con + '/' + g.modulos.length + '</span></button>';
      }).join('') + '</nav>';
    }

    /** Asignar perfiles a un área (o áreas a un perfil): una casilla por cada uno */
    function cuerpoAsignar() {
      const items = edicion.de === 'area'
        ? datos.perfiles.map((pf) => ({ clave: normal(pf.nombre), etiqueta: pf.nombre, detalle: plural(pf.reglas.length, 'regla', 'reglas') }))
        : datos.areas.map((a) => ({ clave: normal(a.nombre), etiqueta: a.nombre, detalle: plural(delArea(a.nombre).filter((p) => p.activo).length, 'persona activa', 'personas activas') }));
      if (!items.length) return '<p class="empty-state">' + (edicion.de === 'area' ? 'Todavía no hay perfiles: créalos en la pestaña Perfiles.' : 'Nadie tiene área en USUARIOS.') + '</p>';
      return '<div class="usr-asignar-lista">' + items.map((it) => {
        const on = !!edicion.valores[it.clave];
        return '<button type="button" class="usr-asignar' + (on ? ' activa' : '') + (on !== !!edicion.iniciales[it.clave] ? ' cambiada' : '') +
          '" data-usr-asignar-item="' + escaparHtml(it.clave) + '" aria-pressed="' + on + '">' + ico(on ? 'square-check' : 'square') +
          '<span class="usr-asignar-nombre">' + escaparHtml(it.etiqueta) + '</span><span class="usr-asignar-detalle">' + escaparHtml(it.detalle) + '</span></button>';
      }).join('') + '</div>';
    }

    function pintarVentana() {
      const cuerpo = $('usr-modal-cuerpo');
      const lista = cuerpo.querySelector('.usr-editor-modulos');
      const scroll = lista ? lista.scrollTop : cuerpo.scrollTop;
      $('usr-modal').querySelector('.modal-card').classList.toggle('usr-modal-editor', edicion.tipo !== 'asignar');
      if (edicion.tipo === 'asignar') cuerpo.innerHTML = cuerpoAsignar();
      else {
        const g = datos.grupos.find((x) => x.id === edicion.grupo) || datos.grupos[0];
        cuerpo.innerHTML = (edicion.tipo === 'perfil'
          ? '<div class="usr-perfil-cab"><label class="usr-perfil-nombre">Nombre del perfil <input type="text" id="usr-perfil-nombre" maxlength="60" autocomplete="off" value="' +
            escaparHtml(edicion.nombre) + '" placeholder="P. ej. Flotilla - consulta"></label>' +
            '<button type="button" class="usr-asignar usr-perfil-alcance' + (edicion.alcance ? ' activa' : '') + (edicion.alcance !== edicion.alcanceInicial ? ' cambiada' : '') +
            '" data-usr-alcance aria-pressed="' + edicion.alcance + '">' + ico(edicion.alcance ? 'square-check' : 'square') +
            '<span class="usr-asignar-nombre">Solo lo de su área</span><span class="usr-asignar-detalle">Quien lo tenga solo ve sus renglones, y solo donde se respeta ese límite</span></button></div>' : '') +
          '<div class="usr-editor">' + navGrupos() +
          '<div class="usr-editor-modulos">' + filaGrupo(g) + '<div class="usr-editar-lista">' + g.modulos.map(filaModulo).join('') + '</div>' +
          tarjetaImplicaciones(implicaciones(nivelEnVentana)) + '</div></div>';
      }
      const nueva = cuerpo.querySelector('.usr-editor-modulos');
      if (nueva) nueva.scrollTop = scroll; else cuerpo.scrollTop = scroll;
      pintarPieVentana();
      refreshIcons();
    }
    function pintarPieVentana() {
      const n = cambiosDeLaVentana().length;
      const sinNombre = edicion.tipo === 'perfil' && !String(edicion.nombre || '').trim();
      const repetido = edicion.tipo === 'perfil' && !sinNombre && perfil(edicion.nombre) && normal(edicion.nombre) !== normal(edicion.original || '');
      $('usr-modal-guardar').disabled = !n || sinNombre || !!repetido;
      $('usr-modal-cuenta').textContent = sinNombre ? 'Ponle un nombre al perfil' : repetido ? 'Ya hay un perfil con ese nombre'
        : n ? plural(n, 'cambio sin guardar', 'cambios sin guardar') : 'Sin cambios';
    }

    function abrirEditar(tipo, id) {
      const p = tipo === 'persona' ? persona(id) : null;
      if (p && tieneTotal(p)) return;
      const pf = tipo === 'perfil' && id ? perfil(id) : null;
      edicion = { tipo: tipo, id: id, p: p, nombre: pf ? pf.nombre : '', original: pf ? pf.nombre : null, iniciales: {}, valores: {}, grupo: null,
        alcance: pf ? pf.alcance === 'AREA' : false, alcanceInicial: pf ? pf.alcance === 'AREA' : false };
      nodos().forEach((m) => {
        let valor;
        if (p) {
          // Una excepción igual a lo que ya le da su área (o sus perfiles) no dice nada: se enseña como sin regla
          const propio = regla(p.correo, m.id);
          valor = propio === undefined || (!m.padre && propio === deArea(p.area, m.id)) ? '' : propio;
        } else if (tipo === 'perfil') {
          valor = pf ? reglaPerfil(normal(pf.nombre), m.id) || '' : '';
        } else {
          valor = regla(id, m.id) || '';
          // Sin perfiles, Sin acceso en un módulo es lo mismo que no tener regla
          if (valor === 'NINGUNO' && !m.padre && !perfilesDe(id).length) valor = '';
        }
        edicion.iniciales[m.id] = valor;
        edicion.valores[m.id] = valor;
      });
      // Se abre en el primer grupo donde tiene algo (o el primero)
      edicion.grupo = (datos.grupos.find((g) => g.modulos.some((m) => nivelEnVentana(m.id) !== 'NINGUNO')) || datos.grupos[0] || {}).id;
      $('usr-modal-titulo').textContent = tipo === 'perfil' ? (pf ? 'Editar perfil' : 'Nuevo perfil') : 'Editar permisos';
      $('usr-modal-sub').textContent = p ? (p.nombre || p.correo) + (p.area ? ' · área ' + p.area : ' · sin área')
        : tipo === 'perfil' ? (pf ? 'Perfil ' + pf.nombre + ' · ' + plural(pf.areas.length, 'área', 'áreas') : 'Un paquete de permisos con nombre que se asigna a áreas')
          : 'Área ' + id + (perfilesDe(id).length ? ' · perfiles: ' + perfilesDe(id).map((k) => perfilesPorClave[k].nombre).join(', ') : '');
      $('usr-modal-regla').textContent = p
        ? 'Lo que no cambies sigue lo de su área (y se mueve si cambia su área). Lo que elijas distinto queda como excepción solo para esta persona.' +
          (soloConsulta(p) ? ' Su rol ' + p.rol + ' solo deja ver: Editar se le queda en Ver.' : '')
        : tipo === 'perfil' ? 'Lo reciben todas las áreas que tienen este perfil (y sus personas), salvo lo que el área o la persona tengan como regla propia.'
          : perfilesDe(id).length ? 'Lo que no cambies sigue lo de sus perfiles. Lo que elijas distinto queda como regla propia del área, para todas sus personas salvo quien tenga una excepción.'
            : 'Aplica a todas las personas del área, salvo quien tenga una excepción en ese módulo.';
      $('usr-modal-leyenda').innerHTML = '<span><span class="usr-exp permitido mini">' + ico('file-spreadsheet') + '</span> Puede exportar a Excel</span>' +
        '<span><span class="usr-exp prohibido mini">' + ico('file-x') + '</span> No puede exportar</span>' +
        '<span>Las pestañas siguen a su módulo y nunca pasan de él</span>' +
        (p || (tipo === 'area' && perfilesDe(id).length) ? '<span>' + ico('rotate-ccw') + ' Quitar la regla propia</span>' : '');
      $('usr-modal-cuerpo').scrollTop = 0;
      pintarVentana();
      $('usr-modal').hidden = false;
      const primero = $('usr-modal-cuerpo').querySelector(tipo === 'perfil' && !pf ? '#usr-perfil-nombre' : '.usr-op.activa');
      if (primero) primero.focus();
    }

    /** La ventana para asignar perfiles a un área (de: 'area') o áreas a un perfil (de: 'perfil') */
    function abrirAsignar(de, id) {
      edicion = { tipo: 'asignar', de: de, id: id, iniciales: {}, valores: {} };
      if (de === 'area') perfilesDe(id).forEach((k) => { edicion.iniciales[k] = true; });
      else (perfil(id) || { areas: [] }).areas.forEach((a) => { edicion.iniciales[normal(a)] = true; });
      edicion.valores = Object.assign({}, edicion.iniciales);
      $('usr-modal-titulo').textContent = de === 'area' ? 'Perfiles del área' : 'Áreas con este perfil';
      $('usr-modal-sub').textContent = de === 'area' ? 'Área ' + id : 'Perfil ' + id;
      $('usr-modal-regla').textContent = de === 'area'
        ? 'Sus personas reciben lo de cada perfil marcado (si dos dan distinto, el más alto), salvo lo que el área o la persona tengan como regla propia.'
        : 'Cada área marcada recibe lo de este perfil, salvo lo que el área o sus personas tengan como regla propia.';
      $('usr-modal-leyenda').innerHTML = '';
      $('usr-modal-cuerpo').scrollTop = 0;
      pintarVentana();
      $('usr-modal').hidden = false;
    }

    function cambiosDeLaVentana() {
      if (edicion.tipo === 'asignar') {
        return Object.keys(Object.assign({}, edicion.iniciales, edicion.valores))
          .filter((k) => !!edicion.valores[k] !== !!edicion.iniciales[k])
          .map((k) => {
            const asignado = edicion.valores[k] ? 'ASIGNADO' : null;
            return edicion.de === 'area'
              ? { quien: edicion.id, modulo: quienPerfil(perfilesPorClave[k].nombre), permiso: asignado }
              : { quien: (area(k) || { nombre: k }).nombre, modulo: quienPerfil(edicion.id), permiso: asignado };
          });
      }
      if (edicion.tipo === 'perfil') {
        const nombre = String(edicion.nombre || '').trim();
        if (!nombre) return [];
        const renombrado = edicion.original && normal(edicion.original) !== normal(nombre);
        const alcance = (q) => (edicion.alcance !== edicion.alcanceInicial || (renombrado && edicion.alcance)
          ? [{ quien: q, modulo: '@alcance', permiso: edicion.alcance ? 'AREA' : null }] : []);
        if (!renombrado) {
          const reglas = Object.keys(edicion.valores).filter((m) => edicion.valores[m] !== edicion.iniciales[m])
            .map((m) => ({ quien: quienPerfil(edicion.original || nombre), modulo: m, permiso: edicion.valores[m] || null }));
          // Un perfil nuevo existe por sus reglas: el alcance solo no lo crea
          return reglas.length || edicion.original ? reglas.concat(alcance(quienPerfil(edicion.original || nombre))) : [];
        }
        // Renombrar: sus reglas y sus asignaciones pasan al nombre nuevo
        const viejo = edicion.original;
        return Object.keys(edicion.iniciales).filter((m) => edicion.iniciales[m] !== '').map((m) => ({ quien: quienPerfil(viejo), modulo: m, permiso: null }))
          .concat(Object.keys(edicion.valores).filter((m) => edicion.valores[m] !== '').map((m) => ({ quien: quienPerfil(nombre), modulo: m, permiso: edicion.valores[m] })))
          .concat(...(perfil(viejo) || { areas: [] }).areas.map((a) => [
            { quien: a, modulo: quienPerfil(viejo), permiso: null }, { quien: a, modulo: quienPerfil(nombre), permiso: 'ASIGNADO' }]))
          .concat(edicion.alcanceInicial ? [{ quien: quienPerfil(viejo), modulo: '@alcance', permiso: null }] : [], alcance(quienPerfil(nombre)));
      }
      return Object.keys(edicion.valores)
        .filter((m) => edicion.valores[m] !== edicion.iniciales[m])
        .map((m) => ({ quien: edicion.tipo === 'persona' ? edicion.p.correo : edicion.id, modulo: m, permiso: edicion.valores[m] || null }));
    }

    /** Un clic en la ventana: un nivel de un módulo, el de todo un grupo, quitar una regla o (asignar) una casilla */
    function alClicVentana(ev) {
      if (ev.target.closest('[data-usr-alcance]')) {
        edicion.alcance = !edicion.alcance;
        pintarVentana();
        const el = $('usr-modal-cuerpo').querySelector('[data-usr-alcance]');
        if (el) el.focus();
        return;
      }
      const casilla = ev.target.closest('[data-usr-asignar-item]');
      if (casilla) {
        const k = casilla.dataset.usrAsignarItem;
        edicion.valores[k] = !edicion.valores[k];
        pintarVentana();
        const el = $('usr-modal-cuerpo').querySelector('[data-usr-asignar-item="' + CSS.escape(k) + '"]');
        if (el) el.focus();
        return;
      }
      const irGrupo = ev.target.closest('[data-usr-ir-grupo]');
      if (irGrupo) {
        edicion.grupo = irGrupo.dataset.usrIrGrupo;
        pintarVentana();
        const lista = $('usr-modal-cuerpo').querySelector('.usr-editor-modulos');
        if (lista) lista.scrollTop = 0;
        const el = $('usr-modal-cuerpo').querySelector('[data-usr-ir-grupo="' + edicion.grupo + '"]');
        if (el) el.focus();
        return;
      }
      // Exportar: puede (igual que el módulo) ↔ no puede
      const chip = ev.target.closest('[data-usr-chip]');
      if (chip) {
        const id = chip.dataset.usrChip;
        const nivelMod = nivelEnVentana(padreDe(id));
        const ef = nivelEnVentana(id);
        const binario = /\.exportar$/.test(id) || nivelMod === 'LECTURA';
        elegir(id, ef === nivelMod ? (binario ? 'NINGUNO' : 'LECTURA') : ef === 'LECTURA' ? 'NINGUNO' : nivelMod);
        pintarVentana();
        const el = $('usr-modal-cuerpo').querySelector('[data-usr-chip="' + id + '"]');
        if (el) el.focus();
        return;
      }
      const reset = ev.target.closest('[data-usr-restablecer]');
      const op = ev.target.closest('.usr-op');
      if (!reset && !op) return;
      let enfocar;
      if (reset) {
        edicion.valores[reset.dataset.usrRestablecer] = '';
        enfocar = '[data-modulo="' + reset.dataset.usrRestablecer + '"] .usr-op.activa';
      } else {
        const grupo = op.closest('[data-usr-grupo]');
        const nivel = op.dataset.nivel;
        if (grupo) {
          // Todo el grupo: el nivel en cada módulo, y sus secciones vuelven a heredar
          (datos.grupos.find((g) => g.id === grupo.dataset.usrGrupo) || { modulos: [] }).modulos.forEach((m) => {
            seccionesDe(m).forEach((s) => { edicion.valores[s.id] = ''; });
            elegir(m.id, nivel);
          });
          enfocar = '[data-usr-grupo="' + grupo.dataset.usrGrupo + '"] [data-nivel="' + nivel + '"]';
        } else {
          const m = op.closest('[data-modulo]').dataset.modulo;
          elegir(m, nivel);
          enfocar = '[data-modulo="' + m + '"] [data-nivel="' + nivel + '"]';
        }
      }
      pintarVentana();
      const el = $('usr-modal-cuerpo').querySelector(enfocar);
      if (el) el.focus();
    }

    function cerrarEditar() {
      $('usr-modal').hidden = true;
      edicion = null;
    }

    /** Manda cambios a apiPermisosGuardar y vuelve a pintar todo con lo que regresa (el panel completo) */
    /** Después de bloquear o desbloquear a alguien (Seguridad): los datos de nuevo, la lista y la ficha */
    async function recargarPanel() {
      cargar(await callServer('apiPermisosPanel', state.token));
      refrescarListado();
      pintarFicha();
    }

    async function guardarCambios(cambios, alTerminar) {
      toastCargando('Guardando permisos…');
      cargar(await callServer('apiPermisosGuardar', state.token, cambios));
      if (alTerminar) alTerminar();
      refrescarListado();
      pintarFicha();
      toastExito('Permisos guardados: ' + plural(cambios.length, 'cambio', 'cambios'));
      // Si alguien se cambió a sí mismo, su menú se pone al día
      callServer('apiMisPermisos', state.token).then((info) => { state.permisos = (info && info.permisos) || {}; renderNavGrupos(); }).catch(() => {});
    }

    async function guardarEdicion() {
      const cambios = cambiosDeLaVentana();
      if (!cambios.length) return;
      const boton = $('usr-modal-guardar');
      boton.disabled = true;
      // Un perfil renombrado o nuevo: su ficha sigue abierta con el nombre que quedó
      const nombrePerfil = edicion.tipo === 'perfil' ? String(edicion.nombre).trim() : null;
      try {
        await guardarCambios(cambios, () => {
          cerrarEditar();
          if (nombrePerfil && fichaActual && fichaActual.tipo === 'perfil') fichaActual.id = nombrePerfil;
        });
      } catch (err) {
        toastError('No se guardaron: ' + err.message);
        boton.disabled = false;
      }
    }

    /** Eliminar un perfil: sus reglas y sus asignaciones (las áreas se quedan con sus reglas propias) */
    async function eliminarPerfil(nombre) {
      const pf = perfil(nombre);
      if (!pf) return;
      const ok = await Confirmar.pedir({
        titulo: '¿Eliminar el perfil ' + pf.nombre + '?',
        mensaje: pf.areas.length ? 'Estas áreas dejan de recibir lo que da (se quedan con sus reglas propias):' : 'No está asignado a ninguna área.',
        detalle: pf.areas, textoConfirmar: 'Eliminar perfil', peligro: true,
      });
      if (!ok) return;
      const cambios = Object.keys(pf.reglas).map((m) => ({ quien: quienPerfil(pf.nombre), modulo: m, permiso: null }))
        .concat(pf.areas.map((a) => ({ quien: a, modulo: quienPerfil(pf.nombre), permiso: null })))
        .concat(pf.alcance === 'AREA' ? [{ quien: quienPerfil(pf.nombre), modulo: '@alcance', permiso: null }] : []);
      try {
        await guardarCambios(cambios, () => { if (fichaActual && fichaActual.tipo === 'perfil') fichaActual = pila.pop() || null; });
      } catch (err) {
        toastError('No se eliminó: ' + err.message);
      }
    }

    // ---------------------------------------------------------------- matriz por área / por perfil
    /**
     * Módulos y secciones (renglones, por grupo) contra áreas o perfiles (columnas; "Por área" / "Por perfil"). Un
     * clic en una celda pasa al siguiente nivel; nada se guarda hasta "Guardar", que manda todos los cambios juntos
     * (también los del otro modo). En una sección, o en un área que tiene perfiles, el ciclo pasa además por Hereda
     * (sin regla propia: lo de sus perfiles o de su módulo); en lo demás, Sin acceso es no tener regla. Las
     * excepciones de cada persona se respetan (la celda de un área lleva un punto dorado si alguien tiene una).
     */
    const ICONO_CELDA = { NINGUNO: 'minus', LECTURA: 'eye', EDICION: 'pencil' };
    const SIGUIENTE_NIVEL = { NINGUNO: 'LECTURA', LECTURA: 'EDICION', EDICION: 'NINGUNO' };
    const SIGUIENTE_CON_HEREDA = { HEREDA: 'NINGUNO', NINGUNO: 'LECTURA', LECTURA: 'EDICION', EDICION: 'HEREDA' };
    let pendientesMatriz = {};   // 'quien|nodo' → nivel elegido ('HEREDA' = sin regla); quien = área o 'perfil:Nombre'
    let todasLasSecciones = false;   // "Ver todas las secciones"; si no, solo las que tienen alguna regla o un cambio
    let modoMatriz = 'areas';        // 'areas' | 'perfiles'
    const llaveCelda = (quien, modulo) => quien + '|' + modulo;
    const esQuienPerfil = (quien) => /^perfil:/i.test(quien);
    const nombreDeQuien = (quien) => String(quien).replace(/^perfil:/i, '');
    /** La regla que tiene en la hoja ese renglón (área o perfil) en ese nodo */
    const reglaDe = (quien, id) => (esQuienPerfil(quien) ? reglaPerfil(normal(nombreDeQuien(quien)), id) : regla(quien, id));
    const perfilesDeColumna = (quien) => (esQuienPerfil(quien) ? [] : perfilesDe(quien));
    /** ¿La celda tiene el estado Hereda? En una sección siempre; en un módulo, si el área tiene perfiles */
    const conHereda = (quien, id) => !!padreDe(id) || perfilesDeColumna(quien).length > 0;
    /** Lo que dice la hoja para la celda: la regla, HEREDA (sin regla, si la celda lo tiene) o NINGUNO */
    const enHoja = (quien, id) => reglaDe(quien, id) || (conHereda(quien, id) ? 'HEREDA' : 'NINGUNO');
    const nivelEnMatriz = (quien, modulo) => {
      const k = llaveCelda(quien, modulo);
      return k in pendientesMatriz ? pendientesMatriz[k] : enHoja(quien, modulo);
    };
    /** Con lo que hay en la matriz, el nivel que de verdad queda (con sus perfiles y la herencia de su módulo) */
    function nivelResueltoEnMatriz(quien, id) {
      const propia = (x) => {
        const v = nivelEnMatriz(quien, x);
        return v === 'HEREDA' ? undefined : v;
      };
      return resolvedor([propia], perfilesDeColumna(quien), false, !esQuienPerfil(quien) && perfilesDe(quien).some(perfilLimita))(id);
    }
    const columnasMatriz = () => (modoMatriz === 'perfiles'
      ? datos.perfiles.map((pf) => ({ quien: quienPerfil(pf.nombre), etiqueta: pf.nombre,
        titulo: 'Perfil ' + pf.nombre + ' · ' + plural(pf.areas.length, 'área', 'áreas') + '. Clic para abrir el perfil', abrir: 'data-usr-perfil' }))
      : datos.areas.map((a) => ({ quien: a.nombre, etiqueta: a.nombre,
        titulo: a.nombre + ' · ' + plural(delArea(a.nombre).filter((p) => p.activo).length, 'persona activa', 'personas activas') + '. Clic para abrir el área',
        abrir: 'data-usr-area' })));

    function celdaMatriz(col, m) {
      const quien = col.quien;
      const n = nivelEnMatriz(quien, m.id);
      const antes = enHoja(quien, m.id);
      const resuelto = nivelResueltoEnMatriz(quien, m.id);
      const conExc = esQuienPerfil(quien) ? [] : delArea(quien).filter((p) => p.activo && !tieneTotal(p) && regla(p.correo, m.id) !== undefined);
      const titulo = col.etiqueta + ' · ' + etiquetaNodo(m.id) + ': ' + (n === 'HEREDA' ? 'Hereda (' + PERM_TEXTO[resuelto] + ')' : PERM_TEXTO[n]) +
        (n !== antes ? ' (antes: ' + PERM_TEXTO[antes] + ')' : '') +
        (conExc.length ? '\nCon excepción: ' + conExc.map((p) => (p.nombre || p.correo) + ' (' + PERM_TEXTO[regla(p.correo, m.id)] + ')').join(', ') : '') +
        '\nClic para cambiar';
      return '<button type="button" class="usr-celda ' + resuelto + (n === 'HEREDA' ? ' heredada' : '') + (n !== antes ? ' cambiada' : '') + (conExc.length ? ' con-excepcion' : '') + '"' +
        ' data-celda-area="' + escaparHtml(quien) + '" data-celda-modulo="' + m.id + '"' +
        ' title="' + escaparHtml(titulo) + '" aria-label="' + escaparHtml(titulo) + '">' + Iconos.svg(ICONO_CELDA[resuelto]) + '</button>';
    }

    function cambiosDeLaMatriz() {
      return Object.keys(pendientesMatriz).map((k) => {
        const i = k.lastIndexOf('|');
        return { quien: k.slice(0, i), modulo: k.slice(i + 1), nivel: pendientesMatriz[k] };
      })
        .filter((c) => c.nivel !== enHoja(c.quien, c.modulo))
        .map((c) => ({ quien: c.quien, modulo: c.modulo,
          permiso: c.nivel === 'HEREDA' || (c.nivel === 'NINGUNO' && !conHereda(c.quien, c.modulo)) ? null : c.nivel }));
    }

    function pintarCuentaMatriz() {
      const n = cambiosDeLaMatriz().length;
      const cuenta = $('usr-matriz-cuenta');
      cuenta.textContent = n ? plural(n, 'cambio sin guardar', 'cambios sin guardar') : 'Clic en una celda para cambiarla';
      cuenta.classList.toggle('con-cambios', !!n);
      $('usr-matriz-guardar').disabled = !n;
      $('usr-matriz-descartar').hidden = !n;
    }

    function pintarMatriz() {
      const caja = $('usr-matriz');
      $('usr-matriz-modo').querySelectorAll('[data-modo]').forEach((b) => {
        b.classList.toggle('activa', b.dataset.modo === modoMatriz);
        b.setAttribute('aria-pressed', String(b.dataset.modo === modoMatriz));
      });
      const cols = columnasMatriz();
      if (!cols.length) {
        caja.innerHTML = '<p class="empty-state">' + (modoMatriz === 'perfiles' ? 'Todavía no hay perfiles: créalos en la pestaña Perfiles.' : 'Nadie tiene área en USUARIOS.') + '</p>';
        pintarCuentaMatriz();
        return;
      }
      const arriba = caja.scrollTop;
      const izquierda = caja.scrollLeft;
      // Una sección con alguna regla (o un cambio sin guardar) siempre se ve; las demás, con el botón
      const conRegla = (id) => cols.some((c) => reglaDe(c.quien, id) !== undefined || llaveCelda(c.quien, id) in pendientesMatriz);
      caja.innerHTML = '<table class="usr-matriz' + (todasLasSecciones ? '' : ' solo-con-regla') + '"><thead><tr><th class="usr-matriz-mod">Módulo</th>' +
        cols.map((c) => '<th><button type="button" class="usr-matriz-area" ' + c.abrir + '="' + escaparHtml(c.abrir === 'data-usr-perfil' ? c.etiqueta : c.quien) + '"' +
          ' title="' + escaparHtml(c.titulo) + '">' + escaparHtml(c.etiqueta) + '</button></th>').join('') + '</tr></thead><tbody>' +
        datos.grupos.map((g) => '<tr class="usr-matriz-grupo"><th class="usr-matriz-mod">' + escaparHtml(g.etiqueta) + '</th><td colspan="' + cols.length + '"></td></tr>' +
          g.modulos.map((m) => [m].concat(seccionesDe(m).map((s) => Object.assign({ padre: m.id }, s))).map((n) =>
            '<tr' + (n.padre ? ' class="usr-matriz-seccion' + (conRegla(n.id) ? ' con-regla' : '') + '"' : '') + '><th class="usr-matriz-mod">' + Iconos.svg(iconoModulo(n.id)) + escaparHtml(n.etiqueta) + '</th>' +
            cols.map((c) => '<td>' + celdaMatriz(c, n) + '</td>').join('') + '</tr>').join('')).join('')).join('') +
        '</tbody></table>';
      caja.scrollTop = arriba;
      caja.scrollLeft = izquierda;
      pintarCuentaMatriz();
    }

    function alClicMatriz(ev) {
      const celda = ev.target.closest('[data-celda-modulo]');
      if (celda) {
        const quien = celda.dataset.celdaArea;
        const col = columnasMatriz().find((c) => c.quien === quien);
        const m = nodo(celda.dataset.celdaModulo);
        if (!col || !m) return;
        const k = llaveCelda(quien, m.id);
        const nuevo = (conHereda(quien, m.id) ? SIGUIENTE_CON_HEREDA : SIGUIENTE_NIVEL)[nivelEnMatriz(quien, m.id)];
        if (nuevo === enHoja(quien, m.id)) delete pendientesMatriz[k];
        else pendientesMatriz[k] = nuevo;
        const selector = '[data-celda-area="' + CSS.escape(quien) + '"][data-celda-modulo="' + m.id + '"]';
        // Un módulo cambia lo que heredan sus secciones: se repinta la tabla; una sección, solo su celda
        if (!m.padre) { pintarMatriz(); const el = $('usr-matriz').querySelector(selector); if (el) el.focus(); return; }
        celda.parentNode.innerHTML = celdaMatriz(col, m);   // solo esa celda: la tabla no salta
        const otra = $('usr-matriz').querySelector(selector);
        if (otra) otra.focus();
        pintarCuentaMatriz();
        return;
      }
      const encabezadoArea = ev.target.closest('[data-usr-area]');
      if (encabezadoArea) { abrirFicha('area', encabezadoArea.dataset.usrArea); return; }
      const dePerfilBtn = ev.target.closest('[data-usr-perfil]');
      if (dePerfilBtn) abrirFicha('perfil', dePerfilBtn.dataset.usrPerfil);
    }

    async function guardarMatriz() {
      const cambios = cambiosDeLaMatriz();
      if (!cambios.length) return;
      const boton = $('usr-matriz-guardar');
      boton.disabled = true;
      try {
        await guardarCambios(cambios, () => { pendientesMatriz = {}; });
      } catch (err) {
        toastError('No se guardaron: ' + err.message);
        boton.disabled = false;
      }
    }

    // ---------------------------------------------------------------- listado: tablas y KPIs
    const filaPersona = (p) => ({
      ID: p.correo, NOMBRE: p.nombre || p.correo, CORREO: p.correo, AREA: p.area || 'Sin área', ROL: p.rol,
      ESTATUS: p.activo ? 'Activo' : 'Inactivo', BLOQUEO: p.bloqueo ? 'Bloqueada' : '', MODULOS: conAcceso(p), EXCEPCIONES: excepcionesDe(p).length,
      COORDINACION: p.coordinacion, OFICINA: p.oficina, SEDE: p.sede, NO_EMPLEADO: p.noEmpleado,
    });
    const filaArea = (a) => {
      const activas = delArea(a.nombre).filter((p) => p.activo);
      return {
        ID: a.nombre, AREA: a.nombre, PERSONAS: activas.length,
        EDITA: modulos().filter((m) => deArea(a.nombre, m.id) === 'EDICION').length,
        VE: modulos().filter((m) => deArea(a.nombre, m.id) === 'LECTURA').length,
        EXCEPCIONES: activas.filter((p) => excepcionesDe(p).length).length,
      };
    };
    const conteo = (v, cero) => (v ? String(v) : (cero || '—'));

    const tablaPersonas = DataTable.crear($('usr-tabla-personas'), {
      idCampo: 'ID',
      idTabla: 'usuarios-personas',
      textoVacio: 'No hay personas en USUARIOS',
      exportar: { nombreArchivo: 'Usuarios y permisos - personas' },
      etiquetaFila: (f) => f.NOMBRE,
      detalle: false,
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (f) => abrirFicha('persona', f.ID),
      alTocarFila: (f) => abrirFicha('persona', f.ID),
      alCambiarFiltros: (filtros) => marcarKpis(filtros),
      ordenInicial: { campo: 'NOMBRE', dir: 'asc' },
      columnas: [
        { campo: 'NOMBRE', titulo: 'Nombre', tipo: 'texto', fijada: true,
          render: (v, f) => '<span class="usr-nombre">' + Avatar.html(f.CORREO, v, { tam: 26 }) + escaparHtml(v) + '</span>' },
        { campo: 'AREA', titulo: 'Área', tipo: 'lista' },
        { campo: 'ROL', titulo: 'Rol', tipo: 'lista', render: (v) => badgeRol(v) || escaparHtml(v) },
        { campo: 'ESTATUS', titulo: 'Estatus', tipo: 'lista', render: (v, f) => badgeActivo(v === 'Activo') +
          (f.BLOQUEO ? ' <span class="seg-insignia seg-mal" title="Bloqueada por seguridad">Bloqueada</span>' : '') },
        { campo: 'MODULOS', titulo: 'Módulos', tipo: 'numero', render: (v) => conteo(v, 'Ninguno') },
        { campo: 'EXCEPCIONES', titulo: 'Excepciones', tipo: 'numero',
          render: (v) => (v ? '<span class="usr-origen excepcion">' + ico('sparkles') + ' ' + v + '</span>' : '—') },
        { campo: 'CORREO', titulo: 'Correo', tipo: 'texto', visible: false },
        { campo: 'COORDINACION', titulo: 'Coordinación', tipo: 'lista', visible: false },
        { campo: 'OFICINA', titulo: 'Oficina', tipo: 'lista', visible: false },
        { campo: 'SEDE', titulo: 'Sede', tipo: 'lista', visible: false },
        { campo: 'NO_EMPLEADO', titulo: 'No. de empleado', tipo: 'texto', visible: false },
      ],
      accionesFila: [
        { icono: 'eye', titulo: 'Ver ficha', alHacer: (f) => abrirFicha('persona', f.ID) },
        { icono: 'pencil', titulo: 'Editar permisos', visible: (f) => !tieneTotal(persona(f.ID)), alHacer: (f) => abrirEditar('persona', f.ID) },
      ],
    });

    const tablaAreas = DataTable.crear($('usr-tabla-areas'), {
      idCampo: 'ID',
      idTabla: 'usuarios-areas',
      textoVacio: 'Nadie tiene área en USUARIOS',
      exportar: { nombreArchivo: 'Usuarios y permisos - areas' },
      etiquetaFila: (f) => f.AREA,
      detalle: false,
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (f) => abrirFicha('area', f.ID),
      alTocarFila: (f) => abrirFicha('area', f.ID),
      ordenInicial: { campo: 'AREA', dir: 'asc' },
      columnas: [
        { campo: 'AREA', titulo: 'Área', tipo: 'texto', fijada: true },
        { campo: 'PERSONAS', titulo: 'Personas activas', tipo: 'numero' },
        { campo: 'EDITA', titulo: 'Edita', tipo: 'numero', render: (v) => (v ? plural(v, 'módulo', 'módulos') : '—') },
        { campo: 'VE', titulo: 'Solo ve', tipo: 'numero', render: (v) => (v ? plural(v, 'módulo', 'módulos') : '—') },
        { campo: 'EXCEPCIONES', titulo: 'Personas con excepciones', tipo: 'numero',
          render: (v) => (v ? '<span class="usr-origen excepcion">' + ico('sparkles') + ' ' + v + '</span>' : '—') },
      ],
      accionesFila: [
        { icono: 'eye', titulo: 'Ver ficha', alHacer: (f) => abrirFicha('area', f.ID) },
        { icono: 'pencil', titulo: 'Editar permisos', alHacer: (f) => abrirEditar('area', f.ID) },
      ],
    });

    const filaHistorial = (h, i) => {
      const dePersona = esDePersona(h);
      const p = dePersona ? persona(h.quien) : null;
      return {
        ID: i, FECHA: h.fecha, HORA: Formato.hora(h.fecha),
        QUIEN: h.quien, A_QUIEN: p ? (p.nombre || p.correo) : esDePerfil(h) ? 'Perfil ' + h.quien.replace(/^perfil:/i, '') : h.quien,
        TIPO: dePersona ? 'Persona' : esDePerfil(h) ? 'Perfil' : 'Área',
        MODULO: etiquetaModulo(h.modulo), ANTES: textoHistorial(h.antes, dePersona, h.modulo), DESPUES: textoHistorial(h.despues, dePersona, h.modulo),
        CAMBIO: cambioHistorial(h), LO_CAMBIO: h.nombre || h.correo || '—',
      };
    };
    const tablaHistorial = DataTable.crear($('usr-tabla-historial'), {
      idCampo: 'ID',
      idTabla: 'usuarios-historial',
      textoVacio: 'Todavía no hay cambios: aquí aparece cada permiso que se cambie desde esta pantalla.',
      exportar: { nombreArchivo: 'Usuarios y permisos - historial' },
      etiquetaFila: (f) => f.A_QUIEN + ' · ' + f.MODULO,
      detalle: false,
      alAbrirFila: (f) => abrirDesdeHistorial(f),
      alTocarFila: (f) => abrirDesdeHistorial(f),
      columnas: [
        { campo: 'FECHA', titulo: 'Fecha', tipo: 'fecha' },
        { campo: 'HORA', titulo: 'Hora', tipo: 'texto' },
        { campo: 'A_QUIEN', titulo: 'A quién', tipo: 'texto', fijada: true },
        { campo: 'TIPO', titulo: 'Persona o área', tipo: 'lista' },
        { campo: 'MODULO', titulo: 'Módulo', tipo: 'lista' },
        { campo: 'CAMBIO', titulo: 'Cambio', tipo: 'texto', render: (v) => v, exportable: false, filtrable: false, ordenable: false },
        { campo: 'ANTES', titulo: 'Antes', tipo: 'lista', visible: false },
        { campo: 'DESPUES', titulo: 'Después', tipo: 'lista', visible: false },
        { campo: 'LO_CAMBIO', titulo: 'Lo cambió', tipo: 'lista' },
      ],
      accionesFila: [
        { icono: 'eye', titulo: 'Ver ficha', alHacer: (f) => abrirDesdeHistorial(f) },
      ],
    });
    function abrirDesdeHistorial(f) {
      if (f.TIPO === 'Persona') abrirFicha('persona', f.QUIEN);
      else if (f.TIPO === 'Perfil') abrirFicha('perfil', f.QUIEN.replace(/^perfil:/i, ''));
      else abrirFicha('area', f.QUIEN);
    }

    const filaPerfil = (pf) => ({
      ID: pf.nombre, NOMBRE: pf.nombre, REGLAS: pf.reglas.length, AREAS: pf.areas.join(', ') || '—', ALCANCE: pf.alcance === 'AREA' ? 'Solo su área' : 'Todo',
      PERSONAS: datos.personas.filter((p) => p.activo && pf.areas.some((a) => normal(a) === normal(p.area))).length,
    });
    const tablaPerfiles = DataTable.crear($('usr-tabla-perfiles'), {
      idCampo: 'ID',
      idTabla: 'usuarios-perfiles',
      textoVacio: 'Todavía no hay perfiles. Un perfil es un paquete de permisos con nombre que se asigna a áreas: créalo con "Nuevo perfil".',
      exportar: { nombreArchivo: 'Usuarios y permisos - perfiles' },
      etiquetaFila: (f) => f.NOMBRE,
      detalle: false,
      modoSeleccion: true,
      seleccionDrive: true,
      alAbrirFila: (f) => abrirFicha('perfil', f.ID),
      alTocarFila: (f) => abrirFicha('perfil', f.ID),
      ordenInicial: { campo: 'NOMBRE', dir: 'asc' },
      columnas: [
        { campo: 'NOMBRE', titulo: 'Perfil', tipo: 'texto', fijada: true },
        { campo: 'REGLAS', titulo: 'Reglas', tipo: 'numero' },
        { campo: 'AREAS', titulo: 'Áreas', tipo: 'texto' },
        { campo: 'ALCANCE', titulo: 'Alcance', tipo: 'lista' },
        { campo: 'PERSONAS', titulo: 'Personas activas', tipo: 'numero' },
      ],
      accionesFila: [
        { icono: 'eye', titulo: 'Ver ficha', alHacer: (f) => abrirFicha('perfil', f.ID) },
        { icono: 'pencil', titulo: 'Editar permisos', alHacer: (f) => abrirEditar('perfil', f.ID) },
      ],
    });

    const tablaActiva = () => {
      const pestana = Tabs.actual($('usr-listado'));
