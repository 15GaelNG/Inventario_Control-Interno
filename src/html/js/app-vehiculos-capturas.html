<script>
  /**
   * app-vehiculos-capturas.html — Vehículos: agregar y editar desde la ficha: verificación, incidencia, sensor, holograma e inspección.
   * Parte de initVehiculos (fase 6.1b, tools/app/partir-vehiculos.js), que la monta: lo del arranque sale de T y
   * lo de otras partes, de T.de('parte') (se busca al llamar). Lo que publica es lo que usan las demás.
   */
  Vehiculos.registrar('capturas', (T) => {
    const { abrirFichaVehiculo } = T.de('ficha');

    // ---------- Captura de verificación/sensor/holograma/incidencia/inspección desde la
    // ficha ----------
    // Mismo "formato de captura" que Líneas Telefónicas (ln-captura-*): un modal con ícono,
    // tipo, título y cuerpo scrollable. El folio ya se sabe (es el de la ficha abierta y
    // queda en el subtítulo del modal), así que aquí no hay paso de "buscar vehículo" como
    // en el formulario propio de cada módulo.
    function abrirCapturaVehiculo(icono, tipo, titulo, subtitulo) {
      document.getElementById('veh-captura-icono').innerHTML = Iconos.svg(icono);
      document.getElementById('veh-captura-tipo').textContent = tipo;
      document.getElementById('veh-captura-titulo').textContent = titulo;
      document.getElementById('veh-captura-subtitulo').textContent = subtitulo || '';
      const cuerpo = document.getElementById('veh-captura-cuerpo');
      cuerpo.innerHTML = '';
      // La insignia "Calificación" solo la usa Inspección -- de las 5 capturas que
      // comparten este modal, es la única con checklist calificable. Se oculta aquí
      // por si la captura anterior fue una inspección; abrirAgregarInspeccion (vía
      // prepararCaptura) la vuelve a destapar.
      document.getElementById('ins-calif-badge').hidden = true;
      document.getElementById('veh-modal-captura').hidden = false;
      refreshIcons();
      return cuerpo;
    }
    function cerrarCapturaVehiculo() {
      document.getElementById('veh-modal-captura').hidden = true;
      document.getElementById('veh-captura-cuerpo').innerHTML = '';
    }

    function abrirAgregarVerificacion(vResumen) {
      const cuerpo = abrirCapturaVehiculo('clipboard-check', 'VERIFICACIÓN', 'Nueva verificación', 'Folio ' + vResumen.FOLIO);
      Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'FECHA_VERIFICACION', etiqueta: 'Fecha de verificación', tipo: 'fecha', requerido: true, valor: hoyLocal() },
          { id: 'FECHA_PROXIMA', etiqueta: 'Próxima verificación', tipo: 'fecha', requerido: true,
            ayuda: 'Debe ser posterior a la fecha de verificación' },
          { id: 'COMPROBANTE', etiqueta: 'Comprobante', tipo: 'archivo', acepta: 'image/png,image/jpeg',
            maxMB: 10, requerido: true, vistaPrevia: true, ayuda: 'Foto o captura del comprobante (PNG o JPG)' },
        ],
        alValidar: (v) => (v.FECHA_PROXIMA && v.FECHA_VERIFICACION && v.FECHA_PROXIMA <= v.FECHA_VERIFICACION
          ? { FECHA_PROXIMA: 'Debe ser posterior a la fecha de verificación' } : null),
        textoGuardar: 'Registrar verificación', iconoGuardar: 'save',
        alGuardar: async (valores, archivos) => {
          await callServer('apiRegistrarVerificacion', state.token, Object.assign({ ID_VEHICULO: vResumen.ID_VEHICULO, FOLIO: vResumen.FOLIO }, valores), {
            base64: await leerArchivoBase64(archivos.COMPROBANTE), mimeType: archivos.COMPROBANTE.type,
          });
        },
        textoExito: () => 'Verificación registrada',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'verificaciones'); },
      });
    }

    function abrirAgregarIncidencia(vResumen, completo) {
      const cuerpo = abrirCapturaVehiculo('wrench', 'INCIDENCIA', 'Nueva incidencia', 'Folio ' + vResumen.FOLIO);
      Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'DEPARTAMENTO', etiqueta: 'Departamento', valor: completo['DEPARTAMENTO'] || '' },
          { id: 'MODELO', etiqueta: 'Modelo', valor: completo['LINEA VEHICULO'] || '' },
          { id: 'ANIO', etiqueta: 'Año', tipo: 'numero', valor: completo['MODELO'] || '' },
          { id: 'FECHA_INSPECCION', etiqueta: 'Fecha de inspección', tipo: 'fecha', valor: hoyLocal() },
          { id: 'KILOMETRAJE', etiqueta: 'Kilometraje', tipo: 'numero', min: 0 },
          { id: 'TICKET', etiqueta: 'Ticket' },
          { id: 'PERIODO_VERIFICACION', etiqueta: 'Periodo de verificación' },
          { id: 'SEGURO_AUTO', etiqueta: 'Seguro de auto' },
          { id: 'INSPECCION_INGRESO', etiqueta: 'Motivo', tipo: 'parrafo', requerido: true },
        ],
        textoGuardar: 'Registrar incidencia', iconoGuardar: 'save',
        alGuardar: async (valores) => {
          await callServer('apiCrearIncidencia', state.token, Object.assign({ ID_VEHICULO: vResumen.ID_VEHICULO, FOLIO: vResumen.FOLIO }, valores));
        },
        textoExito: () => 'Incidencia registrada',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'incidencias'); },
      });
    }

    async function abrirAgregarSensor(vResumen) {
      const cuerpo = abrirCapturaVehiculo('radio', 'SENSOR', 'Instalar sensor', 'Folio ' + vResumen.FOLIO);
      cuerpo.innerHTML = '<p class="empty-state"><span class="spinner"></span> Cargando…</p>';
      let datos;
      try {
        datos = await callServer('apiDatosVehiculoParaSensor', state.token, vResumen.ID_VEHICULO || vResumen.FOLIO);
      } catch (err) {
        cuerpo.innerHTML = '<p class="error-msg">No se pudo cargar: ' + escaparHtml(err.message) + '</p>';
        return;
      }
      if (document.getElementById('veh-modal-captura').hidden) return; // se cerró mientras cargaba
      cuerpo.innerHTML = '';
      const form = Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'SERIE_SENSOR', etiqueta: 'Serie del sensor', requerido: true, mayusculas: true,
            ayuda: 'La que trae la etiqueta del equipo, ej. G9HT5CEWRJV7', valor: datos.serieSensorSugerida || '' },
          { id: 'COMBUSTIBLE', etiqueta: 'Combustible que carga', tipo: 'lista', requerido: true, opciones: datos.combustibles },
          { id: 'FECHA_INSTALACION', etiqueta: 'Fecha de instalación', tipo: 'fecha', requerido: true, valor: hoyLocal() },
          { id: 'ESTATUS', etiqueta: 'Estatus del sensor', tipo: 'lista', opciones: ['ACTIVO', 'BAJA'] },
          { id: 'RESPONSIVA', etiqueta: 'Responsiva del sensor', tipo: 'archivo', acepta: 'application/pdf',
            maxMB: 10, requerido: true, ayuda: 'PDF firmado, máximo 10 MB' },
          { id: 'RENDIMIENTO', etiqueta: 'Rendimiento (km/L)', tipo: 'numero', min: 0, paso: 0.01 },
          { id: 'RALENTI', etiqueta: 'Consumo en ralentí (L/h)', tipo: 'numero', min: 0, paso: 0.01 },
          { id: 'COMENTARIOS', etiqueta: 'Comentarios', tipo: 'parrafo' },
        ],
        textoGuardar: 'Registrar instalación', iconoGuardar: 'save',
        alGuardar: async (valores, archivos) => {
          await callServer('apiRegistrarSensor', state.token, Object.assign({ ID_VEHICULO: vResumen.ID_VEHICULO, FOLIO: vResumen.FOLIO }, valores), {
            base64: await leerArchivoBase64(archivos.RESPONSIVA), mimeType: archivos.RESPONSIVA.type,
          });
        },
        textoExito: () => 'Instalación registrada',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'sensor'); },
      });
      // tipo:'lista' no toma su "valor" inicial de cfg.campos (ver formulario.html) — el
      // default de un <select> se fija así, con setOpciones (mismo patrón que usa Sensores).
      form.setOpciones('COMBUSTIBLE', datos.combustibles, datos.combustibles.length === 1 ? datos.combustibles[0] : '');
      form.setOpciones('ESTATUS', ['ACTIVO', 'BAJA'], 'ACTIVO');
      if (datos.sensoresActivos && datos.sensoresActivos.length) {
        Notificar.info('Esta unidad ya tiene un sensor activo: ' + datos.sensoresActivos.join(', '), { duracion: 6000 });
      }
    }

    const PROVEEDORES_HOLOGRAMA = ['EOX', 'EDENRED', 'N/A'];
    const COMBUSTIBLES_HOLOGRAMA = ['MAGNA', 'PREMIUM', 'DIESEL', 'GASOLINA', 'TODOS LOS PRODUCTOS'];

    async function abrirAgregarHolograma(vResumen, completo) {
      const cuerpo = abrirCapturaVehiculo('credit-card', 'HOLOGRAMA', 'Nuevo holograma', 'Folio ' + vResumen.FOLIO);
      cuerpo.innerHTML = '<p class="empty-state"><span class="spinner"></span> Cargando…</p>';
      let catalogos;
      try {
        catalogos = await callServer('apiCatalogosHologramas', state.token);
      } catch (err) {
        cuerpo.innerHTML = '<p class="error-msg">No se pudo cargar: ' + escaparHtml(err.message) + '</p>';
        return;
      }
      if (document.getElementById('veh-modal-captura').hidden) return; // se cerró mientras cargaba
      cuerpo.innerHTML = '';
      // RAZON SOCIAL del vehículo es la empresa DUEÑA de la unidad; la del holograma es
      // la empresa del CONTRATO con la gasolinera -- son cosas distintas (ver comentario
      // de HologramasService.DEL_CATALOGO), así que NO se autollena de golpe como los
      // demás datos del vehículo: se sugiere como opción ya elegida solo si por
      // casualidad coincide con una de las 3 del catálogo, si no, se deja en blanco y la
      // elige quien captura (por eso es su propio campo, no algo fijo en el payload).
      const razonVehiculo = String(completo['RAZON SOCIAL'] || '').trim().toUpperCase();
      const razonSugerida = catalogos.razonesSociales.indexOf(razonVehiculo) !== -1 ? razonVehiculo : '';
      const form = Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'PROVEEDOR', etiqueta: 'Proveedor', tipo: 'lista', requerido: true, opciones: PROVEEDORES_HOLOGRAMA },
          { id: 'CALCOMANIA', etiqueta: 'Calcomanía', requerido: true, mayusculas: true,
            ayuda: 'El código impreso en la calcomanía; no se puede repetir' },
          { id: 'ESTATUS_EOX', etiqueta: 'Estatus', tipo: 'lista', requerido: true, opciones: ['HABILITADO', 'DESHABILITADO'] },
          { id: 'COMBUSTIBLE', etiqueta: 'Producto autorizado', tipo: 'lista', requerido: true, opciones: COMBUSTIBLES_HOLOGRAMA,
            ayuda: 'Lo que puede cargar la tarjeta, no el tipo del vehículo' },
          { id: 'RAZON_SOCIAL', etiqueta: 'Razón social del contrato', tipo: 'lista', requerido: true, opciones: catalogos.razonesSociales },
          { id: 'AUTORIZADO_PESOS', etiqueta: 'Autorizado en pesos', tipo: 'numero', min: 0, requerido: true },
          { id: 'AUTORIZADO_LITROS', etiqueta: 'Autorizado en litros', tipo: 'numero', min: 0, requerido: true },
          { id: 'SOLICITUD', etiqueta: 'Solicitud firmada', tipo: 'archivo', acepta: 'application/pdf,image/png,image/jpeg',
            maxMB: 10, requerido: true, ayuda: 'PDF o foto del formato firmado' },
        ],
        textoGuardar: 'Registrar holograma', iconoGuardar: 'save',
        alGuardar: async (valores, archivos) => {
          const payload = Object.assign({
            TIPO_UNIDAD: 'FLOTA', ESTATUS_VEHICULO: 'UTILITARIO', FOLIO: vResumen.FOLIO,
            SERIE_VEHICULO: completo['SERIE VEHICULO'] || '', PLACA: completo['PLACA'] || '',
            MARCA: completo['MARCA'] || '', LINEA: completo['LINEA VEHICULO'] || '', MODELO: completo['MODELO'] || '',
            DEPARTAMENTO: completo['DEPARTAMENTO'] || '',
            RESPONSABLE: completo['RESPONSABLE VEHICULO'] || '', CAPACIDAD: completo['CAPACIDAD COMBUSTIBLE (LTS)'] || '',
          }, valores);
          await callServer('apiRegistrarHolograma', state.token, payload, {
            base64: await leerArchivoBase64(archivos.SOLICITUD), mimeType: archivos.SOLICITUD.type,
          });
        },
        textoExito: () => 'Holograma registrado',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'hologramas'); },
      });
      form.setOpciones('ESTATUS_EOX', ['HABILITADO', 'DESHABILITADO'], 'HABILITADO');
      form.setOpciones('RAZON_SOCIAL', catalogos.razonesSociales, razonSugerida);
    }

    /** A diferencia de las otras 4, esto reutiliza el wizard REAL de Inspección Vehicular
     *  (checklist dinámico, diagramas y firmas) — prepararCaptura ya acepta un contenedor
     *  cualquiera (ver modulos/inspecciones.html), así que aquí solo se le da el cuerpo del
     *  modal, el folio (ya lo sabemos) y qué hacer al guardar en vez de "listo para el siguiente". */
    function abrirAgregarInspeccion(vResumen, completo, hologramas) {
      const cuerpo = abrirCapturaVehiculo('clipboard-list', 'INSPECCIÓN', 'Nueva inspección', 'Folio ' + vResumen.FOLIO);
      prepararCaptura(cuerpo, {
        folioFijo: vResumen.FOLIO,
        // El "Cierre" pide Conductor y Holograma: se sugieren con el responsable del
        // vehículo y su holograma más reciente (si tiene) — el usuario los puede corregir.
        conductorSugerido: completo['RESPONSABLE VEHICULO'] || '',
        hologramaSugerido: (hologramas && hologramas[0] && hologramas[0].CALCOMANIA) || '',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'inspecciones'); },
      });
    }

    /** Editar una inspección ya guardada, desde la ficha del vehículo: mismo wizard, en modo
     *  edición (prepararCaptura trae la fila completa sola -- aquí solo hace falta el ID).
     *  Checklist/llantas/voltaje/encabezado; firmas y diagramas no se tocan. */
    function abrirEditarInspeccionFicha(id, vResumen) {
      const cuerpo = abrirCapturaVehiculo('clipboard-list', 'INSPECCIÓN', 'Editar inspección', 'Folio ' + vResumen.FOLIO);
      prepararCaptura(cuerpo, {
        idEditar: id,
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'inspecciones'); },
      });
    }

    /** Editar verificación: 3 campos, actualiza campo por campo (mismo que su
     *  módulo -- guardarCambiosCampoPorCampo + apiActualizarCampoVerificacion). */
    function abrirEditarVerificacionFicha(v, vResumen) {
      const cuerpo = abrirCapturaVehiculo('clipboard-check', 'VERIFICACIÓN', 'Editar verificación', 'Folio ' + (v.FOLIO || vResumen.FOLIO));
      Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'FOLIO', etiqueta: 'Folio', valor: v.FOLIO || '' },
          { id: 'FECHA_VERIFICACION', etiqueta: 'Fecha de verificación', tipo: 'fecha', requerido: true, valor: fechaParaInput(v.FECHA_VERIFICACION) },
          { id: 'FECHA_PROXIMA', etiqueta: 'Próxima verificación', tipo: 'fecha', requerido: true, valor: fechaParaInput(v.FECHA_PROXIMA) },
        ],
        alValidar: (val) => (val.FECHA_PROXIMA && val.FECHA_VERIFICACION && val.FECHA_PROXIMA <= val.FECHA_VERIFICACION
          ? { FECHA_PROXIMA: 'Debe ser posterior a la fecha de verificación' } : null),
        textoGuardar: 'Guardar cambios', iconoGuardar: 'save',
        alGuardar: async (valores) => {
          const cambios = {};
          if (valores.FOLIO !== (v.FOLIO || '')) cambios.FOLIO = valores.FOLIO;
          if (valores.FECHA_VERIFICACION !== fechaParaInput(v.FECHA_VERIFICACION)) cambios.FECHA_VERIFICACION = valores.FECHA_VERIFICACION;
          if (valores.FECHA_PROXIMA !== fechaParaInput(v.FECHA_PROXIMA)) cambios.FECHA_PROXIMA = valores.FECHA_PROXIMA;
          if (Object.keys(cambios).length) {
            await guardarCambiosCampoPorCampo(v.ID, cambios, (id, campo, valor) => callServer('apiActualizarCampoVerificacion', state.token, id, campo, valor));
            invalidarCacheLista('apiListarVerificaciones', state.token);
          }
        },
        textoExito: () => 'Verificación actualizada',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'verificaciones'); },
      });
    }

    /** Editar sensor: mismos campos que abrirAgregarSensor + FOLIO (sí se puede
     *  reasignar a otro vehículo, igual que en su módulo), actualiza campo por campo. */
    async function abrirEditarSensorFicha(s, vResumen) {
      const cuerpo = abrirCapturaVehiculo('radio', 'SENSOR', 'Editar sensor', 'Folio ' + (s.FOLIO || vResumen.FOLIO));
      cuerpo.innerHTML = '<p class="empty-state"><span class="spinner"></span> Cargando…</p>';
      let datos;
      try {
        datos = await callServer('apiDatosVehiculoParaSensor', state.token, s.ID_VEHICULO || vResumen.ID_VEHICULO || s.FOLIO || vResumen.FOLIO);
      } catch (err) {
        cuerpo.innerHTML = '<p class="error-msg">No se pudo cargar: ' + escaparHtml(err.message) + '</p>';
        return;
      }
      if (document.getElementById('veh-modal-captura').hidden) return;
      cuerpo.innerHTML = '';
      const form = Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'FOLIO', etiqueta: 'Folio', requerido: true, valor: s.FOLIO || '' },
          { id: 'SERIE_SENSOR', etiqueta: 'Serie del sensor', requerido: true, mayusculas: true, valor: s.SERIE_SENSOR || '' },
          { id: 'COMBUSTIBLE', etiqueta: 'Combustible que carga', tipo: 'lista', requerido: true, opciones: datos.combustibles },
          { id: 'FECHA_INSTALACION', etiqueta: 'Fecha de instalación', tipo: 'fecha', requerido: true, valor: fechaParaInput(s.FECHA_INSTALACION) },
          { id: 'ESTATUS', etiqueta: 'Estatus del sensor', tipo: 'lista', opciones: ['ACTIVO', 'BAJA'] },
          { id: 'RENDIMIENTO', etiqueta: 'Rendimiento (km/L)', tipo: 'numero', min: 0, paso: 0.01, valor: s.RENDIMIENTO || '' },
          { id: 'RALENTI', etiqueta: 'Consumo en ralentí (L/h)', tipo: 'numero', min: 0, paso: 0.01, valor: s.RALENTI || '' },
          { id: 'COMENTARIOS', etiqueta: 'Comentarios', tipo: 'parrafo', valor: s.COMENTARIOS || '' },
        ],
        textoGuardar: 'Guardar cambios', iconoGuardar: 'save',
        alGuardar: async (valores) => {
          const cambios = {};
          Object.keys(valores).forEach((campo) => {
            const antes = campo === 'FECHA_INSTALACION' ? fechaParaInput(s[campo]) : String(s[campo] || '');
            if (String(valores[campo]) !== antes) cambios[campo] = valores[campo];
          });
          if (Object.keys(cambios).length) {
            await guardarCambiosCampoPorCampo(s.ID, cambios, (id, campo, valor) => callServer('apiActualizarCampoSensor', state.token, id, campo, valor));
            invalidarCacheLista('apiListarSensores', state.token);
          }
        },
        textoExito: () => 'Sensor actualizado',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'sensor'); },
      });
      form.setOpciones('COMBUSTIBLE', datos.combustibles, s.COMBUSTIBLE || '');
      form.setOpciones('ESTATUS', ['ACTIVO', 'BAJA'], s.ESTATUS || 'ACTIVO');
    }

    /** Editar holograma: mismos 16 campos que su módulo (con catálogos), actualiza
     *  campo por campo. Si EN_CATALOGO, los datos del vehículo (bloque de abajo) se
     *  bloquean -- igual que en Hologramas, se sincronizan solos desde Vehículos. */
    async function abrirEditarHologramaFicha(h, vResumen) {
      const cuerpo = abrirCapturaVehiculo('credit-card', 'HOLOGRAMA', 'Editar holograma', 'Folio ' + (h.FOLIO || vResumen.FOLIO));
      cuerpo.innerHTML = '<p class="empty-state"><span class="spinner"></span> Cargando…</p>';
      let catalogos;
      try {
        catalogos = await callServer('apiCatalogosHologramas', state.token);
      } catch (err) {
        cuerpo.innerHTML = '<p class="error-msg">No se pudo cargar: ' + escaparHtml(err.message) + '</p>';
        return;
      }
      if (document.getElementById('veh-modal-captura').hidden) return;
      cuerpo.innerHTML = '';
      const soloSiFueraDelCatalogo = ['PLACA', 'MARCA', 'LINEA', 'MODELO', 'RESPONSABLE', 'DEPARTAMENTO', 'RAZON_SOCIAL', 'SERIE_VEHICULO', 'CAPACIDAD'];
      const form = Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'CALCOMANIA', etiqueta: 'Calcomanía', requerido: true, mayusculas: true, valor: h.CALCOMANIA || '' },
          { id: 'PROVEEDOR', etiqueta: 'Proveedor', tipo: 'lista', requerido: true, opciones: catalogos.proveedores },
          { id: 'ESTATUS_EOX', etiqueta: 'Estatus', tipo: 'lista', requerido: true, opciones: catalogos.estatusEox },
          { id: 'COMBUSTIBLE', etiqueta: 'Producto autorizado', tipo: 'lista', requerido: true, opciones: catalogos.combustibles },
          { id: 'AUTORIZADO_PESOS', etiqueta: 'Autorizado en pesos', tipo: 'numero', min: 0, valor: h.AUTORIZADO_PESOS || '' },
          { id: 'AUTORIZADO_LITROS', etiqueta: 'Autorizado en litros', tipo: 'numero', min: 0, valor: h.AUTORIZADO_LITROS || '' },
          { id: 'ESTATUS_VEHICULO', etiqueta: 'Estatus del vehículo', tipo: 'lista', opciones: catalogos.estatusVehiculo },
          { id: 'PLACA', etiqueta: 'Placa', valor: h.PLACA || '' },
          { id: 'MARCA', etiqueta: 'Marca', valor: h.MARCA || '' },
          { id: 'LINEA', etiqueta: 'Línea', valor: h.LINEA || '' },
          { id: 'MODELO', etiqueta: 'Modelo', valor: h.MODELO || '' },
          { id: 'RESPONSABLE', etiqueta: 'Responsable', valor: h.RESPONSABLE || '' },
          { id: 'DEPARTAMENTO', etiqueta: 'Departamento', valor: h.DEPARTAMENTO || '' },
          { id: 'RAZON_SOCIAL', etiqueta: 'Razón social', tipo: 'lista', opciones: catalogos.razonesSociales },
          { id: 'SERIE_VEHICULO', etiqueta: 'Serie del vehículo', valor: h.SERIE_VEHICULO || '' },
          { id: 'CAPACIDAD', etiqueta: 'Capacidad de combustible', tipo: 'numero', min: 0, valor: h.CAPACIDAD || '' },
        ],
        textoGuardar: 'Guardar cambios', iconoGuardar: 'save',
        alGuardar: async (valores) => {
          const cambios = {};
          Object.keys(valores).forEach((campo) => {
            if (String(valores[campo]) !== String(h[campo] || '')) cambios[campo] = valores[campo];
          });
          if (Object.keys(cambios).length) {
            await guardarCambiosCampoPorCampo(h.ID, cambios, (id, campo, valor) => callServer('apiActualizarCampoHolograma', state.token, id, campo, valor));
            invalidarCacheLista('apiListarHologramas', state.token);
          }
        },
        textoExito: () => 'Holograma actualizado',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'hologramas'); },
      });
      form.setOpciones('PROVEEDOR', catalogos.proveedores, h.PROVEEDOR || '');
      form.setOpciones('ESTATUS_EOX', catalogos.estatusEox, h.ESTATUS_EOX || '');
      form.setOpciones('COMBUSTIBLE', catalogos.combustibles, h.COMBUSTIBLE || '');
      form.setOpciones('ESTATUS_VEHICULO', catalogos.estatusVehiculo, h.ESTATUS_VEHICULO || '');
      form.setOpciones('RAZON_SOCIAL', catalogos.razonesSociales, h.RAZON_SOCIAL || '');
      if (h.EN_CATALOGO) {
        soloSiFueraDelCatalogo.forEach((id) => form.setSoloLectura(id, true, 'Viene del catálogo de Vehículos -- se sincroniza sola'));
      }
    }

    /** Editar incidencia: mismos 14 campos que su módulo, un solo apiActualizarIncidencia
     *  con el objeto completo (a diferencia de las otras 3, que van campo por campo). */
    function abrirEditarIncidenciaFicha(inc, vResumen) {
      const cuerpo = abrirCapturaVehiculo('wrench', 'INCIDENCIA', 'Editar incidencia', 'Folio ' + (inc.FOLIO || vResumen.FOLIO));
      Formulario.crear(cuerpo, {
        ancho: 'medio', columnas: 2,
        campos: [
          { id: 'FOLIO', etiqueta: 'Folio', valor: inc.FOLIO || '' },
          { id: 'DEPARTAMENTO', etiqueta: 'Departamento', valor: inc.DEPARTAMENTO || '' },
          { id: 'MODELO', etiqueta: 'Modelo', valor: inc.MODELO || '' },
          { id: 'ANIO', etiqueta: 'Año', tipo: 'numero', valor: inc.ANIO || '' },
          { id: 'FECHA_INSPECCION', etiqueta: 'Fecha de inspección', tipo: 'fecha', valor: fechaParaInput(inc.FECHA_INSPECCION) },
          { id: 'KILOMETRAJE', etiqueta: 'Kilometraje', tipo: 'numero', min: 0, valor: inc.KILOMETRAJE || '' },
          { id: 'TICKET', etiqueta: 'Ticket', valor: inc.TICKET || '' },
          { id: 'PERIODO_VERIFICACION', etiqueta: 'Periodo de verificación', valor: inc.PERIODO_VERIFICACION || '' },
          { id: 'SEGURO_AUTO', etiqueta: 'Seguro de auto', valor: inc.SEGURO_AUTO || '' },
          { id: 'INSPECCION_INGRESO', etiqueta: 'Motivo', tipo: 'parrafo', requerido: true, valor: inc.INSPECCION_INGRESO || '' },
          { id: 'DESCRIPCION_TRABAJO', etiqueta: 'Descripción del trabajo', tipo: 'parrafo', valor: inc.DESCRIPCION_TRABAJO || '' },
          { id: 'FECHA_TRABAJO', etiqueta: 'Fecha de trabajo', tipo: 'fecha', valor: fechaParaInput(inc.FECHA_TRABAJO) },
          { id: 'MECANICO', etiqueta: 'Mecánico', valor: inc.MECANICO || '' },
          { id: 'INSPECCION_SALIDA', etiqueta: 'Inspección de salida', valor: inc.INSPECCION_SALIDA || '' },
        ],
        textoGuardar: 'Guardar cambios', iconoGuardar: 'save',
        alGuardar: async (valores) => {
          await callServer('apiActualizarIncidencia', state.token, inc.ID, valores);
          invalidarCacheLista('apiListarIncidencias', state.token);
        },
        textoExito: () => 'Incidencia actualizada',
        alGuardado: () => { cerrarCapturaVehiculo(); abrirFichaVehiculo(vResumen, 'incidencias'); },
      });
    }

    return {
      abrirAgregarHolograma: abrirAgregarHolograma, abrirAgregarIncidencia: abrirAgregarIncidencia,
      abrirAgregarInspeccion: abrirAgregarInspeccion, abrirAgregarSensor: abrirAgregarSensor,
      abrirAgregarVerificacion: abrirAgregarVerificacion, abrirCapturaVehiculo: abrirCapturaVehiculo,
      abrirEditarHologramaFicha: abrirEditarHologramaFicha, abrirEditarIncidenciaFicha: abrirEditarIncidenciaFicha,
      abrirEditarInspeccionFicha: abrirEditarInspeccionFicha, abrirEditarSensorFicha: abrirEditarSensorFicha,
      abrirEditarVerificacionFicha: abrirEditarVerificacionFicha, cerrarCapturaVehiculo: cerrarCapturaVehiculo,
    };
  });
</script>
