<script>
  /**
   * app-sistemas.html — Tarjetas con accesos directos a sistemas/formularios externos.
   * Dos usos del mismo componente (tpl-sistemas/initSistemas, parametrizado por una clave
   * de SISTEMAS_POR_MODULO, ver dispatch en navegarA, app.html):
   *   - "Sistemas" dentro de Control Vehicular/Líneas/Arqueos (pedido 2-oct).
   *   - "Encuestas/Solicitudes", módulo general en el menú (pedido 2-oct).
   * En su propio archivo por el mismo motivo que Arqueos/Caja Chica (ver app-arqueos.html).
   */

  // "\/\/" (no "//") en cada URL -- ver comentario del bug de Apps Script en CLAUDE.md:
  // dentro de un <script> de un .html, Apps Script borra todo lo que sigue a un "//"
  // literal, incluso dentro de un string.
  const SISTEMAS_POR_MODULO = {
    'servicios-vehiculares': [
      { nombre: 'SIVET', icono: 'radar', url: 'https:\/\/script.google.com/macros/s/AKfycbzuLVF3kmIdSD5W8pcNOAgqu8kudpgCa1iJ8Ph2pz2r3zvenavReQR2ftc_e4lc5qWWwA/exec' },
      { nombre: 'Generador de Justificación - SV', icono: 'file-text', url: 'https:\/\/script.google.com/macros/s/AKfycbzjR0Flc1HrTE00khpCjm0Qtzd67zmenYmWPn41ttSTeFECXCd3KMZYyfnl8GXhUKnljg/exec' },
      { nombre: 'CI Taller y Refacciones', icono: 'wrench', url: 'https:\/\/www.appsheet.com/start/43c87e09-2325-4c35-82ca-5496e41fd4f6' },
      { nombre: 'Encarta CPP', icono: 'keyboard', url: 'https:\/\/script.google.com/macros/s/AKfycbxff11xiWDXARs3qQ7f0Wcc4ltt_1VTG4bvwg4IXROxrGWoWlDDJ1PrC3KdrfsK0EJXvA/exec' },
    ],
    // Sin sistemas todavía -- la vista queda lista (muestra "sin registrar") para
    // cuando se manden los de Líneas.
    'lineas': [],
    'arqueos': [
      { nombre: 'Encarta CPP', icono: 'keyboard', url: 'https:\/\/script.google.com/macros/s/AKfycbxff11xiWDXARs3qQ7f0Wcc4ltt_1VTG4bvwg4IXROxrGWoWlDDJ1PrC3KdrfsK0EJXvA/exec' },
      { nombre: 'Catálogo Dinámico de Conceptos', icono: 'list-tree', url: 'https:\/\/script.google.com/a/macros/ciudadmaderas.com/s/AKfycbyRs_dwP_6pQhM3_67Gdj-PXQzsB3WHqQTnvX1qJqSgR3k-6VE53a8-ig6cI__hKz1L/exec' },
      { nombre: 'Análisis Global de CCH', icono: 'bar-chart-3', url: 'https:\/\/script.google.com/a/macros/ciudadmaderas.com/s/AKfycbw4GVN_hyOv2YFldPsL_7WGDQSNXhq19whQt19l8KFruUKxaSTGgPnn-1MNvB9xqCg/exec' },
    ],
    // Módulo general "Encuestas/Solicitudes" (no va dentro de otro módulo, es su propia
    // entrada del menú) -- el orden importa, es el que se dio.
    'encuestas-solicitudes': [
      { nombre: 'Encuesta de Satisfacción - SV', icono: 'star', url: 'https:\/\/script.google.com/a/macros/ciudadmaderas.com/s/AKfycbwArSNyTd_CBGr58W1PzxaWwIGiwiWy-7JmhYPArRDnJkFKI8Gf142wb2JCGHKC94nB/exec' },
      { nombre: 'Solicitud Línea / Equipo', icono: 'smartphone', url: 'https:\/\/script.google.com/a/macros/ciudadmaderas.com/s/AKfycbwy0F6cyi4EnQAEzJg0qXQfznpve1Le2oUGE2rfTEf8xgPWqcgdtqxALKqggtZcoShT1Q/exec' },
      { nombre: 'Encuesta de Satisfacción - Help Desk', icono: 'headset', url: 'https:\/\/script.google.com/a/macros/ciudadmaderas.com/s/AKfycbx-W4V5m65UyOhEXjnJuklDXS5VMaajjIyKCEi9zfCN3zWlGT_LlOekY3HI-eCE3T8w8A/exec' },
    ],
  };

  function initSistemas(idGrupo) {
    const grupo = NAV_GRUPOS.find((g) => g.id === idGrupo);
    document.getElementById('sistemas-subtitulo').textContent =
      'Accesos directos a otros sistemas' + (grupo ? ' de ' + grupo.etiqueta : '') + ' — se abren en una pestaña nueva';
    const sistemas = SISTEMAS_POR_MODULO[idGrupo] || [];
    const lista = document.getElementById('sistemas-lista');
    if (!sistemas.length) {
      lista.innerHTML = '<p class="empty-state">Todavía no hay sistemas registrados para este módulo.</p>';
      return;
    }
    // Navy y dorado alternados (misma paleta de marca que los Panoramas) -- nomás para
    // que la cuadrícula no se vea plana, no tiene ningún significado por sistema.
    lista.innerHTML = sistemas.map((s, i) => {
      const oro = i % 2 === 1;
      const fondo = oro ? 'var(--color-accent-soft)' : 'var(--color-primary-soft)';
      const color = oro ? 'var(--color-accent-hover)' : 'var(--color-primary)';
      return `
      <div class="sistema-card-wrap">
        <a href="${escaparHtml(s.url)}" target="_blank" rel="noopener" class="sistema-card">
          <div class="sistema-card-icono" style="background:${fondo}; color:${color}">
            <i data-lucide="${escaparHtml(s.icono || 'external-link')}" class="ico"></i>
          </div>
          <div class="sistema-card-texto">
            <h3>${escaparHtml(s.nombre)}</h3>
            <span class="sistema-card-abrir">Abrir <i data-lucide="arrow-up-right" class="ico"></i></span>
          </div>
        </a>
        <button type="button" class="sistema-card-copiar" data-url="${escaparHtml(s.url)}"
          title="Copiar enlace" aria-label="Copiar enlace de ${escaparHtml(s.nombre)}">
          <i data-lucide="copy" class="ico"></i>
        </button>
      </div>`;
    }).join('');
    refreshIcons();
    lista.querySelectorAll('.sistema-card-copiar').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const ok = await copiarEnlace_(btn.dataset.url);
        if (ok) Notificar.exito('Enlace copiado');
        else Notificar.error('El navegador no permitió copiar el enlace');
      });
    });
  }

  /** Mismo patrón que DataTable.copiarSeleccion (componentes/datatable.html): la API
   *  moderna primero, y si el marco de Apps Script la bloquea, el truco clásico del
   *  textarea oculto + execCommand('copy'). */
  async function copiarEnlace_(texto) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(texto); return true; }
    } catch (e) { /* cae al método clásico */ }
    const area = document.createElement('textarea');
    area.value = texto;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(area);
    area.select();
    let copiado = false;
    try { copiado = document.execCommand('copy'); } catch (e) { copiado = false; }
    area.remove();
    return copiado;
  }
</script>
