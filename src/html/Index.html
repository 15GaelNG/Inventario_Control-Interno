<!DOCTYPE html>
<html>
<head>

  <div id="login-screen-container"></div>

  <div id="app-shell" hidden>
    <div id="app">
      <nav id="sidebar" aria-label="Navegación principal">
        <div class="sidebar-header">
          <div class="sidebar-brand">
            <img class="sidebar-brand-icon" src="https://raw.githubusercontent.com/15GaelNG/Inventario_Control-Interno/master/assets/logo.png" alt="Control Interno" />
            <h1 class="sidebar-title">Control Interno</h1>
          </div>
        </div>


        <button type="button" class="nav-item" data-view="dashboard">
          <span class="nav-icon"><i data-lucide="home" class="ico"></i></span><span class="nav-label">Inicio</span>
        </button>

        <div class="nav-groups" id="nav-groups"></div>

        <div style="flex:1"></div>

        <div class="sidebar-user" id="user-name"></div>
        <button type="button" class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Colapsar menú">
          <i data-lucide="chevron-left" class="ico"></i><span class="nav-label">Colapsar menú</span>
        </button>
        <button id="btn-logout" class="secondary">
          <span class="nav-icon"><i data-lucide="log-out" class="ico"></i></span><span class="nav-label">Cerrar sesión</span>
        </button>
      </nav>
      <button type="button" id="sidebar-backdrop" aria-label="Cerrar menú" tabindex="-1"></button>
      <main id="main">
        <div class="topbar">
          <div class="topbar-left">
            <button type="button" id="mobile-menu-btn" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"><i data-lucide="menu" class="ico"></i></button>
            <img class="topbar-cm-logo cm-logo-light" src="https://raw.githubusercontent.com/15GaelNG/Inventario_Control-Interno/master/assets/CMTC-Light.png" alt="Ciudad Maderas" />
            <img class="topbar-cm-logo cm-logo-dark" src="https://raw.githubusercontent.com/15GaelNG/Inventario_Control-Interno/master/assets/CMTC-Dark.png" alt="Ciudad Maderas" />
          </div>
          <div class="topbar-right">
            <div class="topbar-theme-toggle">
              <button type="button" class="theme-btn" data-tema="light" title="Modo claro"><i data-lucide="sun" class="ico"></i></button>
              <button type="button" class="theme-btn" data-tema="dark" title="Modo oscuro"><i data-lucide="moon" class="ico"></i></button>
            </div>
            <div class="topbar-date" id="topbar-date"></div>
          </div>
        </div>
        <div id="view-container"></div>
      </main>
    </div>
  </div>
