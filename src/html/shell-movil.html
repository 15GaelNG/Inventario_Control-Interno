<style>
  /* ============ Esqueleto en celular y tableta (rama emmanuel; cortes del sistema desde oct-2026) ============
     Archivo aparte (se incluye con una línea en Index.html) para no mezclarlo con los estilos del shell.
     Tableta y celular (≤1024px, ver componentes/pantalla.html): el menú lateral deja de ocupar ancho y se
     abre como panel con el botón de menú de la barra superior, con un fondo oscuro detrás; se cierra al
     elegir un módulo, tocar fuera o con Esc. Celular (≤640px): la barra superior deja solo menú, logo,
     campana y salir; el cambio de tema pasa al panel. */
  .shell-menu-btn, .shell-fondo, .shell-tema-panel { display: none; }

  @media (max-width: 1024px) {
    .shell-menu-btn {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 40px; height: 40px; padding: 0; border-radius: 10px;
      background: transparent; color: var(--color-text); border: 1px solid var(--color-border);
    }
    .shell-menu-btn:hover { background: var(--color-bg); }
    .shell-menu-btn .ico { width: 20px; height: 20px; }

    #sidebar, #sidebar.collapsed {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 900; width: 280px; max-width: 86vw;
      transform: translateX(-100%); transition: transform .25s ease;
    }
    body.shell-menu-abierto #sidebar { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .35); }
    /* En el panel siempre se ven los nombres, aunque en escritorio el menú esté colapsado */
    #sidebar.collapsed .sidebar-title, #sidebar.collapsed .nav-label,
    #sidebar.collapsed .nav-group-header .nav-label { display: inline; }
    #sidebar.collapsed .nav-group-chevron { display: inline-flex; }
    #sidebar.collapsed .nav-item, #sidebar.collapsed .nav-group-header { justify-content: flex-start; }
    #sidebar.collapsed .nav-group-items { display: flex !important; }
    .sidebar-collapse-btn { display: none; }

    .shell-fondo { position: fixed; inset: 0; z-index: 890; background: rgba(6, 20, 30, .45); }
    body.shell-menu-abierto .shell-fondo { display: block; }

    .topbar { padding: 8px 16px; margin-bottom: 12px; gap: 10px; }
    .topbar-left { gap: 10px; min-width: 0; flex: 1 1 auto; }
    /* El logo se encoge antes de encimarse con los botones de la derecha */
    .topbar-cm-logo { height: 30px; max-width: 100%; min-width: 0; object-fit: contain; object-position: left center; }
    .topbar-right { flex-shrink: 0; }
    .topbar-date { display: none; }
    #view-container { padding: 0 16px 20px; }
    .page-header { margin-bottom: 14px; }
  }

  @media (max-width: 640px) {
    .topbar { padding: 8px 12px; }
    .topbar-right { gap: 8px; }
    .topbar-theme-toggle, .topbar-user { display: none; }
    .topbar-user-menu { padding-left: 8px; }
    .topbar-cm-logo { height: 26px; }
    /* Sin relleno abajo: lo que se pega abajo con sticky (los botones de un formulario) queda al
       ras de la pantalla; el espacio final lo da el último bloque de la vista */
    #view-container { padding: 0 12px; }
    #view-container > :last-child { margin-bottom: 20px; }

    /* Cambio de tema dentro del panel, al pie (en la barra ya no cabe) */
    .shell-tema-panel {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 13px; margin-top: 8px; border-top: 1px solid var(--color-sidebar-border);
      color: var(--color-sidebar-text); font-size: 13px; font-weight: 500;
    }
    .shell-tema-panel .topbar-theme-toggle { display: flex; background: rgba(255, 255, 255, .08); border-color: var(--color-sidebar-border); }
    .shell-tema-panel .theme-btn { color: var(--color-sidebar-text); }

    .page-header h2 { font-size: 19px; }
    .page-subtitle { font-size: 12px; }
    .page-header-actions { width: 100%; }
    .page-header-actions > button { flex: 1 1 auto; }
  }
</style>

<script>
  /** Botón de menú, fondo y tema del panel lateral en pantallas angostas (ver estilos arriba y Pantalla). */
  (function () {
    const sidebar = document.getElementById('sidebar');
    const barra = document.querySelector('.topbar-left');
    if (!sidebar || !barra) return;

    const boton = document.createElement('button');
    boton.type = 'button';
    boton.className = 'shell-menu-btn';
    boton.setAttribute('aria-label', 'Abrir menú');
    boton.setAttribute('aria-controls', 'sidebar');
    boton.setAttribute('aria-expanded', 'false');
    boton.innerHTML = '<i data-lucide="menu" class="ico"></i>';
    barra.insertBefore(boton, barra.firstChild);

    const fondo = document.createElement('div');
    fondo.className = 'shell-fondo';
    document.body.appendChild(fondo);

    // Tema en el panel: una copia de los botones de la barra. Funcionan solos porque app.html los
    // atiende por clase (.theme-btn + data-tema) con delegación, y marcarTemaActual marca todos.
    const temaBarra = document.querySelector('.topbar .topbar-theme-toggle');
    if (temaBarra) {
      const temaPanel = document.createElement('div');
      temaPanel.className = 'shell-tema-panel';
      temaPanel.innerHTML = '<span>Tema</span>';
      temaPanel.appendChild(temaBarra.cloneNode(true));
      sidebar.insertBefore(temaPanel, document.getElementById('sidebar-collapse-btn'));
      if (typeof marcarTemaActual === 'function') marcarTemaActual();
    }

    const abierto = () => document.body.classList.contains('shell-menu-abierto');
    /** Con el panel cerrado y fuera de la pantalla, su contenido no debe recibir el foco del teclado. */
    function sincronizarInert() {
      sidebar.inert = Pantalla.esAngosta() && !abierto();
    }
    function abrir(si) {
      document.body.classList.toggle('shell-menu-abierto', si);
      boton.setAttribute('aria-expanded', String(si));
      boton.setAttribute('aria-label', si ? 'Cerrar menú' : 'Abrir menú');
      sincronizarInert();
    }
    boton.addEventListener('click', () => abrir(!abierto()));
    fondo.addEventListener('click', () => abrir(false));
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && abierto()) { abrir(false); boton.focus(); }
    });
    // Elegir un módulo cierra el panel (los grupos solo se despliegan)
    sidebar.addEventListener('click', (ev) => {
      if (Pantalla.esAngosta() && ev.target.closest('.nav-item[data-view], .nav-subitem')) abrir(false);
    });
    Pantalla.alCambiar((p) => { if (!p.angosta) abrir(false); else sincronizarInert(); });
    sincronizarInert();
    if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
  })();
</script>
