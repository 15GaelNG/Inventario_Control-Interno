<template id="tpl-pendientes-inspeccion">
  <div class="page-header-compacto">
    <div>
      <h2><i data-lucide="list-checks" class="ico"></i> Tickets de inspección</h2>
      <p class="page-subtitle">Lo que el inspector dijo que hay que subir como ticket a Help Desk, y su seguimiento</p>
    </div>
    <!-- KPIs: clic = filtrar la tabla -->
    <div class="kpi-chips">
      <button type="button" class="kpi-chip" id="pdi-kpi-total" title="Ver los que siguen sin cargar en Help Desk">
        <span class="kpi-chip-label">Sin cargar</span>
        <strong class="kpi-chip-value" id="pdi-stat-total">0</strong>
      </button>
      <button type="button" class="kpi-chip kpi-warn" id="pdi-kpi-urgentes" title="Filtrar: urgentes sin cargar">
        <span class="kpi-chip-label">Urgentes</span>
        <strong class="kpi-chip-value" id="pdi-stat-urgentes">0</strong>
      </button>
      <button type="button" class="kpi-chip" id="pdi-kpi-cargados" title="Filtrar: ya cargados en Help Desk">
        <span class="kpi-chip-label">Cargados</span>
        <strong class="kpi-chip-value" id="pdi-stat-cargados">0</strong>
      </button>
      <button type="button" class="kpi-chip" id="pdi-kpi-abiertos-hd" title="Filtrar: ya cargados, pero el ticket sigue abierto en Help Desk">
        <span class="kpi-chip-label">Abierto en Help Desk</span>
        <strong class="kpi-chip-value" id="pdi-stat-abiertos-hd">0</strong>
      </button>
      <button type="button" class="kpi-chip" id="pdi-kpi-resueltos" title="Filtrar: el ticket ya se resolvió o se cerró en Help Desk">
        <span class="kpi-chip-label">Resuelto en Help Desk</span>
        <strong class="kpi-chip-value" id="pdi-stat-resueltos">0</strong>
      </button>
    </div>
  </div>

  <div class="card card-compacta">
    <div id="pdi-tabla"></div>
  </div>

  <!-- Modal: vincular a mano un pendiente con un ticket que Kike ya vio en Help Desk (cuando
       el match automático no lo encontró solo) -->
  <div class="modal-backdrop" id="pdi-modal-vincular" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Vincular a un ticket de Help Desk</h3>
          <p class="modal-subtitle" id="pdi-vincular-asunto"></p>
        </div>
        <button type="button" class="modal-close" id="pdi-vincular-cerrar"><i data-lucide="x" class="ico"></i></button>
      </div>
      <form id="pdi-form-vincular">
        <div class="field">
          <label for="pdi-vincular-ticket">Número de ticket en Help Desk</label>
          <input type="text" id="pdi-vincular-ticket" inputmode="numeric" autocomplete="off" />
          <span class="form-ayuda">Úsalo cuando ya viste el ticket allá, pero el sistema todavía no lo encontró solo</span>
        </div>
        <div class="error-msg" id="pdi-vincular-error" hidden></div>
        <button type="submit" style="width:100%"><i data-lucide="link" class="ico"></i> Vincular</button>
      </form>
    </div>
  </div>
</template>
