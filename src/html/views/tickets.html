<template id="tpl-tickets">
  <div class="page-header">
    <div>
      <h2><i data-lucide="ticket" class="ico"></i> Tickets</h2>
      <p class="page-subtitle">Bitácora general de atención — Uber, tarjeta EOX, hologramas, etc.</p>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-tile">
      <div class="stat-icon"><i data-lucide="ticket" class="ico"></i></div>
      <div><div class="stat-value" id="tickets-stat-total">0</div><div class="stat-label">Total</div></div>
    </div>
  </div>

  <div class="card form-card" style="margin-bottom:18px">
    <div class="form-card-header">
      <div class="form-card-icon"><i data-lucide="ticket" class="ico"></i></div>
      <div>
        <h3>Registrar ticket</h3>
        <p>Da de alta una nueva solicitud/atención</p>
      </div>
    </div>
    <form id="form-ticket" class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 0 14px;">
      <div class="field"><label>Ticket</label><input type="text" id="ticket-ticket" placeholder="Ej. 4021" /></div>
      <div class="field"><label>Fecha de registro</label><input type="text" id="ticket-fecha-registro" disabled /></div>
      <div class="field"><label>Fecha</label><input type="date" id="ticket-fecha" /></div>
      <div class="field"><label>Departamento</label><input type="text" id="ticket-departamento" /></div>
      <div class="field"><label>Solicitante</label><input type="text" id="ticket-solicitante" /></div>
      <div class="field"><label>Tipo de atención</label><input type="text" id="ticket-tipo-atencion" required placeholder="Ej. Alta de usuario Uber" /></div>
      <div class="field"><label>Placa</label><input type="text" id="ticket-placa" /></div>
      <div class="field">
        <label>Quién atendió</label>
        <select id="ticket-quien-atendio">
          <option value="">Selecciona…</option>
          <option value="DAVID MOISES MALDONADO HERNANDEZ">David Moisés Maldonado Hernández</option>
          <option value="GIOVANNI JAVIER ORDUÑA DE LA PEÑA">Giovanni Javier Orduña de la Peña</option>
          <option value="ABIGAIL LEDESMA CORONA">Abigail Ledesma Corona</option>
          <option value="JORGE LUIS AVECILLA RIVERA">Jorge Luis Avecilla Rivera</option>
        </select>
      </div>
      <div class="field" style="grid-column: 1 / -1;"><label>Comentario</label><input type="text" id="ticket-comentario" /></div>
      <div style="grid-column: 1 / -1;"><button type="submit" id="btn-guardar-ticket"><i data-lucide="ticket" class="ico"></i> Registrar ticket</button></div>
    </form>
    <div class="error-msg" id="ticket-error" hidden></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Historial</h3>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>Ticket</th><th>Fecha</th><th>Departamento</th><th>Solicitante</th><th>Tipo de atención</th><th>Atendió</th><th></th></tr>
        </thead>
        <tbody id="lista-tickets"></tbody>
      </table>
    </div>
    <p class="empty-state" id="tickets-vacio" hidden>Todavía no hay tickets registrados.</p>
  </div>

  <!-- Modal: editar (también sirve para ver el detalle completo) -->
  <div class="modal-backdrop" id="modal-editar-ticket" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Editar ticket</h3>
          <p class="modal-subtitle" id="editar-ticket-label"></p>
        </div>
        <button type="button" class="modal-close" id="btn-cancelar-editar-ticket"><i data-lucide="x" class="ico"></i></button>
      </div>
      <form id="form-editar-ticket">
        <input type="hidden" id="editar-ticket-id" />
        <div class="field"><label>Ticket</label><input type="text" id="editar-ticket-ticket" /></div>
        <div class="field"><label>Fecha</label><input type="date" id="editar-ticket-fecha" /></div>
        <div class="field"><label>Departamento</label><input type="text" id="editar-ticket-departamento" /></div>
        <div class="field"><label>Solicitante</label><input type="text" id="editar-ticket-solicitante" /></div>
        <div class="field"><label>Tipo de atención</label><input type="text" id="editar-ticket-tipo-atencion" required /></div>
        <div class="field"><label>Placa</label><input type="text" id="editar-ticket-placa" /></div>
        <div class="field">
          <label>Quién atendió</label>
          <select id="editar-ticket-quien-atendio">
            <option value="">Selecciona…</option>
            <option value="DAVID MOISES MALDONADO HERNANDEZ">David Moisés Maldonado Hernández</option>
            <option value="GIOVANNI JAVIER ORDUÑA DE LA PEÑA">Giovanni Javier Orduña de la Peña</option>
            <option value="ABIGAIL LEDESMA CORONA">Abigail Ledesma Corona</option>
            <option value="JORGE LUIS AVECILLA RIVERA">Jorge Luis Avecilla Rivera</option>
          </select>
        </div>
        <div class="field"><label>Comentario</label><input type="text" id="editar-ticket-comentario" /></div>
        <div class="error-msg" id="editar-ticket-error" hidden></div>
        <button type="submit" id="btn-guardar-editar-ticket" style="width:100%"><i data-lucide="save" class="ico"></i> Guardar cambios</button>
      </form>
    </div>
  </div>
</template>
