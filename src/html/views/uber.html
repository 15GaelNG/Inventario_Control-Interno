<template id="tpl-uber">
  <div class="page-header">
    <div>
      <h2><i data-lucide="car-taxi-front" class="ico"></i> Uber</h2>
      <p class="page-subtitle">Usuarios autorizados para viáticos por Uber</p>
    </div>
    <div class="page-header-actions">
      <button type="button" class="secondary" id="btn-exportar-excel-uber"><i data-lucide="file-spreadsheet" class="ico"></i> Exportar a Excel</button>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-tile">
      <div class="stat-icon"><i data-lucide="users" class="ico"></i></div>
      <div><div class="stat-value" id="uber-stat-total">0</div><div class="stat-label">Total</div></div>
    </div>
    <div class="stat-tile stat-tile-ok">
      <div class="stat-icon"><i data-lucide="circle-check" class="ico"></i></div>
      <div><div class="stat-value" id="uber-stat-activos">0</div><div class="stat-label">Activos</div></div>
    </div>
    <div class="stat-tile stat-tile-warn">
      <div class="stat-icon"><i data-lucide="clock" class="ico"></i></div>
      <div><div class="stat-value" id="uber-stat-pendientes">0</div><div class="stat-label">Pendientes</div></div>
    </div>
    <div class="stat-tile stat-tile-warn">
      <div class="stat-icon"><i data-lucide="ban" class="ico"></i></div>
      <div><div class="stat-value" id="uber-stat-baja">0</div><div class="stat-label">De baja</div></div>
    </div>
  </div>

  <div class="tabs-simple" id="uber-tabs">
    <button type="button" class="tab-btn active" data-tab="lista"><i data-lucide="list" class="ico"></i> Catálogo</button>
    <button type="button" class="tab-btn" data-tab="registrar"><i data-lucide="plus" class="ico"></i> Registrar</button>
  </div>

  <div class="tab-panel" data-tab-panel="registrar" hidden>
    <div class="card form-card" style="margin-bottom:18px">
      <div class="form-card-header">
        <div class="form-card-icon"><i data-lucide="car-taxi-front" class="ico"></i></div>
        <div>
          <h3>Registrar usuario</h3>
          <p>Da de alta a alguien autorizado para usar Uber</p>
        </div>
      </div>
      <form id="form-uber" class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 0 14px;">
        <div class="field"><label>Nombre completo</label><input type="text" id="uber-nombre-completo" required /></div>
        <div class="field"><label>Razón social</label><select id="uber-razon-social"><option value="">Selecciona…</option></select></div>
        <div class="field">
          <label>Estatus</label>
          <select id="uber-estaus-usuario">
            <option value="">Selecciona…</option>
            <option value="ACTIVO">ACTIVO</option>
            <option value="BAJA">BAJA</option>
            <option value="PENDIENTE">PENDIENTE</option>
          </select>
        </div>
        <div class="field">
          <label>Rol</label>
          <select id="uber-rol">
            <option value="">Selecciona…</option>
            <option value="ADMINISTRADOR">ADMINISTRADOR</option>
            <option value="BENEFICIARIO">BENEFICIARIO</option>
            <option value="EMPLEADO">EMPLEADO</option>
          </select>
        </div>
        <div class="field"><label>Fecha de alta</label><input type="text" id="uber-fecha-de-alta" disabled /></div>
        <div class="field"><label>Correo electrónico</label><input type="email" id="uber-correo-electronico" /></div>
        <div class="field"><label>Teléfono</label><input type="text" id="uber-numero-telefono" /></div>
        <div class="field"><label>Sede</label><select id="uber-sede"><option value="">Selecciona…</option></select></div>
        <div class="field"><label>Oficina / Desarrollo</label><select id="uber-oficina-desarrollo"><option value="">Selecciona…</option></select></div>
        <div class="field"><label>Departamento</label><select id="uber-departamento"><option value="">Selecciona…</option></select></div>
        <div class="field"><label>Puesto</label><input type="text" id="uber-puesto" /></div>
        <div class="field"><label>Días autorizados</label><input type="text" id="uber-dias-autorizados" placeholder="Ej. Lunes a viernes" /></div>
        <div class="field"><label>Horario autorizado</label><input type="text" id="uber-horario-autorizado" placeholder="Ej. 07:00 - 19:00" /></div>
        <div class="field">
          <label>Solicitud</label>
          <input type="file" id="uber-solicitud" accept=".pdf,.png,.jpg,.jpeg" />
          <div class="file-actual" id="uber-solicitud-actual"></div>
        </div>
        <div style="grid-column: 1 / -1;"><button type="submit" id="btn-guardar-uber"><i data-lucide="car-taxi-front" class="ico"></i> Registrar usuario</button></div>
      </form>
      <div class="error-msg" id="uber-error" hidden></div>
    </div>
  </div>

  <div class="tab-panel" data-tab-panel="lista">
    <div class="card">
      <div class="card-header-row">
        <h3 style="margin:0">Catálogo</h3>
        <input type="search" id="uber-buscar-global" class="tabla-buscar-global" placeholder="Buscar en la tabla…" />
      </div>
      <div class="table-scroll">
        <table>
          <thead id="uber-thead"></thead>
          <tbody id="lista-uber"></tbody>
        </table>
      </div>
      <p class="empty-state" id="uber-vacio" hidden>Todavía no hay usuarios registrados.</p>
      <div class="tabla-pie" id="uber-pie"></div>
    </div>
  </div>

  <!-- Modal: detalle completo, solo lectura -->
  <div class="modal-backdrop" id="modal-detalle-uber" hidden>
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Detalle completo</h3>
          <p class="modal-subtitle" id="detalle-uber-nombre-label"></p>
        </div>
        <button type="button" class="modal-close" id="btn-cerrar-detalle-uber"><i data-lucide="x" class="ico"></i></button>
      </div>
      <div class="modal-form-scroll">
        <div id="detalle-uber-grid" class="info-grid"></div>
      </div>
    </div>
  </div>

  <!-- Modal: editar usuario -->
  <div class="modal-backdrop" id="modal-editar-uber" hidden>
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Editar usuario</h3>
          <p class="modal-subtitle" id="editar-uber-nombre-label"></p>
        </div>
        <button type="button" class="modal-close" id="btn-cancelar-editar-uber"><i data-lucide="x" class="ico"></i></button>
      </div>
      <form id="form-editar-uber">
        <input type="hidden" id="editar-uber-id" />
        <div class="modal-form-scroll grid" style="grid-template-columns: repeat(2, 1fr); gap: 0 14px;">
          <div class="field"><label>Nombre completo</label><input type="text" id="editar-uber-nombre-completo" required /></div>
          <div class="field"><label>Razón social</label><select id="editar-uber-razon-social"><option value="">Selecciona…</option></select></div>
          <div class="field">
            <label>Estatus</label>
            <select id="editar-uber-estaus-usuario">
              <option value="">Selecciona…</option>
              <option value="ACTIVO">ACTIVO</option>
              <option value="BAJA">BAJA</option>
              <option value="PENDIENTE">PENDIENTE</option>
            </select>
          </div>
          <div class="field">
            <label>Rol</label>
            <select id="editar-uber-rol">
              <option value="">Selecciona…</option>
              <option value="ADMINISTRADOR">ADMINISTRADOR</option>
              <option value="BENEFICIARIO">BENEFICIARIO</option>
              <option value="EMPLEADO">EMPLEADO</option>
            </select>
          </div>
          <div class="field"><label>Fecha de alta</label><input type="text" id="editar-uber-fecha-de-alta" disabled /></div>
          <div class="field"><label>Correo electrónico</label><input type="email" id="editar-uber-correo-electronico" /></div>
          <div class="field"><label>Teléfono</label><input type="text" id="editar-uber-numero-telefono" /></div>
          <div class="field"><label>Sede</label><select id="editar-uber-sede"><option value="">Selecciona…</option></select></div>
          <div class="field"><label>Oficina / Desarrollo</label><select id="editar-uber-oficina-desarrollo"><option value="">Selecciona…</option></select></div>
          <div class="field"><label>Departamento</label><select id="editar-uber-departamento"><option value="">Selecciona…</option></select></div>
          <div class="field"><label>Puesto</label><input type="text" id="editar-uber-puesto" /></div>
          <div class="field"><label>Días autorizados</label><input type="text" id="editar-uber-dias-autorizados" /></div>
          <div class="field"><label>Horario autorizado</label><input type="text" id="editar-uber-horario-autorizado" /></div>
          <div class="field">
            <label>Solicitud</label>
            <input type="file" id="editar-uber-solicitud" accept=".pdf,.png,.jpg,.jpeg" />
            <div class="file-actual" id="editar-uber-solicitud-actual"></div>
          </div>
        </div>
        <div class="error-msg" id="editar-uber-error" hidden></div>
        <button type="submit" id="btn-guardar-editar-uber" style="width:100%; margin-top:10px"><i data-lucide="save" class="ico"></i> Guardar cambios</button>
      </form>
    </div>
  </div>
</template>
