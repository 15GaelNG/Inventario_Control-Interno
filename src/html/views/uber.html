<template id="tpl-uber">
  <div class="page-header">
    <div>
      <h2><i data-lucide="car-taxi-front" class="ico"></i> Uber</h2>
      <p class="page-subtitle">Usuarios autorizados para viáticos por Uber</p>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-tile">
      <div class="stat-icon"><i data-lucide="users" class="ico"></i></div>
      <div><div class="stat-value" id="uber-stat-total">0</div><div class="stat-label">Total de usuarios</div></div>
    </div>
    <div class="stat-tile stat-tile-ok">
      <div class="stat-icon"><i data-lucide="circle-check" class="ico"></i></div>
      <div><div class="stat-value" id="uber-stat-activos">0</div><div class="stat-label">Usuarios activos</div></div>
    </div>
    <div class="stat-tile stat-tile-warn">
      <div class="stat-icon"><i data-lucide="clock" class="ico"></i></div>
      <div><div class="stat-value" id="uber-stat-pendientes">0</div><div class="stat-label">Pendientes de activar</div></div>
    </div>
    <div class="stat-tile stat-tile-warn">
      <div class="stat-icon"><i data-lucide="ban" class="ico"></i></div>
      <div><div class="stat-value" id="uber-stat-baja">0</div><div class="stat-label">Usuarios de baja</div></div>
    </div>
  </div>

  <div class="tabs-simple" id="uber-tabs">
    <button type="button" class="tab-btn active" data-tab="lista"><i data-lucide="list" class="ico"></i> Catálogo</button>
    <button type="button" class="tab-btn" data-tab="registrar"><i data-lucide="plus" class="ico"></i> Registrar</button>
  </div>

  <div class="tab-panel" data-tab-panel="registrar" hidden>
    <div class="card form-card" style="margin-bottom:18px">
      <div class="form-card-header">
        <div class="form-card-icon"><i data-lucide="car-taxi-front" class="ico"></i></div>
        <div>
          <h3>Registrar usuario</h3>
          <p>Da de alta a alguien autorizado para usar Uber</p>
        </div>
      </div>
      <form id="form-uber" class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 0 14px;">
        <!-- Los campos los pinta CamposHoja (CAMPOS_UBER en app.html); display: contents
             para que cada campo siga siendo una celda de la cuadrícula del formulario -->
        <div id="campos-form-uber" style="display: contents"></div>
        <div style="grid-column: 1 / -1;"><button type="submit" id="btn-guardar-uber"><i data-lucide="car-taxi-front" class="ico"></i> Registrar usuario</button></div>
      </form>
      <div class="error-msg" id="uber-error" hidden></div>
    </div>
  </div>

  <div class="tab-panel" data-tab-panel="lista">
    <div class="card card-compacta">
      <div id="uber-tabla"></div>
    </div>
  </div>

  <!-- Modal: editar usuario (incluye el archivo de Solicitud, por eso no es edición en línea) -->
  <div class="modal-backdrop" id="modal-editar-uber" hidden>
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Editar usuario</h3>
          <p class="modal-subtitle" id="editar-uber-nombre-label"></p>
        </div>
        <button type="button" class="modal-close" id="btn-cancelar-editar-uber"><i data-lucide="x" class="ico"></i></button>
      </div>
      <form id="form-editar-uber">
        <input type="hidden" id="editar-uber-id" />
        <div id="campos-form-editar-uber" class="modal-form-scroll grid" style="grid-template-columns: repeat(2, 1fr); gap: 0 14px;"></div>
        <div class="error-msg" id="editar-uber-error" hidden></div>
        <button type="submit" id="btn-guardar-editar-uber" style="width:100%; margin-top:10px"><i data-lucide="save" class="ico"></i> Guardar cambios</button>
      </form>
    </div>
  </div>
</template>
