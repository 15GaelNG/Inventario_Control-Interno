<template id="tpl-login">
  <div id="login-screen">
    <div class="login-grid">
      <div class="login-hero">
        <div class="login-badge">
          <img src="data:image/png;base64,<?!= include('html/logoBase64') ?>" alt="Control Interno" />
        </div>
        <h1 class="login-hero-title">CONTROL<br><span>INTERNO</span></h1>
        <p class="login-hero-tag">Ciudad Maderas</p>
      </div>

      <div class="login-panel">
        <form class="login-form" id="form-login">
          <h2>Iniciar sesión</h2>
          <p class="login-sub">Ingresa con tu cuenta del sistema</p>

          <div class="field">
            <label>Correo</label>
            <input type="email" id="login-correo" required placeholder="nombre@ciudadmaderas.com" autocomplete="username" />
          </div>
          <div class="field">
            <label>Contraseña</label>
            <input type="password" id="login-password" required autocomplete="current-password" />
          </div>

          <button type="submit">Entrar</button>
          <div class="error-msg" id="login-error" hidden></div>
        </form>
      </div>
    </div>
  </div>
</template>
