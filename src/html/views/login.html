<template id="tpl-login">
  <div id="login-screen">

    <div class="theme-toggle" id="theme-toggle">
      <button type="button" id="theme-light" title="Modo claro">☀️</button>
      <button type="button" id="theme-dark" title="Modo oscuro">🌙</button>
    </div>

    <div class="login-grid">
      <div class="login-hero">
        <div class="login-brand">
          <div class="login-brand-badge">
            <img src="data:image/png;base64,<?!= include('html/logoBase64') ?>" alt="Control Interno" />
          </div>
          <div class="login-brand-text">
            CONTROL INTERNO
            <span>CIUDAD MADERAS</span>
          </div>
        </div>

        <div class="login-hero-body">
          <h1 class="login-hero-title">Control total de tu operación, en un solo lugar.</h1>
          <p class="login-hero-sub">Administra vehículos, telefonía, accesorios y caja chica con información en tiempo real.</p>
        </div>

        <div class="login-features">
          <div class="login-feature">
            <div class="icon">🚗</div>
            <div class="label">Vehículos</div>
          </div>
          <div class="login-feature">
            <div class="icon">📱</div>
            <div class="label">Telefonía</div>
          </div>
          <div class="login-feature">
            <div class="icon">🎒</div>
            <div class="label">Accesorios</div>
          </div>
          <div class="login-feature">
            <div class="icon">💰</div>
            <div class="label">Caja chica</div>
          </div>
        </div>
      </div>

      <div class="login-panel">
        <form class="login-form-card" id="form-login">
          <div class="login-icon-badge">
            <img src="data:image/png;base64,<?!= include('html/logoBase64') ?>" alt="Control Interno" />
          </div>

          <h2>Iniciar sesión</h2>
          <p class="login-system-name">Control Interno</p>
          <p class="login-sub">Por favor ingresa tus credenciales</p>
          <div class="login-divider"></div>

          <div class="field">
            <label class="icon-label">✉️ Correo electrónico</label>
            <input type="email" id="login-correo" required placeholder="correo@ciudadmaderas.com" autocomplete="username" />
          </div>

          <div class="field">
            <label class="icon-label">🔒 Contraseña</label>
            <div class="field-icon-wrap">
              <input type="password" id="login-password" required placeholder="Ingresa tu contraseña" autocomplete="current-password" />
              <button type="button" class="toggle-password" id="toggle-password" title="Mostrar/ocultar contraseña">👁️</button>
            </div>
          </div>

          <button type="submit">🔒 Ingresar</button>
          <div class="error-msg" id="login-error" hidden></div>

          <div class="login-security-note">
            <div class="icon">🛡️</div>
            <div>
              <strong>Accede de forma segura</strong>
              <p>Tus credenciales se protegen con contraseña encriptada y sesión con expiración automática.</p>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="login-footer">© 2026 Ciudad Maderas · Control Interno</div>
  </div>
</template>
