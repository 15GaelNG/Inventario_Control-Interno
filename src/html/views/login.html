<template id="tpl-login">
  <div id="login-screen">

    <div class="theme-toggle" id="theme-toggle">
      <button type="button" class="theme-btn" data-tema="light" title="Modo claro"><i data-lucide="sun" class="ico"></i></button>
      <button type="button" class="theme-btn" data-tema="dark" title="Modo oscuro"><i data-lucide="moon" class="ico"></i></button>
    </div>

    <div class="login-grid">
      <div class="login-hero">
        <div class="login-hero-bg login-hero-bg-light"></div>
        <div class="login-hero-bg login-hero-bg-dark"></div>

        <div class="login-hero-content">
          <div class="login-brand">
            <div class="login-brand-badge">
              <img src="https://raw.githubusercontent.com/15GaelNG/Inventario_Control-Interno/master/assets/logo.png" alt="Control Interno" />
            </div>
            <div class="login-brand-text">
              CONTROL INTERNO
              <span>CIUDAD MADERAS</span>
            </div>
          </div>

          <div class="login-hero-body">
            <h1 class="login-hero-title">Control total de tu operación, en un solo lugar.</h1>
            <p class="login-hero-sub">Administra vehículos, telefonía, accesorios y caja chica con información en tiempo real.</p>
          </div>

          <div class="login-features">
            <div class="login-feature">
              <div class="icon"><i data-lucide="car" class="ico"></i></div>
              <div class="label">Vehículos</div>
            </div>
            <div class="login-feature">
              <div class="icon"><i data-lucide="smartphone" class="ico"></i></div>
              <div class="label">Telefonía</div>
            </div>
            <div class="login-feature">
              <div class="icon"><i data-lucide="backpack" class="ico"></i></div>
              <div class="label">Accesorios</div>
            </div>
            <div class="login-feature">
              <div class="icon"><i data-lucide="wallet" class="ico"></i></div>
              <div class="label">Caja chica</div>
            </div>
          </div>
        </div>
      </div>

      <div class="login-panel">
        <form class="login-form-card" id="form-login">
          <div class="login-icon-badge">
            <img src="https://raw.githubusercontent.com/15GaelNG/Inventario_Control-Interno/master/assets/logo.png" alt="Control Interno" />
          </div>

          <h2>Iniciar sesión</h2>
          <p class="login-system-name">Control Interno</p>
          <p class="login-sub">Por favor ingresa tus credenciales</p>
          <div class="login-divider"></div>

          <div class="google-account-detectando" id="google-account-detectando">
            <span class="spinner"></span> Detectando tu cuenta de Google…
          </div>
          <button type="button" class="google-account-chip" id="google-account-chip" hidden>
            <div class="google-account-avatar" id="google-account-avatar"></div>
            <div class="google-account-info">
              <div class="google-account-label">Continuar como</div>
              <div class="google-account-name" id="google-account-name"></div>
              <div class="google-account-email" id="google-account-email"></div>
            </div>
            <div class="google-account-g">G</div>
          </button>
          <div class="login-or-divider" id="login-or-divider" hidden><span>o continúa con tu correo</span></div>

          <div class="field">
            <label class="icon-label">Correo electrónico</label>
            <input type="email" id="login-correo" required placeholder="correo@ciudadmaderas.com" autocomplete="username" />
          </div>

          <div class="field">
            <label class="icon-label">Contraseña</label>
            <div class="field-icon-wrap">
              <input type="password" id="login-password" required placeholder="Ingresa tu contraseña" autocomplete="current-password" />
              <button type="button" class="toggle-password" id="toggle-password" title="Mostrar/ocultar contraseña"><i data-lucide="eye-off" class="ico"></i></button>
            </div>
          </div>

          <button type="submit" id="btn-login">Ingresar</button>
          <div class="error-msg" id="login-error" hidden></div>
        </form>
      </div>
    </div>
  </div>
</template>
