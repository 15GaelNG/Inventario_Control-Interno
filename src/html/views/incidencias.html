<template id="tpl-incidencias">
  <div class="page-header">
    <div>
      <h2><i data-lucide="wrench" class="ico"></i> Incidencias</h2>
      <p class="page-subtitle">Bitácora de taller — ingreso, trabajo realizado y salida del vehículo</p>
    </div>
    <div class="page-header-actions">
      <button type="button" class="secondary" id="btn-exportar-excel-incidencias"><i data-lucide="file-spreadsheet" class="ico"></i> Exportar a Excel</button>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-tile">
      <div class="stat-icon"><i data-lucide="clipboard-list" class="ico"></i></div>
      <div><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
    </div>
    <div class="stat-tile stat-tile-warn">
      <div class="stat-icon"><i data-lucide="lock-open" class="ico"></i></div>
      <div><div class="stat-value" id="stat-abiertas">0</div><div class="stat-label">Abiertas</div></div>
    </div>
    <div class="stat-tile stat-tile-ok">
      <div class="stat-icon"><i data-lucide="circle-check" class="ico"></i></div>
      <div><div class="stat-value" id="stat-cerradas">0</div><div class="stat-label">Cerradas</div></div>
    </div>
  </div>

  <div class="tabs-simple" id="inc-tabs">
    <button type="button" class="tab-btn active" data-tab="lista"><i data-lucide="list" class="ico"></i> Historial</button>
    <button type="button" class="tab-btn" data-tab="registrar"><i data-lucide="plus" class="ico"></i> Registrar</button>
  </div>

  <div class="tab-panel" data-tab-panel="registrar" hidden>
    <div class="card form-card" style="margin-bottom:18px">
      <div class="form-card-header">
        <div class="form-card-icon"><i data-lucide="car" class="ico"></i></div>
        <div>
          <h3>Registrar ingreso</h3>
          <p>Da de alta el vehículo que entra al taller</p>
        </div>
      </div>
      <form id="form-incidencia" class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 0 14px;">
        <div class="field">
          <label>Folio del vehículo</label>
          <input type="text" id="inc-folio" list="lista-folios-vehiculo" required placeholder="Escribe o elige el folio" autocomplete="off" />
          <datalist id="lista-folios-vehiculo"></datalist>
        </div>
        <div class="field"><label>Departamento <span class="auto-tag" id="tag-departamento" hidden>auto</span></label><input type="text" id="inc-departamento" /></div>
        <div class="field"><label>Modelo <span class="auto-tag" id="tag-modelo" hidden>auto</span></label><input type="text" id="inc-modelo" /></div>
        <div class="field"><label>Año</label><input type="number" id="inc-anio" /></div>
        <div class="field"><label>Fecha de registro</label><input type="text" id="inc-fecha-registro" disabled /></div>
        <div class="field"><label>Fecha de inspección</label><input type="date" id="inc-fecha-inspeccion" /></div>
        <div class="field"><label>Kilometraje</label><input type="number" id="inc-kilometraje" /></div>
        <div class="field"><label>Ticket</label><input type="text" id="inc-ticket" /></div>
        <div class="field"><label>Periodo de verificación</label><input type="text" id="inc-periodo-verificacion" placeholder="Ej. 2do semestre 2026" /></div>
        <div class="field"><label>Seguro de auto</label><input type="text" id="inc-seguro-auto" placeholder="Ej. Póliza vigente" /></div>
        <div class="field" style="grid-column: 1 / -1;">
          <label>Inspección de ingreso (motivo)</label>
          <input type="text" id="inc-motivo" placeholder="Ej. Cambio de batería" />
        </div>
        <div style="grid-column: 1 / -1;"><button type="submit"><i data-lucide="car" class="ico"></i> Registrar ingreso</button></div>
      </form>
      <div class="error-msg" id="inc-error" hidden></div>
    </div>
  </div>

  <div class="tab-panel" data-tab-panel="lista">
    <div class="card">
      <div class="card-header-row">
        <h3 style="margin:0">Historial</h3>
        <input type="search" id="inc-buscar-global" class="tabla-buscar-global" placeholder="Buscar en la tabla…" />
      </div>
      <div class="table-scroll">
        <table>
          <thead id="inc-thead"></thead>
          <tbody id="lista-incidencias"></tbody>
        </table>
      </div>
      <p class="empty-state" id="incidencias-vacio" hidden>Todavía no hay incidencias registradas.</p>
      <div class="tabla-pie" id="inc-pie"></div>
    </div>
  </div>

  <!-- Modal: cerrar incidencia -->
  <div class="modal-backdrop" id="modal-cerrar" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Cerrar incidencia</h3>
          <p class="modal-subtitle" id="cerrar-folio"></p>
        </div>
        <button type="button" class="modal-close" id="btn-cancelar-cierre"><i data-lucide="x" class="ico"></i></button>
      </div>
      <form id="form-cerrar-incidencia">
        <input type="hidden" id="cerrar-id" />
        <div class="field">
          <label>Trabajo realizado</label>
          <input type="text" id="cerrar-trabajo" required placeholder="Ej. Cambio de batería" />
        </div>
        <div class="field">
          <label>Fecha del trabajo realizado</label>
          <input type="date" id="cerrar-fecha-trabajo" />
        </div>
        <div class="field">
          <label>Resultado de inspección de salida</label>
          <input type="text" id="cerrar-salida" placeholder="Ej. Reemplazo realizado" />
        </div>
        <div class="field">
          <label>Mecánico</label>
          <input type="text" id="cerrar-mecanico" placeholder="Nombre del mecánico" />
        </div>
        <div class="error-msg" id="cerrar-error" hidden></div>
        <button type="submit" style="width:100%"><i data-lucide="circle-check" class="ico"></i> Guardar y cerrar</button>
      </form>
    </div>
  </div>

  <!-- Modal: editar incidencia (corrige cualquier campo) -->
  <div class="modal-backdrop" id="modal-editar" hidden>
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Editar incidencia</h3>
          <p class="modal-subtitle" id="editar-folio-label"></p>
        </div>
        <button type="button" class="modal-close" id="btn-cancelar-editar"><i data-lucide="x" class="ico"></i></button>
      </div>
      <form id="form-editar-incidencia">
        <input type="hidden" id="editar-id" />
        <div class="modal-form-scroll grid" style="grid-template-columns: repeat(2, 1fr); gap: 0 14px;">
          <div class="field"><label>Folio del vehículo</label><input type="text" id="editar-folio" list="lista-folios-vehiculo" /></div>
          <div class="field"><label>Departamento</label><input type="text" id="editar-departamento" /></div>
          <div class="field"><label>Modelo</label><input type="text" id="editar-modelo" /></div>
          <div class="field"><label>Año</label><input type="number" id="editar-anio" /></div>
          <div class="field"><label>Fecha de inspección</label><input type="date" id="editar-fecha-inspeccion" /></div>
          <div class="field"><label>Kilometraje</label><input type="number" id="editar-kilometraje" /></div>
          <div class="field"><label>Ticket</label><input type="text" id="editar-ticket" /></div>
          <div class="field"><label>Periodo de verificación</label><input type="text" id="editar-periodo-verificacion" /></div>
          <div class="field"><label>Seguro de auto</label><input type="text" id="editar-seguro-auto" /></div>
          <div class="field" style="grid-column: 1 / -1;"><label>Inspección de ingreso (motivo)</label><input type="text" id="editar-motivo" /></div>
          <div class="field" style="grid-column: 1 / -1;"><label>Descripción de trabajo realizado</label><input type="text" id="editar-trabajo" /></div>
          <div class="field"><label>Fecha del trabajo realizado</label><input type="date" id="editar-fecha-trabajo" /></div>
          <div class="field"><label>Mecánico</label><input type="text" id="editar-mecanico" /></div>
          <div class="field" style="grid-column: 1 / -1;"><label>Inspección de salida</label><input type="text" id="editar-salida" /></div>
        </div>
        <div class="error-msg" id="editar-error" hidden></div>
        <button type="submit" style="width:100%; margin-top:10px"><i data-lucide="save" class="ico"></i> Guardar cambios</button>
      </form>
    </div>
  </div>

  <!-- Modal: info completa del vehículo (al dar clic en una incidencia) -->
  <div class="modal-backdrop" id="modal-vehiculo" hidden>
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Detalle completo</h3>
          <p class="modal-subtitle" id="vehiculo-folio-label"></p>
        </div>
        <button type="button" class="modal-close" id="btn-cerrar-vehiculo"><i data-lucide="x" class="ico"></i></button>
      </div>
      <div class="modal-form-scroll">
        <div id="vehiculo-info-grid" class="info-grid"></div>
        <p class="empty-state" id="vehiculo-info-vacio" hidden>
          No se encontró este folio en el catálogo de Vehículos.
        </p>
      </div>
    </div>
  </div>
</template>
