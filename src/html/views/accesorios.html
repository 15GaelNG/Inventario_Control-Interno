<template id="tpl-accesorios">
  <div class="page-header">
    <div>
      <h2><i data-lucide="backpack" class="ico"></i> Accesorios</h2>
      <p class="page-subtitle">Catálogo de artículos y movimientos de entrada/salida de stock</p>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-tile">
      <div class="stat-icon"><i data-lucide="backpack" class="ico"></i></div>
      <div><div class="stat-value" id="acc-stat-total">0</div><div class="stat-label">Artículos</div></div>
    </div>
    <div class="stat-tile stat-tile-warn">
      <div class="stat-icon"><i data-lucide="triangle-alert" class="ico"></i></div>
      <div><div class="stat-value" id="acc-stat-bajo">0</div><div class="stat-label">Bajo stock</div></div>
    </div>
  </div>

  <div class="tabs-simple" id="acc-tabs">
    <button type="button" class="tab-btn active" data-tab="lista"><i data-lucide="list" class="ico"></i> Catálogo</button>
    <button type="button" class="tab-btn" data-tab="registrar"><i data-lucide="plus" class="ico"></i> Registrar movimiento</button>
  </div>

  <div class="tab-panel" data-tab-panel="registrar" hidden>
    <div class="card form-card" style="margin-bottom:18px">
      <div class="form-card-header">
        <div class="form-card-icon"><i data-lucide="repeat" class="ico"></i></div>
        <div>
          <h3>Registrar movimiento</h3>
          <p>Entrada o salida de stock de un artículo ya existente</p>
        </div>
      </div>
      <form id="form-movimiento" class="grid" style="grid-template-columns: 2fr 1fr 1fr; gap: 0 14px;">
        <div class="field"><label>Artículo</label><select id="mov-articulo" required></select></div>
        <div class="field">
          <label>Tipo</label>
          <select id="mov-tipo" required>
            <option value="ENTRADA">Entrada</option>
            <option value="SALIDA">Salida</option>
          </select>
        </div>
        <div class="field"><label>Cantidad</label><input type="number" id="mov-cantidad" min="1" required /></div>
        <div style="grid-column: 1 / -1;"><button type="submit"><i data-lucide="repeat" class="ico"></i> Registrar movimiento</button></div>
      </form>
      <div class="error-msg" id="mov-error" hidden></div>
    </div>
  </div>

  <div class="tab-panel" data-tab-panel="lista">
    <div class="card card-compacta">
      <div style="display:flex; justify-content:flex-end; padding:12px 12px 0" id="acc-nuevo-wrap" hidden>
        <button type="button" class="secondary" id="btn-nuevo-articulo"><i data-lucide="plus" class="ico"></i> Nuevo artículo</button>
      </div>
      <div id="acc-tabla"></div>
    </div>
  </div>

  <!-- Modal: nuevo artículo / editar artículo -->
  <div class="modal-backdrop" id="modal-editar-articulo" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 style="margin:0" id="editar-articulo-titulo">Nuevo artículo</h3>
          <p class="modal-subtitle" id="editar-articulo-label"></p>
        </div>
        <button type="button" class="modal-close" id="btn-cancelar-editar-articulo"><i data-lucide="x" class="ico"></i></button>
      </div>
      <form id="form-editar-articulo">
        <input type="hidden" id="editar-articulo-id" />
        <div class="modal-form-scroll grid" style="grid-template-columns: 1fr; gap: 0 14px;">
          <div class="field"><label>Categoría</label><input type="text" id="editar-articulo-categoria" required /></div>
          <div class="field"><label>Nombre del artículo</label><input type="text" id="editar-articulo-nombre" required /></div>
          <div class="field"><label>Marca</label><input type="text" id="editar-articulo-marca" /></div>
        </div>
        <div class="error-msg" id="editar-articulo-error" hidden></div>
        <button type="submit" style="width:100%; margin-top:10px" id="btn-guardar-editar-articulo"><i data-lucide="save" class="ico"></i> Guardar</button>
      </form>
    </div>
  </div>
</template>
