<template id="tpl-accesorios">
  <h2><i data-lucide="backpack" class="ico"></i> Accesorios — Inventario</h2>

  <div class="tabs-simple" id="acc-tabs">
    <button type="button" class="tab-btn active" data-tab="lista"><i data-lucide="list" class="ico"></i> Catálogo</button>
    <button type="button" class="tab-btn" data-tab="registrar"><i data-lucide="plus" class="ico"></i> Registrar</button>
  </div>

  <div class="tab-panel" data-tab-panel="registrar" hidden>
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Registrar movimiento</h3>
      <form id="form-movimiento" class="grid" style="grid-template-columns: 2fr 1fr 1fr auto; align-items:end">
        <div class="field" style="margin:0">
          <label>Artículo</label>
          <select id="mov-articulo" required></select>
        </div>
        <div class="field" style="margin:0">
          <label>Tipo</label>
          <select id="mov-tipo" required>
            <option value="ENTRADA">Entrada</option>
            <option value="SALIDA">Salida</option>
          </select>
        </div>
        <div class="field" style="margin:0">
          <label>Cantidad</label>
          <input type="number" id="mov-cantidad" min="1" required />
        </div>
        <button type="submit">Registrar</button>
      </form>
      <div class="error-msg" id="mov-error" hidden></div>
    </div>
  </div>

  <div class="tab-panel" data-tab-panel="lista">
    <div class="card">
      <h3 style="margin-top:0">Catálogo</h3>
      <table>
        <thead>
          <tr><th>Categoría</th><th>Artículo</th><th>Marca</th><th>Stock</th></tr>
        </thead>
        <tbody id="tabla-articulos"></tbody>
      </table>
    </div>
  </div>
</template>
