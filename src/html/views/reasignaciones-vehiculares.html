<template id="tpl-reasignaciones-vehiculares">
  <div class="page-header">
    <div>
      <h2><i data-lucide="arrow-left-right" class="ico"></i> Reasignaciones Vehiculares</h2>
      <p class="page-subtitle">Historial de cambio de responsable de cada vehículo</p>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-tile">
      <div class="stat-icon"><i data-lucide="arrow-left-right" class="ico"></i></div>
      <div><div class="stat-value" id="rv-stat-total">0</div><div class="stat-label">Total de reasignaciones</div></div>
    </div>
    <div class="stat-tile">
      <div class="stat-icon"><i data-lucide="calendar" class="ico"></i></div>
      <div><div class="stat-value" id="rv-stat-hoy">0</div><div class="stat-label">Reasignaciones de hoy</div></div>
    </div>
  </div>

  <div class="tabs-simple" id="rv-tabs">
    <button type="button" class="tab-btn active" data-tab="lista"><i data-lucide="list" class="ico"></i> Historial</button>
    <button type="button" class="tab-btn" data-tab="registrar"><i data-lucide="plus" class="ico"></i> Registrar</button>
  </div>

  <div class="tab-panel" data-tab-panel="registrar" hidden>
    <div class="card form-card" style="margin-bottom:18px">
      <div class="form-card-header">
        <div class="form-card-icon"><i data-lucide="arrow-left-right" class="ico"></i></div>
        <div>
          <h3>Registrar reasignación</h3>
          <p>Cambia el responsable actual de un vehículo</p>
        </div>
      </div>
      <form id="form-reasignacion-vehicular" class="form-rejilla" data-columnas="3">
        <!-- Los campos los pinta CamposHoja (CAMPOS_REASIGNACION en app-reasignaciones.html) -->
        <div id="campos-form-reasignacion-vehicular" style="display: contents"></div>
        <div style="grid-column: 1 / -1;"><button type="submit" id="btn-guardar-reasignacion-vehicular"><i data-lucide="arrow-left-right" class="ico"></i> Registrar reasignación</button></div>
      </form>
      <div class="error-msg" id="rv-error" hidden></div>
    </div>
  </div>

  <div class="tab-panel" data-tab-panel="lista">
    <div class="card card-compacta">
      <div id="rv-tabla"></div>
    </div>
  </div>
</template>
