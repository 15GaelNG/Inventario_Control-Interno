<template id="tpl-dashboard">
  <h2>Inicio</h2>

  <div class="dash-section">
    <h3 class="dash-section-title">Resumen</h3>
    <div class="stat-row" id="dash-kpis">
      <div class="stat-tile stat-tile-clickable nav-module" data-view="vehiculos" style="cursor:pointer">
        <div class="stat-ring" id="dash-ring-vehiculos-activos" style="--stat-color:var(--color-success)"><div class="stat-ring-hole"><i data-lucide="truck" class="ico"></i></div></div>
        <div><div class="stat-value" id="dash-kpi-vehiculos-activos">—</div><div class="stat-label">Vehículos activos</div></div>
      </div>
      <div class="stat-tile stat-tile-clickable nav-module" data-view="vehiculos" style="cursor:pointer">
        <div class="stat-ring" id="dash-ring-vehiculos-baja" style="--stat-color:var(--color-danger)"><div class="stat-ring-hole"><i data-lucide="ban" class="ico"></i></div></div>
        <div><div class="stat-value" id="dash-kpi-vehiculos-baja">—</div><div class="stat-label">Vehículos de baja</div></div>
      </div>
      <div class="stat-tile stat-tile-clickable nav-module" data-view="incidencias" style="cursor:pointer">
        <div class="stat-ring" id="dash-ring-incidencias-abiertas" style="--stat-color:var(--color-danger)"><div class="stat-ring-hole"><i data-lucide="wrench" class="ico"></i></div></div>
        <div><div class="stat-value" id="dash-kpi-incidencias-abiertas">—</div><div class="stat-label">Incidencias abiertas</div></div>
      </div>
      <div class="stat-tile stat-tile-clickable nav-module" data-view="tickets" style="cursor:pointer">
        <div class="stat-ring" id="dash-ring-tickets-recientes" style="--stat-color:var(--color-primary)"><div class="stat-ring-hole"><i data-lucide="ticket" class="ico"></i></div></div>
        <div><div class="stat-value" id="dash-kpi-tickets-recientes">—</div><div class="stat-label">Tickets (últimos 30 días)</div></div>
      </div>
      <div class="stat-tile stat-tile-clickable nav-module" data-view="caja-chica" style="cursor:pointer">
        <div class="stat-ring" id="dash-ring-cch-vigentes" style="--stat-color:var(--color-success)"><div class="stat-ring-hole"><i data-lucide="circle-check" class="ico"></i></div></div>
        <div><div class="stat-value" id="dash-kpi-cch-vigentes">—</div><div class="stat-label">Cajas chicas vigentes</div></div>
      </div>
      <div class="stat-tile stat-tile-clickable nav-module" data-view="caja-chica" style="cursor:pointer">
        <div class="stat-ring" id="dash-ring-cch-proceso" style="--stat-color:var(--color-accent)"><div class="stat-ring-hole"><i data-lucide="clock" class="ico"></i></div></div>
        <div><div class="stat-value" id="dash-kpi-cch-proceso">—</div><div class="stat-label">Cajas chicas en cierre</div></div>
      </div>
    </div>
  </div>

  <div class="dash-section">
    <h3 class="dash-section-title">Pendientes que necesitan atención</h3>
    <div class="stat-row" id="dash-alertas">
      <div class="stat-tile stat-tile-warn stat-tile-clickable nav-module" data-view="verificaciones" style="cursor:pointer">
        <div class="stat-ring" id="dash-ring-verif-vencidas" style="--stat-color:var(--color-danger)"><div class="stat-ring-hole"><i data-lucide="triangle-alert" class="ico"></i></div></div>
        <div><div class="stat-value" id="dash-alerta-verif-vencidas">—</div><div class="stat-label">Verificaciones vencidas</div></div>
      </div>
      <div class="stat-tile stat-tile-warn stat-tile-clickable nav-module" data-view="verificaciones" style="cursor:pointer">
        <div class="stat-ring" id="dash-ring-verif-por-vencer" style="--stat-color:var(--color-accent)"><div class="stat-ring-hole"><i data-lucide="hourglass" class="ico"></i></div></div>
        <div><div class="stat-value" id="dash-alerta-verif-por-vencer">—</div><div class="stat-label">Verificaciones por vencer</div></div>
      </div>
      <div class="stat-tile stat-tile-warn stat-tile-clickable nav-module" data-view="inspeccion-vehicular" style="cursor:pointer">
        <div class="stat-ring" id="dash-ring-insp-atrasadas" style="--stat-color:var(--color-danger)"><div class="stat-ring-hole"><i data-lucide="clipboard-x" class="ico"></i></div></div>
        <div><div class="stat-value" id="dash-alerta-insp-atrasadas">—</div><div class="stat-label">Inspecciones atrasadas</div></div>
      </div>
    </div>
  </div>

  <div class="dash-grid-2">
    <div class="dash-section">
      <h3 class="dash-section-title">Actividad reciente</h3>
      <div id="dash-actividad"><p class="empty-state">Cargando…</p></div>
    </div>

    <div class="dash-section">
      <h3 class="dash-section-title">Accesos rápidos</h3>
      <div class="grid grid-accesos">
        <div class="card nav-module" data-view="incidencias" data-etiqueta="Incidencias" style="cursor:pointer">
          <strong><i data-lucide="wrench" class="ico"></i> Registrar incidencia</strong>
        </div>
        <div class="card nav-module" data-view="tickets" data-etiqueta="Tickets" style="cursor:pointer">
          <strong><i data-lucide="ticket" class="ico"></i> Nuevo ticket</strong>
        </div>
        <div class="card nav-module" data-view="arqueos" data-etiqueta="Arqueos" style="cursor:pointer">
          <strong><i data-lucide="wallet" class="ico"></i> Registrar arqueo</strong>
        </div>
        <div class="card nav-module" data-view="inspeccion-vehicular" data-etiqueta="Inspección Vehicular" style="cursor:pointer">
          <strong><i data-lucide="clipboard-check" class="ico"></i> Nueva inspección vehicular</strong>
        </div>
      </div>
    </div>
  </div>
</template>
