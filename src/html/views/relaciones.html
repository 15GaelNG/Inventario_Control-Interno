<style>

  /* ---- Vista sencilla (para todos): pestaña Avisos + una por familia ---- */

  .rel-s { max-width: 1040px; }

  .rel-s-h3 { margin: 4px 0 6px; font-size: 17px; display: flex; align-items: center; gap: 8px; }

  .rel-s-seccion-avisos { margin-top: 18px; }

  .rel-s-pend-titulo { font-weight: 600; font-size: 14px; }
  .rel-s-pend-ejemplo { font-size: 13px; color: var(--color-text-muted); margin-top: 3px; }

  .rel-s-bien { display: flex; align-items: flex-start; gap: 7px; font-size: 13px; color: var(--color-text-muted); margin: 5px 0; }

    .rel-s-tabla thead { display: none; }

  .rel-s-detalle-cabeza p { margin: 0; font-size: 13px; color: var(--color-text-muted); max-width: 640px; }
  .rel-s-detalle-cabeza button { display: inline-flex; align-items: center; gap: 6px; }

  /* ---- Conexiones (app-datos-conectados.html): una tarjeta por par de hojas, editable ---- */

  .dc-filtros { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .dc-chip { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text); }
  .dc-chip.activo { background: var(--color-primary-soft); color: var(--color-primary); border-color: var(--color-primary); font-weight: 600; }
  .dc-nueva { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .dc-tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .dc-tarjeta { border: 1px solid var(--color-border); border-radius: 12px; padding: 14px; background: var(--color-surface); display: flex; flex-direction: column; gap: 10px; }
  .dc-tarjeta.dc-reves { border-style: dashed; }
  .dc-nueva-card { margin-bottom: 14px; border-color: var(--color-primary); }

  .dc-t-cabeza .rel-tipo { margin-top: 2px; }

  .dc-destino { display: inline-flex; align-items: center; gap: 8px; }
  .dc-t-llave { margin: 0; font-size: 12.5px; color: var(--color-text-muted); }
  .dc-datos { display: flex; flex-direction: column; gap: 4px; }
  .dc-dato { display: grid; grid-template-columns: 1fr auto 1fr 28px; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: var(--color-bg); font-size: 13px; }
  .dc-de, .dc-a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dc-flecha { color: var(--color-text-muted); display: inline-flex; }

  .dc-quitar { background: transparent; border: none; padding: 2px; color: var(--color-text-muted); display: inline-flex; justify-content: center; }

  .dc-t-acciones button, .dc-form-acciones button, .dc-vista-acciones button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; }
  .dc-sutil { font-size: 12px; color: var(--color-text-muted); margin: 0; }
  .dc-seccion { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--color-border); }
  .dc-h4 { margin: 0 0 4px; font-size: 14.5px; display: flex; align-items: center; gap: 7px; }
  .dc-seccion-texto { margin-bottom: 12px; }
  .dc-h5 { margin: 12px 0 6px; font-size: 13.5px; }
  .dc-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .dc-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--color-text-muted); flex: 1 1 200px; }
  .dc-form select { width: 100%; }
  .dc-form-acciones, .dc-vista-acciones { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
  .dc-agregar { border-top: 1px dashed var(--color-border); padding-top: 10px; }
  .dc-agregar [data-dc-previa] { width: 100%; }
  .dc-llaves { display: flex; flex-direction: column; gap: 6px; }
  .dc-opcion { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
  .dc-opcion input { width: auto; margin-top: 3px; }

  .dc-vista { border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--color-bg); }
  .dc-cifras { margin: 0; font-size: 13px; }
  .dc-dif { font-size: 13px; }
  .dc-ejemplos { margin: 4px 0 0 18px; padding: 0; font-size: 12.5px; color: var(--color-text-muted); }
  .dc-ejemplos code { background: var(--color-surface); padding: 0 5px; border-radius: 5px; }
  .dc-aviso { color: var(--color-danger); font-weight: 600; }
  .dc-ok { color: var(--color-success); display: inline-flex; align-items: center; gap: 4px; }
  @media (max-width: 640px) {
    .dc-tarjetas { grid-template-columns: 1fr; }
    .dc-nueva { margin-left: 0; }
    /* En celular el nombre del dato se parte en renglones en vez de cortarse ("Número de em…") */
    .dc-de, .dc-a { white-space: normal; overflow-wrap: anywhere; }
    .dc-elegir-fila { grid-template-columns: 1fr; }

<!--
  Administración > Datos conectados: el MAPA de qué módulo decide cada dato y a dónde se

-->
<template id="tpl-relaciones">

    </div>
  </div>

  <!-- Vista sencilla: una pestaña por familia (las agrega initRelaciones al cargar el mapa) -->

    <div id="rel-s-tabs">
      <div class="tabs-lista" id="rel-s-tabs-lista"></div>
    </div>
  </div>
