<style>
  /* ============ Relaciones entre hojas (Administración) — todo con prefijo .rel ============ */
  .rel-barra { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .rel-barra .rel-cuando { font-size: 12.5px; color: var(--color-text-muted); }
  .rel-grupo { margin-bottom: 18px; }
  .rel-grupo h3 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .rel-grupo .rel-sub { font-size: 12.5px; color: var(--color-text-muted); font-weight: normal; }
  .rel-tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .rel-tarjeta { border: 1px solid var(--color-border); border-radius: 10px; padding: 12px; background: var(--color-surface); display: flex; flex-direction: column; gap: 8px; }
  .rel-tarjeta-titulo { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; }
  .rel-cifras { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12.5px; }
  .rel-cifras span { color: var(--color-text-muted); }
  .rel-cifras strong.rel-alerta { color: var(--color-danger); }
  .rel-tarjeta-acciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .rel-tarjeta-acciones button { padding: 6px 10px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
  .rel-al-dia { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--color-success); font-weight: 600; padding: 6px 4px; }
  .rel-calc { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--color-bg); color: var(--color-text-muted); border: 1px solid var(--color-border); margin-left: 4px; }
  .rel-nota { font-size: 12px; color: var(--color-text-muted); margin: 0; }
  .rel-tipo { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .rel-tipo.cache { background: var(--color-primary-soft); color: var(--color-primary); }
  .rel-tipo.bitacora { background: var(--color-bg); color: var(--color-text-muted); border: 1px solid var(--color-border); }
  .rel-matriz-scroll { overflow: auto; border: 1px solid var(--color-border); border-radius: 10px; }
  .rel-matriz { font-size: 12.5px; border-collapse: collapse; min-width: 100%; }
  .rel-matriz th, .rel-matriz td { padding: 7px 10px; border-bottom: 1px solid var(--color-border); text-align: left; white-space: nowrap; }
  .rel-matriz thead th { background: var(--color-surface); position: sticky; top: 0; vertical-align: bottom; }
  .rel-matriz thead th .rel-llave { display: block; font-weight: normal; font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
  .rel-matriz tbody th { font-weight: 600; position: sticky; left: 0; background: var(--color-surface); }
  .rel-matriz td.rel-vacia { color: var(--color-border); text-align: center; }
  .rel-matriz td.rel-igual { color: var(--color-text); }
  .rel-matriz td.rel-renombrada, .rel-leyenda .rel-renombrada { color: var(--color-primary); }
  .rel-leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--color-text-muted); margin: 10px 0 0; }
  .rel-centinelas code { background: var(--color-bg); padding: 1px 6px; border-radius: 6px; margin-right: 4px; font-size: 12px; }

  /* ---- Vista sencilla (para todos): pestaña Avisos + una por familia ---- */
  .rel-switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-muted); cursor: pointer; user-select: none; white-space: nowrap; }
  .rel-switch input { width: auto; margin: 0; }
  .rel-s { max-width: 1040px; }
  .rel-s-badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 11.5px; background: var(--color-danger); color: #fff; }
  .rel-s-cabeza { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .rel-s-cabeza button { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 13px; }
  .rel-s-cuando { font-size: 12.5px; color: var(--color-text-muted); }
  .rel-s-h3 { margin: 4px 0 6px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .rel-s-h3 svg { color: var(--color-danger); }
  .rel-s-h3.ok svg { color: var(--color-success); }
  .rel-s-seccion-avisos { margin-top: 18px; }
  .rel-s-seccion-avisos h4 { margin: 0; font-size: 14.5px; display: flex; align-items: center; gap: 7px; }
  .rel-s-seccion-avisos.boton h4 svg { color: var(--color-accent); }
  .rel-s-seccion-avisos.mano h4 svg { color: var(--color-danger); }
  .rel-s-seccion-avisos.bien h4 svg { color: var(--color-success); }
  .rel-s-sec-texto { margin: 2px 0 10px; font-size: 12.5px; color: var(--color-text-muted); }
  .rel-s-familia { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-muted); margin: 10px 0 6px; }
  .rel-s-pends { display: flex; flex-direction: column; gap: 8px; }
  .rel-s-pend { border: 1px solid var(--color-border); border-left: 4px solid var(--color-border); border-radius: 10px; padding: 11px 14px; background: var(--color-surface); }
  .rel-s-pend.boton { border-left-color: var(--color-accent); }
  .rel-s-pend.mano { border-left-color: var(--color-danger); }
  .rel-s-pend-titulo { font-weight: 600; font-size: 14px; }
  .rel-s-pend-ejemplo { font-size: 13px; color: var(--color-text-muted); margin-top: 3px; }
  .rel-s-pend-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
  .rel-s-pend-acciones button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; }
  .rel-s-bien { display: flex; align-items: flex-start; gap: 7px; font-size: 13px; color: var(--color-text-muted); margin: 5px 0; }
  .rel-s-bien svg { flex: none; margin-top: 2px; color: var(--color-success); }
  .rel-s-bien .dt-link { padding: 0 2px; }
  .rel-s-intro { margin: 0 0 10px; font-size: 13px; color: var(--color-text-muted); }
  .rel-s-buscar { max-width: 320px; margin-bottom: 10px; }
  .rel-s-tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rel-s-tabla th { text-align: left; font-size: 12px; color: var(--color-text-muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--color-border); }
  .rel-s-tabla td { padding: 9px 10px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
  .rel-s-tabla tr:last-child td { border-bottom: none; }
  .rel-s-sutil { color: var(--color-text-muted); font-size: 12px; margin-top: 3px; max-width: 420px; }
  .rel-s-nada { color: var(--color-border); }
  .rel-s-ayuda-td { width: 36px; text-align: center; }
  .rel-s-ayuda { background: transparent; border: none; padding: 2px; color: var(--color-text-muted); cursor: help; display: inline-flex; }
  .rel-s-ayuda:hover { color: var(--color-primary); background: transparent; }
  /* En celular la tabla se apila: un dato por tarjeta, cada valor con su etiqueta */
  @media (max-width: 720px) {
    .rel-s-tabla thead { display: none; }
    .rel-s-tabla, .rel-s-tabla tbody, .rel-s-tabla tr, .rel-s-tabla td { display: block; width: 100%; }
    .rel-s-tabla tr { border: 1px solid var(--color-border); border-radius: 10px; margin-bottom: 8px; padding: 4px 0; }
    .rel-s-tabla td { border: none; padding: 4px 12px; }
    .rel-s-tabla td:not(:first-child):not(.rel-s-ayuda-td)::before { content: attr(data-etiqueta) ': '; color: var(--color-text-muted); font-size: 12px; }
    .rel-s-tabla td.rel-s-ayuda-td { width: auto; text-align: left; }
  }
  .rel-s-volver { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 13px; margin-bottom: 10px; }
  .rel-s-detalle-cabeza { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 12px; }
  .rel-s-detalle-cabeza h3 { margin: 0 0 4px; font-size: 17px; }
  .rel-s-detalle-cabeza p { margin: 0; font-size: 13px; color: var(--color-text-muted); max-width: 640px; }
  .rel-s-detalle-cabeza button { display: inline-flex; align-items: center; gap: 6px; }
</style>

<template id="tpl-relaciones">
  <div class="page-header-compacto">
    <div>
      <h2><i data-lucide="git-compare-arrows" class="ico"></i> Datos conectados</h2>
      <p class="page-subtitle">Algunos datos se capturan en un módulo y se usan en otros. Aquí ves si siguen coincidiendo, y los pones al día.</p>
    </div>
    <label class="rel-switch"><input type="checkbox" id="rel-tecnico-toggle" /> Ver detalle técnico</label>
  </div>

  <!-- Vista sencilla: la que se ve al entrar -->
  <div id="rel-sencilla" class="rel-s">
    <div id="rel-s-inicio">
      <div id="rel-s-tabs">
        <div class="tabs-lista" id="rel-s-tabs-lista">
          <button type="button" class="tab-btn" data-tab="avisos"><i data-lucide="bell" class="ico"></i> Avisos <span class="rel-s-badge" id="rel-s-badge" hidden></span></button>
          <!-- una pestaña por familia: initRelaciones las agrega al cargar el mapa -->
        </div>
        <div class="card card-compacta" data-panel="avisos">
          <div class="rel-s-cabeza">
            <span class="rel-s-cuando" id="rel-s-cuando">Revisando los datos… tarda unos segundos</span>
            <button type="button" class="secondary" id="rel-s-revisar"><i data-lucide="refresh-cw" class="ico"></i> Revisar de nuevo</button>
          </div>
          <div id="rel-s-pendientes"></div>
        </div>
      </div>
    </div>
    <div id="rel-s-detalle" hidden>
      <button type="button" class="secondary rel-s-volver" id="rel-s-volver"><i data-lucide="arrow-left" class="ico"></i> Volver</button>
      <div class="card card-compacta">
        <div class="rel-s-detalle-cabeza">
          <div><h3 id="rel-s-detalle-titulo"></h3><p id="rel-s-detalle-texto"></p></div>
          <div id="rel-s-detalle-accion"></div>
        </div>
        <div id="rel-s-tabla"></div>
      </div>
    </div>
  </div>

  <!-- Vista técnica: la de siempre, para quien mantiene el sistema -->
  <div id="rel-tecnica" hidden>
    <div class="kpi-chips" style="margin-bottom:10px">
      <button type="button" class="kpi-chip kpi-warn" id="rel-kpi-dif" title="Ver las diferencias que se pueden sincronizar">
        <span class="kpi-chip-label">Por sincronizar</span>
        <strong class="kpi-chip-value" id="rel-stat-dif">–</strong>
      </button>
      <button type="button" class="kpi-chip" id="rel-kpi-hist" title="Ver las diferencias de bitácoras (no se tocan)">
        <span class="kpi-chip-label">Históricas</span>
        <strong class="kpi-chip-value" id="rel-stat-hist">–</strong>
      </button>
      <button type="button" class="kpi-chip" id="rel-kpi-huer" title="Ver los registros sin dueño">
        <span class="kpi-chip-label">Huérfanas</span>
        <strong class="kpi-chip-value" id="rel-stat-huer">–</strong>
      </button>
    </div>

  <div id="rel-tabs">
    <div class="tabs-lista">
      <button type="button" class="tab-btn" data-tab="estado"><i data-lucide="activity" class="ico"></i> Estado</button>
      <button type="button" class="tab-btn" data-tab="diferencias"><i data-lucide="list" class="ico"></i> Diferencias</button>
      <button type="button" class="tab-btn" data-tab="mapa"><i data-lucide="network" class="ico"></i> Mapa</button>
    </div>

    <!-- Pestaña 1: una tarjeta por hoja copia, agrupadas por su dueña -->
    <div class="card card-compacta" data-panel="estado">
      <div class="rel-barra">
        <button type="button" id="rel-revisar"><i data-lucide="refresh-cw" class="ico"></i> Revisar ahora</button>
        <span class="rel-cuando" id="rel-cuando">Revisando…</span>
      </div>
      <div id="rel-estado"></div>
    </div>

    <!-- Pestaña 2: celda por celda -->
    <div class="card card-compacta" data-panel="diferencias">
      <div id="rel-tabla"></div>
    </div>

    <!-- Pestaña 3: el MAPA de Relaciones.gs, como matriz columna × hoja -->
    <div class="card card-compacta" data-panel="mapa">
      <div id="rel-mapa"><p class="empty-state">Cargando…</p></div>
    </div>
  </div>
  </div>
</template>
