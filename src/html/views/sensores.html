<template id="tpl-sensores">
  <div class="page-header-compacto">
    <div>
      <h2><i data-lucide="satellite-dish" class="ico"></i> Instalación de sensores</h2>
      <p class="page-subtitle">Sensores GPS por unidad — responsiva, rendimiento y estado en vivo</p>
    </div>
    <!-- KPIs: clic = filtrar la tabla -->
    <div class="kpi-chips">
      <button type="button" class="kpi-chip" id="sen-kpi-total" title="Ver todas las instalaciones">
        <span class="kpi-chip-label">Instalaciones</span>
        <strong class="kpi-chip-value" id="sen-stat-total">0</strong>
      </button>
      <button type="button" class="kpi-chip" id="sen-kpi-activos" title="Filtrar: sensores activos">
        <span class="kpi-chip-label">Activos</span>
        <strong class="kpi-chip-value" id="sen-stat-activos">0</strong>
      </button>
      <button type="button" class="kpi-chip kpi-warn" id="sen-kpi-baja" title="Filtrar: sensores dados de baja">
        <span class="kpi-chip-label">De baja</span>
        <strong class="kpi-chip-value" id="sen-stat-baja">0</strong>
      </button>
      <button type="button" class="kpi-chip" id="sen-kpi-viajando" title="Filtrar: unidades que van circulando ahora" hidden>
        <span class="kpi-chip-label">Viajando</span>
        <strong class="kpi-chip-value" id="sen-stat-viajando">0</strong>
      </button>
    </div>
  </div>

  <div id="sen-tabs">
    <div class="tabs-lista">
      <button type="button" class="tab-btn" data-tab="registros"><i data-lucide="table" class="ico"></i> Instalaciones</button>
      <button type="button" class="tab-btn" data-tab="nuevo"><i data-lucide="plus" class="ico"></i> Nueva instalación</button>
    </div>

    <!-- Pestaña 1: tabla -->
    <div class="card card-compacta" data-panel="registros">
      <div id="sen-tabla"></div>
    </div>

    <!-- Pestaña 2: alta -->
    <div class="card form-card" data-panel="nuevo">
      <div class="form-card-header">
        <div class="form-card-icon"><i data-lucide="satellite-dish" class="ico"></i></div>
        <div>
          <h3>Registrar instalación</h3>
          <p>Escribe el folio: los datos del vehículo se llenan solos</p>
        </div>
      </div>

      <!-- El formulario lo arma el componente Formulario (ver js/modulos/sensores) -->
      <div id="sen-form"></div>
    </div>
  </div>

  <!-- Modal: editar instalación -->
  <div class="modal-backdrop" id="modal-editar-sensor" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 style="margin:0">Editar instalación</h3>
          <p class="modal-subtitle" id="editar-sensor-label"></p>
        </div>
        <button type="button" class="modal-close" id="btn-cancelar-editar-sensor"><i data-lucide="x" class="ico"></i></button>
      </div>
      <form id="form-editar-sensor">
        <input type="hidden" id="editar-sensor-id" />
        <div class="field"><label>Folio del vehículo</label><input type="text" id="editar-sensor-folio" /><span class="form-ayuda">Cambiarlo vuelve a copiar los datos del vehículo</span></div>
        <div class="field"><label>Serie del sensor</label><input type="text" id="editar-sensor-serie" /></div>
        <div class="field"><label>Combustible</label><input type="text" id="editar-sensor-combustible" /></div>
        <div class="field">
          <label>Estatus</label>
          <select id="editar-sensor-estatus">
            <option value="ACTIVO">ACTIVO</option>
            <option value="BAJA">BAJA</option>
          </select>
        </div>
        <div class="field"><label>Fecha de instalación</label><input type="date" id="editar-sensor-fecha-instalacion" /></div>
        <div class="field"><label>Rendimiento (km/L)</label><input type="number" step="any" id="editar-sensor-rendimiento" /></div>
        <div class="field"><label>Ralentí (L/h)</label><input type="number" step="any" id="editar-sensor-ralenti" /></div>
        <div class="field"><label>Comentarios</label><input type="text" id="editar-sensor-comentarios" /></div>
        <div class="error-msg" id="editar-sensor-error" hidden></div>
        <button type="submit" style="width:100%; margin-top:10px"><i data-lucide="save" class="ico"></i> Guardar cambios</button>
      </form>
    </div>
  </div>
</template>
