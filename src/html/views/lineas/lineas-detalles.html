<template id="tpl-lineas-detalles">
  <div class="ln-modulo" id="ln-detalles-lineas">
    <div class="page-header">
      <div>
        <h2><i data-lucide="file-search" class="ico"></i> Detalles Líneas Telefónicas</h2>
        <p class="page-subtitle">Búsqueda rápida: escribe un NUCO, número, IMEI, SIM o responsable para ir directo a la ficha</p>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-tile"><div class="stat-icon"><i data-lucide="database" class="ico"></i></div><div><div class="stat-value" id="lnd-total">—</div><div class="stat-label">Registros</div></div></div>
      <div class="stat-tile"><div class="stat-icon"><i data-lucide="list-filter" class="ico"></i></div><div><div class="stat-value" id="lnd-filtrados">—</div><div class="stat-label">Mostrados</div></div></div>
    </div>

    <div class="card ln-cuadros-toolbar">
      <div class="ln-filtros ln-cuadros-filtros">
        <input aria-label="Buscar por NUCO, número, IMEI, SIM, modelo o responsable…" type="search" id="lnd-q" placeholder="Buscar por NUCO, número, IMEI, SIM, modelo o responsable…" autocomplete="off" autofocus />
        <select id="lnd-tipo" aria-label="Filtrar por tipo de activo">
          <option value="TODOS">Todos los registros</option>
          <option value="EQUIPO">Equipos</option>
          <option value="LINEA">Líneas sin equipo</option>
        </select>
        <button id="lnd-exportar" type="button" class="secondary ln-btn-icono"><span data-ln-icon="download"></span> Exportar vista</button>
      </div>
      <p id="lnd-conteo" class="ln-conteo"></p>
    </div>
    <div class="error-msg" id="lnd-error" hidden></div>
    <div id="lnd-grid" class="ln-cuadros-grid" aria-live="polite">
      <div class="card ln-cuadro-cargando"><span class="ln-spinner"></span> Cargando líneas y equipos…</div>
    </div>
    <div class="ln-cuadros-mas"><button id="lnd-mas" type="button" class="secondary" hidden>Mostrar más</button></div>
  </div>
</template>
