<template id="tpl-lineas-accesorios">
  <div class="ln-modulo" id="ln-accesorios">
    <div class="page-header">
      <div>
        <h2><i data-lucide="boxes" class="ico"></i> Inventario de Accesorios</h2>
        <p class="page-subtitle">Fundas, micas y cargadores del inventario de Telefonía</p>
      </div>
      <div class="page-header-actions">
        <button type="button" id="lac-nuevo"><i data-lucide="plus" class="ico"></i> Registrar artículo</button>
      </div>
    </div>

    <div class="stat-row" id="lac-indicadores">
      <div class="stat-tile"><div class="stat-icon"><i data-lucide="loader-circle" class="ico"></i></div><div><div class="stat-value">…</div><div class="stat-label">Cargando</div></div></div>
    </div>

    <div class="card card-compacta"><div id="lac-tabla"></div></div>

    <div class="modal-backdrop" id="lac-modal-nuevo" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="lac-nuevo-titulo">
        <div class="modal-header">
          <div>
            <h3 style="margin:0" id="lac-nuevo-titulo">Registrar artículo</h3>
            <p class="modal-subtitle">El stock se calcula con las entradas y salidas</p>
          </div>
          <button type="button" class="modal-close" data-cerrar-modal-nuevo aria-label="Cerrar"><i data-lucide="x" class="ico"></i></button>
        </div>
        <!-- Orden de ACCESORIOS CELULARES_Form: Categoria, Nombre del Articulo, Marca -->
        <div class="field"><label for="lac-categoria">Categoria *</label><select id="lac-categoria"><option value="">Selecciona…</option><option>Micas</option><option>Fundas</option><option>Cargadores</option></select></div>
        <div class="field"><label for="lac-nombre">Nombre del Articulo *</label><input type="text" id="lac-nombre" autocomplete="off" /></div>
        <div class="field"><label for="lac-marca">Marca</label><input type="text" id="lac-marca" autocomplete="off" /></div>
        <div class="error-msg" id="lac-nuevo-error" hidden></div>
        <div class="ln-captura-acciones">
          <button type="button" class="secondary" data-cerrar-modal-nuevo>Cancelar</button>
          <button type="button" class="primary" id="lac-guardar-nuevo"><i data-lucide="save" class="ico"></i> Registrar</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="lac-modal-mov" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="lac-mov-titulo">
        <div class="modal-header">
          <div>
            <h3 style="margin:0" id="lac-mov-titulo">Movimiento</h3>
            <p class="modal-subtitle" id="lac-mov-subtitulo"></p>
          </div>
          <button type="button" class="modal-close" data-cerrar-modal-mov aria-label="Cerrar"><i data-lucide="x" class="ico"></i></button>
        </div>
        <div class="field"><label for="lac-cantidad">Cantidad</label><input type="number" id="lac-cantidad" min="1" /></div>
        <div class="field"><label for="lac-comentarios">Comentarios (opcional)</label><textarea id="lac-comentarios" rows="5" placeholder="Motivo del movimiento o información para el seguimiento"></textarea></div>
        <div class="error-msg" id="lac-mov-error" hidden></div>
        <div class="ln-captura-acciones">
          <button type="button" class="secondary" data-cerrar-modal-mov>Cancelar</button>
          <button type="button" class="primary" id="lac-guardar-mov"><i data-lucide="save" class="ico"></i> Registrar</button>
        </div>
      </div>
    </div>
  </div>
</template>
