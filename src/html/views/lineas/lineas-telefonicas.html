<template id="tpl-lineas-telefonicas">
  <div class="ln-modulo" id="ln-telefonicas">

    <!-- Listado -->
    <section id="ln-listado">
      <div class="page-header ln-page-header">
        <div>
          <h2 class="ln-titulo"><span class="ln-titulo-icono" data-ln-icon="smartphone"></span> Líneas Telefónicas</h2>
          <p class="page-subtitle">Inventario de equipos y líneas: responsables, estatus, inspecciones e historial</p>
        </div>
        <div class="ln-acciones-header">
          <button type="button" class="secondary ln-btn-icono" id="ln-recargar" hidden title="Vaciar caché y volver a leer la hoja"><span data-ln-icon="refresh-cw"></span> Recargar datos</button>
        </div>
      </div>

      <div class="stat-row" id="ln-indicadores">
        <div class="stat-tile"><div class="stat-icon" data-ln-icon="loader-circle"></div><div><div class="stat-value">…</div><div class="stat-label">Cargando</div></div></div>
      </div>

      <div class="card">
        <div class="ln-toolbar">
          <div class="ln-tabs" role="tablist">
            <button type="button" class="ln-tab ln-btn-icono active" data-modulo="equipos" role="tab"><span data-ln-icon="smartphone"></span> Equipos <span class="ln-tab-num" id="ln-num-equipos"></span></button>
            <button type="button" class="ln-tab ln-btn-icono" data-modulo="lineas" role="tab"><span data-ln-icon="card-sim"></span> Líneas <span class="ln-tab-num" id="ln-num-lineas"></span></button>
          </div>
          <button type="button" class="secondary ln-btn-icono" id="ln-exportar"><span data-ln-icon="download"></span> Exportar CSV</button>
        </div>

        <div class="ln-filtros" id="ln-filtros"></div>

        <div class="ln-tabla-wrap">
          <table class="ln-tabla">
            <thead id="ln-thead"></thead>
            <tbody id="ln-tbody">
              <tr><td class="empty-state">Cargando inventario…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="ln-paginacion">
          <span class="ln-conteo" id="ln-conteo"></span>
          <div class="ln-paginas">
            <button type="button" class="secondary ln-btn-icono" id="ln-anterior"><span data-ln-icon="chevron-left"></span> Anterior</button>
            <span id="ln-pagina"></span>
            <button type="button" class="secondary ln-btn-icono" id="ln-siguiente">Siguiente <span data-ln-icon="chevron-right"></span></button>
          </div>
        </div>
        <div class="error-msg" id="ln-error" hidden></div>
      </div>
    </section>

    <!-- Detalle de equipo / línea / inspección (se pinta desde lineas.html) -->
    <section id="ln-detalle" hidden></section>

    <!-- Captura de inspección / responsiva nueva -->
    <div class="modal-backdrop" id="ln-modal-captura" hidden>
      <div class="modal-card modal-card-wide ln-captura-modal">
        <div class="modal-header ln-captura-cabecera">
          <div class="ln-captura-cabecera-principal">
            <span class="ln-captura-icono" id="ln-captura-icono"><span data-ln-icon="file-text"></span></span>
            <div>
            <span class="ln-captura-tipo" id="ln-captura-tipo">Documento</span>
            <h3 class="ln-titulo" style="margin:3px 0 0" id="ln-captura-titulo"></h3>
            <p class="modal-subtitle" id="ln-captura-subtitulo"></p>
            </div>
          </div>
          <button type="button" class="modal-close" data-cerrar-modal aria-label="Cerrar"><span data-ln-icon="x"></span></button>
        </div>
        <div class="modal-form-scroll" id="ln-captura-cuerpo"><p class="empty-state">Cargando…</p></div>
      </div>
    </div>
  </div>
</template>
