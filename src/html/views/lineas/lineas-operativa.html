<template id="tpl-lineas-operativa">
  <section id="ln-operativa" class="ln-modulo">
    <div class="page-header ln-page-header">
      <div class="ln-titulo">
        <span id="ln-op-titulo-icono" class="ln-titulo-icono"></span>
        <div>
          <h2 id="ln-op-titulo">Módulo de líneas</h2>
          <p id="ln-op-subtitulo" class="page-subtitle"></p>
        </div>
      </div>
      <div class="kpi-chips">
        <button id="ln-op-nuevo" type="button" class="primary ln-btn-icono" hidden><span data-ln-icon="plus"></span> Nuevo registro</button>
        <span class="kpi-chip">Total <strong id="ln-op-total">—</strong></span>
        <span class="kpi-chip">Resultados <strong id="ln-op-resultados">—</strong></span>
      </div>
    </div>

    <div id="ln-op-error" class="error-msg" hidden></div>
    <div class="card ln-card">
      <form id="ln-op-form" class="ln-filtros ln-op-filtros">
        <input aria-label="Buscar en todos los campos…" id="ln-op-q" type="search" placeholder="Buscar en todos los campos…" autocomplete="off" />
        <select id="ln-op-grupo" aria-label="Filtrar"></select>
        <button type="submit" class="ln-btn-icono"><span data-ln-icon="search"></span> Buscar</button>
        <button id="ln-op-limpiar" type="button" class="secondary ln-btn-icono"><span data-ln-icon="x"></span> Limpiar</button>
        <button id="ln-op-exportar" type="button" class="secondary ln-btn-icono"><span data-ln-icon="download"></span> Exportar página</button>
      </form>
      <p class="ln-tabla-ayuda">Consulta el resumen o abre una ficha para ver todos sus datos. La exportación incluye todos los campos de la página.</p>
      <div class="ln-tabla-wrap">
        <table class="ln-tabla ln-op-tabla">
          <thead id="ln-op-thead"></thead>
          <tbody id="ln-op-tbody"><tr><td class="empty-state"><span class="ln-spinner"></span> Cargando…</td></tr></tbody>
        </table>
      </div>
      <div class="ln-paginacion">
        <span id="ln-op-conteo" class="ln-conteo"></span>
        <div class="ln-paginas">
          <button id="ln-op-anterior" type="button" class="secondary ln-btn-chico">Anterior</button>
          <span id="ln-op-pagina">Página 1</span>
          <button id="ln-op-siguiente" type="button" class="secondary ln-btn-chico">Siguiente</button>
        </div>
      </div>
    </div>
  </section>

  <div id="ln-op-modal" class="modal-backdrop" hidden>
    <div class="modal-card modal-card-wide" role="dialog" aria-modal="true" aria-labelledby="ln-op-modal-titulo">
      <div class="modal-header">
        <h3 id="ln-op-modal-titulo">Nuevo registro</h3>
        <button id="ln-op-cerrar" type="button" class="modal-close secondary" aria-label="Cerrar"><span data-ln-icon="x"></span></button>
      </div>
      <form id="ln-op-alta-form">
        <p class="ln-tabla-ayuda">Completa los datos del registro. Los campos con * son obligatorios.</p>
        <div id="ln-op-campos" class="ln-op-campos modal-form-scroll"></div>
        <div id="ln-op-alta-error" class="error-msg" hidden></div>
        <div class="ln-captura-acciones">
          <button id="ln-op-cancelar" type="button" class="secondary">Cancelar</button>
          <button id="ln-op-guardar" type="submit" class="ln-btn-icono"><span data-ln-icon="save"></span> Guardar</button>
        </div>
      </form>
    </div>
  </div>
</template>
