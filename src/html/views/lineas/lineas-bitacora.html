<template id="tpl-lineas-bitacora">
  <div class="ln-modulo" id="ln-bitacora">
    <div class="page-header">
      <div>
        <h2><span id="ln-bit-titulo-icono"></span> <span id="ln-bit-titulo"></span></h2>
        <p class="page-subtitle" id="ln-bit-subtitulo"></p>
      </div>
      <div class="page-header-actions">
        <button type="button" id="ln-bit-nuevo" hidden><i data-lucide="plus" class="ico"></i> Nuevo registro</button>
      </div>
    </div>

    <div class="stat-row" id="ln-bit-kpis">
      <div class="stat-tile"><div class="stat-icon"><i data-lucide="loader-circle" class="ico"></i></div><div><div class="stat-value">…</div><div class="stat-label">Cargando</div></div></div>
    </div>

    <!-- Solo cuando la hoja tiene más filas de las que se cargan: búsqueda en todo el historial (servidor) -->
    <form class="ln-historial-completo" id="ln-bit-form" data-respetar-texto hidden>
      <span class="ln-historial-texto" id="ln-bit-aviso"></span>
      <input type="search" id="ln-bit-q" placeholder="Buscar en todo el historial (NUCO, responsable, campo…)" autocomplete="off" aria-label="Buscar en todo el historial" />
      <button type="submit"><i data-lucide="search" class="ico"></i> Buscar</button>
      <button type="button" class="secondary" id="ln-bit-limpiar" hidden><i data-lucide="x" class="ico"></i> Ver lo más reciente</button>
    </form>

    <div class="card card-compacta"><div id="ln-bit-tabla"></div></div>
  </div>
</template>
