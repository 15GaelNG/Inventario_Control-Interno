<!--
  Administración > Capital humano: aquí se sube la lista de Capital Humano (el Excel que manda CH). La app la combina
  con COLABORADORES ACTUALIZADO por empleo (número + nombre), así cada persona conserva su ID PERSONA. Ya no se pega a
  mano en la hoja. Lógica: js/app-capital-humano.html; servidor: services/CapitalHumano.gs (cargar).
-->
<style>
  .ch-tarjeta { margin-bottom: 18px; }
  .ch-tarjeta h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 15px; }
  .ch-tenue { color: var(--color-text-muted); font-size: 13px; margin: 0; }
  .ch-aviso {
    display: flex; align-items: flex-start; gap: 8px; margin: -6px 0 18px; padding: 10px 14px;
    border: 1px solid var(--color-border); border-left: 4px solid var(--color-danger); border-radius: var(--radius);
    background: var(--color-accent-soft); color: var(--color-text); font-size: 13px;
  }
  .ch-aviso .ico { color: var(--color-danger); margin-top: 2px; }

  /* El archivo: una zona punteada con el botón y el nombre del archivo elegido */
  .ch-subir { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 14px; }
  .ch-zona {
    flex: 1 1 320px; min-width: 0; display: flex; align-items: center; gap: 12px; margin: 0; padding: 12px 14px;
    border: 1.5px dashed var(--color-border); border-radius: var(--radius); background: var(--color-bg);
    color: var(--color-text); font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .ch-zona:hover, .ch-zona:focus-within { border-color: var(--color-accent); }
  .ch-zona .ico { width: 20px; height: 20px; color: var(--color-primary); flex-shrink: 0; }
  .ch-zona input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .ch-zona-nombre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-zona-nombre.vacio { color: var(--color-text-muted); }
  .ch-zona-boton {
    flex-shrink: 0; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--color-border);
    background: var(--color-surface); color: var(--color-primary); font-weight: 600; font-size: 12.5px;
  }

  /* El ensayo: las cifras en fichas, lo demás debajo y el botón al final */
  .ch-ensayo { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--color-border); }
  .ch-ensayo .kpi-chips { margin-top: 0; }
  .ch-ensayo .kpi-chip { cursor: default; }
  .ch-ensayo .kpi-chip-value { font-size: 20px; }
  .ch-ensayo details { margin-top: 12px; font-size: 13px; color: var(--color-text-muted); }
  .ch-ensayo summary { cursor: pointer; font-weight: 600; color: var(--color-text); }
  .ch-ensayo ul { margin: 8px 0 0; padding-left: 20px; max-height: 220px; overflow-y: auto; }
  .ch-ensayo-pie { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .ch-listo { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--color-success); font-weight: 600; }
</style>

<template id="tpl-capital-humano">
  <div class="page-header">
    <div>
      <h2><i data-lucide="users" class="ico"></i> Capital humano</h2>
      <p class="page-subtitle">La lista de Capital Humano de la que salen las personas de todos los módulos. Sube aquí el Excel nuevo: cada persona conserva su ID.</p>
    </div>
  </div>

  <div class="stat-row" id="ch-resumen">
    <div class="stat-tile"><div class="stat-icon"><i data-lucide="list" class="ico"></i></div>
      <div><div class="stat-value" id="ch-renglones">—</div><div class="stat-label">Renglones (activos y bajas)</div></div></div>
    <div class="stat-tile stat-tile-ok"><div class="stat-icon"><i data-lucide="user-check" class="ico"></i></div>
      <div><div class="stat-value" id="ch-activos">—</div><div class="stat-label">Activos</div></div></div>
    <div class="stat-tile" id="ch-tile-sin-id"><div class="stat-icon"><i data-lucide="fingerprint" class="ico"></i></div>
      <div><div class="stat-value" id="ch-sin-id">—</div><div class="stat-label">Sin ID PERSONA</div></div></div>
  </div>
  <div class="ch-aviso" id="ch-sensibles" hidden></div>

  <div class="card ch-tarjeta">
    <h3><i data-lucide="file-up" class="ico"></i> Subir la lista nueva</h3>
    <p class="ch-tenue">El Excel completo que manda Capital Humano (activos y bajas). Primero se revisa sin cambiar nada; después lo aplicas.
      El número de cuenta no se sube: se quita en tu navegador.</p>
    <div class="ch-subir">
      <label class="ch-zona">
        <i data-lucide="file-spreadsheet" class="ico"></i>
        <span class="ch-zona-nombre vacio" id="ch-archivo-nombre">Elige el Excel de Capital Humano (.xlsx)</span>
        <span class="ch-zona-boton">Elegir archivo</span>
        <input type="file" id="ch-archivo" accept=".xlsx,.xls,.csv" />
      </label>
      <button type="button" id="ch-revisar" disabled><i data-lucide="search-check" class="ico"></i> Revisar</button>
    </div>
    <div class="ch-ensayo" id="ch-ensayo" hidden></div>
  </div>

  <div class="card ch-tarjeta">
    <h3><i data-lucide="history" class="ico"></i> Cargas anteriores</h3>
    <div id="ch-historial"><p class="ch-tenue"><span class="spinner"></span> Cargando…</p></div>
  </div>
</template>
