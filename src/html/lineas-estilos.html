<style>
  /* ========== Módulo Líneas (clases .ln-*) ==========
     Reusa los tokens y componentes base de styles.html (card, stat-tile, table, modal).
     Aquí solo lo propio del módulo. */

  :root {
    --ln-verde-bg: #e5f6ec;  --ln-verde-tx: #1e7d4f;
    --ln-azul-bg: #DDEBF7;   --ln-azul-tx: #06263A;
    --ln-ambar-bg: #EBE5D1;  --ln-ambar-tx: #7a6a3a;
    --ln-rojo-bg: #fbeceb;   --ln-rojo-tx: #b3261e;
    --ln-neutro-bg: #eef0f1; --ln-neutro-tx: #5c6b72;
  }
  :root[data-theme="dark"] {
    --ln-verde-bg: #173a2a;  --ln-verde-tx: #7fd6a8;
    --ln-azul-bg: #163041;   --ln-azul-tx: #9ccbeb;
    --ln-ambar-bg: #2a2718;  --ln-ambar-tx: #d9c78f;
    --ln-rojo-bg: #3a1d1b;   --ln-rojo-tx: #f0a39d;
    --ln-neutro-bg: #1c3340; --ln-neutro-tx: #9db0b8;
  }

  /* Íconos Lucide (SVG en línea, heredan el color del texto) */
  .ln-icon { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex-shrink: 0; }
  .ln-icon-sm { width: .9em; height: .9em; vertical-align: -0.1em; }
  [data-ln-icon] { display: inline-flex; align-items: center; justify-content: center; }
  .ln-btn-icono { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .ln-alerta { color: var(--ln-rojo-tx); }
  .ln-titulo { display: flex; align-items: center; gap: 10px; }
  .ln-titulo-icono {
    width: 38px; height: 38px; border-radius: 11px; background: var(--color-accent-soft); color: var(--color-accent-hover);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .ln-titulo-icono .ln-icon { width: 20px; height: 20px; }
  .ln-titulo-icono.ln-alerta { background: var(--ln-rojo-bg); color: var(--ln-rojo-tx); }
  .ln-modulo .stat-icon { color: var(--color-primary); }
  .ln-modulo .stat-icon .ln-icon { width: 20px; height: 20px; }
  :root[data-theme="dark"] .ln-modulo .stat-icon { color: var(--color-text); }
  :root .ln-modulo .stat-tile-ok .stat-icon { background: var(--ln-verde-bg); color: var(--ln-verde-tx); }
  :root .ln-modulo .stat-tile-warn .stat-icon { background: var(--ln-rojo-bg); color: var(--ln-rojo-tx); }
  .modal-close .ln-icon { width: 16px; height: 16px; }

  /* Las tablas anchas hacen scroll dentro de su tarjeta, sin ensanchar la página. */
  .ln-modulo { display: grid; grid-template-columns: minmax(0, 1fr); contain: inline-size; }

  .ln-modulo h3 { margin: 0 0 12px; font-size: 14.5px; font-weight: 600; }
  .ln-card h3 { display: flex; align-items: center; gap: 8px; }
  .ln-card h3 .ln-icon { color: var(--color-accent); }
  .ln-tenue { color: var(--color-text-muted); }
  .ln-fuerte { font-weight: 600; }
  .ln-mono { font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  .ln-pie { font-size: 12px; margin: 10px 0 0; }
  .ln-enlace { color: var(--color-primary); font-weight: 500; text-decoration: none; }
  .ln-enlace:hover { text-decoration: underline; }
  :root[data-theme="dark"] .ln-enlace { color: var(--color-accent); }

  .ln-page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .ln-acciones-header { display: flex; gap: 8px; }

  .ln-tile { cursor: pointer; transition: border-color .2s ease, transform .2s ease; }
  .ln-tile:hover { border-color: var(--color-accent); transform: translateY(-1px); }

  /* Chips de estatus */
  .ln-chip {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--ln-neutro-bg); color: var(--ln-neutro-tx); white-space: nowrap; line-height: 1.4;
  }
  .ln-chip.verde { background: var(--ln-verde-bg); color: var(--ln-verde-tx); }
  .ln-chip.azul { background: var(--ln-azul-bg); color: var(--ln-azul-tx); }
  .ln-chip.ambar { background: var(--ln-ambar-bg); color: var(--ln-ambar-tx); }
  .ln-chip.rojo { background: var(--ln-rojo-bg); color: var(--ln-rojo-tx); }
  .ln-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Barra de pestañas + filtros */
  .ln-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .ln-tabs { display: inline-flex; gap: 4px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 12px; padding: 4px; }
  .ln-tab { background: transparent; color: var(--color-text-muted); border-radius: 9px; padding: 8px 14px; font-weight: 600; }
  .ln-tab:hover { background: var(--color-surface); color: var(--color-text); }
  .ln-tab.active { background: var(--color-primary); color: #fff; }
  .ln-tab-num { font-weight: 500; opacity: .75; margin-left: 4px; }

  .ln-filtros { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  form.ln-filtros { grid-template-columns: minmax(220px, 1fr) auto auto auto; }
  form.ln-op-filtros { grid-template-columns: minmax(240px, 2fr) minmax(190px, 1fr) auto auto auto; }
  .ln-op-tabla { min-width: 1200px; }
  .ln-booleano { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
  .ln-booleano .ln-icon { width: 14px; height: 14px; }
  .ln-booleano.ln-si { color: var(--ln-verde-tx); }
  .ln-booleano.ln-no { color: var(--ln-rojo-tx); }
  .ln-op-campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
  .ln-op-campo-ancho { grid-column: 1 / -1; }
  .ln-op-check { min-height: 40px; display: flex; align-items: center; gap: 8px; text-transform: none; font-size: 13px; }
  .ln-op-check input { width: auto; }

  /* Cuadrículas tipo AppSheet para Gestión de Activos y Detalles */
  .ln-cuadros-kpis { margin: -4px 0 14px; }
  .ln-cuadros-toolbar { margin-bottom: 14px; padding-bottom: 12px; }
  .ln-cuadros-filtros { grid-template-columns: minmax(280px, 2fr) minmax(210px, 1fr) auto; margin-bottom: 8px; }
  .ln-cuadros-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;
    align-items: stretch;
  }
  button.ln-cuadro {
    width: 100%; min-height: 210px; padding: 16px; background: var(--color-surface); color: var(--color-text);
    border: 1px solid var(--color-border); border-radius: 12px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 7px;
    text-align: left; font-family: inherit; font-weight: inherit; overflow: hidden;
    transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  button.ln-cuadro:hover { background: var(--color-surface); border-color: var(--color-accent); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  button.ln-cuadro:focus-visible, button.ln-cuadro.seleccionado { outline: 0; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(180,161,105,.28); }
  .ln-cuadro-superior { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; min-width: 0; }
  .ln-cuadro-folio, .ln-cuadro-departamento { font-size: 13px; font-weight: 700; color: var(--color-text); overflow-wrap: anywhere; }
  .ln-cuadro-tipo, .ln-cuadro-area { color: var(--color-text-muted); font-size: 11px; display: inline-flex; align-items: center; gap: 4px; text-align: right; }
  .ln-cuadro-depto { color: var(--color-text-muted); font-size: 11.5px; min-height: 17px; text-transform: uppercase; }
  .ln-cuadro-principal { margin-top: 12px; color: var(--color-primary); font-size: 19px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  .ln-cuadro-secundario { color: var(--color-text-muted); font-size: 12px; line-height: 1.35; min-height: 32px; }
  .ln-cuadro-pie {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap;
    color: var(--color-text-muted); font-size: 11.5px; line-height: 1.35; margin-top: auto;
  }
  .ln-cuadro-pie + .ln-cuadro-pie { margin-top: 2px; padding-top: 8px; border-top: 1px solid var(--color-border); }
  .ln-cuadro-pie > span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
  .ln-cuadro-pie .ln-icon, .ln-cuadro-tipo .ln-icon { width: 13px; height: 13px; }
  .ln-cuadro-colaborador.con-activos .ln-cuadro-principal { color: var(--ln-verde-tx); }
  .ln-cuadro-colaborador.sin-activos .ln-cuadro-principal { color: var(--ln-rojo-tx); }
  .ln-activos-estado { font-weight: 600; }
  .ln-activos-estado.si { color: var(--ln-verde-tx); }
  .ln-activos-estado.no { color: var(--ln-rojo-tx); }
  .ln-cuadros-mas { display: flex; justify-content: center; margin: 16px 0; }
  .ln-cuadros-mas button { min-width: 180px; }
  .ln-cuadro-cargando, .ln-cuadro-vacio { grid-column: 1 / -1; min-height: 120px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ln-cuadro-detalle { scroll-margin-top: 16px; }
  .ln-check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 12px; cursor: pointer; }
  .ln-check input { width: auto; }

  /* Tablas */
  .ln-tabla-wrap { overflow-x: auto; border: 1px solid var(--color-border); border-radius: 10px; }
  .ln-tabla { min-width: 640px; }
  .ln-tabla th { background: var(--color-bg); position: sticky; top: 0; white-space: nowrap; font-size: 12px; }
  .ln-tabla td { vertical-align: top; overflow-wrap: normal; }
  .ln-tabla tbody tr:last-child td { border-bottom: none; }
  .ln-fila-clic { cursor: pointer; }
  .ln-fila-clic:hover td { background: var(--color-bg); }
  .ln-btn-chico { padding: 5px 10px; font-size: 12px; }

  .ln-paginacion { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .ln-conteo { font-size: 12px; color: var(--color-text-muted); }
  .ln-paginas { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  .ln-paginas button:disabled { opacity: .45; cursor: default; }

  /* Detalle */
  .ln-migas { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 12.5px; color: var(--color-text-muted); }
  .ln-migas > span { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .ln-migas button { padding: 6px 12px; }
  .ln-detalle-header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .ln-detalle-icono {
    width: 48px; height: 48px; border-radius: 14px; background: var(--color-primary-soft);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--color-primary);
  }
  .ln-detalle-icono .ln-icon { width: 24px; height: 24px; }
  :root[data-theme="dark"] .ln-detalle-icono { color: var(--color-text); }
  .ln-detalle-titulo { flex: 1; min-width: 200px; }
  .ln-detalle-titulo h2 { margin: 0 0 6px; font-size: 20px; }
  .ln-detalle-botones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ln-detalle-botones button { padding: 7px 12px; }

  .ln-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  .ln-card { margin-bottom: 14px; }
  .ln-grid-2 > .ln-card { margin-bottom: 0; }
  .ln-subtitulo { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--color-text-muted); margin: 14px 0 6px; }

  .ln-campos { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 7px 12px; margin: 0; font-size: 13px; }
  .ln-campos dt { color: var(--color-text-muted); font-weight: 500; }
  .ln-campos dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

  .ln-nota {
    background: var(--color-note-bg); border: 1px solid var(--color-border); border-radius: 10px;
    padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px;
  }
  .lac-stock-celda { text-align: right; }
  .lac-stock {
    display: inline-flex; align-items: center; justify-content: flex-end;
    min-width: 3.5ch; padding: 3px 8px; border-radius: 999px;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .lac-stock.bajo { background: var(--ln-rojo-bg); color: var(--ln-rojo-tx); }

  .ln-cargando { display: flex; align-items: center; gap: 10px; color: var(--color-text-muted); }
  .ln-spinner {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px;
    border: 2px solid var(--color-border); border-top-color: var(--color-accent);
    animation: lnGirar .8s linear infinite;
  }
  @keyframes lnGirar { to { transform: rotate(360deg); } }

  /* Historial */
  .ln-timeline { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--color-border); }
  .ln-timeline li { position: relative; padding: 0 0 14px 14px; }
  .ln-timeline li::before {
    content: ''; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--color-surface); border: 2px solid var(--color-accent);
  }
  .ln-tl-cabecera { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; }
  .ln-tl-fecha { font-size: 11.5px; }
  .ln-tl-cuerpo { font-size: 12.5px; margin-top: 4px; line-height: 1.5; overflow-wrap: anywhere; }
  .ln-timeline li, .ln-card, .ln-nota { min-width: 0; overflow-wrap: anywhere; }
  .ln-tl-cuerpo details ul { margin: 4px 0 0; padding-left: 18px; }

  /* Fotos */
  .ln-galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .ln-foto {
    aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: center; background: var(--color-bg); color: var(--color-text-muted);
  }
  .ln-foto .ln-icon { width: 28px; height: 28px; }
  .ln-foto img { width: 100%; height: 100%; object-fit: cover; }
  .ln-foto.ln-firma img { object-fit: contain; background: #fff; }

  /* Avisos flotantes */
  #ln-avisos { position: fixed; right: 20px; bottom: 20px; z-index: 600; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
  .ln-aviso {
    display: flex; align-items: flex-start; gap: 10px; background: var(--color-surface); color: var(--color-text);
    border: 1px solid var(--color-border); border-left: 4px solid var(--color-accent);
    border-radius: 10px; box-shadow: var(--shadow-lg); padding: 12px 12px 12px 14px; font-size: 13px;
  }
  .ln-aviso > div { flex: 1; }

  @media (max-width: 900px) {
    .ln-grid-2 { grid-template-columns: 1fr; }
    .ln-filtros, form.ln-filtros { grid-template-columns: 1fr; }
    .ln-modulo .grid[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    .ln-page-header, .ln-toolbar { align-items: stretch; }
    .ln-tabs { width: 100%; overflow-x: auto; }
    .ln-tab { flex: 1; min-width: max-content; }
    .ln-acciones-header, .ln-acciones-header button { width: 100%; }
    .ln-captura-acciones { position: sticky; bottom: 0; background: var(--color-surface); padding-top: 10px; }
    .ln-firma-caja canvas { min-height: 180px; }
    .ln-op-campos { grid-template-columns: 1fr; }
    .ln-cuadros-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ln-cuadros-filtros { grid-template-columns: 1fr; }
  }

  @media (max-width: 520px) {
    .modal-backdrop { padding: 0; align-items: stretch; }
    .modal-card, .modal-card-wide {
      width: 100%; max-width: none; min-height: 100%; max-height: 100vh;
      border-radius: 0; padding: 16px;
    }
    .modal-form-scroll { max-height: calc(100vh - 140px); }
    .ln-captura-acciones { display: grid; grid-template-columns: 1fr; }
    #ln-avisos { left: 12px; right: 12px; bottom: 12px; max-width: none; }
    .ln-cuadros-grid { grid-template-columns: 1fr; }
    button.ln-cuadro { min-height: 190px; }
  }

  /* Captura de inspección / responsiva */
  .ln-checklist-seccion { margin-bottom: 16px; }
  .ln-checklist-punto { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--color-border); }
  .ln-checklist-punto:last-child { border-bottom: none; }
  .ln-checklist-etiqueta { font-size: 13px; }
  .ln-pastillas { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .ln-pastilla {
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--ln-neutro-bg); color: var(--ln-neutro-tx); border: 1px solid transparent; cursor: pointer;
  }
  .ln-pastilla.activa { background: var(--color-primary); color: #fff; }
  .ln-pastilla.activa.ln-pastilla-mal { background: var(--ln-rojo-tx); color: #fff; }
  .ln-pastilla.activa.ln-pastilla-media { background: var(--ln-ambar-tx); color: #fff; }

  .ln-firma-caja { border: 1px dashed var(--color-border); border-radius: 10px; padding: 10px; background: #fff; }
  .ln-firma-caja canvas { width: 100%; height: 140px; display: block; touch-action: none; cursor: crosshair; }
  .ln-firma-acciones { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .ln-firma-acciones .ln-firma-vacia { font-size: 11.5px; color: var(--color-text-muted); }

  .ln-fotos-lista { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .ln-foto-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--ln-verde-bg); color: var(--ln-verde-tx);
    border-radius: 999px; padding: 5px 8px 5px 10px; font-size: 12px; font-weight: 500; max-width: 220px;
  }
  .ln-foto-chip span.ln-foto-nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln-foto-chip button { background: none; border: none; color: inherit; cursor: pointer; display: inline-flex; padding: 2px; }
  .ln-foto-chip.ln-foto-subiendo { background: var(--ln-neutro-bg); color: var(--ln-neutro-tx); }
  .ln-captura-acciones { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--color-border); }
</style>
