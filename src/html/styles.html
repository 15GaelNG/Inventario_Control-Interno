<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    /* Marca — Control Interno / Ciudad Maderas */
    --color-primary: #06263A;      /* navy */
    --color-primary-hover: #0c3550;
    --color-primary-soft: #DDEBF7; /* paleta I, tono claro */
    --color-accent: #B4A169;       /* dorado */
    --color-accent-hover: #9c8a58;
    --color-accent-soft: #EBE5D1;  /* paleta IV, tono claro */

    --color-bg: #F5F6F5;
    --color-surface: #ffffff;
    --color-text: #1c2b33;
    --color-text-muted: #5c6b72;   /* entre paleta III #445256 y #8F9EA3 */
    --color-border: #E7E7E7;       /* paleta III */
    --color-danger: #b3261e;
    --color-success: #1e7d4f;

    --radius: 12px;
    --shadow: 0 1px 3px rgba(6,38,58,.08), 0 1px 2px rgba(6,38,58,.05);
    --shadow-lg: 0 20px 40px -12px rgba(6,38,58,.25);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
  }

  #app { display: flex; min-height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: 220px; background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    padding: 16px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  #sidebar h1 { font-size: 15px; font-weight: 600; margin: 8px 8px 16px; color: var(--color-primary); }
  .nav-item {
    padding: 10px 12px; border-radius: var(--radius); cursor: pointer;
    color: var(--color-text-muted); font-weight: 500;
  }
  .nav-item:hover { background: var(--color-bg); }
  .nav-item.active { background: var(--color-primary); color: #fff; }

  #main { flex: 1; padding: 24px 32px; }

  /* Layout helpers */
  .card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
  }
  .grid { display: grid; gap: 16px; }
  .grid-modules { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

  h2 { margin-top: 0; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--color-border); }
  th { color: var(--color-text-muted); font-weight: 600; }

  input, select, button {
    font: inherit; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--color-border);
  }
  input, select { width: 100%; background: #fff; }
  input:focus, select:focus {
    outline: none; border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(180,161,105,.25);
  }
  label { display: block; font-size: 12px; color: var(--color-text-muted); margin-bottom: 4px; }
  .field { margin-bottom: 12px; }

  button {
    background: var(--color-primary); color: #fff; border: none;
    cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--color-primary-hover); }
  button.secondary { background: transparent; color: var(--color-primary); border: 1px solid var(--color-border); }
  button.danger { background: var(--color-danger); }

  .error-msg { color: var(--color-danger); font-size: 13px; margin-top: 8px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: #e5f6ec; color: var(--color-success); }
  .badge.low { background: #fbeceb; color: var(--color-danger); }

  [hidden] { display: none !important; }

  /* ---------- Login ---------- */
  #login-screen { min-height: 100vh; width: 100%; }

  .login-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }

  .login-hero {
    background: linear-gradient(160deg, #06263A 0%, #0a3550 65%, #0d3f5e 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 32px; position: relative; overflow: hidden;
  }
  .login-hero::after {
    content: ''; position: absolute; right: -60px; bottom: -60px;
    width: 260px; height: 260px; border-radius: 50%;
    background: rgba(180,161,105,.12);
  }
  .login-badge {
    background: #fff; width: 108px; height: 108px; border-radius: 26px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg); margin-bottom: 28px; position: relative; z-index: 1;
  }
  .login-badge img { width: 66px; height: 66px; }
  .login-hero-title {
    color: #fff; font-size: 26px; font-weight: 700; letter-spacing: 3px;
    text-align: center; line-height: 1.3; margin: 0; position: relative; z-index: 1;
  }
  .login-hero-title span { color: var(--color-accent); }
  .login-hero-tag {
    color: rgba(255,255,255,.65); font-size: 13px; letter-spacing: 1px;
    margin-top: 10px; text-transform: uppercase; position: relative; z-index: 1;
  }

  .login-panel {
    display: flex; align-items: center; justify-content: center;
    background: var(--color-surface); padding: 32px;
  }
  .login-form { width: 100%; max-width: 340px; }
  .login-form h2 { font-size: 22px; margin-bottom: 4px; }
  .login-sub { color: var(--color-text-muted); font-size: 13px; margin-top: 0; margin-bottom: 24px; }
  .login-form button {
    width: 100%; padding: 11px; font-size: 14px; margin-top: 6px;
    border-radius: 10px;
  }

  @media (max-width: 760px) {
    .login-grid { grid-template-columns: 1fr; }
    .login-hero { padding: 32px 24px; min-height: 220px; }
    .login-badge { width: 76px; height: 76px; border-radius: 20px; margin-bottom: 16px; }
    .login-badge img { width: 46px; height: 46px; }
    .login-hero-title { font-size: 20px; letter-spacing: 2px; }
  }
</style>
