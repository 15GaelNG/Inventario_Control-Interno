<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    /* Marca — Control Interno / Ciudad Maderas */
    --color-primary: #06263A;
    --color-primary-hover: #0c3550;
    --color-primary-soft: #DDEBF7;
    --color-accent: #B4A169;
    --color-accent-hover: #9c8a58;
    --color-accent-soft: #EBE5D1;

    --color-bg: #F5F6F5;
    --color-surface: #ffffff;
    --color-text: #1c2b33;
    --color-text-muted: #5c6b72;
    --color-border: #E7E7E7;
    --color-danger: #b3261e;
    --color-success: #1e7d4f;
    --color-note-bg: var(--color-primary-soft);
    --color-badge-bg: #ffffff; /* fijo: el logo (navy+dorado) siempre necesita fondo claro, en cualquier tema */

    --radius: 12px;
    --shadow: 0 1px 3px rgba(6,38,58,.08), 0 1px 2px rgba(6,38,58,.05);
    --shadow-lg: 0 24px 48px -16px rgba(6,38,58,.35);
  }

  :root[data-theme="dark"] {
    --color-primary: #2f7bb0;
    --color-primary-hover: #3f91cb;
    --color-primary-soft: #163041;
    --color-accent: #c4b280;
    --color-accent-hover: #d4c393;
    --color-accent-soft: #2a2718;

    --color-bg: #0b1a23;
    --color-surface: #142732;
    --color-text: #edf1f3;
    --color-text-muted: #9db0b8;
    --color-border: #26404c;
    --color-note-bg: #16344450;
  }

  /* Transición suave al cambiar de tema (no anima layout, solo color/fondo) */
  body, .card, input, select, button, .login-form-card, .login-icon-badge,
  .theme-toggle, .theme-toggle button, .login-security-note, #sidebar, .nav-item {
    transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
  }

  #app { display: flex; min-height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: 220px; background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    padding: 16px 12px; display: flex; flex-direction: column; gap: 4px;
    flex-shrink: 0; transition: width .28s ease;
  }
  #sidebar.collapsed { width: 68px; }

  .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sidebar-brand { display: flex; align-items: center; gap: 8px; overflow: hidden; min-width: 0; }
  .sidebar-brand-icon { width: 24px; height: 24px; flex-shrink: 0; }
  .sidebar-title {
    font-size: 15px; font-weight: 600; margin: 0; color: var(--color-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .cm-logo-dark { display: none; }
  :root[data-theme="dark"] .cm-logo-light { display: none; }
  :root[data-theme="dark"] .cm-logo-dark { display: block; }
  .sidebar-collapse-btn {
    background: transparent; border: 1px solid var(--color-border); color: var(--color-text-muted);
    width: 26px; height: 26px; border-radius: 8px; padding: 0; font-size: 12px;
    flex-shrink: 0; transition: transform .28s ease, background-color .35s ease;
  }
  .sidebar-collapse-btn:hover { background: var(--color-bg); }
  #sidebar.collapsed .sidebar-header { justify-content: center; }
  #sidebar.collapsed .sidebar-collapse-btn { transform: rotate(180deg); }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: var(--radius); cursor: pointer;
    color: var(--color-text-muted); font-weight: 500; white-space: nowrap; overflow: hidden;
  }
  .nav-item:hover { background: var(--color-bg); }
  .nav-item.active { background: var(--color-primary); color: #fff; }
  .nav-icon { flex-shrink: 0; width: 20px; text-align: center; }
  .nav-label { overflow: hidden; text-overflow: ellipsis; }

  #sidebar.collapsed .sidebar-title,
  #sidebar.collapsed .nav-label,
  #sidebar.collapsed .sidebar-user { display: none; }
  #sidebar.collapsed .nav-item { justify-content: center; }
  #sidebar.collapsed #btn-logout { justify-content: center; }

  /* Grupos de navegación (acordeón por área) */
  .nav-groups { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; overflow-y: auto; }

  .nav-group-header {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 10px 12px; border-radius: var(--radius);
    color: var(--color-text-muted); font-weight: 600; font-size: 12.5px;
    white-space: nowrap; overflow: hidden;
  }
  .nav-group-header:hover { background: var(--color-bg); }
  .nav-group-header .nav-icon { flex-shrink: 0; width: 20px; text-align: center; }
  .nav-group-header .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .nav-group-chevron {
    flex-shrink: 0; font-size: 10px; transition: transform .2s ease; color: var(--color-text-muted);
  }
  .nav-group.expanded .nav-group-chevron { transform: rotate(90deg); }

  .nav-group-items {
    max-height: 0; overflow: hidden; transition: max-height .25s ease;
    display: flex; flex-direction: column; gap: 1px;
    padding-left: 14px; border-left: 2px solid var(--color-border); margin-left: 22px;
  }
  .nav-group.expanded .nav-group-items { max-height: 600px; }

  .nav-subitem {
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    color: var(--color-text-muted); font-size: 12.5px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-subitem:hover { background: var(--color-bg); }
  .nav-subitem.active { background: var(--color-primary); color: #fff; }

  /* En modo colapsado, los grupos se reducen a solo el ícono del encabezado */
  #sidebar.collapsed .nav-group-header .nav-label,
  #sidebar.collapsed .nav-group-chevron { display: none; }
  #sidebar.collapsed .nav-group-header { justify-content: center; }
  #sidebar.collapsed .nav-group-items { display: none !important; }

  .sidebar-user {
    padding: 8px 12px; font-size: 12px; color: var(--color-text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #btn-logout { display: flex; align-items: center; gap: 10px; }

  #main { flex: 1; padding: 24px 32px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar-cm-logo { height: 30px; width: auto; }
  .topbar-date {
    font-size: 13.5px; font-weight: 500; color: var(--color-text-muted);
  }
  .topbar-theme-toggle {
    display: flex; gap: 6px; background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: 999px; padding: 4px;
  }
  .topbar-theme-toggle .theme-btn {
    background: transparent; border: none; color: var(--color-text-muted);
    width: 30px; height: 30px; border-radius: 999px; padding: 0; font-size: 14px;
  }
  .topbar-theme-toggle .theme-btn.active { background: var(--color-primary); color: #fff; }

  .card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
  }
  .grid { display: grid; gap: 16px; }
  .grid-modules { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

  h2 { margin-top: 0; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--color-border); }
  th { color: var(--color-text-muted); font-weight: 600; }

  input, select, button {
    font: inherit; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text);
  }
  input, select { width: 100%; }
  input:focus, select:focus {
    outline: none; border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(180,161,105,.25);
  }
  label { display: block; font-size: 12px; color: var(--color-text-muted); margin-bottom: 6px; font-weight: 500; }
  .field { margin-bottom: 14px; }

  button {
    background: var(--color-primary); color: #fff; border: none;
    cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--color-primary-hover); }
  button.secondary { background: transparent; color: var(--color-primary); border: 1px solid var(--color-border); }
  button.danger { background: var(--color-danger); }

  .error-msg { color: var(--color-danger); font-size: 13px; margin-top: 8px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: #e5f6ec; color: var(--color-success); }
  .badge.low { background: #fbeceb; color: var(--color-danger); }

  [hidden] { display: none !important; }

  /* ========== Login ========== */
  #login-screen {
    min-height: 100vh; width: 100%; position: relative; background: var(--color-bg);
    display: flex; flex-direction: column;
  }

  .theme-toggle {
    position: absolute; top: 20px; right: 20px; z-index: 10;
    display: flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,.9); border: 1px solid var(--color-border);
    border-radius: 999px; padding: 4px; box-shadow: var(--shadow);
  }
  :root[data-theme="dark"] .theme-toggle { background: rgba(18,35,45,.9); }
  .theme-toggle button {
    background: transparent; color: var(--color-text-muted);
    width: 30px; height: 30px; border-radius: 999px; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .theme-toggle button.active { background: var(--color-primary); color: #fff; }

  .login-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    flex: 1;
  }

  .login-hero { position: relative; overflow: hidden; }

  .login-hero-bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    transition: opacity .6s ease;
  }
  .login-hero-bg-light {
    opacity: 1;
    background-image:
      linear-gradient(100deg, rgba(6,20,30,.88) 0%, rgba(6,20,30,.55) 45%, rgba(6,20,30,.25) 75%),
      url('data:image/jpeg;base64,<?!= include('html/loginBgBase64') ?>');
  }
  .login-hero-bg-dark {
    opacity: 0;
    background-image:
      linear-gradient(100deg, rgba(3,10,16,.80) 0%, rgba(3,10,16,.50) 45%, rgba(3,10,16,.20) 75%),
      url('data:image/jpeg;base64,<?!= include('html/loginBgDarkBase64') ?>');
  }
  :root[data-theme="dark"] .login-hero-bg-light { opacity: 0; }
  :root[data-theme="dark"] .login-hero-bg-dark { opacity: 1; }

  .login-hero-content {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 48px 56px;
  }

  .login-brand { display: flex; align-items: center; gap: 12px; }
  .login-brand-badge {
    width: 44px; height: 44px; border-radius: 12px; background: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
    flex-shrink: 0;
  }
  .login-brand-badge img { width: 28px; height: 28px; }
  .login-brand-text { color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 2px; }
  .login-brand-text span { display: block; color: var(--color-accent); font-size: 11px; letter-spacing: 3px; font-weight: 500; margin-top: 1px; }

  .login-hero-body { max-width: 480px; }
  .login-hero-title {
    color: #fff; font-size: 32px; font-weight: 700; line-height: 1.25; margin: 0 0 12px;
  }
  .login-hero-sub { color: rgba(255,255,255,.75); font-size: 14px; line-height: 1.6; margin: 0; }

  .login-features {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .login-feature {
    background: rgba(255,255,255,.10); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
    padding: 14px 8px; text-align: center; color: #fff;
  }
  .login-feature .icon { font-size: 18px; margin-bottom: 6px; }
  .login-feature .label { font-size: 11px; font-weight: 500; line-height: 1.3; color: rgba(255,255,255,.9); }

  .login-panel {
    display: flex; align-items: center; justify-content: center;
    background: var(--color-bg); padding: 32px;
  }
  .login-form-card {
    width: 100%; max-width: 380px; background: var(--color-surface);
    border-radius: 20px; box-shadow: var(--shadow-lg); padding: 36px 32px;
    border: 1px solid var(--color-border);
  }
  .login-icon-badge {
    width: 72px; height: 72px; border-radius: 18px; background: var(--color-badge-bg);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
    box-shadow: var(--shadow);
  }
  .login-icon-badge img { width: 42px; height: 42px; }

  .login-form-card h2 {
    text-align: center; font-size: 14px; font-weight: 500; color: var(--color-text-muted);
    margin: 0;
  }
  .login-form-card .login-system-name {
    text-align: center; font-size: 22px; font-weight: 700; color: var(--color-primary); margin: 2px 0 6px;
  }
  .login-sub { text-align: center; color: var(--color-text-muted); font-size: 12.5px; margin: 0 0 16px; }
  .login-divider { width: 40px; height: 3px; background: var(--color-accent); border-radius: 3px; margin: 0 auto 22px; }

  .google-account-chip {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; text-align: left;
  }
  .google-account-chip:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .google-account-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--color-primary);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; flex-shrink: 0;
  }
  .google-account-info { flex: 1; min-width: 0; }
  .google-account-label { font-size: 10.5px; color: var(--color-text-muted); }
  .google-account-name {
    font-size: 13px; font-weight: 600; color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .google-account-email {
    font-size: 11px; color: var(--color-text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .google-account-g {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff;
    background: conic-gradient(from 45deg, #4285F4, #34A853, #FBBC05, #EA4335, #4285F4);
  }

  .login-or-divider {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    color: var(--color-text-muted); font-size: 11.5px;
  }
  .login-or-divider::before, .login-or-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--color-border);
  }

  label.icon-label { display: flex; align-items: center; gap: 6px; }
  .field-icon-wrap { position: relative; }
  .field-icon-wrap input { padding-right: 40px; }
  .toggle-password {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: transparent; color: var(--color-text-muted); width: 32px; height: 32px;
    border: none; padding: 0; font-size: 15px;
  }
  .toggle-password:hover { background: var(--color-bg); color: var(--color-text); }

  .login-form-card button[type="submit"] {
    width: 100%; padding: 12px; font-size: 14px; margin-top: 8px; border-radius: 10px;
  }

  .login-security-note {
    margin-top: 20px; background: var(--color-note-bg); border-radius: 12px;
    padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid var(--color-border);
  }
  .login-security-note .icon { font-size: 16px; line-height: 1.4; }
  .login-security-note strong { display: block; font-size: 12.5px; color: var(--color-text); }
  .login-security-note p { margin: 2px 0 0; font-size: 11.5px; color: var(--color-text-muted); line-height: 1.4; }

  .login-footer {
    text-align: center; font-size: 11.5px; color: var(--color-text-muted); margin-top: 18px;
  }

  @media (max-width: 900px) {
    .login-grid { grid-template-columns: 1fr; }
    .login-hero { min-height: 340px; }
    .login-hero-content { padding: 32px 24px; }
    .login-hero-title { font-size: 24px; }
    .login-features { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .login-form-card { padding: 28px 20px; }
  }

  /* ========== Pantalla de carga (post-login) ========== */
  #loading-screen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, #0d3a56 0%, #06263A 55%, #041722 100%);
    opacity: 1; transition: opacity .45s ease;
  }
  #loading-screen.fade-out { opacity: 0; }

  .loading-badge {
    width: 88px; height: 88px; border-radius: 22px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg);
    animation: loadingPulse 1.8s ease-in-out infinite;
  }
  .loading-badge img { width: 52px; height: 52px; }

  .loading-title {
    color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 3px;
    margin-top: 18px;
  }

  .loading-icons { display: flex; gap: 14px; margin-top: 32px; }
  .loading-icon {
    width: 52px; height: 52px; border-radius: 16px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    opacity: 0; transform: translateY(10px) scale(.8);
    animation: loadingPopIn .5s ease forwards;
    transition: background .35s ease, border-color .35s ease, transform .35s ease, box-shadow .35s ease;
  }
  .loading-icon:nth-child(1) { animation-delay: .05s; }
  .loading-icon:nth-child(2) { animation-delay: .18s; }
  .loading-icon:nth-child(3) { animation-delay: .31s; }
  .loading-icon:nth-child(4) { animation-delay: .44s; }
  .loading-icon.active {
    background: var(--color-accent); border-color: var(--color-accent);
    transform: translateY(0) scale(1.12);
    box-shadow: 0 0 0 6px rgba(180,161,105,.22);
  }

  .loading-bar {
    width: 220px; height: 6px; border-radius: 999px; overflow: hidden;
    background: rgba(255,255,255,.15); margin-top: 30px;
  }
  .loading-bar-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--color-accent), #e4d6a8);
    transition: width linear;
  }

  .loading-message {
    color: rgba(255,255,255,.75); font-size: 12.5px; margin-top: 14px;
    transition: opacity .2s ease; min-height: 16px;
  }
  .loading-message.fade { opacity: 0; }

  @keyframes loadingPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  @keyframes loadingPopIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
