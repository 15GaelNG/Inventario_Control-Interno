<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    /* Marca — Control Interno / Ciudad Maderas */
    --color-primary: #06263A;
    --color-primary-hover: #0c3550;
    --color-primary-soft: #DDEBF7;
    --color-accent: #B4A169;
    --color-accent-hover: #9c8a58;
    --color-accent-soft: #EBE5D1;

    --color-bg: #F5F6F5;
    --color-surface: #ffffff;
    --color-text: #1c2b33;
    --color-text-muted: #5c6b72;
    --color-border: #E7E7E7;
    --color-danger: #8a6d3a; /* bronce/dorado oscuro de marca, en vez de rojo */
    --color-success: #1e7d4f;
    --color-note-bg: var(--color-primary-soft);
    --color-badge-bg: #ffffff; /* fijo: el logo (navy+dorado) siempre necesita fondo claro, en cualquier tema */

    /* Sidebar: fondo navy fijo de marca, NO cambia con el tema claro/oscuro. */
    --color-sidebar-bg: #06263A;
    --color-sidebar-text: #b7c8d2;
    --color-sidebar-text-strong: #ffffff;
    --color-sidebar-hover: rgba(255,255,255,.08);
    --color-sidebar-border: rgba(255,255,255,.14);

    --radius: 12px;
    --shadow: 0 1px 3px rgba(6,38,58,.08), 0 1px 2px rgba(6,38,58,.05);
    --shadow-lg: 0 24px 48px -16px rgba(6,38,58,.35);
  }

  :root[data-theme="dark"] {
    --color-primary: #2f7bb0;
    --color-primary-hover: #3f91cb;
    --color-primary-soft: #163041;
    --color-accent: #c4b280;
    --color-accent-hover: #d4c393;
    --color-accent-soft: #2a2718;

    --color-bg: #0b1a23;
    --color-surface: #142732;
    --color-text: #edf1f3;
    --color-text-muted: #9db0b8;
    --color-border: #26404c;
    --color-note-bg: #16344450;
  }

  /* Transición suave al cambiar de tema (no anima layout, solo color/fondo) */
  body, .card, input, select, textarea, button, .login-form-card, .login-icon-badge,
  .theme-toggle, .theme-toggle button, .login-security-note, #sidebar, .nav-item {
    transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
  }

  /* #app ocupa exactamente el alto de la pantalla y no se desplaza — el
     sidebar y la topbar quedan fijos; solo el contenido de #view-container
     hace scroll internamente (ver más abajo). */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar — fondo navy fijo de marca (no cambia con el tema claro/oscuro) */
  #sidebar {
    width: 250px; height: 100vh; background: var(--color-sidebar-bg);
    border-right: 1px solid var(--color-sidebar-border);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
    flex-shrink: 0; overflow-y: auto; transition: width .28s ease;
  }
  #sidebar.collapsed { width: 92px; }

  .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sidebar-brand { display: flex; align-items: center; gap: 9px; overflow: hidden; min-width: 0; }
  .sidebar-brand-icon {
    width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px;
    background: var(--color-badge-bg); padding: 3px; object-fit: contain;
  }
  .sidebar-title {
    font-size: 15.5px; font-weight: 600; margin: 0; color: var(--color-sidebar-text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Ahora vive junto a "Cerrar sesión" (fila completa), no en el encabezado. */
  .sidebar-collapse-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: none; color: var(--color-sidebar-text);
    padding: 9px 13px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; transition: background-color .35s ease;
  }
  .sidebar-collapse-btn:hover { background: var(--color-sidebar-hover); }
  .sidebar-collapse-btn .ico { transition: transform .28s ease; }
  #sidebar.collapsed .sidebar-header { justify-content: center; }
  #sidebar.collapsed .sidebar-collapse-btn { justify-content: center; }
  #sidebar.collapsed .sidebar-collapse-btn .ico { transform: rotate(180deg); }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 13px; border-radius: var(--radius); cursor: pointer;
    color: var(--color-sidebar-text); font-weight: 500; white-space: nowrap; overflow: hidden;
  }
  .nav-item:hover { background: var(--color-sidebar-hover); }
  .nav-item.active { background: var(--color-accent); color: var(--color-primary); }
  .nav-icon { flex-shrink: 0; width: 20px; text-align: center; }
  .nav-label { overflow: hidden; text-overflow: ellipsis; }

  #sidebar.collapsed .sidebar-title,
  #sidebar.collapsed .nav-label,
  #sidebar.collapsed .sidebar-user { display: none; }
  #sidebar.collapsed .nav-item { justify-content: center; }
  #sidebar.collapsed #btn-logout { justify-content: center; }

  /* Grupos de navegación (acordeón por área) */
  .nav-groups { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; overflow-y: auto; }

  .nav-group-header {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 11px 13px; border-radius: var(--radius);
    color: var(--color-sidebar-text); font-weight: 600; font-size: 13px;
    white-space: nowrap; overflow: hidden;
  }
  .nav-group-header:hover { background: var(--color-sidebar-hover); }
  .nav-group-header .nav-icon { flex-shrink: 0; width: 20px; text-align: center; }
  .nav-group-header .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .nav-group-chevron {
    flex-shrink: 0; font-size: 10px; transition: transform .2s ease; color: var(--color-sidebar-text);
  }
  .nav-group.expanded .nav-group-chevron { transform: rotate(90deg); }

  .nav-group-items {
    max-height: 0; overflow: hidden; transition: max-height .25s ease;
    display: flex; flex-direction: column; gap: 1px;
    padding-left: 14px; border-left: 2px solid var(--color-sidebar-border); margin-left: 23px;
  }
  .nav-group.expanded .nav-group-items { max-height: 600px; }

  .nav-subitem {
    padding: 9px 11px; border-radius: 8px; cursor: pointer;
    color: var(--color-sidebar-text); font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-subitem:hover { background: var(--color-sidebar-hover); }
  .nav-subitem.active { background: var(--color-accent); color: var(--color-primary); }

  /* En modo colapsado, los grupos se reducen a solo el ícono del encabezado */
  #sidebar.collapsed .nav-group-header .nav-label,
  #sidebar.collapsed .nav-group-chevron { display: none; }
  #sidebar.collapsed .nav-group-header { justify-content: center; }
  #sidebar.collapsed .nav-group-items { display: none !important; }

  .sidebar-user {
    padding: 8px 13px; font-size: 12.5px; color: var(--color-sidebar-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #btn-logout { display: flex; align-items: center; gap: 10px; }
  #sidebar button.secondary {
    color: var(--color-sidebar-text); border-color: var(--color-sidebar-border);
  }
  #sidebar button.secondary:hover { background: var(--color-sidebar-hover); }

  /* #main es columna: la topbar no encoge (queda fija), #view-container
     se lleva el espacio restante y hace scroll por su cuenta. */
  #main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; min-width: 0; position: relative; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; margin: 0 0 18px; padding: 10px 32px;
    background: var(--color-surface); border: 0; border-bottom: 1px solid var(--color-border);
    border-radius: 0; box-shadow: var(--shadow);
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  /* Alto fijo (igual al tamaño "compacto" de CMTC-Dark) para que la topbar
     mida lo mismo sin importar el tema — CMTC-Light es más "cuadrado" que
     CMTC-Dark, así que a igual alto, el ancho varía (eso sí es aceptable). */
  /* CMTC-Light (texto oscuro, para tema claro) y CMTC-Dark (texto blanco,
     para tema oscuro) — ya recortadas ambas al contenido real, así que
     miden lo mismo de alto entre sí. */
  .topbar-cm-logo { height: 36px; width: auto; }
  .cm-logo-dark { display: none; }
  :root[data-theme="dark"] .cm-logo-light { display: none; }
  :root[data-theme="dark"] .cm-logo-dark { display: block; }
  .topbar-right { display: flex; flex-direction: row; align-items: center; gap: 14px; }
  .topbar-date {
    font-size: 12.5px; font-weight: 500; color: var(--color-text-muted);
  }
  .topbar-theme-toggle {
    display: flex; gap: 6px; background: var(--color-bg); border: 1px solid var(--color-border);
    border-radius: 999px; padding: 4px;
  }
  .topbar-theme-toggle .theme-btn {
    background: transparent; border: none; color: var(--color-text-muted);
    width: 30px; height: 30px; border-radius: 999px; padding: 0; font-size: 14px;
  }
  .topbar-theme-toggle .theme-btn.active { background: var(--color-primary); color: #fff; }

  .card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
  }
  .grid { display: grid; gap: 16px; }
  .grid-modules { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

  h2 { margin-top: 0; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--color-border); }
  th { color: var(--color-text-muted); font-weight: 600; white-space: nowrap; }
  tbody tr:hover { background: var(--color-bg); }
  .table-scroll { overflow-x: auto; }
  .tabla-clickable { cursor: pointer; font-weight: 700; }
  .tabla-clickable:hover { color: var(--color-accent-hover); }
  .tabla-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .tabla-actions button { padding: 6px 9px; font-size: 12px; white-space: nowrap; }

  input, select, textarea, button {
    font: inherit; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text);
  }
  input, select, textarea { width: 100%; }
  /* Sin esto el navegador le pone su propio estilo al textarea y desentona con los demás campos */
  textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(180,161,105,.25);
  }
  input:disabled, select:disabled, textarea:disabled {
    background: var(--color-bg); color: var(--color-text-muted); cursor: not-allowed;
  }
  input::placeholder, textarea::placeholder { color: var(--color-text-muted); opacity: .75; }
  label { display: block; font-size: 12px; color: var(--color-text-muted); margin-bottom: 6px; font-weight: 500; }
  .auto-tag {
    display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 999px;
    background: var(--color-accent-soft); color: var(--color-accent-hover); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .3px;
  }
  .field { margin-bottom: 14px; }
  /* Obligatorio = un "*" junto a la etiqueta; opcional = nada (escribir "OPCIONAL" ocupa
     mucho espacio y repite lo mismo en media pantalla). Sale solo del atributo required
     del campo, así que basta marcarlo en el HTML: no hay que tocar la etiqueta. */
  /* .icon-label = login: ahí TODO es obligatorio, marcarlo no aporta nada */
  .field:has(> input:required, > select:required, > textarea:required) > label:not(.icon-label)::after,
  label.requerido::after {
    content: "*"; margin-left: 3px; color: var(--color-danger); font-weight: 700;
  }
  .form-nota-obligatorios { font-size: 11.5px; color: var(--color-text-muted); margin: 0 0 10px; }
  .form-nota-obligatorios::before { content: "*"; color: var(--color-danger); font-weight: 700; margin-right: 3px; }

  button {
    background: var(--color-primary); color: #fff; border: none;
    cursor: pointer; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover { background: var(--color-primary-hover); }
  button.secondary { background: transparent; color: var(--color-primary); border: 1px solid var(--color-border); }

  /* Íconos (Lucide) — data-lucide se reemplaza por un <svg>, que hereda estas
     reglas vía la clase .ico. stroke="currentColor" en el SVG hace que tome
     el color del texto que lo rodea automáticamente. */
  .ico {
    width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.15em;
    stroke-width: 2;
  }
  h2 .ico, h3 .ico { vertical-align: -0.1em; }
  button.danger { background: var(--color-danger); }

  .error-msg { color: var(--color-danger); font-size: 13px; margin-top: 8px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: #e5f6ec; color: var(--color-success); }
  .badge.low { background: #F3ECD6; color: var(--color-danger); }

  [hidden] { display: none !important; }

  /* ===== Checklist de inspección: una pieza por renglón, sus opciones en columnas ===== */
  /* Se imita el formato de papel a propósito: el inspector ya lo conoce de memoria */
  .chk-seccion { border: 1px solid var(--color-border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .chk-seccion-titulo {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 12px; background: var(--color-bg); border-bottom: 1px solid var(--color-border);
  }
  .chk-seccion-titulo h4 { margin: 0; font-size: 13.5px; }
  .chk-peso { font-size: 11.5px; color: var(--color-text-muted); }
  .chk-avance { margin-left: auto; font-size: 11.5px; color: var(--color-text-muted); }
  .chk-avance.completa { color: var(--color-success); font-weight: 600; }
  .chk-tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
  .chk-tabla th {
    font-size: 11px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase;
    letter-spacing: .3px; padding: 6px 4px; text-align: center; white-space: nowrap;
  }
  .chk-tabla th:first-child { text-align: left; padding-left: 12px; }
  .chk-tabla td { padding: 5px 4px; border-top: 1px solid var(--color-border); text-align: center; }
  .chk-tabla td:first-child { text-align: left; padding-left: 12px; }
  .chk-tabla tr:hover td { background: var(--color-bg); }
  .chk-tabla tr.sin-responder td:first-child { color: var(--color-text-muted); }
  .chk-tabla input[type="radio"] { width: auto; margin: 0; cursor: pointer; }
  /* La opción mala se resalta para que salte a la vista al revisar */
  .chk-tabla td.chk-malo:has(input:checked) { background: #F3ECD6; }
  :root[data-theme="dark"] .chk-tabla td.chk-malo:has(input:checked) { background: rgba(255,138,128,.18); }
  .chk-opcion { display: block; margin: 0; cursor: pointer; padding: 3px; }
  .chk-todo-bien { padding: 4px 10px; font-size: 11.5px; }
  .chk-resumen {
    position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 14px; margin-top: 10px; border-radius: 10px;
    background: var(--color-surface); border: 1px solid var(--color-border); box-shadow: var(--shadow);
  }
  .chk-resumen strong { font-size: 18px; }

  /* Captura por pasos: puntaje en vivo y avance por sección en el panel lateral.
     Son dos recuadros: el del vehículo mide lo que su contenido y el del puntaje
     crece para llenar el resto del alto (el panel se estira junto al formulario). */
  .form-panel:has(.ins-panel-avance:not([hidden])) .ins-ficha-vehiculo { flex: 0 0 auto; }
  .ins-puntaje { font-size: 30px; font-weight: 700; line-height: 1.1; color: var(--color-text); }
  .ins-puntaje-sub { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
  .ins-avance-lista { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .ins-avance-lista button {
    width: 100%; display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px;
    background: transparent; border: none; color: var(--color-text); font-size: 12.5px; font-weight: 500; text-align: left;
  }
  .ins-avance-lista button:hover { background: var(--color-bg); }
  .ins-avance-lista button span:last-child { color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .ins-avance-lista button.completa span:last-child { color: var(--color-success); font-weight: 600; }
  /* Apilado (pantalla chica) el panel queda arriba: la lista de secciones solo estorbaría */
  @media (max-width: 1000px) { .ins-avance-lista { display: none; } }
  .ins-revision-saltos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ins-revision-saltos button { padding: 4px 10px; font-size: 12px; }
  .ins-revision-titulo { margin: 18px 0 8px; font-size: 13.5px; }
  .ins-revision-problemas { list-style: none; margin: 0; padding: 0; border: 1px solid var(--color-border); border-radius: 10px; }
  .ins-revision-problemas li {
    display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px;
    border-top: 1px solid var(--color-border);
  }
  .ins-revision-problemas li:first-child { border-top: none; }
  .ins-revision-problemas li > span:first-child { flex: 1; }
  .ins-revision-seccion { font-size: 11.5px; color: var(--color-text-muted); }

  /* ========== Encabezado de página + stat tiles ========== */
  .page-header { margin-bottom: 18px; }
  .page-header h2 { margin: 0 0 4px; }
  .page-subtitle { margin: 0; color: var(--color-text-muted); font-size: 13px; }

  /* Encabezado compacto: título a la izquierda, KPIs como chips a la derecha (reutilizable) */
  .page-header-compacto {
    display: flex; align-items: center; justify-content: space-between; gap: 10px 16px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .page-header-compacto h2 { margin: 0; font-size: 20px; }
  .page-header-compacto .page-subtitle { font-size: 12px; }
  .kpi-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .kpi-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: var(--color-surface); color: var(--color-text-muted);
    border: 1px solid var(--color-border); box-shadow: var(--shadow);
  }
  .kpi-chip strong { font-size: 15px; font-weight: 700; color: var(--color-text); }
  button.kpi-chip { cursor: pointer; }
  button.kpi-chip:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .kpi-chip.activo { border-color: var(--color-accent); box-shadow: 0 0 0 2px rgba(180,161,105,.35); }
  .kpi-chip.kpi-warn strong { color: #b26a00; }
  .kpi-chip.kpi-danger strong { color: var(--color-danger); }
  :root[data-theme="dark"] .kpi-chip.kpi-warn strong { color: #f0b54a; }
  :root[data-theme="dark"] .kpi-chip.kpi-danger strong { color: #ff8a80; }

  /* Tarjeta con menos relleno para contenido denso (tablas en pestañas) */
  .card.card-compacta { padding: 12px 14px; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-tile {
    display: flex; align-items: center; gap: 12px;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  }
  .stat-icon {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    background: var(--color-primary-soft);
  }
  .stat-tile-warn .stat-icon { background: #F3ECD6; }
  .stat-tile-ok .stat-icon { background: #e5f6ec; }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--color-text); line-height: 1.1; }
  .stat-label { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }

  /* ========== Tarjeta de formulario con ícono de encabezado ========== */
  .form-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .form-card-icon {
    width: 40px; height: 40px; border-radius: 12px; background: var(--color-accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .form-card-header h3 { margin: 0; font-size: 15px; }
  .form-card-header p { margin: 1px 0 0; font-size: 12.5px; color: var(--color-text-muted); }

  /* ========== Lista de incidencias (tarjetas en vez de tabla plana) ========== */
  .incidencia-list { display: flex; flex-direction: column; gap: 8px; }
  .incidencia-item {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 16px; border: 1px solid var(--color-border); border-radius: 12px;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .incidencia-item:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .incidencia-icon {
    width: 38px; height: 38px; border-radius: 10px; background: var(--color-primary-soft);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  .incidencia-main { flex: 1; min-width: 180px; }
