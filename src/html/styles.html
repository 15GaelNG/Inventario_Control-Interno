<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    /* Marca — Control Interno / Ciudad Maderas */
    --color-primary: #06263A;
    --color-primary-hover: #0c3550;
    --color-primary-soft: #DDEBF7;
    --color-accent: #B4A169;
    --color-accent-hover: #9c8a58;
    --color-accent-soft: #EBE5D1;

    --color-bg: #F5F6F5;
    --color-surface: #ffffff;
    --color-text: #1c2b33;
    --color-text-muted: #5c6b72;
    --color-border: #E7E7E7;
    --color-danger: #8a6d3a; /* bronce/dorado oscuro de marca, en vez de rojo */
    --color-success: #1e7d4f;
    --color-note-bg: var(--color-primary-soft);
    --color-badge-bg: #ffffff; /* fijo: el logo (navy+dorado) siempre necesita fondo claro, en cualquier tema */

    /* Sidebar: fondo navy fijo de marca, NO cambia con el tema claro/oscuro. */
    --color-sidebar-bg: #06263A;
    --color-sidebar-text: #b7c8d2;
    --color-sidebar-text-strong: #ffffff;
    --color-sidebar-hover: rgba(255,255,255,.08);
    --color-sidebar-border: rgba(255,255,255,.14);

    --radius: 12px;
    --shadow: 0 1px 3px rgba(6,38,58,.08), 0 1px 2px rgba(6,38,58,.05);
    --shadow-lg: 0 24px 48px -16px rgba(6,38,58,.35);
  }

  :root[data-theme="dark"] {
    --color-primary: #2f7bb0;
    --color-primary-hover: #3f91cb;
    --color-primary-soft: #163041;
    --color-accent: #c4b280;
    --color-accent-hover: #d4c393;
    --color-accent-soft: #2a2718;

    --color-bg: #0b1a23;
    --color-surface: #142732;
    --color-text: #edf1f3;
    --color-text-muted: #9db0b8;
    --color-border: #26404c;
    --color-note-bg: #16344450;
  }

  /* Transición suave al cambiar de tema (no anima layout, solo color/fondo) */
  body, .card, input, select, button, .login-form-card, .login-icon-badge,
  .theme-toggle, .theme-toggle button, .login-security-note, #sidebar, .nav-item {
    transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
  }

  /* #app ocupa exactamente el alto de la pantalla y no se desplaza — el
     sidebar y la topbar quedan fijos; solo el contenido de #view-container
     hace scroll internamente (ver más abajo). */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar — fondo navy fijo de marca (no cambia con el tema claro/oscuro) */
  #sidebar {
    width: 280px; height: 100vh; background: var(--color-sidebar-bg);
    border-right: 1px solid var(--color-sidebar-border);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
    flex-shrink: 0; overflow-y: auto; overflow-x: hidden; transition: width .28s ease;
  }
  #sidebar.collapsed { width: 92px; }

  /* Barra de scroll del sidebar (y de sus grupos) — delgada, dorada y sin
     las flechitas feas de la barra por default del navegador/Windows. */
  #sidebar, .nav-groups { scrollbar-width: thin; scrollbar-color: rgba(180,161,105,.5) transparent; }
  #sidebar::-webkit-scrollbar, .nav-groups::-webkit-scrollbar { width: 6px; }
  #sidebar::-webkit-scrollbar-track, .nav-groups::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb, .nav-groups::-webkit-scrollbar-thumb {
    background: rgba(180,161,105,.45); border-radius: 999px;
  }
  #sidebar::-webkit-scrollbar-thumb:hover, .nav-groups::-webkit-scrollbar-thumb:hover {
    background: rgba(180,161,105,.75);
  }
  #sidebar::-webkit-scrollbar-button, .nav-groups::-webkit-scrollbar-button { display: none; width: 0; height: 0; }

  .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sidebar-brand { display: flex; align-items: center; gap: 9px; overflow: hidden; min-width: 0; }
  .sidebar-brand-icon {
    width: 30px; height: 30px; flex-shrink: 0; border-radius: 999px;
    background: var(--color-badge-bg); padding: 4px; object-fit: contain;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  .sidebar-title {
    font-size: 15.5px; font-weight: 600; margin: 0; color: var(--color-sidebar-text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Ahora vive junto a "Cerrar sesión" (fila completa), no en el encabezado. */
  .sidebar-collapse-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: none; color: var(--color-sidebar-text);
    padding: 9px 13px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; transition: background-color .35s ease;
  }
  .sidebar-collapse-btn:hover { background: var(--color-sidebar-hover); }
  .sidebar-collapse-btn .ico { transition: transform .28s ease; }
  #sidebar.collapsed .sidebar-header { justify-content: center; }
  #sidebar.collapsed .sidebar-collapse-btn { justify-content: center; }
  #sidebar.collapsed .sidebar-collapse-btn .ico { transform: rotate(180deg); }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 13px; border-radius: var(--radius); cursor: pointer;
    color: var(--color-sidebar-text); font-weight: 500; white-space: nowrap; overflow: hidden;
  }
  .nav-item:hover { background: var(--color-sidebar-hover); }
  .nav-item.active { background: var(--color-accent); color: var(--color-primary); }
  .nav-icon { flex-shrink: 0; width: 20px; text-align: center; }
  .nav-label { overflow: hidden; text-overflow: ellipsis; }

  #sidebar.collapsed .sidebar-title,
  #sidebar.collapsed .nav-label { display: none; }
  #sidebar.collapsed .nav-item { justify-content: center; }

  /* Tooltip con el nombre del módulo (sidebar colapsado). Se arma con JS y
     se cuelga de <body> — NO puede vivir dentro de #sidebar/.nav-groups
     porque ambos tienen overflow-x:hidden (para quitar la barra de scroll
     horizontal) y eso recortaría cualquier tooltip que necesite salirse del
     sidebar; mismo truco que ya usa el popover de filtros de las tablas. */
  .sidebar-tooltip {
    position: fixed; transform: translateY(-50%);
    background: var(--color-primary); color: #fff;
    padding: 7px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    white-space: nowrap; box-shadow: var(--shadow-lg);
    border: 1px solid rgba(180,161,105,.4);
    opacity: 0; pointer-events: none; z-index: 9999;
    transition: opacity .15s ease;
  }
  .sidebar-tooltip.show { opacity: 1; }

  /* Grupos de navegación (acordeón por área) — con la temática navy+dorado:
     cada grupo trae su ícono en una placa que se enciende en dorado cuando
     está abierto, la línea que conecta con sus subitems también es dorada
     (degradada), y tanto el encabezado como los subitems brillan/se
     deslizan al pasar el mouse. Si el sidebar está colapsado y le pican a
     un grupo, el sidebar se expande solo Y ese grupo se abre de una vez
     (ver el click listener en app.html). */
  .nav-groups { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; overflow-y: auto; overflow-x: hidden; }

  .nav-group-header {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 8px 10px; border-radius: var(--radius);
    color: var(--color-sidebar-text); font-weight: 600; font-size: 13px;
    white-space: nowrap; overflow: hidden;
    transition: background-color .2s ease, color .2s ease;
  }
  .nav-group-header:hover {
    background: rgba(255,255,255,.12);
    box-shadow: inset 0 0 0 1px rgba(180,161,105,.35);
  }
  .nav-group-header:hover .nav-icon {
    background: rgba(180,161,105,.4); color: var(--color-accent);
    box-shadow: 0 0 10px rgba(180,161,105,.55);
  }
  .nav-group.expanded .nav-group-header {
    background: rgba(180,161,105,.14); color: var(--color-sidebar-text-strong);
  }
  .nav-group-header .nav-icon {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); color: var(--color-sidebar-text);
    transition: background-color .25s ease, color .25s ease;
  }
  .nav-group-header .nav-icon .ico { width: 15px; height: 15px; }
  .nav-group.expanded .nav-group-header .nav-icon {
    background: var(--color-accent); color: var(--color-primary);
  }
  .nav-group-header .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .nav-group-chevron {
    flex-shrink: 0; color: var(--color-sidebar-text); opacity: .55;
    transition: transform .25s ease, color .2s ease, opacity .2s ease;
  }
  .nav-group-chevron .ico { width: 15px; height: 15px; }
  .nav-group.expanded .nav-group-chevron { transform: rotate(90deg); color: var(--color-accent); opacity: 1; }

  .nav-group-items {
    max-height: 0; overflow: hidden; opacity: 0; position: relative;
    transition: max-height .3s ease, opacity .25s ease;
    display: flex; flex-direction: column; gap: 1px;
    padding-left: 16px; margin-left: 24px;
  }
  .nav-group-items::before {
    content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 2px;
    background: linear-gradient(to bottom, var(--color-accent), rgba(255,255,255,.08));
    border-radius: 2px; opacity: .6;
  }
  .nav-group.expanded .nav-group-items { max-height: 600px; opacity: 1; }

  .nav-subitem {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 8px; cursor: pointer;
    color: var(--color-sidebar-text); font-size: 12.5px; font-weight: 500;
    transition: background-color .18s ease, color .18s ease, transform .18s ease;
  }
  .nav-subitem-icon { flex-shrink: 0; width: 15px; display: flex; align-items: center; justify-content: center; opacity: .85; }
  .nav-subitem-icon .ico { width: 13px; height: 13px; }
  .nav-subitem-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-subitem:hover {
    background: rgba(255,255,255,.13); color: var(--color-sidebar-text-strong);
    transform: translateX(3px);
    box-shadow: 0 0 0 1px rgba(180,161,105,.3), 0 2px 10px rgba(180,161,105,.3);
  }
  .nav-subitem.active { background: var(--color-accent); color: var(--color-primary); font-weight: 700; }

  /* En modo colapsado, los grupos se reducen a solo el ícono del encabezado */
  #sidebar.collapsed .nav-group-header .nav-label,
  #sidebar.collapsed .nav-group-chevron { display: none; }
  #sidebar.collapsed .nav-group-header { justify-content: center; }
  #sidebar.collapsed .nav-group-items { display: none !important; }


  /* #main es columna: la topbar no encoge (queda fija), #view-container
     se lleva el espacio restante y hace scroll por su cuenta. */
  #main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; min-width: 0; position: relative; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; margin: 0 0 18px; padding: 10px 32px;
    background: var(--color-surface); border: 0; border-bottom: 1px solid var(--color-border);
    border-radius: 0; box-shadow: var(--shadow);
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  /* Alto fijo (igual al tamaño "compacto" de CMTC-Dark) para que la topbar
     mida lo mismo sin importar el tema — CMTC-Light es más "cuadrado" que
     CMTC-Dark, así que a igual alto, el ancho varía (eso sí es aceptable). */
  /* CMTC-Light (texto oscuro, para tema claro) y CMTC-Dark (texto blanco,
     para tema oscuro) — ya recortadas ambas al contenido real, así que
     miden lo mismo de alto entre sí. */
  .topbar-cm-logo { height: 36px; width: auto; }
  .cm-logo-dark { display: none; }
  :root[data-theme="dark"] .cm-logo-light { display: none; }
  :root[data-theme="dark"] .cm-logo-dark { display: block; }
  .topbar-right { display: flex; flex-direction: row; align-items: center; gap: 14px; }
  .topbar-date {
    font-size: 12.5px; font-weight: 500; color: var(--color-text-muted);
  }
  .topbar-theme-toggle {
    display: flex; gap: 6px; background: var(--color-bg); border: 1px solid var(--color-border);
    border-radius: 999px; padding: 4px;
  }
  .topbar-theme-toggle .theme-btn {
    background: transparent; border: none; color: var(--color-text-muted);
    width: 30px; height: 30px; border-radius: 999px; padding: 0; font-size: 14px;
  }
  .topbar-theme-toggle .theme-btn.active { background: var(--color-primary); color: #fff; }

  /* Usuario + cerrar sesión — antes vivían al fondo del sidebar, ahora aquí. */
  .topbar-user-menu {
    display: flex; align-items: center; gap: 10px;
    padding-left: 14px; border-left: 1px solid var(--color-border);
  }
  .topbar-user {
    font-size: 12.5px; font-weight: 600; color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px;
  }
  .topbar-logout-btn {
    background: transparent; border: 1px solid var(--color-border); color: var(--color-text-muted);
    width: 34px; height: 34px; border-radius: 999px; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .topbar-logout-btn:hover { background: var(--color-danger); color: #fff; border-color: transparent; }

  .card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
  }

  /* Barra de pestañas simple (ej. "Catálogo" / "Registrar" arriba de cada
     módulo) — un panel visible a la vez, en vez de formulario + tabla
     siempre juntos uno debajo del otro. */
  .tabs-simple {
    display: flex; gap: 4px; border-bottom: 1px solid var(--color-border);
    margin-bottom: 18px; overflow-x: auto;
  }
  .tab-btn {
    background: transparent; color: var(--color-text-muted); border: none;
    border-bottom: 2px solid transparent; border-radius: 0;
    padding: 10px 16px; font-weight: 600; font-size: 13.5px; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  }
  .tab-btn:hover { color: var(--color-text); background: var(--color-bg); }
  .tab-btn.active { color: var(--color-accent-hover); border-bottom-color: var(--color-accent); }
  .tab-panel[hidden] { display: none; }
  .grid { display: grid; gap: 16px; }
  .grid-modules { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

  h2 { margin-top: 0; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--color-border); }
  th { color: var(--color-text-muted); font-weight: 600; white-space: nowrap; }
  tbody tr:hover { background: var(--color-bg); }
  .table-scroll { overflow-x: auto; }
  .tabla-clickable { font-weight: 700; }
  .fila-clickable { cursor: pointer; }
  .fila-clickable:hover .tabla-clickable { color: var(--color-accent-hover); }
  .tabla-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .tabla-actions button { padding: 6px 9px; font-size: 12px; white-space: nowrap; }
  /* Botones de acción que en realidad son links (ej. "Ver PDF" en Arqueos)
     — mismo look que button.secondary, sin duplicar toda la regla. */
  .tabla-actions a.secondary, .tabla-actions a.externo {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 9px; font-size: 12px; white-space: nowrap; border-radius: 8px;
    text-decoration: none; cursor: pointer;
  }
  .tabla-actions a.secondary {
    background: transparent; color: var(--color-primary); border: 1px solid var(--color-border);
  }
  .tabla-actions a.secondary:hover { background: var(--color-bg); }

  /* Botones "azules" (PDF y links que sacan de la app, ej. Calendario, Ver
     reporte, Ver PDF) — el mismo azul de marca (--color-primary, el navy
     del sidebar y los botones principales) + texto/ícono blancos (el ícono
     hereda el color vía currentColor), para que resalten y no se pierdan
     entre los botones grises normales. */
  button.externo, a.externo {
    background: var(--color-primary); color: #fff; border: 1px solid var(--color-primary);
  }
  button.externo:hover, a.externo:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }

  input, select, button {
    font: inherit; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text);
  }
  input, select { width: 100%; }
  input:focus, select:focus {
    outline: none; border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(180,161,105,.25);
  }
  input:disabled {
    background: var(--color-bg); color: var(--color-text-muted); cursor: not-allowed;
  }
  label { display: block; font-size: 12px; color: var(--color-text-muted); margin-bottom: 6px; font-weight: 500; }
  .auto-tag {
    display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 999px;
    background: var(--color-accent-soft); color: var(--color-accent-hover); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .3px;
  }
  .field { margin-bottom: 14px; }

  button {
    background: var(--color-primary); color: #fff; border: none;
    cursor: pointer; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover { background: var(--color-primary-hover); }
  button.secondary { background: transparent; color: var(--color-primary); border: 1px solid var(--color-border); }

  /* Íconos (Lucide) — data-lucide se reemplaza por un <svg>, que hereda estas
     reglas vía la clase .ico. stroke="currentColor" en el SVG hace que tome
     el color del texto que lo rodea automáticamente. */
  .ico {
    width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.15em;
    stroke-width: 2;
  }
  h2 .ico, h3 .ico { vertical-align: -0.1em; }
  button.danger { background: var(--color-danger); }

  .error-msg { color: var(--color-danger); font-size: 13px; margin-top: 8px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: #e5f6ec; color: var(--color-success); }
  .badge.low { background: #F3ECD6; color: var(--color-danger); }

  [hidden] { display: none !important; }

  /* ========== Encabezado de página + stat tiles ========== */
  .page-header {
    margin-bottom: 18px; display: flex; align-items: flex-start;
    justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .page-header h2 { margin: 0 0 4px; }
  .page-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .page-header-actions button { white-space: nowrap; }
  .page-subtitle { margin: 0; color: var(--color-text-muted); font-size: 13px; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  /* Tarjeta minimalista (sin ícono): etiqueta chica en mayúsculas arriba,
     valor grande abajo — mismo lenguaje visual que .kpi-chip. El ícono
     (.stat-icon) se deja oculto en vez de quitarlo del HTML de cada vista,
     para no tener que tocar los 9 templates que lo usan. */
  .stat-tile {
    display: flex; align-items: center;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow);
  }
  .stat-icon { display: none; }
  .stat-tile > div:last-child { display: flex; flex-direction: column-reverse; gap: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--color-text); line-height: 1.1; }
  .stat-label {
    font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    color: var(--color-text-muted);
  }
  /* Antes coloreaban el ícono; ahora, sin ícono, colorean el valor y la franja izquierda. */
  .stat-tile-warn { border-left-color: var(--color-danger); }
  .stat-tile-warn .stat-value { color: var(--color-danger); }
  .stat-tile-ok { border-left-color: var(--color-success); }
  .stat-tile-ok .stat-value { color: var(--color-success); }

  /* KPI clickeable: filtra la tabla del mismo módulo con solo darle clic
     (ver wireKpiFiltro en app.html). */
  .stat-tile-clickable { cursor: pointer; transition: border-color .15s, box-shadow .15s, background-color .15s; }
  .stat-tile-clickable:hover { border-color: var(--color-primary); background: var(--color-primary-soft); }
  .stat-tile-clickable.stat-tile-activo {
    border-color: var(--color-primary); border-width: 2px; padding: 13px 17px;
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }

  /* ========== KPI chips (Sensores, Hologramas, Verificaciones, Inspecciones) ==========
     Tarjeta minimalista: etiqueta chica en mayúsculas arriba, valor grande abajo,
     sin ícono — mismo tipo de fila de KPIs que otros sistemas de reporting. */
  /* Mismo grid que .stat-row (auto-fit + 1fr): reparte todo el ancho disponible
     entre parejo, en vez de flex (que solo ocupaba lo que su contenido necesitaba
     y dejaba hueco vacío cuando había pocos KPIs). */
  .kpi-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 14px; }
  .kpi-chip {
    display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radius); padding: 13px 18px;
    box-shadow: var(--shadow); text-align: left; cursor: pointer;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
  }
  .kpi-chip:disabled { cursor: default; }
  .kpi-chip:not(:disabled):hover { border-color: var(--color-primary); background: var(--color-primary-soft); }
  .kpi-chip.activo {
    border-color: var(--color-primary); border-width: 2px; padding: 12px 17px;
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }
  .kpi-chip-label {
    font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    color: var(--color-text-muted);
  }
  .kpi-chip-value { font-size: 22px; font-weight: 700; color: var(--color-text); line-height: 1.1; }
  .kpi-chip-sub { font-size: 11.5px; color: var(--color-text-muted); }
  /* kpi-warn: llama la atención sin ser una alerta real (bronce de marca).
     kpi-danger: alerta real — mismo color de valor, pero además el borde tiñe el color. */
  .kpi-chip.kpi-warn .kpi-chip-value, .kpi-chip.kpi-danger .kpi-chip-value { color: var(--color-danger); }
  .kpi-chip.kpi-warn { border-left-color: var(--color-danger); }
  .kpi-chip.kpi-danger { border-color: var(--color-danger); }

  /* ========== Tarjeta de formulario con ícono de encabezado ========== */
  .form-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .form-card-icon {
    width: 40px; height: 40px; border-radius: 12px; background: var(--color-accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .form-card-header h3 { margin: 0; font-size: 15px; }
  .form-card-header p { margin: 1px 0 0; font-size: 12.5px; color: var(--color-text-muted); }

  /* ========== Lista de incidencias (tarjetas en vez de tabla plana) ========== */
  .incidencia-list { display: flex; flex-direction: column; gap: 8px; }
  .incidencia-item {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 16px; border: 1px solid var(--color-border); border-radius: 12px;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .incidencia-item:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .incidencia-icon {
    width: 38px; height: 38px; border-radius: 10px; background: var(--color-primary-soft);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  .incidencia-main { flex: 1; min-width: 180px; }
  .incidencia-main-clickable { cursor: pointer; }
  .incidencia-main-clickable:hover .incidencia-folio { color: var(--color-accent-hover); }
  .incidencia-folio { font-weight: 700; font-size: 13.5px; }
  .incidencia-meta { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
  .incidencia-fecha { font-size: 12px; color: var(--color-text-muted); min-width: 90px; text-align: right; }
  .badge-estado {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
  }
  .badge-estado.abierta { background: #F3ECD6; color: var(--color-danger); }
  .badge-estado.cerrada { background: #e5f6ec; color: var(--color-success); }
  .incidencia-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .incidencia-actions button { padding: 7px 10px; }

  /* ========== Lista de vehículos (mismo patrón visual que incidencias) ========== */
  .vehiculo-list { display: flex; flex-direction: column; gap: 8px; }
  .vehiculo-item {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 16px; border: 1px solid var(--color-border); border-radius: 12px;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .vehiculo-item:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .vehiculo-icon {
    width: 38px; height: 38px; border-radius: 10px; background: var(--color-primary-soft);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  .vehiculo-main { flex: 1; min-width: 180px; }
  .vehiculo-main-clickable { cursor: pointer; }
  .vehiculo-main-clickable:hover .vehiculo-folio { color: var(--color-accent-hover); }
  .vehiculo-folio { font-weight: 700; font-size: 13.5px; }
  .vehiculo-meta { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
  .vehiculo-placa { font-size: 12px; color: var(--color-text-muted); min-width: 80px; text-align: right; }
  .vehiculo-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .vehiculo-actions button { padding: 7px 10px; }

  .badge-estado.activo { background: #e5f6ec; color: var(--color-success); }
  .badge-estado.baja { background: #F3ECD6; color: var(--color-danger); }
  .badge-estado.pendiente { background: var(--color-primary-soft); color: var(--color-primary); }

  /* ========== Historial en línea de tiempo (ej. Cambios/Reasignaciones
     enlazados en el detalle de Vehículos) — tarjetas compactas en vez de
     tabla plana, con un antes → después bien resaltado. ========== */
  .historial-timeline { display: flex; flex-direction: column; gap: 8px; position: relative; }
  .historial-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 12px;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .historial-item:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .historial-icon {
    width: 32px; height: 32px; border-radius: 9px; background: var(--color-primary-soft); color: var(--color-primary);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .historial-icon .ico { width: 15px; height: 15px; }
  .historial-icon-accent { background: var(--color-accent-soft); color: var(--color-accent-hover); }
  .historial-main { flex: 1; min-width: 0; }
  .historial-campo { font-weight: 700; font-size: 12.5px; margin-bottom: 4px; }
  .historial-departamento { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
  .historial-valores { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .historial-flecha { color: var(--color-text-muted); flex-shrink: 0; width: 13px; height: 13px; }
  .chip-valor {
    display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .chip-antes { background: var(--color-bg); color: var(--color-text-muted); border: 1px solid var(--color-border); }
  .chip-despues { background: var(--color-accent-soft); color: var(--color-accent-hover); }
  .historial-meta { flex-shrink: 0; text-align: right; font-size: 11.5px; color: var(--color-text-muted); min-width: 90px; }
  .historial-meta div:first-child { font-weight: 600; color: var(--color-text); margin-bottom: 2px; }

  /* ========== Etiquetas de clase + filtro ========== */
  .card-header-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px; margin-bottom: 12px;
  }
  /* ========== Tabla interactiva: buscador global + encabezado con
     orden/filtro por columna + paginación ========== */
  .tabla-buscar-global { width: auto; min-width: 220px; font-size: 12.5px; padding: 7px 10px; }

  th.th-interactivo { padding: 0; }
  .th-interactivo-label {
    display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none;
    padding: 8px 10px;
  }
  .th-interactivo-label .ico { width: .8em; height: .8em; opacity: .5; flex-shrink: 0; }
  th.th-interactivo.activo { color: var(--color-primary); }
  th.th-interactivo.activo .ico { opacity: 1; }

  .th-popover {
    position: absolute; z-index: 600; width: 220px;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); box-shadow: var(--shadow-lg);
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .th-popover-titulo { font-weight: 700; font-size: 12.5px; }
  .th-popover-orden { display: flex; gap: 8px; }
  .th-popover-orden button { flex: 1; padding: 7px 0; font-size: 12px; }
  .th-popover-orden button.activo { background: var(--color-primary-soft); color: var(--color-primary); border-color: transparent; }
  .th-popover select, .th-popover input[type="text"] { font-size: 12.5px; padding: 7px 9px; }
  .th-popover-acciones { display: flex; gap: 8px; }
  .th-popover-acciones button { flex: 1; padding: 7px 0; font-size: 12px; white-space: nowrap; }

  /* Filtro de checklist (columnas con pocos valores distintos, ej. Estado,
     Estatus, Rol) — lista de los valores reales presentes en los datos,
     en vez del cuadro de texto genérico. */
  .th-popover-lista-acciones { display: flex; gap: 10px; }
  .th-popover-lista-acciones button {
    background: none; border: none; padding: 0; color: var(--color-primary);
    font-size: 11.5px; font-weight: 600; cursor: pointer; text-decoration: underline;
  }
  .th-popover-lista {
    display: flex; flex-direction: column; gap: 2px;
    max-height: 190px; overflow-y: auto;
  }
  .th-popover-opcion {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    padding: 4px 2px; border-radius: 6px; cursor: pointer;
  }
  .th-popover-opcion:hover { background: var(--color-bg); }
  .th-popover-opcion input { width: auto; padding: 0; flex-shrink: 0; }
  .th-popover-opcion span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tabla-pie {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 10px; margin-top: 14px; font-size: 12.5px; color: var(--color-text-muted);
  }
  .tabla-pie-paginas { display: flex; align-items: center; gap: 8px; }
  .tabla-pie-paginas select { width: auto; font-size: 12.5px; padding: 6px 8px; }
  .tabla-pie-paginas button {
    background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border);
    padding: 6px 9px;
  }
  .tabla-pie-paginas button:disabled { opacity: .35; cursor: not-allowed; }
  .tabla-pie-paginas button:not(:disabled):hover { background: var(--color-bg); }

  .tag {
    display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; white-space: nowrap; letter-spacing: .2px;
  }
  .tag-navy { background: var(--color-primary-soft); color: var(--color-primary); }
  .tag-gold { background: var(--color-accent-soft); color: var(--color-accent-hover); }
  .tag-green { background: #e5f6ec; color: var(--color-success); }
  .tag-brown { background: #F3ECD6; color: var(--color-danger); }
  .tag-slate { background: var(--color-bg); color: var(--color-text-muted); border: 1px solid var(--color-border); }

  .empty-state { text-align: center; color: var(--color-text-muted); font-size: 13px; padding: 24px 0; }
  .file-actual { margin-top: 4px; font-size: 12px; }
  .file-actual a { color: var(--color-accent-hover); }

  /* Campos de captura en pesos (montos): "$" fijo a la izquierda del input,
     nada más visual — el valor sigue siendo un número normal por dentro. */
  .input-moneda-wrap { position: relative; }
  .input-moneda-wrap input { padding-left: 26px; }
  .input-moneda-wrap::before {
    content: '$'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--color-text-muted); font-weight: 700; font-size: 13px; pointer-events: none;
  }

  /* Recuadro para firmar con mouse/dedo (Arqueos) */
  .firma-pad-wrap { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .firma-pad {
    width: 100%; max-width: 500px; aspect-ratio: 500 / 170; height: auto;
    background: #fff; border: 1px dashed var(--color-border); border-radius: var(--radius);
    cursor: crosshair; touch-action: none; /* evita que el navegador haga scroll al firmar en pantalla táctil */
  }
  .firma-pad-limpiar { padding: 6px 10px; font-size: 12px; }

  /* ========== Modal ========== */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(6,20,30,.5); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px;
  }
  .modal-card {
    width: 100%; max-width: 420px; background: var(--color-surface);
    border-radius: 16px; box-shadow: var(--shadow-lg); padding: 24px;
  }
  .modal-card-wide { max-width: 640px; }
  .modal-form-scroll { max-height: 62vh; overflow-y: auto; padding-right: 6px; margin-right: -6px; }

  .info-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 16px;
  }
  .info-item {
    padding: 8px 10px; border-radius: 8px; background: var(--color-bg);
  }
  .info-label {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px;
    color: var(--color-text-muted); margin-bottom: 2px;
  }
  .info-value { font-size: 13px; font-weight: 500; word-break: break-word; }
  .info-section-title {
    grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: var(--color-primary);
    text-transform: uppercase; letter-spacing: .4px; margin: 10px 0 -2px;
    padding-bottom: 6px; border-bottom: 1px solid var(--color-border);
  }
  .info-section-title:first-child { margin-top: 0; }

  .spinner {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
    border: 2.5px solid var(--color-border); border-top-color: var(--color-accent);
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ========== Notificación flotante: cargando → éxito/error ========== */
  #toast-container {
    position: fixed; top: 20px; right: 20px; z-index: 10000;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  }
  .toast {
    display: flex; align-items: center; gap: 11px;
    background: var(--color-surface); color: var(--color-text);
    border: 1px solid var(--color-border); border-left: 4px solid var(--color-border);
    border-radius: var(--radius); box-shadow: var(--shadow-lg);
    padding: 13px 16px; min-width: 260px; max-width: 380px;
    pointer-events: auto; font-size: 13px; font-weight: 500;
    transform: translateX(30px); opacity: 0;
    transition: transform .25s ease, opacity .25s ease;
  }
  .toast.show { transform: translateX(0); opacity: 1; }
  .toast-icon { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .toast-mensaje { flex: 1; line-height: 1.4; }
  .toast-exito { border-left-color: var(--color-success); }
  .toast-exito .toast-icon { color: var(--color-success); }
  .toast-error { border-left-color: var(--color-danger); }
  .toast-error .toast-icon { color: var(--color-danger); }
  .toast-cargando { border-left-color: var(--color-accent); }
  .loading-inline {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
    color: var(--color-text-muted); font-size: 13px; padding: 14px 4px;
  }

  /* ===== Transición corta al cambiar de módulo en el sidebar ===== */
  /* flex:1 + overflow-y:auto: esta es la única zona que hace scroll —
     sidebar y topbar quedan fijos (ver #app/#sidebar/#main arriba). */
  #view-container {
    position: relative; min-height: 240px;
    flex: 1; overflow-y: auto; padding: 0 32px 24px;
  }
  #view-container > * { animation: viewContentFadeIn .3s ease; }
  @keyframes viewContentFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .view-transition {
    position: absolute; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: var(--color-bg); opacity: 0; transition: opacity .28s ease; pointer-events: none;
    border-radius: var(--radius);
  }
  .view-transition.show { opacity: 1; }
  .view-transition-icon { font-size: 38px; animation: viewIconPulse 1s ease-in-out infinite; }
  .view-transition-text {
    font-size: 12.5px; font-weight: 600; color: var(--color-text-muted);
    text-transform: uppercase; letter-spacing: .3px;
  }
  @keyframes viewIconPulse {
    0%, 100% { transform: scale(1); opacity: .8; }
    50% { transform: scale(1.18); opacity: 1; }
  }
  .modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  .modal-subtitle { margin: 2px 0 0; font-size: 12.5px; color: var(--color-text-muted); }
  .modal-close {
    background: transparent; color: var(--color-text-muted); border: none;
    width: 28px; height: 28px; border-radius: 8px; padding: 0; font-size: 13px;
  }
  .modal-close:hover { background: var(--color-bg); }

  /* ========== Login ========== */
  #login-screen {
    min-height: 100vh; width: 100%; position: relative; background: var(--color-bg);
    display: flex; flex-direction: column;
  }

  .theme-toggle {
    position: absolute; top: 20px; right: 20px; z-index: 10;
    display: flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,.9); border: 1px solid var(--color-border);
    border-radius: 999px; padding: 4px; box-shadow: var(--shadow);
  }
  :root[data-theme="dark"] .theme-toggle { background: rgba(18,35,45,.9); }
  .theme-toggle button {
    background: transparent; color: var(--color-text-muted);
    width: 30px; height: 30px; border-radius: 999px; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .theme-toggle button.active { background: var(--color-primary); color: #fff; }

  .login-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    flex: 1;
  }

  .login-hero { position: relative; overflow: hidden; }

  /* El fondo del login ya no es una sola imagen fija — es un slideshow
     entre varias fotos de marca (cada una con su propia variante clara/
     oscura), armado en JS (ver initLoginHeroSlideshow en app.html): dos
     capas apiladas que se van turnando la clase "login-hero-bg-visible"
     para un fundido cruzado. El degradado y la URL de cada capa los pone
     el JS directo en background-image (cambia según tema + slide actual),
     aquí solo queda la transición de opacidad. */
  .login-hero-bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    opacity: 0; transition: opacity 2s ease;
  }
  .login-hero-bg-visible { opacity: 1; }

  .login-hero-content {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 48px 56px;
  }

  .login-brand { display: flex; align-items: center; gap: 12px; }
  .login-brand-badge {
    width: 44px; height: 44px; border-radius: 12px; background: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
    flex-shrink: 0;
  }
  .login-brand-badge img { width: 28px; height: 28px; }
  .login-brand-text { color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 2px; }
  .login-brand-text span { display: block; color: var(--color-accent); font-size: 11px; letter-spacing: 3px; font-weight: 500; margin-top: 1px; }

  .login-hero-body { max-width: 480px; }
  .login-hero-title {
    color: #fff; font-size: 32px; font-weight: 700; line-height: 1.25; margin: 0 0 12px;
  }
  .login-hero-sub { color: rgba(255,255,255,.75); font-size: 14px; line-height: 1.6; margin: 0; }

  .login-features {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .login-feature {
    background: rgba(255,255,255,.10); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
    padding: 14px 8px; text-align: center; color: #fff;
  }
  .login-feature .icon { font-size: 18px; margin-bottom: 6px; }
  .login-feature .label { font-size: 11px; font-weight: 500; line-height: 1.3; color: rgba(255,255,255,.9); }

  .login-panel {
    display: flex; align-items: center; justify-content: center;
    background: var(--color-bg); padding: 32px;
  }
  .login-form-card {
    width: 100%; max-width: 380px; background: var(--color-surface);
    border-radius: 20px; box-shadow: var(--shadow-lg); padding: 36px 32px;
    border: 1px solid var(--color-border);
  }
  .login-icon-badge {
    width: 72px; height: 72px; border-radius: 18px; background: var(--color-badge-bg);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
    box-shadow: var(--shadow);
  }
  .login-icon-badge img { width: 42px; height: 42px; }

  .login-form-card h2 {
    text-align: center; font-size: 14px; font-weight: 500; color: var(--color-text-muted);
    margin: 0;
  }
  .login-form-card .login-system-name {
    text-align: center; font-size: 22px; font-weight: 700; color: var(--color-primary); margin: 2px 0 6px;
  }
  .login-sub { text-align: center; color: var(--color-text-muted); font-size: 12.5px; margin: 0 0 16px; }
  .login-divider { width: 40px; height: 3px; background: var(--color-accent); border-radius: 3px; margin: 0 auto 22px; }

  /* Se ve mientras se detecta la cuenta de Google (apiIdentidadGoogle) —
     mismo tamaño/lugar que el chip que la reemplaza, para que no haya un
     salto raro en el layout cuando aparece uno u otro. */
  .google-account-detectando {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 12px; margin-bottom: 16px;
    color: var(--color-text-muted); font-size: 12px;
  }

  .google-account-chip {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; text-align: left;
  }
  .google-account-chip:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .google-account-avatar {
