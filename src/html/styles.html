<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    /* Marca — Control Interno / Ciudad Maderas */
    --color-primary: #06263A;
    --color-primary-hover: #0c3550;
    --color-primary-soft: #DDEBF7;
    --color-accent: #B4A169;
    --color-accent-hover: #9c8a58;
    --color-accent-soft: #EBE5D1;

    --color-bg: #F5F6F5;
    --color-surface: #ffffff;
    --color-text: #1c2b33;
    --color-text-muted: #5c6b72;
    --color-border: #E7E7E7;
    --color-danger: #8a6d3a; /* bronce/dorado oscuro de marca, en vez de rojo */
    --color-success: #1e7d4f;
    --color-note-bg: var(--color-primary-soft);
    --color-badge-bg: #ffffff; /* fijo: el logo (navy+dorado) siempre necesita fondo claro, en cualquier tema */
    --color-neutro-fuerte: #212121; /* etiquetas "neutras" (ej. Clase Camión/Motocicleta) */

    /* Sidebar: fondo navy fijo de marca, NO cambia con el tema claro/oscuro. */
    --color-sidebar-bg: #06263A;
    --color-sidebar-text: #b7c8d2;
    --color-sidebar-text-strong: #ffffff;
    --color-sidebar-hover: rgba(255,255,255,.08);
    --color-sidebar-border: rgba(255,255,255,.14);

    /* Escala de letra y de esquinas: todo el sistema (componentes, módulos, Líneas) toma de aquí.
       font-size y border-radius en px sueltos no pasan el contrato (source-contracts), salvo lo
       decorativo: letra de 36px o más y esquinas de 2px o menos (y 999px / 50% para píldoras y círculos). */
    --texto-2xs: 10px;    /* sub-etiquetas, contadores dentro de un chip */
    --texto-xs: 11.5px;   /* chips, notas, encabezados de tabla */
    --texto-s: 12.5px;    /* lo normal de tablas, formularios y fichas */
    --texto-m: 14px;      /* texto de lectura, títulos de tarjeta */
    --texto-l: 16px;      /* títulos de ventana y de sección */
    --texto-xl: 20px;     /* títulos de vista, números de KPI */
    --texto-2xl: 24px;
    --texto-3xl: 32px;    /* portada (login) */

    --radio-xs: 4px;      /* marcas chicas, barras */
    --radio-s: 6px;       /* chips cuadrados, botones chicos */
    --radio-m: 8px;       /* botones, campos */
    --radio-l: 10px;      /* menús, tarjetas chicas */
    --radio-xl: 12px;     /* tarjetas y ventanas */
    --radio-2xl: 16px;    /* hojas y paneles grandes */

    /* Tonos de estado y de las reglas de formato que venían de AppSheet (estatus, clase de vehículo, tipo de
       línea…). En la pantalla un color va por aquí, no escrito en el JS: así se aclara solo en modo oscuro.
       Lo que pinta un lienzo, un PDF o una gráfica sí lleva el color fijo (no lee variables). */
    --tono-verde: #1e8a3a;
    --tono-verde-oscuro: #006400;
    --tono-ambar: #e0a020;
    --tono-naranja: #e67e00;
    --tono-amarillo: #b59a00;
    --tono-rojo: #d62020;
    --tono-rojo-oscuro: #8b0000;
    --tono-rosa: #d4508a;
    --tono-morado: #9c27b0;
    --tono-azul: #2979ff;
    --tono-azul-marino: #305496;
    --tono-azul-petroleo: #006699;
    --tono-turquesa: #54ae98;
    --tono-bosque: #004734;
    --tono-arena: #b3a184;
    --tono-bronce: #998459;
    --tono-cobre: #b78360;
    --tono-pizarra: #607d8b;
    --tono-alerta-fondo: #fff3b0;

    --shadow: 0 1px 3px rgba(6,38,58,.08), 0 1px 2px rgba(6,38,58,.05);
    --shadow-lg: 0 24px 48px -16px rgba(6,38,58,.35);
  }

  :root[data-theme="dark"] {
    --color-primary: #2f7bb0;
    --color-primary-hover: #3f91cb;
    --color-primary-soft: #163041;
    --color-accent: #c4b280;
    --color-accent-hover: #d4c393;
    --color-accent-soft: #2a2718;

    --color-bg: #0b1a23;
    --color-surface: #142732;
    --color-text: #edf1f3;
    --color-text-muted: #9db0b8;
    --color-border: #26404c;
    --color-note-bg: #16344450;
    --color-neutro-fuerte: #c9ccd1; /* casi negro en claro se perdía contra el fondo oscuro */

    --tono-verde: #5fd07e;
    --tono-verde-oscuro: #4cbb5c;
    --tono-ambar: #f0b94a;
    --tono-naranja: #f5a442;
    --tono-amarillo: #e0c84a;
    --tono-rojo: #f07070;
    --tono-rojo-oscuro: #e06a6a;
    --tono-rosa: #ec8cb6;
    --tono-morado: #c77dd6;
    --tono-azul: #6ea2ff;
    --tono-azul-marino: #8fb0ea;
    --tono-azul-petroleo: #5fb6dd;
    --tono-turquesa: #72cdb6;
    --tono-bosque: #4fae8f;
    --tono-arena: #cbbb9d;
    --tono-bronce: #c7b383;
    --tono-cobre: #d8a580;
    --tono-pizarra: #9fb3bd;
    --tono-alerta-fondo: #3a3410;
  }

  /* Transición suave al cambiar de tema (no anima layout, solo color/fondo) */
  body, .card, input, select, button, .login-form-card, .login-icon-badge,
  .theme-toggle, .theme-toggle button, .login-security-note, #sidebar, .nav-item {
    transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--color-bg);
    color: var(--color-text);
    /* --letra: la que eligió la persona en Apariencia (componentes/apariencia.html) */
    font-family: var(--letra, 'Poppins'), 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: var(--texto-m);
    /* Que el celular no agrande el texto por su cuenta al girarlo */
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }

  /* Enlaces (ej. "Ver archivo" de PDFs/imágenes adjuntos): sin esto usan el azul
     por default del navegador, que en modo oscuro casi no se distingue del fondo. */
  a { color: var(--color-primary); }
  a:hover { color: var(--color-primary-hover); }

  /* #app ocupa exactamente el alto de la pantalla y no se desplaza — el
     sidebar y la topbar quedan fijos; solo el contenido de #view-container
     hace scroll internamente (ver más abajo).
     100dvh después de 100vh: en el celular 100vh mide como si no existiera la barra del
     navegador y el pie queda tapado; dvh es el alto que de verdad se ve (en escritorio son
     iguales, y un navegador viejo que no entiende dvh se queda con vh). */
  #app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  /* Sidebar — fondo navy fijo de marca (no cambia con el tema claro/oscuro).
     Recogido ocupa 92px; abierto (al pasar el cursor, initMenuAlPasar en app.html) mide 308px pero
     el margen negativo le deja ocupar los mismos 92px: se abre POR ENCIMA del contenido, que no se
     mueve, como el filtro por tipo de Líneas telefónicas. Ancho y margen cambian juntos y con la misma
     curva, así que el contenido tampoco se mueve durante la animación. Por debajo de los modales (500).
     308px (antes 280; usuario, 12-oct): lo que piden «Resguardos y cancelaciones» y «Reasignaciones
     vehiculares» seleccionados (en negrita) para no cortarse. El margen es siempre 92 menos el ancho. */
  #sidebar {
    width: 308px; height: 100vh; height: 100dvh; background: var(--color-sidebar-bg);
    border-right: 1px solid var(--color-sidebar-border);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
    flex-shrink: 0; overflow-y: auto; overflow-x: hidden;
    position: relative; z-index: 450; margin-right: -216px; box-shadow: 0 0 40px rgba(0,0,0,.35);
    transition: width .2s cubic-bezier(.2, 0, 0, 1), margin-right .2s cubic-bezier(.2, 0, 0, 1), box-shadow .2s ease;
  }
  #sidebar.collapsed { width: 92px; margin-right: 0; box-shadow: none; }

  /* Barra de scroll del sidebar (y de sus grupos) — delgada, dorada y sin
     las flechitas feas de la barra por default del navegador/Windows. */
  #sidebar, .nav-groups { scrollbar-width: thin; scrollbar-color: rgba(180,161,105,.5) transparent; }
  #sidebar::-webkit-scrollbar, .nav-groups::-webkit-scrollbar { width: 6px; }
  #sidebar::-webkit-scrollbar-track, .nav-groups::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb, .nav-groups::-webkit-scrollbar-thumb {
    background: rgba(180,161,105,.45); border-radius: 999px;
  }
  #sidebar::-webkit-scrollbar-thumb:hover, .nav-groups::-webkit-scrollbar-thumb:hover {
    background: rgba(180,161,105,.75);
  }
  #sidebar::-webkit-scrollbar-button, .nav-groups::-webkit-scrollbar-button { display: none; width: 0; height: 0; }

  .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sidebar-brand { display: flex; align-items: center; gap: 9px; overflow: hidden; min-width: 0; }
  .sidebar-brand-icon {
    width: 30px; height: 30px; flex-shrink: 0; border-radius: 999px;
    background: var(--color-badge-bg); padding: 4px; object-fit: contain;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  .sidebar-title {
    font-size: var(--texto-l); font-weight: 600; margin: 0; color: var(--color-sidebar-text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #sidebar.collapsed .sidebar-header { justify-content: center; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radio-xl); cursor: pointer;
    color: var(--color-sidebar-text); font-weight: 500; white-space: nowrap; overflow: hidden;
  }
  .nav-item:hover { background: var(--color-sidebar-hover); }
  .nav-icon { flex-shrink: 0; width: 20px; text-align: center; }
  .nav-label { overflow: hidden; text-overflow: ellipsis; }
  /* Los módulos sin submódulos (Inicio, Gestión de activos, Encuestas/solicitudes, Help desk) llevan
     el ícono en la misma placa que los grupos (usuario, 12-oct) */
  .nav-item .nav-icon {
    width: 30px; height: 30px; border-radius: var(--radio-m);
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); transition: background-color .25s ease, color .25s ease;
  }
  .nav-item .nav-icon .ico { width: 15px; height: 15px; }
  .nav-item:hover .nav-icon {
    background: rgba(180,161,105,.4); color: var(--color-accent);
    box-shadow: 0 0 10px rgba(180,161,105,.55);
  }
  /* Seleccionado: como el encabezado de un grupo abierto (fondo dorado tenue, placa dorada), no la fila dorada entera */
  .nav-item.active { background: rgba(180,161,105,.14); color: var(--color-sidebar-text-strong); }
  .nav-item.active .nav-icon { background: var(--color-accent); color: var(--color-primary); box-shadow: none; }

  #sidebar.collapsed .sidebar-title,
  #sidebar.collapsed .nav-label { display: none; }
  #sidebar.collapsed .nav-item { justify-content: center; }

  /* Grupos de navegación (acordeón por área) — con la temática navy+dorado:
     cada grupo trae su ícono en una placa que se enciende en dorado cuando
     está abierto, la línea que conecta con sus subitems también es dorada
     (degradada), y tanto el encabezado como los subitems brillan/se
     deslizan al pasar el mouse. Si el sidebar está colapsado y le pican a
     un grupo, el sidebar se expande solo Y ese grupo se abre de una vez
     (ver el click listener en app.html). */
  .nav-groups { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; overflow-y: auto; overflow-x: hidden; }
  /* Con un grupo abierto el menú no cabe: que se deslice, no que se apachurren los módulos */
  .nav-groups > * { flex-shrink: 0; }

  .nav-group-header {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 8px 10px; border-radius: var(--radio-xl);
    color: var(--color-sidebar-text); font-weight: 600; font-size: var(--texto-s);
    white-space: nowrap; overflow: hidden;
    transition: background-color .2s ease, color .2s ease;
  }
  .nav-group-header:hover {
    background: rgba(255,255,255,.12);
    box-shadow: inset 0 0 0 1px rgba(180,161,105,.35);
  }
  .nav-group-header:hover .nav-icon {
    background: rgba(180,161,105,.4); color: var(--color-accent);
    box-shadow: 0 0 10px rgba(180,161,105,.55);
  }
  .nav-group.expanded .nav-group-header {
    background: rgba(180,161,105,.14); color: var(--color-sidebar-text-strong);
  }
  .nav-group-header .nav-icon {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: var(--radio-m);
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); color: var(--color-sidebar-text);
    transition: background-color .25s ease, color .25s ease;
  }
  .nav-group-header .nav-icon .ico { width: 15px; height: 15px; }
  .nav-group.expanded .nav-group-header .nav-icon {
    background: var(--color-accent); color: var(--color-primary);
  }
  .nav-group-header .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .nav-group-chevron {
    flex-shrink: 0; color: var(--color-sidebar-text); opacity: .55;
    transition: transform .25s ease, color .2s ease, opacity .2s ease;
  }
  .nav-group-chevron .ico { width: 15px; height: 15px; }
  .nav-group.expanded .nav-group-chevron { transform: rotate(90deg); color: var(--color-accent); opacity: 1; }

  /* overflow:hidden (para abrir y cerrar con max-height) recortaba el subitem al deslizarse con el
     mouse (translateX(3px)): perdía la esquina redondeada derecha y el contorno. El relleno de la
     derecha y de arriba/abajo le da ese lugar (usuario, 12-oct). */
  .nav-group-items {
    max-height: 0; overflow: hidden; opacity: 0; position: relative;
    transition: max-height .3s ease, opacity .25s ease;
    display: flex; flex-direction: column; gap: 1px;
    padding: 2px 4px 2px 16px; margin-left: 24px;
  }
  .nav-group-items::before {
    content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 2px;
    background: linear-gradient(to bottom, var(--color-accent), rgba(255,255,255,.08));
    border-radius: 2px; opacity: .6;
  }
  .nav-group.expanded .nav-group-items { max-height: 600px; opacity: 1; }

  .nav-subitem {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: var(--radio-m); cursor: pointer;
    color: var(--color-sidebar-text); font-size: var(--texto-s); font-weight: 500;
    transition: background-color .18s ease, color .18s ease, transform .18s ease;
  }
  .nav-subitem-icon { flex-shrink: 0; width: 15px; display: flex; align-items: center; justify-content: center; opacity: .85; }
  .nav-subitem-icon .ico { width: 13px; height: 13px; }
  .nav-subitem-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-subitem:hover {
    background: rgba(255,255,255,.13); color: var(--color-sidebar-text-strong);
    transform: translateX(3px);
    box-shadow: 0 0 0 1px rgba(180,161,105,.3), 0 2px 10px rgba(180,161,105,.3);
  }
  .nav-subitem.active { background: var(--color-accent); color: var(--color-primary); font-weight: 700; }

  /* En modo colapsado, los grupos se reducen a solo el ícono del encabezado */
  #sidebar.collapsed .nav-group-header .nav-label,
  #sidebar.collapsed .nav-group-chevron { display: none; }
  #sidebar.collapsed .nav-group-header { justify-content: center; }
  #sidebar.collapsed .nav-group-items { display: none !important; }


  /* #main es columna: la topbar no encoge (queda fija), #view-container
     se lleva el espacio restante y hace scroll por su cuenta. */
  #main { flex: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; min-width: 0; position: relative; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; margin: 0 0 18px; padding: 10px 32px;
    background: var(--color-surface); border: 0; border-bottom: 1px solid var(--color-border);
    border-radius: 0; box-shadow: var(--shadow);
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  /* Alto fijo (igual al tamaño "compacto" de CMTC-Dark) para que la topbar
     mida lo mismo sin importar el tema — CMTC-Light es más "cuadrado" que
     CMTC-Dark, así que a igual alto, el ancho varía (eso sí es aceptable). */
  /* CMTC-Light (texto oscuro, para tema claro) y CMTC-Dark (texto blanco,
     para tema oscuro) — ya recortadas ambas al contenido real, así que
     miden lo mismo de alto entre sí. */
  .topbar-cm-logo { height: 36px; width: auto; }
  .cm-logo-dark { display: none; }
  :root[data-theme="dark"] .cm-logo-light { display: none; }
  :root[data-theme="dark"] .cm-logo-dark { display: block; }
  .topbar-right { display: flex; flex-direction: row; align-items: center; gap: 14px; }
  .topbar-date {
    font-size: var(--texto-s); font-weight: 500; color: var(--color-text-muted);
  }

  /* Usuario + cerrar sesión, al pie del menú lateral (usuario, 13-oct; antes en la barra de arriba).
     Recogido: solo la foto, centrada como los íconos; abierto: nombre, puesto y salir. Lleva a Mi perfil. */
  .sidebar-usuario {
    display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 10px;
    border-top: 1px solid var(--color-sidebar-border);
  }
  .sidebar-usuario-tarjeta { flex: 1; min-width: 0; padding: 6px 8px; }
  .sidebar-usuario-tarjeta .avatar { box-shadow: 0 0 0 2px rgba(180,161,105,.55); }
  .sidebar-usuario-texto { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .sidebar-usuario-texto b {
    font-size: var(--texto-s); font-weight: 600; color: var(--color-sidebar-text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar-usuario-texto small {
    font-size: var(--texto-2xs); color: var(--color-sidebar-text); text-transform: uppercase; letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar-logout {
    background: transparent; border: 1px solid var(--color-sidebar-border); color: var(--color-sidebar-text);
    width: 32px; height: 32px; border-radius: 999px; padding: 0; flex-shrink: 0;
  }
  .sidebar-logout:hover { background: var(--color-danger); color: #fff; border-color: transparent; }
  #sidebar.collapsed .sidebar-logout { display: none; }
  #sidebar.collapsed .sidebar-usuario-tarjeta { justify-content: center; padding: 6px 0; }

  .card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radio-xl); box-shadow: var(--shadow); padding: 20px;
  }
  /* Celular: el mismo relleno que las ventanas (16px). Lo que se extiende de orilla a orilla de
     la tarjeta (la barra de botones de un formulario) cuenta con ese número. */
  @media (max-width: 640px) {
    .card { padding: 16px; }
  }

  /* Las pestañas (.tabs-lista, .tab-btn) están en componentes/tabs.html */
  .grid { display: grid; gap: 16px; }
  .grid-modules { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .grid-accesos { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

  /* Panel de Inicio: secciones apiladas, y "Actividad reciente" + "Accesos
     rápidos" lado a lado en pantallas anchas. */
  .dash-section { margin-bottom: 24px; }
  .dash-section-title { margin: 0 0 12px; font-size: var(--texto-l); }
  .dash-grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 1024px) {
    .dash-grid-2 { grid-template-columns: 1fr; }
  }

  h2 { margin-top: 0; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: var(--texto-s); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--color-border); }
  th { color: var(--color-text-muted); font-weight: 600; white-space: nowrap; }
  tbody tr:hover { background: var(--color-bg); }
  .table-scroll { overflow-x: auto; }
  .tabla-clickable { font-weight: 700; }
  .fila-clickable { cursor: pointer; }
  .fila-clickable:hover .tabla-clickable { color: var(--color-accent-hover); }
  .tabla-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .tabla-actions button { padding: 6px 9px; font-size: var(--texto-s); white-space: nowrap; }
  /* Botones de acción que en realidad son links (ej. "Ver PDF" en Arqueos)
     — mismo look que button.secondary, sin duplicar toda la regla. */
  .tabla-actions a.secondary, .tabla-actions a.externo {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 9px; font-size: var(--texto-s); white-space: nowrap; border-radius: var(--radio-m);
    text-decoration: none; cursor: pointer;
  }
  .tabla-actions a.secondary {
    background: transparent; color: var(--color-primary); border: 1px solid var(--color-border);
  }
  .tabla-actions a.secondary:hover { background: var(--color-bg); }

  /* Botones "azules" (PDF y links que sacan de la app, ej. Calendario, Ver
     reporte, Ver PDF) — el mismo azul de marca (--color-primary, el navy
     del sidebar y los botones principales) + texto/ícono blancos (el ícono
     hereda el color vía currentColor), para que resalten y no se pierdan
     entre los botones grises normales. */
  button.externo, a.externo {
    background: var(--color-primary); color: #fff; border: 1px solid var(--color-primary);
  }
  button.externo:hover, a.externo:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }

  /* El textarea va junto con los demás: sin esto el navegador le pone su propio estilo
     (otro borde, otro redondeo, otra tipografía) y desentona al lado de los inputs. */
  input, select, textarea, button {
    font: inherit; padding: 9px 12px; border-radius: var(--radio-m);
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text);
  }
  input, select, textarea { width: 100%; }
  /* Solo hacia abajo: a lo ancho rompería la columna del formulario */
  textarea { resize: vertical; min-height: 68px; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(180,161,105,.25);
  }
  input:disabled, textarea:disabled {
    background: var(--color-bg); color: var(--color-text-muted); cursor: not-allowed;
  }
  label { display: block; font-size: var(--texto-s); color: var(--color-text-muted); margin-bottom: 6px; font-weight: 500; }
  .auto-tag {
    display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 999px;
    background: var(--color-accent-soft); color: var(--color-accent-hover); font-size: var(--texto-2xs); font-weight: 700;
    text-transform: uppercase; letter-spacing: .3px;
  }
  .field { margin-bottom: 14px; }

  /* Campo "sino" de CamposHoja: etiqueta a la izquierda, dos botones (Sí / No) a la
     derecha en vez de un <select> -- para checklists largos (p. ej. "El vehículo se
     entrega con" de Responsiva Vehicular), donde elegir con un toque es más rápido que
     abrir un desplegable renglón por renglón. */
  .field-sino { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .field-sino label { margin: 0; }
  .sino-toggle {
    display: flex; flex: 0 0 auto; border: 1px solid var(--color-border);
    border-radius: var(--radio-m); overflow: hidden;
  }
  .sino-btn {
    background: #fff; color: var(--color-text-muted); border: none; border-radius: 0;
    padding: 7px 18px; font-size: var(--texto-s); font-weight: 600; cursor: pointer;
  }
  .sino-btn + .sino-btn { border-left: 1px solid var(--color-border); }
  .sino-btn:hover { background: var(--color-bg); color: var(--color-text); }
  .sino-btn.activo { background: var(--color-accent-soft); color: var(--color-accent-hover); }

  /* Rejilla de campos de un formulario (CamposHoja o escrito a mano):
       <div class="form-rejilla" data-columnas="3"> …<div class="field">…</div>… </div>
     data-columnas = columnas en escritorio (2 o 3; sin él, 2). En tableta caben como mucho 2 y
     en celular 1: el formulario se acomoda solo, sin CSS del módulo. No escribas
     grid-template-columns en línea (source-contracts lo revisa). Lo que debe ocupar el renglón
     completo lleva grid-column: 1 / -1 (en CamposHoja: renglonCompleto; los títulos de sección
     .info-section-title ya lo traen). minmax(0, 1fr): un control ancho no puede estirar su
     columna y empujar a la de al lado fuera de la caja. */
  .form-rejilla { display: grid; gap: 0 14px; grid-template-columns: repeat(var(--form-rejilla-columnas, 2), minmax(0, 1fr)); }
  .form-rejilla[data-columnas="3"] { --form-rejilla-columnas: 3; }
  @media (max-width: 1024px) {
    .form-rejilla[data-columnas="3"] { --form-rejilla-columnas: 2; }
  }
  @media (max-width: 640px) {
    .form-rejilla, .form-rejilla[data-columnas] { --form-rejilla-columnas: 1; }
  }

  button {
    background: var(--color-primary); color: #fff; border: none;
    cursor: pointer; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover { background: var(--color-primary-hover); }
  button.secondary { background: transparent; color: var(--color-primary); border: 1px solid var(--color-border); }

  /* Íconos (Lucide) — data-lucide se reemplaza por un <svg>, que hereda estas
     reglas vía la clase .ico. stroke="currentColor" en el SVG hace que tome
     el color del texto que lo rodea automáticamente. */
  .ico {
    width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.15em;
    stroke-width: 2;
  }
  h2 .ico, h3 .ico { vertical-align: -0.1em; }
  button.danger { background: var(--color-danger); }

  .error-msg { color: var(--color-danger); font-size: var(--texto-s); margin-top: 8px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: var(--texto-xs); font-weight: 600; }
  .badge.ok { background: #e5f6ec; color: var(--color-success); }
  .badge.low { background: #F3ECD6; color: var(--color-danger); }

  [hidden] { display: none !important; }

  /* ========== Pantallas táctiles (celular y tableta) ==========
     Sin mouse: controles del tamaño del dedo, y 16px en los campos (con menos, el iPhone
     acerca la página al tocar un campo y ya no la regresa). Va por (pointer: coarse) y no por
     ancho: una tableta horizontal mide como escritorio pero se usa con el dedo. Los cortes
     de ancho están en componentes/pantalla.html. */
  @media (pointer: coarse) {
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea { font-size: var(--texto-l) !important; }
    .nav-item, .nav-subitem, .nav-group-header, .tab-btn,
    .page-header-actions button, .form-acciones button { min-height: 44px; }
  }

  /* ========== Encabezado de página + stat tiles ========== */
  .page-header {
    margin-bottom: 18px; display: flex; align-items: flex-start;
    justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .page-header h2 { margin: 0 0 4px; }
  .page-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .page-header-actions button { white-space: nowrap; }
  .page-subtitle { margin: 0; color: var(--color-text-muted); font-size: var(--texto-s); }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-tile {
    display: flex; align-items: center; gap: 14px;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radio-xl); padding: 14px 18px; box-shadow: var(--shadow);
  }
  .stat-icon {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: var(--radio-l);
    background: var(--color-primary-soft); color: var(--color-primary);
  }
  .stat-icon .ico { width: 20px; height: 20px; }
  .stat-tile > div:last-child { display: flex; flex-direction: column; gap: 2px; }
  .stat-value { font-size: var(--texto-xl); font-weight: 700; color: var(--color-text); line-height: 1.1; }
  .stat-label { font-size: var(--texto-s); font-weight: 500; color: var(--color-text-muted); }
  .stat-tile-warn { border-left-color: var(--color-danger); }
  .stat-tile-warn .stat-icon { background: var(--color-accent-soft); color: var(--color-danger); }
  .stat-tile-ok { border-left-color: var(--color-success); }
  .stat-tile-ok .stat-icon { background: #DCF1E6; color: var(--color-success); }
  :root[data-theme="dark"] .stat-tile-ok .stat-icon { background: #123024; }

  /* Anillo de progreso de las tarjetas de Inicio (dash-kpis/dash-alertas) --
     solo ahí, no toca .stat-icon (compartido con Vehículos/Incidencias/Panorama).
     --stat-pct (0-100) y --stat-color los pone cargarResumenInicio() en línea,
     una vez que llega el número real; antes de eso el anillo queda vacío y gris. */
  .stat-ring {
    --stat-pct: 0;
    --stat-color: var(--color-primary);
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    background: conic-gradient(var(--stat-color) calc(var(--stat-pct) * 1%), var(--color-border) 0);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.5s ease;
  }
  .stat-ring-hole {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--color-surface);
    display: flex; align-items: center; justify-content: center;
    color: var(--stat-color);
  }
  .stat-ring-hole .ico { width: 17px; height: 17px; }

  /* KPI clickeable: filtra la tabla del mismo módulo con solo darle clic
     (ver wireKpiFiltro en app.html). */
  .stat-tile-clickable { cursor: pointer; transition: border-color .15s, box-shadow .15s, background-color .15s; }
  .stat-tile-clickable:hover { border-color: var(--color-primary); background: var(--color-primary-soft); }
  .stat-tile-clickable.stat-tile-activo {
    border-color: var(--color-primary); border-width: 2px; padding: 13px 17px;
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }

  /* ========== KPI chips (Sensores, Hologramas, Verificaciones, Inspecciones) ==========
     Tarjeta minimalista: etiqueta chica en mayúsculas arriba, valor grande abajo,
     sin ícono — mismo tipo de fila de KPIs que otros sistemas de reporting. */
  /* Mismo grid que .stat-row (auto-fit + 1fr): reparte todo el ancho disponible
     entre parejo, en vez de flex (que solo ocupaba lo que su contenido necesitaba
     y dejaba hueco vacío cuando había pocos KPIs). */
  .kpi-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 14px; }
  .kpi-chip {
    display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radio-xl); padding: 13px 18px;
    box-shadow: var(--shadow); text-align: left; cursor: pointer;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
  }
  .kpi-chip:disabled { cursor: default; }
  .kpi-chip:not(:disabled):hover { border-color: var(--color-primary); background: var(--color-primary-soft); }
  .kpi-chip.activo {
    border-color: var(--color-primary); border-width: 2px; padding: 12px 17px;
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }
  .kpi-chip-label {
    font-size: var(--texto-xs); font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    color: var(--color-text-muted);
  }
  .kpi-chip-value { font-size: var(--texto-xl); font-weight: 700; color: var(--color-text); line-height: 1.1; }
  .kpi-chip-sub { font-size: var(--texto-xs); color: var(--color-text-muted); }
  /* kpi-warn: llama la atención sin ser una alerta real (bronce de marca).
     kpi-danger: alerta real — mismo color de valor, pero además el borde tiñe el color. */
  .kpi-chip.kpi-warn .kpi-chip-value, .kpi-chip.kpi-danger .kpi-chip-value { color: var(--color-danger); }
  .kpi-chip.kpi-warn { border-left-color: var(--color-danger); }
  .kpi-chip.kpi-danger { border-color: var(--color-danger); }

  /* KPI clickeable: filtra la tabla del mismo módulo con solo darle clic
     (ver wireKpiFiltro en app.html). */
  .stat-tile-clickable { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .stat-tile-clickable:hover { border-color: var(--color-primary); }
  .stat-tile-clickable.stat-tile-activo {
    border-color: var(--color-primary); border-width: 2px; padding: 15px;
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }

  /* Celular: los KPIs (.stat-row y .kpi-chips, de cualquier módulo) pasan a una franja que se
     desliza de lado. En rejilla, 9 tarjetas eran 5 filas y empujaban la tabla fuera de la
     pantalla. Cada tarjeta mide ~55% del ancho (cabe una palabra como "Verificaciones"), así
     siempre se asoma la siguiente y se nota que hay más. El clic para filtrar sigue igual. */
  @media (max-width: 640px) {
    .stat-row, .kpi-chips {
      display: flex; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain;
      scroll-snap-type: x proximity; scrollbar-width: none; padding-bottom: 2px; margin-bottom: 14px;
    }
    .stat-row::-webkit-scrollbar, .kpi-chips::-webkit-scrollbar { display: none; }
    .stat-row > *, .kpi-chips > * { flex: 0 0 calc((100% - 10px) / 1.8); min-width: 0; scroll-snap-align: start; }
    .stat-tile { padding: 12px; gap: 10px; }
    .stat-tile > div:last-child { min-width: 0; overflow-wrap: break-word; }
    .stat-ring { width: 40px; height: 40px; }
    .stat-ring-hole { width: 30px; height: 30px; }
    .stat-tile-clickable.stat-tile-activo { padding: 11px; }
    .stat-icon { width: 34px; height: 34px; }
    .stat-value, .kpi-chip-value { font-size: var(--texto-xl); }
    .kpi-chip { padding: 11px 14px; }
    .kpi-chip.activo { padding: 10px 13px; }
  }

  /* ========== Panorama Vehicular (KPIs + gráficas + filtros) ========== */
  .pv-filtros { margin-bottom: 20px; }
  .pv-filtros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; align-items: end; }
  .pv-filtros-grid .field { margin-bottom: 0; }
  .pv-filtros-grid > button { height: 38px; white-space: nowrap; }
  .pv-grid-graficas { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .pv-card-grafica-grande { grid-column: 1 / -1; }
  .pv-card-grafica h3 {
    display: flex; align-items: center; gap: 8px; margin: 0 0 16px; font-size: var(--texto-m); font-weight: 600;
  }
  .pv-lienzo-wrap { position: relative; height: 280px; }
  .pv-card-grafica-grande .pv-lienzo-wrap { height: 320px; }
  @media (max-width: 640px) {
    .pv-grid-graficas { grid-template-columns: 1fr; }
    .pv-lienzo-wrap, .pv-card-grafica-grande .pv-lienzo-wrap { height: 240px; }
  }

  /* ========== Tarjeta de formulario con ícono de encabezado ========== */
  .form-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .form-card-icon {
    width: 40px; height: 40px; border-radius: var(--radio-xl); background: var(--color-accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: var(--texto-xl); flex-shrink: 0;
  }
  .form-card-header h3 { margin: 0; font-size: var(--texto-l); }
  .form-card-header p { margin: 1px 0 0; font-size: var(--texto-s); color: var(--color-text-muted); }

  /* ========== Lista de incidencias (tarjetas en vez de tabla plana) ========== */
  .incidencia-list { display: flex; flex-direction: column; gap: 8px; }
  .incidencia-item {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 16px; border: 1px solid var(--color-border); border-radius: var(--radio-xl);
    transition: background-color .2s ease, border-color .2s ease;
  }
  .incidencia-item:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .incidencia-icon {
    width: 38px; height: 38px; border-radius: var(--radio-l); background: var(--color-primary-soft);
    display: flex; align-items: center; justify-content: center; font-size: var(--texto-l); flex-shrink: 0;
  }
  .incidencia-main { flex: 1; min-width: 180px; }
  .incidencia-main-clickable { cursor: pointer; }
  .incidencia-main-clickable:hover .incidencia-folio { color: var(--color-accent-hover); }
  .incidencia-folio { font-weight: 700; font-size: var(--texto-m); }
  .incidencia-meta { font-size: var(--texto-s); color: var(--color-text-muted); margin-top: 2px; }
  .incidencia-fecha { font-size: var(--texto-s); color: var(--color-text-muted); min-width: 90px; text-align: right; }
  .badge-estado {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px; font-size: var(--texto-xs); font-weight: 600;
  }
  .badge-estado.abierta { background: #F3ECD6; color: var(--color-danger); }
  .badge-estado.cerrada { background: #e5f6ec; color: var(--color-success); }

  /* Estatus tal cual AppSheet (Caja Chica): sin fondo de pastilla, solo
     ícono + texto en mayúsculas/negritas/itálicas del color del estatus. */
  .estatus-appsheet {
    display: inline-flex; align-items: center; gap: 5px;
    font-weight: 700; font-style: italic; text-transform: uppercase; font-size: var(--texto-s);
  }
  .incidencia-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .incidencia-actions button { padding: 7px 10px; }

  /* ========== Lista de vehículos (mismo patrón visual que incidencias) ========== */
  .vehiculo-list { display: flex; flex-direction: column; gap: 8px; }
  .vehiculo-item {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 16px; border: 1px solid var(--color-border); border-radius: var(--radio-xl);
    transition: background-color .2s ease, border-color .2s ease;
  }
  .vehiculo-item:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .vehiculo-icon {
    width: 38px; height: 38px; border-radius: var(--radio-l); background: var(--color-primary-soft);
    display: flex; align-items: center; justify-content: center; font-size: var(--texto-l); flex-shrink: 0;
  }
  .vehiculo-main { flex: 1; min-width: 180px; }
  .vehiculo-main-clickable { cursor: pointer; }
  .vehiculo-main-clickable:hover .vehiculo-folio { color: var(--color-accent-hover); }
  .vehiculo-folio { font-weight: 700; font-size: var(--texto-m); }
  .vehiculo-meta { font-size: var(--texto-s); color: var(--color-text-muted); margin-top: 2px; }
  .vehiculo-placa { font-size: var(--texto-s); color: var(--color-text-muted); min-width: 80px; text-align: right; }
  .vehiculo-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .vehiculo-actions button { padding: 7px 10px; }

  .badge-estado.activo { background: #e5f6ec; color: var(--color-success); }
  .badge-estado.baja { background: #F3ECD6; color: var(--color-danger); }
  .badge-estado.pendiente { background: var(--color-primary-soft); color: var(--color-primary); }

  /* ========== "Sistemas" (accesos directos a otros sistemas, por módulo) ========== */
  .sistemas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  /* La tarjeta (<a>, se abre completa) y el botón de copiar van por fuera uno del otro
     (hermanos, no botón adentro de <a>: anidar elementos interactivos no es válido en
     HTML) -- el wrap es lo que les da la posición relativa/absoluta entre sí. */
  .sistema-card-wrap { position: relative; }
  .sistema-card {
    display: flex; align-items: center; gap: 14px; padding: 18px;
    border-radius: var(--radio-xl); background: var(--color-surface); border: 1px solid var(--color-border);
    box-shadow: var(--shadow); text-decoration: none; color: inherit;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .sistema-card:hover, .sistema-card:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--color-accent); }
  .sistema-card-copiar {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; padding: 0;
    display: flex; align-items: center; justify-content: center; border-radius: var(--radio-m);
    background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text-muted);
    box-shadow: var(--shadow);
  }
  .sistema-card-copiar:hover { background: var(--color-primary-soft); color: var(--color-primary); border-color: var(--color-primary); }
  .sistema-card-copiar .ico { width: 15px; height: 15px; }
  .sistema-card-icono {
    width: 52px; height: 52px; border-radius: var(--radio-2xl); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .sistema-card-icono .ico { width: 24px; height: 24px; }
  .sistema-card-texto { min-width: 0; }
  .sistema-card-texto h3 { margin: 0 0 4px; font-size: var(--texto-m); line-height: 1.3; color: var(--color-text); }
  .sistema-card-abrir { display: inline-flex; align-items: center; gap: 4px; font-size: var(--texto-s); font-weight: 600; color: var(--color-primary); }
  :root[data-theme="dark"] .sistema-card-abrir { color: var(--color-accent); }
  .sistema-card-abrir .ico { width: 13px; height: 13px; }
  .sistema-card:hover .sistema-card-abrir { text-decoration: underline; }

  /* ========== Historial en línea de tiempo (ej. Cambios/Reasignaciones
     enlazados en el detalle de Vehículos) — tarjetas compactas en vez de
     tabla plana, con un antes → después bien resaltado. ========== */
  .historial-timeline { display: flex; flex-direction: column; gap: 8px; position: relative; }
  .historial-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--color-border); border-radius: var(--radio-xl);
    transition: background-color .2s ease, border-color .2s ease;
  }
  .historial-item:hover { background: var(--color-bg); border-color: var(--color-accent); }
  .historial-icon {
    width: 32px; height: 32px; border-radius: var(--radio-m); background: var(--color-primary-soft); color: var(--color-primary);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .historial-icon .ico { width: 15px; height: 15px; }
  .historial-icon-accent { background: var(--color-accent-soft); color: var(--color-accent-hover); }
  .historial-main { flex: 1; min-width: 0; }
  .historial-campo { font-weight: 700; font-size: var(--texto-s); margin-bottom: 4px; }
  .historial-departamento { font-size: var(--texto-s); color: var(--color-text-muted); margin-top: 4px; }
  .historial-valores { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .historial-flecha { color: var(--color-text-muted); flex-shrink: 0; width: 13px; height: 13px; }
  .chip-valor {
    display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 3px 10px; border-radius: 999px; font-size: var(--texto-s); font-weight: 600;
  }
  .chip-antes { background: var(--color-bg); color: var(--color-text-muted); border: 1px solid var(--color-border); }
  .chip-despues { background: var(--color-accent-soft); color: var(--color-accent-hover); }
  .historial-meta { flex-shrink: 0; text-align: right; font-size: var(--texto-xs); color: var(--color-text-muted); min-width: 90px; }
  .historial-meta div:first-child { font-weight: 600; color: var(--color-text); margin-bottom: 2px; }

  /* ========== Etiquetas de clase + filtro ========== */
  .card-header-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px; margin-bottom: 12px;
  }
  /* ========== Tabla interactiva: buscador global + encabezado con
     orden/filtro por columna + paginación ========== */
  .tabla-buscar-global { width: auto; min-width: 220px; font-size: var(--texto-s); padding: 7px 10px; }

  th.th-interactivo { padding: 0; }
  .th-interactivo-label {
    display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none;
    padding: 8px 10px;
  }
  .th-interactivo-label .ico { width: .8em; height: .8em; opacity: .5; flex-shrink: 0; }
  th.th-interactivo.activo { color: var(--color-primary); }
  th.th-interactivo.activo .ico { opacity: 1; }

  .th-popover {
    position: absolute; z-index: 600; width: 220px;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radio-xl); box-shadow: var(--shadow-lg);
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .th-popover-titulo { font-weight: 700; font-size: var(--texto-s); }
  .th-popover-orden { display: flex; gap: 8px; }
  .th-popover-orden button { flex: 1; padding: 7px 0; font-size: var(--texto-s); }
  .th-popover-orden button.activo { background: var(--color-primary-soft); color: var(--color-primary); border-color: transparent; }
  .th-popover select, .th-popover input[type="text"] { font-size: var(--texto-s); padding: 7px 9px; }
  .th-popover-acciones { display: flex; gap: 8px; }
  .th-popover-acciones button { flex: 1; padding: 7px 0; font-size: var(--texto-s); white-space: nowrap; }

  /* Filtro de checklist (columnas con pocos valores distintos, ej. Estado,
     Estatus, Rol) — lista de los valores reales presentes en los datos,
     en vez del cuadro de texto genérico. */
  .th-popover-lista-acciones { display: flex; gap: 10px; }
  .th-popover-lista-acciones button {
    background: none; border: none; padding: 0; color: var(--color-primary);
    font-size: var(--texto-xs); font-weight: 600; cursor: pointer; text-decoration: underline;
  }
  .th-popover-lista {
    display: flex; flex-direction: column; gap: 2px;
    max-height: 190px; overflow-y: auto;
  }
  .th-popover-opcion {
    display: flex; align-items: center; gap: 8px; font-size: var(--texto-s);
    padding: 4px 2px; border-radius: var(--radio-s); cursor: pointer;
  }
  .th-popover-opcion:hover { background: var(--color-bg); }
  .th-popover-opcion input { width: auto; padding: 0; flex-shrink: 0; }
  .th-popover-opcion span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tabla-pie {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 10px; margin-top: 14px; font-size: var(--texto-s); color: var(--color-text-muted);
  }
  .tabla-pie-paginas { display: flex; align-items: center; gap: 8px; }
  .tabla-pie-paginas select { width: auto; font-size: var(--texto-s); padding: 6px 8px; }
  .tabla-pie-paginas button {
    background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border);
    padding: 6px 9px;
  }
  .tabla-pie-paginas button:disabled { opacity: .35; cursor: not-allowed; }
  .tabla-pie-paginas button:not(:disabled):hover { background: var(--color-bg); }

  .tag {
    display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px;
    font-size: var(--texto-xs); font-weight: 700; white-space: nowrap; letter-spacing: .2px;
  }
  .tag-navy { background: var(--color-primary-soft); color: var(--color-primary); }
  .tag-gold { background: var(--color-accent-soft); color: var(--color-accent-hover); }
  .tag-green { background: #e5f6ec; color: var(--color-success); }
  .tag-brown { background: #F3ECD6; color: var(--color-danger); }
  .tag-slate { background: var(--color-bg); color: var(--color-text-muted); border: 1px solid var(--color-border); }

  .empty-state { text-align: center; color: var(--color-text-muted); font-size: var(--texto-s); padding: 24px 0; }
  .file-actual { margin-top: 4px; font-size: var(--texto-s); }
  .file-actual a { color: var(--color-accent-hover); }

  /* Campos de captura en pesos (montos): "$" fijo a la izquierda del input,
     nada más visual — el valor sigue siendo un número normal por dentro. */
  .input-moneda-wrap { position: relative; }
  .input-moneda-wrap input { padding-left: 26px; }
  .input-moneda-wrap::before {
    content: '$'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--color-text-muted); font-weight: 700; font-size: var(--texto-s); pointer-events: none;
  }

  /* Recuadro para firmar con mouse/dedo (Arqueos) */
  .firma-pad-wrap { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .firma-pad {
    width: 100%; max-width: 500px; aspect-ratio: 500 / 170; height: auto;
    background: #fff; border: 1px dashed var(--color-border); border-radius: var(--radio-xl);
    cursor: crosshair; touch-action: none; /* evita que el navegador haga scroll al firmar en pantalla táctil */
  }
  .firma-pad-limpiar { padding: 6px 10px; font-size: var(--texto-s); }

  /* ========== Modal ========== */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(6,20,30,.5); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px;
  }
  .modal-card {
    width: 100%; max-width: 420px; background: var(--color-surface);
    border-radius: var(--radio-2xl); box-shadow: var(--shadow-lg); padding: 24px;
  }
  .modal-card-wide { max-width: 640px; }
  .modal-form-scroll { max-height: 62vh; overflow-y: auto; padding-right: 6px; margin-right: -6px; }

  .info-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 16px;
  }
  .info-item {
    padding: 8px 10px; border-radius: var(--radio-m); background: var(--color-bg);
  }
  .info-label {
    font-size: var(--texto-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: .3px;
    color: var(--color-text-muted); margin-bottom: 2px;
  }
  .info-value { font-size: var(--texto-s); font-weight: 500; word-break: break-word; }
  .info-vacio { color: var(--color-text-muted); font-weight: 400; }
  .info-section-title {
    grid-column: 1 / -1; font-size: var(--texto-s); font-weight: 700; color: var(--color-primary);
    text-transform: uppercase; letter-spacing: .4px; margin: 10px 0 -2px;
    padding-bottom: 6px; border-bottom: 1px solid var(--color-border);
  }
  .info-section-title:first-child { margin-top: 0; }
  /* Secciones plegables de la ficha (pestaña Datos de Vehículos): <details class="card ln-card ficha-seccion"> */
  .ficha-seccion > summary { list-style: none; cursor: pointer; }
  .ficha-seccion > summary::-webkit-details-marker { display: none; }
  .ficha-seccion > summary h3 { display: flex; align-items: center; gap: 8px; margin: 0; }
  .ficha-seccion > summary h3::after { content: '›'; margin-left: 8px; color: var(--color-text-muted); transform: rotate(90deg); transition: transform .15s; }
  .ficha-seccion:not([open]) > summary h3::after { transform: none; }
  .ficha-seccion[open] > summary { margin-bottom: 12px; }
  .ficha-ver-documentos { margin-left: auto; font-size: var(--texto-s); font-weight: 500; }
  /* En un formulario la línea del título no se pega a las etiquetas del primer renglón (el -2px es para la ficha) */
  .info-section-title:has(+ .field) { margin-bottom: 10px; }
  /* Ficha de datos (dos columnas) en celular: una, para que los valores largos no se corten */
  @media (max-width: 640px) {
    .info-grid { grid-template-columns: minmax(0, 1fr); }
  }

  /* Ver/Editar/Eliminar por fila en las tablas de solo lectura de una ficha
     (pestañas de Verificaciones/Inspecciones/Sensor/Hologramas/Incidencias dentro
     de la ficha de Vehículos) -- mismo trato visual que .dt-btn-fila de DataTable,
     pero sin depender de su ancestro .dt (esta tabla no es un DataTable). */
  .ficha-acciones-fila { display: inline-flex; gap: 2px; white-space: nowrap; }
  .ficha-btn-fila {
    display: inline-flex; align-items: center; background: transparent; border: none;
    padding: 5px 6px; border-radius: var(--radio-s); font-size: var(--texto-s); color: var(--color-text-muted);
  }
  .ficha-btn-fila:hover, .ficha-btn-fila:focus-visible { background: var(--color-primary-soft); color: var(--color-text); }
  .ficha-btn-fila.ficha-peligro:hover, .ficha-btn-fila.ficha-peligro:focus-visible { background: #F3ECD6; color: var(--color-danger); }
  :root[data-theme="dark"] .ficha-btn-fila.ficha-peligro:hover { background: rgba(255,138,128,.15); color: #ff8a80; }

  /* Mini-tablas de solo lectura dentro de una ficha (Verificaciones/Inspecciones/
     Sensor/Hologramas/Incidencias en Vehículos; Arqueos/Cambios de monto en Caja
     Chica) -- antes heredaban el <table> pelón de toda la app (tablaFicha en
     app.html); ahora con tarjeta redondeada, encabezado distinguible y renglones
     alternados, para que se lean de un vistazo en vez de verse una hoja de cálculo. */
  /* La tabla y el botón de acción viven en el componente TablaFicha (componentes/tabla-ficha.html) */

  .spinner {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
    border: 2.5px solid var(--color-border); border-top-color: var(--color-accent);
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ========== Notificación flotante: cargando → éxito/error ========== */
  #toast-container {
    position: fixed; top: 20px; right: 20px; z-index: 10000;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  }
  .toast {
    display: flex; align-items: center; gap: 11px;
    background: var(--color-surface); color: var(--color-text);
    border: 1px solid var(--color-border); border-left: 4px solid var(--color-border);
    border-radius: var(--radio-xl); box-shadow: var(--shadow-lg);
    padding: 13px 16px; min-width: 260px; max-width: 380px;
    pointer-events: none; font-size: var(--texto-s); font-weight: 500;
    transform: translateX(30px); opacity: 0;
    transition: transform .25s ease, opacity .25s ease;
  }
  /* pointer-events solo mientras se ve — el div del aviso NUNCA se quita del
     DOM (queda "escondido" nomás con opacity:0), y este rincón (arriba a la
     derecha) es el mismo donde vive "Cerrar sesión": sin esto, un aviso ya
     desvanecido se quedaba atrapando el clic invisible, como si el botón de
     cerrar sesión estuviera congelado. */
  .toast.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .toast-icon { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .toast-mensaje { flex: 1; line-height: 1.4; }
  .toast-exito { border-left-color: var(--color-success); }
  .toast-exito .toast-icon { color: var(--color-success); }
  .toast-error { border-left-color: var(--color-danger); }
  .toast-error .toast-icon { color: var(--color-danger); }
  .toast-cargando { border-left-color: var(--color-accent); }
  /* Celular: el aviso va a lo ancho (con su ancho mínimo de 260px más el margen se salía de la pantalla) */
  @media (max-width: 640px) {
    #toast-container { top: 10px; left: 10px; right: 10px; }
    .toast { min-width: 0; max-width: none; }
  }
  .loading-inline {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
    color: var(--color-text-muted); font-size: var(--texto-s); padding: 14px 4px;
  }

  /* ===== Transición corta al cambiar de módulo en el sidebar ===== */
  /* flex:1 + overflow-y:auto: esta es la única zona que hace scroll —
     sidebar y topbar quedan fijos (ver #app/#sidebar/#main arriba). */
  #view-container {
    position: relative; min-height: 240px;
    flex: 1; overflow-y: auto; padding: 0 32px 24px;
  }
  #view-container > * { animation: viewContentFadeIn .3s ease; }
  @keyframes viewContentFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .view-transition {
    position: absolute; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: var(--color-bg); opacity: 0; transition: opacity .28s ease; pointer-events: none;
    border-radius: var(--radio-xl);
  }
  .view-transition.show { opacity: 1; }
  .view-transition-icon { font-size: 38px; animation: viewIconPulse 1s ease-in-out infinite; }
  .view-transition-text {
    font-size: var(--texto-s); font-weight: 600; color: var(--color-text-muted);
    text-transform: uppercase; letter-spacing: .3px;
  }
  @keyframes viewIconPulse {
    0%, 100% { transform: scale(1); opacity: .8; }
    50% { transform: scale(1.18); opacity: 1; }
  }
  .modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  .modal-subtitle { margin: 2px 0 0; font-size: var(--texto-s); color: var(--color-text-muted); }
  .modal-close {
    background: transparent; color: var(--color-text-muted); border: none;
    width: 28px; height: 28px; border-radius: var(--radio-m); padding: 0; font-size: var(--texto-s);
  }
  .modal-close:hover { background: var(--color-bg); }

  /* Ventanas en celular — dos formas, según el tamaño que la ventana pide en escritorio:
     · .modal-card (chica: confirmar, avisos, una sola pregunta): hoja que sube desde abajo, a lo
       ancho, con su propio scroll si no cabe.
     · .modal-card-wide (captura o consulta de un registro): pantalla completa. El encabezado se
       queda arriba y solo desplaza el cuerpo (.modal-form-scroll); lo que va después (los botones
       de guardar) queda siempre a la vista abajo. Si el cuerpo no está directo en la ventana o en
       su <form>, desplaza la ventana entera: nunca queda contenido sin poder verse.
     Un módulo no necesita nada propio para esto: basta con usar estas clases. */
  @media (max-width: 640px) {
    .modal-backdrop { padding: 0; align-items: flex-end; }
    .modal-card {
      max-width: none; max-height: 92vh; max-height: 92dvh; overflow-y: auto;
      border-radius: var(--radio-2xl) var(--radio-2xl) 0 0; padding: 20px 16px 16px;
    }
    .modal-card-wide {
      height: 100vh; height: 100dvh; max-height: none; border-radius: 0;
      display: flex; flex-direction: column;
    }
    .modal-card-wide > .modal-header { flex: 0 0 auto; }
    .modal-card-wide > form { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    .modal-card-wide > .modal-form-scroll, .modal-card-wide > form > .modal-form-scroll {
      flex: 1 1 auto; min-height: 0; max-height: none; overflow-y: auto;
    }
    .modal-close { width: 40px; height: 40px; flex-shrink: 0; }
    .modal-close .ico { width: 18px; height: 18px; }
  }

  /* Insignia "Calificación" con barra de progreso — cabecera de los
     formularios que generan una calificación en vivo (Arqueo: 17
     reactivos de auditoría). Muestra cuántos puntos ya se calificaron,
     no el resultado final (ese sigue en su campo de solo lectura). */
  .calif-badge {
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    min-width: 168px; padding: 10px 14px; border-radius: var(--radio-xl);
    background: var(--color-primary-soft); border: 1px solid var(--color-border);
    flex-shrink: 0;
  }
  .calif-badge-titulo {
    font-size: var(--texto-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    color: var(--color-text-muted);
  }
  .calif-badge-valor { font-size: var(--texto-xl); font-weight: 700; color: var(--color-primary); line-height: 1; }
  .calif-badge-barra { width: 100%; height: 5px; border-radius: 999px; overflow: hidden; background: rgba(0,0,0,.08); }
  :root[data-theme="dark"] .calif-badge-barra { background: rgba(255,255,255,.12); }
  .calif-badge-barra-fill { height: 100%; border-radius: 999px; background: var(--color-primary); transition: width .2s ease; }
  .calif-badge-nota { font-size: var(--texto-xs); color: var(--color-text-muted); white-space: nowrap; }
  /* Celular: junto al título lo dejaba en una columna de 90px; baja a su propio renglón, a lo
     ancho (en una ventana, debajo del título y de la X). Las cabeceras la traen con margin en línea. */
  @media (max-width: 640px) {
    .form-card-header, .modal-header { flex-wrap: wrap; }
    /* El título se queda en el renglón del ícono (o de la X) y toma lo que sobra */
    .form-card-header > :not(.form-card-icon):not(.calif-badge),
    .modal-header > :not(.modal-close):not(.calif-badge) { flex: 1 1 0; min-width: 0; }
    .form-card-header > .calif-badge, .modal-header > .calif-badge {
      order: 3; flex: 1 1 100%; min-width: 0; margin-left: 0 !important; margin-right: 0 !important; align-items: stretch;
    }
  }

  /* ========== Login ========== */
  #login-screen {
    min-height: 100vh; min-height: 100dvh; width: 100%; position: relative; background: var(--color-bg);
    display: flex; flex-direction: column;
  }

  .theme-toggle {
    position: absolute; top: 20px; right: 20px; z-index: 10;
    display: flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,.9); border: 1px solid var(--color-border);
    border-radius: 999px; padding: 4px; box-shadow: var(--shadow);
  }
  :root[data-theme="dark"] .theme-toggle { background: rgba(18,35,45,.9); }
  .theme-toggle button {
    background: transparent; color: var(--color-text-muted);
    width: 30px; height: 30px; border-radius: 999px; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: var(--texto-m);
  }
  .theme-toggle button.active { background: var(--color-primary); color: #fff; }

  .login-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    flex: 1;
  }

  .login-hero { position: relative; overflow: hidden; }

  /* El fondo del login ya no es una sola imagen fija — es un slideshow
     entre varias fotos de marca (cada una con su propia variante clara/
     oscura), armado en JS (ver initLoginHeroSlideshow en app.html): dos
     capas apiladas que se van turnando la clase "login-hero-bg-visible"
     para un fundido cruzado. El degradado y la URL de cada capa los pone
     el JS directo en background-image (cambia según tema + slide actual),
     aquí solo queda la transición de opacidad. */
  .login-hero-bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    opacity: 0; transition: opacity 2s ease;
  }
  .login-hero-bg-visible { opacity: 1; }

  .login-hero-content {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 48px 56px;
  }

  .login-brand { display: flex; align-items: center; gap: 12px; }
  .login-brand-badge {
    width: 44px; height: 44px; border-radius: var(--radio-xl); background: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
    flex-shrink: 0;
  }
  .login-brand-badge img { width: 28px; height: 28px; }
  .login-brand-text { color: #fff; font-weight: 700; font-size: var(--texto-l); letter-spacing: 2px; }
  .login-brand-text span { display: block; color: var(--color-accent); font-size: var(--texto-xs); letter-spacing: 3px; font-weight: 500; margin-top: 1px; }

  .login-hero-body { max-width: 480px; }
  .login-hero-title {
    color: #fff; font-size: var(--texto-3xl); font-weight: 700; line-height: 1.25; margin: 0 0 12px;
  }
  .login-hero-sub { color: rgba(255,255,255,.75); font-size: var(--texto-m); line-height: 1.6; margin: 0; }

  .login-features {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .login-feature {
    background: rgba(255,255,255,.10); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.18); border-radius: var(--radio-xl);
    padding: 14px 8px; text-align: center; color: #fff;
  }
  .login-feature .icon { font-size: var(--texto-xl); margin-bottom: 6px; }
  .login-feature .label { font-size: var(--texto-xs); font-weight: 500; line-height: 1.3; color: rgba(255,255,255,.9); }

  .login-panel {
    display: flex; align-items: center; justify-content: center;
    background: var(--color-bg); padding: 32px;
  }
  .login-form-card {
    width: 100%; max-width: 380px; background: var(--color-surface);
    border-radius: var(--radio-2xl); box-shadow: var(--shadow-lg); padding: 36px 32px;
    border: 1px solid var(--color-border);
  }
  .login-icon-badge {
    width: 72px; height: 72px; border-radius: var(--radio-2xl); background: var(--color-badge-bg);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
    box-shadow: var(--shadow);
  }
  .login-icon-badge img { width: 42px; height: 42px; }

  .login-form-card h2 {
    text-align: center; font-size: var(--texto-m); font-weight: 500; color: var(--color-text-muted);
    margin: 0;
  }
  .login-form-card .login-system-name {
